        amount: 11.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://www.crave.ca/en/subscribe
      - region: CA
        currency: CAD
        amount: 119.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://www.crave.ca/en/subscribe
    addOnIds: [crave.starz]

  - id: crave.premium
    name: Premium
    link: https://www.crave.ca/en/subscribe
    features:
      video.quality: 4k
