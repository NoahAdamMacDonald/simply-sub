<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SimplySub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before the first paint. ThemeService (same storage key) takes over
      // once Angular starts.
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem('ss-theme');
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <ss-root></ss-root>
  </body>
</html>
