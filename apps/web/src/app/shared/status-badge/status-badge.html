<!-- Spaces go inside the spans: Angular drops the whitespace between them, and screen readers need it. -->
<span class="status" [attr.data-kind]="status().kind">
  <span class="dot" aria-hidden="true"></span>
  <span>{{ text() }}<ng-content /></span>
</span>
<!-- One badge for the renewal and the end together: "Renews Nov 12, then ends Nov 28" (M6.19). -->
@if (badge(); as badge) {
  <span class="badge">
    @if (badge.manual) {
      <mat-icon aria-hidden="true">autorenew</mat-icon>
    }
    {{ badge.text }}</span
  >
}
