<mat-menu aria-label="Add to list" class="ss-add-to-list">
  <p class="title" aria-hidden="true">Add to list</p>
  @for (list of lists(); track list.id) {
    <button mat-menu-item type="button" [attr.aria-label]="list.label" (click)="addTo(list.id)">
      <span>{{ list.name }}</span>
      <span> ({{ list.count }})</span>
    </button>
  }
  @if (lists().length) {
    <mat-divider />
  }
  <button mat-menu-item type="button" (click)="addTo('new')">
    <mat-icon aria-hidden="true">add</mat-icon>
    <span>New list…</span>
  </button>
</mat-menu>
