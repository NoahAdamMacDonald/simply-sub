<ss-price-range
  [range]="options().price"
  [min]="query().minPrice"
  [max]="query().maxPrice"
  [currency]="currency()"
  [country]="country()"
  (limitsChange)="choosePrice($event)"
/>

<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>Category</mat-label>
  <mat-select [value]="query().category ?? ''" (valueChange)="chooseCategory($event)">
    <mat-option value="">All</mat-option>
    @for (category of categories(); track category.id) {
      <mat-option [value]="category.id">{{ category.name }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<ss-feature-filter
  class="features"
  hint="Plans need every feature chosen"
  [keys]="options().keys"
  [features]="catalog().features"
  [categories]="catalog().categories.feature"
  [value]="query().features ?? []"
  (valueChange)="change({ features: [...$event] })"
/>

<ss-chip-choices
  class="activity"
  legend="Activity"
  [choices]="activityChoices"
  [value]="query().activity ?? []"
  (valueChange)="chooseActivity($event)"
/>

<div class="native">
  <mat-checkbox
    [checked]="query().nativeOnly ?? false"
    [aria-describedby]="id + '-native'"
    (change)="chooseNative($event.checked)"
  >
    Native pricing only
  </mat-checkbox>
  <p class="hint" [id]="id + '-native'">Hides prices in other currencies</p>
</div>

<div class="sold">
  <mat-checkbox
    [checked]="query().soldOnly ?? false"
    [aria-describedby]="id + '-sold'"
    (change)="chooseSold($event.checked)"
  >
    Sold in {{ countryName() }}
  </mat-checkbox>
  <p class="hint" [id]="id + '-sold'">Only plans priced for {{ countryName() }}</p>
</div>

<button
  matButton="outlined"
  type="button"
  class="clear"
  disabledInteractive
  [disabled]="!active()"
  (click)="clearAll()"
>
  Clear all
</button>
