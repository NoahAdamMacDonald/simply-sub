<mat-form-field appearance="outline" subscriptSizing="dynamic" class="sort">
  <mat-label>Sort by</mat-label>
  <mat-select [value]="state().sort" (valueChange)="set({ sort: $event })">
    @for (sort of sorts; track sort.value) {
      <mat-option [value]="sort.value">{{ sort.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<ss-price-range
  [range]="options().price"
  [min]="state().minPrice"
  [max]="state().maxPrice"
  [currency]="currency()"
  [country]="country()"
  (limitsChange)="choosePrice($event)"
/>

<ss-feature-filter
  class="features"
  [hint]="featuresHint()"
  [keys]="options().features"
  [features]="features()"
  [categories]="categories()"
  [value]="state().features"
  (valueChange)="set({ features: [...$event] })"
/>

<ss-chip-choices
  class="status"
  legend="Status"
  [choices]="statusChoices"
  [value]="state().activity"
  (valueChange)="chooseStatus($event)"
/>

<!-- There even with no tags in the list, saying where they come from. -->
@if (tagChoices().length > 0) {
  <ss-chip-choices
    class="tags"
    legend="Tags"
    [choices]="tagChoices()"
    [value]="state().tags"
    (valueChange)="set({ tags: [...$event] })"
  />
} @else {
  <div class="tags">
    <p class="label">Tags</p>
    <p class="hint">No subscription here has a tag yet: add them with ✎ Edit</p>
  </div>
}

<button
  matButton="outlined"
  type="button"
  class="clear"
  disabledInteractive
  [disabled]="count() === 0"
  (click)="clearAll()"
>
  Clear all
</button>
