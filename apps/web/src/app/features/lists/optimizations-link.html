<!-- The strongest's name goes in the link's own name: hidden words starting with a comma get a space before them. -->
<a
  matButton="outlined"
  class="link"
  [attr.data-strongest]="summary()?.strongest"
  [attr.aria-label]="label()"
  [class.compact]="compact()"
  [routerLink]="['/lists', listId(), 'optimize']"
>
  <!-- On its own in its @if, so the button puts it in its icon's place. -->
  @if (compact()) {
    <mat-icon>savings</mat-icon>
  }
  @if (compact()) {
    @if (summary(); as summary) {
      @if (summary.count > 0) {
        <span class="dot" aria-hidden="true"></span>{{ summary.count }}
      }
    }
  } @else if (summary(); as summary) {
    @if (summary.count > 0) {
      <span class="dot" aria-hidden="true"></span>
      View optimizations ({{ summary.count }})
    } @else {
      No suggestions
    }
  } @else {
    View optimizations
  }
</a>
