<!-- Escape cancels; Enter in a field submits the form, which saves. -->
<form [formRoot]="form" class="editor" (keydown.escape)="cancel()">
  <mat-form-field appearance="outline" class="name" subscriptSizing="dynamic">
    <mat-label>Name</mat-label>
    <input #nameInput matInput autocomplete="off" [formField]="form.name" />
    <mat-error>{{ firstError(form.name) }}</mat-error>
  </mat-form-field>
  <ss-tag-colours [color]="chosen()" (colorChange)="pick($event)" />
  <mat-form-field appearance="outline" class="hex" subscriptSizing="dynamic">
    <mat-label>Hex colour</mat-label>
    <input matInput autocomplete="off" spellcheck="false" [formField]="form.color" />
    <mat-hint>Any colour, as #rrggbb</mat-hint>
    <mat-error>{{ firstError(form.color) }}</mat-error>
  </mat-form-field>
  <div class="actions">
    <button matButton="filled" type="submit">Save</button>
    <button matButton type="button" (click)="cancel()">Cancel</button>
  </div>
</form>
