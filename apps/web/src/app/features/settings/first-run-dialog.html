<form [formRoot]="form">
  <h2 mat-dialog-title>Welcome to Simply Sub</h2>
  <mat-dialog-content>
    <ss-location-fields [fields]="form.location" />

    <div class="budgets">
      <mat-form-field appearance="outline">
        <mat-label>Monthly budget</mat-label>
        <input matInput type="number" step="any" [formField]="form.monthlyBudget" />
        <span matTextSuffix>{{ currency() }}</span>
        <mat-hint>Optional</mat-hint>
        <mat-error>{{ firstError('monthlyBudget') }}</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Annual budget</mat-label>
        <input matInput type="number" step="any" [formField]="form.annualBudget" />
        <span matTextSuffix>{{ currency() }}</span>
        <mat-hint>Optional</mat-hint>
        <mat-error>{{ firstError('annualBudget') }}</mat-error>
      </mat-form-field>
    </div>

    <p class="privacy">Your data stays in this browser. No account needed.</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <!-- Bring back a backup's settings and lists, or a synced copy's, instead, which ends the first run (P1). -->
    <div class="instead">
      <button matButton type="button" (click)="importBackup()">Import a backup instead</button>
      <button matButton type="button" (click)="joinSync()">Join with a sync code</button>
    </div>
    <button matButton="filled" type="submit">Get started</button>
  </mat-dialog-actions>
</form>
