# Required check for every pull request into main (BLUEPRINT §7.6, §7.7): lint, formatting, tests and the
# production build. Nothing is deployed from here; Workers Builds deploys main. data:validate joins in M1.4.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A read-only token. This uses pull_request (never pull_request_target), so PRs from forks get no secrets
# and can't write to the repo.
permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset on main requires this job by its id, so renaming it means updating the ruleset too.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: false
    steps:
      # Actions are pinned to commit SHAs, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # the "volta" pin
          cache: npm

      - name: Use npm 12.0.2 (the packageManager pin)
        run: npm install --global npm@12.0.2

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
