# The feature registry (BLUEPRINT §4.2). Plans list only ids from this file.
# Shapes: packages/core/src/catalog/feature.ts. Add a feature here, in its own commit, before a provider
# uses it (BLUEPRINT §13.4).

# ── Streaming ──────────────────────────────────────────────────────────────────
- id: video.quality
  name: Video quality
  category: streaming
  type: enum
  values:
    - { id: 480p, name: 480p (SD) }
    - { id: 720p, name: 720p (HD) }
    - { id: 1080p, name: 1080p (Full HD), headline: true }
    - { id: 4k, name: 4K (Ultra HD), aliases: [uhd, 2160p], headline: true }
  aliases: [resolution, picture quality]
- id: video.hdr
  name: HDR
  category: streaming
  type: boolean
  aliases: [dolby vision, hdr10]
- id: audio.dolby-atmos
  name: Dolby Atmos
  category: streaming
  type: boolean
  aliases: [spatial audio]
- id: streaming.ad-free
  name: Ad free
  category: streaming
  type: boolean
  aliases: [no ads, ad-free]
- id: streaming.concurrent-streams
  name: Simultaneous streams
