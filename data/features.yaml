  name: People included
  category: account
  type: number
  unit: people
  tiers:
    - { id: 2-5, name: 2 to 5 people, min: 2, max: 5 }
    - { id: 6+, name: 6 or more people, min: 6 }
  aliases: [family plan, duo plan, users, members]
- id: account.sign-in
  name: Sign-in methods
  category: account
  type: set
  values:
    - { id: password, name: Password }
    - { id: passkey, name: Passkeys }
    - { id: totp, name: Authenticator app codes, aliases: [totp, 2fa, two-factor, authenticator] }
