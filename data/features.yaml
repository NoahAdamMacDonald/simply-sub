- id: streaming.live
  name: Live TV and sports
  category: streaming
  type: set
  values:
    - { id: tv-channels, name: Live TV channels, aliases: [live tv, linear tv] }
    - { id: sports, name: Live sports, aliases: [sports streaming, live games] }
