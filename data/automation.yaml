# The automation's settings (BLUEPRINT §6.4, §7.7): how often the nightly bot (apps/bot) checks each kind of page and
# runs discovery, who reviews what it can't settle, how much it does a night, and the web searches it and this
# machine may make a month. The bot reads this file from main every night, so a change takes a merge, not a redeploy.
# Shapes: packages/core/src/pipeline/automation.ts.

cadence:
  pricing: daily
  policies: weekly
  logos: weekly
  discovery: weekly

# The weekly pull request of what changed, built on this day (UTC).
digest:
  day: monday

# scheduled-claude: a weekly Claude Code task (BLUEPRINT §7.2); if it isn't set up, items wait as with manual.
reviewer: scheduled-claude

batch:
  discovery: 3
  browserPages: 5
  neurons: 8000
  reviewItems: 10

# Tried in order, each until its monthly budget is spent. Tavily's free plan gives 1,000 searches a month (no card);
# Brave's $5 of monthly credit buys 1,000 and it bills the card past that, so its budgets stay under it; SearXNG is
# your own instance, with no limit. Keys go in .env and in the bot's secrets, never here.
search:
  - { engine: tavily, bot: 500, local: 500 }
  - { engine: brave, bot: 450, local: 450 }
  - { engine: searxng }

# Sites that turn bots away (the owner's choice of 2026-11-04, M11.15): the bot never reads their pages (or their
# robots.txt and icons). It compares the Internet Archive's newest copy of each with its baseline instead, so a changed
# page still reaches the weekly review, which reads the live page with the standard reader; prices there are confirmed
# only by that review, and a page read only from the archive for over 90 days goes to it too. A subdomain is included
# (help.openai.com). Amazon's stores (the owner's choice of 2026-11-09): their help pages answer the baseline reader with
# 403 and amazon.it with 503; primevideo.com and aboutamazon.com read as usual. Tidal (2026-11-09, M11.15): tidal.com and
# its help centre answer with 403, and tidal.com's pages show nothing even to a browser on an ordinary connection.
archived:
  [
    chatgpt.com,
    openai.com,
    amazon.ca,
    amazon.com,
    amazon.co.uk,
    amazon.com.au,
    amazon.de,
    amazon.es,
    amazon.fr,
    amazon.it,
    amazon.nl,
    tidal.com,
  ]
