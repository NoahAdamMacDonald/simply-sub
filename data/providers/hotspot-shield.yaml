    - topic: legal.disputes
      tier: bad
      reason: 'Disputes go to a private referee (arbitration), not a court, and you can’t join a class action. You can opt out only where a law gives you that right, by post within 30 days.'
      sources:
        - url: https://legal.hotspotshield.com/documents/terms_of_service
          quote: 'If you are a United States based customer or a customer in a jurisdiction where binding arbitration is permitted under applicable law, then you agree any complaint or dispute not informally resolved with Us (including Our service providers, affiliated entities, or Indemnified Parties) shall be resolved through binding arbitration'
        - url: https://legal.hotspotshield.com/documents/terms_of_service
          quote: 'You and Us agree that the U.S. Federal Arbitration Act governs the interpretation and enforcement of these Terms, and that you and Us are each waiving the right to a trial by jury and the right to participate in a class action.'
        - url: https://legal.hotspotshield.com/documents/terms_of_service
          quote: 'if you are a customer who resides in a jurisdiction where you have a legal right to opt out of arbitration in accordance with laws applicable to you – you may exercise your legal right to opt out.'
      lastVerified: 2026-11-19
