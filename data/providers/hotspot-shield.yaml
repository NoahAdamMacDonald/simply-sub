    - topic: billing.cancellation
      tier: neutral
      reason: 'You cancel online in your account, giving a reason, or by email. You must do it at least a day before it renews, and you keep Premium until the paid time ends.'
      sources:
        - url: https://secure.hotspotshield.com/
          quote: 'I understand I can cancel via my online account portal at any time, but must cancel at least one day before my next renewal to avoid being charged.'
        - url: https://support.hotspotshield.com/en/payments-subscriptions/manage-your-subscription/how-do-i-cancel-my-hotspot-shield-subscription
          quote: 'Please note that once you have canceled your Premium auto-renewal, your account will stay active until the current subscription expires.'
