    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use its sites and apps down to your clicks and typing, builds predictions about you for marketing, and buys more data from data brokers. You can limit tracking only in each browser or device.'
      sources:
        - url: https://www.nba.com/privacy-policy
          quote: 'for example, your clicks, keystrokes and typing patterns, cursor movements and page scrolls'
        - url: https://www.nba.com/privacy-policy
          quote: 'To build predictive models, which allow us to tailor our products and services based on the data we have about how our fans’ use our products and services, as well as to tailor our marketing and advertising campaigns.'
        - url: https://www.nba.com/privacy-policy
          quote: 'We also obtain your personal data from other sources, including our affiliates, our partners, our customers, our vendors, third-party online services, social media platforms, data brokers, and public sources.'
      action:
        name: 'Its privacy policy'
        url: https://www.nba.com/privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It gives your information to the NBA’s teams and business partners for their own advertising and marketing. Only people in some places can opt out.'
      sources:
        - url: https://www.nba.com/privacy-policy
          quote: 'As described in the How We Disclose Personal Data section, we also may disclose your personal data to others within the NBA Family and our business partners for their own advertising and marketing purposes.'
        - url: https://www.nba.com/privacy-policy
          quote: 'Depending on where you reside, you may have the right to opt out of the sale of your personal data or sharing or processing of your personal data for targeted advertising.'
      action:
        name: 'Your choices and rights (its privacy policy)'
        url: https://www.nba.com/privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
