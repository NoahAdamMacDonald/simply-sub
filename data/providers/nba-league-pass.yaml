# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch from Canada: the League Pass Terms of Use for
# subscribers outside the US ("SUBSCRIBER AGREEMENT FOR NBA LEAGUE PASS AND NBA TV", "Last Updated: October 2023") and
# the US's Subscriber Agreement ("Last Updated: June 2023"), the same clauses but for the operators, the taxes and a
# US-dollar clause (both rated as one, the worse wording where they differ); NBA.com's Terms of Use, which both include
# (arbitration in section 17, class action waiver in section 18, New York law); its Privacy Policy ("Last Updated: April
# 2026") with its EEA/UK Privacy Statement (rated for the UK, Ireland and the euro countries) and its California
# statement (no grade changes); the NBA ID sign-in page (nba.com/account/sign-in, in Edge), whose first step asks only
# for an email address, so its later fields stay unread; and its help centre's renewal, cancelling, pause, downloads,
# plan change and privacy articles. Not read: the cookie policy, the privacy portal (privacy.nba.com, a OneTrust form),
# the app stores', Amazon's and the partners' terms. NBA.com's terms take a perpetual, irrevocable licence to anything
# you post (legal.content-rights isn't a streaming topic). Calibrated against NFL+, DAZN, Sportsnet+ and BritBox.
