          quote: 'You may see our ads on other websites or apps because we use third-party advertising services on our Online Services.'
        - url: https://www.nba.com/privacy-policy
          quote: 'If you use the GPC, we will process your request for your browser, but it will not apply outside of that browser to your device.'
