# Researched by hand on 2026-11-13 (M11.15, streaming batch 8), read with Edge from Canada; its packages page
# (nba.com/league-pass-purchase, where nba.com/watch/league-pass-stream leads) again through a US, a UK, an Irish, an
# Australian, a New Zealand, a German, a French, a Dutch, a Spanish and an Italian exit, in Edge (its Season and Monthly
# tabs) and with a plain fetch (its page data); its help centre (support.watch.nba.com, all 111 articles) through its
# Zendesk API; its legal pages with a plain fetch. Pages, each quoted where it's used:
# Pricing: the packages page prices by where the visitor is, and its data names the country and currency for each read
# ("xLpPackageCountry":"CA" with "currency":"CAD", "US" with "USD", "GB" with "GBP", "AU" with "AUD", "NZ" with "NZD",
# and each euro country with "EUR"). Canada's cards: League Pass Premium "$184.99 / SEASON" or "$27.99 / MO", League
# Pass "$129.99 / SEASON" or "$19.99 / MO", and Team Pass "$17.99 / month" (More Plans); the others' are in the plans
# below, each the card's own price, with no first-term offer (the student, GovX and promo-code discounts are offers).
# Its renewal policy: "Season-Long League Pass subscriptions will automatically renew at the full season price before
# the beginning of every season." and "Monthly League Pass subscriptions will be automatically renewed every 30 days."
# (League Pass Renewal Policy), so a season is a yearly price that renews on its own (bought once a season, "PREPAY AND
# SAVE", from 10/20/2026 to 10/03/2027 in Canada's page data), and its months are priced every 30 days, as SoundCloud's.
# Taxes: the US's fees "shall be exclusive of U.S. state and local sales taxes" (Subscriber Agreement), and elsewhere
# "the Fees shall be inclusive of value-added taxes and any other indirect taxes. As it relates to Canada, the Fees
# shall be exclusive of applicable Canadian sales taxes." (League Pass Terms of Use, outside the US): no taxIncluded,
# since the packages page doesn't say so and tax is added only in Canada and the US.
# Region checklist for CA, US, GB, IE, AU, NZ, DE, FR, NL, ES and IT, 2026-11-13: 1. no country paths (one packages
# page); 2. no picker; 3. the page data names each read's country and currency; 4. the checkout (watch.nba.com/secure)
# answered "Access Denied", so it wasn't reached; 5. its help centre's availability, renewal and blackout articles; 6.
# Edge from here and through each country's exit, and a plain fetch through each; 7. no bill offered.
# Not listed: League Pass Audio (US, "$9.99", a season's live radio broadcasts that "does not automatically renew":
# audio only, with no video for the streaming category's required features, left for the owner); NBA Single Game (one
# game at a time, in the apps only); Commercial League Pass (for businesses); the US's 12-month gift (a prepaid gift of
# the plan); the teams' own in-market services (BlazerVision, ClipperVision, Jazz+, Kings+, MavsTV+, Pelicans+, Suns+,
# Thunder+, Bucks+, Lakers Spectrum SportsNet+).
# Bundles: none sold by the NBA. Official resellers: none. Partners that bill it themselves: Amazon's Prime Video
# Channels ("NBA League Pass through Amazon Prime Subscriptions is available to purchase in the following countries",
# every research region among them), the app stores, Roku, Samsung and Vizio TVs, US TV providers (AT&T U-Verse, Blue
# Ridge, Comcast Xfinity, Cox | Spectrum and others, US TV Provider Partners), and phone and TV companies abroad (Orange
# and Bouygues in France, MTN, Vodacom, Safaricom and Cell C in Africa, Vivo and Terra in Brazil, Totalplay, Izzi and
# Megacable in Mexico).
# Features, read 2026-11-13: the cards (the same in every country read): League Pass "With commercials", "1 device",
# "Download to Watch Offline: Not included", "Multiview: Up to 4 games at once"; Premium "No commercials. In-arena
# streams during breaks.", "Up to 3 devices", downloads "Included" (on phones and tablets, no number of devices, so 1,
# inferred); Team Pass: "Stream games on one device at a time", one team's games (NBA Team Pass). Video quality: "The
# NBA app supports video quality of 1080p/60fps." (its Chromecast and Roku articles). League Pass includes NBA TV ("NBA
# TV is included with an NBA League Pass or NBA League Pass Premium subscription", NBA TV), a 24-hour live channel; NBA
# TV alone is sold in the US only. Blackouts: "Blackouts apply in the United States and Canada while every NBA game is
# available live with League Pass in other countries." (League Pass Blackout Guide). What it streams: NBA games, NBA
# TV's "news, analysis, and highlights" and "classic thematic programming"; none of your own media. Broadcasts: "There
# are also broadcasts in other languages including Spanish and Portuguese" (the packages page's FAQ).
# Pause: monthly plans bought on NBA.com ("you can pause your subscription whenever you need a break", Pausing a League
# Pass Subscription); seasons can't. Parental controls: none on any page read.
# Free use: "Fans can watch hundreds of full Classic Games and other original NBA content for free by signing in with an
# NBA ID." (Classic Games and Original NBA Content), a free plan below.

# Coverage: nba-league-pass.nba-tv in CA, GB, IE, AU, NZ, DE, FR, NL, ES and IT: NBA TV alone is sold in the US only
# ("Fans in the U.S. can purchase an NBA TV subscription without buying NBA League Pass.", NBA TV; its card is "US Only"
# in the packages page's data); elsewhere it comes with League Pass.

id: nba-league-pass
name: NBA League Pass
website: https://www.nba.com/watch/league-pass-stream
category: streaming
spendCategory: streaming
# Where it's sold: "League Pass is not available in Belarus, China, Cuba, Iran, North Korea, Russia, Syria, and Ukraine
# (Crimea, Donetsk People’s Republic, and Luhansk People’s Republic)." (Global NBA League Pass Availability), and Team
# Pass not in India either (NBA Team Pass): a list of where it isn't, so no availableIn; every research region is
# priced.
# GLOBAL: the free plan's currency, and the US dollars its terms may collect in elsewhere ("We reserve the right to
# collect Fees in U.S. Dollars").
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help centre's cancelling article ("My Account > Manage Plan, next to Subscription").
cancelUrl: https://support.watch.nba.com/hc/en-us/articles/115000590674-Cancelling-your-NBA-League-Pass
sources: { pricing: https://www.nba.com/league-pass-purchase }
# Owner (M11.2), read 2026-11-13: its terms (outside the US) say NBA Media Ventures, LLC runs it through the National
# Basketball Association's site; the US's Subscriber Agreement names NBA Media Ventures "WITH TURNER DIGITAL BASKETBALL
# SERVICES, INC." and NBA Digital Services US LLC. The NBA isn't a listed company: no shares.
owner:
  name: National Basketball Association (NBA Media Ventures, LLC)
  page:
    name: League Pass Terms of Use (Outside USA)
    url: https://www.nba.com/league-pass-termsofuse-outside-us
  quotes:
    - 'NBA LEAGUE PASS AND NBA TV (EACH, A “Service”) ARE VIDEO PROGRAMMING SERVICES OPERATED BY NBA MEDIA VENTURES, LLC (“NBAMV”) AND ITS AFFILIATES'
    - 'THESE SERVICES ARE PROVIDED THROUGH THE OFFICIAL INTERNET WEB SITE OF THE NATIONAL BASKETBALL ASSOCIATION (“NBA”)'
  country:
    code: US
    page:
      name: NBA Privacy Policy
      url: https://www.nba.com/privacy-policy
    quotes:
      - 'By writing to us at 645 Fifth Avenue, New York, NY 10022, Attn: NBA Fan Relations;'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: its terms (a card or PayPal), its purchasing article (the app stores) and its
# Amazon article (Prime Video Channels); in the US, also US TV providers (US TV Provider Partners). No page names the
# card networks, and the checkout couldn't be reached. Its terms reserve "the right to collect Fees in U.S. Dollars"
# outside the US. Abroad, Orange, Bouygues and other phone companies bill it too, in words the catalog's checks don't
# read as a phone bill.
paymentMethods:
  - methods: [card, paypal]
    page: League Pass Terms of Use (Outside USA)
    url: https://www.nba.com/league-pass-termsofuse-outside-us
    quotes:
      - 'You may only receive a Service if you are a subscriber to the applicable Service in good standing with a valid, authorized payment method (e.g., credit card or PayPal account) on file with Us.'
  - methods: [app-store]
    page: Purchasing NBA League Pass
    url: https://support.watch.nba.com/hc/en-us/articles/115000585813-Purchasing-NBA-League-Pass
    quotes:
      - 'NBA League Pass is also available as an in-app purchase in the NBA App through the Apple App Store, Google Play Store, and Amazon App Store on mobile phones and tablets.'
  - methods: [app-store]
    page: League Pass with Amazon Prime
    url: https://support.watch.nba.com/hc/en-us/articles/34813181782679-League-Pass-with-Amazon-Prime
    quotes:
      - 'fans in select countries have the option to purchase NBA League Pass through Amazon Prime Subscriptions'
  - methods: [card, paypal]
    regions: [US]
    page: Subscriber Agreement
    url: https://www.nba.com/subscriberagreement
    quotes:
      - 'You may only receive a Service if you are a subscriber to the applicable Service in good standing with a valid, authorized payment method (e.g., credit card or PayPal account) on file with Us.'
  - methods: [app-store]
    regions: [US]
    page: Purchasing NBA League Pass
    url: https://support.watch.nba.com/hc/en-us/articles/115000585813-Purchasing-NBA-League-Pass
    quotes:
      - 'NBA League Pass is also available as an in-app purchase in the NBA App through the Apple App Store, Google Play Store, and Amazon App Store on mobile phones and tablets.'
  - methods: [app-store]
    regions: [US]
    page: League Pass with Amazon Prime
    url: https://support.watch.nba.com/hc/en-us/articles/34813181782679-League-Pass-with-Amazon-Prime
    quotes:
      - 'fans in select countries have the option to purchase NBA League Pass through Amazon Prime Subscriptions'
  - methods: [provider-billing]
    regions: [US]
    page: US TV Provider Partners
    url: https://support.watch.nba.com/hc/en-us/articles/16847553816087-US-TV-Provider-Partners
    quotes:
      - 'NBA League Pass is available for purchase through participating U.S. TV providers.'
# Renewal day (M11.5): its renewal policy renews monthly subscriptions every 30 days (seasons "before the beginning of
# every season").
renewalAnchor:
  kind: every-30-days
  page: League Pass Renewal Policy
  url: https://support.watch.nba.com/hc/en-us/articles/360055657714-League-Pass-Renewal-Policy
  quotes:
    - 'Monthly League Pass subscriptions will be automatically renewed every 30 days.'
  lastVerified: 2026-11-13

# General features, read 2026-11-13. Platforms: the NBA App on iPhone, iPad, Android phones and tablets, Chromecast,
# Roku, Apple TV, Android TV, Fire TV, Hisense, Comcast, Xumo, Samsung and Vizio TVs, PlayStation and Xbox, and Apple
# Vision Pro, Meta Quest and Samsung XR, and NBA.com on a computer (Supported Devices & Requirements). Sign-in: an NBA
# ID's email and password ("Enter your email and password and tap ‘Sign In’", Logging in to your NBA ID on the NBA App);
# a TV provider's sign-in is only for those it bills. App languages: its help centre's language versions (English,
# German, Spanish, French, Italian, Japanese, Korean, Portuguese and Chinese, with Thai and Turkish, which the registry
# lacks; DAZN's precedent). Audio: home and away broadcasts, and "broadcasts in other languages including Spanish and
# Portuguese" (the packages page). Support: its request form and live chat ("whether through our request form or via
# live chat", Additional Help), WhatsApp messaging, and phone in the US only ("We do not offer phone support for fans
# outside of the United States at this time.", US Phone Support).
features:
  platforms: [web, ios, android, tv, console]
  account.sign-in: [password]
  languages.interface: [en, de, es, fr, it, ja, ko, pt, zh]
  languages.audio: [en, es, pt]
  support.channels: [email, chat]

