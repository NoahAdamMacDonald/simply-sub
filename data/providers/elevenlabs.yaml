# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2: AI audio), read with Edge from Canada (its pricing
# page in its Monthly and Yearly views with every FAQ answer opened, each comparison tab's text and the ticks from
# screenshots, its sign-up, mobile app, Studio, About, Safety and Trust Center pages, its Terms of Service for outside
# and inside the EEA, Service-Specific, ElevenCreative and Music Terms, Prohibited Use Policy and Privacy Policy) and its
# help centre, which moved into its documentation (elevenlabs.io/docs/help-center), with a plain fetch. Pages, each
# quoted where it's used:
# Pricing: elevenlabs.io/pricing: Free "$0", Starter "Then $6 per month", Creator "Then $22 per month", Pro "$99" "/mo"
# (the FAQ: "Monthly price and included credits per plan: Free $0 (10,000 credits); Starter $6 (30,000 credits); Creator
# $22 (121,000 credits, $11 for the first month); Pro $99 (600,000 credits)"). A year is ten months: "Annual billing works
# out to two months free — you pay for 10 months (annual price = monthly price × 10)." ($60, $220 and $990; the Yearly
# view shows "$5", "$18.33/mo" and "$82.50/mo"). One US-dollar list for everyone but India: "Customers in all other
# countries will continue to be charged in USD." (Can I pay for my ElevenLabs subscription in INR?), so GLOBAL; read
# 2026-11-17 through a UK, a German and a Canadian exit too, each showing the same US-dollar prices. "Prices exclude all
# taxes, levies and duties." Offers left out (notes only): "Get your first month for only $1" (Starter, then $6), Creator's
# "$11 first month", and Black Friday's first-year prices on Creator and Pro ("$8.25 /mo first year", "$37.13").
# Region checklist for CA, 2026-11-17: 1. no country paths; 2. its currency selector names US Dollar and Indian Rupee
# only; 3. the page's own data names USD ("priceCurrency":"USD"); 4. checkout needs an account; 5. the INR article says
# everyone else pays USD; 6. Edge from Canada and through a Canadian exit; 7. no bill offered.
# Plans: Free, Starter, Creator and Pro. Scale ($299, "3 Workspace seats") and Business ($990, "10 Workspace seats") are
# under "For Businesses", and Enterprise is sold by its team: out (business and per-seat). Not listed: pay-as-you-go
# credits and usage-based billing (usage-billed, out), and ElevenReader, an app with terms of its own (notes.md).
# Bundles: none on its pages. Official resellers: its terms speak of "an authorized ElevenLabs reseller or partner", but
# no page names one that sells its individual plans.
# Logo: elevenlabs.io's own icon is the source for data:icons.

