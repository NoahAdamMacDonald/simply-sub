# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge: the sign-up page's line ("I
# agree to the Terms of Service, and acknowledge ElevenLabs’ Privacy Policy"); its Terms of Service (non-EEA, last
# updated 09 October 2026) and the EEA, Swiss and UK version, which include its Service-Specific Terms (ElevenCreative
# and Music read: commercial rights by plan, community sharing; no topic graded worse), its Prohibited Use Policy (its
# sections are collapsed; the parts shown held no topic) and supplemental terms for the Voice Library, beta services,
# the Music Marketplace and ElevenReader (not read: they apply only when you use those); its Privacy Policy (updated 9
# October 2026), its Trust Center and its help centre's billing, account, training and voice cloning articles.
policies:
  links:
    - name: Terms of service
      url: https://elevenlabs.io/terms-of-use
    - name: Terms of service (EEA, Switzerland and UK)
      url: https://elevenlabs.io/terms-of-use-eu
    - name: Privacy policy
      url: https://elevenlabs.io/privacy-policy
    - name: Pricing
      url: https://elevenlabs.io/pricing
    - name: Sign-up page
      url: https://elevenlabs.io/app/sign-up
    - name: Trust Center
      url: https://compliance.elevenlabs.io/
    - name: Refund policy
      url: https://elevenlabs.io/docs/help-center/account/cancellation-refunds/what-is-your-refund-policy
