      url: https://elevenlabs.io/docs/help-center/account/general/what-happens-to-my-credits-when-i-upgrade-or-downgrade-my-subscription
    - name: Content after a subscription ends
      url: https://elevenlabs.io/docs/help-center/account/general/what-happens-to-my-content-after-my-subscription-ends
    - name: AI training settings
      url: https://elevenlabs.io/docs/help-center/legal/is-my-data-used-to-improve-eleven-labs-ai-models
    - name: Deleting your account
      url: https://elevenlabs.io/docs/help-center/account/general/how-can-i-delete-my-account
    - name: Downloading files
      url: https://elevenlabs.io/docs/help-center/product/core-capabilities/text-to-speech/how-do-i-download-generated-files-from-text-to-speech
    - name: Exporting voice clones
      url: https://elevenlabs.io/docs/help-center/product/voices/voice-cloning/can-i-export-my-voice-clones
    - name: Workspace members
      url: https://elevenlabs.io/docs/help-center/account/workspaces/can-i-add-users-to-my-account
    - name: Signing in with GitHub or Facebook
      url: https://elevenlabs.io/docs/help-center/account/general/can-i-still-log-in-using-github-or-facebook
    - name: Cloning someone else’s voice
      url: https://elevenlabs.io/docs/help-center/product/voices/voice-cloning/can-i-create-a-professional-voice-clone-of-someone-elses-voice
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online whenever you like, and you keep your plan until the end of the time you paid for.'
      sources:
        - url: https://elevenlabs.io/pricing
          quote: 'You can cancel your subscription at any time. Your subscription will remain active until the end of your current billing cycle, after which it will not renew and your account will be downgraded to the Free plan.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: good
      reason: 'You can get your money back if you ask within 14 days of a payment and haven’t used any credits since.'
      sources:
        - url: https://elevenlabs.io/docs/help-center/account/cancellation-refunds/what-is-your-refund-policy
          quote: 'You are eligible for a refund if a request is filed within 14 days of payment and no credit quota was used in the period for which you are seeking the refund.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: poor
      reason: 'It can raise prices just by posting them, though not for time you’ve paid for. To avoid the new price you must cancel at least 7 days before it starts.'
      sources:
        - url: https://elevenlabs.io/terms-of-use
          quote: 'ElevenLabs may change the prices charged for Recurring Subscriptions at any time by posting updated pricing through the Services; provided, however, that the prices for your Recurring Subscription will remain in force for the duration of the subscription period for which you have paid.'
        - url: https://elevenlabs.io/terms-of-use
          quote: 'If you do not agree to these price changes, you must cancel your Recurring Subscription at least 7 days before the changes take effect.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      regions: [GB, IE, FR, NL, ES, IT]
      tier: good
      reason: 'In the UK and the EU outside Germany it tells you at least 30 days before a new price, and you can cancel first.'
      sources:
        - url: https://elevenlabs.io/terms-of-use-eu
          quote: 'If you purchased your Recurring Subscription directly from us, we will give you at least 30 days’ notice of any price changes; if you do not want to continue your Recurring Subscription at the new price, you can cancel your Recurring Subscription before the start of the next subscription period.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      tier: neutral
      reason: 'Its first-month offer turns into the regular price unless you cancel, which you can do at any time.'
      sources:
        - url: https://elevenlabs.io/pricing
          quote: 'Get your first month for only $1'
        - url: https://elevenlabs.io/pricing
          quote: 'You can cancel your subscription at any time.'
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own, but not that it reminds you first.'
      pages: [https://elevenlabs.io/terms-of-use]
      lastVerified: 2026-11-17
    - topic: billing.fees
      tier: neutral
      reason: 'If you turn on usage-based billing, using more than your plan’s credits costs extra, at rates shown when you subscribe.'
      sources:
        - url: https://elevenlabs.io/terms-of-use
          quote: 'In the event your usage exceeds the volume provided under your Recurring Subscription, you will be charged usage overage fees for your Recurring Subscription, as indicated to you upon subscribing.'
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up starts at once with a new billing period, and your unused credits come with you. Moving down waits until your period ends, and unused credits are lost.'
      sources:
        - url: https://elevenlabs.io/docs/help-center/account/general/what-happens-to-my-credits-when-i-upgrade-or-downgrade-my-subscription
          quote: 'If you upgrade your subscription in the middle of an ongoing subscription cycle, you will pay the fee for your new subscription plan, and begin a new billing cycle. Any unused credits from your previous plan will be added to your new credit quota.'
        - url: https://elevenlabs.io/docs/help-center/account/general/what-happens-to-my-credits-when-i-upgrade-or-downgrade-my-subscription
          quote: 'If you downgrade or cancel your plan, this will not take effect until the end of your current subscription cycle, and you will lose any unused credits on your account when this happens.'
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: poor
      reason: "Disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only within 30 days of accepting its terms, by email or letter."
      sources:
        - url: https://elevenlabs.io/terms-of-use
          quote: 'You and ElevenLabs agree that arbitration will be solely on an individual basis and not as a class arbitration, class action, or any other kind of representative proceeding.'
        - url: https://elevenlabs.io/terms-of-use
          quote: 'You have the right to opt out of binding arbitration within 30 days of the date you first accepted these Terms by providing us with notice of your decision to opt-out via email or by certified mail to the applicable address set out below.'
      action:
        name: 'How to opt out of arbitration (section 12(c))'
        url: https://elevenlabs.io/terms-of-use
      lastVerified: 2026-11-17
    - topic: legal.disputes
      regions: [EU, GB]
      tier: great
      reason: 'In the EU and the UK you can take it to court in your own country, under your country’s law.'
      sources:
        - url: https://elevenlabs.io/terms-of-use-eu
          quote: 'If a claim or dispute arises out of or relates to your use of the Services as a consumer, both you and us agree that you may resolve your individual claim or dispute against us, and we may resolve our claim or dispute against you, in any competent court in the country of your main residence that has jurisdiction over your claim or dispute, and the laws of that country will apply.'
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: poor
      reason: 'New terms can apply at once, and it may tell you only by changing the date at the top; using it afterwards means you accept them.'
      sources:
        - url: https://elevenlabs.io/terms-of-use
          quote: 'If we make future changes, we may provide you with notice of those changes by any reasonable means, such as by sending an email, providing a notice through our Services, or updating the date at the top of these Terms.'
        - url: https://elevenlabs.io/terms-of-use
          quote: 'Unless we say otherwise in our notice, the amended Terms will be effective immediately, and your continued use of our Services after we provide such notice will confirm your acceptance of the changes.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: bad
      reason: 'It may refuse you any service without warning, and if your account is closed you lose your unused credits; sales are final.'
      sources:
        - url: https://elevenlabs.io/terms-of-use
          quote: 'ElevenLabs reserves the right, including without prior notice to impose conditions on the honoring of any coupon, discount, or similar promotion; to bar any user from making any transaction; to alter the payment option for services; and to refuse to provide any user with any Service.'
        - url: https://elevenlabs.io/terms-of-use
          quote: 'If your account is closed or terminated, you will forfeit all unused credits related to our Services (including character credits) associated with your account.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: poor
      reason: 'What you upload, your voice included, comes with a licence that never ends, to run and improve ElevenLabs and build new products. It won’t sell your voice on its own without asking.'
      sources:
        - url: https://elevenlabs.io/terms-of-use
          quote: 'You hereby grant to ElevenLabs a license to use, reproduce, modify, adapt, publish, translate, create derivative works from, distribute, publicly or otherwise perform and display, and use your Content to provide the Services (including the trust and safety features therein), to improve the Services, and to develop new services and products.'
        - url: https://elevenlabs.io/terms-of-use
          quote: 'perpetual and irrevocable (which means this license cannot be withdrawn),'
        - url: https://elevenlabs.io/terms-of-use
          quote: 'Notwithstanding the foregoing, we will not commercialize your voice on a standalone basis without your permission to do so.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: neutral
      reason: 'What it makes for you is yours, and paid plans may use it commercially, even after cancelling, but ElevenLabs’ licence lets it use it too.'
      sources:
        - url: https://elevenlabs.io/terms-of-use
          quote: 'Except as expressly set forth herein, as between you and ElevenLabs, you retain all rights in and to your Output.'
        - url: https://elevenlabs.io/docs/help-center/account/general/what-happens-to-my-content-after-my-subscription-ends
          quote: 'Once your subscription ends, you will still have a commercial license to use whatever you generated during that subscription forever.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      plans: [elevenlabs.free]
      tier: poor
      reason: 'On the free plan what you make is yours, but you may use it only for non-commercial purposes, always crediting ElevenLabs.'
      sources:
        - url: https://elevenlabs.io/terms-of-use
          quote: 'if you access or use our Services free of charge (such a user, a “Free User”), you may only use the Services for non-commercial purposes'
        - url: https://elevenlabs.io/docs/help-center/account/general/what-happens-to-my-content-after-my-subscription-ends
          quote: 'However, audio generated outside of a subscription will always require attribution.'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change, limit or stop any part of its services at any time, without notice, and owes you nothing for it.'
