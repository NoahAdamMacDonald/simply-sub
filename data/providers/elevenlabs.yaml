# AI features (the AI category's registry) and the creative category's, read 2026-11-17 in its pricing cards, its
# comparison tabs (Music, Image & Video and Voices from screenshots), its Studio page, its terms and its help centre:
# - AI assistant on every plan: Studio's agent ("Studio Agent: Your AI co-editor", "Describe your idea, and watch Studio
#   agent bring it to life."), and Studio is on every plan (Free's "3 Projects in Studio").
# - Music and voice generation on every plan: Text to Speech, Music, Sound Effects and Voice Design on Free's card; voice
#   cloning from Starter (perks).
# - Image generation on every plan (Free's "Up to 40 images"), video generation from Starter (Free's videos are ✗).
# - API with the plan's credits on every plan: "All products draw from one shared monthly credit pool", the API among
#   them ("discounted pricing applies for API usage, costing between 0.5 and 1 credit per character"; "third-party
#   services can call the ElevenLabs API and generate speech with the voices in your account", Can I export my voice
#   clones?).
# - Creative tools on every plan: audio and video editing in Studio ("Turn Ideas into Content with an AI Audio Editor",
#   its terms' "timeline-based editing interface" for "professional audio and video content"). Watermark-free image and
#   video export from Creator (the Image & Video tab's ticks); the highest resolution 720p on Starter, 1080p on Creator
#   and 4K on Pro (its "Max resolution" row; Free makes no video).
# - Generative credits a month: "Free $0 (10,000 credits); Starter $6 (30,000 credits); Creator $22 (121,000 credits"
#   and "Pro $99 (600,000 credits)" (its pricing page), one pool for every product.
# - Not offered to these plans: web search, voice conversations with an assistant (ElevenAgents builds agents for
#   businesses), memory, projects, reasoning, a browser agent, code completion, early access. Models from other companies:
#   Image & Video and Studio use "third-party AI model providers", but no page says which plan picks which (notes.md).
# General features, read 2026-11-17: the web and its apps ("Try for Free on iOS & Android", its mobile page); sign-up
# with an email and a password or Google ("Sign up with Google"), Apple or SSO, and an authenticator app ("Add
# Two-Factor Authentication"); its site's language menu (English, Svenska, Polski, Português, 日本語, 한국어, हिन्दी,
# Español, Français, Deutsch, Italiano, 简体中文, Nederlands: the registry's values among them); support by email
# (support@elevenlabs.io, its help articles). No pause: "It’s not possible to pause your paid subscription" (Can I pause
# my subscription?), though its calculator says "Pause or cancel anytime" (notes.md). No parental controls: 18 and over.
features:
  platforms: [web, ios, android]
  account.sign-in: [password, totp, sso]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, hi]
  support.channels: [email]

