# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), read with Edge from Canada and with a plain fetch
# (curl), which ivpn.net serves whole except its pricing, apps, server and IVPN Light pages (read in Edge): its pricing
# page (with the plan data its script loads), services, team, ethics, apps, servers, IVPN Light, transparency report,
# legal process guidelines, vulnerability reporting and contact pages, its terms of service, privacy policy and refund
# policy, 42 help articles (ivpn.net/knowledgebase/...), and its blog posts on audits, the May 2026 plan changes and the
# August 2026 payment server incident; the pricing page again through US and UK exits; ProxyStore's IVPN page.
# Pricing: ivpn.net/en/pricing ("Pricing in USD."): Standard, Plus and Pro Suite, each "1 Week", "1 Month" and "1 Year"
# ($2, $6, $60; $3, $8, $80; $4, $10, $100). The page's own plan data (its script, which the page filters to these three)
# also has 2 and 3 years for each ($100 and $140; $140 and $180; $160 and $220), which its checkout sells ("select 1 year
# or longer" for cash, which it takes "only for 1, 2, or 3 years") and ProxyStore's vouchers confirm ("IVPN Standard 2
# years (100 USD, same as 1 year Pro)", "IVPN Plus 3 years (180 USD)", "IVPN Pro Suite 3 years (220 USD)"), so they're
# stored too (notes.md). The same US-dollar prices from Canada and through US and UK exits: one list for everyone (GLOBAL
# USD). No page says the prices include tax. None is a first-term offer: each period is one payment for that time.
# Region checklist for CA and US, 2026-11-19: 1. no country paths (/en/ and /es/, the same prices); 2. a language choice
# only; 3. the page says "Pricing in USD." and its data has one price per period; 4. the checkout starts by generating an
# account, so it wasn't opened; 5. the help centre's "How much does IVPN cost?" points to the pricing page; 6. Edge and
# a plain fetch from Canada, and Edge through US and UK exits: all the same; 7. no bill offered.
# Its individual plans: Standard, Plus and Pro Suite (Pro until May 2026: "Pro is now the Pro Suite"). Team licensing
# (/en/pricing-teams) is for teams, out of scope. IVPN Light (3 hours to 30 days of WireGuard access, priced only in
# satoshis over Lightning, "IVPN Light purchases are non-refundable") isn't stored: no price in a currency (notes.md).
# Bundles: none; Plus and Pro Suite include its own Mailx, modDNS and Portmaster Pro (perks below).
# Official resellers: its voucher FAQ names Amazon US and ProxyStore ("Physical voucher cards are currently available on
# Amazon US and ProxyStore DE . Digital vouchers can be purchased in the ProxyStore Onlineshop ."). ProxyStore's offer is
# below; Amazon US's isn't (notes.md). App stores bill its mobile in-app purchases: partners, not listed.

id: ivpn
name: IVPN
website: https://www.ivpn.net
category: vpn
spendCategory: software
# Accepted cards, read 2026-11-19: its payment methods article names only the network it refuses ("Credit/Debit Cards
# (except American Express and any types of Prepaid/Gift Cards)"); its card form shows Mastercard, Maestro, Discover and
# Visa logos without words, so no acceptedNetworks.
billingCurrency: { GLOBAL: USD }
# Its help article on cancelling ("Uncheck Recurring payments" in the account's billing settings).
cancelUrl: https://www.ivpn.net/knowledgebase/billing/how-can-i-cancel-my-ivpn-subscription/
sources: { pricing: https://www.ivpn.net/en/pricing/ }

# Ways to pay (M11.5), read 2026-11-19 in its payment methods article: Bitcoin (its own BTCPay server, Lightning too),
# Monero, PayPal, cards, its apps' in-app payments for Standard ("Android in-app payments are temporarily unavailable
# while the app is not on Google Play"), voucher cards and codes, and cash, for 1, 2 or 3 years (How can I pay with cash?).
paymentMethods:
  - methods: [crypto, paypal, card, app-store, gift-card, cash]
    page: 'What payment methods do you accept?'
    url: https://www.ivpn.net/knowledgebase/general/what-payment-methods-do-you-accept/
    quotes:
      - Bitcoin (via our own BTCPay server)
      - Monero (self-hosted)
      - PayPal
      - Credit/Debit Cards (except American Express and any types of Prepaid/Gift Cards)
      - In-app payments for IVPN Standard via our mobile apps for iOS and Android .
      - Physical voucher cards and digital voucher codes
      - Cash
# Renewal day (M11.5), read 2026-11-19: time is added to the account ("When you add time to your account"), card and
# PayPal payments can recur ("If you elect to enable auto-renew for card payments"; cancelling unchecks "Recurring
# payments"), and an upgrade keeps "The original IVPN account expiry date". No page says on which day a recurring payment
# is charged, so not-stated (notes.md has the same-date wording these pages lack).
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.ivpn.net/en/tos/
    - https://www.ivpn.net/en/privacy/
    - https://www.ivpn.net/knowledgebase/billing/how-can-i-cancel-my-ivpn-subscription/
    - https://www.ivpn.net/knowledgebase/billing/ivpn-subscription-tiers-explained-plan-differences-billing-and-service-management/
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19 on its team page, whose footer names the company's country. Private: its CEO owns all
# of it, and no page names a listing.
owner:
  name: IVPN Limited, 100% owned by its founder and CEO, Nicholas Pestell
  page:
    name: Team
    url: https://www.ivpn.net/en/team/
  quotes:
    - Nick is founder and CEO of IVPN and 100% owner of IVPN Limited, the company through which the IVPN service is operated.
    - IVPN is operated by IVPN Limited, registered in Gibraltar.
  country:
    code: GI
  lastVerified: 2026-11-19
notes: >-
  No email or name needed: you sign up with a generated account ID. One US-dollar price list everywhere, for a week, a
  month, or one, two or three years. Card and PayPal payments can renew automatically (you can turn that off); Bitcoin,
  Monero, cash and vouchers add time that doesn't renew.

# Perks (M11.6): the extra services Plus and Pro Suite include, in the pricing page's words: Mailx (email aliases),
# modDNS (a DNS filter) and Portmaster Pro (an app firewall). Each is its own account, reached without passing the IVPN
# account ID ("Additional services authorise access without receiving your IVPN account ID (Unlinked Access)").
perks:
  - id: mailx
    name: Mailx
  - id: moddns
    name: modDNS
  - id: portmaster-pro
    name: Portmaster Pro (Linux, Windows)

# General features, read 2026-11-19: apps for Windows, macOS, Linux, iOS and Android (its apps page and services page,
# "Open-source apps for iOS, Android, macOS, Windows, Linux plus config generator for custom setups"; routers and NAS by
# manual setup); sign-in with its generated account ID, none of account.sign-in's ways, plus authenticator app codes
# ("Scan the barcode using the preferred TOTP (Time-based One-Time Password) app", Do you offer Two-Factor
# Authentication?); support by email ("Send an email and we’ll normally reply within a few hours (in some rare cases up to
# 24 hours).", Contact us); its site in English and Spanish ("Versión española"). Open-source apps: "Our applications are
# open source and available for review on our GitHub page ." (Ethics), and its services page's "IVPN on GitHub ↗"
# (github.com/ivpn). No pause: time runs out or renews (its Windows app's "Pause VPN" pauses the connection, not the
# subscription). No parental controls: AntiTracker is a switch you set for yourself.
features:
  platforms: [windows, macos, linux, android, ios]
  account.sign-in: [totp]
  support.channels: [email]
  software.open-source: open-clients
  languages.interface: [en, es]
sourceRepo:
  url: https://github.com/ivpn
  page:
    name: Ethics
    url: https://www.ivpn.net/en/ethics/
  quotes:
    - Our applications are open source and available for review on our GitHub page .
  lastVerified: 2026-11-19

# Free use: none: "We do not have a free trial option. We offer an affordable one week paid plan which can be used to
# test our service out." (Does IVPN offer a free trial?), and its pricing page sells only paid plans.
freeUse:
  kind: none
  pages:
    - https://www.ivpn.net/en/pricing/
    - https://www.ivpn.net/knowledgebase/billing/does-ivpn-offer-a-free-trial/
  lastVerified: 2026-11-19

# VPN features, read 2026-11-19, the same on every plan but devices (Standard includes "the VPN service with Multi-hop,
# AntiTracker, and up to five devices", Plus adds Mailx and modDNS, Pro Suite adds Portmaster Pro "with VPN device limit
# increased to 10": IVPN Subscription Tiers Explained):
# - Devices: "a single subscription allows 5 devices with an IVPN Standard or IVPN Plus plan, or 10 devices with an IVPN
#   Pro Suite plan" (How many devices). Data: "No, we do not record bandwidth used and therefore there is no limit."
#   (Answers for "18 Questions"), so unlimited.
# - Countries: "We operate servers in 58 locations / 41 countries." (pricing page); "Bare-metal servers in 41 countries.
#   IVPN runs 89 gateways across 58 locations" (servers page).
# - Protocols: "IVPN supports OpenVPN (2.3.7 and up), WireGuard®, and IPSec with IKEv2." (IKEv2 in its iOS app), and
#   "V2Ray obfuscation (VMess over QUIC or TCP) on every platform, plus obfs4 for OpenVPN on desktop" (stealth).
# - Kill switch: its firewall, on Windows, macOS, Linux and iOS (Do you offer a kill switch or VPN firewall?). Split
#   tunnelling on Windows, Linux and Android (Split Tunnel FAQ). Multi-hop: "The Multi-hop feature is available in all
#   plans ."
# - Blocking: AntiTracker blocks "trackers that collect various information about your browser activity (e.g. Google
#   Analytics), known malicious websites, and ads" (AntiTracker FAQ), with a Hardcore Mode for Google's and Meta's
#   domains (not one of the registry's lists).
# - P2P: "We do not restrict the use of any protocols", asking customers to avoid US servers for it. No port forwarding
#   ("Port Forwarding is not available with our service."), no dedicated or static IPs, no Tor servers.
# - No-logs and audits: "We do not log any data relating to a user’s VPN activity (while connected or connecting to the
#   VPN)." (privacy policy); Cure53's no-logs audit of March 2019 ("The scope of the audit was to verify the no-logging
#   claims made in our privacy policy"; "Our last and only no-logs audit was conducted by Cure53 in March 2019"), its
#   gateway infrastructure audit (February 2023) and its apps' audits (2020, 2022), all by Cure53, with annual audits
#   since: no-logs, servers and apps.
# - Anonymous sign-up: "When you sign up for IVPN, you will not be asked for any personal information e.g. email
#   address, name etc." (privacy policy).
# - Not RAM-only: "Servers use LUKS full-disk encryption, mandatory access controls, and firewalled IPMI. A small number of
#   pilot gateways also run a RAM-only (diskless) architecture, extending it across the network is an ongoing project."
#   (servers page). No mesh: no page offers connecting your own devices to each other.
# modDNS on Plus and Pro Suite (services page): "modDNS is an audited, open-source DNS service that blocks ads, trackers,
# and malicious domains at the DNS level.", "Fine-tune filtering with custom rules to allow or deny specific domains or
# IPs", "Enable optional query logging (off by default)" and "Use modern DNS protocols including DNS over HTTPS, DNS over
# TLS or DNS over QUIC". The plans stay in the VPN category: no page gives modDNS's query allowance (dns.queries, the DNS
# category's required feature), and Mailx's alias limit isn't stated, so it's a perk only.
