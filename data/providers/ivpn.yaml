# Terms and policies (BLUEPRINT §4.10), read 2026-11-19: its terms of service (last updated 21 January 2021), privacy
# policy, refund policy, ethics page, legal process guidelines, transparency report, vulnerability reporting page, the
# help articles on cancelling, deleting, reactivating, tiers and devices, its apps page, and its blog's audit and incident
# posts. Every agreement a user accepts (the owner's rule, 2026-11-03): sign-up generates an account ID with no form to
# agree to; its terms include nothing by reference; its apps are open source (Ethics) with no licence page of their own.
# Its mobile apps' own terms and privacy pages (/en/tos-mobile-app, /en/privacy-mobile-app) and Mailx's and modDNS's own
# policies weren't rated: the main terms and privacy policy settle every topic (notes.md). Its Matomo website analytics
# and mobile crash reports are rated under data collection.
policies:
  links:
    - name: 'Terms of service'
      url: https://www.ivpn.net/en/tos/
    - name: 'Privacy policy'
      url: https://www.ivpn.net/en/privacy/
    - name: 'Refund policy'
      url: https://www.ivpn.net/en/refunds/
    - name: 'Ethics'
      url: https://www.ivpn.net/en/ethics/
    - name: 'Legal process guidelines'
      url: https://www.ivpn.net/en/legal-process-guidelines/
    - name: 'How can I cancel my IVPN subscription?'
      url: https://www.ivpn.net/knowledgebase/billing/how-can-i-cancel-my-ivpn-subscription/
    - name: 'Transparency report'
      url: https://www.ivpn.net/en/transparency-report/
    - name: 'Subscription tiers explained'
      url: https://www.ivpn.net/knowledgebase/billing/ivpn-subscription-tiers-explained-plan-differences-billing-and-service-management/
    - name: 'How can I reactivate my account?'
      url: https://www.ivpn.net/knowledgebase/billing/how-can-i-reactivate-my-account/
    - name: 'How many devices can I have?'
      url: https://www.ivpn.net/knowledgebase/general/how-many-devices-or-simultaneous-connections-can-i-have-to-ivpn/
    - name: 'IVPN no-logging claim verified by independent audit'
      url: https://www.ivpn.net/blog/ivpn-no-logging-claim-verified-by-independent-audit/
    - name: 'IVPN web infrastructure security audit concluded'
      url: https://www.ivpn.net/blog/ivpn-sixth-security-audit-concluded/
    - name: 'A security incident on our Bitcoin payment server'
      url: https://www.ivpn.net/blog/security-incident-bitcoin-payment-server/
    - name: 'Security and vulnerability reporting'
      url: https://www.ivpn.net/en/vulnerability-reporting/
    - name: 'IVPN for Windows'
      url: https://www.ivpn.net/en/apps-windows/
    - name: 'How can I pay with cash?'
      url: https://www.ivpn.net/knowledgebase/billing/how-can-i-pay-with-cash/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It counts visits to its website with its own tool, which may set a cookie, and its phone apps send crash reports unless you switch that off in their settings. Nothing turns off the website counting.'
      sources:
        - url: https://www.ivpn.net/en/privacy/
          quote: 'IVPN have selected Matomo as their web analytics platform.'
        - url: https://www.ivpn.net/en/privacy/
          quote: 'For our mobile apps, you can opt-out of crash log reporting by disabling it in user preferences.'
