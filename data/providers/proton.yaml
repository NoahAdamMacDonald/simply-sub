id: proton
name: Proton
aliases: [proton mail, protonmail, proton vpn, proton pass, proton drive]
website: https://proton.me
domains: [protonvpn.com]
category: privacy-suite
spendCategory: software
# Accepted cards, read 2026-10-28 (M9.2) in /pricing's FAQ (What payment methods can I use?), for every buyer:
# Visa, Mastercard and American Express. /support/payment-options says only "We accept all major credit and debit
# cards", which names none.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex]
    url: https://proton.me/pricing
    quotes:
      - You can pay for your subscription using Visa, Mastercard, American Express, and PayPal.
billingCurrency: { GLOBAL: USD }
cancelUrl: https://account.proton.me/dashboard
sources: { pricing: https://proton.me/pricing }
# Owner (M11.2), read 2026-11-02.
# Ways to pay (M11.5), read 2026-11-02 on its payment options article.
paymentMethods:
  - methods: [card, paypal, apple-pay, google-pay, crypto, cash, bank-transfer]
    page: Payment options
    url: https://proton.me/support/payment-options
    quotes:
      - 'You can pay for your Proton subscription with payment card, PayPal, and other popular payment methods.'
      - Apple Pay
      - Google Pay
      - Bitcoin
      - 'We accept cash payments in US dollars (USD), euros (EUR), or Swiss francs (CHF).'
      - Bank transfer
owner:
  name: Proton AG
  page:
    name: About Proton
    url: https://proton.me/about
  quotes:
    - 'Proton services are operated by Proton AG, a Swiss corporation whose primary shareholder is the non-profit Proton Foundation based in Geneva, Switzerland.'
  lastVerified: 2026-11-02
notes: >-
  One Proton account holds one paid plan. Every plan keeps the free tier of the Proton apps it doesn't upgrade.

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their
# words.
perks:
  - id: scribe
    name: Proton Scribe writing assistant

# VPN features, read 2026-10-25 on protonvpn.com. Free, Mail Plus, Drive Plus and Pass Plus have VPN Free; VPN Plus,
# Unlimited, Duo and Family have VPN Plus (/pricing). Countries: 10 on Free and 140+ on Plus (/pricing; /free-vpn/
# free-vs-paid still says 5). The same protocols on both (/free-vpn/free-vs-paid FAQ, /support/how-to-change-vpn-
# protocols), and the kill switch and Stealth on Free (/free-vpn). Paid only: split tunneling
# (/support/protonvpn-split-tunneling), Tor over VPN (/support/tor-vpn), port forwarding (/support/port-forwarding),
# P2P, Secure Core and the NetShield blocker of ads, trackers and malware (/pricing, /free-vpn/free-vs-paid).
# A no-logs policy on every plan (/pricing). Yearly no-logs audits and app audits (/blog/no-logs-audit, /blog/is-protonvpn-trustworthy). Signup may ask for an
# email or phone number (proton.me/support/human-verification), so it isn't anonymous.
#
# Unlimited, Duo and Family are suite plans: they state their own features, and includes-subscription lists the
# plans they replace (BLUEPRINT §4.4). Prices are the regular ones, not first-term offers. Proton sells every paid
# plan in USD, CAD, EUR and CHF: a buyer pays in the currency they pick, and billingCurrency covers everyone else.
#
# Categories (M1.10, M11.3): a plan lists every category it fits. Free and the suites are all of Proton's products:
# Proton VPN, Drive, Mail, Pass, Calendar and Lumo, its AI assistant. Each single product is its own category, and
# its notIn names the free tiers that come with every Proton account (Proton VPN Free, Pass, Mail, Calendar, 5 GB of
# Drive and Lumo Free) but aren't what it's sold as.
#
# Lumo (ai.assistant), read 2026-11-02 (M11.3): every plan has Lumo's free version, and Lumo Plus is an add-on (its
# own price list, https://proton.me/lumo/pricing, not stored yet). /support/proton-plans: Unlimited "You can also
# enjoy access to the free version of Proton Lumo, your private AI assistant"; Duo "Also includes the free version of
# Proton Lumo"; and a "Proton Lumo Free" list under Free, Mail Plus and Family. /support/lumo-getting-started: "Yes,
# you can use Lumo for free with guest access or signed into a Proton Account." Proton Scribe is an "Add-on with free
# trial" on Unlimited in /pricing's table, and included in Duo and Family (their perks).
# Lumo's own price list (proton.me/lumo/pricing, read 2026-11-03, M11.9's AI features): Free has "Limited image
# generations", so every plan has image generation. Free names no coding agent, research, scheduled tasks, early
# access or API credits, and neither does Plus.
# Renewal day (M11.5), read 2026-11-03 (M11.9): its terms and its subscription and invoices articles say only that a plan
# renews at the end of its billing period, with the date on the Subscription page.
renewalAnchor:
  kind: not-stated
  pages:
    - https://proton.me/legal/terms
    - https://proton.me/support/manage-subscription
    - https://proton.me/support/account/plans/payments-invoices
  lastVerified: 2026-11-03

# Apps, sign-in, support and open source (M11.9, the cross-category features), read 2026-11-03: its apps on Windows, macOS,
# Linux, Android and iOS, Mail and Drive on the web, Pass and VPN as browser extensions and VPN on Apple TV, Android TV
# and Fire TV (each product's download page; each product's plan lists its own, Drive's Linux being a command-line tool);
# a password, then an authenticator app's code or a U2F or FIDO2 security key (its 2FA articles); its support form or
# email (/support/contact), and live chat for Proton VPN's customers (protonvpn.com's "Live chat"), on the plans with
# VPN Plus; "All Proton apps are open source" (/community/open-source), which links its code on GitHub.
features:
  platforms: [windows, macos, linux, android, ios, web, browser-extension, tv]
  account.sign-in: [password, totp, security-key]
  support.channels: [email]
  software.open-source: open-clients
sourceRepo:
  url: https://github.com/ProtonMail
  page:
    name: Open source
    url: https://proton.me/community/open-source
  quotes:
    - 'All Proton apps are open source and have been independently audited and verified by third-party experts.'
  lastVerified: 2026-11-03

# Billing periods (M11.9, read 2026-11-03): monthly and yearly, every plan. Proton VPN's page also sells 2 years, but
