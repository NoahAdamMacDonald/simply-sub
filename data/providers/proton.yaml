# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: Proton's privacy policy and terms of service,
# Proton VPN's privacy policy, its no-logs audit post and its page on usage statistics. Free trials are not
# applicable (only business plans have one), a status since M11.1. Lumo's terms of use, read 2026-11-02 (M11.3), once
# Proton was in AI: who owns what it writes.
policies:
  links:
    - name: 'Privacy policy'
      url: https://proton.me/legal/privacy
    - name: 'Terms of service'
      url: https://proton.me/legal/terms
    - name: 'Proton VPN privacy policy'
      url: https://protonvpn.com/privacy-policy
    - name: 'No-logs audit'
      url: https://protonvpn.com/blog/no-logs-audit
    - name: 'Usage statistics'
      url: https://protonvpn.com/support/share-usage-statistics
    - name: 'Proton Pass audit'
      url: https://proton.me/blog/pass-open-source-security-audit
    - name: 'Bug bounty'
      url: https://proton.me/security/bug-bounty
    - name: 'How to export emails'
      url: https://proton.me/support/export-emails-import-export-app
    - name: 'Lumo terms of use'
      url: https://proton.me/lumo/terms
  ratings:
    - topic: privacy.data-collection
      tier: neutral
      reason: 'It tries to collect as little about you as it can, but its VPN apps send usage statistics until you switch that off.'
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'Our overriding policy is to collect as little user information (personal data included) as possible to ensure a private user experience when using the Services.'
        - url: https://protonvpn.com/support/share-usage-statistics
          quote: 'Usage statistic sharing is enabled by default, but you can disable it at any time (as described below).'
      action:
        name: How to turn off usage statistics
        url: https://protonvpn.com/support/share-usage-statistics
      lastVerified: 2026-10-27
    - topic: privacy.data-sharing
      tier: great
      reason: 'Only companies that help run its services, such as taking payments, get any of your data, and they may only use it for that job.'
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'Processors never store data outside of the scope of their specific purpose.'
      lastVerified: 2026-10-27
    - topic: privacy.ads-tracking
      tier: great
      reason: 'No ads. It counts visits to its website with its own tools on its own servers, not with outside tracking companies.'
      sources:
        - url: https://protonvpn.com/blog/no-logs-audit
          quote: 'No logs, no ads, open-source and independently audited.'
        - url: https://proton.me/legal/privacy
          quote: 'We employ a local installation of self-developed analytics tools.'
      lastVerified: 2026-10-27
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can see, change, download or delete your data yourself, right from your account.'
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'Through your Account interface, you can directly access, edit, delete, or export personal data processed by the Company in your use of the Services.'
      lastVerified: 2026-10-27
    - topic: billing.cancellation
      tier: good
      reason: 'You cancel from your account page before it renews. If you change your mind within 30 days of first buying, you get all your money back.'
      sources:
        - url: https://proton.me/legal/terms
          quote: 'You may cancel your subscription within 30 days of the initial purchase and receive a full refund for the Service.'
        - url: https://proton.me/legal/terms
          quote: 'you must cancel your subscription before its renewal date by visiting your Account dashboard and following the cancel subscription steps'
      lastVerified: 2026-10-27
    - topic: billing.refunds
      tier: good
      reason: 'You cancel from your account page before it renews. If you change your mind within 30 days of first buying, you get all your money back.'
      sources:
        - url: https://proton.me/legal/terms
          quote: 'You may cancel your subscription within 30 days of the initial purchase and receive a full refund for the Service.'
        - url: https://proton.me/legal/terms
          quote: 'you must cancel your subscription before its renewal date by visiting your Account dashboard and following the cancel subscription steps'
      lastVerified: 2026-10-27
    - topic: billing.price-changes
      tier: poor
      reason: "When your plan renews, you pay whatever the price is then, and it doesn't promise to warn you first if it went up."
      sources:
        - url: https://proton.me/legal/terms
          quote: 'If the renewal price has changed, you will be charged the then-current price valid at the time of the renewal of your subscription.'
      lastVerified: 2026-10-27
    - topic: billing.free-trials
      status: not-applicable
      reason: 'Its personal plans have no free trial: only its business plans do.'
      lastVerified: 2026-10-27
    - topic: legal.disputes
      tier: good
      reason: 'Disagreements go to the regular courts in Geneva, Switzerland, not to a private arbitrator.'
      sources:
        - url: https://proton.me/legal/terms
          quote: 'shall be subject to the jurisdiction of the competent courts of the Canton of Geneva'
      lastVerified: 2026-10-27
    - topic: legal.disputes
      tier: poor
      reason: "In the US, a private arbitrator decides disagreements instead of a court, and you can't join a group lawsuit, unless you mail it a letter saying no within 30 days of first agreeing to its terms."
      regions: [US]
      sources:
        - url: https://proton.me/legal/terms
          quote: 'These Terms of Service contain a class action waiver as well as an arbitration provision'
        - url: https://proton.me/legal/terms
          quote: 'The opt-out notice must be sent to the foregoing address within 30 calendar days of your first agreeing to these Terms.'
      action:
        name: How to opt out of arbitration, by post
        url: https://proton.me/legal/terms
      lastVerified: 2026-10-27
    - topic: legal.terms-changes
      tier: poor
      reason: "It can change its terms whenever it wants, and if you keep using it (or don't delete your account) that counts as saying yes."
      sources:
        - url: https://proton.me/legal/terms
          quote: 'Within the limits of applicable law, the Company reserves the right to review and change these Terms at any time.'
        - url: https://proton.me/legal/terms
          quote: 'Continued use of your Account or the Services, including non-deletion of your Account after such changes are performed shall constitute your consent to them.'
      lastVerified: 2026-10-27
    - topic: legal.account-closure
      tier: neutral
      reason: "If it closes your account for breaking its rules, you lose what you paid and don't get a refund."
      sources:
        - url: https://proton.me/legal/terms
          quote: 'Paid Accounts which are terminated due to a violation of these Terms will incur the loss of all payments and credits and are not eligible for refund.'
      lastVerified: 2026-10-27
    - topic: service.activity-logging
      tier: great
      reason: "It doesn't keep records of your VPN sessions, and outside auditors have checked that five years in a row."
      sources:
        - url: https://protonvpn.com/privacy-policy
          quote: 'All Proton VPN servers are encrypted and we do not log VPN session data.'
        - url: https://protonvpn.com/blog/no-logs-audit
          quote: 'For 5th year running, Proton VPN passes external no-logs audit'
      lastVerified: 2026-10-27
    - topic: legal.inactivity
      tier: good
      reason: "If you don't use a free account for a year, it may delete it and what's in it, but it tries to email you first. It never does this to a paid account."
      sources:
        - url: https://proton.me/legal/terms
          quote: 'The Company reserves the right to suspend or delete free Accounts that have been inactive for a consecutive period of 12 months'
        - url: https://proton.me/legal/terms
          quote: 'the Company will aim to send notice to the recovery email associated with your Account 30, 15 and 7 days in advance before such action is taken'
        - url: https://proton.me/legal/terms
          quote: 'Accounts under an active paid subscription are always considered active'
      lastVerified: 2026-11-02
    - topic: security.practices
      tier: good
      reason: 'Outside security experts check all its apps, and it posts what they found. It may pay you a reward for finding a security bug.'
      sources:
        - url: https://proton.me/blog/pass-open-source-security-audit
          quote: 'That’s why we also regularly commission and publish independent security audits for all our apps.'
        - url: https://proton.me/security/bug-bounty
          quote: 'If you’re a security researcher, you can help make Proton services safer, get recognized as a security contributor, and potentially earn a reward.'
      lastVerified: 2026-11-02
    # M11.9's topics, pulled forward at the owner's request (2026-11-02), read that day.
    - topic: privacy.ai-training
      tier: great
      reason: 'Its writing helper, Scribe, never learns from what you write.'
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'Proton Scribe does not use content data or any of your data to train its models.'
      lastVerified: 2026-11-02
    - topic: privacy.content-access
      tier: great
      reason: 'Your emails, files, calendar, passwords and notes are locked so that only you can open them. Proton itself has no way to read them.'
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'We do not have the technical means to access the content of your encrypted emails, files, calendar events, passwords, or notes.'
      lastVerified: 2026-11-02
    - topic: privacy.data-retention
      tier: neutral
      reason: "It doesn't keep a lasting record of where you sign in from, but it keeps some sign-up checks and anti-abuse records for as long as it decides it needs them."
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'By default, we do not keep permanent IP logs in relation with your Account.'
        - url: https://proton.me/legal/privacy
          quote: 'The period of temporary data retention is determined by our legitimate interests of protecting the service from spam, and also by any applicable Swiss legal requirements we must comply with.'
      lastVerified: 2026-11-02
    - topic: privacy.data-portability
      tier: good
      reason: 'You can download your own data from your account, and a free tool saves all your emails as files any email app can open.'
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'Through your Account interface, you can directly access, edit, delete, or export personal data processed by the Company in your use of the Services.'
        - url: https://proton.me/support/export-emails-import-export-app
          quote: 'We offer a command-line tool for Windows, macOS, and Linux that allows you to export all your emails as EML files, and their metadata as JSON files.'
      action:
        name: How to export your emails
        url: https://proton.me/support/export-emails-import-export-app
      lastVerified: 2026-11-02
    - topic: privacy.government-requests
      tier: good
      reason: 'It only hands over data when a Swiss court order makes it, fights orders it doubts, and publishes how many it gets. It can never unlock your locked emails or files for anyone.'
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'We will only disclose the limited user data we possess if we are legally obligated to do so by a binding request coming from the competent Swiss authorities.'
        - url: https://proton.me/legal/privacy
          quote: 'Under no circumstances can Proton decrypt end-to-end encrypted content and disclose decrypted copies.'
        - url: https://proton.me/legal/privacy
          quote: 'Aggregate statistics about data requests from the competent Swiss authorities can be found in the transparency reports listed in our products-specific policies.'
      lastVerified: 2026-11-02
    - topic: privacy.data-location
      tier: good
      reason: 'It is a Swiss company under Swiss privacy law. The few helpers it uses abroad, for payments and support, must follow the EU’s standard data rules.'
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'It is therefore governed by the laws and regulations of Switzerland.'
        - url: https://proton.me/legal/privacy
          quote: 'Guarantees for international transfer: Standard Contractual Clauses, Data Processing Agreement'
      lastVerified: 2026-11-02
    - topic: privacy.sign-up-data
      tier: great
      reason: "You don't need to give your name, phone number or another email address to sign up."
      sources:
        - url: https://proton.me/legal/privacy
          quote: 'It is not necessary to provide personal information in order to create an Account.'
      lastVerified: 2026-11-02
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own, but not that it reminds you before it does.'
      pages: [https://proton.me/legal/terms]
      lastVerified: 2026-11-02
    - topic: billing.fees
      tier: neutral
      reason: 'The price is all you pay, unless you dispute a charge with your bank (it can pass on that cost) or ask to move your credit to another currency (at a rate it picks).'
      sources:
        - url: https://proton.me/legal/terms
          quote: 'Furthermore, if the result of the dispute or chargeback mechanisms causes the Company to be liable for additional costs (e.g. dispute fee), you authorize the Company to charge that amount on your Account.'
        - url: https://proton.me/legal/terms
          quote: 'If you request a credit balance to be converted between different currencies which the Company supports, the Company has discretion over the exchange rate applied.'
      lastVerified: 2026-11-02
    - topic: billing.plan-changes
      tier: great
      reason: 'You can switch plans whenever you like. It changes at once, and the time you already paid for goes toward the new plan.'
      sources:
        - url: https://proton.me/legal/terms
          quote: 'If you select a new paid plan, your subscription will be immediately updated, and you will receive a prorated credit for the unused portion of your previous plan that will be automatically applied to your account.'
      lastVerified: 2026-11-02
    - topic: legal.content-rights
      status: not-stated
      reason: "Its terms don't say what rights, if any, it takes over what you store. It can't read most of it anyway."
      pages: [https://proton.me/legal/terms]
      lastVerified: 2026-11-02
    - topic: legal.output-rights
      tier: good
      reason: 'You own what Lumo, its AI assistant, writes for you, and it never uses your chats to improve its AI. It doesn’t offer to defend you if someone claims the output copies their work.'
      sources:
        - url: https://proton.me/lumo/terms
          quote: 'As between you and the Company, and to the extent permitted by applicable law, you (a) retain your ownership rights in Input and (b) own the Output.'
        - url: https://proton.me/lumo/terms
          quote: 'Company will not use any of your content to maintain, develop, or improve our Services.'
      lastVerified: 2026-11-02
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change, pause or stop any of its apps or features, even without warning, and says it owes you nothing if it does.'
      sources:
        - url: https://proton.me/legal/terms
          quote: 'The Company reserves the right, at its sole discretion, to modify, suspend, or discontinue any of our Services, or any feature or component thereof, with or without notice to you.'
      lastVerified: 2026-11-02
    - topic: service.account-sharing
      tier: great
      reason: "You can't share your own login, but plans for more than one person let you add anyone, each with their own account."
      sources:
        - url: https://proton.me/legal/terms
          quote: 'Sharing your Account or login credentials with any other person or entity, except where such sharing is expressly permitted under your subscription plan or has been otherwise authorized in writing by the Company;'
      lastVerified: 2026-11-02
    - topic: service.device-limits
      status: not-stated
      reason: "Its terms don't add any limit beyond how many devices each plan's VPN can connect at once."
      pages: [https://proton.me/legal/terms]
      lastVerified: 2026-11-02
