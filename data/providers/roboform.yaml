# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 2), read with Edge from Canada: roboform.com's
# personal pricing page (roboform.com/pricing-personal), its Premium, Family, download, about, locations and security
# pages, its License Agreement (its terms of use and apps' licence), Privacy Policy, GDPR statement and Vulnerability
# Disclosure Policy, its checkout (online.roboform.com, read up to the payment form, typing nothing), and 40 of its help
# centre's articles through its Zendesk API (help.roboform.com, a plain fetch; its pages answer a plain fetch with 403).
# Pricing: the page prices by where the visitor is. Its cards show this year's new-user offer ("BLACK FRIDAY & CYBER
# MONDAY SALE! 40% off new RoboForm subscriptions."): "New users: C$25.10 for the first year Then renews at
# C$41.88/yr" (Premium) and "C$43.20 … Then renews at C$72.00/yr" (Family); the renewal price is stored, the offer
# isn't. The checkout's order summary names the country and the regular price ("1-year plan C$41.88", "Country:
# Canada"; "Your subscription will automatically renew 14 days before the end of each term at the regular price then in
# effect (currently C$41.88/year)"). It also sells "2-year plan" and "3-year plan", at exactly 2 and 3 times the yearly
# price (C$83.76, C$125.64; Family C$144.00, C$216.00) before the new-user discount, and no page says what they renew
# as, so only the year is stored (the plans' notes say the longer terms exist). Read 2026-11-19 from Canada
# (and through Vancouver and Calgary exits), and through US, UK, Irish, German, French, Dutch, Spanish, Italian,
# Australian and New Zealand exits: the US $29.88 and $47.75 a year, the UK £23.88 and £37.90, every euro country €29.88
# and €47.75 (VAT added at checkout: "VAT (Ireland, 23%)"; its checkout placed the German exit in Sweden and the Spanish
# one in Romania, in euros at the same prices), Australia A$47.88 and A$76.00, New Zealand US$29.88 and US$47.75. Its
# help centre: "Depending on where you are located, purchases of RoboForm products may be subject to sales tax or Value
# Added Tax (VAT)." No price includes tax.
# Region checklist for CA and US, 2026-11-19: 1. language paths only (/fr, /de…); 2. the checkout's country menu
# (defaults to the visitor's); 3. no price data in the page's code; 4. the checkout's order summary, both countries; 5.
# its sales tax and VAT articles; 6. Edge from Canada and through exits; 7. no bill offered.
# Plans: Free, Premium and Family (five Premium accounts). RoboForm for Business is out of scope. Gifts are Premium only
# and "Gift sales are final and non-refundable."
# Bundles: none. Official resellers: its partner and affiliate programmes are for businesses and referrals; no page
# names a shop selling personal plans. App stores (Apple, Google Play) bill it: partners, not listed.
# Free use: RoboForm Free, a plan of its own ("Unlimited passwords on a single device").

id: roboform
name: RoboForm
aliases: [robo form, siber systems]
website: https://www.roboform.com
# Its help centre, whose articles state its billing, features and policies.
domains: [help.roboform.com]
category: passwords
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help article on cancelling ("toggle option for Auto Renewal Status to the "OFF" position").
cancelUrl: https://help.roboform.com/hc/en-us/articles/115003064811-How-do-I-cancel-auto-renewal-for-my-RoboForm-Subscription
sources: { pricing: https://www.roboform.com/pricing-personal }
# Ways to pay (M11.5), read 2026-11-19: "Credit or debit card" at its checkout (its card logos name no network in
# words, so no acceptedNetworks), PayPal on its website and the app stores (its cancelling article and licence).
paymentMethods:
  - methods: [card, paypal]
    page: 'License Agreement'
    url: https://www.roboform.com/license
    quotes:
      - "Siber shall charge it automatically to Customer's credit card or other payment method from the original purchase that was stored in payment system database (Stripe, Paypal, Apple, Google, etc)."
  - methods: [app-store]
    page: 'How do I cancel auto-renewal for my RoboForm Subscription?'
    url: https://help.roboform.com/hc/en-us/articles/115003064811-How-do-I-cancel-auto-renewal-for-my-RoboForm-Subscription
    quotes:
      - 'If you subscribed to an automatically renewed plan on the iOS App Store, you must manage your subscription within your Apple account.'
# Renewal day (M11.5, M11.21), read 2026-11-19: a card or PayPal renewal is charged 14 days before the term ends, the date
# you signed up a year on (app store renewals on the day itself).
renewalAnchor:
  kind: same-date
  page: License Agreement
  url: https://www.roboform.com/license
  quotes:
    - 'Automatic renewal of license shall occur 14 days before the expiration date for Credit Cards and Paypal and on the day of expiration for Apple Store and Google Play.'
  chargedBefore: { days: 14 }
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19: its privacy policy. Siber Systems is private: no page names a listing.
owner:
  name: Siber Systems Inc.
  page:
    name: Privacy Policy
    url: https://www.roboform.com/privacy-policy
  quotes:
    - 'RoboForm is wholly owned and operated by Siber Systems Inc. (Siber), a Virginia Corporation located at 3701 Pender Drive, Suite 400, Fairfax, VA 22030, United States.'
  country:
    code: US
  lastVerified: 2026-11-19
notes: Billed once a year (2- and 3-year terms cost the same per year). Card and PayPal renewals are charged 14 days before the term ends.

# Perks (M11.6): what no feature describes, in its pages' words.
perks:
  - id: local-only-mode
    name: Local only mode

# General features, read 2026-11-19. Platforms: "RoboForm works on Windows, Mac, Android, iOS, Linux, and Chrome OS.
# Extensions are available for all major desktop browsers" (its Premium page's FAQ), with web access on Premium and
# Family ("Web access", not on Free). Sign-in: a Master Password, then "Email, SMS, authenticator app, passkey, trusted
# device, hardware security key" (every plan's "Advanced two-factor authentication (2FA)"). Support: Free "24/7 email
# support"; Premium and Family "24/7 Priority email support Monday-Friday live chat, phone support". App languages: its
# site's language versions (/br, /cn, /de, /es, /fr, /it, /jp, /nl, /pl, /ru, /se: Dutch, Polish, Russian and Swedish
# have no registry value). Closed source: "RoboForm is the proprietary product of Siber". No pause; no parental controls.
features:
  platforms: [windows, macos, linux, android, ios, web, browser-extension]
  account.sign-in: [password, passkey, totp, security-key, sms, email-code, trusted-device]
  support.channels: [email, 24-7]
  languages.interface: [en, pt, zh, de, es, fr, it, ja]
  software.open-source: proprietary

# Password manager features, read 2026-11-19 (the pricing page's three cards, read from its screenshot for Free's ticks
# and crosses, its "Features included with every RoboForm account", and the help articles named):
# - Every plan: "Unlimited password storage", "Offline access", "Password audit", "Export / Import", "Passkey
#   management", "Safenotes"; logins, Identities ("Person", "Business", "Passport", "Address", "Credit Card", "Bank
#   Account", "Car"), Safenotes and bookmarks; "Monitor for compromised passwords" and "Integrated TOTP authenticator"
#   ticked on Free too. Free: "Unlimited passwords on a single device"; "Access on all devices", "Web access", "Data
#   Breach Monitoring for 5 emails", "Local only mode", "Emergency Access" and "Securely share items and folders" crossed.
# - Health: its Security Center finds "weak, reused, or compromised passwords" (security page).
# - Sharing (Premium, Family): items and shared folders with other RoboForm users ("Share passwords securely in folders or
#   individually, assigning access levels based on user needs."). No link sharing.
# - Import: CSV ("How to Import from a CSV"), other managers' exports (its guides for 1Password, Bitwarden, Dashlane,
#   Keeper, LastPass, NordPass, Proton Pass, KeePass's CSV…), and Apple Passwords on iOS ("Select "RoboForm" as the
#   export destination": Credential Exchange). No KDBX.
# - Export: "RoboForm exports item names, folder paths, and the following saved data to its extended CSV format",
#   logins (with "TOTP authentication keys used by RoboForm Authenticator to generate one-time codes" and passkeys),
#   bookmarks and Safenotes.
# - Emergency access: "Granting Emergency Access is a premium feature available to RoboForm Premium users with an active
#   subscription." (Free users can receive it.)
# - Offline: "Offline access" on every account.
# - Authenticator (every plan): a site's key or QR code, and Google Authenticator's export ("How to Import TOTP QR Codes
#   from Google Authenticator into RoboForm"); its CSV export carries the keys (plain).
# - End-to-end: "All decryption happens on your device and not on our servers." (security page): passwords.
# - Data Breach Monitoring (Premium, Family): "scans for data breaches containing your email addresses and personal
#   information": dark web monitoring.
