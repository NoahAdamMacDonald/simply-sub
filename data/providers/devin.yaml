# Terms and policies (BLUEPRINT §4.10), read 2026-11-14 with a plain fetch and Edge: its Platform Terms of Service
# (updated June 30, 2026; Exafunction's for some former Windsurf users), Privacy Policy, Privacy Choices page, the
# sign-up page ("I agree to the Terms of Service", "I consent to the collection and use of my personal information as
# described in the Privacy Policy, including processing outside Canada."), its plans and self-serve billing articles,
# its Security page and vulnerability page. Read and holding nothing worse: the Acceptable Use Policy (included by its
# terms, 2.6) and Website Terms of Use (the website's, not the service's). Not read: the Data Processing Addendum and
# Enterprise Terms (business customers'). Its terms and privacy policy disagree on the minimum age (13 and 18), which no
# topic for these categories grades. Calibrated against Claude and ChatGPT.
policies:
  links:
    - name: 'Platform terms of service'
      url: https://cognition.com/legal/platform-terms-of-service
    - name: 'Privacy policy'
      url: https://cognition.com/legal/privacy-policy
    - name: 'Privacy choices'
      url: https://cognition.com/privacy-choices
    - name: 'Security'
      url: https://cognition.com/legal/security
    - name: 'Report a vulnerability'
      url: https://cognition.com/report-vulnerability
    - name: 'Plans and usage'
      url: https://docs.devin.ai/desktop/accounts/usage
    - name: 'Self-serve plans'
      url: https://docs.devin.ai/admin/billing/self-serve
    - name: 'Sign up'
      url: https://app.devin.ai/signup
  ratings:
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel online whenever you like, and you keep your plan until the end of the time you paid for.'
      sources:
        - url: https://docs.devin.ai/desktop/accounts/usage
          quote: 'As a paid individual user, you can cancel your plan at any time'
        - url: https://docs.devin.ai/desktop/accounts/usage
          quote: "Upon canceling, you'll still have access to your plan's features until the end of the current billing period."
      lastVerified: 2026-11-14
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back unless the law says so, except before you’ve used a new plan. You keep it until the end of the time you paid for.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'Except as expressly provided in these Terms or where required by law, all payments are non-refundable.'
        - url: https://docs.devin.ai/desktop/accounts/usage
          quote: 'you can request a refund before using the subscription if you change your mind.'
      lastVerified: 2026-11-14
    - topic: billing.price-changes
      status: not-stated
      reason: 'Its terms and plans articles don’t say whether it tells you before raising the price.'
      pages:
        [
          https://cognition.com/legal/platform-terms-of-service,
          https://docs.devin.ai/admin/billing/self-serve,
        ]
      lastVerified: 2026-11-14
    - topic: billing.free-trials
      status: not-applicable
      reason: 'It offers no free trial of its paid plans ("Free trials of paid plans are not currently offered"): the Free plan simply stays free.'
      pages: [https://docs.devin.ai/desktop/accounts/usage]
      lastVerified: 2026-11-14
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own, but not that it reminds you first.'
      pages: [https://cognition.com/legal/platform-terms-of-service]
      lastVerified: 2026-11-14
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms charge the listed price and any tax, and don’t say whether anything else is added.'
      pages:
        [
          https://cognition.com/legal/platform-terms-of-service,
          https://docs.devin.ai/desktop/accounts/usage,
        ]
      lastVerified: 2026-11-14
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its terms and plans articles don’t say what happens to time you’ve paid for when you switch plans.'
      pages:
        [
          https://cognition.com/legal/platform-terms-of-service,
          https://docs.devin.ai/admin/billing/self-serve,
        ]
      lastVerified: 2026-11-14
    - topic: legal.disputes
      tier: bad
      reason: 'Any dispute goes to a private referee in New York, not a court, and you give up class actions, with no way to opt out.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'THE DISPUTE WILL BE RESOLVED BY BINDING ARBITRATION RATHER THAN IN COURT.'
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'YOU AND COGNITION AGREE THAT EACH MAY BRING CLAIMS AGAINST THE OTHER ONLY IN YOUR OR ITS INDIVIDUAL CAPACITY AND NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY PURPORTED CLASS, COLLECTIVE, OR REPRESENTATIVE PROCEEDING.'
      lastVerified: 2026-11-14
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It gives 30 days’ notice of big changes to its terms, but posting them on its website counts as notice, and using it afterwards means you agree.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'We will provide you with at least thirty (30) days written notice (including by posting the updates on our website) before any changes that we determine, in our sole discretion, materially impact your rights or obligations'
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'Continued use of the Services constitutes acceptance of the updated terms.'
      lastVerified: 2026-11-14
    - topic: legal.account-closure
      tier: neutral
      reason: 'It can end your plan without notice if it thinks you broke its terms, with no refund; if it ends your plan for any other reason, it refunds the unused time.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'If we terminate your access to the subscription due to a violation of these Terms or the law, you will not be entitled to any refund.'
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'If we exercise this right and you purchased the subscription via our website, we will refund you, on a pro rata basis, the fees you paid for the remaining portion of your subscription after termination.'
      lastVerified: 2026-11-14
    - topic: legal.content-rights
      tier: good
      reason: 'What you give it stays yours, and it may use it only to run the service for you. (Training on it is graded under AI training.)'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'You own all right, title, and interest, including all intellectual property rights, in and to Customer Data, including Outputs to the fullest extent permitted by applicable law.'
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'to reproduce, distribute, modify, and otherwise use, display, and perform all acts with respect to the Customer Data as may be necessary for Cognition to provide the Services to you.'
      lastVerified: 2026-11-14
    - topic: legal.output-rights
      tier: good
      reason: 'The code and answers it makes for you are yours.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'Cognition assigns to you all right, title, and interest in Output.'
      lastVerified: 2026-11-14
    - topic: legal.service-changes
      tier: neutral
      reason: 'It can change the service as it sees fit, as any subscription can.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: "The Services are subject to modification and change, in Cognition's sole discretion."
      lastVerified: 2026-11-14
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://cognition.com/legal/platform-terms-of-service]
      lastVerified: 2026-11-14
    - topic: legal.licence
      tier: neutral
      reason: 'You may use it only for your own internal purposes, and may not copy it, take it apart, or use it to build a competing product or AI.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'Cognition hereby grants you a non-exclusive, non-sublicensable, non-transferable right to access and use the Services and Documentation for your internal business purposes only'
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'use the Services to create or develop any competing products or services, including to train competing artificial intelligence models except as expressly approved by Cognition in writing'
      lastVerified: 2026-11-14
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use its websites and apps, and its ad partners track you on its websites. You can only turn off the ad tracking, browser by browser.'
      sources:
        - url: https://cognition.com/legal/privacy-policy
          quote: 'We collect some of this information using cookies and similar technologies, and our advertising partners may collect information about your online activities over time and across different websites when you use our websites.'
        - url: https://cognition.com/privacy-choices
          quote: 'Manage how your data is used for advertising on cognition.com.'
      action:
        name: 'Its privacy choices'
        url: https://cognition.com/privacy-choices
      lastVerified: 2026-11-14
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It gives ad companies information about you to promote Devin, which US law may call selling. You can say no on its Privacy Choices page or with your browser’s privacy signal, browser by browser.'
      sources:
        - url: https://cognition.com/legal/privacy-policy
          quote: 'We disclose, and in the past 12 months have disclosed, identifiers, commercial information, and internet or other electronic network activity information to advertising partners to promote our Services, which may be considered a “sale,” “sharing,” or “targeted advertising” under certain US state privacy laws.'
        - url: https://cognition.com/legal/privacy-policy
          quote: 'You can opt out on our Privacy Choices page or the “Your Privacy Choices” link on our websites.'
      action:
        name: 'Its privacy choices'
        url: https://cognition.com/privacy-choices
      lastVerified: 2026-11-14
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Devin shows no ads, but its websites load ad trackers (Google, Meta, LinkedIn, X and others) to show you its ads elsewhere. Turning them off works browser by browser.'
      sources:
        - url: https://cognition.com/privacy-choices
          quote: 'Google Tag Manager and the advertising tags it loads (Google Ads, Meta, LinkedIn, X, Reddit, Bing, and similar)'
        - url: https://cognition.com/privacy-choices
          quote: 'If your browser sends a Global Privacy Control (GPC) signal, we automatically treat you as opted out.'
      action:
        name: 'Its privacy choices'
        url: https://cognition.com/privacy-choices
      lastVerified: 2026-11-14
    - topic: privacy.ai-training
      tier: bad
      reason: 'On the Free plan, your code and prompts can train its AI, and you can’t say no: only paid plans can opt out.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'Cognition may use Customer Data for model training purposes and to improve and enhance the Services. If you subscribe to a paid Service Tier, you may opt out of this use (“Opt-Out”).'
      lastVerified: 2026-11-14
    - topic: privacy.ai-training
      plans: [devin.pro, devin.max]
      tier: neutral
      reason: 'Your code and prompts train its AI unless you opt out. Once you do, they’re used for nothing else, and its model providers keep none of it.'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'Cognition may use Customer Data for model training purposes and to improve and enhance the Services. If you subscribe to a paid Service Tier, you may opt out of this use (“Opt-Out”).'
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'Following an Opt-Out election: (A) Customer Data will not be used for any other purpose, including training language models; and (B) Zero Data Retention will be enabled with our model providers.'
      action:
        name: 'Its terms on opting out'
        url: https://cognition.com/legal/platform-terms-of-service
      lastVerified: 2026-11-14
    - topic: privacy.content-access
      tier: neutral
      reason: 'Its systems check your content for abuse, and it may keep or look at flagged content for safety reviews or when the law requires. (Training on it is graded under AI training.)'
      sources:
        - url: https://cognition.com/legal/platform-terms-of-service
          quote: 'ZDR does not preclude retention or disclosure of Customer Data (i) flagged on automated safety and abuse-detection classifiers; (ii) to perform safety, security, and AUP compliance review; or (iii) as compelled by applicable law or legal process.'
      lastVerified: 2026-11-14
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it decides it needs it, and gives no time limits.'
      sources:
        - url: https://cognition.com/legal/privacy-policy
          quote: 'We retain your personal information as needed to provide our Service to you, comply with legal obligations, or protect ours or others interests.'
      lastVerified: 2026-11-14
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask it by email to delete your information, and it does, but it doesn’t say how quickly.'
      sources:
        - url: https://cognition.com/legal/privacy-policy
          quote: 'In line with these considerations, we delete information that is no longer needed for the above purposes or when you request deletion of your information.'
        - url: https://cognition.com/legal/privacy-policy
          quote: 'You may submit a request to exercise these rights by contacting us at privacy@cognition.ai .'
      action:
        name: 'How to ask (its privacy policy)'
        url: https://cognition.com/legal/privacy-policy
      lastVerified: 2026-11-14
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask by email for a copy of your information in a common, machine-readable format, where the law gives you that right.'
      sources:
        - url: https://cognition.com/legal/privacy-policy
          quote: 'You may also have the right to request that we provide certain personal information in a structured, commonly used, machine-readable format and make this available to you or a designated third party.'
      action:
        name: 'How to ask (its privacy policy)'
        url: https://cognition.com/legal/privacy-policy
      lastVerified: 2026-11-14
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over information when it believes the law or the authorities require it. It doesn’t say it tells you, or publish how often.'
      sources:
        - url: https://cognition.com/legal/privacy-policy
          quote: 'We may access, read, preserve, and disclose information when we believe it is reasonably necessary to comply with law, legal obligations, regulations, law enforcement, governmental, and other legal requests, court orders, or for disclosure to tax authorities'
      lastVerified: 2026-11-14
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your information can be handled anywhere, including the US, the EU and the UK. For Europeans it uses the EU’s standard legal safeguards.'
