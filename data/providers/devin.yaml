# Researched by hand on 2026-11-13 and 2026-11-14 (the full catalog run, AI batch 1), read with Edge from Canada
# (devin.ai/pricing, its sign-up page), devin.ai/pricing again through a US, a UK, a German and an Australian exit, and
# with a plain fetch (windsurf.com's redirects, Cognition's legal pages, about page and blog, and Devin's documentation
# as its Markdown copies). Pages, each quoted where it's used.
# Windsurf and Devin (the owner's "Windsurf/DevanAI", notes.md): one provider. Windsurf is now Devin Desktop, sold on
# Devin's plans: "We’re excited to announce Devin Desktop - the next generation of Windsurf." (Cognition's blog,
# Introducing Devin Desktop); its terms speak of "Devin Desktop (fka Windsurf)"; windsurf.com, windsurf.com/editor and
# codeium.com redirect to devin.ai/desktop, windsurf.com/pricing to devin.ai/pricing, and Windsurf's terms and privacy
# links to Cognition's. One company (Cognition AI, Inc.) sells Devin Desktop, the Devin CLI and Devin's cloud agents on
# the same plans, terms and account ("A daily and weekly usage quota that covers Devin sessions, Devin CLI, and Devin
# Desktop", Self-serve plans), so by the brand rule it's one provider, named as it's sold now: Devin, found as Windsurf
# too (aliases).
# Pricing: devin.ai/pricing: "INDIVIDUAL PLANS" Free "$0", Pro "$20 PER MONTH", Max "$200 PER MONTH" (Teams, from $80 a
# month plus seats, and Enterprise are business plans); its documentation's Self-serve plans: "Pro" "\$20/month", "Max"
# "\$200/month". Monthly only: no page offers a yearly price (its quota article says only that existing annual Pro and
# Teams subscribers keep their plans). No currency is named anywhere: the page shows a bare "$" from Canada and through
# a US, a UK, a German and an Australian exit alike, and its data holds no currency; one price list for everywhere in
# US dollars, the only dollar it can be (Stremio's precedent), flagged for the owner (notes.md). No page says the prices
# include tax ("we may charge the Payment Method for any applicable fees listed for our Services and any applicable
# tax", its terms). Not listed: grandfathered Windsurf prices ("Your price is grandfathered in at \$15/mo indefinitely",
# Quota-Based Usage), which new buyers can't get; extra usage at API prices (usage-billed, out).
# Region checklist, 2026-11-14: 1. devin.ai has no country or locale paths; 2. no country or currency picker; 3. the
# pricing page's data names no currency; 4. checkout needs an account (app.devin.ai/settings/plans); 5. no help article
# prices by country; 6. Edge from Canada and through a US, UK, German and Australian exit, all "$20" and "$200"; 7. no
# bill offered. Sold in Canada: its sign-up page, read from Canada, asks consent to "processing outside Canada".
# Bundles: none found. Official resellers: none: its pages sell Pro and Max only at app.devin.ai and name no shop. Its
# "Use your ChatGPT plan" lets a ChatGPT subscription pay for GPT models' usage: a perk, not a bundle.
# Free use: the Free plan ("The Free plan includes a light quota to code with agents, limited model availability,
# unlimited inline edits, and unlimited Tab completions.", the pricing page's FAQ).

id: devin
name: Devin
aliases: [windsurf, devin desktop, codeium, cognition]
website: https://devin.ai
# Cognition's site (its terms, privacy policy and about page) and Windsurf's old domain, which redirects here.
domains: [cognition.com, windsurf.com]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its plans article's "Canceling your paid plan" (at app.devin.ai/settings/plans).
cancelUrl: https://docs.devin.ai/desktop/accounts/usage
sources: { pricing: https://devin.ai/pricing }
notes: 'Formerly Windsurf: its editor is now Devin Desktop, sold with Devin’s cloud agents and CLI on the same plans by Cognition AI.'

# Ways to pay (M11.5), read 2026-11-14 in its Plans and Usage article: cards, Apple Pay, Google Pay and Link (Stripe's
# wallet: `other`); "Klarna is also offered at checkout in some regions." names no region, so it's left out. It names no
# card networks ("all major credit and debit cards"), so no acceptedNetworks.
paymentMethods:
  - methods: [card, apple-pay, google-pay, other]
    page: Plans and Usage
    url: https://docs.devin.ai/desktop/accounts/usage
    quotes:
      - 'We accept all major credit and debit cards, Apple Pay, Google Pay, and Link.'

# Owner (M11.2), read 2026-11-14: Cognition's about page; its terms are with Cognition AI, Inc. ("Cognition AI, Inc.
# (“Cognition,” “we,” “us,” or “our”)"), or Exafunction, Inc. for some former Windsurf users. Private: "We have raised
# over $3.5B from Founders Fund, Lux Capital, 8VC, Bain Capital Ventures, and other leading investors." Where it is: its
# address for notices in its terms ("Cognition’s headquarters are in San Francisco", its about page, names no state or
# country, which core's namesCountry needs).
owner:
  name: 'Cognition AI, Inc.'
  page:
    name: About Cognition
    url: https://cognition.com/about
  quotes:
    - 'Cognition operates Devin, the first autonomous software engineer.'
  country:
    code: US
    page:
      name: Platform terms of service
      url: https://cognition.com/legal/platform-terms-of-service
    quotes:
      - 'Before initiating arbitration, a party must first send a written notice of the Dispute to the other party by certified U.S. Mail'
      - "Cognition's address for Notice of Arbitration is: Cognition AI, Inc., 550 Third Street, San Francisco, CA 94107."
    lastVerified: 2026-11-14
  lastVerified: 2026-11-14

# Renewal day (M11.5), read 2026-11-14: its terms start the term "on the first day the subscription is active" and renew
# it "for successive periods of the same duration", which says the date you subscribed in words core's renewalWrittenAs
# doesn't read yet (notes.md has the same-date block); its plans article names no billing date.
renewalAnchor:
  kind: not-stated
  pages:
    [
      https://cognition.com/legal/platform-terms-of-service,
      https://docs.devin.ai/desktop/accounts/usage,
    ]
  lastVerified: 2026-11-14

# Perks (M11.6), read 2026-11-14 on devin.ai/pricing (its cards and "Compare Plans"), each line no feature describes:
# Pro's "Access to cloud agents (Devin Cloud)", "Free use of SWE-2", "Use your ChatGPT plan", the table's "DeepWiki",
# "Ask Devin" and "Concurrent sessions limit" ("Up to 10" on Pro and Max), and Max's "Significantly higher quotas".
perks:
  - id: cloud-agents
    name: Access to cloud agents (Devin Cloud)
  - id: deepwiki
    name: DeepWiki
  - id: ask-devin
    name: Ask Devin
  - id: free-swe-2
    name: Free use of SWE-2
  - id: concurrent-sessions-10
    name: Up to 10 concurrent sessions
  - id: use-chatgpt-plan
    name: Use your ChatGPT plan
  - id: higher-quotas
    name: Significantly higher quotas

# Features, read 2026-11-14 (AI: the registry on feat/t12-ai-1), on every plan unless named:
# - Coding agent and code completion: Free's "Light quota to code with agents" and "Unlimited Tab completions" (and on
#   every plan in the table's "Tab" row); Devin Desktop's Cascade agent and Devin's cloud agents.
# - Models from several companies on Pro and Max: "Increased quotas, including access to frontier models from OpenAI,
#   Claude, Gemini, and SpaceXAI, plus leading open source models" and "Full model availability"; Free has "Limited
#   model availability" ("SWE-2 Flash Medium is available on the Free plan. SWE-2 Flash High and Max require a paid
#   plan.", AI Models).
# - Scheduled tasks on Pro and Max: Automations start Devin sessions on "Recurring (cron-based) or one-time (run once)"
#   schedules (Automations), and "Automations and Devin Review are available on self-serve plans" (Self-serve plans);
#   they run Devin's cloud sessions, which Free doesn't include (the table's "Devin Cloud" rows).
# - Connects to: code editors (Devin Desktop is one; plugins for JetBrains and others) and MCP servers ("Cascade has a
#   variety of tools at its disposal, such as Search, Analyze, MCP, and the terminal"), and skills you make, on every
#   plan; on Pro and Max also the command line ("Devin CLI"), other apps ("Slack, Linear, and MCP integrations", Pro) and
#   the API (the table's "Devin API", drawn from the plan's quota).
# - Not stated by any page read: web search, memory across chats, reasoning models, projects, voice conversations (its
#   voice input only transcribes: "In its current form it can transcribe your speech to text."), image, video or audio
#   generation, office apps, deep research, early access (the table's "Access to early feature releases and research
#   previews" is Teams' and Enterprise's), where chats are kept. Its cloud agent's browser is a coding tool's own.
# - Developer: "It uses the Open VSX Registry for extensions" (Recommended Extensions).
# General features, read 2026-11-14: platforms: Devin Desktop for Mac, Windows and Linux (Install Devin Desktop) and
# Devin's web app (app.devin.ai). Sign-in: its sign-up page's "Continue with GitHub", "Continue with ChatGPT", "Continue
# with Google" and an email address, with a password ("Account Information Email address, password", its privacy
# policy). Support: "please reach out to us at support" (devin.ai/support). No page lists app languages (its
# documentation is translated, not the app), so none is listed. No pause (cancel only). No parental controls.
features:
  platforms: [windows, macos, linux, web]
  account.sign-in: [password, sso]
  support.channels: [email]

plans:
  - id: devin.free
    name: Free
