    perks: [cloud-agents, deepwiki, ask-devin, free-swe-2, concurrent-sessions-10, use-chatgpt-plan]
    notes: 'A daily and weekly usage quota shared by Devin Desktop, the Devin CLI and Devin’s cloud agents; usage past it is billed at API prices.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 20
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-14
        sourceUrl: https://devin.ai/pricing

  - id: devin.max
    name: Max
