# Terms and policies, read 2026-11-11 (M11.15) in Edge from Canada: its Terms & Conditions (hayu.com/terms, one version
# for every market, Universal Pictures Subscription Television Limited's, under English law), its sign-up form
# (hayu.com/signup: "By clicking 'Get one week free' I confirm that I am over 18 & I agree to Hayu's Privacy Policy"; it
# asks a first name, a last name, an email and a password, read from the form without typing), its help centre's 135
# articles, and NBCUniversal's Privacy Policy with its Cookie Notice and Your Privacy Choices page, rated once as a shared
# document (nbcuniversal-privacy, Hayu first; Peacock will share it). The terms include the Privacy Policy and Cookie
# Notice only, and "Promotion Terms" shown with an offer. Not read: the app stores', Amazon's, Sky's and the Australian
# partners' terms, which bill it themselves. Calibrated against Paramount+ and Sportsnet+.
# Its privacy policy is NBCUniversal's Hayu page (nbcuniversalprivacy.com/hayu, with its Cookie Notice and Your Privacy
# Choices), read 2026-11-11 with every section opened, rated here: Peacock's shared document rates the US policy page.
policies:
  links:
    - name: 'NBCUniversal Privacy Policy'
      url: https://www.nbcuniversalprivacy.com/hayu
    - name: 'Cookie notice'
      url: https://www.nbcuniversalprivacy.com/privacy/cookies
    - name: 'Your privacy choices'
      url: https://www.nbcuniversalprivacy.com/privacy/notrtoo
    - name: 'Terms and conditions'
      url: https://www.hayu.com/terms
    - name: 'Welcome (plans)'
      url: https://get.hayu.com/welcome
    - name: 'How do I unsubscribe from Hayu on Samsung TV?'
      url: https://support.hayu.com/hayuArticle?id=kA01p000000bmgcCAA&c=Devices_Partners&lang=en-CA
    - name: 'Can I change my subscription plan?'
      url: https://support.hayu.com/hayuArticle?id=kA04H0000001QEFSA2&c=Billing&lang=en-CA
    - name: 'How do you charge my account?'
      url: https://support.hayu.com/hayuArticle?id=kA0240000009pReCAI&c=Billing&lang=en-CA
    - name: 'How can I set up a PIN?'
      url: https://support.hayu.com/hayuArticle?id=kA04H0000005ceDSAQ&c=Audience_Protection&lang=en-CA
  ratings:
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'An account needs your first and last name, an email address and a password, and a paid plan your payment details. Its sign-up form asks for those, and nothing is checked.'
      sources:
        - url: https://www.hayu.com/terms
          quote: 'To register your account, you will be required to provide your first and last name, email address, password, and (if you are also subscribing to the Hayu Service) your billing information.'
      lastVerified: 2026-11-11
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 18 to subscribe, and it ends the account of anyone younger it finds. Its shows aren’t for children, and you can set a PIN to keep mature ones from them.'
