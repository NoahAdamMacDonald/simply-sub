# Owner (M11.2), read 2026-11-11: its help centre's About Hayu ("From NBCUniversal") and About NBCUniversal
# ("NBCUniversal is a subsidiary of Comcast Corporation."). Its terms are with Universal Pictures Subscription Television
# Limited, "a company registered in England and Wales", NBCUniversal's ("NBCUniversal (including all its brands, such as
# Hayu, under Universal Pictures Subscription Television Limited)", its privacy policy). Where it's from: NBCUniversal's
# headquarters, from its privacy policy. Comcast's shares: its investor site's shareholder FAQ (cmcsa.com, the owner's
# website here); its Class B shares hold "an undilutable 33 1/3% of the voting power", not a majority, so no
# majorityHolder.
owner:
  name: 'NBCUniversal, owned by Comcast Corporation'
  website: https://www.cmcsa.com
  page:
    name: 'About Hayu'
    url: https://support.hayu.com/hayuArticle?id=kA04H000000US45SAG&c=General&lang=en-CA
  quotes:
    - 'From NBCUniversal, Hayu is the first and only all-reality subscription video-on-demand streaming service of its kind'
  country:
    code: US
    page:
      name: 'NBCUniversal Privacy Policy'
      url: https://www.nbcuniversalprivacy.com/hayu
    quotes:
      - 'NBCUniversal is a global company and has its headquarters in the United States.'
    lastVerified: 2026-11-11
  stock:
    company: Comcast Corporation
    listings:
      - { exchange: Nasdaq, symbol: CMCSA }
    page:
      name: 'Shareholder services FAQs (Comcast investor relations)'
      url: https://www.cmcsa.com/shareholder-services/faqs
    quotes:
      - 'In addition to CMCSA, which trades on The NASDAQ Stock Market, Comcast has a Class B common stock, which does not trade publicly'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11

# Ways to pay (M11.5), read 2026-11-11: a payment card on hayu.com, or the app stores and partner platforms that bill it
# (its in-app article; Amazon's Prime Video Channels, "billed via Amazon"). No page names the card networks (a Maestro
# card works only with a 16-digit number), so no acceptedNetworks. Telstra, Optus SubHub and Fetch TV bill it to their
# Australian customers ("Telstra account billing is available to eligible Personal customers…", "FetchTV account
# billing"), whose words don't match the check for a phone or TV bill: noted, not listed. GCash, PayMaya, Smart and
# Globe are the Philippines'.
paymentMethods:
  - methods: [card, app-store]
    page: Can I subscribe via the mobile or TV app?
    url: https://support.hayu.com/hayuArticle?id=kA0240000005k9VCAQ&c=Devices_Partners&lang=en-CA
    quotes:
      - 'You can subscribe to the Hayu app using your payment card by visiting Hayu.com or via the app stores containing the Hayu app across mobile and TV devices.'
      - 'Please note, when you subscribe via a partner platform (iTunes, Google, Amazon, Roku, etc) your billing will need to be managed from these accounts.'
# Renewal day (M11.5): its billing article.
renewalAnchor:
  kind: same-date
  page: How do you charge my account?
  url: https://support.hayu.com/hayuArticle?id=kA0240000009pReCAI&c=Billing&lang=en-CA
  quotes:
    - 'hayu is a rolling monthly service and we will charge you every month on the date you signed up.'
    - "If your billing date is scheduled for a date that does not occur in a given month, you'll be billed on the last day of that month instead."
  lastVerified: 2026-11-11
freeUse:
  kind: none
  pages:
    - https://get.hayu.com/welcome
    - https://support.hayu.com/hayuArticle?id=kA0240000005k96CAA&c=Billing&lang=en-CA
  lastVerified: 2026-11-11

# Sign-in (2026-11-11): its sign-up form takes a name, an email and a password, "Or Sign in with Apple" (hayu.com/signup;
# its older help article still names Facebook and Twitter). No page names two-step sign-in. Platforms: "Hayu is
# available on web at Hayu.com and on mobile via iOS App or Android App and via a wide range of TV platforms", Xbox
# among them (Which devices can I use to watch shows on Hayu?). App languages: its welcome page's language versions
# (get.hayu.com/fr/welcome, /de/, /es/, /it/, /pt/ and two dozen more). Audio: "Currently, all content is provided in
# English only." (Do you offer content in any other languages?). Support: email ("please email us at support@Hayu.com",
# its terms) and its help centre's "Message Us" form.
features:
  platforms: [web, ios, android, tv, console]
  account.sign-in: [password, sso]
  languages.interface: [en, fr, es, de, it, pt]
  languages.audio: [en]
  support.channels: [email]

