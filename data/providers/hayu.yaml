# Researched by hand on 2026-11-11 (M11.15, streaming batch 6), read with Edge from Canada, its help centre's articles
# one by one in Edge (support.hayu.com, a Salesforce site), and the welcome page through a UK and an Australian exit to
# check the market pages. Pages, each quoted where it's used:
# Pricing: its help centre's "How much does Hayu cost?", one table of every market's "Monthly-rolling", "6-month
# rolling" and "12-month rolling" prices: "United Kingdom GBP£5.99 GBP£28.99 GBP£52.99", "Ireland €6.99 €33.99 €61.99",
# "Australia AUD$8.99 AUD$43.99 AUD$79.99", "New Zealand* NZD$10.99 NZD$53.99 NZD$97.99", "Canada CAD$7.99 (+
# applicable taxes) CAD$38.99 (+ applicable taxes) CAD$70.99 (+applicable taxes)", France, Spain and Italy "4.99 €
# 23.99 € 43.99 €", "Germany €4.99 Not Available Not Available", "Netherlands €6.99 €33.99 €61.99". Its welcome page
# (get.hayu.com/welcome) shows the same three cards for each market, "Auto-renews every month", "every 6 months" and
# "every 12 months", read for Canada (CAD$, "+ applicable taxes") and, with its market picker (?market=GB, ?market=IE…,
# whose page data names the market: data-market="GB", data-market-source="explicit_query"), for every other country
# here, and through a UK and an Australian exit (£5.99, AUD$8.99: the same). The 12-month plan is stored as a year,
# as Proton's "every 12 months" is. Canada's prices are before tax; its terms say "Subscription fees include VAT or
# other sales taxes, if applicable", but the price table, the prices' source, doesn't say so for the other countries,
# so no taxIncluded. New Zealand: "*New subscribers in New Zealand can access Hayu for $NZ10.99 per month. Existing
# subscribers are $NZ9.99 a month for a limited time.": NZ$10.99 is the regular price; the existing subscribers' price
# is a note.
# Region checklist, 2026-11-11: 1. no locale paths for prices (get.hayu.com/<language>/welcome are languages, not
# countries); 2. the welcome page's market picker (?market=), which names each market in its data; the US isn't one
# (?market=US falls back to the reader's own, "request_country"); 3. the market in the page's data; 4. the sign-up form
# (hayu.com/signup) read, nothing typed; 5. its help centre's price table, every market; 6. Edge, a plain fetch and two
# countries' exits agree; 7. no bill offered.
# Bundles: Sky's UK TV packages include Hayu ("Sky today announced that in a world-first, it is bringing together Disney+,
# HBO Max, Netflix and Hayu into a single Sky TV subscription.", Sky Group's announcement, skygroup.sky): a TV package,
# so telecom's, not listed; Sky also bills Hayu alone on Sky Glass and Sky Stream ("How can I sign up to Hayu via
# Sky?"). Its help centre's partner articles: Amazon's Prime Video Channels ("Amazon Prime Channelsis a standalone
# subscription billed via Amazon"), Telstra, Optus SubHub and Fetch TV in Australia, which bill it on their own
# accounts, and TV platforms that only carry the app (Rogers Ignite and Bell TV in Canada: "You can sign up to Hayu and
# get a free trial via Hayu.com/rogers"). Official resellers: none named on any page read; its promotional and voucher
# codes ("How do I subscribe with a promotional or voucher code?") are offers, not a shop.
# Features, read 2026-11-11: "We allow you to use one stream at any one time." (How many simultaneous streams can I
# have?), and its terms: "pair up to five (5) Devices on your account; stream Hayu Content on one (1) Device at a time";
# HD with no resolution ("you will be able to stream content in High Definition"), so 720p (HD), inferred as
# Crunchyroll's; ad-free ("Stream your favourite reality TV shows ad-free."); downloads "on iOS and Android smartphone
# and tablet devices", with no number of devices, so 1 (inferred); no profiles on any page; "Pausing subscriptions is
# not possible."; a 4-digit PIN for mature content ("How can I set up a PIN?"): parental controls. What it streams:
# "the first and only all-reality subscription video-on-demand streaming service of its kind" (About Hayu), but New
# Zealand's page sells it as "reality TV, blockbuster movies and iconic series" ("Flexible monthly access to reality TV,
# films and series"), so New Zealand's is a plan of its own, as Disney+'s US With Ads is.
# Free use: none: its pages sell the paid plans with a 7-day free trial for new users.

# Coverage: hayu.* in NO, SE, DK, FI, BE, LU, PT, CH, LT, EE, LV, PL, HU, CZ, AT, IS, TR, GR, RO, AL, BA, BG, HR, CY, MT,
# RS, SK, SI, ME, MK, AD, HK, SG and PH: sold there (its price table's markets), but outside the catalog's research
# regions, so not priced here; the same table prices them.

# Coverage: hayu.standard in NZ: New Zealand sells Hayu with films and series, hayu.new-zealand, instead (its New Zealand
# welcome page, read 2026-11-11).

# Coverage: hayu.new-zealand in CA, GB, IE, AU, DE, FR, NL, ES and IT: New Zealand's own version; the other markets'
# pages sell reality TV only (hayu.standard).

id: hayu
name: Hayu
website: https://www.hayu.com
# Its parent's privacy centre, where hayu.com's Privacy Policy link goes (nbcuniversalprivacy.com/hayu). Its sign-up
# site and help centre are subdomains (get.hayu.com, support.hayu.com).
