# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 1), read with Edge from Canada: nordpass.com's
# pricing page (its 2-year and 1-year plan views, its FAQ answers and offer notes), its personal plans, about, security
# and press pages; Nord Account's legal pages (my.nordaccount.com/legal/: the General Terms, Subscription Terms, NordPass
# Additional Terms, the General Privacy Policy, the NordPass Privacy Notice, the Cookie Policy and the Subscription
# Renewal Prices list); its help centre's articles through its Zendesk API (support.nordpass.com, a plain fetch); its
# trust centre (trust.nordpass.com). nordpass.com/plans/, /family-password-manager/, /download/ and its blog's audit posts
# showed Cloudflare's "Performing security verification" to Edge (headless and headed), a plain fetch and Mullvad
# Browser: not clicked through, so not read.
# Pricing: nordpass.com/pricing/ prices by where the visitor is; from Canada it names CA$. Personal plans are sold for 1
# or 2 years ("1-month plan (Business plans only)"). Both are first-term offers: "CA$45.48 CA$31.08 for the first 12
# months" and "CA$102.33 CA$48.33 for the first 27 months" (Premium), "CA$89.88 CA$56.28" and "CA$202.23 CA$86.13"
# (Family), the struck price the regular one. The Subscription Terms renew every plan of a year or longer "annually for
# one (1) year Renewal Periods", so only the yearly renewal price is stored, and no 2-year price (NordVPN's precedent).
# The yearly prices come from Nord's Subscription Renewal Prices list (my.nordaccount.com/legal/pricing/, "Last updated
# June 9, 2026"), which names each country's currency ("Canada", "Price in CAD", "NordPass Premium 1-year", "45.48") and
# matches Canada's pricing page (CA$45.48 and CA$89.88): the US US$35.88 and US$71.88, the UK £27.48 and £53.88, the
# "Euro zone" €35.88 and €71.88 (Ireland, Germany, France, the Netherlands, Spain, Italy), Australia A$49.08 and A$97.08,
# and New Zealand "Other countries" in USD, US$35.88 and US$71.88 ("For countries and regions where the local currency
# is not supported, Nord products are billed in U.S. dollars (USD)."). No page says its prices include tax ("All
# displayed prices do not include VAT.", the pricing page; "We will add the sales tax, VAT, GST/PST, or other mandatory
# tax", the list).
# Other countries' pricing pages: read through US, UK, Irish, Australian, New Zealand and euro countries' exits on
# 2026-11-19, they showed Cloudflare's check (the UK's page loaded with its prices still "Loading"), so each country's
# yearly prices are the list's (notes.md).
# Region checklist for CA and US, 2026-11-19: 1. no country paths (language paths only); 2. no country or currency
# picker; 3. Canada's page names CA$; 4. checkout not opened; 5. the renewal list names Canada's and the US's prices;
# 6. Edge from Canada; US exits met Cloudflare's check; 7. no bill offered.
# Plans: Free, Premium and Family. Teams, Business and Enterprise are business plans, left out.
# Bundles: none sold as a bundle of separate catalog plans: "you can add NordVPN to your security bundle with NordPass
# when you buy or upgrade your plan on your Nord Account" (the pricing FAQ) is a Nord Account checkout, and NordVPN's
# Complete and up include "Cross-platform password manager" (NordPass): a NordVPN plan, noted in notes.md.
# Official resellers: none for personal plans; its "NordPass distributors" and partner pages are for businesses.
# App stores (Apple, Google Play) bill it: partners, not listed.
# Free use: NordPass Free, a plan of its own, with a 30-day Premium trial.

id: nordpass
name: NordPass
aliases: [nord pass]
website: https://nordpass.com
# Nord Account (my.nordaccount.com) holds its terms, privacy policy and renewal price list.
domains: [nordaccount.com]
category: passwords
spendCategory: software
# Charged in the price list's currency: "The displayed prices are charged upon the automatic renewal of the
# subscription plans in the currency in which the first payment was made." and "For countries and regions where the
# local currency is not supported, Nord products are billed in U.S. dollars (USD)." (the renewal list).
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help article on cancelling ("Log in to your Nord Account." ... "Select the "cancel auto-renewal" to confirm.").
cancelUrl: https://support.nordpass.com/hc/en-us/articles/360002450037-How-to-cancel-my-subscription
sources: { pricing: https://nordpass.com/pricing/ }
# Ways to pay (M11.5), read 2026-11-19: its help article names cards, PayPal, Sofort (Klarna), Google Pay, Apple Pay,
# crypto and the app stores, and Nord's General Terms prepaid and gift cards. No NordPass page read names a card
# network (the pricing page's "What payment methods does NordPass support?" shows another question's answer), so no
# acceptedNetworks: the card shows "Card (networks not verified)".
paymentMethods:
  - methods: [card, paypal, klarna, google-pay, apple-pay, crypto, app-store]
    page: 'What payment methods do you accept?'
    url: https://support.nordpass.com/hc/en-us/articles/360002449077-What-payment-methods-do-you-accept
    quotes:
      - 'You can purchase a NordPass subscription with a credit card, debit card, PayPal, Sofort (Klarna), Google Pay, Apple Pay, or cryptocurrencies. In addition, you can make a payment through the Apple Store or the Google Play Store.'
  - methods: [gift-card]
    page: 'General Terms of Service'
    url: https://my.nordaccount.com/legal/terms-of-service/
    quotes:
      - 'Payments made using prepaid cards or gift cards will not be refunded if such refunds are not supported by the provider of the card.'
# Renewal day (M11.5, M11.21), read 2026-11-19: its Subscription Terms charge a yearly renewal "fourteen (14) days prior
# to the start of the Renewal Period" (the date you signed up a term on), but core's chargedBefore wording doesn't read
# "fourteen (14) days prior to the start", and no nordpass.com page says "up to 14 days before the renewal" as
# nordvpn.com's does, so it's not-stated here, with the same-date block for core in notes.md.
renewalAnchor:
  kind: not-stated
  pages:
    - https://my.nordaccount.com/legal/terms-of-service/subscription/
    - https://nordpass.com/pricing/
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19: its about page says "NordPass is developed by Nord Security"; the country is NordSec
# B.V.'s Amsterdam address in Nord's General Privacy Policy, as for NordVPN. Its General Terms are with nordvpn S.A. of
# Panama City (its NordPass Additional Terms' notice address: "nordvpn S.A." "Panama City, Republic of Panama"). Private:
# no page names a listing.
notes: Its terms are with nordvpn S.A., a company in Panama, part of Nord Security.
owner:
  name: Nord Security
  website: https://nordsecurity.com
  page:
    name: About us
    url: https://nordpass.com/about-us/
  quotes:
    - 'NordPass is developed by Nord Security, a company leading the global market of cybersecurity products'
  country:
    code: NL
    page:
      name: General Privacy Policy
      url: https://my.nordaccount.com/legal/privacy-policy/
    quotes:
      - "For the purposes of the GDPR, Nord's representative in the European Economic Area (EEA) is NordSec B.V. (email: representative@nordsec.com; postal address: Fred. Roeskestraat 115, 1076 EE Amsterdam, the Netherlands)."
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19

# General features, read 2026-11-19. Platforms: "The NordPass application is compatible with these operating systems:
# Windows 10 and up", "macOS 13 and up", "Linux: any system that supports snap 64-bit", "Android 9.0 and up", "iOS 18.0
# and up", and its extension for Chrome, Firefox, Opera, Edge and Safari (Operating Systems that support NordPass), and
# its web vault ("You can export items using the Desktop application (Windows, macOS, Apple Silicon macOS, Linux) or
# WebVault."). Sign-in: a Nord Account's email and Master Password, then "authenticator applications" or "a security key"
# (How to enable Multi-Factor Authentication), or Google ("If you are using Google to sign in to your Nord Account",
# Passkeys FAQs). Support: "NordPass provides 24/7 customer support via live chat and email" (no phone). App languages:
# "English", "Deutsch (German)", "Français (French)", "Italiano (Italian)", "Español (Spanish)", "Nederlands (Dutch)",
# "Lietuvių (Lithuanian)" (How to change NordPass language; Dutch and Lithuanian have no registry value). Open source:
# "No, NordPass is a closed-source software." (its personal page's FAQ). No pause; no parental controls (the Family
# plan's owner invites members to "six separate encrypted vaults").
features:
  platforms: [windows, macos, linux, android, ios, web, browser-extension]
  account.sign-in: [password, totp, security-key, sso]
  support.channels: [email, chat, 24-7]
  software.open-source: proprietary
  languages.interface: [en, fr, es, de, it]

# Password manager features, read 2026-11-19 on the pricing page's cards and the help centre:
# - Plans: "NordPass Free: This version only allows users to have one active session on one device." and "The Premium
#   version also offers additional security features, such as: Authenticator, Data Breach Scanner, Password Health,
#   Email Masking, Secure Item Sharing, File Attachments, Emergency Access" (Premium vs Free version of NordPass);
#   Family: "all the benefits of a premium subscription for six different accounts". The pricing cards' screen-reader
#   text says "Feature not included NordPass Authenticator" on Premium and Family, while their icon is the included
#   one and the help article (updated 2026-11-17) lists Authenticator as Premium's: the help article is taken
#   (notes.md).
# - Items: "passwords, passkeys, credit cards, personal information, secure notes, and other sensitive data" (What is
#   NordPass?), on every plan; Premium and Family add 2FA codes in password items ("Select the "Add Two-factor Code"
#   button.") and Email Masking ("generate masked email addresses").
# - Health: Password Health "indicates passwords that appear to be weak, reused, or old" and "checks both your saved
#   and new passwords against a database of publicly known, compromised passwords" (Premium and Family).
# - Sharing (Premium and Family): items with other users, with "the permissions granted", and links ("Link expires
#   after: 1 hour, 1 day, 7 days, 14 days, or 30 days.", "Can be viewed: up to 100 times or unlimited.").
# - Import: "LastPass: CSV", "Keeper: CSV, JSON", "1Password: CSV, 1PUX", "KeePass: CSV, XML", "Bitwarden: CSV, JSON",
#   "ProtonPass: JSON, ZIP", a "Spreadsheet" option (CSV), and on phones "Import from another app" ("For apps that don’t
#   support CXP, use the NordPass browser extension to import a CSV file."). No KDBX. Passkeys: "There is no option to
#   import or export NordPass passkeys to password managers."
# - Export: "Save the .CSV file on your device." (How to export passwords from NordPass?), every plan.
# - Emergency access: "available on desktop apps, Android apps, and Web Vault for NordPass Premium users (including
#   individual Premium and Family plans)".
# - Offline: "you can still access your items with Offline Mode even if you are not connected to a network" (view
#   only), every plan.
# - End-to-end: "NordPass encrypts all your data locally on your device before it’s uploaded to the cloud." (its
#   security page, "End-to-end encryption") and zero-knowledge (its privacy notice): the vault (passwords).
# - Authenticator (Premium and Family): 2FA codes added with "Enter code manually" or "Scan QR code" (otpauth). No page
#   read offers exporting the codes: authenticator.export is empty (notes.md).
# - Data Breach Scanner (Premium and Family): dark web monitoring.
plans:
  - id: nordpass.free
    name: Free
    link: https://nordpass.com/pricing/
    features:
      password-manager: true
      password-manager.item-types: [login, passkey, credit-card, identity, secure-note]
      password-manager.import: [csv, json, cxf, other-managers]
      password-manager.export: [csv]
      password-manager.emergency-access: false
      password-manager.offline: true
      authenticator.included: false
      encryption.end-to-end: [passwords]
    notes: 'Unlimited passwords, but logged in on one device at a time. No sharing, password health or breach alerts.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://nordpass.com/pricing/
