  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use ZEE5 and its ads, and what devices you use. To stop it, you email it to withdraw your consent.'
      sources:
        - url: https://www.zee5.com/global/privacypolicy
          quote: 'We collect information about you and your use of our service, your interactions with us and our advertising, as well as information regarding your computer or other device used to access our service (such as smart TVs, mobile devices, tablets, and certain streaming devices).'
        - url: https://www.zee5.com/global/privacypolicy
          quote: 'Withdrawing Consent: For withdrawing your consent at any time during your tenure with us, you may choose to do so by sending us an e-mail.'
      action:
        name: 'How to withdraw your consent'
        url: https://www.zee5.com/global/privacypolicy
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: poor
      reason: 'Using ZEE5 counts as agreeing to it sharing your information with other companies for marketing and ads. To stop it, you email it.'
      sources:
        - url: https://www.zee5.com/global/privacypolicy
          quote: 'By using ZEE5 you also consent to sharing of your Personal Information with third parties for marketing and advertising purposes.'
        - url: https://www.zee5.com/global/privacypolicy
          quote: 'Withdrawing Consent: For withdrawing your consent at any time during your tenure with us, you may choose to do so by sending us an e-mail.'
      action:
        name: 'How to withdraw your consent'
        url: https://www.zee5.com/global/privacypolicy
      lastVerified: 2026-11-09
    - topic: privacy.ads-tracking
      tier: neutral
      reason: 'Ad companies show you ads picked from what you do. You can turn that off in your account’s Preference Centre; you still see ads, just not picked for you.'
      sources:
        - url: https://www.zee5.com/global/privacypolicy
          quote: 'We use third-party advertising companies to serve personalised advertisements when you visit or use our website, mobile application or services.'
        - url: https://www.zee5.com/global/privacypolicy
          quote: 'you can turn off behavioural advertisement anytime by visiting the Preference Centre'
