# General features, read 2026-11-11: its help has a display-language setting without listing the languages, and
# zee5.com answers this machine "Access Denied", so only English is confirmed. No pause (its only pause is a UPI
# autopay in an Indian bank's app). Parental controls: "Create a 4-digit PIN" with age levels (How can I enable
# parental control?).
# Apps (the cross-category features), read 2026-11-09 in its help centre's supported devices: a computer's browser,
# Android and iPhone or iPad, and Android or Google TV, Samsung and LG TVs, Apple TV, Fire Stick and Chromecast.
features:
  platforms: [web, android, ios, tv]
  languages.interface: [en]

# Features, read 2026-11-09:
