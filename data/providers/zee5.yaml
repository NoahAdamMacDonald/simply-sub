# Terms and policies, read 2026-11-09 (M11.15): its global Terms of Use ("Last Updated: September 11, 2026", Z5X Global
# FZ LLC's), its privacy policy's part for users outside India (the part for India's users is ZEEL's, not rated), its
# help centre's articles on renewal, upgrades and downloads, and its sign-in page, which signs you up too. Its
# "Preferences" and "Do not Sell or Share my Personal Information" links open a consent manager behind the sign-in, not
# read: it asks you to sign in. Its terms say an account's username is "by using Your mobile number"; the global sign-up
# form takes a mobile number or an email address (Edge showed it email only once), and the form is what's rated. Its
# terms make what you post (comments) Z5X's: content rights aren't a streaming topic, as for the other streaming
# services, so no notable.
