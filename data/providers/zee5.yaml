# Researched by hand on 2026-11-09 (M11.15, the streaming category, batch 3, part 2): ZEE5's global service (Z5X Global
# FZ LLC's, zee5.com/global), read in Edge from Canada and through each other country's exit. Its plan page
# (zee5.com/global/myaccount/subscription) prices by where the visitor is, each country in its own currency, and its
# plans differ by country (the owner's choice of 2026-11-09: a plan of its own wherever the devices differ):
# - All Access ("All Access" in Canada, "Movies, Series, Live TV + KidZ + International Content" elsewhere): "4 Devices"
#   in Canada, the US, Ireland, Germany, France, the Netherlands, Italy and Spain, "3 Devices" in the UK and "2
#   Devices" in Australia and New Zealand;
# - KidZ ("Premium kids’ content"): "3 Devices" in Canada and the US, "2 Devices" elsewhere; none in Spain;
# - seven language packs (the cards "All content in Hindi, Punjabi, Bhojpuri", "Tamil Movies, Series, TV Shows, Live TV"
#   and so on for Telugu, Marathi, Bengali, Malayalam and Kannada), "3 Devices" each; none in Australia, New Zealand
#   or Spain.
# Each card's periods are its own: 1 month, 3 months (the UK and the euro countries) and 12 months, every period priced
# where it's sold (the owner's rule of 2026-11-09). Every card: "Live TV", "Best (4k)" and "Best (Dolby Atmos)"; the
# page: "Live TV streaming will include ads.4K plan is supported on 4K TVs and Connected devices only. Sports content is
# not available in 4k quality."
# Region checklist, 2026-11-09: 1. the global site has one address for every country (zee5.com/global); 2. no country
# or currency picker; 4. the plan cards, never past "Continue" (it asks to sign in); 6. Edge, through each country's
# exit. Its help centre is India's too (rupee examples), the only one it has.
# Bundles: none on its global pages. Resellers: none; its help centre's partners (Jio, Airtel, Vi, Tata Play) are
# India's, outside the catalog's regions.

# Coverage: zee5.all-access in GB, AU and NZ: sold there with fewer devices, as zee5.all-access-3-devices (GB) and
# zee5.all-access-2-devices (AU, NZ) (the plan page, 2026-11-09).

# Coverage: zee5.all-access-3-devices in CA, US, IE, DE, FR, NL, IT, ES, AU and NZ: the UK's All Access (2026-11-09).

# Coverage: zee5.all-access-2-devices in CA, US, GB, IE, DE, FR, NL, IT and ES: Australia's and New Zealand's All
# Access (2026-11-09).

# Coverage: zee5.kidz in GB, IE, DE, FR, NL, IT, AU and NZ: sold there on 2 devices, as zee5.kidz-2-devices; Spain's
# plan page lists no KidZ, so none in ES either (2026-11-09).

# Coverage: zee5.kidz-2-devices in CA and US: sold there on 3 devices, as zee5.kidz; and none in ES (2026-11-09).

# Coverage: zee5.hindi-punjabi-bhojpuri, zee5.tamil, zee5.telugu, zee5.marathi, zee5.bengali, zee5.malayalam and
# zee5.kannada in AU, NZ and ES: those countries' plan pages list no language pack (2026-11-09).

id: zee5
name: ZEE5
aliases: [zee 5, z5]
website: https://www.zee5.com
category: streaming
spendCategory: streaming
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    IT: EUR,
    ES: EUR,
    AU: AUD,
    NZ: NZD,
    GLOBAL: USD,
  }
cancelUrl: https://helpcenter.zee5.com/portal/en/kb/articles/how-do-i-cancel-auto-renewal-of-my-subscription
sources: { pricing: https://www.zee5.com/global/myaccount/subscription }
notes: Its global service; India's ZEE5 is a service of its own. A plan's devices and packs differ by country.
# Ways to pay, read 2026-11-09 in its terms: "online payments through Your credit card or debit card or net banking
# account or cash card", India's words for a bank transfer and a prepaid card, which no way to pay here names, and the
# app stores' and Roku's billing. No page names the card networks.
paymentMethods:
  - methods: [card, app-store]
    page: Terms of use
    url: https://www.zee5.com/global/termsofuse
    quotes:
      - 'online payments through Your credit card or debit card'
      - 'Apple In-App Purchase (IAP), Google In-App-Purchase (IAP), Amazon In-App-Purchase (IAP), Roku Pay'

# Owner (M11.2), read 2026-11-09 on its about page.
owner:
  name: Zee Entertainment Enterprises Ltd.
  page:
    name: About ZEE5
    url: https://www.zee5.com/global/aboutus
  quotes:
    - 'As the digital entertainment destination of Zee Entertainment Enterprises Ltd.'
    - 'Zee 5 is India’s largest homegrown video streaming platform and the global window for South Asian content, reaching viewers across 190+ countries.'
  country:
    code: IN
  lastVerified: 2026-11-09

# Renewal day (M11.5), read 2026-11-09: its terms and help centre say how to turn renewal off, not which day it renews.
