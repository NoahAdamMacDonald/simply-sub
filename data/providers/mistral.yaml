# Researched by hand on 2026-11-17 (the full catalog run, AI batch 1), read with Edge from Canada (mistral.ai/pricing with
# its USD and EUR tabs and each country of its EUR picker, its comparison table's ticks read from the page's own icons,
# the French version mistral.ai/fr/pricing, chat.mistral.ai's sign-in page, Vibe's documentation on docs.mistral.ai, the
# Legal Center on legal.mistral.ai), mistral.ai/pricing again through a US, a UK and an Australian exit, and with a plain
# fetch (its help centre, help.mistral.ai, every article of its collections; its legal notice; the App Store's pages).
# Pages, each quoted where it's used.
# Le Chat is now Vibe: "Le Chat has become Vibe, Mistral's unified agent for productivity and coding. Your account, plan,
# and conversations move with you." (Le Chat is now Vibe, 2026-08-12); chat.mistral.ai is still its address. So the
# provider is named as it's sold now, "Mistral Vibe" (the pricing page's "Get Mistral Vibe", "Does Mistral Vibe have any
# usage limits?"), found as Le Chat too (aliases), as Devin was for Windsurf (notes.md: the brief's id was `le-chat`).
# Pricing: mistral.ai/pricing's Pro card: "$14.99" "/mo" "Excluding taxes" on its USD tab, which every reader gets first
# (from Canada and through a US, a UK and an Australian exit alike, so one US-dollar list for everywhere), and on its EUR
# tab, a price with VAT for the country picked from its list (the EU's and the United Kingdom): France "17.99€", Germany
# "17.84€", Ireland "18.44€", the Netherlands "18.14€", Spain "18.14€", Italy "18.29€", the United Kingdom "17.99€", each
# "Including taxes". Its terms agree: outside the EEA "The prices of the Mistral AI Products are exclusive of taxes and
# Value Added Tax (VAT) or similar sales taxes will be added at the rate in force in your billing country on the date you
# subscribe to a Mistral AI Product."; in it "The prices of the Mistral AI Products are indicated "all taxes included"".
# Yearly: "For Pro and Team plans, you can choose between monthly or annual billing . Annual billing includes a 20%
# discount compared with monthly billing." (How can I upgrade or cancel my subscription?), but no page shows the yearly
# amount: it shows only at checkout, after signing in (chat.mistral.ai/upgrade/plans leads to the sign-in page), and the
# App Store pages list no in-app purchases. So Pro has monthly prices only; a 20% discount isn't computed (notes.md).
# Not listed: Team ("$24.99" "/user/mo", business), Enterprise, the Education plan ("Verified students can get Mistral
# Pro for $5.99 / month (normally $14.99)."; an eligibility-only offer, as Spotify's student plan), Mistral Studio's API
# (usage-billed).
# Region checklist, 2026-11-17: 1. mistral.ai/fr/pricing (French) shows the same "$14.99"; no country paths; 2. the
# page's USD and EUR tabs and the EUR tab's country picker (read for FR, DE, IE, NL, ES, IT, GB and AT); 3. the page's
# own text (the tick and dash icons read from its table cells); 4. checkout needs an account (the sign-in page); 5. the
# help centre's billing articles name no other currency; 6. Edge from Canada, through US, UK and Australian exits, and a
# plain fetch: all "$14.99"; 7. no bill offered.
# Bundles: none to list. French and Polish carriers bill Pro with their mobile plans ("Mobile carrier (Free Mobile,
# Orange, NJU): manage your subscription directly with the carrier."): partners that bill for it, not shops, and not
# listed as a way to pay (no page read names their countries, notes.md).
# Official resellers: none: no page names a shop that sells Pro.
# Free use: the Free plan ("Yes, Mistral’s Free plan provides limited access to Vibe, including our latest models, chat,
# search, creation, and Vibe for code for agentic coding in your terminal.").

id: mistral
name: Mistral Vibe
aliases: [le chat, le chat pro, mistral ai, mistral pro]
website: https://mistral.ai
# Its app (chat.mistral.ai), help centre (help.mistral.ai), documentation (docs.mistral.ai) and Legal Center
# (legal.mistral.ai) are all under mistral.ai.
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD, FR: EUR, DE: EUR, IE: EUR, NL: EUR, ES: EUR, IT: EUR, GB: EUR }
# Its help centre's How can I upgrade or cancel my subscription? (the Admin panel on the web, the App Store or Google Play
# in its apps, the carrier for a carrier's plan).
cancelUrl: https://help.mistral.ai/en/articles/455205-how-can-i-upgrade-or-cancel-my-subscription
sources: { pricing: https://mistral.ai/pricing/ }

# Ways to pay (M11.5), read 2026-11-17: Pro is sold on the web (its Admin panel's checkout, after signing in) and in its
# apps through Apple's and Google's billing. No page names the web checkout's methods ("the accepted means of payment are
# indicated on our pricing page", its terms, but the pricing page names none), so cards aren't listed and there are no
# acceptedNetworks (notes.md).
paymentMethods:
  - methods: [app-store]
    page: 'How can I upgrade or cancel my subscription?'
    url: https://help.mistral.ai/en/articles/455205-how-can-i-upgrade-or-cancel-my-subscription
    quotes:
      - 'iOS / Android app : use the App Store or Google Play.'

# Owner (M11.2), read 2026-11-17: its consumer terms name the company that provides Vibe, with its Paris address (its
# legal notice: "Mistral, a simplified joint stock company with capital of EUR 15,000"). Private: no page names a listing.
owner:
  name: 'Mistral AI'
  page:
    name: 'Terms of service (outside the EU)'
    url: https://legal.mistral.ai/terms/row-consumer-terms
  quotes:
    - 'The Mistral AI Products are provided by Mistral AI, a French limited joint-stock corporation, incorporated in Paris, under number 952 418 325, with VAT number FR95952418325, having its registered offices at 15 rue des Halles, 75001 Paris, France'
  country:
    code: FR
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its terms charge "on each periodic renewal as set forth in your order", and its
# help centre's billing articles don't say which day that is.
renewalAnchor:
  kind: not-stated
  pages:
    - https://legal.mistral.ai/terms/row-consumer-terms
    - https://help.mistral.ai/en/articles/455205-how-can-i-upgrade-or-cancel-my-subscription
    - https://help.mistral.ai/en/articles/392902-how-can-i-manage-my-subscription-on-mobile-ios-and-android
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on the pricing page: usage levels (not comparable, so perks: the comparison table's
# "Up to 6x free" messages, "Up to 5x free" web searches, "Up to 40x free" images, "Up to 15GB" of libraries and
# documents, "Unlimited" scheduled tasks against Free's "Up to 5"), and what Pro's card and table add that no feature
# describes.
perks:
  - id: more-usage
    name: More access and usage
  - id: faster-responses
    name: Faster responses
  - id: spreadsheets-and-slides
    name: Generate spreadsheets and slides
  - id: canvas
    name: Canvas
  - id: remote-coding-agents
    name: Remote coding agents
  - id: payg-credits
    name: Extend usage with PAYG credits

# AI features (the AI category's registry), read 2026-11-17 on the pricing page's table and Vibe's documentation, on both
# plans unless named:
# - Web search: the table's "Web searches" (Free ticked, Pro "Up to 5x free"); "Search the web" (Vibe Work's docs).
# - Reasoning: "a fast/think toggle switches between quick conversational responses and deeper, agentic workflows"
#   (Vibe's overview); Pro gets "more extended thinking and deep research reports" (the pricing FAQ).
# - Deep research: "Deep Research is the Deep Research Skill" (Get started with Work); more on Pro (the FAQ above).
# - Memory: "Knowledge saves what matters from your conversations so Vibe can recall it later." and "Knowledge is enabled
#   by default." (Knowledge).
# - Projects: "Projects are available on all plans." (Group tasks with Projects); the table's "Project folders".
# - Scheduled tasks: "Scheduled tasks let you run a prompt automatically at a future date or on a recurring schedule."
#   (Schedule tasks); the table's "Task scheduling" "Up to 5" on Free, "Unlimited" on Pro.
# - Image generation: the table's "Image generation" (Free ticked, Pro "Up to 40x free").
# - Coding agent: "Vibe Code is Vibe's coding mode. With read/write access to your filesystem, a shell, and a
#   configurable set of tools, it can read files, run commands, write code, and open pull requests on your behalf, under
#   your supervision." (Vibe Code); the table's "Use Vibe in the CLI, IDE, and remotely." ticked on both.
# - Connects to: the table's "Connectors (beta)" and "Custom MCP connectors (beta)" and "Skills" ("Create and load
#   instructions, tools, and scripts for specialized, repeatable tasks.") on both; "Vibe CLI" and "Vibe for IDE" on both;
#   an API on Pro only, with its monthly credits ("$25.5 /mo in API credits.", Pro's card).
# - Chats kept on its servers: "Input and output are maintained by default so you can see your conversation history in
#   the product ." (Can I delete a chat conversation?); Temporary Chat is an option, not where chats are kept.
# - Not on any page read: voice conversations ("Voice mode lets you start a task in Work using your voice instead of
#   typing. Your speech is transcribed into text that you can review, edit, and send as a prompt."; its "Talk with Work in
#   conversation mode" heading has no text under it, notes.md), code completion, computer use, models from other
#   companies, office apps (its own spreadsheets and slides are perks), video, music or voice generation, early access.
# General features, read 2026-11-17: apps: the table's "Vibe on web", "Vibe on mobile (iOS and Android)", and "Use Vibe
# Work in the desktop app for macOS and Windows. Linux support is coming soon." (Work on Desktop). Sign-in: a password
# and authenticator codes ("Any TOTP-compatible authenticator app can be used, such as Google Authenticator, Microsoft
# Authenticator, 1Password, 2FAS, Aegis, or Bitwarden.", How do I update my account information) and the sign-in page's
# Apple, Google and Microsoft buttons (icons only: its screenshot, saved). Support: the table's "Help center" on both and
# "Chat and email support" on Pro only. No pause or parental controls; app languages: no page lists them (its help
# centre's English, French and Italian are the help centre's own).
features:
  platforms: [web, ios, android, macos, windows]
  account.sign-in: [password, totp, sso]

