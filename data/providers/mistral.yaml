# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge: its Terms of Service for
# consumers outside the EU (Canada, the US, the UK and the rest) and for consumers in the EU (the EU's ratings below),
# which include its Usage Policy (the conduct it forbids: no topic worse than the terms); its Privacy Policy and Cookie
# Policy; the Additional Terms and the Connectors terms (business customers' and partners': not a consumer's); and the
# help centre's billing, refund, cancelling, training, retention, deletion, export, data location, security and support
# articles. Its apps' licence is the terms' own ("We grant you a non-exclusive right to access and use the Mistral AI
# Products solely in your personal capacity"). The sign-up page shows only an email field and sign-in buttons before an
# address is entered: its consent line wasn't read.
policies:
  links:
    - name: 'Terms of service (outside the EU)'
      url: https://legal.mistral.ai/terms/row-consumer-terms
    - name: 'Terms of service (EU)'
      url: https://legal.mistral.ai/terms/eu-consumers-terms-of-service
    - name: 'Privacy policy'
      url: https://legal.mistral.ai/terms/privacy-policy
    - name: 'Cancelling'
      url: https://help.mistral.ai/en/articles/455205-how-can-i-upgrade-or-cancel-my-subscription
    - name: 'Refunds'
      url: https://help.mistral.ai/en/articles/568728-refund-policy-eligibility-timing-and-how-it-works
    - name: 'Opting out of training'
      url: https://help.mistral.ai/en/articles/455207-can-i-opt-out-of-my-input-or-output-data-being-used-for-training
    - name: 'Training on your data'
      url: https://help.mistral.ai/en/articles/347617-do-you-use-my-user-data-to-train-your-artificial-intelligence-models
    - name: 'Who can see your conversations'
      url: https://help.mistral.ai/en/articles/347632-can-other-people-view-my-conversations
    - name: 'Selling or sharing data'
      url: https://help.mistral.ai/en/articles/347615-do-you-sell-or-share-my-data-for-marketing
    - name: 'Ads'
      url: https://help.mistral.ai/en/articles/347633-do-you-use-my-conversations-with-vibe-to-show-me-ads
    - name: 'Who owns input and output'
      url: https://help.mistral.ai/en/articles/347630-who-owns-input-and-output-in-vibe-and-mistral-s-apis
    - name: 'How long it keeps your data'
      url: https://help.mistral.ai/en/articles/347628-how-long-do-you-store-my-data
    - name: 'Deleting your account'
      url: https://help.mistral.ai/en/articles/347619-how-can-i-delete-my-account
    - name: 'Deleting a chat'
      url: https://help.mistral.ai/en/articles/347613-can-i-delete-a-chat-conversation
    - name: 'Exporting your data'
      url: https://help.mistral.ai/en/articles/347623-how-do-i-export-my-data-from-vibe
    - name: 'Where your data is stored'
      url: https://help.mistral.ai/en/articles/347629-where-do-you-store-my-data-or-my-organization-s-data
    - name: 'SOC 2 and ISO 27001'
      url: https://help.mistral.ai/en/articles/347638-do-you-have-soc-2-or-iso-27001-certification
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online at any time, and you keep your plan until the end of the period you paid for.'
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'You can cancel your paid subscription at any time via your account settings or the Help Center.'
        - url: https://help.mistral.ai/en/articles/455205-how-can-i-upgrade-or-cancel-my-subscription
          quote: 'You keep access to your current plan until the end of the billing period.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'You get your money back only if you cancel within 14 days of first buying on its website, not after a renewal. Otherwise you keep your plan to the end of the period.'
      sources:
        - url: https://help.mistral.ai/en/articles/568728-refund-policy-eligibility-timing-and-how-it-works
          quote: 'You can get a refund only if you cancel within the legal withdrawal window : 14 days from your initial purchase.'
        - url: https://help.mistral.ai/en/articles/568728-refund-policy-eligibility-timing-and-how-it-works
          quote: 'The 14-day withdrawal window applies only to initial purchases , not to renewals.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: great
      reason: 'It tells you at least 30 days before raising the price, and the new price starts only at a renewal after that, so you can cancel first.'
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'If we increase our prices, we will give you at least thirty (30) days’ notice and any price increase will take effect the next time your subscription renews following the notice period'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      tier: great
      reason: 'It has no free trial of its own. The free months some phone carriers give end on their own, with nothing to pay.'
      sources:
        - url: https://help.mistral.ai/en/articles/568728-refund-policy-eligibility-timing-and-how-it-works
          quote: 'Orange / NJU: the offer includes 6 months free, so there is no payment to refund during the free period. The subscription ends automatically at the end of the offer.'
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own, but not that it reminds you first.'
      pages:
        - https://legal.mistral.ai/terms/row-consumer-terms
        - https://help.mistral.ai/en/articles/455205-how-can-i-upgrade-or-cancel-my-subscription
      lastVerified: 2026-11-17
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms and billing help list no fees beyond the price and taxes.'
      pages:
        - https://legal.mistral.ai/terms/row-consumer-terms
        - https://help.mistral.ai/en/articles/568728-refund-policy-eligibility-timing-and-how-it-works
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: poor
      reason: "Outside the EU, disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only by emailing it within 30 days of agreeing to its terms."
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'YOU AND MISTRAL AI AGREE THAT ANY DISPUTE, CLAIM, OR CONTROVERSY ARISING OUT OF OR RELATING TO THESE TERMS, THE MISTRAL AI PRODUCTS, OR THE RELATIONSHIP THAT RESULTS FROM YOUR USE THEREOF, WILL BE RESOLVED EXCLUSIVELY BY BINDING ARBITRATION, RATHER THAN IN COURT'
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'You may opt out of this arbitration agreement by emailing us at support@mistral.ai within thirty (30) days of the date that you first accepted these Terms.'
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'YOU AND WE AGREE THAT EACH MAY BRING CLAIMS AGAINST THE OTHER ONLY IN YOUR OR OUR INDIVIDUAL CAPACITY AND NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY PURPORTED CLASS OR REPRESENTATIVE PROCEEDING.'
      action:
        name: 'How to opt out of arbitration (section 10)'
        url: https://legal.mistral.ai/terms/row-consumer-terms
      lastVerified: 2026-11-17
    - topic: legal.disputes
      regions: [FR, DE, IE, NL, ES, IT]
      tier: great
      reason: "In the EU, you can take a dispute to a court in your own country, under your country's law."
      sources:
        - url: https://legal.mistral.ai/terms/eu-consumers-terms-of-service
          quote: 'As an EEA consumer, you may bring claims before the courts of your country of residence, and such claims shall be governed by the substantive law of your country of residence.'
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: good
      reason: 'It tells you by email or in the app at least 30 days before a change to its terms that matters to you. If you disagree, you can leave.'
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'We will give you at least thirty (30) days advance notice of changes to these Terms that are expected to materially impact you either via email or an in-product notification.'
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'If you do not agree with the changes, you can terminate these Terms at any time'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: neutral
      reason: "It can close or suspend your account straight away if you break its rules, don't pay, a law makes it or you put others at risk. You can appeal, but its terms promise no refund."
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'We reserve the right to immediately suspend or terminate your Mistral AI account and/or your access to all or part of the Mistral AI Products if: (a) you breach these Terms or our policies (including our Usage Policy), (b) you fail to pay any fees when due, (c) to comply with applicable law, or (d) your continued use of the Mistral AI Products could cause risk or harm to Mistral AI, our users, or anyone else.'
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'If you believe we have suspended or terminated your account in error, you can file an appeal with us by contacting us via support@mistral.ai.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: good
      reason: 'What you put in stays yours. It may use it only to run and improve Vibe, for as long as that takes.'
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'You grant us a worldwide, non-exclusive, non-transferable (except as permitted in Section 12 (Assignment)), royalty-free, fully-paid license (with the right to sublicense to our delegates and subcontractors) to use Your Data for the purpose of (1) providing, maintaining and optimizing the Mistral AI Products'
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'each for the duration necessary to achieve the intended purposes.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: good
      reason: 'You own what Vibe makes for you, and Mistral won’t claim it.'
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'To the extent permitted by applicable law, as between you and Mistral AI, you (i) retain all ownership rights in Input and (ii) own all Output.'
        - url: https://help.mistral.ai/en/articles/347630-who-owns-input-and-output-in-vibe-and-mistral-s-apis
          quote: 'Mistral will not claim copyright over the output generated by you or your end users.'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: neutral
      reason: 'It can change Vibe with updates. If an update makes it much worse and there is no alternative, all you can do is leave.'
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'If an update materially impairs your use of the Mistral AI Products and we don’t provide an alternative, you may terminate these Terms as provided in Section 7 (Term, Suspension, Cancellation, and Termination), which is your sole remedy and ends your access to the affected Mistral AI Products.'
      lastVerified: 2026-11-17
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms and privacy policy say nothing about closing accounts that aren’t used.'
      pages:
        - https://legal.mistral.ai/terms/row-consumer-terms
        - https://legal.mistral.ai/terms/privacy-policy
      lastVerified: 2026-11-17
    - topic: legal.licence
      tier: neutral
      reason: 'You may use Vibe for yourself only, and may not take it apart unless the law lets you.'
      sources:
        - url: https://legal.mistral.ai/terms/row-consumer-terms
          quote: 'We grant you a non-exclusive right to access and use the Mistral AI Products solely in your personal capacity in compliance with these Terms'
