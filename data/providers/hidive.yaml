# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 in Edge from Canada. HIDIVE has no terms or privacy policy of its
# own now: its sign-up form's and footer's Terms of Use, Privacy Policy and Cookie Policy (amcnetworks.com's links,
# which lead to amcglobalmedia.com; www.hidive.com/privacy-policy leads there too, and /terms and /privacy are pages not
# found) are AMC Global Media's AMC Streaming Services Terms of Use, Privacy Policy and Cookies Policy (all "June 27,
# 2025"), which name HIDIVE and are rated once as shared documents (data/policies/amc-global-media-terms.yaml and
# amc-global-media-privacy.yaml, drafted in .pipeline/amc-plus). Rated here from HIDIVE's own pages: its sign-up page's
# first step (typing nothing) and its help centre's downloads article. Its help centre's billing articles hold the same
# as the shared terms (no refund for a trial that renewed, access to the end of the period; a trial cancelled early
# ends at once). Not read: the sign-up steps after the account form (the plan picker and checkout, whose payment form,
# in its page data, says "you allow Dice Technology LTD to charge your card for future payments in accordance with
# their terms": notes.md), the "Additional Terms" of its promotions, and the terms of the partners that bill it.
policies:
  shared: [amc-global-media-terms, amc-global-media-privacy]
  links:
    - name: 'Sign Up - HIDIVE'
      url: https://www.hidive.com/signup
    - name: 'How do I sign up for HIDIVE?'
      url: https://support.hidive.com/kb/guide/en/how-do-i-sign-up-for-hidive-sro3rVO5a4/Steps/4672741
    - name: 'How does offline downloading work?'
      url: https://support.hidive.com/kb/guide/en/how-does-offline-downloading-work-XNhqD8braY/Steps/4307580
  ratings:
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Signing up starts with an email address and a password you choose, then a plan and payment details, even for the free trial. The steps after the account form weren’t read.'
      sources:
        - url: https://www.hidive.com/signup
          quote: 'Confirm Password *'
        - url: https://support.hidive.com/kb/guide/en/how-do-i-sign-up-for-hidive-sro3rVO5a4/Steps/4672741
          quote: 'You will be able to add your email, a password and then select the membership plan that suits you.'
        - url: https://support.hidive.com/kb/guide/en/how-do-i-sign-up-for-hidive-sro3rVO5a4/Steps/4672741
          quote: 'requiring billing info as part of the trial sign-up process'
      lastVerified: 2026-11-13
    - topic: service.device-limits
      tier: neutral
      reason: 'You can keep up to 20 downloads at a time, and once you start watching one you have 48 hours to finish it.'
      sources:
        - url: https://support.hidive.com/kb/guide/en/how-does-offline-downloading-work-XNhqD8braY/Steps/4307580
          quote: 'You can only download 20 titles at a time'
        - url: https://support.hidive.com/kb/guide/en/how-does-offline-downloading-work-XNhqD8braY/Steps/4307580
          quote: 'Once you hit start in a downloaded title then you have 48hrs to watch'
      lastVerified: 2026-11-13
