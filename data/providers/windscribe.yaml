    - topic: security.practices
      tier: great
      reason: 'Outside security firms have checked its apps and servers and it publishes their reports. It pays rewards for security bugs, and it publicly told users when servers were seized in 2021.'
      sources:
        - url: https://windscribe.com/knowledge-base/articles/has-windscribe-been-audited
          quote: 'Yes, Windscribe has not only open-sourced our applications on Github , but has undergone several audits over the years for our applications and server software.'
        - url: https://windscribe.com/vdp
          quote: "Historically, we've paid out anywhere between $100 and $5000 for disclosed vulnerabilities."
        - url: https://windscribe.com/features/no-identifying-logs
          quote: 'July 2021 — Servers seized. We told on ourselves publicly. Then rebuilt everything.'
      lastVerified: 2026-11-19
