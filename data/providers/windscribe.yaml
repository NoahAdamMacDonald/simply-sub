# Resellers, read 2026-11-19 (BLUEPRINT §4.9): windscribe.com/resellers names MySecure Space GmbH, operating as
# SerialCart.com and SerialCart.de ("The companies below are official Windscribe Pro resellers."). SerialCart's
# Windscribe VPN Pro page (serialcart.com/buy/windscribe-vpn) sells voucher codes for "Unlimited Devices, 1 Year" and
# "Unlimited Devices, 2 Years", whose regular prices are in the page's variation data (51 € and 100.84 €, "excl. VAT";
# its "Limited Offer" of 39.99 € and 67.22 € is a sale, not stored). Its prices are in euros from Canada (Mullvad's
