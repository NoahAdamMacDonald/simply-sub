          quote: 'we store the transaction ID of your payment for a period of 30 days for fraud prevention purposes.'
        - url: https://windscribe.com/privacy
          quote: 'If for some strange reason you decide not to use our service anymore, the only piece of information that will remain is your username, password and email address (if you provided it).'
