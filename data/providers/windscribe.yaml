# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), read with Edge from Canada and with a plain
# fetch (curl) of the same pages, which windscribe.com serves whole: its upgrade (pricing) page, with the Build a Plan
# location picker its HTML holds, its features pages (/features and /features/<name>), its static IPs page, 74 help
# articles (windscribe.com/knowledge-base/articles/...), its terms of use, privacy policy, EULA, open-source
# attributions, transparency report, warrant canary, vulnerability disclosure policy, resellers, ethics, about and
# download pages, three blog posts (FreshScribe, the Greek court case, logging explained) and Packetlabs' audit report
# (a PDF its help article links on Google Drive); the upgrade page again through US, UK, German and Australian exits.
# Pricing: windscribe.com/upgrade ("Billed $9.00 USD every month", "Billed $69 USD every 12 months", "Billed $1.00 per
# location, per month"), the same in US dollars from Canada and through each exit: one US-dollar price list for
# everyone (GLOBAL USD). No page says the prices include tax.
# Region checklist for CA and US, 2026-11-19: 1. no country paths (one site, 18 language versions, the same prices); 2.
# a language picker only; 3. the page names "USD" beside every price; 4. the checkout needs an account (the Build button
# opens the sign-up form), so it wasn't opened; 5. the help centre's "How much does it cost to use Windscribe?" gives
# the same US-dollar prices; 6. Edge and a plain fetch from Canada, and Edge through US, UK, German and Australian exits:
# all the same; 7. no bill offered.
# Its individual plans: Free, Pro (monthly, yearly) and Build a Plan. ScribeForce (teams of 5 or more, "$5 per month
# per account") is a team plan, out of scope. Lifetime Pro is no longer sold ("as of about 2019 we are no longer selling
# these plans"). Static IPs and Build a Plan's unlimited data are add-ons.
# Build a Plan: one plan, "$1/location/mo, $3 min" (Free vs. Paid table). Its amount is the least anyone pays, the $3
# minimum ("Each one is $1 per month and adds 10GB on top of your allowed monthly bandwidth. $3 minimum.", the upgrade
# page's picker), with 3 locations' features (the review of 2026-11-19); the $1 a location, the 7-location maximum and
# the $1 "Unlimited Data + R.O.B.E.R.T" add-on are in its notes and add-ons (notes.md).
# Bundles: none (its Control D managed DNS is another company's product it links, and ScribeForce is for teams).
# Official resellers: its Official Resellers & Distributors page names one, MySecure Space GmbH, which "Also operates
# as" SerialCart.com and SerialCart.de (partner since November 2026): its offer is below. App stores (Apple, Google
# Play, Amazon) bill its apps' plans: partners, not listed.
# Sale (not stored): the Fuchsia Friday & Cyber Monday sale, "Get Pro for $29/year. Ends Nov 30th", which renews at
# that price for those who buy it; "Our annual plan is normally $69" (its sale page).

id: windscribe
name: Windscribe
aliases: [windscribe vpn]
website: https://windscribe.com
category: vpn
spendCategory: software
# Accepted cards, read 2026-11-19 in its help article on payment options, which lists "Visa", "Mastercard" and
# "American Express" for every buyer. Mastercard is left out: "As of December 8th, 2022, Mastercard has been declining
# all payments made to us for an unknown reason." (Unable to pay/renew with Mastercard, updated Oct 20, 2025).
acceptedNetworks:
  GLOBAL:
    networks: [visa, amex]
    url: https://windscribe.com/knowledge-base/articles/what-type-of-payment-options-do-you-accept
    quotes:
      - Visa
      - American Express
billingCurrency: { GLOBAL: USD }
# Its help article on cancelling: Subscriptions under Billing in My Account, or the app store that billed it.
cancelUrl: https://windscribe.com/knowledge-base/articles/how-to-cancel-a-paid-subscription
sources: { pricing: https://windscribe.com/upgrade }

# Ways to pay (M11.5), read 2026-11-19: its payment options article (cryptocurrency, PayPal, Visa, Mastercard, American
# Express, Paymentwall's local methods, and Apple, Google Play and Amazon billing on their devices), cash by post (1 year
# of Pro only) and its gift cards' voucher codes. Paymentwall, a processor offering "payment methods that are local to
# your country/region", is `other`.
paymentMethods:
  - methods: [crypto, paypal, card, other, apple-pay, app-store]
    page: 'What type of payment options do you accept?'
    url: https://windscribe.com/knowledge-base/articles/what-type-of-payment-options-do-you-accept
    quotes:
      - Cryptocurrency
      - PayPal
      - Visa
      - Paymentwall (Local Currencies)
      - Apple Pay, Google Play, and Amazon payments are also available on matching devices
  - methods: [cash]
    page: 'Can I pay for Windscribe with cash?'
    url: https://windscribe.com/knowledge-base/articles/can-i-pay-for-windscribe-with-cash
    quotes:
      - 'Yes. If you really want to, you can pay for Windscribe by mailing us cash.'
  - methods: [gift-card]
    page: 'How Do I Redeem a Windscribe Gift Card?'
    url: https://windscribe.com/knowledge-base/articles/how-to-redeem-windscribe-gift-card
    quotes:
      - Redeeming your Windscribe Gift Card is simple!
# Currencies (M11.5), read 2026-11-19: cash by post in nine currencies (its list also names "Zimbabwean dollars", a joke
# with no ISO code in use, left out), for "1 year of Pro only" at "$69 USD".
currencies:
  - codes: [USD, CAD, EUR, GBP, CHF, AUD, NZD, SEK, NOK]
    methods: [cash]
    page: 'Can I pay for Windscribe with cash?'
    url: https://windscribe.com/knowledge-base/articles/can-i-pay-for-windscribe-with-cash
    quotes:
      - '• USD • CAD • EUR • GBP • CHF • AUD • NZD • SEK • NOK'
# Renewal day (M11.5), read 2026-11-19: a plan renews on the day of the month you paid ("Garry starts a monthly
# subscription on Oct 5 - Starts on Oct 5 - Renews on Nov 5", My paid plan is ending soon). Paused subscriptions move
# their renewal date by the pause (How To Pause and Unpause a Subscription).
renewalAnchor:
  kind: same-date
  page: 'My paid plan is ending soon, can I renew it earlier/now?'
  url: https://windscribe.com/knowledge-base/articles/my-paid-plan-is-ending-soon-can-i-renew-it-earliernow
  quotes:
    - 'This will move your billing date forward by 4 days, as it will be the same day of the month as when you made your most recent payment.'
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19: its terms name Windscribe Limited, registered in Ontario, Canada. Private: "100% of the
# equity is owned by the three founders (Yegor Sak, Alex Paguis and Mark Ulicki) and Windscribe employees." (Who owns
# Windscribe?), and its about page says "we’re self-funded". No listing, so no stock.
owner:
  name: Windscribe Limited
  page:
    name: Terms of use
    url: https://windscribe.com/terms
  quotes:
    - 'those of Windscribe Limited., the owner of Windscribe, a company registered in the province of Ontario, Canada'
  country:
    code: CA
  lastVerified: 2026-11-19
notes: >-
  One price list in US dollars everywhere. Free needs no email or card; Build a Plan is a dollar a month for each
  location you pick (at least $3), and Pro unlocks every location. Every plan connects unlimited devices of your own.
  Its Black Friday sale ($29 a year for Pro, until November 30) renews at the sale price for those who buy it.

# General features, read 2026-11-19: apps for Windows, macOS, Linux, Android, iOS, the browser (Chrome, Firefox, Edge)
# and TV (its download page's Windows, MacOS, Linux, Android, iOS, Browser and TV tabs; Fire TV, Android TV and Apple TV
# in its footer); a username and password, with authenticator app codes ("With a TOTP (Time-based One-time Password)
# supporting 2FA application", How do I enable 2 Factor Authentication); support tickets ("A support ticket for refund
# requests or help with any issues can be submitted here") and its subreddit and Discord (Get in touch), and a chatbot,
# Garry, "available 24/7" (a bot, so not live chat or round-the-clock support); app languages from its language picker
# (عرب, 中文, Nederlands, English, Français, Deutsche, हिंदी, Italiano, Português, Русский, Svenska, Español, Türk, 日本語,
# Indonesia, 한국어, Tiếng Việt, ไทย). Open source: "All our apps are open-source, so you can see how everything works, no
# smoke and mirrors." (About), its footer's "Open Source" linking github.com/windscribe; its servers' code isn't
# published, so open-source apps. Pause on the paid plans: "Any Pro, Custom Build-A-Plan, Static IP, or ScribeForce
# subscription paid directly on our site by credit card (via Stripe) can be paused" for 1, 3, 6 or 12 months. No
# parental controls: R.O.B.E.R.T.'s porn and gambling lists are switches you set for yourself.
features:
  platforms: [windows, macos, linux, android, ios, browser-extension, tv]
  account.sign-in: [password, totp]
  support.channels: [email, community]
  software.open-source: open-clients
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, hi, ar]
sourceRepo:
  url: https://github.com/Windscribe
  page:
    name: About
    url: https://windscribe.com/about
  quotes:
    - 'All our apps are open-source, so you can see how everything works, no smoke and mirrors.'
  lastVerified: 2026-11-19

# VPN features, read 2026-11-19, on every plan unless named:
# - Devices: "No device or connection limits" (Unlimited Devices), for free accounts too ("Free accounts get the same
#   unlimited connection policy as Pro"), so `unlimited`; heavy use (dozens of devices) can get an account banned.
# - Countries: Pro "69+ countries, 135+ cities" (Free vs. Paid table; "Currently we offer servers in 69 different
#   countries worldwide, 10 of which are accessible to Free users", How many servers); Free's 10 (United States, Canada,
#   United Kingdom, Hong Kong, France, Germany, Netherlands, Switzerland, Norway, Romania). Build a Plan: "Pick up to 7"
#   locations, each a country in its picker ("United States 52 Pro Data Centers"), on top of the free locations ("This
#   includes all the Pro locations in your bundle as well as all the Free locations you already have access to."): its
#   price is the $3 minimum's 3 locations, so 13 countries (inferred), 17 with the most it sells.
# - Data (the registry's rule of 2026-11-19: `unlimited` where its pages say so): Free "10 GB/mo (2 GB no email)" (10 GB
#   with a confirmed email address, which comes with 1-2 promo emails a month); Build a Plan "10 GB per location bought",
#   "on top of your allowed monthly bandwidth", so 3 locations' 40 GB (inferred; its help article's example: "three
#   locations and has used 15GB of his 40GB"), unlimited with the add-on; Pro
#   "Unlimited". Never throttled ("Never" on every plan).
# - Protocols: "IKEv2", "WireGuard", "OpenVPN (UDP)", "OpenVPN (TCP)", "Stealth" (OpenVPN in a TLS tunnel) and
#   "WStunnel" (OpenVPN in a WebSocket), the last two for blocked networks (stealth); "All 6 protocols, 20+ ports" on
#   every plan.
# - Kill switch: its Firewall, "Blocks all connectivity outside the VPN tunnel to eliminate all types of leaks", and the
#   table's "Firewall (leak protection)" on every plan; split tunnelling the same ("Split tunneling" ticked on all three).
# - Multi-hop: Double Hop, "Proxy your connection through any 2 locations on the Windscribe network" (the desktop app and
#   the browser extension together). Its terms: "The free version is functionally similar to the paid plan, differing
#   only in bandwidth limits and location availability".
# - Blocking (R.O.B.E.R.T.): Free "Malware & Ads", Build a Plan (with its add-on) and Pro "All": Malware, Ad+Trackers,
#   Social Networks, Porn, Gambling, Fake News + Clickbait, Competitors and Crypto lists. Build a Plan without the add-on
#   keeps Free's.
# - P2P: "We do not prohibit Pro users from using our VPN for Peer-to-Peer (P2P) traffic, but P2P is disabled on our free
#   servers at this time." and "(for Build-a-Plan, P2P will work only on the servers you pay for)".
# - Port forwarding: Pro's ephemeral ports ("Build-A-Plan users do not have access to Ephemeral Port Forwarding"), and
#   static IPs' permanent ones (an add-on).
# - No-logs and audits: its privacy policy ("Historical record of VPN sessions", "Source IP" and "Sites you visited" are
#   "NOT stored"); Packetlabs' 2024 audit of its server stack ("Validation of the no-log policy to ensure end user
#   anonymity." was one of its two aims; its retest of June 24, 2024 found every logging issue remediated), Leviathan
#   Security Group's audits of its desktop app (September 2021) and its Android and iOS apps (March 2022) (Has Windscribe
#   been audited?): no-logs, servers and apps.
# - Anonymous sign-up: "We only require a username and password when you signup to our service." (privacy policy).
# - RAM-only servers: "All Windscribe physical servers use RAM-only (diskless) tech ." (Physical Servers) and
#   "Windscribe's entire infrastructure runs on RAM-only servers." (No Identifying Logs).
# - No mesh: none of its pages offers connecting your own devices to each other. No Tor servers: its Tor article is
#   about running the Tor Browser while connected. Static IPs are shared ("we offer static IPs instead where multiple
#   users are assigned the same IP"), never dedicated; the registry has no dedicated-IP feature (notes.md).
plans:
  - id: windscribe.free
    name: Free
    link: https://windscribe.com/signup
    features:
      vpn.included: true
      vpn.devices: unlimited
      vpn.unlimited-traffic: false
      vpn.data-allowance: 10
      vpn.server-countries: 10
      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.multi-hop: true
      vpn.content-blocking: [ads, trackers, malware]
      vpn.no-logs-policy: true
      vpn.independent-audits: [no-logs, servers, apps]
      vpn.anonymous-signup: true
      vpn.ram-only-servers: true
      vpn.mesh: false
    notes: >-
      10 GB a month once you add and confirm an email address (which gets one or two promotional emails a month), 2 GB
      without one. Locations in 10 countries, on shared free servers; P2P is off on them. More data for posting about it
      on X (5 GB) or referring friends (1 GB each).
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://windscribe.com/features/use-for-free

  - id: windscribe.build-a-plan
    name: Build a Plan
    link: https://windscribe.com/upgrade
    features:
      vpn.included: true
      vpn.devices: unlimited
      vpn.unlimited-traffic: false
      vpn.data-allowance: 40
      vpn.server-countries: 13
      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.multi-hop: true
      vpn.content-blocking: [ads, trackers, malware]
      vpn.p2p: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [no-logs, servers, apps]
      vpn.anonymous-signup: true
      vpn.ram-only-servers: true
      vpn.mesh: false
      account.pause: true
    inferred:
      vpn.server-countries:
        reason: 'Its $3 minimum buys 3 locations, each a country in its picker, which join the 10 free countries you keep: 13 countries, and up to 17 with 7 locations.'
        page:
          name: 'Does Build-a-Plan unlimited data apply to all locations?'
          url: https://windscribe.com/knowledge-base/articles/does-build-a-plan-unlimited-data-apply-to-all-locations
        lastVerified: 2026-11-19
      vpn.data-allowance:
        reason: 'Its $3 minimum buys 3 locations, and its help article’s example of a plan with 3 locations has 40 GB a month (10 GB for each, on top of the free 10 GB), unless you add unlimited data.'
        page:
          name: 'How do changes to my Build-a-Plan affect my data?'
          url: https://windscribe.com/knowledge-base/articles/how-do-changes-to-my-build-a-plan-affect-my-data
        lastVerified: 2026-11-19
    notes: >-
      Priced at its $3 minimum, 3 Pro locations (each a country you pick). Each location is $1 a month, up to 7
      ($7), and adds 10 GB a month to the free plan's data, or add Unlimited Data + R.O.B.E.R.T. for $1 a month
      (unlimited data on every location you can use, and all of R.O.B.E.R.T.'s block lists). The free countries stay.
      No port forwarding. Edits are refunded for the unused days and billed afresh, twice in 30 days at most.
    addOnIds:
      [windscribe.unlimited-data, windscribe.static-ip-datacenter, windscribe.static-ip-residential]
    prices:
      - region: GLOBAL
        currency: USD
        amount: 3
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://windscribe.com/upgrade

  - id: windscribe.pro
    name: Pro
    link: https://windscribe.com/upgrade
    features:
      vpn.included: true
      vpn.devices: unlimited
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 69
      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.multi-hop: true
      vpn.content-blocking: [ads, trackers, malware, adult-content, gambling, social-media]
      vpn.p2p: true
      vpn.port-forwarding: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [no-logs, servers, apps]
      vpn.anonymous-signup: true
      vpn.ram-only-servers: true
      vpn.mesh: false
      account.pause: true
    addOnIds: [windscribe.static-ip-datacenter, windscribe.static-ip-residential]
    prices:
      - region: GLOBAL
        currency: USD
        amount: 9
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://windscribe.com/upgrade
      - region: GLOBAL
        currency: USD
        amount: 69
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://windscribe.com/upgrade

# Add-ons, read 2026-11-19: Build a Plan's "Unlimited Data + R.O.B.E.R.T" ("You can also get Unlimited Data and full
# access to R.O.B.E.R.T. for $1 as well.", How much does it cost), and static IPs, "Datacenter Billed $24.00 USD every
