    - name: 'Ethics and philosophy'
      url: https://windscribe.com/ethics
    - name: 'How to delete your account'
      url: https://windscribe.com/knowledge-base/articles/how-to-delete-your-windscribe-account
    - name: 'Transparency report'
      url: https://windscribe.com/transparency
    - name: 'Can Windscribe be trusted?'
      url: https://windscribe.com/knowledge-base/articles/can-windscribe-be-trusted
