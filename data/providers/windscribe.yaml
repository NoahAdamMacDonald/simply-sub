# Terms and policies (BLUEPRINT §4.10), read 2026-11-19: its terms of use (updated August 5 2026), privacy policy
# (updated July 30 2024), EULA (updated January 4th 2018), the help articles on refunds, cancelling, deleting an account,
# selling data, free accounts' logs, debug logs, audits, devices and promo emails, its Free plan, No Identifying Logs
# and Unlimited Devices pages, transparency report, warrant canary, vulnerability disclosure policy and ethics page.
# Every agreement a user accepts (the owner's rule, 2026-11-03): the sign-up form says "By creating an account, you
# agree to our Terms & Conditions and Privacy Policy"; the terms include nothing by reference; its apps' EULA is on
# windscribe.com/terms/eula (rated below), and its open-source attributions (/terms/oss) list the GPL software its apps
# use (no topic). Its Android app's own privacy page (/privacy/android) wasn't needed for any topic.
policies:
  links:
    - name: 'Terms of use'
      url: https://windscribe.com/terms
    - name: 'Privacy policy'
      url: https://windscribe.com/privacy
    - name: 'EULA'
      url: https://windscribe.com/terms/eula
    - name: 'About'
      url: https://windscribe.com/about
    - name: 'Does Windscribe sell or share my data?'
      url: https://windscribe.com/knowledge-base/articles/does-windscribe-sell-or-share-my-data
    - name: 'Does the debug log contain personal info?'
