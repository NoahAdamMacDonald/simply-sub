        url: https://www.purevpn.com/cookies
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It doesn’t sell your data, but its apps use Meta’s pixel and its website lets ad networks place cookies to show you its ads elsewhere. You can only stop that in Meta’s settings or per browser.'
