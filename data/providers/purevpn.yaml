# VPN features, read 2026-11-19, the same on every plan:
# - Devices: "PureVPN offers the convenience of connecting up to 10 devices concurrently using a single account" (How
#   many devices); each Duo and Family member "can connect to PureVPN on up to 10 devices at the same time".
# - Data: "PureVPN does not put any cap on bandwidth or data usage per user; however, the use of the Service is subject
#   to fair usage." (terms), so unlimited, with the fair-use rule as a notable term below.
# - Countries: "Access 6,000+ servers in 80+ locations across 65+ countries." (servers page): 65.
# - Protocols: "WireGuard, OpenVPN, and IKEv2/IPSec are the modern options most people should consider first." (its
#   protocols page), and "Connect to specialized servers (obfuscated, quantum-resistant)." (servers page): stealth.
# - Kill switch on Windows, Mac and Linux, split tunnelling on Windows and Android (Learn about PureVPN features).
# - Blocking: every card's "Tracker & Ad Blocker" (ads, trackers); no malware list is named.
# - P2P: allowed on listed servers ("P2P/ File sharing is allowed with our service, but on the below mentioned shared
#   servers/countries."), not in the US, UK, Canada or Australia.
# - Port forwarding and dedicated IPs are paid add-ons, so not on the plans. No page offers multi-hop, Tor over VPN or
#   connecting your own devices to each other (vpn.mesh false).
# - No-logs and audits: its privacy policy's list of what it doesn't store; Altius IT's no-log audit, KPMG's ("KPMG
#   Validates PureVPN No-Log Claims", updated October 24, 2020, with an always-on audit clause), and its fourth no-log
#   assessment ("The assessment was performed on VPN servers and their supporting infrastructure, in different countries
#   between February 16 and February 22, 2023."), its auditor named only as "Well known audit firm" on its pages: no-logs.
#   No app or server security audit names an auditor or a report.
# - Not RAM-only: "PureVPN relies on hard disk servers protected with full-disk encryption, strict access controls, and a
#   verified no-logs policy" (its RAM-only servers guide).
# - Not anonymous: sign-up asks for "Name.", "Email address.", "Password." and "Payment method." (privacy policy).
# - Dark web monitoring on every plan: "We provide dark web monitoring services through SpyCloud to all PureVPN users and
#   subscribers. Standard and Plus plan users can monitor their email address and view the count of breaches associated
#   with this asset." (terms); Max adds phone, card, passport and ID numbers and breach details, and Data Removal (a
#   discovery scan of data brokers and removal requests: footprint and removal). Duo and Family get "all the VPN
#   features" (its family FAQ: the tracker and ad blocker too).
# - Speeds (notes only): "Experience high-speed, reliable connections via 20 Gbps speeds." (servers page).
# Plus and Max add the password manager ("Everything in Standard, with Password Manager"), read on its page: "Logins,
# Credit Cards, Bank Accounts, Crypto Wallets, WiFi Passwords, Passports, Secure Notes" and "Check your passwords for
# strength and vulnerability" (weak), with a "breach scanner that tells you if your passwords are exposed" (the pricing
# page's Max section: breached). No page describes sharing. Categories (M11.3): Plus and Max are also password managers.
