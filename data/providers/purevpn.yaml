# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with a plain fetch (the transparency report in Edge): its terms of
# service (effective 14 October 2016), privacy policy (last updated October 22, 2026), refund policy, cookies policy,
# vulnerability disclosure policy, trust center, no-log assessment page, password manager page and help articles. Every
# agreement a user accepts (the owner's rule, 2026-11-03): the checkout's line ("By proceeding with this purchase, you
# agree to our Terms of service, Renewal Prices and Privacy Policy."), so the renewal page too; its terms name "an
# end-user license agreement for the Software" but no page links one, so the terms' licence is rated; Max's eSIM is
# under Truely's "Supplemental eSIM Terms", whose link in the terms is empty, and Truely's privacy policy (truely.com),
# not read (notes.md); dark web monitoring runs through SpyCloud, whose own terms weren't read. Its privacy policy's
# Partner Program Notice is for business partners only (no topic).
