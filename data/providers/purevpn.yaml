    - name: 'How to delete my PureVPN account'
      url: https://support.purevpn.com/en_US/subscription-faqs/how-to-delete-my-purevpn-account
    - name: 'How to cancel auto-recurring payments'
      url: https://support.purevpn.com/en_US/billing/how-to-cancel-auto-recurring-payments
    - name: 'Billing FAQs'
      url: https://support.purevpn.com/en_US/billing-faqs/billing-faqs
    - name: 'How many devices can be connected'
      url: https://support.purevpn.com/en_US/subscription-faqs/how-many-devices-can-be-connected-to-purevpn-simultaneously
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It notes the day you connect and your internet provider’s name for support, and its website counts your visits with analytics cookies, which you can only block in your browser’s settings.'
      sources:
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'ISP Tracking (ISP Name and Routes) – We do NOT track or store your personal IP or exact location.'
        - url: https://www.purevpn.com/cookies
          quote: 'Analyse how you use PureVPN.com'
        - url: https://www.purevpn.com/cookies
          quote: 'You are free to change the settings in your browser and deny every incoming Cookie.'
