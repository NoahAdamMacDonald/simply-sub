    - https://www.purevpn.com/download/windows-vpn
    - https://www.purevpn.com/refund-policy.php
  lastVerified: 2026-11-19

# General features, read 2026-11-19. Platforms: its footer's apps (Mac, Windows, Linux, iPhone, Huawei, Android, Chrome,
# Firefox and Edge extensions, Android TV, Firestick TV, Apple TV, routers). Sign-in: an email and password, "Sign in with
# Apple" and "Sign in with Google" (its sign-in page), and two-factor codes by email ("Click Send One Time Code .", How to
# set up two-factor authentication). Support: "24/7 Live chat is here" (pricing page) and email (help@purevpn.com, its
# help articles). App languages: its site's language menu (Deutsch, Türkçe, Italiano, Español, Dansk, Português,
# Русский, Polski, Nederlands, ไทย, Svenska, 한국어, Suomi, العربية, Français, 中文, 日本語 and English; no Hindi). Closed
# source: "our proprietary VPN Software" (its terms). No pause, no parental controls.
features:
  platforms: [windows, macos, linux, android, ios, browser-extension, tv]
  account.sign-in: [password, email-code, sso]
  support.channels: [chat, email, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, ar]
  software.open-source: proprietary

