        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'Facebook Pixel – Please visit Facebook’s Privacy Policy here . You can stop the use of your data for the purpose of displaying Facebook ads by clicking here .'
        - url: https://www.purevpn.com/cookies
          quote: 'This is achieved by empowering our partners to show you our ads and ads relevant to what we offer on third-party platforms.'
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'PureVPN neither stores any user data nor sells or rents it out to any third party.'
      action:
        name: 'How to change your cookie settings'
        url: https://www.purevpn.com/cookies
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its website uses remarketing cookies to follow you with its ads, and they’re on unless you block cookies in each browser.'
      sources:
        - url: https://www.purevpn.com/cookies
          quote: 'To serve our advertising messages and offers'
        - url: https://www.purevpn.com/cookies
          quote: 'We have partnered with advertisers and have allowed their Cookies based on their stellar reputation and use of data.'
      action:
        name: 'How to change your cookie settings'
        url: https://www.purevpn.com/cookies
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: "Its privacy policy and terms don't mention AI or training models."
      pages: [https://www.purevpn.com/privacy-policy.php, https://www.purevpn.com/term.php]
      lastVerified: 2026-11-19
    - topic: privacy.content-access
      tier: great
      reason: 'Its password manager locks your vault so only you can open it: PureVPN can’t see your passwords.'
      sources:
        - url: https://www.purevpn.com/password-manager
          quote: 'Your data stays private – only you can access your passwords. We can’t see or retrieve any of your stored information.'
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your account details while you subscribe, and after that for its own business reasons with no time limit. A few things have set times, such as a dedicated IP (25 days) and data-removal details (30 days).'
      sources:
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'We retain this data until you remain our subscriber and actively use our App and Web App.'
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'NOTE: In the case of a Dedicated IP add-on purchase, a fixed and dedicated VPN IP is assigned to the user which remains in our records for 25 days after a subscription ends.'
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'For Data Broker Service and Removal, we delete or anonymise your details within 30 days after you stop using the feature or your subscription ends, whichever is earlier.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You email its support to have your account deleted. It doesn’t say how soon that happens.'
      sources:
        - url: https://support.purevpn.com/en_US/subscription-faqs/how-to-delete-my-purevpn-account
          quote: 'In order to get your account deleted from our database please contact us on this email help@purevpn.com and our support team will get back to you and help you out accordingly.'
      action:
        name: 'How to delete your PureVPN account'
        url: https://support.purevpn.com/en_US/subscription-faqs/how-to-delete-my-purevpn-account
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask by email for the data it holds about you. In Europe it answers within 30 days.'
      sources:
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'Right to Access: You can request access to the personal data we hold about you at any time.'
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'To exercise your rights under GDPR, please contact us at support@purevpn.com. We will respond to your request within 30 days.'
      action:
        name: 'How to ask for your data'
        url: https://www.purevpn.com/privacy-policy.php
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It publishes how many requests it gets each quarter and keeps no activity logs to hand over. It doesn’t say it needs a court order or that it tells you.'
      sources:
        - url: https://www.purevpn.com/vpn-transparency-report
          quote: 'We publish request volumes and explain how our no-logs policy shapes every response.'
        - url: https://www.purevpn.com/no-log-assessment
          quote: 'Although we receive numerous data requests each month, we have been unable to fulfill them due to our strict policy of not collecting or logging users’ online activity.'
      lastVerified: 2026-11-19
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data can be kept on servers in many countries. Data leaving Europe goes under the EU’s standard contract terms.'
      sources:
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'Our systems are spread across the globe, which means the stored data is traveling through servers in multiple locations which might or might not be in the customer’s country of residence.'
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'For transfer of personal data from the European Economic Area (EEA) to third countries we rely on Standard Contractual Clauses.'
      lastVerified: 2026-11-19
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Signing up asks for your name, an email address, a password and a way to pay. No phone number.'
      sources:
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'When you sign up with PureVPN, we will ask for the following information:'
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'No other information is collected or stored at signup.'
      lastVerified: 2026-11-19
    - topic: billing.cancellation
      tier: good
      reason: 'You turn off renewal online in your account, after it asks why and warns you against leaving.'
      sources:
        - url: https://support.purevpn.com/en_US/billing/how-to-cancel-auto-recurring-payments
          quote: 'You will be asked for the reason and then click continue cancellation.'
        - url: https://support.purevpn.com/en_US/billing/how-to-cancel-auto-recurring-payments
          quote: 'We strongly recommend against canceling your subscription if you value your online security.'
      lastVerified: 2026-11-19
    - topic: billing.refunds
      tier: neutral
      reason: 'You can get your money back within 31 days of first buying, by email. Renewals, crypto and app store payments aren’t refunded.'
      sources:
        - url: https://www.purevpn.com/refund-policy.php
          quote: 'If you aren’t satisfied with PureVPN’s service for any reason whatsoever, then you can claim a refund within 31 days of your initial purchaser.'
        - url: https://www.purevpn.com/refund-policy.php
          quote: 'The 31-day refund policy does not apply to renewal payments.'
        - url: https://www.purevpn.com/refund-policy.php
          quote: 'However, please note that some payment methods including Coinpayment, Google Play Store and Apple App Store do not support the refund option.'
      lastVerified: 2026-11-19
    - topic: billing.price-changes
      tier: neutral
      reason: 'It emails you before charging a new price, so you can turn off renewal first, but it doesn’t say how far ahead.'
      sources:
        - url: https://www.purevpn.com/subscription-renewal-plan
          quote: 'Keep in mind that prices are subject to change; however, we will notify you via email before being charged.'
        - url: https://www.purevpn.com/pricing
          quote: 'We’ll notify you before any price changes take effect, and auto-renew can be turned off anytime in your member area.'
      lastVerified: 2026-11-19
    - topic: billing.free-trials
      tier: poor
      reason: 'Its 7-day trial turns into the paid plan you picked unless you cancel first, with no reminder promised, and that first charge can’t be refunded.'
      sources:
        - url: https://www.purevpn.com/refund-policy.php
          quote: 'At the end of your trial, your subscription will automatically renew, and you’ll be charged based on the plan you selected during sign-up.'
        - url: https://www.purevpn.com/refund-policy.php
          quote: 'Please note that trial-based renewals are non-refundable.'
      lastVerified: 2026-11-19
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its plans renew by themselves, and its pages promise an email only before a price change, not before every renewal.'
      pages: [https://www.purevpn.com/subscription-renewal-plan, https://www.purevpn.com/term.php]
      lastVerified: 2026-11-19
    - topic: billing.fees
      tier: poor
      reason: 'Its terms let it add new charges or fees at any time, and its checkout warns that payment provider fees may apply, without saying how much.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'To introduce new charges, fees, or other conditions for use of the Service or parts thereof at any time;'
        - url: https://www.purevpn.com/family-plan/order
          quote: 'Payment provider fees may apply.'
      lastVerified: 2026-11-19
    - topic: billing.plan-changes
      status: not-stated
      reason: "You can upgrade in your account or through support, but its pages don't say whether you get credit for time you already paid for."
      pages:
        [
          https://support.purevpn.com/en_US/billing-faqs/billing-faqs,
          https://www.purevpn.com/term.php,
        ]
      lastVerified: 2026-11-19
    - topic: legal.disputes
      tier: neutral
      reason: 'A dispute goes to a private referee (an arbitrator) in the British Virgin Islands, not a court, with no way to opt out. Its terms say nothing about class actions.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'In the event that the dispute cannot be resolved, the Parties agree that it shall be resolved exclusively by binding arbitration in accordance with the substantive laws of the British Virgin Islands and shall be brought for arbitration in the British Virgin Islands.'
      action:
        name: 'Its dispute clause (its terms)'
        url: https://www.purevpn.com/term.php
      lastVerified: 2026-11-19
    - topic: legal.terms-changes
      tier: poor
      reason: 'It can change its terms whenever it likes, and the changes count as soon as they’re posted. Using it afterwards means you accept them.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'To modify, add to, suspend, or delete these Terms of Service or other agreements, in whole or in part, at our sole discretion at any time, with such modifications, additions, or deletions being immediately effective upon their posting to the Website.'
        - url: https://www.purevpn.com/term.php
          quote: 'Using our Services, even after any change in Terms, will mean that you agree to these Terms.'
      lastVerified: 2026-11-19
    - topic: legal.account-closure
      tier: bad
      reason: 'It can close your account at any time, for any reason, and isn’t bound to warn you. Its terms promise no refund.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'We may, in our sole discretion, limit or cancel a User Account for any reason whatsoever.'
        - url: https://www.purevpn.com/term.php
          quote: 'In the event that we make a change to or cancel an Account, we may attempt to notify you by contacting the e-mail and/or billing address/phone number provided at the time your Account was created; however, the failure to do so shall not result in any liability'
      lastVerified: 2026-11-19
    - topic: legal.content-rights
      status: not-stated
      reason: "Its terms and privacy policy don't say what rights it takes over what you keep in its password manager."
      pages: [https://www.purevpn.com/term.php, https://www.purevpn.com/privacy-policy.php]
      lastVerified: 2026-11-19
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or stop any part of the service, with or without warning, and you agree not to hold it responsible.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'If and when required, we may temporarily/permanently revise or discontinue all or any part of our Services, which might impact the way you use our Services, with or without notice.'
        - url: https://www.purevpn.com/term.php
          quote: 'You agree that you or any third party will not hold us liable for any such revision, suspension, or discontinuation.'
      lastVerified: 2026-11-19
    - topic: legal.inactivity
      status: not-stated
      reason: "Its terms and privacy policy don't say it closes accounts you haven't used."
      pages: [https://www.purevpn.com/term.php, https://www.purevpn.com/privacy-policy.php]
      lastVerified: 2026-11-19
    - topic: legal.licence
      tier: poor
      reason: 'Its apps are for your own personal use, and its terms forbid taking them apart (reverse engineering) without saying where the law allows it.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'When you register for an individual Account with us, we grant you a limited, non-exclusive personal, non-transferable license to use our Services and proprietary software.'
        - url: https://www.purevpn.com/term.php
          quote: 'You may neither reverse-engineer, modify, reverse-compile or decompile, disassemble, or copy the features and functions of our Software, nor may you charge anyone to use our Software.'
      lastVerified: 2026-11-19
    - topic: security.practices
      tier: good
      reason: 'Outside auditors check its no-logs setup, it holds ISO 27001, it pays for reported security bugs, and it published a Linux app problem in 2025. Its audit report is sent only to those who ask by email.'
      sources:
        - url: https://www.purevpn.com/trust-center
          quote: 'We have achieved the prestigious ISO 27001 certification after rigorous audits, ensuring our commitment to following the industry’s best practices and policies to protect your online activities from cyberthreats, unauthorized access, and other vulnerabilities.'
        - url: https://www.purevpn.com/vulnerability-disclosure-policy
          quote: 'An amount of upto $1500/- will be rewarded, at PureVPN’s sole and absolute discretion, resonating with the severity of the reported vulnerability.'
        - url: https://www.purevpn.com/blog/security-advisory-linux-client-ipv6-leak-firewall-rule-reset/
          quote: 'We were recently alerted to two issues in our Linux clients.'
      lastVerified: 2026-11-19
    - topic: service.activity-logging
      tier: neutral
      reason: 'It keeps no record of the sites you visit, your IP address or when you connect, and auditors checked that. It does note the day you connected and your internet provider, for support.'
      sources:
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'Day of connection (Date) – We do NOT track or store the time you connected to our services.'
        - url: https://www.purevpn.com/no-log-assessment
          quote: 'PureVPN does not log a user’s activities through the VPN after connecting to the VPN server'
      lastVerified: 2026-11-19
    - topic: service.account-sharing
      tier: bad
      reason: 'Its terms forbid two people sharing one account (a help article says otherwise). Its Duo and Family plans give each person an account of their own instead.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'It is strictly prohibited for users to distribute login information without our prior consent, and also for two people to share one Account;'
      lastVerified: 2026-11-19
    - topic: service.device-limits
      tier: good
      reason: 'Besides 10 devices connected at once, you may start up to 300 sessions a day; going over can get your account closed.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'Maximum allowed sessions are 300 per day, and exceeding this limit may result in permanent suspension or termination of your account, unless explicitly allowed by the company.'
        - url: https://support.purevpn.com/en_US/subscription-faqs/how-many-devices-can-be-connected-to-purevpn-simultaneously
          quote: 'You have the flexibility to install PureVPN on numerous devices, although you can only have 10 of them connected at the same time.'
      lastVerified: 2026-11-19
    - topic: service.software-control
      tier: good
      reason: 'Its apps update themselves, sometimes by force, and it says so. Its pages mention no other changes to your device.'
      sources:
        - url: https://www.purevpn.com/privacy-policy.php
          quote: 'We would like to notify our Users that there are times when we force update our App and Web-App to the latest version to ensure that our users get the best experience.'
        - url: https://www.purevpn.com/term.php
          quote: 'You hereby allow our Software and its updates to be installed on your computer/smart device/entertainment system.'
      lastVerified: 2026-11-19
    - topic: other.notable
      title: Unlimited data, with a fair-use rule
      tier: poor
      reason: 'It promises no data cap, but using far more than the average user for a long time breaks its fair-use rule, and it can suspend or close your account for that.'
      sources:
        - url: https://www.purevpn.com/term.php
          quote: 'PureVPN does not put any cap on bandwidth or data usage per user; however, the use of the Service is subject to fair usage.'
        - url: https://www.purevpn.com/term.php
          quote: 'PureVPN reserves the right to temporarily suspend or permanently terminate users found involved in unfair usage of its services;'
      lastVerified: 2026-11-19
