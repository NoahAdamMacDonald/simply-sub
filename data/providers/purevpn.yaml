# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), read with Edge from Canada and with a plain fetch
# (curl) of the same pages, which purevpn.com serves whole except its transparency report and member sign-in (read in
# Edge): its pricing page (its 2-year, 1-year and monthly views, and the order summary each card's button fills, read
# without typing anything), its Subscription Renewal Prices page, the Black Friday order page (/order), the family plan
# page (/family-plan/order), its about, trust center, servers, features, download, password manager, no-log assessment,
# vulnerability disclosure policy, cookies, transparency report and reseller program pages, its terms of service, privacy
# policy and refund policy, 33 help articles (support.purevpn.com/en_US/..., Helpjuice), and its blog posts on audits
# (Altius IT, KPMG, the fourth no-log assessment), RAM-only servers and the September 2025 Linux security advisory; the
# pricing page again through US, UK, German, Australian and Dutch exits.
# Pricing: the Subscription Renewal Prices page ("The prices shown on this page are in US dollars (before taxes)."): each
# plan's "1-month", "1-year", "2-year" and "5-year" renewal price. The monthly cards say "No Discount" and their order
# summary charges the same ("Monthly plan ($15.95/mo)"); the yearly cards are first-term offers ("Billed $143.40 $47.95 on
# purchase" for 16 months of Standard, which renews at $57.95), and the 2-year and 5-year deals (27 and 63 months first)
# renew yearly ("Billed $815.85 $93.87 for 63 months, then auto-renews at $47.95 annually"), so only monthly and yearly
# prices are stored, the yearly one the 1-year plan's renewal (notes.md: the 2-year and 5-year deals renew at $47.95,
# $69.95 and $84.95 a year instead). The same US-dollar prices from Canada and through US, UK, German, Australian and Dutch
# exits, and the German checkout added VAT to them in dollars: one list for everyone (GLOBAL USD). No price includes tax:
# "we’ll add the sales tax that applies in the country you selected" (the renewal page).
# Region checklist for CA and US, 2026-11-19: 1. its language paths (/de/, /es/, /fr/...) and Eng(CA) change only the
# language; 2. a language menu only; 3. its page data holds US-dollar prices (and euro, pound and krone figures no page
# shows); 4. the order summary, typing nothing: "$15.95", and the family checkout's "Payments are charged in USD."; 5. its
# renewal page names US dollars; 6. Edge and a plain fetch from Canada, and Edge through US, UK, German, Australian and
# Dutch exits: all the same; 7. no bill offered.
# Its individual plans: Standard, Plus and Max (the pricing page), and the family plans Duo (2 members) and Family (5
# members), each its own account. PureVPN for Teams, PureDome and white-label VPN are for businesses, out of scope.
# Add-ons (Dedicated IP, Port Forwarding, Dedicated IP + Port Forwarding, Dedicated Server, Residential Network, Multi
# Login) aren't stored: their prices change with the plan's length ("Dedicated IP" $5.99 a month on the monthly view,
# $2.99 on the 2-year family view, "Starting from $2.49/mo" on the servers page) and no page gives their renewal price
# (notes.md).
# Bundles: none; Max includes eSIM data from Truely (a perk) and the password manager (Plus and Max), its own.
# Official resellers: none named: its "VPN Resellers Program" is for businesses selling its service under their own
# accounts, and its pages name no shop. App stores bill its mobile plans (partners, not listed).
# Free use: none (below); a 7-day trial turns into the paid plan chosen.
# Owner: GZ Systems Limited (its terms), "a part of PureSquare" (its press room). Private: no page names a listing.

id: purevpn
name: PureVPN
aliases: [pure vpn]
website: https://www.purevpn.com
category: vpn
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help article on cancelling auto-recurring payments in the Member Area (app store purchases are cancelled in the
# store: How to cancel recurring payment from Google Play Store and iOS App Store).
cancelUrl: https://support.purevpn.com/en_US/billing/how-to-cancel-auto-recurring-payments
sources: { pricing: https://www.purevpn.com/pricing }
# Accepted cards, read 2026-11-19 in its payment article (updated July 10th, 2026). Its older payment processors table
# (February 16th, 2026) also lists Discover; the newer article is taken.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex]
    url: https://support.purevpn.com/en_US/billing/how-to-pay-for-purevpn-subscription
    quotes:
      - PureVPN accepts Visa, Mastercard, Amex, Virtual card.
# Ways to pay (M11.5), read 2026-11-19: its payment article (cards, PayPal, Paymentwall's local methods, which is `other`,
# and Coinpayment's crypto), the family checkout's Google Pay and Apple Pay buttons, its app store cancelling article,
# and its payment processors table (Alipay, iDeal and other local methods, through Paymentwall). Card and PayPal payments
# renew by themselves; Paymentwall and Coinpayment renewals are paid by hand ("Payments Payment wall and Coin payment are
# non-recurring so you need to pay the renewal invoice manually from your Member Area .").
paymentMethods:
  - methods: [card, paypal, other, crypto]
    page: 'How to pay for PureVPN Subscription'
    url: https://support.purevpn.com/en_US/billing/how-to-pay-for-purevpn-subscription
    quotes:
      - PureVPN accepts Visa, Mastercard, Amex, Virtual card.
      - Paypal is one of the commonly used payment processor. PureVPN accept payment from PayPal.
      - PureVPN supports multiple methods through the platform Paymentwall, so you may proceed to purchase the subscription with the easiest available option.
      - PureVPN accepts Bitcoin and other digital currencies via Coinpayment.
  - methods: [google-pay, apple-pay]
    page: 'Family plan'
    url: https://www.purevpn.com/family-plan/order
    quotes:
      - Pay for your purchase through Google Pay
      - Pay for your purchase through Apple Pay
  - methods: [app-store]
    page: 'How to cancel recurring payment from Google Play Store and iOS App Store'
    url: https://support.purevpn.com/en_US/subscription-faqs/how-to-cancel-recurring-payment-from-google-play-store-and-ios-app-store
    quotes:
      - 'Play Store: check this Google Play support article about subscription cancellation.'
      - 'App Store: Check this Apple support article about subscription cancellation.'
  - methods: [alipay, bank-transfer]
    page: 'Payment Processors: Refundable & Non-Refundable'
    url: https://support.purevpn.com/en_US/subscription-faqs/payment-processors-refundable-non-refundable
    quotes:
      - Alipay
      - iDeal
# Renewal day (M11.5), read 2026-11-19: plans "renew automatically at full price" at "the end of your chosen plan term",
# and its terms define the billing cycle by "the day when your account will expire"; no page says which day a renewal is
# charged on, so not-stated.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.purevpn.com/subscription-renewal-plan
    - https://www.purevpn.com/term.php
    - https://support.purevpn.com/en_US/billing/how-to-renew-a-purevpn-account
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19 in its terms of service, which name the company and its country. Its press room calls
# PureVPN "a leading consumer VPN service and a part of PureSquare", the group its co-founder Uzair Gadit runs as CEO
# (its fourth no-log assessment post). Private: no page names a listing.
owner:
  name: GZ Systems Limited
  page:
    name: Terms of Service
    url: https://www.purevpn.com/term.php
  quotes:
    - 'The Services are owned and operated by GZ Systems Limited (“Company”), doing business as ‘PureVPN’™, a British Virgin Islands limited liability company with a principal place of business located at Intershore Chambers P.O Box 4342, Road Town, Tortola, British Virgin Islands.'
  country:
    code: VG
  lastVerified: 2026-11-19
notes: >-
  One price list in US dollars everywhere, plus sales tax or VAT. The 1-year, 2-year and 5-year deals are first terms:
  the 1-year plan then renews yearly at the price stored, and the 2-year and 5-year deals renew yearly too, Standard and
  Max for less ($47.95 and $84.95). Duo and Family give 2 or 5 people their own accounts.

# Free use (the owner's item of 2026-11-09), read 2026-11-19: none. Its pricing page sells only paid plans, its Windows
# page says "PureVPN gives you the full Windows experience from the start" rather than a free plan, and its 7-day trial
# renews into the plan chosen ("At the end of your trial, your subscription will automatically renew").
freeUse:
  kind: none
