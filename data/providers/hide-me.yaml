      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.multi-hop: true
      vpn.content-blocking: [ads, trackers, malware, adult-content, gambling]
      vpn.p2p: true
      vpn.port-forwarding: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [no-logs]
      vpn.ram-only-servers: true
      vpn.mesh: false
    perks: [streaming-support, fixed-ip, bolt]
    notes: 'Every period renews at the price you paid ("Pricing Guarantee"). The 13- and 26-month plans are 12 and 24 months with one and two months extra. 3, 6 and 36 months exist only through a coupon link on its pricing page ($19.99, $29.99 and $119.99, which list at $50.00, $54.95 and $149.95 without it), so they aren’t stored. The Black Friday sale (16 months for $54.99, 30 for $69.99) isn’t stored.'
    prices:
