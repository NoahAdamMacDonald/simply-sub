# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), read with a plain fetch (curl) from Canada, which
# hide.me serves whole, and with Edge for its pricing page and checkout: its pricing, free VPN, about, network, features
# (no logs, kill switch, split tunnelling, StealthGuard, SmartGuard, multihop, port forwarding, protocols, Bolt), reseller
# and press pages, its terms of service (last update 25 August 2026) and privacy policy (effective 10th Jan 2023), 22
# help articles (hide.me/en/help/...), Securitum's no-log audit report and its 2025 transparency report (PDFs it links);
# its checkout (member.hide.me/en/checkout, its plans and order summary, typing nothing) from Canada, and its plan data
# through US, UK, Irish, German, French, Dutch, Spanish, Italian, Australian and New Zealand exits, the UK's and Germany's
# checkout pages read in Edge there too. Its sign-in page showed Edge Cloudflare's "Performing security verification",
# so it wasn't read; its help articles describe sign-in.
# Pricing: one Premium plan, "Pricing Guarantee: Your plan always renews with the same price and duration", so every
# period's price is what it renews at. Its checkout with no offer sells "Billed $11.99 monthly", "Billed $54.99 every 13
# months" (12 months plus "1 Month EXTRA") and "Billed $69.99 every 26 months" (24 plus 2): the three periods stored.
# 3, 6 and 36 months exist only through a coupon link (the pricing page's FAQ links them with coupon EWA-B7R-PLA, at
# $19.99, $29.99 and $119.99, "Renews at $19.99 every 3 months. Same price, always."); the same plans without the coupon
# list at $50.00, $54.95 and $149.95 ("Billed $50.00 every 3 months"), so a coupon price isn't their regular price and
# they aren't stored (the review, 2026-11-19). The pricing page's Black Friday cards (16 and 30 months for $54.99 and
# $69.99, utm_campaign "blackfriday2026") are a sale, not stored. The checkout's own
# data names each country's currency: US dollars in Canada, the US, Australia and New Zealand ("All amounts are shown in
# USD."), pounds in the UK ("All amounts are shown in GBP.") and euros in Ireland, Germany, France, the Netherlands, Spain
# and Italy ("All amounts are shown in Euro."), the same amounts everywhere, before VAT ("VAT may apply."; the UK's adds
# £2.40 to the month): GLOBAL USD, with the UK's and the euro countries' own prices.
# Region checklist for CA and US, 2026-11-19: 1. its language paths (/en/, /de/...) change only the language; 2. a
# language menu only; 3. the checkout's data ("currency":"USD" in Canada and the US); 4. the checkout's order summary,
# typing nothing ("VAT 0% · Canada", "All amounts in USD."); 5. no prices-by-country article; 6. a plain fetch and Edge
# from Canada, and the plan data through a US exit: the same; 7. no bill offered.
# Its plans: Free and Premium. Its mobile subscriptions bought in the app stores ("You can only use a Mobile subscription
# on your mobile devices") have no web price, so they aren't drafted (notes.md); Plus is "now retired". hide.me Business
# and the reseller program are for businesses, out of scope.
# Bundles: none. Official resellers: none named (its reseller program sells accounts to businesses that resell them under
# their own name, and its pages name no shop). App stores bill its mobile plans (partners, not listed).
# Free use: the Free plan, "Lifetime free VPN, not a trial".

id: hide-me
name: hide.me
aliases: [hide.me vpn, hideme, hide me]
website: https://hide.me
category: vpn
spendCategory: software
billingCurrency: { GLOBAL: USD, GB: GBP, IE: EUR, DE: EUR, FR: EUR, NL: EUR, ES: EUR, IT: EUR }
# Its help article on cancelling: in your account for its Paddle payments, the email link for Cleverbridge's, the store
# for app store purchases.
cancelUrl: https://hide.me/en/help/how-can-i-cancel-hide-me-subscription/
sources: { pricing: https://hide.me/en/pricing }
# Accepted cards, read 2026-11-19 in its payment methods article (last modified August 18, 2026); Diners Club is other.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, other]
    url: https://hide.me/en/help/which-payment-methods-do-you-support/
    quotes:
      - Credit card (Visa, Mastercard, Amex, Diners Club), PayPal, SEPA and SOFORT.
# Ways to pay (M11.5), read 2026-11-19: its payment methods article (cards, PayPal, SEPA and SOFORT bank payments, Apple
# Pay, Google Pay, cryptocurrencies and a manual bank transfer) and its refund article (the app stores).
paymentMethods:
  - methods: [card, paypal, bank-transfer, apple-pay, google-pay, crypto]
    page: 'Which payment methods do you support?'
    url: https://hide.me/en/help/which-payment-methods-do-you-support/
    quotes:
      - Credit card (Visa, Mastercard, Amex, Diners Club), PayPal, SEPA and SOFORT.
      - Apple Pay
      - Google Pay
      - Bitcoin, Dogecoin, Ethereum, Litecoin, Solana, KuCoin Pay, * Tether, * USD Coin.
      - We also accept manual payment via bank transfer.
  - methods: [app-store]
    page: 'Money-back guarantee - refund policy'
    url: https://hide.me/en/help/money-back-guarantee-refund-policy/
    quotes:
      - For purchases made through Google Play Store or Apple App Store, the respective store’s refund policies apply, and our general refund policy does not apply to these transactions.
# Renewal day (M11.5), read 2026-11-19: its terms bill "each 30, 180, 365, 730 or 1095 days depending on the duration of
# the selected plan", which core's wording doesn't read (it needs "30 days" together), and which predates the 13- and
# 26-month plans; its checkout bills "monthly". So not-stated here, with the every-30-days block in notes.md.
renewalAnchor:
  kind: not-stated
  pages:
    - https://hide.me/en/legal
    - https://hide.me/en/help/subscription-faq/
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19 in its terms, which name the company and its country; its help article calls it the
# "Parent Company: eVenture Ltd." Private: no page names a listing.
owner:
  name: eVenture Limited
  page:
    name: Terms of Service
    url: https://hide.me/en/legal
  quotes:
    - 'Hide.me websites, community forum and the hide.me VPN service is owned and operated by eVenture Limited. We are registered in Malaysia under registration number LL09685, and our registered office is at Unit 12F(1), Main Office Tower Financial Park Labuan, Jalan Merdeka 87000 Labuan, F.T. Labuan, Malaysia.'
  country:
    code: MY
  lastVerified: 2026-11-19
notes: >-
  A free plan with no data cap and no sign-up, and Premium for 1, 13 or 26 months, which always renews at the price you
  paid. US dollars in Canada, the US, Australia and New Zealand, pounds in the UK and euros in the euro
  countries, plus VAT where it applies.

# General features, read 2026-11-19. Platforms: its VPN apps menu (Windows, macOS, Linux; Android, iPhone / iPad and other
# phone systems; Apple TV, Android TV, Amazon Fire TV; Chrome, Firefox, Edge; routers). Sign-in: a username and password
# ("this will now enable the option to create a username and password", How to register), with authenticator codes
# ("Access your account if you lose your authenticator device", How to restore 2FA credentials). Support: "If you have any questions, please feel to contact our 24/7 support team either at
# support@hide.me or via live chat.", and its community forum (community.hide.me). App languages: its language menu
# (العَرَبِية, Čeština, Dansk, Deutsch, Ελληνικά, English, Español, Suomi, Français, Hrvatski, Magyar, Bahasa Indonesia,
# Italiano, 日本語, 한국어, Nederlands, Norsk, Polski, Português, Русский, Svenska, Türkçe, Українська, 中文; no Hindi).
# Open source: only its Linux client ("An open-source Linux VPN client", its company overview), so software.open-source
# is left out (NordVPN's precedent). No pause. No parental controls: SmartGuard's "optional filters" for gambling and
# adult content are settings you choose in your own app.
features:
  platforms: [windows, macos, linux, android, ios, browser-extension, tv]
  account.sign-in: [password, totp]
  support.channels: [email, chat, community, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, ar]

# Perks (M11.6): Premium's lines no feature describes, in its comparison table's and help article's words.
perks:
  - id: streaming-support
    name: Streaming Support
  - id: fixed-ip
    name: Fixed IP Address
  - id: bolt
    name: Bolt “Fast Proxy”

# VPN features, read 2026-11-19:
# - Devices: Premium "you can connect up to ten devices at the same time, regardless of the platform"; Free "Our free
#   VPN service allows you to connect one device at a time".
# - Data: "While free users used to get a monthly limit of 10 GB data transfer, this is no longer the case and both free
#   and paid subscribers have unlimited data transfer." (What is the difference between free and paid account?, March
#   13, 2026), and the comparison's "Unlimited data" for Free; its home page FAQ still says "you can use one device and
#   10 GB per month" (notes.md: the newer pages win). Free's speeds are limited ("you don't have unlimited speeds").
# - Countries: Premium's network page lists 83 locations in 57 countries (the pricing page's "92+ Locations / 2600+
#   Servers" counts cities; no page states a country count), Free "a choice of 7 server locations (Finland, France,
#   Germany, Netherlands, Switzerland, United Kingdom, United States)" (the comparison's "8 Locations" adds a second US
#   one).
# - Protocols: WireGuard, OpenVPN, IKEv2, SoftEther and SSTP (its protocols page); SoftEther's "state of the art SSL-VPN
#   protocol penetrates firewalls by tunneling the VPN traffic over HTTPS" and SSTP "gives you another way to connect when
#   networks block protocols such as WireGuard or IKEv2", on Free too: stealth.
# - Kill switch ("Similarly in our Desktop apps the feature is enabled by default."), split tunnelling (Windows, Android
#   and macOS): on both plans, since Free's "only limitations" are speed, locations and one device.
# - Premium only: Multihop ("hide.me VPN Multihop is only available for our Premium plan users."), SmartGuard ("blocking
#   ads, trackers, and malicious websites", with "optional filters" for "gambling to adult content"), dynamic port
#   forwarding ("This feature is not available in free and is only available in paid plan."), Bolt and streaming servers.
# - P2P: its standard servers are "for general browsing, privacy, P2P, and torrents" (not its streaming servers); for
#   Free, inferred, since its free locations are standard servers.
# - No-logs and audits: its privacy policy ("We do NOT keep logs of your VPN sessions, browsing behaviour, websites you
#   visit or any activity related to your VPN connection."); Securitum's "Audit of Hide.me’s no-log policy compliance"
#   (19.03.2024 – 06.06.2024, its report linked from the about page), after DefenseCode's of 2015: no-logs.
# - RAM-only: "RAM-only servers that do not store data on physical disks" (its company overview).
# - Anonymous sign-up: Free needs no email ("You do not even need to provide your email address or credit card details
#   when signing up for the FREE plan."); Premium asks for one ("When a customer signs up we request as little information as possible; a valid email
#   address.", its privacy policy).
# - No mesh, no Tor over VPN, no dedicated IP plan: none of its pages offers them.
# - Speeds (notes only): "Our European powerhouse with over 25Gbps speeds." (Frankfurt, its network page).
plans:
  - id: hide-me.free
    name: Free
    link: https://hide.me/en/free-vpn
    features:
      vpn.included: true
      vpn.devices: 1
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 7
      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.p2p: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [no-logs]
      vpn.anonymous-signup: true
      vpn.ram-only-servers: true
      vpn.mesh: false
    inferred:
      vpn.p2p:
        reason: 'Its standard servers allow P2P and torrents (only its Premium streaming servers don’t), and the free plan connects to standard locations; no page says so for Free in words.'
        page:
          name: 'Differences between hide.me VPN streaming, standard and multihop servers'
          url: https://hide.me/en/help/differences-between-hide-me-vpn-streaming-standard-and-multihop-servers/
        lastVerified: 2026-11-19
    notes: 'No email or card needed, no ads and no data cap. One device at a time, 7 countries (Finland, France, Germany, the Netherlands, Switzerland, the UK and the US), and slower speeds than Premium. It doesn’t renew by itself: you renew it in the app or your account from time to time.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: false
        lastVerified: 2026-11-19
        sourceUrl: https://hide.me/en/free-vpn

