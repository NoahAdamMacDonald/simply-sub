# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with a plain fetch: its terms of service (25 August 2026), privacy
# policy (10th Jan 2023, which includes its cookie section), the refund, cancelling, subscription, registration, devices,
# free plan and company help articles, its no-logs and about pages, Securitum's audit report and its 2025 transparency
# report. Every agreement a user accepts (the owner's rule, 2026-11-03): its terms (which hold its apps' licence, section
# 8) and its privacy policy; the checkout names no other ("Terms of Service", "Privacy Policy" and "Refund Policy" in its
# footer), and the terms include nothing by reference. Its payment companies' terms (Paddle, Cleverbridge) weren't read:
# they bill for it, and its own pages settle every topic. Its sign-in page wasn't read (a Cloudflare check). The company
# overview article grades no topic: its "VPN apps do not contain third-party trackers" is about the apps, while the
# privacy policy's third-party ad cookies on its website grade ads-tracking (the review, 2026-11-19).
policies:
  links:
    - name: 'Terms of Service'
      url: https://hide.me/en/legal
    - name: 'Privacy Policy'
      url: https://hide.me/en/privacy
    - name: 'What is the difference between free and paid account?'
      url: https://hide.me/en/help/what-is-the-difference-between-free-and-paid-account/
    - name: 'How can I cancel my hide.me subscription?'
      url: https://hide.me/en/help/how-can-i-cancel-hide-me-subscription/
    - name: 'Subscription FAQ'
      url: https://hide.me/en/help/subscription-faq/
    - name: 'Checkout'
      url: https://member.hide.me/en/checkout
    - name: 'Pricing'
      url: https://hide.me/en/pricing
    - name: 'Free VPN'
      url: https://hide.me/en/free-vpn
    - name: 'No logs policy'
      url: https://hide.me/en/features/no-logs-policy
    - name: 'Securitum no-log audit report (2024)'
      url: https://hide.me/downloads/Securitum_Hide.me_no-log-policy_20240607.pdf
    - name: 'Transparency report 2013-2025'
      url: https://hide.me/downloads/hide.me-transparency-report-2025.pdf
    - name: 'How many devices can be connected?'
      url: https://hide.me/en/help/how-many-devices-can-be-connected-to-hide-me-vpn-simultaneously/
    - name: 'How to renew free plan'
      url: https://hide.me/en/help/how-to-renew-free-plan/
    - name: 'Apps'
      url: https://hide.me/en/software
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Its apps send crash reports only if you agree, but its website records your visits and uses analytics cookies by default, which you can only refuse in your browser.'
      sources:
        - url: https://hide.me/en/privacy
          quote: 'With your consent we may collect anonymized crash reports and network diagnostics.'
        - url: https://hide.me/en/privacy
          quote: 'Analytics cookies. We may use analytics cookies to track information how the Service is used so that we can make improvements.'
        - url: https://hide.me/en/privacy
          quote: "If you'd like to delete cookies or instruct your web browser to delete or refuse cookies, please visit the help pages of your web browser."
      action:
        name: 'How to refuse its cookies (its privacy policy)'
        url: https://hide.me/en/privacy
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'The companies that run its service may use your data only for it, but its privacy policy lets other companies’ cookies on its website count visits and deliver ads. You can only refuse them per browser.'
      sources:
        - url: https://hide.me/en/privacy
          quote: 'These third parties have access to your Personal Data to the extent necessary to perform tasks on our behalf and are obligated not to disclose or use it for any other purpose.'
        - url: https://hide.me/en/privacy
          quote: 'In addition to our own cookies, we may also use various third-parties cookies to report usage statistics of the Service, deliver advertisements on and through the Service, and so on.'
      action:
        name: 'How to refuse its cookies (its privacy policy)'
        url: https://hide.me/en/privacy
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'No ads in its apps, even on the free plan. But its privacy policy lets other companies’ cookies on its website deliver ads, and you can only refuse them per browser.'
      sources:
        - url: https://hide.me/en/privacy
          quote: 'In addition to our own cookies, we may also use various third-parties cookies to report usage statistics of the Service, deliver advertisements on and through the Service, and so on.'
        - url: https://hide.me/en/privacy
          quote: "If you'd like to delete cookies or instruct your web browser to delete or refuse cookies, please visit the help pages of your web browser."
        - url: https://hide.me/en/free-vpn
          quote: "Unlike other free VPN services, we don't feed you ads to make money."
      action:
        name: 'How to refuse its cookies (its privacy policy)'
        url: https://hide.me/en/privacy
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: "Its privacy policy and terms don't mention AI. It keeps almost nothing about you."
      pages: [https://hide.me/en/privacy, https://hide.me/en/legal]
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: great
      reason: 'Its short connection log is wiped every few hours, and everything tied to your account is deleted when the account ends.'
      sources:
        - url: https://hide.me/en/privacy
          quote: 'The troubleshooting log gets securely erased every few hours.'
        - url: https://hide.me/en/privacy
          quote: 'Once a VPN service account is terminated on our network, all data associated with that VPN service account including the VPN service account itself is deleted from all of our systems.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: great
      reason: 'It holds little more than your email address, and you can delete your details in your account yourself; paid customers can even remove their email and keep using it.'
      sources:
        - url: https://hide.me/en/privacy
          quote: 'Whenever made possible, you can update or delete your Personal Data directly within your account settings section.'
        - url: https://hide.me/en/privacy
          quote: 'Customers with a paid plan are able to remove their email from our system and continue to use our service.'
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask by email for a copy of your data in a common format. It doesn’t say how soon it answers.'
      sources:
        - url: https://hide.me/en/privacy
          quote: 'You can request to obtain a copy of your Personal Data in a commonly used electronic format so that you can manage and move it.'
      action:
        name: 'How to ask for your data (its privacy policy)'
