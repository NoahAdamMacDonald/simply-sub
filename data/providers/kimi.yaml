# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge: the log-in dialog's "I agree
# to Terms of Service and Privacy Policy" and the pricing page's "By paying, you agree to the Terms of Service and
# Privacy Policy", both kimi.ai's (NOVASCENT PRIVATE LIMITED's) and both "apply to users located outside the mainland of
# the People's Republic of China". The privacy policy's US disclosures are part of it. The help centre's membership,
# account, memory, minor mode and deletion articles were read for billing, deletion and controls. Not rated: kimi.com's
# own Terms of Services, Privacy Policy and Paid Services Agreement (Beijing Moonshot Technology Co., Ltd.'s, for
# mainland China, saved under pages/); Kimi Claw's own privacy policy (a Pro and higher extra, not read); the Kimi Code
# Extra Usage Agreement (optional usage billing, not read).
policies:
  links:
    - name: Terms of service
      url: https://www.kimi.ai/user/agreement/modelUse?version=v2
    - name: Privacy policy
      url: https://www.kimi.ai/user/agreement/userPrivacy?version=v2
    - name: Cancel subscription
      url: https://www.kimi.ai/help/membership/membership-cancel-subscription
    - name: Plan changes
      url: https://www.kimi.ai/help/membership/membership-upgrade-downgrade
    - name: Account deletion
      url: https://www.kimi.ai/help/others/account-deletion
    - name: Memory tips
      url: https://www.kimi.ai/help/features/memory-tips
    - name: Signing in
      url: https://www.kimi.ai/help/others/device-management
    - name: Changing your phone number
      url: https://www.kimi.ai/help/others/phone-profile
  ratings:
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online whenever you like, but at least a day before it renews, or you pay for the next period. You keep it until the end of the time you paid for.'
      sources:
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'To avoid being charged for the next billing period, you must cancel at least 24 hours before the applicable renewal date, or earlier if required by the applicable Platform Provider.'
        - url: https://www.kimi.ai/help/membership/membership-cancel-subscription
          quote: 'You can cancel auto-renewal at any time. After cancellation, your membership benefits remain active until the end of the current billing cycle.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back, even for a year paid up front, but you keep using it until the end of the time you paid for.'
      sources:
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'Unless required by applicable law or expressly stated otherwise in these Terms, all payments are final and non-refundable, including fees paid for annual or other prepaid Subscription (as defined below) terms.'
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'If you cancel your Subscription, your access will remain active until the end of the then-current paid period, but you will not receive a refund or credit for any unused portion of that period.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: great
      reason: 'A new price never applies to time you’ve already paid for, and it tells you at least 30 days before a price goes up, so you can cancel first.'
      sources:
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'No price increase will apply during your then-current Subscription term. If a price increase applies to your Subscription, we will provide at least 30 days’ prior notice.'
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'You may cancel your Subscription before the end of your then-current term to avoid charges at the new price.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      tier: neutral
      reason: 'A free trial turns into a paid plan on its own unless you cancel before it ends, which you can do at any time, though you may lose access at once.'
      sources:
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'Unless otherwise stated at the time of sign-up, your free trial will automatically convert to a paid Subscription at the end of the trial period'
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'To avoid charges, you must cancel your free trial prior to the end of your free trial period. If you cancel during a free trial, your access may end immediately.'
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      tier: poor
      reason: 'It tells you about renewing when you buy, and reminds you before a renewal only where a law makes it.'
      sources:
        - url: https://www.kimi.ai/user/agreement/userPrivacy?version=v2
          quote: 'If you subscribe to a plan with automatic renewal, we will clearly notify you of the renewal terms at the time of purchase and, where required by law, again before renewal.'
      lastVerified: 2026-11-17
    - topic: billing.fees
      tier: neutral
      reason: 'New features may cost extra, and a new or higher fee applies only after it tells you. Extra usage beyond your plan is an optional pack you buy.'
      sources:
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'We may introduce new features or Services that are subject to separate or additional fees, and we may modify the fees for existing Services from time to time.'
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
          quote: 'Any new or increased fees will apply only after we provide notice and, where required, obtain your acceptance.'
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up starts at once and refunds the unused part of your old plan. To move down, you cancel and choose the cheaper plan when your paid time ends.'
      sources:
        - url: https://www.kimi.ai/help/membership/membership-upgrade-downgrade
          quote: 'Upgrades will be prorated and any unused portion of your current plan will be refunded.'
        - url: https://www.kimi.ai/help/membership/membership-upgrade-downgrade
          quote: "Downgrades can't be applied mid-cycle."
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: bad
      reason: 'Disputes go to a private referee (arbitration) in Singapore, not a court, you can’t join a class action, and there’s no way to opt out.'
      sources:
        - url: https://www.kimi.ai/user/agreement/modelUse?version=v2
