    name: Self-evolving skill

# AI features (the AI category's registry), read 2026-11-17 in kimi.ai's pricing page and help centre, on every plan
# unless named:
# - Web search, reasoning and voice: "Kimi is an AI assistant developed by Moonshot AI, with built-in web search, deep
#   thinking, multimodal reasoning, and ultra-long context conversations." and "Highlights: Photo problem-solving, voice
#   calls, translation, writing assistance" (Kimi overview).
# - Memory: "Memory: When enabled, Kimi can refer to Memory Space and past chats for relevant questions." (Kimi
#   overview); Dream Memory, the paid plans' research preview, is a perk.
# - Projects and scheduled tasks: the table's "Projects" (Free "2 projects", paid 20 or 100) and "Scheduled task" (Free
#   "2 tasks", paid 10 to 25).
# - Deep research: on the paid cards ("Deep Research"); Free's is inferred: "To check remaining credits, hover over the
#   Deep Research mode button to view your current free and paid remaining credits." (Deep Research FAQ).
# - Uses a browser or computer for you: its browser extension ("sign in with your Kimi account to chat directly and let
#   Kimi operate the current page for you", Kimi Browser Extension Introduction) and Kimi Work's computer use ("In Kimi
#   Work, with Kimi Computer Use, Kimi can click, type, scroll, drag, and read an app’s interface content or screenshots
#   on your desktop for you", What can Kimi do?), which no page limits to a plan.
# - Coding agent on the paid plans: "All current international plans — Plus, Pro, Max, and Ultra — include Kimi Code."
#   (Kimi Code membership benefits); the table's "Kimi Code" is ✗ on Free.
# - Image, video and music or voice generation on the paid plans: "Kimi can generate images, videos, and audio through
#   creative design plugins." (What can Kimi do?), and the table's "Plugins" row is ✗ on Free (notes.md).
# - Early access on the paid plans: "Upgrade to Kimi Membership to unlock faster models, higher concurrency, and more
#   powerful research preview capabilities" (pricing page, each paid card's "Research preview" list) and Kimi Code's
#   "Early access to experimental features".
# - Connects to: on every plan, its browser extension (Chrome and Edge); on the paid plans, plugins with MCP servers and
#   other apps ("The Kimi web experience currently supports MCP and Skills in plugins."; Kimi Work's "Use external apps
#   and services within Kimi, such as Canva, Notion, and WPS"), Kimi Code in VS Code and the command line, an API key
#   for other tools within the plan's quota ("Subscribers can also obtain an API Key to integrate Kimi Code's model
#   capabilities into third-party development tools and platforms.", its billing "Membership subscription,
#   monthly/annual payment, with rate limiting"), and plugins you build yourself ("In Kimi Work, you can use the
#   built-in Plugin Builder skill to turn a one-sentence idea, an external plugin repository, or any webpage into a
#   plugin of your own.").
# - Chats kept on its servers: "Memory is saved to your account." and chat history synced to your account.
# - None of these pages offers code completion as you type (Kimi Code's VS Code extension is a chat panel), Kimi's
#   assistant inside email or office apps (its plugins bring apps into Kimi), monthly API credits, or other companies'
#   models (K2.6, K3 and K3.1 Pro are its own).
# General features, read 2026-11-17: the web, iOS and Android ("Download the Kimi app for iOS, Android, or HarmonyOS."),
# its desktop client for Mac and Windows ("available in the "Work" mode of the Kimi desktop client (Mac / Windows)") and
# its browser extension ("Currently supports Chrome and Edge."). Sign-in: "on kimi.ai (overseas), accounts sign in with
# Google or phone" (Device Management), a phone number with a text code. App languages: kimi.ai's language menu
# (English, العربية, 简体中文, 繁體中文, Français, Deutsch, Bahasa Indonesia, Italiano, 日本語, 한국어, Português (Brasil),
# Русский, Español (Latinoamérica), ไทย, Türkçe, Tiếng Việt). Support: support@moonshot.ai and membership@moonshot.ai,
# "Human support (WeCom)" through its WeChat account, and its Discord and Reddit communities (How do I contact Kimi
# Support?). Parental controls on every plan: "Minor Mode (shown as Guardian Mode in the setup dialog) is a management
# tool for guardians." and "Guardian control: a guardian passcode is required to turn it on or off" (Minor Mode). No
# pause: cancelling is the only option its Cancel subscription article offers.
features:
  platforms: [web, ios, android, windows, macos, browser-extension]
  account.sign-in: [sms, sso]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, ar]
  support.channels: [email, chat, community]

