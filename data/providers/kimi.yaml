# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2), read with Edge from Canada: kimi.ai's home page,
# menus and log-in dialog, its pricing page (with the plan data the page loads) and help centre (kimi.ai/help: every
# article of Getting Started, Features, Agent Mode, Kimi Work, Plugins & Skills, Kimi Browser Extension, Deep
# Research, Membership and FAQ, and the Kimi Code and Kimi Claw overviews), its Terms of Service and Privacy Policy, and
# moonshot.ai's home and about pages; the pricing page again through US, UK and German exits. kimi.com, the address
# this task named, is Kimi for mainland China: its log-in dialog says "If you use Log in with Google, visit kimi.ai",
# kimi.ai's says "In mainland China, visit kimi.com", and kimi.ai's terms "apply to users located outside the mainland of
# the People's Republic of China. Users located within the mainland of the People's Republic of China should visit
# kimi.com and review the applicable terms of service." So this file is kimi.ai's, with kimi.com in its domains
# (kimi.com's own pages, read too, are saved under pages/ but not used for facts; notes.md).
# Pricing: kimi.ai/membership/pricing (Plus's "Billed monthly" $19 and "Billed annually $180") and its Pricing details article:
# "The current international plans are Plus, Pro, Max, and Ultra.", "prices are in USD", "Plus	$19/month	$180/year".
# The page's own data names "currency":"USD" and "useRegion":"REGION_OVERSEA" for every plan, the same from Canada and
# through US, UK and German exits: one US-dollar price list for everyone outside mainland China (GLOBAL USD). Its terms:
# "Tax-inclusive or tax-exclusive pricing will be indicated at the point of purchase.", which needs an account, so no
# price is marked tax-included.
# Region checklist, 2026-11-17: 1. no country paths (kimi.ai everywhere outside mainland China); 2. a language picker
# only (16 languages, the same prices); 3. the page's data names USD and REGION_OVERSEA, no country; 4. checkout needs an
# account (the log-in dialog: a phone number or "Continue with Google"); 5. the help centre's pricing articles, in USD;
# 6. Edge from Canada and through US, UK and German exits, all the same US-dollar list; 7. no bill offered.
# Its individual plans: Free, Plus, Pro, Max and Ultra (Business and the API's pay-as-you-go Open Platform are out).
# "Moderato, Allegretto, Allegro, and Vivace are legacy plans": no longer sold, so not listed (notes.md).
# Bundles: none found. Official resellers: none (its pages name no shop; its "Redeem" button takes gift codes from a
# Kimi membership a friend gave, "Gift your friend a Kimi Membership").

id: kimi
name: Kimi
website: https://www.kimi.ai
domains: [kimi.com, moonshot.ai]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
cancelUrl: https://www.kimi.ai/help/membership/membership-cancel-subscription
sources: { pricing: https://www.kimi.ai/membership/pricing }

# Ways to pay (M11.5), read 2026-11-17: a card or Apple's and Google's billing (Payment issues), and Apple Pay or Google
# Pay through its payment processors (its privacy policy; Stripe, which it also names, is a processor, not a way to pay).
# No page names the card networks.
paymentMethods:
  - methods: [card, app-store]
    page: 'Payment issues'
    url: https://www.kimi.ai/help/membership/membership-payment-issues
    quotes:
      - 'Review payment authorizations — Check your Apple ID, Google Play, or card settings for recurring Kimi charges'
  - methods: [apple-pay, google-pay]
    page: 'Privacy policy'
    url: https://www.kimi.ai/user/agreement/userPrivacy?version=v2
    quotes:
      - 'We use authorized third-party payment processors (such as Stripe, Apple Pay, or Google Pay) to process payments securely.'

# Owner (M11.2), read 2026-11-17: its help centre says Kimi is "developed by Moonshot AI", and moonshot.ai's about page
# (its menu and history are Kimi's: "Kimi is born") gives Moonshot AI's address in Beijing ("76 Zhichun Road, Haidian
# District, Beijing"). Its country is quoted from kimi.com's terms, mainland China's Kimi, whose "Moonshot AI" is
# Beijing Moonshot Technology Co., Ltd. at the same address (the about page names no country). Its kimi.ai terms are
# with NOVASCENT PRIVATE LIMITED, a company in Singapore that calls itself "Moonshot AI", for users outside mainland
# China; no page says how the two companies are related (notes.md). As for Kaspersky, the parent is the owner and the
# contracting company is in the notes. Private: no page names a listing.
notes: Its terms are with NOVASCENT PRIVATE LIMITED, a company registered in Singapore that calls itself Moonshot AI, for users outside mainland China.
owner:
  name: 'Moonshot AI'
  website: https://www.moonshot.ai
  page:
    name: Kimi overview
    url: https://www.kimi.ai/help/getting-started/overview
  quotes:
    - 'Kimi is an AI assistant developed by Moonshot AI, with built-in web search, deep thinking, multimodal reasoning, and ultra-long context conversations.'
  country:
    code: CN
    page:
      name: Kimi Terms of Service (mainland China)
      url: https://www.kimi.com/user/agreement/en/modelUse?version=v2
    quotes:
      - 'Kimi products and services are provided by Beijing Moonshot Technology Co., Ltd. and its affiliates ("Moonshot AI," "we," "us," or "our")'
      - "These Terms of Service apply to users located within the mainland of the People's Republic of China."
      - 'Office Address: 13th Floor, Building 1, JD Technology Tower, No. 76 Zhichun Road, Haidian District, Beijing'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its credits follow the billing cycle and refresh on the date you subscribed
# ("Credit update & usage rules"), which core reads as same-date (its "anniversary"). The two are one date because
# credits reset when you're billed: "Monthly refresh — Credits reset at the start of each billing cycle."
# (Membership plans overview). Ollama's credit reset, by contrast, is monthly on annual plans too, so it isn't the
# charge's day. Its terms say only that a subscription "will automatically renew for successive periods of the same
# length" (notes.md).
renewalAnchor:
  kind: same-date
  page: Credit update & usage rules
  url: https://www.kimi.ai/help/membership/update-rules
  quotes:
    - 'Cycle-based — Credits refresh on your subscription anniversary date, not the calendar month'
    - 'Wait for your credits to refresh at the next billing cycle'
  lastVerified: 2026-11-17

