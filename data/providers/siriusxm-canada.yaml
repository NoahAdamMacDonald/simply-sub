# The policies block for `siriusxm-canada` (Sirius XM Canada Inc.), to go after everything else in
# data/providers/siriusxm-canada.yaml. Sirius XM Canada is a company of its own, with its own Customer Agreement and
# Privacy Policy: the Sirius XM Privacy Policy (siriusxm-privacy) says it doesn't apply to "Services provided by Sirius
# XM Canada Inc.", so this block names no shared document. Plan ids weren't known when these were graded, so every
# rating is for every plan.
#
# Terms and policies, read 2026-11-11 (M11.15, the music category) in Edge from Canada: its Customer Agreement Terms
# ("Last Updated: August 1, 2026"; the footer's "Site Terms" link opens the same page), its Privacy Policy ("Last
# Updated: June 1, 2025"), the plans page and its app-only tab (offer details), its free trial page, its support
# centre's articles on cancelling and changing a subscription (their stable links redirect to a session page), and its
# account registration form. The app-only plan's sign-up shows the plan, then asks for the account only after Continue
# in its checkout, which wasn't opened. The French versions (siriusxm.ca/fr/conditions-generales) weren't read: the
# agreement says the English one governs. Not rated: rights over your content, its apps' licence and changes to your
# device (not topics for music; its software updates "cannot be disabled by you"). Quebec's own rules (the Consumer
# Protection Act) are named in reasons; per the procedure they change no grade. Calibrated against discovery+ Canada's,
# Crave's, Spotify's and Pandora's grades.
policies:
  links:
    - name: 'Customer Agreement Terms'
      url: https://www.siriusxm.ca/terms-and-conditions/
    - name: 'Privacy Policy'
      url: https://www.siriusxm.ca/privacy-policy/
    - name: 'Plans'
      url: https://www.siriusxm.ca/plans/
    - name: 'Start your SiriusXM trial'
      url: https://www.siriusxm.ca/trial/try-siriusxm/
    - name: 'Cancelling Your SiriusXM Service'
      url: https://listenercare.siriusxm.ca/prweb/PRServletCustomCA/help/SupportCenterExCA/article/KCP-4394
    - name: 'Register your account'
      url: https://care.siriusxm.ca/phx-wc/account/registration
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you listen to and where you are, for recommendations, research and other business. You can’t stop that; you can only refuse analytics and ad cookies on its sites.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'Likewise, you may not disable the collection of Listener Usage Data or Vehicle Radio Usage from your use of our online media player, our mobile applications, and Enabled Radios, as such data is necessary for SiriusXM to fulfil its reporting obligations under various copyright tariffs, for content recommendations, and for wireless data costs (as applicable).'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'The Sites and SiriusXM Streaming service will determine your location for the purposes of controlling access to certain content using your Internet protocol address, as well as for the purposes of research, analysis, product development and other business purposes.'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'Our Sites may allow you to opt out of cookies used for analytics and cookies used for advertising.'
      action:
        name: 'Its privacy policy (your choices)'
        url: https://www.siriusxm.ca/privacy-policy/
      lastVerified: 2026-11-11
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares data about you, under a code instead of your name, with ad companies to show you ads elsewhere, and Google may use your voice searches for its own purposes. You can limit only some of it.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'we share your pseudonymous information with ad servers and platforms, advertising agencies and other advertising entities to serve ads on the Sites, on the Services and on third-party websites.'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'We and Google/Service Provider may also collect and use voice data for the purposes set forth in our respective privacy policies, including quality assurance and to optimize the product and user experience.'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'You may learn more about this practice and your choices to limit uses of this pseudonymous information by third-party service providers at networkadvertising.org/choices.'
      action:
        name: 'Its privacy policy (your choices)'
        url: https://www.siriusxm.ca/privacy-policy/
      lastVerified: 2026-11-11
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It uses cookies and what you listen to for ads, its own and other companies’, on its sites and elsewhere. Turning that off is partial: each opt-out covers one browser or one device.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'Cookies also help us track visitors, track usage, conduct research, target advertising, and enhance and personalize the Sites and the Services to the interests of users.'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'We use this Listener Usage Data along with cookie information to enhance our Services for you, for troubleshooting and research, and for advertising of our Services and the services of third parties.'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'Also, mobile app opt-outs are limited to a specific device, while browser-based opt-outs are limited to a specific browser.'
      action:
        name: 'Its privacy policy (your choices)'
        url: https://www.siriusxm.ca/privacy-policy/
      lastVerified: 2026-11-11
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its terms and privacy policy don’t say whether what you say or type to it trains AI.'
      pages:
        [https://www.siriusxm.ca/privacy-policy/, https://www.siriusxm.ca/terms-and-conditions/]
      lastVerified: 2026-11-11
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information for “a limited period of time” after you stop using it, without saying how long.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'We may retain your personal information for a limited period of time after you cease using our Sites or Services for purposes of internal account management, to resolve disputes, enforce our Customer Agreement, technical and legal requirements and constraints related to the security, legal compliance, integrity and operation of the Sites and the Services.'
      lastVerified: 2026-11-11
    - topic: privacy.data-deletion
      tier: poor
      reason: 'Its privacy policy names no way to have your data deleted, and says what it collects during free listening can’t be deleted. You can write to its privacy officer.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'We cannot provide access to, stop the collection of, or delete the Listener Usage Data or Vehicle Radio Usage data which we collect from devices that are not associated with a trial or paying subscriber, or when you are using our Services during our “free listening” periods.'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'Our Privacy Officer may be contacted by email at privacy@siriusxm.ca or by postal mail at Sirius XM Canada Inc., 351 King Street East, Suite 1000, Toronto, Ontario, M5A 0L6.'
      action:
        name: 'Its privacy policy (contact its Privacy Officer)'
        url: https://www.siriusxm.ca/privacy-policy/
      lastVerified: 2026-11-11
    - topic: privacy.data-portability
      tier: poor
      reason: 'You can see much of your account information in My Account, or ask customer care, but it doesn’t offer a full copy you can take elsewhere.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'We give you access to a broad range of information about your account and your interactions with us in the “My Account” portion of siriusxm.ca.'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'You may also have access to the foregoing by contacting customer care by phone (1-888-539-7474) or email (care@siriusxm.ca).'
      action:
        name: 'Its privacy policy (access your information)'
        url: https://www.siriusxm.ca/privacy-policy/
      lastVerified: 2026-11-11
    - topic: privacy.government-requests
      tier: poor
      reason: 'It may hand over your information when a government asks, even without a court order. It doesn’t say it tells you, or publish how many requests it gets.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'We will disclose your personal information as long as we believe it is reasonably necessary to:'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'comply with any applicable law, regulation, legal process or governmental or regulatory request'
      lastVerified: 2026-11-11
    - topic: privacy.data-location
      tier: poor
      reason: 'Your information is kept in Canada and the US, and companies it hires can reach it from other countries, Morocco, Egypt, Tunisia and the Philippines among them. It doesn’t say how it’s protected when it moves.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'Personal information may be stored in Canada or with our Affiliates and Service Providers in Canada and the United States, where it will be subject to the legal regimes of those jurisdictions and may be disclosable to others as required by local laws, including to government, law enforcement, or participants in court proceedings.'
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'Personal information may be accessed by our Service Providers in countries including Canada, the United States, Morocco, Egypt, Tunisia and the Philippines.'
      lastVerified: 2026-11-11
    - topic: privacy.sign-up-data
      tier: poor
      reason: 'Registering your account online asks for your name, email, phone number and postal code.'
      sources:
        - url: https://care.siriusxm.ca/phx-wc/account/registration
          quote: 'Last Name'
        - url: https://care.siriusxm.ca/phx-wc/account/registration
          quote: 'Phone Number'
        - url: https://care.siriusxm.ca/phx-wc/account/registration
          quote: 'Postal Code'
      lastVerified: 2026-11-11
    - topic: privacy.children
      tier: neutral
      reason: 'Only adults can subscribe, and Family Friendly plans leave out mature channels, but the app can’t block channels. Its privacy policy doesn’t say how it treats children’s data or ads.'
      sources:
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'You must be at least the age of majority in your province or territory of residence to purchase a Subscription.'
        - url: https://www.siriusxm.ca/plans/
          quote: 'Yes, when you order a Family Friendly version of a plan, the mature channels are excluded.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Channel blocking is not available with the Streaming Service; therefore, it is your responsibility to impose listening restrictions that you consider appropriate on others.'
      lastVerified: 2026-11-11
    - topic: security.practices
      tier: poor
      reason: 'It describes its security in general terms, and names no audit or way to report a security flaw.'
      sources:
        - url: https://www.siriusxm.ca/privacy-policy/
          quote: 'We use a combination of security measures to safeguard the confidentiality of the personal information you provide us.'
      lastVerified: 2026-11-11
    - topic: billing.cancellation
      tier: poor
      reason: 'Car plans cancel only by calling or chatting with its staff, who want to sort out your reasons first. The app-only plan cancels online in your account.'
      sources:
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'All Subscriptions may be cancelled by phone by directly calling the phone number below:'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Streaming (App-Only) Subscriptions may be cancelled any time (except for scheduled or emergency maintenance) by logging into your account at www.siriusxm.ca/myaccount and following the cancellation instructions.'
        - url: https://listenercare.siriusxm.ca/prweb/PRServletCustomCA/help/SupportCenterExCA/article/KCP-4394
          quote: 'If you wish to cancel for any other reason, please contact us as we would like to understand and resolve any issue you may have had.'
      action:
        name: 'Cancelling Your SiriusXM Service'
        url: https://listenercare.siriusxm.ca/prweb/PRServletCustomCA/help/SupportCenterExCA/article/KCP-4394
      lastVerified: 2026-11-11
    - topic: billing.refunds
      tier: neutral
      reason: 'Cancel within 15 days of starting and you get your money back. After that there’s no refund for part of a period, but you keep listening to its end. Quebec and Newfoundland refund unused time.'
      sources:
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'If you cancel a monthly billed Subscription within fifteen (15) days of the start date of your Subscription, your Subscription will terminate immediately and any fees paid are eligible for a full refund, if requested.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Your Subscription will remain active until your cancellation becomes effective at the end of your current Subscription Period (i.e., billing period), and no refunds or credits will be given for any partial period, except as provided below or as required by law.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'You will be entitled to a refund of any Subscription fees paid in advance and for which no Services were yet provided as of the effective date of such cancellation.'
      lastVerified: 2026-11-11
    - topic: billing.price-changes
      tier: great
      reason: 'It gives at least 30 days’ notice of a new price, which starts only with your next billing period, and you can cancel before it does.'
      sources:
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Any changes or modifications will be effective on at least thirty (30) days’ notice to you.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'If you do not accept the change in pricing, you have the right to reject the change by cancelling your Subscription prior to the change taking effect.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Changes in pricing will take effect at the start of your next Subscription Period following the date of the price change.'
      lastVerified: 2026-11-11
    - topic: billing.free-trials
      tier: poor
      reason: 'Its 3 free months need a credit card and turn into a paid plan unless you cancel, with no reminder promised. A trial that comes with a new car just stops.'
      sources:
        - url: https://www.siriusxm.ca/trial/try-siriusxm/
          quote: 'Subscribe to the Platinum plan and get your first 3 months for $0.00. A credit card is required.'
        - url: https://www.siriusxm.ca/trial/try-siriusxm/
          quote: 'After your first 3 months, your subscription will continue on a monthly billing plan and you will be charged at the then-current rate, (currently $30.99/month), for an indeterminate term and services will continue, unless and until you cancel.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Trial Subscriptions that are included with the purchase or lease of a vehicle or specific offers that state they do not automatically renew will stop at the end of their trial period.'
      lastVerified: 2026-11-11
    # The agreement's next paragraphs promise a written notice "between the 90th and 60th day" before plans of six months
    # or more end; it follows the paragraph for Quebec and sends you to Subsection 4(c), the cancelling rules for BC,
    # Quebec and Newfoundland, so it's read as theirs (notes.md). Read as everyone's, this would be good.
    - topic: billing.renewal-notice
      tier: poor
      reason: 'Outside Quebec, it renews and charges you without telling you first, unless a law requires a notice.'
      sources:
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'on an on-going basis at the regular full-price rates in effect at the time of each renewal, plus applicable fees and taxes, without further notice to you (except as required by applicable law)'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: '(This paragraph is not applicable to Residents of Québec or to Plans whose Offer Details expressly state that they do not automatically renew).'
      lastVerified: 2026-11-11
    - topic: billing.fees
      tier: bad
      reason: 'Outside Quebec, its fees can change without notice, and the fee to activate or change a radio’s service has no stated amount. Others have caps, such as a late fee of up to $5 a month.'
      sources:
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Fees: (This Section is not applicable to Residents of Quebec*) We may charge you one or more of the fees below, if applicable, all of which are subject to change without notice.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Activation Fee: If applicable, for each radio on your account, we may charge you a fee to activate, reactivate, upgrade or modify your Service.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'If we do not receive your payment by the billing due date, we may charge you a late fee of up to $5.00 per month or partial month until the delinquent amount is paid in full, subject to applicable law.'
      lastVerified: 2026-11-11
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up to more channels or ways to listen starts at once, and you pay the difference. Other changes start when your billing period ends, and a cheaper plan’s difference is credited to your next bill.'
      sources:
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'Changes you make to your Plan will be effective at the end of your current Subscription Period, except for Service level upgrades (i.e., additional programming or listening options), in which case we will charge you the difference or apply a non-refundable credit toward your future renewal charges.'
        - url: https://www.siriusxm.ca/terms-and-conditions/
          quote: 'If the new fee is less than the fee for your current Plan or payment schedule on the same Receiver, you will receive the credit on your account, and it will be automatically applied to your next charge.'
      lastVerified: 2026-11-11
    - topic: legal.disputes
      tier: bad
      reason: 'Outside Quebec, a private referee (an arbitrator) in Toronto settles disputes instead of a court, and you can’t opt out. Its agreement doesn’t stop you joining a class action.'
