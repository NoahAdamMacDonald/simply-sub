# Researched by hand on 2026-11-11 (M11.15, the music category, part 5), read with Edge from Canada. Sirius XM Canada
# Inc. sells SiriusXM in Canada under its own Customer Agreement and Privacy Policy, so it's a provider of its own
# (SiriusXM's US service is siriusxm). Pages, each quoted where it's used:
# Pricing: its plans page (siriusxm.ca/plans/): "Car + app" Platinum "$30.99/month", Music & Entertainment
# "$25.99/month" and Music Showcase "$18.99/month", and "App only" All Access (App Only) "$11.99/month", each "Taxes
# extra"; its Customer Agreement has you "pay us in advance, in Canadian Dollars". Monthly only: its agreement mentions
# other "payment schedules" without a price on any page. Family Friendly versions, which leave out "the mature channels",
# are ordered by phone with no price shown, so they aren't listed.
# Region checklist, 2026-11-11: 1. no country paths (siriusxm.ca is Canada's); 2. its QC and FR links are Quebec's and
# French pages; 3. not needed; 4. checkout not opened; 5. no payment help names networks; 6. Edge read every page; 7. no
# bill offered.
# Not listed: its business, fleet, marine and aviation plans; the Lifetime plan ("no longer offered for sale").
# Bundles and official resellers: none named on its plans pages.
# Features, read 2026-11-11: its plans page's comparison table (ticks, read from the page's screenshot): Platinum has
# everything, including "Live NFL, MLB®, NBA, NHL®, NCAA games", "Howard Stern Channel & Video" and "Artist Stations";
# Music & Entertainment has music, news, talk, podcasts and sports talk; Music Showcase "SOME" music, news and talk; All
# Access (App Only) everything but the car. Each plan's extras are perks. Its app shows live channels; as with
# SiriusXM in the US, no page measures its sound, so audio quality waits (core's awaitingRequiredFeatures).
# Coverage: "We offer the Services only within the provinces and territories of Canada" (its Customer Agreement).
