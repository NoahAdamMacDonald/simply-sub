owner:
  name: 'Sirius XM Canada Inc. (70% of its equity and 33% of its votes held by Sirius XM Holdings, the rest by two other shareholders)'
  page:
    name: About SiriusXM
    url: https://www.siriusxm.ca/about-siriusxm/
  quotes:
    - 'Sirius XM Canada Inc., operating as SiriusXM Canada, is the country’s leading entertainment company.'
  country:
    code: CA
    page:
      name: Privacy Policy
      url: https://www.siriusxm.ca/privacy-policy/
    quotes:
      - 'Our Privacy Officer may be contacted by email at privacy@siriusxm.ca or by postal mail at Sirius XM Canada Inc., 351 King Street East, Suite 1000, Toronto, Ontario, M5A 0L6.'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11
# Ways to pay (M11.5), read 2026-11-11: its Customer Agreement; no page names card networks. It also names "an
# authorized third party (such as Google, Apple, Roku" selling it, without naming their stores.
paymentMethods:
  - methods: [card, gift-card]
    page: Customer Agreement
    url: https://www.siriusxm.ca/terms-and-conditions/
    quotes:
      - 'Card Billing: You may pay by credit card, debit/credit card, SiriusXM gift cards, or any other form of payment accepted by SiriusXM Canada'
