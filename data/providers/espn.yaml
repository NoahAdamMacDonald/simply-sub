id: espn
name: ESPN
aliases: [espn+, espn plus]
website: https://www.espn.com
category: streaming
spendCategory: streaming
# Accepted cards, read 2026-10-28 (M9.2) on ESPN Fan Support's Payment Methods for ESPN Select or Unlimited: Visa
# (the Disney Visa too), Mastercard, Amex and Discover.
acceptedNetworks:
  US:
    networks: [visa, mastercard, amex, discover]
    url: https://support.espn.com/hc/en-us/articles/40377318634004-Payment-Methods-for-ESPN-Select-or-Unlimited
    quotes:
      - 'You can purchase an ESPN subscription through any of the following payment methods:'
      - Disney Visa
      - Visa
      - Mastercard
      - Amex
      - Discover
billingCurrency: { US: USD }
# No availableIn: plus.espn.com, whose plans page says who can subscribe, answers this machine (in Canada) with Access
# Denied, and the support centre states no country list. Disney+'s bundles with ESPN are for "U.S. residents, 18+
# only" (help.disneyplus.com/article/disneyplus-price, set to the US).
cancelUrl: https://support.espn.com/hc/en-us/articles/40377550796308-Cancelling-Your-ESPN-Select-or-Unlimited-Subscription
sources:
  {
    pricing: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices,
  }
# No owner (M11.2, read 2026-11-02): espn.com says only “Copyright: © 2026 ESPN Enterprises, LLC.”; Disney's privacy
# policy lists ESPN among The Walt Disney Family of Companies, but only in a list of brands.

# Read 2026-10-26 on ESPN's plans and prices article. Select is ESPN+'s content; Unlimited is every ESPN network,
# live. Both have ads ("ESPN Select (With Ads)", "ESPN Unlimited (With Ads)" on Disney+'s bundle table).
plans:
  - id: espn.select
    name: Select
    link: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
    features:
      streaming.live: [sports]
    prices:
      - region: US
        currency: USD
        amount: 13.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
      - region: US
        currency: USD
        amount: 139.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices

  - id: espn.unlimited
    name: Unlimited
    link: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
    features:
      streaming.live: [tv-channels, sports]
    perks: [Every ESPN network, ESPN+ included]
    prices:
      - region: US
        currency: USD
        amount: 31.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
      - region: US
        currency: USD
        amount: 319.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: The Walt Disney Company's privacy policy, which covers
# ESPN, rated once in data/policies/disney-privacy.yaml (M11.1). Not rated: the billing and legal topics (plus.espn.com,
# with its subscriber agreement, is Access Denied here), account sharing and device limits.
policies:
  shared: [disney-privacy]
