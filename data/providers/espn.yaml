# Coverage: espn.* in CA: not sold in Canada (TSN carries ESPN's channels there): plus.espn.com refuses this machine
# from Canada and through US exits (2026-11-10), its support centre names no country list, and Disney+'s bundles with
# it are for "U.S. residents, 18+ only". Set availableIn when a page lists where it's sold.

id: espn
name: ESPN
aliases: [espn+, espn plus]
website: https://www.espn.com
domains: [espnpressroom.com]
category: streaming
spendCategory: streaming
# Accepted cards, read 2026-10-28 (M9.2) on ESPN Fan Support's Payment Methods for ESPN Select or Unlimited: Visa
# (the Disney Visa too), Mastercard, Amex and Discover.
acceptedNetworks:
  US:
    networks: [visa, mastercard, amex, discover]
    url: https://support.espn.com/hc/en-us/articles/40377318634004-Payment-Methods-for-ESPN-Select-or-Unlimited
    quotes:
      - 'You can purchase an ESPN subscription through any of the following payment methods:'
      - Disney Visa
      - Visa
      - Mastercard
      - Amex
      - Discover
billingCurrency: { US: USD }
# No availableIn: plus.espn.com, whose plans page says who can subscribe, answers this machine (in Canada) with Access
# Denied, and the support centre states no country list. Disney+'s bundles with ESPN are for "U.S. residents, 18+
# only" (help.disneyplus.com/article/disneyplus-price, set to the US).
cancelUrl: https://support.espn.com/hc/en-us/articles/40377550796308-Cancelling-Your-ESPN-Select-or-Unlimited-Subscription
sources:
  {
    pricing: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices,
  }
# Owner (M11.2), read 2026-11-02: its press room's About page (espnpressroom.com, ESPN's own).
# Ways to pay (M11.5), read 2026-11-02 on its payment methods article.
paymentMethods:
  - methods: [card, paypal, provider-billing]
    page: Payment methods for ESPN Select or Unlimited
    url: https://support.espn.com/hc/en-us/articles/40377318634004-Payment-Methods-for-ESPN-Select-or-Unlimited
    quotes:
      - 'You can purchase an ESPN subscription through any of the following payment methods:'
      - Visa
      - PayPal (as a form of digital payment)
      - How do I activate my ESPN Unlimited plan through my Pay-TV Provider?
owner:
  name: The Walt Disney Company (72%), Hearst (18%) and the NFL (10%)
  page:
    name: About ESPN (press room)
    url: https://espnpressroom.com/about/
  quotes:
    - ESPN is 72 percent owned by The Walt Disney Company, 18 percent by Hearst and 10 percent by the National Football League.
  country:
    code: US
    page:
      name: 'About ESPN (press room)'
      url: https://espnpressroom.com/about/
    quotes:
      - 'ESPN Headquarters in Bristol, Connecticut, is home to one of the world’s largest and most technologically advanced TV production facilities.'
    lastVerified: 2026-11-03
  lastVerified: 2026-11-02

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their
# words.
perks:
  - id: every-espn-network
    name: Every ESPN network
  - id: espn-plus
    name: ESPN+ included

# Read 2026-10-26 on ESPN's plans and prices article. Select is ESPN+'s content; Unlimited is every ESPN network,
# live. Both have ads ("ESPN Select (With Ads)", "ESPN Unlimited (With Ads)" on Disney+'s bundle table).
# Read 2026-11-02 (M11.4, the required streaming features): "ESPN subscriptions allow simultaneous streaming on up to
# three (3) devices for most content" (support.espn.com, How many devices can stream ESPN subscriptions
# simultaneously). Unlimited's 4K HDR is from ESPN's press release of 2026-09-08 (espnpressroom.com/press-release/
# espn-espn2-coming-to-sports-fans-in-4k-hdr-in-the-u-s/): ESPN and ESPN2 in 4K HDR in the ESPN App, "as well as on
# Disney+ in the U.S. to ESPN Unlimited subscribers". Select's video quality: neither the plans article, the support
# centre nor the release states it (plus.espn.com is Access Denied here). M11.9 infers HD (720p), marked on the card
# with its page (the owner's choice of 2026-11-03): its connection speed article, for Select or Unlimited, recommends
# 5.0 Mbps "for HD content" and 25.0 for 4K, and only Unlimited is said to stream in 4K.
# Renewal day (M11.5), read 2026-11-03 (M11.9) through a US exit, in the US subscriber agreement Disney+, Hulu and
# ESPN share (hulu.com/subscriber_agreement): the date you became a paying subscriber, or a shorter month's last day.
renewalAnchor:
  kind: same-date
  page: Subscriber agreement
  url: https://www.hulu.com/subscriber_agreement
  quotes:
    - 'if your subscription began on a day not contained in a given month (e.g. if you have a monthly subscription and became a paying subscriber on January 31, your payment method would be billed next on February 28)'
  lastVerified: 2026-11-03

# Free use (2026-11-09, the owner's item: services used free, with ads or limits): none: its plans article sells Select
# and Unlimited; without one, ESPN's news, scores and clips aren't its streams.
freeUse:
  kind: none
  pages:
    [
      https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices,
    ]
  lastVerified: 2026-11-09

# General features, read 2026-11-11: espn.com in English and Spanish (ESPN Brasil's Portuguese site is another
# product). No pause: its help, on ESPN Unlimited, says "There is no option to pause", and no page offers one for
# Select. No parental controls: its help centre has no
# profiles or parental-control article.
# Apps, sign-in and support (M11.9, the cross-category features), read 2026-11-03 in its fan support centre: web browsers,
# iPhone and iPad, Android, Windows 10 and 11, TVs and streaming devices, PlayStation and Xbox (Supported Devices); a
# MyDisney email address and password (Disney+'s MyDisney article names ESPN); chat ("contact us by clicking the Chat
# icon below").
features:
  platforms: [windows, android, ios, web, tv, console]
  account.sign-in: [password]
  support.channels: [chat]
  languages.interface: [en, es]

# Billing periods and resellers (M11.9), read 2026-11-03 through a US exit: monthly and annual for both plans, as
# stored (its plans and prices article: "ESPN Select Annual Subscription $139.99/Year", "ESPN Unlimited Annual
# Subscription $319.99/Year"). No official resellers: pay-TV providers and app stores bill it as channels ("billed
# through a third party, such as Apple or Google").
# Downloads, profiles and Kids profiles (M11.15), searched 2026-11-04 through a US exit: its help centre
# (support.espn.com) has no article on any of them, and an ESPN account is one person's ("How do I personalize my account
# on ESPN.com?"), so none (inferred).
plans:
  - id: espn.select
    name: Select
    link: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
    features:
      video.quality: 720p
      ad-free: false
      streaming.concurrent-streams: 3
      streaming.live: [sports]
    inferred:
      video.quality:
        reason: "No page says Select's quality. ESPN recommends 5.0 Mbps for HD content on Select or Unlimited, and only Unlimited is said to stream in 4K, so Select is taken as HD."
        page:
          name: Connection speed recommendations
          url: https://support.espn.com/hc/en-us/articles/40379040324116-ESPN-Select-or-Unlimited-Internal-Connection-Speed-Recommendations
        lastVerified: 2026-11-03
    prices:
      - region: US
        currency: USD
        amount: 13.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
      - region: US
        currency: USD
        amount: 139.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices

  - id: espn.unlimited
    name: Unlimited
    link: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
    features:
      video.quality: 4k
      video.hdr: true
      ad-free: false
      streaming.concurrent-streams: 3
      streaming.live: [tv-channels, sports]
    perks: [every-espn-network, espn-plus]
    prices:
      - region: US
        currency: USD
        amount: 31.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
      - region: US
        currency: USD
        amount: 319.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: The Walt Disney Company's privacy policy, which covers
# ESPN, rated once in data/policies/disney-privacy.yaml (M11.1). Not rated: the billing and legal topics (plus.espn.com,
# with its subscriber agreement, is Access Denied here), account sharing and device limits.
# Every agreement a user accepts (the owner's rule, 2026-11-03): a MyDisney account's Disney Terms of Use, read in
# data/policies/disney-subscriber-agreement.yaml.
policies:
  shared: [disney-privacy, disney-subscriber-agreement]
  links:
    - name: 'Security vulnerability reports'
      url: https://hackerone.com/disney
  ratings:
    - topic: security.practices
      tier: neutral
      reason: "Disney runs a program where security experts can report problems they find, but it doesn't say outside experts check its security or publish what they find."
      sources:
        - url: https://hackerone.com/disney
          quote: 'If you believe you have found a qualifying security vulnerability in a Disney product or website, please submit a report in accordance with the guidelines below.'
      lastVerified: 2026-11-02
