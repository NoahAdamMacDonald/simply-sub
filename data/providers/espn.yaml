id: espn
name: ESPN
aliases: [espn+, espn plus]
website: https://www.espn.com
category: streaming
spendCategory: streaming
billingCurrency: { US: USD }
# No availableIn: plus.espn.com, whose plans page says who can subscribe, answers this machine (in Canada) with Access
# Denied, and the support centre states no country list. Disney+'s bundles with ESPN are for "U.S. residents, 18+
# only" (help.disneyplus.com/article/disneyplus-price, set to the US).
cancelUrl: https://support.espn.com/hc/en-us/articles/40377550796308-Cancelling-Your-ESPN-Select-or-Unlimited-Subscription
sources:
  {
    pricing: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices,
  }

# Read 2026-10-26 on ESPN's plans and prices article. Select is ESPN+'s content; Unlimited is every ESPN network,
# live. Both have ads ("ESPN Select (With Ads)", "ESPN Unlimited (With Ads)" on Disney+'s bundle table).
plans:
  - id: espn.select
    name: Select
    link: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
    features:
      streaming.live: [sports]
    prices:
      - region: US
        currency: USD
        amount: 13.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
      - region: US
        currency: USD
        amount: 139.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices

  - id: espn.unlimited
    name: Unlimited
    link: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
    features:
      streaming.live: [tv-channels, sports]
    perks: [Every ESPN network, ESPN+ included]
    prices:
      - region: US
        currency: USD
        amount: 31.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices
      - region: US
        currency: USD
        amount: 319.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://support.espn.com/hc/en-us/articles/40375475974036-ESPN-Select-or-Unlimited-Plans-and-Prices

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: The Walt Disney Company's privacy policy, which
# covers ESPN. Not rated: the billing and legal topics (plus.espn.com, with its subscriber agreement, is Access
# Denied here), account sharing and device limits.
policies:
  links:
    - name: 'Privacy policy'
      url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It follows what you do with cookies, tracking pixels and other hidden tools from the start. You can switch some of it off, like cookies and selling your data, but not all of it.'
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'We collect information through a variety of technologies, such as cookies, Flash cookies, pixels, tags, software development kits'
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Click on “Do Not Sell or Share My Personal Information”, “Your Privacy Controls”, “Manage Your Cookies Settings”, “Modify Your Cookie Preferences” or “Manage (Privacy) Preferences” in our website footers'
      lastVerified: 2026-10-27
    - topic: privacy.data-sharing
      tier: neutral
      reason: 'It gives some details about you, like ID codes or a scrambled copy of your email address, to other companies so it can show you ads on their sites. You can say no in its privacy settings.'
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'When we provide you with relevant advertising on third-party sites and applications, we may share limited personal information about you, such as certain identifiers or hashed email address, with third parties.'
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Click on “Do Not Sell or Share My Personal Information”, “Your Privacy Controls”, “Manage Your Cookies Settings”, “Modify Your Cookie Preferences” or “Manage (Privacy) Preferences” in our website footers'
      lastVerified: 2026-10-27
    - topic: privacy.ads-tracking
      tier: neutral
      reason: "It picks the ads you see from what you do on its sites and apps, and on other companies' too, unless you turn that off in its privacy settings."
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Provide you with targeted advertising based on your activity on our sites and applications and on third-party sites and applications;'
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Click on “Do Not Sell or Share My Personal Information”, “Your Privacy Controls”, “Manage Your Cookies Settings”, “Modify Your Cookie Preferences” or “Manage (Privacy) Preferences” in our website footers'
      lastVerified: 2026-10-27
    - topic: privacy.data-deletion
      tier: neutral
      reason: "You can delete your account, but it doesn't say how long it keeps your information after that."
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Updating or correcting the contact information you gave us, resetting your password, or deleting your registration account'
      lastVerified: 2026-10-27
