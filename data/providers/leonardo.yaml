# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2). leonardo.ai answers this machine with
# Cloudflare's check in Edge, headless and headed, and a plain fetch with 403, so its pages were read with Edge through
# country exits: the pricing page (both its Pay Monthly and Pay Yearly views) through US, UK, German, Canadian and
# Australian exits, and its home page, Terms of Service and Privacy Policy through a US exit; the page's own data from
# its HTML through the same US exit. Its help centre (intercom.help/leonardo-ai, Leonardo's Intercom help centre, which
# leonardo.ai links for help and refunds) read with Edge from Canada: the FAQ, refunds, subscribing and changing plans,
# cancelling, deleting your account, commercial use, private and public images, visibility settings, tokens, token
# rollover, top-ups, support, payment method, payment errors, sign-in, video (each FAQ answer opened), Edit in Canva
# (each FAQ answer opened), 3D generation, Canvas Editor, Realtime Canvas, Flow State and invoices articles, and the
# Canva Business access FAQ; Canva's own help article on Leonardo in Canva Business. Pages, each quoted where it's used:
# Pricing: leonardo.ai/pricing, "Pay Monthly" Free "$0 /month", Essential "$12 /month", Premium "$30 /month", Ultimate
# "$60 /month", and "Pay Yearly" ("Up to" "20% off") "$10 /month", "$24 /month", "$48 /month", each "ex. tax.". Every
# exit (US, UK, Germany, Canada, Australia) showed the same figures in a bare $, and the page's own data names the
# currency ("offers_currency":"USD") and both prices ("pay_monthly_price":12,"pay_yearly_price":10): one US-dollar
# price list for everyone, GLOBAL. The yearly view gives only the price a month, paid yearly, so each yearly price is
# twelve times it ($120, $288, $576: notes.md). No price includes tax ("ex. tax.").
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang; 2. no country or currency picker; 3. the page's
# data names USD and no country; 4. checkout needs an account (app.leonardo.ai asks you to log in); 5. no prices or tax
# article in its help centre ("please check the Plans page within the Leonardo.Ai web app"); 6. Edge, headed Edge and
# a plain fetch from Canada were refused; a Canadian exit showed the same US-dollar list; 7. no bill offered.
# Its individual plans: Free, Essential, Premium and Ultimate, monthly or yearly. Not listed: the Team plans (Starter
# and Growth, "$24 / seat"), the API's "PAY AS YOU GO" and "API CUSTOM" (usage-billed), and top-up tokens (bought as you
# go).
# Bundles: none sold now. Canva Business and Canva Pro+ included Leonardo's Essential plan until 2026 ("If you start a
# new Canva Business subscription on or after 1 September, 2026, access to Leonardo.Ai Essential plan will not be
# included.", Canva's help centre); Canva isn't in the catalog and Business is out of scope (notes.md). Official
# resellers: none; no page names a shop that sells it.

id: leonardo
name: Leonardo
aliases: [leonardo.ai, leonardo ai]
website: https://leonardo.ai
# Its help centre is Intercom's (intercom.help/leonardo-ai), on Intercom's own host.
domains: [app.leonardo.ai, intercom.help]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help centre's "How can I cancel my subscription?": Settings, Subscription and Billing, Cancel Plan.
cancelUrl: https://intercom.help/leonardo-ai/en/articles/9035057-how-can-i-cancel-my-account-unsubscribe
sources: { pricing: https://leonardo.ai/pricing }

# Ways to pay (M11.5), read 2026-11-17: PayPal or a card through Stripe ("How do I subscribe to a paid plan, change or
# upgrade my subscription?"). No page names the card networks.
paymentMethods:
  - methods: [paypal, card]
    page: 'How do I subscribe to a paid plan, change or upgrade my subscription?'
    url: https://intercom.help/leonardo-ai/en/articles/13755076-how-do-i-subscribe-to-a-paid-plan-change-or-upgrade-my-subscription
    quotes:
      - 'A confirmation pop up will appear advising you of the cost, and directing you to pay via PayPal, or Card (which will direct you to the Stripe billing page).'

# Owner (M11.2), read 2026-11-17 through a US exit: its privacy policy names the company that runs it and calls it "a
# Canva brand", and says the company is in Australia. Canva is private: no page names a listing.
owner:
  name: 'Leonardo Interactive Pty Ltd (Canva)'
  page:
    name: Privacy policy
    url: https://leonardo.ai/privacy-policy
  quotes:
    - 'We are Leonardo Interactive Pty Ltd T/A Leonardo.Ai, a Canva brand (“Leonardo.Ai“).'
  country:
    code: AU
    page:
      name: Privacy policy
      url: https://leonardo.ai/privacy-policy
    quotes:
      - 'By using the Service, you understand and agree that Leonardo Interactive Pty Ltd (an entity in Australia) will receive and process your personal data.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its terms bill "at the beginning of each Billing Cycle" and its pricing cards'
# tokens "Resets on your Billing Date"; no page says which day that is.
renewalAnchor:
  kind: not-stated
  pages:
    - https://leonardo.ai/terms-of-service
    - https://intercom.help/leonardo-ai/en/articles/13755076-how-do-i-subscribe-to-a-paid-plan-change-or-upgrade-my-subscription
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on the pricing cards and comparison table: usage (never features), the token bank,
# Leo Agent (no page describes it beyond its name) and private generations (no registry feature).
