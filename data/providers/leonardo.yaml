    name: 'Rollover token bank of 25,500'
  - id: token-bank-75000
    name: 'Rollover token bank of 75,000'
  - id: token-bank-180000
    name: 'Rollover token bank of 180,000'
  - id: relaxed-images
    name: Unlimited relaxed image generation
  - id: relaxed-video
    name: Unlimited relaxed video generation
  - id: leo-agent
    name: Leo Agent
  - id: private-generations
    name: Private Generations
  - id: model-training-10
    name: Personal AI model training, 10 a month
  - id: model-training-20
    name: Personal AI model training, 20 a month
  - id: model-training-50
    name: Personal AI model training, 50 a month
  - id: top-up-tokens
    name: Top-up Tokens

# AI and creative features, read 2026-11-17, on every plan unless named:
# - Sold as an AI service ("THE CREATOR-FIRST" "GENERATIVE AI PLATFORM", its home page), so its plans are in ai with
#   ai.assistant, and in creative (notes.md).
# - Image and video generation: the comparison table's "Image Generation" and "Video Generation" rows tick Free too
#   ("No, however due to high token costs, only some Video models are accessible to Free users."). Its videos' sound
#   ("videos that include sound effects and audio dialogue") is part of the clip, not music or voice generation.
# - Models from other companies on the paid plans: the table's "Third-party Models" row ("-" on Free, whose "Platform
#   Models" are "Auto only"); its video models include "Veo 3 and Kling Video 3.0".
# - Connects to your other apps: "Edit in Canva is available to all individual Leonardo.Ai users."
# - Creative tools: photo editing ("Canvas Editor is a powerful image editing tool that allows you to make intricate
#   adjustments to your images, remove unwanted elements, or even generate new content using advanced inpainting and
#   outpainting techniques."), drawing and painting (Realtime Canvas, "designed to convert drawings into stunning
#   artworks", "Limited" on Free), and on the paid plans 3D models ("then download the .glb file to use in Blender,
#   Unity, or any tool that reads .glb files"; "A single 3D generation costs more than the free daily token allowance,
#   so a paid plan is needed in practice.").
# - No watermark on the paid plans: "To generate a Video without a watermark, consider upgrading to a paid plan."
# - Generative credits a month on the paid plans: "Fast Tokens" "8,500 / monthly", "25,000 / monthly" and "60,000 /
#   monthly"; Free's "150 / daily" is a perk.
# - Kept on its servers: your Library of generations.
# - No page states video export resolutions by plan, web search, voice, memory, projects, reasoning, a coding agent or
#   API use within a plan (its API is billed apart).
# General features, read 2026-11-17: the web and "Leonardo.Ai is available as an app for Android and Apple iOS
# devices!". Sign-in: an email and password, or "Apple, Google, Microsoft, or Canva login". App languages: English only
# ("While we do not offer multi-language support right now, it's something we might consider adding down the line.").
# Support: its Intercom chat with human agents ("Talk to a person"), "Alternatively, feel free to drop us an email
# anytime at support@leonardo.ai." and Discord. Pause on the paid plans: its terms' "You may pause your Subscription for
# a maximum period of three 3 months during each Subscription Period". No parental controls on its pages.
features:
  platforms: [web, ios, android]
  account.sign-in: [password, sso]
  languages.interface: [en]
  support.channels: [email, chat, community]

