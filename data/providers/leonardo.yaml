# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 through a US exit: its Terms of Service
# (updated 19 January 2026), which name its Privacy Policy and, for team and Canva multi-seat accounts, its Data
# Processing Addendum (business, not read), and its Beta Services Terms (for beta features, not read: no link reached);
# its Cookies Policy (named by the privacy policy, not read: the exit's session ended first); its help centre's billing,
# privacy and account articles from Canada. Not read: the sign-up form's agreement line (app.leonardo.ai's sign-up is
# behind its log-in page) and Apple's terms for its iOS app.
policies:
  links:
    - name: Terms of service
      url: https://leonardo.ai/terms-of-service
    - name: Privacy policy
      url: https://leonardo.ai/privacy-policy
    - name: Cancelling your subscription
      url: https://intercom.help/leonardo-ai/en/articles/9035057-how-can-i-cancel-my-account-unsubscribe
    - name: Refunds
      url: https://intercom.help/leonardo-ai/en/articles/11424250-refunds
    - name: Frequently asked questions
      url: https://intercom.help/leonardo-ai/en/articles/7051613-frequently-asked-questions
    - name: Private and public images
      url: https://intercom.help/leonardo-ai/en/articles/8044029-private-public-images
    - name: Visibility settings
      url: https://intercom.help/leonardo-ai/en/articles/9748859-image-and-video-generation-visibility-settings
    - name: Deleting your account
      url: https://intercom.help/leonardo-ai/en/articles/9665417-how-do-i-delete-my-account
    - name: Generating video
      url: https://intercom.help/leonardo-ai/en/articles/11027827-generating-video-on-leonardo-ai
    - name: Pricing
      url: https://leonardo.ai/pricing
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel in your settings at any time, and your plan keeps running until its renewal date.'
      sources:
        - url: https://intercom.help/leonardo-ai/en/articles/9035057-how-can-i-cancel-my-account-unsubscribe
          quote: 'You can cancel your Leonardo.Ai subscription at any time, simply Follow the below steps to cancel your subscription:'
        - url: https://intercom.help/leonardo-ai/en/articles/9035057-how-can-i-cancel-my-account-unsubscribe
          quote: 'Your subscription remains active until your next renewal date, and from this date your subscription will not be renewed going forward.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'Cancelling gives no money back, but you keep your plan until the period ends. A person at Leonardo looks at refund requests one by one.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: 'Your cancellation will take effect at the end of your current Subscription Period, and your Subscription will not be renewed (meaning you will need to continue paying all Subscription Fees due up until your current Subscription Period ends).'
        - url: https://intercom.help/leonardo-ai/en/articles/11424250-refunds
          quote: 'Refunds are assessed manually by a human agent.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      status: not-stated
      reason: 'Its terms say only that prices are set out in the app; they don’t say whether it tells you before a price goes up.'
      pages: [https://leonardo.ai/terms-of-service]
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      status: not-applicable
      reason: 'It has no free trial for its paid plans; the free plan is a plan of its own.'
      pages: [https://intercom.help/leonardo-ai/en/articles/7051613-frequently-asked-questions]
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say plans renew on their own for the same period, but not that it reminds you first.'
      pages: [https://leonardo.ai/terms-of-service]
      lastVerified: 2026-11-17
    - topic: billing.fees
      tier: neutral
      reason: 'There are no fees beyond the price, except interest on a payment that’s late.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '(b) Charge interest on any overdue payments at a rate equal to the Reserve Bank of Australia’s cash rate, from time-to-time, plus 2% per annum, calculated daily and compounding monthly.'
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up starts at once and you pay the difference for the rest of the period. Moving down starts at your next billing period.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: 'Any upgrades to your Subscription will take effect immediately (and you will be charged the difference between your current Subscription and your new Subscription on a pro-rata basis). Any downgrades to your Subscription will take effect from the beginning of the next Billing Cycle.'
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: neutral
      reason: 'Outside Australia, a dispute goes to one private referee (an arbitrator) in Sydney after a meeting, not to a court. Its terms say nothing about class actions and offer no way to opt out.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '(b) Where you are not resident or incorporated in Australia, refer the matter to arbitration administered by the Australian Centre for International Commercial Arbitration, with such arbitration to be conducted in Sydney, New South Wales, before one arbitrator, in English and in accordance with the ACICA Arbitration Rules.'
      action:
        name: 'Its dispute clause (clause 15.2 of its terms)'
        url: https://leonardo.ai/terms-of-service
      lastVerified: 2026-11-17
    - topic: legal.disputes
      regions: [AU]
      tier: good
      reason: 'In Australia a dispute goes to mediation and then to the courts of New South Wales, with no private referee.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '(a) Where you are resident or incorporated in Australia, refer the matter to mediation, administered by the Australian Disputes Centre in accordance with Australian Disputes Centre Guidelines for Commercial Mediation;'
        - url: https://leonardo.ai/terms-of-service
          quote: '15.3 Governing law and Venue: These Terms are interpreted under and governed by the laws of New South Wales.'
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It gives notice ahead of changes that hurt you, without saying how long ahead. If you don’t agree you can leave and get back what you paid for the time left.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '1.3 Variations: We may amend these Terms at any time, by providing reasonable advance notice of any change to the Terms that, in our sole determination, materially adversely affect your rights or your use of the Service.'
        - url: https://leonardo.ai/terms-of-service
          quote: '(b) If you have paid Subscription Fees upfront, you will be issued a pro-rata refund based on the portion of the Subscription Period remaining.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: good
      reason: 'It suspends or closes accounts for breaking its terms: it tells you, and gives you 14 days to fix most problems first.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '14.2 If we suspend your access to our Services, we will let you know within a reasonable time of doing so, and we will work with you to resolve the matter within 14 days, or if it cannot be resolved, then we may terminate your Account and your access to our Services will end.'
        - url: https://leonardo.ai/terms-of-service
          quote: '(b) You or your Authorised Users breach these Terms and do not remedy that breach within 14 days of us notifying you of that breach.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: bad
      reason: 'Everything public, which is everything on the free plan, can be used by every user, and Leonardo gets a licence that never ends to use it for anything, including selling it, and to pass it on.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '8.6 You grant us a non-exclusive, irrevocable, perpetual, royalty-free, worldwide and transferable right and licence to use, reproduce, modify, copy, process, adapt, publish, transmit, create derivative works of, publicly display and distribute any Public Content for providing, maintaining, promoting and improving the Services, including training AI models, developing new offerings, or for any commercial purpose.'
        - url: https://leonardo.ai/privacy-policy
          quote: 'If you are using a free subscription, all Content you generate is publicly available by default.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      plans: [leonardo.essential, leonardo.premium, leonardo.ultimate]
      tier: poor
      reason: 'With Private Mode on, Leonardo may use your work only to run the service, but that licence can’t be taken back. Anything you leave public gets the free plan’s licence.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '8.5 You grant us a non-exclusive, irrevocable, royalty-free, worldwide, non-sublicensable (other than to our related bodies corporate, and non-transferable right and licence to use any Private Content solely for the purpose of performing of our obligations or exercising our rights under these Terms.'
        - url: https://leonardo.ai/terms-of-service
          quote: '8.4 Paid Subscribers can select whether Content is public or private.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: bad
      reason: 'On the free plan, what you make belongs to Leonardo, not you.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '8.7 If you are on one of our free Subscriptions (Free Subscriber), as between the Parties, ownership of all Intellectual Property Rights in any Output you, or your Authorised Users, create while using the Platform will vest in us upon creation'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      plans: [leonardo.essential, leonardo.premium, leonardo.ultimate]
      tier: neutral
      reason: 'On a paid plan you own what you make, but anything you leave public may also be used by Leonardo for any purpose.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '8.3 If you are on one of our paid Subscriptions (Paid Subscriber), as between the Parties, subject to your compliance with these Terms and to the extent permitted by law, ownership of all Intellectual Property Rights in any Content you, or your Authorised Users, create while using the Platform will vest in you upon creation.'
        - url: https://leonardo.ai/terms-of-service
          quote: 'including training AI models, developing new offerings, or for any commercial purpose.'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: neutral
      reason: 'It can add, change or remove features at any time. If it stops the service your paid plan uses, it moves you to a similar one or refunds the time left.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '2.4 We may add, change or remove features or functionality to our Services; modify or introduce limitations to storage or other features; or discontinue our Services altogether at any time.'
        - url: https://leonardo.ai/terms-of-service
          quote: 'If you are on a paid subscription and we discontinue the Service you are using during your subscription, we will migrate or make available to you a substantially similar service (if available) and if we’re unable to do so, we will provide you a pro-rata refund of fees prepaid for the remaining period of your subscription.'
      lastVerified: 2026-11-17
    - topic: legal.inactivity
      tier: neutral
      reason: 'If you don’t use your account for 12 months, it may delete it and everything you made, after emailing you first.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '3.7 If you have not used your Account for an extended period of time (12 months or more of inactivity), we may close and permanently delete your Account.'
        - url: https://leonardo.ai/terms-of-service
          quote: 'We will notify you via the email address you provided when creating your Account prior to deleting your Account.'
      lastVerified: 2026-11-17
    - topic: legal.licence
      tier: poor
      reason: 'Your right to use Leonardo can be suspended or taken back, and you may not take its software apart, with no exception for what the law allows.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '5.1 While you have an Account, we grant you and your Authorised Users a right to use our Platform (which may be suspended or revoked in accordance with these Terms).'
        - url: https://leonardo.ai/terms-of-service
          quote: 'You agree not to copy or otherwise misuse our intellectual property without our written permission (for example, to reverse engineer or discover the source code of our intellectual property)'
      lastVerified: 2026-11-17
    - topic: service.account-sharing
      tier: bad
      reason: 'You can’t share your login: sharing it can get your account suspended. Other people need a team plan.'
      sources:
        - url: https://leonardo.ai/terms-of-service
          quote: '(a) We reasonably believe there has been any unauthorised access to or use of our Services (such as the unauthorised sharing of login details for our Platform);'
