# Researched by hand on 2026-11-09 (M11.15, the streaming category, batch 4). DAZN turns away readers on a VPN
# ("Disable your VPN to continue") and through other countries' exits, so Canada's pages were read over an ordinary
# connection; its sign-up app showed "There's a problem opening DAZN just now" even then.
# Pricing: Canada's help article "DAZN plans and pricing" (its tiers DAZN and DAZN+, each Standard or Ultimate, at
# "Monthly Flex", "Annual Pay (Instalment)" and "Annual Pay (Upfront)" prices), and the US's, which a plain fetch reads
# from here (Monthly $34.99 on one stream, Annual - Pay Upfront $249.99 on two; the Internet Archive's copy of 2026-10-29
# says the same). Annual Pay (Instalment) is a 12-month term paid monthly that its terms renew for another 12
# months ("continue to be automatically extended by the length of the minimum term"); the catalog stores no minimum
# term, so the plans' notes give it, as Viaplay's 12-month contract.
# Region checklist, 2026-11-09: 1. dazn.com/<locale>/help (its plans article in each locale); 4. the sign-up app, which
# fails to load; 6. Edge through each exit (refused), a browser over an ordinary connection (Canada), and a plain fetch.
# The UK's, Germany's, Italy's, Spain's and France's plans articles read with a plain fetch too, but each sells a
# lineup of its own (Germany's Super Sports and Unlimited, Italy's Full and Goal, Spain's sport packs, France's Ligue 1+
# offers), left for a batch of their own. No page read lists where it's sold, so availableIn is left out.
# Bundles: none on its pages. Resellers: none.

# Coverage: dazn.one-stream in CA: Canada's monthly plan streams on 2 devices (Standard), so it has no one-stream plan.
# Coverage: dazn.ultimate, dazn.plus-standard and dazn.plus-ultimate in US: the US's plans article prices one plan
# only.

id: dazn
name: DAZN
website: https://www.dazn.com
category: streaming
spendCategory: streaming
billingCurrency: { CA: CAD, US: USD }
cancelUrl: https://www.dazn.com/en-CA/help/articles/16391473315101-terms-conditions
sources: { pricing: https://www.dazn.com/en-CA/help/articles/16184063399709-DAZN-plans-and-pricing }
notes: Canada's and the US's prices; its other countries sell lineups of their own, not read in yet.
# Payment methods, read 2026-11-09 in its terms. Its pages name no card networks. Its terms also allow paying "using
# your account with a third party", and its help centre has articles on DAZN through Amazon Prime Video and Roku, not
# read for this.
paymentMethods:
  - methods: [card, paypal]
    page: 'Terms & conditions'
    url: https://www.dazn.com/en-CA/help/articles/16391473315101-terms-conditions
    quotes:
      - 'Payment must be made by credit card; debit card; Paypal or through another current, valid, accepted method of payment including supported third party payment providers'

# Owner (M11.2), read 2026-11-09 in its terms.
owner:
  name: 'DAZN Limited, a DAZN Group company'
  page:
    name: 'Terms & conditions'
    url: https://www.dazn.com/en-CA/help/articles/16391473315101-terms-conditions
  quotes:
    - 'DAZN Limited is a DAZN Group company'
    - 'registered in United Kingdom and having its registered office at 12 Hammersmith Grove, London, England, W6 7AP'
  country:
    code: GB
  lastVerified: 2026-11-09

# Renewal day (M11.5), read 2026-11-09 in its terms: billed "on the calendar day corresponding to the commencement of
# your Paid Subscription".
renewalAnchor:
  kind: same-date
  page: 'Terms & conditions'
  url: https://www.dazn.com/en-CA/help/articles/16391473315101-terms-conditions
  quotes:
    - 'In some cases, the date for billing may change, for example if your subscription began on a day not contained in a given month'
  lastVerified: 2026-11-09

# Apps (the cross-category features), read 2026-11-09 in its sign-up article: the website, TVs and TV streaming
# devices, iPhone and iPad, Android, and Xbox and PlayStation.
features:
  platforms: [web, tv, ios, android, console]

# Perks (M11.6): what its plans add that no feature describes, in its words.
perks:
  - id: multiview
    name: 'Multiview: watch multiple games at once'
  - id: fubo-soccer
    name: Top-tier soccer content from Fubo TV

