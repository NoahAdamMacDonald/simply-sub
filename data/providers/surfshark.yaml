# Terms and policies (BLUEPRINT §4.10), read 2026-11-19: its terms of service (which are its apps' licence, section 6),
# privacy policy (whole, its tables included), cookie policy, renewal price page, trust center and help articles
# (cancelling, refunds, deleting an account, free trial, fees, sharing). Its terms include no other document by name
# beyond the privacy policy ("Together, these two documents create a single, legally binding agreement"). They're
# Surfshark B.V.'s own, not Nord Security's, so nothing is shared with NordVPN. Incogni's terms (One+'s third-party
# service) weren't read (notes.md).
policies:
  links:
    - name: 'Terms of Service'
      url: https://surfshark.com/terms-of-service
    - name: 'Privacy Policy'
      url: https://surfshark.com/privacy
    - name: 'Billing Practices, Currency Policy & Renewal Prices'
      url: https://surfshark.com/terms-of-service/pricing
    - name: 'Trust Center'
      url: https://surfshark.com/trust-center
    - name: 'How to cancel auto-renewal'
      url: https://support.surfshark.com/hc/en-us/articles/360003069694-How-to-cancel-auto-renewal-for-your-Surfshark-subscription
    - name: 'Manage your subscription'
      url: https://support.surfshark.com/hc/en-us/articles/17673853278226-Manage-your-subscription
    - name: 'How to delete my Surfshark account'
      url: https://support.surfshark.com/hc/en-us/articles/11271665782034-How-to-delete-my-Surfshark-account
    - name: 'Does Surfshark offer a free trial?'
      url: https://support.surfshark.com/hc/en-us/articles/360026123554-Does-Surfshark-offer-a-free-trial
    - name: 'Are there any additional payments or hidden costs?'
      url: https://support.surfshark.com/hc/en-us/articles/360003069594-Are-there-any-additional-payments-or-hidden-costs
    - name: 'How many devices can I use with Surfshark simultaneously?'
      url: https://support.surfshark.com/hc/en-us/articles/360003069434-How-many-devices-can-I-use-with-Surfshark-simultaneously
  ratings:
    - topic: privacy.data-collection
      tier: good
      reason: 'It collects crash reports and app diagnostics only if you agree, and uses everything else only in a form that can’t be tied to you.'
      sources:
        - url: https://surfshark.com/privacy
          quote: 'Legal basis for such processing is your consent.'
        - url: https://surfshark.com/privacy
          quote: 'We will access this information only if you provide a separate consent for that.'
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: good
      reason: 'It never sells your data. It shares it with its own group companies to run the service, and with ad partners only if you agree.'
      sources:
        - url: https://surfshark.com/privacy
          quote: 'we do not sell, rent, lease, or trade your personal data with anyone, nor do we plan to do so in the future.'
        - url: https://surfshark.com/privacy
          quote: 'We share data with our group companies to support our daily operations and ensure Surfshark can continue providing you with Services.'
        - url: https://surfshark.com/privacy
          quote: 'Legal basis for the processing of personal data is your consent to deliver relevant ads and promotional messages to you, and to attribute sales.'
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: good
      reason: 'Its website tracks what you do there for ads only if you say yes to its cookies.'
      sources:
        - url: https://surfshark.com/privacy
          quote: "When you use our Website, we automatically collect information about your activity through technologies like cookies if you've given us permission."
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      tier: great
      reason: 'It says it doesn’t use any of your data to train its AI models.'
      sources:
        - url: https://surfshark.com/privacy
          quote: 'Please note that we respect your privacy and do not access any of your private content or use any of your data to train our AI models.'
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your account data while you subscribe and for 2 years after you last log in, support chats for up to 6 years, and the rest as long as it needs.'
      sources:
        - url: https://surfshark.com/privacy
          quote: 'We keep your personal data for as long as your subscription is active and for 2 years after the last login.'
        - url: https://surfshark.com/privacy
          quote: 'We will keep personal data related to customer support communications for up to 6 years following the receipt of your message.'
        - url: https://surfshark.com/privacy
          quote: 'we retain your personal data until it is no longer necessary for the reasons we initially collected it for'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'To delete your data or your account, you ask by email or live chat. It doesn’t say how long it takes.'
      sources:
        - url: https://surfshark.com/privacy
          quote: 'We respect GDPR, CCPA, and other privacy legislation, and you can ask us to delete your personal data or implement other rights by emailing us at'
        - url: https://support.surfshark.com/hc/en-us/articles/11271665782034-How-to-delete-my-Surfshark-account
          quote: 'To delete your Surfshark account, contact our customer success team via Live Chat and let them know you wish to have your account deleted.'
      action:
        name: 'How to delete your account'
        url: https://support.surfshark.com/hc/en-us/articles/11271665782034-How-to-delete-my-Surfshark-account
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask it for a copy of your data in a common file format by contacting it. There is no download button.'
      sources:
        - url: https://surfshark.com/privacy
          quote: 'You can access your personal data or receive a copy of it by contacting us.'
        - url: https://surfshark.com/privacy
          quote: 'You can ask us to provide you with a copy of your personal data in a structured, commonly used, and machine-readable format'
      action:
        name: 'How to ask for your data'
        url: https://surfshark.com/privacy
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: good
      reason: 'It gives police data only when the law makes it, keeps no record of what you do online, and lists any requests on its transparency report.'
      sources:
        - url: https://surfshark.com/privacy
          quote: 'We only disclose personal data to law enforcement authorities or courts of competent jurisdiction when we are asked and legally obliged to do so'
        - url: https://surfshark.com/privacy
          quote: 'Transparency report page will display if we’re ever asked to do so'
        - url: https://surfshark.com/trust-center
          quote: 'Surfshark is based in the Netherlands. The laws of the Netherlands do not establish any obligation to log or retain user data.'
      lastVerified: 2026-11-19
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data can be kept in any country where it or its suppliers work, such as the US, under the EU’s standard contract terms.'
      sources:
        - url: https://surfshark.com/privacy
          quote: 'Your data, as specified in this Privacy Policy, may be stored and processed in any country where we have facilities or in which we engage service providers.'
        - url: https://surfshark.com/privacy
          quote: 'Please note that we use Standard Contractual Clauses approved by the European Commission'
      lastVerified: 2026-11-19
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'To sign up you give an email address and a password, or use your Google or Apple account, and a way to pay.'
      sources:
        - url: https://surfshark.com/terms-of-service
          quote: 'You may be asked to provide an e-mail address and password.'
        - url: https://support.surfshark.com/hc/en-us/articles/360026123554-Does-Surfshark-offer-a-free-trial
          quote: 'Enter the email address for your Surfshark account, continue with Google/Apple, or log in to an already existing account'
      lastVerified: 2026-11-19
    - topic: billing.cancellation
      tier: good
      reason: 'You can turn off renewal in your Surfshark account at any time, and keep using it to the end of the time you paid for.'
      sources:
        - url: https://surfshark.com/terms-of-service
          quote: 'If you purchased the Services directly from us you can cancel your automatic payments (i.e., turn off auto-renewals for the upcoming Service period) at any time from your Surfshark account.'
        - url: https://support.surfshark.com/hc/en-us/articles/360003069694-How-to-cancel-auto-renewal-for-your-Surfshark-subscription
          quote: 'The subscription will remain active until the end of the current billing period.'
      lastVerified: 2026-11-19
    - topic: billing.refunds
      tier: neutral
      reason: 'You can get all your money back within 30 days of your first purchase only. Renewals are never refunded.'
      sources:
        - url: https://surfshark.com/terms-of-service
          quote: 'we guarantee you a right to claim a refund within 30 days following your initial purchase of our Services.'
        - url: https://surfshark.com/terms-of-service
          quote: 'Please note that for all subscription plans, the 30-day money-back guarantee applies only to the initial purchase; all recurring payments are non-refundable.'
      lastVerified: 2026-11-19
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you before it raises the price, but doesn’t say how long before. Keeping on using it means you accept the new price.'
      sources:
        - url: https://surfshark.com/terms-of-service
          quote: 'Surfshark may change the price for the subscriptions, including recurring subscription fees, or other subscription terms from time to time and will communicate any price or other changes to you in advance.'
      lastVerified: 2026-11-19
    - topic: billing.free-trials
      tier: neutral
      reason: 'Its 7-day free trial turns into a paid plan unless you cancel, which you can do at any time in your account.'
      sources:
        - url: https://support.surfshark.com/hc/en-us/articles/360026123554-Does-Surfshark-offer-a-free-trial
          quote: 'Once the trial ends, your payment is charged, and you can still request a full refund within 30 days.'
        - url: https://support.surfshark.com/hc/en-us/articles/360026123554-Does-Surfshark-offer-a-free-trial
          quote: 'You can cancel your free trial anytime in your Surfshark account'
      lastVerified: 2026-11-19
    - topic: billing.renewal-notice
      tier: good
      reason: 'It emails you 30 days before a plan longer than a month renews. Monthly plans get no reminder.'
      sources:
