# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), read with Edge from Canada: surfshark.com's
# pricing page (its 24-month, 12-month and 1-month views, its plan comparison, whose ticks are each cell's label, "Ad
# blocker - Included in Starter plan", and its FAQ), its "Billing Practices, Currency Policy & Renewal Prices" page
# (surfshark.com/terms-of-service/pricing, where the pricing page's "renewal price." link leads), its terms of service,
# privacy policy, cookie policy, about page, trust center, servers page and its post on port forwarding; its help
# centre's articles through its Zendesk API (support.surfshark.com). The renewal price page and the pricing page again on
# 2026-11-19 through US, UK, Irish, Australian, New Zealand, German, French, Dutch, Spanish and Italian exits (each exit's
# country confirmed, each page in the country's currency: $, £, €, A$, NZ$).
# Pricing: the renewal price page lists each plan's regular price by period, "listed according to your current
# location/IP address (before taxes)", and "All subscription plans renew automatically at the full price"; the pricing
# page's 12- and 24-month cards are first-term offers ("CA$91.53 for the first 27 months (VAT may apply).") and its 1-month
# cards the renewal page's monthly prices ("$18.95 /mo. Billed monthly"). A 2-year plan "renews for 1-year term" at the
# yearly price, so no 2-year price is stored. No price includes tax: "Renewal prices (before taxes)" and "Any fees charged
# by Surfshark are exclusive of taxes." (its terms).
# Plans: Starter, One and One+, the same in every country read ("Surfshark offers the following plans: Surfshark Starter
# Surfshark One Surfshark One+", What are Surfshark subscription plan options?). One+'s identity theft coverage is for US
# residents only ("Available for US residents, except for New York State."), so it's in One+'s notes, not a feature.
# New Zealand: its pages show NZ$ prices (Starter NZ$32.99 a month and NZ$143.69 a year, One NZ$34.69 and NZ$180.06,
# One+ NZ$39.79 and NZ$216.44), but its currency policy charges New Zealand in US dollars converted from them ("USD:
# United States and the rest of the world (not listed above).", and "If your billing currency is different (as per the
# policy above), these amounts will be converted."). The catalog can't hold a price in NZD charged in USD
# (billingCurrency needs a price in the charged currency), so New Zealand is left unpriced (Coverage, notes.md).
# Region checklist for CA and US, 2026-11-19: 1. no locale paths for prices (its language paths, /de/ and the others,
# change the language only); 2. no country or currency picker; 3. the renewal page names the currency (CA$, and the US's
# $ read through a US exit, "USD: United States" in its currency policy); 4. checkout not opened; 5. its currency policy
# ("CAD: Canada"); 6. Edge, and a plain fetch; 7. no bill offered.
# Bundles: none. Official resellers: none named as shops. Its terms name "Paddle, Google Play, or Cleverbridge" as
# resellers whose sales it refunds (payment companies and an app store that bill for it: partners, not listed).
# Free use: none; a 7-day free trial on 12- and 24-month plans turns into the paid plan.

# Coverage: surfshark.* in NZ: its pages price New Zealand in NZ$ but charge it in US dollars converted from them (its
# currency policy, read 2026-11-19 through a New Zealand exit), so no price in the charged currency is known.

id: surfshark
name: Surfshark
aliases: [surfshark vpn, surfshark one]
website: https://surfshark.com
category: vpn
spendCategory: software
# Its currency policy, read 2026-11-19: "GBP: United Kingdom", "EUR: European Economic Area (EEA)", "CAD: Canada",
# "AUD: Australia" and "USD: United States and the rest of the world (not listed above)." (New Zealand among them).
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
cancelUrl: https://support.surfshark.com/hc/en-us/articles/360003069694-How-to-cancel-auto-renewal-for-your-Surfshark-subscription
sources: { pricing: https://surfshark.com/pricing }
# Ways to pay (M11.5), read 2026-11-19: its help article lists cards, PayPal, Google Pay, Apple Pay and crypto; app
# stores from its plans article. Accepted cards: none named in words. The pricing page's footer shows Mastercard, Visa,
# Amex and Discover logos only (image titles), and its "Why am I unable to make a payment?" names Visa and Mastercard
# only for prepaid cards ("we do not accept gift cards or prepaid cards, except for Visa or Mastercard prepaid cards"),
# so no acceptedNetworks.
paymentMethods:
  - methods: [card, paypal, google-pay, apple-pay, crypto]
    page: 'What payment options do you offer?'
    url: https://support.surfshark.com/hc/en-us/articles/360003069034-What-payment-options-do-you-offer
    quotes:
      - 'Credit and debit cards'
      - 'PayPal'
      - 'Google Pay'
      - 'Apple Pay'
      - 'Cryptocurrency (cannot be used on mobile devices)'
  - methods: [app-store]
    page: 'What are Surfshark subscription plan options?'
    url: https://support.surfshark.com/hc/en-us/articles/8958891462418-What-are-Surfshark-subscription-plan-options
    quotes:
      - 'You can buy plans directly on the App Store or Google Play Store if you are using an Android or an iOS device.'
# Renewal day (M11.5), read 2026-11-19: not stated. Its terms renew "at the end of each service period", and its renewal
# page emails "30 days before the ending date"; its subscription article shows "Your expiration date" in the account,
# with no day named.
renewalAnchor:
  kind: not-stated
  pages:
    - https://surfshark.com/terms-of-service
    - https://surfshark.com/terms-of-service/pricing
    - https://support.surfshark.com/hc/en-us/articles/17673853278226-Manage-your-subscription
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19: its terms name Surfshark B.V. in the Netherlands, and its about page says "In 2022,
# Surfshark and Nord Security merged under one holding company to form a cybersecurity powerhouse while operating
# independently." No page names that holding company, so the company that runs it is the owner and the merger is in the
# provider's notes (notes.md). Private: no page names a listing.
notes: Surfshark and Nord Security (NordVPN's owner) merged under one holding company in 2022 and run independently.
owner:
  name: Surfshark B.V.
  page:
    name: Terms of Service
    url: https://surfshark.com/terms-of-service
  quotes:
    - 'Your contract is concluded with Surfshark B.V., a company established in the Netherlands.'
  country:
    code: NL
  lastVerified: 2026-11-19

# Free use (the owner's item of 2026-11-09), read 2026-11-19: none. Its free trial ("Does Surfshark offer a free trial?")
# turns into a 12- or 24-month plan; its terms' "Only some of our Services are free of charge." are its free web tools
# (the data leak checker in its privacy policy), not a plan.
freeUse:
  kind: none
  pages:
    - https://surfshark.com/pricing
    - https://support.surfshark.com/hc/en-us/articles/360026123554-Does-Surfshark-offer-a-free-trial
    - https://surfshark.com/terms-of-service
  lastVerified: 2026-11-19

# General features, read 2026-11-19. Platforms: "Surfshark is compatible with the newest Windows, macOS, Linux, Android,
# iOS, Android TV, AppleTV, and FireTV devices." and "We also have browser extensions for Chrome, Firefox, and Edge." (the
# pricing page's FAQ). Sign-in: an email and password, 2FA "via an authentication application" or "with your email
# address" (How to enable 2FA on your Surfshark account), or Google or Apple (How to create a Surfshark account with Google
# or Apple). Support: "Surfshark offers 24/7 customer support via live chat and email" ("Surfshark does not offer phone
# support."). App languages: surfshark.com's language menu (English, Deutsch, Español, Français, Italiano, Nederlands,
# Polski, Português, Suomi, Türkçe, Русский, Українська, 한국어, 简体中文, 香港繁體, 台灣繁體, 日本語). Closed source: no
# page offers its code. No pause; no parental controls (its web content blocker is a filter you set for yourself).
features:
  platforms: [windows, macos, linux, android, ios, browser-extension, tv]
  account.sign-in: [password, totp, email-code, sso]
  support.channels: [email, chat, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh]

# Perks (M11.6): the comparison's lines no feature describes, in its words.
perks:
  - id: alternative-id
    name: Alternative ID
  - id: rotating-ip
    name: Rotating IP
  - id: cookie-popup-blocker
    name: Cookie pop-up blocker
  - id: surfshark-search
    name: Surfshark Search

# VPN features, read 2026-11-19, the same on every plan (the comparison's "Fast and secure VPN", "Unlimited devices",
# "Ad blocker", "Bypasser (split tunneling)", "Rotating IP" and "Dynamic MultiHop (double VPN)" are "Included in" all
# three):
# - Devices: "Surfshark Starter, One, and One+ allow an unlimited number of devices to connect simultaneously under a
#   single subscription." (How many devices can I use with Surfshark simultaneously?). Its terms keep a fair-use limit
#   it doesn't state (a Notable rating below).
# - Traffic: "Surfshark does not apply any speed, data, or bandwidth limitations, although VPN encryption can cause up to
#   20-30% decrease in speeds." (its FAQ article), so its monthly VPN data is unlimited.
# - Countries: "We have 4500+ servers across 100 countries." (its trust center; the pricing page's "4500+ servers in 100
#   countries").
# - Protocols: "WireGuard, OpenVPN, and IKEv2 VPN, as well as our in-house build protocol Dausos" (trust center; Dausos
#   has no registry value and runs only on macOS); obfuscation: "while using this protocol on Surfshark, you are using
#   obfuscated servers" (OpenVPN, What protocols can I use with Surfshark?) and NoBorders (stealth).
# - Kill switch on Windows, macOS, Android, iOS and Linux (How to use Kill Switch); MultiHop, "a feature often called
#   Double VPN"; P2P: its servers page lists P2P servers by country ("P2P" beside each country). Its Tor article only
#   says the Tor Browser works while connected, so no Tor over VPN. "Surfshark VPN does not support port forwarding"
#   (its blog's port forwarding post). No page offers connecting your own devices to each other, so vpn.mesh is false.
# - Content blocking: CleanWeb, "included in every single one of our subscription packages", "blocks ads and malicious
#   websites. With CleanWeb enabled, the browser will show fewer ads, and fewer trackers will work." (ads, trackers,
#   malware); One and One+ add the "web content blocker", which blocks "Adult, drug (including tobacco), gambling, hate,
#   profanity, and weapon websites" (adult content, gambling).
# - No-logs policy and audits (its trust center): Deloitte's no-logs assurance reports of 2023 and 2025 (no-logs);
#   "2026 — Cure53 carried out an independent audit of our infrastructure and new protocol Dausos" and SecuRing's 2025
#   infrastructure audit (servers); "2025 - SecuRing conducted a security assessment. Our web, desktop, mobile
#   applications, and browser plugins demonstrated strong protection" (apps).
# - RAM-only servers: "Yes, Surfshark uses 100% RAM-only servers, rather than hard drives." (its trust center).
# - Not anonymous: an account needs "an e-mail address and password" (its terms) or a Google or Apple account.
# - Speeds (notes only, its own claims): "All of our servers are equipped with 10Gbps ports, and in the high-traffic
#   area, we offer up to 100Gbps servers" (trust center).
# One and One+'s security features (the comparison): Antivirus ("Scheduled scans", "Webcam protection", "Real-time
# protection"; "Surfshark Antivirus service allows a maximum of five simultaneous connections per account.", its terms),
# Scam protection ("Scam text protection", "Email scam checker", "Web content blocker"; "Scam call protection" is "COMING
# SOON"), and Alert ("Personal data leak alerts", "Credit card leak alerts", "ID leak alerts"). One+ adds Incogni ("Data
# removal from company databases", "Data removal from people search sites"). Categories (M11.3): Starter is a VPN; One
# and One+ are also an antivirus (security).
plans:
  - id: surfshark.starter
    name: Starter
    link: https://surfshark.com/pricing
    features:
      vpn.included: true
      vpn.devices: unlimited
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 100
      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
