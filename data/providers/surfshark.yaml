    perks: [alternative-id, rotating-ip, cookie-popup-blocker]
    notes: 'The VPN on unlimited devices, with an ad blocker and Alternative ID, which makes up masked emails and personal details to sign up with.'
    addOnIds: [surfshark.dedicated-ip, surfshark.alternative-number]
