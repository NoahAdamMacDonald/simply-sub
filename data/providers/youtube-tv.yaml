# family groups); live channels, with sports on the plans named for them and on the Main Plan; 4K, downloads of
# recordings and unlimited streams at home only with 4K Plus ("With 4K Plus, unlock unlimited simultaneous streams at
# home, the ability to watch recordings offline, and a 4K viewing experience on select content"), which an add-on
# can't add to a plan's features here, so the plans have 3 streams and no downloads. Video quality: its streaming help
