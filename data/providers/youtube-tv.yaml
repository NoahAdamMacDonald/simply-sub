# Terms and policies, read 2026-11-04 (M11.15): the YouTube Terms of Service, the Paid Service Terms (the clauses every
# country's version shares, from Canada, and YouTube TV's additional terms, through a US exit: they're in the US
# version only), YouTube TV Help's articles on cancelling, refunds, trials, family groups and home areas, and Google's
# Privacy Policy (data/policies/google-privacy.yaml), which YouTube TV's terms say "controls the use, collection and
# sharing of data". Inactivity and security are Google's account and Vulnerability Reward Program pages, as for
# YouTube.
policies:
  shared: [google-privacy]
  links:
    - name: 'Terms of Service'
      url: https://www.youtube.com/t/terms
    - name: 'Paid Service Terms of Service'
      url: https://www.youtube.com/t/terms_paidservice
    - name: 'Paid Service Terms, with YouTube TV’s (US)'
      url: https://www.youtube.com/t/terms_paidservice?gl=US&hl=en
    - name: 'Cancel or pause'
      url: https://support.google.com/youtubetv/answer/7129668
    - name: 'Refunds'
      url: https://support.google.com/youtubetv/answer/7298539
    - name: 'Free trials'
      url: https://support.google.com/youtubetv/answer/11020997
    - name: 'Family groups'
      url: https://support.google.com/youtubetv/answer/7251139
    - name: 'Home area'
      url: https://support.google.com/youtubetv/answer/7129768
    - name: 'Inactive Google Accounts'
      url: https://support.google.com/accounts/answer/12418290
    - name: 'Vulnerability Reward Program'
      url: https://bughunters.google.com/about/rules/google-friends/google-and-alphabet-vulnerability-reward-program-vrp-rules
  ratings:
    - topic: privacy.ai-training
      status: not-applicable
      reason: 'You only watch and record on YouTube TV; you post nothing an AI could train on.'
      pages: [https://www.youtube.com/t/terms_paidservice?gl=US&hl=en]
      lastVerified: 2026-11-04
    - topic: privacy.children
      tier: neutral
      reason: "Everyone in a family group must be 13 or older. Its pages say nothing more about children's data."
      sources:
        - url: https://support.google.com/youtubetv/answer/7251139
          quote: 'You can invite family members (13 or older) to join your family group.'
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel online at any time, past an offer to pause, and keep watching until the end of the period you paid for.'
      sources:
        - url: https://support.google.com/youtubetv/answer/7129668
          quote: 'You can cancel or pause your YouTube TV membership at any time.'
        - url: https://support.google.com/youtubetv/answer/7129668
          quote: "When you cancel or pause your membership, you'll still have access to YouTube TV until the end of your payment period."
        - url: https://support.google.com/youtubetv/answer/7129668
          quote: 'Chat with us to explore options to pause or customize your plan.'
      action:
        name: 'Cancel or pause'
        url: https://support.google.com/youtubetv/answer/7129668
      lastVerified: 2026-11-04
    - topic: billing.refunds
      tier: neutral
      reason: "You don't get money back when you cancel, but you keep watching to the end of the period. It refunds when its features don't work."
      sources:
        - url: https://support.google.com/youtubetv/answer/7129668
          quote: "When you cancel or pause your membership, you'll still have access to YouTube TV until the end of your payment period."
        - url: https://support.google.com/youtubetv/answer/7298539
          quote: 'If features included with your YouTube TV membership are defective, or do not perform as stated, click the button below to request a refund.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      tier: neutral
      reason: "It tells you before a new price applies, and you can cancel first, but it doesn't say how far ahead."
      sources:
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'Any changes to pricing for Paid Services with recurring payments will only apply following reasonable notice to you.'
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'you can cancel the Paid Service before the start of the next subscription period in which the new price applies'
      lastVerified: 2026-11-04
    - topic: billing.free-trials
      tier: poor
      reason: 'Its trial needs a payment method up front and turns into a paid plan unless you cancel, which you can do at any time during it; it names no reminder.'
      sources:
        - url: https://support.google.com/youtubetv/answer/11020997
          quote: 'When your account switches from a free trial to a paid membership, you’ll be charged the standard price for the plan you signed up for (plus any add-on networks you’ve subscribed to).'
        - url: https://support.google.com/youtubetv/answer/11020997
          quote: "If you cancel your subscription during your free trial, you'll still retain access to YouTube TV features until the end of the trial period."
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'You must have a valid, accepted payment method on file in order to purchase Paid Services, or to participate in no-cost trial offers or other no-cost offers related to the Paid Services.'
      lastVerified: 2026-11-04
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its pages say your plan renews every month on its own, but not that it reminds you first.'
      pages:
        - https://support.google.com/youtubetv/answer/11020997
        - https://www.youtube.com/t/terms_paidservice
      lastVerified: 2026-11-04
    - topic: billing.fees
      tier: poor
      reason: 'Besides the price and taxes, it can add bank fees and the cost of currency changes, without saying how much.'
      sources:
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'Google will charge your payment method for the price listed for the relevant Paid Service along with any additional amounts relating to applicable taxes, bank fees and currency fluctuations.'
      lastVerified: 2026-11-04
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its pages don’t say what happens to what you’ve paid when you switch plans.'
      pages: [https://support.google.com/youtubetv/answer/7129668]
      lastVerified: 2026-11-04
    - topic: legal.disputes
      tier: good
      reason: 'Disputes go to the courts of Santa Clara County, California, under California law, with no arbitration.'
      sources:
        - url: https://www.youtube.com/t/terms
