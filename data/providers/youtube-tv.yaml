# Researched by hand on 2026-11-04 (M11.15, the streaming category), read through a US exit (the owner's choice of
# 2026-11-04) for its sign-up pages, and from Canada for YouTube TV Help, which is the same everywhere. Pages, each
# quoted where it's used:
# Pricing: tv.youtube.com/welcome and its plans page (tv.youtube.com/learn/explore-plans), whose footnote gives every
# plan's regular price after its offer: "Main Plan ($82.99/mo), Sports Plan ($64.99/mo), Sports + News ($71.99/mo),
# Sports + Entertainment ($71.99/mo), Sports + News + Family ($77.99/mo), Sports + Entertainment + Family ($77.99/mo),
# Entertainment ($54.99/mo), News + Entertainment ($62.99/mo), News + Entertainment + Family ($69.99/mo)". The offers
# ($49.99 for five months of Sports + News, $59.99 for two of the Main Plan) are first-term prices, so not stored.
# Add-ons, on the welcome page: 4K Plus ($9.99/mo), NFL RedZone with Sports Plus ($10.99/mo) and Spanish networks
# ($14.99/mo), "Add-ons for everyone"; not listed: single premium networks ("From $1.99/mo") and the Entertainment Plus
# bundle of HBO Max, Paramount+ with Showtime and STARZ ($29.99/mo), which sells other services' channels.
# Where it's sold: the US only (YouTube TV Help's family groups article: the family manager must "Live in the United
# States").
# Region checklist, 2026-11-04: a US-only service, so no other region to read.
# Its additional terms are in the Paid Service Terms only as served in the US (an address with gl=US still shows
# Canada's), so the ratings quote YouTube TV Help and the parts of the Paid Service Terms every country's version
# shares.

id: youtube-tv
name: YouTube TV
website: https://tv.youtube.com
# Google's help centres (YouTube TV Help, and the accounts help the shared privacy document cites) and its legal pages.
domains: [support.google.com, policies.google.com]
category: streaming
spendCategory: streaming
# Where it's sold (2026-11-10): "YouTube TV is available in the United States." (YouTube TV Help, "Watch YouTube TV
# while traveling") and "YouTube TV is available throughout the United States." (answer 7370552).
availableIn: [US]
billingCurrency: { US: USD }
cancelUrl: https://support.google.com/youtubetv/answer/7129668
sources: { pricing: https://tv.youtube.com/learn/explore-plans/ }
# Payment methods, read 2026-11-04: cards (its refunds article: "Credit card refunds typically take 3-5 business days"),
# a YouTube gift card's Google Play balance ("You can then use the balance to pay for: ... YouTube TV", YouTube Help),
# and billing by "a mobile carrier or internet provider" (its billing article). No page lists the card networks, so
# no acceptedNetworks.
paymentMethods:
  - methods: [card]
    page: 'Request a refund for YouTube TV'
    url: https://support.google.com/youtubetv/answer/7298539
    quotes:
      - 'Credit card refunds typically take 3-5 business days.'
  - methods: [gift-card]
    page: 'Redeem a YouTube gift card or code'
    url: https://support.google.com/youtube/answer/7259382
    quotes:
      - 'Use a YouTube gift card or code to make purchases on YouTube.'
  - methods: [provider-billing]
    page: 'Update billing & payments for YouTube TV'
    url: https://support.google.com/youtubetv/answer/7129667
    quotes:
      - 'If you signed up for YouTube TV through a mobile carrier or internet provider, you’ll be billed by them.'

# Owner: Google LLC, as for YouTube (its paid services' provider), part of Alphabet.
owner:
  name: 'Google LLC, owned by Alphabet Inc.'
  website: https://abc.xyz
  page:
    name: "Alphabet's founders' letter"
    url: https://abc.xyz/
  quotes:
    - 'What is Alphabet? Alphabet is mostly a collection of companies. The largest of which, of course, is Google.'
    - 'Google will become a wholly-owned subsidiary of Alphabet. Our two classes of shares will continue to trade on Nasdaq as GOOGL and GOOG.'
  country:
    code: US
    page:
      name: Terms of Service
      url: https://www.youtube.com/t/terms
    quotes:
      - 'The entity providing the Service is Google LLC, a company operating under the laws of Delaware'
    lastVerified: 2026-11-04
  stock:
    company: Alphabet Inc.
    listings:
      - { exchange: Nasdaq, symbol: GOOGL }
      - { exchange: Nasdaq, symbol: GOOG }
  lastVerified: 2026-11-04

# Renewal day (M11.5), read 2026-11-04 in its free trial article: the day you're first charged recurs each month. It
# doesn't say what happens in a shorter month.
renewalAnchor:
  kind: same-date
  page: Start a YouTube TV free trial
  url: https://support.google.com/youtubetv/answer/11020997
  quotes:
    - 'The date of this charge will become your monthly billing date going forward.'
  lastVerified: 2026-11-04

# Free use (2026-11-09, the owner's item: services used free, with ads or limits): none: its plans page sells paid plans
# and a trial only.
freeUse:
  kind: none
  pages: [https://tv.youtube.com/learn/explore-plans/]
  lastVerified: 2026-11-09

# Perks (M11.6): what tells its plans apart that no feature describes, in their words: the channel genres each plan
# carries besides sports (the plans page's tabs: "Sports", "News", "Entertainment", "Family"), and "Unlimited DVR
# space" on every plan.
perks:
  - id: news-channels
    name: News channels
  - id: entertainment-channels
    name: Entertainment channels
  - id: family-channels
    name: Family channels
  - id: unlimited-dvr
    name: Unlimited DVR space

# General features, read 2026-11-11: tv.youtube.com's language menu lists English and Spanish. Pause: "When you pause
# your membership, you can choose the length of this paused state, from 4 weeks up to 6 months" (Cancel or pause your
# YouTube TV membership), for its base plans. No parental controls: its age-rating filter is set from the
# signed-in profile, with no PIN.
# Apps and support, read 2026-11-04: "Your smart TV", "Your phone or tablet", "Your game console" and tv.youtube.com,
# with iOS and Android apps (the welcome page); a Google Account's sign-in, as for YouTube; "We’re here to help 24/7",
# by phone and live chat (the plans page: "Call us to speak to an agent", "Start a live chat with an agent").
features:
  platforms: [android, ios, web, tv, console]
  account.sign-in: [password, passkey, push-approval, totp, security-key, sms]
  support.channels: [phone, chat, 24-7]
  languages.interface: [en, es]

# Features, read 2026-11-04: "6 household accounts and 3 streams" and "Unlimited DVR space" on every plan (the welcome
