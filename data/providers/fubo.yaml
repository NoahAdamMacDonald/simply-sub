# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 in Edge: its Terms of Service ("Effective Date:September 10,
# 2025", fuboTV Media, Inc.'s, one document for the US and Canada: the en-US and en-CA versions are the same text) and
# Privacy Policy ("Effective Date:May 27, 2026"), its own, not The Walt Disney Company's (data/policies/disney-privacy.yaml
# doesn't apply: Fubo's policy names "fuboTV Media Inc. and its parent and affiliates"); its sign-up form
# (fubo.tv/signup: "Email", "Password", "Home postal code" and "By continuing, I agree to the Terms of Service,
# acknowledge the Privacy Policy, and agree to receive promotional emails regarding Fubo.", read without typing); its
# security.txt; and its help centre's cancelling, refunds, trial, billing, fees, privacy, sharing, home network and DVR
# articles. Its apps have no licence of their own (the terms' 7.b licenses them "for your own lawful, personal,
# non-commercial use"). Not read: Spain's own terms and privacy policy (fubo.tv in Spain links legal pages not opened
# here), its Privacy Center's request form (a dialog that showed no text), its cookie policy, and the steps after the
# sign-up form. Calibrated against YouTube TV and Curiosity Stream.
policies:
  links:
    - name: 'Terms of Service'
      url: https://legal.fubo.tv/policies/en-US/?name=terms-of-service
    - name: 'Privacy Policy'
      url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
    - name: 'Sign up'
      url: https://www.fubo.tv/signup
    - name: 'Fubo Sports'
      url: https://www.fubo.tv/stream/fubo-sports/
    - name: 'security.txt'
      url: https://www.fubo.tv/security.txt
    - name: 'What Is Fubo’s Cancellation Policy?'
      url: https://support.fubo.tv/hc/en-us/articles/360004457571-What-Is-Fubo-s-Cancellation-Policy
    - name: 'How do I Cancel My Fubo Subscription?'
      url: https://support.fubo.tv/hc/en-us/articles/360021527991-How-do-I-Cancel-My-Fubo-Subscription
    - name: 'How do Annual Plans with Monthly Billing Work? (Canada)'
      url: https://support.fubo.tv/hc/en-ca/articles/40220269315085-How-do-Annual-Plans-with-Monthly-Billing-Work
    - name: 'How am I billed for Fubo?'
      url: https://support.fubo.tv/hc/en-us/articles/4495904869517-How-am-I-billed-for-Fubo
    - name: 'How does the free trial work?'
      url: https://support.fubo.tv/hc/en-us/articles/115003648828-How-does-the-free-trial-work
    - name: 'What is the Regional Sports Fee?'
      url: https://support.fubo.tv/hc/en-us/articles/360046050051-What-is-the-Regional-Sports-Fee
    - name: 'How can I manage my privacy?'
      url: https://support.fubo.tv/hc/en-us/articles/18450594233357-How-can-I-manage-my-privacy
    - name: 'How Many Devices Can I Stream Fubo From at the Same Time?'
      url: https://support.fubo.tv/hc/en-us/articles/115001440248-How-Many-Devices-Can-I-Stream-Fubo-From-at-the-Same-Time
    - name: 'How does Cloud DVR on Fubo work?'
      url: https://support.fubo.tv/hc/en-us/articles/115002082007-How-does-Cloud-DVR-on-Fubo-work
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you watch and how you use it, and may combine that with what you do on other sites and apps. You can turn off only some of it, tool by tool.'
      sources:
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'We and vendors on our behalf also may combine diagnostic and usage information collected on our Services with other information about your online activities over time, including use of other devices, websites, or apps, if such services also use the same vendors.'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'To prevent Google Analytics from using your information for analytics, you may install the Google Analytics Opt-out Browser Add-on by clicking here.'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'On select platforms, Fubo uses Nielsen’s proprietary measurement software to inform us and advertising service providers of the content consumption habits of our users to better serve their needs.'
      action:
        name: 'Your rights and choices (privacy policy)'
        url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: bad
      reason: 'It may sell your information to other companies for their own use. Only people where a law gives them the right, such as some US states, can say no.'
      sources:
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'we may disclose (including by selling, renting, or licensing or making available) your information to other businesses or third parties for use for their own purposes for monetary or other valuable consideration.'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'Depending upon your jurisdiction, you may opt out of such sales by contacting us as described in this Policy.'
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It picks ads for you from what you do. You can opt out only device by device, and for its apps only by emailing it.'
      sources:
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'Customize content, preferences, and advertising (including targeted advertising) on or for the Services;'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'Please note that these opt-outs apply per device, so you will have to opt-out for each device through which you access our Services.'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'You must still email us as set forth above to opt out for our streaming Services.'
      action:
        name: 'Your rights and choices (privacy policy)'
        url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its terms say its chat tools may use AI language models, but neither they nor its privacy policy say whether what you write trains AI.'
      pages:
        - https://legal.fubo.tv/policies/en-US/?name=terms-of-service
        - https://legal.fubo.tv/policies/en-US/?name=privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it decides it needs it, and names no time limits.'
      sources:
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'We keep your information for as long as we determine is necessary for the purposes for which it is processed.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask it to delete your account and information through its Privacy Center, but it doesn’t say how long that takes.'
      sources:
        - url: https://support.fubo.tv/hc/en-us/articles/18450594233357-How-can-I-manage-my-privacy
          quote: 'Select Delete all my data'
        - url: https://support.fubo.tv/hc/en-us/articles/18450594233357-How-can-I-manage-my-privacy
          quote: 'Once received, we will delete your Fubo account and all personal information, with the exception of some data we keep in order to comply with applicable laws.'
      action:
        name: 'Make a Privacy Request'
        url: https://legal.fubo.tv/policies/en-US/?modal=take-control
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      status: not-stated
      reason: 'Its privacy policy offers a copy of your information only where a local law gives you that right.'
      pages: [https://legal.fubo.tv/policies/en-US/?name=privacy-policy]
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over information when the law or a court order asks for it, and says nothing about telling you or publishing how often.'
      sources:
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'We may access, retain and disclose the information we collect and maintain about you if required to do so by law or in a good faith belief that such access, retention, or disclosure is reasonably necessary to: (i) comply with law (e.g., disclosure to regulators) or legal process (e.g., a subpoena or court order);'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: poor
      reason: 'Your information is kept in the US, and may also go to other countries, with safeguards it doesn’t describe.'
      sources:
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'The data is we collect through the Services is stored on secure servers located in the United States.'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'We may also store information on servers and equipment in other countries depending on a variety of factors, including the locations of our users and vendors.'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'We will ensure that transfers of personal data to a third country or an international organization are subject to appropriate safeguards.'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with an email address, a password and your home postal code, which decides your channels, then a card to pay.'
      sources:
        - url: https://www.fubo.tv/signup
          quote: 'Your location determines what channels are available to you.'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'This includes your email, password, and zip code, and you may also register using third party single sign on credentials such as those for Apple, Google, and Facebook.'
      lastVerified: 2026-11-13
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 18 to open an account, and it says it doesn’t knowingly collect information from children under 13. It has no Kids profiles.'
      sources:
        - url: https://legal.fubo.tv/policies/en-US/?name=terms-of-service
          quote: 'You may not register for an account if You are under the age of 18.'
        - url: https://legal.fubo.tv/policies/en-US/?name=privacy-policy
          quote: 'We do not knowingly collect personal information from children under 13.'
      lastVerified: 2026-11-13
