# Researched by hand on 2026-11-13 (M11.15, streaming batch 8), read with Edge from Canada (fubo.tv prices Canada in
# C$ for this machine), through a US exit for the US's pages and through a Spanish exit for Spain's, its help centres
# (support.fubo.tv's en-us and en-ca articles, and Fubo Spain's fubotv-espana.zendesk.com, every article through their
# public article lists) with a plain fetch, and its terms and privacy policy (legal.fubo.tv) in Edge. Pages, each quoted
# where it's used:
# Pricing: its plans page (fubo.tv/welcome/plans) prices by where the visitor is, and the plan data it loads
# (api.fubo.tv/subscriptions/products, read as part of the page) names each country's currency. Canada ("CAD"): Sports
# Monthly C$31.49, Sports Quarterly "C$83.97 every 3 months", Sports Annual "C$293.99 every 12 months", Sports Pro
# Monthly C$54.99, Sports Pro Quarterly "C$149.97 every 3 months", Sports Pro Annual "C$449.93", Cricket with Sports Plus
# C$9.99, "C$26.96" every 3 months and "C$89.93" every 12 months, MLB.TV Monthly "C$39.99/mo after trial" and MLB.TV
# Annual "C$239.90" every 12 months; the first-term offers ("C$44.97" for the first quarter, "C$230.99" for the first
# year, Sports Pro's "C$39.99 for the first month" and "C$134.97" for the first quarter) aren't stored. Through a US exit
# ("USD"): Pro "$88.99 per month", Elite "$98.99 per month" and Latino "$19.99 per month" after a first-month offer, the
# plans page's only plans for new subscribers there; Fubo Sports on its own page (fubo.tv/stream/fubo-sports: "$54.99
# for month 1, $64.99/mo thereafter"). Spain: fubo.tv/welcome through a Spanish exit, in its FAQ: "3,99€/mes con la
# suscripción anual, 4,99€/mes con la trimestral o 5,99€/mes con la suscripción mensual" (its plans page answered "No
# pudimos recuperar los planes disponibles": the plan data failed there). Spain's quarterly and yearly amounts are those
# per-month rates times 3 and 12 (14.97 and 47.88), since the FAQ prices them by the month.
# Also sold, not listed: Canada's monthly plans "With a 12 month commitment" (Sports C$25.99, Sports Pro C$44.99 a
# month; the plans' notes), the US's Core and Ultra ("currently only available in select markets", priced only in a
# help article for existing subscribers) and older plans (Essential, Ultimate, Deluxe), Fubo Sports Quarterly ($194.97,
# for existing subscribers), Latino quarterly and yearly ("only the Latino monthly plan is currently available for
# purchase"), My Local Sports (an add-on to Fubo Sports "Starting at" $9.99 more, by region), and the add-ons that sell
# another service or a single network (MLB.TV, DAZN, Paramount+ with SHOWTIME, STARZ, MGM+ and their bundle, FOX Nation,
# Hallmark+, RAI Italia, TV5MONDE, Zee Family; Canada's MLB.TV, DAZN, ATN Cricket and Super Channel), as YouTube TV's
# premium networks are. Add-ons a plan already includes (Unlimited DVR, Family Share, Unlimited Screens, Premier League
# 4K) are listed only where a plan can add them.
# Region checklist for CA, US and ES, 2026-11-13: 1. no country paths (fubo.tv/ca is a page not found; the help centre
# has en-us, en-ca, es-us and es-es locales); 2. a postal code picker, no country picker; 3. the plan data, which names
# CAD and USD; 4. the sign-up form up to its email, password and postal code, typing nothing; 5. the help centres'
# plans, billing and availability articles; 6. Edge from Canada and through each exit, and a plain fetch; 7. no bill
# offered. The UK, Ireland, Australia, New Zealand, Germany, France, the Netherlands and Italy aren't sold (availableIn).
# Bundles: none. Fubo and Hulu + Live TV are one company's but "separate services" (its help centre), and fubo.tv only
# links to hulu.com for Hulu + Live TV. Official resellers: none; no gift cards. Partners: Roku bills its plans ("Roku
# In-App Billing"), and Amazon Prime Video Channels sells Fubo Sports Network, a channel of its own, in Canada; noted.
# Free use: Fubo Free, for "select former Fubo subscribers" on "select devices" in the US (fubo.free).
# Renewal day: its billing article says "The date that you are billed is based on the date you became a paying Fubo
# subscriber." and "if you were first billed for service on March 17th, you will be billed and your subscription will
# automatically renew on the 17th of each subsequent month unless you choose to cancel": the date you signed up.

# Coverage: fubo.pro, fubo.elite, fubo.sports-news, fubo.latino and fubo.free in CA and ES: Canada's and Spain's plan
# pages and help centres sell other plans ("The programming available in these countries is not the same as what's
# available in the U.S.", Is Fubo available in my country?).
# Coverage: fubo.sports, fubo.sports-pro, fubo.cricket and fubo.mlb-tv in US and ES: Canada's plans, sold only there
# (the US's and Spain's plan pages list none of them).
# Coverage: fubo.spain in CA and US: Spain's plan, sold only there (its own help centre and FAQ).

id: fubo
name: Fubo
website: https://www.fubo.tv
# Its investor files (s21.q4cdn.com, linked from ir.fubo.tv's Annual Reports) and Fubo Spain's help centre.
domains: [s21.q4cdn.com, fubotv-espana.zendesk.com]
category: streaming
spendCategory: streaming
# Where it's sold, read 2026-11-13: "Fubo is available in Canada, the US/US territories, and Spain." (Is Fubo available
# in my country?, en-ca). The US territories aren't named, so they're left out.
availableIn: [US, CA, ES]
billingCurrency: { US: USD, CA: CAD, ES: EUR }
cancelUrl: https://support.fubo.tv/hc/en-us/articles/360021527991-How-do-I-Cancel-My-Fubo-Subscription
# Canada's monthly plans "With a 12 month commitment" (the plans page), read 2026-11-13 in How do Annual Plans with
# Monthly Billing Work? (en-ca): "If you choose to cancel your annual plan with monthly billing before the end of your
# 12-month commitment, you will incur an early termination fee." Its other plans have none.
cancelFee: 'In Canada, the monthly plans with a 12-month commitment charge an early termination fee if you cancel before the 12 months end: C$49.50 for Sports, C$90.00 for Sports Pro.'
sources: { pricing: https://www.fubo.tv/welcome/plans }

