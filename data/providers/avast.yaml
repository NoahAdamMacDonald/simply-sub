# Researched by hand on 2026-11-13 (M11.15, security batch 1), read from Canada with Edge (each locale's store page) and a
# plain fetch (its product, subscription and legal pages, its FAQ and Gen Digital's pages). Pages, each quoted where
# it's used:
# Pricing: each locale's store (avast.com/<locale>/store) and product pages (/premium-security, /ultimate, /premium-vpn,
# /free-antivirus-download). Each locale prices in its own country's currency whoever reads it: its buy links name the
# country and currency ("ctry=US&lang=en&currency=USD", "ctry=GB ... GBP", "ctry=DE ... EUR"; Canada's "CAN$" and
# "currency=CAD"). Ireland has no locale of its own: "Europe (English)" (en-eu) is Ireland's ("ctry=IE&lang=en&currency=EUR").
# The regular price is the one each card names ("Savings compared to renewal price CAN$84.99/year.", "It automatically
# renews at £64.99/year unless cancelled.", "Einsparungen im Vergleich zum Verlängerungspreis (72,99 €/Jahr)"); the
# first year's is an offer, and the VPN's 2- and 3-year cards are first terms that renew yearly. Every plan is yearly
# (its subscription details: "an annual fee"). The store read in Edge showed the 1 PC + 1 mobile and VPN prices of every
# locale; the 10-device and Mac prices are each product page's other tabs, which its server sends with the page (a plain
# fetch), Canada's checked against Edge's (CA$109.99 and CA$159.99 for 10 devices). No page says its prices include tax.
# Region checklist for CA and US, 2026-11-13: 1. its locales (en-ca, fr-ca, en-us, es-us); 2. its country picker (the
# same); 3. its buy links name the country and currency; 4. the checkout wasn't opened; 5. its subscription details and
# billing FAQ; 6. Edge and a plain fetch; 7. no bill offered.
# Not drafted (notes.md): Cleanup Premium, AntiTrack, BreachGuard, Secure Browser PRO, Driver Updater, Mobile Security's
# own plans and its Simple Fix and Total Care services.
# Bundles: Ultimate is its own suite (a plan, includes-subscription). Official resellers: none named; its partner pages
# are for businesses and mobile carriers, and app stores bill its mobile apps (partners, not listed).
# Free use: Free Antivirus (its plan below).

# Coverage: avast.* in IE: priced from "Europe (English)", whose buy links name Ireland.

id: avast
name: Avast
website: https://www.avast.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its subscription details: "You can cancel your subscription via the Avast Account".
cancelUrl: https://www.avast.com/en-ca/subscription-details
sources: { pricing: https://www.avast.com/en-ca/store }
# Owner (M11.2), read 2026-11-13: Avast is Gen Digital's brand (Gen's Who We Are page; every avast.com page's "© 2026
# Gen Digital Inc."); its licence is Gen Digital Inc.'s in the Americas ("Gen Digital Inc. 60 E. Rio Salado Parkway,
# Suite 1000 Tempe, AZ 85281, USA") and Avast Software s.r.o.'s (Prague) in most of Europe. Shares: Gen's investor FAQs.
owner:
  name: Gen Digital Inc.
  website: https://www.gendigital.com
  page:
    name: 'Who We Are (Gen)'
    url: https://www.gendigital.com/us/en/who-we-are/
  quotes:
    - 'Gen is a global leader dedicated to powering Digital Freedom through its trusted consumer brands — including Norton, Avast, LifeLock, and MoneyLion.'
    - 'Our global workforce has dual headquarters in Prague, Czech Republic and Tempe, Arizona, USA.'
  country:
    code: US
  stock:
    listings:
      - { exchange: Nasdaq, symbol: GEN }
    page:
      name: 'Investor FAQs (Gen)'
      url: https://investor.gendigital.com/resources/investor-faqs/default.aspx
    quotes:
      - 'Gen’s ticker symbol is GEN.'
      - 'Gen’s common stock is traded on the Nasdaq Global Select Market.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: its subscription details ("your bank card or PayPal account") and its billing FAQ
# (AVKB76: subscriptions "purchased via Google Play Store" and "via the App Store"). No page read names the card networks.
paymentMethods:
  - methods: [card, paypal]
    page: 'Subscription details'
    url: https://www.avast.com/en-ca/subscription-details
    quotes:
      - 'A subscription is the commitment from Avast to you, our customer, that we will continuously work to protect, optimise and connect you virtually in exchange for an annual fee that we bill to your bank card or PayPal account.'
  - methods: [app-store]
    page: 'Billing FAQ'
    url: https://www.avast.com/faq/AVKB76
    quotes:
      - 'The information in this section only applies to subscriptions purchased via Google Play Store .'
      - 'The information in this section only applies to subscriptions purchased via the App Store .'
# Renewal day (M11.5, M11.21): the anniversary of the subscription, charged "up to 35 days prior to the anniversary of
# your subscription to Avast" (Subscription details): a new yearly item is charged 35 days early, the earliest it can be.
renewalAnchor:
  kind: same-date
  page: 'Subscription details'
  url: https://www.avast.com/en-ca/subscription-details
  quotes:
    - 'The fees will be charged to your stored payment details up to 35 days prior to the anniversary of your subscription to Avast.'
  chargedBefore: { days: 35, upTo: true }
  lastVerified: 2026-11-13
