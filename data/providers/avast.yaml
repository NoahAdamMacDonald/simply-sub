    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/avast-free-antivirus-26.6-261402/
    tested: Free Antivirus 26.6, Windows 11
  - rater: av-test
    subject: antivirus-performance
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/avast-free-antivirus-26.6-261402/
    tested: Free Antivirus 26.6, Windows 11
  - rater: av-test
    subject: antivirus-usability
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/avast-free-antivirus-26.6-261402/
    tested: Free Antivirus 26.6, Windows 11

# Categories (M11.3): an antivirus first (security); Ultimate and Premium VPN are VPN plans too. No plan has a password
# manager (Premium Security's "Protect your saved passwords" guards the browser's own).
# General features, read 2026-11-13: "Available for PC, Mac, Android, and iPhone/iPad" (its store). Sign-in, support
# channels and app languages: no page read lists them, so left out.
features:
  platforms: [windows, macos, android, ios]

# Perks (M11.6): Premium Security's Windows lines no feature describes, in its words.
perks:
  - id: remote-access-shield
    name: Remote Access Shield
  - id: sandbox
    name: Open suspicious files safely

# Premium VPN in depth (en-ca/premium-vpn, read 2026-11-13): "Kill Switch, built in", "Choose which apps skip the VPN with
# Split Tunnel", "Double VPN" ("Routes your traffic through two secure servers"), "Find our server locations that support
# P2P (peer-to-peer) networking", "OpenVPN" on Windows and Android and "IPsec" on Apple's (no registry value fits IPsec
# without a guess), and "Our proprietary protocol helps maintain your VPN connection when websites or services try to
# detect or limit VPN traffic" (obfuscation: stealth), "10 devices". No-logs: "We don't log activity that could be traced
# back to you." No audit named. Server countries: "over 100 server locations" names no countries, and no Avast page read
# lists them, so vpn.server-countries waits (core's awaitingRequiredFeatures, notes.md). Unlimited traffic: no page says,
# so false (the rule for a required boolean no page states).
