  # Free Antivirus (its page, en-ca/free-antivirus-download): "Download a free antivirus for your Windows PC", "Also
  # available for Mac , Android , and iOS", with Web Guard, Smart Scan, File Shield, Behavior Shield, Quarantine, Wi-Fi
  # network security, Network Inspector, Firewall, Mail Shield, Ransomware Shield, Rescue Disk and Hack Alerts ("If we
  # detect that your email passwords have been part of a leak or hack, you’ll get an alert"). Its features are the
  # Windows app's; it has no VPN. Its licence runs a free product 30 days at a time, which Avast "retains the sole right
  # to extend" (other.notable).
  - id: avast.free-antivirus
    name: 'Free Antivirus'
    link: https://www.avast.com/en-ca/free-antivirus-download
    features:
      antivirus.included: true
      antivirus.real-time: true
      antivirus.behavioural: true
      antivirus.scans: [on-demand, rescue]
      antivirus.ransomware: [blocking]
      antivirus.web-protection: true
      antivirus.scam-protection: [web]
      antivirus.network: [firewall, wifi-check, home-network-scan]
