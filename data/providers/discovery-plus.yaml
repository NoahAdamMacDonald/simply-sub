# Terms and policies, read 2026-11-04 (M11.15): discovery+'s US Terms of Use through a US exit (Warner Bros.
# Discovery's, "Last updated: June 23, 2025", much like HBO Max's), its US help centre's articles on cancelling,
# renewing and changing plans, Europe's terms as the UK's and Ireland's English PDF and Italy's Italian one (both
# "Updated as of 21 August 2025", the same clauses: rated for GB, IE and IT where they differ), and Warner Bros.
# Discovery's privacy policies, rated once as a shared document (data/policies/wbd-privacy.yaml). Its sign-up form asks
# for an email address first and opens the rest only after one is entered, so sign-up data stays unrated.
policies:
  shared: [wbd-privacy]
  links:
    - name: 'Terms of use'
      url: https://www.wbd.com/dplus-us-visitor-agreement
    - name: 'Terms of use (UK and Ireland)'
      url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-English.pdf
    - name: "Termini d'uso (Italia)"
      url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-Italian.pdf
    - name: 'Cancel discovery+'
      url: https://help.discoveryplus.com/hc/en-us/articles/44215516756119-Cancel-discovery
    - name: 'Change your discovery+ plan'
      url: https://help.discoveryplus.com/hc/en-us/articles/32717632650263-Change-your-discovery-plan
    - name: 'Plans'
      url: https://www.discoveryplus.com/
  ratings:
    - topic: privacy.sign-up-data
      status: not-stated
      reason: 'Its terms say an account needs a payment method but not what else it asks for; its sign-up form opens past the email address only once you enter one.'
      pages: [https://www.wbd.com/dplus-us-visitor-agreement]
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online at any time and keep watching until the period ends, but at least 24 hours before it renews.'
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'YOU CAN CANCEL YOUR SUBSCRIPTION AT ANY TIME AND YOU WILL CONTINUE TO HAVE ACCESS TO THE DISCOVERY+ PLATFORM THROUGH THE END OF THE THEN-CURRENT BILLING PERIOD'
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'YOU MUST CANCEL YOUR SUBSCRIPTION AT LEAST 24 HOURS BEFORE IT RENEWS IN ORDER TO AVOID BEING CHARGED FOR THE NEXT CYCLE’S SUBSCRIPTION FEE.'
        - url: https://help.discoveryplus.com/hc/en-us/articles/44215516756119-Cancel-discovery
          quote: 'Cancel your subscription a day before your next billing date to avoid further charges.'
      action:
        name: 'Cancel discovery+'
        url: https://help.discoveryplus.com/hc/en-us/articles/44215516756119-Cancel-discovery
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      regions: [GB, IE, IT]
      tier: good
      reason: 'In the UK, Ireland and Italy you can cancel online at any time in your account settings, before your billing cycle ends.'
      sources:
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-English.pdf
          quote: 'you can cancel your Subscription at any time through your discovery+ Account settings on the Platform'
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-Italian.pdf
          quote: "è possibile cancellare l'Abbonamento in qualsiasi momento attraverso le impostazioni dell'Account discovery+ sulla Piattaforma"
      lastVerified: 2026-11-04
    - topic: billing.refunds
      tier: neutral
      reason: "You don't get money back when you cancel, but you keep watching until the end of the period."
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'WE DO NOT PROVIDE REFUNDS, CREDIT OR PRO RATED BILLING FOR CANCELLED SUBSCRIPTIONS.'
      lastVerified: 2026-11-04
    - topic: billing.refunds
      regions: [GB, IE, IT]
      tier: neutral
      reason: 'In the UK, Ireland and Italy the law lets you withdraw within 14 days of buying a subscription; its terms name no refund after that.'
      sources:
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-English.pdf
          quote: 'you have a legal right to withdraw from your Subscription agreement with us within 14 days of purchase'
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-Italian.pdf
          quote: "ha per legge il diritto di recedere dal contratto di Abbonamento con noi entro 14 giorni dall'acquisto"
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you about a new price as the law requires, without saying how far ahead.'
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'Your Subscription Provider may change the amount of the Subscription Fee and will communicate price changes to you in accordance with applicable law.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      regions: [GB, IE, IT]
      tier: great
      reason: 'In the UK, Ireland and Italy it tells you of a new price at least 30 days ahead, and it starts only at your next billing period, so you can cancel first.'
      sources:
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-English.pdf
          quote: 'we will give you reasonable notice at least 30 days in advance of any price change. Price changes will only come into effect at the start of your next billing period.'
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-Italian.pdf
          quote: 'gli forniremo un ragionevole preavviso di almeno 30 giorni rispetto a qualsiasi variazione di prezzo'
      lastVerified: 2026-11-04
    - topic: billing.free-trials
      tier: poor
      reason: 'A trial needs a payment method and turns into a paid subscription unless you cancel before it ends, and it won’t remind you unless the law requires.'
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'At the time you sign up for a Trial Subscription, you must provide a valid Payment Method in order to use the Platform during the Free Trial Period.'
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'You will not be notified that your Free Trial Period is about to end unless such notice is required by applicable law.'
      lastVerified: 2026-11-04
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say a subscription renews on its own at the then-current rate, but not that it reminds you first.'
      pages: [https://www.wbd.com/dplus-us-visitor-agreement]
      lastVerified: 2026-11-04
    - topic: billing.fees
      tier: poor
      reason: 'Its subscription fee includes "service fees" it doesn’t describe, besides taxes.'
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'the applicable Subscription fee together with any applicable taxes and service fees (collectively, the “Subscription Fee”)'
      lastVerified: 2026-11-04
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its terms leave what switching plans costs to whoever bills you, and its help article gives only the steps.'
      pages:
        - https://www.wbd.com/dplus-us-visitor-agreement
        - https://help.discoveryplus.com/hc/en-us/articles/32717632650263-Change-your-discovery-plan
      lastVerified: 2026-11-04
    - topic: legal.disputes
      tier: poor
      reason: 'You must take any dispute to private arbitration, one person at a time, with no class actions or jury. You can opt out of arbitration only if a mass arbitration leaves your claim unresolved.'
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'THESE TERMS REQUIRE THE USE OF ARBITRATION ON AN INDIVIDUAL BASIS TO RESOLVE DISPUTES, RATHER THAN COURTS OR JURY TRIALS'
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'If your claim is not resolved as part of the staged process identified above, either:'
      action:
        name: 'Its terms'
        url: https://www.wbd.com/dplus-us-visitor-agreement
      lastVerified: 2026-11-04
    - topic: legal.disputes
      regions: [GB, IE, IT]
      tier: great
      reason: 'In the UK, Ireland and Italy disputes go to the courts where you live, and its terms name no arbitration or class action ban.'
      sources:
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-English.pdf
          quote: 'If you do not live in England or Wales, you can bring a claim in the courts of your territory of residence.'
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-Italian.pdf
          quote: "Se l'utente non risiede in Inghilterra o nel Galles, potrà intraprendere un'azione legale presso i tribunali competenti del proprio Paese di residenza."
      lastVerified: 2026-11-04
    - topic: legal.terms-changes
      tier: poor
      reason: 'It changes its terms by posting them, and using discovery+ afterwards, or not cancelling before you renew, means you accept them.'
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'We will communicate material changes to this Agreement by making the revised Terms available for your review on the Platform.'
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'By continuing to use the Platform after any revised Terms come into effect'
      lastVerified: 2026-11-04
    - topic: legal.terms-changes
      regions: [GB, IE, IT]
      tier: neutral
      reason: 'In the UK, Ireland and Italy it tells you before its terms change, without saying how far ahead, and if you refuse them, your old terms last until your billing cycle ends.'
      sources:
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-English.pdf
          quote: 'If we change these Terms, we will notify you and give you the opportunity to read the new terms before the changes take effect'
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-English.pdf
          quote: 'If you refuse to accept the new terms before the changes are due to take effect, the version of the Terms that you previously accepted will continue to apply to your use of the Platform until the end of your current Billing Cycle.'
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-Italian.pdf
          quote: "Se modifichiamo i presenti Termini, ne daremo comunicazione all'utente e gli daremo la possibilità di leggere i nuovi termini prima che le modifiche entrino in vigore"
      lastVerified: 2026-11-04
    - topic: legal.account-closure
      tier: bad
      reason: 'It can suspend or end your subscription and account at once, for any reason or none.'
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'Any Subscription Provider may suspend or terminate your Subscription and access to the Platform and/or your discovery+ Account immediately for any reason or for no reason whatsoever'
      lastVerified: 2026-11-04
    - topic: legal.account-closure
      regions: [GB, IE, IT]
      tier: neutral
      reason: 'In the UK, Ireland and Italy it can end your subscription for any reason, but on reasonable notice and at the end of the period you paid for.'
      sources:
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-English.pdf
          quote: 'on reasonable notice, for any reason, provided that if you have an active Subscription such termination shall take effect at the end of the then current billing period'
        - url: https://static-wbd-cdn.wbd.com/s3_assets/wp-content/themes/warner-bros-discovery-corporate/pdf/discovery-terms-of-use-Italian.pdf
          quote: "con un ragionevole preavviso, per qualsiasi motivo, fermo restando che, se l'utente ha un Abbonamento attivo, tale cessazione avrà effetto alla fine del periodo di fatturazione"
      lastVerified: 2026-11-04
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change the price, what your plan includes or any part of discovery+ at any time, and remove shows without owing you anything.'
      sources:
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'We reserve the right to modify this Agreement, the Subscription Fee, the benefits associated with any Subscription plan, additional conditions of your Subscription or change any part of the Platform at any time.'
        - url: https://www.wbd.com/dplus-us-visitor-agreement
          quote: 'in no event will we be liable for any claims, costs, or damages caused by or arising out of such actions'
      lastVerified: 2026-11-04
    - topic: legal.service-changes
      regions: [GB, IE, IT]
      tier: good
      reason: 'In the UK, Ireland and Italy it gives at least 30 days’ notice before ending a plan or part of discovery+, and refunds what you paid for and didn’t get.'
