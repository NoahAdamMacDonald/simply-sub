# Researched by hand on 2026-11-04 (M11.15, the streaming category, batch 3), read through each country's exit (the
# owner's choice of 2026-11-04). Canada's discovery+ is Rogers Sports & Media's, its own provider (discovery-plus-canada,
# the owner's choice of 2026-11-04): "As of February 17, 2026, the discovery+ service provided by Warner Bros. Discovery
# is no longer available in Canada" (its help centre). Pages, each quoted where it's used:
# Pricing: the US's discoveryplus.com through a US exit ("discovery+ $6.99/month" and "discovery+ (Ad-Free)
# $11.99/month"; "Your subscription automatically renews every month"; its help centre: prices "increased for new
# subscriptions in the U.S. on October 13, 2026"); the UK's help centre ("Entertainment - ￡3.99/month (including
# VAT)"), Ireland's ("Basic (Entertainment) - €4.99/month (includes VAT)", "previously called Entertainment") and
# Italy's discoveryplus.com/it/it ("Intrattenimento (con pubblicità) 2,89 €/mese", "Intrattenimento 5,49 €/mese",
# "Intrattenimento + Sport 7,99 €/mese"), each through its country's exit. Annual plans are no longer sold in Europe.
# Region checklist, 2026-11-04: 1. discoveryplus.com's country paths (/gb/en, /ie/en, /it/it) and its help centres'
# country versions; 4. the plan cards, never past them; 6. Edge through each country's exit. The Netherlands' and
# Spain's paths answer "Looks like this link isn't working", so no price was read there.

# Coverage: discovery-plus.with-ads and discovery-plus.ad-free in GB, IE and IT: Europe's discovery+ sells its own
# plans (2026-11-04).

# Coverage: discovery-plus.entertainment in US and IT: the US and Italy sell their own plans (2026-11-04).

# Coverage: discovery-plus.intrattenimento-con-pubblicita, discovery-plus.intrattenimento and
# discovery-plus.intrattenimento-sport in US, GB and IE: Italy's own plans (2026-11-04).

# Coverage: discovery-plus.* in CA: not sold in Canada, "As of February 17, 2026, the discovery+ service provided by
# Warner Bros. Discovery is no longer available in Canada" (its help centre); Canada's discovery+ is
# discovery-plus-canada. No page lists every country it's sold in, so availableIn isn't set.

id: discovery-plus
name: discovery+
aliases: [discovery plus, discoveryplus]
website: https://www.discoveryplus.com
category: streaming
spendCategory: streaming
billingCurrency: { US: USD, GB: GBP, IE: EUR, IT: EUR }
cancelUrl: https://help.discoveryplus.com/hc/en-us/articles/44215516756119-Cancel-discovery
sources: { pricing: https://www.discoveryplus.com/ }
notes: Warner Bros. Discovery's discovery+ hasn't been sold in Canada since February 17, 2026. Canada's discovery+ is Rogers Sports & Media's.
# Ways to pay, read 2026-11-04 through a US exit: "any major credit card or PayPal" on discoveryplus.com, but "We
# currently do not accept prepaid credit cards" (its help centre's "Methods of payment"), and app stores and internet,
# mobile or TV providers (its terms). No card networks are named. Europe's lists aren't read yet.
paymentMethods:
  - methods: [card, paypal]
    regions: [US]
    page: 'Methods of payment'
    url: https://help.discoveryplus.com/hc/en-us/articles/32717615053207-Methods-of-payment
    quotes:
      - 'you can pay for your subscription using any major credit card or PayPal'
  - methods: [app-store, provider-billing]
    regions: [US]
    page: 'Terms of use'
    url: https://www.wbd.com/dplus-us-visitor-agreement
    quotes:
      - 'through a third party (e.g., an app store or your internet, mobile or TV provider)'

# Owner: Paramount Skydance Corporation, since it acquired Warner Bros. Discovery (Warner Bros. Discovery's investor
# site, as for HBO Max; discovery+'s help centre: "Warner Bros. Discovery and Paramount Skydance are coming together as
# Skydance"). Its US terms give Discovery Digital Ventures, LLC's New York address.
owner:
  name: 'Paramount Skydance Corporation, which acquired Warner Bros. Discovery'
  website: https://ir.wbd.com
  page:
    name: 'Warner Bros. Discovery investor relations'
    url: https://ir.wbd.com/investor-relations/default.aspx
  quotes:
    - 'Following the acquisition of Warner Bros. Discovery by Paramount Skydance Corporation'
  country:
    code: US
    page:
      name: Terms of use
      url: https://www.wbd.com/dplus-us-visitor-agreement
    quotes:
      - 'New York, NY 10003'
    lastVerified: 2026-11-04
  lastVerified: 2026-11-04

# Renewal day (M11.5), read 2026-11-04 through a US exit in its help centre.
renewalAnchor:
  kind: same-date
  page: Automatic subscription renewal
  url: https://help.discoveryplus.com/hc/en-us/articles/32717623996951-Automatic-subscription-renewal
  quotes:
    - 'You will be billed in monthly intervals, based on the date when you signed up.'
  lastVerified: 2026-11-04

# Free use (2026-11-09, the owner's item: services used free, with ads or limits): none: its pages sell its paid plans
# and a trial only.
freeUse:
  kind: none
  pages: [https://www.discoveryplus.com/]
  lastVerified: 2026-11-09

# General features, read 2026-11-11: its US and UK sites in English and Italy's in Italian (discoveryplus.com/it/it:
# "Accedi"). No pause (its help has only playback articles). Parental controls: family profiles with ratings and
# profile PINs (help.discoveryplus.com 32717648250903 and 32717624251159, and the UK's help; Italy's help wasn't read).
# Apps (the cross-category features), read 2026-11-04: "Stream on your mobile device, tablet, computer, game console
# and connected TV" (the US home page), with downloads "on iOS and Android mobile devices".
features:
  platforms: [ios, android, web, tv, console]
  languages.interface: [en, it]

# Features, read 2026-11-04: the US's plan cards ("Stream on 4 devices at once", "Full HD video resolution", Ad-Free's
# "100 downloads to watch on the go", counted in titles with no number of devices, so 1, inferred; its help centre:
# "on up to 4 devices at once"); Europe's help centres ("Up to two people can watch discovery+ at the same time from
# any one account", the UK's and Ireland's; Italy's "al massimo due persone"; the UK's Entertainment plan has "Ads in
# on-demand content" and "4K UHD for select shows (not including live content)", and each country's plan includes live
# channels, which differ by country). Profiles: "up to five unique, personalized profiles" (the US's help centre), "up
# to 5 profiles for everyone in your household" (the UK's), "fino a cinque (5) profili" (Italy's terms), and Family
# Profiles with parental controls in each. Italy's three plans: "Intrattenimento con pubblicità" has ads; the other two
# aren't named "con pubblicità", and "I canali, i contenuti live e lo sport (se inclusi nel tuo piano) contengono
# annunci pubblicitari", so they're ad-free on demand (inferred); Sport adds "Eurosport 1, Eurosport 2". No Italian page
# names their video quality: they wait in core's awaitingRequiredFeatures (the owner's choice of 2026-11-04). No French
# programmes are named.
plans:
  - id: discovery-plus.with-ads
    name: With ads
    link: https://www.discoveryplus.com/
    features:
      video.quality: 1080p
      ad-free: false
      streaming.concurrent-streams: 4
      streaming.profiles: 5
      streaming.kids-profiles: true
      account.parental-controls: true
    notes: The US's discovery+ plan, with limited ads.
    prices:
      - {
          region: US,
          currency: USD,
          amount: 6.99,
          interval: month,
          intervalCount: 1,
          autoRenew: true,
          lastVerified: 2026-11-04,
          sourceUrl: https://www.discoveryplus.com/,
        }
  - id: discovery-plus.ad-free
    name: Ad-Free
    link: https://www.discoveryplus.com/
    features:
      video.quality: 1080p
      ad-free: true
      streaming.concurrent-streams: 4
      streaming.download-devices: 1
      streaming.profiles: 5
      streaming.kids-profiles: true
      account.parental-controls: true
    inferred:
      streaming.download-devices:
        reason: 'It allows 100 downloads on iOS and Android devices without saying how many devices, so at least one.'
        page:
          name: discovery+
          url: https://www.discoveryplus.com/
