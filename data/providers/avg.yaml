# Researched by hand on 2026-11-13 (M11.15, security batch 1), read from Canada with a plain fetch (each locale's store and
# product pages, its legal pages, its support centre, Gen Digital's pages) and with Edge (Canada's store and product
# pages, the UK's Internet Security page and store, to see the rendered prices). Pages, each quoted where it's used:
# Pricing: each locale's store (avg.com/<locale>/store) and product pages (/internet-security, /ultimate, /secure-vpn,
# /free-antivirus-download). Each locale's pages carry their own prices in the page's data, in its own country's
# currency whoever reads them ("currency":"CAD" and "CAN$" for Canada, "USD" for the US, "GBP", "AUD", "NZD", "EUR"), and
# its checkout links name the locale (checkout.avg.com/en-ca/...). Ireland has no locale of its own (/en-ie/ is the
# Worldwide site, in US dollars): an Irish visitor is sent to "Europe (English)" (/en-eu/), read 2026-11-13 through an
# Irish exit, so en-eu is Ireland's; the US's store read through a US exit showed en-us's prices. The regular price is
# the one each card names ("Savings compared to renewal price CAN$89.99/year.", "It automatically renews at
# £69.99/year unless cancelled."); the first year's is an offer. Every plan is yearly (its subscription details: "an
# annual fee"); the VPN's 2- and 3-year cards are first terms ("billed at once for the first 2 years") that renew at
# the yearly price ("Savings compared to renewal price CAN$119.99/year." on each), so only yearly is stored. No page says
# its prices include tax.
# The UK store's 1 PC and 1 Mac cards say "After the first year, it automatically renews every year at £89.99", the
# 10-device price; the Internet Security page's own options say "It automatically renews at £69.99/year" for them, which
# the page's data agrees with: £69.99 is stored (notes.md).
# Region checklist for CA and US, 2026-11-13: 1. its locales (en-ca, fr-ca, en-us); 2. its country picker (the same);
# 3. its pages' price data names the currency; 4. the checkout wasn't opened; 5. its subscription details and its
# cancelling FAQ; 6. Edge and a plain fetch, the US through a US exit too; 7. no bill offered.
# Not drafted (notes.md): AntiTrack, BreachGuard, TuneUp, Driver Updater, Secure Browser, Secure Identity (the US's, the
# UK's, Australia's, New Zealand's and the euro countries' identity protection), Mobile Security's own plans and Premium
# Tech Support.
# Bundles: Ultimate is its own suite (a plan, includes-subscription). Official resellers: none named; its partner pages
# (avg.com/en-ca/partners) are for businesses and affiliates, and app stores bill its mobile apps (partners, not
# listed).
# Free use: AntiVirus FREE (its plan below).

id: avg
name: AVG
website: https://www.avg.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its support centre's "Canceling an AVG subscription - FAQs": "Click Unsubscribe under the subscription you want to
# cancel." in your AVG Account.
cancelUrl: https://support.avg.com/SupportArticleView?l=en&urlName=AVG-Unsubscribe-FAQ
sources: { pricing: https://www.avg.com/en-ca/store }
# Owner (M11.2), read 2026-11-13: AVG's own Profile page says it's part of Gen, and every avg.com page's footer is "©
# 2026 Gen Digital Inc."; its licence is Gen Digital Inc.'s in the Americas ("a. North, Central, and South America Gen
# Digital Inc.") and Avast Software s.r.o.'s in most of Europe. Gen's Who We Are page names its headquarters; its
# country is the US, as Norton's and Avast's (notes.md). Shares: Gen's investor FAQs.
owner:
  name: Gen Digital Inc.
  website: https://www.gendigital.com
  page:
    name: 'Profile'
    url: https://www.avg.com/en-ca/profile
  quotes:
    - 'AVG is part of Gen™ - a global company with a family of trusted consumer brands.'
    - '© 2026 Gen Digital Inc. All rights reserved.'
  country:
    code: US
    page:
      name: 'Who We Are (Gen)'
      url: https://www.gendigital.com/us/en/who-we-are/
    quotes:
      - 'Our global workforce has dual headquarters in Prague, Czech Republic and Tempe, Arizona, USA.'
    lastVerified: 2026-11-13
  stock:
    listings:
      - { exchange: Nasdaq, symbol: GEN }
    page:
      name: 'Investor FAQs (Gen)'
      url: https://investor.gendigital.com/resources/investor-faqs/default.aspx
    quotes:
      - 'Gen’s ticker symbol is GEN.'
      - 'Gen’s common stock is traded on the Nasdaq Global Select Market.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: its subscription details ("your bank card or PayPal account") and its cancelling
# FAQ (subscriptions "purchased via Google Play Store" and "via the App Store"). No page read names the card networks.
paymentMethods:
  - methods: [card, paypal]
    page: 'Subscription details'
    url: https://www.avg.com/en-ca/subscription-details
    quotes:
      - 'A subscription is the commitment from AVG to you, our customer, that we will continuously work to protect, optimise and connect you virtually in exchange for an annual fee that we bill to your bank card or PayPal account.'
  - methods: [app-store]
    page: 'Canceling an AVG subscription - FAQs'
    url: https://support.avg.com/SupportArticleView?l=en&urlName=AVG-Unsubscribe-FAQ
    quotes:
      - 'The information in this section only applies to subscriptions purchased via Google Play Store .'
      - 'The information in this section only applies to subscriptions purchased via the App Store .'
# Renewal day (M11.5, M11.21): the anniversary of the subscription, charged "up to 35 days prior to the anniversary of
# your subscription to AVG" (Subscription details; its cancelling FAQ: "Your billing date can be up to 35 days before the
# start of the next subscription period"): a new yearly item is charged 35 days early, the earliest it can be.
renewalAnchor:
  kind: same-date
  page: 'Subscription details'
  url: https://www.avg.com/en-ca/subscription-details
  quotes:
    - 'The fees will be charged to your stored payment details up to 35 days prior to the anniversary of your subscription to AVG.'
  chargedBefore: { days: 35, upTo: true }
  lastVerified: 2026-11-13
