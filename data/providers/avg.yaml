# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch from Canada: its End User License Agreement
# (avg.com/en-ca/eula, "Version 1.15 (Revised January 23, 2026)", the same text on its en-us, en-gb and en-eu pages), a
# version of Avast's (Avast's 1.16 adds a 30-day period for free products, which AVG's lacks), so its grades match
# Avast's; its subscription details and cancelling FAQ; its Product Privacy Notice ("This Policy was last updated in
# August 26, 2026.") and VPN Policy ("Last updated: October 6, 2026"); and Gen's General Privacy Notice, which its
# privacy centre follows ("we follow our group General Privacy Notice which includes information broadly applicable
# across all Gen brands, services and products"), rated once as a shared document (data/policies/gen-digital-privacy.yaml).
# Read but holding no topic: its Consent Policy and Cookie Notice. Not read: its Acceptable Use Policy (the EULA's link
# names no page; /acceptable-use-policy is a page not found), the Distributor's terms of sale its EULA names, and the
# checkout's agreement line (no checkout opened).
policies:
  shared: [gen-digital-privacy]
  links:
    - name: 'End User License Agreement'
      url: https://www.avg.com/en-ca/eula
    - name: 'Subscription details'
      url: https://www.avg.com/en-ca/subscription-details
    - name: 'Canceling an AVG subscription - FAQs'
      url: https://support.avg.com/SupportArticleView?l=en&urlName=AVG-Unsubscribe-FAQ
    - name: 'AVG Internet Security and AVG AntiVirus - FAQs'
      url: https://support.avg.com/SupportArticleView?l=en&urlName=avg-antivirus-faq
    - name: 'AVG Secure VPN - FAQs'
      url: https://support.avg.com/SupportArticleView?l=en&urlName=avg-secure-vpn-faq
    - name: 'Product Privacy Notice'
      url: https://www.avg.com/en-ca/products-policy
    - name: 'VPN Policy'
      url: https://www.avg.com/en-ca/vpn-policy
    - name: 'Report a security vulnerability (Gen)'
      url: https://www.gendigital.com/ca/en/contact-us/report-a-potential-security-vulnerability/
    - name: 'Internet Security'
      url: https://www.avg.com/en-ca/internet-security
  ratings:
    - topic: billing.cancellation
      tier: good
      reason: 'You can stop it renewing in your AVG Account online, and keep using it to the end of the time you paid for.'
      sources:
        - url: https://support.avg.com/SupportArticleView?l=en&urlName=AVG-Unsubscribe-FAQ
          quote: 'Click Unsubscribe under the subscription you want to cancel.'
        - url: https://support.avg.com/SupportArticleView?l=en&urlName=AVG-Unsubscribe-FAQ
          quote: 'After you cancel an AVG subscription , you can continue to use your paid AVG products until the end of the current subscription period.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: good
      reason: 'You can get your money back within 30 days of buying it, and within 30 days of each yearly renewal.'
      sources:
        - url: https://www.avg.com/en-ca/subscription-details
          quote: 'You can request a refund by contacting AVG Customer Support here within 30 days of your initial subscription or the anniversary of your subscription.'
        - url: https://www.avg.com/en-ca/eula
          quote: '2A.6 If your subscription auto-renews, you may cancel that renewal no later than 30 days following such renewal date.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: great
      reason: 'You pay the price of the day when it renews, and it tells you that price up to 65 days before each yearly renewal, so you can cancel first.'
      sources:
        - url: https://www.avg.com/en-ca/subscription-details
          quote: 'A fee for the next subscription period will be charged at the then current published price.'
        - url: https://www.avg.com/en-ca/subscription-details
          quote: 'For annual subscriptions, we will notify you up to 65 days ahead of the anniversary of your subscription to remind you of the anniversary as well as the subscription fee that will be billed for the subsequent period.'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: poor
      reason: 'Its trials started in the app need a payment method up front and turn into a paid plan unless you cancel before they end, with no reminder promised. Its 30-day trial on a PC needs no card.'
      sources:
        - url: https://support.avg.com/SupportArticleView?l=en&urlName=avg-antivirus-faq
          quote: 'A payment method is required to sign up for a free trial. When the trial ends, your paid subscription starts, unless cancelled before.'
        - url: https://www.avg.com/en-ca/internet-security
          quote: '(no credit card needed)'
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      tier: good
      reason: 'It emails you before each yearly renewal, with the price and the date it charges you.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: '2A.1 Your subscription will automatically renew, and for annual subscriptions you will be notified in advance of the renewal.'
        - url: https://www.avg.com/en-ca/subscription-details
          quote: 'For annual subscriptions, we will notify you up to 65 days ahead of the anniversary of your subscription to remind you of the anniversary as well as the subscription fee that will be billed for the subsequent period.'
      lastVerified: 2026-11-13
    - topic: billing.fees
      status: not-stated
      reason: 'Its licence and subscription details list no fees beyond the price.'
      pages: [https://www.avg.com/en-ca/eula, https://www.avg.com/en-ca/subscription-details]
      lastVerified: 2026-11-13
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its licence and subscription details don’t say what happens when you switch plans.'
      pages: [https://www.avg.com/en-ca/eula, https://www.avg.com/en-ca/subscription-details]
      lastVerified: 2026-11-13
    - topic: legal.disputes
      tier: bad
      reason: 'Disputes go to a private referee (an arbitrator), one person at a time, with no group lawsuits, and its licence offers no way to opt out.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: 'If you and Vendor do not resolve any Dispute by informal negotiation, any other effort to resolve the Dispute will be conducted exclusively by binding arbitration'
        - url: https://www.avg.com/en-ca/eula
          quote: 'ANY PROCEEDINGS TO RESOLVE OR LITIGATE ANY DISPUTE IN ANY FORUM WILL BE CONDUCTED SOLELY ON AN INDIVIDUAL BASIS.'
      lastVerified: 2026-11-13
    - topic: legal.terms-changes
      tier: great
      reason: 'It tells you before changing its licence, gives you 30 days, and if you say no it refunds the time you haven’t used.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: 'Vendor may amend this Agreement at any time by notice provided to you in accordance with this Agreement, and your continued use of any affected Solution at any point at least 30 days after the notice date will constitute your acceptance of the amendment of this Agreement.'
        - url: https://www.avg.com/en-ca/eula
          quote: 'If you decline to accept the amended Agreement, Vendor may terminate your use of such affected Solution, in which case you may obtain a refund for the portion of the subscription fee you have paid for the unexpired or unused portion of the Subscription Period'
      lastVerified: 2026-11-13
    - topic: legal.account-closure
      tier: neutral
      reason: 'If you break its licence it ends at once with no refund. It can also end it for any reason, but then refunds the time you haven’t used.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: 'which will result in forfeiture of any rights you may have to receive Updates or to obtain a refund for the portion of the subscription fee you have paid for the unexpired or unused portion of the Subscription Period.'
        - url: https://www.avg.com/en-ca/eula
          quote: 'Vendor, by notice to you, may immediately terminate this Agreement for convenience at any time with respect to any particular Solution or all Solutions'
      lastVerified: 2026-11-13
    - topic: legal.service-changes
      tier: neutral
      reason: 'Its updates can add or remove features, or replace an app entirely.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: 'Updates may include both additions to, and removal of, any particular features or functionality offered by a Solution or may replace it entirely'
      lastVerified: 2026-11-13
    - topic: legal.licence
      tier: neutral
      reason: 'Its apps are for you and your household’s personal, non-business use, and you may not take them apart unless the law lets you.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: 'by a natural person, or members of his household for personal, noncommercial purposes.'
        - url: https://www.avg.com/en-ca/eula
          quote: 'except as expressly authorized by law: (i) reverse engineer, disassemble, decompile, translate, reconstruct, transform or extract any Solution or any portion of the Solution'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'To use its VPN or a paid plan you make an AVG account with your email address, and give payment details. Its free antivirus needs no account.'
      sources:
        - url: https://www.avg.com/en-ca/vpn-policy
          quote: 'When you create an account with us (note: this is necessary in order for you to use the VPN service), we will need some information about you.'
        - url: https://www.avg.com/en-ca/vpn-policy
          quote: 'To send you purchase receipts, communications, and occasional product news'
      lastVerified: 2026-11-13
    - topic: privacy.data-collection
      tier: poor
      reason: 'Its email scanner keeps whole emails it finds suspicious to train its scam detection, and its staff may read them, unless you turn that off in each app’s privacy settings.'
      sources:
        - url: https://www.avg.com/en-ca/products-policy
          quote: 'Unless you opt out, we store the whole email message (EML file with message metadata) we identified as suspected malicious to further analyze it and include it in our detection models.'
        - url: https://www.avg.com/en-ca/products-policy
          quote: 'Our human reviewers may check email messages in case it is needed to investigate the accuracy of our detections (esp. in case of false negatives or false positives).'
      action:
        name: 'How to choose what data you share with AVG'
        url: https://support.avg.com/SupportArticleView?l=en&urlName=avg-antivirus-faq
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: neutral
      reason: 'Its apps keep how you use them for over 4 years, and your VPN account details for 2 years after your plan ends.'
      sources:
        - url: https://www.avg.com/en-ca/products-policy
          quote: 'To better understand our users’ behavior (50 months)'
        - url: https://www.avg.com/en-ca/vpn-policy
          quote: 'Account data is stored for the lifetime of your product plus 2 years.'
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: neutral
      reason: 'Gen, its owner, takes security bug reports and may pay a reward. No outside audit of AVG is named on the pages read.'
      sources:
        - url: https://www.gendigital.com/ca/en/contact-us/report-a-potential-security-vulnerability/
          quote: 'we welcome the responsible disclosure of potential security vulnerabilities and bugs or any other web or product-based security concerns to improve the online risk posture of Gen and all its associated brands.'
        - url: https://www.gendigital.com/ca/en/contact-us/report-a-potential-security-vulnerability/
          quote: 'Please beware that not all submissions may be eligible for a reward/ bounty.'
      lastVerified: 2026-11-13
    - topic: service.activity-logging
      tier: poor
      reason: 'Its VPN doesn’t record the sites you visit, but it keeps when you connect and disconnect and how much data you use, and its Android antivirus collects the websites you visit.'
      sources:
        - url: https://support.avg.com/SupportArticleView?l=en&urlName=avg-secure-vpn-faq
          quote: 'AVG Secure VPN stores connection logs, which include information such as the time you connect and disconnect, the duration of the connection, and bandwidth usage.'
        - url: https://support.avg.com/SupportArticleView?l=en&urlName=avg-secure-vpn-faq
          quote: 'We do not log activities such as the websites you visit, what data is transferred, and which IP addresses are accessed.'
        - url: https://www.avg.com/en-ca/products-policy
          quote: 'Information concerning URLs of websites visited (malicious and non-malicious) and referrers (previous page with link to malware-hosting site)'
      lastVerified: 2026-11-13
    - topic: service.account-sharing
      tier: good
      reason: 'You and the people you live with can use it, for personal use.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: 'by a natural person, or members of his household for personal, noncommercial purposes.'
      lastVerified: 2026-11-13
    - topic: service.device-limits
      status: not-stated
      reason: 'Its terms name no limit beyond the number of devices each plan covers.'
      pages: [https://www.avg.com/en-ca/eula]
      lastVerified: 2026-11-13
    - topic: service.software-control
      tier: good
      reason: 'Its apps update themselves without asking, which its licence says.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: 'Vendor, from time to time during the Subscription Period and without your separate permission or consent, may from time to time deploy an upgrade or update of, or replacement for, any Solution'
      lastVerified: 2026-11-13
    - topic: other.notable
      title: 'A forever licence to what you share'
      tier: poor
      reason: 'Anything you publish or share through its apps comes with a licence forever, which can’t be taken back, though only to run its apps for you.'
      sources:
        - url: https://www.avg.com/en-ca/eula
          quote: 'You grant to each member of the Vendor Group, a non-exclusive, unrestricted, unconditional, unlimited, worldwide, irrevocable, perpetual, and royalty-free right and license to use, copy, record, distribute, reproduce, disclose, sell, resell, sublicense (through multiple levels)'
        - url: https://www.avg.com/en-ca/eula
          quote: 'solely for the purpose of providing the Solutions to you under this Agreement.'
      lastVerified: 2026-11-13
