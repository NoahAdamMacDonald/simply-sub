# Categories (M11.3): an antivirus first (security); Ultimate and Secure VPN are VPN plans too. No plan has a password
# manager (Internet Security's "Defend passwords from suspicious apps" guards the browser's own).
# General features, read 2026-11-13: "Works on PC, Mac, Android, and iOS" (its VPN page) and each product page's system
# requirements (Windows, macOS, Android, iOS). App languages: each product page's "Languages" lists the Windows app's
# ("Chinese (simplified), Chinese (traditional), Czech, Danish, Dutch, English, French, German, Hungarian, Indonesian,
# Italian, Japanese, Korean, Malay, Polish, Portuguese (Brazil), Portuguese (Portugal), Russian, Serbian, Slovak,
# Spanish, and Turkish"), the Mac app's ("English only"), and Android's and iOS's, which add Arabic and Hindi; the
# Windows app's, the main one, are stated (notes.md). Sign-in and support channels: no page read lists them.
features:
  platforms: [windows, macos, android, ios]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh]

# Perks (M11.6): Internet Security's Windows shields no feature describes, in its support centre's words.
perks:
  - id: remote-access-shield
    name: Remote Access Shield
  - id: sensitive-data-shield
    name: Sensitive Data Shield

# Features in depth, read 2026-11-13 from its support centre's "AVG Internet Security and AVG AntiVirus - FAQs"
# (support.avg.com, urlName=avg-antivirus-faq), which outweighs the sales pages' comparison tables (Bitdefender's
# precedent):
# - AntiVirus Free's "Core Shields": "File Shield : Scans programs and files saved on your PC for malicious threats in
#   real-time", "Behavior Shield : Monitors all processes on your PC in real-time for suspicious behavior", "Web Shield"
#   and "Email Shield"; "Rescue Disk is a feature that allows you to create a bootable version of the AVG AntiVirus
#   scanner on a USB or CD" and its Boot-Time Scan article ("scans for known types of malware and removes threats before
#   the operating system and other services boot up"); Smart Scan finds "Vulnerable software : Out-of-date software that
#   hackers can use to access your system."; "Network Inspector scans your network for vulnerabilities"; "Ransomware
#   Protection helps secure your personal photos, documents, and files"; "Hack Alerts continuously monitors the dark web
#   and warns you if your login credentials have been leaked online"; "Do Not Disturb Mode works to silence unnecessary
#   notifications while you run almost any application in fullscreen"; and the AVG Online Security extension, installed
#   with Free and Internet Security, can "prevent websites from tracking you". No page read states scheduled scans for
#   the home apps (help.avg.com's scheduling page is AVG Business's): left out.
# - Internet Security's "Premium Features": Remote Access Shield, Browser Defense, "Webcam Protection , available in AVG
#   Internet Security , helps prevent applications and malware from accessing your PC's webcam", Sensitive Data Shield,
#   Fake Website Shield ("helps secure you against DNS (Domain Name System) hijacking") and "Data Shredder (previously
#   File Shredder), available in AVG Internet Security"; its firewall ("the built-in firewall included in AVG Internet
#   Security") and email scanning ("It scans your online mailboxes for suspicious emails"). Its page's comparison table
#   marks the scam-website and firewall rows "No" for AntiVirus Free; the store's marks Free's Wi-Fi, fake-website and
#   phishing rows "No" too, though Free's own page says "Our smart AI protects you against scam websites, viruses, and
#   more" and its support article lists Web Shield as free: Free keeps web protection and scam websites, and no firewall
#   or Wi-Fi check (notes.md).
# - Internet Security (Multi-Device) "additionally includes AVG AntiVirus PRO for Android , AVG Internet Security for
#   Mac , and AVG Mobile Security for iOS for use on up to 10 devices simultaneously"; the Android page: "Unlock alerts
#   for SMS message-based scams , emails, or chat apps by upgrading to the premium version" (texts and chat apps).
# - Mac (its own page, /internet-security-for-mac): real-time protection, ransomware protection, "Avoid fake, malicious,
#   and scam websites", "Avoid phishing websites and emails", "We scan any network for weaknesses and vulnerabilities"
#   and an email shield; no firewall, webcam or shredder named.
# - Ultimate: "AVG Ultimate includes Internet Security, Secure VPN, TuneUp , and AntiTrack ." (its store), on up to 10
#   devices; TuneUp's "Remove junk, fix errors, and improve device performance" (speed-up tools) and AntiTrack's "Stop
#   third-party companies from seeing your online activity".
# - Secure VPN (its page and support centre's "AVG Secure VPN - FAQs"): "Works on up to 10 devices simultaneously"; "When
#   Kill Switch is enabled, your internet connection is automatically blocked if AVG Secure VPN unexpectedly
#   disconnects"; split tunneling in its Android app ("Split Tunneling ensures that certain apps never connect to the
#   internet via AVG VPN servers"); protocols OpenVPN, WireGuard, IPsec (Apple's; no registry value without a guess) and
#   Mimic, "useful in countries with restrictions on VPN use, where OpenVPN may be blocked" (obfuscation: stealth);
#   "AVG Secure VPN allows torrenting through our data center locations listed below" (P2P); "We do not log activities
#   such as the websites you visit, what data is transferred, and which IP addresses are accessed." (no-logs; no audit
#   named). Server countries: "more than 100 server locations" names no countries, and no AVG page read lists them, so
#   vpn.server-countries waits (core's awaitingRequiredFeatures, notes.md). Unlimited traffic: no page says, so false
#   (the rule for a required boolean no page states; Avast's precedent).
plans:
  # AntiVirus FREE (its page, en-ca/free-antivirus-download): "Download AVG AntiVirus Free for real-time protection
