# Premium" (help 11950175), monthly only ("Annual plans cannot be paused"), not billed through Apple or Google Play
# ("With Google Play billing, you cannot pause your membership", help 12016022); Premium Lite's article has no pause.
# Parental controls: supervised accounts for kids and teens (help 10314074).
# Apps, sign-in and support (the cross-category features), read 2026-11-04: YouTube's apps on Android and iPhone, the
# web, and "most smart TVs, game consoles, and streaming devices" ("Download the YouTube app on your smart TV or game
# console"); a Google Account's password or passkey with Google's second steps, as for Google AI; the help centre's
