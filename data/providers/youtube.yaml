# Owner: Google LLC, which provides YouTube's paid services (the Paid Service Terms: "The entity providing the Paid
# Services is Google LLC"), part of Alphabet, as for Google AI.
owner:
  name: 'Google LLC, owned by Alphabet Inc., a public company (NASDAQ: GOOGL, GOOG)'
  website: https://abc.xyz
  page:
    name: "Alphabet's founders' letter"
    url: https://abc.xyz/
  quotes:
    - 'What is Alphabet? Alphabet is mostly a collection of companies. The largest of which, of course, is Google.'
    - 'Google will become a wholly-owned subsidiary of Alphabet. Our two classes of shares will continue to trade on Nasdaq as GOOGL and GOOG.'
  country:
    code: US
    page:
      name: Terms of Service
      url: https://www.youtube.com/t/terms
    quotes:
      - 'The entity providing the Service is Google LLC, a company operating under the laws of Delaware'
    lastVerified: 2026-11-04
  lastVerified: 2026-11-04

# Renewal day (M11.5), read 2026-11-04: the Paid Service Terms charge "on the first day of each billing period", and
# the Premium terms "every billing period starting on the first billing date", without saying which day of the month
# that is; the cancelling article says no more.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.youtube.com/t/terms_paidservice
    - https://support.google.com/youtube/answer/6308278
  lastVerified: 2026-11-04

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their words
# (youtube.com/premium: "Background play", and Lite's "Background play most videos").
perks:
  - id: background-play
    name: Background play
  - id: background-play-most
    name: Background play on most videos

# Apps, sign-in and support (the cross-category features), read 2026-11-04: YouTube's apps on Android and iPhone, the
# web, and "most smart TVs, game consoles, and streaming devices" ("Download the YouTube app on your smart TV or game
# console"); a Google Account's password or passkey with Google's second steps, as for Google AI; the help centre's
# community on every article ("Post to the help community"). Its contact page for paid products needs a sign-in, so
# its channels stay unread.
features:
  platforms: [android, ios, web, tv, console]
  account.sign-in: [password, passkey, push-approval, totp, security-key, sms]
  support.channels: [community]

# Features, read 2026-11-04 in YouTube Help: one stream at a time on Premium and Premium Lite, six on a family plan and
# two on a Two-person plan ("YouTube Premium & streaming limits"); offline viewing "on up to 10 devices at a time" for
# Premium members ("Premium memberships & device limits"), which doesn't name Premium Lite, though its own article
# calls it "a new, lower-priced YouTube Premium membership", so Lite's 10 is inferred; 4K among its formats ("Some
# high-quality formats (for example, 1080p, 4K)", Change video quality) and HDR ("Viewers can watch HDR videos on
# compatible mobile devices and HDR TVs", Upload HDR videos), and no page names Dolby Atmos, so none; no viewers'
# profiles (each member of a family plan uses "their own Google account"), and the YouTube Kids app's "limited
# profiles for your child" (its privacy notice). People included: "up to 5 other members of your household" (the
# family plan article) and "one other member of your household" (the Two-person plan article). Premium includes
# YouTube Music Premium (youtube.com/premium), so its plans are music plans too. Premium Lite isn't ad free: "Ads,
# however, may still appear on music content, Shorts, and when you search or browse" (its article).
# Official resellers: none. Google Play and Apple bill it in their apps (above), and YouTube's "partner provider"
# article covers companies that sell it with their own plans: ways to pay, not shops.
plans:
