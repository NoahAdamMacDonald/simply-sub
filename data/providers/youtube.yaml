# Services is Google LLC"), part of Alphabet, as for Google AI.
owner:
  name: 'Google LLC, owned by Alphabet Inc.'
  website: https://abc.xyz
  page:
    name: "Alphabet's founders' letter"
    url: https://abc.xyz/
  quotes:
    - 'What is Alphabet? Alphabet is mostly a collection of companies. The largest of which, of course, is Google.'
