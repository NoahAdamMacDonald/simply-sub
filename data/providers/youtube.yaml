  support.channels: [community]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, hi, ar]

# Features, read 2026-11-04 in YouTube Help: one stream at a time on Premium and Premium Lite, six on a family plan and
# two on a Two-person plan ("YouTube Premium & streaming limits"); offline viewing "on up to 10 devices at a time" for
# Premium members ("Premium memberships & device limits"), which doesn't name Premium Lite, though its own article
# calls it "a new, lower-priced YouTube Premium membership", so Lite's 10 is inferred; 4K among its formats ("Some
# high-quality formats (for example, 1080p, 4K)", Change video quality) and HDR ("Viewers can watch HDR videos on
# compatible mobile devices and HDR TVs", Upload HDR videos), and no page names Dolby Atmos, so none; no viewers'
# profiles (each member of a family plan uses "their own Google account"), and the YouTube Kids app's "limited
# profiles for your child" (its privacy notice). People included: "up to 5 other members of your household" (the
# family plan article) and "one other member of your household" (the Two-person plan article). Premium includes
# YouTube Music Premium (youtube.com/premium), so its plans are music plans too. Premium Lite isn't ad free: "Ads,
# however, may still appear on music content, Shorts, and when you search or browse" (its article).
# Music (M11.15), read 2026-11-09 in YouTube Music Help: "On-demand playback for podcasts, songs, and music videos" for
# every listener, and Premium members "get access to all of the features listed above" (What is YouTube Music?);
# downloads to listen offline for "a YouTube Music Premium member" (Download music & podcasts to listen offline); and
# its best audio "High ... Bitrate: 256kbps AAC & OPUS" (Change your audio quality).
# Official resellers: none. Google Play and Apple bill it in their apps (above), and YouTube's "partner provider"
# article covers companies that sell it with their own plans: ways to pay, not shops.
# Free (2026-11-09, the owner's item: services used free, with ads or limits): YouTube and YouTube Music with no
# membership. YouTube Music Help's "What is YouTube Music?": "You can enjoy YouTube Music without a paid membership.
# Ad-supported YouTube Music includes: On-demand playback for podcasts, songs, and music videos" and "Access to
# audio-only, background play, and downloads for most podcasts", where Music Premium adds "Background play for music",
# "Music without ads", "Audio-only music playback" and "Music downloads". Its video quality, HDR, Kids profiles and
# French content are every viewer's, from the pages Premium's cite; its audio is "Normal" (128kbps), since "YouTube
# Music Premium members can select the bitrate" (Change your audio quality). No page says how many streams play at once
# without a membership (its streaming limits are members': "Premium, Premium Lite, or Music Premium members can stream
# videos and audio on only one device at a time"), so the plan waits in core's awaitingRequiredFeatures.
plans:
  - id: youtube.free
    name: Free
    link: https://www.youtube.com/
    categories: [streaming, music]
    features:
      video.quality: 4k
      video.hdr: true
      ad-free: false
      streaming.kids-profiles: true
      streaming.french-content: true
      audio.quality: standard
      music.on-demand: true
      music.offline: false
      music.unlimited-skips: true
      music.own-library: true
      music.lyrics: true
      music.live-radio: false
      account.parental-controls: true
    inferred:
      audio.quality:
        reason: 'Only YouTube Music Premium members can choose a bitrate, so a listener without it keeps the "Normal" one: 128kbps.'
        page:
          name: Change your audio quality
          url: https://support.google.com/youtubemusic/answer/9076559
        lastVerified: 2026-11-09
      streaming.french-content:
        reason: "YouTube's videos come from people across the globe, in French among many languages; no page counts them."
        page:
          name: Terms of Service
          url: https://www.youtube.com/t/terms
        lastVerified: 2026-11-09
    notes: YouTube and YouTube Music with ads. Music plays only while the app is open and doesn't download; most podcasts do both.
    prices:
      - {
          region: GLOBAL,
          currency: USD,
          amount: 0,
          interval: month,
          intervalCount: 1,
          autoRenew: true,
          lastVerified: 2026-11-09,
          sourceUrl: https://support.google.com/youtubemusic/answer/6313529,
