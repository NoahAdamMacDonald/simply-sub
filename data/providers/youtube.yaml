# Researched by hand on 2026-11-04 (M11.15, the streaming category), read with Edge from Canada and through each
# country's exit (the owner's choice of 2026-11-04). The owner chose the id (2026-11-04): YouTube's paid memberships,
# with the queue's youtube-premium folded in; YouTube Music Premium joins it in the music category. Pages, each quoted
# where it's used:
# Pricing: youtube.com/premium, which prices by where the visitor is: read from Canada, and through a US, UK,
# Australian, German, French, Spanish and Italian exit, each page in that country's currency. Annual plans are
# prepaid ("12 months for CA$129.99", "Doesn't automatically renew"), sold in Canada, Germany and the US among the
# catalog's regions (the annual plan article: "Brazil, Canada, Germany, India, Japan, Mexico, Thailand, Turkey, and the
# United States"). The Two-person plan is sold in Australia and France among them (its article's list).
# Where it's sold: Premium and Premium Lite in every catalog region (the available locations article's two lists; Lite's
# says "Great Britain"). No availableIn: both lists run to most of the world.
# YouTube Music Premium (M11.15, music, 2026-11-09): youtube.com/musicpremium, which prices by where the visitor is too:
# read through a US, UK, Australian, German, French, Dutch, Spanish and Italian exit, each page in that country's
# currency (the US's and Europe's checked against YouTube Premium's prices in the same session). Canada's first read,
# from this machine, got the US page ("GL":"US", "$11.99") and was stored as CA$: read again 2026-11-10 through four
# Canadian exits, each "CA$10.99/month", Family "CA$16.99/month" and "12 months for CA$109.99". Google can place a
# Canadian address in the US, so a Canadian price counts only with its "CA$". Its annual plan ("Doesn't automatically
# renew") is sold in Canada, the US and Germany among them, and a Two-person plan in Australia and France. Its Student
# plans aren't listed, as Premium's aren't.
# Region checklist, 2026-11-04: 1. youtube.com/premium has no country paths, and gl= changes the country it names but
# not its prices (gl=NZ from Canada still showed CA$); 2. no picker; 3. not looked for; 4. checkout not opened; 5. the
# help centre has no price list by country; 6. read through each country's exit: New Zealand's three showed
# Australia's prices, Ireland's three the UK's, and the Netherlands' three "YouTube Premium is not available in your
# country", as Google One's page did, so those three stay unread; the first US and UK exits showed the same misplacement
# and the second or third read; 7. no bill offered.
# Not listed: the Student plans (CA$7.99, $8.99, £7.99, A$10.49, €7.99 to €10.49 a month), which "are only available
# to full-time students at approved higher education institutions" (the Premium terms): the catalog has no way to
# mark who may buy a plan yet, as with ChatGPT's and Google AI's student offers. Premium Lite's family plan (CA$12.99
# a month) is offered to a "randomly selected group of users in Canada" (the family plan article), so it isn't
# listed either.

# Coverage: youtube.* in NZ and IE: youtube.com/premium and youtube.com/musicpremium price by where the visitor is,
# and those countries' exits showed Australia's prices or the UK's (2026-11-04, and again 2026-11-09), so their prices
# stay unread.

# Coverage: youtube.premium, youtube.premium-family, youtube.premium-two-person and youtube.premium-lite in NL: the
# Netherlands' exits showed "YouTube Premium is not available in your country" (2026-11-04), so their prices stay
# unread; YouTube Music Premium's page there priced in euros (2026-11-09).

# Coverage: youtube.music-premium-two-person in CA, US, GB, DE, NL, ES and IT: YouTube Music Premium's page sells a
# Two-person plan only in Australia and France among the catalog's regions (each country's exit, 2026-11-09).

# Coverage: youtube.premium-two-person in CA, US, GB, DE, ES and IT: the Two-person plan "is currently only available
# in" a list of countries that has Australia and France and none of these (its article, 2026-11-04).

# Skips, your own music, lyrics and live radio (YouTube Music's plans), read 2026-11-11 with Edge: ad-supported
# YouTube Music has "Queuing, repeat, and unlimited skipping" (What is YouTube Music?); "You can play uploaded songs in
# the background, ad-free and offline—even if you are not currently a YouTube Music Premium subscriber" (Upload music to
# your YouTube Music library); "You can view translated lyrics to any song on YouTube Music" (Customize your music &
# podcasts). No live radio named. Premium Lite isn't a music plan, so it has none of these.
