# Terms and policies, read 2026-11-04 (M11.15): the YouTube Terms of Service (effective January 5, 2022, as served in
# Canada; the UK's of March 17, 2025, and the EEA's through gl=), the Paid Service Terms with their Premium terms
# (effective November 3, 2026), YouTube Help's articles on cancelling, refunds, plans and limits, the YouTube Kids
# privacy notice, and Google's Privacy Policy (data/policies/google-privacy.yaml), which YouTube's terms point to.
# Google's own Terms of Service don't apply: YouTube's say "Your use of any Paid Service is governed only by the
# Terms, and not the terms of any other Google product". Inactivity and security are Google's account and
# Vulnerability Reward Program pages, as for Google AI.
policies:
  shared: [google-privacy]
  links:
    - name: 'Terms of Service'
      url: https://www.youtube.com/t/terms
    - name: 'Paid Service Terms of Service'
      url: https://www.youtube.com/t/terms_paidservice
    - name: 'YouTube Kids privacy notice'
      url: https://kids.youtube.com/t/privacynotice
    - name: 'Cancelling'
      url: https://support.google.com/youtube/answer/6308278
    - name: 'Refunds'
      url: https://support.google.com/youtube/answer/12014038?hl=en#zippy=%2Cyoutube-premium-music-premium-refund-policies
    - name: 'Device limits'
      url: https://support.google.com/youtube/answer/6308288
    - name: 'Family plans'
      url: https://support.google.com/youtube/answer/7507349
    - name: 'Premium Lite'
      url: https://support.google.com/youtube/answer/15968883
    - name: 'YouTube Premium'
      url: https://www.youtube.com/premium
    - name: 'Terms of Service (UK)'
      url: https://www.youtube.com/t/terms?gl=GB&hl=en
    - name: 'Terms of Service (EEA)'
      url: https://www.youtube.com/t/terms?gl=IE&hl=en
    - name: 'Your content and third-party training'
      url: https://support.google.com/youtube/answer/15509945
    - name: "Google's privacy policy"
      url: https://policies.google.com/privacy
    - name: 'Inactive Google Accounts'
      url: https://support.google.com/accounts/answer/12418290
    - name: 'Vulnerability Reward Program'
      url: https://bughunters.google.com/about/rules/google-friends/google-and-alphabet-vulnerability-reward-program-vrp-rules
  ratings:
    - topic: privacy.ai-training
      tier: bad
      reason: "Google says it may use public information to train its AI models, and YouTube's terms let Google's companies use what you upload in their business: you can't opt out. Other AI companies can train on your videos only if you turn that on."
      sources:
        - url: https://policies.google.com/privacy
          quote: 'we may collect information that’s publicly available online or from other public sources to help train Google’s AI models'
        - url: https://www.youtube.com/t/terms
          quote: "in connection with the Service and YouTube’s (and its successors' and Affiliates') business"
        - url: https://support.google.com/youtube/answer/15509945
          quote: 'By default, the third-party training setting is turned off.'
      lastVerified: 2026-11-04
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 13, or younger with a parent’s setup. Its kids app shows no ads picked from what children do, but nothing says what teenagers get on YouTube.'
      sources:
        - url: https://www.youtube.com/t/terms
          quote: 'You must be at least 13 years old to use the Service'
        - url: https://www.youtube.com/t/terms
          quote: 'children of all ages may use the Service and YouTube Kids (where available) if enabled by a parent or legal guardian'
        - url: https://kids.youtube.com/t/privacynotice
          quote: 'The app does not allow interest-based advertising or remarketing.'
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel online at any time, past an offer to pause, and keep Premium until the end of the period you paid for.'
      sources:
        - url: https://support.google.com/youtube/answer/6308278
          quote: 'You can cancel, pause, or resume your paid membership at any time as a YouTube Premium and YouTube Music Premium subscriber.'
        - url: https://support.google.com/youtube/answer/6308278
          quote: 'Click Continue to cancel.'
        - url: https://support.google.com/youtube/answer/6308278
          quote: 'Your YouTube paid membership benefits will continue until the end of the billing period.'
      action:
        name: 'Cancel your membership'
        url: https://www.youtube.com/paid_memberships
      lastVerified: 2026-11-04
    - topic: billing.refunds
      tier: neutral
      reason: "You don't get money back when you cancel, but you keep Premium to the end of the period. It refunds when its features don't work, and never part of a prepaid year."
      sources:
        - url: https://support.google.com/youtube/answer/12014038?hl=en#zippy=%2Cyoutube-premium-music-premium-refund-policies
          quote: "You won't be refunded for the period between when you cancel and when your membership ends."
        - url: https://support.google.com/youtube/answer/12014038?hl=en#zippy=%2Cyoutube-premium-music-premium-refund-policies
          quote: 'If videos or features related to your YouTube purchase don’t work, you may be eligible for a refund.'
        - url: https://support.google.com/youtube/answer/12014038?hl=en#zippy=%2Cyoutube-premium-music-premium-refund-policies
          quote: 'Refunds are not available for partially used prepaid plans.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      tier: neutral
      reason: "It tells you before a new price applies, and you can cancel first, but it doesn't say how far ahead."
      sources:
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'Any changes to pricing for Paid Services with recurring payments will only apply following reasonable notice to you.'
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'you can cancel the Paid Service before the start of the next subscription period in which the new price applies'
      lastVerified: 2026-11-04
    - topic: billing.free-trials
      tier: good
      reason: 'Its trial turns into a paid plan unless you cancel, and it reminds you 7 days before the trial ends.'
      sources:
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'At the end of the trial period, you will be automatically charged the price of the subscription and will continue to be charged until you cancel your subscription.'
        - url: https://www.youtube.com/premium
          quote: "You'll be reminded 7 days before your trial ends."
      lastVerified: 2026-11-04
    - topic: billing.renewal-notice
      status: not-stated
      reason: "Its terms say a monthly plan renews on its own, but not that it reminds you first. Its yearly plans are paid ahead and don't renew."
      pages: [https://www.youtube.com/t/terms_paidservice]
      lastVerified: 2026-11-04
    - topic: billing.fees
      tier: poor
      reason: 'Besides the price and taxes, it can add bank fees and the cost of currency changes, without saying how much.'
      sources:
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'Google will charge your payment method for the price listed for the relevant Paid Service along with any additional amounts relating to applicable taxes, bank fees and currency fluctuations.'
      lastVerified: 2026-11-04
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its pages say how to move up from Premium Lite or to a family plan, but not what happens to what you’ve paid.'
      pages:
        - https://support.google.com/youtube/answer/15968883
        - https://support.google.com/youtube/answer/6308278
      lastVerified: 2026-11-04
    - topic: legal.disputes
      tier: good
      reason: 'Disputes go to the courts of Santa Clara County, California, under California law, with no arbitration.'
      sources:
        - url: https://www.youtube.com/t/terms
          quote: 'will be litigated exclusively in the federal or state courts of Santa Clara County, California, USA'
      lastVerified: 2026-11-04
    - topic: legal.disputes
      regions: [GB, IE, DE, FR, NL, ES, IT]
      tier: great
      reason: 'In the EU and the UK, disputes go to the courts where you live, under its law, and it names no arbitration or class action ban.'
      sources:
        - url: https://www.youtube.com/t/terms?gl=GB&hl=en
          quote: 'either party may bring legal proceedings (including for breaches of these terms) in your local courts'
        - url: https://www.youtube.com/t/terms?gl=IE&hl=en
          quote: 'will be governed by the laws of your country of residence, and legal proceedings may be brought in your local courts'
      lastVerified: 2026-11-04
    - topic: legal.terms-changes
      tier: neutral
      reason: "It tells you about big changes to its terms ahead of time, but doesn't say how far ahead. If you don't agree, you stop using it."
      sources:
        - url: https://www.youtube.com/t/terms
          quote: 'If we materially change this Agreement, we’ll provide you with reasonable advance notice and the opportunity to review the changes'
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'If we materially change the Paid Service Terms, we’ll provide you with reasonable advance notice'
      lastVerified: 2026-11-04
    - topic: legal.account-closure
      tier: good
      reason: 'It closes or suspends an account only if you seriously or repeatedly break its rules, the law makes it, or you cause harm, and it tells you why when it can. You can appeal.'
      sources:
        - url: https://www.youtube.com/t/terms
          quote: 'you materially or repeatedly breach this Agreement'
        - url: https://www.youtube.com/t/terms
          quote: 'We will notify you with the reason for termination or suspension by YouTube unless we reasonably believe that to do so'
        - url: https://www.youtube.com/t/terms
          quote: 'If you believe the termination or suspension has been made in error, you can appeal using this form.'
      lastVerified: 2026-11-04
    - topic: legal.service-changes
      tier: neutral
      reason: 'It can add or remove features and what you can watch, and tells you ahead of big changes that make it worse for you.'
      sources:
        - url: https://www.youtube.com/t/terms
          quote: 'we may make modifications or changes (to all or part of the Service) such as adding or removing features and functionalities, offering new digital content or services or discontinuing old ones'
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'The availability of content on a Paid Service may change from time to time'
      lastVerified: 2026-11-04
    - topic: legal.inactivity
      tier: good
      reason: 'Google may delete an account no one has used for two years, after emailing you first. An account with a subscription that is still running counts as in use.'
      sources:
        - url: https://support.google.com/accounts/answer/12418290
          quote: 'Google reserves the right to delete an inactive Google Account and its activity and data if you are inactive across Google for at least two years.'
        - url: https://support.google.com/accounts/answer/12418290
          quote: 'Your Google Account was used to make a purchase of a Google product, app, service, or subscription that is current or ongoing.'
        - url: https://support.google.com/accounts/answer/12418290
          quote: 'Email notifications to your Google Account'
      lastVerified: 2026-11-04
    - topic: security.practices
      tier: neutral
      reason: "It pays security experts who find and report problems in Google's and YouTube's services, but doesn't say outside experts regularly check YouTube's security or publish what they find."
      sources:
        - url: https://bughunters.google.com/about/rules/google-friends/google-and-alphabet-vulnerability-reward-program-vrp-rules
          quote: 'we maintain a Vulnerability Reward Program for Google-owned and Alphabet (Bet) subsidiary web properties, running continuously since November 2010.'
        - url: https://bughunters.google.com/about/rules/google-friends/google-and-alphabet-vulnerability-reward-program-vrp-rules
          quote: 'In principle, any Google-owned or Alphabet (Bet) subsidiary web service that handles reasonably sensitive user data is intended to be in scope.'
      lastVerified: 2026-11-04
    - topic: service.account-sharing
      tier: bad
      reason: "An individual plan is for one person: you can't share it, not even at home."
      sources:
        - url: https://www.youtube.com/t/terms_paidservice
          quote: 'This plan is designed to be used by one user and may not be used by multiple users sharing the same account.'
