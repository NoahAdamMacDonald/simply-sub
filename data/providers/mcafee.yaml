  - id: mcafee-assist
    name: McAfee Assist protection setup

# Features, read 2026-11-13 from each country's plan cards (each card's ticks are in the page's own data) and its product
# pages: every plan has "McAfee's scam protection" ("Automatic scam protection for texts and on-demand scans for QR
