# protection", "defend against viruses, online threats, and ransomware", "scan for viruses and quarantine/remove them":
# the US Total Protection page), "Secure VPN" ("McAfee unlimited VPN", its Mobile Security page; "We don't log or track
# what you do online", "almost 50 different countries", its VPN page), "Identity Monitoring" ("We scan up to 60 unique
# types of personal information on the dark web"), "Web protection", "Password manager", "File shredder" and "Advanced
# Firewall". McAfee+ adds "Personal info scans" (Premium) or "Personal info removal" (Advanced, Ultimate), and Advanced
# and Ultimate "Identity restoration"; outside the US only Ultimate has "Identity Theft Coverage" ("covered for up to $1
# million"), and in the US Advanced has "Up to $1M" and Ultimate "Up to $2M identity theft coverage", with "Credit
