# checkout's "By clicking "Buy Now", you accept the License Agreement, Auto-Renewal Policy and Privacy Notice." names),
# its refund policy article, the offer details on its plan, VPN and checkout pages. Not read: its Product Terms of
# Service and Identity Protection Terms of Service tabs beyond what the licence quotes, its Website Terms of Service
# (the website's, read in passing: California law), its Cookie Notice, and a vulnerability disclosure or audit page (none
# found from its legal or support pages). No shared document applies.
policies:
  links:
    - name: Privacy notice and licence agreement
      url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
    - name: Refund policy
      url: https://www.mcafee.com/support/s/article/000001679-refund?language=en_US
    - name: Checkout (renewal terms)
      url: https://www.mcafee.com/consumer/en-ca/ipz/checkout/2web/payment.html?moguid=bda8c67f-6d2a-430b-95c1-e11c5bda21da&culture=en-ca&affid=0&ccoe=direct&ccoel2=store&term=-1
    - name: Offer details (plans page)
      url: https://www.mcafee.com/en-ca/index.html
    - name: McAfee VPN (US offer details)
      url: https://www.mcafee.com/en-us/vpn.html
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It uses what it collects, with AI too, to improve its services. You can turn off its antivirus’s automatic threat reports, but not the rest.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'The AI features use the information we collect to improve the Services we provide to you, or to improve the support we provide to you in connection with our services.'
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'You can turn off this automatic reporting from your antivirus protection in your product.'
      action:
        name: 'Privacy notice: your choices'
        url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your data with ad and analytics companies to promote its products. To stop it, you fill in a request form.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'We may share your Personal Information with third-party advertising and analytics partners.'
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'You may opt out of targeted advertising by completing our Individual Data Request form'
      action:
        name: 'Individual data requests'
        url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Ad companies track what you do on its site and in some of its services to target ads at you. You can opt out with a form or the ad industry’s pages.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'We also work with third-party advertising companies to display or deliver ads to you while you are on our Site or using some Services.'
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'You may opt out of targeted advertising by completing our Individual Data Request form'
      action:
        name: 'Individual data requests'
        url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'It says it uses AI and the data it collects to improve its services, but not whether your messages or files train AI models.'
      pages: [https://www.mcafee.com/en-ca/consumer-support/policy/legal.html]
      lastVerified: 2026-11-13
    - topic: privacy.content-access
      tier: great
      reason: 'Its password manager is locked with your master password, which McAfee never has, so it can’t read what you store there.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'We never have a copy of your master password or your encryption keys, so you’re responsible for keeping them safe.'
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data as long as you’re a customer or it needs it, with few set times; it keeps your last card up to 12 months.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'We will keep your Personal Information for the minimum period necessary for the purposes set out in this Notice'
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'McAfee will keep the last payment method used for up to 12 months to resolve any outstanding settlements.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can delete some data in its products or ask it to delete your data with its request form; it gives no time for doing it.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'To exercise your rights to access, correct, or delete your data, you may be able to do so by using our product features:'
      action:
        name: 'Individual data requests'
        url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask it for a copy of your data, in electronic form where it can.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'obtaining access to or a copy of your Personal Information, including in electronic form where we are able to do so'
      action:
        name: 'Individual data requests'
        url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: poor
      reason: 'It may hand your data to police and government whenever it believes that’s “appropriate”, not only when the law requires.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'We may access, preserve, and disclose any information we store associated with you to external parties if we, in good faith, believe doing so is required or appropriate to prevent physical, financial, or other harm, injury, or loss, including to protect against fraud or credit risk; comply with law enforcement, national security requests'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data can go to the US and other countries with weaker privacy laws; for Europe and the UK it uses the EU’s standard contracts.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'our use of contracts that incorporate the Standard Contractual Clauses and other legal and technical safeguards issued by regulators or other relevant bodies to provide adequate protection in accordance with UK, EU and Swiss law and applicable regulations; and'
      lastVerified: 2026-11-13
