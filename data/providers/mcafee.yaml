      tier: neutral
      reason: 'An account needs your name, email address and a username; paying needs a card.'
      sources:
        - url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
          quote: 'We may collect Personal Information when you create an account, such as name, email address, username, and what country or state you are located in.'
      lastVerified: 2026-11-13
