# Researched by hand on 2026-11-13 (M11.15, security batch 1), read with Edge: each country's plan page from Canada and
# through that country's exit (mcafee.com answered "Access Denied" after a few reads from one address, so later pages
# were read through a fresh exit each). Pages, each quoted where it's used:
# Pricing: each country's own plan page (mcafee.com/en-ca/index.html, /en-gb/, /en-ie/, /en-au/, /en-nz/, /de-de/,
# /fr-fr/, /nl-nl/, /es-es/, /it-it/; the US's at mcafee.com) prices in that country's currency whoever reads it: its page
# data names the culture and currency ("countryCode":"CA","currencyCode":"CAD") and each offer's first-term price and
# renewal ("arPrice":"C$129.99"), and each card shows both ("C$44.99*" and "C$129.99 Save C$85.00"). "Unless otherwise
# stated, if a savings amount is shown, it describes the difference between the first term and renewal term
# subscription prices", so the struck price is the renewal one, stored. The checkout says the same ("at the renewal
# price (currently C$129.99/yr)"). Every plan is sold by the year; the US's two-year first terms of Premium, Advanced and
# Ultimate renew "on an annual basis" at the yearly price, so they're offers, not periods. Tax: Canada's checkout says
# "Tax Not yet included"; no country's card says its price includes tax.
# Plans by country: Total Protection Basic (1 device) and Essential (5 devices) everywhere; Total Protection for 10
# devices in Ireland and New Zealand only, where no McAfee+ plan is sold; McAfee+ Premium, Advanced and Ultimate
# (unlimited devices, 1 user) and Advanced Family (6 family members) in Canada, the UK, Australia and the euro countries;
# in the US also Premium Family and Ultimate Family.
# Region checklist for CA and US, 2026-11-13: 1. each country's path (/en-ca/, the US's root); 2. its footer's country
# picker ("Canada / English"); 3. its page data names the country and currency; 4. the checkout's first step, up to the
# email field ("Credit or debit card"); 5. its refund article; 6. Edge from Canada and through Canadian and US exits;
# 7. no bill offered.
# Not listed: Mobile Security (sold in its apps through the app stores; its page shows no price), PC Optimizer (a tune-up
# tool, not read) and the business plans. Monthly billing: the US's offer details mention it ("or monthly, based on
# your selection") but no card read sells it.
# Bundles: none found. Official resellers: none named; retail cards ("Activate Retail Card") are sold in shops it doesn't
# name. Free use: WebAdvisor, its free plan.

# Coverage: mcafee.premium-individual, mcafee.advanced-individual, mcafee.advanced-family and
# mcafee.ultimate-individual in IE and NZ: their plan pages sell only Total Protection (Basic, Essential and 10 devices).

# Coverage: mcafee.premium-family, mcafee.advanced-individual-us, mcafee.advanced-family-us,
# mcafee.ultimate-individual-us and mcafee.ultimate-family-us in CA, GB, IE, AU, NZ, DE, FR, NL, ES and IT: the US's
# plans; the others' plan pages sell their own McAfee+ plans (and no Premium or Ultimate Family).

# Coverage: mcafee.advanced-individual, mcafee.advanced-family and mcafee.ultimate-individual in US: the US sells its own
# versions, with identity theft coverage and credit monitoring (mcafee.*-us).

# Coverage: mcafee.total-protection in CA, US, GB, AU, DE, FR, NL, ES and IT: their plan pages sell Basic, Essential and
# McAfee+ instead.

id: mcafee
name: McAfee
website: https://www.mcafee.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its licence agreement's "How do I turn off automatic renewal?" (no cancelling help article was read).
cancelUrl: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
sources: { pricing: https://www.mcafee.com/en-ca/index.html }
# Owner (M11.2), read 2026-11-13: its own press release (linked from its investors page) on the investor group led by
# Advent International and Permira buying it in 2022, after which it is private. Its licence agreement names McAfee, LLC
# (Delaware, San Jose) as the company that licenses it in the US.
owner:
  name: McAfee, LLC (owned by an investor group led by Advent International and Permira)
  page:
    name: Press release (acquisition)
    url: https://www.mcafee.com/en-us/newsroom/press-releases/press-release.html?news_id=246b0dad-b4ee-442b-bd1a-22be31392038
  quotes:
    - 'today announced the completion of its acquisition by an investor group led by Advent International Corporation (“Advent”) and funds advised by Permira'
    - 'As a result of the transaction, McAfee is no longer a publicly traded company.'
  country:
    code: US
    page:
      name: Licence agreement
      url: https://www.mcafee.com/en-ca/consumer-support/policy/legal.html
    quotes:
      - 'McAfee, LLC, a Delaware limited liability company, with offices located at 6220 America Center Drive, San Jose, California 95002, USA'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: Canada's checkout offers "Credit or debit card"; no page read names the card
# networks, PayPal or other ways (its licence speaks of "credit or debit card or other payment type").
paymentMethods:
  - methods: [card]
    page: Checkout
    url: https://www.mcafee.com/consumer/en-ca/ipz/checkout/2web/payment.html?moguid=bda8c67f-6d2a-430b-95c1-e11c5bda21da&culture=en-ca&affid=0&ccoe=direct&ccoel2=store&term=-1
    quotes: ['Credit or debit card']
# Renewal day (M11.5): it charges "30 days before the subscription ends and annually thereafter", a month before the
# date you signed up, which no kind in core names, so not-stated (notes.md).
renewalAnchor:
  kind: not-stated
  pages:
    [
      https://www.mcafee.com/consumer/en-ca/ipz/checkout/2web/payment.html?moguid=bda8c67f-6d2a-430b-95c1-e11c5bda21da&culture=en-ca&affid=0&ccoe=direct&ccoel2=store&term=-1,
      https://www.mcafee.com/en-ca/consumer-support/policy/legal.html,
    ]
  lastVerified: 2026-11-13
# Lab results (M11.2), read 2026-11-13: AV-TEST's newest Windows test of home-user products, Jul-Aug 2026 (its page for
# McAfee Total Protection, report 261413): 6.0 of 6 for each.
ratings:
  - rater: av-test
    subject: antivirus-protection
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/mcafee-total-protection-1.39-261413/
    tested: Total Protection 1.39, Windows 11
  - rater: av-test
    subject: antivirus-performance
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/mcafee-total-protection-1.39-261413/
    tested: Total Protection 1.39, Windows 11
  - rater: av-test
    subject: antivirus-usability
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/mcafee-total-protection-1.39-261413/
    tested: Total Protection 1.39, Windows 11

# General features, read 2026-11-13. Platforms: "Windows® | macOS® | Android™ | iOS® | ChromeOS™" (its VPN page) and the
# WebAdvisor extension (Chrome, Edge and Firefox, its Scam Detector article). Support: "contacting McAfee Customer
# Service by phone or chat" (its refund policy) and "24/7 Customer Assistance". App languages: its site's language
# versions (its country picker's paths: English, French, German, Spanish, Italian, Portuguese, Dutch, Japanese, Korean,
# Chinese and more). Sign-in methods: not read. No pause; parental controls aren't on any plan card read.
features:
  platforms: [windows, macos, android, ios, browser-extension]
  support.channels: [chat, phone, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh]

