# Terms and policies (BLUEPRINT §4.10), read 2026-11-19: its General Terms, Subscription Terms (incorporated "by
# reference into the Terms"), NordVPN Additional Terms and NordLocker Additional Terms (Complete and up), its General
# Privacy Policy with each section opened, its NordVPN Privacy Notice and its Cookie Policy, all at my.nordaccount.com;
# its pricing page's offer terms and FAQ, its trust center, Deloitte and Cure53 posts, renewal price list and help
# articles (free trial, refunds). Its apps' licence is the General Terms' "License terms" section. The NordPass
# Additional Terms (Complete's password manager) add a dormant-account policy for free NordPass accounts (an inactivity
# rating for the plans with it); no other topic is worse there. Incogni's and Coveron's own terms
# (the third plans' third-party services) weren't read: their pages are incogni.com and Coveron's, other companies'
# (notes.md). Nord's General Terms and Privacy Policy cover NordPass and NordLocker too, not Surfshark, so they're rated
