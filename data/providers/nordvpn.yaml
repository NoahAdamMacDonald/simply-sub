# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), read with Edge from Canada: nordvpn.com's pricing
# page (its 2-year, 1-year and 1-month plan views, its plan comparison, FAQ and offer terms), its trust center, servers,
# about, press and retail pages, its no-logs and Cure53 posts and its high-speed page; Nord Account's legal pages
# (my.nordaccount.com/legal/: the General Terms, Subscription Terms, NordVPN and NordLocker Additional Terms, the General
# Privacy Policy with each section opened, the NordVPN Privacy Notice, the Cookie Policy and the Subscription Renewal
# Prices list, where the pricing page's "then-applicable renewal price" link leads); its help centre's articles through
# its Zendesk API (support.nordvpn.com); nordsecurity.com's home, about, press and trademark pages. The pricing page
# again on 2026-11-19 through US, UK, Irish, Australian, New Zealand, German, French, Dutch and Spanish exits (each
# exit's country confirmed, and each page in the country's currency: US$ and NZ's bare "$", £, €, A$).
# Pricing: nordvpn.com/pricing/ prices by where the visitor is. Its 1-month cards are the monthly price ("Billed every
# month.", "Save 0%"); its 1-year and 2-year cards are first-term offers ("CA$217.35 CA$95.85 for the first 15 months.
# ... Renews at CA$173.88/year.", "CA$102.33 for the first 27 months. ... Renews at CA$173.88/year."), so only the
# yearly renewal price is stored, and no 2-year price: the Subscription Terms renew every plan of a year or longer
# "annually for one (1) year Renewal Periods". The yearly prices come from the Subscription Renewal Prices list
# (my.nordaccount.com/legal/pricing/, "Last updated June 9, 2026"), which names each country's currency ("Canada Price in
# CAD Basic 1-year 173.88"), and match each pricing page's "Renews at"; New Zealand's Complete Max ($301.08) is only on
# its pricing page. No page says its prices include tax: "GST/HST, PST may apply.", "Sales tax may apply.", "VAT may
# apply.", "GST may apply.", and the list "We will add the sales tax, VAT, GST/PST, or other mandatory tax".
# Plans: every country sells Basic and Complete, and a third plan that differs by country: Ultra (Canada, Ireland,
# Spain: Incogni), Prime (the US: Coveron's identity theft insurance and credit monitoring), Ultimate Max (the UK,
# Germany, France, the Netherlands: a Dedicated IP and cyber insurance) and Complete Max (Australia, New Zealand: a
# Dedicated IP). Each is a plan of its own (Norton's precedent). The list's older plans (Standard, Plus, Ultimate,
# Ultimate Pro) aren't on any pricing page read, so they're renewals of plans no longer sold, not drafted (notes.md).
# Italy: its pricing page showed Italian exits Cloudflare's "Performing security verification" every time (seven exits,
# headed and headless), so Italy's yearly Basic and Complete come from the list's "Euro zone" prices and its monthly
# prices and third plan are unread (Coverage below).
# New Zealand prices in US dollars: its page shows a bare "$" at the US list's amounts, NZD isn't among the list's
# currencies, and "For countries and regions where the local currency is not supported, Nord products are billed in U.S.
# dollars (USD)." (the list).
# Region checklist for CA and US, 2026-11-19: 1. no locale paths (nordvpn.com/pricing/ for every country; /fr/ and the
# other language paths change only the language); 2. no country or currency picker; 3. the page names its currency
# (CA$, US prices read through a US exit); 4. checkout not opened; 5. the renewal list and the help centre's currency
# article ("Our pricing is shown in USD, GBP, AUD ... and CAD, depending on the country you are accessing our website.");
# 6. Edge, and a plain fetch (403); 7. no bill offered.
# Bundles: none sold as a bundle of separate catalog plans; its plans include NordPass and NordLocker (Complete and up),
# NordPass is a catalog provider now (includes-subscription, below); NordLocker isn't yet, so it's storage.cloud.
# Official resellers: nordvpn.com/retail/ ("Where to buy") names BestBuy, Staples, MicroCenter, NewEgg and Amazon in the
# US, Amazon in the UK, BestBuy, Staples, NewEgg, London Drugs, The Source and Amazon in Canada, MediaMarkt, Saturn,
# Euronics and Amazon in Germany, Licentie2GO in the Netherlands and Amazon in Italy, France and Spain; their offers
# aren't priced yet (notes.md). App stores (Apple, Google Play, Amazon Appstore) bill it: partners, not listed.
# Free use: none; a 7-day free trial and a 3-day Google Play trial turn into paid plans.

# Coverage: nordvpn.ultra in US, GB, AU, NZ, DE, FR and NL: each country's pricing page sells another third plan
# (Prime in the US, Ultimate Max in the UK, Germany, France and the Netherlands, Complete Max in Australia and New
# Zealand), read 2026-11-19 through each country's exit.
# Coverage: nordvpn.prime in CA, GB, IE, AU, NZ, DE, FR, NL and ES: the US's own third plan; the other countries'
# pricing pages sell Ultra, Ultimate Max or Complete Max instead (read 2026-11-19).
# Coverage: nordvpn.ultimate-max in CA, US, IE, AU, NZ and ES: sold in the UK, Germany, France and the Netherlands only;
# the other countries' pricing pages sell Ultra, Prime or Complete Max instead (read 2026-11-19).
# Coverage: nordvpn.complete-max in CA, US, GB, IE, DE, FR, NL and ES: sold in Australia and New Zealand only; the
# other countries' pricing pages sell Ultra, Prime or Ultimate Max instead (read 2026-11-19).
# Coverage: nordvpn.ultra, nordvpn.ultimate-max, nordvpn.complete-max and nordvpn.prime in IT: Italy's pricing page
# showed Italian exits a Cloudflare security check (2026-11-19), so which third plan it sells is unread; its yearly Basic
# and Complete are the renewal list's "Euro zone" prices.

id: nordvpn
name: NordVPN
aliases: [nord vpn, nord]
website: https://nordvpn.com
# Nord Account (my.nordaccount.com) holds its terms, privacy policy and renewal price list.
domains: [nordaccount.com]
category: vpn
spendCategory: software
# Charged in the price list's currency: "The displayed prices are charged upon the automatic renewal of the
# subscription plans in the currency in which the first payment was made." and "For countries and regions where the
# local currency is not supported, Nord products are billed in U.S. dollars (USD)." (the renewal list). Its help
# article "What is the currency your prices are shown in" says "charges are made in USD except for some payment
# providers": the renewal list, which is about charges, and its local payment companies (the General Terms name
# cyberpost Inc. in Toronto for Canadians) are taken over that general answer (notes.md).
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help article on cancelling auto-renewal (the pricing page's offer terms link it: "Detailed instructions on how to
# cancel can be found here").
cancelUrl: https://support.nordvpn.com/hc/en-us/articles/19556844985489-How-to-cancel-auto-renewal-for-your-NordVPN-subscription
sources: { pricing: https://nordvpn.com/pricing/ }
# Accepted cards and ways to pay (M9.2, M11.5), read 2026-11-19: the pricing page's FAQ "What payment methods does
# NordVPN accept?" names the networks for every buyer ("The exact choices shown at checkout depend on your country and
# currency."): Visa, Mastercard, American Express and Discover, and Maestro (other). It lists UnionPay among "digital
# wallets" with "other region-specific services", so UnionPay isn't listed as a network everywhere. GrabPay is other.
# Its help article adds Sofort (Klarna), and its General Terms prepaid and gift cards.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, discover, other]
    url: https://nordvpn.com/pricing/
    quotes:
      - 'NordVPN lets you pay with all major credit and debit cards (Visa, Mastercard, American Express, Discover, Maestro, and others), PayPal, digital wallets such as Google Pay, Apple Pay, UnionPay, GrabPay, and other region-specific services, a broad selection of cryptocurrencies (including Bitcoin, Ethereum, Litecoin, and Stablecoin), and local bank-transfer options like Sofort, iDEAL, and Twint where available.'
paymentMethods:
  - methods: [card, paypal, google-pay, apple-pay, crypto, bank-transfer, app-store, cash, other]
    page: 'Pricing'
    url: https://nordvpn.com/pricing/
    quotes:
      - 'NordVPN lets you pay with all major credit and debit cards (Visa, Mastercard, American Express, Discover, Maestro, and others), PayPal, digital wallets such as Google Pay, Apple Pay, UnionPay, GrabPay, and other region-specific services, a broad selection of cryptocurrencies (including Bitcoin, Ethereum, Litecoin, and Stablecoin), and local bank-transfer options like Sofort, iDEAL, and Twint where available.'
      - 'You can also subscribe through in-app purchases on the Amazon Store, Apple App Store or Google Play, or buy a prepaid NordVPN card with cash in selected retail stores.'
  - methods: [klarna]
    page: 'What payment methods does NordVPN accept'
    url: https://support.nordvpn.com/hc/en-us/articles/19685782821265-What-payment-methods-does-NordVPN-accept
    quotes:
      - 'You can pay with a credit card, cryptocurrency, PayPal, Sofort (Klarna), bank or local bank transfers, prepaid (debit) card, and many other payment methods.'
  - methods: [gift-card]
    page: 'General Terms of Service'
    url: https://my.nordaccount.com/legal/terms-of-service/
    quotes:
      - 'Payments made using prepaid cards or gift cards will not be refunded if such refunds are not supported by the provider of the card.'
# Renewal day (M11.5, M11.21), read 2026-11-19: monthly plans are charged on the day they renew and yearly ones up to 14
# days before ("Monthly plans: Charged on the day of the auto-renewal (the start of the Renewal Period). All other plans:
# Charged fourteen (14) days prior to the start of the Renewal Period.", its Subscription Terms), the date you signed up
# a term on. Core reads the pricing page's "up to 14 days before the renewal", not the terms' "fourteen (14) days", so
# the pricing page is quoted; "up to" plans for the same earliest day the terms name.
renewalAnchor:
  kind: same-date
  page: Pricing
  url: https://nordvpn.com/pricing/
  quotes:
    - 'Such payments are billed annually (up to 14 days before the renewal) or monthly depending on your billing cycle.'
  chargedBefore: { days: 14, upTo: true }
  lastVerified: 2026-11-19
# NordPass (2026-11-20): Complete and every plan built on it include NordPass Premium, now its own provider, so they
# list it in includes-subscription (the owner's standing rule for a perk that is another provider's plan).
# Owner (M11.2), read 2026-11-19: its press page says "NordVPN is brought to you by Nord Security"; nordsecurity.com's
# trademark policy (quoted, the review of 2026-11-19) defines it as "NordSec B.V. and/or its affiliates (together “Nord
# Security”)", and its privacy policy gives NordSec B.V.'s Amsterdam address (the country). Its General Terms and
# Privacy Policy are with nordvpn S.A. of Panama City (the provider's notes). Private: no page names a listing.
# Nord Security and Surfshark "merged under one holding company" in 2022 (surfshark.com/about-us).
notes: Its terms are with nordvpn S.A., a company in Panama, part of Nord Security.
owner:
  name: Nord Security
  website: https://nordsecurity.com
  page:
    name: Trademark policy
    url: https://nordsecurity.com/trademark-policy/
  quotes:
    - 'are the exclusive property of NordSec B.V. and/or its affiliates (together “Nord Security”)'
  country:
    code: NL
    page:
      name: General Privacy Policy
      url: https://my.nordaccount.com/legal/privacy-policy/
    quotes:
      - "For the purposes of the GDPR, Nord's representative in the European Economic Area (EEA) is NordSec B.V. (email: representative@nordsec.com; postal address: Fred. Roeskestraat 115, 1076 EE Amsterdam, the Netherlands)."
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19

# Free use (the owner's item of 2026-11-09), read 2026-11-19: none. Its NordVPN Additional Terms: "Users will have to
# purchase a paid Subscription from Nord to connect to the NordVPN Services, except in the case of a limited free trial
# or certain coupon offers." Its 7-day free trial ("Does NordVPN have a free trial?") turns into the plan chosen.
freeUse:
  kind: none
  pages:
    - https://nordvpn.com/pricing/
    - https://my.nordaccount.com/legal/terms-of-service/nordvpn/
    - https://support.nordvpn.com/hc/en-us/articles/19744837091217-Does-NordVPN-have-a-free-trial
  lastVerified: 2026-11-19

# General features, read 2026-11-19. Platforms: "We have NordVPN apps for Windows, Linux (with both a graphical and
# command-line version), macOS, iOS, Android, and more." and "Browser proxy extensions: Light add-ons for Chrome,
# Firefox, and Edge" ("What features does NordVPN have?"), and its Android TV and Apple TV guides ("Installing and using
# NordVPN on Android TV or Nvidia Shield", "How to connect to your NordVPN Dedicated IP on Apple TV"). Sign-in: a Nord
# Account's email and password, two-factor codes from "authenticator applications" or "a security key" ("What is MFA,
# and how to enable it"), or Google or Apple ("If you choose to create your Account using a third-party provider, such
# as companies like Google or Apple", its Privacy Policy). Support: "NordVPN has 24/7 customer support", by live chat
# ("contact our customer support team via live chat", its refund article) and email (support@nordvpn.com, its NordVPN
# Additional Terms). App languages: nordvpn.com's language menu (Bahasa Indonesia, Dansk, Deutsch, English, Español,
# Français, Italiano, ... Português, ... 한국어, العربية, 日本語, 简体中文, 繁體中文; no Hindi). Open source: only its Linux
# app ("Alongside the Linux app CLI, which has been open source for several years, the Linux app GUI source code is also
# available", its trust center), so software.open-source is left out (notes.md). No pause; no parental controls.
features:
  platforms: [windows, macos, linux, android, ios, browser-extension, tv]
  account.sign-in: [password, totp, security-key, sso]
  support.channels: [email, chat, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, ar]

