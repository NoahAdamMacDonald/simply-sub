# VPN features, read 2026-11-19, the same on every plan ("Secure, high-speed VPN" and "10 devices secured at once" on
# all three in every country's comparison):
# - Devices: "NordVPN as VPN Service allows a maximum of ten simultaneous connections per Account." (Additional Terms).
# - Traffic: "NordVPN has no VPN bandwidth or speed limits" (nordvpn.com/features/high-speed-vpn/).
# - Countries: "6,459 ultra-fast servers covering 149 countries" (nordvpn.com/servers/ FAQ; "224 locations" counts
#   cities and virtual locations).
# - Protocols: "NordLynx, NordWhisper, OpenVPN, and IKEv2/IPsec support" ("What features does NordVPN have?"); NordLynx
#   is "built on WireGuard", and NordWhisper is for restrictive networks: its Obfuscated Servers "run on the NordWhisper
#   protocol" (stealth).
# - Kill switch ("NordVPN Kill Switch: how does it work"), split tunnelling on Windows, Android and Android TV (an
#   allowlist on Linux), Double VPN (multi-hop), Onion Over VPN (Tor over VPN), P2P on every server ("All standard
#   NordVPN servers now support P2P activities"). Port forwarding only with the Dedicated Server add-on ("Standard
#   NordVPN servers and the Dedicated IP add-on don't support port forwarding."), not a plan, so no port forwarding.
# - Content blocking: Basic's "Scam and phishing protection" "Filters your online traffic through NordVPN's DNS servers
#   to block ads and malicious domains" (ads, malware); Complete and up add the "Ad and tracker blocker", which "stops
#   trackers" (desktop only).
# - No-logs policy (NordVPN Additional Terms) and its audits: Deloitte Lithuania's sixth no-logs assurance engagement,
#   "between November 10 and December 12, 2025", which "inspected our server infrastructure" (no-logs), after
#   PricewaterhouseCoopers' (2018, 2020) and Deloitte's (2022 to 2024); Cure53's 2025 assessment of its "Android, iOS,
#   Windows, macOS, and Linux applications" and "VPN servers and supporting infrastructure" (apps, servers).
# - RAM-only servers: "NordVPN servers don’t rely on traditional hard drives. Instead, all server data is stored in RAM
#   modules" (its trust center).
# - Meshnet: "Meshnet is a NordVPN feature that allows you to create a secure private network for your devices."
#   ("Guide for Meshnet users", updated 2026-11-03).
# - Not anonymous: an account needs "your email address and password" (General Terms). Unlimited traffic, so its
#   monthly VPN data is unlimited. Dedicated IP: an add-on (below), included in Ultimate Max and Complete Max (a perk).
# - Speeds (notes only, its own pages' claims): "NordVPN’s NordLynx protocol achieved the best results overall (over 817
#   Mbps)" (high-speed page) and "We’ve upgraded all our servers to 10 Gbps" (trust center).
# The security features of Complete and up, read on each country's comparison: "Anti-malware & browsing protection
# powered by next-gen antivirus" ("Scans the files you are downloading for malware, removes those that are dangerous,
# and checks your apps for security weaknesses. Desktop only.": real-time, vulnerability scan, web protection, since
# "Real-time protection: Checks files for malware and blocks harmful websites as you browse."), "Unlimited email
# protection", "Call protection" and "Message protection" (scam protection: web, email, calls, text messages), a
# "Cross-platform password manager" (NordPass), "1 TB of encrypted cloud storage" (NordLocker) and "Dark Web Monitor
# Pro™"; every plan has "Dark Web Monitor™" ("Monitor up to 5 emails"). Categories (M11.3): Basic is a VPN; Complete and
# up are also an antivirus (security), a password manager (passwords) and cloud storage (storage).
# The password and authenticator features and end-to-end encryption added 2026-11-19 (the owner's design,
# categories.md), read that day with Edge from Canada (nordvpn.com/pricing) and in NordPass's help centre, for Complete
# and up's NordPass and NordLocker:
# - NordPass imports other managers' files ("LastPass: CSV", "Keeper: CSV, JSON", "Bitwarden: CSV, JSON" and more;
#   KeePass's as "CSV, XML", not .kdbx) and, on iOS, by the Credential Exchange ("For apps that don’t support CXP, use
#   the NordPass browser extension to import a CSV file."), How to import passwords to NordPass. It exports "the .CSV
#   file" (How to export passwords from NordPass?).
# - Offline: "you can still access your items with Offline Mode even if you are not connected to a network" (How to use
#   Offline Mode).
# - Emergency access and the authenticator, inferred: they're Premium's ("The Premium version also offers additional
#   security features, such as:" "Authenticator" and "Emergency Access", Premium vs Free version of NordPass), and the
#   plans' password manager "Syncs and backs up passwords across all your devices automatically." (the pricing page's
#   comparison), where "NordPass Free: This version only allows users to have one active session on one device." No page
#   names the NordPass plan included (notes.md). Its authenticator takes a code or a QR code ("Alternatively, if you are
#   using a mobile application, tap the “Scan QR code” button", How to use NordPass Authenticator); no export of the
#   codes is named.
# - End-to-end: NordPass ("With zero-knowledge architecture, you're the only one who can see what's in your vault", What
#   is a zero-knowledge architecture?) and NordLocker ("Secures all types of files with end-to-end encryption and keeps
#   them handy in a private, zero-knowledge cloud.", the pricing page).
