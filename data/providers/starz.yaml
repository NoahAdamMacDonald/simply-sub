        - https://www.starz.com/us/en/termsofuse
      lastVerified: 2026-11-11
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it needs it for its purposes and business, with no periods named, and some of it after you leave.'
