          quote: 'Monitor the performance of the Services, understand how you access and use the Services, and conduct internal research and reporting, data analytics, and other business analyses.'
        - url: https://www.starz.com/us/en/privacy
          quote: 'We use Google Analytics to collect usage details.'
        - url: https://www.starz.com/us/en/privacy
          quote: 'Please note that you will need to set preferences on each web browser and device you use to visit our Services.'
      action:
        name: 'Its privacy choices'
        url: https://www.starz.com/us/en/privacy
      lastVerified: 2026-11-11
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your information with ad partners, who may let other companies market to you, and may sell it to Amazon, Facebook, Google, Rokt and Snapchat. Opting out is browser by browser unless you’re signed in.'
