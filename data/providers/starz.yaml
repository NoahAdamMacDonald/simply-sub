# Researched by hand on 2026-11-11 (M11.15, streaming batch 6), read with Edge from Canada, its buy and sign-up pages
# again through a US exit, and its help centre (support.starz.com) in Edge. Pages, each quoted where it's used:
# Pricing: its buy page (starz.com/us/en/buy): "Monthly Plan", "$11.99/mo" and "Annual Plan", "$69.99/yr", in US
# dollars before tax ("currently $11.99/month plus applicable taxes", the page's offer terms; its plan data names
# "currency":"USD" and "country":["us"], whoever reads it, and the US exit's read showed the same), and its help
# centre's "Annual billing" ("The cost of this subscription will be $69.99 a year, plus tax."). The buy page's "$4.99"
# a month "for 3 months" and "$29.99 for 12 months" are first-term offers ("After completion of 12 month offer, service
# automatically renews for additional 12 month terms at $69.99 per 12 month term"), so the regular prices are $11.99 and
# $69.99. Its plan data also lists 3-, 6- and 10-month plans and a "STARZ + BritBox" bundle ("testing contentful
# entry", not subscribable) that no page sells: not listed.
# Region checklist for CA and US, 2026-11-11: 1. one site, /us/en (starz.com and /ca/en open /us/en, and /us/es
# doesn't exist); 2. no picker; 3. the buy page's plan data (USD, "us"); 4. the sign-up page's first step (an email
# address, or "Sign up with Google"), typing nothing; 5. its help centre's billing articles; 6. Edge from Canada and
# through a US exit, and a plain fetch; 7. no bill offered. Canada: not sold by starz.com (its terms, below). STARZ
# Canada (starz.ca, "Distributed by Lionsgate in Canada") sells it only through others: "STARZ is available through most
# TV service providers in Canada, direct to consumer as an add-on to Crave, through Amazon Prime Video and Apple
# Channels." (its FAQ, How can I get STARZ?, read 2026-11-11): Crave's add-on is crave.starz.
# Bundles: none sold on starz.com now (its terms allow them, 4.4). Official resellers: none. Partners that bill it
# themselves, named in its help centre: Amazon's STARZ channel ("It costs the same as our Streaming service"), Apple,
# Google, Roku, Microsoft's Xbox, Samsung, LG, Sling TV, YouTube TV, Hulu's add-on, Sprint and cable or satellite
# providers; and Peacock's STARZ add-on (peacock.starz, which plays STARZ in Peacock's app only).
# Features, read 2026-11-11: "Unconditionally ad-free", "Offline streaming via downloads", "Stream on multiple devices
# simultaneously" (the buy page); "You can stream on up to three different devices simultaneously." (How many devices can
# watch STARZ at the same time?); "A total of 5 different profiles can be added to a subscription", and a profile for
# kids is one with parental controls on it (How do I set up and manage Profiles?); downloads on its Apple and Android
# apps, with no number of devices, so 1 (inferred); "STARZ provides a live stream on our website" (Can I watch live
# content on STARZ?). Video quality: "Unfortunately, STARZ does not offer a 4K streaming option on the app or website."
# (Do you offer 4K streaming?), and no page of its own names its best quality, so Digital Trends' review gives it
# (third-party). What it streams: "bold original series, hit movies and riveting docuseries" (the buy page); "Family fun
# has its time and place. And this isn't it." (its corporate page), so no kids' content; none of your own media.
# Pause: "You may pause your subscription by visiting Settings in your Subscription account." (its terms, 4.6; the buy
# page's plan data allows a monthly plan up to 6 billing cycles' pause and an annual one none). Parental controls:
# "Parental Controls allow you to set a maximum movie rating and television rating for the applicable Profile." (its
# terms, 7.2), behind a PIN (its parental controls article).

# Coverage: starz.* in AS, GU, MP, PR and VI: its terms sell it in "US territories", but its buy page names no
# territory's price, and the US exit's page showed the US's (2026-11-11).

id: starz
name: STARZ
website: https://www.starz.com
category: streaming
spendCategory: streaming
# Its terms (3.1.2): "you must reside within the fifty states of the United States of America ("US"), the District of
# Columbia, or US territories", and (8.4) "The Platform is not available to subscribers outside of the United States".
# They don't name the territories; the five inhabited ones are listed, as Peacock's help centre names them.
availableIn: [US, AS, GU, MP, PR, VI]
billingCurrency: { US: USD }
cancelUrl: https://support.starz.com/en_us/how-do-i-cancel-my-starz-subscription-SJdqfEWyo
sources: { pricing: https://www.starz.com/us/en/buy }
# Owner (M11.2), read 2026-11-11: its investor site (investors.starz.com) names the listed company, Starz Entertainment
# Corp., separated from Lionsgate in 2025; its terms are Starz Entertainment, LLC's, "controlled and operated by Starz
# from the United States" (the release is datelined "SANTA MONICA, Calif. and VANCOUVER, BC"). No page read names a
# majority holder (its 2026 proxy statement wasn't read).
