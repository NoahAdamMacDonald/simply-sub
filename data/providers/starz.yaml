    page:
      name: Terms of Use
      url: https://www.starz.com/us/en/termsofuse
    quotes:
      - 'The Platform is controlled and operated by Starz from the United States.'
    lastVerified: 2026-11-11
  stock:
    listings:
      - { exchange: NASDAQ, symbol: STRZ }
  lastVerified: 2026-11-11
