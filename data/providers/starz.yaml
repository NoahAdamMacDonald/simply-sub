        url: https://www.starz.com/us/en/donotsell
      lastVerified: 2026-11-11
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'STARZ has no ads, but it tracks what you browse to show you its ads elsewhere, with Google’s and Meta’s tools. Opting out covers only some of it.'
