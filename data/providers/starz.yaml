      url: https://support.starz.com/en_us/how-do-i-cancel-my-starz-subscription-SJdqfEWyo
    - name: 'STARZ Terms of Use, Privacy Policy, and Data Deletion'
      url: https://support.starz.com/en_us/starz-terms-of-use-privacy-policy-and-data-deletion-Byri4Gn2bl
