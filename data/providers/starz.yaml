# Terms and policies (BLUEPRINT §4.10), read 2026-11-11 in Edge from Canada: its Terms of Use ("Effective Date: June 23,
# 2026"), its Privacy Notice (the same date), which the terms say "is not incorporated in these Terms of Use by
# reference", its "Do Not Sell/Share" page, and its help centre's billing, cancelling, downloads, profiles and data
# deletion articles; its sign-up page's first step, typing nothing. Not read: the sign-up steps after an email address,
# its Privacy Rights Manager and deletion form (TrustArc's, another company's site), its Gift Card Terms (the link opens
# an older Terms of Use with no gift card clauses) and the terms of the partners that bill it. Its terms take a perpetual,
# irrevocable licence over feedback and anything you submit (12.4), a topic streaming doesn't have. Calibrated against
# HBO Max (the same billing and closure wording) and Paramount+.
