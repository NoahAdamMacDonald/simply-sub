        - url: https://www.starz.com/us/en/privacy
          quote: 'We use Google Ads and Meta Pixel to customize our advertising and to serve you ads based on your browsing behavior.'
        - url: https://www.starz.com/us/en/privacy
          quote: 'Please note this does not opt you out of being served ads from us but the ads you receive may be less relevant to you and your interests, nor will it prevent the receipt of interest-based advertising from other companies that do not participate in these programs.'
      action:
