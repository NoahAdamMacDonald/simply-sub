        url: https://support.starz.com/en_us/starz-terms-of-use-privacy-policy-and-data-deletion-Byri4Gn2bl
      lastVerified: 2026-11-11
    - topic: privacy.data-portability
      tier: poor
      reason: 'Only people in states with privacy laws can ask to see their information. It offers no way to download it.'
