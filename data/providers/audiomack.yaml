          quote: 'In the event you elect to withdraw your consent for Audiomack to collect data from you, you can contact us by sending an email privacy@audiomack.com from the email address associated with your account OR by logging into your account and submitting a support ticket requesting that Audiomack erase any and all personal data concerning yourself.'
