# Ways to pay (M11.5), read 2026-11-11: its website and the app stores (its Terms of Service); no page names cards, PayPal
# or wallets for Canada or the US (its Payment options article lists African countries' local methods only), and its
# checkout needs an account, so the website's methods aren't listed.
paymentMethods:
  - methods: [app-store]
    page: Terms of Service
    url: https://audiomack.com/about/terms-of-service
    quotes:
      - 'By using our app and making in-app purchases, you consent to our sharing of data regarding your usage and consumption of purchased content with Apple, as part of our efforts to resolve refund requests.'
# Renewal day (M11.5): its terms bill a website purchase by "30-day payment period", so its months are priced every 30
# days (Mixcloud's and Tidal's precedent), though its Plus page says "Monthly Subscription".
renewalAnchor:
  kind: every-30-days
  page: Terms of Service
  url: https://audiomack.com/about/terms-of-service
  quotes:
    - 'If your Audiomack subscription was purchased via the Audiomack website, you can cancel your subscription at any time before the end of your 30-day payment period.'
  lastVerified: 2026-11-11

