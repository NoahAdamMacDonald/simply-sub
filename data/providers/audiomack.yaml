# Terms and policies (M11.15), read 2026-11-11: its Terms of Service (undated; its Audiomack+ Premium Subscription
# Refund Policy, its consent to share consumption data with Apple and its Supporters Program listener terms are on the
# same page), its Privacy Policy (effective December 23, 2020), its Plus page, its Responsible Disclosure Policy
# (creators.audiomack.com), its sign-up form, whose line names only those two documents ("By signing up you agree to
# our Terms of Service and Privacy Policy."; the steps after the email address weren't read), and its help centre's
# articles on cancelling, refunds through Apple and Google Play, deleting and creating an account, and downloads.
# Its Legal & DMCA page, Accessibility Policy and "Are there rules for Audiomack users?" (the terms' acceptable use
# again) hold no topic. Not read: its checkout (it needs an account), and Apple's and Google Play's own terms for
# purchases in their stores. Its website's cookie banner, read from Canada, leaves personalised ads off until you
# agree, but its apps track by default, so ads and tracking are graded from the apps. Buying in its iOS app shares
# "your usage and consumption of purchased content with Apple" for refund requests (selling or sharing data: the same
# grade). Calibrated against SoundCloud's, Mixcloud's, Spotify's and Deezer's grades. Not rated: rights over your
# content and its apps' licence (not topics for music), and switching plans (one paid plan).
