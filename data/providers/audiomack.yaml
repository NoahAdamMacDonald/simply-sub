# Researched by hand on 2026-11-11 (M11.15, the music category, part 5). Pages, each quoted where it's used:
# Pricing: its Plus page (audiomack.com/premium redirects to audiomack.com/plus), which prices by where the reader is:
# "CA$8.99/month after" read with Edge from Canada, and "$5.99/month after" read through a US exit. Plus is sold
# monthly only ("Monthly Subscription"), billed by "30-day payment period" (its terms); its first 30 days free are a trial.
# Region checklist, 2026-11-11: 1. no country paths; 2. no picker; 3. a US exit for the US; 4. checkout not opened (it
# needs an account); 5. its help centre's Payment options lists African countries' local methods only; 6. Edge read
# every page; 7. no bill offered. Its other regions aren't read yet.
# Not listed: the Audiomack+ Day Pass, "a one-time purchase" that doesn't renew and isn't sold in "the United States,
# United Kingdom, and Canada" (What is the Audiomack+ day pass?).
# Bundles and official resellers: none named on its Plus page or help centre.
# Features: Plus's "Ad-free Listening", "Unlimited Downloads" ("Save any song, album, or playlist for offline
# listening") and "Unlock our full catalog" (its Plus page); free streams "at the industry standard 160kbps" and Plus
# "at 320kpbs while on Wi-Fi" (What is the music quality/bitrate on Audiomack?); without Plus you can "offline a
# limited selection of songs", and Plus adds "unlimited downloads, higher-quality audio streaming, song lyrics" (What is
# a premium download?); anyone can "import and listen to audio files stored on your device directly in the Audiomack
# app" (How do I use Audiomack's local file player?); every page's footer calls it "an on-demand music streaming and
# audio discovery platform". No page names live radio or a skip limit.
id: audiomack
name: Audiomack
website: https://audiomack.com
