# General features, read 2026-11-20. Platforms: "Total supports Windows 11, Windows 10 version 22H2 or later, Windows on
# ARM64 version 24H2 or later, macOS 13 (Ventura) or later, iOS 18 or later, and Android 12 or later." (its FAQ; the VPN
# and ID Protection pages say the same: "Available for PC, Mac, Android and iOS"); its browser extensions are part of the
# app ("Browsing protection requires browser extensions"), not sold apart. Sign-in: My F-Secure's password with optional
# 2-step verification from "an authentication app, such as Google Authenticator or Duo Mobile" (its user guide); a login
# confirmation email on a new device only tells you. Support: "Chat with one of our support experts or meet our new
# chatbot." "Availability: 24/7" "Language: English" (its support page) and its Help Forum (community.f-secure.com).
# App languages: "You can choose the product language from more than 20 supported languages." with its FAQ's list
# (English, français, Deutsch, italiano, español, português, 日本語, 繁體中文 (香港) among them; no Korean, Hindi or Arabic).
# No pause. Parental controls: its user guide, which "applies to the following F-Secure subscriptions: F-Secure Total,
# F-Secure Internet Security", has Family Protection's content filtering for a child (Strict, Moderate or Basic profiles
# over 16 content categories, per Windows user account), with "Note: This feature is not available in all versions of the
# app."; its privacy notice ties restricting online content to versions "enabled by your service provider partner", and
# no plan page lists it. So Total and Internet Security have content filtering, inferred (no screen time, location or
# reports on any page).
features:
  platforms: [windows, macos, android, ios]
  account.sign-in: [password, totp]
  support.channels: [chat, community, 24-7]
  languages.interface: [en, fr, de, it, es, pt, ja, zh]

