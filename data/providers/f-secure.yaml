# Researched by hand on 2026-11-20 (M11.15, security batch 2), read from Canada with Edge and a plain fetch: f-secure.com's
# global (/en), US (/us-en) and UK (/gb-en) sites and its German, French, Italian, Dutch and Spanish ones, its shop
# (onlineshop.f-secure.com, run by Cleverbridge), its user guide (help.f-secure.com, Total for Windows), knowledge base
# (kb.f-secure.com), legal pages, company and investor sites, and AV-TEST's page. Pages, each quoted where it's used:
# Pricing: each site's product pages (/total, /internet-security, /vpn, /id-protection, /total/scam-protection), whose buy
# blocks show 1, 3 and 5 devices for 1 year and 2 years (the 2 years tab's prices are in the served page). "F-Secure
# honest pricing": "New or renew, the price is the same. No pricing games: your renewal price is the same as what any new
# customer pays." (its tooltip on every Total card), so the prices shown are the regular ones. The 2-year term renews for
# 2 years at the same price, so both periods are stored: each product's 2-year cart says so (read from Canada: Total's
# "This is a subscription order with a fee of €124.99 per 24 months.", Internet Security's and the VPN's "a fee of €89.99
# per 24 months", each with "This subscription renews automatically at the price and frequency shown in the cart
# above."). Scam Protection is monthly only ("Scam Protection is currently only available as a monthly subscription.").
# Which country: the US and UK sites price in USD and GBP; the global site, which a Canadian reader gets, prices in euros
# ("country":"global"), and the German, French, Italian, Dutch and Spanish sites show the same euro prices. Canada's
# checkout (read from Quebec) charged the euro price plus GST and QST, so the euro prices are GLOBAL, for Canada too; that
# checkout also lets the buyer pick Canadian dollars at a converted amount (CA$196.26 for €124.99), not a price list of
# its own (currencies, below). Its user guide's "Where can I buy F-Secure Total?" lists Canada, Australia and New Zealand.
# Tax: the Internet Security, VPN, ID Protection and Scam Protection pages of all three sites say "*All prices include
# VAT.". The UK's prices have taxIncluded. The global site's euro prices include VAT for buyers in the euro countries,
# but they're GLOBAL, for Canada too, whose checkout adds tax to them ("QST (9.975% on €124.99):", "GST (5% on
# €124.99):"), so they have none (taxIncluded would stop tax being added in Canada); euro prices of their own would need
# the German, French, Italian, Dutch and Spanish pages saved. The US pages' words aren't US sales tax. The Total pages
# don't say it, so the UK's Total prices have no taxIncluded.
# Region checklist for CA and US, 2026-11-20: 1. its hreflang links name en-US and en-GB sites only (no Canadian one); 2.
# no country picker beyond its site list ("Global" for Canada); 3. its page data names the site's country ("country":
# "global", "us"); 4. the checkout, up to the payment form, named Quebec, Canada, euros and GST/QST; 5. its knowledge base
# (payments, renewals, refunds); 6. Edge and a plain fetch; 7. no bill offered.
# Not drafted: its 2-, 7-, 10-, 15-, 20- and 25-device options ("Show all options"), ID Protection's 3- and 5-device
# options (their only difference is how many of each item it watches: their prices are in the plan's notes, read in Edge
# from each site's device tabs, where the UK's tabs read "5 devices" and "10 devices" but its cards say "3 devices | 1
# year" and "5 devices | 1 year"), Kiren by F-Secure (its
# mobile app, formerly F-Secure Mobile Security, sold in the app stores with no price on kiren.com), F-Secure Anti-Virus
# and the old Internet Security (no longer sold: "purchased before February 14th, 2023"), and its free tools (Identity
# Theft Checker, Link Checker, Online Shopping Checker, Deepfake Detector, IP checker).
# Bundles: none; Total is its own suite (a plan with its own features). Official resellers: none named. Its resellers page
# speaks of "2,500+ retail and e‑tail partners" without naming them, and a knowledge-base article names "a 3rd party
# provider, such as Bredband2, Power or EDV Buchversand" only as examples of where an automatic renewal may have been
# bought. Cleverbridge is the online reseller that runs f-secure.com's own shop, not a shop of its own. Operators that
# bill F-Secure in their own packages (Eastlink, Frontier, Ziply Fiber, TDS, altafiber, SaskTel and others, its privacy
# notices' and newsroom's partners) and the app stores are partners: noted, not listed.
# Free use: Online Scanner (its plan below).

id: f-secure
name: F-Secure
website: https://www.f-secure.com
category: security
