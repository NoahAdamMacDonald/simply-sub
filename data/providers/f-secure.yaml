    name: Identity Theft Help

# Features (read 2026-11-20): each product page's "Compare subscription options" (its ticks are images, read from the
# page's own data and a screenshot), the Total for Windows user guide and the VPN and ID Protection FAQs.
# - Internet Security and Total: antivirus ("viruses, trojans, ransomware, adware, keyloggers, spyware"), Ransomware
#   protection (blocking; no page offers to recover encrypted files), Gaming mode, Device lock check, Outdated OS check,
#   Privacy advisor; Scam protection's Shopping, Browsing, SMS scam, Phishing and Banking protection, Wi-Fi protection
#   (alerts about risky networks on phones), Ad Blocker, Cookie Popup Blocker and Scam Scanner. Real-time ("Automatic
#   scanning protects your computer in real time"), scans you start ("Quick scan" and "Full scan") and scheduled scans
#   ("Daily", "Weekly", "Monthly") from its Windows guide; behaviour-based blocking inferred from its "Allowing blocked
#   applications". No firewall of its own (Windows' is used), and no rescue scan, anti-theft, spam filter, webcam or
#   optimizer on any page.
# - VPN (Total and VPN): "unlimited VPN service", "Kill switch" (Windows, Mac, Android), apps and websites that bypass the
#   VPN, "Change your virtual location" in 27 countries (its guide's list, "over 20 countries" on the VPN page), protocols
#   "Hydra, Wireguard, OpenVPN, OpenVPN (TCP)" or "OpenVPN, OpenVPN (TCP), IKEv2" by app version (Hydra is the newer VPN's
#   own), "we do not create traffic logs" (the VPN page). No RAM-only servers, multi-hop, P2P rules, port forwarding or
#   published audit on any page; "Trusted Wi-Fi networks" let local devices bypass the VPN, which isn't a mesh. The VPN
#   plan's "Security: Limited" in the comparison isn't itemised, so no security feature is claimed for it.
# - Password vault (Total and ID Protection): passwords, payment cards and notes ("credit and debit card details and
#   personal notes", its privacy notice), weak and reused passwords flagged, import from "Dashlane", "Google Chrome",
#   "KeePassX V2", "LastPass", "Microsoft Edge", "Mozilla Firefox", "True Key" and others' exports, export "as plain
#   text" (ExportedPasswords.fsk) on Windows and Mac, a master password F-Secure never sees. No 2FA codes, sharing,
#   emergency access or offline use on any page. ID monitoring: "24/7 dark web monitoring" and breach alerts.

