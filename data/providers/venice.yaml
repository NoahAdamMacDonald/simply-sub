# Researched by hand on 2026-11-17 (the full catalog run, AI batch 1), read with Edge from Canada (venice.ai's pricing
# page in its Monthly and Yearly views, its comparison table from the screenshot, its privacy page with each FAQ answer
# opened, its FAQs with each answer opened, About, sign-up and download pages, Terms of Service and Privacy Policy) and
# a plain fetch of the pricing page's HTML for its own pricing data. Pages, each quoted where it's used:
# Pricing: venice.ai/pricing: Free "$0", Pro "$18" "/mo" or "$180" "/yr", Pro Plus "$68" or "$735", Max "$200" or
# "$2,160" ("Save $36", "Save $81", "Save $240" against twelve months). The page's own pricing data names the currency
# for everyone ("currency":"USD", "monthlyPriceUsd":18, "yearlyPriceUsd":180), and its terms say "all fees are
# denominated in U.S. Dollars": one US-dollar price list, GLOBAL. No page says a price includes tax ("including all
# applicable taxes", its terms).
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang; 2. no country or currency picker; 3. the page's
# pricing data names USD and no country; 4. checkout needs an account; 5. no prices or tax article; 6. Edge and a plain
# fetch from Canada; 7. no bill offered.
# Not listed: credits bought as you go ("Credits can be purchased with USD or USDC.", Can I pay with crypto?) and the
# API's "Pay as you go at published model rates": usage-billed, out; the VVV and DIEM tokens (staking, not a plan).
# Where it's sold: its terms say "The Service is intended for visitors located within the United States. We make no
# representation that the Service is appropriate or available for use outside of the United States.", a disclaimer
# rather than a list (its privacy policy has a section for users in Europe): no availableIn (notes.md).
# Bundles: none on its pages. Official resellers: none; no page names a shop that sells it.

id: venice
name: Venice
aliases: [venice.ai, venice ai]
website: https://venice.ai
domains: [docs.venice.ai]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its terms' cancelling steps ("clicking on your username, clicking “Manage Plan,” and selecting “Cancel subscription.”")
# and its FAQ's "How do I cancel my subscription?", which point to venice.ai/subscription (signed in).
cancelUrl: https://venice.ai/faqs
sources: { pricing: https://venice.ai/pricing }

# Ways to pay (M11.5), read 2026-11-17: a card through Stripe (its privacy FAQ), Bitcoin for yearly plans (its FAQs;
# the yearly cards' "PAY WITH CRYPTO", "PAY WITH BITCOIN" and "PAY VIA COINBASE"), and Apple's and Google's billing in
# its apps (its terms). No page names the card networks, so no acceptedNetworks.
paymentMethods:
  - methods: [card]
    page: 'Privacy in Venice (What does Venice store?)'
    url: https://venice.ai/privacy
    quotes:
      - 'Pro account users: credit card info goes only to Stripe (Venice never receives it).'
  - methods: [crypto]
    page: 'Venice FAQs (Can I pay with crypto?)'
    url: https://venice.ai/faqs
    quotes:
      - 'For subscriptions, BTC is accepted through BTCPay for yearly plans.'
  - methods: [app-store]
    page: 'Terms of Service'
    url: https://venice.ai/legal/tos
    quotes:
      - 'If you purchased your Subscription Service through an authorized third-party channel partner like the Apple App Store or Google Play, your subscription may be managed directly by the applicable third-party'

# Owner (M11.2), read 2026-11-17: its terms name Venice.ai, in Sheridan, Wyoming, as the company that offers it; no page
# names another company behind it or a listing.
owner:
  name: 'Venice.ai'
  page:
    name: Terms of service
    url: https://venice.ai/legal/tos
  quotes:
    - 'The Service is offered by Venice.ai, located at 1309 Coffeen Ave, Ste 14343, Sheridan, WY 82801.'
  country:
    code: US
    page:
      name: Terms of service
      url: https://venice.ai/legal/tos
    quotes:
      - 'We operate the Service from our offices in Wyoming, and we make no representation that Materials included in the Service are appropriate or available for use in other locations.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17 in its terms: "The “Subscription Billing Date” is the date when you purchase your
# first subscription to the Service." and "Your account will be charged automatically on the Subscription Billing Date
# and thereafter on the renewal date of your Subscription Service": the date you subscribed.
renewalAnchor:
  kind: same-date
  page: Terms of Service
  url: https://venice.ai/legal/tos
  quotes:
    - 'The “Subscription Billing Date” is the date when you purchase your first subscription to the Service.'
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on its pricing cards and comparison table: usage (perks, never features) and credits.
