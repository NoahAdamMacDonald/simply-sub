# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge: its Terms of Service (last
# updated June 8, 2026), which include its Privacy Policy and, for API users, its API documentation; its privacy page
# and its FAQs, each answer opened. The terms' Notice Regarding Apple applies to its iOS app only (no topic). Not read:
# the third-party model providers' policies the terms name (venice.ai/models), and the sign-up form's agreement line,
# which its sign-up page doesn't show before an email is entered.
policies:
  links:
    - name: Terms of service
      url: https://venice.ai/legal/tos
    - name: Privacy policy
      url: https://venice.ai/legal/privacy-policy
    - name: Privacy in Venice
      url: https://venice.ai/privacy
    - name: Venice FAQs
      url: https://venice.ai/faqs
    - name: Pricing
      url: https://venice.ai/pricing
    - name: Sign-up page
      url: https://venice.ai/sign-up
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel in a couple of clicks from your plan settings at any time, and you keep your plan until the period you paid for ends.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'If you purchased your Subscription directly from us, you may cancel your subscription at any time by clicking on your username, clicking “Manage Plan,” and selecting “Cancel subscription.”'
        - url: https://venice.ai/faqs
          quote: 'If you cancel, your access will remain active until the end of your current billing period.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'Payments are generally not refunded, but you keep your plan to the end of the period you paid for.'
      sources:
        - url: https://venice.ai/faqs
          quote: 'Venice subscriptions are generally non-refundable once payment has been processed.'
        - url: https://venice.ai/faqs
          quote: 'If you do not want your subscription to renew, you can cancel it before the next billing cycle and your access will remain active through the end of your current paid period.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you before a new price applies, without saying how long before.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'Venice.ai may change the fees for any feature of the Service, including additional fees or charges, if Venice.ai gives you advance notice of changes before they apply.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      status: not-stated
      reason: 'Its terms, pricing page and FAQs don’t mention a free trial.'
      pages:
        - https://venice.ai/legal/tos
        - https://venice.ai/pricing
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own for the same period, but not that it reminds you first.'
      pages: [https://venice.ai/legal/tos]
      lastVerified: 2026-11-17
    - topic: billing.fees
      tier: neutral
      reason: 'There are no fees beyond the price, except that an account that doesn’t pay can be charged collection and chargeback fees, with no amounts stated.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'In addition to the amount due for the Service, a delinquent account will be charged with fees or charges that are incidental to any chargeback or collection of any unpaid amount, including collection fees.'
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its terms and FAQs don’t say what happens to what you paid when you move to another plan, only that your credits stay if you go back to free.'
      pages:
        - https://venice.ai/legal/tos
        - https://venice.ai/faqs
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: poor
      reason: "Disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only by mailing a letter within 30 days of agreeing to its terms."
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'YOU UNDERSTAND AND AGREE THAT, BY ENTERING INTO THESE TERMS, YOU AND VENICE.AI ARE EACH WAIVING THE RIGHT TO A TRIAL BY JURY OR TO PARTICIPATE IN A CLASS ACTION.'
        - url: https://venice.ai/legal/tos
          quote: 'If you do not wish to resolve disputes by binding arbitration, you may opt out of the provisions of this Section 19 (Dispute Resolution and Arbitration) within 30 days after the date that you agree to these Terms by sending a letter to Venice.ai, Attention: Legal Department – Arbitration Opt-Out, 1309 Coffeen Ave, Ste 14343, Sheridan, WY 82801'
      action:
        name: 'How to opt out of arbitration (section 19.3)'
        url: https://venice.ai/legal/tos
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: neutral
      reason: 'Big changes to its terms start 30 days after it posts them or tells you, so you can leave first; smaller ones apply at once.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'Revisions will be effective immediately except that, for existing users, material revisions will be effective 30 days after posting or notice to you of the revisions unless otherwise stated.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: bad
      reason: 'It can close your account at any time for any reason or none, with or without warning.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'In addition, Venice.ai may, at its sole discretion, terminate these Terms or your account on the Service, or suspend or terminate your access to the Service, at any time for any reason or no reason, with or without notice, and without any liability to you arising from such termination.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: poor
      reason: 'You keep what you write and make, but give Venice a licence that never ends and that it can pass on.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'By Submitting User Content to or via the Service, you grant Venice.ai a worldwide, non-exclusive, irrevocable, perpetual, royalty-free, fully paid right and license (with the right to sublicense through multiple tiers)'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: neutral
      reason: 'What it makes for you counts as your content, which you keep, but the same licence lets Venice use it too.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'Based upon your Input, the Service may return outputs to you (and together with the Input, “User Content”). You retain any copyright and other proprietary rights that you may hold in the User Content, subject to the licenses granted in these Terms.'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or drop any part of the service, paid features included, at any time without notice, and takes no responsibility for it.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'Venice.ai will have no liability for any change to the Service, including any paid-for functionalities of the Service except to the extent required by applicable law, or any suspension or termination of your access to or use of the Service.'
      lastVerified: 2026-11-17
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms say nothing about closing accounts that aren’t used.'
      pages: [https://venice.ai/legal/tos]
      lastVerified: 2026-11-17
    - topic: legal.licence
      tier: neutral
      reason: 'You may use Venice and its apps for personal, non-commercial use only, and may not copy or change them unless the law lets you.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'Subject to your complete and ongoing compliance with these Terms, Venice.ai grants you, solely for your personal, non-commercial use, a limited, non-exclusive, non-transferable, non-sublicensable, revocable license to:'
        - url: https://venice.ai/legal/tos
          quote: 'Except and solely to the extent such a restriction is impermissible under applicable law, you may not: reproduce, distribute, publicly display, publicly perform, or create derivative works of the Service; make modifications to the Service; or interfere with or circumvent any feature of the Service, including any security or access control mechanism.'
      lastVerified: 2026-11-17
    - topic: service.software-control
      status: not-stated
      reason: 'Its terms don’t say whether its apps update themselves or change anything else on your device.'
      pages: [https://venice.ai/legal/tos]
      lastVerified: 2026-11-17
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its terms make you responsible for your account and password, but don’t say whether you may share it.'
      pages: [https://venice.ai/legal/tos]
      lastVerified: 2026-11-17
    - topic: security.practices
      tier: neutral
      reason: 'It runs a bug bounty for people who find security problems. Its TEE and end-to-end encrypted models prove their privacy with checkable certificates, but no audit of Venice itself is named.'
      sources:
        - url: https://venice.ai/faqs
          quote: 'Please submit security vulnerabilities through the Venice Bug Bounty Program.'
        - url: https://venice.ai/privacy
          quote: 'Remote attestation produces a cryptographic certificate proving the model runs inside a genuine enclave — you can validate it independently outside Venice.'
      lastVerified: 2026-11-17
    - topic: privacy.data-collection
      tier: bad
      reason: 'It never stores your chats, but it does record what you do (sign-ins, new chats, deletions) and uses analytics such as Google Analytics, with no way stated to turn that off.'
      sources:
        - url: https://venice.ai/privacy
          quote: 'All accounts: product event logs (sign-ins, chat creation, etc.) that record actions, not content. Venice does not know what you said or what a deleted chat contained.'
        - url: https://venice.ai/legal/privacy-policy
          quote: 'We use analytics services, such as Google Analytics, to collect and process certain analytics data.'
      lastVerified: 2026-11-17
    - topic: privacy.data-sharing
      tier: bad
      reason: 'It lets analytics and advertising partners use cookies and similar tools to follow what you do across other services, and gives no way to say no.'
      sources:
        - url: https://venice.ai/legal/privacy-policy
          quote: 'Our third-party partners, such as analytics, advertising, and security partners, may also use these technologies to collect information about your online activities over time and across different services.'
        - url: https://venice.ai/legal/privacy-policy
          quote: 'We may disclose any information we receive to our current or future affiliates for any of the purposes described in this Privacy Policy.'
      lastVerified: 2026-11-17
    - topic: privacy.ads-tracking
      tier: bad
      reason: 'Venice shows no ads, but uses your data for its own marketing and advertising, with no way stated to turn that off.'
      sources:
        - url: https://venice.ai/legal/privacy-policy
          quote: 'For marketing and advertising purposes, such as developing and providing promotional and advertising materials that may be relevant, valuable or otherwise of interest to you;'
      lastVerified: 2026-11-17
    - topic: privacy.ai-training
      tier: great
      reason: 'It promises never to train AI on what you write or make, and requires the AI companies it uses not to either.'
      sources:
        - url: https://venice.ai/legal/tos
          quote: 'Notwithstanding anything to the contrary, Venice.ai agrees that it shall not use, and shall require that third-party large language model providers (“Third-Party LLM Providers”) do not use, any User Content to train any machine learning, deep learning, or statistical learning algorithms, LLMs, neural networks, or models.'
      lastVerified: 2026-11-17
    - topic: privacy.content-access
      tier: neutral
      reason: 'Your chats stay on your device, encrypted. By default the AI servers read your messages only to answer and don’t keep them; in Anonymous mode the other AI company may keep them.'
      sources:
        - url: https://venice.ai/privacy
          quote: 'Prompts, responses, generated images, and document uploads are never saved on Venice infrastructure — they stay encrypted on your device.'
        - url: https://venice.ai/privacy
          quote: 'Inference runs on Venice-controlled GPUs or zero-data-retention partner infrastructure. Privacy is enforced by contractual commitments — no prompt or response is stored.'
        - url: https://venice.ai/privacy
          quote: 'Venice proxies your request to leading frontier model providers. Your identity is obscured from the provider, but you should assume the provider is storing your content.'
      lastVerified: 2026-11-17
    - topic: privacy.content-access
      plans: [venice.pro, venice.pro-plus, venice.max]
      tier: good
      reason: 'On paid plans you can choose end-to-end encrypted models, which nobody, Venice included, can read.'
