# AI features (the AI category's registry), read 2026-11-17 in its pricing cards, its "Compare Features" table (its
# ticks are images: read from the screenshot), its FAQs and its privacy page:
# - Web search on every plan: the table's "Web search" row ticks Free, Pro, Plus and Max; "When Web Search is enabled,
#   Venice can use supported search providers to retrieve up-to-date results and use them in its response." (FAQs).
# - Image generation on every plan: Free's "15 image prompts per day"; the table's "Image prompts" row.
# - Memory on every plan: "Venice uses a privacy-preserving memory system that stores memories locally in your browser
#   instead of on Venice servers." (FAQs), with no plan named.
# - Chats kept only on your device, on every plan: "Your conversation history stays on your device. Venice never stores
#   it on its servers." (Privacy in Venice); the table's "Conversation history (local)" and "Local-only conversation
#   storage" rows tick every plan. Pro's backups are encrypted with "a password that only you control" before they
#   are uploaded ("Backups expire after 90 days."): still `on-device`, the chats themselves.
# - On the paid plans: models from several companies ("All Pro models access"; its models include xAI's Grok 4.7, Kimi
#   K3, DeepSeek and Qwen, About; the frontier models "(GPT, Claude, Gemini)" in Anonymous mode, Privacy in Venice),
#   video and music ("Generate video, music, and use frontier image and text models with credits"), voice (the table's
#   "Text to speech" row; "To enable Voice Mode, open the settings menu from the prompt bar while using a text model.",
#   FAQs; "Ask by voice or text.", its download page), custom assistants ("Create and share custom characters"; the
#   table's "Character creation" and "Custom system prompts" rows), and the API with monthly credits that pay for it
#   ("100 credits / month for video, music, premium models, and API"; the table's "API access" row, which Free lacks:
#   Free's card says "API Access (pay with credits)", credits it doesn't include, notes.md). Reasoning on the paid
#   plans is inferred: its models include one marked "TEXT · REASONING" (Kimi K3), and no page says which plan has it.
# - Early access on Max: the table's "Early access to new models" row ticks Max only.
# - None of its pages offers projects, a coding agent, a browser agent, scheduled tasks, code completion in an editor or
#   office apps. Its "Agentic chat" ("Give Venice a goal. It can search, reason, and create across multiple steps.",
#   download page) names no computer use.
# General features, read 2026-11-17: the web (installable "as a PWA") and its apps ("Venice is available on Android and
# iOS.", FAQs; "Available for iPhone, iPad, and Android.", download page). Sign-in: an email address and password (its
# sign-up page), "two-factor authentication (2FA)" (FAQs), a third-party account ("If you sign up for the Service using a
# third-party account (such as Apple, Google, or Discord)", its privacy policy) or a crypto wallet (no registry value).
# App languages: "The Venice interface is also available in multiple languages." (FAQs) names none, so none. Support:
# "What is the official support email?" (support@venice.ai, its terms). No pause and no parental controls: its terms and
# FAQs offer neither (minors need "a parent or guardian’s consent", and Pro can turn the Mature Filter off).
features:
  platforms: [android, ios, web]
  account.sign-in: [password, totp, sso]
  support.channels: [email]

