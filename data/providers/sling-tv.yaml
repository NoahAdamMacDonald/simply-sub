# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 in Edge: its Terms of Use (Sling TV L.L.C.'s, under Colorado
# law), its Privacy Notice ("Effective Date: January 1, 2026") and its privacy portal (Your privacy choices), its sign-up
# start (sling.com/get-started: "Enter your email", typing nothing), and its help centre's pause and cancel, billing,
# account changes, Freestream, streams and 4K articles. Not read: its EULA (the terms incorporate it; no link to it was
# found on the pages read), the arbitration opt-out form's own page, the privacy portal's request forms, EchoStar's proxy
# statement, and the sign-up steps after the email. It isn't covered by a shared document in data/policies/. Calibrated
# against YouTube TV and Fubo.
policies:
  links:
    - name: 'Terms of Use'
      url: https://www.sling.com/offer-details/disclaimers/terms-of-use
    - name: 'Privacy Notice'
      url: https://www.sling.com/offer-details/disclaimers/privacy-notice
    - name: 'Sign up'
      url: https://www.sling.com/get-started
    - name: 'Pause or cancel your subscription'
      url: https://www.sling.com/help/en/account-questions/account-changes/pause-cancel-subscription
    - name: 'Billing & payments'
      url: https://www.sling.com/help/en/account-questions/billing-payments
    - name: 'Edit your subscription'
      url: https://www.sling.com/help/en/account-questions/account-changes
    - name: 'Compare plans'
      url: https://www.sling.com/service/compare-plans
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what everyone in your home watches, and may record your typing and clicks on its sites. You can turn off only some of its tracking, tool by tool.'
      sources:
        - url: https://www.sling.com/offer-details/disclaimers/privacy-notice
          quote: 'When you or someone in your household watches a video program through our Services, we may collect a record of your viewing activity.'
        - url: https://www.sling.com/offer-details/disclaimers/privacy-notice
          quote: 'We also may use session replay software, which collects information about your interaction with the Services, including keystrokes, mouse movements, and form field entries'
        - url: https://www.sling.com/offer-details/disclaimers/privacy-notice
          quote: 'Google provides an opt-out of Google Analytics by downloading and installing the browser add-on located here tools.google.com/dlpage/gaoptout/.'
      action:
        name: 'Your privacy choices'
        url: https://www.sling.com/offer-details/disclaimers/your-privacy-choices
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: bad
      reason: 'It sells or shares your information with ad networks, social networks and data brokers, and may give your name and address to mailing lists. Only residents of some US states can say no.'
      sources:
        - url: https://www.sling.com/offer-details/disclaimers/privacy-notice
          quote: 'We sell or share these categories of personal information to data analytics providers, advertising partners and/or networks, social media networks, and data brokers.'
        - url: https://www.sling.com/offer-details/disclaimers/privacy-notice
          quote: 'We may disclose your name and postal address to other parties, such as charities, marketing organizations, corporate affiliates, or other businesses for “mailing list” purposes.'
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It picks the ads you see from what you watch and buy. Opting out works device by device, and you still get ads.'
      sources:
