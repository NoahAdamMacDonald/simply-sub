# Researched by hand on 2026-11-13 (M11.15, streaming batch 8), read through a US exit for its plan pages
# (sling.com/service and each plan's page, which price by billing ZIP code), and with Edge from Canada for its help
# centre (sling.com/help), terms and privacy notice, which sling.com shows this machine too. Pages, each quoted where
# it's used:
# Pricing: its compare page (sling.com/service/compare-plans): Essentials "$19.99/mo", Select "from $19.99/mo",
# Essentials & Select "from $34.99/mo", Orange "from $45.99/mo", Blue "from $45.99/mo", Orange & Blue "from $60.99/mo",
# all monthly ("Sling is a monthly subscription"). The plan data the page loads (slingcommerce.com's packages, read as
# part of the page) gives each plan's price without local channels ("base_price":"19.99", "45.99", "60.99"…) and higher
# ones where its lineup adds local ABC, FOX or NBC by ZIP code: Select $24.99 or $29.99, Essentials & Select $39.99 or
# $44.99, Blue $49.99 or $54.99, Orange & Blue $64.99 or $69.99. The "from" prices are stored, with the others in each
# plan's notes. Its Day Passes (1, 3 and 7 days) are gone: "Though Sling Passes are no longer available" (its blog's
# passes article, updated 2026-10-13); sling.com/service/day-pass now opens the plans page.
# Also sold, not listed: its International and Sling Latino base packs (Hindi, Brasil, Arabic, Polish, Sling Latino and
# 30-odd more, each a language's channels), premium services sold through it (HBO Max, Paramount+ with SHOWTIME, STARZ,
# MGM+, AMC+, discovery+ and others, which sell another service, as YouTube TV's premium networks), NBA Team Passes,
# pay-per-view, the 4 Extras and Total TV deals (bundles of the Extras below), and promotions (prepaid months, a free
# first month of premiums).
# Where it's sold: "Currently, our content is only available for streaming within the United States and Puerto Rico."
# (Error Code 11-601).
# Region checklist, 2026-11-13: a US and Puerto Rico service, so no other region to read. Puerto Rico isn't priced: its
# plans page prices by ZIP code, read through a mainland exit.
# Bundles: none; Orange & Blue and Essentials & Select are its own plans ("two separate Sling TV services ... offered
# together for a multi-service discount", its terms). Official resellers: none; its gift cards are sold by retailers
# (Walmart, Best Buy, GameStop, Target) and by Sling. Partners that bill it: Amazon and Roku ("If you pay for the
# Services through your account with a third party (e.g., Amazon, Roku)", its terms); noted.
# Free use: Sling Freestream (sling-tv.freestream).

# Coverage: sling-tv.* in PR: it streams in Puerto Rico (Error Code 11-601), but no page read prices it there.

id: sling-tv
name: Sling TV
website: https://www.sling.com
category: streaming
spendCategory: streaming
availableIn: [US, PR]
billingCurrency: { US: USD, PR: USD }
cancelUrl: https://www.sling.com/help/en/account-questions/account-changes/pause-cancel-subscription
sources: { pricing: https://www.sling.com/service/compare-plans }

# Owner (M11.2), read 2026-11-13 on EchoStar's investor site (ir.echostar.com, its own: echostar.com lists Sling among
# "Our Brands"), whose ticker changed from SATS to ECHO on June 24, 2026 ("EchoStar Corporation is officially changing
# its Nasdaq stock ticker symbol from "SATS" to "ECHO" Effective June 24, 2026", its release of June 22, 2026). Sling TV
# L.L.C. runs the service (its terms). No page read names a majority holder (EchoStar's proxy statement wasn't read).
# Where it's from: its terms' notice address in Colorado.
owner:
  name: 'Sling TV L.L.C., owned by EchoStar Corporation'
  website: https://www.echostar.com
  page:
    name: EchoStar Investors
    url: https://ir.echostar.com/investors
  quotes:
    - 'EchoStar Corporation (Nasdaq: ECHO) is a premier provider of technology, networking services, television entertainment and connectivity, offering consumer, enterprise, operator and government solutions worldwide under its EchoStar®, Boost Mobile®, Boost Infinite, Sling TV, DISH TV, Hughes®, HughesNet®, HughesON™, and JUPITER™ brands.'
  country:
    code: US
    page:
      name: Terms of Use
      url: https://www.sling.com/offer-details/disclaimers/terms-of-use
    quotes:
      - 'Sling TV L.L.C., Attn: Office of the General Counsel, 9601 South Meridian Boulevard, Englewood, Colorado 80112'
    lastVerified: 2026-11-13
  stock:
    company: EchoStar Corporation
    listings:
      - { exchange: Nasdaq, symbol: ECHO }
  lastVerified: 2026-11-13

# Ways to pay (M11.5), read 2026-11-13 in its help centre: cards, PayPal, Apple Pay, Google Pay and Amazon Pay (other)
# (Billing & payments' "What payment methods can I use?"), gift cards (its gift card page), and billing by "other third
# party billing services" (its pause article) such as Amazon and Roku (its terms). Its pause article also names
# "BitPay", which no page offers as a way to pay, so it isn't listed. No page names card networks.
paymentMethods:
  - methods: [card, paypal, apple-pay, google-pay, other]
    page: Billing & payments
    url: https://www.sling.com/help/en/account-questions/billing-payments
    quotes:
      - 'Sling accepts debit and credit cards, or you can select Express Pay at checkout to use tools like PayPal, Apple Pay, Google Pay and Amazon Pay.'
  - methods: [gift-card]
    page: Sling TV gift cards
    url: https://www.sling.com/deals/gift-card
    quotes:
      - 'You can also purchase and customize a Sling TV gift card online here.'
  - methods: [app-store]
    page: Pause or cancel your subscription
    url: https://www.sling.com/help/en/account-questions/account-changes/pause-cancel-subscription
    quotes:
      - 'Subscriptions made through Apple Pay, Google Pay or other third party billing services'
# Renewal day (M11.5), read 2026-11-13 in its terms (5.C) and Billing & payments ("Monthly subscriptions are charged on
# the same calendar day every month until you cancel."): the day you first paid, or a shorter month's last days.
renewalAnchor:
  kind: same-date
  page: Terms of Use
  url: https://www.sling.com/offer-details/disclaimers/terms-of-use
  quotes:
    - 'For Subscription Services, we automatically bill you each month on the calendar day corresponding to the date on which you first commenced payment for Subscription Services.'
    - 'If your paid membership to any Subscription Service began on a day not contained in a given month, then we may bill you on a day in the applicable month or such other day as we deem appropriate'
  lastVerified: 2026-11-13

