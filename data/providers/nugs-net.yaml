# Researched by hand on 2026-11-13 (M11.15, the music category, batch 8), read with a plain fetch and Edge from Canada,
# its home page again through a US, UK, German and Australian exit, and its help centre (help.nugs.net, every article
# its folders list and those its search finds) with a plain fetch. Pages, each quoted where it's used:
# Pricing: its home page's plans ("nugs $14.99/month or $149.99/year after your 7-day free trial." and "nugs Hi-Res
# $24.99/month or $249.99/year after your 7-day free trial"), whose plan data names the currency
# ("currencyCode":"USD", "price":14.99, 149.99, 24.99 and 249.99) and the site one locale ("locale":"default"); its
# help centre's "What is nugs and how much does it cost?" gives the same prices. The page shows the same "$14.99/month"
# and "$24.99/month" read from Canada and through the US, UK, German and Australian exits: one price list in US dollars
# for everyone, so GLOBAL. "Advertised prices for nugs.net products do not include applicable taxes." (Do listed prices
# include taxes?), so no taxIncluded. Every plan starts with "a 7-day free trial for new subscribers", a trial.
# Region checklist, 2026-11-13: 1. no country or locale paths; 2. no picker; 3. its plan data (USD, locale default); 4.
# checkout not opened (get.nugs.net asks you to create an account first); 5. its tax articles; 6. a plain fetch and Edge
# from Canada, Edge through four exits; 7. no bill offered. Where it's sold: "The vast majority of our streaming
# catalog is available globally." and some Sony archive shows "are geo-blocked to the United States" (Why am I having a
# problem streaming Videos with my subscription?); its terms say only "The Service may be accessed from countries
# around the world", so no availableIn.
# Not listed: Pay-Per-View livestreams ("Pay-per-views are not included with a subscription", bought one at a time),
# downloads and CDs (one-time purchases), and SiriusXM Platinum's "nugs Platinum subscription", SiriusXM's own plan with
# "streaming audio of soundboard masters from 5,000 live shows" (What is a SXM Platinum nugs subscription?): a partner's
# plan, noted, not listed. Play Dead, "the first official Grateful Dead streaming app", is sold alone ("Standalone Play
# Dead subscriptions are $9.99/month or $99.99/year.") and as an add-on to nugs plans (below); the standalone app isn't
# listed (notes.md).
# Bundles: the nugs x Play Dead bundle is nugs with the Play Dead add-on ("Play Dead is also available as an add-on to
# nugs subscriptions for an extra $4.99/month or $49.99/year."), so an add-on, not a bundle file. Official resellers:
# none; "it is not possible to "gift" streaming subscriptions directly at this time" (Can I gift a subscription?).
# Features, read 2026-11-13: "nugs subscriptions are $14.99/month or $149.99/year for MP3 quality audio streaming and HD
# video." and Hi-Res "with 4K video (when available), lossless 16-bit 44.1 kHz streaming audio , MQA & 360 Reality Audio
# on select shows" (What is nugs and how much does it cost?); "Audio is optimized for mobile streaming and encoded as
# HE-AAC 160kbps VBR stereo." and "Hi-Res subscriptions stream CD-quality 16-bit 44.1 kHz with MQA audio on compatible
# devices" (What is the quality of the streaming files?), so standard and lossless (no sample rate above 48 kHz is named
# for streaming; MQA's isn't given). 360 Reality Audio is Sony's spatial audio, not Dolby Atmos ("in the vein of the
# cinema-focused Dolby Atmos", What is 360 Reality audio?): a perk. "You can access streaming content on any single
# device at a time." (How many devices can I stream on?). "Quick sign-up. Ad-free. Cancel anytime." (its plan cards).
# "Listen to full shows on demand" and "save shows for offline playback" for subscribers; "Non-subscribers can listen to
# nugs.net radio for free, and stream cherry-picked full length concerts on demand. Featured shows rotate weekly." (What
# is the nugs.net app?). Live: "exclusive livestreams" for subscribers and "Free Live Audio Streams" for anyone with an
# account (How do I access Free Live Audio Streams?), and nugs.net radio, "a free 24/7 stream" (What's included with
# the free nugs app vs. a subscription?). What it streams: concerts ("concert livestreams, on-demand concert video, and
# high-quality streaming audio"), which no streaming.content value names (notes.md), so []. No page names lyrics or
# your own files.
# Free use: a free account (How do I create a free account?): nugs.net radio, weekly featured shows and Free Live Audio
# Streams.

