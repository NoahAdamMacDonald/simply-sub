# Terms and policies (M11.15), read 2026-11-13 with a plain fetch: its Terms of Use Agreement and Privacy Policy (both of
# June 12, 2026), its Cookie Policy (last updated August 5, 2025), its sign-up page (id.nugs.net, read in Edge: "By
# creating an account, I confirm that I have read, understood, and agree to the Terms of Service and Privacy Policy";
# nothing typed), and its help centre's articles on cancelling, refunds, deleting your account, devices, gifts and
# free trials. Its returns page holds shipping and CD returns only. Not read: its checkout (it needs an account),
# Stripe's privacy policy and terms (which its terms make you accept for payments), and Apple's, Google's and Roku's
# terms for in-app purchases. No security page or security.txt (both answer "page not found"). Calibrated against
# Mixcloud's, Audiomack's, Qobuz's and Last.fm's grades. Not rated: its apps' licence and changes to your device (not
# topics for music or streaming).
policies:
  links:
    - name: Terms of Use Agreement
      url: https://www.nugs.net/terms.html
    - name: Privacy Policy
      url: https://www.nugs.net/privacy-policy.html
    - name: Cookie Policy
      url: https://www.nugs.net/privacy-cookie.html
    - name: How do I cancel or manage my nugs subscription?
      url: https://help.nugs.net/support/solutions/articles/6000261447
    - name: How do I delete my account?
      url: https://help.nugs.net/support/solutions/articles/6000245388
    - name: How do I create a free account?
      url: https://help.nugs.net/support/solutions/articles/6000267002
    - name: Can I gift a subscription?
      url: https://help.nugs.net/support/solutions/articles/6000254126
    - name: How many devices can I stream on?
      url: https://help.nugs.net/support/solutions/articles/6000274824
    - name: How do I save audio for offline playback?
      url: https://help.nugs.net/support/solutions/articles/6000255107
    - name: Do listed prices include taxes?
      url: https://help.nugs.net/support/solutions/articles/6000263901
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It studies how you use nugs with Google Analytics and Amplitude, to improve the service and the rest of its business. You can only limit that in your browser’s cookie settings, or with Do Not Track.'
      sources:
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'We may use your personal information to analyze your usage of the Service, improve the Service, improve the rest of our business'
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'For example, we may use analytics solutions from Google Analytics and Amplitude for this purpose.'
        - url: https://www.nugs.net/privacy-cookie.html
          quote: 'Most web browsers allow you to manage cookies through the browser settings.'
      action:
        name: Its Cookie Policy (your choices)
        url: https://www.nugs.net/privacy-cookie.html
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: bad
      reason: 'It shares your details with ad companies to show you ads on other sites, and with partners whose products may interest you. Some US states’ laws call that selling; only their residents can ask it to stop.'
      sources:
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'We may also share information about our users with these companies to facilitate interest-based advertising to those or similar users on other online platforms.'
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'Third parties with whom we partner, including parties with whom we co-sponsor events or promotions, with whom we jointly offer products or services, or whose products or services may be of interest to you.'
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'The State Privacy Laws may classify certain of our activities as “selling” or “sharing” your Personal Information.'
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its plans have no ads, but it tracks what you do, with Google, Meta, LinkedIn and Microsoft, to show you ads on other sites. You can limit that only in your browser, your phone’s settings or ad industry tools.'
      sources:
        - url: https://www.nugs.net/privacy-cookie.html
          quote: 'Advertising Cookies may collect personal data over time and across different websites.'
        - url: https://www.nugs.net/privacy-cookie.html
          quote: 'Meta - We may use Meta’s services to place ads that we think may interest our users and potential users across Meta’s various websites, such as Facebook and Instagram.'
        - url: https://www.nugs.net/privacy-cookie.html
          quote: 'You can also access any settings offered by your mobile operating system to limit ad tracking.'
      action:
        name: Its Cookie Policy (your choices)
        url: https://www.nugs.net/privacy-cookie.html
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy says it doesn’t use personal data to train large language models only in a note for Connecticut residents, and says nothing on AI for everyone else.'
      pages: [https://www.nugs.net/privacy-policy.html, https://www.nugs.net/terms.html]
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your data while you have an account, and afterwards for as long as it may need it, with no time limits.'
      sources:
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'For example, we will retain your personal information for as long as you have an account with us or keep using our services, and the length of time thereafter during which we may have a legitimate need to reference your personal information to address issues that may arise.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can delete your account yourself in its app (Settings, Account, Delete Account), and it can’t be brought back.'
      sources:
        - url: https://help.nugs.net/support/solutions/articles/6000245388
          quote: 'Once your account has been deleted it can no longer be restored - and all of the items in your Library will no longer be available to stream.'
        - url: https://help.nugs.net/support/solutions/articles/6000245388
          quote: '-Follow the prompts to complete your account deletion.'
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      status: not-stated
      reason: 'It offers a copy of your data only to residents of some US states and people in the UK and Europe, as their laws require.'
      pages: [https://www.nugs.net/privacy-policy.html]
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      regions: [GB, EU]
      tier: neutral
      reason: 'In the UK and Europe you can ask it by email for a machine-readable copy of your data.'
      sources:
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'Transfer a machine-readable copy of your personal information to you or a third party of your choice.'
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'You may submit these requests by email to privacy@nugs.net or our postal address provided above.'
      action:
        name: Its Privacy Policy (your rights in Europe)
        url: https://www.nugs.net/privacy-policy.html
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: poor
      reason: 'It may hand over what it holds about you to the police or a government that asks, not only under a court order, whenever it decides that’s necessary or appropriate.'
      sources:
        - url: https://www.nugs.net/terms.html
          quote: "disclose any information or materials on or in the Service, including Your Content, in Company's possession in connection with your use of the Service, to (i) comply with applicable laws, legal process or governmental request"
        - url: https://www.nugs.net/terms.html
          quote: 'as Company in its sole discretion believes to be necessary or appropriate.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: poor
      reason: 'It’s based in the US and may move your data to the US or other countries with weaker privacy laws, without saying how it’s protected, except for people in Europe.'
      sources:
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'Your personal information may be transferred to the United States or other locations where privacy laws may not be as protective as those in your state, province, or country.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      regions: [GB, EU]
      tier: neutral
      reason: 'For people in the UK and Europe, data sent to the US is covered by approved standard contracts or other recognised safeguards.'
      sources:
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'we may use specific appropriate safeguards, which are designed to give personal information effectively the same protection it has in Europe – for example, standard-form contracts approved by relevant authorise for this purpose'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'An account needs your first and last name, an email and a password, or a Google, Facebook or Apple account. A subscription needs a card.'
      sources:
        - url: https://help.nugs.net/support/solutions/articles/6000267002
          quote: 'Enter your first and last name, a valid email address and select your password - or you can login using Facebook or Google.'
        - url: https://help.nugs.net/support/solutions/articles/6000254126
          quote: 'A valid credit card is needed to start a new subscription.'
      lastVerified: 2026-11-13
    - topic: privacy.children
      tier: neutral
      reason: 'It isn’t meant for anyone under 18, and it deletes a child’s data when the law requires it.'
      sources:
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'The Service is not intended for use by anyone under 18 years of age.'
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'we will comply with applicable legal requirements to delete the information.'
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: poor
      reason: 'It says only that it uses safeguards, and names no outside check or way to report a security flaw.'
      sources:
        - url: https://www.nugs.net/privacy-policy.html
          quote: 'We employ technical, organizational and physical safeguards designed to protect the personal information we collect.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel on its website under My Account, Manage Plan, at any time, and keep your plan until the period ends. If you subscribed through Apple or Google, you cancel there.'
      sources:
        - url: https://help.nugs.net/support/solutions/articles/6000261447
          quote: 'Direct nugs subscribers can cancel on the Account page on nugs.net (login, then click Account>My Account in the top right corner of the page).'
        - url: https://www.nugs.net/terms.html
          quote: 'If you cancel your Subscription, you may use your Subscription until the end of your then-current Subscription term; your Subscription will not be renewed after your then-current term expires.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'No money back for the rest of a period when you cancel, but you keep your plan until it ends.'
      sources:
        - url: https://www.nugs.net/terms.html
          quote: 'However, you will not be eligible for a prorated refund of any portion of the Service Subscription Fee paid for the then-current Subscription period.'
        - url: https://www.nugs.net/terms.html
          quote: 'you may use your Subscription until the end of your then-current Subscription term'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tries to email you before a price change hits your plan, without saying how long before, and you can cancel instead.'
      sources:
        - url: https://www.nugs.net/terms.html
          quote: 'If changes to the Subscription price occur that impact your Subscription, Company will use commercially reasonable efforts to notify you, such as by sending an email to the email address associated with your Account.'
        - url: https://www.nugs.net/terms.html
          quote: 'If you do not agree with such changes, you may cancel your Subscription'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: poor
      reason: 'The 7-day free trial needs a card and turns into a paid plan unless you cancel first, with no reminder promised. It refunds a charge you report as a mistake in writing.'
      sources:
        - url: https://www.nugs.net/terms.html
          quote: 'At the end of the trial or promotional period, your use of that Service will automatically roll into a paid Subscription at our then-current Service Subscription Fees'
        - url: https://help.nugs.net/support/solutions/articles/6000254126
