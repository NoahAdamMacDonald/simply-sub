# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-20: Doctor Web's end-user licence
# agreement (its apps' licence, which includes its privacy policy), its Privacy Policy, and the store's Terms of Sale,
# automatic-renewal help and payment help (Noventiq Cyprus's, which sells for it: "By placing my order, I agree to the
# Terms of Sale and consent to have my personal data processed by Doctor Web."). The store's own Privacy Notice and Cookie
# Policy (Noventiq's) cover the order only and weren't graded beyond these. Security: its "Safe development and
# deployment practices" paper (2026) and its statement on the September 2024 attack. No bug bounty or vulnerability
# disclosure page was found.
policies:
  links:
    - name: End-user license agreement
      url: 'https://license.drweb.com/agreement/?lng=en'
    - name: Privacy Policy
      url: 'https://company.drweb.com/policy/?lng=en'
    - name: Terms of Sale (store)
      url: https://store.drweb.com/help/rules
    - name: Automatic renewal (store)
      url: https://store.drweb.com/help/autorenewal
    - name: Order payment (store)
      url: https://store.drweb.com/help/payment
    - name: Order form (store)
      url: 'https://store.drweb.com/basket/add/4847819?clear=Y'
    - name: Online store
      url: 'https://estore.drweb.com/home/?lng=en'
    - name: Dr.Web Security Space
      url: 'https://products.drweb.com/win/security_space/?lng=en'
    - name: Safe development and deployment practices
      url: 'https://f2.drweb.com/get+meta+file/?sdf=t&sdl=en&k=fc8c1b2165a875e76f6275c41a54c913&inline=t'
    - name: Statement on the 2024 attack
      url: 'https://news.drweb.com/show/?i=14921&lng=en'
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It uses what its apps and sites collect about your device and what you do to improve its products and for research. Its cloud checks are optional; nothing turns off the rest short of withdrawing consent by letter, which ends your licence.'
