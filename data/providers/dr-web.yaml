# Researched by hand on 2026-11-20 (the full catalog run, security batch 2), read from Canada with Edge (its online
# stores, whose prices load in the browser) and a plain fetch (its licence, privacy policy, store help and product
# pages); one store page through a Canadian exit. Pages, each quoted where it's used:
# Pricing: its international online store (estore.drweb.com, run for it by Noventiq Cyprus: "Orders are processed by
# Doctor Web's partner - Noventiq Ecommerce") prices each product by licence period (1, 2 or 3 years) and number of
# devices (1 to 5) in US dollars, "(excl.VAT*)" ("*VAT will be calculated and indicated after proceeding to purchase and
# selecting the country"); its French and Italian stores (estore.drweb.fr, estore.drweb-av.it, its own country sites,
# "© Doctor Web 2003 — 2026") price France and Italy in euros with tax in ("Prix pour la France, TTC", "prezzo per
# l'Italia, IVA inclusa"). Its German store now opens the international site, and its Spanish one didn't answer.
# A licence is bought for its term and doesn't renew unless you tick automatic renewal at checkout ("check the box
# ..."): prices are stored as prepaid terms (`autoRenew: false`), each period it sells. A renewal licence costs less
# ("You can renew it at 25% off"); the new licence's price is the regular one (the renewal is a loyalty discount for
# existing keys, in the notes). Its week's offers ("Offer of the week", –20%) and its 2-month starter licence ($6, then
# $31 a year) are offers, left out. France's PC page writes its "TTC" in Cyrillic letters, which the tax check can't
# read, so France's PC prices have no taxIncluded (its mobile page's "TTC" is in Latin letters).
# Plans: Dr.Web Security Space for PCs (Windows, macOS, Linux) and for mobile devices (Android and Android TV), each for
# 1 device and for 5 (a plan per device count, Norton's precedent; 2 to 4 are in the notes). Free: Dr.Web CureIt!.
# Not drafted: Dr.Web Katana (a second-layer, signature-free protection for PCs that run another antivirus: its US-dollar
# prices didn't load, "$—", in any read; France €7.12 and Italy €7.23 a year for 1 PC), CureIt! Pro (5 or 10 days of a
# scanner, sold once), its Telegram bot, and Dr.Web for Android Light (named on the components page; no page says it's
# free or sold).
# Where it sells: its licence's territory is "the entire world unless indicated otherwise when the License was acquired"
# and its store's terms say "some Products might not be available for all countries. You will be informed of any such
# territorial restrictions before you can purchase the Product." Its partner finder lists partners in Canada, the United
# States, the United Kingdom, the Netherlands, New Zealand, France, Germany, Italy and Spain among others. No page of its
# sites mentions sanctions; its only such notice is "Doctor Web's announcement for customers and partners" of March 22,
# 2022 ("Given the situation, we would like to inform our customers and partners that our services currently remain
# operational."). Its checkout's country list answered 403 after one read, so whether every country can buy there is
# unread: one GLOBAL price in US dollars, with France's and Italy's own.
# Region checklist for CA and US, 2026-11-20: 1. no country paths on drweb.com (en, fr, es, it... are languages; the
# country stores are drweb.fr, drweb-av.it and others outside the catalog); 2. its language menu; 3. the store's script
# prices in "$" for everyone; 4. the basket, up to the order form (country, name, email, phone, payment); 5. the store's
# payment and terms pages; 6. Edge, a plain fetch and a Canadian exit; 7. no bill.
# Bundles: its "More for less!" PC-and-phone offer is an offer, not read. Official resellers: its partner finder names
# partners by country ("Sells licenses", "Sells subscriptions"), a reseller list for data/resellers.yaml left to the owner
# (the shops weren't read). Google Play and AppGallery bill its Android app.
# Lab results: Dr.Web isn't in AV-TEST's 2026 tests of Windows, macOS or Android products, so no rating is listed.

id: dr-web
name: Dr.Web
aliases: [Doctor Web, Dr.Web Security Space, Dr.Web CureIt!]
website: https://www.drweb.com
# Its French and Italian sites (each one's own store and prices).
domains: [drweb.fr, drweb-av.it]
category: security
spendCategory: software
billingCurrency: { FR: EUR, IT: EUR, GLOBAL: USD }
# Its store's help on automatic renewal, which says how to turn it off (a licence that doesn't renew needs nothing).
cancelUrl: https://store.drweb.com/help/autorenewal
sources: { pricing: 'https://estore.drweb.com/home/?lng=en' }
# Owner (M11.2), read 2026-11-20: its licence names the company that owns the software (rule 3), a private company in
# Russia; its privacy policy gives the address. Its about page has no sentence on who owns it.
owner:
  name: Doctor Web
  page:
    name: Dr.Web software product end-user license agreement
    url: 'https://license.drweb.com/agreement/?lng=en'
  quotes:
    - 'Copyright Holder: the limited liability company Doctor Web, incorporated and operating under the laws of the Russian Federation. Doctor Web is the owner of the exclusive rights to the Software product.'
  country:
    code: RU
    page:
      name: Doctor Web Privacy Policy
      url: 'https://company.drweb.com/policy/?lng=en'
    quotes:
      - '3rd street Yamskogo polya, Moscow, Russia, 125124'
    lastVerified: 2026-11-20
  lastVerified: 2026-11-20
# Ways to pay (M11.5), read 2026-11-20: its store's payment help (Noventiq's). The order form read (the 2-month starter
# subscription, before a country was chosen) showed only "VISA, MASTERCARD" and "Wire transfer"; the help names PayPal
# too, for no product or country in particular, so it's kept.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard]
    url: https://store.drweb.com/help/payment
    quotes: ['VISA, MASTERCARD']
paymentMethods:
  - methods: [card, paypal, bank-transfer]
    page: Order Payment
    url: https://store.drweb.com/help/payment
    quotes:
      - 'VISA, MASTERCARD'
      - 'PayPal'
      - 'Wire transfer'
# No renewalAnchor: its licences are prepaid terms that renew only if you tick automatic renewal at checkout, which then
# charges "20, 10 and 0 days before the expiration of the current license" (its renewal help), wording core's
# chargedBefore doesn't read.

# General features, read 2026-11-20. Its account (doctor web's site) signs in with an email and a password, and My Dr.Web
# with a serial number and email; no page offers two-step sign-in. Support (every page's header): "24/7 Tech support",
# "Send a message" and "A query form", "Call us +7 (495) 789-45-86" (a Moscow number), "Forum", and a "Self-support bot"
# on Telegram (no channel value). App languages: not read (left out). No pause.
features:
  platforms: [windows]
  account.sign-in: [password]
  support.channels: [email, phone, community, 24-7]

# Perks (M11.6): its components page's protections no feature describes, in its words.
perks:
  - id: exploit-prevention
    name: Exploit Prevention
  - id: data-loss-prevention
    name: Data Loss Prevention
  - id: device-access-control
    name: Removable device access control
  - id: app-lock
    name: Restrict access to apps

# Features, read 2026-11-20:
# - Security Space for PCs (its components page, by system, and its product page): "Anti-virus" ("Blocks viruses and
#   malware from accessing the protected system and will cure the malicious programs that have already penetrated it"),
#   SpIDer Guard and "HTTP monitor SpIDer Gate" ("Scans web pages in real time and blocks access to dangerous sites, such
#   as those used for phishing attacks"), Anti-spam, Parental control ("Blocks access to websites by URL keywords"),
#   Firewall, "Preventive Protection" ("Dr.Web can recognise suspicious programs that have similar behaviour patterns and
#   block their operation", its company page), "Ransomware Protection" ("Trojan-encoder protection based on behavioural
#   rules"), "Privacy" ("Blocks a device’s camera and microphone"), Exploit Prevention, Data Loss Prevention and removable
#   device access control. The components table ticks them by system (Windows, macOS, Linux): Privacy on Windows and
#   macOS ("+ + -"); Preventive Protection, Ransomware Protection, Exploit Prevention, Data Loss Prevention and removable
#   device control on Windows only; the firewall on Windows and macOS; anti-spam and parental control on Windows and
#   Linux. The values stay, since the plan has them on Windows, and the notes say where (Emsisoft's precedent). The kinds
#   of scan aren't on the pages read (its documentation, which wasn't read, would say): left out.
#   "Protection for 1 computer" up to 5 on one licence.
# - Security Space for mobile devices (its Android page): real-time protection of the file system, scans "upon user
#   request", call and SMS filtering ("SMS message filtering is not available in app versions installed from Google
#   Play"), locate and lock a lost device, "Blocks access to selected sites and site categories", the Security Auditor
#   ("Identifies and helps fix security issues and vulnerabilities"), a firewall, app access restriction, and unlocking a
#   device locked by ransomware (no ransomware value describes unlocking: notes). Android 5.0 to 16.0 and Android TV.
# - CureIt! (its free page): "will cure an infected system once, but it is not designed to provide a workstation with
#   real-time protection from viruses"; free for home use, downloaded again for each scan's newest virus databases.
# No VPN, password manager or identity protection on any Dr.Web page.
