      pages:
        [https://www.tunnelbear.com/terms-of-service, https://www.tunnelbear.com/autorenew-policy]
      lastVerified: 2026-11-19
    - topic: legal.disputes
      status: not-stated
      reason: "Its terms don't name a court or a private referee for disputes."
      pages: [https://www.tunnelbear.com/terms-of-service]
      lastVerified: 2026-11-19
    - topic: legal.terms-changes
      tier: poor
      reason: 'It can change its terms at any time. For a big change it only posts a notice on its website, and using it afterwards counts as saying yes.'
      sources:
        - url: https://www.tunnelbear.com/terms-of-service
          quote: 'If the alterations constitute a material change, TunnelBear will notify you by posting an announcement on the TunnelBear website.'
        - url: https://www.tunnelbear.com/terms-of-service
          quote: 'Using our Services following notification of a material change to this Agreement shall constitute your acceptance of the Agreement as modified.'
      lastVerified: 2026-11-19
    - topic: legal.account-closure
      tier: bad
      reason: 'It can stop or suspend your account at any time, for any reason or none, with or without warning, and its terms promise no refund.'
      sources:
        - url: https://www.tunnelbear.com/terms-of-service
          quote: 'You agree that TunnelBear, for any or no reason, and without penalty, may discontinue in whole or in part, cancel or suspend your use of the Service at any time, with or without notice.'
      lastVerified: 2026-11-19
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change the service, add usage limits or block some uses whenever it decides. It took country choice and split tunnelling away from free accounts in December 2025.'
      sources:
        - url: https://www.tunnelbear.com/terms-of-service
          quote: 'TunnelBear may change the Services, impose usage or service limits, suspend service, or block certain kinds of usage at our sole discretion.'
      lastVerified: 2026-11-19
    - topic: legal.inactivity
      status: not-stated
      reason: "Its terms and privacy policy don't say it closes accounts that go unused."
      pages:
        [https://www.tunnelbear.com/terms-of-service, https://www.tunnelbear.com/privacy-policy]
      lastVerified: 2026-11-19
    - topic: legal.licence
      tier: neutral
      reason: 'You may use it only for yourself and your own personal purposes, and must not give your account to anyone else.'
      sources:
        - url: https://www.tunnelbear.com/terms-of-service
          quote: 'TunnelBear grants you a non-exclusive, non-transferable right to use the service, solely for your own personal purposes.'
        - url: https://www.tunnelbear.com/terms-of-service
          quote: 'You promise not to give your TunnelBear account to someone else.'
      lastVerified: 2026-11-19
    - topic: security.practices
      tier: neutral
      reason: 'An outside security firm has checked its apps and servers every year since 2016 and it published the reports. Its pages give no way to report a security bug.'
      sources:
        - url: https://www.tunnelbear.com/blog/tunnelbear-completes-8th-annual-independent-security-audit/
          quote: 'Every year since, we’ve backed that promise with a full, independent security audit - covering our apps, infrastructure, and services from maw to paw.'
        - url: https://www.tunnelbear.com/blog/tunnelbear-completes-8th-annual-independent-security-audit/
          quote: 'As always, Cure53 performed a white-box assessment - meaning they had full access to our source code, configurations, and internal documentation.'
      lastVerified: 2026-11-19
    - topic: service.activity-logging
      tier: neutral
      reason: 'It keeps no IP addresses, sites or DNS lookups, but counts your data each month and keeps the country and city you connect from. No audit has tested this.'
      sources:
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'IP addresses upon service connection'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'Mapping performance events to originating countries, analyzing regional censorship tactics, preventing abuse during sign-up and authentication'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'We decided that collecting the overall amount of data used by a specific user, for the current month, was the correct balance.'
      lastVerified: 2026-11-19
    - topic: service.device-limits
      tier: great
      reason: 'There’s no limit on the number of devices, and you can be connected on all of them at once.'
      sources:
        - url: https://help.tunnelbear.com/hc/en-us/articles/360007082411-How-many-connections-can-I-make
          quote: 'This means that you can be actively connected to TunnelBear on an unlimited number of devices at any given time.'
      lastVerified: 2026-11-19
    - topic: service.software-control
      status: not-stated
      reason: "Its terms and help articles don't say whether its apps update themselves or change your settings."
      pages:
        [https://www.tunnelbear.com/terms-of-service, https://www.tunnelbear.com/privacy-policy]
      lastVerified: 2026-11-19
