          quote: 'In the event TunnelBear is served with a valid subpoena, warrant or other legal document and applicable law requires TunnelBear to comply, the extent of disclosure is limited to the Personal Data listed within this Privacy Notice.'
        - url: https://www.tunnelbear.com/privacy-policy
