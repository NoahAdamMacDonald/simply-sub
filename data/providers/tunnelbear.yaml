# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), read with Edge from Canada and with a plain fetch
# (curl) of the same site, which tunnelbear.com and its help centre (help.tunnelbear.com, Zendesk: all 125 English
# articles through its API) serve whole: its pricing page, checkout (tunnelbear.com/account/checkout, opened to the
# payment form and typing nothing, each period's view), auto-renew policy, terms of service, privacy policy, features,
# about, Teams, download, gift and notices pages, its blog's audit posts and its December 2025 post on the free plan, and
# Cure53's 2023 report (a PDF its blog links); the pricing page and checkout again through US, UK, Irish, Australian, New
# Zealand, German, French, Dutch, Spanish, Italian and Canadian exits, which showed the same prices.
# Pricing: one US-dollar price list for everyone ("All pricing shown in USD", the pricing page; "If you purchase a
# subscription via our website, you will be charged in US dollars.", What currency will I be charged in?), so GLOBAL USD.
# The checkout's views: "$10.99 billed every month", "$69.99 billed every 12 months" and "$120.00 billed once" (3
# Years). The monthly and yearly views renew at the same price ("automatically renews monthly unless canceled", "for
# each renewal term at $ 10.99 USD"; "for each renewal term at $ 69.99 USD"); the 3-year view has no renewal line, and its help centre says "If you purchased a two-year or
# three-year plan, you do not have to cancel a subscription. These are non-recurring plans and will not automatically
# renew." (How do I cancel my subscription?), so it's stored as a prepaid term (autoRenew: false). No two-year plan is
# sold now. No page says the prices include tax, and no checkout view shows a tax line.
# Region checklist for CA and US, 2026-11-19: 1. no country paths or hreflang links (one English site); 2. no country or
# currency picker (the checkout's Country menu is the card's billing address); 3. the page names "USD" ("All pricing
# shown in USD", "$ 69.99 USD"); 4. the checkout, up to the card form, the same in every country read; 5. its help
# centre's currency article (US dollars for everyone buying on the website); 6. Edge from Canada and through each
# country's exit, and a plain fetch; 7. no bill offered.
# Plans: Free (2 GB a month) and Unlimited (monthly, yearly, 3 years). Teams ("For businesses securing 2+ users",
# "$5.75/user per month") is a business plan, out of scope. Gift of the Bear ("One year of unlimited TunnelBear:
# $69.99", gift page; "Gifted subscriptions do not renew") is the yearly plan bought for someone else: notes only.
# TunnelBear Blocker (its footer's "Blocker") is a separate browser ad blocker, not a VPN plan: not listed.
# Bundles: none (its pages sell no bundle; McAfee, its owner, sells its own VPN, not TunnelBear). Official resellers:
# none named (its affiliate programme pays referrers, and its refund article mentions "other third-party resellers"
# without naming one). App stores bill its plans (partners, not listed). Free use: the Free plan.

id: tunnelbear
name: TunnelBear
aliases: [tunnel bear, tunnelbear vpn]
website: https://www.tunnelbear.com
category: vpn
spendCategory: software
# Accepted cards: its pages name no network in words. The pricing page's card logos (Mastercard, Visa, American Express
# and a jar of honey) name Visa, Mastercard and American Express only in the image's alt text, which isn't the page's
# visible text, so no acceptedNetworks (notes.md).
billingCurrency: { GLOBAL: USD }
# Its help article on cancelling, for subscriptions bought on its website and through the app stores.
cancelUrl: https://help.tunnelbear.com/hc/en-us/articles/360007372431-How-do-I-cancel-my-subscription
sources: { pricing: https://www.tunnelbear.com/pricing }
# Ways to pay (M11.5), read 2026-11-19: a credit card on its website, or Apple's and Google's app stores (What payment
# platforms do you offer?). PayPal ended: "While at one time we provided PayPal as a payment option for our customers,
# we no longer do." (Do you accept PayPal?). The checkout shows only a card form.
paymentMethods:
  - methods: [card]
    page: 'What payment platforms do you offer?'
    url: https://help.tunnelbear.com/hc/en-us/articles/360059783972-What-payment-platforms-do-you-offer
    quotes:
      - "If you'd like to pay with a credit card, you can purchase a subscription on our website"
  - methods: [app-store]
    page: 'What payment platforms do you offer?'
    url: https://help.tunnelbear.com/hc/en-us/articles/360059783972-What-payment-platforms-do-you-offer
    quotes:
      - 'you can purchase a TunnelBear subscription through the iOS App Store'
      - 'you can purchase a subscription through the Google Play Store'
# Renewal day (M11.5), read 2026-11-19: its terms and auto-renew policy charge "On your billing date" ("On your billing
# date, we'll use the payment method attached to your account to charge you the full price of your subscription"), and
# its help centre has no billing-date article, so the day isn't stated (notes.md has the block if core learns "billing
# date").
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.tunnelbear.com/autorenew-policy
    - https://www.tunnelbear.com/terms-of-service
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19: its Teams page says McAfee bought it, and its terms and footer name TunnelBear LLC
# ("©2026 TunnelBear LLC.", "Grizzly regards from Toronto, Canada"). Cure53's 2023 report says the audit "was requested
# by McAfee ULC". McAfee is private (owned by an investor group led by Advent International and Permira since 2022,
# data/providers/mcafee.yaml), so no stock. Country: TunnelBear's own, in Toronto, from its footer (the pricing page's).
owner:
  name: 'TunnelBear LLC, owned by McAfee'
  page:
    name: 'TunnelBear for Teams'
    url: https://www.tunnelbear.com/teams
  quotes:
    - "We're a passionate Toronto-based team that was acquired by McAfee in 2018."
  country:
    code: CA
    page:
      name: 'Pricing'
      url: https://www.tunnelbear.com/pricing
    quotes:
      - 'Grizzly regards from Toronto, Canada'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19
notes: >-
  One price list in US dollars everywhere, plus sales tax. Free is 2 GB a month with no country choice; Unlimited adds
  unlimited data, every country and split tunnelling. Its 3-year plan is paid once and doesn't renew. Every plan
  connects unlimited devices of your own.

# General features, read 2026-11-19:
# - Platforms: "You can use TunnelBear to secure your internet connection on Windows , macOS , Android and iOS devices.
#   We also have a browser extension for Chrome , Firefox , and Edge browsers." Linux has only "limited support" (no
#   app), and "TunnelBear is not supported for Kindle/eReaders, Windows mobile devices, Apple/Android TV, or gaming
#   systems." (What devices will TunnelBear work on?).
# - Sign-in: an email and password, with "app authentication and email authentication" for two-factor sign-in (2FA:
#   Secure your account with Two-Factor Authentication).
# - Support: its support form for signed-in users and support@tunnelbear.com (help articles); Unlimited's card lists
#   "Priority customer support" and its gift page "Priority 24/7 support", so round-the-clock support is Unlimited's.
# - App languages: no page lists them (its website is English only; its help centre is in English and Spanish), so left
#   out (notes.md).
# - No pause, and no parental controls, on any page read. Closed source: its notices page lists the open-source
#   libraries its apps use; no page says its apps are open, so no software.open-source.
features:
  platforms: [windows, macos, android, ios, browser-extension]
  account.sign-in: [password, totp, email-code]
  support.channels: [email]

# Perks (M11.6): Unlimited's card lines no feature describes, in its words.
perks:
  - id: priority-support
    name: Priority customer support
  - id: city-level-servers
    name: City-level server selection

# VPN features, read 2026-11-19, on every plan unless named:
# - Devices: "There is no limit on the number of devices you can use with TunnelBear." (pricing FAQ) and "you can be
#   actively connected to TunnelBear on an unlimited number of devices at any given time" (How many connections can I
#   make?), for every account (its December 2025 post doesn't take it from Free).
# - Data: Free "2GB of secure browsing" (pricing), "2GB of data per month" that "resets on the monthly anniversary of
#   your account creation" (What is the difference between a free and paid TunnelBear account?), 10 GB in censored
#   countries (its Bandwidth Program); Unlimited "Unlimited secure browsing", "Unlimited data". Its older "When does my
#   monthly data reset?" still says 500MB, and its checkout FAQ "500 MB of data per month": its 2 GB announcement
#   (We're increasing our free data limit!) and the pricing page win.
# - Countries: "Browse 46+ countries" over a list of 47 (/features), "47 countries worldwide" (the checkout), and the
#   same 47 in Where can I tunnel to and from?. Free has no country choice: "Paid subscribers will retain exclusive
#   access to: SplitBear (website/app split tunneling) Country selection" (Important Changes to TunnelBear Free User
#   Accounts, 3 December 2025), and its download page: "Pick a country* or select Fastest" with "* Feature available on
#   TunnelBear Unlimited plans."; Fastest "connecting you to the location that is closest to you": one country, inferred.
# - Protocols: "WireGuard, OpenVPN, and IKEv2" (VPN Protocol: Choosing how you connect); obfuscation: GhostBear "makes
#   your encrypted data less detectable to governments, businesses, and ISPs" (Windows, macOS v4 and Android), on Free
#   too ("Keep connections secure with features like VigilantBear and GhostBear").
# - Kill switch: VigilantBear, "TunnelBear will block all unsecured traffic until it’s safely reconnected" (/features),
#   on Free too. Split tunnelling: SplitBear, Unlimited only (above).
# - P2P: "Peer-to-Peer (P2P) friendly servers that allow you to share files securely and privately." (/features), on
#   Unlimited; its file-sharing article suggests picking a country, which Free can't, so Free leaves it out.
# - No-logs policy: "TunnelBear does NOT log any activity of customers connected to our service. Period." (/features);
#   its privacy policy lists what it keeps (below, service.activity-logging).
# - Audits: Cure53's yearly white-box audits since 2016 of its apps, VPN infrastructure, backend and website ("going
#   through each of the TunnelBear applications, website, VPN infrastructure, backend", 14 February 2024; the 2024 audit,
#   "44 working days throughout the months of October and November", covered "TunnelBear applications" and "Backend
#   systems and server configurations", 24 November 2025; Cure53's 2023 report: "WP1: White-box tests against
#   TunnelBear client apps", "WP2: White-box tests against TunnelBear VPN infrastructure"): servers and apps. No audit
#   tested the no-logs claim: they're penetration tests (notes.md).
# - RAM-only servers: no page read mentions them, so false. Connects your own devices: no page offers it, so false.
# - No multi-hop, Tor, port forwarding or content blocking on any page read; "TunnelBear does not offer a static IP".
#   Sign-up needs an email address, so not anonymous.
plans:
  - id: tunnelbear.free
    name: Free
    link: https://www.tunnelbear.com/pricing
    features:
      vpn.included: true
      vpn.devices: unlimited
      vpn.unlimited-traffic: false
      vpn.data-allowance: 2
      vpn.server-countries: 1
      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: false
      vpn.no-logs-policy: true
      vpn.independent-audits: [servers, apps]
      vpn.ram-only-servers: false
      vpn.mesh: false
      ad-free: true
    inferred:
      vpn.server-countries:
        reason: 'Free has no country choice: its only tunnel is Fastest, which connects you to the location closest to you, so one country.'
        page:
          name: 'Fastest Tunnel: Have the quickest connection possible'
          url: https://help.tunnelbear.com/hc/en-us/articles/360006976152-Fastest-Tunnel-Have-the-quickest-connection-possible
        lastVerified: 2026-11-19
    notes: >-
      2 GB a month, reset on the day of the month you signed up (10 GB in countries its Bandwidth Program covers). No
      country or city choice and no split tunnelling since December 2025: it connects to the nearest location. No ads.
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://www.tunnelbear.com/pricing

  - id: tunnelbear.unlimited
    name: Unlimited
    link: https://www.tunnelbear.com/account/checkout
    features:
      vpn.included: true
      vpn.devices: unlimited
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 47
      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.p2p: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [servers, apps]
      vpn.ram-only-servers: false
      vpn.mesh: false
      ad-free: true
      support.channels: [email, 24-7]
    perks: [priority-support, city-level-servers]
    notes: >-
      The 3-year plan is paid once ($120) and doesn't renew. City servers in the US and Canada. A year can also be
      given as a gift ($69.99), which doesn't renew.
    prices:
      - region: GLOBAL
        currency: USD
        amount: 10.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://www.tunnelbear.com/account/checkout
      - region: GLOBAL
        currency: USD
        amount: 69.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://www.tunnelbear.com/account/checkout
      - region: GLOBAL
        currency: USD
        amount: 120
        interval: year
        intervalCount: 3
        autoRenew: false
        lastVerified: 2026-11-19
        sourceUrl: https://www.tunnelbear.com/account/checkout

