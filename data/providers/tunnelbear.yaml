      url: https://www.tunnelbear.com/blog/important-changes-to-tunnelbear-free-user-accounts/
  ratings:
    - topic: privacy.data-collection
      tier: bad
      reason: 'Its apps send crash reports and details about your device, and it keeps your system and app version for product planning. Its pages offer no way to switch these off.'
      sources:
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'User support, troubleshooting and product planning'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'Identifying and resolving app stability issues'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'Understanding how the app performs on different devices'
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: good
      reason: 'It never sells your data, and gives it only to companies that help run the service. Google’s and Microsoft’s ad cookies on its website come only if you accept them.'
      sources:
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'TunnelBear will NOT sell or trade Personal Data for commercial purposes.'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'Except as described below, TunnelBear will NOT disclose any Personal Data to other commercial parties under any circumstance:'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'With your consent, we’ll also use anonymized analytics and marketing cookies to improve your experience.'
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: good
      reason: 'No ads in its apps, free plan included. Its website uses marketing cookies only if you agree to them.'
      sources:
        - url: https://www.tunnelbear.com/blog/important-changes-to-tunnelbear-free-user-accounts/
          quote: 'We’re proud to be one of the few VPNs that still offers a truly free option without ads'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'With your consent, we’ll also use anonymized analytics and marketing cookies to improve your experience.'
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: "Its privacy policy and terms don't mention AI."
      pages:
        [https://www.tunnelbear.com/privacy-policy, https://www.tunnelbear.com/terms-of-service]
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: good
      reason: 'Your monthly data count resets each month, and your account data is deleted 30 days after you cancel or when you ask. Other data stays as long as it says it needs it.'
      sources:
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'Unless legally required to keep it, we will delete your account data on the earlier of 1) 30 days after you cancel your subscription or 2) when you request deletion through our privacy center'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'We also ensure that no historical record is kept by resetting the total monthly usage value to 0 at the end of each month.'
        - url: https://www.tunnelbear.com/privacy-policy
          quote: 'We store your Personal Data only as long as is necessary for the purposes for which it is collected'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: good
      reason: 'You can delete your account yourself at any time, unless paid time is left, when its support does it. Every trace is gone within 30 days.'
      sources:
        - url: https://help.tunnelbear.com/hc/en-us/articles/360007083371-How-do-I-delete-my-account
          quote: "If you're no longer happy with your Bear, you can delete your account at any time"
        - url: https://help.tunnelbear.com/hc/en-us/articles/360007083371-How-do-I-delete-my-account
          quote: 'If you have any unlimited tunneling time remaining on your account, you will not be able to delete it. Our Support Bears can help in this case.'
        - url: https://help.tunnelbear.com/hc/en-us/articles/360007083371-How-do-I-delete-my-account
          quote: 'Note: While an account deletion will occur immediately, it may take up to 30 days to remove all traces of the account from our servers.'
      action:
        name: 'How to delete your account'
        url: https://help.tunnelbear.com/hc/en-us/articles/360007083371-How-do-I-delete-my-account
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask for a copy of your data from the privacy page of your account. It doesn’t say in what form.'
      sources:
        - url: https://www.tunnelbear.com/privacy-policy
          quote: "Visit TunnelBear's privacy center to request access to, receive (port), seek rectification, or request erasure of Personal Data held about you by TunnelBear."
        - url: https://help.tunnelbear.com/hc/en-us/articles/360006798512-How-do-I-view-change-or-delete-my-personal-information-from-TunnelBear
          quote: 'click on the Privacy tab and follow the prompts.'
      action:
        name: 'How to see or download your data'
        url: https://help.tunnelbear.com/hc/en-us/articles/360006798512-How-do-I-view-change-or-delete-my-personal-information-from-TunnelBear
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands data over only for a valid court order or warrant, and keeps no IP addresses or browsing to give. It doesn’t say it tells you, and publishes no count of requests.'
