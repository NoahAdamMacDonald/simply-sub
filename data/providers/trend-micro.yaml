# Features (read 2026-11-20): each plan page and its comparison table, the help centre's "Which Trend Micro Security
# Features Fit My Needs?" (TMKA-19015, last updated 2026-09-15), the data collection notices and the VPN and ID Protection
# help.
# - Windows apps (Antivirus+, Internet Security, Maximum Security): "Virus and Spyware Protection", "Web Threat
#   Protection", "Anti-Spam", "Anti-Phishing", "Ransomware Protection" (Folder Shield), "Authenticate Wi-Fi Networks and
#   Hotspots", "Windows Firewall Booster", "Block Malicious Links in Email", "Gamer-Friendly Mute Mode", "Pay Guard"
#   (secure banking browser) and "AI App Protection" on all three; Internet Security and Maximum Security add "Privacy
#   Scanner", "Data Theft Prevention", "Secure Erase", "PC Health Checkup" and "Parental Controls" (time and content
#   limits: "Allow children to explore the web safely, with both time and content limits."). Scans: its data collection
#   notices list "Manual Scan", "Scheduled Scan" and "Real-time Scan" for every Windows app (Antivirus+'s too, TMKA-20179).
#   No ransomware file recovery, cryptomining, vulnerability-scan or anti-theft wording on any page. "Windows Firewall
#   Booster" is, as its name says, a helper for Windows' own firewall; no page names a firewall of Trend Micro's own, so
#   antivirus.network has only the Wi-Fi check (the catalog's rule since 2026-11-20: a firewall only where the provider
#   has its own).
# - Behaviour-based detection: no page names it; inferred from its pages' "proactive protection" against
#   "never-before-seen attacks" and its notices' "Active Monitoring".
# - Password manager: "Password Manager is no longer supported as of November 16, 2025" (TMKA-12258); its suites manage
#   passwords in ID Protection's vault, which imports "from a CSV File" exported from other managers ("Kaspersky Password
#   Manager Data", "LastPass", "Google Password Manager", TMKA-19071) and exports "two CSV files" of passwords and secure
#   notes (TMKA-13358). No page names an authenticator, emergency access, an offline vault or end-to-end encryption
#   ("Manages and encrypts passwords" only).
# - Trend Micro VPN: "Unlimited Bandwidth: Uses high-end servers with no speed, traffic, or bandwidth limitation.", "Web
#   Threat Prevention: Blocks malicious websites, fraud, and online scams", servers in 17 countries (Australia, Canada,
#   France, Germany, Israel, Italy, Japan, the Netherlands, New Zealand, Saudi Arabia, South Africa, Switzerland,
#   Singapore, Taiwan, the UAE, the UK and the US, TMKA-20109). No page names its protocols, a kill switch, split
#   tunnelling, RAM-only servers, a way to connect your own devices or a no-logs policy, so those are false or left out.
# - Identity: ID Protection's "Dark Web Monitoring", "Anti-tracking" and "Password Manager" (Standard and Plus), and
#   Plus's "24/7/365 Identity Theft Resolution Specialists" and "Up to $1 Million Identity Fraud Insurance" ("available
#   for U.S. CUSTOMERS ONLY").
