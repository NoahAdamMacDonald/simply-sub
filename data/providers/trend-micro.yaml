# Owner (M11.2), read 2026-11-20: its consumer terms name the company and its brand ("TrendLife is the branded business
# unit of Trend Micro that provides consumer products and services") and, for Japan, "Trend Micro Incorporated (Japan)";
# Canada's and the US's contracts are with "Trend Micro Incorporated, Irving, TX, USA", its US office. Its country is
# Japan, where it is incorporated and listed. Shares: its investor relations page. No page read names a majority holder.
