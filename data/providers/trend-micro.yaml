    url: https://helpcenter.trendmicro.com/en-us/article/tmka-18342
    quotes:
      - 'The Trend Micro Online Store accept several payment options including:'
      - 'Visa®'
      - 'PayPal'
      - 'Google Pay'
  - methods: [app-store]
    page: 'Consumer Terms of Use (TrendLife)'
    url: https://www.trendmicro.com/content/dam/trendmicro/global/en/core/docs/trust-center/agreements/en-english-mulitcountry-consumer-eula.pdf
    quotes:
      - 'If you purchased through an app store such as Google Play or the Apple App Store, billing and payment information related to that purchase is held by the app store provider under their own privacy policy and retention practices, which are outside our control.'
# Renewal day (M11.5, M11.21): its consumer terms renew a subscription "at the end of each term" (a year on from the day you
# bought), and its help centre charges "up to 15 days before your subscription expires" ("Is Auto-Renewal Enabled When
# Purchasing a Trend Micro Subscription?", and its account help: "you will be charged up to 15 days before the expiry
# date"). Two other articles of the same date say the charge falls "on your subscription's expiration date" (TMKA-14380,
# TMKA-12954): the earlier charge is kept, so the app charges a new yearly item 15 days early at most.
renewalAnchor:
  kind: same-date
  page: 'Is Auto-Renewal Enabled When Purchasing a Trend Micro Subscription?'
  url: https://helpcenter.trendmicro.com/en-us/article/TMKA-12771
  quotes:
    - 'If you are subscribed to Auto Renewal , you will see a charge on your payment method up to 15 days before your subscription expires.'
  chargedBefore: { days: 15, upTo: true }
  lastVerified: 2026-11-20
