      - { exchange: Tokyo Stock Exchange, symbol: '4704' }
    page:
      name: 'Investor Relations'
      url: https://www.trendmicro.com/en_us/about/investor-relations.html
    quotes:
      - 'Traded: Tokyo Stock Exchange Prime Market'
      - 'Ticker Code: 4704'
    lastVerified: 2026-11-20
  lastVerified: 2026-11-20
# Ways to pay and card networks (M11.5), read 2026-11-20 in its help centre's "What Payment Methods Can I Use For Trend
# Micro Online Purchase?" (its online store: Visa, MasterCard, EuroCard, Discover, American Express, Diner's Club and
# JCB cards, PayPal and Google Pay; Diner's Club is `other`, and EuroCard is Mastercard's European name) and its renewal
