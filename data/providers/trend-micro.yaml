# Researched by hand on 2026-11-20 (M11.15, security batch 2), read from Canada with Edge and a plain fetch: each
# country's trendmicro.com home pages (/en_ca/, /en_us/, /en_gb/, /en_ie/, /de_de/, /fr_fr/, /en_nl/, /es_es/, /it_it/,
# /en_au/, /en_nz/), which price in their own currency whoever reads them (their price data names it: "CAD", "USD",
# "GBP", "EUR", "AUD", "NZD", in data-price-currency or the buy link's "currency=", while Canada's, the US's,
# Australia's and New Zealand's visible text shows a bare "$"; each priced page's HTML is saved with its price data,
# Europe's and, by a second plain fetch the same day, Canada's, the US's, Australia's and New Zealand's); its checkout
# (checkout.trendmicro.com) and auto-renewal terms in Edge; its help centre (helpcenter.trendmicro.com, which also
# answers as helpcenter.trendlife.com), consumer terms, privacy notices, trust centre and investor pages with a plain
# fetch; AV-TEST's page. TrendLife is Trend Micro's consumer brand. Pages, each quoted where it's used:
# Pricing: each product page holds its store's price data for each term and device count, with a sales price, a
# "renewal" price and a list price (data-price-renewal-price, data-price-msrp; Australia's and New Zealand's Maximum
# Security, a regular and a sales price). "The introductory purchase price today is valid for the first term of your new
# subscription. Your subscription renews each year at the then-current subscription renewal price." (every product page),
# so the renewal price is stored (Canada's and the US's Internet Security renew at 81.95 in the price data,
# data-price-renewal-price="81.95", below its 83.95 list price, the only figure their visible text shows).
# The 2-year terms renew yearly ("12 month renewal terms if you have a 12, 24 or 36 month subscription", its
# auto-renewal terms; "your subscription will automatically renew for a 1-year term", its consumer terms): first terms,
# so only yearly prices are stored (Norton's precedent). No page sells monthly billing. No price includes tax: "Prices
# don't include local taxes such as VAT or sales tax; these will be added at checkout based on where you live."
# (its consumer terms; Canada's checkout shows "Estimated Tax").
# What each country sells: its menu and plan pages. Canada and the US: Antivirus+ Security, Internet Security, Maximum
# Security, Premium Security Suite, Personal Protection Suite, ID Protection and Trend Micro VPN. The UK and Ireland:
# Antivirus+, Internet Security, Maximum Security and Premium Security Suite; Germany, France, the Netherlands, Spain and
# Italy: Antivirus+, Internet Security and Maximum Security. Australia and New Zealand: their own range (Maximum Security
# for 1 device, Maximum Security Plus, Security Suite Pro, Pro Plus, Ultimate in Australia only, Personal Protection
# Suite for 4 devices, ID Protection, VPN for 2 devices). A plan whose features or devices differ by country is a plan of
# its own (Norton's precedent): 22 plans. Each is priced for the device count its page shows first; the larger counts
# Australia's suites also sell are in their notes.
# Region checklist for CA and US, 2026-11-20: 1. country paths (/en_ca/, /en_us/); 2. its region picker (the same
# paths); 3. the price data in each product page names CAD or USD; 4. Canada's checkout (Premium Security Suite), up to
# the payment form, says "CAD 154.95" struck and "CAD 109.95"; 5. its help centre's renewal and payment articles; 6.
# Edge and a plain fetch; 7. no bill offered.
# Not drafted: Mobile Security for Android and iOS and Trend Micro ScamCheck alone (sold in their apps: their pages show
# only download buttons and "Start your free 30-day trial"), Cleaner One Pro and Unzip One (utilities), Premium and
# Ultimate Service Bundles (support services), Home Network Security (hardware), Deepfake Inspector and Trend Micro Check
# (free tools with no antivirus), and the UK's and euro countries' Trend Micro VPN (their pages offer only "Free
# Download", no price).
# Bundles: none beyond its own suites (plans here). Official resellers: none named; its checkout sells through "our
# preferred international seller Reach US, CA, UK, EU, or AU" (its merchant of record, like Avira's Cleverbridge, not a
# shop of its own), and its help centre says Best Buy and internet providers sell it ("For Best Buy purchases, call
# 1-888-237-8289."): retailers, not named as official resellers. App stores bill its mobile apps: partners, not listed.
# Free use: HouseCall (its free scanner) and ID Protection's free version (plans below).

# Coverage: trend-micro.antivirus-plus and trend-micro.internet-security in AU and NZ: their menus list neither (their
# range starts at Maximum Security), read 2026-11-20.
# Coverage: trend-micro.maximum-security in GB, IE, DE, FR, NL, ES, IT, AU and NZ: Canada's and the US's own plan, with
# dark web monitoring; Europe sells trend-micro.maximum-security-europe, Australia and New Zealand their own range.
# Coverage: trend-micro.maximum-security-europe in CA, US, AU and NZ: the UK's and the euro countries' plan.
# Coverage: trend-micro.premium-security-suite in US, GB, IE, DE, FR, NL, ES, IT, AU and NZ: Canada's own plan (the US's
# and the UK's and Ireland's are plans of their own; the other euro countries' and Australia's and New Zealand's menus
# list no Premium Security Suite).
# Coverage: trend-micro.premium-security-suite-us in CA, GB, IE, DE, FR, NL, ES, IT, AU and NZ: the US's own plan.
# Coverage: trend-micro.premium-security-suite-europe in CA, US, DE, FR, NL, ES, IT, AU and NZ: the UK's and Ireland's
# plan.
# Coverage: trend-micro.personal-protection-suite in US, GB, IE, DE, FR, NL, ES, IT, AU and NZ: Canada's own plan; the
# UK's and the euro countries' menus list no Personal Protection Suite.
# Coverage: trend-micro.personal-protection-suite-us in CA, GB, IE, DE, FR, NL, ES, IT, AU and NZ: the US's own plan.
# Coverage: trend-micro.personal-protection-suite-4-devices in CA, US, GB, IE, DE, FR, NL, ES and IT: Australia's and New
# Zealand's plan.
# Coverage: trend-micro.id-protection in GB, IE, DE, FR, NL, ES and IT: their menus list no ID Protection.
# Coverage: trend-micro.id-protection-plus in CA: listed (its soldIn), priced in a bare "$" copied from the US page:
# Canada's page repeats the US's "Pick your plan" table ("$69.99 / year", "$129.99"), with insurance "for U.S.
# CUSTOMERS ONLY", and its price data holds Standard's CAD price only (Plus is bought in its app), read 2026-11-20.
# Coverage: trend-micro.id-protection-plus in GB, IE, DE, FR, NL, ES, IT, AU and NZ: their menus list no ID Protection,
# and Australia's and New Zealand's pages list Standard only.
# Coverage: trend-micro.vpn and trend-micro.vpn-5-devices in GB, IE, DE, FR, NL, ES, IT, AU and NZ: the UK's and the euro
# countries' VPN pages show only "Free Download", no price; Australia and New Zealand sell trend-micro.vpn-2-devices.
# Coverage: trend-micro.vpn-2-devices in CA, US, GB, IE, DE, FR, NL, ES and IT: Australia's and New Zealand's plan.
# Coverage: trend-micro.maximum-security-1-device, trend-micro.maximum-security-plus, trend-micro.security-suite-pro and
# trend-micro.security-suite-pro-plus in CA, US, GB, IE, DE, FR, NL, ES and IT: Australia's and New Zealand's range.
# Coverage: trend-micro.security-suite-ultimate in CA, US, GB, IE, DE, FR, NL, ES, IT and NZ: Australia's only (New
# Zealand's menu doesn't list it, and its page there leads to Security Suite Pro Plus).

