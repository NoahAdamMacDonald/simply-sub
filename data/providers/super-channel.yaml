          quote: 'Each time you visit our Service, we automatically collect certain information about your device and your interaction with our Service.'
        - url: https://www.superchannelplus.ca/privacy
          quote: 'Analyze how the Service is being used for troubleshooting and improvements'
        - url: https://www.superchannelplus.ca/privacy
          quote: 'Simply, contact a representative of our privacy office at the following e-mail address to have your consent withdrawn: privacyofficer@superchannel.ca'
      action:
        name: 'Withdraw your consent by email (privacy policy)'
        url: https://www.superchannelplus.ca/privacy
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It lets advertising and analytics partners collect information straight from you, and may use your email to find people like you for its ads if you agree. Its cookie banner’s “Do Not Sell or Share” choice is the way out.'
      sources:
        - url: https://www.superchannelplus.ca/privacy
          quote: 'We may use tracking technologies that allow third-party advertising and/or analytics partners to collect information directly from our subscribers and logged-out website visitors.'
        - url: https://www.superchannelplus.ca/privacy
          quote: 'Upon receiving proper consent from you, we may wish to include your email address in our email list to create a “Lookalike” audience.'
        - url: https://www.superchannelplus.ca/help
          quote: 'Do Not Sell or Share My Personal Information'
      action:
        name: 'Do Not Sell or Share My Personal Information'
        url: https://www.superchannelplus.ca/help
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It uses your information for its advertising, here and on other websites. You can opt out of ad targeting only through industry pages and your browser’s cookie settings.'
      sources:
        - url: https://www.superchannelplus.ca/privacy
          quote: 'Conduct advertising activities, which may include displaying advertisements before, during or after our content, displaying advertisements on third party websites, and understanding the effectiveness of our advertising efforts'
        - url: https://www.superchannelplus.ca/cookies
          quote: 'To opt out of the collection and use of your information for ad targeting, you can visit the following pages:'
        - url: https://www.superchannelplus.ca/cookies
          quote: 'You may change your browser’s settings to delete cookies that have already been set and to reject new cookies.'
      action:
        name: 'Its cookie policy’s opt-outs'
        url: https://www.superchannelplus.ca/cookies
      lastVerified: 2026-11-13
