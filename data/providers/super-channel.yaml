          quote: 'In order to delete your account, click on the "contact us" link below and then submit a request to support to delete your account.'
        - url: https://www.superchannelplus.ca/help/account-settings/how-do-i-delete-my-account
          quote: 'Once the request is processed, all the data will be permanently removed from your account.'
      action:
        name: 'How to delete your account'
        url: https://www.superchannelplus.ca/help/account-settings/how-do-i-delete-my-account
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can email its privacy officer for a copy of your information in a format you can use elsewhere, answered within 45 days.'
      sources:
        - url: https://www.superchannelplus.ca/privacy
          quote: 'For data portability requests, we will select a format to provide your Personal Information that is readily useable and should allow you to transmit the information from one entity to another entity without hindrance.'
        - url: https://www.superchannelplus.ca/privacy
          quote: 'We endeavor to respond to a verifiable consumer request within forty-five (45) days of its receipt.'
      action:
        name: 'Ask for your information by email (privacy policy)'
        url: https://www.superchannelplus.ca/privacy
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over your information when the law or a subpoena requires it, and says nothing about telling you or publishing reports.'
