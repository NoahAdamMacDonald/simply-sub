# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 in Edge from Canada: Super Channel+'s Viewer Terms of Service
# Agreement ("Last updated: Apr 8, 2025": its Terms of Use and its Subscription Terms and Payment on one page, which
# include its Privacy Policy), its Privacy Policy (the same date), its cookie policy (Vimeo OTT's), the checkout's
# account step through a Canadian exit ("By continuing, you agree to our Terms of Service and acknowledge our Privacy
# Policy"), its FAQ and its help centre's 101 articles (Vimeo's, with Super Channel+'s name); superchannel.ca's own
# Terms of Use and short privacy policy (its website and newsletters: no grade worse than Super Channel+'s) and its
# Zendesk help centre's 13 articles. Not read: Vimeo's own privacy policy (vimeo.com/privacy, which its policy points
# to for the service it runs), and Amazon's, Apple's and the TV providers' terms, which bill the live channels. Super
# Channel+'s terms give Vimeo.com, Inc. the right to enforce them as "a third-party beneficiary". Calibrated against
# Crave (the same arbitration clause) and STARZ.
