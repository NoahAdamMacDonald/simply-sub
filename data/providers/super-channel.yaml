# Researched by hand on 2026-11-13 (M11.15, streaming batch 7), read with Edge from Canada, Super Channel+'s checkout
# again through a Canadian exit (from here it opens superchannelplus.ca/unavailable), and its help centres
# (superchannelplus.ca/help, Vimeo OTT's, in Edge; allarcoentertainment.zendesk.com through its API). Pages, each
# quoted where it's used:
# What it sells: "Subscribe today through your preferred cable service provider, approved streaming platform, or
# directly with Super Channel+." (superchannel.ca/subscribe). Super Channel+ is its own streaming service, sold
# directly: "On demand library of movies and series (no live channels)", while Super Channel is "Four live 24/7 linear
# channels (Fuse, Heart & Home, Vault & Quest) with scheduled programming, plus an on demand library of movies and
# series", bought "through a TV provider, Amazon Prime Video or Apple TV" (Super Channel+'s FAQ, What is the difference
# between Super Channel+ and Super Channel?). So three plans: Super Channel+ (direct), Super Channel (the channels on
# Amazon's Prime Video Channels or the Apple TV app, billed by them: app-store, never a plan of Amazon's or Apple's) and
# its free channels. The other 49 cards on the subscribe page (Fubo and 48 TV providers, its page data's prices from 3.5
# to 17 dollars a month) sell the channels in their own TV packages: telecom's to list.
# Pricing: Super Channel+'s page (signup.superchannelplus.ca): "Monthly", "C$11.49", "per month (incl. tax)", and
# "Annual", "C$114.90", "per year (incl. tax)", "Make the Switch to Annual and Enjoy 2 Months Free"; with "Your 14-day
# free trial begins immediately." (its FAQ), a trial. Its price is stated with tax included, so taxIncluded; Super
# Channel's subscribe page shows the same service at "$9.99/Month" (its Super Channel+ card), which with 15% HST is
# C$11.49 (notes.md). Super Channel on Prime Video and Apple TV: "$9.99/Month" on each one's card on
# superchannel.ca/subscribe ("Prime members can subscribe to Super Channel with Prime Video Channels and watch both live
# TV and On Demand.", "Subscribe to Super Channel on the Apple TV app and watch both live TV and On Demand."), the same
# as Amazon's offer page (primevideo.com/offers?benefitId=superchannelca: "7-day free trial", "$9.99/month after
# trial", its data "recordTerritory":"CA", from here and through a Canadian exit), so CA$9.99 before tax. Apple's own
# channel page wasn't found (the subscribe page links Super Channel+'s App Store app), so Apple's price is Super
# Channel's word only. Free channels: "FREE, NO SUBSCRIPTION REQUIRED!" (superchannel.ca/freechannels, an image's
# words) and "Super Channel offers two free ad-supported channels, Super Channel Uncovered and Super Channel Hearties,
# available on streaming platforms including Tubi, Plex, Xumo Play, LG, Roku, Pluto and Samsung TV Plus." (its press
# releases).
# Billing period: its FAQ and help centre bill monthly plans "on the same day each month", though its terms' purchase
# section says "Monthly plans renew for 30-day periods": the billing pages' month is used (notes.md).
# Region checklist for CA, 2026-11-13: 1. superchannel.ca and superchannelplus.ca, English only, no locale paths; 2. a
# time-zone picker only; 3. the pricing cards are fixed text, and Amazon's offer data names CA; 4. Super Channel+'s
# checkout through a Canadian exit, to its account step ("Create your account"), never further; 5. its help centres
# (Zendesk's "How much does Super Channel cost?": "Subscriptions start as low as $9.95 per month" through providers); 6.
# Edge, a plain fetch (Vimeo's help needs JavaScript) and a Canadian exit; 7. no bill offered. Elsewhere: not sold.
# Bundles: none on its pages (Fubo's is an add-on to its own TV plans, "Subscribe to Super Channel with FuboTV and watch
# both live TV and On Demand.", telecom's). Official resellers: none; it sells gift subscriptions itself ("You can gift
# your favorite subscription networks to others.", its help centre).
# Features, read 2026-11-13: ad-free ("completely uncut and ad-free!", the subscribe page; "Unlimited Content, Ad-Free
# Experience", Super Channel+'s card). Super Channel+: video "we cap 1080p video at 5 Mbps" (Video playback), so 1080p
# (inferred); streams: "You can only watch content on a limited number of devices at once" (its too-many-devices
# article) with no number on any page or named review, so it waits in core's awaitingRequiredFeatures; downloads in its
# iOS and Android apps, on no stated number of devices, so 1 (inferred); pause: "Monthly subscriptions can be paused for
# one, two, or three months at a time" (How do I pause my subscription?), on the website only. Its help centre's
# viewer and kids profiles articles are Vimeo's, "only available if your streaming service has turned them on", and no
# page says Super Channel+ has: not listed. Super Channel on Prime Video: Amazon's usage rules for third-party add-on
# subscriptions ("You can stream up to three titles (including Prime Video titles ...) at the same time using the same
# Amazon account"); no page states its video quality (Amazon's channel page labels no title 4K or HD), so it waits.
# Free channels: neither quality nor streams stated (they play in other companies' apps): both wait. What it streams:
# "exclusive series, movies and documentaries" (What programs are available on Super Channel?); the free channels'
# "Feel-good shows, timeless romance" and "true crime, unsolved mysteries, and thrilling dramas" (Discover the World of
# FREE Channels); none of your own media.

id: super-channel
name: Super Channel
website: https://superchannel.ca
# Super Channel+'s site, sign-up and help centre, and Super Channel's help centre.
domains: [superchannelplus.ca, allarcoentertainment.zendesk.com]
category: streaming
spendCategory: streaming
# "Super Channel is a national pay television service and is licensed to operate within Canada." (its help centre,
# Where is Super Channel available?), and "The Service is intended for use in Canada" (Super Channel+'s terms, 5(e)).
availableIn: [CA]
billingCurrency: { CA: CAD }
cancelUrl: https://www.superchannelplus.ca/help/subscribing/how-do-i-cancel-my-subscription
sources: { pricing: https://signup.superchannelplus.ca/ }
notes: Super Channel+ streams its on-demand library. The live channels stream through Amazon's Prime Video Channels and the Apple TV app, or come with Canadian TV providers. Two free channels play on Tubi, Pluto TV and other free services.
# Owner (M11.2), read 2026-11-13: its press releases' boilerplate; Super Channel+'s privacy policy is Allarco
# Entertainment 2008 Inc.'s ("the operator of the service known as “Super Channel+”"), at "1189-5328 Calgary Trail NW,
# Edmonton, AB". Where it is: its help centre (no page names Alberta in words). A private company: no listing named.
owner:
  name: Allarco Entertainment 2008 Inc.
  page:
    name: Super Channel to Premiere Funny Money - The Dane Cook Story (press release)
    url: https://superchannel.ca/press-releases/super-channel-to-premiere-funny-money-the-dane-cook-story
  quotes:
    - 'Super Channel is owned by Allarco Entertainment 2008 Inc., an Edmonton-based media company.'
  country:
    code: CA
    page:
      name: Where is Super Channel available?
      url: https://allarcoentertainment.zendesk.com/hc/en-us/articles/206191477-Where-is-Super-Channel-available
    quotes:
      - 'Super Channel is a national pay television service and is licensed to operate within Canada.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: a payment card (its privacy policy), Google Pay and Stripe's Link wallet (other:
# a wallet no id names) on Super Channel+'s checkout (its help centre), the app stores that bill Super Channel+ in their
# apps (Apple, Google Play, Roku, Amazon: its cancelling article), and, for the live channels, Amazon's Prime Video
# Channels, the Apple TV app and a TV provider's bill (its FAQ). No page names a card network ("Visa Gift Cards and other
# kinds of pre-paid gift cards are not supported", its card article), and the checkout's payment step comes after an
# account: no acceptedNetworks.
paymentMethods:
  - methods: [card]
    page: Privacy Policy (Super Channel+)
    url: https://www.superchannelplus.ca/privacy
    quotes:
      - 'You must also provide valid payment card information if you wish to sign up for a free trial, subscription, or make any other purchase.'
  - methods: [google-pay]
    page: How do I pay with Google Pay?
    url: https://www.superchannelplus.ca/help/subscribing/how-do-i-pay-with-google-pay
    quotes:
      - 'To pay using Google Pay, you must be using the Chrome web browser, be signed in to your Google account, and have a payment method associated with your Google account.'
  - methods: [other]
    page: How Do I Use Stripe Link?
    url: https://www.superchannelplus.ca/help/subscribing/how-do-i-use-stripe-link
    quotes:
      - 'Link is a digital wallet that facilitates a quicker checkout with credit/debit cards.'
  - methods: [app-store]
    page: How do I cancel my subscription (unsubscribe)?
    url: https://www.superchannelplus.ca/help/subscribing/how-do-i-cancel-my-subscription
    quotes:
      - 'If you signed up within a Google Play/Android app, follow the steps here:'
      - 'If you signed up within the Roku channel, follow the steps here:'
  - methods: [app-store, provider-billing]
    page: What is the difference between Super Channel+ and Super Channel?
    url: https://signup.superchannelplus.ca/faq
    quotes:
      - 'Subscribe through a TV provider, Amazon Prime Video or Apple TV.'
# Renewal day (M11.5): its FAQ, and its help centre's "Subscriptions get charged on the same day each month that you
# have subscribed." Its terms' "Monthly plans renew for 30-day periods" disagrees (notes.md).
renewalAnchor:
  kind: same-date
  page: When will I be charged for my Super Channel+ subscription?
  url: https://signup.superchannelplus.ca/faq
  quotes:
    - 'Monthly Subscription: After your trial ends, your card will be charged on the same day each month.'
  lastVerified: 2026-11-13

# Platforms (2026-11-13): Super Channel+'s terms (5(j)): its app from "Canadian Apple App Store or the Canadian Google
# Play store" (iOS, Android, Fire OS), "Amazon Fire TV", "Android TV", "Apple TV", "LG Smart TV", "Samsung Smart TVs",
# "Roku devices", and "your computer at www.superchannelplus.ca" (Chrome, Edge, Firefox, Safari). Sign-in: "enter your
# password and click Sign In", or "an email link that will log you in, once clicked" (How do I log in?). App languages:
# English (its sites have no French version; the App Store lists "English"; Vimeo's checkout "may be translated" in
# parts). Support: its help centre's request form and "You may call us during regular business hours at
# 1-780-430-2800." (How do I contact you?).
features:
