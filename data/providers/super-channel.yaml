          quote: 'Legal Situations: By law or subpoena or if we believe that such action is necessary to comply with the law or legal process served on us or affiliated parties.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      status: not-stated
      reason: 'Its privacy policy doesn’t say where your information is kept.'
      pages: [https://www.superchannelplus.ca/privacy]
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Signing up asks for an email address and a password you choose, then a payment card, even for the free trial.'
      sources:
        - url: https://www.superchannelplus.ca/checkout/subscribe/purchase
