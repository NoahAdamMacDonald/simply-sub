      reason: 'Its privacy policy and terms don’t say whether what you write or upload trains AI.'
      pages:
        - https://www.superchannelplus.ca/privacy
        - https://www.superchannelplus.ca/tos
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as its purposes need, with no periods named, and after you cancel may keep some to send you offers.'
      sources:
        - url: https://www.superchannelplus.ca/privacy
          quote: 'Further, we will retain your personal information only for so long as is necessary to fulfil our stated purposes.'
        - url: https://www.superchannelplus.ca/privacy
          quote: 'When you cancel your subscription, we may preserve certain account information to (i) let you know about new offers and content; (ii) preserve your account, if you ever wish to re-subscribe; and (iii) enforce our rights, where we believe in good faith that preservation is necessary to do so.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You ask its support team to delete your account, and it then removes all the data, but it doesn’t say how long that takes.'
      sources:
