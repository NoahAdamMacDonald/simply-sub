# Terms and policies (BLUEPRINT §4.10), read 2026-11-17 with a plain fetch: its Terms of Service (last updated August
# 2026, which include its Privacy Policy by reference), Privacy Policy (last updated March 2026), the sign-up page ("By
# creating an account, you agree to the Terms of Service and Privacy Policy"), its pricing page's FAQ, its Cloud FAQ,
# local FAQ and cloud model lifecycle documentation, its support page, and its GitHub repository's MIT licence and
# security policy. Its apps have no licence of their own beyond the MIT licence. No shared document applies. The usage
# credits it sells beside its plans are usage-billed (out of scope), but their expiry is in the terms every user agrees
# to (a notable). Calibrated against Claude, ChatGPT, Perplexity and Devin.
policies:
  links:
    - name: 'Terms of service'
      url: https://ollama.com/terms
    - name: 'Privacy policy'
      url: https://ollama.com/privacy
    - name: 'Pricing (FAQ)'
      url: https://ollama.com/pricing
    - name: 'Cloud FAQ'
      url: https://docs.ollama.com/cloud/faq
    - name: 'Cloud'
      url: https://docs.ollama.com/cloud
    - name: 'Local FAQ'
      url: https://docs.ollama.com/faq
    - name: 'Support'
      url: https://ollama.com/support
    - name: 'Sign up'
      url: https://ollama.com/signup
    - name: 'Licence (GitHub)'
      url: https://github.com/ollama/ollama/blob/main/LICENSE
    - name: 'Security policy (GitHub)'
      url: https://github.com/ollama/ollama/blob/main/SECURITY.md
  ratings:
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel online in your account settings. Its terms don’t say whether you keep your plan until the end of the time you paid for.'
      sources:
        - url: https://ollama.com/terms
          quote: 'To cancel your subscription, visit your account settings or contact us.'
        - url: https://ollama.com/terms
          quote: 'Subscriptions automatically renew unless cancelled before the renewal date'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      status: not-stated
      reason: 'Its terms and pricing page don’t say whether you can get money back. Its support page only lists refunds among the billing questions you can email about.'
      pages: [https://ollama.com/terms, https://ollama.com/pricing, https://ollama.com/support]
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: neutral
      reason: 'It says it gives reasonable notice before changing prices, but not how much.'
      sources:
        - url: https://ollama.com/terms
          quote: 'Prices may change with reasonable notice'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      status: not-applicable
      reason: 'It offers no free trial of Pro or Max: the Free plan simply stays free.'
      pages: [https://ollama.com/pricing, https://ollama.com/terms]
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own, but not that it reminds you first. Its emails at 90% of your monthly usage aren’t renewal reminders.'
      pages: [https://ollama.com/terms, https://ollama.com/pricing]
      lastVerified: 2026-11-17
    - topic: billing.fees
      tier: great
      reason: 'You pay only the price and any tax: it says it charges no service fees.'
      sources:
        - url: https://ollama.com/pricing
          quote: 'No service fees'
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      status: not-stated
      reason: 'It says you can switch plans at any time in your billing settings, but not what happens to time you’ve paid for.'
      pages: [https://ollama.com/pricing, https://ollama.com/terms]
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: bad
      reason: 'Any dispute goes to a private referee in San Francisco, not a court, and you give up class actions, with no way to opt out.'
      sources:
        - url: https://ollama.com/terms
          quote: 'Arbitration: Any dispute arising from these Terms or your use of our services shall be resolved by binding arbitration administered by the American Arbitration Association under its Commercial Arbitration Rules.'
        - url: https://ollama.com/terms
          quote: 'Class action waiver: You agree to resolve disputes individually and waive any right to participate in a class action lawsuit or class-wide arbitration.'
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It can change its terms at any time. For big changes it tells you by email or in the app, but it doesn’t say how far ahead; using it afterwards means you agree.'
      sources:
        - url: https://ollama.com/terms
          quote: 'We may modify these Terms at any time. We will provide notice of material changes by updating the “Last updated” date and, for significant changes, by providing additional notice (such as email or in-app notification).'
        - url: https://ollama.com/terms
          quote: 'Your continued use of our services after changes take effect constitutes acceptance of the revised Terms.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: poor
      reason: 'It can close your account for breaking its terms, or for any other reason with notice. It doesn’t say you’d get any money back.'
      sources:
        - url: https://ollama.com/terms
          quote: 'We may suspend or terminate your access if you violate these Terms, engage in fraudulent or illegal activity, or for any other reason with notice.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: great
      reason: 'What you make stays yours, and it may use it only to run the service for you.'
      sources:
        - url: https://ollama.com/terms
          quote: 'By using our services, you grant us a limited, non-exclusive license to process your content solely to provide the Service.'
        - url: https://ollama.com/terms
          quote: 'We claim no ownership over your inputs or outputs.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: good
      reason: 'What its AI makes for you is yours.'
      sources:
        - url: https://ollama.com/terms
          quote: 'Your content: You retain ownership of content you create using our services.'
        - url: https://ollama.com/terms
          quote: 'We claim no ownership over your inputs or outputs.'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: neutral
      reason: 'Its cloud models can be retired as newer ones arrive, as any subscription’s line-up can change. The models on your own computer stay yours.'
      sources:
        - url: https://docs.ollama.com/cloud
          quote: 'Cloud models may be deprecated as newer models become available.'
      lastVerified: 2026-11-17
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://ollama.com/terms, https://ollama.com/privacy]
      lastVerified: 2026-11-17
    - topic: legal.licence
      tier: great
      reason: 'Its apps are open source under the MIT licence: anyone may use, change and share them.'
      sources:
        - url: https://github.com/ollama/ollama/blob/main/LICENSE
          quote: 'MIT License'
        - url: https://github.com/ollama/ollama/blob/main/LICENSE
          quote: 'Permission is hereby granted, free of charge, to any person obtaining a copy'
      lastVerified: 2026-11-17
    - topic: privacy.data-collection
      tier: poor
      reason: 'It never sees what you run on your own computer, but it collects usage details (app version, request counts) and site cookies to improve its service. You can only block the cookies, browser by browser.'
      sources:
        - url: https://ollama.com/privacy
          quote: 'We may collect limited device and usage metadata (such as app version and request counts) that does not include your prompt or response content.'
        - url: https://ollama.com/privacy
          quote: 'We use cookies and similar technologies for essential site functionality and, where applicable, to understand usage. You can control cookies through your browser settings, and disabling cookies may affect site functionality.'
      action:
        name: 'Its privacy policy on cookies'
        url: https://ollama.com/privacy
      lastVerified: 2026-11-17
    - topic: privacy.data-sharing
      tier: great
      reason: 'It doesn’t sell your data or share it for ads. Only companies that run the service for it, such as Stripe for payments and its cloud and model hosts, get it.'
      sources:
        - url: https://ollama.com/privacy
          quote: 'We do not sell your personal information, and we do not share it for cross-context behavioral advertising.'
        - url: https://ollama.com/privacy
          quote: 'To provide you the Service: Third parties who help us operate (e.g., Stripe for payments, cloud infrastructure providers, model inference providers).'
      lastVerified: 2026-11-17
    - topic: privacy.ads-tracking
      tier: great
      reason: 'No ads, and it doesn’t share your data for ads on other sites. Its cookies only run its website and count visits.'
      sources:
        - url: https://ollama.com/privacy
          quote: 'We do not sell your personal information, and we do not share it for cross-context behavioral advertising.'
        - url: https://ollama.com/privacy
          quote: 'We use cookies and similar technologies for essential site functionality and, where applicable, to understand usage.'
      lastVerified: 2026-11-17
    - topic: privacy.ai-training
      tier: great
      reason: 'It never trains AI on what you write or what its models answer, and its model hosts must promise not to either.'
      sources:
        - url: https://ollama.com/terms
          quote: 'We do not use your inputs or outputs to train AI models.'
        - url: https://ollama.com/pricing
          quote: 'When Ollama partners with providers, we require no logging, no training, and zero data retention policies in place.'
      lastVerified: 2026-11-17
    - topic: privacy.content-access
      tier: neutral
      reason: 'What you run on your computer never reaches it. Cloud prompts pass through its servers only to answer you and aren’t kept, and it never asks for them in support requests.'
      sources:
        - url: https://docs.ollama.com/cloud/faq
          quote: 'When you use cloud models, Ollama processes your prompts and responses transiently to provide the service but does not store or log that content and never trains on it.'
        - url: https://ollama.com/privacy
          quote: 'We do not use your inputs or outputs to train any AI models or request prompt or response content in support requests.'
      lastVerified: 2026-11-17
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps no chats. It keeps your account while it’s open and usage data as long as it needs it, with no time limits stated.'
      sources:
        - url: https://ollama.com/privacy
          quote: 'Account information: retained while your account is active and deleted upon request, subject to legal obligations.'
        - url: https://ollama.com/privacy
          quote: 'Metadata and analytics: retained as needed for service operations, security, and improvement, then deleted or de-identified.'
        - url: https://docs.ollama.com/cloud/faq
          quote: 'Ollama operates with a zero data retention (ZDR) policy.'
      lastVerified: 2026-11-17
    - topic: privacy.data-deletion
      tier: great
      reason: 'It keeps almost nothing about you, and you can delete your account yourself at any time on its website.'
      sources:
        - url: https://ollama.com/privacy
          quote: 'Deleting your account: You may, at any time, delete your account via ollama.com under your active profile.'
        - url: https://ollama.com/privacy
          quote: 'Account information: retained while your account is active and deleted upon request, subject to legal obligations.'
      lastVerified: 2026-11-17
    - topic: privacy.data-portability
      tier: neutral
      reason: 'Your chats stay on your computer. For the little it holds about you, you can ask by email for a copy, where the law gives you that right.'
      sources:
        - url: https://ollama.com/privacy
          quote: 'Data portability'
        - url: https://ollama.com/privacy
          quote: 'To exercise your rights, contact us at the email address below.'
      action:
        name: 'How to ask (its privacy policy)'
        url: https://ollama.com/privacy
      lastVerified: 2026-11-17
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over information when the law or a legal process requires it. It holds no chats to give, but doesn’t say it tells you or publish how often.'
      sources:
        - url: https://ollama.com/privacy
          quote: 'Legal requirements: When required by law, a legal process, or to protect our rights.'
      lastVerified: 2026-11-17
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your information can go to the US, and its cloud runs mainly in the US, sometimes in Europe. It says it uses the safeguards the law requires.'
      sources:
        - url: https://ollama.com/privacy
          quote: 'Data may be transferred to and processed in the United States. Where required by law, we use appropriate safeguards for international transfers.'
        - url: https://ollama.com/pricing
          quote: 'Ollama hosts models and compute resources primarily in the United States. To serve global demand, we may route to Europe for additional capacity.'
      lastVerified: 2026-11-17
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with an email address or a Google or GitHub account. It doesn’t say whether an email alias is fine. Running models on your own computer needs no account.'
      sources:
        - url: https://ollama.com/signup
          quote: 'Continue with Google'
        - url: https://ollama.com/signup
          quote: 'Email'
      lastVerified: 2026-11-17
    - topic: security.practices
      tier: neutral
