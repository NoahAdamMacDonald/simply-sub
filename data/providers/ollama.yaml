# Researched by hand on 2026-11-17 (the full catalog run, AI batch 1), read with a plain fetch from Canada (ollama.com:
# home, pricing, download, support, terms, privacy, sign-up and sign-in pages, its blog; docs.ollama.com as its Markdown
# copies; its GitHub repository's licence, security policy and app README), the pricing page in Edge from Canada, and
# ollama.com/pricing through a US, a UK and a German exit. Pages, each quoted where it's used.
# What it is: free software that runs open models on your own computer ("Ollama runs locally. We don’t see your prompts
# or data when you run locally.", its privacy policy), with an app for macOS and Windows "to download and chat with
# models" (Ollama's new app) and a command line for Linux too, plus Ollama's cloud, which runs larger models on its
# servers ("Cloud models run on Ollama's servers, so they are fast on any computer and need no download.", its download
# page), paid by the token or with a plan's monthly credits.
# Pricing: ollama.com/pricing: "Pay as you go" "$0" ("Run models locally", "No subscription", "Pay per token for every
# cloud model."), Pro "$20 / mo. or $200/yr billed annually", Max "$100 / mo." (monthly only: its card has no yearly
# price), Team "$500 / mo." and Enterprise (business plans, out). The blog post that launched these plans agrees ("Pro:
# $20/month, includes $60 of monthly usage", "Max: $100/month, includes $300 of monthly usage"). The $0 card is the
# Free plan: running models on your computer costs nothing ("Running models on your own hardware is always unlimited.",
# its FAQ); its cloud use is paid by the token from bought credits, usage-billed and out of scope, so the plan's notes
# say so. No currency is named anywhere: the page shows a bare "$" from Canada and through a US, a UK and a German exit
# alike, and its code names none; one price list for everywhere in US dollars, the only dollar it can be (Devin's and
# Stremio's precedent), flagged for the owner (notes.md). No page says the prices include tax ("You are responsible for
# all applicable taxes", its terms). Not listed: legacy Pro and Max prices kept by older subscribers ("If you’re on an
# existing Pro, Max, or Team plan, your plan continues to work as-is.", Ollama's transparent pricing), and extra usage at
# per-token rates (usage-billed, out).
# Region checklist, 2026-11-17: 1. ollama.com has no country or locale paths and no hreflang links; 2. no country or
# currency picker; 3. the pricing page's code names no currency; 4. checkout needs an account (/upgrade sends you to
# sign in); 5. no help article prices by country; 6. Edge from Canada and a plain fetch, and Edge through a US, UK and
# German exit, all "$20" and "$200"; 7. no bill offered.
# Bundles: none found. Official resellers: none: its pages sell Pro and Max only at ollama.com and name no shop. The
# coding tools it launches (Claude Code, Codex, OpenCode) and the desktop apps it connects to are other companies'.
# Free use: the Free plan (local models, unlimited, no account needed).

id: ollama
name: Ollama
website: https://ollama.com
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its billing settings, which the pricing page links ("Switch any time from your billing settings"); its terms: "To
# cancel your subscription, visit your account settings or contact us."
cancelUrl: https://ollama.com/settings/billing
sources: { pricing: https://ollama.com/pricing }
notes: 'Runs open models on your own computer for free; its cloud runs larger models on its servers, with a plan’s monthly credits or paid by the token.'

# Ways to pay (M11.5), read 2026-11-17: its terms name only Stripe, which processes its payments; no page names a card,
# a wallet or any other method (its pricing page, FAQ, billing docs and support page were read; the checkout needs an
# account). So the one entry is `other`, quoted, and there are no acceptedNetworks (notes.md, for the owner).
paymentMethods:
  - methods: [other]
    page: Terms of service
    url: https://ollama.com/terms
    quotes:
      - 'Payments are processed securely by Stripe'

# Owner (M11.2), read 2026-11-17: its terms and privacy policy name Ollama Inc., which runs the service and is "the data
# controller". Private: no page names shares or investors. Where it is: its terms name no address; they're governed by
# California's law and send disputes to arbitration in San Francisco (its careers page, on another company's site, lists
# jobs in Palo Alto).
owner:
  name: 'Ollama Inc.'
  page:
    name: Terms of service
    url: https://ollama.com/terms
  quotes:
    - 'These Terms of Service (“Terms”) govern your access to and use of the services provided by Ollama Inc. (“Ollama,” “we,” “us,” or “our”), including our website, software, APIs, and related services (the “Service”).'
  country:
    code: US
    page:
      name: Terms of service
      url: https://ollama.com/terms
    quotes:
      - 'These Terms are governed by the laws of the State of California, without regard to conflict of law principles.'
      - 'The arbitration shall take place in San Francisco, California.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Source code (M11.5): every ollama.com page's header links its GitHub repository (github.com/ollama/ollama, "GitHub
# 187.4K"), and the blog post on its app sends you to its releases there. The repository's licence is "MIT License"
# (its LICENSE file), and it holds the server, the command line and the macOS and Windows app (its app folder: "Ollama
# for macOS and Windows"). Its cloud's servers aren't published, so open-source apps, not fully open.
sourceRepo:
  url: https://github.com/ollama/ollama
  page:
    name: Ollama's new app
    url: https://ollama.com/blog/new-app
  quotes:
    - 'For pure CLI versions of Ollama, standalone downloads are available on Ollama’s GitHub releases page.'
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its terms say only "Subscriptions automatically renew unless cancelled before the
# renewal date". The pricing page's "included usage resets monthly on the same day of the month your subscription
# started, including on annual plans" is about the monthly credits, not the charge, so it isn't used (notes.md).
renewalAnchor:
  kind: not-stated
  pages: [https://ollama.com/terms, https://ollama.com/pricing]
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on ollama.com/pricing, each line no feature describes: Pro's "$60 of usage credits per
# month" and "Access to larger pro models", Max's "$300 of usage credits per month" and "10 concurrent requests" (usage
# levels are perks, never features: the owner's choice of 2026-10-30). Pro's "Fast mode (coming soon)" isn't offered
# yet, so it's left out.
perks:
  - id: usage-credits-60
    name: $60 of usage credits per month
  - id: usage-credits-300
    name: $300 of usage credits per month
  - id: larger-pro-models
    name: Access to larger pro models
  - id: concurrent-requests-10
    name: 10 concurrent requests

# Features, read 2026-11-17 (AI: the registry's ai.* features), on every plan unless named:
# - The assistant: its app chats with models ("Ollama’s macOS and Windows now include a way to download and chat with
#   models.", Ollama's new app), and so does its command line ("ollama run").
# - Where chats are kept: on your device. Local models never leave it ("Your data stays on your machine.", its privacy
#   policy), and cloud models' prompts and answers aren't kept ("this content is not stored beyond the time required to
#   fulfill the request"; "Ollama operates with a zero data retention (ZDR) policy.", its Cloud FAQ).
# - Models from several companies: its library has other labs' open models (the pricing page's table lists deepseek,
#   gemma4, glm, gpt-oss, kimi, minimax, mistral-large-4 and nemotron models; its documentation's "OpenAI’s gpt-oss
#   models", its blog's "Clef, a 27B multimodal decision model from Cloudflare").
# - Reasoning: "Ollama now has the ability to enable or disable thinking." (its blog) and its Thinking documentation.
# - Web search: "Web search is included with a free Ollama account, with much higher rate limits available by upgrading
#   your Ollama subscription" (its Web search post): a search the models can call, through its API and libraries. Free
#   needs a free account for it.
# - Image generation and music and voice generation: on macOS, locally ("Ollama now supports image generation on macOS,
#   with Windows and Linux coming soon.", an experimental feature of January 2026; "Ollama can now turn text into
#   speech.", with "redirect the output to save a WAV file"), so on every plan.
# - Connects to: an API for your own apps (its local API, unlimited on your hardware, and the cloud API with a plan's
#   credits: "From code, apps call the API at https://ollama.com."), code editors (its own VS Code extension: "Install the
#   Ollama extension to use models in VS Code Chat"; JetBrains, Zed and Xcode guides), the command line, and custom
#   assistants ("A Modelfile is the blueprint to create and share customized models using Ollama.", with "a custom system
#   message to specify the behavior of the chat assistant").
# - Monthly API credits on Pro and Max: their "$60" and "$300 of usage credits per month", spent through the app, the
#   command line or the API ("Pro, Max, and Team plans include a set dollar amount of usage credits each month."). Early
#   access on Max: "Early access to the newest models".
# - Not stated by any page read: a coding agent of its own (its "ollama launch" starts other companies' agents: Claude
#   Code, Codex, OpenCode), memory across chats, projects, voice conversations, deep research, scheduled tasks, computer
#   use, code completion, office apps, video generation.
# - Developer: Ollama is a tool to "build with open models" (its home page: "Ollama is the most popular way to build with
#   open models."), so its plans are in developer too; no developer feature applies.
# General features, read 2026-11-17: platforms: macOS, Linux and Windows (its download page); no mobile app and no web
# app (ollama.com has no chat). Sign-in: an email address with a password ("Account information (names, email addresses,
# user ID, passwords and other similar data)", its privacy policy), or "Continue with Google" and "Continue with GitHub"
# (its sign-in page); Free needs no account for local models. Support: email ("Reach us by email", its support page) and
# its Discord and Reddit communities. App languages: no page lists them, so none. Open source and self-hostable: the
# server you run yourself is the product ("Ollama runs on your local device."), and its documentation covers Docker and
# Linux servers. No pause (cancel only). No parental controls.
features:
  platforms: [windows, macos, linux]
  account.sign-in: [password, sso]
  support.channels: [email, community]
  software.open-source: open-clients
  software.self-hostable: true

plans:
  - id: ollama.free
    name: Free
    link: https://ollama.com/download
    categories: [ai, developer]
    features:
      ai.assistant: true
      ai.chat-storage: on-device
      ai.model-choice: true
      ai.reasoning: true
      ai.web-search: true
