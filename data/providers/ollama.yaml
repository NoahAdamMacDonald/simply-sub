      ai.audio-generation: true
      ai.integrations: [api, ide, cli, custom-assistants]
    notes: 'Free, open-source software that runs open models on your own Mac, Windows or Linux computer, as much as your hardware allows, with no account needed. Its cloud models are paid by the token from bought usage credits (pay as you go). Image and speech generation run on macOS only for now.'
    prices:
