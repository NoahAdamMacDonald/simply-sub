        - url: https://products.s.kaspersky-labs.com/homeuser/Kaspersky4Win2021/21.27.6.532abc/multilanguage-INT-0.320.0/english-CA/189d40eaa33f428293617bc2d5f3c202/saas_eula_en-ca.txt
