  - rater: av-test
    subject: antivirus-protection
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/kaspersky-lab-premium-21.24--21.25-261411/
    tested: Premium 21.24 & 21.25, Windows 11
  - rater: av-test
    subject: antivirus-performance
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/kaspersky-lab-premium-21.24--21.25-261411/
    tested: Premium 21.24 & 21.25, Windows 11
  - rater: av-test
    subject: antivirus-usability
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/kaspersky-lab-premium-21.24--21.25-261411/
    tested: Premium 21.24 & 21.25, Windows 11

