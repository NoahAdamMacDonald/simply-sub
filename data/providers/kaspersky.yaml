# Researched by hand on 2026-11-13 (M11.15, security batch 1), read from Canada with Edge (each country's plan pages, with
# ?ignoreredirects=true, the switch its own country picker uses) and a plain fetch (its EULA, privacy policy, about,
# transparency and support pages), and its US statement through a US exit. Pages, each quoted where it's used:
# Pricing: each country's /standard, /plus and /premium pages, whose buy block shows the plan's card ("3 Devices | 1
# Year") with a first-year offer and the regular price: "*Introductory price for the first year of your subscription. It
# will renew automatically at $114.99 per year." (Canada; the UK's in £, Australia's "renewed at $99.95/year", whose page
# data names "AUD"; Germany's "verlängert sich automatisch zu 54,99 € pro Jahr", France's "renouvelé automatiquement au
# prix de 34,99 € par an", the Netherlands' "verlengd tegen € 34,99 per jaar", Spain's "Se renovará de forma automática
# a 34,99 € por año", Italy's "Il rinnovo avverrà automaticamente al costo di 34,99 € all'anno"). The renewal price is
# stored. 2- and 3-year terms are first-term offers that renew yearly ("*Then renews at $114.99 per year. Savings compared
# to 2X the annual renewal price of $114.99.", Canada's Premium, 2026-11-13), so only yearly prices are stored.
# Each country's card sells a different device count: Standard 3, Plus 5, Premium 10 in Canada and Australia; Premium 5 in
# the UK and Germany; 1, 3 and 5 in the Netherlands; 1 on every card in France, Spain and Italy. A plan per tier and device
# count, priced where its card sells it (the Coverage notes below). Australia's prices say "All prices are inclusive of
# tax." (taxIncluded). Its purchase FAQ for Canada's store (2Checkout) says only "The price indicated includes anticipated
# VAT"; Canada's prices are stored before tax.
# Region checklist for CA and US, 2026-11-13: 1. country sites (kaspersky.ca, usa.kaspersky.com; its picker's
# ?ignoreredirects=true); 2. each card's device and term picker (Canada's Premium: only 10 devices, 1, 2 or 3 years);
# 3. its page data ("priceList":["ca/en/cad"], "priceCurrency":"CAD"); 4. not opened past "Buy Now"; 5. its purchase FAQ
# for Canada (2Checkout); 6. Edge, a plain fetch, and a US exit; 7. no bill. The US: not sold (Coverage note below).
# New Zealand: its picker's "New Zealand" opens kaspersky.com.au (Australian dollars), so not priced as NZ. Ireland: no
# country site in its picker (not priced).
# Bundles: none found. Official resellers: none named for home plans ("Find a reseller" and "Find a distributor" are its
# business channel's). Amazon gift cards with Premium are an offer, not a plan.
# Free use: its free Virus Removal Tool (a plan) and Rescue Disk (in the tool's notes); its plans' free trials aren't
# plans.
# Not drafted: Kaspersky VPN Secure Connection, Password Manager and Safe Kids sold alone, and its older Anti-Virus,
# Internet Security and Total Security (updates only: "Still using our previous products plans?").

# Not sold in the US: Kaspersky stopped selling there in 2024 under a US government ruling ("In conformity with the
# Final Determination by the U.S. Department of Commerce, Kaspersky announces it has stopped sales contracts of its
# anti-virus software and cybersecurity products in the United States ahead of July 20, 2024.", its statement of July 18,
# 2024 on usa.kaspersky.com, read 2026-11-13 through a US exit), so each paid plan's notSoldIn names the US (M11.20).
# No official country list exists, so no availableIn; the free Virus Removal Tool is priced for everywhere.
# Coverage: kaspersky.standard in FR, NL, ES and IT: their Standard card is for 1 device, kaspersky.standard-1-device.
# Coverage: kaspersky.standard-1-device in CA, AU, GB and DE: their Standard card is for 3 devices, kaspersky.standard.
# Coverage: kaspersky.plus in FR, NL, ES and IT: their Plus card is for 1 device (3 in the Netherlands).
# Coverage: kaspersky.plus-3-devices in CA, AU, GB, DE, FR, ES and IT: only the Netherlands' Plus card is for 3 devices.
# Coverage: kaspersky.plus-1-device in CA, AU, GB, DE and NL: their Plus card is for 5 devices (3 in the Netherlands).
# Coverage: kaspersky.premium in GB, DE, NL, FR, ES and IT: their Premium card is for 5 devices (1 in France, Spain, Italy).
# Coverage: kaspersky.premium-5-devices in CA, AU, FR, ES and IT: their Premium card is for 10 devices (1 in France, Spain
# and Italy).
# Coverage: kaspersky.premium-1-device in CA, AU, GB, DE and NL: their Premium card is for 10 or 5 devices.

id: kaspersky
name: Kaspersky
website: https://www.kaspersky.com
# Its country sites (each one's own prices) and its EULAs' host.
domains:
  [
    kaspersky.ca,
    kaspersky.co.uk,
    kaspersky.com.au,
    kaspersky.de,
    kaspersky.fr,
    kaspersky.nl,
    kaspersky.es,
    kaspersky.it,
    kaspersky-labs.com,
  ]
category: security
spendCategory: software
billingCurrency:
  { CA: CAD, GB: GBP, AU: AUD, DE: EUR, FR: EUR, NL: EUR, ES: EUR, IT: EUR, GLOBAL: USD }
# Its purchase FAQ for Canada's store: "Click the “Stop auto-renewal” button to cancel the Auto-Renewal plan."
cancelUrl: https://support.kaspersky.com/us/faq/faq_sales_2checkout_ca
sources: { pricing: https://www.kaspersky.ca/premium }
# Owner (M11.2), read 2026-11-13: Kaspersky's holding company is Kaspersky Labs Limited, a UK private company, from its
# own strategic report on media.kaspersky.com (the newest on its site is for financial year 2020). The software's
# rightholder is its Russian subsidiary: "Rightholder (owner of all rights, whether exclusive or otherwise, to the
# Software) means AO Kaspersky Lab, a company incorporated according to the laws of the Russian Federation." (its EULA),
# which is also its privacy policy's controller, in Moscow. Both are shown (the owner's choice, 2026-11-13): the holding
# company as the owner, and the Russian rightholder in the provider's notes.
notes: Its holding company is Kaspersky Labs Limited in the UK (its newest report on its site is from 2020). The software and your data are AO Kaspersky Lab's, a company in Russia (its licence and privacy policy).
owner:
  name: Kaspersky Labs Limited
  page:
    name: Strategic Report and Corporate Governance Report (Kaspersky Labs Limited, 2020)
    url: https://media.kaspersky.com/en/Strategic%20Report%20and%20Corporate%20Governance%20Report%20Kaspersky%20Labs%20Limited.pdf
  quotes:
    - 'Kaspersky Labs Limited (the “Company”), a private company limited by shares, and its subsidiaries'
    - 'registered in the United Kingdom.'
  country:
    code: GB
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: its purchase FAQ for Canada's store (2Checkout, which bills it: "The charge for your
# order will appear on your credit card as: 2CO*, 2CO, 2Checkout."). Other countries' stores' FAQs weren't read.
acceptedNetworks:
  CA:
    networks: [mastercard, visa, amex]
    url: https://support.kaspersky.com/us/faq/faq_sales_2checkout_ca
    quotes: ['We accept payment by credit cards of Mastercard, Visa, American Express, Paypal.']
paymentMethods:
  - methods: [card, paypal]
    regions: [CA]
    page: Frequently asked questions about purchasing
    url: https://support.kaspersky.com/us/faq/faq_sales_2checkout_ca
    quotes:
      - 'We accept payment by credit cards of Mastercard, Visa, American Express, Paypal.'
# Renewal day (M11.5): its subscription terms charge "15 days before your subscription ends", a day core's renewal kinds
# don't have, so not-stated (notes.md).
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.kaspersky.ca/premium
  lastVerified: 2026-11-13
# Lab results (M11.2), read 2026-11-13: AV-TEST's newest Windows test of home-user products, July and August 2026 (report
# 261411). AV-Comparatives' and SE Labs' aren't listed (data/raters.yaml).
