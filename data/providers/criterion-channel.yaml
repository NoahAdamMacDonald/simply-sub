# Researched by hand on 2026-11-13 (M11.15, streaming batch 7), read with Edge from Canada, its plan page again through a
# US exit, criterion.com (its terms, privacy policy and FAQ, behind Cloudflare's check) in Edge with a visible window,
# and its help centre (criterionchannel.zendesk.com, every article) through its Zendesk API. Pages, each quoted where
# it's used:
# Pricing: its plan page (criterionchannel.com/subscribe), which sends a Canadian reader to ca.criterionchannel.com:
# "Annual", "US$99.99 / year" and "Monthly", "US$10.99 / month" (its plan data: "price":"US$99.99", "price":"US$10.99");
# through a US exit www.criterionchannel.com/subscribe shows "$99.99 / year" and "$10.99 / month". Its help centre's
# "How much is a Criterion Channel subscription?": "Monthly subscription: $10.99 USD", "Annual subscription: $99.99 USD",
# "This subscription rate does not include any applicable taxes for your region." and "Our pricing is in USD, as we are
# a US-based company. Subscription charges will be converted to CAD by your bank or credit card issuer at the time of
# the charge.", so Canada is priced in US dollars. criterion.com's Channel FAQ gives the same two prices. The 7-day free
# trial isn't a price. Not listed: gift subscriptions (criterionchannel.com/buy-a-gift, "Annual US$99.99 / year"), a
# prepaid year rather than a plan of its own.
# Region checklist for CA and US, 2026-11-13: 1. its country hosts (ca.criterionchannel.com for Canada, www for the US;
# no locale paths, no hreflang); 2. no picker; 3. the plan page's data (the same US-dollar prices on both hosts); 4. the
# plan picker up to the account form (login.criterion.com's "Create Your Criterion Account": an email address), typing
# nothing; 5. its help centre's price article (USD for Canada, tax added); 6. Edge from Canada, a plain fetch, and Edge
# through a US exit; 7. no bill offered. Other countries: not sold (its help centre and terms, below).
# Bundles: none: its plan page sells the two periods only, and its help centre and criterion.com name no bundle.
# Official resellers: none; it sells gift subscriptions itself. Apple's App Store, Google Play, Amazon (Fire TV) and Roku
# bill it in its apps (partners, not resellers).
# Features, read 2026-11-13: "all ad-free" (the plan page); "You can log in and stream on up to three devices at the same
# time under one Criterion Channel subscription." (What devices can I watch The Criterion Channel on?); Criterion 24/7,
# "a 24/7 live channel" that "runs continuously, offering an “always-on” experience similar to traditional TV" (How to
# Watch and What to Expect), a linear channel as STARZ's live stream is. Video quality: no page names its best quality;
# "To view HD you will need to have higher download speeds." (What can I do if the stream quality is bad?), so 720p
# (HD), inferred as BritBox's and Hayu's; its troubleshooting article's speed table lists 240p up to "4K and higher" only
# as a reference. Downloads: only its app store listings (Apple's and Google Play's) say "Download movies and extras you
# love for offline viewing", and no page on its own sites does, so no streaming.download-devices. No page names profiles
# or parental controls (its help centre, terms, privacy policy and FAQs read). Pausing: "You may cancel or pause your
# subscription at any time." (its help centre's price article and criterion.com's Channel FAQ). What it streams: "an
# eclectic mix of classic and contemporary films from Hollywood and around the world" and "original programming
# exclusive to the service" (What is The Criterion Channel?), its "Documentaries" category and its series pages
# (criterionchannel.com/series/...); none of your own media.
# Free use: none: a 7-day trial that turns into the plan ("A Criterion Channel subscription starts with a one-time 7-day
# free trial"); without a subscription you can only browse and watch trailers and teasers.

# Coverage: criterion-channel.* in AS, GU, MP, PR and VI: its terms sell it to those who "reside in the United States
# (including its territories and possessions)", but no page names a territory's price; its plan page through a US exit
# showed the US's (2026-11-13).

id: criterion-channel
name: The Criterion Channel
website: https://www.criterionchannel.com
# Its help centre, which criterionchannel.com/support opens.
domains: [criterionchannel.zendesk.com]
category: streaming
spendCategory: streaming
# "the Criterion Channel is available only in the U.S. and Canada at this time." (If I live outside of the United States
# and Canada, can I stream movies from the Criterion Channel?), and its terms (1.3): "The Services are intended for
# individuals who are 18 years of age or older and reside in the United States (including its territories and
# possessions) or Canada." The five inhabited territories are listed, as STARZ's are.
availableIn: [CA, US, AS, GU, MP, PR, VI]
billingCurrency: { CA: USD, US: USD }
cancelUrl: https://criterionchannel.zendesk.com/hc/en-us/articles/29448929126940-How-do-I-cancel-my-subscription
sources: { pricing: https://www.criterionchannel.com/subscribe }
notes: Priced in US dollars in Canada too. 7 days free for new subscribers.

# Owner (M11.2), read 2026-11-13: criterion.com's Channel FAQ calls the Channel "our streaming platform"; its Terms of Use
# (which criterionchannel.com/terms-of-use opens) are "a legal agreement between you and Criterion Janus Holdings LLC",
# and its privacy policy's controller is Criterion Collection LLC. Janus Films is its sister company ("The companies
# have similar missions but focus on different markets.", criterion.com's FAQ). No page read names shares or a listing:
# a private company, no stock.
owner:
  name: 'The Criterion Collection (Criterion Janus Holdings LLC)'
  website: https://www.criterion.com
  page:
    name: 'FAQ: Channel Support (The Criterion Collection)'
    url: https://www.criterion.com/faq/channel
  quotes:
    - 'CriterionChannel.com is our streaming platform and requires a subscription for access.'
    - 'In addition to hosting a rotating selection from the Criterion Collection and Janus Films’ celebrated library of more than 1,500 films'
  country:
    code: US
    page:
      name: Terms of Use
      url: https://www.criterion.com/terms
    quotes:
      - 'The Services are controlled and operated by Criterion from the United States.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13

