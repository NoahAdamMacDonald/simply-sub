    - https://criterionchannel.zendesk.com/hc/en-us/articles/29453282356508-How-do-I-update-my-account-details
  lastVerified: 2026-11-13
freeUse:
  kind: none
  pages:
    - https://www.criterionchannel.com/subscribe
    - https://criterionchannel.zendesk.com/hc/en-us/articles/29838332177564-How-much-is-a-Criterion-Channel-subscription
    - https://www.criterion.com/faq/channel
  lastVerified: 2026-11-13

# General features, read 2026-11-13. Platforms: Roku, Apple TV, Android and Amazon devices, Xbox, Samsung TVs, iPhone and
# iPad, Android phones, and "a computer web browser" (criterion.com's Channel FAQ; What devices can I watch The Criterion
# Channel on?). Sign-in: an email address, then a password ("Click Sign in in the top right corner of the page and enter
# your email address.", "Underneath the password field, select Reset your password.", I'm having trouble signing in);
# TVs pair with a code entered on criterionchannel.com/activate, where you sign in. Its Criterion.com single sign-on
# ("Criterion.com and CriterionChannel.com accounts are linked and have a Single Sign-On (SSO)") is the same company's
# account, not another company's. App languages: English (its sites and help centre are English only). Support: email
# ("contact channelhelp@criterion.com", "emails are answered Monday to Friday during business hours ET") and its help
# centre's form; its "chatbot" is a bot, not live chat.
features:
  platforms: [web, ios, android, tv, console]
  account.sign-in: [password]
  languages.interface: [en]
  support.channels: [email]

