# Terms and policies (BLUEPRINT §4.10), read 2026-11-13: The Criterion Collection's Terms of Use ("Last update September
# 24, 2026", Criterion Janus Holdings LLC's, under New York law) and Privacy Policy ("Effective September 24, 2026",
# Criterion Collection LLC's, with California, other states' and Canada's notices), both on criterion.com, which
# criterionchannel.com's footer opens; its sign-up form (login.criterion.com, from criterionchannel.com/signup: "By
# clicking “Continue,” you acknowledge that you have read and agree to the Terms & Conditions and confirm that you have
# reviewed our Privacy Policy.", an email address first, read without typing); its Privacy Rights Request Form (for
# residents of the states its policy lists); criterion.com's FAQs; and its help centre's billing, cancelling, refund,
# devices and sign-in articles. Its apps have no licence of their own (the terms' Limited License, 5.2). Not read: its
# list of the third parties it may sell to (criterion.com/cookie-list, which Cloudflare's check kept from loading), the
# cookie settings panel, the steps after the email address, and the terms of the app stores that bill it. Its terms take
# a perpetual, irrevocable licence over anything you submit (5.3), a topic streaming doesn't have. Calibrated against
# STARZ and Nebula.
policies:
  links:
    - name: 'Terms of Use'
      url: https://www.criterion.com/terms
    - name: 'Privacy Policy'
      url: https://www.criterion.com/privacy
    - name: 'Create Your Criterion Account'
      url: https://www.criterionchannel.com/signup
    - name: 'How do I cancel my subscription?'
      url: https://criterionchannel.zendesk.com/hc/en-us/articles/29448929126940-How-do-I-cancel-my-subscription
    - name: 'How do I get a refund?'
      url: https://criterionchannel.zendesk.com/hc/en-us/articles/24806247534236-How-do-I-get-a-refund
    - name: 'How much is a Criterion Channel subscription?'
      url: https://criterionchannel.zendesk.com/hc/en-us/articles/29838332177564-How-much-is-a-Criterion-Channel-subscription
    - name: 'What devices can I watch The Criterion Channel on?'
      url: https://criterionchannel.zendesk.com/hc/en-us/articles/24806312682012-What-devices-can-I-watch-The-Criterion-Channel-on
    - name: "Why hasn't my subscription renewed?"
      url: https://criterionchannel.zendesk.com/hc/en-us/articles/25881167961244-Why-hasn-t-my-subscription-renewed
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It studies how you use the Channel and what you like, with Google Analytics among other tools. You can only limit its cookies, browser by browser and device by device.'
      sources:
        - url: https://www.criterion.com/privacy
          quote: 'Manage, maintain, and operate the Services; diagnose or fix technology problems; monitor the performance of the Services; analyze user preferences and trends; and understand how you access and use the Services.'
        - url: https://www.criterion.com/privacy
          quote: 'We use Google Analytics to collect usage details.'
        - url: https://www.criterion.com/privacy
          quote: 'Please note that you will need to set preferences on each browser and device you use to visit our Services.'
      action:
        name: 'Its privacy choices'
        url: https://www.criterion.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'Its ad partners may let other companies use what they learn about you to market to you, and it builds look-alike audiences for ads. Stopping that takes an email, or cookie settings on each browser.'
      sources:
        - url: https://www.criterion.com/privacy
          quote: 'These partners may allow other companies to access information about you so that they may market other products and services you may be interested in.'
        - url: https://www.criterion.com/privacy
          quote: 'To opt-out of this, please send an email to privacy@criterion.com and include “opt-out” in the subject line'
        - url: https://www.criterion.com/privacy
          quote: 'Please note that you will need to set preferences on each browser and device you use to visit our Services.'
      action:
        name: 'Its privacy choices'
        url: https://www.criterion.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'The Channel has no ads, but Criterion uses Google’s and Meta’s tools to show you its ads based on what you browse. You can only turn that off browser by browser, or ad network by ad network.'
      sources:
        - url: https://www.criterion.com/privacy
          quote: 'We use Google and Meta customize our advertising and to serve you ads based on your browsing behavior.'
        - url: https://www.criterion.com/privacy
          quote: 'Please note that you will need to set preferences on each browser and device you use to visit our Services.'
        - url: https://www.criterion.com/privacy
          quote: 'Please note this does not opt you out of being served ads, nor will it prevent the receipt of interest-based advertising from other companies that do not participate in these programs.'
      action:
        name: 'Its privacy choices'
        url: https://www.criterion.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you write or upload trains AI.'
      pages: [https://www.criterion.com/privacy, https://www.criterion.com/terms]
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information while you’re a customer, and for an unnamed time after you leave for business and legal needs. It names no periods.'
      sources:
        - url: https://www.criterion.com/privacy
          quote: 'Certain information is maintained throughout our relationship with you in order to provide the Services. When we no longer provide Services to you, we may still need this information for a period of time for business and legal requirements.'
        - url: https://www.criterion.com/privacy
          quote: 'Internet or other similar network activity is typically deleted at regular intervals when the information is no longer necessary for the purpose for which it was collected.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      status: not-stated
      reason: 'Its privacy policy lets people in California and some other US states ask for their data to be deleted, but names no way for anyone else, Canadians included.'
      pages: [https://www.criterion.com/privacy]
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      status: not-stated
      reason: 'Its privacy policy names no way to get a copy of your data, except for people in Canada and some US states, who can ask to see it.'
      pages: [https://www.criterion.com/privacy]
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      regions: [CA]
      tier: poor
      reason: 'In Canada you can ask, by form or email, to see and correct your information, but it offers no copy to take elsewhere.'
      sources:
        - url: https://www.criterion.com/privacy
          quote: 'If you are a Canadian resident, subject to applicable law, you have the right to access, update and correct inaccuracies in, and withdraw consent to our collection, use and disclosure of, your personal information in our custody or control.'
        - url: https://www.criterion.com/privacy
          quote: 'You may submit a request to exercise your rights by using the Privacy Rights Request Form or by contacting us via email at privacy@criterion.com.'
      action:
        name: 'How to ask (its privacy policy, Canada)'
        url: https://www.criterion.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: poor
      reason: 'Besides court orders and legal process, it may hand over your information when police or a government simply ask, national security included.'
      sources:
        - url: https://www.criterion.com/privacy
          quote: 'respond to subpoena, court order, or other legal process or request'
        - url: https://www.criterion.com/privacy
          quote: 'in response to court orders, law enforcement or legal process, including for national security purposes, which may include lawful access by U.S. or foreign courts, law enforcement or other government authorities'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: poor
      reason: 'If you live outside the US, your information can be stored and used outside your country, the US included, and it doesn’t say what protects it there.'
      sources:
        - url: https://www.criterion.com/privacy
          quote: 'If you access or use our Services outside of the United States, you understand that we and our service providers may access, collect, process, and store your personal information outside of the jurisdiction in which you reside, including in the United States.'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Signing up asks for an email address and a password you choose; its policy says an account also holds your name, and a paid plan needs your payment details.'
      sources:
        - url: https://www.criterionchannel.com/signup
          quote: 'Email address *'
        - url: https://www.criterion.com/terms
          quote: 'During the registration process, you must select a password.'
        - url: https://www.criterion.com/privacy
          quote: 'Account information, including your name, email address, selected password, and content preferences.'
      lastVerified: 2026-11-13
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 18 to use it. It doesn’t say what it does with a child’s information it finds, and offers no kids’ profiles or parental controls.'
      sources:
        - url: https://www.criterion.com/terms
          quote: 'The Services are intended for individuals who are 18 years of age or older and reside in the United States (including its territories and possessions) or Canada.'
        - url: https://www.criterion.com/terms
          quote: 'You must be at least eighteen (18) years of age or older to register for an account.'
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: poor
      reason: 'It says only that it uses safeguards and can’t guarantee security. It names no outside checks and no way to report a security problem.'
      sources:
        - url: https://www.criterion.com/privacy
          quote: 'We use a combination of physical, technical, and administrative safeguards to protect the information we collect through the Services.'
        - url: https://www.criterion.com/privacy
          quote: 'we cannot guarantee the security of the networks, systems, servers, devices, and databases we operate or that are operated on our behalf.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online in a few clicks and keep watching until the time you paid for runs out, but you must cancel by the day before it renews.'
      sources:
        - url: https://criterionchannel.zendesk.com/hc/en-us/articles/29448929126940-How-do-I-cancel-my-subscription
          quote: 'Under Current plan, choose Cancel Subscription.'
        - url: https://criterionchannel.zendesk.com/hc/en-us/articles/29448929126940-How-do-I-cancel-my-subscription
          quote: 'You will continue to have access through the duration you already paid for or your free trial.'
        - url: https://www.criterion.com/terms
          quote: 'You must cancel your subscription on the day before your next recurring billing date in order to avoid being charged for the next billing period.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'If you paid on its website, you can ask for a refund within 7 days of a monthly charge or 30 days of a yearly one, but it decides case by case and never refunds part of a period.'
      sources:
        - url: https://criterionchannel.zendesk.com/hc/en-us/articles/24806247534236-How-do-I-get-a-refund
          quote: 'Annual subscriptions: within 30 days of billing'
        - url: https://criterionchannel.zendesk.com/hc/en-us/articles/24806247534236-How-do-I-get-a-refund
          quote: 'Monthly subscriptions: within 7 days of billing'
        - url: https://criterionchannel.zendesk.com/hc/en-us/articles/29838332177564-How-much-is-a-Criterion-Channel-subscription
          quote: 'Please contact us and we will review your request on a case by case basis.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you about a new price before your next billing date, without saying how far ahead, and you can cancel if you don’t accept it.'
      sources:
        - url: https://www.criterion.com/terms
          quote: 'We will give you advance notice of any price change prior to the next billing date, but we will not be able to notify you of any changes in applicable taxes or fees.'
        - url: https://www.criterion.com/terms
          quote: 'If you do not wish to accept a price change, you may cancel your subscription in accordance with Section 3.4 below.'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: poor
      reason: 'Every plan starts with a 7-day free trial that charges your card when it ends, and it needn’t remind you first.'
      sources:
        - url: https://criterionchannel.zendesk.com/hc/en-us/articles/29838332177564-How-much-is-a-Criterion-Channel-subscription
          quote: 'After your free trial ends, your credit card will be charged at either the monthly or annual rate you selected when you registered for an account.'
        - url: https://www.criterion.com/terms
          quote: 'You may not receive separate notice that your Trial Period is about to end or has ended or that your paid or full price subscription to the Services has begun unless such notice is required by applicable law.'
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say a monthly or yearly plan renews on its own, but not that it reminds you first.'
      pages:
        - https://www.criterion.com/terms
        - https://criterionchannel.zendesk.com/hc/en-us/articles/25881167961244-Why-hasn-t-my-subscription-renewed
      lastVerified: 2026-11-13
    - topic: billing.fees
      tier: poor
      reason: 'It charges the price plus “applicable taxes and fees” it doesn’t describe, and Canadians pay in US dollars, so their bank may add a conversion fee.'
      sources:
        - url: https://www.criterion.com/terms
          quote: 'AT THE THEN-CURRENT SUBSCRIPTION FEE (PLUS APPLICABLE TAXES AND FEES)'
        - url: https://criterionchannel.zendesk.com/hc/en-us/articles/29838332177564-How-much-is-a-Criterion-Channel-subscription
          quote: 'We cannot predict any conversion rates or fees collected by your bank or card issuer.'
      lastVerified: 2026-11-13
    - topic: legal.disputes
      tier: good
      reason: 'Disputes go to a court in New York, not a private referee, but you give up class actions and a jury trial, and must bring a claim within a year.'
      sources:
        - url: https://www.criterion.com/terms
          quote: 'You and Criterion agree that any complaint, dispute, or disagreement, whether based on past, present, or future events, arising out of or related in any way to these Terms, any use of the Services, or User Content will be resolved in New York federal or state (including small claims) court.'
        - url: https://www.criterion.com/terms
          quote: 'ANY RIGHT TO PURSUE OR TO PARTICIPATE AS A PLAINTIFF OR AS A CLASS MEMBER IN ANY LEGAL ACTION, PROCEEDING, CAUSE OF ACTION OR COUNTERCLAIM ON A CLASS OR CONSOLIDATED BASIS OR IN A REPRESENTATIVE CAPACITY.'
        - url: https://www.criterion.com/terms
          quote: 'must be filed within one (1) year after such claim or cause of action arose or be forever barred.'
      lastVerified: 2026-11-13
    - topic: legal.terms-changes
