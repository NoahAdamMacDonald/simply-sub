# Researched by hand on 2026-11-11 (M11.15, streaming batch 6), read with Edge from Canada, its help centre also through
# its Zendesk API (tubitvhelp.zendesk.com), and its home page through each catalog country's exit. Pages, each quoted
# where it's used:
# Pricing: none to read: "Tubi is a 100% free, 100% legal streaming service." and "We never ask for any credit card
# information and have no way of charging you for anything, ever." (Is Tubi really free and legal?); "Right now, we
# don’t have an ad-free option." (Why are there ads? Can I remove them?). So its one plan is free, priced 0 in each of
# the catalog's countries its about page names: "Tubi is available in the US, Canada, Mexico, LATAM, United Kingdom and
# Australia." (corporate.tubitv.com). Mexico, Puerto Rico and its Latin American countries are outside the catalog's
# regions, so they're in availableIn without a price.
# Region checklist, 2026-11-11: 1. no country paths (tubitv.com everywhere; Mexico's exit got tubitv.com/es-mx); 2. a
# language picker only; 3. not needed (nothing is priced); 4. no checkout; 5. its help centre's country device lists;
# 6. Edge from Canada and through each country's exit: the US's and the UK's home pages showed Tubi; German, French,
# Spanish, Italian, Dutch and Irish exits got "Unfortunately, we're not currently available in your area." (gdpr.tubi.tv),
# New Zealand's a blank page, and three Australian exits the same message or a blank page, though its about page and
# help centre sell it there: "Disconnect any VPN — Tubi uses your IP to determine location, and VPNs can show the wrong
# library or block playback entirely" (Why Is Content Unavailable in My Region?), so the official list decides;
# 7. no bill offered.
# Ways to pay: none ("no way of charging you for anything, ever"), so no paymentMethods and no renewal day.
# Bundles: none (nothing is sold). Official resellers: none.
# Features, read 2026-11-11: what it streams, from its about page ("Hollywood movies and TV shows, thousands of
# creator-led stories and hundreds of Tubi Originals"), its help centre's live news and live sports channels (US) and
# Tubi Kids, and Canada's categories ("Documentaries", "Reality TV", "Shonen Anime", "Creatorverse", "Films et séries
# français"). Video quality: "Yes. The stream will be available in 4K UHD on supported devices." (Eagles vs. Cowboys on
# Tubi, a US live game); otherwise its web player switches "SD" and "HD". Streams at once: no page says (its help
# centre's 66 English articles, searched for "same time", "simultaneous", "devices at once"), and CableTV.com's review
# says only "Don’t expect Cloud DVR and simultaneous streams", with no number, so it waits in core's
# awaitingRequiredFeatures. No downloads: "You cannot download videos from Tubi or watch offline at this time." Profiles:
# "Multiple Accounts gives up to 8 people with access to Tubi on a supported device their own Tubi experience", each
# with "its own separate watch history, recommendations, watchlist", from a "Who’s Watching" screen: separate free
# accounts rather than one account's profiles, so 8, inferred. Kids: Tubi Kids Accounts, "linked to and supervised by
# your Tubi Account", with an age rating and "an optional 4-digit PIN" (Multiple Accounts & Tubi Kids), and parental
# controls set with your password (Modify Tubi Parental Controls settings). No pause (nothing to pause).
id: tubi
name: Tubi
website: https://tubitv.com
category: streaming
spendCategory: streaming
# "Tubi is available in the US, Canada, Mexico, LATAM, United Kingdom and Australia." (corporate.tubitv.com), its LATAM
# being "Costa Rica, Ecuador, El Salvador, Guatemala & Panama" (Supported Devices in LATAM), and Puerto Rico has its own
# list (Supported Devices Outside of the US).
availableIn: [US, CA, MX, PR, CR, EC, SV, GT, PA, GB, AU]
# Nothing to cancel: its help centre's article on deleting your account.
cancelUrl: https://tubitv.com/help-center/App-Features-and-Settings/articles/115000190954
sources: { pricing: https://corporate.tubitv.com/ }
notes: Free with ads, with no paid plan.
# Owner (M11.2), read 2026-11-11: its about page; its terms are with Tubi, Inc. (San Francisco). Fox Corporation's
# country and shares from its own investor news (investor.foxcorporation.com, on its site). No page read names a
# majority holder.
owner:
  name: 'Fox Corporation'
  website: https://www.foxcorporation.com
  page:
    name: 'About Tubi'
    url: https://corporate.tubitv.com/
  quotes:
    - 'Headquartered in San Francisco and founded in 2014, Tubi is part of Tubi Media Group, a division of Fox Corporation.'
  country:
    code: US
    page:
      name: 'Fox Corporation Completes Acquisition of Roku'
