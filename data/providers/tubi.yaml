    quotes:
      - 'New York, NY – November 6, 2026 – Fox Corporation (Nasdaq: FOXA, FOX)'
    lastVerified: 2026-11-11
  stock:
    listings:
      - { exchange: Nasdaq, symbol: FOXA }
      - { exchange: Nasdaq, symbol: FOX }
    page:
      name: 'Fox Corporation Completes Acquisition of Roku'
      url: https://investor.foxcorporation.com/news/business/2026/fox-corporation-completes-acquisition-of-roku/
    quotes:
      - 'New York, NY – November 6, 2026 – Fox Corporation (Nasdaq: FOXA, FOX)'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11

# Sign-in (2026-11-11): "Register via Facebook, Google, or Register via email" on the web, and "via Google, Facebook,
# Apple, or Email" in its apps; on TVs, "Sign in with a link sent to your email" (How do I sign up and log into my Tubi
# account on my device?). No two-step sign-in on any page. Platforms: Fire TV, Android, Android TV, Apple TV, iPhone and
# iPad, smart TVs, Roku, "Playstation 4 and 5", "Xbox One, Series S, Series X" and "Web - tubitv.com" (Tubi Supported
# Devices in the US), and "Windows" (Supported Devices In the UK; its site's "Open the Windows Tubi app"). App languages:
# "United States: English, Spanish", "Canada: English, French", "Mexico & Latin America: Spanish" (Language Settings Now
# Available on Web). Support: "Email Us" and "Chat With Us" on its help centre's pages (no phone: "Tubi does not offer
# phone support").
features:
  platforms: [web, windows, ios, android, tv, console]
  account.sign-in: [password, email-code, sso]
  languages.interface: [en, es, fr]
  support.channels: [email, chat]

