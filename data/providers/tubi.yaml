# Terms and policies (BLUEPRINT §4.10), read 2026-11-11 (M11.15) in Edge from Canada: its Terms of Use ("Effective as of
# March 3, 2026"), its Privacy Policy ("Last Updated/Effective Date: July 1, 2026"), which the terms include, Your Privacy
# Choices and its Cookies page; its help centre's articles on signing up, deleting an account and Multiple Accounts &
# Tubi Kids; and Fox Corporation's Responsible Vulnerability Disclosure Policy (foxcorporation.com, its owner's). Through
# a UK exit its terms page showed an older version ("Effective as of July 1, 2024") with the same arbitration clause: no
# grade changes. Calibrated against HBO Max and discovery+ (the same mass-arbitration opt-out), Paramount+ and CBC Gem.
# The UK's own cookie consent (its help centre's "How do I update my consent preferences?", en-gb) wasn't rated. Not read:
# the sign-up form's own fields (they open in a dialog after a choice of Facebook, Google or email), so the help centre's
# list is quoted, and the privacy request forms, which are OneTrust's (privacyportal.onetrust.com), not linked.
policies:
  links:
    - name: 'Terms of use'
      url: https://tubitv.com/static/terms
    - name: 'Privacy policy'
      url: https://tubitv.com/static/privacy
    - name: 'Your privacy choices'
      url: https://tubitv.com/privacy/your-privacy-choices
    - name: 'How do I sign up and log into my Tubi account?'
      url: https://tubitv.com/help-center/Setup-and-Troubleshooting/articles/4410093711131
    - name: 'How do I delete my account?'
      url: https://tubitv.com/help-center/App-Features-and-Settings/articles/115000190954
    - name: 'How can I watch offline or download videos?'
      url: https://tubitv.com/help-center/Setup-and-Troubleshooting/articles/4410086923803
    - name: 'Responsible vulnerability disclosure policy (Fox Corporation)'
      url: https://www.foxcorporation.com/responsible-vulnerability-disclosure-policy/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you watch, search and visit to improve its services and pick what it shows you, beyond what it needs to run. Opting out is partial: browser by browser, or by asking.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: 'Depending on your interactions with us, these technologies may also be used to collect and store information about your usage of the Tubi Services, such as pages you have visited, search history, and the video and other content you have viewed.'
        - url: https://tubitv.com/static/privacy
          quote: 'to measure, maintain and improve those Tubi Services and features and to develop new products and services, including conducting research and quality and safety assurance measures;'
        - url: https://tubitv.com/static/privacy
          quote: 'To opt out of Google Analytics specifically, please go to tools.google.com/dlpage/gaoptout.'
      action:
        name: 'Its privacy policy'
        url: https://tubitv.com/static/privacy
      lastVerified: 2026-11-11
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your device’s ad ID, IP address and other identifiers with advertising companies, and your information with partners for their marketing. You opt out device by device.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: 'This may include, for example, sharing certain information with advertising technology companies (e.g., identity partners), such as an advertising identifier for your device, IP address, or a “hash” of an identifier (i.e., a value generated using a cryptographic hash algorithm.)'
        - url: https://tubitv.com/static/privacy
          quote: 'Tubi may share information we collect about you as described in this Privacy Policy with business partners to permit them to send you marketing communications consistent with your choices.'
        - url: https://tubitv.com/privacy/your-privacy-choices
          quote: 'You will need to follow these opt-out instructions for each of your devices.'
      action:
        name: 'Your privacy choices'
        url: https://tubitv.com/privacy/your-privacy-choices
      lastVerified: 2026-11-11
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It and its partners pick ads from what you do, on Tubi and elsewhere, across your devices. Turning that off has to be done device by device and browser by browser.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: 'Tubi and our service providers may use the information we collect from and about you as described in this Privacy Policy to deliver and measure more relevant, personalized ads to you when you use the Tubi Services or another service (on any of your devices).'
        - url: https://tubitv.com/privacy/your-privacy-choices
          quote: 'Because interest-based advertising relies on cookies and other similar technologies, opting out needs to be controlled at the device and/or browser level.'
      action:
        name: 'Your privacy choices'
        url: https://tubitv.com/privacy/your-privacy-choices
      lastVerified: 2026-11-11
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you post or write trains AI.'
      pages: [https://tubitv.com/static/privacy, https://tubitv.com/static/terms]
      lastVerified: 2026-11-11
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it decides it needs it, and backups for a while after you leave, with no periods named.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: 'We will retain your information for the period necessary to fulfill the purposes outlined in this Privacy Policy unless a longer retention period is required or allowed by law.'
        - url: https://tubitv.com/static/privacy
          quote: 'We may also retain backup information related to your account on our servers for some time after cancellation or your request for deletion, for fraud detection or to comply with applicable law or our internal security or recordkeeping policies.'
      lastVerified: 2026-11-11
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can delete your account in its settings, or ask for your information to be deleted, with no stated time; it says it can’t always delete all of it.'
      sources:
        - url: https://tubitv.com/help-center/App-Features-and-Settings/articles/115000190954
          quote: 'Scroll to the bottom and click Delete My Account.'
        - url: https://tubitv.com/static/privacy
          quote: 'We will try to comply with your request as soon as reasonably practicable and consistent with applicable law.'
        - url: https://tubitv.com/static/privacy
          quote: 'It may not always be possible to completely remove or delete all of your information due to technical constraints or contractual, financial, or legal requirements.'
      action:
        name: 'How do I delete my account?'
        url: https://tubitv.com/help-center/App-Features-and-Settings/articles/115000190954
      lastVerified: 2026-11-11
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask for the information it holds about you with a request form, answered as soon as it reasonably can within the law; there’s no way to download it yourself.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: 'If you would like to access personal information we hold about you, delete, or correct personal information that you have previously provided directly to us, please visit www.tubitv.com/privacy/mydata or www.tubitv.com/privacy/delete or www.tubitv.com/privacy/correction and submit a request.'
      action:
        name: 'Its privacy policy'
        url: https://tubitv.com/static/privacy
      lastVerified: 2026-11-11
    - topic: privacy.government-requests
      tier: poor
      reason: 'Besides what the law requires, it may hand your information to public and government authorities simply because they ask, when it believes that’s needed.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: '(iv) comply with the law or legal process; or (v) respond to requests from public and government authorities.'
      lastVerified: 2026-11-11
    - topic: privacy.data-location
      tier: poor
      reason: 'Your information is handled in the US and any other country where it or its suppliers work, whose laws may protect it less, and it describes no safeguards.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: 'If you are a user located outside the United States, you understand and consent to having any personal information processed in the United States or in any other country in which we have facilities or in which we engage service providers.'
        - url: https://tubitv.com/static/privacy
          quote: 'The United States and other countries’ data protection laws may not be the same as those in your jurisdiction.'
      lastVerified: 2026-11-11
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You can watch without an account. An account by email asks for your name, birthday, gender, email address and a password.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: 'This Privacy Policy applies to all users, including both those who use the Tubi Services without being registered with the Tubi Services and those who have registered an account with the Tubi Services.'
        - url: https://tubitv.com/help-center/Setup-and-Troubleshooting/articles/4410093711131
          quote: 'If you tapped on Register via Email: enter your Name, Birthday, Gender, Email, and Password.'
      lastVerified: 2026-11-11
    - topic: privacy.children
      tier: neutral
      reason: 'Kids’ accounts and Kids Mode get only ads chosen by the show, not by what the child does. Teens need a parent’s consent, but it doesn’t say they’re spared ads picked for them.'
      sources:
        - url: https://tubitv.com/static/privacy
          quote: 'To show contextual ads, to limit how many times a user sees the same ad, and to measure performance.'
        - url: https://tubitv.com/static/terms
          quote: 'If you are at least 13 and under 18 years of age, you may use or create an Account with Tubi only if you have the consent of your parent or guardian'
      lastVerified: 2026-11-11
    - topic: security.practices
      tier: neutral
      reason: 'Its owner, Fox, takes reports of security flaws by email and aims to answer within 30 days, but names no independent audit of Tubi.'
      sources:
        - url: https://www.foxcorporation.com/responsible-vulnerability-disclosure-policy/
          quote: 'If you believe you have found a security vulnerability impacting Fox Corporation, we encourage you to let us know right away.'
        - url: https://www.foxcorporation.com/responsible-vulnerability-disclosure-policy/
          quote: 'Agrees to investigate and attempt to resolve the issue quickly, and do our best to respond within 30 days, or sooner if possible; and'
        - url: https://tubitv.com/static/privacy
          quote: 'Tubi uses commercially reasonable administrative, technical, personnel, and physical measures designed to safeguard information in its possession against loss, theft and unauthorized use, disclosure, or modification.'
      lastVerified: 2026-11-11
    - topic: legal.disputes
      tier: poor
      reason: 'You must take any dispute to private arbitration, one person at a time, with no class actions or jury. You can opt out of arbitration only if a mass arbitration leaves your claim unresolved.'
      sources:
        - url: https://tubitv.com/static/terms
          quote: 'YOU AND TUBI WAIVE THE RIGHT TO BRING OR PARTICIPATE IN A CLASS ACTION IN CONNECTION WITH SUCH DISPUTES.'
        - url: https://tubitv.com/static/terms
          quote: 'If your claim is not resolved as part of the Bellwether Arbitration and Global Mediation process outlined above, the parties shall also have the opportunity to opt out of arbitration'
      action:
        name: 'Its arbitration terms'
        url: https://tubitv.com/static/terms
      lastVerified: 2026-11-11
    - topic: legal.terms-changes
      tier: poor
      reason: 'It changes its terms by posting them, and they count at once; using Tubi afterwards means you accept them.'
      sources:
        - url: https://tubitv.com/static/terms
          quote: 'Any modification to these Terms of Use will be effective upon posting on the Tubi Services.'
        - url: https://tubitv.com/static/terms
          quote: 'Your continued access and/or use of the Tubi Services after any such modification is posted constitutes your acknowledgement and acceptance of the Terms of Use, as modified.'
      lastVerified: 2026-11-11
    - topic: legal.account-closure
      tier: bad
      reason: 'It can stop you using Tubi whenever it decides, without warning.'
      sources:
        - url: https://tubitv.com/static/terms
          quote: 'We may terminate your access to and use of the Tubi Services, at our sole discretion, at any time and without notice to you.'
      lastVerified: 2026-11-11
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or end any part of Tubi at any time without notice, and says it isn’t responsible to you if it does.'
      sources:
        - url: https://tubitv.com/static/terms
          quote: 'with respect to any or all users, at any time without notice or liability to you.'
        - url: https://tubitv.com/static/terms
          quote: 'You also agree that Tubi will not be liable to you for any modification, suspension, or discontinuance of any part of the Tubi Services.'
      lastVerified: 2026-11-11
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms and privacy policy don’t say it closes accounts you haven’t used.'
      pages: [https://tubitv.com/static/terms, https://tubitv.com/static/privacy]
      lastVerified: 2026-11-11
    - topic: service.account-sharing
      tier: bad
      reason: 'Anyone can watch without an account, and each person can have their own free one, but its terms say you mustn’t give your password to anyone.'
      sources:
        - url: https://tubitv.com/static/terms
          quote: 'You agree that you will keep your password and Account information secure, that you will not disclose your Account password to anyone else'
      lastVerified: 2026-11-11
    - topic: service.device-limits
      status: not-stated
      reason: 'Its terms and help centre name no limit on devices, and it has no downloads.'
      pages:
        - https://tubitv.com/static/terms
        - https://tubitv.com/help-center/Setup-and-Troubleshooting/articles/4410086923803
      lastVerified: 2026-11-11
