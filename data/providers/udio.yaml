# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2: AI audio), read with Edge from Canada (udio.com's
# pricing page in each of its three currencies, Monthly and Annually, its comparison table from the screenshot, its FAQ
# answers opened one at a time, its home and sign-in pages, its Terms of Service and Privacy Policy) and its help
# centre (help.udio.com, Intercom) with a plain fetch. Pages, each quoted where it's used:
# Pricing: udio.com/pricing has a currency switch (USD, GBP, EUR) that every visitor gets. Read 2026-11-17 through a
# US, a Canadian, a UK, a German, a French, a Dutch, a Spanish, an Italian, an Australian and a New Zealand exit (the
# Irish exit didn't load): every one opens on USD ("$10", "$8/month", "$96 billed annually"), with the same switch. USD:
# Standard $10 a month or $96 a year, Pro $30 or $288 ("* tax rates may vary by location"). GBP: £10 or £96, £30 or
# £288; EUR: €12 or €115.20, €36 or €345.60, both with "* VAT tax collection included in price". The buyer picks the
# currency (Proton's pattern): a GLOBAL price in each. The GBP and EUR prices include VAT, but core's saysTaxIncluded
# doesn't read "VAT tax collection included" yet, so they have no taxIncluded (notes.md). Its terms (revised
# November 12, 2025) still say "you agree to pay us the applicable fees and taxes in U.S. Dollars"; the newer pricing
# page sells in all three (notes.md). The checkout needs an account, so which currency it charges wasn't seen.
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang; 2. the currency switch (no CAD); 3. no pricing
# data naming a country; 4. checkout needs an account; 5. no prices article; 6. Edge from this machine and through a
# Canadian exit, both USD; 7. no bill offered.
# Plans: Free, Standard and Pro. Not listed: the student discount ("50% off for 6 months for students at accredited
# universities", an offer for some buyers), and credits bought as you go ("Purchase 100 credits - $3.00").
# Udio is in a transition since its licence deals with Universal Music Group (October 29, 2025) and Warner Music Group
# (November 19, 2025): "Note that downloading of audio, video, and stems has been disabled", and its terms let you use
# songs only on Udio, for personal, non-commercial purposes (notes.md).
# Bundles: none on its pages. Official resellers: none; its affiliate program refers buyers, it doesn't sell.
# Logo: udio.com's own icon is the source for data:icons.

id: udio
name: Udio
aliases: [udio ai]
website: https://www.udio.com
domains: [help.udio.com]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help article on changing or cancelling (udio.com/account, "Cancel subscription").
cancelUrl: https://help.udio.com/en/articles/10739199-changing-or-canceling-your-subscription
sources: { pricing: https://www.udio.com/pricing }

# Ways to pay (M11.5), read 2026-11-17: its terms name cards; its privacy policy names Stripe as its processor. Its iOS
# app sells the plans too ("purchase and manage your subscription"), but no page says the App Store bills them. No page
# names the card networks, so no acceptedNetworks.
paymentMethods:
  - methods: [card]
    page: Terms of service
    url: https://www.udio.com/terms-of-service
    quotes:
      - 'Payment can be made by credit card, debit card, or other means that we may make available.'

# Owner (M11.2), read 2026-11-17: its terms name Uncharted Labs, Inc., which runs udio.com, and say where it operates.
# Its help centre: "No, they did not." (the record labels didn't buy Udio). Private: no page names a listing.
owner:
  name: 'Uncharted Labs, Inc.'
  page:
    name: Terms of service
    url: https://www.udio.com/terms-of-service
  quotes:
    - 'Please take the time to read these Terms of Service (these “Terms”) for the unchartedlabs.ai and udio.com websites (collectively, the “Websites”) operated on behalf of Uncharted Labs, Inc. (“Company”, “we” or “us”).'
  country:
    code: US
    page:
      name: Terms of service
      url: https://www.udio.com/terms-of-service
    quotes:
      - 'The Services are operated by us in the United States.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its trial article's example renews a year from the day the trial began ("Their
# subscription will be renewed on Feb 10, 2027") and cycles credits on the day the subscription started ("the date
# their full subscription started, not the date they started their trial"); its FAQ: "The credits refresh a month after
# your payment goes through and the plan starts." That's the date you subscribed, but core's renewalWrittenAs doesn't
# read these words: not-stated until it does (notes.md has the same-date block).
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.udio.com/terms-of-service
    - https://help.udio.com/en/articles/13338649-the-subscription-trial
    - https://www.udio.com/pricing
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on its pricing cards and comparison table (ticks read from the screenshot): Free's
# daily and monthly allowance (a paid plan's credits a month are creative.ai-credits), cover art and the tools each
# plan adds.
perks:
  - id: free-credits
    name: 10 credits per day and 100 credits per month (no rollovers)
  - id: songs-at-once-6
    name: Generate up to 6 songs at the same time
  - id: songs-at-once-10
    name: Generate up to 10 songs at the same time
  - id: unlimited-long-songs
    name: Make 2-minute song generations without the limit of 3 per day
  - id: voices
    name: Create songs with Udio's library of Voices, and save and reuse your own
  - id: upload-audio
    name: Upload your own audio files
  - id: artist-styles
    name: Use premium Artist Styles, and blend and reduce Styles
  - id: edit-music-lyrics
    name: Edit music and lyrics
  - id: cover-art
    name: Generate cover art
  - id: upload-cover-art
    name: Upload your own cover art
  - id: song-access-permissions
    name: Adjust song access permissions

# AI features (the AI category's registry) and the creative category's, read 2026-11-17 in its pricing cards, its
# comparison table and its help centre:
# - AI assistant on every plan, as the group its generation features belong to (validation needs it for them): you
#   describe a song in words and it makes it. No page offers a chat or an agent (notes.md).
# - Music generation on every plan ("Create any song. Just imagine it.", home page), with Voices from its library on
#   Standard and Pro ("you cannot upload your own voice as a source at this time", Voices).
# - Cover art on every plan: the table's "Generate cover art" row ticks Free, Standard and Pro. It's art for your song,
#   as a video's sound is part of the clip for Ideogram and Leonardo, so a perk, not image generation.
# - Generative credits a month on the paid plans: "2400 credits per month (monthly credit limit, no rollovers)" and
#   "6000 credits per month (monthly credit limit, no rollovers)" on its cards. Free's allowance is a perk.
# - Creative tools: audio and music production on every plan (extend, remix, trim and Styles on every plan; editing,
#   uploads and Sessions, its timeline editor, on the paid ones as perks).
# - Not offered: video generation, voice conversations, web search, memory, projects, reasoning, other companies'
#   models, an API ("we don't currently offer a public API", Udio public API), early access.
# General features, read 2026-11-17: the web and an iPhone app ("We don't currently have an Android app"); sign-up with
# Google, Discord, X, Apple or an email address that gets a sign-in link ("Udio accounts themselves don't have
# passwords", Changing your password); support through its help centre's messenger and support@udio.com (its privacy
# policy and Deleting your Udio account). No page names the app's languages. No pause and no parental controls: its
# terms and help centre offer neither (16 and over).
features:
  platforms: [web, ios]
  account.sign-in: [email-code, sso]
  support.channels: [chat, email]

