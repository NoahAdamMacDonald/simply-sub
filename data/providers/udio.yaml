# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge: its Terms of Service (last
# revised November 12, 2025), which include its Privacy Policy (effective May 19, 2025) and any third-party software's
# terms; the sign-in page's line ("By continuing, you acknowledge that you (i) agree to the Terms of Service and (ii)
# have read and understood our Privacy Policy."); its help centre's billing, trial, account and partnership articles.
# Not read: the third-party software licence terms the terms mention (none is named), and its cookie banner's partner
# list beyond its text.
policies:
  links:
    - name: Terms of service
      url: https://www.udio.com/terms-of-service
    - name: Privacy policy
      url: https://www.udio.com/privacy-policy
    - name: Changing or cancelling
      url: https://help.udio.com/en/articles/10739199-changing-or-canceling-your-subscription
    - name: The subscription trial
      url: https://help.udio.com/en/articles/13338649-the-subscription-trial
    - name: Deleting your account
      url: https://help.udio.com/en/articles/10739114-deleting-your-udio-account
    - name: Creating an account
      url: https://help.udio.com/en/articles/10739104-creating-a-udio-account
    - name: Changes with Universal Music Group
      url: https://help.udio.com/en/articles/12683565-changes-associated-with-the-universal-music-group-umg-partnership
  ratings:
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online, but at least 7 days before it renews, or you pay for the next period. You keep it until the end of the time you paid for.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'To avoid future subscription charges, you must cancel your subscription 7 days before the subscription period renewal date'
        - url: https://help.udio.com/en/articles/10739199-changing-or-canceling-your-subscription
          quote: "You'll have full use of your subscription until that time."
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back, not even for unused days, but you keep your plan until the period you paid for ends.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'Except as expressly set forth in these Terms, payments for any subscriptions to the Services are nonrefundable and there are no credits for partially used periods.'
        - url: https://www.udio.com/terms-of-service
          quote: 'Following any cancellation by you, however, you will continue to have access to the paid Services through the end of the subscription period for which payment has already been made.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you before a new price applies, “following reasonable notice”, without saying how long before.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'Except as otherwise provided in these Terms, any price changes or changes to your subscription plan will take effect following reasonable notice to you.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      tier: poor
      reason: 'Its 7-day trial turns into a full year’s plan, charged at once, unless you cancel or switch it to monthly first. It doesn’t say it reminds you.'
      sources:
        - url: https://help.udio.com/en/articles/13338649-the-subscription-trial
          quote: 'If not cancelled before the end of the 7 day period, the creator will be immediately charged the full price of an annual subscription unless they previously toggled the subscription period to monthly .'
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own, but not that it reminds you first.'
      pages: [https://www.udio.com/terms-of-service]
      lastVerified: 2026-11-17
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms and help centre name no fees beyond the price and tax.'
      pages:
        - https://www.udio.com/terms-of-service
        - https://help.udio.com/en/articles/10739199-changing-or-canceling-your-subscription
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up starts at once and you pay only the difference for the rest of the month. Moving down starts at your next period.'
      sources:
        - url: https://help.udio.com/en/articles/10739199-changing-or-canceling-your-subscription
          quote: "Upgrades will take place immediately and you'll be charged on a pro-rated basis."
        - url: https://help.udio.com/en/articles/10739199-changing-or-canceling-your-subscription
          quote: 'Regardless of when you initiate it, your downgrade will happen at the beginning of the next monthly or yearly cycle'
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: poor
      reason: "Disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only by email within 30 days of signing up."
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'You understand that by agreeing to these Terms, you and the Company are each waiving the right to trial by jury or to participate in a class action or class arbitration.'
        - url: https://www.udio.com/terms-of-service
          quote: 'The notice must be sent to the Company within thirty (30) days of your first registering to use the Services or agreeing to these Terms; otherwise you shall be bound to arbitrate disputes on a non-class basis in accordance with these Terms.'
      action:
        name: 'How to opt out of arbitration (section 9.6)'
        url: https://www.udio.com/terms-of-service
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: poor
      reason: 'New terms count from the moment they’re posted. It only tries to tell you about big changes, and using Udio afterwards means you accept them.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'The updated Terms will be effective as of the time of posting, or such later date as may be specified in the updated Terms.'
        - url: https://www.udio.com/terms-of-service
          quote: 'If we make changes that are material, we will use reasonable efforts to attempt to notify you, such as by e-mail and/or by placing a prominent notice on the first page of the Website.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: bad
      reason: 'It can suspend or delete your account for any reason or none, with or without warning.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'Additionally, the Company may suspend, disable, or delete your Account and/or the Services (or any part of the foregoing) with or without notice, for any or no reason.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: bad
      reason: 'What you upload comes with a licence that never ends, that Udio can pass on to others, and that it can use to make money and advertise.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'You agree that these rights and licenses are royalty free, fully paid-up, transferable, sub-licensable, assignable, worldwide, perpetual and irrevocable, and include a right for us to make Your Content available to, and pass these rights along to, others'
        - url: https://www.udio.com/terms-of-service
          quote: 'in and in connection with the use, monetization, advertising, promotion, marketing, and improvement of Company’s products and services, including the Services'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: bad
      reason: 'The songs Udio makes for you belong to Udio and its licensors, on every plan, and you may use them only for yourself on Udio, never to earn money.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'You agree that the Company and/or its licensors own all right, title and interest in and to the Services and the Output (including any and all intellectual property rights therein)'
        - url: https://www.udio.com/terms-of-service
          quote: 'you may use Output solely for your personal and non-commercial purposes, provided that you may not download any copies of your Output from the App for any purpose.'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or remove any feature at any time and owes you nothing for it; it turned off downloads for everyone, subscribers included.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'The Company has the right, at any time and without liability, to modify, alter, update or eliminate the features, navigation, appearance, functionality and other elements of the Services'
        - url: https://help.udio.com/en/articles/12683565-changes-associated-with-the-universal-music-group-umg-partnership
          quote: 'Note that downloading of audio, video, and stems has been disabled'
      lastVerified: 2026-11-17
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms say nothing about closing accounts that aren’t used.'
      pages: [https://www.udio.com/terms-of-service]
      lastVerified: 2026-11-17
    - topic: legal.licence
      tier: neutral
      reason: 'You may use Udio and its app for personal, non-commercial use only, and may not copy or take them apart unless the law lets you.'
      sources:
        - url: https://www.udio.com/terms-of-service
          quote: 'You may not do any of the following in connection with your use of the Services, unless applicable laws or regulations prohibit these restrictions or you have our written permission to do so'
        - url: https://www.udio.com/terms-of-service
          quote: 'exploit the Services, any Output, or the outputs of other users for any commercial purpose;'
      lastVerified: 2026-11-17
    - topic: service.software-control
      status: not-stated
      reason: 'Its terms don’t say whether its app updates itself or changes anything else on your device.'
      pages: [https://www.udio.com/terms-of-service]
      lastVerified: 2026-11-17
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its terms make you responsible for your account and allow one free account each, but don’t say whether you may share it.'
      pages: [https://www.udio.com/terms-of-service]
      lastVerified: 2026-11-17
    - topic: service.device-limits
      status: not-stated
      reason: 'Its terms and help centre set no limits on devices. (Downloads, which are off, are graded under taking your data with you.)'
      pages: [https://www.udio.com/terms-of-service]
      lastVerified: 2026-11-17
    - topic: security.practices
      tier: poor
      reason: 'It only says it uses appropriate security, with no outside audit and no way named to report a security problem.'
      sources:
        - url: https://www.udio.com/privacy-policy
          quote: 'We seek to protect your Personal Data from unauthorized access, use and disclosure using appropriate physical, technical, organizational and administrative security measures based on the type of Personal Data and how we are processing that data.'
