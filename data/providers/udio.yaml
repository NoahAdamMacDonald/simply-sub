    - topic: privacy.data-sharing
      tier: poor
      reason: 'It sells or shares your contact, device and browsing data with advertising partners. You can say no only per browser, in its cookie settings or with a privacy signal.'
      sources:
        - url: https://www.udio.com/privacy-policy
          quote: 'We sell or share your Personal Data to the following categories of third parties:'
