# General features, read 2026-11-13. Sign-in: ESET HOME's password, two-factor codes from an authenticator app ("ESET
# HOME supports the TOTP (Time-based One-time password) protocol"), remembered devices ("Forget devices") and Apple or
# Google sign-in ("third-party authentication provided by Apple or Google", its privacy policy). Support: Canada's
# contact page ("Live chat", "Send an email to technical support or sales using our interactive form.", "Phone
# support"). App languages: its Windows apps' installer list (KB3552: English, Français, Deutsch, Italiano, Português,
# 日本語 Japanese, 简体字 simplified Chinese, 한국어 Korean, and others the registry lacks; no Spanish, Hindi or Arabic).
# No pause (auto-renewal is "continuous unless disabled"). Parental controls: ESET Parental Control, in every HOME
# Security tier on Windows and Android, lets a parent filter websites and apps, set time rules and find a child's device.
# Platforms per plan: the tiers cover Windows, macOS, Android, iOS and Android TV (Smart TV Security, KB2393 and ESET
# HOME's "Products and features"); NOD32 "Secures Windows and macOS devices"; Mobile Security is Android's.
# Its password manager: "On October 21, 2025, ESET stopped selling Password Manager." (its End of Life page), so no plan
# sold now has one (password-manager false); subscribers before then keep it until their term ends.
features:
  account.sign-in: [password, totp, trusted-device, sso]
  support.channels: [chat, email, phone]
  languages.interface: [en, fr, de, it, pt, ja, ko, zh]

# Perks (M11.6): what the plan pages list that no feature describes, in their words.
perks:
  - id: secure-data
    name: Encryption of sensitive data and photos
  - id: liveguard
    name: ESET LiveGuard
  - id: ai-chats
    name: Safer AI Chats
  - id: vpn-router
    name: VPN for Router
  - id: metadata-cleanup
    name: Metadata Cleanup
  - id: ssn-tracking
    name: Social Security Number Tracking
  - id: lost-wallet
    name: Lost Wallet Assistance
  - id: app-lock
    name: App Lock

# Features (read 2026-11-13): the plan cards and "Explore all features by platform" on each country's plans page, KB2393's
# table, the VPN page and the NOD32 help.
# - Every tier: "Real-time antivirus protection", Ransomware Shield ("detects and blocks threats that tries to lock you out
#   of your own data"), Anti-Phishing and Safe Browsing, Safe Banking ("secured browser mode"), Firewall and Network
#   Inspector ("test your home router and smart devices for vulnerabilities"), Antispam, Anti-Theft ("Lock and track
#   missing devices"), Parental Control, Webcam Protection and Microphone Monitor, Gamer Mode; on Android, Call Filter and
#   "Anti-Phishing & Anti-Smishing". Behaviour-based detection and scheduled scans from the NOD32 help (HIPS's "Deep
#   Behavioral Inspection"; "Scanning can be configured as a scheduled task from Tools > Scheduler."), which the tiers'
#   Windows apps build on: inferred on the tiers. No cryptomining, vulnerability-scan or optimizer wording on any page.
# - Premium adds ESET LiveGuard, Folder Guard, Secure Data, AI Conversation Security and ESET VPN: "Unlimited VPN data",
#   "Premium includes up to 40 countries", 3 VPN devices, WireGuard, IKEv2, OpenVPN (UDP and TCP) and Stealth, "Firewall
#   with Kill Switch", "Split Tunneling", "No Logs Policy". No published VPN audit, P2P, multi-hop or port forwarding.
# - Ultimate adds Ransomware Remediation ("restore everything in moments"), Identity Protection ("dark web monitoring"),
#   Metadata Cleanup, Website Settings Review, VPN for Router and "server locations in over 70 countries".
plans:
  - id: eset.essential
    name: HOME Security Essential
    link: https://www.eset.com/ca/home/protection-plans/
    features:
      platforms: [windows, macos, android, ios, tv]
      antivirus.devices: 1
      antivirus.ransomware: [blocking]
      antivirus.included: true
      antivirus.real-time: true
      antivirus.behavioural: true
      antivirus.scans: [on-demand, scheduled]
      antivirus.web-protection: true
      antivirus.scam-protection: [web, sms, calls]
      antivirus.network: [firewall, home-network-scan]
      antivirus.secure-browser: true
      antivirus.anti-spam: true
      antivirus.anti-theft: [locate, lock]
      antivirus.activity-modes: true
      parental-control: [content-filtering, screen-time, location]
      account.parental-controls: true
      security.webcam-protection: [webcam, microphone]
    inferred:
      antivirus.behavioural:
        reason: 'The plans'' pages don''t name it. Their Windows app is built on NOD32, whose help says its HIPS "analyzes the behavior of all programs running on the device" (Deep Behavioral Inspection), on by default.'
        page:
          name: HIPS - Host Intrusion Prevention System (NOD32 help)
          url: https://help.eset.com/eav/19/en-US/idh_hips_main.html
        lastVerified: 2026-11-13
      antivirus.scans:
        reason: 'The plans'' pages say only "fast scans". The NOD32 help their Windows app is built on describes scans you start and scans scheduled from Tools > Scheduler.'
        page:
          name: Device scan (NOD32 help)
          url: https://help.eset.com/eav/19/en-US/idh_page_scan.html
        lastVerified: 2026-11-13
    notes: 'Priced for 1 device: each extra device, up to 10, is an extra-device add-on (ESET sells 1 to 10 on one subscription). Its password manager was withdrawn from new subscriptions on 21 October 2025.'
