# Researched by hand on 2026-11-13 (M11.15, security batch 1), read from Canada with Edge and a plain fetch: each country's
# eset.com pages, ESET's own eStore (buy.eset.com), its help centre (help.eset.com), knowledgebase (support.eset.com),
# legal hub, trust centre and AV-TEST's page. Pages, each quoted where it's used:
# Pricing: each country's page holds its eStore's price data for every device count and period (1 to 10 devices on
# Essential and Premium, 5 to 10 on Ultimate, 1 to 5 on NOD32 Antivirus and Mobile Security; 1, 2 or 3 years), shown
# when you pick them: Canada's and the US's /home-store/, the UK's, Australia's and Germany's /home/protection-plans/,
# the Netherlands' /producten/, Italy's home page and /privati/antivirus/, and France's /acheter/ (whose prices load only
# in the browser: read in Edge, picking 1 device and 2 or 3 years). "Price valid for the first term only." and "If a
# savings amount is shown, it describes the difference between the first term’s price and the official list price."
# (Canada's store): the regular price is the struck one where a price is struck (2- and 3-year terms, and the UK's,
# Australia's and the Netherlands' Black Friday cards), else the one shown, and subscriptions renew "using the payment
# details currently on file and standard subscription pricing" (KB6205); the UK's page: "Renews at the regular price."
# Each plan is priced for its smallest device count, and more devices are the extra-device add-on (see addOns). No page
# sells monthly billing. Canada's cart says "excluding Sales tax"; France's prices say "TTC" (taxIncluded).
# Region checklist for CA and US, 2026-11-13: 1. country paths (/ca/, /us/); 2. the store's device and year pickers;
# 3. the eStore price data in each page (internalId CA_EN_…, "CAD", US_EN_…); 4. Canada's cart, up to "PROCEED TO
# CHECKOUT"; 5. KB6205 (auto-renewal, US and Canada) and the subscription FAQ; 6. Edge and a plain fetch; 7. no bill.
# Other countries: ESET's own eStore sells on eset.com/uk, /au, /de, /fr, /nl and /it (priced here). Ireland's page
# sends buyers to mrc.eset.ie, New Zealand's to shop.eset.co.nz and Spain's to comprar.eset.es: country distributors'
# shops, not eset.com's own pages, so not priced (the brief's rule); Ireland's page still lists the withdrawn Password
# Manager and only "from €39.99".
# Bundles: none found (the stores, plan pages and FAQ). Official resellers: none named for home plans; "Find a Reseller"
# is its business channel's, and its return policy says only that "resellers of the ESET product line may have
# different return policies". Google Play bills the Android app's subscription (ESET HOME's "Manage your Google Play
# subscription"): a partner, noted, not listed.
# Free use: two free plans, its Android app's free version and its Online Scanner for Windows.
# Not drafted: ESET Small Business Security and ESET Security for Gamers (small-office and gaming editions), and
# Smart TV Security sold alone (it comes with every HOME Security tier).

# Coverage: eset.ultimate in US: the US sells its own Ultimate, eset.ultimate-us, with identity theft insurance.
# Coverage: eset.ultimate-us in CA, GB, AU, DE, FR, NL and IT: sold in the US only ("It's currently available to customers
# in the United States.", eset.com/us/home/identity-protection).
# Coverage: eset.nod32 in AU, DE and NL: their store pages sell no NOD32 Antivirus (eset.com/au and /de's
# /home/nod32-antivirus/ are pages not found, and the Dutch product page lists none), read 2026-11-13.

id: eset
name: ESET
website: https://www.eset.com
category: security
spendCategory: software
billingCurrency:
  { CA: CAD, US: USD, GB: GBP, AU: AUD, DE: EUR, FR: EUR, NL: EUR, IT: EUR, GLOBAL: USD }
# Its knowledgebase article on turning off auto-renewal (US and Canada eStore).
cancelUrl: https://support.eset.com/en/kb6205-manage-auto-pay-settings-for-your-eset-licenses-us-and-canada-customers-only
sources: { pricing: https://www.eset.com/ca/home-store/ }
# Owner (M11.2), read 2026-11-13: its Terms of Use name the company that runs ESET HOME (rule 3), ESET, spol. s r.o., a
# private company ("we remain independent", its careers page) in Bratislava; ESET Canada Inc. sells in Canada (its
# pages' footer). Its press kit names the country in English ("Slovak Republic" in the terms isn't a name core's
# namesCountry knows).
owner:
  name: 'ESET, spol. s r.o.'
  page:
    name: Terms of Use (ESET HOME)
    url: https://help.eset.com/home_eset/en-US/terms_of_use.html
  quotes:
    - 'These Terms of Use ("Terms") constitute a special agreement between ESET, spol. s r. o., having its registered office at Einsteinova 24, 85101 Bratislava, Slovak Republic'
  country:
    code: SK
    page:
      name: Press kit
      url: https://www.eset.com/ph/newsroom/press-kit/
    quotes:
      - 'ESET headquarters are based in Aupark Tower, Einsteinova 24, Bratislava, Slovakia'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: its knowledgebase's card article (every eStore) names a credit or debit card but
# no networks; France's eStore FAQ names its networks, Google Pay and Apple Pay. No page read names PayPal (Canada's
# checkout wasn't opened past the cart).
acceptedNetworks:
  FR:
    networks: [visa, mastercard]
    url: https://www.eset.com/fr/foire-questions-estore/
    quotes: ['carte bancaire (Visa / MasterCard)']
paymentMethods:
  - methods: [card]
    page: '[KB8740] Update credit card and contact information for your ESET subscriptions in ESET eStore'
    url: https://support.eset.com/en/kb8740-manage-account-and-credit-card-information-for-your-eset-subscriptions
    quotes:
      - 'Select Credit/debit card and click Edit to change the credit card information.'
  - methods: [card, google-pay, apple-pay]
    regions: [FR]
    page: 'Foire aux questions eStore'
    url: https://www.eset.com/fr/foire-questions-estore/
    quotes:
      - 'Pour le moment, les seuls modes de paiement disponibles sont : carte bancaire (Visa / MasterCard), Google Pay et Apple Pay.'
# Renewal day (M11.5): KB6205 says a subscription renews "At the end of your subscription period", which names no day,
# and its help article only that it "remains active until the end of the current period"; not-stated (notes.md).
renewalAnchor:
  kind: not-stated
  pages:
    - https://support.eset.com/en/kb6205-manage-auto-pay-settings-for-your-eset-licenses-us-and-canada-customers-only
    - https://help.eset.com/home_eset/en-US/license_autorenewal.html
  lastVerified: 2026-11-13
