    tested: Security Ultimate 19.1 & 19.2, Windows 11
  - rater: av-test
    subject: antivirus-usability
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/eset-security-ultimate-19.1--19.2-261407/
