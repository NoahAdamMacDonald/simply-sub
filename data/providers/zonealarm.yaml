# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-20: its Terms of Use (the website and its
# software, which includes the privacy policy), Privacy Policy, Cookies notice and 30-day return policy, and the help
# centre's billing articles. Its apps' End User License Agreement is shown only in the installer ("Review the ZoneAlarm
# End-User License Agreement and Click Agree"); no page of its sites or Check Point's links it, so it wasn't read (the
# installer wasn't run). The privacy policy's California notice is Check Point's (checkpoint.com/privacy/ccpa-notice),
# which answered a plain fetch with no page: unread. Security: Check Point's Vulnerability Disclosure Policy covers its
# products; its bug bounty covers only the "Check Point Portal". Checkout: 2Checkout's (estore.zonealarm.com).
policies:
  links:
    - name: Terms of Use
      url: https://www.zonealarm.com/terms
    - name: Privacy Policy
      url: https://www.zonealarm.com/privacy
    - name: Cookies
