# Researched by hand on 2026-11-20 (the full catalog run, security batch 2). zonealarm.com answered this machine's Edge
# once, then showed its "Let's confirm you are human" check to every second page in a session and a plain fetch HTTP 202
# with no page, so its pages were read one page per browser session, read 2026-11-20 through a Canadian exit (no check
# was clicked); its help centre (support.zonealarm.com, Zendesk) through its API over an ordinary connection, and Check
# Point's disclosure pages through a US exit. Pages, each quoted where it's used:
# Pricing: each product page's buy box (Extreme Security NextGen, Pro Antivirus + Firewall, Anti-Ransomware) shows a
# device menu and a "1 year" or "2 years" menu, a struck-through price and the first payment's lower one, with "Discount
# applies for 1st payment only"; its compare page names the lower one "For the first year". The struck price is the
# list price (the compare page's script calls the two "listPrice" and "promoPrice"), so it is stored. Its terms renew a
# subscription "for additional one (1) year periods", so the 2-year option is a first term that renews yearly: only
# yearly prices are stored (Kaspersky's and Avira's precedent), and the 2-year list prices are in each plan's notes.
# Currency: every page prices in US dollars by default; its currency menu converts the same prices into euros, Canadian,
# Australian and Hong Kong dollars and pounds (5 devices of Extreme: US$114.95, CA$158.88, €98.16, £85.50, each a fixed
# ratio of the US price, read 2026-11-20), so they are conversions, not price lists: one GLOBAL price in US dollars, the
# others in `currencies` (Mullvad's precedent for converted amounts). Its checkout (estore.zonealarm.com, run by
# 2Checkout) priced Canada in US dollars and added Canadian sales tax ("Total TAX (5%)" to "(13%)" by the exit's
# province): prices are before tax. No page states the renewal amount itself, and the checkout's own figures don't match
# the product pages' (5 devices of Extreme: a US$104.95 subtotal with no coupon, the page's first-payment price; 1 device:
# US$89.95 before its "renewal" coupon, against the page's US$98.95 and US$84.95), so the list price is a judgment call.
# Plans: Extreme Security NextGen (Windows, macOS, Android, iOS), Pro Antivirus + Firewall NextGen (Windows) and
# Anti-Ransomware (Windows) for 1, 3, 5 or 10 devices, a plan per device count (Norton's precedent: what a plan protects
# differs by count); their 25- and 50-device options are left out (more devices than a household), and so is Mobile
# Security sold alone (its app stores' in-app plans, Avira's precedent; it comes with Extreme). Free: Free Antivirus and
# Free Firewall (Windows).
# Region checklist for CA and US, 2026-11-20: 1. no country paths (/de, /fr, /es, /it, /hk are languages); 2. its
# language and currency menu (conversions, above); 3. no price data names a country; 4. the checkout, up to the payment
# form, listed Canada and charged it in US dollars; 5. its help centre's tax articles (2Checkout's US states and EU VAT);
# 6. Edge, a plain fetch (refused) and a Canadian exit; 7. no bill. The US: the same US-dollar prices.
# Bundles: none (Extreme includes Anti-Ransomware and Mobile Security, its own products). Official resellers: none named;
# its "Partners" page is a service-provider programme. Google Play and the App Store bill Mobile Security sold alone.
# Lab results: AV-TEST's newest ZoneAlarm test on its site is of October 2016 (Free Antivirus + Firewall 15.0), and it
# isn't in AV-TEST's Windows tests of 2026, so no rating is listed.
# Its End of Support notice (2024): older ZoneAlarm versions had to be replaced by the NextGen ones to meet "US Department
# of Commerce regulations described in document 2024-13532" (the ruling that ended Kaspersky's US sales), and valid
# Extreme and Pro subscriptions were upgraded free.

id: zonealarm
name: ZoneAlarm
aliases: [ZoneAlarm Extreme Security, ZoneAlarm Free Firewall, Check Point ZoneAlarm]
website: https://www.zonealarm.com
category: security
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help article on stopping subscription payments (myAccount, My Products, "Turn off/on auto renewal").
cancelUrl: https://support.zonealarm.com/hc/en-us/articles/360060711231-How-can-I-stop-subscription-payments-cancel-automatic-renewal
sources: { pricing: https://www.zonealarm.com/software/extreme-security-nextgen }
# Owner (M11.2), read 2026-11-20: its about page names Check Point and its listing; its privacy policy names Check Point
# Software Technologies Ltd. in Tel Aviv as "ZoneAlarm’s mother company" (its terms name Zone Labs, L.L.C., "a Check
# Point Software Technologies, Inc. Company", as the site's operator). No page read names a majority holder.
owner:
  name: Check Point Software Technologies Ltd.
  website: https://www.checkpoint.com
  page:
    name: About ZoneAlarm
    url: https://www.zonealarm.com/about
  quotes:
    - 'ZoneAlarm is the consumer brand of Check Point Software Technologies Inc. (NASDAQ: CHKP).'
  country:
    code: IL
    page:
      name: ZoneAlarm Privacy Policy
      url: https://www.zonealarm.com/privacy
    quotes:
      - 'Check Point’s (ZoneAlarm’s mother company) registered office may be contacted using the following contact information:'
      - '5 Shlomo Kaplan Street, Tel Aviv 67897, Israel'
    lastVerified: 2026-11-20
  stock:
    listings:
      - { exchange: NASDAQ, symbol: CHKP }
  lastVerified: 2026-11-20
# Ways to pay (M11.5), read 2026-11-20 in its help centre: cards, PayPal, and a check or money order at checkout (other).
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, discover]
    url: https://support.zonealarm.com/hc/en-us/articles/115001840231-What-payment-methods-are-accepted
    quotes: ['Visa, MasterCard, American Express, Discover.']
paymentMethods:
  - methods: [card, paypal]
    page: What payment methods are accepted
    url: https://support.zonealarm.com/hc/en-us/articles/115001840231-What-payment-methods-are-accepted
    quotes:
      - 'Visa, MasterCard, American Express, Discover.'
      - 'PayPal'
  - methods: [other]
    page: Can I purchase ZoneAlarm with a Money Order or Personal check?
    url: https://support.zonealarm.com/hc/en-us/articles/115001846752-Can-I-purchase-ZoneAlarm-with-a-Money-Order-or-Personal-check
    quotes:
      - 'Yes you can select to pay for your purchase with a check or money order at the time of check out.'
# Currencies (M11.5): its currency menu converts the US-dollar prices into these at the day's rate (above).
currencies:
  - codes: [EUR, CAD, AUD, GBP, HKD]
    page: ZoneAlarm home page (currency menu)
    url: https://www.zonealarm.com/
    quotes:
      - 'EUR - Euro'
      - 'CAD - Canadian Dollar'
      - 'AUD - Australian Dollar'
      - 'GBP - GB Pound'
      - 'HKD - 港元'
# Renewal day (M11.5, M11.21): its terms renew a subscription for a year at a time and may charge 30 days before the new
# year starts, so a new yearly item is charged 30 days early.
renewalAnchor:
  kind: same-date
  page: ZoneAlarm Terms of Use
  url: https://www.zonealarm.com/terms
  quotes:
    - 'You may be automatically billed thirty (30) days prior to the start of a Renewal Term.'
  chargedBefore: { days: 30 }
  lastVerified: 2026-11-20

# General features, read 2026-11-20. Platforms: Windows for every plan (its system requirements), with Extreme's own list
# below. Sign-in: myAccount takes an email address or order number and a password ("Enter your email address/order
# number and password."); no page offers two-step sign-in. Support channels and app languages: not read (left out). No
# pause (auto-renewal is turned off instead).
features:
  platforms: [windows]
  account.sign-in: [password]

# Perks (M11.6): its product pages' and compare page's lines no feature describes, in their words.
perks:
  - id: threat-emulation
    name: Threat Emulation
  - id: threat-extraction
    name: Threat Extraction
  - id: anti-bot
    name: Anti-Bot

# Features, read 2026-11-20 (the product pages, the compare page's ticks, read from its screenshot, and the help centre):
# - Extreme Security NextGen: "Advanced Real-Time Antivirus", "Advanced Firewall" ("Monitors programs for suspicious
#   behavior"), "Two-way Firewall", "Anti-Phishing" and "Web Monitor", "Content Filtering" ("Blocks unwanted content
#   according to your selected preferences, covering categories such as violence, drugs, pornography"), "Anti-Ransomware"
#   ("detect Ransomware attacks, block them and immediately restore any encrypted files"), Threat Extraction and Threat
#   Emulation; Mobile Security for Android ("malicious apps and unsafe networks", anti-phishing "across all apps") and
#   iOS ("Warns you if your device is connected to unencrypted or unsecured WiFi networks. Blocks attempts to remotely
#   seize control of your camera, mic, and more."). Scans: "Critical Scan" and "Full Scan" started by hand ("Scan
#   computer for viruses") and on a schedule ("Set a scheduled scan": "Once, Daily, Weekly or Monthly"); no rescue scan.
#   Windows, "macOS NEW", Android and iOS, and the Web Secure extension for Chrome, Edge, Firefox and Brave.
# - Pro Antivirus + Firewall NextGen: the same antivirus, firewalls, anti-phishing (Web Secure), Threat Extraction and
#   Emulation and scans on Windows; the compare page crosses out Content Filtering, Anti-Ransomware, Mac and Mobile
#   Security, and its help says "Antivirus alone cannot do this." of ransomware (so no ransomware feature).
# - Anti-Ransomware: "analyzes all suspicious activities on your PC. It detects Ransomware attacks, blocks them and
#   immediately restores any encrypted files", "always running and always monitoring", and "Traditional scanning of your
#   PC like Antivirus does is not needed" (no scans); "compatible with all antivirus solutions", so it's labelled as
#   ransomware protection beside another antivirus. Its Web Secure extension adds anti-phishing and content filtering.
#   Its product page says "Windows 11/10"; the help centre's system requirements also list "ZoneAlarm Anti-Ransomware for
#   Mac" (left out: the product page is the plan card).
# - Free Antivirus: "Antivirus and Anti-Spyware", "Personal Firewall", "Customizable Scan Modes", Anti-Bot (ticked on the
#   compare page) and the same Critical and Full scans by hand and on a schedule ("Note: The following article only
#   applies to the NEW v3.5 ZoneAlarm Free Antivirus +Firewall."); the compare page crosses out "Real-Time Cloud
#   Security", Anti-Phishing and the rest, so real-time protection is false. Whether its "Advanced Firewall" row is
#   ticked was hidden under the cookie notice in the screenshot: behaviour-based detection is left out.
# - Free Firewall: a two-way firewall with Anti-Bot and no antivirus.
# No VPN, password manager, identity protection, anti-theft, spam filter or optimizer on any ZoneAlarm page.
