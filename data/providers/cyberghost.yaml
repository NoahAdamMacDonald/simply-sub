      tier: neutral
      reason: 'If you break its rules, it can cut off your access without refunding the time you paid for.'
      sources:
        - url: https://www.cyberghostvpn.com/terms
          quote: 'Furthermore, CyberGhost reserves the right, in case of breach of this Agreement, to, inter alia, restrict or suspend, in whole or in part, the access to CyberGhost Products without awarding a refund for services already paid for, as well as to initiate legal actions.'
      lastVerified: 2026-11-19
    - topic: legal.service-changes
      tier: neutral
      reason: 'It can add or remove features whenever it decides, as a subscription can.'
      sources:
        - url: https://www.cyberghostvpn.com/terms
          quote: 'From time to time, CyberGhost at its absolute discretion, can modify CyberGhost Products, for example by adding or removing certain functions of VPN servers or by updating the software.'
      lastVerified: 2026-11-19
