        - url: https://support.cyberghostvpn.com/hc/en-us/articles/213834369-CyberGhost-VPN-s-Refund-Policy
          quote: 'For subscriptions of 6 months or longer, we offer a 45-day money-back guarantee.'
        - url: https://www.cyberghostvpn.com/terms
          quote: 'In case you terminate your subscription at any time after the expiration of the respective Money-back guarantee period, you will not receive any refund but will retain access for the purchased period'
      lastVerified: 2026-11-19
    - topic: billing.price-changes
      tier: neutral
      reason: 'A new price starts only at your next renewal, never during time you’ve paid for. Its notice of it may be only a post on its website, and it doesn’t say how far ahead.'
      sources:
        - url: https://www.cyberghostvpn.com/terms
          quote: 'CyberGhost reserves the right to amend subscription fees or institute new fees at any time upon reasonable advance notice posted on the Site or sent via email.'
        - url: https://www.cyberghostvpn.com/terms
          quote: 'Any changes to the pricing shall not affect your existing subscription and will become effective upon subscription renewal.'
      lastVerified: 2026-11-19
    - topic: billing.free-trials
      tier: poor
      reason: 'Its computer trial needs no card and just ends. Its phone trials need a way to pay and turn into a paid plan unless you cancel during the trial, with no reminder promised.'
      sources:
        - url: https://www.cyberghostvpn.com/vpn-free-trial
          quote: 'Start a 24-hour desktop trial without using your card'
        - url: https://www.cyberghostvpn.com/vpn-free-trial
          quote: '* Mobile trials require a payment method. You won’t be charged for the subscription until the trial ends.'
        - url: https://www.cyberghostvpn.com/vpn-free-trial
          quote: 'Cancel the iOS or Android free trial during the initial period to avoid charges.'
      lastVerified: 2026-11-19
