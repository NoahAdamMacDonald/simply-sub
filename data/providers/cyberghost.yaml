# term" and its help article "at the end of each billing period"; its checkouts, read on 19 November, renew "every month
# starting on 19 December 2026", "every 6 months starting on 19 May 2027" and "every year starting on 19 March 2029" (a
# first term of 28 months): the date you signed up (notes.md has the same-date block for core).
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.cyberghostvpn.com/terms
    - https://support.cyberghostvpn.com/hc/en-us/articles/213849009-How-do-CyberGhost-s-Plans-and-Offers-Work
    - https://www.cyberghostvpn.com/buy-checkout/cyberghost-vpn-1
  lastVerified: 2026-11-19
notes: >-
  Its terms are with CyberGhost S.R.L., a company in Romania, part of Kape Technologies. Prices are in US dollars in
  Canada and New Zealand, plus tax everywhere. The 2-year deal is a first term that renews yearly.

