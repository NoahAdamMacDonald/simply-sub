      status: not-stated
      reason: 'Its plans renew by themselves, and its terms and help centre don’t say it reminds you before they do.'
      pages:
        [
          https://www.cyberghostvpn.com/terms,
          https://support.cyberghostvpn.com/hc/en-us/articles/360017373799-How-Can-I-Cancel-My-Subscription,
        ]
      lastVerified: 2026-11-19
    - topic: billing.fees
      tier: great
      reason: 'It says there are no extra payments or hidden costs beyond the price.'
      sources:
        - url: https://support.cyberghostvpn.com/hc/en-us/articles/360013734599-Any-additional-payments-or-hidden-costs
          quote: 'Neither one nor the other !'
      lastVerified: 2026-11-19
