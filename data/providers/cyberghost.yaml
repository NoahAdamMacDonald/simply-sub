        - url: https://www.cyberghostvpn.com/terms
          quote: 'You agree that any dispute or claim of any kind whatsoever between you and CyberGhost, regardless of when the dispute or claim arose or has arisen, will be decided by a binding arbitration administered by the American Arbitration Association'
