      tier: poor
      reason: 'It only posts new terms on its website or tells you some other way it chooses, and using it afterwards means you accept them.'
      sources:
        - url: https://www.cyberghostvpn.com/terms
          quote: 'Notification on material changes to the Terms will be provided through an update to the Site or other prominent manner.'
        - url: https://www.cyberghostvpn.com/terms
          quote: 'Your use of the content or Products following the changes to these Terms constitutes your acceptance of the changed Terms.'
      lastVerified: 2026-11-19
