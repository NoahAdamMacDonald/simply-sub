          quote: 'CyberGhost hereby grants you a personal, non-exclusive, non- transferrable, limited and revocable license to use the CyberGhost Products solely in accordance with the terms of this Use Agreement.'
        - url: https://www.cyberghostvpn.com/terms
          quote: '(A) reverse engineer, disassemble, decompile, translate, reconstruct, transform or extract any portion of the CyberGhost Products'
      lastVerified: 2026-11-19
    - topic: security.practices
      tier: good
      reason: 'Deloitte has checked its no-logs promise three times, it holds ISO 27001 security certification, and it runs a bug-report programme with YesWeHack. It doesn’t publish past security problems.'
      sources:
        - url: https://www.cyberghostvpn.com/privacyhub/privacy-audit-2025/
          quote: 'Our first assessment by Deloitte Audit Romania took place in 2022 , followed by a second in 2024 .'
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'In March 2012, CyberGhost had successfully passed an audit and verification conducted by QSCert for the implemented Information Safety Management System (ISMS) according to the international industrial standards ISO27001 and ISO9001.'
        - url: https://www.cyberghostvpn.com/vulnerability-disclosure-program
          quote: "We're committed to creating the best security tools, so we've launched a Vulnerability Disclosure Program in collaboration with YesWeHack."
      lastVerified: 2026-11-19
