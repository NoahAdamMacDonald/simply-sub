# General features, read 2026-11-19:
# - Platforms: "CyberGhost VPN has apps for popular operating systems, such as Windows, Android, macOS, iOS, and even some
#   Linux distros. It also supports some Smart TVs, like the Android TV and Google TV, and streaming devices like the
#   Amazon Fire TV Stick." (/features), and its download menu's Apple TV, Chrome and Firefox extensions and routers.
# - Sign-in: an email address and password (its sign-up and account articles); no page offers two-factor codes or
#   passkeys.
# - Support: "24/7 live Customer Support service" (/features) by chat, and email ("via e-mail: support@cyberghost.ro",
#   every help article).
# - App languages: its sites' language menu (English, Deutsch, Español, Français, Italiano, Português, 日本語, 简体中文,
#   한국어 and others the registry lacks, such as Nederlands, Polski and Română; no Arabic or Hindi).
# - Closed source: no page publishes its apps' code, and its terms forbid taking them apart.
# - No pause; no parental controls (its Content Blocker is a setting you turn on yourself).
features:
  platforms: [windows, macos, linux, android, ios, browser-extension, tv]
  account.sign-in: [password]
  support.channels: [chat, email, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh]
  software.open-source: proprietary

# Perks (M11.6): "Mac Cleaner that scans and removes junk files to free up storage on macOS", in every plan (How do
# CyberGhost’s Plans and Offers Work?).
perks:
  - id: mac-cleaner
    name: Mac Cleaner

# VPN features, read 2026-11-19 on its feature pages and help centre:
# - Devices: "With a single CyberGhost subscription, you can connect to the VPN on up to 7 different devices at the same
#   time, regardless of platform." (How Many Devices Can I Use at the Same Time?).
# - Traffic: "Unlimited bandwidth and traffic" (/features), so its monthly VPN data is unlimited.
# - Countries: "Choose from 120+ locations across 100 countries" (/features; "VPN servers in 100 countries worldwide").
# - Protocols: "Switch between OpenVPN, WireGuard®, and IKEv2 depending on what you need." (/features). No page offers
#   obfuscation, so no stealth.
# - Kill switch ("Shut down your connection to stop traffic from going through if the VPN tunnel fails."); split
#   tunnelling ("Choose apps or sites that don’t work well with VPNs to redirect them outside the VPN tunnel.").
# - Content blocking: "Block connections to domains associated with ads, trackers, and malware." (/features).
# - P2P: its "P2P-optimized servers" ("For torrenting", How to Use CyberGhost VPN’s P2P-Optimized Servers on Windows). No
#   port forwarding: "CyberGhost doesn’t support port forwarding." (Why Are My P2P Download Rates So Low?). No page offers
#   multi-hop or Tor over VPN.
# - No-logs policy and audits: "Deloitte concluded our VPN servers comply with our no-logs policy." (/features/no-logs-
#   vpn), and its post "Third Deloitte Romania Audit Verifies Our Commitment to Privacy" (Last updated: Feb 24, 2026):
#   "Our first assessment by Deloitte Audit Romania took place in 2022 , followed by a second in 2024 ." and "The 2025
#   Deloitte assurance report" (ISAE 3000, "to verify that our systems functioned as described and provided technical
#   protections against activity logging"): no-logs. Deloitte's report sits behind a disclaimer to accept
#   (/deloitte-privacy-policy), which wasn't accepted. No page names an audit of its apps or a security test of its
#   servers.
# - RAM-only servers: "CyberGhost VPN uses RAM-only servers that wipe all data every time they reboot." (/features/no-
#   logs-vpn).
# - Connects your own devices: no page offers it, so vpn.mesh is false.
# - Identity Guard: "CyberGhost Identity Guard automatically alerts you if your email address is revealed in a data
#   breach", in every plan ("Identity Guard that monitors your email address for data breach exposure", the plans
#   article; "Email leak monitoring" in the order page's "See What’s Included in All Plans"). The order page also says
#   multi-year plans include "CyberGhost ID Guard & CyberGhost Privacy Guard at no extra cost": Privacy Guard (a Windows
#   privacy-settings tool) is in the plan's notes, since a feature can't be held for some periods only (notes.md).
# - Not anonymous: an email is "required for account activation" (its checkout).
# - Speeds (notes only): "10-Gbps server infrastructure" (/features).
plans:
  - id: cyberghost.vpn
    name: CyberGhost VPN
    link: https://www.cyberghostvpn.com/buy
    features:
      vpn.included: true
      vpn.devices: 7
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 100
      vpn.protocols: [wireguard, openvpn, ikev2]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.content-blocking: [ads, trackers, malware]
      vpn.p2p: true
      vpn.port-forwarding: false
      vpn.no-logs-policy: true
      vpn.independent-audits: [no-logs]
      vpn.ram-only-servers: true
      vpn.mesh: false
      security.dark-web-monitoring: true
    featureLabels:
      security.dark-web-monitoring: Identity Guard
    perks: [mac-cleaner]
    addOnIds: [cyberghost.security-suite, cyberghost.dedicated-ip]
    notes: 'Up to 7 devices at once, servers in 100 countries ("10-Gbps server infrastructure"), its Content Blocker for ads, trackers and malware, and Identity Guard email breach alerts. The 2-year deal is a first term of 2 years and 4 months that renews yearly, and adds Privacy Guard for Windows.'
