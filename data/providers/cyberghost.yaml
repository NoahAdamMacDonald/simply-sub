        - url: https://www.cyberghostvpn.com/features/no-logs-vpn
          quote: 'Deloitte concluded our VPN servers comply with our no-logs policy.'
        - url: https://www.cyberghostvpn.com/features/no-logs-vpn
          quote: 'CyberGhost VPN uses RAM-only servers that wipe all data every time they reboot.'
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: "More than this, when using the CyberGhost VPN, we are NOT storing connection logs, meaning that we DON'T have any logs tied to your IP address, connection timestamp or session duration."
