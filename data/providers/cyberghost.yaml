      tier: good
      reason: 'Outside the US, a dispute goes to the courts of London, not to a private referee.'
      sources:
        - url: https://www.cyberghostvpn.com/terms
          quote: 'If you are not a resident of the United States, you agree that any dispute or claim arising out of or in connection with these Terms or the Products shall be subject to the exclusive jurisdiction of the courts of London, UK, and you hereby submit to the personal jurisdiction of such courts.'
