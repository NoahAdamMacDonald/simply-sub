# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with a plain fetch from Canada (its cookie banner in Edge, whose
# words sit in a shadow root that a page's text leaves out). Every agreement a user accepts: the checkout's line ("By
# clicking "Subscribe" below, I agree to the Terms and Conditions—including the dispute resolution clause which requires
# binding arbitration for U.S. residents; the Privacy Policy, the Cancellation Policy, and the Automatic Renewal Terms set
# forth below."), whose Cancellation Policy is the terms' "Cancellation and Refunds"; the privacy policy's Cookie Policy
# (/cookiepolicy). Its terms are its apps' licence ("2. License"). Its privacy policy's US line ("If you are residing in
# the US the following terms apply: Privacy Policy") links the same page. Read and giving no other grade: the Refer a
# friend terms (/ref-terms: credits for referrals, no topic). Not read: Deloitte's report (behind a disclaimer to accept),
# the payment companies' and analytics companies' own policies. Kape Technologies shares no policy with CyberGhost: its
# privacy policy is CyberGhost S.R.L.'s own.
policies:
  links:
    - name: 'Terms and Conditions'
      url: https://www.cyberghostvpn.com/terms
    - name: 'Privacy Policy'
      url: https://www.cyberghostvpn.com/privacypolicy
    - name: 'Cookie Policy'
      url: https://www.cyberghostvpn.com/cookiepolicy
    - name: 'No-Logs VPN'
      url: https://www.cyberghostvpn.com/features/no-logs-vpn
    - name: 'Third Deloitte Romania audit'
      url: https://www.cyberghostvpn.com/privacyhub/privacy-audit-2025/
    - name: 'Transparency Report'
      url: https://www.cyberghostvpn.com/transparency-report
    - name: 'Vulnerability Disclosure Program'
      url: https://www.cyberghostvpn.com/vulnerability-disclosure-program
    - name: 'VPN Free Trial'
      url: https://www.cyberghostvpn.com/vpn-free-trial
    - name: 'How Can I Delete My CyberGhost VPN Account?'
      url: https://support.cyberghostvpn.com/hc/en-us/articles/360017378259-How-Can-I-Delete-My-CyberGhost-VPN-Account
    - name: 'How Can I Cancel My Subscription?'
      url: https://support.cyberghostvpn.com/hc/en-us/articles/360017373799-How-Can-I-Cancel-My-Subscription
    - name: 'CyberGhost VPN’s Refund Policy'
      url: https://support.cyberghostvpn.com/hc/en-us/articles/213834369-CyberGhost-VPN-s-Refund-Policy
    - name: 'Any additional payments or hidden costs?'
      url: https://support.cyberghostvpn.com/hc/en-us/articles/360013734599-Any-additional-payments-or-hidden-costs
    - name: 'How Many Devices Can I Use at the Same Time?'
      url: https://support.cyberghostvpn.com/hc/en-us/articles/214371165-How-Many-Devices-Can-I-Use-at-the-Same-Time-with-One-Account-or-Subscription
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Besides what it needs, it collects details about your device, such as its advertising ID, and how you use its site and apps, for analytics. To opt out you have to email support.'
      sources:
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'Through such exchange we receive Non-personal Data including without limitation, data relating to the browser you are using, mobile/desktop device, general properties and metadata, OS version, preferred language, the date and time of your visit, battery charge, screen resolution, Google Advertising ID, Gyro-sensor data, screen size, Connectivity (WLAN), Mobile service provider, the referring website and your preferences in our Websites during your visit.'
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'We use this information for internal monitoring, analytics and improvement of our services in the way described in this Policy.'
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'in the event, you wish to opt out from the data collection or you are not able to exercise your rights through your account please contact us at: support@cyberghost.ro'
      action:
        name: 'How to contact it to opt out'
        url: https://www.cyberghostvpn.com/privacypolicy
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It lets other companies track what you do on its website, including advertisers’ cookies. You can stop it only with your browser’s Do Not Track setting or its cookie choices, browser by browser.'
      sources:
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: "It's also important to note that we allow third-party behavioral tracking"
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'These technologies are used by advertisers to serve ads that are relevant to your interests.'
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'We honor Do Not Track signals and Do Not Track, plant cookies, or use advertising when a Do Not Track (DNT) browser mechanism is in place.'
      action:
        name: 'Cookie Preferences, in its website’s footer'
        url: https://www.cyberghostvpn.com/cookiepolicy
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its website uses cookies for marketing that show you ads based on your interests unless you change your cookie choices, browser by browser, or turn on Do Not Track.'
      sources:
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'We use cookies and other third-party tools for analytics and marketing, as per our Privacy Policy and Cookie Policy.'
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'Any customization applies going forward.'
        - url: https://www.cyberghostvpn.com/cookiepolicy
          quote: 'You can prevent the setting of cookies by adjusting the settings on your browser (see your browser Help for additional information).'
      action:
        name: 'Cookie Preferences, in its website’s footer'
        url: https://www.cyberghostvpn.com/cookiepolicy
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: 'It has no AI features, and its terms and privacy policy don’t mention training AI models.'
      pages: [https://www.cyberghostvpn.com/privacypolicy, https://www.cyberghostvpn.com/terms]
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps what it collects as long as it needs it to run the service and meet its legal duties, and names no time limit.'
      sources:
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'Please note that unless you instruct us otherwise we retain the information we collect for as long as needed to provide the Service and to comply with our legal obligations, resolve disputes and enforce our agreements.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can delete your account yourself in its settings at any time. After that it no longer has personal details it can tie to you.'
      sources:
        - url: https://support.cyberghostvpn.com/hc/en-us/articles/360017378259-How-Can-I-Delete-My-CyberGhost-VPN-Account
          quote: 'Click Delete my account.'
        - url: https://support.cyberghostvpn.com/hc/en-us/articles/360017378259-How-Can-I-Delete-My-CyberGhost-VPN-Account
          quote: 'We will no longer have access to identifiable personal information associated with your account.'
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask for a copy of your data with its request form or by email. There’s no download button.'
      sources:
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'To facilitate the exercise of this right, we have prepared a specialised form that you can complete when making the request, to expedite our response time.'
      action:
        name: 'How to ask for your data'
        url: https://www.cyberghostvpn.com/privacypolicy
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: good
      reason: 'It hands data over when the law or a court order makes it, publishes the requests it gets every quarter, and keeps no logs to give. It doesn’t say it tells you.'
      sources:
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'We also reserve the right to disclose your Personal Data as required by law and when we believe that disclosure is necessary to protect our rights and/or comply with a judicial proceeding, court order, or legal process served on our Web site.'
        - url: https://www.cyberghostvpn.com/transparency-report
          quote: 'Our quarterly reports show every legal request we receive for user data, along with exactly how we handled them.'
        - url: https://www.cyberghostvpn.com/transparency-report
          quote: 'Thanks to our strict no-logs policy, we have no user data to hand over, no browsing history, no traffic logs, no IP assignments, and no connection timestamps.'
      lastVerified: 2026-11-19
    - topic: privacy.data-location
      tier: neutral
      reason: 'It doesn’t say where your account data is kept. Within its group, it passes data only to companies in the EU or places with equal privacy law.'
      sources:
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'our ultimate holding company, KAPE TECHNOLOGIES PLC, and all its subsidiaries, in so far as they are located in the EU or another jurisdiction offering equivalent data protection standards'
      lastVerified: 2026-11-19
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'To sign up you give an email address and payment details, and its policy says it may ask for your name and address too.'
      sources:
        - url: https://www.cyberghostvpn.com/privacypolicy
          quote: 'When registering through our Website you will be requested to provide your name, address, e-mail address, username and payment information which you submit to us voluntarily when you order or subscribe for our Services, as well as when you fill out any of the contact forms on the Website.'
      lastVerified: 2026-11-19
    - topic: billing.cancellation
      tier: great
      reason: 'You can turn off renewal in your account in a few clicks, and keep using it until the end of the time you paid for.'
      sources:
        - url: https://support.cyberghostvpn.com/hc/en-us/articles/360017373799-How-Can-I-Cancel-My-Subscription
          quote: 'This means you have successfully cancelled your CyberGhost VPN subscription and can keep using it until the end of your paid subscription period.'
        - url: https://www.cyberghostvpn.com/terms
          quote: 'You may discontinue automatic renewal at any time.'
      lastVerified: 2026-11-19
    - topic: billing.refunds
      tier: neutral
      reason: 'You get all your money back if you ask within 14 days of buying a monthly plan, or 45 days for 6 months or longer. It doesn’t say renewals are covered; after that, you keep access but get nothing back.'
      sources:
        - url: https://support.cyberghostvpn.com/hc/en-us/articles/213834369-CyberGhost-VPN-s-Refund-Policy
