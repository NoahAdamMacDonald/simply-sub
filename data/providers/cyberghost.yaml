# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1). Pricing: cyberghostvpn.com/buy (which opens
# /buy/cyberghost-vpn-3), which prices by where the visitor is, and its checkout pages (/buy-checkout/cyberghost-vpn-1,
# -2 and -3, one per period, opened to the card form, typing nothing), read 2026-11-19 with Edge from Canada and through a
# US, UK, Irish, Australian, New Zealand, German, French, Dutch, Spanish and Italian exit. Each page names its currency
# ("*All amounts shown are in US Dollars." in Canada, the US and New Zealand, "... in British Pounds Sterling.", "... in
# Euros.", "... in Australian Dollars."), and the page's data names the visitor's country ("cfCountry" : "CA", with
# currency USD, from Canada). Its terms, privacy policy, cookie policy, feature pages and Kape's pages with a plain fetch
# from Canada; its help centre through its Zendesk API (support.cyberghostvpn.com); its cookie banner's words in Edge.
# Regular prices: each checkout's Automatic Renewal Terms ("Your subscription will automatically renew every month
# starting on 19 December 2026 at the rate of $12.99/month + vat/tax", "every 6 months ... at the rate of $41.94/6 months
# + vat/tax", "every year starting on 19 March 2029 at the rate of $55.72/year + vat/tax"), the same as the cards'
# ("Autorenews at $12.99 monthly", "Autorenews at $41.94 every 6 months", "Billed $55.72 for first 2 years, then
# autorenews at $55.72 annually"). The 2-year card is a first term of 2 years and 4 months (a Black Friday offer) that
# renews yearly ("Longer-term offers are priced at an introductory rate for the initial period and renew annually at the
# standard rate thereafter.", How do CyberGhost’s Plans and Offers Work?), so its yearly renewal is stored and no 2-year
# price (Proton VPN's and NordVPN's precedent); no 1-year plan is sold. No price includes tax: "Taxes may apply based on
# your jurisdiction." (every page) and "+ vat/tax" on every checkout, the euro countries' too.
# Region checklist for CA and US, 2026-11-19: 1. its language paths (/fr/, /de/...) change only the language; 2. no
# country or currency picker; 3. the page's data names the country and currency (CA, USD); 4. the checkout names the
# country (Canada) and adds "+ vat/tax"; 5. its help centre's payment methods by country; 6. Edge, and a plain fetch; 7.
# no bill offered.
# Bundles: none sold. Official resellers: none named. Its terms and help centre mention activation keys "from physical
# gift cards or promotional events" and "a third-party seller" without naming a shop; its Partnerships page seeks
# business partners. App stores (Apple, Google Play, Amazon Appstore) bill it: partners, not listed.
# Free use: none. A 24-hour desktop trial ("Start a 24-hour desktop trial without using your card") ends without
# charging, and the phone apps' 3-day and 7-day trials turn into paid plans: trials, not free plans.

id: cyberghost
name: CyberGhost VPN
aliases: [cyberghost, cyber ghost, cyberghost vpn]
website: https://www.cyberghostvpn.com
category: vpn
spendCategory: software
# Each country's pages and checkouts name the currency, read 2026-11-19 through each country's exit.
billingCurrency:
  {
    CA: USD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
# Its help article on cancelling, for the website and the app stores.
cancelUrl: https://support.cyberghostvpn.com/hc/en-us/articles/360017373799-How-Can-I-Cancel-My-Subscription
sources: { pricing: https://www.cyberghostvpn.com/buy }
# Owner (M11.2), read 2026-11-19: CyberGhost is run by CyberGhost S.R.L. of Bucharest ("These Services are owned and
# operated by CyberGhost S.R.L", its privacy policy, "registered in Romania"), whose "ultimate holding company" is Kape
# Technologies PLC (the same policy). Kape's About us lists "March 2017 Acquisition of CyberGhost", and its brands page
# "CyberGhost is a Romania-based VPN service provider". Kape is headquartered in London. No stock: Kape's About us lists
# "Kape delists from LSE" in May 2023 (as expressvpn.yaml). Its blog's footer says "© 2026 CyberGhost S.A." while its
# other pages say S.R.L.: the policy's S.R.L. is taken.
owner:
  name: Kape Technologies PLC
  website: https://www.kape.com
  page:
    name: 'Privacy Policy (CyberGhost)'
    url: https://www.cyberghostvpn.com/privacypolicy
  quotes:
    - 'our ultimate holding company, KAPE TECHNOLOGIES PLC, and all its subsidiaries'
  country:
    code: GB
    page:
      name: 'About us (Kape Technologies)'
      url: https://www.kape.com/about-us
    quotes:
      - 'Kape is a global company headquartered in London, United Kingdom.'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19
# Ways to pay (M11.5), read 2026-11-19: its help article "Payment Possibilities, Sorted by Country" lists each country's
# (Canada, the UK, Ireland, Australia, New Zealand, France, Spain and Italy: "PayPal, VISA, MasterCard, American Express,
# Discover, Diners Club, JCB, Apple/Google Pay"; the US adds Amazon Pay, Germany SEPA Direct Debit and the Netherlands
# iDeal). Its "Apple/Google Pay" doesn't name Apple Pay in core's words, so Apple Pay is quoted from its payment help
# ("If you’re paying with Apple Pay"). App stores (its terms) and gift cards (Who Handles Your Subscription?). Each of the
# US's, Germany's and the Netherlands' entries lists all its ways, since a region's own entries replace everywhere's. No
# crypto: no country's list has it, though its privacy policy still offers "bitcoin" (older wording: the list wins).
# Accepted cards: the country list names the same networks for every research country and for "Other Countries" (Diners
# Club is other); only Russia's differs ("UnionPay, Apple/Google Pay"), outside the catalog's regions.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, discover, jcb, other]
    url: https://support.cyberghostvpn.com/hc/en-us/articles/360013734499-Payment-Possibilities-Sorted-by-Country
    quotes:
      - 'Other Countries: PayPal, VISA, MasterCard, American Express, Discover, Diners Club, JCB'
