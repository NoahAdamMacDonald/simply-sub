# 19801", and its about page says it's "headquartered in Wilmington, Delaware". Private: no page names a listing. No
# current Enpass page names Sinew Software Systems, the name the catalog list had.
owner:
  name: Enpass Technologies Inc.
  page:
    name: Terms of use
    url: https://www.enpass.io/terms-of-use/
  quotes:
    - 'The terms “us”, “we”, and “our” refer to our company Enpass Technologies Inc the owner of the Platform.'
    - 'This Agreement is between you and Enpass Technologies Inc.'
  country:
    code: US
    page:
      name: About
      url: https://www.enpass.io/about/
    quotes:
      - 'Enpass has since grown into a multinational tech company headquartered in Wilmington, Delaware, with offices across the US, India, UK, Ireland, Belgium, Indonesia, Japan, and Singapore.'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19
notes: >-
  Your vault stays on your devices and in your own cloud storage (iCloud, Google Drive, OneDrive, Dropbox, Box, Nextcloud
  or WebDAV), never on Enpass’s servers. Premium is also sold for life, paid once, which isn’t listed. App store
  purchases are individual only; Family is bought on enpass.io.

# Perks (M11.6): what Premium and Family add that no feature describes, in the comparison table's words.
perks:
  - id: priority-support
    name: Priority support
  - id: two-factor-monitoring
    name: Two-factor authentication monitoring
  - id: passkey-monitoring
    name: Passkey monitoring

# General features, read 2026-11-19. Platforms: "Windows, MacOS, Linux, iOS, Android apps, including for wearables" and
# "Browser extensions for Chrome, Edge, Firefox, Safari, Brave, Vivaldi, and Opera" (comparison table, every plan); no web
# app (its downloads page). Sign-in: there's no Enpass password account: you activate the app with an emailed code ("Provide
# an email address to receive an activation code"), or "Continue with Apple" or "Sign in with Google" (Activation), and
# unlock your vault with its master password, optionally with a keyfile ("Keyfile support", every plan), which has no
# registry value. Support: "Email support for paid users" and "Friendly user forums with staff participation" (Why
# Enpass?), so email and community, the Free plan community only; Premium and Family's "Priority support" is a perk. App
# languages: "Localization in 33 languages" (Why Enpass?), but no page names them, so languages.interface is left out.
# Not open source: its apps are Enpass's own; only its encryption engine is open source ("the open-source SQLCipher
# encryption engine"). Not self-hostable: there's no server to run. No pause; no parental controls (Family's "family
# management" isn't described as restricting members).
features:
  platforms: [windows, macos, linux, android, ios, browser-extension]
  account.sign-in: [password, email-code, sso]
  support.channels: [email, community]
  software.open-source: proprietary
  software.self-hostable: false

# Password manager features, read 2026-11-19 (pricing page and comparison table, and the help articles named):
# - Items: "Store passwords, passkeys, and payment cards" "With customisable categories and templates" (comparison);
#   custom templates (Creating custom templates); notes ("Logins", "Credit Cards", "Notes", "Miscellaneous" CSV
#   templates); identities ("autofilling usernames, passwords, credit cards, and identities", downloads); a "One-time
#   code" field for 2FA codes. File attachments ("Secure document storage", every plan) are vault data, not a files
#   service.
# - Health: the Security Audit ("Items with compromised, identical, weak, or expired passwords"); "Expired passwords"
#   are ones whose expiry date has passed, counted as old. "Breach and dark web monitoring" ("Alerts if a credential is
#   in a known breach or has been compromised") is Premium's and Family's, not Free's (comparison), so breached and
#   security.dark-web-monitoring are theirs; Free's "Security dashboard" has weak, identical and expired.
# - Sharing: a vault in a cloud account shared with other Enpass users (Sharing a vault: it must be "A vault separate from
#   your Primary Vault", so not on Free's one vault); single items sent to another Enpass user as "an encrypted link"
#   unlocked with a pre-shared key (Sharing individual Items): share-to-user, share-link and link-password.
# - Import (desktop app): CSV templates, other managers' and browsers' exports (1Password's .1pux, Bitwarden's .json or
#   .csv, LastPass's .csv and others: Importing passwords), and its own .json export; KeePass is imported from its .xml
#   export, not a KDBX file. Passkeys "cannot be imported or exported between password managers", so no cxf. Free
#   imports "Up to 25 items". Export: "choose .json as the file format for your export" (Importing from Enpass); no other
#   format is named.
# - No emergency access (no page offers one). Offline: vaults live on your devices, with offline sync over Wi-Fi or a
#   folder (Offline Storage & Sync).
# - Authenticator: "Integrated authenticator" on every plan (comparison); a site's key is entered or its QR code scanned
#   ("tap the QR-code icon to scan in the key"): otpauth. No page says how 2FA secrets leave Enpass, so
#   authenticator.export is left empty.
# - End-to-end encryption: "Enpass uses end-to-end encryption , a zero-knowledge architecture , and never stores user data
#   on its own infrastructure." (partners page), so passwords.
plans:
  - id: enpass.free
    name: Free
    link: https://www.enpass.io/downloads/
    features:
      support.channels: [community]
      password-manager: true
      password-manager.item-types:
        [login, totp, passkey, credit-card, identity, secure-note, custom]
      password-manager.health: [weak, reused, old]
      password-manager.sharing: [share-to-user, share-link, link-password]
      password-manager.import: [csv, json, other-managers]
      password-manager.export: [json]
      password-manager.emergency-access: false
      password-manager.offline: true
      authenticator.included: true
      authenticator.import: [otpauth]
      encryption.end-to-end: [passwords]
    notes: Up to 25 items in one vault, on every device. Your vault syncs through your own cloud account or over Wi-Fi.
    prices:
      - {
          region: GLOBAL,
          currency: USD,
          amount: 0,
          interval: month,
          intervalCount: 1,
          autoRenew: true,
