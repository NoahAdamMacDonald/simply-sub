# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 2), read with Edge from Canada (enpass.io's
# pricing page and its Annual, 3-year and Lifetime tabs, its comparison table's ticks from screenshots, its FastSpring
# checkout and store pages) and with a plain fetch, which serves enpass.io and help.enpass.io whole: its home, personal,
# about, security, why-Enpass, partners, students, contact, downloads and release-notes pages, its terms of use, privacy
# notice and cookie policy, its trust centre (trust.enpass.io), and 50 articles of its Personal & Family Support Center
# (subscriptions, account deletion, activation, family plan, import from a CSV, KeePass, Bitwarden, 1Password, LastPass,
# NordPass and Microsoft Authenticator, export, backups, passkeys, 2FA codes, sharing, items, audit, breach monitoring,
# sync, offline storage, security); its store's pages again through US, UK, German, Spanish, French, Irish, Italian, Dutch,
# Australian and New Zealand exits, each kept only when the store's own page data named that country.
# Pricing: enpass.io/pricing shows Free ("$0 CAD forever", "Store up to 25 items in 1 vault"), Premium (Annual, 3-year and
# Lifetime tabs) and Family, and each "Get started" opens Enpass's FastSpring store, whose page for each product
# (enpass.onfastspring.com/<product>) prices by where the visitor is. Every tab shows a sale ("40% off", "30% off"); the
# regular price is the one struck through, which the yearly plans renew at: "Billed annually at $19.49 CAD with your
# discount, then $32.49 CAD, billed yearly" (pricing page), "Renews every year . Next charge: $32.49 on Nov. 20, 2027 ."
# (store). The 3-year plan is one payment that doesn't renew: "Renews every 3 years for free . Ends on Nov. 19, 2029"
# (store; its page data has "nextChargeTotal":"$0.00"), so autoRenew is false (a prepaid period, the run's standing rule).
# Regular prices read 2026-11-19 (yearly, 3 years, Family yearly): Canada CA$32.49, CA$71.99, CA$64.99; US $23.99, $47.99,
# $47.99; UK £19.49, £45.99, £38.99; Germany €21.49, €53.99, €42.99; Spain, France and the Netherlands €21.49, €54.99,
# €42.99; Ireland and Italy €21.49, €55.99, €42.99; Australia A$34.99, A$81.99, A$69.99; New Zealand NZ$37.49, NZ$104.99,
# NZ$74.99. The euro countries' 3-year prices differ, so each country has its own (not EU). The European, UK, Australian
# and New Zealand store pages say "Includes VAT …" or "Includes GST …" (the tax on the amount shown), so those prices
# include tax; Canada's says "Includes GST $0.00 CAD (0%)" before an address is given and the US's names no tax, so theirs
# are before tax (the catalog's default).
# Region checklist for CA and US, 2026-11-19: 1. no country paths (one English site); 2. no country or currency picker; 3.
# the store page's data names the visitor's country and currency ("country":"CA","currency":"CAD"); 4. the checkout
# popup and store pages read up to the payment form, typing nothing; 5. no prices-by-country article; 6. Edge and a plain
# fetch from Canada (the plain fetch shows the page's US-dollar placeholders, filled in by the store's script), Edge
# through a US exit; 7. no bill offered.
# Its personal plans: Free, Premium (yearly or 3 years) and Family (yearly, 6 people). Out of scope and not listed:
# Premium Lifetime, a one-time purchase (CA$134.99 regular; categories.md: a lifetime plan beside subscriptions is left
# out), and Enpass Business and Enterprise. In-app subscriptions on the App Store and Google Play are individual only
# ("When purchasing Enpass from an app store or an in-app purchase, only individual user subscriptions are available.",
# Sharing an Enpass family plan); no Enpass page prices them, so they aren't priced here.
# Bundles: none. Official resellers: none for personal plans: its partners programme is for resellers to businesses
# ("Recommend and sell Enpass to SMBs and enterprises."); FastSpring is its store ("Sold and fulfilled by FastSpring an
# authorized reseller and Merchant of Record"), not a shop of its own. Students: "special pricing for students and
# universities" by contacting it (no price).
# Free use: its Free plan. No free trial of Premium or Family ("Can I try Enpass before I pay? Yes. A Free account lets you
# use Enpass with up to 25 credentials in one vault.", personal page).

id: enpass
name: Enpass
website: https://www.enpass.io
