  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Its apps send device details and which features you use so it can study how they’re used, and its website uses Google Analytics and Clearbit. No setting stops it; you’d have to write and object.'
      sources:
        - url: https://www.enpass.io/privacy-notice/
          quote: 'To enhance and improve our product, we gather certain device data to analyze apps usage.'
        - url: https://www.enpass.io/privacy-notice/
          quote: 'Some parts of our Platform use Google Analytics and Clearbit to collect information about the use of our Platform.'
        - url: https://www.enpass.io/privacy-notice/
          quote: 'Contact us using the information at the top of this privacy notice to exercise any of your legal rights contained within this privacy notice.'
      action:
        name: 'Ask it to stop (its privacy notice)'
        url: https://www.enpass.io/privacy-notice/
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It doesn’t sell your details, but it may give your email and other details to companies it works with so they can tell you about their own products. To stop that you have to write to it.'
      sources:
        - url: https://www.enpass.io/privacy-notice/
          quote: 'We share this information with them so that they can send you information about our products and services as well as their products and services.'
        - url: https://www.enpass.io/privacy-notice/
          quote: 'With the exception defined in our Disclosures to Successors provision, we never sell your PD.'
      action:
        name: 'Ask it to stop (its privacy notice)'
        url: https://www.enpass.io/privacy-notice/
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: good
      reason: 'No ads in its apps. Its website’s advertising cookies, which can show you ads based on your interests, are set only if you accept them.'
      sources:
        - url: https://www.enpass.io/pricing/
          quote: 'By clicking "Accept All", you consent to our use of cookies.'
        - url: https://www.enpass.io/cookie/
          quote: 'targeted advertising and serving ads relevant to your interests'
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its terms and privacy notice don’t mention AI. It never receives what’s in your vault.'
      pages: [https://www.enpass.io/privacy-notice/, https://www.enpass.io/terms-of-use/]
      lastVerified: 2026-11-19
    - topic: privacy.content-access
      tier: great
      reason: 'Your passwords never reach Enpass: they’re locked on your devices and kept in your own cloud, so nobody at Enpass can read them.'
      sources:
        - url: https://www.enpass.io/privacy-notice/
          quote: 'All your secured data like logins, credit cards or any kind of data that you store in our Platform is stored locally and is never sent to our servers encrypted or unencrypted.'
        - url: https://www.enpass.io/privacy-notice/
          quote: 'PLEASE NOTE THAT IN ANY CASE YOUR SECURED DATA LIKE YOUR MASTER PASSWORD AND ANY DATA SAVED IN ENPASS CAN’T BE ACCESSED BY ANYONE.'
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your name and email for as long as it decides it needs them, with no time limits stated. Deleting your account erases them from its servers.'
      sources:
        - url: https://www.enpass.io/privacy-notice/
          quote: 'We only retain your PD for as long as necessary to fulfill the purposes we collected it for, including for the purposes of satisfying any legal, accounting, or reporting requirements.'
        - url: https://help.enpass.io/personal/latest/all/deleting-an-enpass-account-duplicate
          quote: 'When you delete your Enpass account, the following information will be erased from Enpass servers:'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: great
      reason: 'It holds only your name and email. You can delete your account yourself in its phone apps or its Mac App Store app; for its other apps you ask support.'
      sources:
        - url: https://help.enpass.io/personal/latest/all/deleting-an-enpass-account-duplicate
          quote: 'Enpass does not retain personal information about users other than your name and email address, which are used only to authenticate your subscription on each of your devices and unlock paid features.'
        - url: https://help.enpass.io/personal/latest/all/deleting-an-enpass-account-duplicate
