id: crave
name: Crave
website: https://www.crave.ca
category: streaming
spendCategory: streaming
# Accepted cards, read 2026-10-28 (M9.2): none named, so no acceptedNetworks. The help centre's billing articles say
# only "credit card" (plus.crave.ca/en/faq/plans-billing-bundles/), /en/subscribe names none, and payment details are
# in Bell Media's Account Management portal, behind a sign-in.
billingCurrency: { CA: CAD }
# Crave's terms (plus.crave.ca/en/faq/account-profiles/terms-and-conditions, read 2026-10-26): "The Service is
# intended for use in Canada."
availableIn: [CA]
# Sign in, then Account > Subscriptions > Cancel Plan (read 2026-10-26).
cancelUrl: https://plus.crave.ca/en/faq/plans-billing-bundles/canceling-or-pausing-my-crave-subscription/
sources: { pricing: https://www.crave.ca/en/subscribe }
# Owner (M11.2), read 2026-11-02: no about page says so; its terms do.
# Ways to pay (M11.5), read 2026-11-02 in its terms: a card, or through an in-app purchase.
paymentMethods:
  - methods: [card, app-store]
    page: 'Crave terms and conditions'
    url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
    quotes:
      - 'provide payment method information, such as your credit card number and billing address'
      - 'If you subscribe or otherwise have entitlements to the Service through an authorized third party distributor of the Service (such as an authorized content provider, in-app purchase platform, or bundle distributor)'
owner:
  name: Bell Media Inc.
  page:
    name: Terms and conditions
    url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
  quotes:
    - 'which is made available to you by Bell Media Inc. and its affiliates (together, “Bell Media”)'
  lastVerified: 2026-11-02
notes: Live events, sports and news include ads on every plan.

# Renewal day (M11.5), read 2026-11-03 (M11.9) in its terms (6(b)): charged at the start of each billing period, which
# moves only when the subscription "began on a date not contained in a given month", so the date you signed up. Its
# renewal FAQ says only that it renews at the end of the billing cycle.
renewalAnchor:
  kind: same-date
  page: Crave terms and conditions
  url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
  quotes:
    - 'By purchasing a subscription to the Service, you authorize us to charge your payment method the subscription fees, taxes, and any other charges you may incur in connection with the Service (“Subscription Fees”) at the commencement of your billing period, and on a recurring basis at the commencement of each subsequent billing period until the subscription is cancelled in accordance with these Terms and Conditions.'
    - 'In some cases, the timing of a recurring charge may change, such as if your payment method does not settle as expected or if your subscription began on a date not contained in a given month.'
  lastVerified: 2026-11-03

# Apps and sign-in (M11.9, the cross-category features), read 2026-11-03: smart TVs and streaming devices, PlayStation and
# Xbox, PC and Mac computers in a web browser, and Apple and Android phones and tablets (its device compatibility FAQ); a
# Bell Media account's password ("How to sign in to Crave"); live chat and a phone line, every day from 9 a.m. to 11
# p.m. Eastern (crave.ca/en/contact: "You can chat live Monday to Sunday", "1-888-CRAVE88").
features:
  platforms: [web, ios, android, tv, console]
  account.sign-in: [password]
  support.channels: [chat, phone]

# Official resellers: none listed (M11.9, read 2026-11-03; the owner's choice that day: noted, not listed). Its FAQ
# (plus.crave.ca/en/faq/plans-billing-bundles/how-can-i-subscribe-to-crave/) names "four ways you can subscribe":
# crave.ca, in-app purchases ("You will be billed by the app partner"), "most TV providers (Bell, Cogeco, Rogers, Shaw,
# Telus, Videotron etc.)" and "some mobility providers (e.g. Bell Mobility)", each billing it, and Amazon Prime Video's
# and Bell's Streaming's add-on channels. Each bills it on its own service, mostly to its own customers.
# Billing periods: monthly and annual (crave.ca/en/subscribe). Premium's annual "$149.99 for your first year;
# $220.00/yr thereafter" is a first-year offer, so $220.00 is its price.
# HDR (M11.9, the owner's item 3), read 2026-11-03: its plans and devices pages name 4K on Premium but not HDR, so
# none (inferred).
plans:
  - id: crave.standard-ads
    name: Standard With Ads
    link: https://www.crave.ca/en/subscribe
    features:
      video.quality: 1080p
      ad-free: false
      streaming.concurrent-streams: 2
      streaming.kids-profiles: true
      streaming.french-content: true
      streaming.live: [sports]
    prices:
      - region: CA
        currency: CAD
        amount: 11.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://www.crave.ca/en/subscribe
      - region: CA
        currency: CAD
        amount: 119.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://www.crave.ca/en/subscribe
    addOnIds: [crave.starz]

  - id: crave.premium
    name: Premium
    link: https://www.crave.ca/en/subscribe
    features:
      video.quality: 4k
      ad-free: true
      streaming.concurrent-streams: 4
      streaming.download-devices: 5
      streaming.kids-profiles: true
      streaming.french-content: true
      streaming.live: [sports]
    prices:
      - region: CA
        currency: CAD
        amount: 22
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://www.crave.ca/en/subscribe
      - region: CA
        currency: CAD
        amount: 220
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://www.crave.ca/en/subscribe
    addOnIds: [crave.starz]

addOns:
  - id: crave.starz
    name: STARZ
    prices:
      - region: CA
        currency: CAD
        amount: 7.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://www.starz.ca

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: the Bell Media terms and Bell's page on how it
# collects and uses data, which Crave's FAQ links. Not rated: data collection and deletion (that page doesn't
# say), free trials, account sharing and device limits.
policies:
  shared: [bell-privacy]
  links:
    - name: 'Crave terms and conditions'
      url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
    - name: 'Cancelling'
      url: https://plus.crave.ca/en/faq/plans-billing-bundles/canceling-or-pausing-my-crave-subscription/
  ratings:
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online whenever you like, but by the day before it renews at the latest, or you pay for the next period. You keep watching until the end of the time you paid for.'
      sources:
        - url: https://plus.crave.ca/en/faq/plans-billing-bundles/canceling-or-pausing-my-crave-subscription/
          quote: 'To avoid being charged again, you must cancel before your renewal date — if your renewal is on the 15th, cancel by the 14th.'
        - url: https://plus.crave.ca/en/faq/plans-billing-bundles/canceling-or-pausing-my-crave-subscription/
          quote: 'There’s no option to pause a Crave subscription, but you can cancel at any time and continue watching until the end of your current billing period.'
      lastVerified: 2026-11-03
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back, but you keep watching until the end of the time you paid for.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'All Subscription Fees are non-refundable.'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'Following any cancellation, you will continue to have access to the Service through the end of your current billing period, at which point your subscription will terminate.'
      lastVerified: 2026-11-03
    - topic: billing.price-changes
      tier: neutral
      reason: 'It can change the price at any time. It posts the change at least 30 days ahead and tells you, but promises that 30 days’ notice only where a law requires it (Quebec does).'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'we reserve the right, in our sole and absolute discretion, to modify all or any portion of these Terms and Conditions, the Service, and your subscription including the Subscription Fees, at any time'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'In addition, if you have registered for the Service, we will provide you notice as required using your email and/or mailing address, or any other contact information we have for you in our discretion.'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'Where required by law, this notice will be provided at least thirty (30) days before the change comes into effect'
      lastVerified: 2026-11-03
    - topic: legal.disputes
      tier: bad
      reason: 'Unless you live in Quebec, Ontario, Saskatchewan, Alberta or BC, a private referee (an arbitrator) in your city decides any disagreement instead of a court, and you give up your right to a trial.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'This Section does not apply to individuals who reside in Quebec, Ontario, Saskatchewan, Alberta or British Columbia.'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'shall be settled at the request of either party by binding arbitration in the city in which you reside'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'You expressly waive the right to resolve any dispute through any other means, including by trial.'
      lastVerified: 2026-11-03
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It posts changes to its terms at least 30 days ahead and tells you about them, but promises that 30 days’ notice only where a law requires it.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'We will post changes to these Terms and Conditions at least thirty (30) days before the modification comes into effect'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'Where required by law, this notice will be provided at least thirty (30) days before the change comes into effect'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'Before the change comes into effect, you may cancel the Service rather than accept the change.'
      lastVerified: 2026-11-03
    - topic: legal.account-closure
      tier: poor
      reason: 'It can end your subscription for any reason with 30 days’ notice (60 in Quebec), and its terms don’t promise money back.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'Bell Media may cancel your subscription to the Service upon no less than thirty (30) days (if you are a resident of Quebec, sixty (60) days) advance written notice to you.'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'All Subscription Fees are non-refundable.'
      lastVerified: 2026-11-03
    # M11.9's topics, pulled forward at the owner's request (2026-11-02), read that day.
    - topic: privacy.sign-up-data
      tier: poor
      reason: 'To sign up you must give it your phone number as well as an email address and payment details.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'During the registration process for an account with us, you will be asked to provide an email address and phone number, choose a password, provide payment method information, such as your credit card number and billing address, as well as other information.'
      lastVerified: 2026-11-02
    - topic: privacy.children
      tier: neutral
      reason: 'You must be an adult to subscribe, and it may give you parental controls, but its terms make you responsible for what kids watch and say nothing about their data.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'You must be the age of majority in the Canadian province or territory in which you reside in order to subscribe to, register for, access or otherwise use the Service.'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'We may offer tools that are intended to assist you in controlling the Content a minor may view through your registered account, such as parental controls.'
      lastVerified: 2026-11-02
    - topic: billing.free-trials
      status: not-stated
      reason: 'Its terms describe promotions such as gift codes, but no free trial.'
      pages: [https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/]
      lastVerified: 2026-11-02
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say yearly plans renew on their own, but not that it reminds you first.'
      pages: [https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/]
      lastVerified: 2026-11-02
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms list no fees beyond the price and taxes.'
      pages: [https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/]
      lastVerified: 2026-11-02
    - topic: billing.plan-changes
      tier: good
      reason: 'If you move up to a bigger plan, you pay only the difference for the rest of the month.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'The recurring amount charged may vary for reasons that may include differing amounts due to applicable Promotions or if you choose to upgrade your subscription and are charged on a prorated basis for a partial billing period.'
      lastVerified: 2026-11-02
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change the service and what your plan includes at any time, and says it owes you nothing when it does.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'we reserve the right, in our sole and absolute discretion, to modify all or any portion of these Terms and Conditions, the Service, and your subscription including the Subscription Fees, at any time'
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'we may impose limits on certain features and functions or restrict your access to parts or all of the Software or the Service without notice or liability;'
      lastVerified: 2026-11-02
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/]
      lastVerified: 2026-11-02
    - topic: security.practices
      status: not-stated
      reason: 'Its terms say nothing about outside security checks or how to report a security problem, and neither does Bell’s privacy policy.'
      pages: [https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/]
      lastVerified: 2026-11-02
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its terms make you responsible for anyone who uses your account, but don’t say who that can be.'
      pages: [https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/]
      lastVerified: 2026-11-02
    - topic: service.device-limits
      tier: neutral
      reason: 'It can limit how many shows you download, on how many devices, and for how long you can watch them.'
      sources:
        - url: https://plus.crave.ca/en/faq/account-profiles/terms-and-conditions/
          quote: 'For example, such limitations may include restrictions on the number of Offline Titles per account, the maximum number of devices that can contain Offline Titles, the time period within which you will need to begin viewing Offline Titles, the number of times Offline Titles may be viewed, and how long the Offline Titles will remain accessible.'
      lastVerified: 2026-11-02
