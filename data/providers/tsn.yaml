id: tsn
name: TSN
aliases: [the sports network]
website: https://www.tsn.ca
category: streaming
spendCategory: streaming
billingCurrency: { CA: CAD }
# tsn.ca/help/faq/#not-canada, read 2026-10-26: "TSN is only available for subscription and use within Canada due to
# licensing agreements."
availableIn: [CA]
# The FAQ's cancellation steps: Account > Manage Subscription > Subscriptions > Cancel Subscription.
cancelUrl: https://www.tsn.ca/help/faq/#cancellations
sources: { pricing: https://www.tsn.ca/subscribe/ }
notes: >-
  Plans renew for the period chosen, except in Quebec, where they renew monthly. Select NHL regular-season games
  only, with regional blackouts.

# Read 2026-10-26 on tsn.ca/subscribe: Standard is sold monthly only (the 3 Months and Annual tabs show Premium
# alone), and "Everything in TSN Standard, plus" Premium's extras. Two streams at a time on every plan
# (tsn.ca/help/faq/#concurrency). TSN's bundles with Crave and RDS are in data/bundles.
plans:
  - id: tsn.standard
    name: Standard
    link: https://www.tsn.ca/subscribe/
    features:
      streaming.live: [tv-channels, sports]
      streaming.concurrent-streams: 2
    perks: [TSN 1–5 live channels, Multiviewing up to 6 games at once]
    prices:
      - region: CA
        currency: CAD
        amount: 24.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://www.tsn.ca/subscribe/

  - id: tsn.premium
    name: Premium
    link: https://www.tsn.ca/subscribe/
    features:
      streaming.live: [tv-channels, sports]
      streaming.concurrent-streams: 2
    perks:
      - TSN 1–5 live channels
      - Multiviewing up to 6 games at once
      - NFL RedZone
      - 24 more NFL and 75 more NBA games
      - PGA Tour Live
      - Every LaLiga match
      - Award-winning sports docs
    prices:
      - region: CA
        currency: CAD
        amount: 29.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://www.tsn.ca/subscribe/
      - region: CA
        currency: CAD
        amount: 74.99
        interval: month
        intervalCount: 3
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://www.tsn.ca/subscribe/
      - region: CA
        currency: CAD
        amount: 249.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://www.tsn.ca/subscribe/

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: TSN's terms and conditions and Bell's page on how
# it collects and uses data, which tsn.ca links. Not rated: price and terms changes and closing accounts (its terms
# don't say), data collection and deletion, free trials, account sharing and device limits.
policies:
  links:
    - name: 'Terms and conditions'
      url: https://www.tsn.ca/terms-and-conditions/
    - name: "Bell's use of data"
      url: https://www.bell.ca/Security_and_privacy/How_we_collect_and_use_data
  ratings:
    - topic: privacy.data-sharing
      tier: leaning-good
      reason: 'Shared within Bell, and outside it only when the law requires or you agree.'
      sources:
        - url: https://www.bell.ca/Security_and_privacy/How_we_collect_and_use_data
          quote: 'To get a better idea of your needs and how we can fulfill them, we sometimes share information between our companies.'
        - url: https://www.bell.ca/Security_and_privacy/How_we_collect_and_use_data
          quote: 'We only disclose personal information with parties outside our family of companies and suppliers when we are required to or when you have given express consent for us to do so.'
      lastVerified: 2026-10-27
    - topic: privacy.ads-tracking
      tier: neutral
      reason: 'Tailored ads by default; you can change your ad preferences or block cookies.'
      sources:
        - url: https://www.bell.ca/Security_and_privacy/How_we_collect_and_use_data
          quote: 'You can manage the types of ads you receive or opt out of communications by updating your preferences.'
      lastVerified: 2026-10-27
    - topic: billing.cancel-refunds
      tier: neutral
      reason: 'Cancel and keep it to the end of the period, with no refunds.'
      sources:
        - url: https://www.tsn.ca/terms-and-conditions/
          quote: 'All Subscription Fees are non-refundable. Following any cancellation, you will continue to have access to the Service through the end of your current billing period, at which point your subscription will terminate.'
      lastVerified: 2026-10-27
    - topic: legal.disputes
      tier: bad
      reason: 'Binding arbitration in your city, giving up courts and trials.'
      sources:
        - url: https://www.tsn.ca/terms-and-conditions/
          quote: 'shall be settled at the request of either party by binding arbitration in the city in which you reside'
        - url: https://www.tsn.ca/terms-and-conditions/
          quote: 'You expressly waive the right to resolve any dispute through any other means, including by trial.'
      lastVerified: 2026-10-27
