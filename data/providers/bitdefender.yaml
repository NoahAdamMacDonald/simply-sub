  # Antivirus Free (M11.9, the owner's item), read 2026-11-03 on its own pages (/en-us/ and /en-ca/consumer/free-antivirus,
  # in the same words): its comparison with Antivirus Plus gives it "Basic ransomware protection", and Antivirus Plus
  # "Ransomware remediation: blocks threats, automatically restores your files", so it blocks ransomware but recovers
  # no files. Its FAQ: it "includes a basic version of Bitdefender VPN, which offers up to 200 MB of encrypted traffic
  # per device, per day", so it isn't sold as a VPN (notIn), as Antivirus Plus isn't. It shields from "Phishing" and
  # "Malicious Websites".
  # Read again 2026-11-13 (the owner's item 3), its page not being among the paid plans: "Download Bitdefender Free
  # Antivirus for Windows and benefit from real time protection for your laptop or PC." (real-time); "Our advanced
  # behavior-based detection catches even the vilest virus before it can wreak havoc." and its "Advanced Threat Defense"
  # (behavioural); "With powerful scanning and removal tools, we'll hunt down existing viruses" and "customizable virus
  # scans" (scans you start), with "customizable scanning scheduling options" (support answer 2027: scheduled). No rescue
  # scan on its pages. Its comparison's "No anti-tracking measures", "No productivity & entertainment mode" and "No
  # full-system analysis" (where Antivirus Plus "Scans your entire PC for outdated software and unsafe settings") are
  # stated as false. It needs a Bitdefender account: "Simply download and install the product by creating a Bitdefender
  # Central Account."
  - id: bitdefender.antivirus-free
    name: Antivirus Free
    link: https://www.bitdefender.com/en-ca/consumer/free-antivirus
    notIn: [vpn]
    features:
      platforms: [windows]
      antivirus.activity-modes: false
      antivirus.behavioural: true
      antivirus.included: true
      antivirus.ransomware: [blocking]
      antivirus.real-time: true
      antivirus.scans: [on-demand, scheduled]
      antivirus.vulnerability-scan: false
      antivirus.web-protection: true
      security.anti-tracker: false
      vpn.included: true
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-13
        sourceUrl: https://www.bitdefender.com/en-ca/consumer/free-antivirus

# Every agreement a user accepts (the owner's rule, 2026-11-03), read that day: its subscription agreement is also its
# apps' licence and includes IPVanish's acceptable use policy for the VPN, all on one page (so its link is now
# "Licence and terms of service"). Ultimate Security Plus's identity theft protection is licensed under IdentityForce's
# terms (bitdefender.identityforce.com/terms-of-use, Sontiq's, a TransUnion brand), which blocked this machine on
# 2026-11-03 and read in Edge on 2026-11-04 (revised December 1, 2021): four of its clauses are worse than Bitdefender's
# own, rated for the four Ultimate Security Plus plans (closing an account, rights over what you post, ending the
# service, what sign-up needs); its arbitration, terms changes and refunds are no worse. Its Privacy Notice, which the
# terms include, wasn't found: the terms page's link names no address, and /privacy-policy on its site and on
# identityforce.com answer "page not found". The checkout's agreement line wasn't read: bitdefender.com rate-limits this
# machine.
policies:
  links:
    - name: Licence and terms of service
      url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
    - name: 'IdentityForce terms of use (identity theft protection)'
      url: https://bitdefender.identityforce.com/terms-of-use
    - name: 'Certifications'
      url: https://www.bitdefender.com/en-ca/business/certifications
    - name: 'Bug bounty'
      url: https://www.bitdefender.com/en-us/site/view/bug-bounty
    - name: 'Privacy policy'
      url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
    - name: 'Cancelling (turning off renewal)'
