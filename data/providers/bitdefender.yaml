policies:
  links:
    - name: Terms of service
      url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
  ratings:
    - topic: billing.cancel-refunds
      tier: good
      reason: You can turn off renewal in your Bitdefender Central account before the next billing date, and you can ask for your money back within 30 days of buying.
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: unless You cancel Your subscription through the Bitdefender Central Account prior to Your next scheduled billing date
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: FOR INFORMATION ON HOW TO OBTAIN A REFUND OF THE MONEY YOU PAID FOR THE SOFTWARE AT ANY TIME DURING THE THIRTY (30) DAYS PERIOD FOLLOWING THE DATE OF PURCHASE.
      regions: [CA]
      lastVerified: 2026-10-28
    - topic: billing.price-changes
      tier: great
      reason: A new price only applies from your next renewal, and it tells you ahead of time, so you can cancel first.
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: Any price change will take effect at the next subscription renewal date, and we will notify you in advance.
      regions: [CA]
      lastVerified: 2026-10-28
    - topic: legal.account-closure
      tier: neutral
      reason: If you break its terms, your subscription ends right away without notice, and you get no refund.
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: The Subscription will terminate immediately without notice if You are in breach of any of its terms and conditions. You shall not be entitled to a refund from Bitdefender or any resellers of Bitdefender as a result of termination.
      regions: [CA]
      lastVerified: 2026-10-28
