          quote: 'Bitdefender hereby grants You and only You the following non-exclusive, limited, non-sublicensable, non-commercial right to use Bitdefender Solution for Your personal use only without the right to redistribute.'
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: 'You may not reverse engineer, decompile, disassemble, modify, or create derivative works from the Bitdefender Solution, except and only to the extent that applicable law expressly permits.'
      lastVerified: 2026-11-03
    - topic: other.notable
      title: Its VPN is built on another company's
      tier: neutral
      reason: "Its VPN runs on IPVanish's network, and its terms include IPVanish's rules: no more than 1 TB a month or 20 IP addresses a day, and IPVanish alone decides what breaks them."
