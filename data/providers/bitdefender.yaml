# The US's Ultimate Security Plus (M11.9, the owner's choice of 2026-11-03), read 2026-11-03 with Mullvad Browser on
# /en-us/consumer/ultimate-security: Standard and Extended, each Individual ("1 member - up to 5 devices") and Family
# ("5 members & 25 devices"), monthly or yearly. Everything in Ultimate, plus identity theft protection: "Identity
# Theft Insurance (up to $1.000.000)" and "Credit Reports & Monitoring (1 bureau)" on Standard, "(up to $2.000.000 per
# household)" and "(3 bureau)" on Extended, with its restoration services (the US Digital Identity Protection page:
# "Identity Theft Restoration Services"); Extended adds the refunds and alerts its perks name. "This service is
# available with Bitdefender Ultimate Security Plus and requires a valid Social Security Number".
# Coverage: bitdefender.ultimate-security-plus-standard-individual, bitdefender.ultimate-security-plus-extended-individual, bitdefender.ultimate-security-plus-standard-family and bitdefender.ultimate-security-plus-extended-family in CA, GB, AU, NZ, DE, FR, NL,
# ES and IT: sold in the US only, its identity theft protection needing a US Social Security Number.

# Identity protection (M11.9, the owner's choice of 2026-11-03), read 2026-11-03: Ultimate's cards add "Digital Identity
# Protection 1x" (5x on Family), with "Digital Footprint Visualization" and "Real Time Breach Notifications", which
# Premium's don't ("Data Breach Detection" only); the US Digital Identity Protection page says Ultimate "Includes Digital
# Identity Protection". So Ultimate includes that plan and shows where your data is exposed (security.data-exposure:
# footprint), as Digital Identity Protection does.

# Every region's plans and billing periods (M11.9, the region checklist), read 2026-11-03 with Mullvad Browser. Edge
# shows no price on any of its pages now, Canada's too: the owner's DNS filter blocks a script they wait for, and Mullvad
# Browser's own DNS gets past it. Each page in a region's locale (/en-gb/, /en-au/, /en-nz/, /de-de/, /fr-fr/, /nl-nl/,
# /es-es/, /it-it/) prices in that region's currency, whoever reads it: the suites' Individual and Family cards, each
# yearly and 2 years (Ultimate monthly too: "Monthly price."), the antivirus page's 1 and 3 devices, and the VPN page's
# Premium VPN. The regular price is the struck-through one ("£104.99 Save 33%"); the one under it is the first term's.
# The five euro countries' prices are the same. Each region's pages say tax is included, beside each price ("Sales tax
# included.", "Inklusive MwSt.", "TVA incluse.", "Inclusief BTW.", "IVA incluido.", "IVA inclusa."), Canada's as well
# (taxIncluded, missing from its prices until now); the US's say "Plus applicable sales tax."
# Tax, read again 2026-11-09 from a Canadian connection with Mullvad Browser: the English pages (Canada, the UK,
# Australia, New Zealand) still say "Sales tax included." beside each plan's price, but their "Compare Bitdefender
# Products" section gives the same prices with "Plus applicable sales tax", the US's wording. The checkout (2Checkout,
# "the merchant of record for this transaction") settles it: Canada's and the UK's order summaries say "Taxes included"
# with the total equal to the price (CA$59.99, £49.99), where the US's says "May apply according to your location". So
# the taxIncluded stays (the owner's choice that day). The euro countries' pages say it in both places.

# Monthly billing (the owner's tasks), read 2026-11-03 with Mullvad Browser: only Ultimate's cards sell it (stored,
# every region), and Digital Identity Protection's "1- Month Plan" in Canada, the UK and New Zealand, whose pages say
# only "Billed CA$7.99 for the first month" (£7.99, NZ$12.99) with no regular price, so it isn't stored. Every other
# page read offers "Yearly" and "2 Years" (the suites) or a yearly price alone (Antivirus Plus, Premium VPN, Digital
# Identity Protection in the US): all five products in Canada, the US and the UK; Premium and Total Security in
# Australia, New Zealand, Germany and Italy; Total Security and Antivirus Plus in France; Total Security in Spain; Total
# Security, Antivirus Plus, Premium VPN and Digital Identity Protection in the Netherlands; Digital Identity Protection
# in New Zealand and Germany. Bitdefender's site then rate-limited the reader twice (Cloudflare's error 1015), so 18
# pages waited until 2026-11-04, read then with Mullvad Browser a minute apart: Antivirus Plus, Premium VPN and Digital
# Identity Protection in Australia and Italy, Antivirus Plus and Premium VPN in New Zealand and Germany, Premium
# Security, Premium VPN and Digital Identity Protection in France, Premium Security in the Netherlands, and Premium
# Security, Antivirus Plus, Premium VPN and Digital Identity Protection in Spain. None sells monthly billing at a regular
# price: Premium VPN's "Per month" is "billed yearly", and Digital Identity Protection's 1-month plan in Australia,
# Italy, France and Spain states only its first month ("Billed A$12.99 for the first month", "Addebito €6.99 per il
# primo mese"), as in Canada. Every yearly price stored for them is on its page.

# Every plan's features, read again 2026-11-13 (the owner's items 1 to 4) against the registry's antivirus, security,
# password-manager, VPN and parental-control features: each plan page's cards and its feature lists for Windows, macOS,
# iOS and Android (a plain fetch holds all four), its "Compare" table, and the support centre's product articles ("What
# is Bitdefender Total Security?", answer 121668; "What is Bitdefender Antivirus Plus?", 121630; "Antivirus Plus
# Multiplatform", 108530), which outweigh a sales page's older comparison table.
# - Real-time protection (antivirus.real-time), every plan with an antivirus: "Complete Real-Time Data Protection" on
#   every plan page, "Bitdefender Shield, the real-time protection feature included in the Antivirus module, provides
#   continuous protection against a wide range of malware threats by scanning all accessed files and e-mail messages."
#   (answer 13450), and Antivirus Plus's "Real-time threat detection : Monitors and blocks malware in real time,
#   preventing threats from affecting your system." (108530).
# - Behaviour-based detection (antivirus.behavioural): "Advanced Threat Defense – Detects and prevents zero-day attacks
#   by analyzing suspicious behavior in real-time." (121668, 121630), and each plan page's "Advanced Threat Defense ...
#   uses a technique called behavioral detection to closely monitor active apps."
# - Scans (antivirus.scans): scans you start, "You can also manually scan your PC at any time to make sure it’s safe."
#   (121668, 121630); scheduled ones, "Schedule a System Scan or a Quick Scan ." (answer 2056, "available only on
#   Windows"); and the rescue scan before Windows starts, each plan page's "Rescue Environment ... it reboots the computer
#   in Rescue Environment for clean-up and restoration." (answer 29132, "available only on Windows 10 and later").
# - Scam protection: Premium, Ultimate and Ultimate Security Plus have Scam Protection Pro ("Scam Protection Pro is
#   Bitdefender’s all-in-one scam protection service", answer 103356: web, webmail "Email Protection", "SMS
#   Protection", "Chat Protection : Monitors chats in popular messaging apps WhatsApp, Facebook Messenger, Telegram, and
#   Discord for scams (Android only)"), and their Android lists add "Spam & Scam Call Blocking" (calls, added). Total
#   Security's card: "Core protection against scams. Blocks phishing and fake shops in real time. It even recognizes
#   emerging SMS or social media scams."; its Android list has "Spam & Scam Call Blocking"; and the Android app's Scam
#   Protection "automatically detects link-based mobile attacks delivered through SMS, messaging apps, notifications"
#   (answer 42907): web, texts, chat apps and calls, but not email ("Email Protection ... Available in premium plans.",
#   121668). Antivirus Plus has the same card and Android Scam Protection, but no call blocking in its Android list.
# - Network protection: "Wi-Fi Security Advisor" on every plan page's Windows list (it "analyzes how secure a wireless
#   network is", answer 40620), so wifi-check is added to all; "Privacy Firewall" on Total Security and up, not on
#   Antivirus Plus (its Compare table: "Privacy Firewall no").
# - Anti-theft on Antivirus Plus (added): its Android list's "Anti-Theft ... remotely locate, lock, wipe or send a
#   message to your device in case of loss or theft"; Total Security and up have it on Windows too (answer 32561:
#   LOCATE, LOCK, WIPE).
# - Ultimate's pages leave "Safe Online Banking" (Safepay) out of their Windows list, but its other pages say Ultimate
#   has "Everything from Premium Security" (bitdefender.com/en-ca/consumer/ and /vpn), and Safepay is "built into
#   Bitdefender’s Windows security solutions" (answer 2051), so secure-browser stays.
# - SecurePass (the owner's item 4): its current name. "Bitdefender Password Manager ... reached End-of-Life (EOL) on
#   June 15, 2026, and is no longer available." and "The service has been replaced by Bitdefender SecurePass" (answer
#   109121); its page is "Bitdefender SecurePass – Secure Password Manager" and Total Security "Includes SecurePass". The
#   plan cards still say "Password Manager" or "Password management", so the plans label the feature SecurePass
#   (featureLabels). Its FAQ (answer 107798), read again, gives the same item types, report and sharing as before: "To
#   add an item like an account, credit card, identity or note", "How do I use Bitdefender SecurePass as a 2FA app?", a
#   security report of "Breached passwords", "Weak passwords", "Old passwords (used for more than 6 months)", "Duplicate
#   passwords" and "Suspicious websites that could expose your login data", share links "with options like expiration
#   dates, usage limits, and password protection", and Groups "by setting specific rights (read, write, grant)". No
#   passkeys and no shared folders. Antivirus Plus keeps it: its support article lists "SecurePass – A password manager
#   that securely stores and autofills your login credentials." though its sales page's Compare table says "Password
#   Manager no".
# - Premium VPN, every plan with it (Total Security's, Antivirus Plus's and Antivirus Free's Standard VPN, 200 MB a day,
#   isn't sold as a VPN). Its Windows settings (/answer/131733/): "Internet Kill-Switch – Stops all Internet traffic if
#   the VPN connection is briefly lost.", "Split tunneling – Select apps and websites to bypass the VPN", and auto-connect
#   for "Peer-to-peer apps – Connect VPN when starting a peer-to-peer file sharing app."; its terms ban no P2P, so P2P
#   is allowed (inferred). "Double-hop" (/answer/96952/). Read again 2026-11-13: its protocols article (answer 131796)
#   adds obfuscation, "The Scramble switch adds obfuscation to OpenVPN traffic." (stealth, added); its FAQ (answer 7126)
#   says "The server list includes 110 countries across the globe" (110, where the cards say "100+ countries" and the
#   plans page an older "over 49 countries"), "Premium VPN can be used on a maximum of 10 devices at once", and in a
#   suite "the VPN will inherit the device limit in that bundle", so 5 on the individual suites (Family's "5x" with 25
#   devices and "no more than 10 devices connected at a time" is left out: per member or per family isn't said); and
#   its no-log article (answer 116380) says "In 2025, the infrastructure used by Bitdefender VPN underwent an independent
#   audit to verify our no-log policy." (vpn.independent-audits: no-logs, added; it names no auditor and links no
#   report). No port forwarding or Tor on any of these pages, and a Bitdefender account to sign up, so none of those.
