# Drafted by the discovery pipeline on 2026-10-28 (BLUEPRINT §6.5) from these pages, each quoted where it's used.
# Pricing: https://www.bitdefender.com/en-ca/consumer/premium-security,
# https://www.bitdefender.com/en-ca/consumer/total-security,
# https://www.bitdefender.com/en-ca/consumer/ultimate-security,
# https://www.bitdefender.com/en-ca/consumer/digital-identity-protection, https://www.bitdefender.com/en-ca/consumer/.
# Payment methods: none found.
# Cancelling: https://www.bitdefender.com/consumer/support/answer/29081/.
# Terms:
# https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions.
# Privacy: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions.
# Bundles: none found.
# Official resellers: none named for its home plans (M11.9, read 2026-11-03). Its partner locator and partner pages
# (bitdefender.com/en-us/partners/) are its business channel's, and its home users' terms speak of "its distributors or
# resellers" without naming any.
# Not on the pages: Digital Identity Protection's 1-Month Plan: the page says CA$7.99 "for the first month" and not what
# it renews at, so it isn't stored; Mobile Security for iOS and for Android: not read; the card networks it takes: no page read names them; disputes: its Canadian terms both require arbitration and name the
# courts of Romania, so the topic is left for a person to read; official resellers: none named for its home plans; its
# partners page is for business partners.

id: bitdefender
name: Bitdefender
website: https://www.bitdefender.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    GB: GBP,
    US: USD,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
cancelUrl: https://www.bitdefender.com/consumer/support/answer/29081/
sources: { pricing: https://www.bitdefender.com/en-ca/consumer/ }
# Owner (M11.2), read 2026-11-02: its privacy policy names the company that runs it, a private company in Romania.
owner:
  name: Bitdefender S.R.L. (Bucharest, Romania)
  page:
    name: Privacy policy
    url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
  quotes:
    - 'BITDEFENDER S.R.L. (hereafter mentioned as Bitdefender), with its official headquarters in 15A Sos. Orhideelor, Orhideea Towers Building, 10-12 floors, 6th District, Bucharest, Romania'
  lastVerified: 2026-11-02
# Ways to pay (M11.5), read 2026-11-02 in its privacy policy, which names its payment processors: a card (through Adyen) or
# PayPal.
paymentMethods:
  - methods: [card, paypal]
    page: Privacy policy
    url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
    quotes:
      - 'the payment services provider Adyen.com, which is a data controller for data on your credit card payment data'
      - 'PayPal, if you choose this method of payment'
