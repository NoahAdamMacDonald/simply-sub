# Drafted by the discovery pipeline on 2026-10-28 (BLUEPRINT §6.5) from these pages, each quoted where it's used.
# Refreshed by hand on 2026-11-13 (the owner's lists of 2026-11-10 and 2026-11-13): every plan's features against the
# registry's antivirus, security, password-manager, VPN and parental-control features (the new antivirus.real-time,
# antivirus.behavioural and antivirus.scans among them), Antivirus Free from its own page, SecurePass's name, a search
# of Bitdefender's own pages for SerialCart, Canada's and the US's prices and checkout, sign-in, owner and AV-TEST.
# bitdefender.com is blocked by the owner's DNS filter, so its plan pages were read 2026-11-13 through a Canadian exit
# and a US exit (prices, which its store script fills in), and with a plain fetch (curl), which gets each page's
# feature lists for every platform; its support centre, terms and privacy policy were read with a plain fetch.
# Pricing: https://www.bitdefender.com/en-ca/consumer/premium-security,
# https://www.bitdefender.com/en-ca/consumer/total-security,
# https://www.bitdefender.com/en-ca/consumer/ultimate-security,
# https://www.bitdefender.com/en-ca/consumer/digital-identity-protection, https://www.bitdefender.com/en-ca/consumer/.
# Payment methods: https://www.bitdefender.com/consumer/support/answer/29437/.
# Cancelling: https://www.bitdefender.com/consumer/support/answer/29081/.
# Terms:
# https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions.
# Privacy: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions.
# Bundles: none found.
# Official resellers: none named for its home plans (M11.9, read 2026-11-03; searched again 2026-11-13). Its partner
# locator (its "Find a Reseller" link, bitdefender.com/en-us/partners/partner-locator) lists business partners; its
# home users' terms speak of "its distributors or resellers" without naming any. SerialCart, which says it's an
# official reseller, is named on no Bitdefender page: not in its support centre's article index
# (bitdefender.com/consumer/support/llms.txt), its sitemaps or the partner locator's 78 partners in Germany (read
# 2026-11-13 through a German exit), and a web search of bitdefender.com finds no page naming it (only SerialCart's own
# forum posts elsewhere). So it isn't listed (BLUEPRINT §4.9).
# Not on the pages: Digital Identity Protection's 1-Month Plan: the page says CA$7.99 "for the first month" and not what
# it renews at, so it isn't stored; the card networks it takes: no page read names them; disputes: its Canadian terms
# both require arbitration and name the courts of Romania, so the topic is left for a person to read.
# Sold but not in the catalog (2026-11-13): SecurePass on its own ("*Billed CA$29.99 for the first year.", no regular
# price), Mobile Security for iOS and for Android (CA$29.99 each), and the US's Identity Theft Protection Standard and
# Premium ($129.99 and $209.99 a year), each on its own page; Antivirus for Mac, Internet Security and Family Pack are in
# its menu but weren't read.

id: bitdefender
name: Bitdefender
website: https://www.bitdefender.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    GB: GBP,
    US: USD,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
cancelUrl: https://www.bitdefender.com/consumer/support/answer/29081/
sources: { pricing: https://www.bitdefender.com/en-ca/consumer/ }
# Owner (M11.2), read 2026-11-02 and again 2026-11-13: its privacy policy names the company that runs it, a private
# company in Romania (an S.R.L., a Romanian limited liability company). No `stock`: no Bitdefender page names an
# exchange or a ticker (its company page, bitdefender.com/en-us/company/, gives its headquarters, "Bucharest,
# Romania", and no listing), so it's private, as the owner says.
owner:
  name: Bitdefender S.R.L.
  page:
    name: Privacy policy
    url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
  quotes:
    - 'BITDEFENDER S.R.L. (hereafter mentioned as Bitdefender), with its official headquarters in 15A Sos. Orhideelor, Orhideea Towers Building, 10-12 floors, 6th District, Bucharest, Romania'
  country:
    code: RO
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-03 (the owner's tasks) in its support centre's guide to buying, where 2026-11-02's
# read was its privacy policy's payment processors: a card or PayPal. No page names the card networks. Read again
# 2026-11-13, in the same words. Its checkout (2Checkout, "the merchant of record for this transaction") charges
# Canada in CA$ ("169.99 CA$") and the US in USD ("169.99 USD"), read that day through each country's exit up to
# the email field. No Bitdefender page says what currency a renewal is charged in (see the Prices note below).
paymentMethods:
  - methods: [card, paypal]
    page: 'How to buy and activate a subscription'
    url: https://www.bitdefender.com/consumer/support/answer/29437/
    quotes:
      - 'Then select a payment method (card, PayPal, etc.) and complete the order.'
# Lab results (M11.2), read 2026-11-02: AV-TEST's latest Windows test of home-user products, Jul-Aug 2026 (its page
# for it, report 261405). AV-Comparatives' and SE Labs' results aren't listed: see data/raters.yaml. Checked again
# 2026-11-13: AV-TEST's Bitdefender page still lists August 2026 as its newest Windows test (October 2026's page has
# no results yet), so these stay.
ratings:
  - rater: av-test
    subject: antivirus-protection
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/bitdefender-total-security-27.0-261405/
    tested: Total Security 27.0, Windows 11
  - rater: av-test
    subject: antivirus-performance
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/bitdefender-total-security-27.0-261405/
    tested: Total Security 27.0, Windows 11
  - rater: av-test
    subject: antivirus-usability
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/bitdefender-total-security-27.0-261405/
    tested: Total Security 27.0, Windows 11

# Categories (M11.3): an antivirus first (security). Every paid plan but Premium VPN and Digital Identity Protection has
# its password manager, SecurePass, as its support centre's articles list it, so it's in passwords too. "What is Bitdefender Antivirus
# Plus?" lists "SecurePass - A password manager that securely stores and autofills your login credentials", which
# outweighs the sales page's older comparison table ("Password Manager no yes"). Premium and Ultimate Security have its
# Premium VPN, unlimited, so they're VPN plans as well; Total Security and Antivirus Plus have only its Standard VPN,
# "200 MB/day traffic", so they aren't (notIn).
# Renewal day (M11.5), read 2026-11-03 (M11.9) in its subscription agreement for home users: each anniversary of the
# purchase. Read again 2026-11-13, in the same words.
renewalAnchor:
  kind: same-date
  page: Subscription agreement
  url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
  quotes:
    - "Your subscription will be automatically renewed prior to the expiration of the term and each anniversary thereafter for a fee at Bitdefender's then-current price and any applicable taxes, excluding promotional and discount pricing offered at the renewal time."
  lastVerified: 2026-11-13

# General features, read 2026-11-11: app languages from Bitdefender Central's list ("English, French, German, Spanish,
# Italian, Portuguese ... Japanese, Korean ... Chinese (Traditional)", answer 113564) and its country picker ("France
# - Français"); no Hindi or Arabic. Parental controls on the family plans only: "Parental Control is not included in
# individual plans. It is exclusively available in family plans." (answer 94159). No pause: you can "cancel your
# automatic renewal service at any time" or cancel (answer 29081).
# Apps, sign-in and support (M11.9, the cross-category features), read 2026-11-03: Windows, macOS, Android and iOS on its
# product and VPN pages ("Windows®, macOS®, Android™, iOS®"), but Antivirus Free, "Windows only", and Digital Identity
# Protection, "a web-based service"; Bitdefender Central's password, with two-factor codes by email or an authenticator
# app and trusted devices (support answer 1581); chat or phone once signed in, and its forum
# (bitdefender.com/site/Main/contactus).
# Sign-in and support read again 2026-11-13 (the owner's item 7). Answer 1581 still offers "Email or Authenticator
# app" codes and trusted devices ("You can sign in from trusted devices without using 2-Factor Authentication."), and
# "How to Create a Bitdefender Central Account" (answer 118211) adds signing in with another account: "Or sign in
# using Facebook, Google, Microsoft, or Apple." (sso). No support article mentions passkeys, security keys or text
# message codes. Support around the clock: "you get 24/7 expert assistance for anything you need" (its product pages).
features:
  platforms: [windows, macos, android, ios]
  account.sign-in: [password, email-code, totp, trusted-device, sso]
  support.channels: [chat, phone, community, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh]

