policies:
  links:
    - name: Terms of service
      url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
    - name: 'Certifications'
      url: https://www.bitdefender.com/en-ca/business/certifications
    - name: 'Bug bounty'
      url: https://www.bitdefender.com/en-us/site/view/bug-bounty
    - name: 'Privacy policy'
      url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
    - name: 'Cancelling (turning off renewal)'
      url: https://www.bitdefender.com/consumer/support/answer/29081/
    - name: 'Refunds and renewal terms (plans page)'
      url: https://www.bitdefender.com/en-ca/consumer/
  ratings:
    - topic: billing.cancellation
      tier: good
      reason: 'You can turn off renewal in your Bitdefender Central account at any time before it renews, in a few steps.'
      sources:
        - url: https://www.bitdefender.com/consumer/support/answer/29081/
          quote: 'You can cancel your automatic renewal service at any time.'
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: 'unless You cancel Your subscription through the Bitdefender Central Account prior to Your next scheduled billing date'
      lastVerified: 2026-11-03
    - topic: billing.refunds
      tier: good
      reason: 'You can get your money back within 30 days of buying it, and again within 30 days of each time it renews, by writing to its refunds address.'
      sources:
        - url: https://www.bitdefender.com/en-ca/consumer/
          quote: 'You can refund by contacting refunds@bitdefender.com within 30 days of your initial purchase or of the automatic renewal date.'
      lastVerified: 2026-11-03
    - topic: billing.price-changes
      tier: great
      reason: A new price only applies from your next renewal, and it tells you ahead of time, so you can cancel first.
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: Any price change will take effect at the next subscription renewal date, and we will notify you in advance.
      lastVerified: 2026-11-03
    - topic: legal.account-closure
      tier: neutral
      reason: If you break its terms, your subscription ends right away without notice, and you get no refund.
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: The Subscription will terminate immediately without notice if You are in breach of any of its terms and conditions. You shall not be entitled to a refund from Bitdefender or any resellers of Bitdefender as a result of termination.
      lastVerified: 2026-11-03
    - topic: security.practices
      tier: good
      reason: 'Outside auditors check its security every year, but you have to ask for their full report. It may pay you a reward for finding a security bug in its apps or website.'
      sources:
        - url: https://www.bitdefender.com/en-ca/business/certifications
          quote: 'Our security controls are audited each year, following the AICPA SSAE-16 SOC 2 guidelines for the Security, Confidentiality, and Availability principles.'
        - url: https://www.bitdefender.com/en-ca/business/certifications
          quote: 'The first page of the report is available here and the full report can be obtained upon request.'
        - url: https://www.bitdefender.com/en-us/site/view/bug-bounty
          quote: 'The Bug Bounty Reward program encourages security researchers to identify and submit vulnerability reports regarding virtually everything that bears the Bitdefender brand'
      lastVerified: 2026-11-02
    - topic: other.notable
      title: Removes other security apps
      tier: poor
      reason: 'When you install it, it may take off or turn off other security apps already on your device if they clash with it.'
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: 'During the installation process, Bitdefender Solution may uninstall or disable other security products if such products or features are incompatible with Bitdefender Solution.'
      lastVerified: 2026-11-02
    - topic: other.notable
      title: Its VPN is built on another company's
      tier: neutral
      reason: "Its VPN runs on IPVanish's network, and its terms include IPVanish's rules: no more than 1 TB a month or 20 IP addresses a day, and IPVanish alone decides what breaks them."
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: 'The VPN functionality has a third-party software component'
        - url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
          quote: 'All IPVanish customers are responsible for reviewing and complying with this Acceptable Use Policy'
      lastVerified: 2026-11-02
    # M11.9's topics, pulled forward at the owner's request (2026-11-02), read that day: its terms (one document for
    # every country, so its Canadian ratings above now stand for everywhere) and its home-user privacy policy.
    - topic: privacy.data-collection
      tier: poor
      reason: 'Besides what it needs to protect you, it uses your data to improve its products and build new ones. You can only object by asking, under privacy law.'
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'assuring correct and efficient operation of its solutions and services, according to the technical specifications, and for their improvement, including analyzing the reported IT security issues, delivering and customizing the related services to the user’s needs and developing new technologies;'
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'data subjects shall have the right to access to data, rectification, erasure, restriction of processing, objection to processing and right to data portability.'
      action:
        name: 'How to use your privacy rights'
        url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
      lastVerified: 2026-11-02
    - topic: privacy.data-sharing
      tier: great
      reason: 'It doesn’t sell your data, and only its own staff and the companies doing work for it can see it.'
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'We do not sell your data.'
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'Access to the collected personal data is restricted only to Bitdefender employees and data processors that need access to this information.'
      lastVerified: 2026-11-02
    - topic: privacy.ads-tracking
      status: not-stated
      reason: 'Its privacy policy doesn’t say whether it tracks you for ads.'
      pages:
        [https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions]
      lastVerified: 2026-11-02
    - topic: privacy.ai-training
      tier: great
      reason: 'It only trains its AI on data with your details taken out, to catch threats better. It never trains it on your personal data.'
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'Anonymized collected data may also be used for AI training purposes, including detection and false positive/false negative mitigation. AI models are not trained on any personal data.'
      lastVerified: 2026-11-02
    - topic: privacy.content-access
      tier: neutral
      reason: 'Only its staff and helpers who need to can see your data. Its email protection looks at your emails only enough to spot who they’re from.'
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'Bitdefender only processes the minimum amount of data necessary for this purpose and does not access or analyze the content of emails beyond what is required to identify the sender and its associated service.'
      lastVerified: 2026-11-02
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps data as long as it’s useful for security, up to 10 years, and identity alerts two months after your plan ends.'
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'Based on the current speed of technology, even for malicious data, we will not need them for over 10 years from the day of the collection.'
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'We store the received information for as long as you have the service active and for an additional two months after the service end'
      lastVerified: 2026-11-02
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask it to delete your data, but it doesn’t say how fast.'
      sources:
        - url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
          quote: 'data subjects shall have the right to access to data, rectification, erasure, restriction of processing, objection to processing and right to data portability.'
      action:
        name: 'How to use your privacy rights'
        url: https://www.bitdefender.com/en-ca/site/view/legal-privacy-policy-for-home-users-solutions
      lastVerified: 2026-11-02
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask for a copy of your data to take elsewhere.'
