    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/bitdefender-total-security-27.0-261405/
    tested: Total Security 27.0, Windows 11
  - rater: av-test
    subject: antivirus-usability
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/bitdefender-total-security-27.0-261405/
    tested: Total Security 27.0, Windows 11

# Categories (M11.3): an antivirus first (security). Every paid plan but Premium VPN has its password manager,
# SecurePass, as its support centre's articles list it, so it's in passwords too. "What is Bitdefender Antivirus
# Plus?" lists "SecurePass - A password manager that securely stores and autofills your login credentials", which
# outweighs the sales page's older comparison table ("Password Manager no yes"). Premium and Ultimate Security have its
# Premium VPN, unlimited, so they're VPN plans as well; Total Security and Antivirus Plus have only its Standard VPN,
# "200 MB/day traffic", so they aren't (notIn).
# Renewal day (M11.5), read 2026-11-03 (M11.9) in its subscription agreement for home users: each anniversary of the
# purchase.
renewalAnchor:
  kind: same-date
  page: Subscription agreement
  url: https://www.bitdefender.com/en-ca/site/view/subscription-agreement-and-terms-of-services-for-home-user-solutions
  quotes:
    - "Your subscription will be automatically renewed prior to the expiration of the term and each anniversary thereafter for a fee at Bitdefender's then-current price and any applicable taxes, excluding promotional and discount pricing offered at the renewal time."
  lastVerified: 2026-11-03

# Apps, sign-in and support (M11.9, the cross-category features), read 2026-11-03: Windows, macOS, Android and iOS on its
# product and VPN pages ("Windows®, macOS®, Android™, iOS®"), but Antivirus Free, "Windows only"; Bitdefender Central's
# password, with two-factor codes by email or an authenticator app and trusted devices (support answer 1581); chat or
# phone once signed in, and its forum (bitdefender.com/site/Main/contactus).
features:
  platforms: [windows, macos, android, ios]
  account.sign-in: [password, email-code, totp, trusted-device]
  support.channels: [chat, phone, community]

# Perks (M11.6): the US Ultimate Security Plus plans' lines that no feature describes (M11.9), named in their words.
# Norton 360 with LifeLock names most of them too, so they may become features when Norton is read (M11.15).
perks:
  - id: stolen-wallet
    name: Stolen Wallet Protection
  - id: ssn-tracker
    name: Smart SSN Tracker
  - id: social-engineering-refund
    name: Social Engineering Resolution & Refund
  - id: ransomware-refund
    name: Ransomware Resolution & refund
  - id: investment-alerts
    name: Investment account alerts
  - id: address-change
    name: Change of address
  - id: court-records
    name: Court records monitoring

# The US's Ultimate Security Plus (M11.9, the owner's choice of 2026-11-03), read 2026-11-03 with Mullvad Browser on
# /en-us/consumer/ultimate-security: Standard and Extended, each Individual ("1 member - up to 5 devices") and Family
# ("5 members & 25 devices"), monthly or yearly. Everything in Ultimate, plus identity theft protection: "Identity
# Theft Insurance (up to $1.000.000)" and "Credit Reports & Monitoring (1 bureau)" on Standard, "(up to $2.000.000 per
# household)" and "(3 bureau)" on Extended, with its restoration services (the US Digital Identity Protection page:
# "Identity Theft Restoration Services"); Extended adds the refunds and alerts its perks name. "This service is
# available with Bitdefender Ultimate Security Plus and requires a valid Social Security Number".
# Coverage: bitdefender.ultimate-security-plus-standard-individual, bitdefender.ultimate-security-plus-extended-individual, bitdefender.ultimate-security-plus-standard-family and bitdefender.ultimate-security-plus-extended-family in CA, GB, AU, NZ, DE, FR, NL,
# ES and IT: sold in the US only, its identity theft protection needing a US Social Security Number.

# Identity protection (M11.9, the owner's choice of 2026-11-03), read 2026-11-03: Ultimate's cards add "Digital Identity
# Protection 1x" (5x on Family), with "Digital Footprint Visualization" and "Real Time Breach Notifications", which
# Premium's don't ("Data Breach Detection" only); the US Digital Identity Protection page says Ultimate "Includes Digital
# Identity Protection". So Ultimate includes that plan and shows where your data is exposed (security.data-exposure:
# footprint), as Digital Identity Protection does.

# Every region's plans and billing periods (M11.9, the region checklist), read 2026-11-03 with Mullvad Browser. Edge
# shows no price on any of its pages now, Canada's too: the owner's DNS filter blocks a script they wait for, and Mullvad
# Browser's own DNS gets past it. Each page in a region's locale (/en-gb/, /en-au/, /en-nz/, /de-de/, /fr-fr/, /nl-nl/,
# /es-es/, /it-it/) prices in that region's currency, whoever reads it: the suites' Individual and Family cards, each
# yearly and 2 years (Ultimate monthly too: "Monthly price."), the antivirus page's 1 and 3 devices, and the VPN page's
# Premium VPN. The regular price is the struck-through one ("£104.99 Save 33%"); the one under it is the first term's.
# The five euro countries' prices are the same. Each region's pages say tax is included, beside each price ("Sales tax
# included.", "Inklusive MwSt.", "TVA incluse.", "Inclusief BTW.", "IVA incluido.", "IVA inclusa."), Canada's as well
# (taxIncluded, missing from its prices until now); the US's say "Plus applicable sales tax."

# SecurePass and the VPN in depth (M11.9, the owner's item 3), read 2026-11-03 in its support centre:
# - SecurePass, every plan with it. Its FAQ (/consumer/support/answer/107798/): "To add an item like an account, credit
#   card, identity or note", and "How do I use Bitdefender SecurePass as a 2FA app?" (scan a site's QR code into the
#   vault); its security report flags "Breached passwords", "Weak passwords", "Old passwords (used for more than 6
#   months)", "Duplicate passwords" and "Suspicious websites that could expose your login data"; a share link has
#   "options like expiration dates, usage limits, and password protection", and Groups share "by setting specific rights
#   (read, write, grant)". Its features table (/answer/109218/): sharing with other users, groups and links on every app.
#   No passkeys, and no shared folders.
# - Premium VPN, every plan with it (Total Security's and Antivirus Plus's Standard VPN, 200 MB a day, isn't sold as a
#   VPN). Its Windows settings (/answer/131733/): "Internet Kill-Switch – Stops all Internet traffic if the VPN connection
#   is briefly lost.", "Split tunneling – Select apps and websites to bypass the VPN", and auto-connect for "Peer-to-peer
#   apps – Connect VPN when starting a peer-to-peer file sharing app."; its terms ban no P2P, so P2P is allowed
#   (inferred). Its protocols "(e.g. Wireguard, OpenVPN, IKEv2)" (/answer/11311/), and "Double-hop" (/answer/96952/,
#   which some protocols don't offer). No port forwarding, Tor or obfuscation on any of these pages, no published audit,
#   and a Bitdefender account to sign up, so none of those.
