# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with a plain fetch: its Terms of Use for 1Password Individual
# Users (last updated November 2, 2026; the business subscription terms on the same page aren't for personal plans), its
# Privacy Notice, Cookie Policy and law enforcement guidelines (legal centre), the sign-up form's line ("By proceeding, you
# agree to the Terms of Service" and its Privacy Notice, Edge), and its support articles on billing, refunds, cancelling,
# deletion, privacy, regions, exports, updates and audits. Every agreement a user accepts (the owner's rule, 2026-11-03):
# the sign-up form names the terms and privacy notice; the terms include the privacy notice only; no separate licence for
# its apps is offered, so the terms' own words on using the Service are its licence. Not rated: its beta and API/SDK
# terms (for beta builds and developers), Kolide's and SaaS Manager's policies (business products), and the App Store's
# and Google Play's terms for in-app purchases. Its terms say "All amounts are in US Dollars." while its pricing and
# regions pages bill 1Password.ca in CAD and 1Password.eu in EUR (notes.md).
policies:
  links:
    - name: 'Terms of service'
      url: https://1password.com/legal/terms-of-service
    - name: 'Privacy notice'
      url: https://1password.com/legal/privacy
    - name: 'Cookie policy'
      url: https://1password.com/legal/cookie-policy
    - name: 'Law enforcement guidelines'
      url: https://1password.com/legal/law-enforcement
    - name: 'About 1Password and your privacy'
      url: https://support.1password.com/1password-privacy/
    - name: 'Manage your 1Password subscription'
      url: https://support.1password.com/manage-subscription/
    - name: 'About 1Password subscription billing'
      url: https://support.1password.com/membership-billing-policy/
    - name: 'Refund policy'
      url: https://support.1password.com/refund-policy/
    - name: 'Change your account type'
      url: https://support.1password.com/change-account-type/
    - name: 'Delete your account'
      url: https://support.1password.com/delete-account/
    - name: 'Export your data'
      url: https://support.1password.com/export/
    - name: '1Password in your region'
      url: https://support.1password.com/regions/
    - name: 'Security audits'
      url: https://support.1password.com/security-assessments/
    - name: 'Security'
      url: https://1password.com/security
    - name: 'Okta incident'
      url: https://1password.com/blog/okta-incident
    - name: 'Update 1Password'
      url: https://support.1password.com/update-1password/
    - name: 'Pricing'
      url: https://1password.com/pricing/personal
    - name: 'About taxes'
      url: https://support.1password.com/taxes/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It collects how you use its apps and websites, analytics included, to improve them, build new technology and tailor its marketing. Some of it only with your permission; to stop the rest you have to write to it.'
      sources:
        - url: https://1password.com/legal/privacy
          quote: 'We collect information from your browsers and devices, which provides us with technical usage information when you access or use the Services.'
        - url: https://1password.com/legal/privacy
          quote: 'In furtherance of our legitimate interests, we process your Contact Information, Service Data, and Diagnostic Data, to develop and train new technology, to analyze and improve our existing services, and to customize content used for our marketing purposes.'
        - url: https://1password.com/legal/privacy
          quote: 'Product Usage Information. With your permission, we collect, in a privacy-preserving manner, information about how you and your systems use our site and Services.'
      action:
        name: How to object (its privacy notice)
        url: https://1password.com/legal/privacy
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It may give your details to advertising companies, which privacy laws can count as selling them. Only some places give you the right to say no.'
      sources:
        - url: https://1password.com/legal/privacy
          quote: 'Marketing Partners. We may disclose your information to third-party marketing services which help us advertise our services to you.'
        - url: https://1password.com/legal/privacy
          quote: 'This may be considered a sale or sharing personal information data under applicable privacy laws.'
        - url: https://1password.com/legal/privacy
          quote: 'Depending on where you live, you may have the right to opt out of having your information shared for this purpose.'
      action:
        name: How to opt out of sharing (its cookie policy)
        url: https://1password.com/legal/cookie-policy
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its website uses advertising cookies that follow what you do across sites. You can turn them off, but only for the browser you are using.'
      sources:
        - url: https://1password.com/legal/cookie-policy
          quote: 'They help us and our advertising partners deliver more relevant advertisements, measure the effectiveness of advertising campaigns, and personalize advertising based on your interactions across websites and online services.'
        - url: https://1password.com/legal/cookie-policy
          quote: 'You can manage your cookie preferences at any time, including withdrawing your consent to non-essential cookies, by selecting "Your Privacy Choices" in the footer of our Website.'
        - url: https://1password.com/legal/cookie-policy
          quote: 'Your cookie preferences are stored on the browser and device you use to access our Website.'
      action:
        name: How to turn off its ad cookies
        url: https://1password.com/legal/cookie-policy
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: "Its privacy notice says it may use account and usage data to train new technology, but not whether what you write trains AI. It can't read what's in your vaults."
      pages: [https://1password.com/legal/privacy, https://1password.com/legal/terms-of-service]
      lastVerified: 2026-11-19
    - topic: privacy.content-access
      tier: great
      reason: 'Everything in your vaults, even the titles and web addresses, is locked with keys only you have. 1Password itself can’t read it.'
      sources:
        - url: https://support.1password.com/1password-privacy/
          quote: 'The vaults and items you save in 1Password are end-to-end encrypted with keys that only you possess.'
        - url: https://1password.com/legal/privacy
          quote: 'Secure Data is encrypted using secure cryptographic keys that exist only in the possession and under the control of users or admins of their accounts.'
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your details as long as it needs them. Deleting your account erases your data after 30 days, but copies in its backups stay.'
      sources:
        - url: https://1password.com/legal/privacy
          quote: 'We will retain your personal information for as long as necessary to fulfill the purposes set forth in this Privacy Notice, unless a longer retention period is required or permitted by law, or you instruct us to delete your information.'
        - url: https://support.1password.com/delete-account/
          quote: 'You have 30 days before your information is permanently deleted.'
        - url: https://support.1password.com/1password-privacy/
          quote: 'Erasure requests will leave those backups untouched unless we’re legally compelled to remove information from them.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: good
      reason: 'You can delete your account yourself in its settings, and your data is gone for good after 30 days.'
      sources:
        - url: https://support.1password.com/delete-account/
          quote: 'You can delete your 1Password account if you want to permanently remove your data from the service.'
        - url: https://support.1password.com/delete-account/
          quote: 'You have 30 days before your information is permanently deleted.'
      action:
        name: How to delete your account
        url: https://support.1password.com/delete-account/
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: good
      reason: 'You can download your logins and passwords yourself as a CSV file. Everything else comes out only in its own file type, or straight into another app on a phone.'
      sources:
        - url: https://support.1password.com/export/
          quote: '1Password 8 exports to the 1Password Unencrypted Export (.1pux) format or a comma-separated values (CSV) file.'
        - url: https://support.1password.com/export/
          quote: 'The CSV format supports a limited set of fields and will only export Login and Password items.'
        - url: https://support.1password.com/export/
          quote: '1Password for iOS exports through the Credential Exchange standard.'
      action:
        name: How to export your data
        url: https://support.1password.com/export/
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: good
      reason: 'It checks the police have the legal power to ask, tells you first unless it isn’t allowed to, and can’t unlock your passwords for anyone. It publishes no count of requests.'
      sources:
        - url: https://1password.com/legal/law-enforcement
          quote: 'confirm that Law Enforcement has the appropriate authority under applicable law before providing any User Information;'
        - url: https://1password.com/legal/law-enforcement
          quote: 'notify the customer or user of a request for their User Information before disclosing it to Law Enforcement, unless 1Password is prohibited by applicable law or Law Enforcement or where there is a reasonable indication of illegal or malicious conduct or risk of harm.'
        - url: https://1password.com/legal/law-enforcement
