# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 1), read with Edge from Canada (1password.com's
# personal pricing page in CAD and EUR, its sign-up form up to its first field) and with a plain fetch, which serves
# 1password.com and support.1password.com whole: the pricing page's own plan data and comparison table, its company,
# security, gift card, partners and downloads pages, its legal centre (terms of service, privacy notice, cookie policy,
# law enforcement guidelines), its Okta incident post, and 44 support articles (billing, subscription management, in-app
# purchases, gift cards, refunds, taxes, regions, privacy, diagnostics, Watchtower, Travel Mode, one-time passwords,
# import and export, passkeys, two-factor authentication, security keys, item categories, sharing, families, recovery,
# deletion, updates, security audits); the pricing page again through US, UK, Australian, German and New Zealand exits.
# Pricing: 1password.com/pricing/personal, with a currency picker ("USD", "CAD", "EUR": "Data stored in your currency's
# region"). Its Monthly tab: Individual $4.99, CA$5.99 ("$5.99" under "CAD"), €4.39; Families $7.99, CA$8.99, €6.99, each
# "Per month.". Its Yearly tab shows each plan's regular rate struck through ("Original price:" $3.99, $4.75 in CAD,
# €3.65; Families $5.99, $6.99 in CAD, €5.75: "Per month. Billed yearly.") beside a first-year offer ("Get an additional
# 25% for the first 12 months."; "Regular prices are $3.99 per month for Individual and $5.99 per month for Families.",
# its FAQ). A year is one payment for twelve months, so each yearly price is twelve times the regular rate: $47.88,
# CA$57.00, €43.80; $71.88, CA$83.88, €69.00 (notes.md). The first-year offer isn't stored.
# Currencies: the buyer picks one, with the region the vault is kept in ("You can choose where your data is hosted and
# which currency you pay in.", 1Password in your region): 1Password.com bills USD, 1Password.ca CAD and 1Password.eu EUR,
# for anyone, so each plan has a GLOBAL price in each (Proton's precedent). The page defaulted to CAD from Canada, USD
# through US, Australian, German and New Zealand exits and EUR through a UK exit, with the same three lists (the page's
# own data holds a price list for each currency). No price includes tax: "The prices displayed
# on 1Password.com don’t include sales tax or value-added tax because each country and region charges a different tax
# rate." (About taxes for 1Password).
# Region checklist for CA and US, 2026-11-19: 1. language paths only (/de/, /es/, /fr/, /it/, /jp/, /ko/, /pt/, /zh-cn/,
# /zh-tw/), and ?currency=cad and ?currency=eur (its footer's "Canada" and "Europe"); 2. the currency picker, every
# currency read; 3. the page's data names each currency's prices; 4. the sign-up form asks for a name and email first,
# with no prices; 5. its taxes article; 6. Edge and a plain fetch from Canada, and Edge through five exits; 7. no bill
# offered.
# Its individual plans: Individual and Families, each monthly or yearly ("You can choose monthly or annual billing to suit
# your budgeting needs.", About 1Password subscription billing). Teams Starter Pack, Business and Enterprise are business
# plans, out of scope. Families includes 5 family members and 5 guests; each further member is charged "a prorated
# amount", at a price no page read gives, so there's no add-on (notes.md).
# Bundles: none found. Official resellers: none for personal plans: its partners page is for businesses (channel partners,
# MSPs, AWS Marketplace), and its own 1Password.com Digital Gift Cards are sold by 1Password itself. App stores bill its
# in-app purchases (Apple, Google Play): partners, not listed.
# Free use: none; a 14-day free trial of either plan.

id: 1password
name: 1Password
aliases: [one password, agilebits]
website: https://1password.com
# Its help centre, whose articles state its billing, features and policies.
domains: [support.1password.com]
category: passwords
spendCategory: software
# Accepted cards, read 2026-11-19 in "Manage your 1Password subscription on 1Password.com", for every region: Visa,
# Mastercard, American Express, Discover, UnionPay, JCB, and Diners Club (other).
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, discover, unionpay, jcb, other]
    url: https://support.1password.com/manage-subscription/
    quotes:
      - 'You can pay for your subscription with Visa, Mastercard, American Express, Discover, Diners Club, UnionPay, or JCB.'
billingCurrency: { GLOBAL: USD }
# Its help article on managing the subscription ("Cancel your subscription": Billing → Cancel subscription on
# 1Password.com); in-app purchases are cancelled with Apple or Google.
cancelUrl: https://support.1password.com/manage-subscription/
sources: { pricing: https://1password.com/pricing/personal }

# Ways to pay (M11.5), read 2026-11-19: cards; a U.S. bank account (ACH direct debit) and 1Password Gift Cards for accounts
# on 1Password.com only ("can only be redeemed for accounts on 1Password.com. They can’t be redeemed for accounts on
# 1Password.ca or 1Password.eu."); in-app purchases through Apple and Google Play. No PayPal.
paymentMethods:
  - methods: [card, bank-transfer, gift-card]
    page: 'Manage your 1Password subscription'
    url: https://support.1password.com/manage-subscription/
    quotes:
      - 'You can pay for your subscription with Visa, Mastercard, American Express, Discover, Diners Club, UnionPay, or JCB.'
      - 'If your account is on 1Password.com, you can also pay with a U.S. bank account or a 1Password Gift Card .'
  - methods: [app-store]
    page: 'In-app purchases on iPhone, iPad and Mac'
    url: https://support.1password.com/apple-subscription/
    quotes:
      - 'When you start your subscription to 1Password using an in-app purchase in the 1Password app on your iPhone or iPad, or in 1Password for Safari on your Mac, you can manage your subscription with Apple.'
  - methods: [app-store]
    page: 'In-app purchases on Android'
    url: https://support.1password.com/android-subscription/
    quotes:
      - 'When you start your subscription to 1Password using an in-app purchase on your Android device, you can manage your subscription with Google.'
# Renewal day (M11.5), read 2026-11-19: the date of the first invoice, each month or year.
renewalAnchor:
  kind: same-date
  page: About 1Password subscription billing
  url: https://support.1password.com/membership-billing-policy/
  quotes:
    - 'Monthly: You’ll be billed every month on the same day and time you received your first invoice.'
    - 'Annual: You’ll be billed every year on the same day and time you received your first invoice.'
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19 in its privacy notice; its terms are with "AgileBits Inc." and its address is "4711 Yonge
# St, 10th Floor, Toronto, Ontario, M2N 6K8, Canada" (its sign-up page). Private: no page names a listing.
owner:
  name: AgileBits Inc.
  page:
    name: Privacy notice
    url: https://1password.com/legal/privacy
  quotes:
    - 'AgileBits Inc., doing business as 1Password, is committed to processing your information in ways that respect your privacy and keep it safe.'
    - '1Password is a Canadian company headquartered in Toronto, Ontario, Canada.'
  country:
    code: CA
  lastVerified: 2026-11-19
notes: >-
  You pick where your vault is kept, the US, Canada or the EU, and pay in that region's currency (USD, CAD or EUR), with
  tax added. 1Password bills from Canada, so a bank outside Canada may add a foreign transaction fee.

# Perks (M11.6): what no feature describes, in its pages' words.
perks:
  - id: travel-mode
    name: Travel Mode
  - id: document-storage
    name: 1GB of storage per user
  - id: guest-accounts
    name: Guest accounts for vault sharing

# General features, read 2026-11-19. Platforms: "In your browser with 1Password for Chrome, Firefox, Edge, Brave, and
# Safari. On your computer with 1Password for Mac , Windows , and Linux . On your mobile device with 1Password for iOS and
# Android ." (About 1Password subscription billing), and 1Password.com in a browser ("You can save one-time passwords in
# the 1Password browser extension , in the 1Password apps , or on 1Password.com ."). Sign-in: the account password with
# its Secret Key, then "a second factor will be required to sign in to your account on a new device" (an authenticator
# app's code or a security key: "If you have a FIDO U2F security key, you can use it as a second factor"), so known
# devices are trusted; SSO and Duo are for business accounts. Support: "Friendly, 24/7 support through email, forum, or
# social media" (the pricing page's comparison). App languages: 1password.com's language menu (English, Deutsch,
# Español, Français, Italiano, 日本語, 한국어, Português, 简体中文, 繁體中文). Not open source: no page offers its code, so
# software.open-source is left out. No pause; no parental controls (a family organizer manages members, billing and
# account recovery, not what they can do).
features:
  platforms: [windows, macos, linux, android, ios, web, browser-extension]
  account.sign-in: [password, totp, security-key, trusted-device]
  support.channels: [email, community, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh]

# Password manager features, read 2026-11-19 (the pricing page's comparison, whose ticks are in the page's data, and the
# support articles named):
# - Item types (1Password item categories): Login (with "one-time password"), Secure Note, Credit Card, Identity,
#   Password, Document, API Credential, Bank Account, Crypto Wallet, Database, Driver License, Email Account, Medical
#   Record, Membership, Outdoor License, Passport, Reward Program, SSH Key, Server, Social Security Number, Software
#   License, Wireless Router; passkeys ("Save and sign in with passkeys"). Every plan.
# - Health: "Watchtower tells you about breaches, weak passwords, duplicate items, and other security problems with the
#   items you have saved in 1Password.": "Compromised websites", "Vulnerable passwords" (exposed in a data breach),
#   "Reused passwords" and "Weak passwords"; "We continually update Watchtower as security breaches are reported". Its
#   alerts are about saved items, not a dark-web watch of your details, so no dark web monitoring.
# - Sharing: every plan shares a copy of an item by link ("Choose when the link expires and who it’s available to:
#   anyone with the link or only specific people."); Families adds shared vaults ("Manage and access unlimited shared
#   vaults for members of your account": Individual no, Families yes) with per-person permissions ("choose the
#   permissions you want them to have") and 5 guests.
# - Import (Move your data from other applications to 1Password): CSV files, other apps (Chrome, Firefox, Edge, Brave,
#   Safari, Bitwarden, Dashlane, KeePass and KeePassXC by their XML or CSV, Keeper, LastPass, RoboForm), and the
#   Credential Exchange standard on iOS 26 and Android 14. No KDBX: KeePass comes in "KeePass XML (2.x)". Export: "1PUX or
#   CSV" on the desktop apps (1PUX is its own unencrypted format; "The CSV format supports a limited set of fields and will
#   only export Login and Password items."), and the Credential Exchange standard on iOS and Android. "Exported data files
#   are not encrypted.", so no encrypted export.
# - Emergency access: none. A family organizer can recover a member's account, and its Emergency Kit is a PDF of your
#   sign-in details to keep safe, but no page offers a trusted contact who can reach your vault: false.
# - Offline: "After everything is in sync, it’ll be available even if you need to go offline for a bit." (Sync).
# - Authenticator: "Use 1Password as an authenticator for sites with two-factor authentication": a site's QR code or
#   string of characters ("Select the QR code to scan the QR code from your screen or clipboard."). Its CSV export keeps
#   each "One-time password", in plain text; no page names an otpauth export or an encrypted one.
# - End-to-end encryption: "End-to-end encryption of all information in vaults (URLs, item titles, and more)" (every
#   plan), its documents included ("Document items can be used to upload your important files").
plans:
  - id: 1password.individual
    name: Individual
    link: https://start.1password.com/sign-up
    features:
      password-manager: true
      password-manager.item-types:
