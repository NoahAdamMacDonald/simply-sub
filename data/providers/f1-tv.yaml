    - topic: billing.renewal-notice
      tier: good
      reason: 'It emails you 30 days and again 7 days before a yearly plan renews. Monthly plans get a reminder only every six months.'
      sources:
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'in the case of an annual subscription, thirty (30) days and again seven (7) days prior to your subscription renewing; and'
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'in the case of a monthly subscription, every six (6) months.'
