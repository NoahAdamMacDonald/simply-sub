    - topic: billing.refunds
      tier: neutral
      reason: 'You get a full refund if you cancel within 14 days of first buying; after that, refunds are only given in some cases, and you keep watching to the end of what you paid for.'
      sources:
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'You have the right to cancel your purchase of the Service, and receive a full refund without giving any reason, any time up to 14 days from the date of the initial purchase.'
        - url: https://f1help.formula1.com/article/cancel-your-subscription
