    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You need an F1 account (an email and a password) and your date of birth, then a billing address that matches your card.'
      sources:
        - url: https://f1help.formula1.com/article/Buy-F1-TV-through-the-web
