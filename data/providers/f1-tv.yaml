# Researched by hand on 2026-11-13 (M11.15, streaming batch 8). Its help centre (f1help.formula1.com, every F1 TV
# article its sitemap lists, and Location Availability with each research country picked) and its terms read with Edge
# from Canada; its sign-up (account.formula1.com) refuses every exit ("You are accessing this service from a restricted
# geographic region."), so its plan page (formula1.com/en-ca/subscribe-to-f1-tv) was read over an ordinary connection
# in Canada. Pages, each quoted where it's used:
# Pricing: formula1.com/en-ca/subscribe-to-f1-tv's plan cards, "TV Access ... $39.99 / Year", "TV Pro ... $99.99 /
# Year" and "TV Premium ... $129.99 / Year", with a Yearly and a Monthly toggle; its page data names each plan, period
# and currency ("Name":"Access Monthly", "Amount":4.99, "Code":"CAD", "F1 TV Access Monthly Canada CAD n01"; Pro
# Monthly 12.99, Premium Monthly 16.99), each with "Discount":0 and "Intropricing":"False", so the regular prices. Its
# subscription terms say "All Fees are inclusive of applicable local sales tax or VAT", but no words on the plan page do,
# so no taxIncluded (notes.md has it for the owner). Other countries' prices: formula1.com sends this machine's own
# connection to Canada's page ("?e=georedir&from=gb&to=ca"), and every exit gets the sign-up's restricted-region page.
# Region checklist, 2026-11-13: 1. formula1.com's locale paths (/en-ca/, /en-gb/, /en-us/: each georedirects to the
# reader's own); 2. its "Select your country of residence" step, past the plan page, wasn't reached from any exit; 3. the
# plan page's data names Canada and CAD; 4. the sign-up, refused through exits; 5. its help centre's Location
# Availability (each country's plans) and payment articles; 6. Edge from here, through Canadian, US, UK and German exits,
# a plain fetch through UK, US and New Zealand exits, and a browser over an ordinary connection (Canada only); 7. no
# bill offered.
# Which plans each country sells (Location Availability, read 2026-11-13 with each country picked): Canada, New Zealand
# and the Netherlands all three; France Access and Pro ("Not available" under Premium; its Access gets "Access to Live
# Events only. Replays and highlights are not available in this region."); the US, the UK, Ireland, Australia,
# Germany, Spain and Italy Access only ("Not available" under Pro and Premium; the US's: "*F1 TV Pro & Premium are no
# longer available to buy directly through F1."). "If your country is not listed, F1 TV is not available there."
# Bundles: none sold by F1. Partners that add Pro or Premium to their own packages ("We've teamed up with a selection of
# TV and mobile partners, so you can add an F1 TV Pro or F1 TV Premium subscription to your existing package"): Apple TV
# (Premium, "USA only"), Fuji TV, FanCode (India), Claro Brasil, Telcel, Telmex, Foxtel, Viaplay (Netherlands) and
# Canal+ (France): noted, not listed; Viaplay's plans include F1 TV Pro (viaplay.yaml). Official resellers: none; Apple,
# Google, Roku and Amazon bill it themselves. Vouchers and intro prices are offers ("when your discount period ends, your
# subscription will renew at the full advertised price").
# Features, read 2026-11-13: F1 TV Streaming Quality's table ("International: UHD HDR 2160p" on Premium, "SDR 1080p" on
# Pro); "F1 TV Pro subscription, you can stream on one device at a time" and "F1 TV Premium subscription, you can stream
# on up to six devices at the same time" (Manage your Devices); Pro "Official live stream: watch all F1 sessions live
# and on demand, ad free" and Premium "Ad-free, live and on-demand streaming of all F1 sessions"; Access has no live
# video ("Access to the official live race video stream is not part of F1 TV Access") and no page names its quality,
# streams or ads: quality and streams inferred, ads false. No downloads or profiles on any page. Pause: "Need a break
# from F1 TV? There are two options available" (Pause your Subscription). No parental controls on any page read (F1 Kids
# is a commentary feed). What it streams: F1 sessions, support series, "Exclusive shows, documentaries and race
# archives"; none of your own media.
# Free use: none: its plans are paid (free trials, when offered, turn into a plan: its terms' clause 14).

# Coverage: f1-tv.* in AX, DZ, AO, AI, AG, AR, AW, AU, AT, AZ, BS, BH, BD, BB, BE, BT, BA, BW, BR, VG, BG, KY, TD, CL,
# CN, CO, CR, HR, CW, CY, CZ, DK, DJ, DM, DO, EC, EG, SV, EE, FI, FR, DE, GH, GR, GD, GP, GT, GG, HT, HN, HK, HU, IS,
# IN, ID, IM, IL, IT, JM, JP, JE, JO, KE, KW, LA, LV, LB, LT, LU, MY, MV, MT, MQ, MR, MX, MC, MS, MA, MZ, NA, NP, NL,
# NZ, NI, NG, NO, OM, PK, PY, PE, PH, PL, PT, PR, QA, IE, RO, BL, KN, LC, MF, VC, SM, SA, RS, SG, SX, SK, SI, ZA, KR,
# ES, LK, SE, CH, TW, TH, TT, TN, TR, TC, UG, UA, AE, GB, US, VI, UY, VA, ZM, ZW: F1 TV sells there (its Location
# Availability list), but its sign-up refuses every exit this machine can use ("You are accessing this service from a
# restricted geographic region.", account.formula1.com through US, UK, German and Canadian exits, 2026-11-13), and
# formula1.com's plan page sends this machine's own connection to Canada's ("e=georedir&from=gb&to=ca"), so only
# Canada's prices were read. The Internet Archive has a US copy of 2026-11-08 but answered 429.

