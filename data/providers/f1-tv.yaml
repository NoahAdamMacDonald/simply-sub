    - topic: privacy.data-location
      tier: good
      reason: 'It’s a UK company, and when your data leaves the UK or EU it goes only to countries judged to protect it, or under a binding agreement.'
      sources:
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'We will only transfer your personal data to countries that have been deemed to provide an adequate level of protection for personal data.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'Where a country does not have an adequate level of protection, we will only transfer your personal data where a binding agreement is in place with that third party in compliance with data protection laws.'
