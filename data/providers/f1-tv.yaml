    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask by email for your data in a machine-readable format, or for it to be sent to another company, where the law allows.'
      sources:
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'Obtain your personal data in a structured, commonly used, machine-readable format or request transfer of your personal data to another organisation, subject to statutory criteria being met (Right to data portability).'
