    - topic: billing.price-changes
      tier: poor
      reason: 'A new price starts only when your subscription renews, never during time you’ve paid for, but it doesn’t promise to tell you about the new price first.'
      sources:
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'We reserve the right to modify the price of the Service for new or renewed subscriptions, but current subscriptions will not be affected.'
        - url: https://account.formula1.com/#/en/subscription-terms
