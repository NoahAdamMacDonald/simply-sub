    - topic: billing.free-trials
      tier: poor
      reason: 'A free trial, when it offers one, turns into a paid subscription unless you cancel, and charges you when it ends without further notice.'
      sources:
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'If you have provided us with the necessary details, you will be charged the Fees applicable to the subscription for the Service in force at the time upon expiration of the Free Trial Period and without further notice.'
