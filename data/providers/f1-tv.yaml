    - topic: privacy.children
      tier: neutral
      reason: 'You must be 18 (16 in the US with a parent’s consent). It deletes data a child under 16 gave without consent once told, and doesn’t share under-16s’ data for cross-site ads.'
      sources:
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'In the case of U.S. residents and residents of any other applicable territory, individuals over the age of 16, but under the age of 18, may utilise the Service with the consent of a parent or legal guardian.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'If you have reason to believe that a child under the age of 16 has provided personal data to us without parental consent, please contact us so that we can delete that data.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'We do not share information of individuals we know to be under the age of 16 for cross-context behavioral advertising.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online in your account at any time and keep watching until the end of the month or year you paid for.'
      sources:
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'using the ‘Account’ section of the Site;'
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'When you cancel your subscription in accordance with this Clause, you will continue to have access to the relevant Service until the end of the month or year (as applicable) you have paid for.'
