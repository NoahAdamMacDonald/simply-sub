# General features, read 2026-11-13. Platforms: "F1 TV is available on Web, Apps, Google TV, Apple TV, Roku and Amazon
# Fire TV" (its home page), with iOS and Android apps ("Picture in Picture: available on iOS and Android"); "You cannot
# access F1 TV through mobile browsers". Sign-in: "log in with your email address and password" (Update Personal
# Details). App languages: its help centre's and account pages' language menus (English, Français, Deutsch, Español,
# Nederlands, Português, 日本語; Dutch isn't one of the registry's values). Subtitles: English, French and Spanish
# (Subtitles: "The live broadcast will be in English only with no subtitles."). Support: "reach out via live chat or
# email".
features:
  platforms: [web, ios, android, tv]
  account.sign-in: [password]
  languages.interface: [en, fr, de, es, pt, ja]
  languages.subtitles: [en, fr, es]
  support.channels: [chat, email]

# Perks (M11.6): what its plan cards list that no feature describes, in their words.
perks:
  - id: live-timing
    name: Live timing, telemetry, tyre usage and driver maps
  - id: onboard-cameras
    name: Live onboard cameras and team radios
  - id: support-series
    name: Live access to F2, F3, F1 Academy and Porsche Supercup
  - id: multiview
    name: Multiview - build your custom multi-feed view

plans:
  # F1 TV Access: "Live data tools", "Race replays: watch delayed race replays on demand", "Team radio recaps",
  # "Exclusive content: documentaries, shows and access to the F1 race archives"; no live video.
  - id: f1-tv.access
    name: F1 TV Access
    link: https://www.formula1.com/en-ca/subscribe-to-f1-tv
    features:
      video.quality: 1080p
      streaming.concurrent-streams: 1
      ad-free: false
      streaming.content: [sports, documentaries]
      streaming.own-media: false
      account.pause: true
      account.parental-controls: false
    inferred:
      video.quality:
        reason: 'Its streaming quality article gives every F1 TV Pro feed 1080p and keeps 4K for Premium; Access’s replays are the same sessions on demand, so up to 1080p.'
        page:
          name: F1 TV Streaming Quality
          url: https://f1help.formula1.com/article/f1-tv-streaming-quality
        lastVerified: 2026-11-13
      streaming.concurrent-streams:
        reason: 'Its terms forbid watching where anyone else can watch at the same time, and Pro, the plan above Access, streams on one device at a time.'
        page:
          name: F1 TV Subscription Terms
          url: https://account.formula1.com/#/en/subscription-terms
        lastVerified: 2026-11-13
    perks: [live-timing]
    notes: 'Live timing and data, delayed race replays, team radio recaps, shows, documentaries and the race archive, with no live video. In Canada, "full event replays will be available 48hrs after the event"; in France, Access has live timing only.'
    prices:
      - region: CA
        currency: CAD
        amount: 4.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-13
        sourceUrl: https://www.formula1.com/en-ca/subscribe-to-f1-tv
      - region: CA
        currency: CAD
        amount: 39.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-13
        sourceUrl: https://www.formula1.com/en-ca/subscribe-to-f1-tv

  # F1 TV Pro: "Official live stream: watch all F1 sessions live and on demand, ad free", "Onboard cameras", "Team
  # radios", "Support series coverage: live races from F2, F3, F1 Academy and Porsche Supercup".
  - id: f1-tv.pro
    name: F1 TV Pro
    link: https://www.formula1.com/en-ca/subscribe-to-f1-tv
    features:
      video.quality: 1080p
      streaming.concurrent-streams: 1
      ad-free: true
      streaming.live: [sports]
      streaming.content: [sports, documentaries]
      streaming.own-media: false
      account.pause: true
      account.parental-controls: false
    perks: [live-timing, onboard-cameras, support-series]
    notes: Every F1 session live and on demand, ad-free, with onboard cameras, live team radios and the support series live, in up to 1080p on one device at a time. Not sold directly in the US, the UK, Ireland, Australia, Germany, Spain or Italy.
    # Where it isn't sold (Location Availability, read 2026-11-13 with each country picked in its drop-down): "Not
    # available" at the foot of Pro's column, the second of three ("Official F1® Live Stream"), and the United States'
    # footnote (Germany's view says it too: "F1 TV Pro & Premium are no longer available to buy directly through F1 in
    # this territory."). The page shows these words only with a country picked, so a baseline of it as served doesn't
    # have them. Canada, New Zealand, the Netherlands and France show no "Not available" under Pro.
    notSoldIn:
      - regions: [US]
        url: https://f1help.formula1.com/article/Location-Availability
        quotes:
          - '*F1 TV Pro & Premium are no longer available to buy directly through F1.'
        lastVerified: 2026-11-13
      - regions: [GB, IE, AU, DE, ES, IT]
        url: https://f1help.formula1.com/article/Location-Availability
        quotes: ['Not available']
        lastVerified: 2026-11-13
    prices:
      - region: CA
        currency: CAD
        amount: 12.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-13
        sourceUrl: https://www.formula1.com/en-ca/subscribe-to-f1-tv
      - region: CA
        currency: CAD
        amount: 99.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-13
        sourceUrl: https://www.formula1.com/en-ca/subscribe-to-f1-tv

  # F1 TV Premium: "Live Streaming in 4K UHD", "Multiview: Watch up to 4 live feeds at once", "Stream live on up to 6
  # devices at the same time", and everything in Pro.
  - id: f1-tv.premium
    name: F1 TV Premium
    link: https://www.formula1.com/en-ca/subscribe-to-f1-tv
    features:
      video.quality: 4k
      video.hdr: true
      streaming.concurrent-streams: 6
      ad-free: true
      streaming.live: [sports]
      streaming.content: [sports, documentaries]
      streaming.own-media: false
      account.pause: true
      account.parental-controls: false
    perks: [live-timing, onboard-cameras, support-series, multiview]
    notes: Everything in Pro, plus 4K HDR on supported TV devices, Multiview of up to 4 feeds and up to 6 devices at once. In the US it comes with Apple TV instead. Not sold in the UK, Ireland, Australia, Germany, France, Spain or Italy.
    # Where it isn't sold (Location Availability, read 2026-11-13 with each country picked): "Not available" at the
    # foot of Premium's column, the third ("Ultimate F1® Live Immersion"), France's included, and the United States'
    # footnote. Canada, New Zealand and the Netherlands show no "Not available" under Premium.
    notSoldIn:
      - regions: [US]
        url: https://f1help.formula1.com/article/Location-Availability
        quotes:
          - '*F1 TV Pro & Premium are no longer available to buy directly through F1.'
        lastVerified: 2026-11-13
      - regions: [GB, IE, AU, DE, FR, ES, IT]
        url: https://f1help.formula1.com/article/Location-Availability
        quotes: ['Not available']
        lastVerified: 2026-11-13
    prices:
      - region: CA
        currency: CAD
        amount: 16.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-13
        sourceUrl: https://www.formula1.com/en-ca/subscribe-to-f1-tv
      - region: CA
        currency: CAD
        amount: 129.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-13
        sourceUrl: https://www.formula1.com/en-ca/subscribe-to-f1-tv

# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 in Edge: its F1 TV Subscription Terms ("Last Updated: August
# 2025"), the Digital Products Terms of Use they supplement ("Last Updated: August 2025", with an arbitration agreement
# for US residents), and its Fan Privacy Policy ("Last Updated: April 2025"), all Formula One Digital Media Limited's;
# its help centre's cancelling, payment, devices, deletion and upgrade articles, and the plan page's renewal and upgrade
# notes. Viaplay's research of 2026-11-09 rated the same documents (viaplay.yaml): the same clauses grade the same here.
# Not read: its Cookies Policy (account.formula1.com/#/en/cookie-policy, which the terms include), the sign-up form
# (refused through every exit), and the app stores' and TV partners' terms. Calibrated against Viaplay and Sportsnet+.
policies:
  links:
    - name: 'F1 TV Subscription Terms'
      url: https://account.formula1.com/#/en/subscription-terms
    - name: 'Digital Products Terms of Use'
      url: https://account.formula1.com/#/en/terms-of-use
    - name: 'Fan Privacy Policy'
      url: https://account.formula1.com/#/en/privacy-policy
    - name: 'Subscribe to F1 TV (Canada)'
      url: https://www.formula1.com/en-ca/subscribe-to-f1-tv
    - name: 'Buy F1 TV through the web'
      url: https://f1help.formula1.com/article/Buy-F1-TV-through-the-web
    - name: 'Cancel your Subscription'
      url: https://f1help.formula1.com/article/cancel-your-subscription
    - name: 'Upgrade your Subscription'
      url: https://f1help.formula1.com/article/upgrade-your-subscription
    - name: 'Personal Data Erasure Request'
      url: https://f1help.formula1.com/article/personal-data-erasure-request
    - name: 'Manage your Devices'
      url: https://f1help.formula1.com/article/manage-devices
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use its sites and apps, down to clicks and scrolling, to analyse and personalise them and to profile you for marketing. You can only object by email.'
      sources:
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'Usage Data – which includes information about how you use our Digital Products and your visit, including the full Uniform Resource Locators (URL) clickstream to, through and from our Digital Products (including date and time), pages you viewed or searched for, page response times, download errors, length of visits to certain pages, page interaction information (such as scrolling, clicks, and mouse-overs), and methods used to browse away from the page and any phone number used to call our customer service number.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'To analyse use of our Digital Products and carry out market research so that we can improve the products and services we offer:'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'If you require any further help from us in relation to the above rights, please email general@en.formula1.com.'
      action:
        name: 'Your legal rights (privacy policy)'
        url: https://account.formula1.com/#/en/privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your data with partners who use it for their own ends, and with social media and ad companies, which some US laws call a sale. Opting out is through cookie settings site by site, or a form.'
      sources:
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'Our third party partners who act as independent data controllers in respect of your personal data, where we have the necessary legal basis, e.g. consent.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'As is common practice among businesses that operate websites and applications, we may share certain identifiers, internet or other electronic network activity information with social media, advertising, and analytics partners in a manner that – under some US privacy laws – may be considered (a) a “sale” of information, (b) “sharing” of information for cross-context behavioral advertising, or (c) targeted advertising.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'You can opt-out by visiting our Erasure Request Form and submit a request or call +1 (888) 988-5663 for more information.'
      action:
        name: 'Opt-out rights (privacy policy)'
        url: https://account.formula1.com/#/en/privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It shows you ads on other sites and social media based on your data, on your consent or its own interests. Turning that off takes its cookie settings and each other site’s.'
      sources:
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'To present you with targeted and personalised adverts on third-party websites and applications, including social media sites:'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'For targeted or personalised marketing on third party sites and applications, you can adjust your cookie preferences on F1 sites as well as amending them directly on the third party sites you are receiving advertisement on.'
      action:
        name: 'Marketing opt-out (privacy policy)'
        url: https://account.formula1.com/#/en/privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you write or say to it trains AI; its terms only forbid others training AI on its content.'
      pages:
        - https://account.formula1.com/#/en/privacy-policy
        - https://account.formula1.com/#/en/terms-of-use
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your data as long as it thinks reasonably necessary, names no periods, and may keep it longer if it expects a complaint or a lawsuit.'
      sources:
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'We will only retain your personal data for as long as reasonably necessary to fulfil the purposes we collected it for, including for the purposes of satisfying any legal, regulatory, tax, accounting or reporting requirements.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'We may retain your personal data for a longer period in the event of a complaint or if we reasonably believe there is a prospect of litigation in respect to our relationship with you.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask it to erase all your data with a form, and it confirms when that’s done, without saying how long it takes.'
      sources:
        - url: https://f1help.formula1.com/article/personal-data-erasure-request
          quote: 'Complete the form below to request the erasure of data we hold about you under applicable privacy laws.'
        - url: https://f1help.formula1.com/article/personal-data-erasure-request
          quote: "We'll send you confirmation once your request has been completed."
      action:
