# Owner (M11.2), read 2026-11-13: F1 TV is Formula One Digital Media Limited's ("We operate and supply the streaming
# service known as F1 TV", its subscription terms), part of Formula 1, which Liberty Media owns (its own overview page;
# F1's corporate site links "Formula One Group/Liberty Media Corporation financial news"). Liberty Media's tracking
# stock for Formula 1, from the same page; no page read names a majority holder.
owner:
  name: Formula 1 (Liberty Media Corporation)
  website: https://www.libertymedia.com
  page:
    name: Overview (Liberty Media)
    url: https://www.libertymedia.com/about/overview
  quotes:
    - 'Liberty Media Corporation consists of our wholly-owned subsidiaries Formula 1 ® , MotoGP™, and other minority investments.'
    - 'The Series A and Series C Liberty Formula One common stock trade on the Nasdaq Global Select Market under the stock symbols FWONA and FWONK, respectively.'
    - 'The Series B Liberty Formula One common stock is quoted on the OTC Markets under the symbol FWONB.'
  country:
    code: GB
    page:
      name: F1 TV Subscription Terms
      url: https://account.formula1.com/#/en/subscription-terms
    quotes:
      - 'We are Formula One Digital Media Limited, a company registered in England and Wales with company registration number 08915039 whose registered address is at No. 2 St. James’s Market, London SW1Y 4AH, England.'
    lastVerified: 2026-11-13
  stock:
    company: Liberty Media Corporation
    listings:
      - { exchange: Nasdaq, symbol: FWONA }
      - { exchange: Nasdaq, symbol: FWONK }
      - { exchange: OTC Markets, symbol: FWONB }
  lastVerified: 2026-11-13

# Ways to pay (M11.5), read 2026-11-13: its Accepted Payment Methods article ("PayPal is not currently supported.";
# Amex isn't taken in France), and its terms for the app stores (Apple, Google; Roku and Amazon too: "through a third
# party platform (e.g. Roku, Amazon)"). TV and mobile partners bill Pro or Premium in their own packages (the header).
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex]
    url: https://f1help.formula1.com/article/Accepted-payment-methods
    quotes: ['Visa', 'Mastercard', 'American Express (Amex)']
  FR:
    networks: [visa, mastercard]
    url: https://f1help.formula1.com/article/Accepted-payment-methods
    quotes:
      - 'Visa'
      - 'Mastercard'
      - 'American Express is not available for users signing up from France'
paymentMethods:
  - methods: [card, google-pay, apple-pay]
    page: Accepted Payment Methods
    url: https://f1help.formula1.com/article/Accepted-payment-methods
    quotes:
      - 'Visa'
      - 'Mastercard'
      - 'American Express (Amex)'
      - 'Google Pay (selected countries)'
      - 'Apple Pay (selected countries)'
      - 'Debit cards'
  - methods: [app-store]
    page: F1 TV Subscription Terms
    url: https://account.formula1.com/#/en/subscription-terms
    quotes:
      - 'or through a third party platform (such as the Apple App store or the Google Play store)'
# Renewal day (M11.5): its subscription terms, clause 7.1.
renewalAnchor:
  kind: same-date
  page: F1 TV Subscription Terms
  url: https://account.formula1.com/#/en/subscription-terms
  quotes:
