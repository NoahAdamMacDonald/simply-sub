# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 2), read with Edge from Canada: dashlane.com's
# personal pricing page (dashlane.com/pricing-personal), its checkout for each plan (dashlane.com/getpremium and
# /getfamily, read up to the order summary, typing nothing), its terms, privacy policy, Do Not Sell page, security, bug
# bounty, about and legal pages; and 70 of its help centre's articles through its Zendesk API (support.dashlane.com, a
# plain fetch): plans, billing, cancelling, refunds, plan changes, VPN, import and export, 2FA codes, passkeys, sharing,
# offline use, platforms, languages, deletion, inactive accounts, privacy rights, security operations and advisories.
# Pricing: the pricing page shows each plan per month "Billed annually" (Premium "US$5.42", Friends & Family "US$8.13"
# from Canada); the checkout gives the year: "1 year of Dashlane Premium" "US$64.99" and "1 year of Friends & Family"
# "US$97.49", with no first-term discount ("Total US$64.99", "Renews automatically."). The same checkout in US dollars
# was read through Vancouver and Calgary exits (Canada), and US, UK, Australian and New Zealand exits; through Irish,
# German, French, Dutch, Spanish and Italian exits it charges euros: "1 year of Dashlane Premium" before VAT, which
# varies with the country (€46.74 Ireland, €48.32 Germany, €47.91 France, €47.52 the Netherlands and Spain, €47.13
# Italy; Friends & Family €70.73, €73.11, €72.50, €71.90, €71.90, €71.31), then "VAT", then the same "Total €57.49"
# (Friends & Family "Total €86.99") in every one. Each country's price is its before-VAT line, with no taxIncluded, as
# LastPass's, 1Password's and RoboForm's euro prices are stored before VAT (the euro pricing page says "€3.90 + VAT Per
# month"; notes.md). Euro countries whose checkout wasn't read through their own exit have no price. Canada, the UK,
# Australia and New Zealand pay in US dollars; US and Canadian prices are before sales tax ("If your billing address is
# in the United States, you may be subject to state and local sales taxes.").
# Billing periods: a year only ("Dashlane also no longer offers monthly subscriptions for any plan.").
# Region checklist for CA and US, 2026-11-19: 1. language paths only (/de/, /es/, /fr/, /nl/pricing-personal); 2. no
# country or currency picker; 3. the page's data holds no prices (its script loads them); 4. the checkout's order
# summary names US$ for Canada (Montreal, Vancouver and Calgary readings) and $ for the US exit; 5. its billing article
# on taxes; 6. Edge from Canada and through exits; 7. no bill offered.
# Plans: Premium and Friends & Family (10 people). "Dashlane no longer offers or sells these plans: Dashlane Free,
# Premium Plus, Premium Plus Family, Essentials, and Advanced." Starter, Standard, Team and the Omnix plans are business
# plans, left out.
# Bundles: none. Official resellers: none for personal plans (its partner programme and AWS Marketplace are for
# businesses). App stores (Apple, Google Play) bill it: partners, not listed.
# Free use: none (the Free plan was withdrawn); a 14-day Premium trial, after which "you can only export your passwords".
# VPN: Premium and a Friends & Family plan's manager get Hotspot Shield's VPN ("You can set up your Hotspot Shield
# Premium account directly from your Dashlane app."), but on 5 devices ("you can use the VPN on up to five devices"),
# not the 10 of the catalog's hotspot-shield.premium, so it isn't listed in includes-subscription: the plans state
# vpn.included and vpn.devices, with notIn: [vpn] (a password manager with a VPN, not sold as a VPN; notes.md). Its
# traffic is unlimited by inference: Dashlane gives "their Premium VPN service" and Hotspot Shield's Premium plan has
# "unlimited bandwidth" (its own page); server countries and protocols are left out. Turning it on means agreeing to
# Hotspot Shield's terms and privacy policy, rated below where they're worse.

id: dashlane
name: Dashlane
website: https://www.dashlane.com
# Its help centre, whose articles state its billing, features and policies.
domains: [support.dashlane.com]
category: passwords
spendCategory: software
# The checkout's currency for each country read (above); every other country's wasn't read, so GLOBAL is USD.
billingCurrency:
  {
    CA: USD,
    US: USD,
    GB: USD,
    IE: EUR,
    AU: USD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help article on cancelling ("Open the Vault menu in the top-left of the page, and select Subscription."); app store
# and PayPal subscriptions are cancelled there.
cancelUrl: https://support.dashlane.com/hc/en-us/articles/12247552144786-Cancel-my-Dashlane-subscription-and-stop-autorenewal
sources: { pricing: https://www.dashlane.com/pricing-personal }
# Ways to pay (M11.5), read 2026-11-19: cards on its website and the app stores everywhere; PayPal for new plans only in
# the UK. Its terms name Stripe, PayPal and Checkout.com as processors. No page names a card network in words, so no
# acceptedNetworks (the card shows "Card (networks not verified)").
paymentMethods:
  - methods: [card, app-store]
    page: 'Manage subscription and billing for Dashlane personal plans'
    url: https://support.dashlane.com/hc/en-us/articles/202699341-Manage-subscription-and-billing-for-Dashlane-personal-plans
    quotes:
      - 'You can buy a Dashlane subscription on our website with a credit card.'
      - 'You can also buy a subscription in the Google Play Store or Apple App Store.'
  - methods: [card, app-store, paypal]
    regions: [GB]
    page: 'Manage subscription and billing for Dashlane personal plans'
    url: https://support.dashlane.com/hc/en-us/articles/202699341-Manage-subscription-and-billing-for-Dashlane-personal-plans
    quotes:
      - 'You can buy a Dashlane subscription on our website with a credit card.'
      - 'You can also buy a subscription in the Google Play Store or Apple App Store.'
      - 'You can no longer pay for new personal plans with PayPal unless you live in the United Kingdom.'
# Renewal day (M11.5), read 2026-11-19: its terms renew a plan "for additional periods of the same duration" and warn 30
# days before "your Subscription renewal date", but name no day.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.dashlane.com/terms
    - https://support.dashlane.com/hc/en-us/articles/202699341-Manage-subscription-and-billing-for-Dashlane-personal-plans
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19: its terms. Dashlane SAS in Paris contracts with buyers in the EU ("If you reside in…
# European Union Dashlane SAS Laws of France"); everyone else's is Dashlane USA, Inc. No page read names its investors
# or a listing: private, no stock.
notes: Billed once a year. Buyers in the EU contract with Dashlane SAS in France; everyone else with Dashlane USA, Inc.
owner:
  name: Dashlane, Inc.
  page:
    name: Terms of Service
    url: https://www.dashlane.com/terms
  quotes:
    - 'Dashlane, Inc. and its affiliates (“Dashlane”, or “we” and its derivatives) operate www.dashlane.com'
  country:
    code: US
    page:
      name: Terms of Service
      url: https://www.dashlane.com/terms
    quotes:
      - 'The Services are provided by either Dashlane USA, Inc. a Delaware corporation with offices at 44 West 18th Street, New York, NY 10011 USA, or Dashlane SAS, a French company with offices at 21 Rue Pierre Picard, 75018 Paris, as indicated on the payment record for your subscription'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19

# Perks (M11.6): what no feature describes, in its pages' words.
perks:
  - id: file-storage
    name: Secure Notes with 1 GB of encrypted file storage

# General features, read 2026-11-19. Platforms: its browser extension ("Google Chrome", "Firefox", "Safari", "Microsoft
# Edge", "Other Chromium browsers", Supported devices and browsers), its web app, Android, iPhone and iPad, and a macOS
# app ("Dashlane on macOS"); Windows and Linux only through the extension (its Windows app is gone: "the desktop app,
# which we no longer offer"). Sign-in: a Master Password, a PIN or "a physical security key" (the Premium plan article),
# an authenticator app's 2FA token, text messages for backup codes ("Dashlane uses this number to text OTP backup
# codes", its terms) and a code by email on a new device ("When you log in to Dashlane on a new device, Dashlane sends a
# code to your email."); SSO is for business plans. Support: "Email and live chat support are available". App
# languages: "English", "French", "German", "Spanish", "Dutch", "Brazilian Portuguese", "Italian", "Japanese",
# "Korean", "Simplified Chinese", "Swedish" (Available languages; Dutch and Swedish have no registry value). Open
# source: "Large portions of Dashlane’s client code are open source and available on GitHub" (iOS, Android, web
# extension; its server isn't), so open-source apps. No pause; no parental controls (the Friends & Family dashboard
# manages members, not what they can do).
features:
  platforms: [macos, android, ios, web, browser-extension]
  account.sign-in: [password, totp, security-key, sms, email-code]
  support.channels: [email, chat]
  languages.interface: [en, fr, de, es, pt, it, ja, ko, zh]
  software.open-source: open-clients
sourceRepo:
  url: https://github.com/Dashlane
  page:
    name: '8. Security operations'
    url: https://support.dashlane.com/hc/en-us/articles/32877595753746-8-Security-operations
  quotes:
    - 'Large portions of Dashlane’s client code are open source and available on GitHub'
  lastVerified: 2026-11-19

# Password manager features, read 2026-11-19 (Compare Dashlane personal plans, the Premium and Friends & Family
# articles, and the articles named), the same on both plans:
# - Items: logins, 2FA tokens in logins ("Dashlane stores the 2FA tokens for the sites and apps in your vault"),
#   passkeys, Secure Notes, payments ("credit and debit cards, PayPal info, and bank accounts"), personal info ("Name,
#   Email, Phone number, Address, Company, and Website"), IDs ("general ID cards, passports, driver’s licenses, Social
#   Security cards, and tax numbers") and Wi-Fi ("Wi-Fi credentials are available for the mobile and macOS apps").
#   Secrets are business only ("Only members of organizations with Password Management can use secrets.").
# - Health: Password Health counts "compromised, reused, and weak passwords"; its AI phishing alerts warn "when you
#   visit a website that our AI model identifies as risky" (suspicious sites); Dark Web Monitoring "to scan the web for
#   possible leaks of your data".
# - Sharing: with other Dashlane users, with four permission levels ("Full access", "Can edit", "Can view", "Can
#   autofill"), and by link to anyone ("Links expire after one view or 24 hours"). Shared collections are for
#   professional plans only.
# - Import: "You can only use a CSV file to move your data from other password managers to Dashlane unless you use the
#   Credential Exchange Protocol." (its import menu lists other managers), and its own encrypted DASH file; no KDBX.
# - Export: CSV ("CSV files aren't encrypted"), Credential Exchange, and DASH ("A DASH file saves an encrypted copy of
#   all your Dashlane data.", readable only by Dashlane). Attachments and passkeys aren't in the CSV.
# - Emergency access: false. "The previous emergency contact feature was available only in the desktop app, which we no
#   longer offer."; its replacement is handing someone a DASH file and its password yourself, not access it grants.
# - Offline: "you can access any Dashlane app while offline as long as you've logged in previously" (Master Password
#   accounts; passwordless accounts need a connection).
# - Authenticator: a site's setup code or QR code ("Setup codes, which are long strings of numbers and letters";
#   "Select Scan QR code"); its CSV keeps each login's setup code ("the CSV file named credentials contains a column
#   named otpSecret") and its DASH file the tokens ("Your DASH export will include logins, 2FA tokens, and Secure
#   Notes.").
# - End-to-end: "Dashlane cannot access Secured Data; it is encrypted with keys that are unique to each user" (its
#   privacy policy): passwords. The 1 GB for files is Secure Note attachments, a perk, not a files service.
# - VPN (above): Hotspot Shield's on 5 devices, for Premium and the Friends & Family manager only ("Customers who were
#   invited to join someone else's Friends & Family plan won't have VPN access."); not in free trials.
plans:
  - id: dashlane.premium
    name: Premium
    link: https://www.dashlane.com/getpremium
    notIn: [vpn]
    features:
      password-manager: true
      password-manager.item-types:
        [
          login,
          totp,
          passkey,
          credit-card,
          bank-account,
          identity,
          secure-note,
          wifi,
          passport,
          drivers-license,
          government-id,
        ]
      password-manager.health: [breached, weak, reused, suspicious]
      password-manager.sharing:
        [share-to-user, share-link, link-expiry, link-view-limit, role-permissions]
      password-manager.import: [csv, cxf, other-managers]
      password-manager.export: [csv, cxf, encrypted]
      password-manager.emergency-access: false
      password-manager.offline: true
      authenticator.included: true
      authenticator.import: [otpauth]
      authenticator.export: [plain-backup, encrypted-backup]
      encryption.end-to-end: [passwords]
      security.dark-web-monitoring: true
      vpn.included: true
      vpn.devices: 5
      vpn.unlimited-traffic: true
    inferred:
      vpn.unlimited-traffic:
        reason: 'Dashlane says "We partner with Hotspot Shield to provide their Premium VPN service", and Hotspot Shield says its Premium plan offers "unlimited bandwidth".'
        page:
          name: 'Hotspot Shield security audit'
          url: https://www.hotspotshield.com/security-audit/
        lastVerified: 2026-11-19
    perks: [file-storage]
    notes: 'Unlimited devices, with Hotspot Shield’s VPN on up to 5 of them. A 14-day free trial (without the VPN). In the euro countries the total with VAT is €57.49 a year.'
