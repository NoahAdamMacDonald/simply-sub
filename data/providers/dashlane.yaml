# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with Edge: its Terms of Service (last updated April 8, 2026, for
# personal plans, which are its apps' licence too: section 3) and Privacy Policy (April 8, 2026, which the terms
# include: "These Terms, along with our Privacy Policy, form a legal contract"); its Do Not Sell or Share page, cookie
# preferences, security and Vulnerability Disclosure Policy pages; and its help articles on billing, cancelling,
# refunds, plan changes, trials, export, deletion, inactive accounts, privacy rights, security operations and
# advisories. The checkout's line: "I agree to Dashlane's Privacy Policy and Terms of Service." Its Business Terms (for
# business plans) weren't rated. The VPN: setting it up asks you to "Read Hotspot Shield's Terms of Service and Privacy
# Policy" and agree; those (and its VPN Products Privacy Notice, saved 2026-11-19 for Hotspot Shield's own file) are
# rated for both plans where they're worse than Dashlane's own (Xbox Game Pass's precedent for EA Play). Dashlane's
# help links Aura's copy of the VPN notice (aura.com/privacy/vpn-products); Hotspot Shield's own is quoted.
