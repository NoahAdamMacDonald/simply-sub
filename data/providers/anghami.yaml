        - url: https://www.anghami.com/legal
          quote: 'inventory of other apps on User device'
        - url: https://www.anghami.com/legal
          quote: 'We will also retain Usage Data for internal analysis purposes.'
        - url: https://www.anghami.com/legal
          quote: 'User may choose to set their web browser to refuse cookies, or to alert you when cookies are being sent.'
      action:
        name: Its privacy policy (cookies)
        url: https://www.anghami.com/legal
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It doesn’t sell or rent your personal information, but its website uses marketing cookies, which you can refuse only browser by browser.'
      sources:
        - url: https://www.anghami.com/legal
