# Researched by hand on 2026-11-09 (M11.15, the music category, part 3), read with Edge from Canada and through each
# country's exit. Anghami is the Middle East and North Africa's music service; outside that region it sells a plan of
# Arabic songs only (its help centre: "Anghami is only authorized to stream international songs within the MENA
# region"), which the plans' notes and a notable rating say. Pages, each quoted where it's used:
# Pricing: anghami.com/plus, which prices by where the visitor is, always in US dollars: read from Canada ("renews at
# USD4.69/month", a 6-Months Single Plan at USD24.99 and a Yearly Plan at USD49.99, each beside a struck-through USD29.99
# and USD59.99, about six and twelve times the US monthly price), and through a US exit ("renews at USD4.99/month", the same
# 6-month and yearly prices) and a UK, Australian, New Zealand, Irish, German, French, Dutch, Spanish and Italian exit
# ("renews at USD2.99/month", monthly only). The Family Plan is "USD 7.49 monthly" everywhere. The struck-through prices
# aren't offers: its help centre's 12-month article says a year "saves $10 compared to buying 12 months at the per-month
# price, which totals $60", and its terms bill "on a monthly, half-yearly, or yearly basis". The first month free is
# an offer, not listed.
# Not listed: Anghami Gold (users "outside the MENA region" aren't eligible, its help centre), the Student Plan ("a 50%
# discount" for verified students, as other students' offers aren't), and the Ads-Free Offer ($0.99 for two weeks,
# offered to some free users, which "will not renew automatically").
# Region checklist, 2026-11-09: 1. no country paths; 2. no picker (its language menu changes only the language); 3. not
# looked for; 4. checkout not opened; 5. its help centre gives US-dollar figures only ("usually costs $4.99 per month");
# 6. Edge from Canada and through each exit, each page in US dollars, so the page itself doesn't name the country: the
# prices differ by exit (Canada's, the US's and the rest's); 7. no bill offered.
# Bundles and resellers: none on its pages; mobile operators, Fawry, Tamara, Paymob and vouchers in the Middle East and
# North Africa (its Ways to subscribe), and PlayStation Network (its cancelling article), bill it: ways to pay, not
# resellers. Gift cards are its own.
# Features, read 2026-11-09 in its help centre: Plus has "Ad-Free Listening", "Unlimited Downloads" and "High Audio
# Quality" (What Are the Exclusive Features of Anghami Plus?), and its quality setting goes up to "Pristine – 320
# kbit/s (highest available)", so High. Free "Listen to your favorite songs" and plays your playlists, with ads,
# limited skips and no downloads (Features of Anghami Free Plan); its best quality isn't stated, but the higher bitrate
# is a Plus feature and the settings below Pristine are 96 and 160 kbit/s, so Standard (inferred). The Family Plan
# brings "up to six accounts" with Plus (Anghami Family Plan Subscription Guide). Dolby Atmos plays on some songs and
# devices, which the registry doesn't record. No audiobooks.

