# Terms and policies, read 2026-11-04 (M11.15): Apple's Media Services Terms and Conditions and its Privacy Policy, rated
# once as shared documents (data/policies/apple-media-services.yaml, apple-privacy.yaml), and "Apple TV & Privacy",
# the app's own notice, for how long it keeps what you watch. Apple TV has one paid plan, so switching plans doesn't
# apply.
policies:
  shared: [apple-media-services, apple-privacy]
  links:
    - name: 'Apple TV & Privacy'
      url: https://www.apple.com/legal/privacy/data/en/apple-tv-app/
  ratings:
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps what you browse and search in the app for up to two years, and your purchases for 10 years or more.'
      sources:
        - url: https://www.apple.com/legal/privacy/data/en/apple-tv-app/
          quote: 'We retain other information such as browsing activity and searches for up to two years.'
        - url: https://www.apple.com/legal/privacy/data/en/apple-tv-app/
          quote: 'For purchases and downloads, that often requires at least a 10-year retention period'
      lastVerified: 2026-11-04
