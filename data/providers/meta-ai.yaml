# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge: the Meta AIs Terms of
# Service (Canada's and the US's version; the UK, Brazil and the European Region have their own, not read), which bind
# you to the Meta Terms of Service and the Privacy Policy (shared: meta-terms, meta-privacy); the Meta Subscription Terms
# of Service for Meta One, which include the Commercial Terms' disputes clause ("You expressly agree to the Disputes
# provisions in the Commercial Terms incorporated herein") and the Community Payments Terms for web purchases (Meta Pay:
# no topic worse than these); and the help centre's Meta One, billing, cancelling, AI usage, export and deletion
# articles. Not read: the sign-up form (meta.ai's "Log in" leads to a Meta account sign-in), the Supplemental Meta
# Platforms Technologies Terms (Meta accounts), the Instagram Terms of Use and WhatsApp's terms (each app's own, for the
# Plus benefits), and the EU, UK and Brazil AI terms.
policies:
  shared: [meta-terms, meta-privacy]
  links:
    - name: 'Meta AIs terms of service'
      url: https://www.facebook.com/legal/ai-terms
    - name: 'Meta Subscription terms of service'
      url: https://www.facebook.com/legal/meta_subs_terms
    - name: 'Commercial terms'
      url: https://www.facebook.com/legal/commercial_terms
    - name: 'Cancelling Meta One'
      url: https://www.meta.com/help/subscriptions/1314531497228585/
    - name: 'Billing and payments'
      url: https://www.meta.com/help/subscriptions/2534285893740819/
    - name: 'Managing Meta One'
      url: https://www.meta.com/help/subscriptions/4515570262058351/
    - name: 'Meta terms of service'
      url: https://www.facebook.com/terms/
    - name: 'Starting a chat with Meta AI'
      url: https://www.meta.com/help/artificial-intelligence/943942350800511/
    - name: 'How Meta uses information for generative AI'
      url: https://www.facebook.com/privacy/genai/
    - name: 'Deleting your Meta AI chats'
      url: https://www.meta.com/help/artificial-intelligence/2457110494637611/
    - name: 'Exporting your Meta AI information'
      url: https://www.meta.com/help/artificial-intelligence/1314808549771571/
    - name: 'Meta One AI usage'
      url: https://www.meta.com/help/artificial-intelligence/1831790234178989/
    - name: 'Meta One plans'
      url: https://www.meta.com/meta-one-plans/
    - name: 'Meta Bug Bounty'
      url: https://bugbounty.meta.com/
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel Meta One in your account settings at any time before it renews, and you keep its benefits until the end of the month you paid for.'
      sources:
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'you may cancel your Meta Subscription at any time prior to each Renewal Date by selecting the “Cancel subscription” option under your “Manage Subscription” settings in Account Center'
        - url: https://www.meta.com/help/subscriptions/1314531497228585/
          quote: 'When you cancel Meta One, you keep access to your subscription benefits until the end of your current billing cycle.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: "You don't get money back, unless a law says so, but you keep the benefits until the end of the month you paid for."
      sources:
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'Except as required by law, all purchases are non-refundable.'
        - url: https://www.meta.com/help/subscriptions/1314531497228585/
          quote: 'When you cancel Meta One, you keep access to your subscription benefits until the end of your current billing cycle.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: good
      reason: 'It tells you at least 30 days before raising the price, so you can cancel before the new price starts.'
      sources:
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'We will give you at least 30 days’ notice of any price increases.'
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'If you do not want to continue your Meta Subscriptions at the new price, you can cancel your subscription before the start of the next subscription period.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      tier: neutral
      reason: 'A starting offer turns into the monthly price unless you cancel before it ends. You can cancel at any time.'
      sources:
        - url: https://www.meta.com/help/subscriptions/1314531497228585/
          quote: "If you don't cancel before the promotion ends, your subscription automatically renews at the monthly fee, unless prohibited by law."
        - url: https://www.meta.com/help/subscriptions/1314531497228585/
          quote: 'You can cancel your subscription at any time.'
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its subscription terms and help say Meta One renews on its own each month, but not that it reminds you first.'
      pages:
        - https://www.facebook.com/legal/meta_subs_terms
        - https://www.meta.com/help/subscriptions/2534285893740819/
        - https://www.meta.com/help/subscriptions/1314531497228585/
      lastVerified: 2026-11-17
    - topic: billing.fees
      tier: poor
      reason: 'Besides the price and taxes, its terms make you pay any fees other companies charge, including app store fees, without saying what they are.'
      sources:
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'You are responsible for all third party fees (including IAP fees)'
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its help says you can change your Meta One plan in your settings, but not when the change starts or whether what you paid counts toward it.'
      pages:
        - https://www.meta.com/meta-one-plans/
        - https://www.meta.com/help/subscriptions/4515570262058351/
        - https://www.facebook.com/legal/meta_subs_terms
      lastVerified: 2026-11-17
    - topic: legal.disputes
      plans: [meta-ai.core, meta-ai.premium]
      tier: good
      reason: 'Outside the US, a dispute over Meta One goes to a court in California, the one Meta chose, not to a private referee.'
      sources:
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'Disputes provisions in the Commercial Terms incorporated herein'
        - url: https://www.facebook.com/legal/commercial_terms
          quote: 'Any Commercial Claim between you and Meta Platforms, Inc. must be resolved exclusively in the U.S. District Court for the Northern District of California or a state court located in San Mateo County'
      lastVerified: 2026-11-17
    - topic: legal.disputes
      plans: [meta-ai.core, meta-ai.premium]
      regions: [US]
      tier: bad
      reason: "In the US, a dispute over Meta One goes to a private referee (arbitration), not a court, and you can't join a class action. Its terms offer no way out."
      sources:
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'which may include without limitation mandatory arbitration and waiver of your ability to bring class actions'
        - url: https://www.facebook.com/legal/commercial_terms
          quote: 'if you reside in the United States or your business is located in the United States, these Commercial Terms require the resolution of most disputes between you and us by binding arbitration on an individual basis; class actions and jury trials are not permitted.'
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It tells you about big changes to its AI terms by email or in the app before they start, without saying how long before. Using Meta AI after that means you accept them.'
      sources:
        - url: https://www.facebook.com/legal/ai-terms
          quote: 'Unless otherwise required by law, we will notify you (for example through email or in-app notification) of any material changes to these Terms and give you an opportunity to review them before they go into effect.'
        - url: https://www.facebook.com/legal/ai-terms
          quote: 'Once any updated Terms are in effect you will be bound by them if you continue to use our AIs.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      plans: [meta-ai.core, meta-ai.premium]
      tier: bad
      reason: 'Meta can take away what Meta One gives you at any time and for any reason, even without warning, and says it owes you nothing for it.'
      sources:
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'Access to Benefits may be disabled or canceled at any time and for any reason'
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'To the extent permitted by applicable law, Meta reserves the right to suspend or cancel access to your Meta Subscription without notice'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: poor
      reason: 'Meta can change or remove what Meta One includes whenever it decides, and says it owes you nothing when it does.'
      sources:
        - url: https://www.facebook.com/legal/meta_subs_terms
          quote: 'In no event will Meta or a Meta Affiliate be liable for terminating or suspending your use of Meta Subscriptions, for the discontinuation of Meta Subscriptions, for the modification, removal or disabling access to any feature or other aspect of the Benefits'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: poor
      reason: 'Its AI terms say what you type stays yours, but never that you own what Meta AI makes. Meta uses both to run and improve its services, and people may review them.'
      sources:
        - url: https://www.facebook.com/legal/ai-terms
          quote: 'you retain all right, title, and interest – including any intellectual property rights – that you have in and to your Prompts'
        - url: https://www.facebook.com/legal/ai-terms
          quote: 'Meta uses Content and related information as described in the Meta Terms of Service and Meta Privacy Policy, and may do so through automated or manual (i.e. human) review and through third-party vendors in some instances'
      lastVerified: 2026-11-17
    - topic: service.account-sharing
      tier: bad
      reason: "You may not let anyone else use your account, and Meta One's AI usage can't be shared with another account."
      sources:
        - url: https://www.facebook.com/terms/
          quote: 'Not share your password, give access to your Facebook account to others, or transfer your account to anyone else (without our permission).'
        - url: https://www.meta.com/help/artificial-intelligence/1831790234178989/
          quote: "Usage is non-transferable, has no cash value, and cannot be resold or gifted. You can't share or transfer usage to another account."
      lastVerified: 2026-11-17
    - topic: security.practices
      tier: neutral
      reason: 'It pays outside experts who find and report security problems in Meta AI. No page read says an independent audit checks it.'
      sources:
        - url: https://bugbounty.meta.com/
          quote: 'To be eligible for a bounty, you can report a security bug in one or more of the following Meta technologies:'
      lastVerified: 2026-11-17
    - topic: privacy.ai-training
      tier: bad
      reason: 'What you say to Meta AI is used to train and improve its AI, and no page offers a way to turn that off.'
      sources:
        - url: https://www.meta.com/help/artificial-intelligence/943942350800511/
          quote: 'Meta uses your interactions with AIs to improve AI at Meta.'
        - url: https://www.facebook.com/privacy/genai/
          quote: 'Information shared on Meta Products including things like posts or photos and their captions, and your interactions with features that are part of AI at Meta'
      lastVerified: 2026-11-17
    - topic: privacy.content-access
      tier: bad
