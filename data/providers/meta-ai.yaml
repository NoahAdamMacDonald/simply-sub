# AI features (the AI category's registry), read 2026-11-17, the same on every plan (the paid plans add usage only: "Meta
# AI will still be free for everyday use — Core and Premium are for people who want even more creative freedom from our
# AI tools.", the newsroom post):
# - Web search: "integrated with real-time web information" (the assistant page's FAQ); "Meta may share certain
#   information with select partners, like search engines, to provide you with the most relevant information" (its AI
#   terms).
# - Reasoning: "Use Instant for fast answers, or switch to Thinking to tackle complex questions with advanced reasoning."
# - Voice: "Talk to Meta AI throughout your day with a faster, conversational voice mode that supports 13 languages."
# - Deep research: "Get in-depth reports on any topic in minutes. Meta AI builds research plans, searches across sources,
#   and drafts structured reports with citations."
# - Scheduled tasks: "Smarter answers, scheduled tasks, and new ways to shop and discover." and "Connect your email and
#   calendar to get personalized daily briefings and more." (the assistant page; no article describes them yet, notes.md).
# - Image and video generation: "Generate an image with Meta AI" and "Generate a video with Meta AI" (Generate images and
#   videos using Meta AI and Vibes), free ("Meta AI is free for everyone. In select plans, Meta One offers additional
#   access to certain AI features like Meta Business Agent and image and video generation", the plans page's FAQ).
# - Connects to your other apps: "You can manage connections across your accounts to third party apps, like calendars,
#   emails and others, in Accounts Center." (Use and manage third party app connections in Meta AI).
# - Chats kept on Meta's servers: "Find your previous prompts, images and videos on Meta AI" and "Delete all chats and
#   media" (its help centre); its Incognito Chats ("Messages are processed in a secure environment that no one, including
#   Meta, can access.") are a temporary option, not where chats are kept.
# - Not stated by any page read: memory across chats (its memory article, meta.com/help/artificial-intelligence/
#   1152856459900216, now redirects to the help centre's home, notes.md), projects, models from other companies, coding
#   agent or code
#   completion ("assist with coding" is a chat answer), computer use (the Mac app reads a window you point it at), music
#   or voice generation (a video's lip sync and voiceover are part of its video generation), office apps, early access,
#   API credits.
# General features, read 2026-11-17: apps: "You can access Meta AI at meta.ai on the web, by downloading the Meta AI
# mobile app on iOS or Android, installing the desktop app on Mac" (the assistant page's FAQ; the Mac app "Download for
# Mac (Beta)"). Sign-in: "You must log into www.meta.ai with your Meta, Facebook or Instagram account" (Create text
# documents with Meta AI) and a password ("If you forget your password, you'll need an updated phone number or email
# address to reset it.", How Meta uses the email address or mobile phone number). Its two-factor methods aren't named on
# a page read. No support channel, pause, parental controls or app languages stated for Meta AI (notes.md).
