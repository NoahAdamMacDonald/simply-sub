# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2), read with Edge from Canada: meta.ai, the Meta AI
# assistant page (ai.meta.com/meta-ai/assistant, which ai.meta.com/get-meta-ai redirects to), the Meta One plans page
# (meta.com/meta-one-plans, with its FAQ's answers opened one at a time) and its language versions (en-gb, de-de, fr-fr,
# es-es, it-it, nl-nl, es-la), the Meta Help Center's Meta AI, Meta One and subscription articles, Meta's newsroom post
# "Introducing Meta One" (about.fb.com, read with a plain fetch: Edge couldn't reach it), Meta's legal pages on
# facebook.com (Meta AIs Terms of Service, Meta Subscription Terms of Service, the Commercial Terms and Community Payments
# Terms they include, the Meta Terms of Service, the Privacy Policy with its printable version, the US Regional Privacy
# Notice and the generative AI page), bugbounty.meta.com and Meta's investor pages. A plain fetch gets HTTP 400 from
# meta.com and facebook.com; Edge reads them with no bot check. Pages, each quoted where it's used.
# What it sells: Meta AI is free ("Meta AI is free to use for everyday use.", the assistant page). Its paid tiers are Meta
# One's personal bundle plans, which add AI usage across Meta AI, Instagram, Facebook and WhatsApp and include Instagram
# Plus, Facebook Plus and WhatsApp Plus: "Meta One Core" "$7.99/month" ("Express yourself in new ways. More AI usage.")
# and "Meta One Premium" "$19.99/month" ("Expanded AI usage. Even more video creation."), the Meta One plans page;
# "Core ($7.99/mo)" and "Premium ($19.99/mo)" in the newsroom post. The single product plans (Instagram Plus
# "$3.99/month", WhatsApp Plus "$2.99/month", Facebook Plus "$3.99/month") add no AI usage: the social category's, later.
# Meta One's creator and business plans (Essential, Advanced, Expert, Max) are business plans: out. Muse ("Muse by Meta is
# your personal AI agent", its own app, site, subscriptions and terms: Power "$20/month" and Maximum "$100/month", About
# Muse subscriptions) is a provider of its own, not listed here (notes.md).
# Pricing and currency: the Meta One plans page shows one price list in every language: "$7.99/month" in English (US),
# "7,99 USD/Monat" in German, "7,99 USD al mes" in Spanish, "7,99 USD/mese" in Italian; its FAQ says "Pricing varies by
# country and plan." and its cards "Features, plans, availability and pricing may vary by region, app and account.
# Subscribe using your mobile app." So the list is the US's (its English page is English (US), its newsroom post the
# US's), stored for the US only; other countries' prices show only in the app at checkout ("Device: You can only
# subscribe through a supported Meta mobile app (iPhone or Android).", Subscribe to Meta One). Monthly only ("Your
# subscription from Meta renews automatically each month unless you cancel your subscription.", Billing and payments).
# No page says the prices include tax ("any applicable national, state, or local sales or use taxes", the Subscription
# Terms).
# Region checklist, 2026-11-17: 1. meta.com/meta-one-plans has language versions (hreflang: en, en-gb, de, es, es-us, fr,
# it, nl and others), each the same US-dollar list (en-gb shows "$7.99/month" beside one "£3.99/month" for Facebook
# Plus); no country paths (/ca/, /au/, /gb/ are pages not found); 2. no country or currency picker; 3. the page's data
# holds only the Meta Store's gift-card currencies, no Meta One prices; 4. checkout is in the mobile apps only (App
# Store or Google Play), not opened; 5. no help article prices by country ("Pricing varies by country and plan."); 6.
# Edge from Canada; a plain fetch is refused (400); the App Store's Meta AI pages (apps.apple.com/<country>/app/meta-ai/
# id1558240027, read with a plain fetch and Edge for 11 countries) list no in-app purchases; 7. no bill offered.
# Bundles: Meta One Core and Premium are Meta's own all-in-one plans (suite plans); no partner sells a Meta AI bundle.
# Official resellers: none: Meta One is sold only in Meta's apps (and Accounts Center), billed by Apple, Google or Meta Pay.
# Free use: the free plan below.

# Coverage: meta-ai.core and meta-ai.premium are sold in CA (their soldIn: "Meta One is becoming available globally
# through supported Meta apps on mobile devices (iPhone or Android) and on the web.", About Meta One Premium plans, with
# no country list) but aren't priced there yet: Meta's pages give one US-dollar list ("Pricing varies by country and
# plan.", meta.com/meta-one-plans, read 2026-11-17), and a Canadian price shows only in the mobile app at checkout. So
# Canada sees the US price, converted.

id: meta-ai
name: Meta AI
aliases: [meta one, meta one core, meta one premium]
website: https://www.meta.ai
# Meta's help centre and Meta One pages (meta.com, which ai.meta.com and bugbounty.meta.com are under) and its investor
# relations site (investor.atmeta.com). Not facebook.com, where its legal pages are: that's Facebook's own site (a queued
# provider of its own), so policies there are linked as the site its quoted policies are on.
domains: [meta.com, atmeta.com]
category: ai
spendCategory: software
billingCurrency: { US: USD, GLOBAL: USD }
# Its help centre's Cancel your Meta One subscription (the Meta AI app, Facebook, Instagram, WhatsApp and the app stores).
cancelUrl: https://www.meta.com/help/subscriptions/1314531497228585/
sources: { pricing: https://www.meta.com/meta-one-plans/ }

# Ways to pay (M11.5), read 2026-11-17: Meta One is bought in Meta's mobile apps through Apple's or Google's billing
# (Subscribe to Meta One), and Meta's billing article for all its subscriptions adds Accounts Center's Meta Pay with a
# credit card or PayPal. No page names the card networks Meta Pay takes, so no acceptedNetworks ("a credit card" names
# none).
paymentMethods:
  - methods: [app-store]
    page: 'Subscribe to Meta One'
    url: https://www.meta.com/help/subscriptions/1275481294766689/
    quotes:
      - 'In-app purchase: Payments are processed through the Apple App Store or Google Play Store, depending on your device.'
  - methods: [card, paypal]
    page: 'Billing and payments for subscriptions from Meta'
    url: https://www.meta.com/help/subscriptions/2534285893740819/
    quotes:
      - 'Accounts Center: You can use a credit card or PayPal for Meta Pay.'

# Owner (M11.2), read 2026-11-17: the Meta AIs Terms of Service are an agreement with Meta Platforms, Inc.; its investor
