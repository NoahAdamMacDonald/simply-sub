# Researched by hand on 2026-11-20 (M11.15, security batch 2). webroot.com's product pages show this machine's Edge a
# "Vercel Security Checkpoint" ("Failed to verify your browser"), even headed and after waiting, and serve a plain fetch
# their page without prices, so its prices were read in Edge through other exits: Canada's through another Canadian
# exit, the US's through a US exit, and the other countries' own sites (/gb/en, /ie/en, /au/en, /nz/en, and the home pages
# of intl.webroot.com/de/de, /fr/fr, /nl/nl, /es/es and /it/it, where those countries' product links lead), which price in
# their own currency whoever reads them (New Zealand's bare "$" is its page data's "currency_code='NZD'"), through the
# same Canadian exit. Its legal pages, the consumer terms (PDF), the auto-renewal and refund pages and its user guide
# (docs.webroot.com) read with a plain fetch; OpenText's privacy policy and vulnerability page in Edge. Pages, each quoted
# where it's used:
# Two line-ups: the US sells Webroot Essentials (1, 3 or 5 devices), Smart Protection (3 or 5), Premium (5 devices and 1
# identity, or Family: 10 and 10), Total Protection (the same two) and, alone, AntiVirus for PC Gamers, Secure VPN (3 or
# 5) and Security for Chromebook; its Essentials FAQ: "These products are now respectively replaced by Webroot Essentials
# for 1, 3, or 5 devices." Every other country's site still sells AntiVirus (1 or 3 devices), Internet Security Plus (3
# or 5) and Internet Security Complete (5), and Canada's, the UK's, Ireland's, Australia's and New Zealand's AntiVirus for
# PC Gamers too.
# Pricing, the other countries: each product page's price picker (devices and 1 to 3 years) shows the yearly price
# ("*Amount shown reflects annual subscription value based on 1 year MSRP.") and, for 2 and 3 years, the yearly list
# price times the years struck through beside a lower first-term price ("Original price was CAD $99.98 • Save CAD
# $29.99 Sale price is CAD $69.99"). AntiVirus for PC Gamers' picker stays at 1 year. The euro countries' home pages have
# no picker: one price each, "1 Gerät/1 Jahr", "3 Geräte/1 Jahr", "5 Geräte/1 Jahr" (34,99 €, 54,99 €, 74,99 €, as
# Ireland's). The US: each card shows a first-year
# price beside the list price struck through ("$34.99 /first year", "$49.99 Save $15.00"), and its checkout
# (buy.webroot.com) offers 1, 2 or 3 years, each with the list price times the years struck ("2 years of protection",
# "$99.98 $84.99"). The terms charge renewals "as described in Your Subscription Documentation", and no page promises a
# first term's price again, so the list prices are stored, the 2- and 3-year ones as their struck prices (ESET's
# precedent). Security for Chromebook's and AntiVirus for PC Gamers' US checkouts strike $49.98 and $79.99 for 2 years.
# Tax: the US checkout: "Prices on our website do not include sales tax."; no page says the other prices include tax.
# Region checklist for CA and US, 2026-11-20: 1. country paths (/ca/en, the US at webroot.com/products); 2. the country
# picker (17 sites); 3. the price picker on each product page; 4. the US checkout, up to the payment form (Canada's cart
# wasn't opened); 5. its user guide (no prices); 6. Edge from Canada (refused), a plain fetch (no prices), Edge through a
# Canadian and a US exit; 7. no bill.
# Bundles: none sold as one (its suites are plans of its own). Official resellers: none named for home plans (its
# "Resellers" link is its business reseller programme). Best Buy and Geek Squad bill Webroot plans of their own (its
# opt-out page: "Best Buy manages its Webroot accounts independently"): partners, noted, not listed. App stores bill its
# mobile apps (its terms' "App Store" billing party).
# Free use: none (see freeUse). Not drafted: PC Optimizer (a Windows tune-up tool sold
# alone in the US, with no security features) and its business products.

# Coverage: webroot.essentials, webroot.essentials-3-devices, webroot.essentials-5-devices, webroot.smart-protection,
# webroot.smart-protection-5-devices, webroot.premium, webroot.premium-family, webroot.total-protection,
# webroot.total-protection-family, webroot.secure-vpn, webroot.secure-vpn-5-devices and webroot.security-for-chromebook
# in CA, GB, IE, AU, NZ, DE, FR, NL, ES and IT: the US's line-up; each of those countries' product menus lists AntiVirus,
# Internet Security Plus, Internet Security Complete and AntiVirus for Gamers instead (read 2026-11-20).
# Coverage: webroot.antivirus-for-gamers, webroot.antivirus-3-devices and webroot.internet-security-plus-5-devices in DE,
# FR, NL, ES and IT: those countries' own home pages (intl.webroot.com, where their product links lead) sell AntiVirus
# for 1 device, Internet Security Plus for 3 and Internet Security Complete for 5, a year at a time, and nothing else
# (read 2026-11-20).

id: webroot
name: Webroot
website: https://www.webroot.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    AU: AUD,
    NZ: NZD,
    GLOBAL: USD,
  }
# Its auto-renewal page, where a keycode turns automatic renewal off (and links its refund request form).
cancelUrl: https://www.webroot.com/ca/en/auto-renewal-optout
sources: { pricing: https://www.webroot.com/ca/en/home/products/compare }
# Owner (M11.2), read 2026-11-20: OpenText's privacy policy names Webroot, LLC as Open Text Corporation's subsidiary
# (rule 2: the parent's own page), a public company of Canada, listed on the NASDAQ and the TSX (its investor site).
owner:
  name: Open Text Corporation
  page:
    name: OpenText Privacy Policy
    url: https://www.opentext.com/about/privacy
  quotes:
    - 'The products and services of Webroot, LLC (formerly known as Webroot Inc.), a subsidiary of Open Text Corporation, including its Webroot Mobile Security and Webroot for Chromebook.'
  country:
    code: CA
    page:
      name: OpenText Privacy Policy
      url: https://www.opentext.com/about/privacy
    quotes:
      - 'OpenText corporate headquarters are located at: 275 Frank Tompa Drive Waterloo, ON N2L 0A1 Canada'
    lastVerified: 2026-11-20
  stock:
    listings:
      - { exchange: NASDAQ, symbol: OTEX }
      - { exchange: TSX, symbol: OTEX }
    page:
      name: OpenText Investors
      url: https://investors.opentext.com/
    quotes:
      - 'NASDAQ: OTEX'
      - 'TSX: OTEX'
    lastVerified: 2026-11-20
  website: https://www.opentext.com
  lastVerified: 2026-11-20
# Ways to pay (M11.5), read 2026-11-20: its consumer terms' billing parties (Webroot, a reseller or an app store) and card
# payments, and the US checkout's "Payment Options" ("Card", "PayPal"). No page read names its card networks in words
# (the checkout shows logos only), and Canada's and the other countries' checkouts weren't opened.
paymentMethods:
  - methods: [card, app-store]
    page: Webroot Consumer Terms and Conditions
    url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
    quotes:
      - 'You are responsible for paying Webroot, a Reseller, or an App Store (a “Billing Party”) the Fees'
      - 'Webroot may utilize a third party to process credit card payments on Webroot’s behalf'
  - methods: [card, paypal]
    regions: [US]
    page: Checkout (US)
    url: https://buy.webroot.com/checkout?purchase=/offers2/Webroot%20Essentials%203%20Device%201%20Year%20USD%2030off
    quotes: ['Card', 'PayPal']
  - methods: [app-store]
    regions: [US]
    page: Webroot Consumer Terms and Conditions
    url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
    quotes:
      - 'You are responsible for paying Webroot, a Reseller, or an App Store (a “Billing Party”) the Fees'
# Renewal day (M11.5): its auto-renewal page charges a renewal a week before the subscription ends ("We’ll charge your
# credit card 7 days before your subscription expires"), so the date you signed up, charged 7 days early.
renewalAnchor:
  kind: same-date
  page: Webroot auto-renewal
  url: https://www.webroot.com/ca/en/auto-renewal-optout
  quotes:
    - 'We’ll charge your credit card 7 days before your subscription expires to make sure there are no gaps in your protection.'
  chargedBefore: { days: 7 }
  lastVerified: 2026-11-20
# Free use (the owner's item), read 2026-11-20: none. Its mobile apps "are free to download but require an active Webroot
# antivirus subscription" (its mobile page), and its trials page offers free trials of the paid plans ("Start your FREE
# 14-day trial today. No credit card required.", Canada's); its terms'
# "Free Mobile Software" clause names no app offered free now.
freeUse:
  kind: none
  pages:
    - https://www.webroot.com/products/mobile/
    - https://www.webroot.com/ca/en/home/products/trials
    - https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
  lastVerified: 2026-11-20
# Lab results (M11.2): AV-TEST's newest test of Webroot is of June 2019 (SecureAnywhere 9.0, its Webroot page), and it
# isn't in AV-TEST's tests of 2025 and 2026, so no rating is listed. AV-Comparatives' and SE Labs' aren't listed
# (data/raters.yaml).

# General features, read 2026-11-20. Platforms: PCs, Macs, Android and iOS ("Secures PCs, Macs, smartphones, Chromebooks,
# and tablets", the US compare page; "iOS device protection consists of a secure browser, backup, and password
# management. It does not scan iOS apps to block malware."); AntiVirus is "PC / Mac" only and AntiVirus for PC Gamers
# Windows only. Support: a support ticket ("open a support ticket", its support page), its community forum (the site's
# Community link) and phone ("Need more help? Call us at 1-866-350-6089", its auto-renewal page). App languages: its
# country sites' languages (English, French, German, Spanish, Italian, Portuguese, Japanese). No page read says how you
# sign in to its account (myaccount.carbonite.com) beyond a password, so account.sign-in is left out. No pause (renewal
# is turned off instead). Parental controls in Total Protection only.
features:
  platforms: [windows, macos, android, ios]
  support.channels: [email, community, phone]
  languages.interface: [en, fr, de, es, it, pt, ja]

# Perks (M11.6): what its pages list that no feature describes, in their words.
perks:
  - id: identity-shield
    name: Identity Shield
  - id: ai-chat-protection
    name: Protects personal information in AI chats
  - id: scam-check
    name: 'Scam Check: scan URLs, videos, mail & more for scams'
  - id: id-check
    name: 'ID Check: verify recipient before submitting payment'
  - id: scam-hotline
    name: Scam expert hotline
  - id: scam-reimbursement
    name: Up to $25k in scam reimbursement
  - id: cloud-backup
    name: Unlimited cloud storage for 1 PC or Mac

# Features, read 2026-11-20: Canada's compare page (its ticks, read from the page's code: AntiVirus has threat protection
# for PCs and Macs, fast scans, "Always-on security for your identity", ransomware protection, "Real-time anti-phishing
# blocks bad sites" and "Firewall and network connection monitor"; Internet Security Plus adds smartphones and tablets,
# "Protects account logins and passwords" and Chromebook protection; Complete adds "Eliminates traces of online
# activity"), the US compare page (Essentials: "Firewall and network monitor", "Web Threat Shield: Blocks risky sites",
# "Text scam detection" and "Breach monitor" (Android only), AI chat protection, Password Manager; Smart Protection adds
# Scam Check, ID Check, the scam hotline and reimbursement, a VPN for 3 or 5 devices and identity, financial and dark web
# monitoring with "24/7 US-based support with identity restoration experts"; Premium adds "Eliminates traces of online
# activity", "Cleans up digital clutter", "Financial and credit bureau monitoring" and "Up to $1M fraud expense
# reimbursement"; Total Protection adds a VPN for 5 devices, "Parental controls" (Windows) and "Unlimited cloud storage
# for 1 PC or Mac"), each product page, and its user guide: "Realtime Shield monitors unknown programs"; Infrared assesses
# "The reputation and behavior of newly introduced applications" (behaviour-based detection); "Webroot launches scans
# automatically every day" (scheduled scans, and scans you start); "The Webroot firewall works with the Windows
# firewall"; "System Optimizer is available when you purchase Webroot Internet Security Complete or Webroot Premium
# packages" (the speed-up tools, also in AntiVirus for PC Gamers: "Antivirus and system optimizer for your gaming PC");
# "LastPass Password Manager is available only for Internet Security Plus and above licenses" (a LastPass account set up
# through Webroot's portal; no page says which LastPass plan, so it's the password manager feature, not LastPass's
# plan). Breach monitor "Scans the dark web to check if up to 3 emails were involved in any known data breaches"
# (dark web monitoring). Security for Chromebook is an Android app ("From the Google Play store, install the Webroot® for
# Chromebook app on your compatible ChromeOS device.", its guide), so Android is its platform; its page: "Blocks unsafe
# sites, downloads and apps", "On-demand scans", "Password manager". No page says its password manager or apps make
# two-factor codes (authenticator false), and
# none names a boot-time scan, file recovery, vulnerability scan, spam filter, anti-theft, game mode or webcam control
# (its product pages' "Webcam protection" paragraph describes no feature). Its credit monitoring names no number of
# bureaus, so it's left out. Secure VPN (its page): "our no-log policy", "block any connection when the VPN is not active"
# (kill switch), split tunnelling ("not available on Apple computers and mobile devices"), "80 locations in more than 65
# countries"; no page states unlimited data (false, as the rule for a silent required feature says), its protocols,
# RAM-only servers or a way to connect your own devices.
