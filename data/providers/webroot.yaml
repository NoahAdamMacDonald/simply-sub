# Terms and policies (BLUEPRINT §4.10), read 2026-11-20: the Webroot Consumer Terms and Conditions (last updated January
# 27, 2025, PDF; the checkout's "By continuing you are agreeing to: Webroot Terms of Service" and its apps' licence), the
# OpenText Privacy Policy they name ("Webroot will treat Personal Data in accordance with its Privacy Policy which is
# available at https://www.opentext.com/about/privacy", last updated June 30, 2026), the US checkout's notes, its
# auto-renewal and refund pages, the Secure VPN page and OpenText's vulnerability reporting page. Read for no topic, or
# holding no worse clause: the UK's and Australia's own consumer terms (your own country's courts and law, a 14-day right
# to cancel, 30 days' notice of changes in Australia's), its website terms of service (the website only), and the older
# Webroot SecureAnywhere Privacy Statement of 12 February 2020 still linked from its privacy page. Not read: Germany's
# terms (German), Allstate Identity Protection's terms (the identity plans' partner, "Webroot Premium with Allstate
# Identity Protection", its user guide), the identity theft insurance policy (American Bankers Insurance Company of
# Florida's), LastPass's terms for the password manager, and Carbonite's MyAccount terms. No shared document applies.
policies:
  links:
    - name: Consumer terms and conditions
      url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
    - name: Privacy policy (OpenText)
      url: https://www.opentext.com/about/privacy
    - name: Checkout (US)
      url: https://buy.webroot.com/checkout?purchase=/offers2/Webroot%20Essentials%203%20Device%201%20Year%20USD%2030off
    - name: Auto-renewal
      url: https://www.webroot.com/ca/en/auto-renewal-optout
    - name: Refunds
      url: https://www.webroot.com/customers/refund/
    - name: Free trials
      url: https://www.webroot.com/ca/en/home/products/trials
    - name: Secure VPN
      url: https://www.webroot.com/products/secure-vpn/
    - name: Webroot Premium (family plan)
      url: https://www.webroot.com/products/premium/
    - name: Reporting a security vulnerability (OpenText)
      url: https://www.opentext.com/about/security-acknowledgements
  ratings:
    - topic: privacy.data-collection
      tier: bad
      reason: 'Its apps collect details from your device, even your internet search history and files, and it uses them to improve its products. Its terms give no way to say no.'
      sources:
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'username of logged-in operating system user, registry keys, language, Software report log(s), running processes, temporary Internet files, Internet search history'
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'improve Webroot threat intelligence data and other products and services'
      lastVerified: 2026-11-20
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your data with partners, marketing agencies and other companies’ networks, and lets companies show you ads based on your interests. You can opt out of those ads only through industry tools and device settings.'
      sources:
        - url: https://www.opentext.com/about/privacy
          quote: 'OpenText may share your personal information with its affiliates, business partners (including those who resell or distribute our products and services)'
        - url: https://www.opentext.com/about/privacy
          quote: 'For details on how to manage advertising, visit Digital Advertising Alliance Consumer Choice.'
      action:
        name: 'Choices about advertising (privacy policy)'
        url: https://www.opentext.com/about/privacy
      lastVerified: 2026-11-20
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It and its partners show you ads based on what you do (interest-based advertising). You can turn that off only through industry tools, browser cookies and device settings, one at a time.'
      sources:
        - url: https://www.opentext.com/about/privacy
          quote: 'Measuring or understanding the effectiveness of our advertising to you, and delivering or allowing our service providers to deliver relevant advertising to you, including interest-based advertising (otherwise known as “online behavioral advertising”)'
        - url: https://www.opentext.com/about/privacy
          quote: 'For your mobile device, you can review your device settings'
      action:
        name: 'Choices about advertising (privacy policy)'
        url: https://www.opentext.com/about/privacy
      lastVerified: 2026-11-20
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy says it uses AI to run and improve its services and analyse how you use them, but not whether your files or data train AI models.'
      pages:
        - https://www.opentext.com/about/privacy
        - https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
      lastVerified: 2026-11-20
    - topic: privacy.content-access
      tier: neutral
      reason: 'It says it doesn’t review what you store with it, and nobody can recover your password manager’s master password. It doesn’t say your vault is end-to-end encrypted.'
      sources:
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'WEBROOT AND ITS LICENSORS HAVE NO CONTROL OVER ANY SUBMISSIONS, DO NOT REVIEW OR COMMENT ON SUBMISSIONS'
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'If You lose Your master password, You cannot restore it, but You can reset it by following the instructions included in the Service.'
      lastVerified: 2026-11-20
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your data as long as it needs it, and may start deleting it 45 days after your subscription ends. It gives no set time.'
      sources:
        - url: https://www.opentext.com/about/privacy
          quote: 'OpenText will retain personal information for as long as needed to provide the relevant products or services or to fulfil the purposes for which the personal information was collected or as per the specific contractual terms.'
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'When this Agreement terminates or expires, Webroot may, at any time beginning 45 days from the date of expiration or termination, delete (or render anonymous) Your Personal Data held by Webroot.'
      lastVerified: 2026-11-20
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask it to delete your data with a request form, by email or by phone, in some cases. It doesn’t say how soon.'
      sources:
        - url: https://www.opentext.com/about/privacy
          quote: 'You have the right to ask us to erase your personal information in certain circumstances.'
        - url: https://www.opentext.com/about/privacy
          quote: 'To exercise your rights regarding your personal information please fill out this'
      action:
        name: 'Data Subject Request Form (privacy policy)'
        url: https://www.opentext.com/about/privacy
      lastVerified: 2026-11-20
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask it for a copy of the data you gave it, with a request form.'
      sources:
        - url: https://www.opentext.com/about/privacy
          quote: 'You have the right to ask that we transfer the information you gave us from one organization to another or give it to you.'
      action:
        name: 'Data Subject Request Form (privacy policy)'
        url: https://www.opentext.com/about/privacy
      lastVerified: 2026-11-20
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It shares data with authorities when the law or a lawful request requires it. It doesn’t say it tells you or publish how often.'
      sources:
        - url: https://www.opentext.com/about/privacy
          quote: 'We may be required to share personal information with a third party or body where such disclosure is required to satisfy applicable law or other legal or regulatory requirement, or to protect the rights or property of OpenText or others.'
      lastVerified: 2026-11-20
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data can go to the United States and other countries. It uses the EU’s standard contracts and the EU-US Data Privacy Framework to protect it.'
      sources:
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'WEBROOT MAY TRANSFER YOUR PERSONAL DATA TO ITS LOCATIONS IN THE UNITED STATES AND OTHER JURISDICTIONS.'
        - url: https://www.opentext.com/about/privacy
          quote: 'OpenText US has certified to the U.S. Department of Commerce that it adheres to the EU-U.S. Data Privacy Framework Principles'
      lastVerified: 2026-11-20
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'An account needs an email address or a phone number, and a password; buying needs your email and billing address.'
      sources:
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'including an email address, phone number, or a password (“Login Information”)'
      lastVerified: 2026-11-20
    - topic: billing.cancellation
      tier: good
      reason: 'You can turn off automatic renewal at any time, online with your keycode or in your account, after it offers you a discount to stay.'
      sources:
        - url: https://buy.webroot.com/checkout?purchase=/offers2/Webroot%20Essentials%203%20Device%201%20Year%20USD%2030off
          quote: 'You may disable automatic renewal of your subscription at any time by accessing your MyAccount and adjusting your subscription settings.'
        - url: https://www.webroot.com/ca/en/auto-renewal-optout
          quote: 'Enter your keycode below to remove automatic renewal from your subscription preferences.'
      lastVerified: 2026-11-20
    - topic: billing.refunds
      tier: good
      reason: 'You can get your money back within 70 days of buying, and its refund form takes automatic renewal charges too.'
      sources:
        - url: https://www.webroot.com/customers/refund/
          quote: 'Webroot offers a 70-day money back guarantee on all of its consumer products'
        - url: https://www.webroot.com/ca/en/auto-renewal-optout
          quote: 'If you had a consumer product that has already been charged for automatic renewal and would like to request a refund'
      lastVerified: 2026-11-20
    - topic: billing.price-changes
      tier: poor
      reason: 'It can raise the price before any renewal as it chooses, and its terms don’t promise to tell you first. Its renewal reminders don’t say they include the price.'
      sources:
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'Webroot reserves the right to increase Fees in its discretion prior to any renewal Subscription Term, provided such increase is in accordance with applicable law.'
      lastVerified: 2026-11-20
    - topic: billing.free-trials
      tier: neutral
      reason: 'Its website trials need no card. A trial that takes a card turns into a paid plan as soon as it ends unless you cancel first.'
      sources:
        - url: https://www.webroot.com/ca/en/home/products/trials
          quote: 'Start your FREE 14-day trial today. No credit card required.'
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'You will be charged for the Service immediately after the expiration of the trial period.'
      lastVerified: 2026-11-20
    - topic: billing.renewal-notice
      tier: good
      reason: 'It emails you 30 days and 14 days before your subscription ends, then charges you 7 days before.'
      sources:
        - url: https://www.webroot.com/ca/en/auto-renewal-optout
          quote: 'We’ll notify you using the email address you gave us when you registered your software. We’ll tell you which product will expire and when, and remind you about automatic renewal.'
        - url: https://www.webroot.com/ca/en/auto-renewal-optout
          quote: 'However, this reminder will inform you that you will be charged 7 days before expiration.'
      lastVerified: 2026-11-20
    - topic: billing.fees
      tier: good
      reason: 'The only fee it names is interest on late payments, which paying on time avoids.'
      sources:
        - url: https://www-cdn.webroot.com/8917/4291/5582/Webroot_Consumer_Terms_and_Conditions_v.2025.1.27_-_SPS_.pdf
          quote: 'All late payments will bear interest at the rate of 1.5% per month'
      lastVerified: 2026-11-20
    - topic: billing.plan-changes
      status: not-stated
