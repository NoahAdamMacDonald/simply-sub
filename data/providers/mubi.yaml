# Researched by hand on 2026-11-04 (M11.15, the streaming category), read with Edge from Canada and through each
# country's exit (the owner's choice of 2026-11-04). Pages, each quoted where it's used:
# Pricing: mubi.com/en/<country>/memberships, which prices by where the visitor is (every country's path showed
# C$16.99 from Canada), so each region was read through its exit, monthly and with "Show yearly" ("Billed in one
# payment"). MUBI Classic everywhere; MUBI GO, with "A hand-picked cinema ticket, every single week", in the US, the UK,
# Ireland and Germany. Its help centre bills "every 30 days" monthly and "every 360 days" yearly ("When will my
# subscription fee be charged?"), so the prices are per 30 and 360 days.
# Where it's sold: every catalog region (each exit showed its own currency). No availableIn.
# Region checklist, 2026-11-04: 1. the country paths don't change the price; 6. read through each country's exit, each
# in its own currency; the rest not needed.
# Not listed: the student discount (an eligibility-only offer, as for YouTube's).

# Coverage: mubi.go in CA, AU, NZ, FR, NL, ES and IT: those countries' memberships pages, read through each country's
# exit (Canada's from Canada) on 2026-11-04, show MUBI Classic only.

id: mubi
name: MUBI
website: https://mubi.com
# Its help centre.
domains: [help.mubi.com]
category: streaming
spendCategory: streaming
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    AU: AUD,
    NZ: NZD,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
cancelUrl: https://help.mubi.com/article/68-how-do-i-cancel-my-subscription-if-i-purchased-it-online-through-the-web
sources: { pricing: https://mubi.com/en/ca/memberships }
# Accepted cards and ways to pay, read 2026-11-04 in its help centre ("How can I pay for a MUBI subscription?"), which
# adds "some payment methods may not be supported in some countries"; Apple's and Google Play's billing from its
# cancelling articles. Maestro is a Mastercard brand.
acceptedNetworks:
  GLOBAL:
    networks: [amex, mastercard, visa]
    url: https://help.mubi.com/article/38-how-can-i-pay-for-a-mubi-subscription
    quotes:
      - 'the following credit and debit cards: American Express, Master Card, Maestro and VISA'
paymentMethods:
  - methods: [card, paypal, apple-pay, google-pay]
    page: 'How can I pay for a MUBI subscription?'
    url: https://help.mubi.com/article/38-how-can-i-pay-for-a-mubi-subscription
    quotes:
      - 'MUBI currently supports payment via PayPal, Apple Pay, Google Pay and the following credit and debit cards: American Express, Master Card, Maestro and VISA.'
  - methods: [app-store]
    page: 'How do I cancel my subscription if I purchased it online through the web?'
    url: https://help.mubi.com/article/68-how-do-i-cancel-my-subscription-if-i-purchased-it-online-through-the-web
    quotes:
      - 'I have subscribed through the Google Play Store. How can I cancel or change my subscription?'

# Owner: MUBI Inc., which its privacy policy names as providing the service. No page read says who owns it or where
# it's from; its terms' California law, and the jobs page's "established entities" in London, New York, Berlin and
# Istanbul, point to the US (the owner's choice of 2026-11-04).
owner:
  name: 'MUBI Inc.'
  page:
    name: Privacy policy
    url: https://mubi.com/en/privacy_policy
  quotes:
    - 'by MUBI Inc. ("MUBI") in the course of our provision of the MUBI and MUBI GO services'
  country:
    code: US
    page:
      name: Terms & Conditions
      url: https://mubi.com/en/terms_of_service
    quotes:
      - 'governed by and construed in accordance with the laws of the State of California'
    lastVerified: 2026-11-04
  lastVerified: 2026-11-04

# Renewal day (M11.5), read 2026-11-04 in its help centre: every 30 days, or every 360 on a yearly plan.
renewalAnchor:
  kind: every-30-days
  page: When will my subscription fee be charged?
  url: https://help.mubi.com/article/1243-when-will-my-subscription-fee-be-charged
  quotes:
    - 'If you are on our monthly plan, you will be charged every 30 days, and if you are on our yearly plan, you will be charged every 360 days.'
  lastVerified: 2026-11-04

# Perks (M11.6): MUBI GO's line that no feature describes, in its words.
perks:
  - id: weekly-cinema-ticket
    name: A hand-picked cinema ticket, every single week

