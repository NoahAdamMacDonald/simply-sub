# Terms and policies, read 2026-11-04 (M11.15): MUBI's Terms & Conditions, its Privacy Policy and its help centre's
# articles on cancelling, refunds, plans, taxes and screens.
policies:
  links:
    - name: 'Terms & Conditions'
      url: https://mubi.com/en/terms_of_service
    - name: 'Privacy policy'
      url: https://mubi.com/en/privacy_policy
    - name: 'Changing plans'
      url: https://help.mubi.com/article/67-can-i-change-my-plan
    - name: 'Taxes and fees'
      url: https://help.mubi.com/article/1287-do-membership-prices-include-tax-or-other-fees
    - name: 'Screens'
      url: https://help.mubi.com/article/260-how-many-screens-can-i-watch-on
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It studies how you use MUBI, for itself and its business partners. You can only object to that by asking it.'
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: 'use data analytics to provide insight and analysis of our customers for ourselves and our business partners'
        - url: https://mubi.com/en/privacy_policy
          quote: '(iv) Object to processing of your personal data where we are relying on a legitimate interest'
      action:
        name: 'Its privacy policy'
        url: https://mubi.com/en/privacy_policy
      lastVerified: 2026-11-04
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares information about you with advertising networks such as Google and Facebook, to aim ads at you on its site and elsewhere. You can only refuse their cookies, browser by browser.'
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: 'We share your information with advertisers, ad servers, and ad networks (including but not limited to Google Analytics, Facebook Pixel, and Facebook Offline Events) to select and deliver advertising and content, and target and personalise advertising and content both on our sites and on selected partner sites.'
      action:
        name: 'Cookie preferences'
        url: https://mubi.com/en/privacy_policy
      lastVerified: 2026-11-04
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'MUBI has no ads, but advertising companies place cookies on its site to show you ads elsewhere. You can refuse them only browser by browser.'
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: 'We partner with advertisers, ad network providers and ad serving companies to place cookies on our sites to allow them to show you advertisements both on and off our sites'
      action:
        name: 'Cookie preferences'
        url: https://mubi.com/en/privacy_policy
      lastVerified: 2026-11-04
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy doesn’t say whether it trains AI on your ratings, lists or reviews.'
      pages: [https://mubi.com/en/privacy_policy]
      lastVerified: 2026-11-04
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information for as long as you have an account, and some of it after, for as long as it decides.'
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: 'We keep your personal information for as long you maintain a MUBI account or subscription.'
        - url: https://mubi.com/en/privacy_policy
          quote: 'When your account has been deleted or your subscription is over, we may retain certain personal information for purposes such as complying with our legal obligations, resolving disputes, preventing fraud or misuse of promotions, and protecting our rights and interests.'
      lastVerified: 2026-11-04
    - topic: privacy.data-deletion
      tier: neutral
      reason: "You can ask it to delete your information, but it doesn't say how long that takes."
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: '(iii) Request erasure of your personal data.'
      action:
        name: 'Its privacy policy'
        url: https://mubi.com/en/privacy_policy
      lastVerified: 2026-11-04
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask for a copy of your information in a common format, but there’s no way to get it yourself.'
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: 'We will provide to you, or a third party you have chosen, your personal data in a structured, commonly used, machine-readable format.'
      action:
        name: 'Its privacy policy'
        url: https://mubi.com/en/privacy_policy
      lastVerified: 2026-11-04
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over information to comply with the law and government requests, and says nothing more about how.'
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: 'We reserve the right to disclose your personal data in order to comply with the law, applicable regulations and government requests'
      lastVerified: 2026-11-04
    - topic: privacy.data-location
      tier: poor
      reason: "Your information can go to other countries, including outside Europe, and it doesn't say what protects it there beyond following the law."
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: 'we will ensure that the information is transferred in accordance with this Privacy Policy and as permitted by the applicable laws on data protection'
      lastVerified: 2026-11-04
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'An account takes an email address and a password, and a subscription your payment details.'
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'To become a User, submit your email address to MUBI and create a password.'
      lastVerified: 2026-11-04
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 18 to subscribe; younger viewers may watch only with a parent involved. It says nothing more about children’s data.'
      sources:
        - url: https://mubi.com/en/privacy_policy
          quote: 'You must be 18 years of age or older to subscribe to the MUBI service or have a MUBI membership.'
        - url: https://mubi.com/en/privacy_policy
          quote: 'While individuals under the age of 18 may utilize the Services, they may do so only with the involvement, supervision, and approval of a parent or legal guardian.'
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel in your account settings at any time, and keep watching until the end of the period you paid for.'
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'You may cancel your MUBI subscription at any time, and you will continue to have access to the MUBI service through the end of your billing period.'
      action:
        name: 'How to cancel'
        url: https://help.mubi.com/article/68-how-do-i-cancel-my-subscription-if-i-purchased-it-online-through-the-web
      lastVerified: 2026-11-04
    - topic: billing.refunds
      tier: neutral
      reason: "You don't get money back, but you keep watching until the end of the period you paid for."
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'Payments are nonrefundable and there are no refunds or credits for partially used periods.'
        - url: https://mubi.com/en/terms_of_service
          quote: 'Following any cancellation, however, you will continue to have access to the service through the end of your current billing period.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      tier: neutral
      reason: "It emails you before a new price applies, but doesn't say how far ahead."
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'any price changes to your service will take effect following email notice to you.'
      lastVerified: 2026-11-04
    - topic: billing.free-trials
      tier: poor
      reason: 'Its 7-day trial turns into a paid subscription on the payment method you gave, and it says outright that it won’t remind you.'
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'You will not receive a notice from us that your free trial period has ended or that the paying portion of your subscription has begun.'
      lastVerified: 2026-11-04
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say monthly and yearly plans renew on their own, but not that it reminds you first.'
      pages: [https://mubi.com/en/terms_of_service]
      lastVerified: 2026-11-04
    - topic: billing.fees
      tier: great
      reason: 'It charges the price and any taxes where you live, and names no other fees.'
      sources:
        - url: https://help.mubi.com/article/1287-do-membership-prices-include-tax-or-other-fees
          quote: 'Depending on your location, applicable taxes may be applied to your membership fee in accordance with local regulations.'
      lastVerified: 2026-11-04
    - topic: billing.plan-changes
      tier: neutral
      reason: 'A change of plan starts when your current period ends.'
      sources:
        - url: https://help.mubi.com/article/67-can-i-change-my-plan
          quote: 'Any changes made to your subscription plan will be reflected at the end of your existing renewal period.'
      lastVerified: 2026-11-04
    - topic: legal.disputes
      tier: good
      reason: 'Disputes go to the courts of Santa Clara County, California, under California law, with no arbitration, and it keeps the consumer rights your own law gives you.'
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'submitted to the exclusive jurisdiction of the federal and state courts located in Santa Clara County, California'
        - url: https://mubi.com/en/terms_of_service
          quote: 'These terms will not limit any consumer protection rights that you may be entitled to under the mandatory laws of your local jurisdiction.'
      lastVerified: 2026-11-04
    - topic: legal.terms-changes
      tier: bad
      reason: 'It can change its terms at any time without telling you first; the new terms apply to anything you buy after they’re posted.'
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'These Terms & Conditions are subject to change without prior written notice at any time, at MUBI’s sole discretion, and such changes shall apply to any purchases made after such changes are posted.'
      lastVerified: 2026-11-04
    - topic: legal.account-closure
      tier: neutral
      reason: 'Its terms name one reason to close an account: repeatedly breaking others’ copyright. They don’t mention notice or a refund.'
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'can, in appropriate circumstances, suspend or terminate the accounts'
      lastVerified: 2026-11-04
    - topic: legal.service-changes
      tier: neutral
      reason: 'Its films come and go: the library is regularly updated.'
      sources:
        - url: https://mubi.com/en/terms_of_service
          quote: 'The MUBI service, including the content library, is regularly updated.'
