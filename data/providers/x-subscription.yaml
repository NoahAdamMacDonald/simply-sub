# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch and Edge. What a buyer agrees to: the sign-up
# page ("By continuing, you agree to the SpaceXSI Terms of Service, Privacy Policy, and Cookie Policy."), the
# X-Subscription Consumer Terms of Service (SpaceX Super Intelligence LLC's, "for example Grok, Grokipedia, Grok Bot,
# Cursor"; Anysphere a party for Cursor's third-party components), the Bundled Subscription Terms (X Subscription Corp.,
# for buying, renewing, cancelling and refunds), the SpaceXSI Privacy Policy and Acceptable Use Policy, and each
# service's own terms ("Use of each service is also subject to that Service Provider’s terms"): Cursor's Terms of
# Service, Privacy Policy, Data Use overview and Cookie Policy (Anysphere), and X's Terms of Service and Privacy Policy
# for the X benefits. Each rating takes the worst clause of them. Read but holding nothing worse: SpaceXSI's Acceptable
# Use Policy and Cookie Policy (its cookie settings, below), Cursor's Security page (below), and X's Purchaser Terms
# (legal.x.com/purchaser-terms, the legacy X Premium plans' only). Not read: the Grok and Cursor addenda (team plans
# only, "each a “ Teams Terms ”"), the Grok Bot terms (Premium and up, its own product terms), SpaceXSI's Europe Privacy
# Policy Addendum. Calibrated against Claude and ChatGPT.
policies:
  links:
    - name: 'Bundled subscription terms'
      url: https://x.ai/legal/bundled-subscription-terms
    - name: 'X Subscription consumer terms'
      url: https://x.ai/legal/x-subscription-terms-of-service
    - name: 'SpaceXSI privacy policy'
      url: https://x.ai/legal/privacy-policy
    - name: 'SpaceXSI cookie policy'
      url: https://x.ai/legal/cookie-policy
    - name: 'Legal requests'
      url: https://x.ai/legal/law-enforcement
    - name: 'Billing and payments'
      url: https://cursor.com/help/account-and-billing/billing
    - name: 'Cursor CLI'
      url: https://cursor.com/help/integrations/cli
    - name: 'Cursor privacy policy'
      url: https://cursor.com/en-US/privacy
    - name: 'Cursor data use'
      url: https://cursor.com/en-US/data-use
    - name: 'Cursor security'
      url: https://cursor.com/en-US/security
    - name: 'Pricing and plans'
      url: https://cursor.com/help/account-and-billing/pricing
    - name: 'Delete your account'
      url: https://cursor.com/help/account-and-billing/delete-account
    - name: 'Privacy and data'
      url: https://cursor.com/help/security-and-privacy/privacy
    - name: 'What is The X Subscription?'
      url: https://cursor.com/help/the-x-subscription/overview
    - name: 'Sign up'
      url: https://accounts.x.ai/sign-up
    - name: 'X privacy policy'
      url: https://x.com/en/privacy
  ratings:
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online whenever you like, but at least a day before it renews, or you pay for the next period. You keep it until the end of the time you paid for.'
      sources:
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'Regardless of payment method, your subscription automatically renews unless you cancel at least 24 hours before the end of the current subscription period.'
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'Upon cancellation, your Paid Service will remain active through the end of the current period.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back unless the law says so, but you keep using it until the end of the time you paid for.'
      sources:
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'All payments for Paid Services are final and not refundable or exchangeable, except as required by applicable law or specified in the Service.'
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'Upon cancellation, your Paid Service will remain active through the end of the current period.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: great
      reason: 'It tells you before a big price change, a new price starts only with your next period, and you can cancel before it does.'
      sources:
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'X Subscription Corp will provide reasonable advance notice of any material price change. For subscriptions, price changes take effect at the start of the next subscription period following the change. If you do not agree with a price change, you may cancel before it takes effect'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: neutral
      reason: 'If you get a free trial or a special price, it turns into the full price on its own unless you cancel before it ends.'
      sources:
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'At the end of a promotional or trial period, your subscription will automatically renew at the standard subscription fee unless you cancel before the end date of the promotion or trial.'
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own, but not that it reminds you first.'
      pages:
        [
          https://x.ai/legal/bundled-subscription-terms,
          https://cursor.com/help/account-and-billing/billing,
        ]
      lastVerified: 2026-11-13
    - topic: billing.fees
      tier: poor
      reason: 'You pay any card, bank and currency exchange fees on top of the price, and it charges in US dollars.'
      sources:
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'to pay the price listed for the Paid Service, along with any additional amounts relating to applicable taxes, credit card fees, bank fees, foreign transaction fees, foreign exchange fees, and currency fluctuations'
      lastVerified: 2026-11-13
    - topic: billing.plan-changes
      tier: poor
      reason: 'A bigger plan starts at once and a smaller one when your period ends, but it may give nothing back for the time you already paid for.'
      sources:
        - url: https://cursor.com/help/account-and-billing/pricing
          quote: 'Upgrades apply right away. Downgrades apply at the end of your billing period.'
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'No refund or pro-rated amount may be provided for upgrade or downgrade unless required by applicable law'
      lastVerified: 2026-11-13
    - topic: legal.disputes
      tier: good
      reason: 'Disputes go to the courts in two Texas counties it chose, and you give up class actions. A private referee decides only if those courts can’t. Europeans go to Irish courts.'
      sources:
        - url: https://x.ai/legal/x-subscription-terms-of-service
          quote: 'Unless prohibited by your country’s applicable law, any disputes between you and us will be resolved by a court in Tarrant County or Wichita County, Texas, based on Texas law, except that if the forum selection clause in these Terms is unenforceable for any reason, then the dispute will be arbitrated.'
        - url: https://x.ai/legal/x-subscription-terms-of-service
          quote: 'To the extent permitted by applicable law, you agree to waive any right to bring a class action or other representative action.'
      lastVerified: 2026-11-13
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It tells you about big changes to its terms, without saying how early. If you keep using it after they start, you’ve agreed; if not, you must cancel first.'
      sources:
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'If we make material revisions, we will notify you by service notification, email, or other reasonable means.'
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'If you do not agree, you must cancel your Paid Service before the revisions take effect.'
      lastVerified: 2026-11-13
    - topic: legal.account-closure
      tier: bad
      reason: 'It can end your plan or close your account at any time for any reason, without telling you, and you get no money back.'
      sources:
        - url: https://x.ai/legal/bundled-subscription-terms
          quote: 'X Subscription Corp may suspend or terminate your access to one or more Paid Service(s), cease providing you with all or part of a Paid Service, or take any other action it deems appropriate at any time for any or no reason'
        - url: https://x.ai/legal/x-subscription-terms-of-service
          quote: 'We may terminate or suspend your access to our Service, cancel your subscription or account, or delete your data or account at any time without notice to you if we determine, at our sole discretion, that:'
        - url: https://x.ai/legal/x-subscription-terms-of-service
          quote: 'Upon Service termination, you will not be entitled to any refund, except where required by law.'
      lastVerified: 2026-11-13
    - topic: legal.inactivity
      tier: poor
      reason: 'It can close your account if you haven’t used it for 120 days, without warning you first.'
      sources:
        - url: https://x.ai/legal/x-subscription-terms-of-service
          quote: 'Your account has been inactive for more than 120 days.'
        - url: https://x.ai/legal/x-subscription-terms-of-service
          quote: 'We may terminate or suspend your access to our Service, cancel your subscription or account, or delete your data or account at any time without notice to you if we determine, at our sole discretion, that:'
      lastVerified: 2026-11-13
    - topic: legal.content-rights
      tier: bad
      reason: 'Anything you type, upload or make, your face and voice included, it may use forever for any purpose, and pass that right on to others.'
