# Researched by hand on 2026-11-13 and 2026-11-14 (the full catalog run, AI batch 1), read with Edge from Canada
# (cursor.com/pricing and its FAQ, x.ai/pricing, x.ai/grok, accounts.x.ai/sign-up, SpaceX's investor pages), cursor.com
# /pricing again through a US, a UK and a German exit, and with a plain fetch (Cursor's help centre, Cursor's and
# SpaceXSI's legal pages, x.ai's news posts, the SpaceXSI documentation as its Markdown copies, X's terms and privacy
# policy, SpaceX's Form 8937 on Cursor). Pages, each quoted where it's used.
# What it is (notes.md, the brand decision): asked for as Cursor (Hobby, Pro, Pro+, Ultra), but Cursor no longer sells
# those plans to new customers. "Cursor is part of The X Subscription, one subscription for Grok, Cursor, and X. New
# customers choose a plan on The X Subscription." and "Legacy Cursor plans are the plans Cursor sold before The X
# Subscription. They aren't available to new customers, but existing subscribers keep them until they switch or cancel."
# (Pricing and plans, Cursor's help centre). "Today we’re introducing The X Subscription, which brings together Grok,
# Grok Bot, Cursor, and X Premium in one plan." (x.ai/news/x-subscription, 2026-10-12). One company sells it under one
# set of terms and one account, on cursor.com, x.ai/pricing and X: "Your bundled subscription is sold to you by X
# Subscription Corp." and "Your purchase contract for the bundled subscription is with X Subscription Corp only."
# (Bundled Subscription Terms); "Subscriptions are only sold directly through X Subscription Corp." (cursor.com/pricing's
# FAQ); "If you subscribed to The X Subscription on X, cancel it in X." (SpaceXSI docs, Cancel your subscription). By the
# brand rule (one company, the same terms and account: one provider) it's one provider, named after what's sold, as
# Google AI is: X Subscription, found as Cursor, Grok and X Premium too (aliases). The id isn't published yet: renaming
# it to `cursor` is a search and replace if the owner prefers (notes.md).
# Pricing: cursor.com/pricing (Free $0, Plus $8, Premium $30, Super $100 a month; Ultra $200 in its comparison table),
# the same on x.ai/pricing, and Cursor's Pricing and plans article: "Annual billing is $80/yr for Plus, $300/yr for
# Premium, $1,000/yr for Super, and $2,000/yr for Ultra. Prices exclude tax." The SpaceXSI docs' Pricing (docs.x.ai/
# x-subscription/pricing) gives the same table ("$80/yr ($7/mo)", "$300/yr ($25/mo)", "$1000/yr ($84/mo)", "$2000/yr
# ($167/mo)"). One price list for everywhere, in US dollars: the page shows a bare "$" from Canada and through a US, a UK
# and a German exit alike, and its own data names the currency ("priceCurrency":"USD" for Plus, Premium, Super and Ultra,
# the page's structured data); its terms charge "foreign exchange fees, and currency fluctuations" on top. None is an
# offer; no page says they include tax ("Prices shown do not include applicable taxes or fees (e.g. VAT).").
# Region checklist, 2026-11-13: 1. cursor.com has language versions only (hreflang de, es, fr, hi, ja, ko, pt-BR, zh),
# no country paths; 2. no country or currency picker; 3. the page's structured data names USD for every plan; 4. checkout
# needs an account (its "Get Plus" buttons lead to cursor.com/api/auth/checkoutDeepControl); 5. no help article prices
# by country; 6. Edge from Canada and through a US, UK and German exit, all "$8", "$30", "$100", "$200"; 7. no bill
# offered. Where it's sold: "Over the next few days, we’ll make it available to everyone globally." (its launch post);
# its terms limit it to "a country supported by X Subscription Corp" but no page lists them, so no availableIn.
# Not listed: the legacy plans (Cursor's Hobby, Start, Pro, Pro+, Ultra; SuperGrok; X Premium), which new customers
# can't buy (notes.md); Teams seats ($30, $100 or $200 a seat, business); Enterprise; top-ups and third-party model use
# (usage-billed, out).
# Bundles: none: it is itself the bundle of Grok, Cursor and X Premium, priced as one plan, so no bundle file. Official
# resellers: none: "No. Subscriptions are only sold directly through X Subscription Corp. We do not authorize any
# resellers or third-party sellers." (cursor.com/pricing's FAQ, "Can I buy Cursor from a reseller or third party?").
# Prices by country (read 2026-11-13 and 2026-11-14 through each country's exit, after a second agent's check): grok.com/plans
# shows each country its own currency ("Prices shown do not include applicable taxes or fees."), regular prices after
# its first-month offers ("50% off for 1 month, then CA$41.99 monthly"); cursor.com and x.ai/pricing show US dollars,
# kept as the price for everywhere else.
# Free use: the Free plan ("Free gives you access to Cursor's core features with limited usage.").

id: x-subscription
name: X Subscription
aliases: [the x subscription, cursor, grok, supergrok, x premium, grok bot, anysphere]
website: https://x.ai/pricing
# Cursor's site and help centre, SpaceXSI's docs (docs.x.ai is under x.ai), the shared sign-up page (accounts.x.ai) and
# X, where it's sold and where its X benefits and X's own terms are.
domains: [cursor.com, x.com, grok.com]
category: ai
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    AU: AUD,
    NZ: NZD,
    GLOBAL: USD,
  }
# Its cancel article covers The X Subscription ("Go to grok.com/dashboard/billing", "Open the options on the Current
# plan card and choose to cancel") and the legacy plans.
cancelUrl: https://cursor.com/help/account-and-billing/cancel
sources: { pricing: https://cursor.com/pricing }
notes: 'One subscription for Grok, Cursor and X Premium, sold by X Subscription Corp. (SpaceX) on cursor.com, x.ai and X since 12 October 2026. Earlier Cursor, SuperGrok and X Premium plans continue for their subscribers but are no longer sold.'

# Ways to pay (M11.5), read 2026-11-13: the SpaceXSI docs' "Which payment methods can I use?" lists cards, Apple Pay,
# Google Pay, Link (Stripe's wallet: `other`) and Alipay on the web ("Some payment methods are only available in certain
# countries. Checkout shows the ones you can use."), and its terms add Apple's and Google's in-app purchase. No page
# names the card networks (cursor.com/pricing's FAQ: "Self-serve plans support all major credit and debit cards."), so
# no acceptedNetworks.
paymentMethods:
  - methods: [card, apple-pay, google-pay, alipay, other]
    page: 'Which payment methods can I use?'
    url: https://docs.x.ai/x-subscription/payment-methods
    quotes:
      - 'Cards'
      - 'Apple Pay'
      - 'Google Pay'
      - 'Link'
      - 'Alipay'
  - methods: [app-store]
    page: Bundled subscription terms
    url: https://x.ai/legal/bundled-subscription-terms
    quotes:
      - 'Available payment methods may include Apple in-app purchase, Google in-app purchase'

# Owner (M11.2), read 2026-11-13: sold by X Subscription Corp. (Austin, Texas: its Bundled Subscription Terms), with the
# services "provided by the respective companies": Cursor by Anysphere, Inc., Grok by SpaceX Super Intelligence LLC, and
# X. SpaceX owns them: its Form 8937 on the Cursor merger (ir.spacex.com, below); "SpaceX announced today that it has
# acquired xAI." (x.ai/news/xai-joins-spacex); and its quarterly report's "Super Intelligence (“SI”) segment ... a
# frontier LLM Grok, SI-assisted software engineering platform Cursor, and real-time information, entertainment, and
# free speech platform X" (its Q3 2026 10-Q, linked from ir.spacex.com but served from q4cdn.com, which the provider
# can't claim, so not cited). Listed: SpaceX's investor FAQs. No majority holder: the 10-Q gives Class B shares ten
# votes each ("Each holder of Class B is entitled to ten votes for each share held.") but names no holder, and no annual
# report or proxy circular was read (notes.md).
owner:
  name: 'Space Exploration Technologies Corp. (SpaceX)'
  website: https://www.spacex.com
  page:
    name: 'Form 8937: the Anysphere (Cursor) merger'
    url: https://ir.spacex.com/files/doc_downloads/2026/09/FINAL-Form-8937-Cursor.pdf
  quotes:
    - 'Space Exploration Technologies Corp. (“SpaceX”) completed its acquisition of Anysphere, Inc. (“Anysphere,” which operates as Cursor)'
    - 'with Anysphere continuing as the surviving corporation and becoming a wholly owned subsidiary of SpaceX'
  country:
    code: US
    page:
      name: Investor FAQs
      url: https://ir.spacex.com/faqs-and-contact/default.aspx
    quotes:
      - 'SpaceX is headquartered in Starbase, Texas.'
    lastVerified: 2026-11-13
  stock:
    listings:
      - { exchange: Nasdaq, symbol: SPCX }
    page:
      name: Investor FAQs
      url: https://ir.spacex.com/faqs-and-contact/default.aspx
    quotes:
      - 'SpaceX shares trade on the Nasdaq Global Select Market and Nasdaq Texas, under the ticker symbol “SPCX”.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13

# Renewal day (M11.5), read 2026-11-13 in Cursor's billing article, which covers The X Subscription and the legacy plans
# ("The cursor.com steps on this page apply to legacy Cursor plans", not its billing cycle). Its terms: "If you provide
# new payment information and are successfully charged, your subscription period will be based on the original renewal
# date" and "Mobile renewal processing dates may vary by up to 3 days."
renewalAnchor:
  kind: same-date
  page: Billing and payments
  url: https://cursor.com/help/account-and-billing/billing
  quotes:
    - 'Your cycle starts on the date you subscribe.'
    - 'Individual plans renew on your signup date'
  lastVerified: 2026-11-13

# Perks (M11.6), read 2026-11-13 on cursor.com/pricing (cards and "Compare features across plans") and x.ai/pricing,
# each line no feature describes, named in their words. Usage levels are perks (categories.md: not comparable): the
# table's "Usage" row ("Limited", "Basic", "4x Plus", "15x Plus", "50x Plus"). X's benefits by plan from the SpaceXSI
# docs ("Plus: a checkmark, creator tools, and fewer ads on X"; "Premium, Super, and Ultra: full X Premium+ benefits").
perks:
  - id: usage-4x
    name: 4x more usage compared to Plus
  - id: usage-15x
    name: 15x more usage compared to Plus
  - id: usage-50x
    name: 50x Plus usage
  - id: priority-access
    name: Priority model access at peak times
  - id: cloud-agents
    name: Cloud agents & automations in Cursor
  - id: code-hosting
    name: Code hosting via Origin
  - id: code-reviews
    name: AI code reviews via Bugbot
  - id: grok-api-access
    name: Grok API access
  - id: faster-chat
    name: Faster Chat responses
  - id: video-1080p
    name: Create 1080p, 15s videos
  - id: x-plus-benefits
    name: A checkmark, creator tools, and fewer ads on X
  - id: x-premium-plus-benefits
    name: Full X Premium+ benefits
  - id: ad-free-most-surfaces
    name: Ad-free scrolling on most surfaces

# Features, read 2026-11-13 (AI: the registry on feat/t12-ai-1), on every plan unless named:
# - The table's rows: "Agent" (all), "Chat" ("Limited" on Free), "Image generation (Imagine)" ("Limited" on Free), "Video
#   generation" (Premium and up), "Grok API access" (Plus and up: "Paid plans include Grok API access. API usage is
#   billed separately at standard model rates", a perk, not ai.api-credits), "Grok Build" ("Limited" on Free), "Grok Bot"
#   (Premium and up), "Cloud agents & automations", "Code hosting via Origin", "AI code reviews via Bugbot" and
#   "Third-party models at API list price" (Premium and up), "Priority model access at peak times" (Super and Ultra),
#   "Earliest access to all products & models" (Ultra: ai.early-access).
# - Coding agent and code completion: "You can use Agent, Chat, and Tab completions with Cursor models (Grok and
#   Composer), along with standard X." (Free, Pricing and plans), and x.ai/pricing's Plus card "Everything in Free, and:".
#   Tab "suggests code as you type" (Tab completion).
# - Models from several companies on Premium and up: "Free and Plus include only Cursor's first-party models (Grok 4.7,
#   Grok 4.6, Grok 4.5, and Composer 2.5). Premium and above, Teams, Enterprise, and the legacy Pro, Pro+, and Ultra plans
#   unlock third-party models, billed at API list price." (Available models: "other frontier models from OpenAI,
#   Anthropic, and Google"). Paid by use from prepaid credit, so its label says so.
# - Web search, reasoning and memory: x.ai/grok lists "Real-time web search", "Deep reasoning" and "Memory across
#   chats", and says "Free to try on the web and in the apps. Upgrade to SuperGrok for higher limits and multi-agent
#   reasoning.": only limits and multi-agent are a paid plan's. Voice: "Grok Chat, Voice, Imagine, and Build" (Plus's
#   card) and "You will still have access to Grok's free tier limits on Chat and Voice" (Grok's FAQ). Multi-agent isn't
#   listed: no page says which X Subscription plan has it (Premium has "The benefits of SuperGrok", its launch post).
# - Uses a computer for you, Premium and up: "Your Bots work from a persistent cloud computer with a browser, command
#   line, and filesystem." (Grok Bot docs) and "Grok Bot is included on Premium, Super, and Ultra plans." Cursor's own
#   browser use ("useful for testing frontend changes") is a coding tool's test browser, which the feature leaves out.
# - Scheduled tasks: "Scheduled automations are available to everyone" (Automations in Grok). Office apps: "Grok for
#   Excel is a free Microsoft 365 add-in." and "Grok for Google Workspace is a free add-on" (their launch posts).
# - Projects: Grok's FAQ names Projects as a grok.com feature (inferred: no page ties it to a plan); Cursor's Projects
#   coordinate agents.
# - Connects to: MCP servers and other apps ("Connectors are available to all Grok users", Connectors; "Bring Your Own
#   MCP", their launch post; Cursor's MCP integrations), code editors (Cursor is one; "Cursor CLI works with any IDE or
#   editor"), the command line (Cursor's CLI; Grok Build), and skills you make yourself ("Build new custom skills
#   through conversation", Skills in Grok; "Type /create-skill in chat", Cursor's Skills). No API use is included.
# - Chats kept on its servers: "Private chats and other content you ask us to delete are queued and removed within 30
#   days" (its terms).
# - None of these pages offers deep research as a mode, monthly API credits, or music and voice generation.
# - Developer: "Cursor uses the Open VSX extension registry for third-party extensions" and "Cursor publishes
#   first-party Anysphere replacements for some widely used extensions" (Extensions).
# - Social (X): "Premium checkmark" and "Edit posts" from Plus up (the table); "Ad-free scrolling" is "Some surfaces" on
#   Plus and "Most surfaces" from Premium, never everywhere, so ad free is false on every plan, with the perks. X uses
#   no open protocol (no page names one: an empty set). "Create longer posts" names no length, so no post length.
# General features, read 2026-11-13: platforms: Cursor for Mac, Windows and Linux (Download and install Cursor), Cursor
# for iOS ("The native app runs on iPhone and iPad"), Grok "on the web at grok.com and in the iOS and Android apps"
# (Grok's docs), and Cursor's agents on the web (cursor.com/agents). Sign-in: the shared sign-up page's "Sign up with
# X", "Sign up with Apple", "Sign up with Google", "Sign up with GitHub" and "Sign up with email" (its email step asks
# only for the address before more steps, unread, so only sso is listed). Support: "contact support while signed in"
# (Cursor's help) and its forum (cursor.com's "Forum"). App languages: cursor.com's language menu (English, 简体中文,
# 日本語, 繁體中文, Español, Français, Português, 한국어, Deutsch, हिन्दी); Cursor for iOS "is English only for now". No
# pause (cancel only); no parental controls (its terms ask parents of teenagers to monitor them, with no controls).
features:
  platforms: [windows, macos, linux, android, ios, web]
  account.sign-in: [sso]
  support.channels: [email, community]
  languages.interface: [en, fr, es, de, pt, ja, ko, zh, hi]

