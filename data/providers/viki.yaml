# Researched by hand on 2026-11-04 (M11.15, the streaming category, batch 2), read with Edge from Canada and through each
# country's exit (the owner's choice of 2026-11-04). Pages, each quoted where it's used:
# Pricing: viki.com/pass, which prices by where the visitor is: Canada's from Canada, the others through each
# country's exit, monthly and annual ("Save 17%"). Standard ("720p (HD)", "Stream on 1 device") and Plus ("1080p (Full
# HD)", "Stream on 4 devices", "Watch offline"), both "Ad-free streaming"; "All prices are subject to applicable
# taxes."
# Region checklist, 2026-11-04: 6. read through each country's exit: New Zealand's showed Australia's prices in
# Australian dollars, so New Zealand stays unread; on the UK's and the euro countries' pages the reader couldn't select
# Standard's card (its clicks were caught by another layer), so only Plus is priced there.

# Coverage: viki.standard in GB, IE, DE, FR, NL, ES and IT: their pages list Standard, but its card wouldn't open in
# the reader, so its prices there are unread (2026-11-04).

id: viki
name: Viki
website: https://www.viki.com
# Its help centre.
domains: [support.viki.com]
category: streaming
spendCategory: streaming
billingCurrency:
  {
    CA: CAD,
    US: USD,
    AU: AUD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
cancelUrl: https://support.viki.com/hc/articles/200138904
sources: { pricing: https://www.viki.com/pass }
# Accepted cards and ways to pay, read 2026-11-04 in its help centre ("How can I pay for Viki Pass and Rentals?"):
# cards on Viki.com, Apple Pay and Google Pay "only ... in select countries" (not named, so not listed), and Apple's,
# Google Play's and Roku's billing in its apps. Diners Club is in its list too.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, jcb, discover]
    url: https://support.viki.com/hc/articles/200138854
    quotes:
      - 'Debit Cards, Credit Cards, Prepaid Cards, and Gift Cards by Visa, MasterCard, American Express, JCB, Discover, and Diners Club'
paymentMethods:
  - methods: [card]
    page: 'How can I pay for Viki Pass and Rentals?'
    url: https://support.viki.com/hc/articles/200138854
    quotes:
      - 'Debit Cards, Credit Cards, Prepaid Cards, and Gift Cards by Visa, MasterCard, American Express, JCB, Discover, and Diners Club'
  - methods: [app-store]
    page: 'How can I pay for Viki Pass and Rentals?'
    url: https://support.viki.com/hc/articles/200138854
    quotes:
      - 'you can rent/subscribe via Apple, Google Play Store, or Roku Pay'

# Owner: Rakuten Group, Inc., in Tokyo: Viki, Inc. ("Rakuten Viki", San Mateo, California) is its subsidiary (its terms).
owner:
  name: 'Rakuten Group, Inc., through Viki, Inc.'
  page:
    name: Terms of use
    url: https://www.viki.com/legal/terms_of_use
  quotes:
    - 'We are a subsidiary of Rakuten Group, Inc., based in Tokyo, Japan'
  country:
    code: JP
  lastVerified: 2026-11-04

# Renewal day (M11.5), read 2026-11-04 in its help centre: the day you bought it recurs, as its example of the 1st says.
renewalAnchor:
  kind: same-date
  page: How Can I Upgrade, Downgrade or Manage My Subscription?
  url: https://support.viki.com/hc/articles/360000054748
  quotes:
    - "if you purchased a monthly Viki Pass plan on the 1st of the month, you'll continue to be billed on the 1st of each month."
  lastVerified: 2026-11-04

# General features, read 2026-11-11: app languages from its help centre and site language versions. No pause (its
# cancel article). Parental controls: PIN-locked content ratings (Content Restrictions on Viki).
features:
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh]

# Features, read 2026-11-04 on viki.com/pass (above): Plus's offline viewing names no number of devices, so 1
# (inferred). No profiles or Kids profiles (no one under 18 may use it), no live programmes, and no French audio named:
# its shows come with subtitles in many languages, which the French-content feature doesn't count.
# Free (2026-11-09, the owner's item: services used free, with ads or limits): its help centre's "Do I need to pay to
# watch on Viki?": "Viki is free! There's no need to pay to watch certain videos on Viki or the Viki apps." and "If you
# do not wish to pay a subscription, you can still watch certain content with ads and SD quality on our website or
# apps." No page says how many streams play at once without a pass, so it waits in core's awaitingRequiredFeatures.
