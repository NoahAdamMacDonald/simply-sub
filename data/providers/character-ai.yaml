# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 through a US exit: its Terms of Service
# (last updated August 27, 2025), which include its Community Guidelines (the conduct it forbids: no topic worse than
# the terms'); its Privacy Policy (effective July 1, 2026) with its Regional Privacy Disclosures and Cookie Policy; the
# Charms Terms of Use (its virtual currency: no topic worse than the terms'); its Safety Center pages; its help centre's
# billing, deletion, export, training and age-assurance articles; and its blog's Chapter 11 posts. The sign-up page's
# line: "By continuing, you agree with the Terms and Privacy Policy". Not read: the "Your Privacy Choices" page the
# Regional Privacy Disclosures send US residents to (no link in the text read).
policies:
  links:
    - name: Terms of service
      url: https://character.ai/tos
    - name: Privacy policy
      url: https://character.ai/privacy
    - name: Regional privacy disclosures
      url: https://character.ai/regional
    - name: Cancelling
      url: https://support.character.ai/hc/en-us/articles/17399592326555-How-do-I-manage-or-cancel-my-c-ai-subscription
    - name: (c.ai) lite FAQ
      url: https://support.character.ai/hc/en-us/articles/55388952900379--c-ai-lite-FAQ
    - name: Model training settings
      url: https://support.character.ai/hc/en-us/articles/42788047758747-How-do-I-manage-update-my-model-training-settings
    - name: Exporting your data
      url: https://support.character.ai/hc/en-us/articles/30299431702555-How-do-I-export-all-my-data-How-can-I-export-my-chats
    - name: Safety Center
      url: https://support.character.ai/hc/en-us/articles/21704914723995-Safety-Center
    - name: Age assurance data
      url: https://support.character.ai/hc/en-us/articles/51452660164379-What-happens-to-my-data-during-age-assurance
    - name: Verifying your age
      url: https://support.character.ai/hc/en-us/articles/43665577363739-How-do-I-verify-my-age
    - name: Chapter 11 update
      url: https://blog.character.ai/an-update-on-character-ai/
  ratings:
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel at any time, in your app store or through a link it emails you to its customer portal, and you keep your plan until the period ends.'
      sources:
        - url: https://support.character.ai/hc/en-us/articles/17399592326555-How-do-I-manage-or-cancel-my-c-ai-subscription
          quote: 'A secure link to your customer portal will be sent to the provided email address.'
        - url: https://support.character.ai/hc/en-us/articles/55388952900379--c-ai-lite-FAQ
          quote: 'Either way, your plan stays active through the end of your current billing period.'
      lastVerified: 2026-11-17
    - topic: billing.cancellation
      plans: [character-ai.lite]
      tier: poor
      reason: 'If you bought (c.ai) lite on the web, you cancel by sending a request to its support team. In the app, you cancel in your app store.'
      sources:
        - url: https://support.character.ai/hc/en-us/articles/55388952900379--c-ai-lite-FAQ
          quote: 'If you subscribed on the web (payments processed by Stripe), submit a request through our support page and select the "Payments and purchases" option'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'Payments are not refunded unless the law requires it, but you keep your plan to the end of the period you paid for.'
      sources:
        - url: https://character.ai/tos
          quote: 'Payments are non-refundable, except where required by law.'
        - url: https://support.character.ai/hc/en-us/articles/55388952900379--c-ai-lite-FAQ
          quote: 'Either way, your plan stays active through the end of your current billing period.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: great
      reason: 'It tells you at least 30 days before a price rise, which starts only at your next renewal, so you can cancel first.'
      sources:
        - url: https://character.ai/tos
          quote: 'If we increase our subscription prices, we will give you at least 30 days’ notice and any price increase will take effect on your next renewal so that you can cancel if you do not agree to the price increase.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      status: not-stated
      reason: 'Its terms and help centre don’t mention a free trial.'
      pages:
        - https://character.ai/tos
        - https://support.character.ai/hc/en-us/articles/55388952900379--c-ai-lite-FAQ
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say it charges you at each renewal until you cancel, but not that it reminds you first.'
      pages: [https://character.ai/tos]
      lastVerified: 2026-11-17
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms list no fees beyond the price and taxes.'
      pages: [https://character.ai/tos]
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its help centre says you can move from lite to c.ai+ through your app store, but not whether what you paid counts toward it.'
      pages:
        - https://support.character.ai/hc/en-us/articles/55388952900379--c-ai-lite-FAQ
        - https://character.ai/tos
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: poor
      reason: "Disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only by emailing within 30 days of agreeing to its terms."
      sources:
        - url: https://character.ai/tos
          quote: 'By agreeing to these Terms, you agree to resolve all disputes with us through binding individual arbitration.'
        - url: https://character.ai/tos
          quote: 'If you do not want to be bound by the Arbitration Agreement, you must notify Character.AI in writing by email to arbitration@character.ai within 30 days of the date you first agree to the Terms, stating that you do not want to resolve disputes with Character.AI by arbitration.'
      action:
        name: 'How to opt out of arbitration'
        url: https://character.ai/tos
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It posts new terms on its page, and big changes start 30 days later, so you can leave first. It doesn’t promise to tell you directly.'
      sources:
        - url: https://character.ai/tos
          quote: 'If we do this, we will post the changes on this page and will indicate at the top of this page the date these terms were last revised. Material changes will become effective no earlier than 30 days after they are posted, except that changes addressing new functions of the Services or changes made for legal reasons will be effective immediately.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: bad
      reason: 'It can suspend or close your account for any reason, without warning, and delete everything in it.'
      sources:
        - url: https://character.ai/tos
          quote: 'You agree that Character.AI, in its sole discretion, may suspend or terminate your account (or any part thereof) or use of the Services and remove and discard any content within the Services, for any reason, including, without limitation, for lack of use or if Character.AI believes that you have violated or acted inconsistently with the letter or spirit of these Terms.'
        - url: https://character.ai/tos
          quote: 'You agree that any termination of your access to the Services under any provision of these Terms may be effected without prior notice'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: bad
      reason: 'You keep what you post, but give it a licence forever, which it can sell and pass on to companies it works with, and which lasts after your account closes.'
      sources:
        - url: https://character.ai/tos
          quote: 'You grant Character.AI, to the fullest extent permitted under the law, a nonexclusive, worldwide, royalty-free, fully paid up, transferable, sublicensable, perpetual, irrevocable license to copy, display, upload, perform, distribute, transmit, make available, store, modify, exploit, commercialize and otherwise use the content for any Character.AI-related purpose'
        - url: https://character.ai/tos
          quote: 'You agree that these rights and licenses also include a right for Character.AI to make the content available to, and pass these rights along to, others with whom we have contractual relationships'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: poor
      reason: 'You own what the Characters write for you, but it keeps a licence forever to use and sell it for any purpose.'
      sources:
        - url: https://character.ai/tos
          quote: 'then as between you and Character.AI, you own that Generated Content.'
        - url: https://character.ai/tos
          quote: 'perpetual, irrevocable license to copy, display, upload, perform, distribute, transmit, make available, store, access, modify, exploit, commercialize and otherwise use the Character and all Generated Content for any purpose'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change paid features or stop the service at any time without notice, and takes no responsibility for it.'
      sources:
        - url: https://character.ai/tos
          quote: 'Please note the features and functionality of our paid Services are often dynamic and may be subject to change at any time without prior notice.'
        - url: https://character.ai/tos
          quote: 'Character.AI may also in its sole discretion and at any time discontinue providing the Services, or any part thereof, with or without notice.'
      lastVerified: 2026-11-17
    - topic: legal.inactivity
      tier: poor
      reason: 'It can close accounts that are not used for "an extended period", without saying how long or promising a warning.'
      sources:
        - url: https://character.ai/tos
          quote: 'You acknowledge that Character.AI reserves the right to terminate accounts that are inactive for an extended period of time.'
      lastVerified: 2026-11-17
    - topic: legal.licence
      tier: poor
      reason: 'Its terms forbid taking its apps apart without the usual “unless the law allows it”, and any use they don’t name is forbidden.'
      sources:
        - url: https://character.ai/tos
          quote: '(ix) reverse engineer, disassemble, decompile, decode, adapt, or otherwise attempt to derive or gain access to any Services source code, in whole or in part (unless a portion of code within the Services is released as open source and the open source license governing such code expressly permits reverse engineering, copying or other modification).'
        - url: https://character.ai/tos
          quote: 'Any use of the Services or content on the Services other than as specifically authorized herein is strictly prohibited.'
      lastVerified: 2026-11-17
    - topic: service.software-control
      status: not-stated
      reason: 'Its terms don’t say whether its apps update themselves or change anything else on your device.'
      pages: [https://character.ai/tos]
      lastVerified: 2026-11-17
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its terms make you responsible for your password and account, but don’t say whether you may share it.'
      pages: [https://character.ai/tos]
      lastVerified: 2026-11-17
    - topic: security.practices
      status: not-stated
      reason: 'Its terms, privacy pages and help centre name no audit, certification or way to report a security problem.'
      pages:
        - https://character.ai/tos
        - https://character.ai/privacy
        - https://support.character.ai/hc/en-us/articles/21704914723995-Safety-Center
      lastVerified: 2026-11-17
    - topic: privacy.data-collection
      tier: poor
      reason: 'It and its analytics partners track how you use it, and draw conclusions about your interests. You can only manage cookies, browser by browser and where your laws allow.'
      sources:
        - url: https://character.ai/privacy
          quote: 'Generate and analyze inferences about use of the Services, such as your preferences and interests and trends about our Services'
        - url: https://character.ai/privacy
          quote: 'Depending on where you live and the options available on your device or browser, you may have the ability to manage the cookies in use.'
      action:
        name: 'Its cookie policy'
        url: https://character.ai/cookies
      lastVerified: 2026-11-17
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It gives your data to advertising companies for targeted ads, which US law counts as selling it. You can say no only where your laws give you that right, or through cookie settings.'
      sources:
        - url: https://character.ai/privacy
          quote: 'We may disclose personal information to advertising and analytics providers in connection with the provision of tailored advertising'
        - url: https://character.ai/regional
          quote: 'While these disclosures may be considered sales under certain state laws, we do not sell personal information for monetary consideration, and Character.AI is not a data broker.'
      action:
        name: 'Its cookie policy'
        url: https://character.ai/cookies
      lastVerified: 2026-11-17
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'The free plan and lite show ads, and it tracks you to tailor them. You can only turn tracking down through cookie settings or where your laws allow.'
      sources:
        - url: https://character.ai/privacy
          quote: 'Provide advertising and recruit new users, including provision of tailored advertising;'
        - url: https://character.ai/privacy
          quote: 'Depending on where you live and the options available on your device or browser, you may have the ability to manage the cookies in use.'
      action:
        name: 'Its cookie policy'
        url: https://character.ai/cookies
      lastVerified: 2026-11-17
    - topic: privacy.ai-training
      tier: bad
      reason: 'What you write to Characters trains its AI. Only people in Europe and the UK can turn that off.'
      sources:
        - url: https://support.character.ai/hc/en-us/articles/42788047758747-How-do-I-manage-update-my-model-training-settings
          quote: 'As we explain in our Privacy Policy, we retain certain data that you share with us to help train and improve our AI models.'
        - url: https://support.character.ai/hc/en-us/articles/42788047758747-How-do-I-manage-update-my-model-training-settings
          quote: 'If you are in the European Economic Area (“EEA”) or the United Kingdom (“UK”), and you would like to opt out of us using your chat content to train our generative AI models, you can follow the steps below.'
      lastVerified: 2026-11-17
    - topic: privacy.ai-training
      regions: [EU, GB]
      tier: neutral
      reason: 'What you write trains its AI unless you turn off “Improve the Model for Everyone” in settings, which applies to what you send afterwards.'
      sources:
        - url: https://support.character.ai/hc/en-us/articles/42788047758747-How-do-I-manage-update-my-model-training-settings
          quote: 'Once you opt out, new content will not be used to train our generative AI models.'
      action:
        name: 'How to turn off model training'
