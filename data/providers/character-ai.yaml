    - topic: privacy.sign-up-data
      tier: bad
      reason: 'You sign up with an email address and your birthday, and most people are then asked for a selfie (or an ID if that fails) to check their age. A partner handles it and deletes it within 7 days.'
      sources:
        - url: https://support.character.ai/hc/en-us/articles/21704914723995-Safety-Center
          quote: 'To create an account, you can sign up on the web or mobile using an email address and birthday.'
        - url: https://support.character.ai/hc/en-us/articles/43665577363739-How-do-I-verify-my-age
          quote: 'The age assurance pop-up should show up for most users; just click the link when you see it.'
        - url: https://support.character.ai/hc/en-us/articles/51452660164379-What-happens-to-my-data-during-age-assurance
          quote: 'Most users will only need to complete a selfie — no ID required. A government-issued ID is only requested as a final step if Persona is unable to confirm your age from the selfie alone.'
      lastVerified: 2026-11-17
    - topic: privacy.children
      tier: bad
      reason: 'Teens from 13 (16 in Europe) can use it, and in some places it may show them targeted ads. Parents can get a weekly activity summary if the teen invites them.'
      sources:
        - url: https://character.ai/regional
          quote: 'In some jurisdictions, we may provide targeted advertising to minors over the age of 13, which may include disclosures to third parties that are considered “sales” in some jurisdictions.'
        - url: https://support.character.ai/hc/en-us/articles/21704914723995-Safety-Center
          quote: 'Users must be at least 13 years old (at least 16 years old in Europe).'
      lastVerified: 2026-11-17
