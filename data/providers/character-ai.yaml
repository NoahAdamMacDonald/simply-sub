# Researched by hand on 2026-11-17 (the full catalog run, AI batch 1). character.ai shows this machine's Edge and the
# Mullvad Browser Cloudflare's security check, so its pages were read 2026-11-17 through a US exit (its subscribe page
# through each research country's exit too); its help centre through its Zendesk API (a plain fetch of its HTML gets
# the same check), its blog and Apple's App Store pages with a plain fetch. Pages, each quoted where it's used:
# What it is: "Character.AI empowers people to connect, learn, and tell stories through interactive entertainment."
# (About), with a Feed, followers and shared Characters ("Be a part of an expansive community."), so its plans are in
# `social` too (notes.md).
# Pricing: character.ai/subscribe, which reads signed out: tabs for "(c.ai) lite" and "(c.ai+)", each with its own
# periods ("Weekly" and "Monthly" for lite, "Monthly" and "Yearly" for c.ai+): "$4.99 per month", "$2.49 per week",
# "$9.99 per month" and "$94.99 per year" ("$119.88" struck through, twelve monthly payments), each "Subscription
# auto-renews". The same prices, in a bare "$", through exits in Canada, the US, the UK, Ireland, Germany, France, the
# Netherlands, Spain, Italy, Australia and New Zealand; the page's own product data names US dollars ("priceCurrency":
# "USD", read through a Canadian exit) and its blog says "(c.ai) lite lets you do that at $4.99 USD/month or $2.49
# USD/week, with pricing varying by region." So one US-dollar list for everyone on the web (GLOBAL), as Perplexity's.
# "We price by region so (c.ai) lite is affordable in local markets. The price shown to you at checkout is the price
# you'll pay." ((c.ai) lite FAQ): the checkout needs an account, so a local web price can't be read. Its apps' prices
# are Apple's and Google's, by storefront ("Character.AI+ $12.99" and "$129.99" on the Canadian App Store page): a way
# to pay, not listed (notes.md). No page says a price includes tax ("we’ll charge tax when required", its terms).
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang; 2. no picker; 3. the page's product data names
# USD ("Character.AI Plus (Annual)", 94.99); 4. the checkout asks you to sign in; 5. its help centre has no prices
# article; 6. a Canadian exit (this machine is refused): the same "$" prices; 7. no bill offered.
# Not listed: Charms, its virtual currency ("Charms are our in-app virtual currency that you can use to unlock access to
# special features.", Charms FAQ), sold in packs: one-time purchases, not a subscription.
# Bundles: none on its pages. Official resellers: none; no page names a shop that sells it.
# Chapter 11: "Today, we’re sharing that Character.ai has initiated a voluntary Chapter 11 bankruptcy process to
# facilitate a court-supervised sale of the company." (its blog, Oct 12, 2026), with a sale hearing on December 3 and 4,
# 2026 and Disney as the stalking-horse buyer of some assets (its Transaction Notice): the owner may change (notes.md).

id: character-ai
name: Character.AI
aliases: [c.ai, character ai]
website: https://character.ai
domains: [support.character.ai, blog.character.ai]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help centre's cancelling article, for the web and the app stores.
cancelUrl: https://support.character.ai/hc/en-us/articles/17399592326555-How-do-I-manage-or-cancel-my-c-ai-subscription
sources: { pricing: https://character.ai/subscribe }

# Ways to pay (M11.5), read 2026-11-17: its apps bill through Apple and Google (its terms). On the web, "payments
# processed by Stripe" ((c.ai) lite FAQ) names no way to pay, so no card entry and no acceptedNetworks.
paymentMethods:
  - methods: [app-store]
    page: 'Terms of Service'
    url: https://character.ai/tos
    quotes:
      - "If you purchased your subscription from an mobile app store, you'll need to cancel your subscription and submit a request for a refund through the Apple App Store or Google Play using the links below:"

# Owner (M11.2), read 2026-11-17 on its About page: the company that operates it, in Delaware. Private: no page names a
# listing.
owner:
  name: 'Character Technologies, Inc.'
  page:
    name: About Character.AI
    url: https://character.ai/about
  quotes:
    - 'This site is operated by Character Technologies Inc. dba Character.ai, registered in the Delaware Department of State, Division of Corporations Commercial Register under registration number 6360997.'
  country:
    code: US
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its terms charge "on each agreed-upon periodic renewal until you cancel", and its
# help centre says nothing more: no day.
renewalAnchor:
  kind: not-stated
  pages:
    - https://character.ai/tos
    - https://support.character.ai/hc/en-us/articles/17399592326555-How-do-I-manage-or-cancel-my-c-ai-subscription
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on its subscribe page ("All the good stuff", each plan's card) and the (c.ai) lite FAQ:
# "(c.ai) lite gives you a daily amount of premium chat style messages with fewer ads, and better memory. (c.ai+) gives
# you unlimited premium chat style chats, zero ads, the full memory suite, chat customization, early access to new
# features, and bonus Charms with every pack purchase."; "(c.ai) lite includes 30 memory pins (up from 15 on free), a
# detailed usage view, and chat customization."
perks:
  - id: premium-styles-daily
    name: Try top models daily
  - id: premium-styles-unlimited
    name: Unlimited top models
  - id: better-memory
    name: Better memory
  - id: best-memory
    name: Best memory
  - id: chat-customization
    name: Chat customization
  - id: less-slow-mode
    name: Less slow mode when things get busy
  - id: bonus-charms
    name: Bonus Charms with every pack purchase

# AI features (the AI category's registry), read 2026-11-17 in its help centre, its About page and its subscribe page:
# - Voice on every plan: "Through Character Calls, users can now have seamless two way conversations and talk with
#   Characters in the same way one would have a phone call." and "Character Calls is now available on web for all
#   users." (Character Calls & Voice FAQ).
# - Music and voice generation on every plan: Character Voice's "A creative AI tool where users can create their own
#   Voices by uploading an audio sample." and "Character Voice is available to all users, free of charge."
# - Image and video generation on every plan: "Your past images and videos are saved, and you keep creating more with
#   your Characters using Imagine Chat." and "Continue creating Characters, scenes, videos, and voices." (Important
#   Changes for Teens, for every under-18 user, all on the free plan's tools: "Many of our tools like AvatarFX and
#   Imagine Chat, are still available to under-18 users."); Charms buy "Imagine additional chat images or chats."
# - Memory on every plan: the subscribe page's "Memory" row ("Basic", "Better", "Best") and "Pins" ("15", "30", "30").
# - Custom assistants on every plan: Characters you create ("When you create an automated AI character ("Character")
#   using the Services in accordance with these Terms, then as between you and Character.AI, you own all rights in that
#   Character.", its terms).
# - Early access on c.ai+: "early access to new features" (the (c.ai) lite FAQ's list for c.ai+); lite's "Feature
#   access" row says "Some new", c.ai+'s "Priority".
# - Chats kept on its servers: "Your past chats are saved"; "Identifiers and Your content you submit for as long as your
#   account remains active." (Regional Privacy Disclosures).
# - None of its pages offers web search, reasoning models, projects, a choice of other companies' models (it serves its
#   own "Chat Styles", PipSqueak 3, DeepSqueak and the like), a coding agent, a browser agent, scheduled tasks, an API
#   ("We don't currently have an API.", Is there an API?) or office apps.
# Ads (ad free, required in social): the subscribe page's "Ads" row, "Full" on Free, "Less" on lite, "None" on c.ai+
# ("No ads"). Open protocol (required in social): none; its pages name no federation.
# General features, read 2026-11-17: the web and its apps ("Character.AI mobile app is now available for download on iOS
# and Android!"). Sign-in: "Continue with Google", "Continue with Apple" and an "Email Verification Link (a passwordless
# "magic link" sent directly to your inbox)" (Does Character.AI use passwords?). App languages: its App Store page's
# list ("English, Bulgarian, Croatian, Czech, Dutch, Finnish, French, German, Greek, Hindi, Hungarian, Indonesian,
# Italian, Japanese, Korean, Lithuanian, Polish, Portuguese, Romanian, Russian, Simplified Chinese, Spanish, Swedish,
# Thai, Traditional Chinese, Turkish, Ukrainian, Vietnamese"), the registry's values among them; no page of its own
# lists them. Support: its help centre's request form. No pause. Parental controls: none: its Parental Insights is a
# weekly report a teen chooses to share ("The new Parental Insights feature provides parents and guardians access to a
# summary of their teen’s activity on the platform."; "This does not include a user’s chat content."), not a limit a
# parent sets; the under-18 experience is set by age ("Users verified as under 18 are placed in the Under-18
# experience, which includes reading mode.", What is Reading Mode?) (notes.md).
features:
  platforms: [android, ios, web]
  account.sign-in: [email-code, sso]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, hi]
  support.channels: [email]

