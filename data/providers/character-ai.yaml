    - topic: privacy.content-access
      tier: bad
      reason: 'It may read, review and change your content at any time and for any reason, including to develop its service, and you can’t turn that off.'
      sources:
        - url: https://character.ai/tos
          quote: 'While we’re not required to do so, we may access, review, screen, edit, modify and delete your content at any time and for any reason, including to provide and develop the Services or if we think the content violates these Terms or any applicable laws.'
      lastVerified: 2026-11-17
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your chats while your account is open and deletes them when you delete it, but keeps other data as long as it needs, and a popular Character you made can stay.'
      sources:
        - url: https://character.ai/regional
          quote: 'Following deletion of your account, all chats and activity associated with your account will be deleted, unless continued retention is required for legal, security or dispute-resolution purposes;'
        - url: https://character.ai/privacy
          quote: 'We keep your information for the time necessary for the purposes for which it is processed or as otherwise described at the time the information is collected, unless a shorter retention period is required by law.'
        - url: https://character.ai/privacy
          quote: 'If a Character you create has been made available to other users, then we reserve the right to preserve that Character’s characteristics and to keep that Character active on the Services, even if you otherwise delete your data and your account.'
      lastVerified: 2026-11-17
