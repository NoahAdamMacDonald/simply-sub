id: rds
name: RDS
aliases: [réseau des sports, rds direct]
website: https://www.rds.ca
category: streaming
spendCategory: streaming
# Accepted cards, read 2026-10-28 (M9.2): none named, so no acceptedNetworks. The FAQ (/aide/faq/) and /abonnement/
# name none, and payment details are in Bell Media's Account Management portal, behind a sign-in.
billingCurrency: { CA: CAD }
# rds.ca/aide/faq/#hors-canada-abonnement, read 2026-10-26: "En raison de droits de diffusion stricts, RDS n'est pas
# disponible pour abonnement ou visionnement à l'extérieur du Canada."
availableIn: [CA]
# The FAQ's steps for a direct subscription: sign in, then cancel from the account's subscriptions.
cancelUrl: https://www.rds.ca/aide/faq/#annuler-abonnement
sources: { pricing: https://www.rds.ca/abonnement/ }
# Owner (M11.2), read 2026-11-02: no about page says so; its conditions do (“offered to you by Bell Media Inc. and its
# affiliates”).
# Ways to pay (M11.5), read 2026-11-02 in its terms (in French): a card, or through an in-app purchase; and 2026-11-03
# (the owner's tasks) in its FAQ: a TV or mobile provider's bill, Bell's too. No page names the card networks.
paymentMethods:
  - methods: [card, app-store]
    page: 'Conditions (in French)'
    url: https://www.rds.ca/conditions
    quotes:
      - 'fournir des renseignements sur le mode de paiement, tels que votre numéro de carte de crédit'
      - 'une plateforme d’achat intégré'
  - methods: [provider-billing]
    page: 'FAQ (in French)'
    url: https://www.rds.ca/aide/faq/
    quotes:
      - 'Où obtenir du soutien pour un abonnement facturé par Bell ?'
      - "Puis-je obtenir un forfait via mon fournisseur télé, mobile ou un fournisseur tiers d'achats intégrés ?"
owner:
  name: Bell Media Inc.
  website: https://www.bellmedia.ca
  page:
    name: Conditions (in French)
    url: https://www.rds.ca/conditions
  quotes:
    - 'qui vous est offert par Bell Média inc. et ses sociétés affiliées (collectivement, « Bell Média »)'
  country:
    code: CA
    page:
      name: 'About Bell Media'
      url: https://www.bellmedia.ca/about-us/
    quotes:
      - 'Bell Media is Canada’s leading media and entertainment company with premier assets in video, audio, out-of-home advertising, and digital media.'
    lastVerified: 2026-11-03
  lastVerified: 2026-11-02
notes: >-
  Plans renew for the period chosen, except in Quebec, where they renew monthly. Select Montreal Canadiens
  regular-season games only, with regional blackouts.

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their
# words.
perks:
  - id: live-sport-hours
    name: Over 4,000 hours of live sport a year

# Read 2026-10-26 on rds.ca/abonnement (Mensuel, 3 mois and Annuel tabs): one plan, French-language sports. Two
# streams at a time (rds.ca/aide/faq/#plusieurs-appareils). RDS's bundles with Crave and TSN are in data/bundles.
# Read 2026-11-02 (M11.4, the required streaming features): neither rds.ca/abonnement nor the FAQ says
# anything of ads or video quality. Its live channels carry their broadcasts, so not ad free, inferred (the guide's
# §2.2 rule 5: a required boolean no page states is false); the video quality waits for M11.9
# (awaitingRequiredFeatures in core).
# Renewal day (M11.5), read 2026-11-03 (M11.9) in its terms (6(b)), Bell Media's as Crave's and TSN's: charged at the start
# of each billing period, which moves only when the subscription began on a date a month doesn't have.
renewalAnchor:
  kind: same-date
  page: 'Conditions (in French)'
  url: https://www.rds.ca/conditions
  quotes:
    - "Dans certains cas, la date d'un frais récurrent peut changer, par exemple si votre mode de paiement n'est pas réglé comme prévu ou si votre abonnement a commencé à une date non comprise dans un mois donné."
  lastVerified: 2026-11-03

# Free use (2026-11-09, the owner's item: services used free, with ads or limits): none: its subscribe page sells its
# plan only.
freeUse:
  kind: none
  pages: [https://www.rds.ca/abonnement/]
  lastVerified: 2026-11-09

# General features, read 2026-11-11: rds.ca is in French only. No pause (Comment annuler mon abonnement direct à RDS
# ?) and no parental controls (its FAQ has none; Bell Media's terms only say it may offer such tools).
# Apps and sign-in (M11.9, the cross-category features), read 2026-11-03 on its subscribe page ("Regardez sur vos appareils
# préférés"): TVs and streaming devices, RDS.ca on computers, Android, and iPhone and iPad, with no consoles; a Bell
# Media account's password (its FAQ); a phone line and chat (rds.ca/aide/contactez-nous: "Appelez le 1-833-RDS-AIDE",
# "Chat: Cliquez pour ouvrir").
features:
  platforms: [web, ios, android, tv]
  account.sign-in: [password]
  support.channels: [phone, chat]
  languages.interface: [fr]

# Official resellers: none listed (M11.9, read 2026-11-03; the owner's choice that day: noted, not listed). Its FAQ asks
# « Puis-je obtenir un forfait via mon fournisseur télé, mobile ou un fournisseur tiers d'achats intégrés ? »: TV and
# mobile providers and app stores bill it on their own services, as Crave's FAQ says of Bell Media's other services.
# Downloads and profiles (M11.9, the owner's item 3), read 2026-11-03: its FAQ (rds.ca/aide/faq) covers its app,
# streams and devices but names no downloads or profiles, so none (inferred). Reread 2026-11-04 for the profile count
# (M11.15): still none.
plans:
  - id: rds.standard
    name: RDS
    link: https://www.rds.ca/abonnement/
    features:
      ad-free: false
      streaming.live: [tv-channels, sports]
      streaming.concurrent-streams: 2
      streaming.french-content: true
      streaming.content: [sports]
    perks: [live-sport-hours]
    prices:
      - region: CA
        currency: CAD
        amount: 24.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://www.rds.ca/abonnement/
      - region: CA
        currency: CAD
        amount: 64.99
        interval: month
        intervalCount: 3
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://www.rds.ca/abonnement/
      - region: CA
        currency: CAD
        amount: 199.90
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://www.rds.ca/abonnement/

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: RDS's conditions, in French, and Bell's page on how
# it collects and uses data. Not rated: price and terms changes and closing accounts (its conditions don't say),
# data collection and deletion, free trials, account sharing and device limits.
# Every agreement a user accepts (the owner's rule, 2026-11-03), read that day: its conditions include « exigences
# techniques » and « exigences de sécurité de contenu » set out in its FAQ, which no FAQ page names as such, and a
# subscription through a TV provider (a « distributeur autorisé ») adds that provider's terms, not read. The
# subscribe form comes after signing in: not read.
policies:
  shared: [bell-privacy]
  links:
    - name: 'Conditions (in French)'
      url: https://www.rds.ca/conditions
    - name: 'Aide : annulation et remboursements (in French)'
      url: https://www.rds.ca/aide/faq/
  ratings:
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel online in your account at any time, in a few steps, and keep watching until the end of the time you paid for.'
      sources:
        - url: https://www.rds.ca/aide/faq/
          quote: "Faites défiler vers le bas et sélectionnez Annuler l'abonnement."
        - url: https://www.rds.ca/conditions
          quote: 'Suite à toute annulation, vous conserverez l’accès au service jusqu’à la fin de votre période de facturation en cours, après quoi votre abonnement prendra fin.'
      lastVerified: 2026-11-03
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back, but you keep watching until the end of the time you paid for.'
      sources:
        - url: https://www.rds.ca/conditions
          quote: 'Les frais d’abonnement ne sont pas remboursables.'
        - url: https://www.rds.ca/conditions
          quote: 'Suite à toute annulation, vous conserverez l’accès au service jusqu’à la fin de votre période de facturation en cours, après quoi votre abonnement prendra fin.'
      lastVerified: 2026-11-03
    - topic: legal.disputes
      tier: bad
      reason: 'Unless you live in Quebec, Ontario, Saskatchewan, Alberta or BC, a private referee (an arbitrator) in your city decides any disagreement instead of a court, and you give up your right to a trial.'
      sources:
        - url: https://www.rds.ca/conditions
          quote: 'Le présent article ne s’applique pas aux résidents des provinces de Québec, d’Ontario, de la Saskatchewan, d’Alberta et de la Colombie-Britannique.'
        - url: https://www.rds.ca/conditions
          quote: 'par voie d’arbitrage exécutoire dans votre ville de résidence'
        - url: https://www.rds.ca/conditions
          quote: 'Vous renoncez expressément au droit de règlement d’un différend par quelque autre moyen, y compris, notamment par un procès.'
      lastVerified: 2026-11-03
    # M11.9's topics, pulled forward at the owner's request (2026-11-02), read that day.
    - topic: privacy.sign-up-data
      tier: poor
      reason: 'To sign up you must give it your phone number as well as an email address and payment details.'
      sources:
        - url: https://www.rds.ca/conditions
          quote: 'Pendant le processus d’inscription pour un compte avec nous, il vous sera demandé de fournir une adresse courriel et un numéro de téléphone, de choisir un mot de passe, de fournir des renseignements sur le mode de paiement, tels que votre numéro de carte de crédit et votre adresse de facturation, ainsi que d’autres renseignements.'
      lastVerified: 2026-11-02
    - topic: privacy.children
      tier: neutral
      reason: 'You must be an adult to subscribe, and it may give you parental controls, but its terms make you responsible for what kids watch and say nothing about their data.'
      sources:
        - url: https://www.rds.ca/conditions
          quote: 'Vous devez avoir atteint l’âge de la majorité dans la province ou le territoire canadien où vous résidez pour vous abonner, vous inscrire, d’accéder au service ou l’utiliser autrement.'
        - url: https://www.rds.ca/conditions
          quote: 'Nous pouvons vous offrir des outils pour vous aider à contrôler le contenu que peut visualiser un mineur au moyen de votre compte enregistré, comme le contrôle parental.'
      lastVerified: 2026-11-02
    - topic: billing.price-changes
      tier: neutral
      reason: 'It can change the price at any time. It posts the change at least 30 days ahead and tells you, but promises that 30 days’ notice only where a law requires it (Quebec does).'
      sources:
        - url: https://www.rds.ca/conditions
          quote: 'nous nous réservons le droit, à notre seule et absolue appréciation, de modifier tout ou partie des présentes conditions, du service et de votre abonnement, y compris les frais d’abonnement, à tout moment'
        - url: https://www.rds.ca/conditions
          quote: 'Lorsque la législation l’exige, cet avis sera envoyé au moins trente (30) jours avant la prise d’effet de la modification'
      lastVerified: 2026-11-02
    - topic: billing.free-trials
      status: not-stated
      reason: 'Its terms (in French) describe promotions such as gift codes, but no free trial.'
      pages: [https://www.rds.ca/conditions]
      lastVerified: 2026-11-02
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms (in French) say yearly plans renew on their own, but not that it reminds you first.'
      pages: [https://www.rds.ca/conditions]
      lastVerified: 2026-11-02
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms (in French) list no fees beyond the price and taxes.'
      pages: [https://www.rds.ca/conditions]
      lastVerified: 2026-11-02
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It posts changes to its terms at least 30 days ahead and tells you about them, but promises that 30 days’ notice only where a law requires it.'
      sources:
        - url: https://www.rds.ca/conditions
          quote: 'Nous afficherons les modifications apportées aux présentes conditions au moins trente (30) jours avant leur prise d’effet'
        - url: https://www.rds.ca/conditions
          quote: 'Lorsque la législation l’exige, cet avis sera envoyé au moins trente (30) jours avant la prise d’effet de la modification'
      lastVerified: 2026-11-02
    - topic: legal.account-closure
      tier: poor
      reason: 'It can end your subscription for any reason with 30 days’ notice (60 in Quebec), and its terms don’t promise money back.'
      sources:
        - url: https://www.rds.ca/conditions
          quote: 'Bell Média peut annuler votre abonnement au service moyennant un préavis écrit d’au moins trente (30) jours (soixante (60) jours si vous êtes un résident du Québec).'
      lastVerified: 2026-11-02
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change the service and what your plan includes at any time, and says it owes you nothing when it does.'
      sources:
        - url: https://www.rds.ca/conditions
          quote: 'nous nous réservons le droit, à notre seule et absolue appréciation, de modifier tout ou partie des présentes conditions, du service et de votre abonnement, y compris les frais d’abonnement, à tout moment'
      lastVerified: 2026-11-02
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms (in French) don’t say it closes accounts you haven’t used.'
      pages: [https://www.rds.ca/conditions]
      lastVerified: 2026-11-02
    - topic: security.practices
      status: not-stated
      reason: 'Its terms (in French) say nothing about outside security checks or how to report a security problem, and neither does Bell’s privacy policy.'
      pages: [https://www.rds.ca/conditions]
      lastVerified: 2026-11-02
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its terms (in French) make you responsible for anyone who uses your account, but don’t say who that can be.'
      pages: [https://www.rds.ca/conditions]
      lastVerified: 2026-11-02
    - topic: service.device-limits
      tier: neutral
      reason: 'It can limit how many shows you download, on how many devices, and for how long you can watch them.'
      sources:
        - url: https://www.rds.ca/conditions
          quote: "Par exemple, ces limitations peuvent inclure des restrictions sur le nombre de titres hors ligne par compte, le nombre maximal d'appareils pouvant contenir des titres hors ligne"
      lastVerified: 2026-11-02
