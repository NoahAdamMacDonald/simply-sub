# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2), read with Edge from Canada: ideogram.ai's pages
# showed a headless Edge Cloudflare's check and read in a visible (headed) Edge, with no check to click: its pricing
# page (each FAQ answer opened), Terms of Service, Privacy Policy, About, launch post and careers link; its help site
# (docs.ideogram.ai, read headless: plans and credits, billing and subscriptions with each billing article, sign-in,
# account settings, the app tour, images, models, video, apps, batch, MCP, editing, Studio, text and layers, upscale,
# download, share and publish, characters, the API, FAQ, files and limits, support and company pages); the pricing page
# again through a UK exit. Pages, each quoted where it's used:
# Pricing: ideogram.ai/pricing's FAQ "On monthly billing, Plus costs $20 per month. On yearly billing, Plus costs $15
# per month, $180 billed annually." and "On monthly billing, Pro costs $60 per month. On yearly billing, Pro costs $42
# per month, $504 billed annually.", and "Prices are in US dollars and exclude tax." (the same through a UK exit): one
# US-dollar price list for everyone, GLOBAL. Its help site's Plans and Credits gives the same ("Prices are in US
# dollars, before tax.") and the free plan's "30 a week". No price includes tax ("No, prices exclude tax.").
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang; 2. no country or currency picker; 3. the page's
# text names US dollars; 4. checkout needs an account; 5. its tax article ("Ideogram adds VAT, GST or sales tax where
# the law requires it, based on your billing address."); 6. headed Edge from Canada and through a UK exit, the same US
# dollars; 7. no bill offered.
# Its individual plans: Free, Plus and Pro, monthly or yearly. Not listed: Team ("Team plans need at least 2 users."),
# Enterprise and Enterprise Prepaid (business); pay-as-you-go credits ("1¢/credit") and the hosted API (usage-billed);
# self-hosted model licences; the legacy Basic plan ("Ideogram no longer sells the Basic plan ($8/month or $7/month
# billed yearly).", never in the catalog, so no retired entry). Its iOS app sells Plus and Pro through Apple: a way to
# pay, not other prices.
# Bundles: none on its pages. Official resellers: none; no page names a shop that sells it.

id: ideogram
name: Ideogram
aliases: [ideogram.ai]
website: https://ideogram.ai
domains: [docs.ideogram.ai]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help site's Cancelling Your Subscription: "You can cancel your Ideogram subscription at any time from the billing
# portal."
cancelUrl: https://docs.ideogram.ai/plans-and-billing/billing-and-subscriptions/cancelling-your-subscription
sources: { pricing: https://ideogram.ai/pricing/ }

# Ways to pay (M11.5), read 2026-11-17: cards through Stripe (its pricing FAQ: "PayPal and other digital wallets are
# not available at this time.") and Apple's billing in its iOS app.
paymentMethods:
  - methods: [card]
    page: 'Pricing (What payment methods do you support?)'
    url: https://ideogram.ai/pricing/
    quotes:
      - 'We process all payments through Stripe, which accepts credit or debit cards issued by networks like Mastercard, VISA, or American Express.'
  - methods: [app-store]
    page: 'Billing & Subscriptions'
    url: https://docs.ideogram.ai/plans-and-billing/billing-and-subscriptions
    quotes:
      - 'If you subscribed through the iOS app, manage the subscription in the App Store instead.'
acceptedNetworks:
  GLOBAL:
    networks: [mastercard, visa, amex]
    url: https://ideogram.ai/pricing/
    quotes:
      - 'We process all payments through Stripe, which accepts credit or debit cards issued by networks like Mastercard, VISA, or American Express.'

# Owner (M11.2), read 2026-11-17: its terms name Ideogram AI as the company that runs it; its About page says it's
# headquartered in Toronto, with its mailing address there. No page names a parent or a listing. Country: no page of its
# own names Canada or Ontario, only Toronto and "ON" in its address, which core's namesCountry doesn't read yet
# (notes.md: this is the draft's one validation error).
owner:
  name: 'Ideogram AI'
  page:
    name: Terms of service
    url: https://ideogram.ai/legal/tos/
  quotes:
    - 'and the related mobile applications (the “App”) operated on behalf of Ideogram AI (“Company”, “we” or “us”).'
  country:
    code: CA
    page:
      name: About Ideogram
      url: https://ideogram.ai/features/about/
    quotes:
      - 'Ideogram is headquartered in Toronto and operates an office in San Francisco.'
      - 'You can write to Ideogram AI at 320 Bay St, Suite 700, Toronto, ON M5H 4A6.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its terms charge "at the start of each new subscription period" and its Renewals
# and Billing Cycles article shows the date in your account ("The plan card shows Renews on and the date."); neither says
# which day it is. Only the yearly plans' monthly credit refresh is tied to the start date.
renewalAnchor:
  kind: not-stated
  pages:
    - https://ideogram.ai/legal/tos/
    - https://docs.ideogram.ai/plans-and-billing/billing-and-subscriptions/renewals-and-billing-cycles
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on its pricing cards and Plans and Credits: usage (never features) and the private
# generation no registry feature describes.
perks:
  - id: weekly-free-credits
    name: 30 credits a week (Google or Apple sign-up)
  - id: unlimited-slow-credits
    name: Unlimited slow credits
  - id: private-generation
    name: Private generation
  - id: quality-export
    name: Quality export
  - id: larger-queue
    name: Larger generation queue
  - id: largest-queue
    name: The largest generation queue
  - id: batch-generation
    name: Batch Generation

# AI and creative features, read 2026-11-17, on every plan unless named:
# - Sold as an AI service ("Ideogram (pronounced "eye-dee-oh-gram") is an AI company on a mission to help people become
#   more creative.", Company), so its plans are in ai with ai.assistant, and in creative (notes.md).
# - Image generation on every plan ("Every plan, free included, can use Auto and all Ideogram models."); video on the
#   paid plans ("Video is a premium app."), whose models include MiniMax H3 at "480p, 768p, 2K, 4K" (Create Videos):
#   4K export.
# - Models from other companies on every plan: "The Image app also runs models from other providers." (Models): GPT
#   Image and Nano Banana are premium ("Premium models need a paid plan or bought credits"), Z-Image and P-Image-Ideogram
#   free.
# - Monthly credits that pay for its API on the paid plans: "Personal	Your monthly plan credits when they cover the
#   whole request." (Ideogram API), so `api` and ai.api-credits; the free plan's credits are weekly. Its MCP server
#   lets other assistants use Ideogram ("Ideogram's MCP server lets an AI assistant work in your Ideogram account."),
#   the other way round from the registry's `mcp` (Ideogram reaching MCP servers): not set (notes.md).
# - Creative tools: photo editing (Precise Edit, Remove Backgrounds and Objects, Upscale), graphic design (Studio's text
#   layers, logos: "Studio: edit an image with tools and layers.") and vector illustration ("Ideogram Vector creates
#   scalable, editable SVG artwork from a prompt or an existing image."), each paid in credits, which the free plan has.
# - Generative credits a month on the paid plans: "2,400 priority credits/mo." and "7,500 priority credits/mo." The free
#   plan's 30 a week is a perk.
# - Kept on its servers: your Library of generations.
# - No watermark: not stated (its terms forbid removing "any watermarks included on any User Output"; no page says
#   which plans add one), so left out. Its videos' generated sound is part of the clip, not music or voice
#   generation. None of its pages offers web search, voice, memory, projects, reasoning, a coding agent or office apps.
# General features, read 2026-11-17: "Use Ideogram in the web app, the iOS app, or through the Ideogram API." Sign-in:
# "Continue with Google", "Continue with Apple", "Continue with Microsoft", SSO, and "Continue with email, with an email
# address and password." Support: "Email support@ideogram.ai." and its Discord server. No app languages listed, no pause
# and no parental controls on its pages.
features:
  platforms: [web, ios]
  account.sign-in: [password, sso]
  support.channels: [email, community]

