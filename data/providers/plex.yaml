# Terms and policies (BLUEPRINT §4.10), read 2026-11-11 with a plain fetch and Edge: its Terms of Service ("Revised
# October 30, 2025"), which include its Subscriptions, Purchases, and Rentals terms ("Revised February 03, 2025") and its
# Privacy Policy ("Revised: May 6, 2026"); its Code of Conduct ("Updated: October 19, 2026"), for reviews and discussions;
# its Privacy Request Center (preferences.plex.tv, where its policy sends access, deletion and opt-out requests); its
# Opt-Out Options for Third-Party Advertising and Tracking Technologies pages; the sign-up form (its iframe's text: an
# email and a password, or Google or Apple), whose line says "By signing up or continuing to use Plex you confirm that
# you've read and accept the Terms of Service and Privacy Policy"; and its help centre's billing, Plex Home, downloads,
# sign-in and bug bounty articles. Not read: the checkout (it needs an account), the app stores' terms, and the separate
# Apple versions of its terms and privacy policy (plex.tv/about/plex-terms-of-service-apple/). Its terms give Plex a
# transferable, sub-licensable licence over what you post, and over a public profile's watch history, reviews, name and
# avatar for marketing (legal.content-rights isn't a streaming topic); its terms also forbid reverse engineering its
# apps (legal.licence is for software, not streaming). Calibrated against CBC Gem, Rumble and Paramount+.
policies:
  links:
    - name: 'Terms of service'
      url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
    - name: 'Subscriptions, purchases and rentals terms'
      url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
    - name: 'Privacy policy'
      url: https://www.plex.tv/about/privacy-legal/
    - name: 'Privacy request center'
      url: https://preferences.plex.tv/privacy
    - name: 'Opt-out options for third-party advertising'
      url: https://www.plex.tv/about/privacy-legal/opt-out-options-for-third-party-advertising/
    - name: 'Code of conduct'
      url: https://www.plex.tv/about/code-of-conduct/
    - name: 'Sign up'
      url: https://www.plex.tv/sign-up/
    - name: 'Plans'
      url: https://www.plex.tv/plans/
    - name: 'Plex subscription management'
      url: https://support.plex.tv/articles/201580107-plex-subscription-management/
    - name: 'Upgrading Plex subscriptions'
      url: https://support.plex.tv/articles/upgrading-subscriptions/
    - name: 'Sales tax information'
      url: https://support.plex.tv/articles/sales-tax-information/
    - name: 'Use Google or Apple to sign in'
      url: https://support.plex.tv/articles/use-federated-authentication-to-sign-in/
    - name: 'Reporting security issues (bug bounty)'
      url: https://support.plex.tv/articles/reporting-security-issues/
    - name: 'What is Plex Home?'
      url: https://support.plex.tv/articles/203815766-what-is-plex-home/
    - name: 'Downloads FAQ'
      url: https://support.plex.tv/articles/downloads-sync-faq/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you watch and do in its apps, linked to your account. You can stop your own server sending crash reports and some playback data, but not the rest.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Plex collects specific information about your activity on our Services and that information is linked to you.'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'If you uncheck this button, the Optional Playback Data listed below will not be collected or sent to Plex.'
      action:
        name: 'Limit what your server sends to Plex'
        url: https://www.plex.tv/about/privacy-legal/#you-have-the-right-to-limit-what-activity-data-is-sent-from-your-plex-media-server
      lastVerified: 2026-11-11
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It sells or shares your data with advertisers, to show you ads on Plex and on other sites. You can stop that only by sending a request through its privacy request centre.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'This “sharing” or “sale” is used to deliver relevant ads to you on Plex and other third-party sites and services.'
        - url: https://preferences.plex.tv/privacy
          quote: 'Opt-out of the sale and/or sharing of your personal information.'
      action:
        name: 'Opt out in its privacy request centre'
        url: https://preferences.plex.tv/privacy
      lastVerified: 2026-11-11
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its free films and live TV show ads chosen from what you do. You can limit that by request, or one device and browser at a time with your phone’s settings and industry opt-out tools.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'To personalize marketing, advertising, recommendations, and other content and experiences delivered or offered to you through the Services (as permitted by applicable law)'
        - url: https://www.plex.tv/about/privacy-legal/opt-out-options-for-third-party-advertising/
          quote: 'On your mobile device, you may also go to your device settings and select “Limit Ad Tracking” (for iOS devices) or “Opt out of interest-based ads” (for Android devices), which will allow you to limit our use of information collected from or about your mobile device (such as precise location data) for the purposes of serving online behavioral advertising to you.'
      action:
        name: 'Opt-out options for third-party advertising'
        url: https://www.plex.tv/about/privacy-legal/opt-out-options-for-third-party-advertising/
      lastVerified: 2026-11-11
    - topic: privacy.ai-training
      tier: great
      reason: 'It says your personal data never goes into AI models. It may train them only on what you do in its apps once that’s cut off from you.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Your Personal Data is not introduced to any machine learning or artificial learning models.'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Plex may also disassociate this activity information from your Personal Data to train machine learning or artificial learning models'
      lastVerified: 2026-11-11
    - topic: privacy.data-retention
      tier: good
      reason: 'It keeps your account data while you have the account and deletes it within 30 days after you delete it. Logs of how you use Plex go after 90 days.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Personal Data is retained in your Plex account for as long as you maintain that account.'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'we delete the Personal Data in the Plex account within 30 days.'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Data related to your use of the services (e.g., logging and error tracking) is deleted after 90 days.'
      lastVerified: 2026-11-11
    - topic: privacy.data-deletion
      tier: good
      reason: 'You can ask it to delete your data through its privacy request centre, which deletes your account too. It deletes the account’s data within 30 days, keeping only copies the law requires.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'After verifying your identity, Plex will delete Personal Data associated with your account except that we may retain archived copies as required by law.'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'we delete the Personal Data in the Plex account within 30 days.'
      action:
        name: 'Ask Plex to delete your data'
        url: https://preferences.plex.tv/privacy
      lastVerified: 2026-11-11
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask for a copy of your account data through its privacy request centre, and it sends it once it has checked who you are. It doesn’t say in what format.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'After verifying your identity, Plex will provide you with a copy of Personal Data associated with your account.'
        - url: https://preferences.plex.tv/privacy
          quote: 'Request a copy of all of your account data and email it to your desired recipient.'
      action:
        name: 'Ask for a copy of your data'
        url: https://preferences.plex.tv/privacy
      lastVerified: 2026-11-11
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It gives your data to authorities when a law, a legal process or a valid government request needs it, and to protect people or its rights. It doesn’t say it tells you or publish a report.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: '(a) satisfy an applicable law, regulation, legal process, or valid governmental request;'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: '(b) protect or defend the safety, rights, or property of Plex, the public, or any person.'
      lastVerified: 2026-11-11
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data is handled mostly in the United States. Data from the EU, the UK and Switzerland moves there under standard contract rules.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Plex and its authorized data processors process Personal Data primarily in the United States.'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Data transfer mechanisms such as Standard Contractual Clauses for data transfers of EU/UK/Switzerland Personal Data to processors located in the United States.'
      lastVerified: 2026-11-11
    - topic: privacy.sign-up-data
      tier: good
      reason: 'An account needs only an email address and a password, or your Google or Apple sign-in, and Apple’s Hide My Email works. A paid plan adds your payment details.'
      sources:
        - url: https://www.plex.tv/sign-up/
          quote: 'Email address'
        - url: https://www.plex.tv/sign-up/
          quote: 'Create password'
        - url: https://support.plex.tv/articles/use-federated-authentication-to-sign-in/
          quote: 'if you choose the Hide My Email option from Apple, then Plex will not know what the real email address is'
      lastVerified: 2026-11-11
    - topic: privacy.children
      tier: good
      reason: 'Under-18s may use Plex only through a parent’s account. Children’s managed accounts get no tracking or targeted ads (its free films still have ads), and parents choose what ratings they can see.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
          quote: 'Individuals under the age of eighteen (18) (or the applicable age of majority) may utilize the Plex Solution only with the involvement and acceptance of (this TOS by) a parent or legal guardian and then solely as an Authorized User under a parent or legal guardian’s account.'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Plex does not conduct behavioral tracking or deliver targeted advertising to users of managed accounts.'
        - url: https://www.plex.tv/about/privacy-legal/
          quote: 'Content access is restricted based on content ratings as configured by the parent or guardian.'
      lastVerified: 2026-11-11
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online at any time and keep your plan to the end of the time you paid for, but you must cancel at least a day before it renews.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'You can cancel at any time with such cancellation effective upon expiration of the then-current Subscription period.'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'To cancel, please visit this page and make a cancellation request at least one (1) day prior to the end of your then-current Subscription period.'
        - url: https://support.plex.tv/articles/201580107-plex-subscription-management/
          quote: 'You will retain access to the subscription features and benefits for the remainder of your current subscription period.'
      action:
        name: 'How to cancel a Plex subscription'
        url: https://support.plex.tv/articles/201580107-plex-subscription-management/
      lastVerified: 2026-11-11
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back when you cancel, but you keep your plan to the end of the time you paid for. In the EU and the UK you can cancel an order within 14 days of buying it by contacting its billing team.'
      sources:
        - url: https://support.plex.tv/articles/201580107-plex-subscription-management/
          quote: 'Cancelling a subscription only cancels future renewal, it does not provide any refund for an existing subscription transaction.'
        - url: https://support.plex.tv/articles/201580107-plex-subscription-management/
          quote: 'You will retain access to the subscription features and benefits for the remainder of your current subscription period.'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'For individuals in the EU or UK, orders may be canceled within 14 days from the date of purchase by contacting our Billing team'
      lastVerified: 2026-11-11
    - topic: billing.price-changes
      tier: good
      reason: 'It tells you at least 30 days before your price goes up, and you can cancel before then.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'If the price of your Subscription changes, we will provide you with at least thirty (30) days’ prior notice.'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'You can cancel at any time with such cancellation effective upon expiration of the then-current Subscription period.'
      lastVerified: 2026-11-11
    - topic: billing.free-trials
      tier: poor
      reason: 'Remote Watch Pass starts with 14 free days. You give a way to pay to start, and it charges you when the trial ends unless you cancel first; it doesn’t promise to remind you.'
      sources:
        - url: https://www.plex.tv/plans/
          quote: 'Try 14 days free'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'Some Subscriptions may start with a free trial period. To avoid any charges following the trial period, you must cancel the Subscription (see below) before the expiration of the free trial period.'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'To enroll in a Subscription, you must provide a current, valid, accepted method of payment (“Payment Method”).'
      lastVerified: 2026-11-11
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say a plan renews on its own for the same length, monthly, yearly or every 5 years, and that it warns you of changes, but not that it reminds you before renewing.'
      pages:
        - https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
        - https://support.plex.tv/articles/201580107-plex-subscription-management/
      lastVerified: 2026-11-11
    - topic: billing.fees
      tier: good
      reason: 'You pay the price plus any sales tax. Your card company may add its own fees, such as for paying in another currency, and if a payment fails you may owe Plex’s costs of collecting it.'
      sources:
        - url: https://support.plex.tv/articles/sales-tax-information/
          quote: 'The advertised prices for Plex Pass subscriptions as well as other transactions do not include sales tax.'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'In addition to any fee(s) for a Subscription, you are responsible for any charges (including any foreign transaction charges) that may be imposed by credit card providers or other third parties in connection with your use of or payment for the Subscription.'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'Should charges for which you are responsible fail at the time payment is required, you may be responsible for costs associated with Plex’s efforts to collect amounts due in accordance with applicable laws.'
      lastVerified: 2026-11-11
    - topic: billing.plan-changes
      tier: poor
      reason: 'Its help says moving up to Plex Pass credits your unused time, but its terms say switching plans earns no refund or credit. You can’t move down: you cancel and start again once your plan runs out.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'No refunds or credits shall be issued for partial months, upgrade/downgrades, nonuse, or termination of account due to Subscription and Rental Terms violations.'
        - url: https://support.plex.tv/articles/upgrading-subscriptions/
          quote: 'When doing so, they will automatically receive a prorated credit for any paid subscription time remaining in the current Remote Watch Pass subscription.'
        - url: https://support.plex.tv/articles/upgrading-subscriptions/
          quote: 'It is not currently possible to directly “downgrade” a subscription.'
      lastVerified: 2026-11-11
    - topic: legal.disputes
      tier: good
      reason: 'There’s no private referee (an arbitrator): after 90 days of trying to settle a dispute, it goes to the courts in Delaware, in the US. You give up a jury where the law allows it.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
          quote: 'Subject to the foregoing informal dispute resolution, any action arising from or in any way related to the Plex Solution, your use of or access to the Plex Solution, or this TOS will be brought in the courts presiding in the state of Delaware, and all parties to this TOS expressly agree to be subject to the jurisdiction of such courts.'
        - url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
          quote: 'You and Plex waive trial by jury except where such waiver is prohibited by law.'
      lastVerified: 2026-11-11
    - topic: legal.terms-changes
      tier: poor
      reason: 'It can change its terms by posting them online or by emailing you, and using Plex afterwards counts as accepting them. It promises no warning ahead of time.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
          quote: 'Please note that Plex reserves the right to change the terms and conditions of this TOS and the terms and conditions under which the Plex Solution and its offerings are extended to you by posting online a revised TOS or e-mailing notice thereof to you.'
        - url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
          quote: 'Your continued use of the Plex Solution following any addition, modification, or deletion will be conclusively deemed acceptance of any change to the terms and conditions of this TOS.'
      lastVerified: 2026-11-11
    - topic: legal.account-closure
      tier: neutral
      reason: 'If you break its rules, it can suspend or delete your account, and you get no refund for time left. It emails you about a moderation decision, which you can appeal once.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
          quote: 'If you violate this TOS, Plex has sole discretion to suspend or permanently disable your access to the Plex Solution, and we may permanently disable or delete your account or prohibit you from creating a new account.'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'No refunds or credits shall be issued for partial months, upgrade/downgrades, nonuse, or termination of account due to Subscription and Rental Terms violations.'
        - url: https://www.plex.tv/about/code-of-conduct/
          quote: 'If your content is removed from Plex or we take another moderation action related to your Plex account, you will be notified via email.'
      lastVerified: 2026-11-11
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or remove any feature, and a film you buy from it can stop playing if its licence ends, with Plex not liable to you.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
          quote: 'In addition, Plex may add, modify, or delete any aspect, program, functionality, or feature of the Plex Solution.'
        - url: https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
          quote: 'In such instance, Plex will not be liable to you if a Purchase becomes unavailable for further playback.'
      lastVerified: 2026-11-11
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages:
        - https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
        - https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
      lastVerified: 2026-11-11
    - topic: security.practices
      tier: neutral
      reason: 'It runs a bug bounty that invites security researchers to find flaws, but doesn’t say outside experts audit its security or publish what they find.'
      sources:
        - url: https://support.plex.tv/articles/reporting-security-issues/
          quote: 'We invite security researchers of all backgrounds to help us find and fix vulnerabilities before they can be exploited.'
      lastVerified: 2026-11-11
    - topic: service.account-sharing
      tier: good
      reason: 'You may let your immediate family use your account, and its Plex Home is for people who live together. It names no checks.'
      sources:
        - url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
          quote: 'Subject to any third party license restrictions for applicable Content, you may enable members of your immediate family, for whom you will be responsible (each, an “Authorized User(s)”), to access and use the Plex Solution so long as all such use remains in compliance with this TOS.'
        - url: https://support.plex.tv/articles/203815766-what-is-plex-home/
          quote: 'The Plex Home feature is intended for people that physically live together.'
      lastVerified: 2026-11-11
    - topic: service.device-limits
      status: not-stated
      reason: 'Its terms and downloads help name no limit on devices or on how long downloads last.'
      pages:
