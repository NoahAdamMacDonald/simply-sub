# Researched by hand on 2026-11-11 (M11.15, streaming batch 6), read with Edge from Canada, each other country's prices
# through that country's exit, and its help centre and legal pages with a plain fetch. Pages, each quoted where it's used:
# Pricing: its plans page (plex.tv/plans), whose two cards price by where the visitor is, each in its own currency's code:
# Canada's "$3.99 / CAD / Month" (Remote Watch Pass, "$39.99 / CAD / Year" yearly) and "$8.99 / CAD / Month" (Plex Pass,
# "$89.99 / CAD / Year", "$349.99 / CAD / 5 Years", "Billed every 5 years. Cancel anytime."); through a US exit $2.99 and
# $29.99, $6.99, $69.99 and $249.99 USD; a UK exit £2.99 and £22.99, £4.99, £49.99 and £189.99 GBP; Irish, German, French,
# Dutch, Spanish and Italian exits all €2,99 and €27,99, €5,99, €59,99 and €229,99 EUR; an Australian exit $4.00 and
# $45.00, $11.00, $110.00 and $390.00 AUD; three New Zealand exits (Cloudflare's trace placed one in "NZ") US dollars, the
# US's prices. No page says its prices include tax ("The advertised prices for Plex Pass subscriptions as well as other
# transactions do not include sales tax", its US sales tax article). Every price is the regular one; the Remote Watch
# Pass's 14 free days are a trial. Not listed: Plex Pass for life, "Billed once" ($1,079.99 CAD, $749.99 USD, £579.99,
# €689,99, $1,190.00 AUD), a purchase beside the subscriptions (the owner's rule: noted, not listed); movie rentals and
# purchases (one film at a time, "available only to users located in the United States and Canada", purchases the US's
# only); and the old mobile apps' one-time unlock, which a Remote Watch Pass replaced.
# Region checklist, 2026-11-11: 1. its pages' hreflang (/en-ca/, /en-gb/, /en-au/, /de/, /fr/…) translate the page but
# its prices follow the visitor; 2. no currency picker; 3. its page fills the prices by script (no prices in its HTML);
# 4. checkout not opened (it needs an account); 5. its US sales tax article; 6. Edge read every country; 7. no bill offered.
# Bundles: none found (its plans page, help centre and a search). Official resellers: none; it sells no gift cards ("We
# do not currently offer the ability to “gift” a Remote Watch Pass subscription", its plans FAQ). Apple's App Store,
# Google Play, Amazon's Appstore and Roku bill subscriptions bought in their apps: noted as ways to pay, not resellers.
# Features, read 2026-11-11: its plans page's comparison table (ticks are images: read from its screenshots) and its
# help centre. Plex plays your own media from a Plex Media Server you run ("Plex Media Server is a software application
# that allows you to organize and stream your media collection from a central location", its plans FAQ), and streams its
# own free, ad-supported films, shows and "600+ channels" of live TV to everyone. Free plays your own videos on your home
# network only; "To stream remotely from any server you have access to, you’ll need a Remote Watch Pass or a Plex Pass"
# (its plans FAQ). A Remote Watch Pass "does not give access to any of the other features or benefits of a regular Plex
# Pass subscription". No plan removes the ads on Plex's own films and live TV: the table's "Ad-free streaming for Plex
# on-demand and Plex Live TV" is "Not Available" for all three, and "having a Plex Pass will not remove ads or reduce
# their frequency" (its free films FAQ), while "Your personal media collection ... will continue to stream to all of your
# devices ad-free" (its live TV FAQ): ad-free is false on every plan, with a note.
# Video quality: "Yes, “4K” content is supported, depending on what model Roku player you have" (Is 4K content supported
# on the Roku?): your own media plays at its own quality, up to 4K; no page states the quality of Plex's free films.
# Streams: no page gives a number: your server's processor and upload speed limit them, and its owner can set "the
# maximum number of streams that are allowed simultaneously for any particular user, when they’re streaming remotely"
# (Server Settings – Bandwidth and Transcoding Limits), so unlimited (inferred).
# Downloads: Plex Pass only ("The Downloads feature requires an active Plex Pass subscription"), of your own media, not
# of Plex's free films; no number of devices, so 1 (inferred).
# Profiles: "Free Plex accounts may have up to 14 managed users total in your Home (15 total users including the Home
# Admin account)" (What is Plex Home?), so 15 on every plan. Kids profiles and parental controls on every plan: "You can
# create a managed user for your child and apply one of the preset profiles to control what type of content the child’s
# account can access. Plex Pass subscribers can further customize the restrictions" (its free films FAQ, 2025), and the
# Parental Controls article's "Younger Kid" profile. The plans table ticks "Enable parental controls to keep things
# kid-friendly" for Plex Pass alone: those are the custom restrictions; the help centre's preset profiles decide.
# What it streams: "free movies, documentaries, and TV content" (Movies & Shows Overview), "a wide assortment of
# channels—from kids shows, anime, sports, movies, and more" (its live TV FAQ) and "action, sports, kids stuff, cooking,
# news, and more streaming 24/7" (its free live TV page). Its live TV is channels, not live games: tv-channels only. Plex
# Pass's recording of over-the-air TV from your own antenna and tuner is a perk.
# No HDR: only "HDR to SDR tone mapping" for Plex Pass, which converts HDR for screens that can't show it; no page says it
# plays HDR. No pause: its subscription management article offers only cancelling renewal.
# Free use: the Free plan ("The basic functionality of Plex is completely free, which includes local playback of personal
# content from your Plex Media Server, as well as our ad-supported on demand and Live TV (from Plex)", Plex: Free vs Paid).

id: plex
name: Plex
website: https://www.plex.tv
category: streaming
spendCategory: streaming
