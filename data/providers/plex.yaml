  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    AU: AUD,
    NZ: USD,
    GLOBAL: USD,
  }
# Its help centre's article on managing, upgrading and cancelling a subscription billed by Plex (the account's
# Subscriptions page is behind a sign-in).
cancelUrl: https://support.plex.tv/articles/201580107-plex-subscription-management/
sources: { pricing: https://www.plex.tv/plans/ }
# Owner (M11.2), read 2026-11-11: its terms name Plex GmbH and its affiliates, including Plex, Inc.; its about page names
# no company. Private: no shares listed.
owner:
  name: 'Plex (Plex GmbH and its affiliates, including Plex, Inc.)'
  page:
    name: Terms of service
    url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
  quotes:
    - 'Plex GmbH and its affiliates, including Plex, Inc., a Delaware company, (together, “Plex”) is willing to license and permit use of the Plex Solution subject at all times to agreement with this TOS.'
  country:
    code: US
    page:
      name: Terms of service
      url: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
    quotes:
      - 'Additionally, Plex’s headquarters are located in the United States.'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11
# Ways to pay (M11.5), read 2026-11-11: a card or PayPal for what Plex bills (its subscription management article), and
# the app stores for what's bought in its apps (its App Store, Google Play and Amazon articles; Roku's channel bills a
# monthly Plex Pass too, "billed through Roku", in words the check doesn't take for an app store). No page names the card
# networks, so no acceptedNetworks; Braintree processes its payments.
paymentMethods:
  - methods: [card, paypal]
    page: Plex Subscription Management
    url: https://support.plex.tv/articles/201580107-plex-subscription-management/
    quotes:
      - 'That would let you update an existing credit card, switch to a different card, or choose to use PayPal.'
  - methods: [app-store]
    page: Purchasing a Plex Subscription Through the App Store/iTunes
    url: https://support.plex.tv/articles/205976358-purchasing-a-plex-pass-subscription-through-itunes/
    quotes:
      - 'This subscription is billed through the App Store/iTunes and can be managed from your iOS device or from your computer.'
  - methods: [app-store]
    page: Purchasing a Plex Pass Subscription Through Google Play
    url: https://support.plex.tv/articles/217563477-purchasing-a-plex-pass-subscription-through-google-play/
    quotes:
      - 'This subscription is billed through Google Play and can be managed from your Google Play account.'
  - methods: [app-store]
    page: Purchasing a Plex Pass Subscription Through Amazon
    url: https://support.plex.tv/articles/218171737-purchasing-a-plex-pass-subscription-through-amazon/
    quotes:
      - 'if downloaded from the Amazon Appstore. This subscription is billed through Amazon and can be managed from your Amazon account.'
# Renewal day (M11.5): its Subscriptions, Purchases, and Rentals terms renew "on or about the date the then-current
# recurring Subscription period expires", which says no day, and its help centre doesn't either.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.plex.tv/about/privacy-legal/subscriptions-and-rentals/
    - https://support.plex.tv/articles/201580107-plex-subscription-management/
  lastVerified: 2026-11-11

# General features, read 2026-11-11. Platforms: "Browsers: Chrome, Edge, Firefox, and Safari", "Mobile Apps: Android,
# iOS", "Desktop/Laptop computers: macOS, Windows, Linux", "Smart TVs: LG, Samsung, Hisense, VIZIO, and Roku TV",
# streaming devices and "Gaming Consoles: PlayStation and Xbox" (What is Plex?). Sign-in: an email and password, "Using
# your Google account", "Using your Apple account" (Use Google or Apple to Sign in with Plex) and two-factor codes from
# "Any app that uses the standard TOTP protocol" (Secure Your Account with Two-Factor Authentication). Support: a contact
# form for billing ("Billing Issues & Questions") and its community forums; "We’re unable to offer technical support by
# email" (plex.tv/contact). App languages: plex.tv's language versions (its hreflang: English, Chinese, Dutch, French,
# German, Hindi, Japanese, Korean, Portuguese, Russian, Spanish, Swedish), those the registry has. Self-hostable: you run
# its Plex Media Server yourself ("Install and run the Plex Media Server on a computer (or compatible NAS device or NVIDIA
# SHIELD) where all your media is stored", What is Plex?). Its code is closed (its terms forbid decompiling it), so
# software.open-source is left out.
features:
  platforms: [web, windows, macos, linux, android, ios, tv, console]
  account.sign-in: [password, totp, sso]
  support.channels: [email, community]
  languages.interface: [en, fr, es, de, pt, ja, ko, zh, hi]
  software.self-hostable: true

# Perks (M11.6): what the passes add that no feature describes, in its comparison table's words.
perks:
  - id: remote-streaming
    name: Stream media on any device, from anywhere in the world
  - id: server-remote-streaming
    name: Others can stream remotely from your server for free
  - id: skip-intro-credits
    name: Skip intro (personal media only) and credits
  - id: hardware-transcoding
    name: Convert videos and stream to more devices at once
  - id: dvr
    name: Record HD broadcast content to your library
  - id: plexamp-premium
    name: Access members-only features within the Plexamp app
  - id: partner-discounts
    name: Get exclusive access to promos and partner discounts

