# Researched by hand on 2026-11-11 (M11.15, the music category, part 5), read with Edge from Canada (siriusxm.com prices
# in US dollars whoever reads it, and serves only the US: below). Pages, each quoted where it's used:
# Pricing: its plans page (siriusxm.com/plans: All Music, All Access, SiriusXM Sports Pass, All Access (App Only)) and
# More Plans (siriusxm.com/plans/more), all monthly. Regular prices only: "$1 for 3 months then $11.99/mo." is $11.99,
# "1 month Free then $5/mo." is $5. All Music's add-ons are its help article's "Add Sports for $8 per month", "Add Talk
# for $5 per month" and "Add News for $5 per month" ("Add-ons are not sold without the All Music plan").
# Its renewal article says "some plans let you elect to be billed on a monthly, quarterly, semi-annually, or longer
# basis", but no page prices a longer period, so only the months are listed. "Applicable tax and other fees may apply":
# its U.S. Music Royalty Fee "is included in the advertised prices you see" (U.S. Music Royalty Fee), and the "$15
# Activation Fee applies to inactive radios" (More Plans) once.
# Region checklist, 2026-11-11: 1. no country paths; 2. no picker; 3. not needed: it sells only in the US; 4. checkout not
# opened; 5. its payment help names the networks; 6. Edge read every page; 7. no bill offered.
# Not listed: A La Carte, A La Carte Gold and SiriusXM All-In-One, which need particular old radios ("Requires an A La
# Carte-capable Sirius radio", "This plan requires a MiRGE SXMIR1 Radio"); the Student Streaming Platinum plan (students
# only); the Lifetime plan ("no longer for sale").
# Bundles: none on its plans pages; the T-Mobile offer (its help) is a phone carrier's perk, for telecom. Official
# resellers: none named; radios sold in shops come with trials, not plans.
# Features, read 2026-11-11: every plan is live channels, in the car by satellite and in the app ("All our popular plans
# include streaming with the SiriusXM app"), except All Access (App Only), "Listen on your phone and other smart
# devices". Only its shows download ("How long can I keep downloaded shows on my device?"), so no offline music; its
# app "uses variable bit rates" (Why does the audio quality vary when I stream?), with no bitrate on any page (Tom's
# Guide's review says SiriusXM doesn't publish one), so audio quality waits (core's awaitingRequiredFeatures). Only All
# Music is all music, "ad-free"; the other plans add talk, news and sports, which the pages don't call ad-free. What
# each plan adds is a perk, in its card's words.
# Coverage: "SiriusXM provides service in the 50 United States, the District of Columbia, and Puerto Rico. If you
# reside in Canada, SiriusXM service is available through SiriusXM Canada Inc." (Can I get SiriusXM streaming service
# outside of the United States?): Canada is siriusxm-canada's.
id: siriusxm
name: SiriusXM
website: https://www.siriusxm.com
category: music
spendCategory: streaming
availableIn: [US]
billingCurrency: { US: USD }
cancelUrl: https://www.siriusxm.com/help/manage-or-cancel-service
sources: { pricing: https://www.siriusxm.com/plans }
# Owner (M11.2), read 2026-11-11: its Customer Agreement is with Sirius XM Radio LLC, which Sirius XM Holdings' annual
# report (10-K, on its investor site) calls "our wholly owned subsidiary"; the listing from its investor site. No page
# read names a majority holder (the 10-K leaves holders to the proxy statement, not read).
owner:
  name: Sirius XM Radio LLC (SiriusXM)
  page:
    name: Annual report on Form 10-K for 2025 (Sirius XM Holdings)
    url: https://investor.siriusxm.com/sec-filings/all-sec-filings/content/0000908937-26-000006/0000908937-26-000006.pdf
  quotes:
    - 'On September 6, 2024, Sirius XM Radio LLC, our wholly owned subsidiary, converted from a Delaware corporation to a Delaware limited liability company.'
  country:
