  US:
    networks: [mastercard, visa, amex, discover, other, unionpay, jcb]
    url: https://www.siriusxm.com/help/payment-and-billing-options
    quotes:
      - 'SiriusXM accepts a variety of credit cards, including MasterCard, Visa, American Express, Discover, Diner’s Club, China Union Pay, and JCB credit cards, as well as all debit cards.'
