# The policies block for the US provider `siriusxm` (Sirius XM Radio LLC), to go after everything else in
# data/providers/siriusxm.yaml. Every rating is for every plan; notes.md suggests one more for siriusxm.platinum (its
# free trial needs no card).
#
# Terms and policies, read 2026-11-11 (M11.15, the music category) in Edge: its Customer Agreement ("Last Updated: June
# 5, 2025"), the offer details on its plans, more plans and free trial pages, its U.S. Music Royalty Fee page, its help
# centre's articles on cancelling, automatic renewal, trials, payment, changing plans, downloads, account login and
# registration, and privacy rights, its account registration form and the app-only plan's first sign-up step (an email
# and a password; its next steps show only after an email is entered, so they stay unread), and the Sirius XM Privacy
# Policy, rated once as a shared document (data/policies/siriusxm-privacy.yaml). The sign-up pages link only the Privacy
# Policy, and their offer details the Customer Agreement. Its Website Terms of Use (siriusxm.com/sxm-web-terms-of-use,
# "Effective: January 19, 2018", in Sirius XM Radio Inc.'s name) also send disputes to arbitration, with no opt-out, and
# change when posted; the Customer Agreement, which covers the Site too, "supersedes any previous agreements" and
# replaces "any prior arbitration agreement", so they change no grade. Not rated: rights over your content, its apps'
# licence and changes to your device (not topics for music; the agreement's software updates "cannot be disabled by
# you"). Calibrated against Pandora's, Spotify's and Amazon Music's grades.
policies:
  shared: [siriusxm-privacy]
  links:
    - name: 'Customer Agreement'
      url: https://www.siriusxm.com/customer-agreement
    - name: 'Try SiriusXM for free'
      url: https://www.siriusxm.com/free-trial
    - name: 'U.S. Music Royalty Fee'
      url: https://www.siriusxm.com/us-music-royalty
    - name: 'How do I manage or cancel my service?'
      url: https://www.siriusxm.com/help/manage-or-cancel-service
    - name: 'How long can I keep downloaded shows on my device?'
      url: https://www.siriusxm.com/help/downloaded-shows
    - name: 'Register your account'
      url: https://care.siriusxm.com/phx-wc/account/registration
    - name: 'Sirius XM Privacy Policy'
      url: https://www.siriusxm.com/privacy-policy
  ratings:
    - topic: privacy.sign-up-data
      tier: poor
      reason: 'Registering your account online asks for your name, email, phone number and ZIP code. The app-only plan’s sign-up starts with an email and a password.'
      sources:
        - url: https://care.siriusxm.com/phx-wc/account/registration
          quote: 'Last Name'
        - url: https://care.siriusxm.com/phx-wc/account/registration
          quote: 'Phone Number'
        - url: https://care.siriusxm.com/phx-wc/account/registration
          quote: 'Zip Code'
      lastVerified: 2026-11-11
    - topic: privacy.children
      tier: good
      reason: 'Only adults can sign up, and it doesn’t sell, or use for targeted ads, the data of anyone it knows is under 18.'
      sources:
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'You must be at least 18 years old to purchase a Subscription.'
        - url: https://www.siriusxm.com/privacy-policy
          quote: 'SiriusXM audio services users must be 18 and older to sign up.'
        - url: https://www.siriusxm.com/privacy-policy
          quote: 'We do not “sell”, or use or “share” for targeted advertising purposes, the personal data of consumers we know to be less than 18 years of age.'
      lastVerified: 2026-11-11
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online in your account, by chat or by phone, but at least 24 hours before it renews. You keep listening to the end of the period you paid for.'
      sources:
        - url: https://www.siriusxm.com/help/manage-or-cancel-service
          quote: 'Go to the Subscriptions tab in the Online Account Center'
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'You must cancel at least 24 hours before your upcoming renewal date to avoid being automatically renewed and charged for a new Subscription Period.'
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'Your cancellation will become effective at the end of your current Subscription Period (i.e., billing cycle), and no refunds or credits will be given for any partial period, except as provided below or as required by law.'
      action:
        name: 'How do I manage or cancel my service?'
        url: https://www.siriusxm.com/help/manage-or-cancel-service
      lastVerified: 2026-11-11
    - topic: billing.refunds
      tier: neutral
      reason: 'Monthly plans give back the unused part only if you cancel within 7 days of starting, and longer plans within 30 days of each renewal. Otherwise there’s no money back, but you keep listening to the end of the period.'
      sources:
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'If you cancel a monthly billed Subscription within seven (7) days of the start date of your Subscription, your Subscription will terminate immediately and any fees paid are eligible for a pro-rata refund, if requested.'
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'If you cancel a non-monthly billed Subscription within thirty (30) days of the start of your Subscription or each subsequent renewal charge, your Subscription will terminate immediately and fees paid for that Subscription Period are eligible for a pro-rata refund, if requested.'
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'Cancellations after this 7-day period will be effective at the end of your current Subscription Period and any fees paid are non-refundable.'
      lastVerified: 2026-11-11
    - topic: billing.price-changes
      tier: great
      reason: 'It tells you the date a new price starts, which is only at your next billing period, never on time you’ve paid for, and you can cancel before then.'
      sources:
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'We will let you know the date on which any change will be effective.'
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'If you do not accept the change in pricing, you have the right to reject the change by cancelling your Subscription prior to the change taking effect.'
        - url: https://www.siriusxm.com/customer-agreement
          quote: 'Changes in pricing will take effect at the start of your next Subscription Period following the date of the price change.'
      lastVerified: 2026-11-11
    - topic: billing.free-trials
      tier: poor
      reason: 'The app-only plan’s free months need a credit card and turn into a paid plan unless you cancel, with no reminder promised. The free Platinum trial for a car radio needs no card and just stops.'
      sources:
        - url: https://www.siriusxm.com/free-trial
          quote: 'Subscribe to the All Access (App Only) plan and get your first 3 months for $0.00. Credit card required.'
        - url: https://www.siriusxm.com/free-trial
