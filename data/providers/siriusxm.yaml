    page:
      name: Customer Agreement
      url: https://www.siriusxm.com/customer-agreement
    quotes:
      - 'Sirius XM Radio LLC, 1221 Avenue of the Americas, 35th Floor, New York, NY 10020'
    lastVerified: 2026-11-11
  stock:
    company: Sirius XM Holdings Inc.
    listings:
      - { exchange: NASDAQ, symbol: SIRI }
    page:
      name: Investor Relations
      url: https://investor.siriusxm.com/
    quotes:
      - 'NASDAQ: SIRI'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11
# Ways to pay (M11.5), read 2026-11-11: its payment help names the networks and debit cards; the Customer Agreement a
# prepaid service card or gift card, and Apple's App Store. Diner's Club is `other`. Also named, in words the catalog's
# checks don't read as those ways: "ACH payment (electronic debit from your account)" and cheques for invoiced plans
# ("Invoice billing is not available for all Plans"), Roku ("billed through Roku") and T-Mobile ("billed by T-Mobile",
# How do I manage or cancel my service?), so they're named here only.
