    page: Customer Agreement
    url: https://www.siriusxm.com/customer-agreement
    quotes:
      - 'You may pay by credit card, debit card, a SiriusXM® Prepaid Service card or gift card.'
# Renewal day (M11.5): "Your card will be charged on the day you select the Subscription (or after any free period) and
