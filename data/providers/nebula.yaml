# Researched by hand on 2026-11-11 (M11.15, streaming batch 6), read with Edge from Canada, and its sign-up page through
# each other country's exit. Pages, each quoted where it's used:
# Pricing: its sign-up page (nebula.tv/join) prices by where the visitor is, and the plan data it loads names the
# country and currency (payments/stripe/v2/plans/?country=CA: "price":"8","currency":"cad"), read as part of the page:
# Canada "$8 CAD/month" or "$80 CAD/year" ("Prices exclude taxes. Applicable taxes will be calculated at checkout.");
# through a US exit "$6/month" or "$60/year" (its data: country=US, "usd"); the UK "£6/month" or "£60/year"; Ireland,
# Germany, France, the Netherlands, Spain and Italy "7 €/month" or "70 €/year"; Australia "$10 AUD/month" or "$100
# AUD/year"; New Zealand "$6 USD/month" or "$60 USD/year" (US dollars there). Italy's first exit was placed in Bulgaria
# by its data (country=BG), so it was read again until the data said IT. The UK's, the euro countries' and Australia's
# data mark the prices tax-inclusive ("tax_behavior":"inclusive"), but no words on the page say so, so no taxIncluded.
# Not listed: the Lifetime membership, one payment that never renews (CA$700, US$500, £500, €550, A$800: "Pay once,
# watch forever", go.nebula.tv/lifetime; its terms: "Lifetime subscriptions are non-cancellable and non-refundable"),
# not a subscription; and creator links' discount ("Fans get 50% off a yearly plan", nebula.tv/wendover, CA$40 or US$30
# for the first year), since no page says it applies at renewal and its terms (5.3) renew a discounted first period
# at "the then-current fee".
# Region checklist, 2026-11-11: 1. no country paths (nebula.tv has no locale versions); 2. no picker; 3. the plan data
# the page loads, which names the country; 4. the plan picker on nebula.tv/join, never past the account form; 5. no help
# articles on prices (its help centre has four, which point to its FAQ); 6. Edge from here and through each country's
# exit; 7. no bill offered.
# Bundles: none now: its CuriosityStream bundle ended in 2024 (its blog's "Unbundle": "The latest someone will get access
# to Nebula via the CuriosityStream bundle is December 31, 2024"). Official resellers: none; it sells gift memberships
# itself (go.nebula.tv/gift).
# Features, read 2026-11-11: no ads ("No ads", "No need to skip what isn’t there."); downloads in its mobile apps ("Access
# your favorites easily at all times on mobile devices."), no number of devices, so 1 (inferred); video quality: no page
# states it for viewers, and its blog's "Starlight" (2022) says "4K videos are still going through the old system for
# now", so it streams 4K (inferred); a video page's own stream for a visitor went up to 1080p. No page says how many
# streams play at once (its FAQ, terms, privacy policy, help centre and blog read): the plan waits in core's
# awaitingRequiredFeatures for it. No profiles, no parental controls on any page. Pausing: its terms ("To pause or cancel
# a subscription, visit your Account settings."). What it streams: "Premium streaming from independent creators",
# "Full-length documentaries, collaborative series, animated specials, and more", and its News collection.
# Free use: none. A video page lets a visitor without an account watch one video ("First one is on us. Enjoy!"), a
# sample before signing up; its blog's "Guest Passes" (2024) said videos "with a black timebox can be viewed for free
# without a Nebula account", but no current page says so. Guest passes (a free week a subscriber sends a new viewer) are
# a perk.

id: nebula
name: Nebula
website: https://nebula.tv
category: streaming
spendCategory: streaming
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
# Its terms (5.4): "You may cancel your subscription at any time by going to the "Settings" page, selecting the
# "Subscription" tab, and selecting "Change or Cancel."" No help article on cancelling.
cancelUrl: https://nebula.tv/terms
sources: { pricing: https://nebula.tv/join }
notes: Also sold as a one-time Lifetime membership. Creator links give 50% off the first year of a yearly plan.

# Owner (M11.2), read 2026-11-11: its FAQ's "Who owns Nebula?". Its terms and privacy policy are with Watch Nebula LLC
# ("Watch Nebula LLC and its parent", the privacy policy), and its pages' copyright line names Nebula Entertainment &
# Broadcasting LLC; no page names a Standard Broadcast LLC (its Android app's id is still tv.standard.nebula). Creator-
# owned, so no shares listed. Where it is: its terms' contact section.
owner:
  name: 'Nebula Entertainment & Broadcasting LLC, owned by its creators'
  page:
    name: FAQ
    url: https://nebula.tv/faq
  quotes:
    - 'Nebula Entertainment & Broadcasting LLC is 100% creator-owned.'
  country:
    code: US
    page:
      name: Terms of Service
      url: https://nebula.tv/terms
    quotes:
      - 'Nebula is located in New York, NY.'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11

# Ways to pay (M11.5), read 2026-11-11: a credit or debit card (its terms; its checkout is Stripe's, behind the account
# form), the app stores and platforms that bill it (Apple, Google, Roku and Amazon's app stores, its terms' "in-app"
# purchases), and gift memberships (its FAQ). No page names the card networks, so no acceptedNetworks. Its terms say
# "All fees will be paid in U.S. dollars", but its pages price Canada, the UK, the euro countries and Australia in their
# own currencies, which its plan data charges ("currency":"cad").
paymentMethods:
  - methods: [card]
    page: Terms of Service
    url: https://nebula.tv/terms
    quotes:
      - 'You will provide Nebula with accurate and complete billing information including legal name, address, telephone number, and credit card or debit card billing information.'
  - methods: [app-store]
    page: Terms of Service
    url: https://nebula.tv/terms
    quotes:
      - 'When you make such "in-app" purchases, you will be billed by the applicable App Store, not us.'
  - methods: [gift-card]
    page: FAQ
    url: https://nebula.tv/faq
    quotes:
      - 'Do you sell gift cards?'
      - 'Yes. Lifetime, annual, and monthly gift memberships can be purchased here.'
# Renewal day (M11.5): its terms charge "at the beginning of each subscription period", without naming the day.
renewalAnchor:
  kind: not-stated
  pages: [https://nebula.tv/terms]
  lastVerified: 2026-11-11
freeUse:
  kind: none
  pages:
    - https://nebula.tv/join
    - https://nebula.tv/faq
    - https://nebula.tv/videos/wendover-why-there-are-so-many-different-hotel-brands
  lastVerified: 2026-11-11

# Sign-in (2026-11-11): an email and a password, or "Scan a code instead" ("Scan the code to sign in", or enter the code
# at nebula.tv/link from a signed-in device: approval on another device) (nebula.tv/login). No page names two-step
# sign-in. Platforms: its FAQ's apps ("iOS", "tvOS", "Android", "Android TV", "Fire TV", "Roku", Samsung and LG TVs)
# and the web; no consoles ("Okay, what about Xbox, PlayStation, etc.? We'd love to be on every platform"). App
# languages: English only (no other language on its site or FAQ). Support: its support request form and email ("To
# contact customer support about any Nebula issue, you may submit this Support Request Form.", support.nebula.tv).
features:
  platforms: [web, ios, android, tv]
  account.sign-in: [password, push-approval]
  languages.interface: [en]
  support.channels: [email]

