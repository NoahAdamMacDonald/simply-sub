    - https://support.google.com/googleone/answer/2736362
  lastVerified: 2026-11-04

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their words.
# Read 2026-11-04 on the Gemini pages and Google One's comparison table. Project Genie: the Gemini pages say "Only
# available with a Google AI Ultra plan" and the table ticks both Ultras, though the Google One page's footnote says
# "Only available with a Google AI Ultra 20x plan". Google Meet's "Premium video calling features" are "Only with 2 TB
# plan" for Plus. YouTube Premium is "available in over 40 countries", and Lite's availability "varies by country".
perks:
  - id: usage-2x
    name: Double the usage limits of the free plan
  - id: usage-4x
    name: Four times the usage limits of the free plan
  - id: usage-5x
    name: 5x the usage limits of AI Pro
  - id: usage-20x
    name: 20x the usage limits of AI Pro
  - id: youtube-premium-lite
    name: YouTube Premium Lite plan
  - id: youtube-premium
    name: YouTube Premium individual plan
  - id: home-premium-standard
    name: Google Home Premium (Standard plan)
  - id: home-premium-advanced
    name: Google Home Premium (Advanced plan)
  - id: health-premium
    name: Google Health Premium
  - id: project-genie
    name: Project Genie
  - id: meet-premium
    name: Premium video calling features in Google Meet
  - id: calendar-scheduling
    name: Enhanced appointment scheduling in Google Calendar

# AI features (M11.9 and M11.15), read 2026-11-04 on the Gemini pages (each card's list) and Google One's comparison
# table, which ticks Plus, Pro, Ultra 5x and Ultra 20x (it has no free column):
# - Image generation and Deep Research on every plan: the free card lists "Image generation and editing" and "Deep
#   Research", and the table ticks both for every paid plan.
# - Video generation on the paid plans: Plus "access to more features like video generation", and the table's "Video
#   generation model access: Omni Flash" for each. The free card has none: its Google Flow gives "limited access to
#   Nano Banana Pro", an image model.
# - Office apps on the paid plans: Plus "Gemini in Gmail, Vids and more" ("help you proofread in Gmail"), Pro and Ultra
#   "Gemini in Gmail, Docs, Vids and more".
# - Coding agent on every plan: Google Antigravity's own pricing page (antigravity.google/pricing) has a "$0/month" plan
#   "For Individuals" with "Basic weekly rate limits"; the table gives Plus "Limited" agent requests, and Pro and Ultra
#   more ("Entry", "Higher" and "Highest rate limits to agent model in Google Antigravity" on the Gemini pages).
# - Scheduled tasks on every plan: the Gemini help's "Schedule actions in Gemini Apps" (answer 16316416) needs "A
#   personal Google Account" and Keep Activity on, and says "We’re gradually making this feature available to all
#   personal Google Accounts".
# - Early access on the paid plans: the table's "Priority access to new features" ticks all four in Gemini, and Ultra
#   adds "first access to advanced features like Tasks in Gemini".
# - API credits: "Google Cloud credits" of US$10 a month on Pro, US$40 on Ultra 5x and US$100 on Ultra 20x (the table;
#   Plus has none).
# Storage, the Google Account's 15 GB included (one.google.com/about/plans: "All Google accounts come with up to 15 GB
# of storage, which is included as part of the total storage offered in other Google One plans"): 15 GB, 400 GB, 2 TB,
# 5 TB, 20 TB and 30 TB. People included: the paid plans share with a family group of "up to five others" (Google One's
# AI plans page), "Access to AI benefits such as Gemini App" among what they share (its family sharing article).

# Apps and sign-in (the cross-category features), read 2026-11-04: the web, Android, iOS, macOS, and Google TV (the
# Gemini Apps Privacy Hub's "What are Gemini Apps?"), and Windows ("Gemini for desktop: download the AI app for Windows
# and macOS", gemini.google/ca/desktop); a Google Account's password or passkey, with Google prompts, an authenticator
# app, a security key or a text message as the second step (Google's 2-Step Verification help). Support: Google One
# members reach "Google One support for help via chat, a phone call, or email" (Google One's support article); every
# help page has its community.
features:
  platforms: [windows, macos, android, ios, web, tv]
  account.sign-in: [password, passkey, push-approval, totp, security-key, sms]
  support.channels: [community]

