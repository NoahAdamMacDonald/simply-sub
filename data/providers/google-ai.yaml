# Researched by hand on 2026-11-04 (M11.15, the AI category), read with Edge or a plain fetch from Canada. The owner
# chose the id and name (2026-11-04): Google sells Gemini's paid plans as Google AI plans, which are Google One
# memberships. Pages, each quoted where it's used:
# Pricing: each country's Gemini plans page (gemini.google/<country>/subscriptions, in its own language), Google One's
# AI plans page and its comparison table (one.google.com/about/google-ai-plans), and Google One's plans page
# (one.google.com/about/plans), whose Monthly and Annual tabs sell Google AI Plus (2 TB) and yearly billing: read
# 2026-11-04 from Canada, and through a US, UK, Australian, German, French, Spanish and Italian exit (the owner's choice
# of 2026-11-04), each page in that country's currency, its Pro price the Gemini page's. France's page shows Basic,
# Standard and Plus (2 TB) only, so Pro has no yearly price there.
# Payment methods: Google One's "Change your card & fix payment issues", its trials and cancelling articles, and Google
# Play's "Accepted payment methods" for each country, since Google One bills through Google Play.
# Cancelling: support.google.com/googleone/answer/9056360.
# Terms: Google's Terms of Service (data/policies/google-terms.yaml) and the Google One Additional Terms of Service.
# Privacy: Google's Privacy Policy (data/policies/google-privacy.yaml) and the Gemini Apps Privacy Hub.
# Bundles: none to add. Google One sells eligible members a YouTube Premium add-on "at a discounted price"
# (support.google.com/googleone/answer/15808277), and Pro "can be upgraded to Advanced" Google Home Premium for $12.99
# CAD a month (one.google.com/about/google-ai-plans): neither service is in the catalog yet.
# Official resellers: none. Google One's "Learn about third-party Google One subscriptions" says plans can come "from
# third-party service providers, such as a mobile phone carrier, as part of a bundle or billed separately by that
# provider": partners that bill for it, not shops (a way to pay, below).
# Where it's sold: Google AI Plus in more than 160 countries and Pro and Ultra in more than 150 (each card's line on
# the Gemini pages), listed in the Gemini Apps help's "Where Google AI Plus is available" and "Where Google AI Pro &
# Google AI Ultra are available" (support.google.com/gemini/answer/16275805), every catalog region on both. No
# availableIn: as for Netflix and Disney+, its lists run to most of the world.
# Region checklist, 2026-11-04: 1. the Gemini pages' country paths gave each region's prices in its own currency;
# 2. Google One's AI plans page shows a country picker, but its cards have no yearly price and no Plus (2 TB); 3. not
# looked for; 4. checkout not opened; 5. Google One's help has no price list by country; 6. Google One's plans page
# prices by where the visitor is (an address with gl=US still showed CA$ in Edge), so it was read through each
# country's exit: New Zealand's and Ireland's showed Australia's and the UK's prices, and the Netherlands' no plans, so
# those three stay unread; 7. no bill offered.
# Not on the pages: Plus (400 GB)'s and Ultra's yearly prices (no page offers them); the networks of cards Google
# One takes outside Google Play's lists.

# Coverage: google-ai.plus-2tb isn't priced in NZ, IE or NL yet: only Google One's plans page sells it, which prices by
# where the visitor is, and those three countries' exits showed Australia's prices, the UK's and no plans
# (one.google.com/about/plans, 2026-11-04).

