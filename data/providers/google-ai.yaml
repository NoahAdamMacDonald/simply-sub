# Apps Privacy Hub names Google LLC as the company providing Gemini outside the EEA and Switzerland.
owner:
  name: 'Google LLC, owned by Alphabet Inc., a public company (NASDAQ: GOOGL, GOOG)'
  website: https://abc.xyz
  page:
    name: "Alphabet's founders' letter"
    url: https://abc.xyz/
  quotes:
    - 'What is Alphabet? Alphabet is mostly a collection of companies. The largest of which, of course, is Google.'
    - 'Google will become a wholly-owned subsidiary of Alphabet. Our two classes of shares will continue to trade on Nasdaq as GOOGL and GOOG.'
  country:
    code: US
    page:
      name: Terms of service
      url: https://policies.google.com/terms
    quotes:
      - 'organized under the laws of the State of Delaware, USA, and operating under the laws of the USA'
    lastVerified: 2026-11-04
  lastVerified: 2026-11-04

