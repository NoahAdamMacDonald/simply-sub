# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-04: the Gemini pages' "By subscribing, you
# agree to terms for Google One, Google and offers" links the Google One Additional Terms of Service, which take in
# Google's Terms of Service (shared), and the Generative AI Additional Terms, which say they "no longer apply" since
# Google's terms covered AI on May 22, 2024; Google's terms include its Generative AI Prohibited Use Policy (the
# conduct it forbids, no topic's); Google One's plans page adds YouTube's terms for the YouTube benefit, not read (no
# plan's own clause). Google Play's refund article says partial refunds for subscriptions are for France, Germany,
# Israel and New York, but shows the details only to an account there: left unread, so no rating for FR or DE.
policies:
  shared: [google-terms, google-privacy]
  links:
    - name: 'Gemini Apps Privacy Hub'
      url: https://support.google.com/gemini/answer/13594961
    - name: 'Manage your Gemini Apps activity'
      url: https://support.google.com/gemini/answer/13278892
    - name: 'Google One terms of service'
      url: https://one.google.com/terms-of-service
    - name: 'Cancelling'
      url: https://support.google.com/googleone/answer/9056360
    - name: 'Purchase, cancellation and refund policies'
      url: https://support.google.com/googleone/answer/2736362
    - name: 'Google One trials'
      url: https://support.google.com/googleone/answer/9155746
    - name: 'Changing plans'
      url: https://support.google.com/googleone/answer/9003633
    - name: 'Family sharing'
      url: https://support.google.com/googleone/answer/9004015
    - name: 'Pricing'
      url: https://gemini.google/ca/subscriptions/?hl=en-CA
    - name: 'Google Play subscriptions'
      url: https://support.google.com/googleplay/answer/7018481
    - name: 'Vulnerability Reward Program'
      url: https://bughunters.google.com/about/rules/google-friends/google-and-alphabet-vulnerability-reward-program-vrp-rules
  ratings:
    - topic: privacy.ai-training
      tier: poor
      reason: "If you're 18 or over, your Gemini chats train Google's AI unless you turn off Keep Activity, and turning it off stops that for new chats only."
      sources:
        - url: https://support.google.com/gemini/answer/13278892
          quote: 'If you’re 18 or over, Keep Activity is on by default.'
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'Google uses your activity to provide, develop, and improve its services (including training generative AI models), as well as to protect Google, its users, and the public with the help of human reviewers.'
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'Your future chats won’t appear in your Activity, and won’t be used to train our AI models, unless you choose to send Google feedback.'
      action:
        name: 'How to turn off Keep Activity'
        url: https://support.google.com/gemini/answer/13278892
      lastVerified: 2026-11-04
    - topic: privacy.content-access
      tier: poor
      reason: 'People, its contractors among them, read some of your Gemini chats to improve its AI. Turning off Keep Activity stops that for new chats, though chats can still be read to keep people safe.'
      sources:
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'A subset of chats are reviewed by human reviewers (including Google’s trained service providers) to help improve Google services.'
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'To stop your future chats from being reviewed to improve Google services, turn off your Keep Activity setting.'
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'Even if your Keep Activity setting is off or you use temporary chats, Google still uses your chats to respond to you and help protect Google, our users, and the public, including with help from human reviewers.'
      action:
        name: 'How to turn off Keep Activity'
        url: https://support.google.com/gemini/answer/13278892
      lastVerified: 2026-11-04
    - topic: privacy.data-retention
      tier: neutral
      reason: 'Gemini deletes your chats after 18 months unless you pick 3 or 36 months or never, and keeps them 72 hours with Keep Activity off. Chats people reviewed stay up to 3 years, apart from your account, even if you delete them.'
      sources:
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'Your activity is auto-deleted after 18 months. You can change this to 3 or 36 months, or choose not to auto-delete.'
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'Temporary chats and chats you have when Keep Activity is off are retained with your account for 72 hours'
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'Chats reviewed by human reviewers (and related data like your language, device type, location info, or feedback) are not deleted when you delete your activity. Instead, they are retained for up to three years.'
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online whenever you like, in a few taps, and keep your plan until the end of the time you paid for.'
      sources:
        - url: https://support.google.com/googleone/answer/9056360
          quote: 'You can cancel your Google One membership plan at any time.'
        - url: https://support.google.com/googleone/answer/9056360
          quote: 'When you cancel your membership, your Google One storage and benefits won’t go away immediately. You have until the end of the billing cycle to use them.'
      lastVerified: 2026-11-04
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back for part of a month or year unless the law says so, but you keep your plan until the end of the time you paid for.'
      sources:
        - url: https://gemini.google/ca/subscriptions/?hl=en-CA
          quote: 'No refunds for partial billing periods, except as required by applicable law.'
        - url: https://support.google.com/googleone/answer/9056360
          quote: 'When you cancel your membership, your Google One storage and benefits won’t go away immediately. You have until the end of the billing cycle to use them.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      tier: great
      reason: "A new price never applies to time you've paid for, and it tells you at least 30 days before charging more, so you can cancel first."
      sources:
        - url: https://one.google.com/terms-of-service
          quote: 'For changes to pricing for Google One subscriptions, these changes will apply after your current payment period is complete and when the next payment is due from you after the notice.'
        - url: https://one.google.com/terms-of-service
          quote: 'We will give you at least 30 days’ prior notice of a price increase before you are charged.'
      lastVerified: 2026-11-04
    - topic: billing.free-trials
      tier: poor
      reason: "Its trials need a card up front and turn into a paid plan on their own unless you cancel before the trial's last day. It doesn't promise to remind you first."
      sources:
        - url: https://support.google.com/googleone/answer/9155746
          quote: "Tip: A form of payment is required so that your membership can continue at the end of your trial. You won't be charged until your trial ends."
        - url: https://support.google.com/googleone/answer/9155746
          quote: "You'll be automatically charged using the form of payment you entered when you signed up."
        - url: https://support.google.com/googleone/answer/9155746
          quote: "If you don't want to be charged, cancel your membership before the last day of your trial."
      lastVerified: 2026-11-04
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own until you cancel, but not that it reminds you first.'
      pages:
        - https://one.google.com/terms-of-service
        - https://support.google.com/googleone/answer/2736362
        - https://support.google.com/googleplay/answer/7018481
      lastVerified: 2026-11-04
    - topic: billing.fees
      status: not-stated
      reason: "Its terms list no fees beyond the plan's price. AI credits for more use are sold on their own."
      pages:
        - https://one.google.com/terms-of-service
        - https://support.google.com/googleone/answer/2736362
      lastVerified: 2026-11-04
    - topic: billing.plan-changes
      tier: good
      reason: "Moving up starts at once, and what's left of your old plan turns into extra days on the new one. Moving down waits until your next bill."
      sources:
        - url: https://support.google.com/googleone/answer/9003633
          quote: 'When you upgrade your plan purchased through Google Play, you pay the full price of your upgraded plan and the change takes place immediately.'
        - url: https://support.google.com/googleone/answer/9003633
          quote: 'Add more storage: If you stay on a Standard or AI plan but increase your storage amount, the remaining value of your original plan becomes one-time extra days of service on your new plan.'
        - url: https://support.google.com/googleone/answer/9003633
          quote: 'If you downgrade your plan, your current plan remains active until the end of your billing cycle. The downgrade takes effect at the start of your next billing cycle.'
      lastVerified: 2026-11-04
    - topic: legal.service-changes
      tier: poor
      reason: 'AI credits you buy may be lost when your plan ends, and Google can change how many credits each use costs whenever it likes.'
      sources:
        - url: https://one.google.com/terms-of-service
          quote: 'Google reserves the right to modify the credit cost for using AI features.'
        - url: https://one.google.com/terms-of-service
          quote: 'Any unused AI credits may be forfeited upon termination or cancellation of your Google One plan, subject to any applicable refund policies.'
      lastVerified: 2026-11-04
    - topic: service.account-sharing
      tier: great
      reason: 'On a paid plan you can share Gemini and your storage with up to 5 people in a family group, each with their own Google Account, as long as they live in your country.'
      sources:
        - url: https://support.google.com/googleone/answer/9004015
          quote: 'Access to AI benefits such as Gemini App, Google Antigravity, Gemini Notebook, and other AI features.'
        - url: https://support.google.com/googleone/answer/9004015
          quote: 'To set up a family group, you must be 18 years or older. The people you invite need to live in the same country as you.'
        - url: https://support.google.com/googleone/answer/9004015
          quote: 'You can share Google One with up to 5 family members.'
      lastVerified: 2026-11-04
    - topic: security.practices
      tier: neutral
      reason: "It pays security experts who find and report problems in its services, but doesn't say outside experts regularly check Gemini's security or publish what they find."
      sources:
        - url: https://bughunters.google.com/about/rules/google-friends/google-and-alphabet-vulnerability-reward-program-vrp-rules
          quote: 'we maintain a Vulnerability Reward Program for Google-owned and Alphabet (Bet) subsidiary web properties, running continuously since November 2010.'
        - url: https://bughunters.google.com/about/rules/google-friends/google-and-alphabet-vulnerability-reward-program-vrp-rules
          quote: 'In principle, any Google-owned or Alphabet (Bet) subsidiary web service that handles reasonably sensitive user data is intended to be in scope.'
      lastVerified: 2026-11-04
    - topic: other.notable
      title: Tasks Gemini does for you
      tier: neutral
      reason: 'Gemini can act for you, and Google warns it may make purchases or share your data with others by mistake. You choose how often it asks before it acts.'
      sources:
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'Take care since Gemini can make mistakes, like making purchases or sharing your data with third parties unexpectedly.'
        - url: https://support.google.com/gemini/answer/13594961
          quote: 'You can control how often Gemini asks for your permission before taking actions.'
      lastVerified: 2026-11-04
