# Ways to pay (M11.5), read 2026-11-04: a card, PayPal or Google Play balance (Google One's payment article) and the App
# Store on an iPhone or iPad (its cancelling article) everywhere; a bank account in the US only; and Direct Carrier
# Billing (its trials article) where Google Play's own country page lists mobile phone billing: Canada, the UK, Ireland,
# Germany, France, the Netherlands, Spain and Italy, not Australia, New Zealand or the US. Google Play's lists add more
# by country (Klarna in Germany, Cash App Pay and Venmo in the US), but not for Google One subscriptions, so they're left
# out.
paymentMethods:
  - methods: [card, paypal, app-store]
    page: 'Change your card & fix payment issues'
    url: https://support.google.com/googleone/answer/9003634
    quotes:
      - 'Credit card'
      - 'PayPal'
      - 'Google Play balance (Selected countries/regions only)'
  - methods: [app-store]
    page: 'Cancel your Google One membership'
    url: https://support.google.com/googleone/answer/9056360
    quotes:
      - "If you sign up for Google One through the App Store on an iPhone or iPad and later switch to an Android device: You can't adjust your membership or change your payment method in the app."
  - methods: [card, paypal, app-store]
    regions: [CA, GB, IE, DE, FR, NL, ES, IT]
    page: 'Change your card & fix payment issues'
    url: https://support.google.com/googleone/answer/9003634
    quotes:
