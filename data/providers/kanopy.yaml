# Researched by hand on 2026-11-13 (M11.15, streaming batch 8), read with Edge from Canada, its help centre
# (help.kanopy.com, a MadCap Flare site: all 50 articles its table of contents lists) with a plain fetch, and its library
# and university finders in Edge, searching by city. Pages, each quoted where it's used:
# Pricing: nothing is sold. "We stream thoughtful entertainment to your preferred device with no fees and no commercials
# by partnering with public libraries and universities." (its about page) and "Kanopy does not charge you because the
# public library or university covers all associated costs, allowing you to watch for free with no ads." (its home
# page's "How is Kanopy free for me?"). "Kanopy is only available through libraries, so you need to be a member of a
# participating library to start watching Kanopy." (the same FAQ). So its one plan is free, priced 0.
# Where: no page lists the countries it's offered in. Its footer's region menu ("Australia", "United States",
# "Singapore", "Hong Kong", "Canada", "New Zealand", "United Kingdom", "Europe", "Worldwide", "Middle East") changes
# the catalogue shown, and its press page counts "200+ Countries Where Kanopy is Watched", so there's no availableIn.
# Its public library finder (kanopy.com/en/signup/find/publiclibrary) gives each library's address with its country:
# Toronto Public Library ("Toronto ON M4W 1L4 CA"), the US's (Gold Coast Public Library, "Glen Head, NY 11545 US"), the
# UK's (London Borough of Tower Hamlets, "E1 1BU GB"; Cardiff Libraries, "CF10 1FL GB"), Ireland's (South Dublin County
# Libraries, "D24 YXW3 IE"), Australia's (City Of Sydney Library, "Sydney New South Wales 2000 AU") and New Zealand's
# (Wellington City Libraries, "Wellington 6011 NZ"), so the plan is priced 0 in those six. Searches for Berlin, Hamburg,
# Paris, Lyon, Amsterdam, Rotterdam, Madrid, Barcelona, Milano and Roma found no public library there; its university
# finder lists Freie Universität Berlin, the University of Amsterdam, the American University of Paris, Universitat
# Autònoma de Barcelona and the University of Milan - Bicocca, but names no countries, so Germany, France, the
# Netherlands, Spain and Italy stay unpriced (unknown, not "not offered").
# Region checklist, 2026-11-13: 1. no country paths (kanopy.com/en, /fr and /de are languages); 2. a region menu
# without prices; 3. not needed (nothing is priced); 4. its sign-up stops at the library card; 5. none (no prices);
# 6. Edge from Canada and a plain fetch; 7. no bill offered.
# Ways to pay: none (it's free; no paymentMethods and no renewal day). Bundles: none. Official resellers: none: its
# libraries and universities pay for it (its librarians' site, lib.kanopy.com).
# Features, read 2026-11-13: what it streams, from its home page ("Find movies, documentaries, foreign films, classic
# cinema, independent films and educational videos", "ad-free films and series"), its press page ("along with television
# and kids programming") and Kanopy Kids ("Kanopy's curated collection of content for children, with a focus on ages
# 2-8"). Video quality: no page names a resolution; "Some older films are not available in high definition"
# (Troubleshooting poor video quality) says the rest are, so 720p, inferred (HD with no resolution: Crunchyroll's and
# Hayu's precedent). The Streamable's Kanopy page (read with WebFetch: its site timed out in Edge) says "Most video
# streams are in 720p HD. Some video streams are available in 1080p HD.", which isn't used: the official inference fills
# the gap. Streams at once: no page of its own says ("You can log in to your Kanopy account on any number of devices."
# is about signing in). The Streamable's "you can stream on an unlimited number of devices" was read only through a
# summarising fetch (its site timed out in Edge) and still names the old "Play Credit", so it can't be quoted word for
# word: waiting (awaitingRequiredFeatures, 2026-11-13). No
# downloads: "An internet connection is required to watch videos; they can't be downloaded for offline viewing." (Playing
# videos). No profiles on any page. Parental controls: "With Kanopy's parental controls enabled, you can only view titles
# in Kanopy Kids. To exit Kanopy Kids or watch videos outside of Kanopy Kids, you'll need to enter a four-digit PIN."
# (Using parental controls). No pause (nothing to pause). Limits, in the plan's notes: "Each month, you receive a set
# number of tickets from your library. Your tickets reset on the first day of the month, and unused tickets don't roll
# over to the next month." and "Kanopy Kids videos never use tickets." (Using tickets); "There's no limit on the number
# of unlimited viewing titles you can watch or the number of times you can watch them." (Watching unlimited viewing
# titles); a ticketed season is "available for 3 days" to "7 days" by its running time (Watching series).
id: kanopy
name: Kanopy
website: https://www.kanopy.com
category: streaming
spendCategory: streaming
# Nothing to cancel: its help centre's article on deleting your account.
cancelUrl: https://help.kanopy.com/en-us/4129.htm
sources: { pricing: https://www.kanopy.com/en }
notes: Free through participating public libraries and universities, with no ads.
# Owner (M11.2), read 2026-11-13: its press site (press.kanopy.com) says it joined OverDrive; its terms and privacy policy
# are Kanopy, Inc.'s ("and its affiliates"), at "One OverDrive Way Cleveland, OH 44125". OverDrive's own pages (its "The
# OverDrive family of brands" and app lists name Kanopy) give its headquarters; no page read names OverDrive's own owners
# or any shares, so no stock (OverDrive, Inc. is private).
owner:
  name: 'OverDrive, Inc.'
  website: https://company.overdrive.com
  page:
    name: 'Kanopy press: About'
    url: https://press.kanopy.com/
  quotes:
    - '2021 – Kanopy became part of the OverDrive family of brands.'
  country:
    code: US
    page:
      name: 'Contact Us (OverDrive)'
      url: https://company.overdrive.com/contact/
    quotes:
      - 'Cleveland, OH 44125 USA'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13

# Sign-in (2026-11-13): "Enter your name, email address, and password, then select Sign up." or "Sign Up with Apple or
# Sign Up with Google" (Getting started with Kanopy for public library users); university users sign in "with a valid
# university login" (its home page's FAQ). No two-step sign-in on any page. Platforms: "On a Windows computer, Mac, or
# Chromebook, you can use Kanopy in your web browser", iPhones and iPads, Android, Fire tablets, and "Android TV and Google
# TV", "Apple TV", "Fire TV", "Roku" and "Samsung TV" (Supported browsers and devices). App languages: its site in English
# (kanopy.com/en), French (kanopy.com/fr: "Regardez des milliers de films gratuitement") and German (kanopy.com/de:
# "Streame Tausende von Filmen kostenlos"); /es, /it, /nl, /pt, /ja, /zh, /ko and /ar go to English. Support: its
# "SUPPORT" link is a contact form ("If you need help deleting your account, please contact us."); no chat or phone.
features:
  platforms: [web, ios, android, tv]
  account.sign-in: [password, sso]
  languages.interface: [en, fr, de]
  support.channels: [email]

