# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with a plain fetch. Every agreement a user accepts (the owner's
# rule, 2026-11-03): the Mozilla Subscription Services Terms of Service (Mozilla VPN's, with its licence: "The Mozilla
# VPN software is made available to you under the terms of various open source licenses"), which include Mozilla's
# Acceptable Use Policy ("you also agree that your use of the Services will comply with Mozilla’s Acceptable Use
# Policy", read: rules of use, no topic) and need a Mozilla account, under the Mozilla Accounts Terms of Service and
# Privacy Notice; the Mozilla Subscription Services Privacy Notice, which adheres to the Mozilla Privacy Policy ("We
# also adhere to the Mozilla Privacy Policy"); and the Websites, Communications & Cookies Privacy Notice for its pages.
# Also read: its features page, Cure53's audit (the Mozilla blog's post, the security blog's post and the report),
# Mozilla's security advisories, its bug bounty pages (the client bounty names Firefox's apps, the web bounty's eligible
# sites name no VPN site), its transparency page and governance page. Not read: the sign-up form and checkout
# (accounts.firefox.com showed a CAPTCHA) and its help centre (support.mozilla.org showed a CAPTCHA to Edge, a plain
# fetch and Mullvad Browser; the Internet Archive answered 429), notes.md. No shared document applies (data/policies/
# has none of Mozilla's); Mozilla's privacy policy and accounts documents would be one when Firefox or Relay joins.
# Billing topics: one paid plan, so switching plans doesn't apply. Not applicable (vpn isn't in their categories): who
# can read your content, rights over your content, children, account sharing.
policies:
  links:
    - name: 'Mozilla Subscription Services Terms of Service'
      url: https://www.mozilla.org/en-CA/about/legal/terms/subscription-services/
    - name: 'Mozilla Subscription Services Privacy Notice'
      url: https://www.mozilla.org/en-CA/privacy/subscription-services/
    - name: 'Mozilla Privacy Policy'
      url: https://www.mozilla.org/en-CA/privacy/
    - name: 'Mozilla Accounts Terms of Service'
      url: https://www.mozilla.org/en-CA/about/legal/terms/services/
    - name: 'Mozilla Accounts Privacy Notice'
      url: https://www.mozilla.org/en-CA/privacy/mozilla-accounts/
    - name: 'Websites, Communications & Cookies Privacy Notice'
      url: https://www.mozilla.org/en-CA/privacy/websites/
    - name: 'Mozilla VPN product page'
      url: https://www.mozilla.org/en-CA/products/vpn/
    - name: 'Features - Mozilla VPN'
      url: https://www.mozilla.org/en-CA/products/vpn/features/
    - name: 'Mozilla VPN Security Audit (Mozilla Security Blog)'
      url: https://blog.mozilla.org/security/2021/08/31/mozilla-vpn-security-audit/
    - name: 'Mozilla Foundation Security Advisories'
      url: https://www.mozilla.org/en-CA/security/advisories/
    - name: 'Transparency'
      url: https://www.mozilla.org/en-CA/about/policy/transparency/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Usage data from the VPN app is off unless you turn it on. But the app always sends its version and your device details to improve the service, and only your Mozilla account’s data collection has a setting to turn off.'
      sources:
        - url: https://www.mozilla.org/en-CA/privacy/subscription-services/
          quote: 'Interaction data collection is disabled by default.'
        - url: https://www.mozilla.org/en-CA/privacy/subscription-services/
          quote: 'For VPN, Mozilla also receives information about the installed version of your Mozilla VPN client software, and the devices they are installed on, including their operating systems and hardware configuration. We use technical data to improve performance and stability for our users, and to measure the services’ performance.'
        - url: https://www.mozilla.org/en-CA/privacy/mozilla-accounts/
          quote: 'You can update your Mozilla accounts data collection settings at any time.'
      action:
        name: 'Your Mozilla account’s data settings'
        url: https://support.mozilla.org/kb/firefox-accounts-managing-account-data
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'To see which of its ads work, it sends which ad you came from and your device details to Adjust, a marketing company, though not your IP address. Its privacy notice gives no way to turn this off.'
      sources:
        - url: https://www.mozilla.org/en-CA/privacy/subscription-services/
          quote: 'In addition, to help understand the effectiveness of our marketing campaigns, Mozilla may receive your IP address in addition to campaign data and referral data like what ad campaigns you engaged with and your operating system, device type, device identifiers, and operating system version.'
        - url: https://www.mozilla.org/en-CA/privacy/subscription-services/
          quote: 'Mozilla shares this with Adjust, but we do not share or store your IP address.'
      action:
        name: 'Your privacy rights (its privacy notice)'
        url: https://www.mozilla.org/en-CA/privacy/subscription-services/
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: good
      reason: 'No ads in the VPN. Its websites ask before setting any cookies beyond the ones they need, and Mozilla says it doesn’t follow you across other sites to target ads.'
      sources:
        - url: https://www.mozilla.org/en-CA/products/vpn/
          quote: 'In addition to Cookies necessary for this site to function, we’d like your permission to set some additional Cookies to better understand your browsing needs and improve your experience.'
        - url: https://www.mozilla.org/en-CA/privacy/websites/
          quote: 'Mozilla does not track users across third-party websites to provide targeted advertising.'
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy notices and privacy policy don’t mention AI training.'
      pages:
        [
          https://www.mozilla.org/en-CA/privacy/subscription-services/,
          https://www.mozilla.org/en-CA/privacy/mozilla-accounts/,
          https://www.mozilla.org/en-CA/privacy/,
        ]
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data as long as it needs it. Your IP address stays in its server logs for 90 days, and usage data generally up to 25 months.'
      sources:
