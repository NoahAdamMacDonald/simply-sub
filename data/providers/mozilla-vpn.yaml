# Ways to pay (M11.5), read 2026-11-19: its subscription privacy notice names "Stripe, Apple, PayPal, or Google Pay"
# (Stripe is a processor, and "Apple" doesn't say whether it means Apple Pay or the App Store), and its terms Apple's
# and Google's in-app purchases. No page read names a card or its networks (the checkout and the help centre's payment
# article are behind a CAPTCHA), so no card and no acceptedNetworks (notes.md).
paymentMethods:
  - methods: [paypal, google-pay]
    page: 'Mozilla Subscription Services Privacy Notice'
    url: https://www.mozilla.org/en-CA/privacy/subscription-services/
    quotes:
      - 'When you subscribe to services that require a paid subscription, you will send payment through one of our third-party payment providers: Stripe, Apple, PayPal, or Google Pay.'
  - methods: [app-store]
    page: 'Mozilla Subscription Services Terms of Service'
    url: https://www.mozilla.org/en-CA/about/legal/terms/subscription-services/
    quotes:
      - 'Purchasing through Apple or Google App Stores. If you purchased your subscription through in-app purchase from the Apple App Store or the Google Play Store, your payment is subject to the terms and conditions of the applicable app store.'

# Renewal day (M11.5), read 2026-11-19: its terms say only "Your plan renews automatically at the end of each term", no
# day; its help centre's billing articles couldn't be read (a CAPTCHA).
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.mozilla.org/en-CA/about/legal/terms/subscription-services/
  lastVerified: 2026-11-19

# Owner (M11.2), read 2026-11-19: its terms name Mozilla Corporation as the company that offers it, and Mozilla's
# governance page says whose it is: "The Mozilla Corporation , a wholly owned subsidiary of the Mozilla Foundation"
# (/about/governance/organizations/), a non-profit ("the non-profit Mozilla Foundation"). Not listed: no stock. Country:
# its Mozilla accounts privacy notice.
owner:
  name: Mozilla Corporation
  page:
    name: Mozilla Subscription Services Terms of Service
    url: https://www.mozilla.org/en-CA/about/legal/terms/subscription-services/
  quotes:
    - 'Mozilla Corporation offers various services to improve your privacy and security online, including Mozilla VPN and Firefox Relay (the “Services”).'
  country:
    code: US
    page:
      name: Mozilla Accounts Privacy Notice
      url: https://www.mozilla.org/en-CA/privacy/mozilla-accounts/
    quotes:
      - 'Mozilla Corporation (and our servers) are based in the United States.'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19
notes: >-
  Runs on Mullvad's servers: Mozilla sells it and runs the apps and accounts, and Mullvad carries the traffic. You
  need a Mozilla account. Prices are in US dollars in Canada, the UK and New Zealand, plus sales tax in Canada and the
  US; in Australia it's sold only in the app stores.

# General features, read 2026-11-19:
# - Platforms: "Supported on Windows, macOS, Android, iOS and Linux operating systems." (features page), and the
#   download page's "Install Firefox extension" ("Windows 10/11 (64-bit only)"): browser-extension.
# - Sign-in: a Mozilla account with a password ("During registration, you will be asked to set a password.", Mozilla
#   Accounts Terms of Service). No page read names its two-step sign-in (the help centre's articles are behind a
#   CAPTCHA), so only password.
# - App languages: the product page's language versions and picker (English, Français, Español, Deutsch, Italiano,
#   Português, 日本語, 한국어, 中文, हिन्दी, عربي among some sixty).
# - Support: "Plus 24/7 customer support." (features page) and "Please visit our forums for general support help."
#   (its privacy notice): community and around the clock; no page read names email or chat.
# - Open source: "Mozilla VPN is made with open-source code, meaning that all the code is publicly accessible."
#   (features page), linking github.com/mozilla-mobile/mozilla-vpn-client, and its terms: "The Mozilla VPN software is
#   made available to you under the terms of various open source licenses, including the Mozilla Public License." Its
#   servers are Mullvad's, whose server code isn't published, so open-clients (Mullvad's precedent).
# - No pause: its terms offer only cancelling. No parental controls: its ad and malware blocking is a setting you
#   choose.
features:
  platforms: [windows, macos, linux, ios, android, browser-extension]
  account.sign-in: [password]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, hi, ar]
  support.channels: [community, 24-7]
  software.open-source: open-clients
sourceRepo:
  url: https://github.com/mozilla-mobile/mozilla-vpn-client
  page:
    name: Features - Mozilla VPN
    url: https://www.mozilla.org/en-CA/products/vpn/features/
  quotes:
    - 'Mozilla VPN is made with open-source code, meaning that all the code is publicly accessible.'
  lastVerified: 2026-11-19

# Perks (M11.6): lines on its features page no feature describes.
perks:
  - id: firefox-site-settings
    name: Website-specific VPN settings in Firefox (Windows)
  - id: custom-dns
    name: Support for custom DNS

# Free use: none (its terms: "We only offer Mozilla VPN as a paid subscription service."). A 30-day money-back
# guarantee for first-time subscribers isn't free use.
freeUse:
  kind: none
  pages:
    - https://www.mozilla.org/en-CA/about/legal/terms/subscription-services/
    - https://www.mozilla.org/en-CA/products/vpn/
  lastVerified: 2026-11-19

# VPN features, read 2026-11-19 on its features page unless named:
# - Mullvad's servers: "Mozilla VPN is a Virtual Private Network in partnership with Mullvad . It keeps your internet
#   traffic private from your internet service provider by encrypting and routing it through our partner’s networks
#   instead." (its terms); the features page's "See our list of servers." links mullvad.net/servers/.
# - Devices: "Device Limit. When your subscription is active, you can connect up to 5 devices to Mozilla VPN." (terms).
# - Unlimited traffic: "No bandwidth restrictions or throttling" and "Including no data cap or speed limit.", so its
#   monthly VPN data is unlimited.
# - Server countries: "More than 500 servers in 30+ countries": 30, the figure it gives (its server-list link is
#   Mullvad's list of every Mullvad server, not Mozilla VPN's, notes.md).
# - Protocols: "Mozilla VPN uses Wireguard ™, one of the most performant VPN protocols." No other protocol or
#   obfuscation on any page read.
# - Split tunnelling: "Easily exclude apps from VPN protection ... Available in Windows, Android and Linux devices."
# - Multi-hop: "Our multi-hop feature gives you an extra security boost."
# - Content blocking: "Mozilla VPN helps you automatically block ads and ad trackers from seeing your online
#   activity." and "Mozilla VPN prevents you from downloading malware from known unsafe sources."
# - No-logs: "We never log, track or share your network data", and "No logs of your network activity are maintained by
#   either Mozilla nor our partner Mullvad when you’re using the Mozilla VPN service in any circumstance." (privacy
#   notice). Its server logs keep your IP address for 90 days (privacy notice): service.activity-logging grades that.
# - Audits: apps only. Cure53's "Pentest-Report Mozilla VPN Apps & Clients 03.2021" (the report its features page
#   links, read with pdftotext) tested the macOS, Linux, Windows, iOS and Android apps, as did its first review in
#   August 2020; no audit of Mozilla's servers or of the no-logs promise. Mullvad's audits are Mullvad's.
# - Not anonymous: "These services require a Mozilla account, which sends Mozilla your email address, locale, and IP
#   address." (privacy notice).
# - The VPN batch's new features: no Mozilla page says its servers run from memory only (Mullvad's own pages do, but
#   they're Mullvad's), so vpn.ram-only-servers is false; nothing connects your own devices to each other (vpn.mesh
#   false).
# - No page read offers a kill switch, port forwarding, Tor over VPN or a P2P policy, so they're left out.
# Speeds: "Fast network speeds even while gaming" (features page), no figure.
plans:
  - id: mozilla-vpn.vpn
    name: Mozilla VPN
    link: https://www.mozilla.org/products/vpn/
    features:
      vpn.included: true
      vpn.devices: 5
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 30
      vpn.protocols: [wireguard]
      vpn.split-tunneling: true
      vpn.multi-hop: true
      vpn.content-blocking: [ads, trackers, malware]
      vpn.no-logs-policy: true
      vpn.independent-audits: [apps]
      vpn.anonymous-signup: false
      vpn.ram-only-servers: false
      vpn.mesh: false
      account.pause: false
      account.parental-controls: false
    perks: [firefox-site-settings, custom-dns]
    notes: '5 devices on Mullvad’s servers in more than 30 countries. The yearly plan costs half the monthly price over a year. In Australia you subscribe in its mobile app.'
    prices:
