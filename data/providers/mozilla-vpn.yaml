# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1). vpn.mozilla.org redirects to
# www.mozilla.org/products/vpn/, whose pricing block prices by where the visitor is: read with Edge and a plain fetch
# from Canada (en-CA, "US$9.99/month + tax", the page's data "data-country-code="CA"" and "'currency' : 'USD'"), and
# with Edge (the page) and a plain fetch (its data) through a US, UK, Irish, Australian, New Zealand, German, French,
# Dutch, Spanish and Italian exit (en-US, or en-GB where its US-dollar prices read "US$"). Each country's data names the
# country (data-country-code) and the currency: USD in the US, Canada, the UK and New Zealand, EUR in the euro
# countries. Australia's block shows A$ prices with "Sign up for a Mozilla VPN subscription on your mobile device" and
# app store links instead of the web checkout: Australians buy it in Apple's and Google's stores. Its features, download
# page, terms and privacy notices with a plain fetch from Canada.
# Regular prices: each country's Monthly card ("US$9.99/month + tax") and Annual card ("US$4.99/month + tax", "Save
# 50%", "US$59.88 total + tax"). The yearly price is the plan's own, not a first-term offer: no page says the first
# year renews at another price, and the page's data gives the yearly plan's "discount" as 60.00, the saving on twelve
# months (12 × 9.99 = 119.88). The checkout's "renews at" line couldn't be read: payments.firefox.com hands off to
# accounts.firefox.com, which showed a CAPTCHA (not solved), notes.md. Canada's and the US's cards say "+ tax"; the
# other countries' cards say nothing of tax, so no price is tax-included.
# Where it's sold: its terms' list, below (availableIn).
# Region checklist for CA and US, 2026-11-19: 1. hreflang links name languages (en-CA, en-US, en-GB...), and a locale
# doesn't change the price ("?geo=" didn't either); 2. no country or currency picker; 3. its pricing data names the
# country and currency (data-country-code="CA", 'currency' : 'USD'); 4. the checkout hands off to a sign-in page behind
# a CAPTCHA: not opened further; 5. its help centre (support.mozilla.org) showed a CAPTCHA to Edge, a plain fetch and
# Mullvad Browser, and the Internet Archive answered 429; 6. Edge, a plain fetch, and each country's exit; 7. no bill
# offered.
# Bundles: Firefox Relay's premium page sells "Limited-time only: Relay Premium + Mozilla VPN for $6.99/month" ($83.88
# billed yearly): a limited-time deal with Firefox Relay, which isn't in the catalog yet, so it waits (notes.md).
# Mozilla Monitor is free now ("We offer Mozilla Monitor as a free service", its terms). Official resellers: none; no
# page names a shop. Partners, not listed: Mullvad runs its servers ("Mozilla VPN is a Virtual Private Network in
# partnership with Mullvad"), and Apple's App Store and Google Play bill it in the apps (a way to pay).
# Free use: none ("We only offer Mozilla VPN as a paid subscription service.", its terms).

# Coverage: mozilla-vpn.* in AT, BD, BE, BR, BG, CL, CO, HR, CY, CZ, DK, EG, EE, FI, GR, HU, IN, ID, KE, LV, LT, LU,
# MY, MT, MX, MA, NG, NO, PL, PT, RO, SA, SN, SK, SI, SG, ZA, KR, SE, CH, TW, TH, TR, UG, UA and VN: sold there (its
# terms' list), but only the research regions (CA, US, GB, IE, AU, NZ, DE, FR, NL, ES, IT) were read, each through its
# own country's exit, since the page prices by where the visitor is (read 2026-11-19).

id: mozilla-vpn
name: Mozilla VPN
aliases: [firefox vpn, mozilla vpn]
website: https://vpn.mozilla.org
# vpn.mozilla.org redirects to www.mozilla.org/products/vpn/, and its terms, privacy notices, help centre and blog are
# on mozilla.org's subdomains.
domains: [mozilla.org]
category: vpn
spendCategory: software
