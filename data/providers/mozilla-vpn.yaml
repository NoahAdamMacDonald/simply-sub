# Spain, Sweden, Switzerland, Taiwan, Thailand, Türkiye, Uganda, Ukraine, the United Kingdom, the United States, and
# Vietnam." (Mozilla Subscription Services terms, effective September 16, 2026, read 2026-11-19.) Its help centre's
