  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It studies what you watch to track how its shows do. Stopping that takes a request to its privacy team.'
      sources:
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'de prestaties van de content van SkyShowtime te volgen en registreren (door het kijkgedrag van gebruikers te analyseren)'
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'U heeft het recht uw gegevens in te zien, te corrigeren, te laten verwijderen, te laten overdragen, de verwerking ervan te beperken'
      action:
        name: 'Your privacy rights (in Dutch)'
        url: https://www.skyshowtime.com/nl/privacy
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: neutral
      reason: 'It shares your details with Comcast and Paramount companies for marketing, and with ad and social-media partners. Your account settings stop the marketing and social-media ads; ads picked for you need your cookie consent.'
      sources:
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'Delen we uw persoonlijke informatie met externe partijen (waaronder Comcast Group- en Paramount-bedrijven) om hen in staat te stellen u marketingberichten te sturen, in overeenstemming met uw marketingvoorkeuren en abonnementstype'
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'U kunt zich te allen tijde afmelden voor deze gerichte reclame via uw SkyShowtime-accountinstellingen.'
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'Als u een abonnement met reclame heeft en cookies heeft ingeschakeld om gepersonaliseerde reclame te ontvangen (met uw toestemming (op basis van cookie-instellingen) van ons en onze externe partners)'
      action:
        name: 'Your account settings (in Dutch)'
        url: https://www.skyshowtime.com/nl/help/article/things-you-can-do-in-your-skyshowtime-account
      lastVerified: 2026-11-09
    - topic: privacy.ads-tracking
      tier: neutral
      reason: 'It targets ads at you on social media unless you turn that off in your account settings; on Standard with ads, it picks ads for you only if you accept its cookies.'
      sources:
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'Aanbieden van doelgerichte reclame op sociale media en gerelateerde platform'
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'U kunt zich te allen tijde afmelden voor deze gerichte reclame via uw SkyShowtime-accountinstellingen.'
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'Als u een abonnement met reclame heeft en cookies heeft ingeschakeld om gepersonaliseerde reclame te ontvangen (met uw toestemming (op basis van cookie-instellingen) van ons en onze externe partners)'
      action:
        name: 'Your account settings (in Dutch)'
        url: https://www.skyshowtime.com/nl/help/article/things-you-can-do-in-your-skyshowtime-account
      lastVerified: 2026-11-09
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy doesn’t say whether what you write or upload trains AI.'
      pages: [https://www.skyshowtime.com/nl/privacy]
      lastVerified: 2026-11-09
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it decides it needs it or the law lets it, and names no periods.'
      sources:
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'We bewaren uw persoonsgegevens zo lang als noodzakelijk of toegestaan, daarbij rekening houdend met de doeleinden waarvoor ze werden verkregen en in overeenstemming met de geldende wetgeving.'
      lastVerified: 2026-11-09
    - topic: privacy.data-deletion
      tier: good
      reason: 'You can ask with its online form to close your account and delete your data, and it takes up to 30 days.'
      sources:
        - url: https://www.skyshowtime.com/nl/help/article/how-do-i-delete-my-skyshowtime-account-and-data
          quote: 'Je kunt de definitieve sluiting van je account of toegang tot je persoonsgegevens aanvragen door het SkyShowtime-formulier voor het aanvragen van toegang tot gegevens in te dienen.'
        - url: https://www.skyshowtime.com/nl/help/article/how-do-i-delete-my-skyshowtime-account-and-data
          quote: 'Vanaf het moment dat je je e-mailadres verifieert, kan het tot 30 dagen duren voordat je verzoek is verwerkt.'
      action:
        name: 'How to close your account (in Dutch)'
        url: https://www.skyshowtime.com/nl/help/article/how-do-i-delete-my-skyshowtime-account-and-data
      lastVerified: 2026-11-09
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask with the same form for your data to be passed on to you.'
      sources:
        - url: https://www.skyshowtime.com/nl/help/article/how-do-i-delete-my-skyshowtime-account-and-data
          quote: 'Overdragen van je persoonsgegevens'
      action:
        name: 'Its data request form (in Dutch)'
        url: https://www.skyshowtime.com/nl/help/article/how-do-i-delete-my-skyshowtime-account-and-data
      lastVerified: 2026-11-09
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over information when the law, a court or the police require it, or when it reasonably believes they do, and says nothing more.'
      sources:
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'We delen uw persoonsgegevens als we hiertoe verplicht zijn om te voldoen (en/of wanneer we redelijkerwijs menen dat we verplicht zijn om te voldoen) aan een wettelijke of regelgevingsverplichting, zoals een gerechtelijk bevel, regelgevings- of rechtshandhavingsacties'
      lastVerified: 2026-11-09
    - topic: privacy.data-location
      tier: good
      reason: 'Your information stays in the EU or countries the EU says protect it enough; anywhere else, only under the EU’s approved contract terms.'
      sources:
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'Ter bescherming van uw persoonsgegevens zal SkyShowtime uw persoonsgegevens alleen doorgeven binnen de Europese Unie en naar landen waarvan de Europese Commissie heeft bepaald dat er sprake is van een afdoende beschermingsniveau.'
        - url: https://www.skyshowtime.com/nl/privacy
          quote: 'Wanneer dit niet mogelijk is, gebruiken we een modelcontract dat door regelgevingsautoriteiten, zoals de Europese Commissie, is goedgekeurd.'
      lastVerified: 2026-11-09
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with an email address and a password, and the payment page asks for your name and address.'
      sources:
        - url: https://www.skyshowtime.com/nl/help/article/how-to-sign-up-to-skyshowtime
          quote: 'Maak een account aan door je e-mailadres en wachtwoord in te vullen.'
        - url: https://www.skyshowtime.com/nl/help/article/how-to-sign-up-to-skyshowtime
          quote: 'Typ op de pagina met betalingsgegevens je naam en adres in en kies je'
