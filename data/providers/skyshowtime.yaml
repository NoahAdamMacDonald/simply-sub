          quote: 'Om uw abonnement op SkyShowtime op te zeggen, gaat u naar uw Accountpagina op de SkyShowtime-website.'
        - url: https://www.skyshowtime.com/nl/terms
          quote: 'Tenzij we u anders hebben meegedeeld, blijft u bij opzegging toegang houden tot SkyShowtime tot het einde van de periode waarvoor u heeft betaald'
