# exit: SkyShowtime, for the catalog's countries that sell it, the Netherlands and Spain (the owner's choice of
# 2026-11-04). Its pages are each country's language.
# Pricing: the Netherlands' help article "Abonnementen en kosten" (its table of plans, and "Standaard met reclame 6.99
# EUR per maand 55.99 EUR per jaar", "Standaard 9.99 EUR per maand 79.99 EUR per jaar", "Premium 13.99 EUR per maand
# 109.99 per jaar", as skyshowtime.com/nl's plan cards), and Spain's plan picker on skyshowtime.com/es ("Estándar con
# anuncios" 5,99 € al mes or 47,99 € al año, "Estándar" 8,99 €/mes and "Prémium" 13,99 €/mes, monthly only: Spain's help
# article still lists 71.99 and 109.99 EUR a year for those two, which the picker doesn't sell). First-term offers are
# left out: the Netherlands' "6-maandendeal" and Spain's "6 meses" renew monthly, and Spain's "Mensual superahorro"
# plans (6,69 € and 10,49 € a month for 12 months, 6,99 € and 10,99 € for 6) renew at the monthly price.
# Region checklist, 2026-11-09: 1. skyshowtime.com/<country> and its help centres; 2. the plan picker's tabs and
# periods; 4. the plan cards, never past them; 6. Edge, through each country's exit. Its where-can-i-stream page lists
# where it's sold; Kosovo, which has no ISO code, is left out of availableIn.
# Bundles: none on its pages. Resellers: none; its help centre's telecom providers (in the Netherlands and Spain among
# others) sell it in their own bundles, partners, not resellers.

# Coverage: skyshowtime.* in AL, AD, BA, BG, HR, CZ, DK, FI, HU, ME, MK, NO, PL, PT, RO, RS, SK, SI and SE: sold there,
# but outside the catalog's countries, so not read (the owner's choice of 2026-11-04: the Netherlands and Spain only).

id: skyshowtime
name: SkyShowtime
aliases: [sky showtime]
website: https://www.skyshowtime.com
category: streaming
spendCategory: streaming
