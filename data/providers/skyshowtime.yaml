        - https://www.skyshowtime.com/nl/privacy
      lastVerified: 2026-11-09
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel on your account page at any time, at no cost, and keep watching until the end of the time you paid for.'
      sources:
        - url: https://www.skyshowtime.com/nl/terms
          quote: 'U kunt ons Contract en uw abonnement om welke reden dan ook en op elk moment opzeggen door de terugkerende kosten van uw abonnement stop te zetten, zonder extra kosten of annuleringskosten.'
