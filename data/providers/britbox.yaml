# General features, read 2026-11-13. Platforms: "Stream using a web browser on your Mac or Windows desktop/laptop",
# Android TV, Apple TV, Fire TV, Roku, Samsung, LG, Hisense and Vizio TVs, Xfinity and Rogers devices, and its iPhone,
# iPad and Android apps (What devices can I use to watch BritBox?); no consoles ("using a web browser via a Smart TV, game
# console ... is not supported"). Sign-in: "Enter your email address and password", or "Enter the 4-digit code sent to
# the email address you used to sign in" (How do I log into my account?); TVs pair with a code entered on
# britbox.com/activate, where you sign in with your password. App languages: English (its sites are en-us, en-ca and
# en-au). Support: "please contact our Customer Care team by email or by initiating a chat" (Why am I having trouble
# receiving or using my BritBox sign-in code?).
features:
  platforms: [web, ios, android, tv]
  account.sign-in: [password, email-code]
  languages.interface: [en]
  support.channels: [email, chat]

