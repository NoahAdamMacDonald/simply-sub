# Terms and policies (BLUEPRINT §4.10), read 2026-11-13: its Terms & Conditions for Canada (britbox.com/ca, "Last
# amended on 19 August 2025", Ontario law) and for the US (through a US exit, the same date, with an arbitration clause,
# section 19), its Privacy Policy ("Last amended 19 August 2025", BritBox, LLC's, the same for both countries), which the
# terms incorporate; Australia's own Terms of Use and Privacy Policy (through an Australian exit, "Last amended on 3 June
# 2025", The BritBox Australia Partnership's, New South Wales law); the sign-up page's first step (an email address),
# typing nothing, whose US line says "By clicking 'Continue', you agree to the BritBox terms and conditions and privacy
# policy."; and both help centres' billing, cancelling, refunds, trial, plan change, downloads and devices articles.
# Australia's privacy policy gives the same grades as North America's ("We won't sell or rent your data to others." but
# it shares hashed customer lists with social networks, opt-out by email): no ratings of its own. Ratings for the whole
# provider follow the worst of the North American documents; Canada's and Australia's better clauses are ratings of
# their own. Not read: the Nordic countries' terms (not a research region), the partners' terms (Amazon, Apple, Roku,
# Google), the deletion form and the California notice (linked from the policy, not opened). Its terms forbid reverse
# engineering its apps (legal.licence isn't a streaming topic). Calibrated against STARZ, Peacock and Hayu.
policies:
  links:
    - name: 'Terms & conditions (Canada)'
      url: https://www.britbox.com/ca/terms-and-conditions
    - name: 'Terms & conditions (US)'
      url: https://www.britbox.com/us/terms-and-conditions
    - name: 'Terms of use (Australia)'
      url: https://www.britbox.com/au/terms-and-conditions
