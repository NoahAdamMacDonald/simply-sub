# Researched by hand on 2026-11-13 (M11.15, streaming batch 7), read with Edge from Canada, the US's pages through a US
# exit, Australia's through an Australian exit and britbox.com through a UK exit; its two help centres (help.britbox.com
# for North America and the Nordic countries, britboxaustralia.zendesk.com for Australia) through their Zendesk API, every
# article. Pages, each quoted where it's used:
# Pricing: its help centre's "How much is a BritBox subscription?", one list by country: "Canada $10.99 a month, $109.99 a
# year or $149.99 a year for Premier. GST is additional and not included in the subscription price." and "United States
# $10.99 a month, $109.99 per year or $149.99 a year for Premier. Taxes may be added depending on the state." The same
# three cards on britbox.com/ca (its page data: "Price Increase 2024 - Monthly (CA)", "price":10.99,"currency":"CAD", and
# the annual's 109.99 CAD) and on britbox.com through a US exit (its data: "(US)", "currency":"USD"); Premier's $149.99
# on watch.britbox.com/ca/premier and /us/premier and on each country's sign-up page (its address names
# "country=ca" or "country=us"). Premier "is an annual-only plan" (What is BritBox Premier?). Australia's own help
# centre: "BritBox in Australia is $13.99 a month, or $139.99 a year. GST is included in the subscription price.", the
# same as britbox.com/au through an Australian exit ("$13.99/month", "$139.99/year"); that page's data still lists older
# AUD 8.99 and 89.99 plans its cards don't show, so the cards and the help centre decide. The annual cards' "Get 12
# months for the price of 10" describes the regular yearly price, and the 7-day trial isn't a price. Australia's GST
# words ("GST is included in the subscription price.") don't fit core's tax wording ("GST is included" with a word
# between), so no taxIncluded: it changes nothing, since tax is added only in Canada and the US.
# Region checklist for CA and US, 2026-11-13: 1. its hreflang links (britbox.com for en-us, /ca, /au, /fi, /no, /se,
# /dk; a country path read from elsewhere redirects to the reader's own, /au to /ca from here); 2. no picker; 3. each
# page's plan data names its country and currency; 4. the sign-up page's first step (an email address), typing
# nothing; 5. both help centres' price and tax articles; 6. Edge from here and through US, Australian and UK exits, and a
# plain fetch; 7. no bill offered. The UK: not sold ("Unfortunately, BritBox is not currently available where you are.",
# britbox.com/gb/locationnotvalidated through a UK exit, 2026-11-13; ITVX is a separate provider, not drafted here).
# Not listed: gift subscriptions (US and Canada, prepaid gifts of a plan) and US gift cards (up to $200), which pay for a
# plan rather than being plans.
# Bundles: none sold by BritBox. Amazon's Prime Video Channels sells US bundles with BritBox (Hallmark+, MGM+ and BBC
# Select at $13.99 a month, Wonder Project $14.99, STARZ $17.99, the "Amazon Super Bundle" $29.99) and The Roku Channel
# two (BBC Select and STARZ), "exclusively through Amazon Prime Video Channels" or "through The Roku Channel" (its help
# centre's bundle articles): partners' products, not listed. Official resellers: none; Amazon, Apple TV Channels, The
# Roku Channel, Google Play and Apple's App Store bill it themselves, and Comcast's Xfinity, Pluto TV (a free US channel
# of a few shows) and, in the Nordic countries, Ruutu+, Telenor, Telia, TV2 and TV4: partners, noted, not listed.
# Features, read 2026-11-13: "BritBox is ad-free." (Are there ads or commercials?); standard plans "supports 2 concurrent
# streams" and Premier "allows you to stream on up to 4 devices at the same time" (Can I stream BritBox Premier on
# multiple devices?); "In the United States and Canada, 4K UHD is available to Premier subscribers." (Where can I watch in
# 4K UHD?), and the standard plans' quality: "BritBox streams in HD (High Definition)" (its streaming terms article), no
# resolution, so 720p (HD), inferred as Hayu's; downloads for Premier only in North America, "Downloads can be spread
# across up to 5 different devices"; "BritBox doesn’t offer separate user profiles at the moment"; parental controls
# with a four-digit PIN and viewing restrictions (How do I enable parental controls?); "BritBox subscriptions cannot be
# paused or placed on hold". BritBox Live, a scheduled stream of its own shows in the US only, isn't a TV channel, so no
# streaming.live there. Australia's plans differ: "Mobile downloads" and "Up to Full-HD video quality" (its cards; its 4K
# article says "some shows and films in UHD", but the cards that sell the plan say Full HD), "The maximum number of
# devices allowed is four.", three live channels (BBC First, BBC Entertain and BBC Select, What are the BBC Live
# Channels?), so Australia's is a plan of its own. What it streams: "classic dramas and comedies to fresh originals and
# day-of-UK soaps" (What is BritBox?), "shows and films", and BBC Select's "hundreds of documentaries and factual
# programming" (Premier, and a live channel in Australia); none of your own media.
# Free use: none: its plans start with a 7-day trial that turns into the plan, and the free BritBox channel on Pluto TV is
# Pluto TV's ("Pluto TV free streaming service with ads/commercials", Is the BritBox channel on PlutoTV the same as
# subscribing to BritBox?).

# Coverage: britbox.* in DK, FI, NO and SE: sold there (its country list), but outside the catalog's research regions, so
# not priced here; its prices article lists them (Denmark 79 DKK a month and 599 DKK a year, Finland €7.99 and €59.99,
# Norway 89 NOK and 699 NOK, Sweden 89 SEK and 695 SEK, "VAT Included."), with 4K, downloads and up to 4 devices (2 in
# Sweden), and Danish and Finnish annual plans that don't renew on their own: a plan of their own when they're read.

# Coverage: britbox.standard and britbox.premier in AU: Australia sells its own plan, britbox.australia, with downloads,
# Full HD and live channels, and no Premier ("available to customers in the United States and Canada", What is BritBox
# Premier?).

# Coverage: britbox.australia in CA and US: North America sells britbox.standard and britbox.premier instead.

