      url: https://help.britbox.com/hc/en-us/articles/360047421454-Can-I-watch-on-multiple-devices
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It studies what you watch and do to predict things about you, and buys more data about you from data sellers. You can limit cookies only device by device and browser by browser.'
      sources:
        - url: https://www.britbox.com/ca/privacy
          quote: 'Data we infer about you: We use information we know about you and how you use the BritBox services to predict things about you.'
        - url: https://www.britbox.com/ca/privacy
          quote: 'We may purchase data from specialist data resellers, including demographic information, publicly available information, purchase data and advertiser data'
        - url: https://www.britbox.com/ca/privacy
          quote: 'Your selections are specific to the device, website, and browser you are using.'
      action:
        name: 'Its privacy choices'
        url: https://www.britbox.com/ca/privacy
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your information across the BBC’s companies for marketing and ads, and gives social networks a scrambled copy of its customer list to show you ads. You can stop the list sharing only by emailing it.'
      sources:
        - url: https://www.britbox.com/ca/privacy
          quote: 'your information may be shared between companies in the BBC group (including BBC Public Service and BBC Studios companies such as UKTV and bbc.com) for the purposes of research, analysis, marketing and ad-serving.'
        - url: https://www.britbox.com/ca/privacy
          quote: 'You can opt-out of your email address being included within the customer lists we share with social media services and other networks to market our service as described in section 3, by contacting us as follows:'
      action:
        name: 'How to opt out (its privacy policy)'
        url: https://www.britbox.com/ca/privacy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'BritBox has no ads, but ad companies track you on its site and elsewhere to show you its ads on other sites. You can turn that off only device by device and browser by browser.'
      sources:
        - url: https://www.britbox.com/ca/privacy
          quote: 'These companies may use tracking technologies to collect information about your use of our services, which they use to target our marketing messages to you.'
        - url: https://www.britbox.com/ca/privacy
          quote: 'Your selections are specific to the device, website, and browser you are using.'
      action:
        name: 'Its cookie and advertising choices'
        url: https://www.britbox.com/ca/privacy
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you write or send trains AI; its terms only forbid others training AI on its shows and site.'
      pages: [https://www.britbox.com/ca/privacy, https://www.britbox.com/ca/terms-and-conditions]
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information while you use BritBox and for a while after you leave, for its own analysis and business, without saying how long.'
      sources:
        - url: https://www.britbox.com/ca/privacy
