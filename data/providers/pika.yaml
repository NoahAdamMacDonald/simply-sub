# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2), read with Edge from Canada (pika.art's pricing
# page in its Monthly and Yearly views with each FAQ answer opened, with a plain fetch of its HTML for the page's own
# plan data; its help centre at pika.art/faq with every answer opened; its support page's topics; its Terms of Service,
# Acceptable Use Policy, Privacy Policy and Your Privacy Choices; its download, MCP and sign-up pages) and through UK and
# German exits (the pricing page). Pages, each quoted where it's used:
# Pricing: pika.art/pricing, its "Pika plans at a glance": "Starter: $10/month billed monthly or $8/month billed annually
# ($96/year)", "Creator: $35/month billed monthly or $28/month billed annually ($336/year)", "Fancy: from $95/month billed
# monthly or from $76/month billed annually (from $912/year)". Fancy is a slider, not tiers: its "Monthly amount" runs in
# $1 steps from "$95/mo, 8,550 credits" to $880 ("$95–$880", "$76–$704" a month billed yearly), at "90 credits / $1";
# Fancy is priced here at its lowest amount, the range in its notes (notes.md). Its terms bill "in U.S. Dollars", and
# the UK and German exits got the same "$" prices as Canada: one US-dollar price list, GLOBAL. Its prices don't include
# tax ("All fees are exclusive of taxes.").
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang; 2. no country or currency picker; 3. the page's
# plan data names no currency or country; 4. checkout needs an account; 5. no prices or tax article in its help centre;
# 6. Edge and a plain fetch from Canada, and the UK's and Germany's exits, all show the same prices; 7. no bill offered.
# Not listed: the Free plan, which includes no credits ("Monthly credits 0 · credit packs only"), so nothing is free
# (freeUse, below); credit packs ("1,500 credits Buy for $25" and up, "a one-off purchase"), usage-billed; Team plans
# ("Team plan · 2 seat minimum"), Enterprise and the API ("API billing is separate from the Pika product"); the legacy
# Basic, Standard, Pro and Unlimited plans ("Basic, Standard, Pro and Unlimited are legacy individual plan names.",
# subscribers kept them: "Standard now appears as Starter and Pro as Creator"); its iOS app's App Store prices (a way to
# pay).
# Bundles: none on its pages or in a search. Official resellers: none; no page names a shop that sells it (its Referral
# Program pays users, no shop).

id: pika
name: Pika
aliases: [pika labs, pika art, pika.art]
website: https://pika.art
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help centre's "How do I cancel my subscription?" (Subscription, Adjust plan), with Apple's subscriptions for the
# iOS app.
cancelUrl: https://pika.art/faq
sources: { pricing: https://pika.art/pricing }

# Ways to pay (M11.5), read 2026-11-17: a card through Stripe on the web (its terms; "Manage in Stripe", its help
# centre) and Apple's billing in its iOS app (its support page). No page names the card networks, so no
# acceptedNetworks, and no other way to pay is named.
paymentMethods:
  - methods: [card]
    page: 'Terms of Service'
    url: https://pika.art/terms-of-service
    quotes:
      - 'We use Stripe, Inc. and its affiliates as our third-party payment service provider for payment processing, including card acceptance, settlement, and related services.'
  - methods: [app-store]
    page: 'Help & Support (Cancel plan)'
    url: https://pika.art/support
    quotes:
      - 'If you subscribed through our iOS app, your subscription page shows Billed through the App Store.'

# Owner (M11.2), read 2026-11-17: its terms name Mellis, Inc., in Palo Alto, California, as the company behind Pika. A
# private company: no page names a listing.
owner:
  name: 'Mellis, Inc.'
  page:
    name: Terms of service
    url: https://pika.art/terms-of-service
  quotes:
    - 'Mellis, Inc. (“Pika”, “we”, “us”, or “our”) provides access to our generative artificial intelligence platform and related services'
  country:
    code: US
    page:
      name: Terms of service
      url: https://pika.art/terms-of-service
    quotes:
      - 'The Service is operated by Mellis, Inc., 849 High St, Palo Alto, California 94301, USA.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its terms renew "at the end of each billing cycle" and its help centre "on their
# billing schedule", with no day named.
renewalAnchor:
  kind: not-stated
  pages:
    - https://pika.art/terms-of-service
    - https://pika.art/faq
  lastVerified: 2026-11-17

# Free use, read 2026-11-17: its Free plan is an account for buying credit packs, with no credits of its own ("The Free
# plan lets you buy credit packs without a monthly subscription. It doesn’t include a monthly credit allowance.", its
# help centre; the comparison table's "0 · credit packs only"), so nothing on Pika is free to use.
freeUse:
  kind: none
  pages:
    - https://pika.art/pricing
    - https://pika.art/faq
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on its pricing cards and comparison table: usage levels (perks, never features) and the
# commercial licence ("Starter, Creator, Fancy include a commercial license.").
perks:
  - id: commercial-license
    name: Commercial license
  - id: parallel-2-8
    name: 2 video · 8 image + audio in parallel
  - id: parallel-8-32
    name: 8 video · 32 image + audio in parallel
  - id: parallel-unlimited
    name: Unlimited parallel generations
  - id: priority-queue
    name: Priority queue
  - id: early-access-440
    name: Early access to new models (from $440/mo)

# AI features (the AI category's registry), read 2026-11-17 on its pricing page and help centre. Pika is an AI video,
# image and audio generator ("Pika is an AI video, image and audio platform."), with no chat assistant: its apps take a
# prompt ("Choose an app for what you want to make, add a prompt or your own media, and generate."). ai.assistant is
# set because the registry puts video, image and audio generation under it (notes.md).
# - Video, image and audio on every plan: "Pika is the creative platform that lets you create and edit videos, images,
#   and sound using AI."; "Use Music Studio for music, Speech Studio for voiceovers, and SFX Studio for sound effects."
#   Every card says "All models" ("All individual plans include access to all models.").
# - Models from several companies: "It runs Pika’s own models, Pika H3 Flex (open weights) and Pika 2.5, alongside
#   Seedance 2.5, Kling 4.0, Veo 3.1, Wan 3.0, MiniMax H3 and Gemini Omni."; "In apps with a model selector, you can
#   choose the model you want to use."
# - Projects: "Keep related work in projects and mark your favorites so they’re easy to find again." (help centre).
# - Not counted: Pika MCP lets other assistants use Pika ("Pika credits also work with the new Pika MCP."; its MCP page
#   lists ChatGPT, Claude and others), not Pika use MCP servers; the API is billed apart; Fancy's
#   "Early access to new models (from $440/mo)" is a perk, since Fancy is priced here at $95. No page offers chat, web
#   search, voice conversations, memory, reasoning, custom assistants, a coding or browser agent, scheduled tasks, deep
#   research or office apps; it keeps no chats.
# Creative features (the creative category's registry), read 2026-11-17:
# - Tools: video editing ("Can I edit a video I already have?" "Yes!": Swap Anything, Extend Video, Color Grade) and photo
#   editing ("Edit Image to change something in a photo you already have").
# - Highest video export 1080p: every plan has "All models", and its credits table prices Seedance 2.5 and Kling 4.0 at
#   "1080p · 5s"; no page offers 4K.
# - No watermark: "Every current plan, including Free, exports without a watermark." (its support page).
# - Generative credits a month: "600", "2,600" and "8,550" "credits / month" on its cards.
# General features, read 2026-11-17: the web and its iPhone app ("Pika - AI Video is the official Pika app: Every creation
# app and every model from pika.art, with the same account, on your iPhone."); no Android app on its pages. Sign-in:
# "Continue with Google", "Continue with Apple", "Continue with Discord", or an email address (its sign-up page); no page
# says how the email sign-in works, so only `sso` (Poe's precedent). App languages: no page lists them, and its pages
# have no other language versions, so none. Support: its support page's form ("tick this and a real person will pick it
# up"). No pause and no parental controls: its terms and help centre offer neither (18 and over: "you state that you are
# at least 18 years old").
features:
  platforms: [ios, web]
  account.sign-in: [sso]
  support.channels: [email]

