    - topic: privacy.ai-training
      tier: bad
      reason: 'What you upload and make trains Pika’s AI, with no way to turn it off, and its licence to do so never ends and can be passed on. Deleting your account only stops future training, as far as it can.'
      sources:
        - url: https://pika.art/privacy-policy
          quote: 'Where permitted by applicable law or with your consent, we may also use content you submit—including Inputs and Outputs—to improve our artificial intelligence models and related technologies.'
        - url: https://pika.art/terms-of-service
          quote: 'To the extent any rights in your Content are necessary for this use, you hereby grant Pika a nonexclusive, perpetual, irrevocable, worldwide, royalty-free, fully paid, transferable, sublicensable license to use, reproduce, analyze, and modify that Content for the purposes described above.'
        - url: https://pika.art/terms-of-service
          quote: 'Upon deletion of your Account, Pika will permanently delete all data associated with your AI Self and will use commercially reasonable efforts to exclude your Content from future model training; provided, however, that Pika may not be able to remove Content that has already been incorporated into trained models, and will continue using Content that has been anonymized or aggregated prior to deletion.'
      lastVerified: 2026-11-17
    - topic: privacy.content-access
      tier: neutral
      reason: 'Its systems and staff may look at what you upload and make, to enforce its rules. It says it keeps your information on secure servers, but not that your files are encrypted. (Training on it is graded under AI training.)'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'To the extent permitted by law, Pika may review or monitor Inputs and Outputs using automated or manual tools.'
        - url: https://pika.art/privacy-policy
          quote: 'Information you provide is stored on secure servers behind firewalls, access to personal information is limited to personnel who need it to perform their duties, and sensitive information (such as payment details) is transmitted using encryption technologies such as SSL.'
      lastVerified: 2026-11-17
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your information as long as it decides it needs it. Face and voice scans go within three years of deleting your account.'
      sources:
        - url: https://pika.art/privacy-policy
          quote: 'we will only retain your personal information for as long as necessary to fulfill the purposes we collected it for as set forth in this privacy policy, or as otherwise required for security, abuse prevention, billing, troubleshooting, or satisfying any legal, accounting, or reporting requirements.'
        - url: https://pika.art/privacy-policy
          quote: 'If you submit biometric information (such as facial scans or voice recordings), we retain that information only as long as necessary to fulfill the purpose for which it was collected or, at most, for three years after you delete your account, whichever is earlier.'
      lastVerified: 2026-11-17
