# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge: its Terms of Service (last
# modified 08/04/2026), which include its Acceptable Use Policy (last updated 05/16/2025: the same grades, no topic of its
# own beyond the terms' monitoring and termination) and each third-party model's own terms ("Model Terms", not read: no
# page lists them); its Privacy Policy (last modified 10/21/2026) and Your Privacy Choices, the two documents its sign-up
# page names ("By signing up you agree with our Terms of Service & Privacy Policies"); its help centre and support page.
# Its terms include Stripe's terms and privacy policy for payments (no topic). Its AI Self terms are pika.me's, another
# product.
policies:
  links:
    - name: Terms of service
      url: https://pika.art/terms-of-service
    - name: Privacy policy
      url: https://pika.art/privacy-policy
    - name: Your privacy choices
      url: https://pika.art/privacy-choices
    - name: Help centre
      url: https://pika.art/faq
    - name: Help & support
      url: https://pika.art/support
    - name: Pricing
      url: https://pika.art/pricing
    - name: Sign-up page
      url: https://create.pika.art/signup
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online from your Subscription page whenever you like, and keep your plan until the end of the time you paid for.'
      sources:
        - url: https://pika.art/faq
          quote: 'Go to Subscription, choose Adjust plan, and follow the cancellation option. Your plan stays active until the end of your current billing period, then moves to Free.'
        - url: https://pika.art/terms-of-service
          quote: 'You may cancel your subscription at any time through your account settings or by contacting support@pika.art.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back, but you keep your plan until the end of the time you paid for.'
      sources:
        - url: https://pika.art/faq
          quote: 'Subscription payments and credit packs are non-refundable. Cancelling stops your next renewal, and you can keep using your plan until the end of the period you’ve paid for.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you ahead of time before a big change to your plan’s price, without saying how long before, and it usually starts at your next renewal, so you can cancel first.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'Pika may modify the pricing or features of its Plans at any time. We will provide reasonable advance notice of any material changes to your Plan. Unless otherwise specified, any changes will take effect at the beginning of your next billing cycle.'
        - url: https://pika.art/terms-of-service
          quote: 'If you do not agree to the new pricing or terms, you must cancel your subscription before the next renewal to avoid incurring additional charges.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      tier: neutral
      reason: 'A trial turns into a paid plan on its own unless you cancel before it ends. It doesn’t say it reminds you first.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'At the end of the trial period, your Account will automatically convert to a paid subscription, and you authorize us to charge your selected payment method at the then-current subscription rate, unless you cancel before the trial ends.'
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      tier: neutral
      reason: 'It warns you before a renewal only where the law requires it; its privacy policy says it may send renewal notices.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'We will provide advance notice of any auto-renewal where required by applicable law.'
        - url: https://pika.art/privacy-policy
          quote: 'To communicate with you, including to provide you with notices about your account, including expiration and renewal notices, changes to our Service or any products or services we offer or provide through it, along with information, products, or services that you request from us.'
      lastVerified: 2026-11-17
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms add only taxes to the price, and say your bank may charge its own fees, but don’t say whether Pika charges any others.'
      pages:
        - https://pika.art/terms-of-service
        - https://pika.art/faq
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      tier: good
      reason: 'A move to a bigger plan starts at once, and a move to a smaller one at your next renewal, so you keep what you paid for. It doesn’t say how the upgrade is charged.'
      sources:
        - url: https://pika.art/pricing
          quote: 'An upgrade applies immediately. A downgrade is scheduled for the start of your next billing period, and you can undo it until then.'
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: poor
      reason: "Disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only by email within 30 days of signing up, and the class-action ban stays unless you opt out of both."
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'You and Pika are agreeing to give up any rights to litigate claims in a court or before a jury, or to participate in a class action or representative action regarding a claim.'
        - url: https://pika.art/terms-of-service
          quote: 'Your opt-out notice must be received by Pika within 30 days of the date you first registered for the Service or first agreed to these terms of service, whichever is earlier.'
        - url: https://pika.art/terms-of-service
          quote: 'However, if you opt out only of arbitration and not of the class action waiver, the class action waiver will still apply.'
      action:
        name: 'How to opt out of arbitration (Resolving Disputes)'
        url: https://pika.art/terms-of-service
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: poor
      reason: 'New terms apply as soon as it posts them, and if you keep using Pika, you’ve agreed to them.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'All changes are effective immediately when we post them and apply to all access to and use of the Service afterwards.'
        - url: https://pika.art/terms-of-service
          quote: 'Your continued use of the Service after the posting of revised terms of service means that you accept and agree to the changes.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: bad
      reason: 'It can close your account at any time for any reason or none, with or without warning, and gives no refund if it says you broke its rules.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'We may suspend or terminate your access to the Service, your AI Self, your Account, or any portion of it, at any time, for any reason or no reason, with or without notice.'
        - url: https://pika.art/terms-of-service
          quote: 'No refund will be provided if your Account is terminated for breach of these terms of service, the AUP, or any applicable Model Terms.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: poor
      reason: 'It may use, change and show what you upload to run, improve and promote Pika, and pass that right on, while your files are stored. It may also name you as a customer in its marketing unless you write to say no.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'By submitting User Content, you hereby grant Pika a worldwide, nonexclusive, royalty-free, transferable, sublicensable license to use, reproduce, modify, adapt, publish, translate, create derivative works from, distribute, perform, and display your User Content as necessary to operate, improve, and promote the Service.'
        - url: https://pika.art/terms-of-service
          quote: 'This license remains in effect for as long as your User Content is stored on the Service.'
        - url: https://pika.art/terms-of-service
          quote: 'Pika may identify you as a customer and use your name, logo, and a general description of your use of the Service in Pika’s marketing materials and customer lists. Pika will use commercially reasonable efforts to notify you of such use in advance. You may opt out of this use by notifying Pika in writing at support@pika.art.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: good
      reason: 'What Pika makes for you is yours, and paid plans may use it commercially.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'Pika does not claim ownership of any Inputs you submit or Outputs generated through your use of the Service. As between you and Pika, you retain all interest in those Outputs. To the extent Pika acquires any interest in the Outputs, we hereby assign all interest to you.'
        - url: https://pika.art/faq
          quote: 'If you’re on a paid subscription plan (Starter, Creator or Fancy), then yes!'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or stop any part of Pika at any time without warning, and gives no money back for time you’ve paid for. It tries to warn you 30 days before dropping a model you use.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'Pika may modify, update, or discontinue all or part of the Service at any time, with or without notice.'
        - url: https://pika.art/terms-of-service
          quote: 'Except as expressly provided in these terms of service or required by law, all subscription payments are non-refundable, and there are no refunds or credits for partially used periods.'
        - url: https://pika.art/terms-of-service
          quote: 'For generally available Pika models actively used in your Account, Pika will use commercially reasonable efforts to provide at least 30 days’ notice before discontinuing or materially reducing such models, unless doing so would create a security risk, violate law, or be technically infeasible.'
      lastVerified: 2026-11-17
    - topic: legal.inactivity
      tier: poor
      reason: 'It may close accounts that aren’t used and delete what’s in them, with no set waiting time or warning.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'Pika may establish general practices and limits concerning use of the Service, including limits on storage capacity, data retention periods, and account inactivity.'
        - url: https://pika.art/terms-of-service
          quote: 'You acknowledge that Pika may delete or disable access to User Content or terminate inactive accounts in accordance with these practices, and that Pika has no obligation to retain any User Content beyond the limits set by your Plan or applicable policies.'
      lastVerified: 2026-11-17
    - topic: legal.licence
      tier: poor
      reason: 'You may use Pika for yourself, and for business only on a paid plan. It forbids taking it apart or testing its security without its permission, even where the law would allow it.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'Pika hereby grants you a limited, nonexclusive, nontransferable, nonsublicensable, revocable license to access and use the Service solely for your personal, noncommercial use—except where your subscription Plan expressly permits commercial use.'
        - url: https://pika.art/terms-of-service
          quote: 'decompile, reverse engineer, disassemble, decode, or otherwise attempt to derive the source code or underlying ideas or algorithms of the Service;'
        - url: https://pika.art/terms-of-service
          quote: 'conduct or facilitate security testing, penetration testing, red-teaming, adversarial testing, or vulnerability assessments of the Service, any models, or any related systems without Pika’s prior written approval;'
      lastVerified: 2026-11-17
    - topic: service.software-control
      status: not-stated
      reason: 'Its terms don’t say whether its app updates itself or changes anything else on your device.'
      pages: [https://pika.art/terms-of-service]
      lastVerified: 2026-11-17
    - topic: service.account-sharing
      tier: bad
      reason: 'Only one person may use an account, so you can’t share it, even at home.'
      sources:
        - url: https://pika.art/terms-of-service
          quote: 'Unless your Plan expressly permits otherwise, each Account may only be used by a single individual, and the Service is for your personal, noncommercial use only.'
      lastVerified: 2026-11-17
    - topic: service.device-limits
      status: not-stated
      reason: 'Its terms and help centre set no limit on how many devices you use it on, and say nothing about downloads expiring.'
      pages:
        - https://pika.art/terms-of-service
        - https://pika.art/faq
      lastVerified: 2026-11-17
    - topic: security.practices
      tier: neutral
      reason: 'You can report a security problem to a person through its support page, but it names no outside audit or certification.'
      sources:
        - url: https://pika.art/support
          quote: 'Thank you for telling us. Security reports go straight to a person — never handled automatically, never closed by a bot.'
        - url: https://pika.art/support
          quote: 'Tick the box below and describe what you found. Include steps to reproduce it if you have them, and please do not post the details publicly before we have replied.'
      lastVerified: 2026-11-17
    - topic: privacy.data-collection
      tier: poor
      reason: 'It and other companies track how you use Pika, with Google Analytics among others. You can only limit it in part: block trackers in each browser, or use Google’s opt-out.'
      sources:
        - url: https://pika.art/privacy-policy
          quote: 'As you navigate through and interact with our Service, we and third parties may use Tracking Technologies to collect certain information about you and your equipment, browsing actions, and patterns.'
        - url: https://pika.art/privacy-policy
          quote: 'For example, we use Google Analytics to help us understand how our users use our Service'
        - url: https://pika.art/privacy-policy
          quote: 'You can opt out of Google Analytics here: https://tools.google.com/dlpage/gaoptout.'
      action:
        name: 'Your choices, in its privacy policy'
        url: https://pika.art/privacy-policy
      lastVerified: 2026-11-17
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your visits with Google and Meta for its ads, and you can turn that off only in each browser. The other AI companies whose models you pick use what you send under their own rules.'
      sources:
        - url: https://pika.art/privacy-choices
          quote: 'Pika shares information about your visits with Google and Meta to measure its ads.'
        - url: https://pika.art/privacy-choices
          quote: 'Your choice is saved in this browser only.'
        - url: https://pika.art/privacy-policy
          quote: 'These providers generally act as independent controllers of the information they receive, and process your Inputs and other content in accordance with their own terms, usage policies, and privacy notices.'
      action:
        name: 'Turn off ad measurement'
        url: https://pika.art/privacy-choices
      lastVerified: 2026-11-17
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Pika has no ads in the app, but it uses what you do to show you its ads on other sites. You can turn that off only browser by browser.'
      sources:
        - url: https://pika.art/privacy-policy
