# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2: AI audio), read with Edge from Canada (suno.com's
# pricing page in its Yearly and Monthly views with each FAQ answer opened, About, Safety, MCP, Voices and Studio pages,
# its Terms of Service, Privacy Notice, Cookie Policy and Community Guidelines), a plain fetch of the pricing page's HTML
# for its own pricing data, and its help centre (help.suno.com) with a plain fetch. Pages, each quoted where it's used:
# Pricing: suno.com/pricing prices by where the visitor is. Its own pricing data (initialPlans in the page) lists every
# plan's price in 16 currencies ("period_type":"month","currency":"CAD","price":14), and the page shows each country
# its own. Read 2026-11-17 through a US, a Canadian, a UK, an Australian, a New Zealand, an Irish, a German, a French, a
# Dutch, a Spanish and an Italian exit: the US and New Zealand $10 / $96 (the data's USD list, which has no NZD),
# Canada $14 / $132 (a bare $, the data's CAD list: no other currency in it has those amounts), the UK £8 / £72,
# Australia $15 / $144 (the data's AUD list), and the six euro countries 9 € / 86,40 €; Premier and Platinum the same way
# (US$30 / $288 and $120 / $1,200; CA$40 / $420 and $165 / $1,620; £22 / £216 and £90 / £900; A$45 / $420 and $175 /
# $1,740; 28 € / 264 € and 110 € / 1.080 €). The yearly cards show the monthly price struck through ("$10", "$8 / month",
# "Billed $96/year"); the Monthly view the monthly price alone. USD is everyone else's list (GLOBAL). Poland and Sweden
# get PLN and SEK lists, so the euro price isn't the whole EU's: each euro country read is its own region. No page says
# a price includes tax ("Paid plans auto-renew. Cancel anytime. Taxes calculated at checkout"; its VAT article adds VAT
# "at the rate determined by the purchasers country").
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang; 2. no picker; 3. the page's own data names CAD;
# 4. checkout needs an account; 5. the payments article lists CAD among its currencies; 6. Edge from this machine showed
# the USD list (its address placed elsewhere), so Canada was read through a Canadian exit; 7. no bill offered.
# Plans: Free, Pro, Premier and Platinum ("Suno offers three paid subscription plans to support the way you create: Pro,
# Premier, and Platinum", What paid subscription plans does Suno offer?). Platinum is sold on the web only ("Platinum is
# currently available to purchase on the web only."). Business and enterprise use go through sales: out.
# Not listed: add-on song credits, extra downloads and Visual credit packs bought as you go (usage-billed, out).
# Bundles: none on its pages. Official resellers: none; its privacy notice mentions partners that "resell our Services"
# but no page names one.
# Logo: suno.com's own icons (cdn-o.suno.com/favicon-512x512.png) are the source for data:icons.

id: suno
name: Suno
aliases: [suno ai]
website: https://suno.com
domains: [help.suno.com]
category: ai
spendCategory: software
billingCurrency:
  { GLOBAL: USD, CA: CAD, GB: GBP, AU: AUD, IE: EUR, DE: EUR, FR: EUR, NL: EUR, ES: EUR, IT: EUR }
# Its help article on cancelling a subscription bought from Suno (suno.com/account, "Cancel Subscription"); app store
# subscriptions are cancelled in the store (How do I cancel my subscription?).
cancelUrl: https://help.suno.com/en/articles/4797249
sources: { pricing: https://suno.com/pricing }

# Ways to pay (M11.5), read 2026-11-17 in its payments article: cards on Visa, Mastercard and American Express; Google
# Pay, Apple Pay, Cash App Pay and stablecoins in some regions; Korean cards, UPI, KakaoPay and NaverPay (Korea and
# India, `other`); and Google Play or the App Store in its apps (where PayPal can be used). Its other currencies
# ("USD AUD BRL CAD EUR GBP IDR INR JPY KRW MXN NOK PLN SEK THB TRY UAH") are price lists for countries the catalog
# doesn't read, so no `currencies` entry.
paymentMethods:
  - methods: [card, google-pay, apple-pay, cash-app, other]
    page: 'What types of payments are accepted?'
    url: https://help.suno.com/en/articles/2421185
    quotes:
      - 'We currently accept credit and debit cards from major payment networks such as VISA, Mastercard, and American Express. Stablecoin, Google Pay, Apple Pay, and Cash App Pay are available in some regions. Other available methods are Korean Card, UPI, KakaoPay, NaverPay.'
  - methods: [app-store]
    page: 'What types of payments are accepted?'
    url: https://help.suno.com/en/articles/2421185
    quotes:
      - 'you can set your default payment method for Google Play(Android) or the App Store(iOS) to PayPal'
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex]
    url: https://help.suno.com/en/articles/2421185
    quotes:
      - 'We currently accept credit and debit cards from major payment networks such as VISA, Mastercard, and American Express.'

# Owner (M11.2), read 2026-11-17: its terms name Suno Inc., and the same terms say where it's headquartered. Its About
# page names investors (Bond Capital, Menlo Ventures, Lightspeed and others) but no listing: private.
owner:
  name: 'Suno, Inc.'
  page:
    name: Terms of service
    url: https://suno.com/terms
  quotes:
    - 'Suno Inc. (“Suno,” “we,” “us,” or “our”) provides our services (described below) and related content to you'
  country:
    code: US
    page:
      name: Terms of service
      url: https://suno.com/terms
    quotes:
      - 'Suno is headquartered in the United States.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its terms charge "at the start of each new subscription period", and its credits
# article refreshes paid credits "at the same time as your original purchase" ("If you purchased on January 2nd at 3pm
# local time, your next replenishment will also happen at 3pm local time!"), which says the date you subscribed, but
# core's renewalWrittenAs doesn't read that wording yet: not-stated until it does (notes.md has the same-date block).
renewalAnchor:
  kind: not-stated
  pages:
    - https://suno.com/terms
    - https://help.suno.com/en/articles/2418177
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on its pricing cards and comparison table, its help centre's MCP and Bridge articles:
# usage and rights no feature describes. A plan's song credits a month are creative.ai-credits; Free's daily credits,
# Platinum's Visual credits (a second pool beside its song credits) and downloads stay perks.
perks:
  - id: daily-credits
    name: 50 song credits per day
  - id: visual-credits
    name: 20,000 visual credits a month
  - id: downloads-20
    name: 20 song downloads per month
  - id: downloads-60
    name: 60 song downloads per month
  - id: downloads-120
    name: 120 song downloads per month
  - id: commercial-use
    name: Commercial use rights
  - id: priority-queue
    name: Priority queue; up to 10 songs at once
  - id: stems-2
    name: 2 stem separation types (Auto; Split from mix)
  - id: stems-3
    name: 3 stem separation types (Auto; Split from mix and Advanced split)
  - id: own-voice
    name: Record, upload, and create with your own voice
  - id: custom-models
    name: Create custom models
  - id: uploads-30-min
    name: Upload up to 30 minutes of audio
  - id: advanced-editing
    name: Advanced editing (replace or add section)
  - id: studio
    name: Access to Suno Studio - now with MIDI, effects, automation, and design-your-own-plugins
  - id: bridge
    name: Suno Bridge (beta), for Ableton Live on a Mac
  - id: mcp
    name: Suno MCP (Beta), to make music from Claude, ChatGPT and other AI assistants

# AI features (the AI category's registry) and the creative category's, read 2026-11-17 in its pricing cards and
# comparison table, its terms and its help centre:
# - AI assistant on every plan: its terms' "Suno Chat" ("an artificial intelligence-powered chat assistant known as Suno
#   Chat", for making music only) and the table's "Co-write with Suno" row, included on every plan. Chats are kept on
#   its servers: its privacy notice collects "Interactive Chat Information" ("we collect any information submitted
#   through such interactions").
# - Music and voice generation on every plan: songs, and Speech on its apps ("Speech (beta) is available on all Suno
#   plans in the Suno app for iOS or Android").
# - Early access on the paid plans: "Early access to new features" on Pro, Premier and Platinum, not Free.
# - Image and video generation on Platinum only: its "20,000 visual credits a month". Suno Visuals is open to anyone who
#   buys Visual credits ("Anybody can buy Visuals credits."), but only Platinum includes them (notes.md, as Venice's
#   pay-with-credits API).
# - Creative tools: audio and music production on every plan (creating, remixing, extending and uploading songs; Suno
#   Studio, "A browser-based studio suite", on Premier and Platinum is a perk).
# - Generative credits a month on the paid plans: "2,500 song credits per month", "10,000 song credits per month" and
#   "15,000 song credits per month" on its cards.
# - Not offered: web search, voice conversations, memory, projects, reasoning, a browser agent, code completion, models
#   from other companies (its music models are its own; Visuals' "H3 Move" is "based on H3 from MiniMax" and not picked),
#   API credits. Its MCP server lets other assistants use Suno, the reverse of the registry's MCP servers (an assistant that connects to them),
#   so it's a perk (notes.md).
# General features, read 2026-11-17: the web and its apps ("Full creative experiences on web, iOS and Android", About);
# sign-in with a phone number and a text message code, or Apple, Discord, Facebook, Google or Microsoft ("Instead, we use
# Single Sign On (SSO) with connected logins from Apple, Discord, Facebook, Google, and Microsoft.", How do I log in?);
# its language menu lists English only; support by email only ("the only official support contact for Suno support is
# support@suno.com", its Discord "is not considered an official support channel"). No pause and no parental controls:
# its terms and help centre offer neither (13 and over, under 18 with a parent's consent).
features:
  platforms: [web, ios, android]
  account.sign-in: [sms, sso]
  languages.interface: [en]
  support.channels: [email]

