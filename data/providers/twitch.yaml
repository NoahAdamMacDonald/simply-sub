# Researched by hand on 2026-11-11 (M11.15, streaming batch 6), read with Edge from Canada, and Turbo's price data
# through each region's exit. Pages, each quoted where it's used:
# Pricing: its help centre's "Turbo Pricing by Country" (help.twitch.tv/s/article/turbo-pricing-by-country), "the
# monthly subscription price when purchased on the web", in each country's currency: "Canada / Canadian Dollar / $13.99
# CAD", "United States / United States Dollar / $11.99", "United Kingdom / Pound Sterling / £11.99", Ireland, Germany,
# France, the Netherlands, Spain and Italy "Euro / €11.99", "Australia / Australian Dollar / $15.99", "New Zealand / New
# Zealand Dollar / $17.99", and "If your country is not listed in the tables above, the monthly price for Turbo in your
# region is $11.99 USD." twitch.tv/turbo tells every visitor "Auto-renews at $11.99/month", but the page's own data (the
# one Turbo offer it loads for a visitor, a month of Turbo as a gift, with its price, currency and the visitor's
# "countryCode") gave the article's price and currency for each region, read 2026-11-11 from Canada ("countryCode":"CA",
# "currency":"CAD", "price":1399) and through a US, UK, Irish, German, French, Dutch, Spanish, Italian, Australian and
# New Zealand exit. Every price is the regular one; it's monthly
# only ("At this time, Turbo may only be purchased as a monthly recurring subscription.", Turbo Overview and FAQ), and
# its mobile apps charge more ("Learn more about subscription prices on mobile"), which isn't listed.
# Region checklist, 2026-11-11: 1. no country paths (one help article lists every country); 2. no picker; 3. the Turbo
# page's data names the country and currency, checked from Canada and through each region's exit; 4. checkout not
# opened (it needs an account); 5. the help centre's pricing article; 6. Edge read every page; 7. no bill offered.
# Not listed: gifting Turbo (a one-month Turbo for another user, "available on web only", which doesn't renew), and
# channel subscriptions, which are paid to one streamer each ("Tier 1, Tier 2 and Tier 3 subscription levels", "a Tier 1
# subscription costs $5.99 USD in the United States", local prices elsewhere): notes, not plans (the owner's rule for
# live channels). Bits are a virtual currency for cheering, not a subscription.
# Bundles: none for Turbo. Amazon Prime and Prime Video members get "a free monthly Twitch channel sub" (twitch.tv/prime,
# and the Terms of Sale's "Prime Member Perks on Twitch") for one streamer a month: a perk of Amazon's, not Turbo.
# Official resellers: none; Twitch Gift Cards are stored value, a way to pay (below).
# Features, read 2026-11-11: video quality: "Upgrading to 2k (1440p) streaming offers a noticeable step up from 1080p
# streaming" (2k Streaming on Twitch, for Partners' and Affiliates' streams); the registry's values stop at 1080p before
# 4K, so 1080p (inferred), the same on both plans. No page says how many streams an account plays at once, so both
# plans wait in core's awaitingRequiredFeatures (as Rumble's). No downloads for viewers (only a streamer's own past
# broadcasts) and no profiles. Ads: free viewing has them; Turbo is "Ad-free Viewing Across Twitch" except "as part of
# channel sponsorships", with "streamer-enabled promotions on channels and Twitch-promoted content on non-channel pages":
# ad-free, with a note, as Crave Premium's and CBC Gem Premium's exceptions are. What it streams: "Twitch is where
# millions of people come together live every day to chat, interact, and make their own entertainment together" (its
# About page): creators' livestreams (its streams' categories, sports and music among them, are creators' own). Own
# media: no page says it plays your own files.
# Pause: none (its cancelling article offers only "Don't Renew Subscription"). Parental controls: its Family Center
# ("Once the accounts are linked, parents can manage what their teen accesses, how long they spend on Twitch"), for
# every plan.

id: twitch
name: Twitch
website: https://www.twitch.tv
# Its legal site.
domains: [legal.twitch.com]
category: streaming
spendCategory: streaming
billingCurrency:
  {
    GLOBAL: USD,
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    AU: AUD,
    NZ: NZD,
  }
cancelUrl: https://help.twitch.tv/s/article/cancelling-subscriptions?language=en_US
sources: { pricing: https://help.twitch.tv/s/article/turbo-pricing-by-country?language=en_US }

# Owner (M11.2), read 2026-11-11: its Privacy Notice names Amazon.com, Inc. as Twitch Interactive's parent; its Terms of
# Service give Twitch Interactive's San Francisco address and its registration in Delaware. Its shares (M11.18):
# Amazon's investor relations page, read 2026-11-11 through a US exit (Cloudflare's check stopped it from Canada).
owner:
  name: 'Twitch Interactive, Inc., owned by Amazon.com, Inc.'
  website: https://www.aboutamazon.com
  page:
    name: 'Privacy Notice'
    url: https://legal.twitch.com/legal/privacy-notice/
  quotes:
    - 'Twitch Interactive Inc. and its affiliates are subsidiaries of Amazon.com, Inc. (“Amazon”).'
  country:
    code: US
    page:
      name: Terms of Service
      url: https://legal.twitch.com/legal/terms-of-service/
    quotes:
      - 'Twitch Interactive, Inc. is a company registered in the US State of Delaware under file no. 4221511.'
    lastVerified: 2026-11-11
  stock:
    company: Amazon.com, Inc.
    listings:
      - { exchange: NASDAQ, symbol: AMZN }
    page:
      name: Investor relations
      url: https://ir.aboutamazon.com/overview/default.aspx
    quotes:
      - 'NASDAQ: AMZN'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11

# Ways to pay (M11.5), read 2026-11-11: its Terms of Sale, the payment methods its checkout offers ("credit / debit card,
# Amazon Pay, Apple Pay and PayPal", with "See More Methods" by region; Amazon Pay is `other`), Twitch Gift Cards
# (stored value in US, Canadian and Australian dollars, euros and pounds), and Apple's and Google Play's billing in its
# apps. No page names card networks ("major credit cards, certain debit cards"), so the card is "networks not verified".
# Its checkout's currency follows the card ("Checkout currency is set via an automatic process that references
# information about your payment method").
paymentMethods:
  - methods: [card, paypal]
    page: Terms of Sale
    url: https://legal.twitch.com/legal/terms-of-sale/
    quotes:
      - 'We accept payment through major credit cards, certain debit cards, PayPal'
  - methods: [card, apple-pay, paypal, other]
    page: How to Update Payment Information and View Transaction History
    url: https://help.twitch.tv/s/article/updating-payment-information-transaction-history?language=en_US
    quotes:
      - 'you will be prompted to select your preferred payment method from credit / debit card, Amazon Pay, Apple Pay and PayPal'
  - methods: [gift-card]
    page: Spending Twitch Gift Cards
    url: https://help.twitch.tv/s/article/gift-card-spend?language=en_US
    quotes:
      - 'Spend gift card balance on Subs, Bits, or Turbo.'
  - methods: [app-store]
    page: Refunds on Twitch
    url: https://help.twitch.tv/s/article/refunds-on-twitch?language=en_US
    quotes:
      - 'Twitch Support handles all refund requests for Twitch products purchased through the Android app or Google Play Store.'

# Renewal day (M11.5), read 2026-11-11: its Terms of Sale charge "at the beginning of each applicable payment period",
# and its refunds article names a "Sub Renew Date" on your Subscriptions page, without saying which day it is.
renewalAnchor:
  kind: not-stated
  pages:
    - https://legal.twitch.com/legal/terms-of-sale/
    - https://help.twitch.tv/s/article/refunds-on-twitch?language=en_US
  lastVerified: 2026-11-11

# Sign-in (2026-11-11): an email or phone number and a password ("Create an account using your email address or phone
# number", Create an Account with Twitch), "Sign up with Google", "Sign up with Apple" and "Sign up with Amazon" (its
# social login article), passkeys ("A passkey replaces your password", Twitch Security), and two-step codes "via SMS
# and TOTP" (its 2FA article). Platforms: twitch.tv/downloads ("Twitch App for Android", "Twitch App for iOS", Fire TV,
# Android TV, Apple TV, LG and Samsung TVs, "PlayStation", "Xbox"). App languages: Languages on Twitch's table (ticks for
# Twitch.tv and its mobile app in 29 languages; those the registry has are listed, no Hindi).
features:
  platforms: [web, ios, android, tv, console]
  account.sign-in: [password, passkey, sms, totp, sso]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, ar]

