# Terms and policies (BLUEPRINT §4.10), read 2026-11-11 in Edge from Canada: its Terms of Service and Terms of Sale
# ("Last modified on 08/12/2026"), which include its Community Guidelines (read; no topic beyond what the terms say) and
# the Trademark and DMCA Guidelines (not read: no topic); its Privacy Notice ("Last modified on 08/12/2026"), Privacy
# Choices, Cookie Notice and State-Specific Privacy Disclosures (read through a US exit: the page sends Canada away); its
# Security page, and its help centre's billing, account, data and parental-control articles. Twitch has a privacy notice
# of its own, so Amazon's (data/policies/amazon-privacy.yaml) isn't shared: it applies only to what you give Amazon for
# Prime Member Perks on Twitch ("Information you provide to Amazon is subject to the applicable Amazon Privacy Notice").
# Calibrated against Rumble and Odysee (creator platforms) and Spotify (the same price-change wording). Its terms grant
# Twitch an irrevocable, fully sublicensable licence over what you stream or post, with your name, likeness and voice;
# legal.content-rights isn't a streaming topic, and Rumble's and Sportsnet+'s like clauses weren't made notable, so this
# one isn't either. Not read: the sign-up form's second step (username, password, birthday and the agreement line show
# only after an email is entered), Turbo's checkout (it needs an account), and its EU, EEA and UK withdrawal page (the
# terms' link answered "404 - Page Not Found").
policies:
  links:
    - name: 'Terms of Service'
      url: https://legal.twitch.com/legal/terms-of-service/
    - name: 'Terms of Sale'
      url: https://legal.twitch.com/legal/terms-of-sale/
    - name: 'Privacy Notice'
      url: https://legal.twitch.com/legal/privacy-notice/
    - name: 'Privacy Choices'
      url: https://legal.twitch.com/legal/privacy-choices/
    - name: 'State-Specific Privacy Disclosures'
      url: https://legal.twitch.com/legal/state-specific-privacy-disclosures/
    - name: 'Cookie Notice'
      url: https://legal.twitch.com/legal/cookie-policy/
    - name: 'Turbo'
      url: https://www.twitch.tv/turbo
    - name: 'Turbo Overview and FAQ'
      url: https://help.twitch.tv/s/article/twitch-turbo-guide?language=en_US
    - name: 'Cancelling Subscriptions on Twitch'
      url: https://help.twitch.tv/s/article/cancelling-subscriptions?language=en_US
    - name: 'Refunds on Twitch'
      url: https://help.twitch.tv/s/article/refunds-on-twitch?language=en_US
    - name: 'Delete My Twitch Account'
      url: https://help.twitch.tv/s/article/delete-twitch-account?language=en_US
    - name: 'Requesting Your Data From Twitch'
      url: https://help.twitch.tv/s/article/requesting-your-data-from-twitch?language=en_US
    - name: 'Create an Account with Twitch'
      url: https://help.twitch.tv/s/article/creating-an-account-with-twitch?language=en_US
    - name: 'Sign up'
      url: https://www.twitch.tv/signup
    - name: 'Age Verification on Twitch'
      url: https://help.twitch.tv/s/article/age-verification?language=en_US
    - name: 'Parental Controls in the Family Center'
      url: https://help.twitch.tv/s/article/family-center?language=en_US
    - name: 'Username Transfer Policy'
      url: https://help.twitch.tv/s/article/username-rename-and-recycling-policies?language=en_US
    - name: 'Twitch Security'
      url: https://www.twitch.tv/p/en/security/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use Twitch, with outside analytics services, to study trends and recommend things. The only way to stop that is to ask it, through its support form.'
      sources:
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'understand the usage trends of our users'
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'Twitch may use third-party Web analytics services in connection with the Twitch Services.'
        - url: https://legal.twitch.com/legal/privacy-choices/
          quote: "If you wish to object to processing of personal information, submit your request here under the 'Privacy Questions' category."
      action:
        name: 'Its privacy choices'
        url: https://legal.twitch.com/legal/privacy-choices/
      lastVerified: 2026-11-11
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares ad identifiers, and may share your email, with ad companies to aim ads at you on and off Twitch, and mixes your data with Amazon’s. Turning that off is setting by setting and device by device.'
      sources:
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'We may share with these third parties (or they may directly collect) data such as cookie and mobile ad identifiers in order to engage in advertising activity'
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'we may share information such as your email address or resettable device identifier for a specific advertising partner to “match” the information that they may have about you'
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'Personal information collected by Twitch may be combined with personal information about Amazon customers'
      action:
        name: 'Its privacy choices'
        url: https://legal.twitch.com/legal/privacy-choices/
      lastVerified: 2026-11-11
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It uses what you do to pick the ads you see, on Twitch and elsewhere. Where it shows a cookie banner you can say no, but in its apps you turn ad tracking off on each device, and it ignores Do Not Track.'
      sources:
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'Twitch may also work with third-party ad networks, advertisers, and advertising analytics providers to target (and measure the performance of) ads to you both on and off the Twitch Services.'
        - url: https://legal.twitch.com/legal/privacy-choices/
          quote: 'To opt out of Ad Tracking, go to the Privacy Settings on your mobile device under Tracking and/or Ads.'
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'However, Twitch does not recognize or respond to browser-initiated DNT signals.'
      action:
        name: 'Its privacy choices'
        url: https://legal.twitch.com/legal/privacy-choices/
      lastVerified: 2026-11-11
    - topic: privacy.ai-training
      tier: poor
      reason: 'What you post and say on Twitch, your chats included, may be used to build Amazon’s and Twitch’s generative AI. The only way out it names is asking it, through its support form, to stop using your data.'
      sources:
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'the content you create and upload, your chats and communications'
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'This includes using data to develop or deploy our generative AI models and services.'
        - url: https://legal.twitch.com/legal/privacy-choices/
          quote: "If you wish to object to processing of personal information, submit your request here under the 'Privacy Questions' category."
      action:
        name: 'Its privacy choices'
        url: https://legal.twitch.com/legal/privacy-choices/
      lastVerified: 2026-11-11
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data as long as it needs it, with few set times: its cookies last up to 13 months, and deleting your account erases your content within 90 days.'
      sources:
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'Twitch maintains data related to your usage of Twitch for as long as it is required to fulfill the relevant purposes described in this Privacy Notice'
        - url: https://legal.twitch.com/legal/cookie-policy/
          quote: 'Twitch-originated persistent cookies on Twitch Services will have a maximum lifespan of thirteen months from the time you last used the Twitch Services.'
        - url: https://help.twitch.tv/s/article/delete-twitch-account?language=en_US
          quote: 'Within 90 days of your request, Twitch will permanently erase all your content and close your account.'
      lastVerified: 2026-11-11
    - topic: privacy.data-deletion
      tier: good
      reason: 'You can delete your account yourself, and it erases your content within 90 days, though it may keep some data for legal and security reasons.'
      sources:
        - url: https://help.twitch.tv/s/article/delete-twitch-account?language=en_US
          quote: 'Within 90 days of your request, Twitch will permanently erase all your content and close your account.'
        - url: https://help.twitch.tv/s/article/delete-twitch-account?language=en_US
          quote: 'In some cases, Twitch may retain limited personal data for legal, security and other reasons permitted or required under applicable law.'
      action:
        name: 'Delete your Twitch account'
        url: https://help.twitch.tv/s/article/delete-twitch-account?language=en_US
      lastVerified: 2026-11-11
    - topic: privacy.data-portability
      tier: good
      reason: 'You can download your data yourself from its settings, as CSV files, within 14 days, though the report leaves out your Whispers (private messages).'
      sources:
        - url: https://help.twitch.tv/s/article/requesting-your-data-from-twitch?language=en_US
          quote: 'Any logged-in user may request and download a summary of their user data for that account through their user settings page.'
        - url: https://help.twitch.tv/s/article/requesting-your-data-from-twitch?language=en_US
          quote: 'chat_messages.csv - a list of chat messages you have sent in various channels'
        - url: https://help.twitch.tv/s/article/requesting-your-data-from-twitch?language=en_US
          quote: 'Whispers history is not supported in this data report.'
      action:
        name: 'Request a copy of your data'
        url: https://help.twitch.tv/s/article/requesting-your-data-from-twitch?language=en_US
      lastVerified: 2026-11-11
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over information when the law or a court order requires it, and asks for proper legal process, but doesn’t promise to tell you.'
      sources:
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'respond to a court order, judicial or other government request, subpoena, or warrant in the manner legally required'
        - url: https://legal.twitch.com/legal/terms-of-service/
          quote: 'All requests for information or documents related to potential, anticipated, or current legal proceedings, investigations, or disputes must be made using the appropriate level of legal process.'
      lastVerified: 2026-11-11
    - topic: privacy.data-location
      tier: poor
      reason: 'Your data may be kept in the US or any country where Twitch, Amazon or their partners work, with protections it doesn’t describe.'
      sources:
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'Information collected by Twitch may be stored and processed in your region, in the United States (for instance in our major data centers), or in any other country where Twitch or its affiliates, subsidiaries, partners, or service providers are located or maintain facilities.'
        - url: https://legal.twitch.com/legal/privacy-notice/
          quote: 'we will take appropriate measures to ensure such companies protect your information adequately'
      lastVerified: 2026-11-11
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with an email or a phone number, a username you choose, a password and your birthday. Where a law requires it, you may have to prove your age with a face scan done on your device.'
      sources:
        - url: https://help.twitch.tv/s/article/creating-an-account-with-twitch?language=en_US
          quote: "Create an account using your email address or phone number. You'll choose a username, set a password, and provide your date of birth."
        - url: https://www.twitch.tv/signup
          quote: 'Use phone number instead'
        - url: https://help.twitch.tv/s/article/age-verification?language=en_US
          quote: 'In some regions, you may need to verify your age using facial age estimation technology.'
      lastVerified: 2026-11-11
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 13 (16 in Australia), and teens need a parent’s supervision; it deletes a younger child’s data it finds. Parents can link a teen’s account and set limits, but it doesn’t say it keeps ads away from teens everywhere.'
      sources:
