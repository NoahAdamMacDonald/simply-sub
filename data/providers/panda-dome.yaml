    - topic: privacy.content-access
      tier: great
      reason: 'Panda Dome Passwords encrypts your passwords on your own device with a master password only you know, and Panda never keeps that password, so it can’t open your vault.'
      sources:
        - url: https://www.pandasecurity.com/rfiles/dome/passwords/eula/Panda_Dome_Passwords_-_Terms_of_Service.pdf
          quote: 'Your passwords will be encrypted on your device using a master password that only you know.'
        - url: https://www.pandasecurity.com/rfiles/dome/passwords/eula/Panda_Dome_Passwords_-_Terms_of_Service.pdf
          quote: 'Panda Security never stores your master password on any server so your passwords cannot be retrieved by anyone but you.'
      lastVerified: 2026-11-20
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your data as long as it needs it, with no set times (it asks you to contact it for them), and Panda Dome Passwords may keep copies of what you deleted.'
