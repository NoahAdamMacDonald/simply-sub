# General features, read 2026-11-20. Platforms: "Compatible with: Windows Android Mac iOS" (each plan's page; Panda Free
# Antivirus "Free protection for your Windows and Android devices"), and Panda Dome Passwords' browser extension ("Use the
# browser extension or access your vault from any device"). Sign-in: a password, and "enable two-factor authentication to
# access your Panda account" (its renewal page), which names no method. Support: "Contact us through the web form", a
# phone line "available 24/7 for a free diagnosis of your devices" and its forum (its support page). App languages: its
# website's language versions (Deutsch, English, Español, Français, Italiano, Nederlands, Português, Svenska). No pause.
features:
  platforms: [windows, macos, android, ios, browser-extension]
  account.sign-in: [password]
  support.channels: [email, phone, community, 24-7]
  languages.interface: [en, fr, es, de, it, pt]

# Perks (M11.6): what its plan pages list that no feature describes, in their words.
perks:
  - id: file-encryption
    name: File encryption
  - id: total-care
    name: Panda Total Care premium support

# Categories (M11.3): an antivirus first. Complete and Premium include Panda Dome Passwords ("The Panda Dome Complete plan
# includes Panda Dome Passwords"), so they're password manager plans too; Premium includes Dome VPN Premium ("unlimited
# data, servers in over 60 countries"), so it's a VPN plan too. The others' VPN is the free one ("VPN (150 MB/day)", which
# connects "automatically ... with the nearest server, without the option to choose country or location"), so they
# aren't VPN plans (notIn), Bitdefender's and Malwarebytes' precedent. Panda Dome Passwords and Dome VPN Premium are
# Panda's own apps, not other catalog providers' plans, so they're features here.
# Features, read 2026-11-20: each plan's page and the plans page's cards (Essential: "Antivirus, antimalware and
# antispyware", "Firewall and Wi-Fi protection", "VPN (150 MB/day)", "Antiphishing and secure browsing", "Dark Web
# Scanner: Alert for leaked email", "Gaming/multimedia mode"; Advanced adds "Antiransomware" and "Parental control";
# Complete adds "Password manager", "Cleanup: PC cleaning and optimization", "File encryption and secure deletion";
# Premium adds "Unlimited Premium VPN", "Automatic patching to prevent security breach risks", "Dark Web Monitor: Breach
# monitoring on the Dark Web" and "24/7 Premium technical support"), and its feature pages: "Behavior-based protection
# through event technologies and rules against dangerous actions." and "Schedule periodic scans and/or scan your computer
# on demand." (antivirus), "create a rescue USB drive to boot and clean those infected computers" (its rescue kit, in
# every plan and the free one), Wi-Fi protection that "checks the security level of your home Wi-Fi network and shows
# connected devices", anti-ransomware with "automatic backup copies of your important files" "From Panda Dome Advanced",
# parental control's "content filtering" ("available for Windows devices only"), and the update manager's "Scan your
# computer for vulnerabilities". The Dark Web Scanner is an email check ("find out whether your email account has been
# hacked"), so only Premium's Dark Web Monitor ("continuously monitors the Dark Web and notifies you by email") is
# monitoring. No plan page lists anti-theft per plan (its Android app's, in its privacy policy), so it's left out.
# Dome VPN Premium (its VPN page): "Available for 5 Windows, Android, Mac and iOS devices", "servers in over 60 countries",
# "No Logs Policy" (no audit named) and "P2P/Torrent Support"; no page read names its protocols, a kill switch, split
# tunnelling, RAM-only servers or a way to connect your own devices.
# Panda Dome Passwords (its page): "Store encrypted notes", "form-filling data" (its terms), "See if any of your passwords
# have been exposed on the Dark Web", "Share passwords securely with the people you choose", "Import passwords easily from
# other password managers" and "Set up an emergency contact"; no page names an export, an offline vault or 2FA codes of
# its own ("Protect your account with biometric login and two-factor authentication (2FA)" is its own sign-in).
