    - topic: privacy.data-collection
      tier: poor
      reason: 'Its apps send it how you use them and technical details, to improve its products. You can object only by emailing it, and only Europe’s right to object is named.'
      sources:
        - url: https://www.pandasecurity.com/rfiles/resources/eula/EULA_Consumer_products_for_Windows_EN.pdf
          quote: 'PANDA informs the licensee that in certain programs or products it may use data collection technology to collect technical information (including suspicious files) to improve the programs or products'
        - url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
          quote: 'Statistic Data / Analytics. Information about your interaction with the product is uploaded to optimize the user experience and to detect and correct possible errors when they appear.'
        - url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
          quote: 'In addition, if you are a resident of or visitor from Europe, you can object to processing of your personal information, ask us to restrict processing of your personal information or request portability of your personal information.'
      action:
        name: 'Your privacy rights (privacy policy)'
        url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
      lastVerified: 2026-11-20
    - topic: privacy.data-sharing
      tier: poor
      reason: 'Its free version collects your device’s ad ID and how you use it for advertising, through Google’s ads kit. To stop sharing with other companies, you must email it.'
      sources:
        - url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
          quote: 'This data is collected for advertising (only in case you use free version of our Services), analytics, and fraud prevention purposes.'
        - url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
          quote: 'You can also send requests about changes to your information or your contact preferences, including requests to opt-out of sharing your personal information with third parties, by emailing: panda.dpo@watchguard.com.'
      action:
        name: 'Your privacy rights (privacy policy)'
        url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
      lastVerified: 2026-11-20
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It uses what you do to show you its ads on and off its websites, without asking unless the law requires it. Its site follows a browser’s Global Privacy Control signal, one browser at a time.'
      sources:
        - url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
          quote: 'We use data we collect through our interactions with you to conduct marketing research, advertise to you, provide personalized information about us on and off our websites, and to provide other personalized content based on your activities and interests to the extent it is necessary for our legitimate interest in advertising our Services'
        - url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
          quote: 'If you choose to use the GPC signal, you will need to turn it on for each supported browser or browser extension you use.'
      action:
        name: 'Your privacy rights (privacy policy)'
        url: https://www.pandasecurity.com/en/homeusers/media/legal-notice/
      lastVerified: 2026-11-20
