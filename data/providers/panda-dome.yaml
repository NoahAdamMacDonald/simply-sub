# Researched by hand on 2026-11-20 (M11.15, security batch 2; the queue's panda-cloud-antivirus, Panda Cloud Antivirus
# being Panda Free Antivirus's old name), read with Edge from Canada and through a US, UK, Irish, Australian, New Zealand,
# German, French, Dutch, Spanish and Italian exit; its legal notice, feature pages and licence PDFs with a plain fetch.
# Pages, each quoted where it's used:
# Pricing: its plans page (pandasecurity.com/en/homeusers) and each plan's page (/en/dome/essential/ ... /premium/) sell
# every plan for 1, 3, 5 or 10 devices or "Unlimited devices", for 1, 2 or 3 years ("All plans are available for 1, 3,
# 5, 10 and an unlimited number of devices."), and its free antivirus page monthly ("CA $ 7.45 per month", with "First
# month free"); each page shows a discounted first term ("CA $ 57.71", "CA $ 82.45 -30%discount"). Each price links to
# its store (store.pandasecurity.com, run by its online reseller Cleverbridge: "This order process is conducted by our
# online reseller Cleverbridge GmbH"), whose cart names the regular, recurring price: "This is a subscription product with
# a fee of CA$ 82.45 per year.", "... a fee of CA$ 163.95 per billing cycle." (2 years), "... a monthly fee of CA$ 7.45."
# Every price below is that cart's, read 2026-11-20 without the pages' coupons (each sourceUrl the store link the pages
# use, minus its coupon and tracking, in English), for each country through its own exit with the country's store
# (x-market, currency) that its plans page links: CAD for Canada, USD for the US, GBP for the UK (its own store,
# purl-dome-y-uk), EUR for Ireland, Germany, France, the Netherlands, Spain and Italy (Italy's prices differ), AUD and
# NZD. Taxes are added in Canada and the US ("QST (9.975% on CA$ 82.45)", "GST (5% on CA$ 82.45)"); the European carts'
# "Includes €10.82 VAT" isn't wording core's taxIncluded reads, so no taxIncluded, as Malwarebytes'.
# Region checklist for CA and US, 2026-11-20: 1. no country paths (language paths /en/, /de/...); 2. no picker; 3. its
# store links name the market and currency (x-market=canada, currencies=CAD); 4. each plan's cart from Canada and the US,
# up to the payment form; 5. its renewal page; 6. Edge from Canada and through a US exit; 7. no bill offered.
# Not drafted: its stand-alone products (Panda Dome VPN, Panda Dome Password Manager, Panda Dome Family, Panda Cleanup,
# Panda Total Care), the same apps the plans include, and its business products (WatchGuard's).
# Bundles: none. Official resellers: none named as a shop selling its subscriptions; its privacy policy speaks of
# "authorized resellers and distributors" without naming any, and Cleverbridge runs its own store.
# Free use: Panda Free Antivirus (Panda Dome Free), its free plan.

