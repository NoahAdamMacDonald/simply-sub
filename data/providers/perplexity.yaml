# Researched by hand on 2026-11-13 and 2026-11-14 (the full catalog run, AI batch 1), read with Edge from Canada (its
# Pro and Max pages, its help centre's articles with their accordions opened, its legal hub, terms, privacy notice,
# acceptable use policy and security page), the Pro page again with the browser in French (Canada) and US English, and
# through a UK exit. A plain fetch gets Cloudflare's challenge page (HTTP 403) on every perplexity.ai page; Edge reads them
# with no bot check. Pages, each quoted where it's used:
# Pricing: perplexity.ai/pro and /max ("$17" and "$167" "/month or equivalent, when billed annually"; with the browser
# in French from Canada "17 $ US" and "167 $ US", and through a UK exit "US$17" and "US$167": one US-dollar price list,
# whoever reads it), and its help centre: "Perplexity Pro: $20/month or $200/year" and "Perplexity Max: $200/month or
# $2,000/year" (Using the Connector for Slack), "Perplexity Max costs $200/monthly or $2000/annually. Please note, the
# annual billing option is only available for the web app version." (Perplexity Max). Its terms charge "in U.S.
# Dollars", and its Paying in Local Currency article lets a web buyer pay the same plan in their own currency instead:
# "You can select either your local currency or USD at checkout." The local amounts show only at checkout, after
# signing in, so only US dollars are listed (no `currencies`: the article names no currency but INR, which it excludes).
# No page says the prices include tax ("you agree to pay us the applicable fees and taxes", its terms).
# Region checklist, 2026-11-13: 1. no country paths or hreflang on the plan pages (its help centre has 11 language
# versions, the same prices); 2. no country or currency picker; 3. the page's own text names "$ US" / "US$" by the
# browser's language, and no other currency; 4. checkout needs an account ("Login or sign up for free"); 5. "Paying in
# Local Currency" (local currency at checkout, amounts not shown); 6. Edge from Canada (en-CA, en-US, fr-CA) and through
# a UK exit, all US dollars; a plain fetch is refused; 7. no bill offered.
# Its individual plans: "Standard (Free)", "Perplexity Pro", "Perplexity Max" and "Education Pro" ("($10/mo with
# verification from SheerID)"), plus Enterprise Pro and Enterprise Max (per seat, business: out) and the API Platform
# ("Pay-as-you-go pricing", usage-billed: out). Not listed: Education Pro, an eligibility-only offer for verified
# students and educators, as for Spotify's and Apple Music's student plans.
# Bundles: Rumble sells "Rumble Premium with a subscription to Perplexity Pro" at "$23.99/mo" (rumble.com/premium, read
# 2026-11-14): a bundle file of its own (draft/bundle-rumble-premium-perplexity-pro.yaml). Its other partners hand out
# promotion codes and trials ("Perplexity regularly runs promotional offers and the discount codes for these offers are
# distributed through our partners, authorized and official channels, and on our website.", Partner promotions; Airtel,
# Bouygues Telecom and Vivo named there): offers, not sold plans, so nothing to list.
# Official resellers: none. No page names a shop that sells its subscription; partner codes are promotions (above).
# Comet, its browser (free, with a Max-only "Max Assistant"), is the browsers category's later task, with its own terms
# (perplexity.ai/hub/legal/comet-terms-of-service, saved): its Assistant is a feature of these plans
# (ai.computer-use), the browser itself isn't listed here.

id: perplexity
name: Perplexity
website: https://www.perplexity.ai
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help centre's cancelling article, for the web, iOS, Android and the Samsung Galaxy Store.
cancelUrl: https://www.perplexity.ai/help-center/en/articles/10354283-canceling-a-subscription
sources: { pricing: https://www.perplexity.ai/pro }

# Accepted cards (M9.2), read 2026-11-13 in its Billing FAQ for Pro Plan Subscribers, for every buyer on the web.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex]
    url: https://www.perplexity.ai/help-center/en/articles/10353002-billing-faq-for-pro-plan-subscribers
    quotes:
      - 'Credit and debit cards (Visa, Master Card and AMEX)'
# Ways to pay (M11.5), read 2026-11-13: on the web, cards, Cash App, Google and Apple Pay and an ACH transfer (Billing
# FAQ: "Perplexity redirects you to a Stripe payments page"); in its apps, Apple's and Google's billing (Canceling a
# Subscription; the Samsung Galaxy Store too, which the same article names). An ACH transfer is a US bank transfer, but
# core's wording for `bank-transfer` doesn't read "ACH transfer", so it's `other` here; and its "Google and Apple Pay"
# names Google Pay in a way core's wording doesn't read, so Google Pay is left out until core reads it (notes.md).
paymentMethods:
  - methods: [card, cash-app, apple-pay, other]
    page: 'Billing FAQ for Pro Plan Subscribers'
    url: https://www.perplexity.ai/help-center/en/articles/10353002-billing-faq-for-pro-plan-subscribers
    quotes:
      - 'Credit and debit cards (Visa, Master Card and AMEX)'
      - 'Cash App'
      - 'Google and Apple Pay'
      - 'ACH transfer'
  - methods: [app-store]
    page: 'Canceling a Subscription'
    url: https://www.perplexity.ai/help-center/en/articles/10354283-canceling-a-subscription
    quotes:
      - 'If you subscribed through the Apple App Store or Google Play Store, the app store controls your billing.'

# Owner (M11.2), read 2026-11-13: its privacy notice names the company behind the service; its terms are with "Perplexity
# AI, Inc." and its address is San Francisco's. Private: no page names a listing.
owner:
  name: 'Perplexity AI, Inc.'
  page:
    name: Privacy notice
    url: https://www.perplexity.ai/hub/legal/privacy-notice
  quotes:
    - 'Perplexity AI, Inc. is the controller of the data processed by Perplexity when you use Perplexity’s services globally.'
  country:
    code: US
    page:
      name: Terms of service
      url: https://www.perplexity.ai/hub/legal/terms-of-service
    quotes:
      - 'The Services are operated by us in the United States.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13

# Renewal day (M11.5), read 2026-11-13: "You’re billed monthly or annually on your original billing date, depending on
# your subscription." (Billing for Android Subscriptions; Canceling a Subscription: "You’re billed monthly or annually on
# your original billing date, depending on your subscription."), which means the date you subscribed, but core's
# renewal wording doesn't read "original billing date": not-stated here, with the same-date block in notes.md.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.perplexity.ai/help-center/en/articles/10354283-canceling-a-subscription
    - https://www.perplexity.ai/help-center/en/articles/10353020-billing-for-android-subscriptions
    - https://www.perplexity.ai/hub/legal/terms-of-service
  lastVerified: 2026-11-13

# Perks (M11.6), read 2026-11-13 on perplexity.ai/pro and /max and the help centre: usage levels (not comparable, so
# perks), Computer's monthly credits, Max's extras and support. Pro's card: "More usage limits and memory"; Max's:
# "Maximum Computer usage", "10,000 monthly credits", "Highest usage limits and memory". "Model Council runs several
# models on the same question and synthesizes their answers. It is available on the Max and Enterprise Max plans on web."
# (What advanced AI models are included in my subscription?); "Brain (Research Preview)" and "Max Assistant on Comet"
# (Perplexity Max); support: the comparison table's "Support Basic Priority Priority Dedicated" (Free, Pro, Education
# Pro, Max). The cards' "4,000 bonus credits" and "35,000 bonus credits" ("LIMITED TIME", "one-time, expire in 30
# days") are offers, not perks.
perks:
  - id: more-usage
    name: More usage limits and memory
  - id: highest-usage
    name: Highest usage limits and memory
  - id: max-computer-usage
    name: Maximum Computer usage
  - id: monthly-credits
    name: 10,000 monthly credits
  - id: model-council
    name: Model Council
  - id: brain
    name: Brain (Research Preview)
  - id: max-assistant
    name: Max Assistant on Comet
  - id: priority-support
    name: Priority support
  - id: dedicated-support
    name: Dedicated support

# AI features (the AI category's registry, feat/t12-ai-1), read 2026-11-13 in its plan pages and help centre, on every
# plan unless named:
# - Web search: "Perplexity is an AI-powered search engine" that "searches the web to deliver accessible,
#   conversational answers backed by verifiable sources" (What is Perplexity?); Free has "Practically unlimited basic
#   searches" and "Very limited amount of Pro Searches" (Which Perplexity Subscription Plan is right for you?).
# - Deep research: "Free users get limited access to Research. For those who need more, Perplexity Pro subscribers get
#   extended access." (What is Research mode?), and the comparison table's "Research Queries 1/month" on Free.
# - Memory: "Memory is a feature that allows Perplexity to remember details between your conversations" (Memory), which
#   names no plan but Brain's (Max).
# - Projects: "There’s no limit on how many Projects you can create." and "These limits are the same for everyone, on
#   every plan" (What are Projects?).
# - Reasoning, model choice and image generation on Pro and Max: "The free plan limits advanced searches to a few per day
#   and locks you to a single default model. Pro unlocks more advanced searches with multi-step reasoning, access to all
#   premium AI models, increased file uploads, and image generation capabilities." (perplexity.ai/pro's FAQ); "On the
#   Free plan you can use Best and a limited number of Pro Searches, but you can’t choose an advanced Search model
#   manually." and its Search models, from OpenAI, Google, Anthropic, Moonshot AI, Z.ai, xAI and NVIDIA on Pro and Max
#   (What advanced AI models are included in my subscription?). The plan table says "Image Generation No" on Free, as the
#   Free list's "No access to advanced AI models, image generation, or premium support."; the older image article
#   (2026-08-31) gives Free "limited image generations": the newer per-plan pages decide (notes.md).
# - Video generation on Pro and Max: "Available now for Max, Pro and Enterprise Pro/Max subscribers on Web app, iOS, and
#   Android." (Generating Videos with Perplexity).
# - Voice on Pro and Max: "Voice mode is available to Pro and Max subscribers." (How to use voice mode on the web and Mac
#   app). The iOS voice assistant article names no plan, so Free's voice isn't stated (notes.md).
# - Uses a browser or computer for you and scheduled tasks on Pro and Max: Computer "browses the web,
#   writes code, connects to your apps" ("Computer = an agent with tools. You ask, it actually does things — writes
#   docs, builds slides, sends emails, browses the web, writes code, connects to your apps, and chains multi-step
#   workflows together.") and "Computer is available on paid plans" (What is Computer?); its Automations run "on a
#   schedule you set" and "Automations in Computer are available wherever Computer is available." (Automations in
#   Computer); the table's "Browser Agent (Comet Assistant) Queries" "No" on Free. Free accounts' one-time "free Computer
#   turns" ("Some free accounts") are a trial, not Free's. Not a coding agent (review of 2026-11-17): Computer is a
#   general agent that also writes code, as Microsoft 365's Cowork is, and every coding agent counted is a coding tool.
# - Early access on Max: "Early access to the newest products: Try the latest features and products before they’re
#   available to everyone else." (Which Perplexity Subscription Plan is right for you?) and the Max card's "Priority
#   access to new features". Pro's article lists "Exclusive Pro Perks, including early releases", but its card and the
#   per-plan list give it to Max only (notes.md).
# - Connects to, on Pro and Max: its apps ("The Connector for Slack is available to Perplexity Pro, Perplexity Max,
#   Enterprise Pro and Enterprise Max users.", and the same for Dropbox, Asana, Jira, Confluence, HubSpot and Microsoft
#   365), MCP servers ("To add a remote MCP connector, open Plugins in the sidebar and select Add custom.", Local and
#   Remote MCPs; Plugins "Plugins that include skills need a plan that includes Perplexity Computer.") and skills you
#   make ("Personal skills are the ones you create or upload.", "Skills are available on the web and in the Perplexity
#   apps on every plan that includes Computer.", What is a skill?). No API use: "Does my subscription include API
#   access? No."
# - Chats kept on its servers: "We retain your personal information as long as your account is active." (How long
#   Perplexity retains your search and personal data).
# - None of these pages offers monthly API credits, code completion in an editor, music or voice generation, or the
#   assistant inside email or office apps (its connectors bring Gmail, Outlook and Microsoft 365 into Perplexity; its
#   Email Assistant "will soon be deprecated").
# General features, read 2026-11-13: apps: "The app is available for Windows and Mac." (About the App), its iOS and
# Android apps (Billing for iOS / Android Subscriptions) and the web (a Linux package runs only Portable Computer on
# NVIDIA hardware, not listed). Sign-in: "Continue with Google, Continue with Apple, or Continue with email" and "use
# the sign-in link or one-time code Perplexity sends you" (How to Change Your Sign-In Method). Support: "For account
# support, billing inquiries, or bug reports, contact us via Help > Contact Support." and Discord (How can I contact the
# Perplexity team?); Pro and Max add "Pro subscribers can access live chat in Settings." No pause: "No, subscription
# pausing isn’t available." No parental controls (its terms ask a parent to accept them for a minor, nothing more). App
# languages: no page lists them (its settings' "Language" picker isn't readable signed out), so none (notes.md).
features:
  platforms: [windows, macos, android, ios, web]
  account.sign-in: [email-code, sso]
  support.channels: [email, community]

