# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-13 with Edge: its Terms of Service, which
# name its Privacy Policy (now its Privacy Notice); its Acceptable Use Policy ("this Policy is incorporated into the terms
# and conditions or other agreement that you have entered into with Perplexity": the conduct it forbids, including
# building competing products, graded with the licence); the Pro Perks Terms and Conditions (US subscriptions' partner
# discounts: "Perplexity may provide information regarding your account to third parties in order for you to use Pro
# Perks.", no topic worse than the privacy notice's); its Third-Party Models & Terms (the model makers' terms "do not
# apply to you" beyond the models you use: no topic); Korea's Billing & Consumer Information (a 7-day refund for Korea,
# outside the catalog's regions); and the help centre's billing, refund, cancelling, privacy, deletion, retention and
# security articles. The DSA page holds contacts only. Comet's terms are the browser's (browsers category, later). Not
# read: the sign-up form's agreement line, which shows only in the sign-in dialog after choosing a method.
policies:
  links:
    - name: Terms of service
      url: https://www.perplexity.ai/hub/legal/terms-of-service
    - name: Privacy notice
      url: https://www.perplexity.ai/hub/legal/privacy-notice
    - name: Cancelling
      url: https://www.perplexity.ai/help-center/en/articles/10354283-canceling-a-subscription
    - name: Refunds
      url: https://www.perplexity.ai/help-center/en/articles/10354288-refunds
    - name: Perplexity Max
      url: https://www.perplexity.ai/help-center/en/articles/11680686-perplexity-max
    - name: Data collection and AI training
      url: https://www.perplexity.ai/help-center/en/articles/11564572-data-collection-at-perplexity
    - name: Deleting your account
      url: https://www.perplexity.ai/help-center/en/articles/10354879-account-deletion
    - name: How long it keeps your data
      url: https://www.perplexity.ai/help-center/en/articles/10354873-how-long-does-perplexity-retain-my-search-history-profile-data-and-personal-information
    - name: Self-serve data options
      url: https://www.perplexity.ai/hub/legal/self-serve-data-options
    - name: Phone verification
      url: https://www.perplexity.ai/help-center/en/articles/14653777-phone-verification-for-your-account-via-sms-2fa
    - name: Security
      url: https://www.perplexity.ai/hub/security
    - name: Generating images
      url: https://www.perplexity.ai/help-center/en/articles/10354781-generating-images-with-perplexity
    - name: Models included
      url: https://www.perplexity.ai/help-center/en/articles/10354919-what-advanced-ai-models-are-included-in-my-subscription
    - name: Billing FAQ
      url: https://www.perplexity.ai/help-center/en/articles/10353002-billing-faq-for-pro-plan-subscribers
    - name: Pro plans (cookie notice)
      url: https://www.perplexity.ai/pro
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online in your settings in a few clicks, any time before it renews, and you keep what you paid for until the end of the period.'
      sources:
        - url: https://www.perplexity.ai/help-center/en/articles/10354283-canceling-a-subscription
          quote: 'Go to Settings and scroll down to find “Subscription” under Perplexity Pro. Click “Manage Subscription” to open the current plan page, then choose “Cancel subscription.”'
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'Following any cancellation by you, however, you will continue to have access to the paid Services through the end of the subscription period for which payment has already been made.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'Payments are not refunded, but you can ask for your money back within 24 hours of a monthly charge or 72 hours of buying a year (14 days in the EU and UK), once only, and you keep access to the end of the period.'
      sources:
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'Except as expressly set forth in these Terms or in any country-specific billing and consumer information pages, payments for any subscriptions to the Services are nonrefundable and there are no credits for partially used periods.'
        - url: https://www.perplexity.ai/help-center/en/articles/10354288-refunds
          quote: 'Monthly subscriptions: You can request a refund up to 24 hours after the purchase date.'
        - url: https://www.perplexity.ai/help-center/en/articles/10354288-refunds
          quote: 'We can’t process additional refund requests after we’ve granted a first one.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: neutral
      reason: 'It can change its prices whenever it decides, and tells you a reasonable time ahead, without saying how long.'
      sources:
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'Except as otherwise provided in these Terms, any price changes or changes to your subscription plan will take effect following reasonable notice to you.'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: neutral
      reason: 'A free trial needs a card and turns into a paid plan at the regular price unless you cancel, which you can do at any time during it.'
      sources:
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'Upon expiration of your free trial, you will be charged the then-current subscription price for the applicable Service.'
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'You may cancel your free trial at any time by navigating to perplexity.ai/account/details, selecting “view details” and “cancel subscription” while logged in.'
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own at the then-current price, but not that it reminds you first.'
      pages:
        - https://www.perplexity.ai/hub/legal/terms-of-service
        - https://www.perplexity.ai/help-center/en/articles/10354283-canceling-a-subscription
      lastVerified: 2026-11-13
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms and billing pages list no fees beyond the price and taxes.'
      pages:
        - https://www.perplexity.ai/hub/legal/terms-of-service
        - https://www.perplexity.ai/help-center/en/articles/10353002-billing-faq-for-pro-plan-subscribers
      lastVerified: 2026-11-13
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up from Pro to Max on the web starts at once, and what you already paid counts toward it. Moving down starts when your period ends.'
      sources:
        - url: https://www.perplexity.ai/help-center/en/articles/11680686-perplexity-max
          quote: 'Yes, if you’ve already subscribed via web app we will carry over your balance and bill you the prorated amount for your new subscription.'
        - url: https://www.perplexity.ai/help-center/en/articles/11680686-perplexity-max
          quote: 'Please note that all other cancellations and downgrades will kick in at the end of your billing cycle.'
      lastVerified: 2026-11-13
    - topic: legal.disputes
      tier: poor
      reason: "Disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only by writing within 30 days of signing up."
      sources:
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'You have the right to opt-out and not be bound by the arbitration provisions set forth in these Terms by sending written notice of your decision to opt-out to support@perplexity.ai or to the U.S. mailing address listed in the “How to Contact Us” section of these Terms.'
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'The notice must be sent to the Company within 30 days of your first registering to use the Services or agreeing to these Terms; otherwise you shall be bound to arbitrate disputes on a non-class basis in accordance with these Terms.'
      action:
        name: 'How to opt out of arbitration (section 9.6)'
        url: https://www.perplexity.ai/hub/legal/terms-of-service
      lastVerified: 2026-11-13
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It tries to tell you about big changes to its terms, by email or a notice on its website, but they apply as soon as they are posted.'
      sources:
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'If we make changes that are material, we will use reasonable efforts to attempt to notify you, such as by e-mail and/or by placing a prominent notice on the first page of the Website.'
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'The updated Terms will be effective as of the time of posting, or such later date as may be specified in the updated Terms.'
      lastVerified: 2026-11-13
    - topic: legal.account-closure
      tier: bad
      reason: 'It can suspend or delete your account for any reason or none, with or without warning, and gives no refund when it says you broke its rules.'
      sources:
        - url: https://www.perplexity.ai/hub/legal/terms-of-service
          quote: 'Additionally, the Company may suspend, disable, or delete your Account and/or the Services (or any part of the foregoing) with or without notice, for any or no reason.'
