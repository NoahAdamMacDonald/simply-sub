id: netflix
name: Netflix
website: https://www.netflix.com
# Its investor relations site, which names it a public company.
domains: [netflix.net]
category: streaming
spendCategory: streaming
# Accepted cards, read 2026-10-28 (M9.2) on the help centre's payment options, one page per country: Canada takes
# Visa, MasterCard and American Express, and the US adds Discover.
acceptedNetworks:
  CA:
    networks: [visa, mastercard, amex]
    url: https://help.netflix.com/en/node/116380/ca
    quotes:
      - We accept the following cards, which must be enabled for recurring e-commerce transactions.
      - Visa
      - MasterCard
      - American Express
  US:
    networks: [visa, mastercard, amex, discover]
    url: https://help.netflix.com/en/node/116380/us
    quotes:
      - 'We accept credit, debit, and virtual cards, as well as co-branded cards issued by local banks with the following logos:'
      - Visa
      - MasterCard
      - American Express
      - Discover
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    IE: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
cancelUrl: https://www.netflix.com/cancelplan
sources: { pricing: https://help.netflix.com/en/node/24926 }
# Owner (M11.2), read 2026-11-02: its investor relations site's company profile; Netflix Services Canada ULC is the
# contracting party for Canadians (help.netflix.com/legal/corpinfo).
owner:
  name: 'Netflix, Inc., a public company (NASDAQ: NFLX)'
  page:
    name: Company profile (investor relations)
    url: https://ir.netflix.net/ir-overview/profile/default.aspx
  quotes:
    - 'Netflix is one of the world’s leading entertainment services offering TV series, films, games and live programming across a wide variety of genres and languages.'
    - 'NASDAQ: NFLX'
  lastVerified: 2026-11-02
# Ways to pay (M11.5), read 2026-11-02 on its payment articles for the US (for everywhere) and Canada.
paymentMethods:
  - methods: [card, gift-card, paypal, provider-billing]
    page: Netflix payment options
    url: https://help.netflix.com/en/node/116380/us
    quotes:
      - 'We accept credit, debit, and virtual cards, as well as co-branded cards issued by local banks with the following logos:'
      - 'Netflix gift cards: Buy a Netflix gift card at a participating retailer, then redeem the code on your account page to apply the balance to your monthly bill.'
      - PayPal
      - The following partners allow you to add Netflix to your bill or offer a package that includes Netflix.
  - methods: [card, gift-card, paypal, provider-billing]
    regions: [CA]
    page: How to pay for Netflix
    url: https://help.netflix.com/en/node/116380/ca
    quotes:
      - 'We accept the following cards, which must be enabled for recurring e-commerce transactions.'
      - 'You can purchase Netflix gift cards at select retailers.'
      - We accept PayPal.
      - The following partners allow you to add Netflix to their bill or offer a package with Netflix included.
# Renewal day (M11.5), read 2026-11-02 in its help centre's billing date article: the date you signed up, or a shorter
# month's last day. A plan change, a failed payment or a partner's billing can move it, which the article lists too.
renewalAnchor:
  kind: same-date
  page: How to check your Netflix billing date
  url: https://help.netflix.com/en/node/54896
  quotes:
    - Your billing cycle starts on the date you sign up.
    - 'If your billing date does not occur on the last day of each month (for example, the 31st), you will be billed on the last day of that month instead.'
  lastVerified: 2026-11-02

# Apps, sign-in and support (M11.9, the cross-category features), read 2026-11-03 in its help centre: smart TVs and
# streaming players, Android, iPhone and iPad, the Netflix app for Windows, netflix.com in a browser (a Mac's way),
# PlayStation and Xbox (node 14361); a password, or the sign-in codes and links it sends "to your email address or phone
# number"; calling or chatting from its app (node 33335).
features:
  platforms: [windows, android, ios, web, tv, console]
  account.sign-in: [password, email-code, sms]
  support.channels: [phone, chat]

# Coverage: netflix.standard-ads in NZ, IE and NL, read 2026-11-03: each country's Plans and Pricing page lists Basic,
