# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27 from Canada: its terms of use (the Canadian ones,
# so the ratings from them are for Canada), privacy statement and help articles on households and downloads. Not
# rated: free trials (none in Canada).
# Its terms are read from Canada: Netflix serves each country its own terms by where you are, and has no country picker
# on them, so other countries' terms (the US's) weren't read. Its billing and legal ratings, read in the Canadian
# terms, stand for everywhere until a reader in another country (the owner's VPN) reads theirs (2026-11-02).
policies:
  links:
    - name: 'Terms of use'
      url: https://help.netflix.com/legal/termsofuse
    - name: 'Privacy statement'
      url: https://help.netflix.com/legal/privacy
    - name: 'Netflix Household'
      url: https://help.netflix.com/en/node/123277
    - name: 'Downloads'
      url: https://help.netflix.com/en/node/54816
    - name: 'Bug bounty (HackerOne)'
      url: https://hackerone.com/netflix
    - name: 'Cancelling'
      url: https://help.netflix.com/en/node/407
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records the ads you see, details about your devices and your IP address, and makes guesses about you and your household. You can only stop it using this to pick ads.'
      sources:
        - url: https://help.netflix.com/legal/privacy
          quote: 'We collect information about the advertisements on the Netflix service that you view or interact with, device information (such as resettable device identifiers), IP addresses, inferences we make about you or your household based on data we collect from or about you'
        - url: https://help.netflix.com/legal/privacy
          quote: 'If your Behavioral Advertisements setting is off, you will still see advertisements, but they will be non-behavioral advertisements.'
      action:
        name: 'How to turn off Behavioral Advertising'
        url: https://help.netflix.com/node/100637
      lastVerified: 2026-10-27
    - topic: privacy.data-sharing
      tier: neutral
      reason: 'It shares some of your information with advertising companies to choose the ads you see. You can turn that off with its "Behavioral Advertising" setting.'
      sources:
        - url: https://help.netflix.com/legal/privacy
          quote: 'We may disclose certain personal information to Advertising Companies (see definition above) in order to select advertisements shown on Netflix'
        - url: https://help.netflix.com/legal/privacy
          quote: 'a “Behavioral Advertising” setting will be available to you in the “Privacy and data settings” menu'
      action:
        name: 'How to turn off Behavioral Advertising'
        url: https://help.netflix.com/node/100637
      lastVerified: 2026-10-27
    - topic: privacy.ads-tracking
      tier: neutral
      reason: "On this plan, it can pick ads from what you do, unless you turn off its Behavioral Advertising setting. You'll still see ads, just not ones picked for you."
      plans: [netflix.standard-ads]
      sources:
        - url: https://help.netflix.com/legal/privacy
          quote: 'We use your personal information to present you with advertisements. Some of our advertisements may be Behavioral Advertisements.'
        - url: https://help.netflix.com/legal/privacy
          quote: 'If your Behavioral Advertisements setting is off, you will still see advertisements, but they will be non-behavioral advertisements.'
      action:
        name: 'How to turn off Behavioral Advertising'
        url: https://help.netflix.com/node/100637
      lastVerified: 2026-10-27
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask it to correct your information or delete what it holds about you, but you have to ask.'
      sources:
        - url: https://help.netflix.com/legal/privacy
          quote: 'You may also correct or update out-of-date or inaccurate personal information or request that we delete personal information that we hold about you.'
      action:
        name: 'How to ask it to delete your data'
        url: https://help.netflix.com/node/100625
      lastVerified: 2026-10-27
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel online in a couple of clicks, whenever you like, and keep watching until the end of the time you paid for.'
      sources:
        - url: https://help.netflix.com/en/node/407
          quote: 'You can cancel your Netflix account at any time.'
        - url: https://help.netflix.com/en/node/407
          quote: 'tap or click Finish Cancellation'
        - url: https://help.netflix.com/en/node/407
          quote: 'If you cancel with time left in your billing period, you can use Netflix until the end of the billing period.'
      lastVerified: 2026-11-03
    - topic: billing.refunds
      tier: neutral
      reason: "You get no money back for days you didn't use, but you keep watching until the end of the time you paid for."
      sources:
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'The cancellation will take effect at the end of the billing period.'
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'To the extent permitted by the applicable law, payments are non-refundable and we do not provide refunds or credits for any partial subscription periods or unused Netflix content.'
      lastVerified: 2026-11-03
    - topic: billing.price-changes
      tier: good
      reason: "It tells you at least a month before the price goes up, so you have time to cancel if you don't want to pay more."
      sources:
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'We will notify you at least one month before any price changes or changes to your subscription plan will become effective.'
      lastVerified: 2026-11-03
    - topic: legal.disputes
      tier: good
      reason: "Disagreements are handled under Canada's laws, but you can't join a group lawsuit against it unless you live in Quebec."
      sources:
        - url: https://help.netflix.com/legal/termsofuse
