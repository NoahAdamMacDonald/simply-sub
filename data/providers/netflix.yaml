id: netflix
name: Netflix
website: https://www.netflix.com
category: streaming
spendCategory: streaming
# Accepted cards, read 2026-10-28 (M9.2) on the help centre's payment options, one page per country: Canada takes
# Visa, MasterCard and American Express, and the US adds Discover.
acceptedNetworks:
  CA:
    networks: [visa, mastercard, amex]
    url: https://help.netflix.com/en/node/116380/ca
    quotes:
      - We accept the following cards, which must be enabled for recurring e-commerce transactions.
      - Visa
      - MasterCard
      - American Express
  US:
    networks: [visa, mastercard, amex, discover]
    url: https://help.netflix.com/en/node/116380/us
    quotes:
      - 'We accept credit, debit, and virtual cards, as well as co-branded cards issued by local banks with the following logos:'
      - Visa
      - MasterCard
      - American Express
      - Discover
billingCurrency: { CA: CAD, US: USD }
cancelUrl: https://www.netflix.com/cancelplan
sources: { pricing: https://help.netflix.com/en/node/24926 }

plans:
  - id: netflix.standard-ads
    name: Standard with ads
    link: https://www.netflix.com/signup
    features:
      video.quality: 1080p
      streaming.ad-free: false
      streaming.concurrent-streams: 2
      streaming.download-devices: 2
      streaming.kids-profiles: true
      streaming.french-content: true
    prices:
      - region: CA
        currency: CAD
        amount: 7.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/ca
      - region: US
        currency: USD
        amount: 8.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/us

  - id: netflix.standard
    name: Standard
    link: https://www.netflix.com/signup
    features:
      video.quality: 1080p
      streaming.ad-free: true
      streaming.concurrent-streams: 2
      streaming.download-devices: 2
      streaming.kids-profiles: true
      streaming.french-content: true
    prices:
      - region: CA
        currency: CAD
        amount: 18.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/ca
      - region: US
        currency: USD
        amount: 19.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/us
    addOnIds: [netflix.extra-member-ads, netflix.extra-member]
    addOnLimit: 1

  - id: netflix.premium
    name: Premium
    link: https://www.netflix.com/signup
    features:
      video.quality: 4k
      video.hdr: true
      audio.dolby-atmos: true
      streaming.ad-free: true
      streaming.concurrent-streams: 4
      streaming.download-devices: 6
      streaming.kids-profiles: true
      streaming.french-content: true
    featureLabels:
      audio.dolby-atmos: Netflix spatial audio
    prices:
      - region: CA
        currency: CAD
        amount: 23.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/ca
      - region: US
        currency: USD
        amount: 26.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/us
    addOnIds: [netflix.extra-member-ads, netflix.extra-member]
    addOnLimit: 2

addOns:
  - id: netflix.extra-member-ads
    name: Extra member (with ads)
    grantsPlan: netflix.standard-ads
    prices:
      - region: CA
        currency: CAD
        amount: 5.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/ca
      - region: US
        currency: USD
        amount: 7.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/us
  - id: netflix.extra-member
    name: Extra member
    grantsPlan: netflix.standard
    prices:
      - region: CA
        currency: CAD
        amount: 7.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/ca
      - region: US
        currency: USD
        amount: 9.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.netflix.com/en/node/24926/us

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27 from Canada: its terms of use (the Canadian ones,
# so the ratings from them are for Canada), privacy statement and help articles on households and downloads. Not
# rated: free trials (none in Canada).
policies:
  links:
    - name: 'Terms of use'
      url: https://help.netflix.com/legal/termsofuse
    - name: 'Privacy statement'
      url: https://help.netflix.com/legal/privacy
    - name: 'Netflix Household'
      url: https://help.netflix.com/en/node/123277
    - name: 'Downloads'
      url: https://help.netflix.com/en/node/54816
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records the ads you see, details about your devices and your IP address, and makes guesses about you and your household. You can only stop it using this to pick ads.'
      sources:
        - url: https://help.netflix.com/legal/privacy
          quote: 'We collect information about the advertisements on the Netflix service that you view or interact with, device information (such as resettable device identifiers), IP addresses, inferences we make about you or your household based on data we collect from or about you'
        - url: https://help.netflix.com/legal/privacy
          quote: 'If your Behavioral Advertisements setting is off, you will still see advertisements, but they will be non-behavioral advertisements.'
      action:
        name: 'How to turn off Behavioral Advertising'
        url: https://help.netflix.com/node/100637
      lastVerified: 2026-10-27
    - topic: privacy.data-sharing
      tier: neutral
      reason: 'It shares some of your information with advertising companies to choose the ads you see. You can turn that off with its "Behavioral Advertising" setting.'
      sources:
        - url: https://help.netflix.com/legal/privacy
          quote: 'We may disclose certain personal information to Advertising Companies (see definition above) in order to select advertisements shown on Netflix'
        - url: https://help.netflix.com/legal/privacy
          quote: 'a “Behavioral Advertising” setting will be available to you in the “Privacy and data settings” menu'
      action:
        name: 'How to turn off Behavioral Advertising'
        url: https://help.netflix.com/node/100637
      lastVerified: 2026-10-27
    - topic: privacy.ads-tracking
      tier: neutral
      reason: "On this plan, it can pick ads from what you do, unless you turn off its Behavioral Advertising setting. You'll still see ads, just not ones picked for you."
      plans: [netflix.standard-ads]
      sources:
        - url: https://help.netflix.com/legal/privacy
          quote: 'We use your personal information to present you with advertisements. Some of our advertisements may be Behavioral Advertisements.'
        - url: https://help.netflix.com/legal/privacy
          quote: 'If your Behavioral Advertisements setting is off, you will still see advertisements, but they will be non-behavioral advertisements.'
      action:
        name: 'How to turn off Behavioral Advertising'
        url: https://help.netflix.com/node/100637
      lastVerified: 2026-10-27
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask it to correct your information or delete what it holds about you, but you have to ask.'
      sources:
        - url: https://help.netflix.com/legal/privacy
          quote: 'You may also correct or update out-of-date or inaccurate personal information or request that we delete personal information that we hold about you.'
      action:
        name: 'How to ask it to delete your data'
        url: https://help.netflix.com/node/100625
      lastVerified: 2026-10-27
    - topic: billing.cancel-refunds
      tier: neutral
      reason: "You can cancel online whenever you like, and you keep watching until the end of the time you paid for. There is no money back for days you didn't use."
      regions: [CA]
      sources:
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'You can cancel your Netflix subscription at any time.'
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'The cancellation will take effect at the end of the billing period.'
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'To the extent permitted by the applicable law, payments are non-refundable and we do not provide refunds or credits for any partial subscription periods or unused Netflix content.'
      lastVerified: 2026-10-27
    - topic: billing.price-changes
      tier: good
      reason: "It tells you at least a month before the price goes up, so you have time to cancel if you don't want to pay more."
      regions: [CA]
      sources:
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'We will notify you at least one month before any price changes or changes to your subscription plan will become effective.'
      lastVerified: 2026-10-27
    - topic: legal.disputes
      tier: good
      reason: "Disagreements are handled under Canada's laws, but you can't join a group lawsuit against it unless you live in Quebec."
      regions: [CA]
      sources:
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'These Terms of Use shall be governed by and construed in accordance with the laws of Canada without regard to conflict of laws provisions.'
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'EXCEPT FOR CONSUMERS THAT ARE SUBJECT TO THE QUEBEC CONSUMER PROTECTION ACT AND ONLY WHERE PERMITTED UNDER THE APPLICABLE LAW, YOU AND NETFLIX AGREE THAT EACH MAY BRING CLAIMS AGAINST THE OTHER ONLY IN YOUR OR ITS INDIVIDUAL CAPACITY'
      lastVerified: 2026-10-27
    - topic: legal.terms-changes
      tier: good
      reason: 'If it makes a big change to its terms, it tells you at least a month before the change starts.'
      regions: [CA]
      sources:
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'In case of material changes we will notify you at least one month before such changes apply to you.'
      lastVerified: 2026-10-27
    - topic: legal.account-closure
      tier: neutral
      reason: "It can shut down or limit your account if you break its rules or use it for fraud, and it won't give your money back."
      regions: [CA]
      sources:
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'We may terminate or restrict your use of our service if you violate these Terms of Use or are engaged in illegal or fraudulent use of the service.'
        - url: https://help.netflix.com/legal/termsofuse
          quote: 'To the extent permitted by the applicable law, payments are non-refundable'
      lastVerified: 2026-10-27
    - topic: service.account-sharing
      tier: neutral
      reason: 'Only people who live with you can use your account, and it checks devices to make sure. To share with someone who lives elsewhere, you pay for an extra member.'
      sources:
        - url: https://help.netflix.com/en/node/123277
          quote: 'You may not share your Netflix account outside of your household.'
        - url: https://help.netflix.com/en/node/123277
          quote: "Account owners on a Standard or Premium plan in many countries can share Netflix with someone who doesn't live with them by adding an extra member to their account."
        - url: https://help.netflix.com/legal/privacy
          quote: 'This also includes determining whether a particular device is permitted to use the account consistent with the Netflix Terms of Use.'
      lastVerified: 2026-10-27
    - topic: service.account-sharing
      tier: poor
      reason: "Only people who live with you can use your account, and on this plan you can't pay to add someone who lives elsewhere."
      plans: [netflix.standard-ads]
      sources:
        - url: https://help.netflix.com/en/node/123277
          quote: 'You may not share your Netflix account outside of your household.'
        - url: https://help.netflix.com/en/node/123277
          quote: 'Extra members cannot be added to ad-supported plans.'
      lastVerified: 2026-10-27
    - topic: service.device-limits
      tier: neutral
      reason: 'You can download up to 100 shows or movies on each device, on as many devices as your plan allows, but downloads stop working after a while.'
      sources:
        - url: https://help.netflix.com/en/node/54816
          quote: 'Ad-free plans can have up to 100 active downloads at a time per device based on the number of devices included in your Netflix plan'
        - url: https://help.netflix.com/en/node/54816
          quote: 'Downloads will expire after a period of time'
      lastVerified: 2026-10-27
    - topic: service.device-limits
      tier: poor
      reason: 'You can only download 15 shows or movies per device each month, and they stop working after a while.'
      plans: [netflix.standard-ads]
      sources:
        - url: https://help.netflix.com/en/node/54816
          quote: 'Ad-supported plans are limited to 15 total downloads per device per calendar month.'
        - url: https://help.netflix.com/en/node/54816
          quote: 'Downloads will expire after a period of time'
      lastVerified: 2026-10-27
