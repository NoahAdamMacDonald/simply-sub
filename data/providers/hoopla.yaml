# Researched by hand on 2026-11-13 (M11.15, streaming batch 8), read with Edge from Canada and a plain fetch: its help
# centre (hoopladigital.com/faq, all 189 answers, which its page carries in its own data and shows one topic at a time),
# its blog's support articles (theloop.hoopladigital.com), its about, sign-up, terms and privacy pages. Pages, each quoted
# where it's used:
# Pricing: nothing is sold. "No, Hoopla is a free service provided to library users by participating libraries." (Are
# there any fees to use Hoopla?), and its libraries pay for each borrow ("When a patron borrows a title their library is
# charged X amount for the title", its daily borrow limit answer). So its one plan is free, priced 0 in each country its
# help centre names: "Libraries across the United States, Canada, Australia, and New Zealand offer Hoopla." (What is
# Hoopla?), which is its availableIn too; its privacy notice has sections for "Residents of Canada", "Australia" and "New
# Zealand" besides the US's. The UK, Ireland and the euro sample aren't on that list.
# Region checklist, 2026-11-13: 1. no country paths (one site for every country); 2. no country or currency picker (the
# site follows the browser's language); 3. not needed (nothing is priced); 4. its sign-up asks first for a library, then
# "Your valid library card number (and PIN if required)" and "A valid email address" (read without typing); 5. none (no
# prices); 6. Edge from Canada and a plain fetch; 7. no bill offered.
# Ways to pay: none (it's free; no paymentMethods and no renewal day). Bundles: none. Official resellers: none: libraries
# pay for it. Its BingePasses lend partners' collections (Hallmark+, Curiosity Stream's classes, magazines) for seven
# days with one borrow: perks, not bundles, since nothing is bought.
# Features, read 2026-11-13: what it lends, from its about page ("digital video (movies and TV shows), music, audiobooks,
# Ebooks and comics") and its help centre ("eBooks, audiobooks, comics, movies, and TV"; Kids Mode, "designed especially
# for kids (up to age 12)"), so it fits music and books as well as streaming. Video quality: no page states it. Its Fire
# TV answer's "Streaming is available in 4K resolution." sits under "Additional Fire TV Features" beside "Fire TV
# supports voice control.", so it describes the device, not Hoopla's films; its speed advice asks for "2-3 available
# Mbps". Waiting (awaitingRequiredFeatures, the review of 2026-11-13). Streams at once: "Hoopla however, can only run one stream per
# account at a given time" (Can I link my Hoopla account to multiple streaming set top boxes?) and "you can only use your
# account on one device at a time" (Can I use Hoopla on multiple devices?). Ads: "No subscription fees", "No late fees",
# "No ads" (What Is Hoopla Digital?, its blog). Downloads: "download content for offline access" in its apps (Features on
# Hoopla), "If you wish to download a title, you can do so on any of our three mobile apps (Android, iOS, Kindle)", with
# no number of devices, so 1, inferred. Music: "you can stream full albums" and "Hoopla also offers offline listening."
# (Where Can I Stream Music for Free?); no page, nor a named publication found, gives its audio quality, so the plan
# waits in core's awaitingRequiredFeatures for audio.quality (notes.md). Books: eBooks, audiobooks, "comics and manga";
# downloads stay in its apps, "nor can it be sent to your Amazon Kindle E-Reader" (Can I transfer Hoopla content...?).
# No profiles ("We are working on a way to accommodate multiple accounts."). Kids Mode is a filter anyone can turn on or
# off in settings, with no PIN on any page ("Kids Mode is a feature that should be used with parental guidance."), so
# no parental controls; libraries can block titles and ratings for their own patrons. No pause (nothing to pause).
# Limits, in the plan's notes: "This limit is set by your local library" and "This limit will reset at the beginning of
# the calendar month. Unused borrows will not roll over into the next month." (How many items can I borrow a month?);
# "Most Movies and TV episodes are available for 72 hours (3 days)", "Most Music albums are available for 7 days" and
# "Most Audiobooks, Comics, and eBooks are available for 21 days" (How long is borrowed content available?); some titles
# are Flex borrows, "only one person at a time may borrow a Flex title", with holds.
id: hoopla
name: Hoopla
aliases: [hoopla digital]
website: https://www.hoopladigital.com
category: streaming
spendCategory: streaming
# "Libraries across the United States, Canada, Australia, and New Zealand offer Hoopla." (its help centre's What is
# Hoopla?).
availableIn: [US, CA, AU, NZ]
# Nothing to cancel: its help centre says to email it to delete your account.
cancelUrl: https://www.hoopladigital.com/faq
sources: { pricing: https://www.hoopladigital.com/faq }
notes: Free through participating public libraries, with no ads.
# Owner (M11.2), read 2026-11-13: its about page; its terms and privacy notice are Midwest Tape, LLC's ("an Ohio
# company"), of Holland, Ohio. A private company: no page names its owners or any shares.
owner:
  name: 'Midwest Tape, LLC'
  page:
    name: 'About hoopla'
    url: https://www.hoopladigital.com/about
  quotes:
    - 'hoopla is the digital service of Midwest Tape, a leading provider of entertainment media products and services: DVDs, CDs, audiobooks and shelf-ready solutions, to public libraries across North America for over a quarter of a century.'
  country:
    code: US
    page:
      name: 'Privacy Notice'
      url: https://www.hoopladigital.com/privacy
    quotes:
      - 'Midwest Tape, the owner and operator of https://www.hoopladigital.com (the “Website”) and applications used to access the Hoopla services and its content (the “Apps”), and all related services (collectively the “Services”), is a limited liability company formed under the laws of the State of Ohio.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13

# Sign-in (2026-11-13): its log-in page's "Email", "Password" and "Log In Through Your Organization" (hoopladigital.com/
# login); no two-step sign-in on any page. Platforms: "recent versions of Microsoft Edge, Google Chrome, Safari and
# Firefox on Windows and Mac" ("Titles on the Windows and MacOS platforms are only available for streaming"),
# Chromebooks, Android, iOS, Amazon Fire tablets, Apple TV, Fire TV, Roku, Android TV, LG and Samsung TVs, and Apple
# CarPlay and Android Auto (Supported Devices); no Linux. App languages: its site shows itself in French to a browser set
# to French ("Livres, vidéos et musique - tous gratuits à votre bibliothèque publique!") and in Spanish to one set to
# Spanish ("Libros, videos y música: ¡gratis en tu biblioteca pública!"), read 2026-11-13; its help answers stay in
# English. Support: "please email us at feedback@hoopladigital.com" and its contact form; "There is no patron support
# phone line for Hoopla digital."
features:
  platforms: [web, ios, android, tv]
  account.sign-in: [password, sso]
  languages.interface: [en, fr, es]
  support.channels: [email]

