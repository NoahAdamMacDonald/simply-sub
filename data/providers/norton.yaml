      status: not-stated
      reason: 'Its terms list no fees beyond the price and taxes.'
      pages:
        [https://ca.norton.com/terms-of-sale, https://ca.norton.com/legal/lsa?lsar=americas&lsal=en]
      lastVerified: 2026-11-13
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its terms don’t say what happens to what you’ve paid when you switch plans.'
      pages:
        [https://ca.norton.com/terms-of-sale, https://ca.norton.com/legal/lsa?lsar=americas&lsal=en]
      lastVerified: 2026-11-13
