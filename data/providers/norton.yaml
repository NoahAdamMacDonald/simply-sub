# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch and Edge from Canada. Every agreement a user
# accepts: its plans pages' "subscription contracts ... are subject to our Terms of Sale and License & Services Agreement"
# (norton.com/terms-of-sale, a PDF "Effective Date: June 2020" still in NortonLifeLock's name, and norton.com/legal/lsa,
# Gen Digital's License and Services Agreement, "GEN_LSA_November_2026_AMS EN", with LifeLock's terms as its Addendum 1),
# its Cancellation and Refund Policy (norton.com/return-policy) and Gen's General Privacy Notice, rated once as a shared
# document (data/policies/gen-digital-privacy.yaml, drafted in .pipeline/norton/draft/policies/), with Norton's own
# Products Privacy Notice rated here. The licence is Gen's, but its product terms are Norton's and LifeLock's; Avast uses
# its own EULA, so it isn't shared (notes.md). The LSA read is the Americas' (ca.norton.com, "If you live in the United
# States ... binding arbitration"); Europe's and Asia-Pacific's versions (its region picker) weren't read. Not read: the
# checkout's agreement line (no checkout opened), LifeLock's Stolen Identity Event Insurance terms, the Norton Virus
# Protection Promise terms, and the third-party terms its LSA mentions (OpenAI's for Private Browser's Smart Chat, not
# drafted).
