# Features in depth, read 2026-11-13:
# - Antivirus: "Real-time Threat Protection for your Device", "Smart Firewall for PC or Firewall for Mac" (every plan
#   page, AntiVirus Plus's too), "Antivirus, malware, ransomware, and hacking protection" (every card), Safe Web (its
#   menus' "Safe Web" and the UK's plan pages). Scam Protection "Detects scams in texts and deepfake videos" with
#   "AI-powered defense against scams online, in texts or deepfake videos"; Scam Protection Pro (Advanced and LifeLock)
#   is "Comprehensive Scam Protection for your email, phone calls, SMS, and web browsing." Every 360 plan adds "SafeCam
#   for PC" ("Alerts you to attempts to access your webcam"). No page read states behaviour-based detection, the kinds
#   of scan, cryptomining, vulnerability scans, anti-spam, anti-theft or speed-up tools for these plans: left out.
# - Password Manager: "Create and store passwords, bank card info, and other online credentials for free* in our
#   encrypted online vault." (its page): logins and cards.
# - Norton VPN (ca.norton.com/products/norton-vpn and /feature/vpn-server-locations): "Kill Switch to help prevent
#   privacy exposure", "IP Rotation and Double VPN for extra privacy", "Ad Blocker" and "Tracker Blocker", "A third-party
#   audit by VerSprite has verified that we don’t track, log, or save your online activities.", protocols "WireGuard,
#   OpenVPN, IPSec, and our proprietary Mimic" (IPSec and Mimic have no registry value that fits without a guess), and
#   its server list's "P2P Optimized" column; split tunneling in its help centre ("lets you exclude some of your apps from
#   the VPN channel"). Server countries: its list names 100 or so countries and territories, and the page says "Support
#   for over 100 countries": 100. Unlimited traffic: no page says so; its licence forbids "excessive bandwidth
#   consumption" without a figure, so false (the rule for a required boolean no page states), and notes.md asks.
# - Parental Control: "setting screen-time, limits and blocking unsuitable sites, plus locate your child’s device" (the
#   VPN page's), on Deluxe and up and on 360 for Gamers.
# - Dark Web Monitoring and Privacy Monitor as each country's cards list them; Privacy Monitor finds your details on
#   people-search sites (its licence's "request removal of your personal information from Third-Party Sites" is
#   Privacy Monitor Assistant's, not drafted).
