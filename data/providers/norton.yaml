      regions: [US]
      tier: bad
      reason: 'In the US, disputes go to a private referee (an arbitrator) or small claims court, one person at a time, with no group lawsuits, and you can’t opt out.'
      sources:
        - url: https://ca.norton.com/legal/lsa?lsar=americas&lsal=en
          quote: 'a. We both agree that any dispute arising out of or relating to the software and services ( claim ) will be determined by binding arbitration or small claims court, instead of in courts of general jurisdiction.'
        - url: https://ca.norton.com/legal/lsa?lsar=americas&lsal=en
          quote: 'WE BOTH AGREE THAT WE EACH MAY BRING CLAIMS AGAINST THE OTHER ONLY IN YOUR OR ITS INDIVIDUAL CAPACITY, AND NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY PURPORTED CLASS OR REPRESENTATIVE PROCEEDING.'
      lastVerified: 2026-11-13
