  shared: [gen-digital-privacy]
  links:
    - name: 'License and Services Agreement'
      url: https://ca.norton.com/legal/lsa?lsar=americas&lsal=en
    - name: 'Terms of Sale'
      url: https://ca.norton.com/terms-of-sale
    - name: 'Cancellation and Refund Policy'
      url: https://support.norton.com/sp/en/us/home/current/solutions/kb20100113164023EN
    - name: 'FAQ: Norton subscription and renewal'
      url: https://support.norton.com/sp/en/us/home/current/solutions/v117675374
    - name: 'Products Privacy Notice'
      url: https://ca.norton.com/privacy/products-privacy-notice
    - name: 'Password Manager'
      url: https://ca.norton.com/feature/password-manager
    - name: 'Report a security vulnerability (Gen)'
      url: https://www.gendigital.com/ca/en/contact-us/report-a-potential-security-vulnerability/
    - name: 'Plans and subscription details (Canada)'
      url: https://ca.norton.com/products
  ratings:
    - topic: billing.cancellation
      tier: good
      reason: 'You can stop it renewing in your Norton account, or by chat, at any time, and keep your protection to the end of the time you paid for.'
      sources:
        - url: https://support.norton.com/sp/en/us/home/current/solutions/v117675374
          quote: "To cancel your subscription, sign in to your account and visit the My Subscriptions tab, or we'd be happy to chat about it."
        - url: https://support.norton.com/sp/en/us/home/current/solutions/v117675374
          quote: 'However, your protection will continue through the end of your current paid term.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: good
      reason: 'Paid yearly, you can get all your money back within 60 days of buying it, and again within 60 days of each yearly renewal.'
      sources:
        - url: https://support.norton.com/sp/en/us/home/current/solutions/kb20100113164023EN
          quote: 'Under our 60-day Money Back Guarantee, the purchase of an annual subscription is eligible for a full refund, if requested within 60 days of the date of purchase.'
        - url: https://support.norton.com/sp/en/us/home/current/solutions/kb20100113164023EN
          quote: 'Each subsequent annual charge is also eligible for a full refund if requested within 60 days of being charged.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      plans: [norton.360-for-gamers]
      tier: neutral
      reason: 'Paid monthly (in the US), you get your money back only within 14 days of first buying it, not after a monthly renewal. Paid yearly, the 60-day refund applies.'
      sources:
        - url: https://support.norton.com/sp/en/us/home/current/solutions/kb20100113164023EN
          quote: 'The purchase of a monthly subscription is eligible for a full refund if requested within 14 days of the date of purchase.'
        - url: https://support.norton.com/sp/en/us/home/current/solutions/kb20100113164023EN
          quote: 'Subsequent monthly charges are not eligible for a refund.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: great
      reason: 'A new price applies when you renew. It emails you the next year’s price about 50 to 65 days before each yearly renewal, so you can cancel first.'
      sources:
        - url: https://ca.norton.com/legal/lsa?lsar=americas&lsal=en
          quote: 'The amount charged will be the price of the software or services at the time of renewal, which might be different than the amount you originally paid.'
        - url: https://support.norton.com/sp/en/us/home/current/solutions/v117675374
          quote: 'We send a notification email before each upcoming annual renewal (usually about 50-65 days ahead), so that you are not caught off-guard.'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: neutral
      reason: 'A free trial needs a payment method and turns into a paid plan unless you cancel before it ends.'
      sources:
        - url: https://ca.norton.com/products
          quote: 'For trials, a payment method is required at sign-up and will be charged at the end of the trial period, unless cancelled first.'
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      tier: good
      reason: 'It emails you about 50 to 65 days before each yearly renewal, with the price. Monthly plans get no reminder each month.'
      sources:
        - url: https://support.norton.com/sp/en/us/home/current/solutions/v117675374
          quote: 'We send a notification email before each upcoming annual renewal (usually about 50-65 days ahead), so that you are not caught off-guard.'
        - url: https://ca.norton.com/legal/lsa?lsar=americas&lsal=en
          quote: 'We’ll email you in advance to let you know that your subscription is due for renewal and will charge your payment type up to 35 days before the subscription is due to end.'
      lastVerified: 2026-11-13
