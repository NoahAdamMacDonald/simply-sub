# Researched by hand on 2026-11-13 (M11.15, security batch 1), read with Edge from Canada: each country's own Norton site
# (ca., us., uk., ie., au., nz., de., fr., nl., es. and it.norton.com), whose pages price in their own currency whoever
# reads them (the US's products page read again through a US exit showed the same prices and "US" in its country
# picker); its support centre, its legal pages and Gen Digital's privacy and investor pages with a plain fetch. Pages,
# each quoted where it's used:
# Pricing: each country's products page (norton.com/products) and plan pages (/products/norton-360-standard, -deluxe,
# -premium, -advanced, -for-gamers, -antivirus-plus, -lifelock-select, -lifelock-advantage, -lifelock-ultimate-plus).
# The regular price is the struck-through one ("C$59.99" over "C$29.99 first yr.") or the one the card names ("Savings
# compared to the renewal price of $94.99/year.", "Automatically renews at £ 69.99/year, unless the renewal is
# cancelled."); the first year's is an offer. The "2 Years" tabs are a first term only ("£ 74.99 first 2 yrs ...
# Automatically renews at £ 69.99/year"), so only yearly prices are stored. Monthly billing: only the US's 360 for
# Gamers shows a regular monthly price; the LifeLock Monthly tabs show only a first year's ("$24.99 /mo. first yr.").
# No page says its prices include tax: Canada's say "Plus applicable sales tax.", and the Terms of Sale "Exclusive of
# VAT and/or any other applicable taxes unless by law they must be added to the price payable."
# What each country sells: its menu ("ALL-IN-ONE-PLANS", "DEVICE SECURITY") and its cards, which differ by country in
# devices, backup and identity features, so a plan whose features differ is a plan of its own (Disney+'s and BritBox's
# precedent): 21 plans. Plan pages a country's menu doesn't link (us.norton.com/products/norton-360-premium,
# de.norton.com/products/norton-360-for-gamers, au.norton.com/products/norton-360-for-gamers) aren't sold there now and
# aren't priced (Acorn TV's precedent for unlinked pages). Cloud Backup (2 GB to 500 GB, "only available on Windows")
# varies by country with no other difference, so it's in each plan's notes, not storage.cloud (see notes.md).
# Region checklist for CA and US, 2026-11-13: 1. each country's own subdomain (ca., us.); 2. its country picker (the same
# subdomains); 3. its pages name the currency (C$) or the country ("US" in its picker; read through a US exit too); 4.
# the checkout wasn't opened; 5. its help centre's payment and renewal articles; 6. Edge and a plain fetch; 7. no bill
# offered.
# Not drafted (see notes.md): Norton VPN Standard, Plus and Ultimate (its own VPN plans; prices saved), Mobile Security
# for Android and iOS, AntiTrack, Privacy Monitor Assistant, Norton Family, Utilities Ultimate, Driver Updater, Ultimate
# Help Desk, Computer Tune Up, Identity Advisor Plus, Small Business and the free Private Browser.
# Bundles: none sold on its pages. Official resellers: none named; its partner pages ("Make it rewarding to sell
# award-winning Norton products and services", gendigital.com) are for retailers and service providers, and its terms
# speak of "our authorized resellers" without naming any. App stores bill its mobile apps: partners, not listed.
# Free use: Norton Password Manager is free (its plan below); Genie, Safe Web and Private Browser are free tools too.

# Coverage: norton.antivirus-plus in AU: Australia sells its own, norton.antivirus-plus-pc-mac ("1 PC or Mac").
# Coverage: norton.antivirus-plus-pc-mac in CA, US, GB, IE, NZ, DE, FR, NL, ES and IT: Australia's own plan.
# Coverage: norton.antivirus-plus-3-devices in CA, US, GB, IE, AU, NZ, DE, FR, ES and IT: the Netherlands' own plan.
# Coverage: norton.360-standard in US and GB: theirs cover 3 devices (norton.360-standard-us, norton.360-standard-3-devices).
# Coverage: norton.360-standard-3-devices in CA, US, IE, AU, NZ, DE, FR, NL, ES and IT: the UK's own plan.
# Coverage: norton.360-standard-us in CA, GB, IE, AU, NZ, DE, FR, NL, ES and IT: the US's own plan.
# Coverage: norton.360-deluxe in CA, US, AU and NZ: Canada and the US sell their own (norton.360-deluxe-canada,
# norton.360-deluxe-us), and Australia and New Zealand a 3-device one (norton.360-deluxe-3-devices).
# Coverage: norton.360-deluxe-3-devices in CA, US, GB, IE, DE, FR, NL, ES and IT: Australia's and New Zealand's plan.
# Coverage: norton.360-deluxe-canada in US, GB, IE, AU, NZ, DE, FR, NL, ES and IT: Canada's own plan.
# Coverage: norton.360-deluxe-us in CA, GB, IE, AU, NZ, DE, FR, NL, ES and IT: the US's own plan.
# Coverage: norton.360-premium in CA, GB, AU and NZ: Canada sells its own (norton.360-premium-canada), Australia and
# New Zealand a 5-device one, and the UK's menu lists no Premium. The US's menu doesn't link it, but its own page sells
# it ("Savings compared to the renewal price of $149.99/year.", us.norton.com/products/norton-360-premium, with 100 GB of
# cloud backup there; the review of 2026-11-13).
# Coverage: norton.360-premium-5-devices in CA, US, GB, IE, DE, FR, NL, ES and IT: Australia's and New Zealand's plan.
# Coverage: norton.360-premium-canada in US, GB, IE, AU, NZ, DE, FR, NL, ES and IT: Canada's own plan.
# Coverage: norton.360-advanced in CA, US, GB, IE, AU and NZ: the UK and Australia sell their own; Canada's, the US's,
# Ireland's and New Zealand's menus list no Advanced (ca.norton.com/products/norton-360-advanced is a page not found).
# Coverage: norton.360-advanced-uk in CA, US, IE, AU, NZ, DE, FR, NL, ES and IT: the UK's own plan.
# Coverage: norton.360-advanced-au in CA, US, GB, IE, NZ, DE, FR, NL, ES and IT: Australia's own plan.
# Coverage: norton.360-for-gamers in AU, FR, NL, ES and IT: their menus don't list it, and their own pages show no price.
# Germany's page sells it ("Ersparnis im Vergleich zum Verlängerungspreis von 99,99 €/Jahr.", the review of
# 2026-11-13).
# Coverage: norton.360-lifelock-select-plus, norton.360-lifelock-advantage and norton.360-lifelock-ultimate-plus in CA, GB,
# IE, AU, NZ, DE, FR, NL, ES and IT: sold in the US only (its menu's "Norton 360 with LifeLock"; LifeLock's terms ask US
# customers for a Social Security Number).

