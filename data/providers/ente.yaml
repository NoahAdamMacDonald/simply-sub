  - id: ente.auth
    name: Auth
    link: https://ente.com/auth
    categories: [passwords]
    features:
      password-manager: false
      authenticator.included: true
      authenticator.import: [otpauth, google-authenticator, other-apps]
      authenticator.export: [otpauth, encrypted-backup, plain-backup]
      encryption.end-to-end: [passwords, backups]
    perks: [auth-offline-mode]
    notes: 'Free and open source, for everyone. Sign in with an Ente account to sync your codes end-to-end encrypted, or use it on one device without an account.'
    prices:
      - {
          region: GLOBAL,
          currency: USD,
          amount: 0,
          interval: month,
          intervalCount: 1,
          autoRenew: true,
          lastVerified: 2026-11-19,
          sourceUrl: https://ente.com/auth,
        }

# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with Edge: its Terms and Conditions (last updated May 05, 2026)
# and Privacy Policy (October 16, 2026), which the Terms name as the whole agreement ("This Agreement along with our
# Privacy Policy constitutes the entire agreement"); its apps are open source (AGPL-3.0, its Auth page), with no other
# licence. The help centre's Storage and Plans, Security and Privacy and Account Creation FAQs and Auth FAQ, its blog's
# audit posts, and its GitHub security policy. Not read: the app stores' own terms for iOS purchases. Its sign-up form
# needs an email address, which wasn't entered.
policies:
  links:
    - name: 'Terms and Conditions'
      url: https://ente.com/terms
    - name: 'Privacy Policy'
      url: https://ente.com/privacy
    - name: 'Storage and Plans FAQ'
      url: https://ente.com/help/photos/faq/storage-and-plans
    - name: 'Security and Privacy FAQ'
      url: https://ente.com/help/photos/faq/security-and-privacy
    - name: 'Account Creation FAQ'
      url: https://ente.com/help/photos/faq/account-creation
    - name: 'Exporting your photos'
      url: https://ente.com/help/photos/features/backup-and-sync/export
    - name: 'Ente Auth FAQ'
      url: https://ente.com/help/auth/faq
    - name: 'Ente Auth'
      url: https://ente.com/auth
    - name: 'Security audit (2023)'
      url: https://ente.com/blog/cryptography-audit/
    - name: 'CERN-sponsored audit (2025)'
      url: https://ente.com/blog/cern-audit/
  ratings:
    - topic: privacy.data-collection
      tier: bad
      reason: 'Its apps send no usage analytics, and their crash reports are anonymous. But its website counts your visits with PostHog, and it gives no way to turn that off.'
      sources:
        - url: https://ente.com/privacy
          quote: 'We do not collect analytics about how you use our app features, and crash reports (if any) are anonymized.'
        - url: https://ente.com/privacy
          quote: 'Website analytics PostHog'
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: good
      reason: 'It doesn’t sell your data. It shares it with companies that help run the service and with its own subsidiaries.'
      sources:
        - url: https://ente.com/privacy
          quote: 'We do not sell your personal information, nor do we intend to do so.'
        - url: https://ente.com/privacy
          quote: 'There are times when Personal Information that you have shared with us may be shared by Ente with others to enable us to provide you over Services, including contractors, service providers, and third parties ("Partners") and subsidiaries.'
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: great
      reason: 'No ads and no cookies: it earns its money from subscriptions, not from advertising.'
      sources:
        - url: https://ente.com/privacy
          quote: 'We do not set or use Cookies on our website and app.'
        - url: https://ente.com/help/photos/faq/security-and-privacy
          quote: 'Our pricing model allows us to profitably provide this service without relying on advertising or selling your data.'
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      tier: great
      reason: 'Your photos never train AI, its own or anyone else’s. Face recognition and search run on your own device.'
      sources:
        - url: https://ente.com/help/photos/faq/security-and-privacy
          quote: 'Your photos and ML data are never used to train any AI models, neither by Ente nor by any third parties.'
      lastVerified: 2026-11-19
    - topic: privacy.content-access
      tier: great
      reason: 'Your photos, files and codes are locked on your device before they’re uploaded, and only you hold the key, so Ente can’t see them.'
      sources:
        - url: https://ente.com/privacy
          quote: 'Your Files, their metadata and any derived indexes (including but not limited to Biometric Information such as face geometry) are stored end-to-end encrypted.'
        - url: https://ente.com/privacy
          quote: 'All of your files and the metadata related to those files are stored encrypted, and only you hold the decryption keys.'
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: good
      reason: 'After you delete your account, your files are gone for good after 7 days. Other data about you may stay up to 60 days, then it’s made anonymous.'
      sources:
        - url: https://ente.com/help/photos/faq/security-and-privacy
          quote: "After 7 days, your Ente Photos, Ente Auth and Ente Locker data is permanently deleted and can't be recovered."
        - url: https://ente.com/privacy
          quote: 'After account termination, we may retain your Data for sixty (60) days, or as warranted by your jurisdiction ("Retention Period"), unless an enforcement action is likely under our Terms.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can delete your account and everything in it yourself, at any time, from the app’s settings.'
      sources:
        - url: https://ente.com/help/photos/faq/security-and-privacy
          quote: 'You can delete your account at any time by using the "Delete account" option in the settings.'
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: great
      reason: 'You can download all your photos as the original files, with their details in a common format other apps read. Ente Auth exports your codes too.'
      sources:
        - url: https://ente.com/help/photos/features/backup-and-sync/export
          quote: 'Export allows you to download your entire Ente library or specific albums to local storage.'
        - url: https://ente.com/help/photos/features/backup-and-sync/export
          quote: "The JSON format matches Google Takeout format, so tools that support Google Takeout imports can read Ente's exported metadata."
        - url: https://ente.com/help/auth/faq
          quote: 'Yes, you can export your codes as HTML QR codes and then scan them in Google Authenticator to import them.'
      action:
        name: 'How to export your photos'
        url: https://ente.com/help/photos/features/backup-and-sync/export
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over data when a court order, a law or a government asks. It holds little it could read, but doesn’t promise to tell you or publish a report.'
      sources:
        - url: https://ente.com/privacy
          quote: 'We will disclose personal information (i) to comply with any court order, law, or legal process, including to respond to any government or regulatory request'
      lastVerified: 2026-11-19
    - topic: privacy.data-location
      tier: good
      reason: 'Your files are kept in three copies in three EU countries. Some data can be reached from the US, under the EU’s standard rules for sending data abroad.'
      sources:
        - url: https://ente.com/help/photos/faq/security-and-privacy
          quote: 'We store 3 copies of your data across 3 different providers in 3 different EU countries'
        - url: https://ente.com/privacy
          quote: 'Our servers or our third-party hosting services partners are located in Europe.'
        - url: https://ente.com/privacy
          quote: "As applicable, we require that our Partners, affiliates, and subsidiaries sign data processing agreements and/or agree to the European Union's model contract for the transfer of personal data to third countries"
      lastVerified: 2026-11-19
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with only an email address and a password. Its pages don’t say whether an email alias works.'
      sources:
        - url: https://ente.com/terms
          quote: 'For setting up an Account, they will be required to (a) enter their email address, and (b) set up a password ("Password") (collectively, the "Account Information").'
      lastVerified: 2026-11-19
    - topic: privacy.sign-up-data
      plans: [ente.auth]
      tier: great
      reason: 'Ente Auth works without any account: your codes stay on your device, and you give nothing to sign up.'
      sources:
        - url: https://ente.com/help/auth/faq
          quote: 'Yes. Choose Use without backups to use Ente Auth offline without an account.'
      lastVerified: 2026-11-19
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel in the app’s settings, and your plan keeps working until the end of the time you paid for.'
      sources:
        - url: https://ente.com/help/photos/faq/storage-and-plans
          quote: 'For a subscription purchased directly from Ente, open Settings > Storage/Subscription > Cancel subscription, or Settings > Account > Manage subscription > Cancel subscription.'
        - url: https://ente.com/help/photos/faq/storage-and-plans
          quote: 'Your paid plan continues until its expiry date.'
      lastVerified: 2026-11-19
    - topic: billing.refunds
      tier: neutral
      reason: 'No refunds: what you pay is final, though your plan runs to the end of the time you paid for. It refunds charges made after you cancel.'
      sources:
        - url: https://ente.com/terms
          quote: 'Unless otherwise provided by applicable laws or by a particular Service offer, all Purchases are final and non-refundable.'
        - url: https://ente.com/terms
          quote: 'Any payments processed after an effective Cancellation or Termination will be promptly refunded by us.'
      lastVerified: 2026-11-19
    - topic: billing.price-changes
      tier: poor
      reason: 'If it changes its prices, it only says it will update its pricing page. It doesn’t promise to tell you first.'
      sources:
        - url: https://ente.com/terms
          quote: 'In the event that we modify the Paid Plans and their respective fees ("Fees") in the future, we will update that on the aforementioned link.'
      lastVerified: 2026-11-19
    - topic: billing.free-trials
      status: not-applicable
      reason: 'It has no free trial that turns into a paid plan: its free plan stays free, and you choose when to pay.'
      lastVerified: 2026-11-19
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say paid plans renew on their own, but not that it reminds you before they do.'
      pages:
        - https://ente.com/terms
        - https://ente.com/help/photos/faq/storage-and-plans
      lastVerified: 2026-11-19
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms and billing help name no fees beyond the price and your local taxes.'
      pages:
        - https://ente.com/terms
        - https://ente.com/help/photos/faq/storage-and-plans
      lastVerified: 2026-11-19
    - topic: billing.plan-changes
      tier: great
      reason: 'You can switch plans whenever you like. The change happens at once, and what you already paid counts toward the new plan either way.'
      sources:
        - url: https://ente.com/help/photos/faq/storage-and-plans
          quote: 'Your new plan will go into effect immediately, and you only have to pay the difference.'
        - url: https://ente.com/help/photos/faq/storage-and-plans
          quote: 'Your new plan will go into effect immediately. Any extra amount you have paid will be credited to your account.'
      lastVerified: 2026-11-19
    - topic: legal.disputes
      tier: poor
      reason: 'A private referee settles disagreements instead of a court, and you can’t join a group lawsuit, unless you mail it a letter saying no within 30 days of first agreeing.'
      sources:
        - url: https://ente.com/terms
          quote: 'PLEASE NOTE THAT THESE TERMS CONTAIN A BINDING AND MANDATORY ARBITRATION PROVISION AND CLASS ACTION/JURY TRIAL WAIVER PROVISION.'
        - url: https://ente.com/terms
          quote: 'USERS HAVE THE RIGHT TO OPT OUT OF BINDING ARBITRATION WITHIN THIRTY (30) DAYS OF THE DATE USERS FIRST ACCEPTED THE TERMS OF THIS SECTION BY WRITING TO: ENTE, RE: OPT-OUT, 1111B S GOVERNORS AVE #6032, DOVER, DE 19904.'
      action:
        name: 'How to opt out of arbitration, by post'
        url: https://ente.com/terms
      lastVerified: 2026-11-19
    - topic: legal.terms-changes
      tier: poor
      reason: 'It can change its terms whenever it wants, and if you keep using it, that counts as saying yes.'
      sources:
        - url: https://ente.com/terms
          quote: 'We reserve the right, at our sole discretion, to change or modify this Agreement at any time. Your continued use of our Services confirms your acceptance of our updated Agreement.'
      lastVerified: 2026-11-19
    - topic: legal.account-closure
      tier: bad
      reason: 'It can suspend or close your account for any reason, even if serving you is no longer worth its while, and its terms promise no warning or refund.'
      sources:
        - url: https://ente.com/terms
          quote: "We reserve the right to suspend or terminate a Subscriber's Account and their license to use our Services for any reason, including, but not limited to, if we reasonably believe:"
        - url: https://ente.com/terms
          quote: '(c) the provision of our Services to them is no longer commercially viable'
      lastVerified: 2026-11-19
    - topic: legal.content-rights
      tier: great
      reason: 'It takes no rights over your photos and files beyond what it needs to store, back up and share them for you.'
      sources:
        - url: https://ente.com/terms
          quote: "These Terms don't give us any rights to a Subscriber's Files and Data except for the limited rights that enable us to offer the Services."
        - url: https://ente.com/terms
          quote: 'solely for the purposes of providing our Services and in accordance with these Terms and the Privacy Policy'
      lastVerified: 2026-11-19
    - topic: legal.service-changes
      tier: poor
      reason: 'Its terms say it isn’t responsible if your stored files are deleted or fail to be kept, so you should keep copies of your own.'
      sources:
        - url: https://ente.com/terms
          quote: '(iii) the deletion of, or the failure to store or to transmit, any content and other communications maintained by our websites or apps;'
        - url: https://ente.com/terms
          quote: '(vi) shall maintain copies of all Data stored by them on our Platform'
      lastVerified: 2026-11-19
    - topic: legal.inactivity
      tier: good
      reason: 'A free account you don’t use for 12 months is deleted, after three warning emails. A paid account never is.'
      sources:
        - url: https://ente.com/terms
          quote: 'In case of inactivity, we will send 3 advance email reminders to the email address associated with the free account before deletion, and the first such reminder will be sent at least one month before deletion.'
        - url: https://ente.com/help/photos/faq/storage-and-plans
          quote: 'Free accounts with no active paid subscription are deleted after 12 consecutive months of inactivity.'
      lastVerified: 2026-11-19
    - topic: legal.licence
      tier: great
      reason: 'All its apps are open source: anyone can read, change and share their code, and even run its server.'
      sources:
        - url: https://ente.com/auth
          quote: 'Ente is fully open source. You can export and import your data. No lockins.'
        - url: https://ente.com/auth
          quote: 'AGPL-3.0'
      lastVerified: 2026-11-19
    - topic: security.practices
      tier: good
      reason: 'Outside security firms have checked its apps, encryption and servers, and it published their reports. You can report security flaws, but it pays no bug bounty.'
      sources:
        - url: https://ente.com/blog/cryptography-audit/
          quote: "We're happy to announce that Ente's architecture and source code have been successfully audited by Cure53, in collaboration with Symbolic Software."
        - url: https://ente.com/blog/cern-audit/
          quote: 'Ente, specifically the server side - both code, and infrastructure on which it runs - was audited by a team of 5 researchers from the German cybersecurity firm Cure53 over a period of 2 weeks as part of a CERN sponsored audit.'
        - url: https://ente.com/help/photos/faq/security-and-privacy
          quote: 'If you believe you have found a security vulnerability, please responsibly disclose it by emailing security@ente.com or using this link instead of opening a public issue.'
      lastVerified: 2026-11-19
    - topic: service.account-sharing
      tier: great
      reason: 'A paid plan can be shared with up to 5 other people, each with their own private account, at no extra cost.'
      sources:
        - url: https://ente.com/help/photos/faq/storage-and-plans
          quote: 'You can invite up to 5 family members to your plan. Including yourself, a total of 6 people can share a single subscription while paying only once.'
      lastVerified: 2026-11-19
    - topic: service.software-control
      tier: good
      reason: 'Its desktop app downloads and installs its own updates. Its pages don’t say it changes anything else on your device.'
      sources:
        - url: https://ente.com/help/photos/faq/account-creation
          quote: 'Ente desktop includes auto-update functionality - whenever updates are deployed, the app will automatically download and install them.'
      lastVerified: 2026-11-19
