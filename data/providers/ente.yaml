# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 1), read with Edge from Canada and with a plain
# fetch (curl): ente.com's home page (its pricing section, with the plan data the page loads), its Auth, Locker, Ensu,
# About and Contact pages, its Terms and Conditions and Privacy Policy, its help centre (ente.com/help: the Photos FAQ's
# Storage and Plans, Security and Privacy and Account Creation, the Photos account, family plan, passkey, legacy,
# installation and export guides, every Ente Auth article, the Locker credentials article), three blog posts (its
# Cure53 audit of 2023, the CERN-sponsored audit of 2025, Pricing update) and its GitHub SECURITY.md; the home page again
# through US, UK, Irish, Australian, New Zealand, German, French, Dutch, Spanish and Italian exits. ente.io now sends
# every page to ente.com, so ente.io is in its domains.
# Pricing: the home page's pricing section (ente.com/#pricing, the Terms' "Paid Plans, their Storage Limits and,
# corresponding fees" link), whose Monthly and Annually switch shows Starter (50 GB), Popular (200 GB), Pro (1000 GB) and
# Pro+ (2000 GB), each monthly and yearly, and "10GB free forever". The page fills the prices from the plan data it
# loads, which follows the visitor's country: "£2.99" through a UK exit and "€2.99" through Irish, German, French, Dutch,
# Spanish and Italian exits, each country's own; and a bare "$2.99" through US, Australian and New Zealand exits alike,
# the same list as the page's own built-in plan data and the help centre's worked examples ("50 GB monthly plan
# ($2.99/month)"). Its FAQ says "We keep a single price globally because our infrastructure and payment costs are
# billed to us in USD/EUR", so the "$" list is US dollars, the only dollar it can be (Stremio's and Devin's precedent),
# stored for everywhere (GLOBAL), flagged for the owner (notes.md). Canada sees a list of its own in a bare "$" ($3.99 a
# month and $41.88 a year for 50 GB, $7.99 and $83.88 for 200 GB, $15.99 and $167.88 for 1000 GB, $31.99 and $323.88 for
# 2000 GB), read from Canada in Edge: not the US list, and no page names its currency (CA$, C$ or
# CAD), so it isn't stored and the GLOBAL list stands for Canada (notes.md). No page says the prices include tax: the
# Terms say subscribers "will pay, if applicable, all applicable customs, duties, sales, use, value added or other
# taxes". None is a first-term offer: "We don't offer a separate renewal or loyalty discount, so your plan renews at the
# regular price." Students' 30% off, referral storage and partner discount codes are offers (notes).
# Region checklist for CA and US, 2026-11-19: 1. ente.com has language paths only (/de/, /fr/, /nl/, /es/, /it/, /tr/),
# no country paths; 2. a language picker only; 3. the page's plan data (the prices above, no country or currency code;
# its structured data still names an older "0.99" EUR list); 4. the checkout is in the web app after signing up, so not
# opened; 5. the help centre's "Does Ente offer regional pricing?" (above); 6. Edge from Canada, a plain fetch, and Edge
# through a US exit; 7. no bill offered.
# Its individual plans: Ente Photos Free and its four paid storage plans, every one with Ente Locker (100 items free, 1000
# paid), and Ente Auth, free for everyone. Plans above 2 TB are by request ("If you have any queries regarding pricing
# or require a plan above 2TB, please contact support@ente.com."), not priced. No lifetime plan ("We don't offer
# lifetime plans."). Ensu, its on-device AI app, sells nothing (notes.md).
# Bundles: none. Official resellers: none (no page names a shop; its Shop sells merchandise, and "Friends' discounts"
# are other services' codes for Ente subscribers). App stores bill its iOS plans: partners, not listed.
id: ente
name: Ente
aliases: [ente photos, ente auth, ente locker, ente.io]
website: https://ente.com
domains: [ente.io]
category: storage
spendCategory: software
billingCurrency: { GLOBAL: USD, GB: GBP, IE: EUR, DE: EUR, FR: EUR, NL: EUR, ES: EUR, IT: EUR }
# Its help centre's "How can I cancel my subscription?" (Settings > Account > Manage subscription > Cancel subscription,
# or the app store's settings for a subscription billed there).
cancelUrl: https://ente.com/help/photos/faq/storage-and-plans
sources: { pricing: 'https://ente.com/#pricing' }

# Ways to pay (M11.5), read 2026-11-19 in the help centre's Storage and Plans FAQ: cards through Stripe on the web,
# desktop and Android, the App Store on iOS, PayPal for yearly plans only, by emailed invoice ("Only annual plans are
# available via PayPal (monthly plans not supported)", renewed by hand), and crypto (the same FAQ, and BitPay among the
# privacy policy's payment services). No page names a card network ("all major prepaid and credit card providers"), so
# no acceptedNetworks.
paymentMethods:
  - methods: [card, app-store, paypal, crypto]
    page: 'Storage and Plans FAQ'
    url: https://ente.com/help/photos/faq/storage-and-plans
    quotes:
      - 'On Web, Desktop and Android, Stripe helps us process payments from all major prepaid and credit card providers.'
      - 'On iOS, we (have to) use the billing platforms provided by the app store.'
      - 'We support annual subscriptions over PayPal.'
      - 'If you would like to change your payment method entirely (for example, switch between an app store, card, PayPal, or crypto), please contact support@ente.com.'

# Renewal day (M11.5), read 2026-11-19 in its Terms: a plan bought from Ente renews on the day of the month it began; in a
# month without that day it moves to the 1st of the next month (the catalog's same-date takes the shorter month's last
# day: notes.md). App store plans follow the store.
renewalAnchor:
  kind: same-date
  page: Terms and Conditions
  url: https://ente.com/terms
  quotes:
    - 'Any other recurring Paid Plan Subscriptions will renew on the same day of month as it was established, except in cases where the day is not available due to a short month, in which case the renewal date will be moved to the first day of the following month.'
  lastVerified: 2026-11-19

# Owner (M11.2), read 2026-11-19: its about page names no company; its Terms are an agreement with Ente Technologies,
# Inc., which its privacy policy says is headquartered in the US (its contact page gives "1111B S Governors Ave #6032"
# in Dover, Delaware, with offices in Bengaluru and Amsterdam). Private: no page names a listing.
owner:
  name: Ente Technologies, Inc.
  page:
    name: Terms and Conditions
    url: https://ente.com/terms
  quotes:
    - 'These Terms and Conditions ("Agreement", or "Terms") are a legally binding agreement between Ente Technologies, Inc. ("Ente," "we," "us," "our") and'
  country:
    code: US
    page:
      name: Privacy Policy
      url: https://ente.com/privacy
    quotes:
      - 'We are headquartered in United States of America.'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19
notes: >-
  One Ente account works in Ente Photos, Ente Auth and Ente Locker. Paid plans are for Photos storage, shared with up to
  5 family members, and raise Locker to 1000 items; Ente Auth is free. PayPal pays for yearly plans only, by emailed
  invoice, renewed by hand.

# Source code (M11.5): its Auth page links its GitHub repository (github.com/ente/ente, "Fully open source, end-to-end
# encrypted cloud", "AGPL-3.0"), and its help centre documents running its server yourself (Self-hosting). Its home
# page: "open source", "audited", "self-hostable". So fully open, and self-hostable.
sourceRepo:
  url: https://github.com/ente/ente
  page:
    name: Ente Auth
    url: https://ente.com/auth
  quotes:
    - 'Ente is fully open source. You can export and import your data. No lockins.'
  lastVerified: 2026-11-19

# General features, read 2026-11-19. Platforms: Photos for iOS and iPadOS, Android, macOS, Windows and Linux and the web
# (its installation guide: "You can also access Ente Photos directly in your browser without installing anything at
# photos.ente.com."), and Auth on the App Store, Play Store, F-Droid, the web, macOS, Linux and Windows (its Auth page);
# Locker on iOS, Android and the web. Sign-in: an email address and password, "You may be asked to verify your email
# with a 6-digit code", and as a second step "TOTP (Time-based One-Time Passwords)", "WebAuthn/FIDO2 for hardware
# security keys" or a passkey, which "serve as a second factor (2FA) for your Ente account, not as a replacement for
# your password" (Account Creation FAQ), so no passkey sign-in. Support: support@ente.com and its Discord community
# (help centre home), Free's "Community support" against paid plans' "Human support" (the pricing section). App
# languages: its website's picker (English, Deutsch, Français, Nederlands, Español, Italiano, Türkçe). No pause: you
# cancel and the plan runs to its end (Storage and Plans FAQ). No parental controls: a family plan shares storage only
# ("Family plans are only for sharing storage space, not for sharing photos automatically.").
features:
  platforms: [windows, macos, linux, android, ios, web]
  account.sign-in: [password, email-code, totp, security-key]
  support.channels: [email, community]
  languages.interface: [en, fr, es, de, it]
  software.open-source: fully-open
  software.self-hostable: true

# Perks (M11.6), the pricing section's lines that no feature describes, in its words: Ente Locker's items (its app for
# documents, notes and credentials: "Locker works alongside your password manager rather than replacing it", so it isn't
# a password manager), the paid plans' three copies of your data ("1 replica" on Free) and partner discounts, its
# trusted contacts for your account ("Legacy Contacts", the home page; "Ente offers a legacy feature that allows you to
# designate trusted contacts who can access your account if something happens to you."), and Ente Auth's use without an
# account ("Use without backups", "Offline mode", "Use without an account", its Auth page).
perks:
  - id: locker-100-items
    name: 100 items on Locker
  - id: locker-1000-items
    name: 1000 items on Locker
  - id: three-replicas
    name: 3 replicas
  - id: friends-discounts
    name: Friends' discounts
  - id: legacy-contacts
    name: Legacy Contacts
  - id: auth-offline-mode
    name: 'Offline mode: use without an account'

# Storage (storage.cloud), read 2026-11-19 on the pricing section: 10, 50, 200, 1000 and 2000 GB, which Ente counts in
# GiB ("Ente on the other hand, computes your storage quota in GibiBytes (GiBs) by dividing your total bytes uploaded by
# 1024 x 1024 x 1024 ."). Every paid plan is a family plan: "You can invite up to 5 family members to your plan.
# Including yourself, a total of 6 people can share a single subscription while paying only once." (account.users 6;
# Free "cannot: Set up family plans"). End-to-end encrypted on every plan: "Your Files, their metadata and any derived
# indexes (including but not limited to Biometric Information such as face geometry) are stored end-to-end encrypted."
# (privacy policy), and Locker's items ("Ente Locker is an end-to-end encrypted app for securely storing your important
# items and sensitive information."), so files and notes.
# Ente Auth (passwords), read 2026-11-19 on its Auth page and help centre: an authenticator only ("Open source 2FA
# authenticator, with end-to-end encrypted backups"), so password-manager false and authenticator.included true.
# - Imports: QR codes ("Scan the QR code"), plain text files of otpauth links ("Plain text files must be in the following
#   format:" otpauth://totp/...), Google Authenticator's transfer QR codes (Auth FAQ, "How do I import from Google
#   Authenticator if it shows several QR codes?"), and other apps' files: "Ente Auth natively supports imports from many
#   2FA providers." (2FAS Authenticator, Aegis Authenticator, andOTP, Bitwarden, Google Authenticator, LastPass, OTP Auth,
#   Proton, Raivo OTP, and its migration guides for Authy, Microsoft Authenticator and Steam).
# - Exports: "Export: Export your codes in plain text, as an encrypted file, or automatically via the CLI." (Features),
#   the plain text being otpauth links that Auth and other apps import, and "Yes, you can export your codes as HTML QR
#   codes and then scan them in Google Authenticator to import them." (Auth FAQ); each entry can also be shown "as QR
#   code". So otpauth, an encrypted backup and a plain backup file.
# - End-to-end encrypted: its synced codes ("Your codes sync across all your devices, end-to-end encrypted.") and its
#   backups ("Auth provides end-to-end encrypted cloud backups so you don't have to worry about losing your tokens."),
#   so passwords (an authenticator's vault, the registry's words) and backups.
