  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It collects how you use its apps and sites by default, to improve them and to promote its services. To stop it, you have to ask through its privacy portal.'
      sources:
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'We utilize this data to provide, operate, support the use of, improve our Services, and personalize and promote Services.'
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'Object to the processing of your personal data;'
      action:
        name: 'Make a privacy request'
        url: https://datasubjectrequest.lastpass.com/
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares data with social media and ad networks for its ads, which some US laws count as selling it. To stop that, you have to send a request.'
      sources:
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'With third-party social media and advertising networks so that LastPass can advertise on those platforms and measure advertisement effectiveness;'
        - url: https://www.lastpass.com/legal-center/your-privacy-choices
          quote: 'we may also share your personal data with third parties for the purposes of cross-contextual advertising.'
        - url: https://www.lastpass.com/legal-center/your-privacy-choices
          quote: 'If you would like to opt out of the sale or sharing of your data, please submit a request to opt-out using our IRM Portal'
      action:
        name: 'Opt out of sharing for ads'
        url: https://www.lastpass.com/legal-center/your-privacy-choices
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its websites track what you like to show you its ads. You can opt out of the ad cookies, but that choice is only for the browser you set it in.'
      sources:
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'We process personal data to understand how you use our websites and what you like and dislike to display personalized advertisements and content based upon your interests'
        - url: https://www.lastpass.com/legal-center/your-privacy-choices
          quote: 'If you wish to opt-out of having the information these technologies collect used for the purpose of serving you targeted ads, you may opt-out'
      action:
        name: 'Your privacy choices'
        url: https://www.lastpass.com/legal-center/your-privacy-choices
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      tier: great
      reason: 'It can’t read what you keep in your vault, so it doesn’t use it to train AI.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'Your Content is not accessible to us or to our third-party AI providers. We therefore do not use your Content to train AI models.'
      lastVerified: 2026-11-19
    - topic: privacy.content-access
      tier: great
      reason: 'Your vault is locked on your own device with a password only you know, so no one at LastPass can read it.'
      sources:
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'no one at LastPass has access to the encrypted data stored in your vault, except you.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'We do not have access to your master password.'
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data as long as it needs it. It deletes a free account left unused for 2 years, and an account it’s asked to delete within 30 days.'
      sources:
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'We keep your personal data no longer than is needed for the business purposes for which it was collected (as outlined in Section 3) or as necessary to comply with our own legal and regulatory obligations.'
        - url: https://www.lastpass.com/-/media/175854c49fcb489baeaa87e78579e28f.pdf
          quote: 'Free accounts, including the Content located therein, are automatically deleted after two (2) years of inactivity (i.e., no logins or activity associated with the account).'
        - url: https://www.lastpass.com/-/media/175854c49fcb489baeaa87e78579e28f.pdf
          quote: 'Users without access to their LastPass vault or email address can submit a service request to the Care team, who will authenticate the user and delete the account and Content within 30 days of the request.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can delete your account and everything in your vault yourself, at any time, from your account page.'
      sources:
        - url: https://community.lastpass.com/kb/articles/54-delete-your-lastpass-account%EF%BB%BF
          quote: "You can delete your LastPass account on the My Account page if you know your master password, or on the Delete Your Account page if you don't."
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: good
      reason: 'You can download your passwords and notes yourself as a CSV file other apps can read. Attached files aren’t included.'
      sources:
        - url: https://community.lastpass.com/kb/articles/40-export-vault-data-from-lastpass-as-a-generic-csv-file%EF%BB%BF
          quote: 'You can export your LastPass vault data as a CSV file and save it.'
        - url: https://community.lastpass.com/kb/articles/40-export-vault-data-from-lastpass-as-a-generic-csv-file%EF%BB%BF
          quote: 'Exporting attachments is not supported when exporting your LastPass vault data.'
      action:
        name: 'How to export your vault'
        url: https://community.lastpass.com/kb/articles/40-export-vault-data-from-lastpass-as-a-generic-csv-file%EF%BB%BF
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: good
      reason: 'Police need a warrant or court order, it tells you first unless it’s not allowed to, and it can’t open your vault to hand it over. It names no transparency report.'
      sources:
        - url: https://www.lastpass.com/legal-center/law-enforcement-request-guidelines
          quote: 'Absent a valid warrant, subpoena, court order, equivalent legal process, or emergency situation, it is LastPass’s position not to provide User Information to a requester.'
        - url: https://www.lastpass.com/legal-center/law-enforcement-request-guidelines
          quote: 'LastPass will notify the customer of a request before disclosing any User Information so that the customer may seek available legal remedies.'
        - url: https://www.lastpass.com/legal-center/law-enforcement-request-guidelines
          quote: 'Therefore, no one at LastPass has the ability to decrypt the vault data on LastPass’ servers and cannot provide such information in response to a legal request.'
      lastVerified: 2026-11-19
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data goes to the US and other countries, with legal safeguards such as the EU’s standard contract terms.'
      sources:
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'Data that we collect and maintain will be transferred to and processed in the United States and other countries around the world.'
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'Standard Contractual Clauses (inclusive of any variations recognized in other regions of the world)'
      lastVerified: 2026-11-19
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with an email address and a master password. Your name and phone number are optional.'
      sources:
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'Your email is needed to validate, create, and use LastPass Services.'
        - url: https://www.lastpass.com/legal-center/privacy-notice
          quote: 'You may also choose to provide identifiers such as first and last name or phone number to help maintain and support your account.'
      lastVerified: 2026-11-19
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can turn off renewal online in your account, but its terms say to do it at least 30 days before your year ends.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'subscriptions will automatically renew for a period equal to your expiring term, unless either party cancels at least 30 days before the current term expires.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'You can cancel automatic renewal at any time by selecting “Cancel Auto-Renewal” in the My Account section of your LastPass vault’s Account Settings'
      lastVerified: 2026-11-19
    - topic: billing.refunds
      tier: neutral
      reason: 'It never gives money back. If you stop, you keep paying for, and using, the year you’re in.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'All payments are final and non-refundable.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'You will continue to be charged until the end of your current subscription term.'
      lastVerified: 2026-11-19
    - topic: billing.price-changes
      tier: neutral
      reason: 'A new price starts only when you renew, and it says it will tell you first, on its website, by email or on an invoice, but not how long before.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'Price changes take effect at your next renewal.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'We will notify you of price changes in a timely manner, as required by law, by publishing information on our website, emailing you, or including the update on a quote or invoice.'
      lastVerified: 2026-11-19
    - topic: billing.free-trials
      tier: neutral
      reason: 'Its 30-day Premium trial needs no card, but if you give one, it charges you when the trial ends unless you cancel.'
      sources:
        - url: https://www.lastpass.com/pricing
          quote: '30-day free LastPass Premium trial, no credit card required.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'At the end of the trial, unless you cancel, you will be automatically charged the applicable fees for the subscription type you selected.'
      lastVerified: 2026-11-19
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own each year, but not that it reminds you before it does.'
      pages:
        [
          https://www.lastpass.com/legal-center/terms-of-service/personal,
          https://community.lastpass.com/kb/articles/43-update-payment-method%EF%BB%BF,
        ]
      lastVerified: 2026-11-19
    - topic: billing.fees
      tier: neutral
      reason: 'Beyond the price and taxes, it can charge more if more people use your account than you paid for.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'We may review your account and charge additional fees if the number of users on your account exceeds your purchased quantity.'
      lastVerified: 2026-11-19
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its terms and help pages read don’t say what happens to the time you paid for when you switch plans.'
      pages:
        [
          https://www.lastpass.com/legal-center/terms-of-service/personal,
          https://www.lastpass.com/pricing,
        ]
      lastVerified: 2026-11-19
    - topic: legal.disputes
      tier: good
      reason: 'A dispute goes to a court (in Canada, British Columbia’s), not a private referee, but you can’t join a group lawsuit.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'You agree not to bring or participate in any class, consolidated, or representative action against us or any of our employees or affiliates.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'The applicable LastPass entity, contact information, and governing law depend on your billing location and are listed at lastpass.com/legal-center/contracting-entities'
      lastVerified: 2026-11-19
    - topic: legal.terms-changes
      tier: good
      reason: 'It tries to tell you about big changes at least 30 days before they start, and you can stop using it if you don’t agree.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'If we make a material change, we will make reasonable efforts to give you at least 30 days’ notice before the new terms take effect.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'If you do not agree to the new terms, please stop using the Services.'
      lastVerified: 2026-11-19
    - topic: legal.account-closure
      tier: neutral
      reason: 'It can suspend or close your account if it believes you broke its terms, and it keeps what you paid.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'We may suspend or terminate your account if we believe you have violated these Terms.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'All payments are final and non-refundable.'
      lastVerified: 2026-11-19
    - topic: legal.content-rights
      tier: great
      reason: 'What you keep in your vault stays yours. It uses it only to run the service for you.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'You keep all rights to your Content. We may use your Content only as needed to operate and provide the Services to you.'
      lastVerified: 2026-11-19
    - topic: legal.service-changes
      tier: neutral
      reason: 'It can change or stop its services as it chooses.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'We may modify or discontinue the Services at our discretion.'
      lastVerified: 2026-11-19
    - topic: legal.inactivity
      tier: poor
      reason: 'It deletes a free account, and everything in it, after 2 years with no logins. Its pages don’t say it warns you first. Paid accounts aren’t included.'
      sources:
        - url: https://www.lastpass.com/-/media/175854c49fcb489baeaa87e78579e28f.pdf
          quote: 'Free accounts, including the Content located therein, are automatically deleted after two (2) years of inactivity (i.e., no logins or activity associated with the account).'
      lastVerified: 2026-11-19
    - topic: legal.licence
      tier: poor
      reason: 'You may use LastPass for yourself only, and you may not take its apps apart or study its code, with no exception for what the law allows.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'We will provide the Services, and you may use them, in line with these Terms for your own personal use.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'Modify, create derivative works of, reverse engineer, decompile, or try to access the source code of the Services.'
      lastVerified: 2026-11-19
    - topic: security.practices
      tier: good
      reason: 'Outside firms check it every year and it holds certificates such as ISO 27001 and SOC 2, and it pays people who find bugs. The full reports aren’t public.'
      sources:
        - url: https://www.lastpass.com/-/media/175854c49fcb489baeaa87e78579e28f.pdf
          quote: 'LastPass commits that its products and services undergo annual security assessments and attestations conducted by multiple reputable, independent third-party security vendors.'
        - url: https://www.lastpass.com/security
          quote: 'LastPass holds third-party security certifications like ISO 27001, SOC2 Type II, SOC3, BSI C5, TRUSTe, and more.'
        - url: https://www.lastpass.com/trust-center/security/responsible-disclosure
          quote: 'LastPass participates in a bug bounty program, hosted at BugCrowd'
      lastVerified: 2026-11-19
    - topic: service.activity-logging
      tier: good
      reason: 'Its VPN keeps no record of the sites you visit or what you do, it says, but no outside check of this is named.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'Neither LastPass nor the Infrastructure Provider maintains logs of websites visited, DNS requests, application usage, traffic content, or communications transmitted through the VPN Service, or persistent records linking your activity to specific online destinations.'
        - url: https://www.lastpass.com/-/media/0b29716c51274eeda9b857393006def0.pdf
          quote: 'LastPass VPN has been designed with a strict no-log policy with respect to your activity inside the VPN tunnel.'
      lastVerified: 2026-11-19
    - topic: service.account-sharing
      tier: bad
      reason: 'You may not share your account with anyone. Families gives each of its 6 people an account of their own instead.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'Individual accounts may not be shared with others.'
      lastVerified: 2026-11-19
    - topic: service.account-sharing
      plans: [lastpass.families]
      tier: great
      reason: 'Families gives 6 people a Premium account each: family, friends, roommates or anyone you call family.'
      sources:
        - url: https://www.lastpass.com/pricing
          quote: '6 Premium accounts for yourself and your parents, kids, roommates, friends, and whoever else you call family'
      lastVerified: 2026-11-19
    - topic: service.device-limits
      status: not-stated
      reason: 'Its terms name no limit on devices beyond the 10 computers its VPN covers, which the Plus plan shows.'
      pages: [https://www.lastpass.com/legal-center/terms-of-service/personal]
      lastVerified: 2026-11-19
    - topic: service.device-limits
      plans: [lastpass.free]
      tier: neutral
      reason: 'Free works on computers or on phones and tablets, not both. You can change which 3 times.'
      sources:
        - url: https://community.lastpass.com/kb/articles/22-changes-to-lastpass-free-faqs%EF%BB%BF
          quote: 'As of March 16, 2021, LastPass Free only includes access on unlimited devices of one type.'
        - url: https://community.lastpass.com/kb/articles/22-changes-to-lastpass-free-faqs%EF%BB%BF
          quote: "As a LastPass Free user, you have 3 opportunities to switch your active device type and explore what's right for you."
      lastVerified: 2026-11-19
    - topic: service.software-control
      status: not-stated
      reason: 'Its terms don’t say whether its apps update themselves or change anything else on your device.'
      pages: [https://www.lastpass.com/legal-center/terms-of-service/personal]
      lastVerified: 2026-11-19
    - topic: other.notable
      title: Its VPN runs on another company’s network
      tier: neutral
      reason: 'Plus’s VPN runs on servers another company operates, which LastPass doesn’t name and may change at any time. It says that company keeps no logs of what you do either.'
      sources:
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'We may change the Infrastructure Provider, server locations, or the technology we use to deliver the VPN Service at any time.'
        - url: https://www.lastpass.com/legal-center/terms-of-service/personal
          quote: 'Neither LastPass nor the Infrastructure Provider maintains logs of websites visited, DNS requests, application usage, traffic content, or communications transmitted through the VPN Service, or persistent records linking your activity to specific online destinations.'
      lastVerified: 2026-11-19
