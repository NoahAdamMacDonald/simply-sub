      url: https://community.lastpass.com/kb/articles/54-delete-your-lastpass-account%EF%BB%BF
    - name: 'Changes to LastPass Free FAQs'
      url: https://community.lastpass.com/kb/articles/22-changes-to-lastpass-free-faqs%EF%BB%BF
