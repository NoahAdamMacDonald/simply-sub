# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with a plain fetch: its Terms of Service for Personal Use (Last
# Updated: October 2026, the terms for Free, Premium and Families: "Where you are using our Free, Premium, or Families
# versions of LastPass, the Terms of Service for Personal Use apply"), which are its apps' licence too (section 1) and
# include its contracting entities table (a PDF, updated November 1, 2026: governing law and courts by country); its
# Global Privacy Notice (October 6, 2026) with its LastPass VPN Supplemental Privacy Notice (a PDF, October 6, 2026),
# Your Privacy Choices, its Cookie Notice (a PDF: cookie categories only, no topic), its Law Enforcement Request
# Guidelines, its Technical and Organizational Measures (a PDF, 6 October 2026), its trust centre, responsible
# disclosure and security pages; and its knowledge base's export, delete-account and Free articles. Not read: the sign-up
# form (lastpass.com/create-account, not opened: the brief's no-sign-up rule; its terms say "By using the Services, you
# confirm that you are of legal age and agree to these Terms"), its Community Terms (the forum's, no topic for the
# password manager), the API, partner and business terms (not for personal plans). Its 2022 breach is not graded by
# itself: security.practices is graded from its own pages (notes.md).
policies:
  links:
    - name: 'Terms of Service for Personal Use'
      url: https://www.lastpass.com/legal-center/terms-of-service/personal
    - name: 'Global Privacy Notice'
      url: https://www.lastpass.com/legal-center/privacy-notice
    - name: 'LastPass VPN Supplemental Privacy Notice'
      url: https://www.lastpass.com/-/media/0b29716c51274eeda9b857393006def0.pdf
    - name: 'Your Privacy Choices'
      url: https://www.lastpass.com/legal-center/your-privacy-choices
    - name: 'Law Enforcement Request Guidelines'
      url: https://www.lastpass.com/legal-center/law-enforcement-request-guidelines
    - name: 'Technical and Organizational Measures'
      url: https://www.lastpass.com/-/media/175854c49fcb489baeaa87e78579e28f.pdf
    - name: 'Responsible disclosure'
      url: https://www.lastpass.com/trust-center/security/responsible-disclosure
    - name: 'Security'
      url: https://www.lastpass.com/security
    - name: 'Pricing'
      url: https://www.lastpass.com/pricing
