# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 1). Pages, each quoted where it's used:
# Pricing: lastpass.com/pricing (Personal tab) prices by where the visitor is. Edge from Canada gets the page but its
# pricing script answers 403, so the prices stay placeholders ("{LPPremium}"); a plain fetch gets the same placeholders.
# Read 2026-11-19 with Mullvad Browser from Canada ("C$4.25", "C$5.50", "C$10.00" "/month" "billed annually*"), and
# with Mullvad Browser through US, UK, Irish, Australian, New Zealand, German, French, Dutch, Spanish and Italian exits
# (each exit's country confirmed; Edge through US exits got "We couldn’t connect you to LastPass"): the US "$3.00",
# "$4.00", "$7.00"; the UK "£2.60", "£3.40", "£5.50"; the euro countries "€2.90", "€3.90", "€6.50"; Australia "AU$4.50",
# "AU$6.00", "AU$10.50"; New Zealand the US's bare "$3.00", "$4.00", "$7.00". Each is billed once a year ("billed
# annually*", and its terms: "billed on a subscription basis, in advance, on a recurring cycle (typically yearly)"), so
# a plan's yearly price is twelve times the monthly rate shown (Runway's precedent): Premium CA$51, US$36, £31.20,
# €34.80, A$54; Families CA$66, US$48, £40.80, €46.80, A$72; Plus CA$120, US$84, £66, €78, A$126. The page's own script
# (its countryCurrency and product-catalog data) gives the same yearly amounts and names each country's currency
# ("CA":["CAD","USD"], "AU":["AUD","USD"], "GB":["GBP","USD"], every euro country EUR, every other country "*":["USD"]),
# so New Zealand pays in US dollars. No monthly period: the plans are sold "billed annually" only. Tax is added at
# checkout ("*Applicable taxes will be applied at checkout."), so no price includes tax. The price is the regular one:
# the page names no first-term offer, and its footnote "*Promotional pricing is subject to separate promotion terms"
# shows none (notes.md).
# Region checklist for CA and US, 2026-11-19: 1. language paths only (/fr/pricing, /de/pricing...: the same
# placeholders); 2. no country or currency picker; 3. the page's script names each country's currency; 4. checkout not
# opened; 5. no prices or tax article in its help centre; 6. Edge (placeholders), a plain fetch (placeholders), Mullvad
# Browser (C$ prices); US prices through a US exit; 7. no bill offered.
# Plans: Free, Premium (the pricing menu calls it "Personal"), Families and Plus (new: Premium with LastPass VPN, on
# Windows only). Teams, Business, Business Max and MSP are business plans, left out.
# Bundles: none; Plus is one plan, not a bundle of two catalog plans. Official resellers: lastpass.com/partner/resellers
# is its partner programme for selling to businesses; no page names a shop that sells personal plans. App stores
# (Apple, Google Play) bill it: partners, not listed.
# Free use: LastPass Free, a plan of its own ("Limited to 1 device type"), with a 30-day Premium trial.
# Help pages: its Support Center (support.lastpass.com) renders only with scripts; its community knowledge base
# (community.lastpass.com/kb, LastPass's own copies of the same articles, read through its API) is quoted instead.

id: lastpass
name: LastPass
aliases: [last pass]
website: https://www.lastpass.com
category: passwords
spendCategory: software
# Charged in the page's currency for each country (its script's countryCurrency data; New Zealand and the rest of the
# world in US dollars). The data also offers USD in every country ("CA":["CAD","USD"]): whether the checkout lets a
# buyer pick it wasn't read (checkout not opened), so no second currency is listed.
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its terms: "You can cancel automatic renewal at any time by selecting “Cancel Auto-Renewal” in the My Account section
# of your LastPass vault’s Account Settings"; My Account is lastpass.com/my.php (its "Update payment method" article:
# "You can navigate directly to the My Account page at https://lastpass.com/my.php").
cancelUrl: https://lastpass.com/my.php
sources: { pricing: https://www.lastpass.com/pricing }
# Ways to pay (M11.5), read 2026-11-19: cards ("We accept all major credit and debit/bank cards.", the pricing page's
# FAQ), which names no network, so no acceptedNetworks (the card shows "Card (networks not verified)"); and the app
# stores (its privacy notice). No page read names PayPal, wallets, gift cards or crypto.
paymentMethods:
  - methods: [card]
    page: 'Pricing'
    url: https://www.lastpass.com/pricing
    quotes:
      - 'We accept all major credit and debit/bank cards.'
  - methods: [app-store]
    page: 'Global Privacy Notice'
    url: https://www.lastpass.com/legal-center/privacy-notice
    quotes:
      - 'LastPass does not have access to your payment method details or otherwise receive or store any billing data where payment is made for a LastPass subscription through the Google Play or Apple App Store.'
# Renewal day (M11.5), read 2026-11-19: its terms say a subscription renews "for a period equal to your expiring term",
# and its payment article that renewal must be done "no later than 30 days before the end of your billing period";
# neither names the day it charges.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.lastpass.com/legal-center/terms-of-service/personal
    - https://community.lastpass.com/kb/articles/43-update-payment-method%EF%BB%BF
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19: its Global Privacy Notice names LastPass US LP and its country. Its about page tells
# the split: "LogMeIn (now GoTo) acquires LastPass for $110M" (2015) and "LastPass formally separates from GoTo, backed
# by new leadership and renewed focus on modern access management." (2024), and "Founded in 2008, LastPass is
# headquartered in Boston." No page read names its owners or a listing: private, no stock. Its contracting entities
# (lastpass.com/legal-center/contracting-entities' table, updated November 1, 2026) are LastPass US LP for the US,
# LastPass Technologies Canada ULC for Canada, LastPass UK Ltd, LastPass Australia Pty. Ltd. and LastPass Ireland
# Limited for the rest of the world (the provider's notes).
notes: Its terms are with LastPass US LP in the US, LastPass Technologies Canada ULC in Canada, and LastPass's UK, Australian or Irish company elsewhere.
owner:
  name: LastPass US LP
  page:
    name: Global Privacy Notice
    url: https://www.lastpass.com/legal-center/privacy-notice
  quotes:
    - 'LastPass US LP is based in the United States of America, with affiliates around the world.'
  country:
    code: US
  lastVerified: 2026-11-19

# General features, read 2026-11-19. Platforms: its downloads page (lastpass.com/misc_download2.php: "LastPass for
# Desktop", the Windows and macOS installers, a Linux section of browser extensions, "LastPass for Android", "LastPass
# for iPhone/iPad", extensions for Chrome, Edge, Firefox, Opera and Safari) and its web vault ("Go to
# https://lastpass.com/login/ and log in", its articles). Linux is browser extensions only. Sign-in: a master password,
# then "SMS, one-time passwords (OTP), and push notifications with any major authenticator or the free LastPass
# Authenticator app" (the pricing comparison), hardware keys "like Yubikey" (not on Free: "a Free user’s MFA options are
# limited to popular MFA apps"), and trusted devices ("You can mark a device as trusted to skip multifactor
# authentication for 30 days", Manage trusted devices). Support: "Personal support managed by the LastPass customer care
# team" (email, the Premium vs Free page: "email support that’s managed by the LastPass customer care team") and its
# community forum ("the LastPass Community, which is monitored by LastPass specialists"); Free has self-service and the
# community only. App languages: lastpass.com's language menu (English, Español, Deutsch, Français, Italiano,
# Nederlands, Português; Dutch has no registry value). Open source: none ("Modify, create derivative works of, reverse
# engineer, decompile, or try to access the source code of the Services." is forbidden, its terms), so proprietary.
# No pause (its terms offer cancelling auto-renewal only); no parental controls (Families' manager dashboard controls
# membership and sharing: "controlling membership, granting manager rights, overseeing access, and organizing shared
# credentials").
features:
  platforms: [windows, macos, linux, android, ios, web, browser-extension]
  account.sign-in: [password, totp, sms, push-approval, security-key, trusted-device]
  support.channels: [email, community]
  software.open-source: proprietary
  languages.interface: [en, fr, es, de, it, pt]

# Password manager features, read 2026-11-19 on the pricing page's personal comparison (Premium, Families, Plus), its
# Premium vs Free page (Free and Premium) and its knowledge base:
# - Items: "Secure password vault: Personal encrypted space for all of your accounts, passwords, passkeys, notes, files,
#   payment cards, and more", "Store an unlimited amount of passwords and notes, like Wi-Fi logins, banking cards,
#   documents", and its export article's "passwords, notes, form fills, Wi-Fi passwords" (form fills: identity).
#   Passkeys on every plan ("Passkeys ... Create, store, and manage passkeys alongside passwords in your vault",
#   Included on Premium, Families and Plus; its passkey FAQs make no plan exception). 2FA codes inside the vault are
#   business only: "Restriction: This feature is only available for LastPass Teams and LastPass Business accounts."
#   (Create TOTPs for your password items), so no totp item type.
# - Health: "Get notified of weak, reused, and old passwords" (security dashboard, every plan); breaches are dark web
#   monitoring ("Monitor your accounts and receive immediate alerts if your information is identified in a breach
#   database", every plan).
# - Sharing: Free "One-to-one sharing", Premium and Plus "One-to-many sharing", Families also "Shared folders"
#   ("Not included" on Premium and Plus).
# - Import: "Import passwords and notes from any password manager into LastPass by exporting your data as a generic CSV
#   file." (CSV; no format of another manager's own named). "For security reasons, passkeys cannot be imported".
# - Export: "You can export your LastPass vault data as a CSV file and save it." (attachments and in-vault TOTPs not
#   exported).
# - Emergency access: Premium, Families and Plus ("Grant another LastPass user one-time access to your vault in the event
#   of an emergency or crisis."); Free "Not included".
# - Offline: "Offline mode: Access your password vault when you’re not connected to the Internet." (Premium, Families,
#   Plus) and, for every user, its Technical and Organizational Measures: "LastPass offers offline access, which means
#   that a user without an internet connection can still access a version of its encrypted vault".
# - End-to-end: "LastPass zero-knowledge security model keeps your data private even from us." and "vault data is
#   encrypted locally at the device level before syncing to LastPass servers in an already encrypted state" (its
#   privacy notice): the vault (passwords).
# - Authenticator: the LastPass Authenticator app, a separate free app on every plan ("LastPass Authenticator mobile
#   app ... Included" on Free and Premium), "a mobile app that can be used for multifactor authentication for any online
#   account you create (on any website, not just for LastPass)". It adds accounts "by scanning a QR code or entering the
#   details manually" (otpauth). No page read describes exporting its codes: it offers "secure cloud backup" to your
#   LastPass account, not a file, so authenticator.export is empty (notes.md). Each plan labels it with the comparison's
#   row, "LastPass Authenticator mobile app", so the card shows it's a separate app, not codes in the vault (which are
#   business only; its item types have no totp), unlike Bitwarden's and 2FAS's, whose free apps are plans of their own.
# - File storage for notes' attachments: Free "50 MB", the paid plans "1 GB" (in notes).
plans:
  - id: lastpass.free
    name: Free
    link: https://www.lastpass.com/pricing/lastpass-premium-vs-free
    features:
      account.sign-in: [password, totp, sms, push-approval, trusted-device]
      support.channels: [community]
      password-manager: true
      password-manager.item-types: [login, passkey, credit-card, identity, secure-note, wifi]
      password-manager.health: [weak, reused, old]
      password-manager.sharing: [share-to-user]
      password-manager.import: [csv]
      password-manager.export: [csv]
      password-manager.emergency-access: false
      password-manager.offline: true
      authenticator.included: true
      authenticator.import: [otpauth]
      encryption.end-to-end: [passwords]
      security.dark-web-monitoring: true
    featureLabels:
      authenticator.included: LastPass Authenticator mobile app
    notes: 'On computers or on mobile devices, not both: you pick one device type and can switch it 3 times. Share an item with one person at a time, and 50 MB for files.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://www.lastpass.com/pricing/lastpass-premium-vs-free
