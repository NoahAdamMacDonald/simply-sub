# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 2), read with Edge from Canada and with a plain
# fetch (curl): yubico.com (the Yubico Authenticator page, its terms and conditions index and the documents below, its
# Trust pages, security advisories and coordinated disclosure page), the Yubico Authenticator User Guide
# (docs.yubico.com: overview, platforms, installation, Accounts: OATH, Passkeys: FIDO2, Settings, Troubleshooting and
# Support), developers.yubico.com/yubioath-flutter, its GitHub repositories (yubioath-flutter and yubioath-ios: README
# and LICENSE), its support portal's request page, its investor site (investors.yubico.com) and the app's Google Play
# and App Store listings.
# The brand rule (one company, one set of terms: Microsoft 365's precedent): Yubico AB makes YubiKeys, hardware security
# keys sold once (not subscriptions, so out of scope), and Yubico Authenticator, a free app that stores 2FA codes on a
# YubiKey. The app is its only consumer offer in scope, so one provider, yubico, named for the company, with the app as
# its one free plan (yubico.authenticator): a later Yubico subscription for individuals would join it there. YubiKey as a
# Service (subscriptions for organizations) is business-only: out.
# Pricing: none. The app is free (the App Store: "Free"; Google Play: Install, with no in-app purchases), and Yubico's
# page offers it to download. It needs a YubiKey, bought once from Yubico or a shop: "Adding a new account for OATH
# authentication requires a YubiKey, Yubico Authenticator, and the secret key information provided by the
# site/account/service you are registering the YubiKey with." (Accounts: OATH). Region checklist, 2026-11-19: not
# needed (one free app for every country, no prices).
# Bundles: none. Official resellers: none for the app (YubiKeys' resellers sell hardware). Ways to pay: none.
# Free use: its one plan is free.
id: yubico
name: Yubico
aliases: [yubico authenticator, yubikey, yubioath]
website: https://www.yubico.com
category: passwords
spendCategory: software
# Nothing to cancel: it's free, with no account. Its product page is the closest page.
cancelUrl: https://www.yubico.com/products/yubico-authenticator/
sources: { pricing: https://www.yubico.com/products/yubico-authenticator/ }

# Owner (M11.2), read 2026-11-19: its website terms say Yubico AB operates yubico.com and developers.yubico.com (where the
# app is downloaded); its legal imprint gives "Yubico AB (publ)" in Stockholm, Sweden. Listed on Nasdaq Stockholm (its
# investor site's "The share"). Its largest holder has 16.95% of the capital (Bure Equity, its ownership page), so no
# majority holder.
owner:
  name: Yubico AB
  website: https://www.yubico.com
  page:
    name: Yubico website terms and conditions of use
    url: https://www.yubico.com/support/terms-conditions/yubico-website-terms-conditions/
  quotes:
    - 'The Yubico.com website, store.yubico.com, forum.yubico.com and developers.yubico.com (“Website”) is a web site and an open source service for secure online identity protection (“Service”) operated by Yubico AB (“Yubico”).'
  country:
    code: SE
    page:
      name: Yubico Toolset Software License Agreement
      url: https://www.yubico.com/support/terms-conditions/yubico-toolset-software-license-agreement/
    quotes:
      - 'Yubico AB reg. No. 559278-6668, a limited liability company incorporated under the laws of Sweden'
    lastVerified: 2026-11-19
  stock:
    listings:
      - { exchange: Nasdaq Stockholm, symbol: YUBICO }
    page:
      name: The share
      url: https://investors.yubico.com/en/investors/the-share/
    quotes:
      - 'Yubico’s share is listed on Nasdaq Stockholm since 5 December 2024.'
      - 'Short name: YUBICO'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19
notes: >-
  Yubico makes YubiKeys, hardware security keys you buy once. Its free Yubico Authenticator app stores your 2FA codes
  inside a YubiKey instead of on your phone.
# Source code (M11.5): its User Guide's installation page sends developers to the source on GitHub, and both apps'
# repositories are under the Apache License 2.0 (yubioath-flutter for desktop and Android, yubioath-ios for iPhone and
# iPad). The codes are made inside the YubiKey, whose firmware no page read publishes, so open-source apps, not fully
# open.
sourceRepo:
  url: https://github.com/Yubico/yubioath-flutter
  page:
    name: Yubico Authenticator User Guide (installation)
    url: https://docs.yubico.com/software/yubikey/tools/authenticator/auth-guide/installation.html
  quotes:
    - 'For developers wishing to build and package the Yubico Authenticator app from source, please see the GitHub documentation for your desired platform:'
  lastVerified: 2026-11-19

# General features, read 2026-11-19. Platforms: "The Yubico Authenticator app works across Windows, macOS, Linux,
# iOS/iPadOS, and Android devices." (the User Guide's overview). Sign-in: none, the app has no accounts; an OATH password
# or a FIDO2 PIN locks the YubiKey itself, so account.sign-in is left out (Cloudflare WARP's precedent). Support: "Submit
# a help request to Yubico’s Customer Support team." (Troubleshooting and Support; its portal's "Submit a request" form)
# and GitHub issues for bugs. App languages: its Settings chapter's list ("Supported languages include:" Bulgarian,
# Chinese (Simplified and Traditional), Czech, Dutch, English, French, German, Greek, Hebrew, Hungarian, Italian, Japanese,
# Polish, Portuguese (Brazil), Russian, Slovak, Spanish, Swedish, Turkish, Ukrainian and Vietnamese; the registry's are
# listed), chosen on desktop and Android ("The app language can be changed on Yubico Authenticator for Desktop and
# Android only."). No pause or parental controls (no account).
features:
  platforms: [windows, macos, linux, android, ios]
  support.channels: [email]
  languages.interface: [en, fr, es, de, it, pt, ja, zh]
  software.open-source: open-clients

# Authenticator features, read 2026-11-19 in its User Guide: an authenticator only, so password-manager false and
# authenticator.included true.
# - Imports: a site's QR code or key ("OATH accounts can be added via QR code or by entering the secret key and other
#   fields manually."), and Google Authenticator's export QR code on desktop and Android ("If you’d like to transfer
#   existing OATH two-factor authentication accounts from Google Authenticator to a YubiKey for use in Yubico
#   Authenticator, you can do so via the “Export accounts” feature in Google Authenticator."). No other app's file.
# - Exports: none, so authenticator.export is empty: "With Yubico Authenticator, credentials are stored in the secure
#   element of the YubiKey; once stored, they cannot be extracted." (overview). Its backup is a second YubiKey set up
#   from the same QR code ("Make a copy of the QR code or secret key information; you will need it when registering a
#   second YubiKey.").
# - No end-to-end encryption to state: there's no cloud; the codes stay in the key and the app collects nothing (its
#   store listings).
# - Passkeys: the app manages passkeys stored on a YubiKey ("Manage passkeys stored on your YubiKeys."), which no
#   registry feature records for an authenticator; it's a note.
plans:
  - id: yubico.authenticator
    name: Yubico Authenticator
    link: https://www.yubico.com/products/yubico-authenticator/
    features:
      password-manager: false
      authenticator.included: true
      authenticator.import: [otpauth, google-authenticator]
      authenticator.export: []
    notes: 'Free and open source, for Windows, macOS, Linux, Android and iPhone. Your 2FA codes are stored inside a YubiKey, bought separately once, so any device with the app shows them. They can’t be copied out: keep each QR code to set up a backup key. It also manages the passkeys on your YubiKey.'
    prices:
      - {
          region: GLOBAL,
          currency: USD,
          amount: 0,
          interval: month,
          intervalCount: 1,
          autoRenew: true,
          lastVerified: 2026-11-19,
          sourceUrl: https://www.yubico.com/products/yubico-authenticator/,
        }

