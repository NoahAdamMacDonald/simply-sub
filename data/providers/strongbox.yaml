      password-manager.export: [csv, kdbx, encrypted]
      password-manager.emergency-access: false
      password-manager.offline: true
      authenticator.included: true
      authenticator.import: [otpauth]
      encryption.end-to-end: [passwords]
    perks: [premium-support, duress-pin, wi-fi-sync, watch-app]
    notes: >-
      Face ID and Touch ID unlock, YubiKey, AutoFill on Mac, SFTP and WebDAV sync on Mac, the SSH agent and the Apple Watch
      app. Shared with up to 5 others through Apple’s Family Sharing. Bought in the App Store; the yearly plan starts with
