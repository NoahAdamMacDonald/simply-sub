# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 2), read with Edge from Canada (strongboxsafe.com
# answers a plain fetch with a SiteGround "sgcaptcha" redirect, an automatic check that Edge passes on its own): its home,
# Pro and pricing section, German Pro page, comparison (whose ticks and crosses are images, read from screenshots), about,
# business, academic licence, support, terms of use and privacy policy pages, its blog's posts on Applause, the founder's
# message, Strongbox Sync and Strongbox Zero; and with a plain fetch its help desk (strongbox.reamaze.com, 24 articles:
# licensing, cancelling, Family Sharing, which app to download, import, sharing, passkeys, backups and export, security
# audit, network connections, cryptography, sync, Wi-Fi Sync, AutoFill and 2FA codes, browser extensions, migration) and
# its GitHub repository.
# Pricing: strongboxsafe.com/pro/#pricing, Strongbox Pro "One license for all of your devices", "Family Sharing with up to
# 6 people", "Cancel anytime": Monthly "$2.99 / month", Yearly "3 month free trial available" "$24.99 / year", Lifetime
# "One time purchase" "$124.99", and "All prices in US Dollars. Your price may vary depending upon the country you use for
# your App Store." Its German page (/de/strongbox-pro/) gives "2,99 € / Monat", "24,99 € / Jahr" and "89,99 €"
# (Lebenslang), "Alle Preise sind in Euros angegeben. Ihr Preis kann je nach dem Land, das Sie für Ihren App Store
# verwenden, variieren." Pro is sold only through Apple's App Store, as an in-app subscription in the free app ("a free
# version with monthly and annual auto-renewable subscriptions", its help desk) or as a separate "Strongbox Pro (Lifetime)"
# app bought once. So the US's prices are the English page's (US) and Germany's the German page's (DE); neither page says
# its price includes tax. Lifetime is a one-time purchase, left out (categories.md), and so is Strongbox Zero, "a
# separate, custom-built, stripped-down edition" sold "for a single price" (its blog).
# Every other country (Infuse's precedent, the owner's choice of 2026-11-19): no Strongbox page prices them, so each is
# the App Store's page for the app in that country's storefront (apps.apple.com/<country>/app/strongbox-password-manager/
# id897283731, its In-App Purchases list, read 2026-11-19 with a plain fetch), whose own data names the storefront's
# currency ("priceCurrency":"CAD"…). The list shows several Yearly products at different prices (older ones kept for
# existing subscribers); the first-listed Monthly and Yearly are the current ones, as the US's ($2.99, $24.99) and
# Germany's (2,99 €, 24,99 €) agree with Strongbox's own pages. Canada $3.99 and $34.99 (CAD); the UK £2.99 and £24.99;
# Ireland, France, the Netherlands, Spain and Italy €2.99 and €24.99; Australia $4.99 and $39.99 (AUD); New Zealand $4.99
# and $49.99 (NZD). No page says the prices include tax, so no taxIncluded. The App Store's description also names
# "3-monthly" subscriptions, but no storefront's list and no Strongbox page shows one, so none is listed.
# Region checklist for CA, 2026-11-19: 1. language paths only (English, Deutsch), no country paths; 2. no country or
# currency picker; 3. no price data in the page; 4. the checkout is the App Store's, inside the app: not opened; 5. no
# prices-by-country article in its help desk; 6. Edge from Canada (a plain fetch meets the automatic check), and the
# Canadian App Store page with a plain fetch; 7. no bill offered.
# Its personal plans: Free ("a free version of Strongbox available for non commercial use and lacking some convenience
# features") and Pro (monthly or yearly). Strongbox for Business ("No. of Licenses: (Minimum: 5)", custom pricing) is out
# of scope. Setapp, a subscription service of other apps, can activate it ("If you activate Strongbox through Setapp",
# privacy policy): another company's subscription, noted, not a plan or a reseller.
# Bundles: none. Official resellers: none (the App Store bills it; Setapp above). Students and activists can apply for "A
# Free 1 Year Pro Subscription", once (academic licence page), not listed.
# Free use: its Free plan.

id: strongbox
name: Strongbox
website: https://strongboxsafe.com
# Its help desk, which its support page links for every help article.
domains: [strongbox.reamaze.com]
category: passwords
spendCategory: software
billingCurrency:
  {
    GLOBAL: USD,
    US: USD,
    CA: CAD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    AU: AUD,
    NZ: NZD,
  }
# Its help article on cancelling: Pro is cancelled in the App Store's subscriptions ("Your subscription is managed by
# Apple.").
cancelUrl: https://strongbox.reamaze.com/kb/strongbox-pro/how-do-i-cancel-my-subscription
sources: { pricing: https://strongboxsafe.com/pro/ }

# Ways to pay (M11.5), read 2026-11-19: Apple's App Store only (its pricing page and help desk). The App Store's own ways
# to pay are Apple's. No card networks are listed: Strongbox's pages name none.
paymentMethods:
  - methods: [app-store]
    page: 'Strongbox Pro pricing'
    url: https://strongboxsafe.com/pro/
    quotes:
      - 'All prices in US Dollars. Your price may vary depending upon the country you use for your App Store.'
# Renewal day (M11.5), read 2026-11-19: Apple renews the subscription; no Strongbox page says on which day.
renewalAnchor:
  kind: not-stated
  pages:
    - https://strongboxsafe.com/pro/
    - https://strongboxsafe.com/terms/
    - https://strongbox.reamaze.com/kb/strongbox-pro/how-do-i-cancel-my-subscription
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-20 on Applause's own site (applause.dev, the parent's page about it): its post "Strongbox
# Joins Applause" (14 March 2025, the same text as Strongbox's blog post of 13 March) is headed "Strongbox starts a new
# chapter under Applause's ownership", its portfolio lists Strongbox, and its privacy policy names the company ("This
# Privacy Policy is for Applause Group, Inc."). Its country from the post: "We’re based in New York City". Strongbox's
# own pages still name Phoebe Code Limited, the UK company its founder incorporated ("Strongbox is wholly owned by Phoebe
# Code Limited a UK company", about page; "Strongbox is provided by Phoebe Code Limited, based in the UK.", privacy
# policy updated 15 October 2026): in notes. No page names a listing: private, no stock.
owner:
  name: Applause Group, Inc.
  website: https://www.applause.dev
  page:
    name: Strongbox Joins Applause
    url: https://www.applause.dev/news/articles/strongbox-joins-applause
  quotes:
    - "Strongbox starts a new chapter under Applause's ownership"
    - 'We’re based in New York City and are dedicated to being a great home for indie developed apps.'
  country:
    code: US
  lastVerified: 2026-11-20
# Source code (M11.5): its help desk's audit article links its GitHub repository ("Strongbox Source Code:"), AGPL-3.0;
# its README says the repository leaves out what's needed to build the app ("this repo are not compliant with the OSI
# definition of Open Source"; "Others might use the term "Source Available"."), so source-available.
sourceRepo:
  url: https://github.com/strongbox-password-safe/Strongbox
  page:
    name: Has Strongbox ever been audited?
    url: https://strongbox.reamaze.com/kb/security-and-privacy/security-audit
  quotes:
    - 'Strongbox Source Code: https://github.com/strongbox-password-safe/Strongbox'
  lastVerified: 2026-11-19
notes: >-
  A KeePass and Password Safe app for iPhone, iPad and Mac. Your passwords stay in a KeePass file you keep wherever you
  like (on the device, iCloud, Dropbox, Google Drive, OneDrive, WebDAV, SFTP or its free Strongbox Sync). Pro is bought
  in the App Store; it’s also sold for life, paid once, which isn’t listed. Applause, a New York app company, has owned
  it since March 2025; its own pages name Phoebe Code Limited, a UK company, which its founder set up.

# Perks (M11.6): what Pro adds that no feature describes, in its Pro page's words.
perks:
  - id: premium-support
    name: Premium Support
  - id: duress-pin
    name: Duress PIN
  - id: wi-fi-sync
    name: Wi-Fi Sync
  - id: watch-app
    name: Apple Watch App

# General features, read 2026-11-19. Platforms: iPhone, iPad and Mac ("the most secure and powerful KeePass password
# manager on iPhone, iPad and Mac", home page), with browser extensions for Chrome and Firefox on Mac (help desk), which
# fill only with Pro ("AutoFill (MacOS Big Sur+)" is Pro's on macOS, comparison), so the Free plan lists iOS and macOS. No
# account: you unlock a database with its master password, a key file ("Key File Support", both) or a YubiKey ("YubiKey
# (KeePass only)", Pro), so password and security-key, Free password only (KeePassXC's reading of an unlock). Support: its
# help desk's contact form and email, and Reddit r/strongbox, which its README names under "Help / Tech Support"; Pro adds
# "Premium Support" (a perk). App languages: its README's translators list Chinese, French, German, Italian, Japanese,
# Portuguese (PT-BR) and Spanish among others, besides English. Source available (above). Not self-hostable: there's no
# server to run (it syncs through your own storage, or Apple's CloudKit for Strongbox Sync). No pause; no parental
# controls.
features:
  platforms: [ios, macos, browser-extension]
  account.sign-in: [password, security-key]
  support.channels: [email, community]
  languages.interface: [en, fr, es, de, it, pt, ja, zh]
  software.open-source: source-available
  software.self-hostable: false

# Password manager features, read 2026-11-19 (comparison table, Pro page and the help articles named):
# - Items: KeePass entries with logins, "Attachments & Custom Fields", "Markdown Notes", "TOTP (QR Code, RFC 6238,
#   Steam)" and passkeys ("You can save passkeys directly to your Strongbox database"); SSH keys with Pro's SSH Agent on
#   Mac. Passkeys are Free's on iOS but Pro's on macOS (comparison): Free keeps them, on its iPhone app.
# - Health: "Audit (Find Weaknesses)" on both ("Find and fix duplicate passwords, weak, common and short passwords", home);
#   "Have I Been Pwned? Audit" is Pro's: breached. It checks your passwords against Have I Been Pwned when you turn it on,
#   not a monitoring service, so no dark web monitoring (Bitwarden's and KeePassXC's reading).
# - Sharing: a database on Strongbox Sync is shared with other people by an invitation link to their Apple Account
#   ("you can now edit, view and manage the database along with other people"), free ("Strongbox Sync provides easy and
#   reliable cross device sync and sharing for all our users. What’s more, it’s completely free."): share-to-user and
#   share-vault.
# - Import: a KeePass or Password Safe database opens as it is (kdbx), "Generic CSV", "Bitwarden (JSON)", Enpass's JSON and
#   1Password's 1PUX (Import Your Existing Passwords): csv, json, kdbx and other-managers. Export: "Import & Export (CSV,
#   Encrypted)" (comparison), and the database itself is a KeePass file other apps open ("Use your Strongbox database with
#   any KeePass compatible client on any platform."): csv, kdbx, encrypted. No page names the Credential Exchange Format.
# - No emergency access. Offline: "Offline Viewing" on both, "Offline Editing" Pro's on iOS (comparison).
# - Authenticator: "TOTP (QR Code, RFC 6238, Steam)" on both: otpauth. No page says how 2FA secrets leave it other than
#   inside the database, so authenticator.export is left empty.
# - End-to-end encryption: its pages say the database is encrypted on your device ("The only place your database is
#   decrypted is on device for use there.", Strongbox Sync post) and call it zero knowledge ("Strongbox is a zero
#   knowledge password manager , which means that we are not able to access your database or the personal information
#   stored inside it under any circumstances.", its help desk; "This is part of our zero knowledge security
#   architecture.", Getting Started), so encryption.end-to-end is passwords on both plans (KeePassXC's, KeePass's and
#   Aegis's pages don't say it); privacy.content-access grades the same fact.
plans:
  - id: strongbox.free
    name: Free
    link: https://strongboxsafe.com/
    features:
      platforms: [ios, macos]
      account.sign-in: [password]
      password-manager: true
      password-manager.item-types: [login, totp, passkey, secure-note]
      password-manager.health: [weak, reused]
      password-manager.sharing: [share-to-user, share-vault]
      password-manager.import: [csv, json, kdbx, other-managers]
      password-manager.export: [csv, kdbx, encrypted]
      password-manager.emergency-access: false
      password-manager.offline: true
      authenticator.included: true
      authenticator.import: [otpauth]
      encryption.end-to-end: [passwords]
    notes: >-
      For non-commercial use. Unlimited entries and databases, AutoFill on iPhone and iPad, 2FA codes and free Strongbox
      Sync; no Face ID or Touch ID unlock, YubiKey or offline editing on iPhone.
    prices:
      - {
          region: GLOBAL,
          currency: USD,
          amount: 0,
          interval: month,
          intervalCount: 1,
          autoRenew: true,
          lastVerified: 2026-11-19,
          sourceUrl: https://strongboxsafe.com/pro/,
