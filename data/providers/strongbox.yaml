# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with Edge: its terms of use (undated; they cover the website and
# purchases, and their refund and price clauses say they apply "only to purchases made outside of Apple’s App Store"),
# its privacy policy ("Last Update: 15 October 2026"), its help desk's articles on cancelling, Family Sharing, network
# connections, audits and backups, and its GitHub README. Every agreement a user accepts (the owner's rule, 2026-11-03):
# there's no sign-up and no Strongbox account; Pro is bought in the App Store, so Apple's Media Services Terms apply to the
# purchase: the shared document apple-media-services (Infuse's precedent), and the worse of each topic's two grades
# shows. Its apps' licence is the App Store's (part of Apple's terms); its code is published under the AGPL. Not read:
# the privacy policies of RevenueCat, Superwall and Sentry, which it links; Setapp's terms. Calibrated against KeePassXC,
# KeePassDX and Infuse.
policies:
  shared: [apple-media-services]
  links:
    - name: 'Terms of use'
      url: https://strongboxsafe.com/terms/
    - name: 'Privacy policy'
      url: https://strongboxsafe.com/privacy/
    - name: 'Strongbox Pro'
      url: https://strongboxsafe.com/pro/
    - name: 'Home'
      url: https://strongboxsafe.com/
    - name: 'Cancel your subscription'
      url: https://strongbox.reamaze.com/kb/strongbox-pro/how-do-i-cancel-my-subscription
    - name: 'Share Strongbox Pro with your family'
      url: https://strongbox.reamaze.com/kb/strongbox-pro/does-strongbox-support-apples-family-sharing
    - name: 'What network connections can Strongbox make?'
      url: https://strongbox.reamaze.com/kb/security-and-privacy/what-possible-network-connections-can-strongbox-make
    - name: 'Has Strongbox ever been audited?'
      url: https://strongbox.reamaze.com/kb/security-and-privacy/security-audit
    - name: 'Compare features'
      url: https://strongboxsafe.com/comparison/
    - name: 'Strongbox (GitHub)'
      url: https://github.com/strongbox-password-safe/Strongbox
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Crash reports are on until you switch them off in its settings. But its free iPhone app also sends how you use it to Superwall, which runs its upgrade offers, and nothing turns that off.'
      sources:
        - url: https://strongboxsafe.com/privacy/
          quote: 'Crash reporting is enabled by default on a fresh installation and can be turned off in settings.'
        - url: https://strongboxsafe.com/privacy/
          quote: 'Superwall processes technical information, app-usage events and purchase status for these purposes.'
        - url: https://strongboxsafe.com/privacy/
          quote: 'The crash-reporting switch does not disable Superwall or RevenueCat.'
      action:
        name: 'What it collects and how to turn off crash reports'
        url: https://strongboxsafe.com/privacy/
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'Its free iPhone app tells RevenueCat when you install and buy, to match them to its ads on Apple’s ad network. No setting stops that; you’d have to ask it.'
      sources:
        - url: https://strongboxsafe.com/privacy/
          quote: 'The iOS freemium app also uses RevenueCat for Apple Ads attribution, associating installations and purchases with advertising campaigns.'
        - url: https://strongboxsafe.com/privacy/
          quote: 'Contact us through the Strongbox support page to exercise your rights.'
      action:
        name: 'Ask it through its support page'
        url: https://strongboxsafe.com/support/
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: great
      reason: 'Its privacy policy names no ads in its apps, and its website counts visits without cookies and doesn’t use those counts for advertising.'
      sources:
        - url: https://strongboxsafe.com/privacy/
          quote: 'Plausible does not use cookies, and we do not use these website statistics for advertising or marketing.'
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy doesn’t say anything about training AI. It can’t read your passwords; an AI app you connect yourself gets only what you let it see.'
      pages: [https://strongboxsafe.com/privacy/, https://strongboxsafe.com/terms/]
      lastVerified: 2026-11-19
    - topic: privacy.content-access
      tier: great
      reason: 'Your passwords are locked and unlocked only on your own device. Strongbox can’t open them, or reset your master password.'
      sources:
        - url: https://strongboxsafe.com/privacy/
          quote: 'Strongbox encrypts your password databases on your device and decrypts them locally when you unlock them.'
        - url: https://strongboxsafe.com/privacy/
          quote: 'We cannot reset your database master password or decrypt your database without its required credentials.'
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: poor
      reason: 'Your passwords stay where you keep them. Its service providers keep purchase, usage, crash and support records, and its privacy policy gives no time limits.'
      sources:
        - url: https://strongboxsafe.com/privacy/
          quote: 'Uninstalling Strongbox does not necessarily delete those files or purchase, analytics, diagnostic and support records held by service providers.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'Your passwords are yours to delete. To have its other records about you deleted, you ask through its support page, and it gives no time frame.'
      sources:
        - url: https://strongboxsafe.com/privacy/
          quote: 'Contact us to request deletion of information processed under our responsibility.'
        - url: https://strongboxsafe.com/privacy/
          quote: 'You control databases and backups stored locally or with your chosen storage provider.'
      action:
        name: 'Ask through its support page'
        url: https://strongboxsafe.com/support/
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: great
      reason: 'Your passwords are kept in the standard KeePass file, which other KeePass apps on any system open, and you can also export them as a CSV file.'
      sources:
        - url: https://strongboxsafe.com/
          quote: 'Use your Strongbox database with any KeePass compatible client on any platform.'
        - url: https://strongboxsafe.com/comparison/
          quote: 'Import & Export (CSV, Encrypted)'
      action:
        name: 'Backups and exports of your database'
        url: https://strongbox.reamaze.com/kb/faqs/does-strongbox-store-backups-how-can-i-export-them
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      status: not-stated
