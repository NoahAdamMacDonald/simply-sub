# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 in Edge from Canada. The AMC Streaming Services Terms of Use and
# AMC Global Media's Privacy Policy and Cookies Policy (all "June 27, 2025") cover every AMC streaming service, Shudder
# by name, and are rated once as shared documents (data/policies/amc-global-media-terms.yaml and amc-global-media-privacy.yaml,
# drafted in .pipeline/amc-plus). Rated here from Shudder's own pages: its sign-up page's first step (typing nothing) and
# its help centre's articles on changing plans and on downloads. Not read: the sign-up steps after the account form
# (the plan picker and checkout), the "Additional Terms" of its promotions, its contact form, and the terms of the
# partners that bill it.
policies:
  shared: [amc-global-media-terms, amc-global-media-privacy]
  links:
    - name: 'Sign Up'
      url: https://watch.shudder.com/signup
    - name: 'How can I change my subscription?'
      url: https://support.shudder.com/kb/guide/en/how-can-i-change-my-subscription-QZSkIiPQET/Steps/5049956
    - name: 'Downloads & Watching Offline'
      url: https://support.shudder.com/kb/guide/en/downloads-watching-offline-6mBRPV3tDW/Steps/5048086
  ratings:
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Signing up starts with an email address and a password you choose, then a plan and payment. The steps after the account form weren’t read.'
      sources:
        - url: https://watch.shudder.com/signup
          quote: 'Create Account'
        - url: https://watch.shudder.com/signup
          quote: 'Confirm Password *'
      lastVerified: 2026-11-13
    - topic: billing.plan-changes
      tier: neutral
      reason: 'You can switch between monthly and yearly in your account, but to change before your plan renews you have to cancel and sign up again once it ends.'
      sources:
        - url: https://support.shudder.com/kb/guide/en/how-can-i-change-my-subscription-QZSkIiPQET/Steps/5049956
          quote: 'If you are a new Shudder subscriber, or your subscription has renewed since March 5th, you can switch between the monthly and annual plan directly in your account on the Shudder website or mobile app.'
        - url: https://support.shudder.com/kb/guide/en/how-can-i-change-my-subscription-QZSkIiPQET/Steps/5049956
          quote: 'If you wish to change your subscription type prior to your next renewal date, we suggest that you cancel your current subscription plan and, once it expires, simply re-subscribe to your preferred plan!'
      lastVerified: 2026-11-13
    - topic: service.device-limits
      tier: neutral
      reason: 'You can keep up to 20 downloads on a phone or tablet. An unwatched one disappears after 30 days, and one you’ve started after 48 hours.'
      sources:
        - url: https://support.shudder.com/kb/guide/en/downloads-watching-offline-6mBRPV3tDW/Steps/5048086
          quote: 'Available on the Shudder app for iOS and Android, you can now download up to 20 eligible titles directly to your phone or tablet and watch them later without an internet connection.'
        - url: https://support.shudder.com/kb/guide/en/downloads-watching-offline-6mBRPV3tDW/Steps/5048086
          quote: "Unwatched downloads will expire after 30 days. Once you've started watching a downloaded title, it will expire within 48 hours."
      lastVerified: 2026-11-13
