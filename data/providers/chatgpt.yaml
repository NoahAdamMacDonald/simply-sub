# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-04: its Terms of Use, which "include our
# Service Terms" and require following its Usage Policies (the conduct they forbid, no topic's), and its Privacy
# Policy. Users in the EEA, Switzerland and the UK have terms of their own, not read: no rating has regions.
policies:
  links:
    - name: 'Terms of use'
      url: https://openai.com/policies/row-terms-of-use/
    - name: 'Privacy policy'
      url: https://openai.com/policies/row-privacy-policy/
    - name: 'Cancelling'
      url: https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription
    - name: 'Data controls'
      url: https://help.openai.com/en/articles/7730893-data-controls-in-chatgpt
    - name: 'How your data improves its models'
      url: https://help.openai.com/en/articles/5722486-how-your-data-is-used-to-improve-model-performance
    - name: 'Ads in ChatGPT'
      url: https://help.openai.com/en/articles/20001047-ads-in-chatgpt
    - name: 'Deleting your account'
      url: https://help.openai.com/en/articles/6378407-deleting-your-chatgpt-account
    - name: 'Exporting your data'
      url: https://help.openai.com/en/articles/7260999-exporting-your-chatgpt-history-and-data
    - name: 'About ChatGPT Pro tiers'
      url: https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers
    - name: 'Security and privacy'
      url: https://openai.com/security-and-privacy/
    - name: 'Bug bounty program'
      url: https://openai.com/index/bug-bounty-program/
  ratings:
    - topic: legal.disputes
      tier: poor
      reason: "Disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only within 30 days of signing up or of a change to these rules."
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'You may opt out of arbitration within 30 days of account creation or of any updates to these arbitration terms within 30 days after the update has taken effect by filling out this form'
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'Class arbitrations, class actions, and representative actions are prohibited.'
      action:
        name: 'How to opt out of arbitration'
        url: https://openai.com/form/arbitration-opt-out/
      lastVerified: 2026-11-04
    - topic: legal.terms-changes
      tier: good
      reason: 'It tells you at least 30 days ahead, by email or in the app, of a change to its terms that hurts you, and you can stop using it.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'We will give you at least 30 days advance notice of changes to these Terms that materially adversely impact you either via email or an in-product notification.'
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'If you do not agree to the changes, you must stop using our Services.'
      lastVerified: 2026-11-04
    - topic: legal.account-closure
      tier: neutral
      reason: 'It can close your account if you break its rules, the law makes it, or you put others at risk, with no refund promised. You can appeal.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'We reserve the right to suspend or terminate your access to our Services or delete your account if we determine:'
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'You breached these Terms or our Usage Policies'
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'If you believe we have suspended or terminated your account in error, you can file an appeal with us by contacting our Support team'
      lastVerified: 2026-11-04
    - topic: legal.content-rights
      tier: neutral
      reason: 'What you type stays yours. It may use your chats to run, build and improve its services and keep them safe.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'We may use Content to provide, maintain, develop, and improve our Services, comply with applicable law, enforce our terms and policies, and keep our Services safe.'
      lastVerified: 2026-11-04
    - topic: legal.output-rights
      tier: good
      reason: 'What ChatGPT makes for you is yours, though others may get similar answers.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'you (a) retain your ownership rights in Input and (b) own the Output.'
      lastVerified: 2026-11-04
    - topic: legal.service-changes
      tier: good
      reason: 'If it stops a service, it tells you first and refunds what you paid ahead and didn’t use.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'We may decide to discontinue our Services, but if we do, we will give you advance notice and a refund for any prepaid, unused Services.'
      lastVerified: 2026-11-04
    - topic: legal.inactivity
      tier: good
      reason: 'It only closes free accounts that haven’t been used for over a year, and tells you first.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'We also may terminate your account if it has been inactive for over a year and you do not have a paid account. If we do, we will provide you with advance notice.'
      lastVerified: 2026-11-04
    - topic: legal.licence
      tier: neutral
      reason: 'You may not copy, change, sell or share its services, take its apps apart unless the law lets you, or use what it writes to build a competing AI.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'Modify, copy, lease, sell or distribute any of our Services.'
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'Use Output to develop models that compete with OpenAI.'
      lastVerified: 2026-11-04
    - topic: service.software-control
      tier: good
      reason: "Its apps may update themselves to the latest version. Its terms don't say they change anything else on your device."
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'Our Services may allow you to download software, such as mobile applications, which may update automatically to ensure you’re using the latest version.'
      lastVerified: 2026-11-04
    - topic: service.account-sharing
      tier: bad
      reason: 'You can’t share your account with anyone, even at home.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'You may not share your account credentials or make your account available to anyone else and are responsible for all activities that occur under your account.'
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online whenever you like, but at least a day before it renews, or you pay for the next period. You keep it until the end of the time you paid for.'
      sources:
        - url: https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription
          quote: 'Cancel at least 24 hours before your next billing date to avoid being charged for the next subscription period.'
        - url: https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription
          quote: 'After an ordinary cancellation, paid features remain available until the end of the current billing period.'
      lastVerified: 2026-11-04
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back unless the law says so, but you keep your plan until the end of the time you paid for.'
      sources:
        - url: https://openai.com/policies/row-terms-of-use/
          quote: 'Payments are non-refundable, except where required by law.'
        - url: https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription
          quote: 'After an ordinary cancellation, paid features remain available until the end of the current billing period.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      tier: great
      reason: 'A new price starts only at your next renewal, and it tells you at least 30 days ahead, so you can cancel first.'
      sources:
