# Researched by hand on 2026-11-04 (M11.15, the AI category), read with Edge from Canada. A plain fetch gets 403 from
# every OpenAI page; the browser reads them all, with no bot check. Pages, each quoted where it's used:
# Pricing: chatgpt.com/pricing, read from Canada and through a US, UK, Australian, New Zealand, Irish, German, French,
# Dutch, Spanish and Italian exit (the owner's choice of 2026-11-04), each page in that country's currency; its
# comparison table's ticks read from the screenshot. Pro's three tiers: "About ChatGPT Pro tiers" (US dollars).
# Payment methods: "Multi-currency billing". Cancelling: "Canceling your ChatGPT subscription".
# Terms: the Terms of Use for everyone outside the EEA, Switzerland and the UK (openai.com/policies/row-terms-of-use).
# Privacy: its Privacy Policy (row-privacy-policy), "Data Controls", "How your data is used to improve model
# performance", "Ads in ChatGPT", and its deletion and export articles.
# Bundles: none found. Official resellers: none: OpenAI sells its plans on chatgpt.com and in its apps, whose app
# stores bill them (a way to pay, below); its gift cards are its own (US only).
# Prices: the pricing page's FAQ says "We offer monthly plans for Go, Plus and Business", and the Pro article "Pro is
# billed monthly. Annual billing and payment for multiple months in advance are not available." No page says the
# prices include tax.
# Region checklist, 2026-11-04: 1. chatgpt.com/pricing has no country path; 2. its footer's picker is the language;
# 3. not looked for; 4. checkout needs an account; 5. "Multi-currency billing" lists the currencies, not the prices;
# 6. each country's prices read through its exit; 7. no bill offered.

# Coverage: chatgpt.pro-200 and chatgpt.pro-500 aren't priced in CA, GB, AU, NZ, IE, DE, FR, NL, ES or IT: the pricing
# page shows only Pro 100's local price ("From CA$136"), and the other tiers' local prices only after signing in. Their
# US prices are the Pro article's.

id: chatgpt
name: ChatGPT
website: https://chatgpt.com
category: ai
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    AU: AUD,
    NZ: NZD,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
cancelUrl: https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription
sources: { pricing: https://chatgpt.com/pricing/ }
# Ways to pay (M11.5), read 2026-11-04 in "Multi-currency billing": cards in every country, the App Store and Google
# Play in its apps, ChatGPT wallet balance (from its gift cards) in the US, and "Bank debit via Link (where supported)"
# in the UK and the EEA. No page names the card networks: the pricing page's FAQ says "any major credit card".
paymentMethods:
  - methods: [card, app-store]
    page: 'Multi-currency billing'
    url: https://help.openai.com/en/articles/10421635-multicurrency-billing
    quotes:
      - 'Credit and debit cards'
      - 'If you subscribe via the ChatGPT app on iOS or Android, your subscription is managed by the Apple App Store or Google Play and charges will appear in your local currency.'
  - methods: [card, app-store, gift-card]
    regions: [US]
    page: 'Multi-currency billing'
    url: https://help.openai.com/en/articles/10421635-multicurrency-billing
    quotes:
      - 'Credit and debit cards'
      - 'If you subscribe via the ChatGPT app on iOS or Android, your subscription is managed by the Apple App Store or Google Play and charges will appear in your local currency.'
      - 'Note that gift card purchases and redemptions are currently available in the US only, and denominated in USD.'
  - methods: [card, app-store, bank-transfer]
    regions: [GB, IE, DE, FR, NL, ES, IT]
    page: 'Multi-currency billing'
    url: https://help.openai.com/en/articles/10421635-multicurrency-billing
    quotes:
      - 'Credit and debit cards'
      - 'If you subscribe via the ChatGPT app on iOS or Android, your subscription is managed by the Apple App Store or Google Play and charges will appear in your local currency.'
      - 'Bank debit via Link (where supported)'
# Owner (M11.2), read 2026-11-04: OpenAI's structure page; its terms are with OpenAI OpCo, LLC.
owner:
  name: 'OpenAI Group PBC, controlled by the OpenAI Foundation, a nonprofit'
  page:
    name: Our structure
    url: https://openai.com/our-structure/
  quotes:
    - 'The for-profit is now a public benefit corporation, called OpenAI Group PBC'
    - 'The OpenAI Foundation continues to control the OpenAI Group.'
  country:
    code: US
    page:
      name: Terms of use
      url: https://openai.com/policies/row-terms-of-use/
    quotes:
      - 'These Terms form an agreement between you and OpenAI OpCo, LLC, a Delaware company'
    lastVerified: 2026-11-04
  lastVerified: 2026-11-04

# Renewal day (M11.5), read 2026-11-04: its terms say "we will automatically charge your payment method on each
# agreed-upon periodic renewal until you cancel", and its cancelling article names a "next billing date", not which day.
renewalAnchor:
  kind: not-stated
  pages:
    - https://openai.com/policies/row-terms-of-use/
    - https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription
  lastVerified: 2026-11-04

# Perks (M11.6), read 2026-11-04 on the pricing page and the Pro article: "Pro 200 includes more usage than Pro 100. Pro
# 500 offers the highest included usage of the three plans", "Ultrafast is available only on Pro 500", and Pro's card's
# "Dot, your always-on agent".
perks:
  - id: dot-agent
    name: Dot, your always-on agent
  - id: usage-more-than-pro-100
    name: More usage than Pro 100
  - id: usage-highest
    name: The highest included usage of the three Pro plans
  - id: ultrafast
    name: Ultrafast with GPT-6 Astra and GPT-6.1 Sol

