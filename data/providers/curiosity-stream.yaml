# Researched by hand on 2026-11-13 (M11.15, streaming batch 7), read with Edge from Canada, its plans page again through
# a US, UK, Irish, Australian, New Zealand, German, French, Dutch, Spanish and Italian exit, its help centre
# (help.curiositystream.com, all 38 articles) in Edge, and its terms and privacy policy with a plain fetch. Pages, each
# quoted where it's used:
# Pricing: its plans page (curiositystream.com/plans) prices by where the visitor is, and the pricing data it loads
# (api-use1.curiositystream.com/pricing, read as part of the page) names each country's currency: Canada "CA$7.99/month"
# and "Billed CA$67.99 annually" for Standard, "CA$15.99/month" and "Billed CA$109.99 annually" for Smart Bundle
# ("currency":"CAD"; its Smart Bundle sign-up page: "CA$109.99/year + tax"); through a US exit $5.99 and $49.99, $11.99
# and $79.99 ("USD"); the UK £4.99 and £35.99, £7.99 and £58.99 ("GBP"); Ireland, Germany, France, the Netherlands, Spain
# and Italy €4.99 and €41.99, €9.99 and €67.99 ("EUR"); Australia A$6.95 and A$60.95, A$15.95 and A$109.95 ("AUD");
# New Zealand NZ$7.99 and NZ$64.99, NZ$19.99 and NZ$132.99 ("NZD"). The cards' "/month" figures for the annual plans
# (CA$5.67, CA$9.17) are the yearly price spread over 12 months. Its help centre's "International subscription pricing
# information" still gives older US prices ($4.99 and $39.99, $9.99 and $69.99, updated 2026-01-23), and its terms say
# "All fees are charged in US Dollars (USD)", but the plans page and its data, which the sign-up uses, price each country
# in its own currency, so they decide. The UK's, Europe's and Oceania's data mark the prices tax-inclusive
# ("is_tax_inclusive":true), but no words on the page say so, so no taxIncluded (Nebula's precedent). Not listed: its
# "$3 for 3 months" offer (curiositystream.com/free), a first term; gift cards (a prepaid Standard or Smart Bundle year);
# and bulk subscriptions for businesses, schools and libraries.
# Region checklist, 2026-11-13: 1. no country paths (one site; its /es pages only translate); 2. a language
# menu (English, Deutsch, Español), no country picker; 3. the plans page's pricing data, which names each currency; 4. the
# plan picker up to its account form (an email and a password), typing nothing; 5. its help centre's international
# pricing and tax articles; 6. Edge from Canada and through each country's exit, and a plain fetch; 7. no bill offered.
# Bundles: its Smart Bundle is its own plan (Curiosity Stream with Tastemade Cooking, Kidstream, Curiosity University and
# SOMM TV, none of them in the catalog), so a plan with perks, not a bundle file. Its bundle with Nebula ended on
# 2024-12-31 (Nebula's file). Official resellers: none; it sells gift cards itself. Partners that sell it as their own
# add-on, "separate from a normal Curiosity Stream subscription" (What platforms and devices do you currently support?):
# Amazon Prime Video (Canada too since 2026-09-30, its investor site's news), Comcast's Xfinity, Sling TV, layer3tv and
# fuboTV; ISPs that include it free (Flow, BTC, Rev); noted, not listed.
# Features, read 2026-11-13: both plans' pricing data say "definition":"Ultra High Definition Streaming"
# ("encoding":"4k"), and its gift page: "Standard Annual is our most popular plan, and includes 3,000+ shows at up to 4K
# HDR resolution."
# and "Smart Bundle Annual includes everything in Standard Annual". Its plans table (a screenshot: the ticks are images)
# gives both plans "Download and watch" and only Smart Bundle "Watch on different screens at the same time", with no
# number, so Standard plays on 1 screen and Smart Bundle on 2 at least (inferred). Downloads: "You can save up to 10 hours
# of content at a time." on its Android and iOS apps (Offline Viewing with Mobile Apps), no number of devices, so 1
# (inferred). Ads: no page of its own says ad-free (its App Store listing, Apple's site, says "award-winning, ad-free
# content"); its company profile sets the Curiosity Stream service apart from its "free, ad-supported channels", so
# ad-free (inferred). No profiles: Kids Mode is "account-wide when enabled", and turning it off asks for the account's
# password (What is Kids Mode?), so parental controls. Pausing: "Choose the duration you would like to pause your
# subscription (1, 2, or 3 months)." for monthly plans billed by it (How do I pause my subscription?). What it streams:
# "Stream thousands of films, series, and shows." (its about page), "premium documentaries and series" (its plans page),
# and "CuriosityKIDS, a dedicated collection of safe, entertaining and inspiring programs for families" (its comparison
# page); none of your own media.
# Free use: none. Its plans are paid, with no trial now (the pricing data: "has_trial":false); curiositystream.com/free
# lets anyone watch six documentaries "to celebrate our 10th Anniversary", a sample, and its free, ad-supported channels
# (Curiosity Now and others) are on other companies' services.

id: curiosity-stream
name: Curiosity Stream
website: https://curiositystream.com
category: streaming
spendCategory: streaming
# No availableIn: "Curiosity Stream is available worldwide in all countries." (Can I be a Curiosity Stream subscriber if I
# am an international customer?), and it prices "in AED, AUD, BRL, CAD, CHF, COP, CZK, DKK, EUR, GBP, HKD, IDR, INR, MXN,
# MYR, NOK, NZD, PHP, PLN, RON, SAR, SEK, SGD, TRY, and ZAR for those located elsewhere" (International subscription
# pricing information); only the research regions are priced here.
