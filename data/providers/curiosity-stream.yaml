    - topic: other.notable
      title: No claims over its tracking
      tier: bad
      reason: 'Its terms make you promise never to sue it over what its tracking tools send to other companies, and say signing up in order to bring a claim breaks its terms and could cost you its legal fees.'
      sources:
        - url: https://curiositystream.com/terms
          quote: 'YOU WILL NOT INITIATE ANY LITIGATION OR OTHERWISE ASSERT ANY CLAIM AGAINST CS BASED, IN WHOLE OR IN PART, ON SUCH TRANSMISSIONS'
        - url: https://curiositystream.com/terms
          quote: 'for the purpose of, or with the intention of initiating, future litigation or arbitration'
        - url: https://curiositystream.com/terms
          quote: "CS can elect to void this agreement, without prejudice to CS's ability to seek damages, expressly including CS's attorneys' fees, from you resulting from your breach of these Terms of Use and/or the fraudulent conduct described above."
