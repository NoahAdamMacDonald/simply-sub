  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It studies how you use its sites for analytics and marketing, and may record your clicks and typing to replay them. Opting out covers only some of its tools.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'To generate web analytics and compile user information for marketing purposes, advertising, conducting marketing analysis, providing you with recommendations for products or services based on your profile, and promotional material planning and distribution.'
        - url: https://curiositystream.com/privacy
          quote: 'We may use session replay technology to monitor how you interact with our Sites or services.'
        - url: https://curiositystream.com/privacy
          quote: 'Note that the opt-out is specific to Google activities and does not affect the activities of other ad networks or analytics providers that we may use.'
      action:
        name: 'Its cookie choices (privacy policy)'
        url: https://curiositystream.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It may sell or share your information with ad partners, and Meta can use what its pixel sees for its own ads. Opting out means filling in a form.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'We may sell or share identifiers, commercial information, internet or other electronic network activity information, and any of the categories of personal information listed in Section B, below.'
        - url: https://curiositystream.com/privacy
          quote: 'Please note that through the Meta Pixel, Facebook can connect this data with your Facebook account and use it for its own advertising purposes'
        - url: https://curiositystream.com/privacy
          quote: 'If you want to opt-out of this use, please fill out this form'
      action:
        name: 'Do Not Sell or Share My Personal Information'
        url: https://curiositystream.com/privacy#information-sharing
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It tracks what you do on its sites to show you targeted ads on other sites. You can opt out of its own cookies or send the Global Privacy Control, but other ad companies’ cookies stay.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'Targeting Tools on the Sites may result in information about your activity on the Sites being transmitted from your browser to CS and third parties, which, in turn, may result in the display of targeted advertisements on third-party websites and platforms, including advertisements for CS content.'
        - url: https://curiositystream.com/privacy
          quote: 'You can opt-out of first-party cookies by clicking here'
        - url: https://curiositystream.com/privacy
          quote: 'We do not recognize all DNT signals but we do recognize the Global Privacy Control.'
      action:
        name: 'Its cookie choices (privacy policy)'
        url: https://curiositystream.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you write or upload trains AI.'
      pages: [https://curiositystream.com/privacy, https://curiositystream.com/terms]
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it needs it to serve you, then for an “appropriate period” for its business and legal needs. It names no periods.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'We will retain your personal information for as long as necessary to provide the products and services you have requested. Afterwards, we may retain data for an appropriate period to protect ourselves from legal claims, to administer our business, or to the extent permitted by applicable law'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: poor
      reason: 'You can delete only some details yourself, such as your email or mailing address, in your account. Only people in Europe, the UK and some US states can ask for everything to be deleted.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'You can also specifically update, change, or delete certain personal information (such as your email address, mailing address, and payment method) on the Sites by logging into your account'
      action:
        name: 'Your account'
        url: https://curiositystream.com/account
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      regions: [GB, EU]
      tier: neutral
      reason: 'In Europe and the UK, you can ask it to delete your information, but it doesn’t say how long that takes.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'Additionally, individuals located in the EEA, United Kingdom, and Switzerland have the right to'
        - url: https://curiositystream.com/privacy
          quote: 'Request the deletion, anonymization or restriction of the processing of your personal information;'
      action:
        name: 'How to ask (its privacy policy)'
        url: https://curiositystream.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      status: not-stated
      reason: 'Its privacy policy names no way to get a copy of your data, except for people in Europe, the UK and some US states.'
      pages: [https://curiositystream.com/privacy]
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      regions: [GB, EU]
      tier: neutral
      reason: 'In Europe and the UK, you can ask it for an electronic copy of your information to take elsewhere; there’s no way to get it yourself.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'Additionally, individuals located in the EEA, United Kingdom, and Switzerland have the right to'
        - url: https://curiositystream.com/privacy
          quote: 'Receive an electronic copy of your personal information, if you would like such a copy for yourself or to port your personal information to a different provider;'
      action:
        name: 'How to ask (its privacy policy)'
        url: https://curiositystream.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: poor
      reason: 'Besides what the law requires, it uses and may hand over your information for informal requests from police or governments.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'and informal requests from law enforcement or other governmental authorities'
        - url: https://curiositystream.com/terms
          quote: 'CS reserves the right to access and disclose in accordance with applicable law any information, including, without limitation, user names of accounts and other information, to comply with applicable laws and lawful government requests.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: poor
      reason: 'Your information can be sent to its own companies and others anywhere in the world, and outside Europe it doesn’t say what protects it.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'CS may transfer that information to its affiliates and subsidiaries or to other third parties, across borders, and from your country or jurisdiction to other countries or jurisdictions around the world.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      regions: [GB, EU]
      tier: neutral
      reason: 'From Europe and the UK, your information goes to the US, whose privacy laws are weaker, protected by the EU’s standard contract terms.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'please note that you are transferring your personal information to the United States which does not have the same data protection laws as the EU/EEA'
        - url: https://curiositystream.com/privacy
          quote: 'In case of such transfer, appropriate safeguards (e.g., EU standard contractual clauses) will be used to ensure an adequate level of protection of your personal information.'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with an email address and a password, then give your name, address and card to pay.'
      sources:
        - url: https://help.curiositystream.com/en/article/66f2f1-how-does-curiosity-stream-work
          quote: '3. Create an account by entering your email address and a password.'
        - url: https://curiositystream.com/privacy
          quote: 'Email address, first and last name, mailing address and billing information if you subscribe to the Sites.'
      lastVerified: 2026-11-13
    - topic: privacy.children
      tier: neutral
      reason: 'It isn’t meant for anyone under 16 (18 in Europe), and deletes a child’s information it finds. Kids Mode hides unsuitable shows for the whole account.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'The Sites are not intended for use by persons under the age of 16, or under the age of 18 for visitors located in the European Economic Area ("EEA").'
        - url: https://curiositystream.com/privacy
          quote: 'In the event that we learn that a person under these ages has provided CS with personal information, we will promptly delete such personal information from our systems.'
        - url: https://help.curiositystream.com/en/article/bc4c20-what-is-kids-mode
          quote: 'Kids Mode is a viewing mode within your account settings that excludes films that may not be appropriate for young children.'
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: poor
      reason: 'It says only that it uses reasonable measures and firewalls. It names no outside checks and no way to report a security problem.'
      sources:
        - url: https://curiositystream.com/privacy
          quote: 'We implement reasonable security measures to protect against the loss, misuse, unauthorized access, disclosure, alteration or destruction of the information you provide us.'
        - url: https://curiositystream.com/privacy
          quote: 'We use firewalls to protect your information from unauthorized access, disclosure, alteration, or destruction.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online at any time from your account, with no fee, and keep watching until the end of the time you paid for.'
      sources:
        - url: https://curiositystream.com/terms
          quote: 'You have the right to cancel your subscription without fee or penalty at any time.'
        - url: https://curiositystream.com/terms
          quote: 'After cancellation, you will have continued access to the applicable content and/or services for the remainder of the current Subscription Period'
        - url: https://help.curiositystream.com/en/article/8b4f94-how-do-i-cancel-my-subscription
          quote: '3. Select Cancel Plan in the top right corner.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back when you cancel, a yearly plan included, but you keep watching until the end of the time you paid for.'
      sources:
        - url: https://curiositystream.com/terms
          quote: 'you will not receive any refund, unless otherwise stated at the time of cancellation'
        - url: https://curiositystream.com/smartbundle
          quote: 'There are no refunds for partial months or years.'
        - url: https://help.curiositystream.com/en/article/a2ab65-what-are-the-benefits-of-a-curiosity-stream-annual-standard-plan
          quote: 'By opting to save with an annual plan, the charge is non-refundable after the payment has been processed.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you about a new price ahead of time, in the way the law requires, without saying how far ahead; a new price starts with your next period.'
      sources:
        - url: https://curiositystream.com/terms
          quote: 'We may change the price of Paid Subscriptions from time to time, but we will communicate any price changes to you in advance in the manner required by applicable law (if any)'
        - url: https://curiositystream.com/terms
          quote: 'Price changes for Paid Subscriptions will take effect at the start of the next Subscription Period.'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: poor
      reason: 'Its plans offer no free trial now. Its terms say a trial charges your card when it ends unless you cancel, and promise no reminder.'
      sources:
        - url: https://curiositystream.com/terms
          quote: 'If you do not cancel your free trial within the trial period set out in the terms of the free trial, it will automatically convert to a Paid Subscription.'
        - url: https://curiositystream.com/terms
          quote: 'This means that we will charge your payment card for the applicable subscription fee once your free trial period ends'
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say a plan renews on its own, but not that it reminds you first.'
      pages:
        - https://curiositystream.com/terms
        - https://help.curiositystream.com/en/article/66f2f1-how-does-curiosity-stream-work
      lastVerified: 2026-11-13
    - topic: billing.fees
      tier: poor
      reason: 'Outside the US, what you’re billed can change from one period to the next with exchange rates and currency conversion fees.'
      sources:
        - url: https://help.curiositystream.com/en/article/e038ac-taxes-applicable-to-your-subscription
          quote: 'For subscribers located outside of the United States, the amounts billed may vary over billing periods due to fluctuating foreign currency rates and currency conversion fees.'
        - url: https://curiositystream.com/terms
          quote: 'All fees are charged in US Dollars (USD).'
      lastVerified: 2026-11-13
    - topic: billing.fees
      regions: [US]
      tier: great
      reason: 'In the US you pay the plan’s price plus any sales tax, and nothing more.'
      sources:
        - url: https://help.curiositystream.com/en/article/e038ac-taxes-applicable-to-your-subscription
          quote: 'For those subscribers located in a jurisdiction that does not charge an applicable tax, no amount will be charged beyond our subscription plan price.'
      lastVerified: 2026-11-13
    - topic: billing.plan-changes
      tier: poor
      reason: 'A switch takes effect at once and the new price starts at your next billing date, so moving to a cheaper plan gives up the rest of the dearer one you paid for.'
      sources:
        - url: https://help.curiositystream.com/en/article/f643c2-how-do-i-change-my-streaming-plan
          quote: '3. Choose the plan that you would like to change to. You will automatically be switched to the new plan or billing period (monthly <-> annual).'
        - url: https://help.curiositystream.com/en/article/f643c2-how-do-i-change-my-streaming-plan
          quote: '4. Your card will automatically be charged at the start of your next billing period in the amount of your new plan!'
      lastVerified: 2026-11-13
    - topic: legal.disputes
      tier: good
      reason: 'After 60 days of talks, disputes go to a court in Maryland, one person at a time, with no class actions or jury. A private referee (an arbitrator) decides only if a court throws that rule out.'
      sources:
        - url: https://curiositystream.com/terms
          quote: 'If, at the end of the Informal Negotiation Period (and not before), and only after the completion of the Conference, the Dispute has not been resolved, then the Dispute shall be resolved by a court located in the state of Maryland'
        - url: https://curiositystream.com/terms
          quote: 'YOU AND CS FURTHER AGREE TO BRING AND MAINTAIN ANY SUCH LITIGATION SOLELY ON AN INDIVIDUAL BASIS.'
        - url: https://curiositystream.com/terms
          quote: 'IN THE EVENT THAT A COURT OF COMPETENT JURISDICTION DETERMINES THAT SECTION 18.B OF THESE TERMS (INDIVIDUAL LITIGATION) IS INVALID OR UNENFORCEABLE, YOU AND CS AGREE THAT THE DISPUTE WILL BE DECIDED BY BINDING ARBITRATION ON AN INDIVIDUAL BASIS.'
      lastVerified: 2026-11-13
    - topic: legal.disputes
      regions: [DE]
      tier: great
      reason: 'In Germany, disputes go to the court where you live, and its US rules on class actions and private referees don’t apply.'
      sources:
        - url: https://curiositystream.com/terms
          quote: 'In deviation from Section 18, any dispute between the parties will be resolved by the competent court of the place where you have your residence or elective domicile.'
        - url: https://curiositystream.com/terms
          quote: 'SECTION 18 DOES NOT APPLY IF YOU ARE A USER BASED IN GERMANY.'
      lastVerified: 2026-11-13
    - topic: legal.terms-changes
      tier: poor
      reason: 'It changes its terms by posting them, using the service afterwards means you accept them, and changes can even apply to the past.'
      sources:
        - url: https://curiositystream.com/terms
          quote: 'By continuing to use the Sites, or any portion thereof, after we post any such changes, you accept these Terms of Use, as modified.'
        - url: https://curiositystream.com/terms
          quote: 'You agree that, to the extent permitted by law, any changes to these Terms of Use shall apply retroactively.'
