      regions: [DE]
      tier: poor
      reason: 'In Germany, it can close your account for any reason with a week’s notice, and its terms promise no refund.'
      sources:
        - url: https://curiositystream.com/terms
          quote: "In deviation from Section 19, we may terminate the account and your use of the Sites for convenience with one (1) week's prior notice."
      lastVerified: 2026-11-13
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or end the service at any time, and the Smart Bundle’s partner services can be changed or dropped whenever it likes.'
      sources:
