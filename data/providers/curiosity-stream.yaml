# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch and in Edge: its Terms of Use ("Effective Date:
# March 19, 2024", CuriosityStream Inc.'s, under Maryland law, with sections for users in Germany) and its Privacy Policy
# ("Last Updated: March 19, 2024"), which the terms incorporate; its Gift Subscription Terms (curiositystream.com/
# giftterms: no topic changes); its sign-up forms (curiositystream.com/plans: "Email" and "Password"; its Smart Bundle
# page's: name, country and card, and "By subscribing to Curiosity Stream, you agree to our Terms of Use and Privacy
# Policy.", read without typing); and its help centre's billing, cancelling, pause, plan change, download and Kids Mode
# articles. Its apps have no licence of their own (the terms' section 2). Not read: its opt-out form (a Google form,
# another company's site), the steps after the account form, and the bundled services' own terms. Its terms take a
# perpetual, irrevocable licence over what you submit (section 8), a topic streaming doesn't have. Calibrated against
