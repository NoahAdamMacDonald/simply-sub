# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge from its help centre: its
# Terms of Service (effective May 27, 2026), which include its Privacy Policy, the Subscription Plans page and its
# Community Guidelines (in the terms, and as their own article: no topic beyond them); its Cookie Policy, Data Deletion
# and Privacy FAQ, and the Public Summary of Training Content (its EU AI Act disclosure). Not read: the sign-up form's
# agreement line (sign-up is Google's or Discord's own form) and Discord's terms (for its Discord bot); the Purchase
# Order Terms and Conditions are for companies buying in bulk (business).
policies:
  links:
    - name: Terms of service
      url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
    - name: Privacy policy
      url: https://docs.midjourney.com/hc/en-us/articles/32083472637453-Privacy-Policy
    - name: Cookie policy
      url: https://docs.midjourney.com/hc/en-us/articles/37012090959245-Cookie-Policy
    - name: Data deletion and privacy FAQ
      url: https://docs.midjourney.com/hc/en-us/articles/32084462534541-Data-Deletion-and-Privacy-FAQ
    - name: Public summary of training content
      url: https://docs.midjourney.com/hc/en-us/articles/48067080311309-Public-Summary-of-Training-Content
    - name: Canceling your subscription
      url: https://docs.midjourney.com/hc/en-us/articles/25384024738573-Canceling-Your-Subscription
    - name: Requesting a refund
      url: https://docs.midjourney.com/hc/en-us/articles/25386088618253-Requesting-a-Refund
    - name: Free trials
      url: https://docs.midjourney.com/hc/en-us/articles/27870399340173-Free-Trials
    - name: Turning off automatic renewals
      url: https://docs.midjourney.com/hc/en-us/articles/27868888211213-Turning-Off-Automatic-Renewals
    - name: Payment currency
      url: https://docs.midjourney.com/hc/en-us/articles/27868831424525-Payment-Currency
    - name: Keeping your creations private
      url: https://docs.midjourney.com/hc/en-us/articles/28014645615373-Keeping-Your-Creations-Private
    - name: Stealth mode
      url: https://docs.midjourney.com/hc/en-us/articles/32019750070669-Stealth-Mode
    - name: Logging in and connecting accounts
      url: https://docs.midjourney.com/hc/en-us/articles/33390994570509-Logging-In-Connecting-Accounts
    - name: Upgrading or downgrading your plan
      url: https://docs.midjourney.com/hc/en-us/articles/27870428114317-Upgrading-or-Downgrading-Your-Plan
    - name: Comparing Midjourney plans
      url: https://docs.midjourney.com/hc/en-us/articles/27870484040333-Comparing-Midjourney-Plans
    - name: Pricing
      url: https://www.midjourney.com/pricing
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel at any time with one button on your subscription page, and you keep everything you paid for, Fast time included, until the period ends.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/25384024738573-Canceling-Your-Subscription
          quote: 'You can cancel your Midjourney subscription at any time by going to your Manage Subscription Page and clicking the Cancel Plan button.'
        - url: https://docs.midjourney.com/hc/en-us/articles/25384024738573-Canceling-Your-Subscription
          quote: "Your cancellation will become effective at the end of your current billing cycle, and you'll still have access to all of your subscription features—including any remaining Fast time—until then."
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'You get money back only if you have barely used it (under 20 minutes of generating, ever). Otherwise there is no refund, but you keep it to the end of the time you paid for.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/25386088618253-Requesting-a-Refund
          quote: "You're eligible for a refund only if you've used less than 20 GPU minutes throughout the lifetime of your account."
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'You will not be refunded for the current subscription period, but You will not be charged after the current subscription period has ended.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: poor
      reason: 'It can change its prices at any time, and its terms don’t say it will tell you first.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'We reserve the right to modify or discontinue any aspect of the Service, including pricing and features, at any time.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      status: not-stated
      reason: 'Its website has no free trial. Its help centre mentions a limited trial in its separate niji · journey app, but not whether it turns into a paid plan.'
      pages:
        - https://docs.midjourney.com/hc/en-us/articles/27870399340173-Free-Trials
        - https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its help centre says every plan renews on its own and you must cancel each time, but not that it reminds you before a renewal.'
      pages:
        - https://docs.midjourney.com/hc/en-us/articles/27868888211213-Turning-Off-Automatic-Renewals
        - https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
      lastVerified: 2026-11-17
    - topic: billing.fees
      status: not-stated
      reason: 'Its pages list no fees beyond the price and tax. It charges only in US dollars, so your bank may convert the amount and add its own fee.'
      pages:
        - https://docs.midjourney.com/hc/en-us/articles/27868831424525-Payment-Currency
        - https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up can start at once, with a discount for the Fast time you haven’t used. Moving down starts when your plan renews, with no money back.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/27870428114317-Upgrading-or-Downgrading-Your-Plan
          quote: "If you upgrade right away, you'll receive a discount based on any unused Fast time from your current plan."
        - url: https://www.midjourney.com/pricing
          quote: "Downgrading: If you decide to switch to a lower plan, the change will take effect at your next renewal, not immediately. Please note that downgrading won't refund your current plan."
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: neutral
      reason: 'Every dispute goes to a private referee (an arbitrator) in California instead of a court, and you give up a jury. Its terms say nothing about class actions, and offer no way to opt out.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'In the event a dispute, controversy, or claim arises out of or relating to these Terms (“Dispute”), the Dispute will be resolved by binding arbitration rather than in court.'
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'The arbitration will be conducted in English in Santa Clara County, California, USA.'
      action:
        name: 'Its dispute clause (section 6 of its terms)'
        url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It shows you its updated terms, without saying how long before they apply, and using Midjourney after that means you accept them.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'This agreement may be updated and presented again to the Customer from time to time. Continued use of the Services constitutes acceptance of the updated terms.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: bad
      reason: 'It can suspend or ban you at any time, for any reason, and you get no money back for the time you paid for.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'Midjourney reserves the right to suspend or ban Your access to the Services at any time, and for any reason.'
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'You will not be refunded for the current subscription period, but You will not be charged after the current subscription period has ended.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: bad
      reason: 'You give Midjourney a licence that never ends over what you type, upload and make, which it can pass to anyone. Your work is public for others to remix; Stealth mode (Pro, Mega) hides it but doesn’t narrow the licence.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'By using the Services, You grant to Midjourney, its affiliates, successors, and assigns a perpetual, worldwide, non-exclusive, sublicensable no-charge, royalty-free, irrevocable copyright license to reproduce, prepare derivative works of, publicly display, publicly perform, sublicense, and distribute the Content You input into the Services, as well as any Assets produced by You through the Service.'
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'Please note: Midjourney is an open community which allows others to use and remix Your Content whenever they are posted in a public setting. By default, Your Content is publicly viewable and remixable.'
        - url: https://docs.midjourney.com/hc/en-us/articles/28014645615373-Keeping-Your-Creations-Private
          quote: 'Available only with our Pro and Mega Plans, Stealth mode keeps your creations hidden from other users on the website.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: neutral
      reason: 'You own the images and videos you make, even after you cancel, but Midjourney keeps a licence to use them. A company earning over $1 million a year owns them only on Pro or Mega.'
      sources:
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'You own all Assets You create with the Services to the fullest extent possible under applicable law.'
        - url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
          quote: 'If you are a company or any employee of a company with more than $1,000,000 USD a year in revenue, you must be subscribed to a “Pro” or “Mega” plan to own Your Assets.'
