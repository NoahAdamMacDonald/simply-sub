  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on the pricing cards and Comparing Midjourney Plans: GPU time and Relax mode (usage,
# never features), Stealth mode (private generation: no registry feature) and the commercial-use terms.
perks:
  - id: fast-200-minutes
    name: 'Limited generations (~200 image jobs / month)'
  - id: fast-15h
    name: 15h Fast generations
  - id: fast-30h
    name: 30h Fast generations
  - id: fast-60h
    name: 60h Fast generations
  - id: relax-images
    name: Unlimited Relax image generations
  - id: relax-video
    name: Unlimited Relax image and SD video generations
  - id: stealth-mode
    name: Stealth mode generation
  - id: commercial-terms
    name: General commercial terms
  - id: commercial-big-companies
    name: 'Commercial use for companies making more than $1,000,000 USD a year'

# AI and creative features, read 2026-11-17, on every plan unless named:
# - It's sold as an AI service (its about page: "a community-funded research lab of 60 people known for building the
#   most beautiful AI models in the world"), so its plans are in the ai category with ai.assistant, and in creative
#   (notes.md: an image generator under the registry's assistant group). Conversational mode is an assistant of its
#   own: "Conversational mode allows you to describe your ideas and images in normal, conversational language to an AI
#   that will write prompts for you." (Draft & Conversational Modes), on midjourney.com with no plan named. Its "With
#   Voice: Prefer talking? Click the microphone  icon." is dictation: you speak your ideas and nothing answers aloud,
#   so no voice conversations.
# - Image and video generation: "SD video generation" (Basic) and "SD and HD video generation" (the other cards);
#   "Midjourney videos are generated in 480p quality, also called Standard Definition (SD)." and "If you have the
#   Standard, Pro, or Mega plan you can also generate videos in 720p quality" (Video): Standard, Pro and Mega export
#   720p; Basic's 480p is below the registry's lowest value, so it states none.
# - Creative tools: photo editing, its Editor on your own images on every card ("Use Editor on uploaded images"; "The
#   Editor on midjourney.com provides a simple and easy-to-use web interface for editing and adjusting your favorite
#   images—both Midjourney images and your own personal ones.", Editor).
# - No watermark, inferred: its content authenticity article describes only a hidden tag ("Every image Midjourney
#   delivers has a small ID tag hidden inside the file."), lost on "Screenshots, edits, and most social media sites".
# - Chats and creations kept on its servers: "The personal information you provide is stored on Midjourney servers in
#   the US." (Data Deletion and Privacy FAQ).
# - None of its pages offers web search, memory across chats, projects, reasoning models, a coding agent, an API,
#   other companies' models, music or voice generation, or apps for your phone (the niji · journey app is a separate
#   app with its own trial). Personalization profiles learn your taste in images, not your chats (notes.md).
# General features, read 2026-11-17: the web and Discord ("Every Midjourney plan lets you use both platforms—it's all
# about setting things up correctly.", Logging In & Connecting Accounts); Discord has no platform value, so `web`.
# Sign-in: "Right now, you can create a Midjourney account using either a Discord account or a Google account." and
# "We don't have the option to create a username and password specific just to Midjourney." Support: "For billing
# inquiries, please email billing@midjourney.com", and its Discord server. No app languages listed, no pause (a "Paused"
# plan is a failed payment, Fixing a Paused Plan) and no parental controls on its pages.
features:
  platforms: [web]
  account.sign-in: [sso]
  support.channels: [email, community]

