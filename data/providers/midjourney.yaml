# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2), read with Edge from Canada: midjourney.com's
# pricing page (each FAQ answer opened, and its Monthly billing view) and home page, and its help centre
# (docs.midjourney.com: the plans, payment, currency, tax, free trial, renewal, cancelling, refund, plan change,
# auto-renewal, support, sign-in, Editor, Video, Draft and Conversational mode, Stealth mode, privacy, commercial use,
# content authenticity, data deletion and student billing articles, its Terms of Service, Privacy Policy, Cookie Policy,
# Community Guidelines and Public Summary of Training Content). midjourney.com/about showed Cloudflare's check, and so
# did the pricing page through a UK exit (2026-11-17); the help centre's currency article settles every country.
# Pages, each quoted where it's used:
# Pricing: midjourney.com/pricing, the monthly "Regular price" ("$10", "$30", "$60", "$120") and the yearly
# per-month price ("With yearly billing" "$8" "/ month", "20% off billed annually"), and the help centre's Comparing
# Midjourney Plans, the yearly price in full ("$96", "$288", "$576", "$1,152", "the full year fee is paid upfront").
# "Midjourney accepts payments exclusively in US Dollars (USD)." (Payment Currency): one US-dollar price list for every
# country, GLOBAL. Tax is added at checkout ("Any taxes due are added to your subscription price"), so no price
# includes tax.
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang on the pricing page; 2. no country or currency
# picker; 3. the page's text names no currency, but its help centre says USD only; 4. checkout needs an account
# (Google or Discord); 5. Payment Currency and Tax / VAT Charges (USD only, tax added by Stripe); 6. Edge from Canada;
# a UK exit met Cloudflare's check; 7. no bill offered.
# Its plans: Basic, Standard, Pro and Mega, monthly or yearly. Not listed: extra Fast time bought as you go ("$4/hr",
# "Purchased additional Fast time expires after 60 days if unused and purchases cannot be refunded."), group and
# corporate billing (business), and the Midjourney Magazine subscription (a print magazine its store sells, not the
# image service: notes.md).
# Bundles: none on its pages. Official resellers: none; no page names a shop that sells it (third-party gift codes
# that load a virtual card aren't its resellers: notes.md).

id: midjourney
name: Midjourney
website: https://www.midjourney.com
domains: [docs.midjourney.com]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help centre's Canceling Your Subscription: "You can cancel your Midjourney subscription at any time by going to
# your Manage Subscription Page and clicking the Cancel Plan button."
cancelUrl: https://docs.midjourney.com/hc/en-us/articles/25384024738573-Canceling-Your-Subscription
sources: { pricing: https://www.midjourney.com/pricing }

# Ways to pay (M11.5), read 2026-11-17: cards and some wallets through Stripe (Accepted Payment Methods); Amazon Pay
# and Stripe's Link have no id, so they're `other`. "Unfortunately, PayPal isn't currently supported."
paymentMethods:
  - methods: [card, apple-pay, google-pay, alipay, other]
    page: 'Accepted Payment Methods'
    url: https://docs.midjourney.com/hc/en-us/articles/27868831972365-Accepted-Payment-Methods
    quotes:
      - 'Generally, you can pay with major credit and debit cards like Visa, Mastercard, and American Express, as well as some digital wallets such as Apple Pay, Amazon Pay, Alipay, Google Pay, and Link in some regions.'
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex]
    url: https://docs.midjourney.com/hc/en-us/articles/27868831972365-Accepted-Payment-Methods
    quotes:
      - 'Generally, you can pay with major credit and debit cards like Visa, Mastercard, and American Express'

# Owner (M11.2), read 2026-11-17: its terms name Midjourney, Inc. as the company you contract with; its takedown address
# is in South San Francisco and its terms are California's. Private: no page names a listing.
owner:
  name: 'Midjourney, Inc.'
  page:
    name: Terms of service
    url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
  quotes:
    - 'These Terms of Service (“Terms”) govern the relationship between Midjourney, Inc. (“Midjourney”,”we”,”our”)'
  country:
    code: US
    page:
      name: Terms of service
      url: https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service
    quotes:
      - 'South San Francisco, CA, 94080-7066, US'
      - 'This Agreement shall be governed by the laws of the State of California, USA, without reference to conflict of law rules.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: Finding Your Renewal Time says "Subscriptions renew monthly based on the date
