        - url: https://github.com/github/copilot-cli/blob/main/LICENSE.md
          quote: 'license to install and run copies of the GitHub Copilot CLI (the “Software”).'
        - url: https://github.com/github/copilot-cli/blob/main/LICENSE.md
          quote: 'This License does not grant you the right to: Modify, adapt, translate, or create derivative works of the Software;'
        - url: https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies
          quote: 'You will not reproduce, duplicate, copy, sell, resell or exploit any portion of the Service, use of the Service, or access to the Service without our express written permission.'
      lastVerified: 2026-11-14
    - topic: service.software-control
      tier: good
      reason: "Its self-hosted runner software updates itself; you can turn that off, but it may still install critical security fixes. Its terms don't say its apps change anything else."
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-for-additional-products-and-features
          quote: 'If you use self-hosted runners, you have the ability to turn off automatic updates but GitHub reserves the right to override your choice for critical security updates.'
      lastVerified: 2026-11-13
    - topic: service.account-sharing
      tier: bad
      reason: 'Your login is for one person only: you can’t share it with anyone, even at home.'
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'Your login may only be used by one person — i.e., a single login may not be shared by multiple people.'
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: good
      reason: 'An outside certification (ISO 27001) covers its security, and it pays security researchers who report problems through its bug bounty.'
      sources:
        - url: https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/accessing-compliance-reports-for-your-organization
          quote: 'ISO/IEC 27001:2022 certification'
        - url: https://docs.github.com/en/site-policy/security-policies/coordinated-disclosure-of-security-vulnerabilities
          quote: 'Like several other large software companies, GitHub provides a bug bounty to better engage with security researchers.'
      lastVerified: 2026-11-13
