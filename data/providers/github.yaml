  ratings:
    - topic: privacy.ai-training
      tier: poor
      reason: "Your Copilot prompts, answers and code train GitHub's and Microsoft's AI unless you opt out in your settings. What you post on GitHub, like public code, can train their AI with no way to opt out."
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'You also grant GitHub and its Affiliates a license to collect and use your Inputs and Outputs to develop, train and improve artificial intelligence and machine learning models and technologies including those that power AI Features, unless (a) you opt out through your account settings, or (b) your use of the Service is governed by a GitHub Customer Agreement or volume licensing agreement.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'You grant GitHub and our Affiliates the right to store, host, archive, parse, display, and make copies of Your Content as necessary to provide, develop, and improve the Service, including by training AI Features, and for the purpose of training, developing, and improving artificial intelligence and machine learning models and technologies of our Affiliates.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'The opt-out right described in this section applies solely to the use of your Inputs and Outputs as described in this section, and does not apply to the license granted in Sections D.4-D.8 or to any Content that does not constitute Input or Output (including Content stored in public repositories).'
      action:
        name: 'How to turn off model training'
        url: https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies
      lastVerified: 2026-11-13
    - topic: privacy.content-access
      tier: neutral
      reason: "Its staff don't open your private repositories without your consent, except for security, its rules, support you asked for or the law, and its systems check content for abuse. (Training is graded under AI training.)"
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'GitHub considers the contents of private repositories to be confidential to you, as set forth in Section E.2, and GitHub personnel will not access private repository content without your consent except in the following circumstances:'
        - url: https://docs.github.com/en/support/learning-about-github-support/about-github-support
          quote: 'GitHub Support will never access your private repositories without your explicit consent.'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'Safety and Security: To promote safety, integrity, and security across our Services, we process Personal Data, using both automated and, at times, manual techniques for abuse detection, prevention, and violations of terms of service.'
      lastVerified: 2026-11-13
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use GitHub, like your device, what you do and when, to run and improve its products, AI included. You can only limit its optional cookies, browser by browser. (Training is graded under AI training.)'
      sources:
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'Service Usage Information: We collect data about your interactions with the Services, such as IP address, device information, session details, date and time of requests, device type and ID, operating system and application version, information related to your contributions to repositories, and performance of specific features or Services.'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'Product Development and Improvement: We use Personal Data to develop and improve our products, services, and technologies, including artificial intelligence and machine learning technologies.'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'These choices are specific to the browser you are using.'
      action:
        name: 'Its privacy statement’s cookie choices'
        url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares data with Microsoft, its owner, for marketing, ads and AI, and has shared some with ad networks and social networks. You can only say no browser by browser, with its "Do Not Share" link or a privacy signal.'
      sources:
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'Affiliates: Personal Data may be shared with GitHub affiliates, including Microsoft, to facilitate customer service, marketing and advertising, order fulfillment, billing, technical support, legal and compliance obligations, product development and improvement (including training and improving artificial intelligence and machine learning technologies), and for other purposes described in their respective privacy statements.'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'We shared each category to or with advertising networks, data analytics providers, and social networks.'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'To opt out of the sharing of your personal information, you can click on the "Do Not Share My Personal Information" link on the footer of our Websites or use the Global Privacy Control ("GPC") if available.'
      action:
        name: 'How to opt out of sharing'
        url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: "Its websites may let other companies' cookies collect data to pick ads for you, asking first only in some countries. You can refuse them, but only browser by browser."
      sources:
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'We may also employ third-party Cookies to gather data for interest-based advertising. In some jurisdictions, we only use non-essential cookies after obtaining your consent.'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'These choices are specific to the browser you are using.'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-cookies
          quote: 'You can change your preference about non-essential cookies at any time by following these instructions'
      action:
        name: 'How to turn off optional cookies'
        url: https://docs.github.com/en/site-policy/privacy-policies/github-cookies
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data while your account is open and as long as it needs it. It deletes your profile and repositories within 90 days of closing your account, though some can stay in encrypted backups.'
      sources:
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'We’ll retain your Personal Data as long as your account is active and as needed to fulfill contractual obligations, comply with legal requirements, resolve disputes, and enforce agreements.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'barring legal requirements, we will delete your full profile and the Content of your repositories within 90 days of cancellation or termination (though some information may remain in encrypted backups).'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: good
      reason: "You can close your account yourself in your settings, and it deletes your profile and repositories within 90 days. What you added to others' repositories, or what they copied, stays."
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'You can cancel your Account at any time by going into your Settings in the global navigation bar at the top of the screen.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'barring legal requirements, we will delete your full profile and the Content of your repositories within 90 days of cancellation or termination (though some information may remain in encrypted backups).'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: "We will not delete Content that you have contributed to other Users' repositories or that other Users have forked."
      action:
        name: 'How to delete your account'
        url: https://docs.github.com/en/account-and-profile/how-tos/account-management/deleting-your-personal-account
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      tier: good
      reason: 'You can download your account’s data yourself from your settings as a tar.gz file, and copy each repository with its whole history using Git.'
      sources:
        - url: https://docs.github.com/en/get-started/archiving-your-github-personal-account-and-public-repositories/requesting-an-archive-of-your-personal-accounts-data
          quote: "You can export your personal account's data through your account settings on GitHub or with the User Migration API."
        - url: https://docs.github.com/en/get-started/archiving-your-github-personal-account-and-public-repositories/requesting-an-archive-of-your-personal-accounts-data
          quote: 'When you request an export of your personal data through your account settings on GitHub, GitHub packages your personal data in a tar.gz file and sends you an email to your primary email address with a download link.'
        - url: https://docs.github.com/en/repositories/archiving-a-github-repository/backing-up-a-repository
          quote: 'You can take a backup of a Git repository, including the revision history, by performing a mirror clone with the Git CLI.'
      action:
        name: 'How to export your data'
        url: https://docs.github.com/en/get-started/archiving-your-github-personal-account-and-public-repositories/requesting-an-archive-of-your-personal-accounts-data
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: good
      reason: 'It hands over private data only with your consent or valid legal papers, tells you first unless the law forbids it, and publishes how many requests it gets.'
      sources:
        - url: https://docs.github.com/en/site-policy/other-site-policies/guidelines-for-legal-requests-of-user-data
          quote: 'It is our policy to disclose non-public user information in connection with a civil or criminal investigation only with user consent or upon receipt of a valid subpoena, civil investigative demand, court order, search warrant, or other similar valid legal process.'
        - url: https://docs.github.com/en/site-policy/other-site-policies/guidelines-for-legal-requests-of-user-data
          quote: 'We will notify affected users about any requests for their account information, unless prohibited from doing so by law or court order.'
        - url: https://transparencycenter.github.com/
          quote: 'being transparent about content moderation and disclosure of user information.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: neutral
      reason: "Your data can be kept in the US and other countries where GitHub, its group or its suppliers work. Data from Europe is moved under the EU's and the US's recognised legal safeguards."
      sources:
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'GitHub stores and processes Personal Data in a variety of locations, including your local region, the United States, and other countries where GitHub, its affiliates, subsidiaries, or subprocessors have operations.'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'GitHub also complies with the EU-U.S. Data Privacy Framework (EU-U.S. DPF), the UK Extension to the EU-U.S. DPF, and the Swiss-U.S. Data Privacy Framework (Swiss-U.S. DPF) as set forth by the U.S. Department of Commerce.'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'To sign up you need an email address, a username and a password; your real name is optional. Paid plans also need billing details.'
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'You must provide a valid email address in order to complete the signup process.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'Any other information requested, such as your real name, is optional'
        - url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
          quote: 'Account Data: We collect certain information when you open an account such as your GitHub handle, name, email address, password, payment information and transaction information.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel Copilot or downgrade GitHub Pro in your settings at any time, and keep what you paid for until the end of the billing period.'
      sources:
        - url: https://docs.github.com/en/copilot/how-tos/manage-your-account/view-and-change-your-copilot-plan
          quote: 'You can cancel your Copilot plan at any time.'
        - url: https://docs.github.com/en/copilot/how-tos/manage-your-account/view-and-change-your-copilot-plan
          quote: 'You’ll retain access to your current features until your billing cycle ends.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'however, the service will remain active for the length of the paid billing period.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back, even for unused months, but you keep using it until the end of the period you paid for.'
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'For monthly or yearly payment plans, the Service is billed in advance on a monthly or yearly basis respectively and is non-refundable.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'There will be no refunds or credits for partial months of service, downgrade refunds, or refunds for months unused with an open Account; however, the service will remain active for the length of the paid billing period.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: great
      reason: "Your price stays the same until the end of the term you paid for, and it gives at least 30 days' notice of a price rise, by email or on its website."
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'If you agree to a subscription price, that will remain your price for the duration of the payment term; however, prices are subject to change at the end of a payment term.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'We will notify our Users of material changes to this Agreement, such as price increases, at least 30 days prior to the change taking effect by posting a notice on our Website or sending email to the primary email address specified in your GitHub account.'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      status: not-stated
      reason: 'Its terms and Copilot’s plans pages describe no free trial for its personal plans: the free plans simply stay free.'
      pages:
        - https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
        - https://github.com/features/copilot/plans
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say paid plans are billed in advance each month or year, but not that it reminds you before renewing.'
      pages:
        - https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
        - https://docs.github.com/en/billing/get-started/how-billing-works
      lastVerified: 2026-11-13
    - topic: billing.fees
      tier: neutral
      reason: 'Using more than your plan includes, like extra Copilot credits or Actions time, is billed by use at listed rates. Use from your last days on a plan can be billed after you cancel.'
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'If you choose to use paid Service features beyond the quantity included in your plan, you pay for those Service features based on your actual usage in the preceding month.'
        - url: https://docs.github.com/en/copilot/concepts/billing-and-usage/individuals/billing
          quote: 'Your additional usage budget is set in US dollars, and your usage is shown in GitHub AI Credits.'
        - url: https://docs.github.com/en/copilot/concepts/billing-and-usage/individuals/billing
          quote: 'Usage from your final days on the plan might not appear on your last invoice, so you might receive a charge after you cancel.'
      lastVerified: 2026-11-13
    - topic: billing.plan-changes
      tier: good
      reason: 'An upgrade starts at once and you pay only the difference; a downgrade starts at the end of the period you paid for.'
      sources:
        - url: https://docs.github.com/en/copilot/reference/copilot-billing/license-changes
          quote: 'If you upgrade your plan (for example, from Copilot Pro to Copilot Pro+), the change is immediate'
        - url: https://docs.github.com/en/copilot/reference/copilot-billing/license-changes
          quote: 'You are charged the full price of the new plan, minus the amount you already paid for your current plan.'
        - url: https://docs.github.com/en/billing/concepts/impact-of-plan-changes
          quote: 'Downgrades and cancellations take effect only after the current billing cycle ends.'
      lastVerified: 2026-11-13
    - topic: legal.disputes
      tier: good
      reason: "There's no arbitration: disputes go to the courts in San Francisco, California, the ones it chose."
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'You and GitHub agree to submit to the exclusive jurisdiction and venue of the courts located in the City and County of San Francisco, California.'
      lastVerified: 2026-11-13
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It warns of big changes, like price rises, at least 30 days ahead, by email or just on its website. Smaller changes apply once posted, and using GitHub means you accept them.'
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'We will notify our Users of material changes to this Agreement, such as price increases, at least 30 days prior to the change taking effect by posting a notice on our Website or sending email to the primary email address specified in your GitHub account.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'For any other modifications, your continued use of the Website constitutes agreement to our revisions of these Terms of Service.'
      lastVerified: 2026-11-13
    - topic: legal.account-closure
      tier: bad
      reason: 'It can suspend or close your account at any time, with or without a reason or notice, and its terms promise no refund. You can appeal its decision.'
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'GitHub has the right to suspend or terminate your access to all or any part of the Website at any time, with or without cause, with or without notice, effective immediately.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'In order to treat everyone equally, no exceptions will be made.'
        - url: https://docs.github.com/en/site-policy/acceptable-use-policies/github-appeal-and-reinstatement
          quote: "If you'd like to seek Reinstatement or wish to Appeal an enforcement action on GitHub or npm, please fill out the applicable form:"
      lastVerified: 2026-11-13
    - topic: legal.content-rights
      tier: bad
      reason: 'What you post stays yours, and its licence ends when you remove it, unless others copied it. But GitHub may hand that licence to any other person or company without asking you.'
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'You own Your Content.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'These licenses end when you remove Your Content, unless other Users have forked it.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'in whole or in part, to any person or entity at any time with or without your consent, including the license grant in Section D.4.'
      lastVerified: 2026-11-13
    - topic: legal.output-rights
      tier: good
      reason: "GitHub doesn't claim what Copilot writes for you. It may look like other people's code, though, and checking whether you need their licence is up to you."
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'GitHub does not claim ownership of your Input or Output.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'You are responsible for determining whether your use of Output requires a third-party license and for complying with any such license.'
      lastVerified: 2026-11-13
    - topic: legal.service-changes
      tier: poor
      reason: "It can change or stop GitHub and Copilot at any time without notice and says it isn't liable for that. The extra Copilot use your plan includes can change over time."
      sources:
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'We reserve the right at any time and from time to time to modify or discontinue, temporarily or permanently, the Website (or any part of it) with or without notice.'
        - url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
          quote: 'any modification, price change, suspension or discontinuance of the Service;'
        - url: https://github.com/features/copilot/plans
          quote: 'Variable additional usage on top of your base. Flex allotments may change over time.'
      lastVerified: 2026-11-13
    - topic: legal.inactivity
      tier: poor
      reason: 'Usernames are for active use: an account kept unused just to hold on to its name can be removed or renamed without warning.'
      sources:
        - url: https://docs.github.com/en/site-policy/other-site-policies/github-username-policy
          quote: 'GitHub prohibits account name squatting, and account names may not be reserved or inactively held for future use.'
        - url: https://docs.github.com/en/site-policy/other-site-policies/github-username-policy
          quote: 'Accounts violating this name squatting policy may be removed or renamed without notice.'
      lastVerified: 2026-11-14
