# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-13 and 2026-11-14 with a plain fetch of
# GitHub Docs: its Terms of Service (effective April 27, 2026), whose Section J governs Copilot for individuals ("For all
# other GitHub Copilot users, your use of GitHub Copilot is governed by Section J (AI Features) of the GitHub Terms of
# Service", its Additional Product Terms), and which include its Privacy Statement, its Acceptable Use Policies and
# Community Guidelines (conduct rules: enforcement graded under closing your account), and its Additional Product Terms
# (Actions, Codespaces, Pages and Previews rules: the self-hosted runner's updates graded, the rest no topic's); the GitHub
# Pre-release License Terms for preview features (computer use, third-party agents: "GitHub may change or discontinue
# pre-release software at any time, for any reason, without notice to you.", the same grade as the terms'); the GitHub
# Copilot CLI License (the CLI, which the Copilot app is built on; no licence of the app's own was found); its Cookies
# page and its help articles on billing, cancelling, deletion, export, legal requests, appeals and support. Not read: the
# sign-up form, which showed every reader (Edge headless and headed, a plain fetch) a bot check (its screenshot: Access
# is temporarily restricted); the Data Protection Agreement and Generative AI Services Terms, which are organizations'.
