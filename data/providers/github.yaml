# Researched by hand on 2026-11-13 (the AI category's batch 1), read with Edge from Canada and with a plain fetch of
# GitHub Docs (docs.github.com serves every article whole). One provider for GitHub's individual plans, the session's
# decision (one company, one set of terms): GitHub Free and GitHub Pro (personal accounts), and Copilot Free, Pro, Pro+
# and Max. Team, Enterprise, Copilot Business, Copilot Enterprise and "Copilot access" are organizations' plans: out of
# scope. Pages, each quoted where it's used:
# Pricing: Copilot's plans page (github.com/features/copilot/plans: its cards, its comparison table and its FAQ, each FAQ
# tab opened), GitHub's pricing page (github.com/pricing: Free, Team and Enterprise; GitHub Free's card is "The basics
# for individuals and organizations"), and GitHub Docs: "Plans for GitHub Copilot" (its tables' ticks are icons, read
# from their aria-labels), "Usage-based billing for individuals", "GitHub's plans", "GitHub Actions billing", "FAQ about
# changes to GitHub's plans" and "How GitHub billing works".
# One price for everyone, in US dollars: every page prices in "USD" ("$10 USD per month", "$4 USD per user/month"), and
# Copilot's plans page read through a US, UK, German and Australian exit showed the same cards and prices as from
# Canada. Its Copilot budgets are "set in US dollars", and its terms bill invoiced users "in U.S. Dollars". No page says
# its prices include tax: "You are responsible for all fees, including taxes, associated with your use of the Service."
# Copilot's periods: the plans pages price Pro, Pro+ and Max by the month only ("$10 USD per month", "$39 USD per
# month.", "$100 USD per month"). Its yearly plans are legacy: "This article only applies to Copilot Pro and Copilot Pro+
# subscribers on an existing annual plan who remained on legacy premium request-based billing after June 1, 2026." and
# "When your annual plan ends, you'll be automatically downgraded to Copilot Free." (What changed with Copilot billing).
# GitHub Pro: no pricing page lists it any more; the plans FAQ in its docs still says "GitHub Pro now has a reduced
# monthly price of $4", the price stored. "Under "Upgrade summary", choose whether you want to pay monthly or yearly."
# (Upgrading your account's plan) says Pro is sold by the year too, but no page shows the yearly price without
# signing in: it isn't priced (see notes.md).
# Region checklist for CA and US, 2026-11-13: 1. no country paths (its docs' languages translate, they don't price);
# 2. no country or currency picker, the footer's "English" is the language; 3. Copilot's page data lists plans and
# models, no country; 4. the checkout needs an account; 5. its billing docs ("Your additional usage budget is set in US
# dollars"); 6. Edge from Canada, then through US, UK, German and Australian exits: the same USD prices; 7. no bill
# offered.
# Students, teachers and open-source maintainers: verified students get Copilot Student ("Available to verified
# students. Get access to Copilot's features for free."), and verified teachers and maintainers of popular open-source
# projects get Copilot Pro free ("There are two ways to qualify for free access to Copilot Pro"); students get GitHub Pro
# with the Student Developer Pack ("GitHub will continue to offer GitHub Pro as part of its Student Developer Pack
# benefits to all students."). Notes on the plans, not plans of their own (the session's decision).
# Bundles: none for its personal plans. "GitHub Enterprise now includes access to GitHub Copilot" (github.com/pricing) is
# a business plan. Official resellers: none for its personal plans: its Partner Program (github.com/partners) is for
# businesses' "Services & Channel Partners", and its privacy statement's "Partners and Resellers: We cooperate with
# third-parties that offer sales, consulting, support, and technical services for our Services." names no shop. Copilot
# bought in GitHub Mobile is an in-app purchase (a way to pay, below).
# Free use: GitHub Free and Copilot Free are plans (price 0).
# Usage-billed extras are left out (the brief): AI credits beyond a plan's ("1 AI credit = $0.01 USD"), Actions and
# Codespaces beyond the included amounts, Git LFS packs and the like.

id: github
name: GitHub
aliases: [GitHub Copilot, Copilot]
website: https://github.com
category: developer
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Copilot's cancel article; GitHub Pro is cancelled by downgrading to Free ("Downgrading your account's plan",
# docs.github.com/en/billing/how-tos/manage-plan-and-licenses/downgrade-plan).
cancelUrl: https://docs.github.com/en/copilot/how-tos/manage-your-account/view-and-change-your-copilot-plan
sources: { pricing: https://github.com/features/copilot/plans }
# Ways to pay (M11.5), read 2026-11-13: a credit card or PayPal when upgrading on github.com, and an in-app purchase in
# GitHub Mobile for Copilot. No page names the card networks (its docs say "credit card" and "Bank card"); "Prepaid
# credit/debit cards are not accepted as a valid form of payment." (Supported payment methods for GitHub). An Azure
# subscription, invoices and ACH are for organizations and enterprises ("Azure Subscription ID – Not available for
# personal accounts").
paymentMethods:
  - methods: [card, paypal]
    page: "Upgrading your account's plan"
    url: https://docs.github.com/en/billing/how-tos/manage-plan-and-licenses/upgrade-plan
    quotes:
      - 'Under "Payment method", choose to pay with a credit card or PayPal.'
  - methods: [app-store]
    page: 'Plans & pricing (GitHub Copilot)'
    url: https://github.com/features/copilot/plans
    quotes:
      - 'Users who purchase Copilot Pro, Pro+, or Max through GitHub Mobile in-app purchase (IAP) can’t buy additional AI credits through GitHub Mobile.'
# Owner (M11.2), read 2026-11-13: Microsoft's blog on completing the purchase, and its Annual Report 2026, whose
# Intelligent Cloud segment includes "GitHub cloud services" ("GitHub provides a collaboration platform for developers to
# manage code and incorporate AI and agent-based tools across the software development lifecycle."). GitHub's terms are
# with "GitHub, Inc." and say "For the avoidance of doubt, Microsoft is an Affiliate of GitHub."
owner:
  name: 'GitHub, Inc., owned by Microsoft Corporation'
  website: https://www.microsoft.com
  page:
    name: 'Microsoft completes GitHub acquisition (Official Microsoft Blog)'
    url: https://blogs.microsoft.com/blog/2018/10/26/microsoft-completes-github-acquisition/
  quotes:
    - 'Microsoft has completed its acquisition of GitHub'
  country:
    code: US
    page:
      name: 'Privacy statement'
      url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
    quotes:
      - 'GitHub, Inc. 88 Colin P. Kelly Jr. St. San Francisco, CA 94107 United States'
    lastVerified: 2026-11-13
  stock:
    company: Microsoft Corporation
    listings:
      - { exchange: Nasdaq, symbol: MSFT }
    page:
      name: 'Microsoft Annual Report 2026'
      url: https://www.microsoft.com/investor/reports/ar26/index.html
    quotes:
      - 'Our common stock is traded on the NASDAQ Stock Market under the symbol MSFT.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13

# Renewal day (M11.5), read 2026-11-13 in "How GitHub billing works": the day you started paying, every month. Copilot's
# billing article says the same ("your billing cycle will start on the day you sign up for Copilot", "and then on the
# same days of subsequent months"). Copilot's included AI credits reset on the first of each month whatever the billing
# date ("This reset date is fixed and does not change based on your subscription billing date."), a usage detail.
renewalAnchor:
  kind: same-date
  page: How GitHub billing works
  url: https://docs.github.com/en/billing/get-started/how-billing-works
  quotes:
    - 'For personal and organization accounts set up for credit card and PayPal payments, the billing date is typically the day you started a paid plan (not necessarily when the account was created).'
    - 'For example, if you started a paid plan on the 15th of a month, you will be billed on the 15th of each subsequent month.'
  lastVerified: 2026-11-13

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their words.
# Read 2026-11-13 on Copilot's plans page ("$15 monthly total credits for Pro", "Access to premium models, including
# Opus", "Access to Copilot Fusion Standard, High, and Max", the table's "Audit logs" on Pro+ and Max) and in "GitHub's
# plans" (Free's and Pro's Codespaces hours and Packages storage, Pro's "Advanced tools and insights in private
# repositories"). Usage allowances are perks, never features (usage levels aren't comparable). Third-party agents:
# Pro's card and the docs' table include them on Pro ("Third-party Agents (public preview)", ticked on Pro, Pro+ and
# Max), the plans page's table only on Pro+ and Max ("Delegate tasks to third-party coding agents like Claude by
# Anthropic and OpenAI Codex (Preview)"): the card and the docs decide (notes.md).
perks:
  - id: cloud-agent-code-review
    name: Access to Copilot in the cloud and code review
  - id: unlimited-completions
    name: Unlimited code completion and next edit suggestions
  - id: third-party-agents
    name: Access to 3rd party agents (Claude Code and Codex)
  - id: credits-15
    name: $15 monthly total credits for Pro
  - id: premium-models
    name: Access to premium models, including Opus
  - id: usage-4x-pro
    name: 4x+ included usage than Pro
  - id: credits-70
    name: $70 monthly total credits for Pro+
  - id: fusion-high-max
    name: Access to Copilot Fusion Standard, High, and Max
  - id: audit-logs
    name: Audit logs
  - id: usage-2-9x-pro-plus
    name: 2.9x+ included usage than Pro+
  - id: credits-200
    name: $200 monthly total credits for Max
  - id: codespaces-120-core-hours
    name: 120 GitHub Codespaces core hours per month
  - id: codespaces-180-core-hours
    name: 180 GitHub Codespaces core hours per month
  - id: packages-500-mb
    name: 500 MB GitHub Packages storage
  - id: packages-2-gb
    name: 2 GB GitHub Packages storage
  - id: private-repo-tools
    name: Advanced tools and insights in private repositories

# Developer features (GitHub Free and Pro), read 2026-11-13:
# - CI minutes: Free's card on github.com/pricing, "2,000 CI/CD minutes/month" ("The basics for individuals and
#   organizations"). Its docs now give a sum of money instead: "$12 USD of included compute usage per month" for Free and
#   "$18 USD of included compute usage per month for eligible GitHub Actions and cloud sandbox usage" for Pro ("GitHub's
#   plans"), and "As a guide, $300 USD covers 50,000 minutes on a standard Linux runner at $0.006 USD per minute."
#   (GitHub Actions billing): $18 is 3,000 minutes, inferred, as Team's card says "3,000 CI/CD minutes/month" for the same
#   $18. "Minutes are free for public repositories."
# - Remote development: Codespaces on both ("120 GitHub Codespaces core hours per month", "180 GitHub Codespaces core hours
#   per month"), with the Visual Studio Code Marketplace's extensions ("Codespaces allows you to load extensions from the
#   Microsoft Visual Studio Marketplace", its additional product terms).
# - Hosting: GitHub Pages, "a static site hosting service" with "your own custom domain", "available in public
#   repositories with GitHub Free and GitHub Free for organizations, and in public and private repositories with GitHub
#   Pro"; its limits: "Published GitHub Pages sites may be no larger than 1 GB." and "GitHub Pages sites have a soft
#   bandwidth limit of 100 GB per month." (GitHub Pages limits). Pages makes both plans cloud plans too (hosting.type, the
#   cloud category's required feature): see notes.md.
# AI features (Copilot's plans), read 2026-11-13 on Copilot's plans page and in GitHub Docs, on every Copilot plan unless
# named:
# - Coding agent: "Agent mode use in VS Code, Visual Studio, JetBrains, Eclipse, and Xcode" and Copilot CLI's "Make and
#   commit code changes locally or on GitHub", included on all four; Copilot in the cloud ("Assign work to Copilot and it
#   creates a pull request") on the paid plans, a perk.
# - Code completion: "Inline suggestions are real-time code suggestions with included models in IDEs and Next edit
#   suggestions." ("Limited to 2000 completions per month on Copilot Free.").
# - Deep research: "The /research slash command invokes a specialized research agent. It investigates a topic and produces
#   a cited Markdown report. The agent can gather information from your local codebase, public and accessible private
#   repositories across your organization, and the web." ("GitHub Copilot CLI is available with all Copilot plans.").
# - Web search: "If you enable this setting, Copilot Chat will use Bing to search the internet for information related
#   to a question." ("Copilot Pro, Copilot Pro+, Copilot Max, and Copilot Free").
# - Projects: "Anyone with a Copilot license, including Copilot Free, can create and use Spaces." and the Copilot app's
#   projects ("The GitHub Copilot app is available for all Copilot plans.").
# - Scheduled tasks: the Copilot app's automations ("Automations let you save recurring agent tasks and run them on a
#   schedule or on demand.", on all plans with the app; "Local automations , which run from your local environment."),
#   and cloud automations on the paid plans ("Automations are available with the GitHub Copilot Pro, GitHub Copilot Pro+,
#   GitHub Copilot Max, GitHub Copilot Business, and GitHub Copilot Enterprise plans.").
# - Uses a computer for you: the Copilot app's computer use ("Copilot can interact with desktop applications on your
#   behalf by reading accessible application content and visual context, clicking controls, entering and editing text,
#   pressing keys, scrolling, dragging, and navigating workflows across applications."), "in public preview", for local
#   sessions on macOS and Windows.
# - Memory on the paid plans: Copilot Memory, "Available for all paid Copilot plans."
# - Reasoning and models from several companies on the paid plans: Pro's "Model selection" and the docs' "A selection of
#   models" (Anthropic's, OpenAI's, Google's, xAI's, Microsoft's and Moonshot AI's, its supported models table), and
#   "Configurable reasoning levels : Controls the depth of the model's reasoning process before it generates a response."
#   for the models picked. "On Copilot Free and Copilot Student plans, access to models is available through auto model
#   selection only.", so Free picks no model and sets no reasoning.
# - Early access on Max: "Priority access to new models and features".
# - Connects to: MCP servers ("Integrates with MCP servers"), code editors and the command line on all four, custom
#   agents ("Custom instructions and agents") on all four, and other apps through connectors on the paid plans ("you can
#   access third-party services through GitHub connectors. Connectors are available to all your Copilot in the cloud
#   sessions.", Copilot in the cloud "is available to users with a paid Copilot plan").
# - Chats kept on its servers: "Chat data retention Data is retained for 28 days. Data is retained for the life of the
#   account." (GitHub Actions-based and cloud sandbox sessions).
# - None of these pages offers a voice conversation (Copilot CLI's voice input dictates a prompt: "Voice input lets you
#   dictate prompts to Copilot CLI by speaking into your microphone instead of typing on the keyboard."), image, video,
#   music or voice generation, office apps, or API credits (its AI credits pay for Copilot's own use).
# General features, read 2026-11-13: GitHub Mobile "is available as an Android and iOS app", GitHub Desktop for "macOS
# 12.0 or later" and "Windows 10 64-bit or later", the Copilot app for "macOS Linux Windows", and github.com. Sign-in
# ("About authentication to GitHub", "About two-factor authentication"): a password or "Google or Apple - which are the
# supported social login providers", passkeys, a TOTP app or a text message, security keys and GitHub Mobile. App
# languages: "GitHub Mobile is available in the following languages." English, Spanish, Japanese, Brazilian Portuguese,
# Simplified Chinese, Korean and German, the only list of app languages its pages give. Support: "If your account uses GitHub
# Free, you can speak to GitHub users and staff on the GitHub Community discussions for most issues, and you can contact
# GitHub Support to report account, security, and abuse issues.", and "We do not offer telephone support." No pause
# (cancelling and downgrading only); no parental controls: "You must be age 13 or older."
features:
  platforms: [windows, macos, linux, android, ios, web]
  account.sign-in: [password, passkey, totp, security-key, sms, push-approval, sso]
  support.channels: [email, community]
  languages.interface: [en, es, de, pt, ja, ko, zh]

