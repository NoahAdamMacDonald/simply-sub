# same article: cards and PayPal everywhere, Apple Pay in the US, the UK, Australia and New Zealand, Cash App in the
# US, Klarna in Germany, Satispay in Italy, and third-party billing partners in Canada and the US (the others'
# "third-party partner" names none).
