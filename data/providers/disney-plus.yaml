# Coverage: disney-plus.standard-ads and disney-plus.standard in US, and disney-plus.with-ads in CA, GB, AU, NZ, IE, DE,
# FR, NL, ES and IT (read 2026-11-03): each country sells its own plans. Canada's plans and prices article lists "Disney+ Standard With Ads", "Disney+
# Standard" and "Disney+ Premium"; the US's lists two plans of Disney+ alone, "Disney+ (With Ads)" (4K, unlike Canada's
# 1080p) and "Disney+ Premium", beside its bundles. The US's is help.disneyplus.com/article/disneyplus-price with the
# help centre's country set to United States on its home page (set on the article, it goes to a page not found).

# Other countries (M11.9, the owner's choice of 2026-11-03), read 2026-11-03 on the same article with the help centre's
# country set to each on its home page ("United Kingdom (English)", "Australia (English)", "New Zealand (English)",
# "Ireland (English)", then Germany, France, the Netherlands, Spain and Italy, each "(English)"): each sells Canada's
# three plans, with the same features, in its own currency (Australia's and New Zealand's "$" their own dollars), and
# its Extra Members; Australia and New Zealand have one Extra Member price, "Not available with a Disney+ Standard with
# Ads plan". The article is help.disneyplus.com/en-GB/article/disneyplus-price for every one of them, whichever country
# is picked, so the nightly check can't tell them apart: a price it doesn't find there goes to a person.

# Renewal day (M11.5), read 2026-11-03 (M11.9) in its Canadian subscriber agreement: the date you became a paying
# subscriber, or a shorter month's last day. Its help centre's billing articles only point to the Account page.
renewalAnchor:
  kind: same-date
  page: Subscriber agreement
  url: https://www.disneyplus.com/en-ca/welcome/subscriber-agreement-side-by-side
  quotes:
    - 'if your subscription began on a day not contained in a given month (e.g., if you have a monthly payment plan and became a paying subscriber on January 31, your payment method would be billed next on February 28)'
  lastVerified: 2026-11-03

# Free use (2026-11-09, the owner's item: services used free, with ads or limits): none: its plans articles list paid
# plans only.
freeUse:
  kind: none
  pages: [https://help.disneyplus.com/article/disneyplus-en-ca-price]
  lastVerified: 2026-11-09

# General features, read 2026-11-11: app languages from its help on the app's display language and its site's language
# versions (disneyplus.com/fr-ca: "CONNEXION"; no Hindi). Pause: "If you have a monthly subscription billed by
# Disney+, you can pause it", and "If you have an Extra Member on your subscription, that profile will be paused as
# well" (How to cancel Disney+). Parental controls: "Content ratings / Junior Mode / Profile PIN / Profile creation
# restriction" (Parental controls); an Extra Member has their own login, so the account holder can't restrict it.
# Apps, sign-in and support (M11.9, the cross-category features), read 2026-11-03 in its Canadian help centre: web browsers,
# iPhone and iPad, Android, Windows 10 and 11, TVs and streaming devices, PlayStation and Xbox (Supported devices); a
# MyDisney email address and password (MyDisney login details); "live support from 24 hours a day seven days a week",
# by chat.
features:
  platforms: [windows, android, ios, web, tv, console]
  account.sign-in: [password]
  support.channels: [chat, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, ar]

# Official resellers: none (M11.9, read 2026-11-03). Its third-party billing partners ("Docomo, J:COM, Apple, Google,
# Amazon, Hulu (Hulu | Disney+ Set Plan), or any other platform") are ways to pay (paymentMethods).
# Profiles (M11.15), read 2026-11-04 in its help centre: "Disney+ allows you to create six additional profiles (seven in
# total) per subscription" (disneyplus-profiles). An Extra Member gets "A unique profile with their own login and
# password" (disneyplus-extra-member); its add-on gives its plan's features, so its card shows the plan's 7.
