id: disney-plus
name: Disney+
aliases: [disney plus, disneyplus]
website: https://www.disneyplus.com
category: streaming
spendCategory: streaming
acceptedNetworks: [visa, mastercard, amex, jcb]
billingCurrency: { CA: CAD, US: USD }
# The help centre's one cancel article: the same steps in Canada and the US (Account > Subscription > Cancel
# Subscription), read 2026-10-26 with the help centre set to each country.
cancelUrl: https://help.disneyplus.com/article/disneyplus-cancel
sources: { pricing: https://help.disneyplus.com/article/disneyplus-en-ca-price }

# Canada sells Standard With Ads, Standard and Premium. The US sells With Ads (4K, unlike Canada's 1080p) and
# Premium, so a plan sold in one country only has prices there. The US prices are on
# help.disneyplus.com/article/disneyplus-price with the help centre's country set to United States.
plans:
  - id: disney-plus.standard-ads
    name: Standard With Ads
    link: https://www.disneyplus.com/en-ca
    features:
      video.quality: 1080p
      streaming.ad-free: false
      streaming.concurrent-streams: 2
      streaming.kids-profiles: true
      streaming.french-content: true
    prices:
      - region: CA
        currency: CAD
        amount: 8.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-en-ca-price
    addOnIds: [disney-plus.extra-member-ads]
    addOnLimit: 1

  - id: disney-plus.with-ads
    name: With Ads
    link: https://www.disneyplus.com
    features:
      video.quality: 4k
      video.hdr: true
      streaming.ad-free: false
      streaming.concurrent-streams: 4
      streaming.kids-profiles: true
    prices:
      - region: US
        currency: USD
        amount: 12.49
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-price
    addOnIds: [disney-plus.extra-member-with-ads]
    addOnLimit: 1

  - id: disney-plus.standard
    name: Standard
    link: https://www.disneyplus.com/en-ca
    features:
      video.quality: 1080p
      streaming.ad-free: true
      streaming.concurrent-streams: 2
      streaming.download-devices: 10
      streaming.kids-profiles: true
      streaming.french-content: true
    prices:
      - region: CA
        currency: CAD
        amount: 15.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-en-ca-price
      - region: CA
        currency: CAD
        amount: 159.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-en-ca-price
    addOnIds: [disney-plus.extra-member-standard]
    addOnLimit: 1

  - id: disney-plus.premium
    name: Premium
    link: https://www.disneyplus.com
    features:
      video.quality: 4k
      video.hdr: true
      audio.dolby-atmos: true
      streaming.ad-free: true
      streaming.concurrent-streams: 4
      streaming.download-devices: 10
      streaming.kids-profiles: true
      streaming.french-content: true
    prices:
      - region: CA
        currency: CAD
        amount: 16.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-en-ca-price
      - region: CA
        currency: CAD
        amount: 169.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-en-ca-price
      - region: US
        currency: USD
        amount: 21.49
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-price
      - region: US
        currency: USD
        amount: 214.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-price
    addOnIds: [disney-plus.extra-member-premium]
    addOnLimit: 1

# One Extra Member per subscription, priced by the account holder's plan. They watch on one device at a time.
addOns:
  - id: disney-plus.extra-member-ads
    name: Extra Member (Standard With Ads)
    grantsPlan: disney-plus.standard-ads
    prices:
      - region: CA
        currency: CAD
        amount: 6.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-en-ca-price
  - id: disney-plus.extra-member-with-ads
    name: Extra Member (With Ads)
    grantsPlan: disney-plus.with-ads
    prices:
      - region: US
        currency: USD
        amount: 6.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-price
  - id: disney-plus.extra-member-standard
    name: Extra Member (Standard)
    grantsPlan: disney-plus.standard
    prices:
      - region: CA
        currency: CAD
        amount: 7.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-en-ca-price
  - id: disney-plus.extra-member-premium
    name: Extra Member (Premium)
    grantsPlan: disney-plus.premium
    prices:
      - region: CA
        currency: CAD
        amount: 7.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-en-ca-price
      - region: US
        currency: USD
        amount: 9.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-23
        sourceUrl: https://help.disneyplus.com/article/disneyplus-price

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: The Walt Disney Company's privacy policy, which
# covers Disney+. Not rated: the billing and legal topics, since its subscriber agreement (disneyplus.com/en-ca/legal)
# doesn't render here, and account sharing and device limits.
policies:
  links:
    - name: 'Privacy policy'
      url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
  ratings:
    - topic: privacy.data-collection
      tier: leaning-bad
      reason: 'Tracks you with cookies, pixels and SDKs by default; only ads and cookies can be turned off.'
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'We collect information through a variety of technologies, such as cookies, Flash cookies, pixels, tags, software development kits'
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Click on “Do Not Sell or Share My Personal Information”, “Your Privacy Controls”, “Manage Your Cookies Settings”, “Modify Your Cookie Preferences” or “Manage (Privacy) Preferences” in our website footers'
      lastVerified: 2026-10-27
    - topic: privacy.data-sharing
      tier: neutral
      reason: 'Shares identifiers with ad companies, unless you opt out in its privacy controls.'
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'When we provide you with relevant advertising on third-party sites and applications, we may share limited personal information about you, such as certain identifiers or hashed email address, with third parties.'
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Click on “Do Not Sell or Share My Personal Information”, “Your Privacy Controls”, “Manage Your Cookies Settings”, “Modify Your Cookie Preferences” or “Manage (Privacy) Preferences” in our website footers'
      lastVerified: 2026-10-27
    - topic: privacy.ads-tracking
      tier: neutral
      reason: 'Targets ads from what you do on its sites and others, unless you opt out.'
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Provide you with targeted advertising based on your activity on our sites and applications and on third-party sites and applications;'
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Click on “Do Not Sell or Share My Personal Information”, “Your Privacy Controls”, “Manage Your Cookies Settings”, “Modify Your Cookie Preferences” or “Manage (Privacy) Preferences” in our website footers'
      lastVerified: 2026-10-27
    - topic: privacy.data-deletion
      tier: neutral
      reason: "You can delete your account; how long it keeps your data afterwards isn't stated."
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'Updating or correcting the contact information you gave us, resetting your password, or deleting your registration account'
      lastVerified: 2026-10-27
