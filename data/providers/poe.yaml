# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge: the Poe Terms of Service
# (updated Nov 16, 2026), which include the Poe Privacy Policy, the Poe and Joiner Acceptable Use Policy (the conduct it
# forbids: no topic worse than the terms') and, for purchases, the Terms of Sale; the Privacy center; its help centre's
# FAQs; and Quora's help centre's privacy, deletion, export and refund articles (Quora's Subscriptions Refund Policy,
# which the Terms of Sale name). The sign-in page's line: "By continuing, you are agreeing to Poe's Terms of Service and
# Privacy Policy." Not read: the Quora Platform Terms of Service and the Quora Privacy Policy (quora.com/about/tos and
# /about/privacy, which both include): quora.com shows Edge, the Mullvad Browser and a US exit Cloudflare's security check,
# and the Internet Archive refused this machine. The Earnings terms are for bot creators paid by
# Poe (no topic for subscribers). Each bot's maker's policies (OpenAI's, Anthropic's, Google's) apply to its bots; not
# rated here.
policies:
  links:
    - name: Terms of service
      url: https://poe.com/pages/tos
    - name: Terms of sale
      url: https://poe.com/pages/terms-of-sale
    - name: Privacy policy
      url: https://poe.com/pages/privacy
    - name: Privacy center
      url: https://poe.com/pages/privacy-center
    - name: Poe FAQs
      url: https://help.poe.com/hc/en-us/articles/19944206309524-Poe-FAQs
    - name: Purchases FAQs
      url: https://help.poe.com/hc/en-us/articles/19945140063636-Poe-Purchases-FAQs
    - name: Quora's refund policy
      url: https://help.quora.com/hc/en-us/articles/4404208557588-Subscriptions-Refund-Policy
    - name: Quora's opt-out choices
      url: https://help.quora.com/hc/en-us/articles/360000839683-What-opt-out-choices-do-I-have
    - name: Quora on selling data
      url: https://help.quora.com/hc/en-us/articles/360000845146--Does-Quora-ever-sell-my-personal-data-to-third-parties-for-marketing
    - name: Quora's data copies
      url: https://help.quora.com/hc/en-us/articles/360000839503-Can-I-get-a-copy-of-my-data
    - name: Quora's government requests
      url: https://help.quora.com/hc/en-us/articles/360034733912-Will-Quora-notify-users-about-requests-for-user-data-from-governmental-entities-including-law-enforcement
  ratings:
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel in your settings at any time, but must do it by the day before it renews, or you pay for the next period. You keep your plan until the period ends.'
      sources:
        - url: https://poe.com/pages/terms-of-sale
          quote: 'You may cancel a Subscription, including Free Trials, through your account settings at any time.'
        - url: https://poe.com/pages/terms-of-sale
          quote: 'YOU MUST CANCEL YOUR SUBSCRIPTION ON THE DAY BEFORE YOUR NEXT RECURRING BILLING DATE TO AVOID BEING CHARGED FOR THE NEXT BILLING PERIOD.'
        - url: https://poe.com/pages/terms-of-sale
          quote: 'If you cancel, you will still have access to your Subscription through the end of the current billing period, unless you subscribed through a free trial or promotion.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'Payments are not refunded, except when Quora charged you by mistake or a technical fault of its own stopped you using it, and only within 30 days. You keep your plan to the end of the period.'
      sources:
        - url: https://poe.com/pages/terms-of-sale
          quote: 'All Subscription fees, amounts paid for Purchases, or other final charges are non-refundable, other than as set forth in our Refund Policy or as determined by Quora.'
        - url: https://help.quora.com/hc/en-us/articles/4404208557588-Subscriptions-Refund-Policy
          quote: 'If you have an issue with your subscription on Quora because of technical issues, payment errors, or a Space owner has deleted or disabled their account or Space, we will refund your subscription payment, subject to the following guidelines.'
        - url: https://help.quora.com/hc/en-us/articles/4404208557588-Subscriptions-Refund-Policy
          quote: 'We cannot grant you a refund for any charges that are more than 30 days old.'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you before a new price applies at your next renewal, without saying how long before, and you can cancel first.'
      sources:
        - url: https://poe.com/pages/terms-of-sale
          quote: 'We will give you advance notice of any price change prior to the next billing date, but we will not be able to notify you of any changes in applicable taxes or fees.'
        - url: https://poe.com/pages/terms-of-sale
          quote: 'If you do not wish to accept a price change, you may cancel your subscription in accordance with the instructions below.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      tier: neutral
      reason: 'When it offers a free trial, the trial turns into a paid plan unless you cancel before it ends, which you can do at any time.'
      sources:
        - url: https://poe.com/pages/terms-of-sale
          quote: 'Unless you cancel your Subscription prior to its end, we will begin charging your payment method after the Free Trial for the applicable monthly or annual recurring Subscription fees selected by you as described in Section 2.1 above.'
        - url: https://poe.com/pages/terms-of-sale
          quote: 'You can cancel your Free Trial or Subscription at any time as described in Section 2.4 below.'
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its Terms of Sale say your plan renews on its own at the then-current price, but not that it reminds you first.'
      pages:
        - https://poe.com/pages/terms-of-sale
        - https://help.poe.com/hc/en-us/articles/19945140063636-Poe-Purchases-FAQs
      lastVerified: 2026-11-17
    - topic: billing.fees
      status: not-stated
      reason: 'Its Terms of Sale list no fees beyond the price and taxes; they only warn that your bank may charge its own currency fees.'
      pages:
        - https://poe.com/pages/terms-of-sale
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its help centre explains how to upgrade, but not whether what you already paid counts toward the new plan or when a downgrade starts.'
      pages:
        - https://help.poe.com/hc/en-us/articles/19945140063636-Poe-Purchases-FAQs
        - https://poe.com/pages/terms-of-sale
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: good
      reason: 'Outside the US and Canada, disputes go to courts in Santa Clara County, California, which it chose. In Europe, the UK and Switzerland you keep your own courts.'
      sources:
        - url: https://poe.com/pages/tos
          quote: 'If you are not a user in the European Economic Area, the United Kingdom, or Switzerland, to the extent the arbitration provisions do not apply or you have validly opted out, any litigation between you and Quora must be filed exclusively in state or federal courts located in Santa Clara County, California, except eligible small claims actions may be brought in the county where you reside.'
        - url: https://poe.com/pages/tos
          quote: 'If you are a user in the European Economic Area, the United Kingdom, or Switzerland, this Section does not deprive you of rights or protections under the law of your country of residence or access to courts in that country.'
      lastVerified: 2026-11-17
    - topic: legal.disputes
      regions: [US, CA]
      tier: poor
      reason: "In the US and Canada, disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only by emailing within 30 days of signing up."
      sources:
        - url: https://poe.com/pages/tos
          quote: 'IF YOU ARE IN THE UNITED STATES OR CANADA, YOU AGREE THAT DISPUTES BETWEEN YOU AND QUORA WILL BE RESOLVED BY BINDING, INDIVIDUAL ARBITRATION AND YOU WAIVE YOUR RIGHT TO PARTICIPATE IN A CLASS ACTION LAWSUIT OR CLASS-WIDE ARBITRATION.'
        - url: https://poe.com/pages/tos
          quote: 'You may opt out of Sections 9.2 through 9.6 by sending written notice to arbitration.optout@quora.com within thirty (30) days after first registering to use Poe.'
      action:
