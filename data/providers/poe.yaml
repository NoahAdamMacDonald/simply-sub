# Its help centre's cancelling answer (Poe Purchases FAQs, "How do I cancel my subscription?"), for the web, iOS and
# Android.
cancelUrl: https://help.poe.com/hc/en-us/articles/19945140063636-Poe-Purchases-FAQs
sources: { pricing: https://poe.com/subscription_plans }

# Ways to pay (M11.5), read 2026-11-17 in its Terms of Sale: a debit or credit card (Stripe, on the web: "you will be
# redirected to our 3rd party payment processor, Stripe", Poe Purchases FAQs), Apple's and Google's billing in its apps,
# and PayPal. No page names the card networks, so no acceptedNetworks ("Accepted payment methods may vary based on your
# location.").
paymentMethods:
  - methods: [card]
    page: 'Terms of Sale'
    url: https://poe.com/pages/terms-of-sale
    quotes:
      - 'In order to make a Purchase or Subscribe, you must provide account information for at least one valid debit or credit card or other payment method through or to the Quora Platform or its payment service providers.'
  - methods: [app-store, paypal]
    page: 'Terms of Sale'
    url: https://poe.com/pages/terms-of-sale
    quotes:
      - 'Subscriptions and other purchases through a third party (e.g., Google Play, iOS or PayPal) are managed directly by the applicable third party.'

# Owner (M11.2), read 2026-11-17: its terms name the company that provides Poe, with its California address. Quora is
# private: no page names a listing.
owner:
  name: 'Quora, Inc.'
  page:
    name: Terms of service
    url: https://poe.com/pages/tos
  quotes:
    - 'Poe is provided by Quora, Inc., located at 444 Castro Street, Suite 1210, Mountain View, California 94041.'
  country:
    code: US
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17 in its Terms of Sale: billed on the date you signed up, a shorter month's last day
# when it has no such date.
renewalAnchor:
  kind: same-date
  page: Terms of Sale
  url: https://poe.com/pages/terms-of-sale
  quotes:
    - 'You acknowledge that billing for a particular Subscription may not occur on the same date of each month if your subscription began on a date not contained in a given month (for example, if you sign up for a monthly subscription on August 31st, you will be billed next on September 30th, etc.) or due to Free Trials, Promotions, or changes to your payment method.'
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on its plans page: what every paid plan adds ("All Poe subscription plans allow you
# to:" "Send and receive far more messages", "Unlock each bot's maximum input size and chat history"), and each card's
# points, the one thing that differs between them (usage levels: perks, never features).
perks:
  - id: more-messages
    name: Send and receive far more messages
  - id: max-input
    name: Unlock each bot's maximum input size and chat history
  - id: points-10k-daily
    name: 10 thousand points/day
  - id: points-660k
    name: 660 thousand points/month
  - id: points-1-65m
    name: 1.65 million points/month
  - id: points-3-3m
    name: 3.3 million points/month
  - id: points-8-25m
    name: 8.25 million points/month

# AI features (the AI category's registry), read 2026-11-17 in its help centre, its plans page and its Explore page
# (poe.com/explore, each category's official bots):
# - Models from several companies, on every plan: "State-of-the-art general purpose bots from OpenAI, Anthropic's Claude,
#   Google's Gemini, Meta's Llama , and many more bots from leading AI organizations." and "Each user has a pool of points
#   that flexibly work with every bot on Poe." (Poe FAQs); "Non-paying users receive points daily, which reset at the
#   end of each 24-hour period." Subscribers "also gain access to the most cutting-edge bots on Poe".
# - Web search and image generation on every plan: its default Assistant can "ask for real-time information, create
#   images, and more", for subscribers and non-subscribers alike ("For non-subscribers: - General queries: @GPT-6-Luna -
#   Image generation: @Nano-Banana-2"), and the Search category's official bots (Perplexity-Sonar, Exa-Search).
# - Memory on every plan: "Memory helps bots get to know you over time" and "It's off by default. You can turn it on in
#   **Settings → Memory**" (Poe FAQs), with no plan named.
# - Custom assistants on every plan: "Prompt bots allow you to create a chatbot on top of GPT-3.5-Turbo or Claude-instant
#   by providing plain-text instructions that the bot will stick to during conversation with users." (Poe FAQs).
# - On the paid plans, what the free plan's pages don't give it: video and audio ("Generate more images, video, and
#   audio with state-of-the-art bots from Runway, Google DeepMind, Luma AI, Pika, Hailuo AI, ElevenLabs, Ideogram, Black
#   Forest Labs, Cartesia, and more.", Poe Purchases FAQs; "Audio and music generating models", Poe FAQs; the Audio
#   category's ElevenLabs-Music-v2 and Lyria 3), reasoning ("Enjoy exclusive access to bots like o3-mini-high"; the
#   Official bots' "adjustable reasoning effort" and "Adaptive thinking is always on"), deep research (the Search
#   category's official "GPT Researcher is an agent that conducts deep research on any topic and generates a
#   comprehensive report with citations.") and the API ("To call paid models (models with a points cost greater than
#   0) via the API, the API key owner must have an active Poe subscription or add-on points. Free users do not have
#   access to paid models through the API.", its developer guide; "Compute points are deducted directly from the
#   account associated with the API key."): its points pay for API use, as monthly API credits do (notes.md). No page
#   says which of these bots the free plan's daily points reach, so the free plan lists none of them.
# - Chats kept on its servers: "Your chats and personal data associated with your account are deleted from Poe’s
#   systems" when you delete them (Privacy center); "Temporary chat messages are permanently deleted within 24 hours of
#   creation." (Poe FAQs).
# - None of its pages offers a voice mode (its gpt-audio bots answer audio files in speech: notes.md), projects, a coding
#   agent, code completion in an editor, a browser agent, scheduled tasks, early access or office apps.
# General features, read 2026-11-17: apps for "iOS", "Android", "MacOS" and "Windows" (Get Poe) and the web. Sign-in:
# "Continue with Google", "Continue with Apple", an email address or "Use phone" (its sign-in page; "You can log into
# your Poe account using third party applications (e.g., Google and Apple).", its privacy policy); no page says how the
# email or phone sign-in works, so only `sso`. App languages: "Poe's user interface is currently available in English,
# Japanese, Chinese - Simplified, Chinese - Traditional, Korean, Spanish, Portuguese, French, Italian and German." (Poe
# FAQs). Support: its help centre's request form ("you may contact us here"). No pause and no parental controls: its
# terms, Terms of Sale and help centre offer neither (a minor's "parent or legal guardian must consent to these Terms").
features:
  platforms: [windows, macos, android, ios, web]
  account.sign-in: [sso]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh]
  support.channels: [email]

