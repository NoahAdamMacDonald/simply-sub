# Researched by hand on 2026-11-17 (the full catalog run, AI batch 1), read with Edge from Canada (poe.com's plans,
# Explore, legal and download pages, the sign-in page) and through country exits (the plans page), with a plain fetch
# for its help centre and Quora's (their Zendesk API: help.poe.com's HTML answers a plain fetch with Cloudflare's
# challenge) and for Apple's App Store pages. Pages, each quoted where it's used:
# Pricing: poe.com/subscription_plans, "Subscription plans", which reads signed out: five cards named by their points
# ("10 thousand points/day", "660 thousand points/month", "1.65 million points/month", "3.3 million points/month", "8.25
# million points/month"), "Billed yearly" ("SAVE 17%") and "Billed monthly", and "By subscribing, you are enrolling in
# automatic payments (plus tax, where applicable)." The page prices by where the visitor is, whatever its footer says
# ("Prices shown in US dollars. Your final price may vary based on regional taxes and currency conversion."), so each
# region was read 2026-11-17 through that country's exit and kept only in its own currency: the US "$4.99/month" (its
# bare $ is US dollars: the same page writes "CA$", "A$" and "NZ$" for the others), Canada "CA$6.24/month", the UK
# "£4.99/month", Ireland, Germany, France, the Netherlands, Spain and Italy "€5.74/month", Australia "A$7.49/month" and
# New Zealand "NZ$9.99/month", and each card's yearly price ("CA$62.49/year"). Some exits were placed in another
# country (a German one got Brazilian reals, an Australian one and this machine the US's "$4.99/month"): those reads
# weren't used. No page says a price includes tax ("plus tax, where applicable").
# Region checklist for CA, 2026-11-17: 1. no country paths or hreflang on the plans page; 2. no country or currency
# picker; 3. the page's own data (`monthlyCost`, `yearlyCost`) holds the same strings as its text, with no country; 4.
# the checkout (Stripe) needs an account: "Get started" asks you to sign in; 5. its help centre has no prices article;
# 6. Edge from this machine got the US's "$4.99/month", a Canadian exit "CA$6.24/month": Canada's prices are the exit's;
# 7. no bill offered.
# Its apps sell two of these plans through Apple ("Poe Monthly Subscription - Basic $6.99", "Poe Monthly Subscription -
# Plus $24.99", "Poe Annual Subscription - Basic $69.99", "Poe Annual Subscription - Plus $249.99" on the Canadian App
# Store page): app store prices, a way to pay, not listed (notes.md). "The most diverse subscription options are on
# Poe’s website." (Poe Purchases FAQs).
# Not listed: add-on points ("Add-on points are usable for one year, and are not refundable, transferable, or redeemable
# for cash."), bought by subscribers as they go ("starting at $30 per 1M points"): usage-billed, out, as the API's.
# Bundles: none on its pages. Official resellers: none; no page names a shop that sells it.

# Coverage: poe.* in AL, AM, AT, BS, BH, BB, BY, BE, BA, BR, BG, KH, CM, CL, CO, HR, CY, CZ, DK, EG, EE, FI, GE, GH,
# GR, HK, HU, IS, IN, JP, KZ, KR, KG, LV, LT, LU, MO, MY, MT, MX, MD, NG, NO, OM, PL, PT, PR, RO, SA, RS, SG, SK, SI,
# ZA, SE, CH, TW, TJ, TH, TR, UG, UA, AE, UZ, VN and ZW: sold there (its help centre's country list), but outside the
# catalog's research regions, so not read.

