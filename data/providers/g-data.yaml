# Terms and policies (BLUEPRINT §4.10), read 2026-11-20 with a plain fetch and Edge: its shop's Terms and Conditions
# (English, March 2026; the German AGB of April 2026 says the same for Germany and Austria, and adds Switzerland's), its
# cancellation (withdrawal) policy and payment page, its licence (Software Licensing Agreement, 2019; the North American
# site's is the same, governed by North Carolina's law instead of Germany's), its website privacy policy and its
# product privacy policies (Windows, Mac, mobile apps, VPN), the North American site's privacy policy, FastSpring's Terms
# of Sale (the North American checkout's seller), its trust centre, vulnerability reporting page and disclosure policy,
# and its help centre's contract, cancellation, deletion and end-of-life articles. Read for no topic beyond the same
# grades: the German AGB (the same clauses), the North American licence (the same text under North Carolina's law), and
# its cancellation (withdrawal) policy: a 14-day withdrawal that ends once you agree to start the download. Not read:
# the checkout's own confirmation screens past the payment form, and Google Play's terms for in-app purchases.
policies:
  links:
    - name: Terms and conditions
      url: https://secure.gd/shop-terms-conditions-en
    - name: Licence (EULA)
      url: https://www.gdata.de/en/eula
    - name: Privacy policy (website)
      url: https://www.gdata.de/en/privacy
    - name: Privacy policy (Windows products)
      url: https://www.gdata.de/en/privacy/windows
    - name: Privacy policy (Antivirus Mac)
      url: https://www.gdata.de/en/privacy/mac
    - name: Privacy policy (mobile apps)
      url: https://www.gdata.de/en/privacy/mobile
    - name: Privacy policy (VPN)
      url: https://www.gdata.de/en/privacy/vpn
    - name: Privacy policy (North America)
