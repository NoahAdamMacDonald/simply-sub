    - name: Free trials
      url: https://www.gdata.de/en/consumer/free-antivirus-trial-version
    - name: Antivirus for Windows
      url: https://www.gdata.de/en/consumer/antivirus-windows
    - name: VPN
      url: https://www.gdata.de/en/consumer/vpn
    - name: Internet Security (North America)
      url: https://www.gdata-software.com/internet-security
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Its apps send statistics about the malware they find, and its Android app how you use it; you can turn both off in the app. Its mobile and VPN apps also send crash reports, with no setting to stop them.'
      sources:
        - url: https://www.gdata.de/en/privacy/windows
          quote: 'You may object to the statistical analysis of your data by adjusting the relevant settings in the G DATA antivirus software.'
        - url: https://www.gdata.de/en/privacy/mobile
          quote: 'If you do not wish your app usage to be analyzed, you can deactivate the option at any time in G DATA Mobile Security for Android under the menu item "Information" with effect for the future or object here.'
        - url: https://www.gdata.de/en/privacy/vpn
          quote: 'The app sends crash and error reports to analyze app crashes and improve the stability of our app.'
      action:
        name: 'How to object, in its privacy policy'
        url: https://www.gdata.de/en/privacy/windows
      lastVerified: 2026-11-20
    - topic: privacy.data-collection
      plans: [g-data.antivirus, g-data.antivirus-mac]
      tier: neutral
      reason: 'Its Windows and Mac apps send statistics about the malware they find, to improve detection. You can turn that off in the app’s settings.'
      sources:
        - url: https://www.gdata.de/en/privacy/windows
          quote: 'You may object to the statistical analysis of your data by adjusting the relevant settings in the G DATA antivirus software.'
        - url: https://www.gdata.de/en/privacy/mac
          quote: 'you can use the corresponding opt-out option in the settings of the G DATA antivirus software.'
      action:
        name: 'How to turn it off, in its privacy policy'
        url: https://www.gdata.de/en/privacy/windows
      lastVerified: 2026-11-20
    - topic: privacy.data-sharing
      tier: good
      reason: 'Its apps don’t pass your data to other companies, except when the law requires it. Its European websites let advertising partners track you only if you agree.'
      sources:
        - url: https://www.gdata.de/en/privacy/windows
          quote: 'In principle, no personal data is transferred to external recipients for the provision of G DATA antivirus software.'
        - url: https://www.gdata.de/en/privacy
          quote: 'The basis for data processing is your consent, provided you have given it (pursuant to Art. 6 para. 1 lit. a) GDPR).'
      lastVerified: 2026-11-20
    - topic: privacy.data-sharing
      regions: [CA, US]
      tier: poor
      reason: 'Its North American website sends your visit to Google and other ad companies by default. To stop it, you must opt out on each device and browser.'
      sources:
        - url: https://www.gdata-software.com/privacy
          quote: 'Our website uses a pixel, which establishes a direct connection to the Google servers.'
        - url: https://www.gdata-software.com/privacy
          quote: 'If you use our website with multiple devices you must opt-out from the use of retargeting and tracking tools for each device separately, as we cannot assign multiple devices to individual visitors.'
      action:
        name: 'Opt out of remarketing and tracking'
        url: https://www.gdata-software.com/privacy
      lastVerified: 2026-11-20
    - topic: privacy.ads-tracking
      tier: good
      reason: 'Its apps show no ads. Its European websites follow you with ads elsewhere only if you agree in the cookie banner.'
      sources:
        - url: https://www.gdata.de/en/privacy
          quote: 'Retargeting is a tracking process in which visitors to our website are marked and then targeted again on other websites with targeted advertising.'
        - url: https://www.gdata.de/en/privacy
          quote: 'The basis for data processing is your consent, provided you have given it (pursuant to Art. 6 para. 1 lit. a) GDPR).'
      lastVerified: 2026-11-20
    - topic: privacy.ads-tracking
      regions: [CA, US]
      tier: poor
