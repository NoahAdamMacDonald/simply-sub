# General features, read 2026-11-20. Sign-in: My G DATA's username and password ("change the password used for your My G
# DATA account", its account settings help); no page names two-factor sign-in. Support: "Whether chat or contact form -
# your G DATA customer service is already looking forward to your inquiry!" (its contact help), "by phone or email" (who
# we are) and "Support: 24 hours a day, 7 days a week, 365 days a year" (every product page). App languages: My G DATA's
# "You can choose between German, English, French, Italian, and Dutch." (Dutch isn't a registry value yet), and its
# Spanish and Portuguese sites (gdata.es, gdata.pt) and help centres. No pause (a subscription runs on until cancelled).
features:
  account.sign-in: [password]
  support.channels: [chat, email, phone, 24-7]
  languages.interface: [de, en, fr, it, es, pt]

