  - id: usb-keyboard-guard
    name: Protection against tampered USB devices
  - id: device-control
    name: Access control for USB devices
  - id: encryption
    name: Encrypt local data
  - id: backup
    name: Backups
  - id: browser-cleaner
    name: Browser cleaner
  - id: app-control
    name: App Control
  - id: sim-protection
    name: SIM card protection

# Features (read 2026-11-20): each plan page's key features, the international shop's "Compare our security software"
# table, and the help centre.
# - Windows (Antivirus, Internet Security, Total Security): the help's "Virus protection" interface page, which covers
#   all three ("the G DATA idle scan and the G DATA virus guard, which is constantly active in the background",
#   "Scheduled virus checks", "Boot medium", "Behavioural Monitoring"); "Our technologies, DeepRay® and BEAST, use
#   artificial intelligence and behavioral analysis to detect disguised and previously unknown malware." The table:
#   every plan has "Browser protection against phishing", "Secure online banking and shopping" (BankGuard) and "Email
#   protection"; Internet Security and Total Security add "Protection against critical security vulnerabilities",
#   "Protection against ransomware", "Protection against tampered USB devices" and "Strong firewall"; Total Security
#   adds "Performance-Tuner", "Encrypt local data" and "Access control for USB devices". Internet Security's page adds
#   Anti-Spam and Parental Controls ("Set time limits and let your children browse only on verified websites"), and both
#   help indexes list the Shredder. The free-trial page's "with exploit protection" for Antivirus disagrees with the table,
#   which decides (notes.md). Total Security's Backups ("locally on your PC or in the Cloud") are a perk; the help's end
#   of life list stopped Cloud Backup in 12.2022, which the plan page doesn't reflect.
