# Researched by hand on 2026-11-20 (M11.15, security batch 2), read from Canada with Edge and a plain fetch: G DATA's
# international English site (gdata.de/en, where gdatasoftware.com leads), its German site (gdata.de), its country sites
# for France, Italy and the Netherlands (gdata.fr, .it, .nl), Spain's (gdata.es, which answers this machine with 403 and
# was read 2026-11-20 through a Spanish exit), the North American site of its US company G DATA Software, Inc.
# (gdata-software.com, whose checkout is FastSpring's), its shop (shop.gdata.de), its help centre (gdata.de/help-en), its
# legal pages and AV-TEST's page. Pages, each quoted where it's used:
# Pricing: each product page holds its shop's price list for 1 to 10 devices and 1 or 2 years (and 18 months in
# Germany), its list price ("uvp") beside any campaign price. gdata.de/en prices in US dollars for its international shop
# ("currency":"USD"), gdata.de in euros (Germany and Austria), and gdata.fr, .it, .nl and .es in euros on their own
# pages. The North American site prices in US dollars through FastSpring, whose checkout named Canada ("country":"CA",
# "taxType":"GST") read from Canada and the US ("country":"US") through a US exit, read 2026-11-20 up to the payment
# form. Renewal prices, from the carts and checkouts, read up to the payment form: the shop's cart shows the renewal under
# each item ("Subscription activated", "from 20 Nov 2027", "US$39.95 / 12 months"; Germany's "ab 20.11.2027", "39,95 € /
# 12 Monate" under Black Weeks' 40% first-term coupon; France's "Abonnement activé", "39,95 € / 12 mois"), and
# FastSpring's checkout data its next charge ("nextChargeTotal":"US$39.95", "intervalUnit":"year" for Internet
# Security). Regular prices are those renewal prices: Germany's Black Weeks coupons (BLACKWEEKS30, BLACKWEEKS40) are a
# first term's offer, and the North American site's struck "54.95 USD" over "39.95 USD" isn't what renews. The North
# American site's subscription popup still says "you will receive a discount of 30% from the second year onwards", which
# its checkout's next charge (the full price) contradicts: the checkout wins (notes.md). A 2-year term (and Germany's
# 18 months) renews yearly ("Duration in month: 24", "from 20 Nov 2028", "US$39.95 / 12 months"), so it's a first term:
# only yearly prices are stored (Norton's precedent). No monthly billing. Taxes: Germany's "Alle Preise inkl. MwSt.",
# France's "Tous les prix sont indiqués en TTC", Italy's "Tutti i prezzi si intendono IVA inclusa" and the Netherlands'
# "Alle prijzen zijn inclusief btw" are taxIncluded; Spain's "Todos los precios incluyen IVA" says so too, but core's tax
# wording doesn't read "incluyen" yet, so Spain's prices have none; the North American site says "plus VAT if
# applicable." Each plan is priced for one device, and more devices are extra-device add-ons (ESET's precedent): every
# store's price list rises by the same amount for each device (see addOns).
# Region checklist for CA and US, 2026-11-20: 1. gdata.de/en has no country paths, and its hreflang links name only en,
# de and de-CH; 2. the shop's currency picker (US-Dollar, Swiss francs, Euro); 3. the price data names USD, EUR or CHF,
# not a country; 4. the international shop's checkout country list has neither Canada nor the United States (read from
# Canada and through a US exit), while the North American site's FastSpring checkout names each (above); 5. the help
# centre's payment and contract articles; 6. Edge and a plain fetch; 7. no bill offered. Its facts page: "G DATA is
# available in more than 90 countries worldwide, including Germany (.de), Brazil, and the USA."
# Other regions: the UK, Ireland, Australia and New Zealand have no G DATA page of their own (gdata.co.uk doesn't
# answer, gdata.com.au is another company); the international shop's checkout lists them and sells in US dollars, which
# isn't priced here (no country page; notes.md).
# Bundles: none sold as bundles of plans; the shop's "Bundle" is a security plan with the VPN or ID Protection add-on
# (addOns). Official resellers: none named for home users (its partner pages are for business resellers). FastSpring is
# the online reseller that runs the North American site's checkout ("Sold and fulfilled by FastSpring — an authorized
# reseller."), not a shop of its own. Google Play bills Mobile Security's in-app purchases: a partner, noted, not listed.
# Free use: Mobile Security Android Light, free after a 30-day trial of Premium (its plan below). The free trials of the
# Windows and Mac apps end after 30 days.
# Not drafted: Mobile Security iOS (gdata.fr, .it and .nl's pages show no price; Internet Security and Total Security
# cover iOS), the 18-month and 2-year first terms, Switzerland's CHF prices (not a catalog region) and business products.

# Coverage: g-data.vpn in CA and US: the North American site sells no VPN, and the international shop's checkout lists
# neither country (read 2026-11-20 from Canada and through a US exit).

id: g-data
name: G DATA
aliases: [G Data, GDATA]
website: https://www.gdata.de
domains: [gdata-software.com, gdata.fr, gdata.it, gdata.nl, gdata.es]
category: security
spendCategory: software
billingCurrency: { CA: USD, US: USD, DE: EUR, FR: EUR, IT: EUR, NL: EUR, ES: EUR, GLOBAL: USD }
# Its cancellation form ("Cancel contract", every page's footer), which My G DATA's "Cancel contract" also opens.
cancelUrl: https://www.gdata.de/en/cancel-contract
sources: { pricing: https://www.gdata.de/en/consumer/shop }
# Owner (M11.2), read 2026-11-20: its facts page (rule 1). G DATA CyberDefense AG of Bochum (its imprint) sells in Europe
# and its US company G DATA Software, Inc. (Newark, Delaware: gdata-software.com's imprint) in North America. No page
# read names an exchange listing: no stock.
owner:
  name: G DATA CyberDefense AG
  page:
    name: 'Facts (G DATA CyberDefense AG)'
    url: https://www.gdata.de/en/facts
  quotes:
    - 'G DATA CyberDefense AG is a German software company that develops cybersecurity solutions for private and business customers and is regarded as the inventor of the first commercial antivirus software.'
  country:
    code: DE
    page:
      name: 'Facts (G DATA CyberDefense AG)'
      url: https://www.gdata.de/en/facts
    quotes:
      - 'Location Königsallee 178 a, 44799 Bochum, Germany'
    lastVerified: 2026-11-20
  lastVerified: 2026-11-20
# Ways to pay and card networks (M11.5), read 2026-11-20: My G DATA's contract help names Visa, Mastercard, PayPal, Apple
# Pay and direct debit (the shop's payment page: "Payment by credit card", "Payment by ApplePay", "Payment by PayPal"). The
# North American checkout is FastSpring's: its terms name cards, and its form showed card logos (Visa, Mastercard, American
# Express, UnionPay), PayPal and Google Pay as images, with no words naming them, so only cards are listed there. Google
# Play bills Mobile Security's in-app purchases (its mobile privacy policy).
acceptedNetworks:
  DE: &networks
    networks: [visa, mastercard]
    url: https://www.gdata.de/help-en/consumer/MyGdata/myGDATAPortal/ViewContract/
    quotes:
      - 'You can choose between Visa, Mastercard, PayPal, Apple Pay, and direct debit.'
  FR: *networks
  IT: *networks
  NL: *networks
  ES: *networks
paymentMethods:
  - methods: [card, paypal, apple-pay, bank-transfer]
    regions: [DE, FR, IT, NL, ES]
    page: 'View "My contract" (My G DATA help)'
    url: https://www.gdata.de/help-en/consumer/MyGdata/myGDATAPortal/ViewContract/
    quotes:
      - 'You can choose between Visa, Mastercard, PayPal, Apple Pay, and direct debit.'
  - methods: [card]
    regions: [CA, US]
    page: 'Terms of Sale (FastSpring)'
    url: https://www.fastspring.com/terms-sale-us.html
    quotes:
      - 'FastSpring will charge credit or debit cards on dispatch of the Product.'
  - methods: [app-store]
    regions: [CA, US, DE, FR, IT, NL, ES]
    page: 'Privacy Policy - G DATA Mobile Applications'
    url: https://www.gdata.de/en/privacy/mobile
    quotes:
      - 'When purchasing the app via the Google Play Store, the purchase is made via the Google account stored on the end device.'
# Renewal day (M11.5): its terms renew a subscription at the end of its term ("tacitly extended for an indefinite
# period" after the basic term), and the carts show the next charge a year to the day ("from 20 Nov 2027" for a purchase
# on 20 Nov 2026), but no page states the day in words core reads: not-stated.
renewalAnchor:
  kind: not-stated
  pages:
    - https://secure.gd/shop-terms-conditions-en
    - https://www.gdata.de/help-en/consumer/MyGdata/myGDATAPortal/ViewContract/
  lastVerified: 2026-11-20
