    - name: Terms of Sale (FastSpring, North America)
      url: https://www.fastspring.com/terms-sale-us.html
    - name: Imprint
      url: https://www.gdata.de/en/imprint
    - name: Trust Center
      url: https://www.gdata.de/en/trust-center
    - name: Report a security vulnerability
