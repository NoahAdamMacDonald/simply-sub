  # Free use (the owner's item), read 2026-11-20: Emsisoft Emergency Kit ("It’s free for private use and is fully
  # portable", its getting-started help; its page: "Free Portable Malware & Virus Scanner"), a scanner that finds and
  # cleans malware on Windows ("For Windows 10 (64 bit), Server 2016, and higher") without real-time protection; Emergency
  # Kit Pro is its business edition. Anti-Malware Home itself falls back to a free scanner once its trial or licence
  # ends ("switches automatically to a freeware version, which will allow you to perform scans, but will not provide you
  # any sort of real-time protection").
  - id: emsisoft.emergency-kit
    name: Emergency Kit (free)
    link: https://www.emsisoft.com/en/emergency-kit/
    features:
      platforms: [windows]
      antivirus.included: true
      antivirus.real-time: false
      antivirus.scans: [on-demand]
    notes: 'A free portable scanner for private use: it finds and removes malware on a Windows PC, from a folder or a USB stick, but gives no real-time protection. Anti-Malware Home becomes a free scanner like it when its trial or licence ends.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-20
        sourceUrl: https://www.emsisoft.com/en/help/1702/getting-started/

# Terms and policies (BLUEPRINT §4.10), read 2026-11-20 with a plain fetch: its Terms of Service (last updated July 10,
# 2025: they cover "Emsisoft’s software products and online platform", and the store's checkout says "By placing this
# order you agree to the Terms and Conditions and auto-renewal"), its End User License Agreement (the installer's
# licence), its Privacy Policy (last updated March 4, 2024, with its transparency report and "You might ask…" answers),
# its Cookie Policy, the pricing page's FAQ, the help centre's licensing and billing articles and its vulnerability
# report page. Read for no topic: its legal notice (the owner's address) and its Data Processing Agreement (for
# business customers). Not read: 2Checkout's own terms, refund policy and privacy policy (the store's reseller), and
# Bitdefender's terms for the Mobile Security app's licence activation. No shared document applies.
policies:
  links:
    - name: Terms of Service
      url: https://www.emsisoft.com/en/terms/
    - name: Licence (EULA)
      url: https://www.emsisoft.com/en/eula/
    - name: Privacy policy
      url: https://www.emsisoft.com/en/privacy/
    - name: Cookie policy
      url: https://www.emsisoft.com/en/cookie-policy/
    - name: Pricing FAQ
      url: https://www.emsisoft.com/en/pricing/
    - name: Cancelling auto-renewal
      url: https://www.emsisoft.com/en/help/3984/how-do-i-cancel-the-auto-renewal/
    - name: Deleting your account
      url: https://www.emsisoft.com/en/help/3995/i-want-to-delete-my-account/
    - name: Licences (help)
      url: https://www.emsisoft.com/en/help/1603/licenses/
    - name: Update settings (help)
      url: https://www.emsisoft.com/en/help/1651/update-settings/
    - name: Vulnerability report
      url: https://www.emsisoft.com/en/help/1760/vulnerability-report-en/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Its apps send it general data about your computer for usage statistics. You can turn off some extras in the settings, like crash reports and malware statistics, but not all of it.'
      sources:
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'Our software sends us some general data about your computer, which allows us to create usage statistics that help us with further product planning.'
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'Also optionally (you can disable these in the settings): the checksum value of files that were detected on your computer (to verify them against known false positives), the names of detected malware and blocked hosts (for statistics and quality assurance), and crash reports'
      action:
        name: 'What its software sends (privacy policy)'
        url: https://www.emsisoft.com/en/privacy/
      lastVerified: 2026-11-20
    - topic: privacy.data-sharing
      tier: good
      reason: 'It shares data with the companies that run its service, which it lists. Its sites’ advertising and analytics cookies (Facebook, Google) need your consent first.'
      sources:
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'Emsisoft currently uses third party Subprocessors to provide infrastructure services, and to help us provide customer support and email notifications.'
        - url: https://www.emsisoft.com/en/cookie-policy/
          quote: 'You can change your cookie preferences any time by clicking the above button. This will let you revisit the cookie consent banner and change your preferences or withdraw your consent right away.'
      lastVerified: 2026-11-20
    - topic: privacy.ads-tracking
      tier: good
      reason: 'Its websites use advertising cookies only if you agree in their cookie banner, and you can change that at any time.'
      sources:
        - url: https://www.emsisoft.com/en/cookie-policy/
          quote: 'The third-party cookies used on our website are mainly for understanding how the website performs, how you interact with our website, keeping our services secure, providing advertisements that are relevant to you'
        - url: https://www.emsisoft.com/en/cookie-policy/
          quote: 'You can change your cookie preferences any time by clicking the above button. This will let you revisit the cookie consent banner and change your preferences or withdraw your consent right away.'
      lastVerified: 2026-11-20
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether your files or data train AI models.'
      pages:
        - https://www.emsisoft.com/en/privacy/
        - https://www.emsisoft.com/en/terms/
      lastVerified: 2026-11-20
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data as long as it needs it, even after you close your account. Its web server logs go after a few weeks, and it can delete your content within a day of you leaving.'
      sources:
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'Emsisoft may retain Other Information pertaining to you for as long as necessary for the purposes described in this Privacy Policy.'
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'They are deleted after a few weeks because they grow so big that we couldn’t find enough hard disks to store them for any longer.'
      lastVerified: 2026-11-20
    - topic: privacy.data-deletion
      tier: good
      reason: 'You ask by email to delete your account. After you confirm, it deletes your account, licences and content within 24 hours.'
      sources:
        - url: https://www.emsisoft.com/en/help/3995/i-want-to-delete-my-account/
          quote: 'Our team will forward you a disclaimer. Please reply with your acknowledgement and we will perform the deletion of your Account, Licenses Associated and User Content from the Services within twenty four (24) hours.'
      action:
        name: 'Delete your account'
        url: https://www.emsisoft.com/en/help/3995/i-want-to-delete-my-account/
      lastVerified: 2026-11-20
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask it for a copy of your data. It doesn’t offer a download of it in your account.'
      sources:
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'Subject to any exemptions provided by law, you may have the right to request access to Information, as well as to seek to update, delete or correct this Information.'
      action:
        name: 'Your rights (privacy policy)'
        url: https://www.emsisoft.com/en/privacy/
      lastVerified: 2026-11-20
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It publishes a transparency report (no government has ever asked it for data) and keeps little about you. It may hand data over when it believes the law allows it, and doesn’t say it will tell you.'
      sources:
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'Emsisoft has never received a request for information about a customer or customers from any government or governmental agency.'
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'If we receive a request for information, we may disclose Other Information if we reasonably believe disclosure is in accordance with or required by any applicable law, regulation or legal process.'
      lastVerified: 2026-11-20
    - topic: privacy.data-location
      tier: neutral
      reason: 'Its main user database is on its own servers in Germany. The companies that help it, in the US, the EU, New Zealand, India and the UK, sign agreements to protect the data.'
      sources:
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'Our main user database is stored on our own servers at a Hetzner high security data center in Germany.'
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'Prior to engaging any third party Subprocessor, Emsisoft performs diligence to evaluate their privacy, security and confidentiality practices, and executes an agreement implementing its applicable obligations.'
      lastVerified: 2026-11-20
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'An account needs your email address and a name, which can be a nickname; paid plans need payment details at the store.'
      sources:
        - url: https://www.emsisoft.com/en/privacy/
          quote: 'To provide access to MyEmsisoft we need user account information like your name (feel free to use a nickname), email address, password hash'
      lastVerified: 2026-11-20
    - topic: billing.cancellation
      tier: great
      reason: 'You turn off auto-renewal in its online console at any time, and your protection lasts until the time you paid for runs out.'
      sources:
        - url: https://www.emsisoft.com/en/help/3984/how-do-i-cancel-the-auto-renewal/
          quote: 'From there you will find the option to cancel the auto-renewal and stop the auto-billing for the current subscription cycle.'
        - url: https://www.emsisoft.com/en/help/3984/how-do-i-cancel-the-auto-renewal/
          quote: 'Please note that cancelling the auto-renewal will leave your protection active until its expiry date.'
      lastVerified: 2026-11-20
    - topic: billing.refunds
      tier: good
      reason: 'You get all your money back within 30 days of buying. Its pricing page promises the same for any charge you didn’t want, renewals included; its terms speak only of new subscriptions.'
      sources:
        - url: https://www.emsisoft.com/en/pricing/
          quote: 'We’re certainly not interested in charging any money if you don’t want to use our products and always offer a full refund for any unwanted transactions within 30 days.'
        - url: https://www.emsisoft.com/en/terms/
          quote: 'You can cancel a new subscription within 30 days from the initial transaction date and you receive a full refund.'
      lastVerified: 2026-11-20
    - topic: billing.price-changes
      tier: good
      reason: 'It gives 30 days’ notice of a new price, and you can cancel before it applies.'
      sources:
        - url: https://www.emsisoft.com/en/terms/
