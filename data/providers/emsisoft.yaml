# Researched by hand on 2026-11-20 (M11.15, security batch 2), read from Canada with a plain fetch and Edge, and the other
# countries' prices through each country's exit (the US, the UK, Ireland, Germany, France, the Netherlands, Spain, Italy,
# Australia and New Zealand): emsisoft.com's pricing, product, legal and help pages, and its own store
# (store.emsisoft.com, run by 2Checkout: "Order processed by 2Checkout, authorized reseller and merchant of record for
# the products offered within this store."). Pages, each quoted where it's used:
# Pricing: emsisoft.com/en/pricing prices by where the visitor is: its own price data, in the page, names the currency
# ("currency":"CAD" from Canada, USD, GBP, EUR, AUD or NZD elsewhere) and holds Anti-Malware Home's price for 1, 3 or 5
# PCs and 1, 2 or 3 years; the Mobile Security page holds the same for 1 or 3 devices, a year at a time. No price is
# struck and no page speaks of a first-term price: the store's cart says what it renews at ("This is a subscription
# product with a fee of CAD $57.13 per year." and "a fee of CAD $100.65 per 2 years", read in Edge from Canada), and the
# terms charge each period "at the then-current Subscription Fee". The euro countries' prices are the US dollar ones in
# euros; the Canadian, British, Australian and New Zealand prices are the US dollar ones at a set rate (CAD 1.43, GBP
# 0.76, AUD 1.49 and NZD 1.81 to the dollar on 2026-11-20), so they can move when Emsisoft changes its rate.
# Tax: Canada's cart adds it ("Includes CAD $8.56 VAT (14.975% on CAD $57.13)", added to the price for a Quebec
# address); no page says the other countries' prices include it.
# Region checklist for CA and US, 2026-11-20: 1. no country paths (/en/, /de/, /fr/ are languages); 2. no country picker
# on the page, the store's currency menu converts; 3. the page's price data names the currency; 4. the store's cart,
# up to the payment form; 5. no help article on prices; 6. a plain fetch and Edge from Canada, a plain fetch through a US
# exit; 7. no bill.
# Bundles: none. Official resellers: none listed. Its "Buy from local partner" page lists, country by country, the IT
# firms in its partner programme ("Made for Value Added Resellers"), and no Emsisoft page prices a home plan at any of
# them. Not drafted: Business Security, Enterprise Security + EDR and the Remediation Kit (business products).
# Free use: Emsisoft Emergency Kit, its free portable scanner ("It’s free for private use"), and Anti-Malware Home's own
# scanner-only mode once its trial or licence ends (both Windows only; see the free plan).

id: emsisoft
name: Emsisoft
website: https://www.emsisoft.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    AU: AUD,
    NZ: NZD,
    GLOBAL: USD,
  }
# Its help article on cancelling auto-renewal (in the Management Console, or by email to support).
cancelUrl: https://www.emsisoft.com/en/help/3984/how-do-i-cancel-the-auto-renewal/
sources: { pricing: https://www.emsisoft.com/en/pricing/ }
# Owner (M11.2), read 2026-11-20: its licence agreement names the company that licenses its software (rule 3), Emsisoft
# Ltd, a private company in New Zealand (its legal notice: "Emsisoft Ltd", "Richmond 7020", "New Zealand", "Managing
# director: Christian Mairoll").
owner:
  name: Emsisoft Ltd
  page:
    name: End User License Agreement (EULA)
    url: https://www.emsisoft.com/en/eula/
  quotes:
    - '1.1. The Licenser is Emsisoft Ltd, located in 6 Cube Court, Richmond 7020, New Zealand.'
  country:
    code: NZ
  lastVerified: 2026-11-20
# Ways to pay (M11.5), read 2026-11-20 in Edge from Canada: the store's checkout (2Checkout) offers card, PayPal and,
# under "Select other methods", bank transfer; its card choices name Visa/MasterCard, American Express, Discover and
# UnionPay. The other countries' checkouts weren't opened.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, discover, unionpay]
    url: https://store.emsisoft.com/order/checkout.php?PRODS=4549428&QTY=1&CART=1&CARD=2&SHORT_FORM=1&CLEAN_CART=1&OPTIONS4549428=1st&HIDE_CROSS_SELLING=1
    quotes: ['Visa/MasterCard', 'American Express', 'Discover', 'UnionPay']
paymentMethods:
  - methods: [card, paypal, bank-transfer]
    page: Checkout
    url: https://store.emsisoft.com/order/checkout.php?PRODS=4549428&QTY=1&CART=1&CARD=2&SHORT_FORM=1&CLEAN_CART=1&OPTIONS4549428=1st&HIDE_CROSS_SELLING=1
    quotes: ['Credit Cards', 'PayPal', 'Bank transfer']
# Renewal day (M11.5): its pricing FAQ says a licence period "starts at the day of payment processing" and renews "when
# the license ends", and its upgrade help that the payment day "will become your new billing and renewal date": no
# wording core reads as a day, so not-stated.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.emsisoft.com/en/pricing/
    - https://www.emsisoft.com/en/terms/
    - https://www.emsisoft.com/en/help/3978/how-to-upgrade-a-license-or-add-seats/
  lastVerified: 2026-11-20
# Lab results (M11.2): AV-TEST's newest test of Emsisoft is of 2016 (Anti-Malware 12.0, its Emsisoft page), ten years
# old, and it isn't in AV-TEST's tests of 2025 and 2026, so no rating is listed. AV-Comparatives' and SE Labs' aren't
# listed (data/raters.yaml).

# General features, read 2026-11-20. Sign-in: MyEmsisoft's password with a security code every time, by email or an
# authenticator app ("you will also receive a security code in your email address, or Authentication App on your
# phone", its 2FA help). Support: "Email & live chat customer support" (the pricing page's Home card). App languages:
# its licence's "basic languages German, English and French" (others are volunteers' translations it doesn't vouch for),
# and the Management Console's "English, French and German". No pause (auto-renewal is turned off instead), no parental
# controls on the computer plans.
features:
  account.sign-in: [password, email-code, totp]
  support.channels: [email, chat]
  languages.interface: [en, fr, de]

# Perks (M11.6): what the pricing page's comparison ticks for Anti-Malware Home that no feature describes, in its words.
perks:
  - id: exploit-prevention
    name: Exploit prevention
  - id: emergency-kit-maker
    name: Emergency Kit maker included
  - id: network-lockdown
    name: Emergency network lockdown mode
  - id: app-lock
    name: App Lock

# Features, read 2026-11-20: the Home card ("Multi-layered protection with real-time scanning, web protection,
# anti-phishing, behavior blocker and anti-ransomware."), the comparison table's ticks for Anti-Malware Home (icons, read
# from the page's code: Scheduled scans, File Guard, Behavior Blocker, Anti-Ransomware, Exploit prevention, Emergency
# network lockdown mode, Windows Firewall monitoring and hardening, Silent mode/gaming mode; not Rollback, which is
# Enterprise's), its product page ("Behavior Blocker continuously monitors all active processes", "Real-time File
# Guard") and help (Scheduled Scan's "Don’t start scheduled scans in Game Mode"; Quick, Malware and Custom scans). Its
# Windows Firewall monitoring is the network feature's firewall, as Malwarebytes' Windows Firewall Control is. The
# product page says it "blocks fraudulent websites and emails", but its help describes only web and browser protection
# (Web Protection, Browser Security), so scam protection is websites only. No boot-time scan, file recovery, optimizer,
# vulnerability scan, spam filter or secure browser on any page. Platforms: "For Windows 10 (64 bit) and higher, Mac OS
# 11 Big Sur and higher" (its product page); the card's device count is "PCs (Windows, macOS)".
# Mobile Security (Android), its product page and user guide: "Real time protection that blocks malicious apps as they
# arrive" (on-install scanning) and on-demand scans, Web Protection, Scam Alert ("It monitors texts, notifications, and
# chat messages for dangerous links"), Anti-Theft ("Remote Locate", "Remote Lock", "Remote Wipe"), Account Privacy
# (breach monitoring of your email addresses, rechecked in the background) and App Lock. Its guide's menu also names
# Parental Control and a VPN without saying the subscription includes them, so neither is listed. The app's licence
# activation goes through Bitdefender (its privacy policy's subprocessors: "Bitdefender SRL", "for Emsisoft Mobile
# Security license activation").
