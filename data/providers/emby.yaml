# Researched by hand on 2026-11-13 (M11.15, streaming batch 7), read with Edge from Canada (emby.media's home, Premiere,
# about, download, support, terms and privacy pages) and with a plain fetch (its documentation, emby.media/support, whose
# articles are static pages listed in its search index, and its Premiere terms). Pages, each quoted where it's used:
# Pricing: its Premiere page (emby.media/premiere.html), the same for everyone (the prices are in the page's own HTML):
# "Monthly $4.99/Each Month (recurring)", "1 Year $54/1 Year", "Lifetime $119/One-time", "All prices are in USD." The
# year doesn't renew: "This is a Premiere membership that will be good for one year from the date of purchase. It will
# not automatically renew so you will need to re-purchase it at the end of that one year." (Premiere Membership
# Options), so it's `autoRenew: false`. No page says the prices include tax.
# Not listed: Lifetime ($119, "valid for the entire life of the Emby product"), a one-time purchase beside the
# subscriptions (the owner's rule for lifetime plans, as Plex Pass's and Nebula's); the Extended Premiere options ("50
# Devices Monthly $13.99/Each Month (recurring)", "80 Devices Monthly $23.99/Each Month (recurring)",
# emby.media/premiere-ext.html), the same Premiere for more than its 30 devices, which no feature tells apart; and the
# individual app unlocks in Apple's, Google's and Amazon's stores ("Some apps have the option to unlock basic playback
# individually"), priced by those stores, where Premiere also costs more ("those store platforms take a significant
# commission", App Store Price Differences).
# Region checklist, 2026-11-13: not needed: one price list in US dollars for every country, in the page's own HTML.
# Bundles: none. Official resellers: none; it sells Premiere itself through PayPal and its card form, and in its apps
# through the app stores.
# Features, read 2026-11-13: Emby Server plays your own media ("Emby organizes and streams your own videos, music,
# photos, and live TV from your personal server to every screen you own.", its home page) and has no content of its own
# ("Emby is NOT a media streaming service. We provide no content.", its Premiere page), so streaming.own-media and
# streaming.content: none. Its Feature Matrix sets Free against Premiere: users, parental controls, Emby Connect and full
# playback in browsers, Roku, Apple TV and smart TVs are free; Live TV, DVR, hardware transcoding, "Downloads & Sync" and
# full playback in its mobile, desktop and console apps are Premiere's (free there: "Limited Playback (one-minute only)";
# Android TV and Fire TV free "Playback for up to 5 TV devices"). Video quality: no page states a top quality; it plays
# your files as they are, and its naming guide keeps a film's "1080p", "4K" and "720p" versions side by side, so 4K
# (inferred). Streams: no number: Premiere's limit "is a device limit NOT a concurrent connection limit" (Premiere
# Limits), and a server's admin may "Limit the number of concurrent video playback sessions" (Feature Matrix), so
# unlimited (inferred), as Plex's and Jellyfin's. Users: "The only required field is a user name." (Users), with no limit,
# so unlimited profiles (inferred). Downloads: Premiere's, on its "30 Devices per Premiere key" (its Premiere terms), so
# 30 (inferred). Ads: no page says "no ads", but it shows only your own media, so ad-free (inferred). Parental controls on
# both: "set the max parental rating for a user" (Parental Controls); no kids mode of its own. No pause: a monthly plan
# is only cancelled (Cancel Subscription). Live TV and recording need your own tuner ("You must have your own server
# installed and your own media or Live TV tuner."): a perk, not streaming.live, since it brings no channels.
# Free use: the free Emby Server, its Free plan.

