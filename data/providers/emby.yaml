# General features, read 2026-11-13. Platforms: its server for Windows, Linux, macOS, FreeBSD, NAS devices and Docker,
# and apps for "Amazon Fire TV", "Android TV", "Apple TV", "Chromecast", "LG Smart TV", "Roku", "Samsung Smart TV",
# "Xbox", "PlayStation 4", "Android", "iOS", "Windows", "Linux", "macOS" and a "Web App" (Download Emby). Sign-in: a user
# name and password on your own server, or an Emby Connect account's ("one set of username/password credentials", Emby
# Connect); its apps' "PIN process" finds a server, and no page says how. Support: its community forum and email
# ("please send an email to billingsupport@emby.media", Emby Premiere). App languages: left out: its server asks you
# "to choose a display language" from "as many languages as possible" (Installation), but no page read lists them. Its
# code is closed: its terms license the software and forbid attempts "to discover the source code" (apart from the
# open-source components it includes), so software.open-source is left out, as Plex's is; Emby was open source before,
# but no page of its own says so now. Self-hostable: "Run Emby Server on a computer or NAS on your home network."
features:
  platforms: [web, windows, macos, linux, android, ios, tv, console]
  account.sign-in: [password]
  support.channels: [email, community]
  software.self-hostable: true

