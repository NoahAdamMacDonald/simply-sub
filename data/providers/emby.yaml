# Terms and policies (BLUEPRINT §4.10), read 2026-11-13: its Terms of Service ("Updated August 16, 2026"), which include
# its Privacy Policy ("The Effective Date of this Privacy Policy is 25 March 2015") and its "Operating Rules and
# Policies"; its Emby Premiere Terms of Service ("Updated: Dec 23, 2024"), which buying Premiere accepts ("Purchasing any
# option above is an acceptance of the Emby Premiere Terms of Service."); and its documentation's Premiere articles
# (purchasing, membership options, limits, cancelling, upgrading, app store prices). Every page's footer says
# "Downloading any Emby software constitutes acceptance of these terms." Its privacy policy covers its website, forums
# and Emby Connect; your server and its media stay on your machine ("EMBY does not have access to, nor host, any of the
# User Content available through the Access Services", its terms). Not read: the card form and PayPal's checkout (they
# open after choosing a plan), its forum's own rules, and the app stores' terms. Its terms take a transferable,
# sublicensable licence over what you post on its forums (legal.content-rights isn't a streaming topic) and forbid
# reverse engineering its software (legal.licence isn't either). Calibrated against Plex, Jellyfin and Nebula.
policies:
  links:
    - name: 'Terms of service'
      url: https://emby.media/terms.html
    - name: 'Emby Premiere terms of service'
      url: https://emby.media/premiereterms.html
    - name: 'Privacy policy'
      url: https://emby.media/privacy.html
    - name: 'Emby Premiere'
      url: https://emby.media/premiere.html
    - name: 'Purchasing Emby Premiere'
      url: https://emby.media/support/articles/Premiere-Purchase.html
    - name: 'Premiere membership options'
      url: https://emby.media/support/articles/Premiere-Membership-Options.html
    - name: 'Emby Premiere (documentation)'
      url: https://emby.media/support/articles/Emby-Premiere.html
    - name: 'Premiere limits'
      url: https://emby.media/support/articles/Premiere-Limits.html
    - name: 'Cancel subscription'
      url: https://emby.media/support/articles/Premiere-Canceling.html
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Its website and Emby Connect record how you use them and how your apps reach your server, to improve its services. You can only turn off cookies, browser by browser.'
      sources:
        - url: https://emby.media/privacy.html
          quote: 'We may use Website Usage Information for a variety of purposes, including enhancing or otherwise improving the Website.'
        - url: https://emby.media/privacy.html
          quote: 'We collect information and/or data related to the connection between Users and a User Machine.'
        - url: https://emby.media/privacy.html
          quote: 'You may disable cookies or Flash Cookies on your Device, but some features of the Website may not function properly.'
      action:
        name: 'Its privacy policy'
        url: https://emby.media/privacy.html
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It may use your information in marketing deals with other companies. It says it won’t hand it over for their own marketing without your consent, and you can stop only its own emails.'
      sources:
        - url: https://emby.media/privacy.html
          quote: 'We may use your Personal Information for promotional and marketing purposes with companies with whom we enter into marketing and promotional arrangements.'
        - url: https://emby.media/privacy.html
          quote: 'We do not provide your Personal Information to third parties for those third parties’ marketing purposes unless you consent to such sharing at the time you provide your Personal Information.'
      action:
        name: 'Its privacy policy'
        url: https://emby.media/privacy.html
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Emby has no ads in its apps, but advertisers’ content on its website may collect what you do and your device’s ID. You can only turn off cookies, browser by browser.'
      sources:
        - url: https://emby.media/privacy.html
          quote: 'The Website may contain content that is supplied by a third party, including advertisers, and those third parties may collect Website Usage Information and your Device Identifier when web pages from the Website are served to your Device.'
        - url: https://emby.media/privacy.html
          quote: 'You may disable cookies or Flash Cookies on your Device, but some features of the Website may not function properly.'
      action:
        name: 'Its privacy policy'
        url: https://emby.media/privacy.html
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you post or upload trains AI.'
      pages: [https://emby.media/privacy.html, https://emby.media/terms.html]
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      status: not-stated
      reason: 'Its privacy policy doesn’t say how long it keeps your information.'
      pages: [https://emby.media/privacy.html]
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      status: not-stated
      reason: 'Its privacy policy offers a way to correct your information, but not to have it deleted, except a child’s.'
      pages: [https://emby.media/privacy.html]
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      status: not-stated
      reason: 'Its privacy policy names no way to get a copy of your information. Your media and library stay on your own server.'
      pages: [https://emby.media/privacy.html]
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: poor
      reason: 'Besides legal orders, it may hand your information to government authorities who simply ask during an investigation, without telling you.'
      sources:
        - url: https://emby.media/privacy.html
          quote: '(ii) at the request of governmental authorities conducting an investigation'
        - url: https://emby.media/privacy.html
          quote: 'Such disclosures may be carried out without notice to you.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: poor
      reason: 'Its website is run in the United States under US law, and it describes no safeguards for your information. Your media stays on your own server.'
      sources:
        - url: https://emby.media/privacy.html
          quote: 'This Website is operated in the United States and is designed and targeted to U.S. audiences and is governed by and operated in accordance with the laws of the United States.'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Emby needs no account: you install its server free. Buying Premiere takes an email address and your card, or your PayPal account.'
      sources:
        - url: https://emby.media/support/articles/Premiere-Purchase.html
          quote: 'This will produce a form where you will need to provide a valid email address (very important as this is how you will receive your key) and your credit card information.'
        - url: https://emby.media/support/articles/Premiere-Purchase.html
          quote: "Since we don't require you to have an account with us, this is the email we are given by PayPal with the transaction."
      lastVerified: 2026-11-13
    - topic: privacy.children
      tier: neutral
      reason: 'Its website isn’t for children under 13, and it deletes a young child’s information it learns of. On your own server, you can limit each person to films and shows up to a rating.'
      sources:
        - url: https://emby.media/terms.html
          quote: 'Children under the age of 13 are prohibited from using the Website.'
        - url: https://emby.media/privacy.html
          quote: 'If we are notified that a person under 13 years of age has submitted Personal Information to us, we will delete that Personal Information.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: good
      reason: 'Only the monthly plan renews. You stop it yourself online, in PayPal or its subscription page, and keep Premiere to the end of the time you paid for.'
      sources:
        - url: https://emby.media/support/articles/Premiere-Canceling.html
          quote: 'The only subscription level you should ever need to cancel is the Monthly one as it is the only one that automatically renews.'
        - url: https://emby.media/support/articles/Premiere-Canceling.html
          quote: 'When you cancel, it just cancels the auto recurring payment going forward. Your Premiere features will remain in effect until the expiration date of your last subscription.'
      action:
        name: 'Cancel subscription'
        url: https://emby.media/support/articles/Premiere-Canceling.html
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back, except when it chooses to refund, but you keep Premiere to the end of the time you paid for.'
      sources:
        - url: https://emby.media/premiereterms.html
          quote: 'Any and all fees related to Emby Subscriptions are non-refundable.'
        - url: https://emby.media/premiereterms.html
          quote: 'If you cancel your Subscription, you will not be charged again, and your Subscription will last until the end of the then current term.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      status: not-stated
      reason: 'Its terms and Premiere terms don’t say whether it tells you before raising the monthly price.'
      pages: [https://emby.media/premiereterms.html, https://emby.media/terms.html]
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      status: not-applicable
      reason: 'Its Premiere page sells no free trial: the server is free, and Premiere is paid from the start.'
      pages: [https://emby.media/premiere.html]
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      tier: great
      reason: 'Nothing renews unless you choose it: the yearly membership ends after a year, and only the monthly plan, sold as recurring, renews on its own.'
      sources:
        - url: https://emby.media/premiereterms.html
          quote: 'If you select automatic renewal at the time of the subscription, then your subscription will be renewed automatically, and thereby the Term will be renewed automatically at the end of the then current Term.'
        - url: https://emby.media/support/articles/Premiere-Membership-Options.html
          quote: 'It will not automatically renew so you will need to re-purchase it at the end of that one year.'
      lastVerified: 2026-11-13
    - topic: billing.fees
      tier: neutral
      reason: 'Its own prices have no fees, but buying Premiere inside an app costs more, to cover the app store’s cut.'
      sources:
        - url: https://emby.media/support/articles/Premiere-Purchase.html
          quote: 'Some of these options may have additional charges due to the costs of the platform involved.'
      lastVerified: 2026-11-13
    - topic: legal.disputes
      tier: bad
      reason: 'A private referee (an arbitrator) in North Carolina settles any dispute, one person at a time, with no class actions and no way to opt out. You pay the fees to start it.'
      sources:
        - url: https://emby.media/terms.html
          quote: 'shall be settled by arbitration administered by the American Arbitration Association (“AAA”)'
        - url: https://emby.media/terms.html
          quote: 'THERE SHALL BE NO RIGHT OR AUTHORITY FOR ANY CLAIMS TO BE ARBITRATED OR LITIGATED ON A CLASS ACTION OR CONSOLIDATED BASIS'
        - url: https://emby.media/terms.html
          quote: 'THE PARTY INTIATING THE ARBITRATION MUST ADVANCE ALL ARBITRATION FILING FEES AND ARBITRATOR’S COSTS PRIOR TO THE COMMENCEMENT OF THE ARBITRATION.'
      lastVerified: 2026-11-13
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It changes its terms by posting them on its website, and they start 10 days later, so you can leave first. It doesn’t say it tells you.'
      sources:
        - url: https://emby.media/terms.html
          quote: 'Any amendments to these Terms will be effective 10 days after being posted on https:///www.emby.media.'
      lastVerified: 2026-11-13
    - topic: legal.account-closure
      tier: bad
      reason: 'It can take away your right to use its software at any time, for any reason, and promises no refund.'
      sources:
        - url: https://emby.media/terms.html
          quote: 'you agree that Emby may revoke or terminate the license granted to you under this paragraph at any time for any reason in its sole discretion.'
        - url: https://emby.media/premiereterms.html
          quote: 'Any and all fees related to Emby Subscriptions are non-refundable.'
      lastVerified: 2026-11-13
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or remove Premiere’s apps and features whenever it likes, or stop offering its software, with no refund promised.'
      sources:
        - url: https://emby.media/premiereterms.html
          quote: 'Subscriptions provide access to the software and features indicated below (which may be modified, updated, removed from time to time in Emby’s sole discretion).'
        - url: https://emby.media/terms.html
          quote: 'You understand that Emby or its licensors may modify or discontinue offering the Software or Website at any time.'
      lastVerified: 2026-11-13
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://emby.media/terms.html, https://emby.media/premiereterms.html]
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: poor
      reason: 'It says only that it uses commercially reasonable efforts and can’t guarantee security. It names no outside checks and no way to report a security flaw.'
      sources:
        - url: https://emby.media/privacy.html
          quote: 'Once we receive your data, we shall use commercially reasonable efforts to help protect and secure the information you provide to us.'
      lastVerified: 2026-11-13
    - topic: service.account-sharing
      tier: good
      reason: 'Your free server can be shared with anyone. Premiere is for one household, and everyone using your server gets it, up to its device limit.'
      sources:
        - url: https://emby.media/support/articles/Premiere-Limits.html
