# Researched by hand on 2026-11-11 (M11.15, the music category, part 5), read with Edge from Canada. Pages, each quoted
# where it's used:
# Pricing: each country's offers pages (qobuz.com/<country>-en/music/streaming/offers/studio, /duo, /sublime), which
# name the country in the path and price in its currency whoever reads them (Canada's in CA$, the US's in $). Studio
# Solo, Duo and Family are sold monthly ("for a monthly subscription without commitment") and yearly ("for an annual
# single payment subscription"); Sublime only yearly. A plan's card is chosen by the page's #duo and #family anchors:
# Studio Solo "then CA$ 129.99 per year", Studio Duo "a single payment of CA$ 179.88" (its Duo page), Sublime "Annual
# plan at CA$ 179.99 per year", Sublime Duo "CA$ 269.89", Sublime Family "CA$ 349.99", the US's the same figures in
# dollars. The UK's (gb-en), Ireland's (ie-en), Australia's (au-en) and New Zealand's (nz-en) pages, and Germany's,
# France's, the Netherlands', Spain's and Italy's in their own languages (de-de, fr-fr, nl-nl, es-es, it-it: their
# English paths show nothing), each in its currency; the euro countries differ only in Studio Solo (Germany's 15,99€ a
# month and 167,88€ a year, the Netherlands' 15,99€ and 162,00€). Studio Family's yearly price ("CA$ 17.99 / Month ... for an annual single payment subscription") has no total
# on any page: only its monthly price is listed.
# Region checklist, 2026-11-11: 1. country paths for all eleven regions; 2. the footer's country name; 3. not needed; 4. checkout
# not opened (it needs an account); 5. its help centre's Payment methods lists the US, not Canada; 6. Edge read every
# page; 7. no bill offered.
# Not listed: Studio Student ("High quality music for student"): the catalog has no way to mark who may buy a plan.
# Bundles: none on its offers pages. Official resellers: none named; "Give Qobuz as a gift" is its own gift page.
# Features: every plan's "Studio quality streaming (Lossless, FLAC 24-Bit up to 192 kHz)" and "Offline listening" (its
# offers pages and The Streaming Subscription Offers); Sublime's "Discounts on Hi-Res purchases of up to 60%" (a perk).
# Duo is "2 independent accounts" and Family "6 independent accounts", members "living in their household" (What is
# Qobuz Duo / Family?). Its press release of 23 July 2026 announces "real-time synchronized lyrics" in its mobile and
# tablet app (Qobuz unveils a new player and real-time lyrics). No page read names uploads or live radio; no audiobooks.
# Free use: none ("Can I get a free trial period": a 30-day trial only; the offers pages list paid plans only).
# Coverage: qobuz.* in AR, AT, BE, BR, CL, CO, DK, FI, JP, LU, MX, NO, PL, PT, SE, CH: sold there (its 27 countries), but
# outside the catalog's eleven research regions, so their pages weren't read.

id: qobuz
name: Qobuz
website: https://www.qobuz.com
# Its help centre.
domains: [help.qobuz.com]
category: music
spendCategory: streaming
# Where it's sold: "Qobuz is currently available in 27 countries" (its help centre's Where is Qobuz available?, updated
# this week), listed there; its terms' article 13 still lists 20 (without Argentina, Brazil, Chile, Colombia, Mexico,
# Poland and Portugal), and its 2026 press release names Poland "its 27th country".
availableIn:
  [
    AR,
    AU,
    AT,
    BE,
    BR,
    CA,
    CL,
    CO,
    DK,
    FI,
    FR,
    DE,
    IE,
    IT,
    JP,
    LU,
    NL,
    MX,
    NZ,
    NO,
    PL,
    PT,
    ES,
    SE,
    CH,
    GB,
    US,
  ]
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    AU: AUD,
    NZ: NZD,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
cancelUrl: https://help.qobuz.com/en/articles/10157-how-do-i-cancel-my-subscription
sources: { pricing: https://www.qobuz.com/ca-en/music/streaming/offers }
# Owner (M11.2), read 2026-11-11: its privacy page names Xandrie as Qobuz's parent and gives its address in France. A
# private company: its press release says Qobuz is "owned since 2015 by a private, primarily French family-owned group"
# (Qobuz Society), so no shares are listed.
owner:
  name: Xandrie SA
  page:
    name: Personal data protection
    url: https://www.qobuz.com/ca-en/discover/legals/privacy
  quotes:
    - 'The protection of your personal data is very important to Xandrie, Qobuz’ parent company.'
  country:
    code: FR
    page:
      name: Personal data protection
      url: https://www.qobuz.com/ca-en/discover/legals/privacy
    quotes:
      - 'XANDRIE SA Legal Department, 45 rue de Delizy, 93692 Pantin CEDEX, FRANCE.'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11
# Ways to pay (M11.5), read 2026-11-11: its Payment methods article lists each country's; the US's cards and PayPal.
# Canada isn't in its list, so Canada's are left out. Its cancelling article says "a third-party application (like
# Apple)" may bill it, without naming a store: not listed.
acceptedNetworks:
  US:
    networks: [visa, mastercard, amex, discover]
    url: https://help.qobuz.com/en/articles/10194-payment-methods
    quotes: ['Visa/Mastercard', 'American Express', 'Discover']
paymentMethods:
  - methods: [card, paypal]
    regions: [US]
    page: Payment methods
    url: https://help.qobuz.com/en/articles/10194-payment-methods
    quotes:
      - 'Visa/Mastercard'
      - 'PayPal'
# Renewal day (M11.5): its help centre's When will the renewal happen?
renewalAnchor:
  kind: same-date
  page: When will the renewal happen ?
  url: https://help.qobuz.com/en/articles/10196-when-will-the-renewal-happen
  quotes:
    - 'Renewal will take place automatically on the anniversary date of your subscription.'
  lastVerified: 2026-11-11
freeUse:
  kind: none
  pages:
    - https://help.qobuz.com/en/articles/10145-can-i-get-a-free-trial-period-to-experience-qobuz-streaming
    - https://www.qobuz.com/ca-en/music/streaming/offers
  lastVerified: 2026-11-11

# General features, read 2026-11-11: app languages from its country and language paths (qobuz.com/ca-fr: "Qui sommes
# nous ?", "Abonnements"; de-de, es-es, it-it, br-pt, jp-ja). No pause (How do I cancel my subscription?) and no
# parental controls (its help centre names none).
# Sign-in (2026-11-11): "with your email address or your Facebook account", or "your Apple account details" (How do I
# create a Qobuz account?), a password (I can't log in), and its sign-up form's "Sign up with Google". No page names
# two-step sign-in. Platforms: "Windows, MacOS, iOS and Android" and "the Webplayer" (its offers page).
features:
  platforms: [web, windows, macos, ios, android]
  account.sign-in: [password, sso]
  languages.interface: [en, fr, es, de, it, pt, ja]

# Perks (M11.6): Sublime's download discounts, in its card's words.
perks:
  - id: download-discounts
    name: Discounts on Hi-Res purchases of up to 60%

