  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It uses what you do on Qobuz to fit the service to your tastes and for audience statistics. To object, you have to email it with your name and address.'
      sources:
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
          quote: 'tailor the service towards your tastes as part of your subscription, according to your preferences'
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
          quote: 'Audience analytics (statistics and audience analysis)'
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
          quote: 'Any requests must include your full name and address and must be emailed to support@qobuz.com'
      action:
        name: Its privacy policy (your rights)
        url: https://www.qobuz.com/ca-en/discover/legals/privacy
      lastVerified: 2026-11-11
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your data with other companies only if you allow it, but some of the 15 partners behind its websites’ cookies use your data without asking. You can object in its cookie choices, browser by browser.'
      sources:
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
          quote: 'Partners and third parties with whom you have authorized data sharing'
        - url: https://www.qobuz.com/ca-en/music/streaming/offers/duo
          quote: 'Some partners do not ask for your consent to process your data and rely on their legitimate business interest.'
        - url: https://www.qobuz.com/ca-en/music/streaming/offers/duo
          quote: 'You can withdraw your consent or object to data processing based on legitimate interest at any time by clicking on “Learn More” or in our Privacy Policy on this website.'
      action:
        name: How to refuse cookies (its cookies charter)
        url: https://www.qobuz.com/ca-en/page/charte_cookies
      lastVerified: 2026-11-11
    - topic: privacy.ads-tracking
      tier: good
      reason: 'Qobuz itself has no ads. Its websites’ advertising cookies, which pick ads to suit your interests, are used only if you agree to them.'
      sources:
        - url: https://www.qobuz.com/ca-en/legal/terms
          quote: 'QOBUZ streaming offers are paid subscription offers to online music listening service without advertisements'
        - url: https://www.qobuz.com/ca-en/page/charte_cookies
          quote: 'We use these cookies to offer you advertisements that may be relevant to you and correspond to your interests.'
        - url: https://www.qobuz.com/ca-en/music/streaming/offers/duo
          quote: 'With your agreement, we and our 15 partners use cookies or similar technologies to store, access, and process personal data like your visit on this website, IP addresses and cookie identifiers.'
      lastVerified: 2026-11-11
    - topic: privacy.ai-training
      tier: great
      reason: 'It says what you search for and listen to never trains outside AI models: it’s used only for Qobuz’s own music suggestions.'
      sources:
        - url: https://community.qobuz.com/ai-charter
          quote: 'Your searches and listening behavior are never used to train external AI models, only to feed Qobuz’ own AI features to improve music recommendations.'
      lastVerified: 2026-11-11
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data as long as it needs to: a subscriber’s while the contract lasts and as long as the law requires, and a would-be customer’s for 3 years after the last contact.'
      sources:
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
          quote: 'Personal data is stored for the time necessary for the purposes for which they are collected.'
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
          quote: 'For subscribers to Xandrie’s products and services, personal data is stored for the length of the contract, in addition to periods of applicable legal requirements'
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
          quote: 'For potential customers, personal data is stored for 3 years after the last time of contact'
      lastVerified: 2026-11-11
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can delete your account yourself, from your account’s personal information page, or ask through its contact form and it deletes it within 48 hours.'
      sources:
        - url: https://help.qobuz.com/en/articles/10174-how-do-i-delete-my-account
          quote: 'At the bottom of the page, click on the “Delete my Qobuz account permanently” link'
        - url: https://www.qobuz.com/ca-en/legal/terms
          quote: 'XANDRIE SA will then delete the Customer’s account within a maximum of 48 hours after receipt of the said message.'
      lastVerified: 2026-11-11
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask it for a copy of your data to take elsewhere, by email or by post.'
      sources:
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
          quote: 'a right of data portability'
        - url: https://www.qobuz.com/ca-en/discover/legals/privacy
