# Terms and policies (M11.15), read 2026-11-11: its General conditions of use and sale (Canada's; the US's copy,
# qobuz.com/us-en/legal/terms, has the same text word for word, so no rating is a region's), its Personal data
# protection page (read from its HTML: the page shows only its nine headings until each is opened) with the cookie
# banner every page shows, its cookies charter, its AI Charter, its sign-up form (qobuz.com/signup: "By clicking on
# "Register", you accept our general terms and conditions and personal data protection policy", read typing nothing),
# its Duo page and its help centre's articles on free trials, cancelling, deleting an account, dispute resolution,
# changing plans, Duo and Family, and payment fees. The terms are its apps' licence too (article 7) and include no
# other agreement. Its legal notices (with its apps' privacy policy: device details and IP address "to produce general
# statistics about our applications"), its press room and its other help articles (renewal, offline listening,
# newsletters, invoices, the student offer, Qobuz Wallet) hold no topic beyond these. No audit, bug bounty or
# disclosure policy found; qobuz.com/.well-known/security.txt answers 403. Calibrated against Deezer's, Spotify's,
# Tidal's and Mixcloud's grades. Not rated: rights over your content and its apps' licence (not topics for music).
