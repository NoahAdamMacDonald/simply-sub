        - url: https://www.qobuz.com/ca-en/legal/terms
          quote: 'If, before subscribing to the STUDIO DUO offer, the Customer had already subscribed to another QOBUZ subscription offer, the Customer agrees by these CGUS to waive reimbursement of said offer.'
