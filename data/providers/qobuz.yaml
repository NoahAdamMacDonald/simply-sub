        - url: https://www.qobuz.com/ca-en/legal/terms
          quote: 'Unless otherwise specified by public policy provided for by the law of one of the territories provided for in Article 13 hereof, these GCUS are subject to French law.'
        - url: https://help.qobuz.com/en/articles/10181-dispute-resolution
          quote: 'If no amicable agreement is reached between Xandrie SA and the Customer, the French courts will have exclusive jurisdiction, unless otherwise provided in the legislation of the country of residence of the Customer.'
        - url: https://www.qobuz.com/ca-en/legal/terms
          quote: 'After a prior written request from consumers to XANDRIE SA, the mediation service can be consulted in relation to any outstanding consumer dispute.'
      lastVerified: 2026-11-11
