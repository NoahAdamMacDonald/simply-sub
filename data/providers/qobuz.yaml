          quote: 'Click on the “Unsubscribe” link of your active subscription'
        - url: https://www.qobuz.com/ca-en/legal/terms
          quote: 'Receipt and acceptance of the cancellation will be confirmed to the Customer by e-mail, but will only take effect at the end of the current subscription period, provided that the notification thereof has been sent at least 48 hours before the end of the period.'
        - url: https://www.qobuz.com/ca-en/legal/terms
