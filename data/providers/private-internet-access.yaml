# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1). Pricing: privateinternetaccess.com/buy-vpn-online
# (its order page; /pricing is a page not found), which prices by where the visitor is, read 2026-11-19 with Edge from
# Canada and through a US, UK, Irish, Australian, New Zealand, German, French, Dutch, Spanish and Italian exit; and its
# checkout (checkout.privateinternetaccess.com/order, opened from each card's "Select Plan" to the card form, typing
# nothing) through each of those exits, every period for Canada, the US, the UK, Germany, Australia and New Zealand and
# the monthly one for Ireland, France, the Netherlands, Spain and Italy. Each order page names its currency ("All amounts
# are shown in USD." in Canada, the US and New Zealand, "... in GBP.", "... in EUR.", "... in AUD."), and each checkout
# its country (Canada with Quebec, United Kingdom...) and the currency in its address (cur=usd, gbp, eur, aud). Its terms,
# privacy policy, feature pages and Kape's pages with a plain fetch from Canada; its help centre through its Zendesk API
# (helpdesk.privateinternetaccess.com, whose pages answer a plain fetch with 403); its cookie panel's words in Edge.
# Regular prices: each card's own renewal line ("Autorenews at $11.95 monthly", "Billed at $47.88 first year and then
# autorenews annually at $47.88", "Autorenews at $75.60 every 3 years") and the checkout's Automatic Renewal Terms, which
# repeat them ("Your subscription plan will automatically renew every 3 years starting on Mar 19, 2030 at the rate of
# $75.60"). The 3-year card's first term is 3 years and 4 months (a Black Friday offer, "3 Years + 4 Months EXTRA"); its
# renewal every 3 years is stored. Its help article also lists 6-month and 2-year subscriptions ("Plans and special
# offers may vary"), which no order page read sells: not stored.
# Tax: the checkout's renewal terms say "(vat/tax included)" for Canada (read with Quebec), the UK, the euro countries,
# Australia and New Zealand, and "+ vat/tax" for the US, so those prices carry taxIncluded and the US's don't (notes.md).
# Region checklist for CA and US, 2026-11-19: 1. its language paths (/fr/, /de/...) change only the language; 2. no
# country or currency picker; 3. the order page's data names the currency ("custom_currency":"USD"); 4. the checkout names
# the country and adds "+ vat/tax" in the US; 5. its help centre's subscriptions article ("All PIA plans are priced in
# USD"); 6. Edge, and a plain fetch; 7. no bill offered.
# Bundles: none sold. Official resellers: none named. Its "Become a Partner" page (/reseller-program) seeks partners and
# names a distribution deal ("PIA's VPN solution is now available to 3 Hong Kong's 3-million customers"), a carrier that
# bundles it (a partner, not listed). App stores (Apple, Google Play, Amazon) bill it: partners, not listed.
# Free use: none ("Can I try PIA for free? PIA is a premium VPN solution", its order page's FAQ); its terms' free trials
# are the app stores' and turn into paid plans.

id: private-internet-access
name: Private Internet Access
aliases: [pia, pia vpn, private internet access vpn]
website: https://www.privateinternetaccess.com
category: vpn
spendCategory: software
# Each order page and checkout names its currency, read 2026-11-19 through each country's exit. Its help article says
# "All PIA plans are priced in USD. If you are paying in a different currency, the amount you will be charged is
# automatically converted from USD into your local currency", but the checkouts charge set amounts in pounds, euros and
# Australian dollars (£9.99, not a conversion of $11.95), so the checkouts are taken (notes.md).
billingCurrency:
  {
    CA: USD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
# Its help article on cancelling (the terms' own steps: "log in to your account, click on "subscriptions" and follow the
# prompts to turn off auto-renewal").
cancelUrl: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46565550505627-How-Do-I-Cancel-My-Subscription
sources: { pricing: https://www.privateinternetaccess.com/buy-vpn-online }
# Owner (M11.2), read 2026-11-19: PIA is run by PIA Private Internet Access, Inc. of Denver ("This privacy policy ...
# explains the privacy practices of PIA Private Internet Access, Inc."; "Private Internet Access is based in the United
# States", its About page), which names no owner. Kape's About us lists "December 2019 Acquisition of PIA" and its brands
# page lists "Private Internet Access" among "Our top brands"; PIA's own post of 2019 ("The continually evolving fight for
# freedom") speaks of "the upcoming merger acquisition with Kape Technologies". Kape is headquartered in London. No stock:
# Kape's About us lists "Kape delists from LSE" in May 2023 (as expressvpn.yaml).
owner:
  name: Kape Technologies PLC
  website: https://www.kape.com
  page:
    name: 'About us (Kape Technologies)'
    url: https://www.kape.com/about-us
  quotes:
    - 'Acquisition of PIA'
  country:
    code: GB
    page:
      name: 'About us (Kape Technologies)'
      url: https://www.kape.com/about-us
    quotes:
      - 'Kape is a global company headquartered in London, United Kingdom.'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19
# Ways to pay (M11.5), read 2026-11-19 in its help article: cards, Apple Pay, Google Pay, PayPal and Amazon Pay
# ("specific locations only": the UK checkout showed no Amazon Pay) renew; iDEAL and Qiwi through Paymentwall (a bank
# transfer and other), gift cards and prepaid cards are one-time; Google Play and the App Store bill it too. No crypto:
# "Private Internet Access (PIA) no longer accepts cryptocurrency payments." (Will My Subscription Renew Automatically?),
# though its privacy policy still describes crypto payments: the newer help article wins. Accepted cards: the same
# article names Visa, Mastercard, American Express and Discover for every buyer, and the checkout shows their logos.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, discover]
    url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46701550179995-What-Payment-Methods-Do-You-Accept
    quotes:
      - 'Credit card (Visa, Mastercard, American Express, and Discover)'
paymentMethods:
  - methods: [card, apple-pay, google-pay, paypal, bank-transfer, gift-card, app-store, other]
    page: 'What Payment Methods Do You Accept?'
    url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46701550179995-What-Payment-Methods-Do-You-Accept
    quotes:
      - 'You may purchase a subscription via our website here, through Google Play on Android, or through the App Store on iOS.'
      - 'Credit card (Visa, Mastercard, American Express, and Discover)'
      - 'Apple Pay'
      - 'Google Pay'
      - 'PayPal'
      - 'Amazon Pay (specific locations only)'
      - 'Digital wallets such as iDEAL and Qiwi (via Paymentwall)'
      - 'Gift cards'
# Renewal day (M11.5), read 2026-11-19: its terms charge the day you sign up and renew "at the end of the current
# subscription"; the checkouts, read on 19 November, renew "every month starting on Dec 19, 2026", "every year starting on
# Nov 19, 2027" and "every 3 years starting on Mar 19, 2030" (a first term of 40 months).
renewalAnchor:
  kind: same-date
  page: 'Terms of Service'
  url: https://www.privateinternetaccess.com/terms-of-service
  quotes:
    - 'Payments will be charged on the day you sign up for Services and will cover use of that service for the service level plan selected at sign up.'
  lastVerified: 2026-11-19
notes: >-
  Its terms are with PIA Private Internet Access, Inc., a US company in Denver, part of Kape Technologies. Prices include
  tax everywhere but the US, where its checkout adds it.

# Free use (the owner's item of 2026-11-09), read 2026-11-19: none. Its order page's FAQ: "Can I try PIA for free? PIA is
# a premium VPN solution, but you can try it absolutely risk-free with our 30-day money-back guarantee on any purchase."
freeUse:
  kind: none
  pages:
    - https://www.privateinternetaccess.com/buy-vpn-online
    - https://www.privateinternetaccess.com/terms-of-service
  lastVerified: 2026-11-19

# General features, read 2026-11-19:
# - Platforms: "Install on Windows, macOS, Linux, Android, iOS, and more" (/download), its browser extension for "Chrome
#   , Edge, or Firefo x" (/download, its text split by links), and "apps for Android TV, Fire TV, and Apple TV" (/smart-tvs).
# - Sign-in: a password, with two-factor codes from an app ("2FA codes are sent via a mobile authentication app", How Do I
#   Enable and Use Two-Factor Authentication?).
# - Support: "Contact our team 24/7 via email or chat in English, French, German, and Romanian." (its order page).
# - App languages: its sites' language menu (EN, Deutsch, Español, Français, Italiano, Português, العربية, 日本語,
#   简体中文, 한국어 and others the registry lacks, such as Nederlands, Polski and Svenska; no Hindi).
# - Open source: its apps ("We publish the code for all our VPN apps in our GitHub repository", /vpn-features/open-source-
#   vpn, which links github.com/pia-foss), not its servers, so open-clients.
# - No pause; no parental controls (its MACE blocker is a setting you turn on yourself).
features:
  platforms: [windows, macos, linux, android, ios, browser-extension, tv]
  account.sign-in: [password, totp]
  support.channels: [email, chat, 24-7]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, ar]
  software.open-source: open-clients
sourceRepo:
  url: https://github.com/pia-foss
  page:
    name: 'Open-Source VPN'
    url: https://www.privateinternetaccess.com/vpn-features/open-source-vpn
  quotes:
    - 'We publish the code for all our VPN apps in our GitHub repository'
  lastVerified: 2026-11-19

# VPN features, read 2026-11-19 on its feature pages and help centre:
# - Devices: "Private Internet Access (PIA) allows an unlimited number of simultaneous connections on a single
#   subscription." (help centre); its terms let it limit "abuse of the ability to connect unlimited simultaneous devices
#   (such as through resale, non-personal use ...)".
# - Traffic: "PIA VPN doesn’t place any VPN bandwidth or data caps on your connection." (/vpn-features), so its monthly
#   VPN data is unlimited.
# - Countries: "With 180 locations in 113 countries" (/vpn-features).
# - Protocols: "Choose between WireGuard and OpenVPN" (/vpn-features; its iOS app "supports two: WireGuard and OpenVPN").
#   Its server list's data has an "IKEv2/IPSec" column, but no app offers it, so ikev2 is left out. Obfuscation: "Add a
#   layer of SSL encryption to your data to make it look like regular web traffic" (/vpn-features), and Multi-Hop's
#   Shadowsocks "designed to disguise VPN traffic as regular internet traffic".
# - Kill switch ("Our Advanced Kill Switch blocks internet traffic whenever the VPN isn’t connected"); split tunnelling
#   ("PIA’s split tunneling works on Windows, macOS 11 and later, Linux, and Android", not iOS).
# - Multi-hop: its "Multi-Hop (Double VPN)" routes "through an additional proxy server before sending it to a PIA VPN
#   server" (Understanding the Multi-Hop Feature): a proxy, not a second VPN server, under its own name (notes.md).
# - Content blocking: MACE, "Block requests to known advertising, tracking, and malicious domains using our domain name
#   system (DNS) filtering on supported apps." (ads, trackers, malware).
# - P2P ("PIA VPN supports P2P connections on every server") and port forwarding ("Activate port forwarding on selected
#   servers").
# - No-logs policy and audits: "PIA’s No-Logs policy has undergone three independent assessments by Deloitte in 2022,
#   2024, and 2025. Audits under the International Standard on Assurance Engagements (ISAE) 3000 (Revised) confirmed our
#   networks and operational processes align with our privacy commitments." (/vpn-features/no-logs-vpn): no-logs. No
#   page read names an audit of its apps or a security test of its servers (its apps are open source and in a disclosure
#   programme with YesWeHack).
# - RAM-only servers: "We only use RAM-only servers and never write anything to hard drives." (/vpn-features/no-logs-vpn).
# - Connects your own devices: no page offers it, so vpn.mesh is false.
# - Identity Guard: "It monitors up to two of your email addresses against known leak databases and notifies you as soon
#   as an address appears in a breach." and "This feature comes with your PIA subscription" (What Is Identity Guard?).
# - Not anonymous: "We need two things to sign you up for a subscription: 1) an email address, and 2) payment." (its
#   privacy policy); crypto, its anonymous way to pay, has ended.
# - Speeds (notes only): "PIA’s high-speed 10-Gbps server network" (/vpn-features).
plans:
  - id: private-internet-access.vpn
    name: PIA VPN
    link: https://www.privateinternetaccess.com/buy-vpn-online
    features:
      vpn.included: true
      vpn.devices: unlimited
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 113
      vpn.protocols: [wireguard, openvpn, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.multi-hop: true
      vpn.content-blocking: [ads, trackers, malware]
      vpn.p2p: true
      vpn.port-forwarding: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [no-logs]
      vpn.ram-only-servers: true
      vpn.mesh: false
