# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with a plain fetch from Canada (its cookie panel in Edge, whose
# words sit in a shadow root that a page's text leaves out). Every agreement a user accepts: the checkout's line ("By
# clicking "Subscribe with Credit/Debit Card" below, I agree to the Terms of Service — including the dispute resolution
# clause which requires binding arbitration - the Privacy Policy; the Cancellation Policy; and the Automatic Renewal Terms
# set forth below."), whose Cancellation Policy is the terms' "Fees, Auto-Renewal & Cancellation" (its link goes to
# /terms-of-service#fees); the terms' DMCA policy (/dmca-policy: copyright notices, no topic) and Export Control Policy
# (/export-control-policy: the sanctioned places it can't serve, no topic). Its apps have no licence of their own: they're
# open source, and the terms' "License" covers the service. The privacy policy's "Cookie Policy" has no page (/cookie-policy
# is not found); its cookie panel ("Cookie Preferences" in every page's footer) says what its cookies do. Not read:
# Deloitte's reports (no page links them), the third parties' own policies (Deskpro, Stripe, PayPal, BitPay, Amazon Pay).
# Kape Technologies shares no policy with PIA: its privacy policy covers only PIA Private Internet Access, Inc.
policies:
  links:
    - name: 'Terms of Service'
      url: https://www.privateinternetaccess.com/terms-of-service
    - name: 'Privacy Policy'
      url: https://www.privateinternetaccess.com/privacy-policy
    - name: 'Open-Source VPN'
      url: https://www.privateinternetaccess.com/vpn-features/open-source-vpn
    - name: 'No-Logs VPN'
      url: https://www.privateinternetaccess.com/vpn-features/no-logs-vpn
    - name: 'Transparency Report'
      url: https://www.privateinternetaccess.com/transparency-report
    - name: 'Vulnerability Disclosure Program'
      url: https://www.privateinternetaccess.com/vulnerability-disclosure-program
    - name: 'About Us'
      url: https://www.privateinternetaccess.com/about-us
    - name: 'Delete Your PIA Account and All Associated Data'
      url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46775136551067-Delete-Your-PIA-Account-and-All-Associated-Data
    - name: 'Will My Subscription Renew Automatically?'
      url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46565891602715-Will-My-Subscription-Renew-Automatically
    - name: 'How many devices can I use simultaneously?'
      url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46610823773851-How-many-devices-can-I-use-simultaneously-while-connected-to-the-VPN-service
    - name: 'Order page'
      url: https://www.privateinternetaccess.com/buy-vpn-online
    - name: 'Where Can I Find the Most Recent Update of the PIA App?'
      url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46770164720539-Where-Can-I-Find-the-Most-Recent-Update-of-the-PIA-App
  ratings:
    - topic: privacy.data-collection
      tier: good
      reason: 'Its apps collect only what they need, plus overall counts that can’t be tied to you. Connection reports and debug details are sent only if you choose to send them.'
      sources:
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'Any usage metric collected while using the Service is irreparably separated from the account user.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'From VPN Users Who Opt-in & Willingly Send Reports:'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'Anonymized connection events, protocol used, device identifiers (platform, app type/version), and connection source (whether manual or automated).'
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It says it never sells your data, but its website lets advertisers’ cookies in as soon as you visit. You can only turn them off in each browser’s cookie settings.'
      sources:
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'We will never sell information to any third parties.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'These technologies are used by advertisers to serve ads that are relevant to your interests.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'By accessing our website, the following cookies will be installed.'
      action:
        name: 'Cookie Preferences, in its website’s footer'
        url: https://www.privateinternetaccess.com/privacy-policy
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its website sets ad cookies that show you ads based on your interests unless you say no, and you have to say no in each browser.'
      sources:
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'These technologies are used by advertisers to serve ads that are relevant to your interests.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'If you do not accept, you may set your preferences below.'
      action:
        name: 'Cookie Preferences, in its website’s footer'
        url: https://www.privateinternetaccess.com/privacy-policy
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: 'It has no AI features, and its terms and privacy policy don’t mention training AI models.'
      pages:
        [
          https://www.privateinternetaccess.com/privacy-policy,
          https://www.privateinternetaccess.com/terms-of-service,
        ]
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your account details as long as it needs them to run the service and meet its legal duties, and names no time limit.'
      sources:
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'Please note that unless you instruct us otherwise, we retain the information we collect for as long as needed to provide our Service, as well as to comply with our legal obligations, resolve disputes, and enforce our agreements.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can email its privacy officer or ask support to delete your account and data. It doesn’t say how soon, and warns it can take a while.'
      sources:
        - url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46775136551067-Delete-Your-PIA-Account-and-All-Associated-Data
          quote: 'To delete your PIA account, you need to submit a ticket to the Customer Support team.'
        - url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46775136551067-Delete-Your-PIA-Account-and-All-Associated-Data
          quote: 'To request the deletion of all of your data, you can send an email to dpo@privateinternetaccess.com.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'the process of locating and deleting your data may take a sizable amount of time and effort'
      action:
        name: 'How to delete your account and data'
        url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46775136551067-Delete-Your-PIA-Account-and-All-Associated-Data
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask its privacy officer for a copy of your data. There’s no download button, and it holds little beyond your email and payments.'
      sources:
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: '(f) the right to data portability.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'To exercise your rights through your account please contact our DPO at:'
      action:
        name: 'Contact its privacy officer'
        url: https://www.privateinternetaccess.com/privacy-policy
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: great
      reason: 'It answers only valid court orders and pushes back on overly broad ones, tells you when it can, publishes its requests every quarter, and keeps no logs to hand over.'
      sources:
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'For invalid or overly broad subpoenas, we will first question and attempt to narrow the scope of any subject matter sought.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'Moreover, when it is possible and a valid option, we will provide the user an opportunity to object to any requested disclosures.'
        - url: https://www.privateinternetaccess.com/transparency-report
          quote: 'As part of our commitment to transparency, we provide a quarterly report containing details about recent requests made to our legal department.'
      lastVerified: 2026-11-19
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data is kept mainly in the United States, and it asks you first before moving it anywhere else.'
      sources:
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'We collect information globally, and we primarily store that information in the United States.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'If we transfer the storage of your Personal Data from the United States, we will request your consent.'
      lastVerified: 2026-11-19
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'To sign up you give an email address and a way to pay. In the US it also keeps your state and zip code for sales tax.'
      sources:
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'We need two things to sign you up for a subscription: 1) an email address, and 2) payment.'
        - url: https://www.privateinternetaccess.com/privacy-policy
          quote: 'State or territory and zip code for tax analysis.'
      lastVerified: 2026-11-19
    - topic: billing.cancellation
      tier: great
      reason: 'You can turn off renewal in your account at any time, and keep using it until the end of the time you paid for.'
      sources:
        - url: https://www.privateinternetaccess.com/terms-of-service
          quote: 'To cancel, log in to your account, click on "subscriptions" and follow the prompts to turn off auto-renewal.'
        - url: https://helpdesk.privateinternetaccess.com/hc/en-us/articles/46565891602715-Will-My-Subscription-Renew-Automatically
          quote: 'Your account will remain active for the remainder of the time that you have already paid for, then will be canceled at the end of the paid time.'
      lastVerified: 2026-11-19
    - topic: billing.refunds
      tier: neutral
      reason: 'You get all your money back if you ask within 30 days of first buying. Renewals aren’t covered, and someone refunded who buys again within 3 months gets no refund.'
      sources:
        - url: https://www.privateinternetaccess.com/terms-of-service
          quote: 'If you are less than 100% satisfied with the Services, we will gladly refund your payment if the refund is requested within thirty (30) days from the date of the initial purchase.'
        - url: https://www.privateinternetaccess.com/terms-of-service
          quote: 'You understand that if you purchase a new account within three (3) months of being issued a refund on a previous account purchase, you will not be eligible for a refund on that new account, even if you request one during or after the (30) day period.'
      lastVerified: 2026-11-19
    - topic: billing.price-changes
      tier: great
      reason: 'It tells you before a price goes up, and a new price starts only at your next renewal, never during time you’ve paid for.'
      sources:
        - url: https://www.privateinternetaccess.com/terms-of-service
          quote: 'PIA reserves the right to change the fees at any time and at its discretion, with advanced Notice to the subscriber.'
        - url: https://www.privateinternetaccess.com/terms-of-service
