# Researched by hand on 2026-11-19 (M11.15, VPN batch 1). Pricing: expressvpn.com/pricing, which prices by where the
# visitor is, read 2026-11-19 through a Canadian, US, UK, Irish, Australian, New Zealand, German, French, Dutch, Spanish
# and Italian exit, each with its "1-month plans", "12-month plans" and "2-year plans" views (the page's plan-length
# menu). Canada, the US, Australia and New Zealand are priced in US dollars ("All amounts shown are in USD.", the US's
# in a bare "$", the others' "USD$"), the UK in pounds and the euro countries in euros ("All amounts shown are in GBP."
# and "... in EUR."). The page's own data names the currency (order-currency USD, GBP, EUR), and its checkout, opened to
# the payment form and typing nothing, named the country: "Country: Canada, BC" with "USD$14.99" (and "Canada, QC" with
# "USD$99.95/year"), "United States, CA", "United Kingdom" and "Netherlands". Read with Edge; the support centre, terms,
# privacy policy, cookie policy and feature pages with a plain fetch from Canada; ExpressAI's own terms in Edge.
# Regular prices: each card's "Autorenews at USD$14.99 monthly." and "Then autorenews at USD$99.95 annually.". The
# 12-month cards' first term ("Billed USD$224.85 USD$74.85 for the first 15 Months.") and the 2-year cards ("2 Years + 4
# Months ... Then autorenews at USD$99.95 annually.") are offers: its help centre calls them "2-year introductory offers
# that renew annually", so only monthly and yearly prices are stored (Proton VPN's 2-year precedent). No price includes
# tax: "Sales tax applied at checkout where applicable." (every view), and the checkouts add it ("Sales tax/VAT 12%" in
# British Columbia, "20%" in the UK, "21%" in the Netherlands).
# Plans: three tiers, Basic, Advanced and Express Pro ("ExpressVPN offers three subscription tiers: Basic, Advanced, and
# Express Pro.", What subscriptions are available?). In the US, Advanced and Express Pro add Identity Defender
# ("Identity Defender is currently only available to Advanced and Express Pro users in the U.S."), so the US's are plans
# of their own (Norton's precedent for plans whose features differ by country): expressvpn.advanced-us and
# expressvpn.pro-us. The US's monthly Advanced card lists "Identity Defender" too, which the help centre's tier article
# (2026-10-30) says only the 12-month and 2-year Advanced have: the live cards win (notes.md).
# Region checklist for CA and US, 2026-11-19: 1. its hreflang links name languages only (en, de, fr, en-AE…), and the
# pricing page has none; 2. no country or currency picker on the pricing page; 3. its page data names the order currency
# (USD) but not the country; 4. the checkout names the country ("Canada, BC", "United States, CA"); 5. its help centre
# has no prices-by-country article; 6. Edge through each country's exit, and a plain fetch; 7. no bill offered.
# Not drafted: ExpressVPN for Teams (business, "5 license minimum applies."), Aircove and Fortify routers (hardware),
# standalone ExpressKeys ("Standalone ExpressKeys subscriptions include a free trial", sold only in its apps, with no
# web price), and EventVPN (its own brand and site, eventvpn.com, free with ads and paid through the App Store: a
# provider of its own for a later batch). The Dedicated IP add-on for Basic and Advanced is offered only during checkout
# ("During checkout, if you are purchasing an Advanced or Basic tier, you will see an option to add a dedicated IP"),
# and the checkouts opened showed no price for it: not stored (notes.md has the page data's prices).
# Bundles: none sold. Official resellers: its gift card FAQ names "authorized partner merchants, including Amazon and
# Walmart" for gift cards, but Walmart's listings describe the old single plan ("Connect up to 8 devices at once",
# "Lightning-quick servers in 105 countries") and no listing names a tier, so no offer maps to a plan (notes.md). App
# stores bill its plans (partners, not listed).
# Free use: none ("Is ExpressVPN free? No. ExpressVPN is a premium VPN service", its FAQ).

# Coverage: expressvpn.advanced and expressvpn.pro in US: the US sells its own (expressvpn.advanced-us,
# expressvpn.pro-us), with Identity Defender ("Identity Defender is currently only available to Advanced and Express Pro
# users in the U.S.", support article What is ExpressVPN Identity Defender?, read 2026-11-19).
# Coverage: expressvpn.advanced-us and expressvpn.pro-us in CA, GB, IE, AU, NZ, DE, FR, NL, ES and IT: the US's own
# plans; those countries sell expressvpn.advanced and expressvpn.pro.

id: expressvpn
name: ExpressVPN
aliases: [express vpn, expressvpn keys, expresskeys]
website: https://www.expressvpn.com
category: vpn
spendCategory: software
# Each country's pricing page names its currency (USD in Canada, the US, Australia and New Zealand, GBP in the UK, EUR
# in the euro countries), and the checkouts read agree (Canada, the US, the UK, the Netherlands). Others weren't read.
billingCurrency:
  {
    CA: USD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: USD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
# Its help article on cancelling, for subscriptions bought on its website and through the app stores.
cancelUrl: https://www.expressvpn.com/support/manage-account/cancel-expressvpn-subscription/
sources: { pricing: https://www.expressvpn.com/pricing }
# Owner (M11.2), read 2026-11-19: ExpressVPN is run by Express Technologies Ltd. of the British Virgin Islands ("Express
# Technologies Ltd. operates under BVI jurisdiction", its privacy policy), whose "ultimate holding company" is "Kape
# Technologies PLC (UK)" (its privacy policy's words, which give the name). Its press page says when it joined Kape, and
# Kape's own site where it's based. No stock: Kape's About us lists "Kape delists from LSE" in May 2023. Kape's brands
# (kape.com/our-brands): ExpressVPN, Private Internet Access, CyberGhost, Intego and Webselenese.
owner:
  name: Kape Technologies PLC
  website: https://www.kape.com
  page:
    name: 'Press (ExpressVPN)'
    url: https://www.expressvpn.com/press
  quotes:
    - 'ExpressVPN has been part of Kape Technologies since 2021.'
    - 'Founded in 2009 and based in the British Virgin Islands, we joined the Kape Technologies family of brands in 2021'
  country:
    code: GB
    page:
      name: 'Kape Technologies'
      url: https://www.kape.com/
    quotes:
      - 'Kape is a global company headquartered in London, United Kingdom.'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19
# Ways to pay (M11.5), read 2026-11-19: its payment methods article (cards, PayPal, Apple Pay, Google Pay), its renewal
# article (Apple's and Google Play's in-app purchases) and its terms (gift cards, "redemption codes"). Cryptocurrency
# ended: "ExpressVPN no longer supports cryptocurrencies (including via BitPay) as a payment method." (Renew your
# ExpressVPN subscription), though its privacy policy still says Bitcoin "may also be available": the help article wins.
# The Dutch checkout also shows an iDEAL | Wero button, only as an image ("Pay with iDEAL | Wero" is its label, not its
# text), so it isn't listed. Accepted cards: no page names a network (its article says "credit card ... and debit
# cards", and the checkout shows a card form without logos), so no acceptedNetworks.
paymentMethods:
  - methods: [card, paypal, apple-pay, google-pay]
    page: 'What payment methods does ExpressVPN accept?'
    url: https://www.expressvpn.com/support/manage-account/what-payment-methods-does-expressvpn-accept/
    quotes:
      - 'You can pay for an ExpressVPN subscription via credit card, direct credit card payment methods (such as PayPal, Apple Pay, and Google Pay), and debit cards.'
  - methods: [app-store]
    page: 'Renew your ExpressVPN subscription'
    url: https://www.expressvpn.com/support/manage-account/renew-expressvpn-account/
    quotes:
      - 'Subscriptions purchased with certain payment methods, such as credit card, PayPal, Apple Pay, Google Pay, Apple in-app purchases, and Google Play in-app purchases, will automatically renew by default.'
  - methods: [gift-card]
    page: 'Terms of Service'
    url: https://www.expressvpn.com/tos
    quotes:
      - 'The Money-Back Guarantee does not apply to renewal purchases or subscriptions purchased using redemption codes (e.g., gift cards).'
# Renewal day (M11.5), read 2026-11-19 in its tier article; the checkouts agree ("renew on a monthly basis starting on
# Dec 19, 2026", read on 19 November).
renewalAnchor:
  kind: same-date
  page: 'What subscriptions are available with ExpressVPN?'
  url: https://www.expressvpn.com/support/manage-account/available-subscriptions/
  quotes:
    - 'Monthly plans renew automatically on the same date each month.'
    - 'The yearly subscription is automatically renewed on the same date once per year.'
  lastVerified: 2026-11-19
notes: >-
  One subscription covers the VPN, ExpressMailGuard's email aliases and ExpressAI, its private AI assistant; Advanced and
  Express Pro add ExpressKeys, its password manager, and in the US Identity Defender. Prices are in US dollars in Canada,
  Australia and New Zealand, plus sales tax. The 2-year deal is a first term that renews yearly.

# Free use (2026-11-09, the owner's item), read 2026-11-19: none. Its FAQ: "No. ExpressVPN is a premium VPN service,
# although a 3- day risk- free trial is available for certain mobile devices." Its pricing page sells only paid tiers.
freeUse:
  kind: none
  pages:
    - https://www.expressvpn.com/support/knowledge-hub/frequently-asked-questions/
    - https://www.expressvpn.com/pricing
  lastVerified: 2026-11-19

# General features, read 2026-11-19:
# - Platforms: "It develops apps for all major platforms, including Windows, Mac, Linux, iOS, Android, Apple TV, and
#   smart TVs." (its About page for AI tools, /llm-info), its download menu's Fire Stick, Android TV, routers and
#   Chrome, Firefox and Edge extensions, and ExpressAI in any browser ("You can use ExpressAI on any device that
#   supports a web browser").
# - Sign-in: a password ("When you create your account, you are required to create a strong password"), codes by email
#   ("sign-in attempts are also verified with codes sent to your email address", Is my account secure?) and passkeys
#   ("Your ExpressVPN+ portal supports passkeys", How to set up passkeys). No authenticator-app or text-message codes.
# - Support: live chat and email around the clock ("24/7 customer support via live chat and email",
#   /features/dedicated-ip).
# - App languages: its footer's language menu (English, "Español", "Deutsch", "Français", "العربية", "Italiano", "日本語",
#   "한국어", "Português" and others the registry lacks, such as Dutch, Polish and Swedish; no Chinese or Hindi).
# - Closed source: only its Lightway protocol's core library is open ("The core library of Lightway has been
#   open-sourced", its Trust Center), not its apps or servers, so no sourceRepo.
# - No pause: Google Play's own pause ("Google Play Store subscriptions can be paused or canceled", How to upgrade or
#   downgrade) is the app store's, not ExpressVPN's. No parental controls: its adult-site blocker is a toggle on the
#   device ("enable Block adult sites and connect to the VPN", /features/parental-controls), a filter you set for
#   yourself.
features:
  platforms: [windows, macos, linux, android, ios, web, browser-extension, tv]
  account.sign-in: [password, passkey, email-code]
  support.channels: [chat, email, 24-7]
  languages.interface: [en, es, de, fr, ar, it, ja, ko, pt]
  software.open-source: proprietary

# Perks (M11.6): lines no feature describes, in its cards' and comparison table's words. ExpressAI's daily credits
# differ by tier (usage levels are perks, the owner's choice of 2026-10-30); Identity Defender's US alerts follow its
# tier article's comparison ("What's the difference between each tier?").
perks:
  - id: dedicated-ip
    name: Dedicated IP included
  - id: expressai-100-credits
    name: 100 credits/day for private AI chats
  - id: expressai-500-credits
    name: 500 credits/day for private AI chats
  - id: ssn-monitoring
    name: SSN monitoring
  - id: change-of-address-alerts
    name: Change of address alerts
  - id: home-title-monitoring
    name: Home title monitoring
  - id: auto-title-monitoring
    name: Auto title monitoring
  - id: court-record-monitoring
    name: Court record monitoring
  - id: neighborhood-watch
    name: Neighborhood watch
  - id: retirement-account-monitoring
    name: 401k monitoring
  - id: caller-identification
    name: Caller Identification

# Categories (M11.3): a VPN first. Every tier includes ExpressAI ("Each tier includes ExpressVPN, the ExpressMailGuard
# email relay service, and ExpressAI, a privacy-first AI workspace."), so every plan is in ai too; Advanced and Express
# Pro include ExpressKeys ("Included with Advanced and Express Pro."), so they're in passwords. ExpressMailGuard
# forwards mail to your own inbox from aliases and has no mailbox (no email.addresses), so no plan is an email plan.
# VPN features, read 2026-11-19, the same on every tier but its device count:
# - Devices: "Basic : 10 devices at the same time.", "Advanced : 12 ..." and "Express Pro : 14 ..." (How many devices
#   can I connect?).
# - Unlimited traffic, so its monthly VPN data is unlimited: "ExpressVPN never caps your bandwidth or throttles your
#   connection for consuming large amounts of data" (/features), and "Although we provide unlimited data transfer" (its
#   privacy policy).
# - Server countries: "Servers in 113 countries" (every page; /vpn-server's list). Some are virtual ("our India servers
#   are geo-located in Singapore and the UK").
# - Protocols: "ExpressVPN supports various protocols, including Lightway , WireGuard , OpenVPN (UDP and TCP) , and
#   IKEv2" (/vpn-server); Lightway, its own, has no registry value. Obfuscation: "Automatic obfuscation on every server"
#   (/features).
# - Kill switch: "ExpressVPN’s Internet Kill Switch blocks IPv4, IPv6, and DNS traffic outside the encrypted tunnel on
#   Windows, Mac, Linux, iOS, and Android devices" (/features/network-lock). Split tunnelling: "ExpressVPN supports
#   split tunneling across multiple platforms, including iOS" (/features/split-tunneling).
# - Content blocking: "Block ads, trackers, malicious sites, and adult sites" (every card's Advanced Protection).
# - P2P: inferred from its home page (below). No page read (/features, /vpn-server, the tier article) offers multi-hop,
#   Tor over VPN, port forwarding (only its routers' own port forwarding for your home network) or connecting your own
#   devices to each other, so vpn.mesh is false.
# - No-logs policy: "We do not collect logs of your online activity while you are connected to our Services" and "We
#   also never store connection logs" (its privacy policy).
# - Audits (its Trust Center's list): "The third KPMG security audit of our privacy commitments (June 2025)", whose post
#   says KPMG "examined ExpressVPN’s TrustedServer system and privacy policy claims as of 28 February 2025" and gave
#   "reasonable assurance that our systems functioned as designed, with no identified issues regarding our technical
#   safeguards against activity logging" (no-logs; KPMG's report sits behind its terms, which weren't accepted); "A
#   security audit by Cure53 of TrustedServer, our in-house VPN server technology (May 2022)" (servers; Cure53's report,
#   "Pentest-Report ExpressVPN TrustedServer 04.-05.2022", read); Cure53's of its iOS, Android, macOS and Linux apps
#   (2022) and browser extension (June 2024), and F-Secure's of its Windows app (2022) (apps).
# - RAM-only servers: "All data wiped with every reboot, as VPN servers run on RAM only" (/features/trustedserver).
# - Not anonymous: its checkout asks for an email address ("Create an account or sign in to subscribe").
# ExpressKeys (Advanced and Express Pro), read 2026-11-19 in What is ExpressKeys?: "Logins and passwords", "Credit and
# debit card details", "Secure notes" and "Two-factor authentication (2FA) codes", passkeys (the comparison table's
# "Passkeys", and How to manage passkeys in ExpressKeys); "Password health: Identify weak, reused, or exposed passwords,
# accounts without 2FA, and insecure URLs."; sharing by link "available to anyone with the link or only invited people",
# with "Link expires after" and "Can only be viewed once" (How to share items in ExpressKeys).
# ExpressMailGuard: "You can create an unlimited number of Dedicated Subdomain Aliases." (its FAQs), on every tier;
# custom domains "1" on Advanced and "20" on Express Pro (the comparison table's "Use your own Domains").
# ExpressAI: web search on every tier ("Web search" ticked for all three); "Access to 6 models" on Express Pro only,
# among them other companies' ("advanced models like GPT OSS and DeepSeek R1"); chats saved "with zero-access,
# end-to-end encryption" (How to save your encrypted chats). Its personalization (a nickname, occupation, custom
# instructions) isn't memory across chats.
# Identity Defender (the US's Advanced and Express Pro), read 2026-11-19 in What is ExpressVPN Identity Defender? and
# the tier article's comparison: dark web monitoring, "Data Removal searches data broker and people-search sites for
# your personal information and automatically sends removal requests on your behalf", "Credit Scanner" with "a monthly
# credit report" (no page names the credit bureaus: inferred, below), and "eligible U.S. subscribers on the Advanced
# plan can receive up to $3 million* in coverage, while eligible U.S. subscribers on the Express Pro plan can receive up
# to $5 million.*", underwritten by American Bankers Insurance Company of Florida.
# The password and authenticator features and end-to-end encryption added 2026-11-19 (the owner's design,
# categories.md), read that day with Edge from Canada in its knowledge hub, for ExpressKeys (Advanced and Express Pro)
# and ExpressAI (every tier):
# - ExpressKeys imports "from other password managers or browsers" (What is ExpressKeys?), as CSV files ("You can import
#   your current passwords from LastPass, Dashlane, 1Password, and Bitwarden as CSV files.", the extension's release
#   notes; "you can import your data from Chrome using a CSV file", How to import passwords from Chrome to ExpressKeys),
#   and exports "as an Encrypted ZIP or CSV file" (How to export data stored in ExpressKeys). No emergency access or
#   offline vault among its features (What is ExpressKeys?).
# - Authenticator: "Built-in 2FA authenticator: Generate time-based one-time passwords (TOTPs) for accounts with 2FA
#   enabled." (What is ExpressKeys?), from a setup key ("Enter your setup key and select Confirm.") or "a QR code, which
#   is an option in the ExpressKeys app for Android and iOS" (How to add and generate 2FA codes). No export of the codes
#   is named.
# - End-to-end: ExpressKeys ("ExpressKeys uses zero-knowledge encryption to protect your data.", What is ExpressKeys?;
#   "Keys Data stored in ExpressKeys is secured with zero-knowledge encryption.", its privacy policy) and ExpressAI's
#   saved chats on every tier ("Your history is protected with zero-access, end-to-end encryption", How to save your
#   encrypted chats).
plans:
  - id: expressvpn.basic
    name: Basic
    link: https://www.expressvpn.com/pricing
    categories: [vpn, ai]
    features:
      vpn.included: true
      vpn.devices: 10
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 113
      vpn.protocols: [wireguard, openvpn, ikev2, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.content-blocking: [ads, trackers, malware, adult-content]
      vpn.p2p: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [no-logs, servers, apps]
      vpn.ram-only-servers: true
      vpn.mesh: false
      email.aliases: unlimited
      ai.assistant: true
      ai.web-search: true
      ai.chat-storage: encrypted-cloud
      encryption.end-to-end: [chats]
    featureLabels:
      email.aliases: ExpressMailGuard aliases
      ai.assistant: ExpressAI
    inferred:
      vpn.p2p:
        reason: 'No page states a P2P policy. Its home page names file sharing as a use ("P2P file sharing usually means that strangers can see your IP address", which a VPN keeps private), and its terms forbid only downloads that break copyright.'
        page:
