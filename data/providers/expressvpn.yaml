        lastVerified: 2026-11-19
    notes: 'Up to 10 devices at once, servers in 113 countries ("High-speed VPN (up to 40Gbps)"), and blocking of ads, trackers, malicious and adult sites. Includes ExpressMailGuard (10 shared aliases, 10 MB of mail a month) and ExpressAI (50 credits a day, 1 model). A dedicated IP is an add-on at checkout. The 2-year deal is a 28-month first term that then renews yearly.'
