# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with a plain fetch from Canada (ExpressAI's terms in Edge).
# Every agreement a user accepts: the checkout's line ("By clicking a payment method below, I agree to the Terms of
# Service — including the dispute resolution clause which requires binding arbitration for U.S. residents; the Privacy
# Policy; the Cancellation Policy"), whose Cancellation Policy is the terms' section 4; the terms' Acceptable Use Policy
# (its section 7) and Export Control Policy (/tos/export-control-policy: the sanctioned countries it can't serve, no
# topic); its Cookie Policy (the privacy policy's "Cookie Policy" link); ExpressAI's Terms and Conditions and Privacy
# Policy (app.expressai.com/terms and /privacy, the latter also at /expressai-privacy-policy: the same grades as the
# main policy, training aside); and, for the US plans, the Identity Defender Privacy Policy
# (/privacy-policy-identity-defender: its ad cookies and opt-outs grade as the main ones; its data "will be stored in
# the United States"). The apps have no licence of their own: the terms' section 8 is it. Not read: KPMG's and PwC's
# audit reports (each behind its auditor's terms), holiday.com's eSIM terms (a partner's, "governed by their own
# applicable terms") and Array's Identity Defender terms (none linked). Kape Technologies shares no policy with
# ExpressVPN: its own privacy policy covers only kape.com, and CyberGhost's (CyberGhost S.R.L.) and Private Internet
# Access's (PIA Private Internet Access, Inc.) are each brand's own.
policies:
  links:
    - name: 'Terms of Service'
      url: https://www.expressvpn.com/tos
    - name: 'Privacy Policy'
      url: https://www.expressvpn.com/privacy-policy
    - name: 'Cookie Policy'
      url: https://www.expressvpn.com/cookie-policy
    - name: 'Terms and Conditions for ExpressAI'
      url: https://app.expressai.com/terms
    - name: 'How does ExpressAI protect my privacy?'
      url: https://www.expressvpn.com/support/knowledge-hub/expressai-privacy-protections/
    - name: 'How to save your encrypted chats (ExpressAI)'
      url: https://www.expressvpn.com/support/knowledge-hub/expressai-save-chats/
    - name: 'ExpressMailGuard FAQs'
      url: https://www.expressvpn.com/support/knowledge-hub/faqs-mailguard/
    - name: 'How to export data stored in ExpressKeys'
      url: https://www.expressvpn.com/support/knowledge-hub/how-to-export-data-stored-in-expresskeys/
    - name: 'What is ExpressKeys?'
      url: https://www.expressvpn.com/support/knowledge-hub/what-is-expresskeys/
    - name: 'Frequently asked questions'
      url: https://www.expressvpn.com/support/knowledge-hub/frequently-asked-questions/
    - name: 'Apple App Store in-app purchases'
      url: https://www.expressvpn.com/support/troubleshooting/apple-in-app-purchases/
    - name: 'How to cancel your ExpressVPN subscription'
      url: https://www.expressvpn.com/support/manage-account/cancel-expressvpn-subscription/
    - name: 'How to upgrade or downgrade your ExpressVPN subscription'
      url: https://www.expressvpn.com/support/manage-account/upgrade-downgrade-subscription/
