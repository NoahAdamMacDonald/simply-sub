      url: https://www.expressvpn.com/support/knowledge-hub/simultaneous-connections/
    - name: 'Use on multiple devices'
      url: https://www.expressvpn.com/features/how-many-devices-can-i-connect
    - name: 'How to download and update the ExpressVPN app'
      url: https://www.expressvpn.com/support/knowledge-hub/download-update-expressvpn-app/
    - name: 'Trust Center'
      url: https://www.expressvpn.com/trust
    - name: "KPMG's 2025 no-logs audit"
      url: https://www.expressvpn.com/blog/kpmg-2025-no-logs-policy-audit/
    - name: 'Plans and pricing'
      url: https://www.expressvpn.com/pricing
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Its apps send crash reports and diagnostics only if you agree. But outside Europe and the UK its website’s analytics cookies, which count the pages you visit, are on until you turn them off, in each browser’s cookie choices.'
      sources:
        - url: https://www.expressvpn.com/privacy-policy
          quote: 'Upon activation of any of our Apps, you will be asked if you would like to share App Diagnostics Data with ExpressVPN.'
        - url: https://www.expressvpn.com/cookie-policy
          quote: 'These help us understand how visitors interact with the Site by collecting information on a statistical basis — for example, which pages are visited and how the Site performs — so that we can measure and improve it. They are not strictly necessary and, in the EU and UK, are set only with your consent.'
        - url: https://www.expressvpn.com/cookie-policy
          quote: 'In the United States we operate, for non-essential Cookies, on a notice-and-opt-out basis rather than a prior-consent basis'
      action:
        name: 'How to change your cookie choices'
        url: https://www.expressvpn.com/cookie-policy
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It doesn’t sell your data, but it matches your email or device ID with ad companies to show you its ads. You can opt out in its app’s privacy settings, and on its website only through each browser’s cookie choices.'
      sources:
        - url: https://www.expressvpn.com/privacy-policy
          quote: 'This includes matching identifiers from our systems with advertising partners to show you ExpressVPN ads during or after your subscription.'
        - url: https://www.expressvpn.com/privacy-policy
          quote: 'we do not sell or lease your Personal Data to third parties'
        - url: https://www.expressvpn.com/cookie-policy
          quote: 'You may opt out of such activity by selecting "Do Not Sell or Share My Personal Information" (or the equivalent link) on the Site, or by adjusting your choices in our Cookie Preferences centre.'
      action:
        name: 'How to change your cookie choices'
        url: https://www.expressvpn.com/cookie-policy
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its website’s ad cookies build a profile of your interests to show you its ads. Outside Europe and the UK they’re on until you turn them off, which you do in each browser’s cookie choices.'
      sources:
        - url: https://www.expressvpn.com/cookie-policy
          quote: 'These are used to deliver advertising relevant to you, to measure the effectiveness of advertising and marketing campaigns, to support affiliate and referral partners, and to build a profile of your interests.'
        - url: https://www.expressvpn.com/cookie-policy
          quote: 'In the United States we operate, for non-essential Cookies, on a notice-and-opt-out basis rather than a prior-consent basis, except where opt-in consent is required (including for the personal information of consumers under 16, whose information we do not knowingly sell or share).'
      action:
        name: 'How to change your cookie choices'
