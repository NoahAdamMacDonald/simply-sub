# Researched by hand on 2026-11-11 (M11.15, streaming batch 5), read with Edge from Canada. Pages, each quoted where it's
# used:
# Pricing: its pricing page (secure.sportsnetplus.ca/pricing): "STANDARD: / Monthly: / $34.99/month / Annual: /
# $269.99/year / Citytv+ bundle: / $36.99/month" and "PREMIUM: / Monthly: / $44.99/month / Annual: / $344.99/year", and
# all in Canadian dollars before tax ("(plus applicable taxes)", its terms). Every price is the regular one.
# Region checklist, 2026-11-11: 1. one site (Canada only); 2. no picker; 3. not needed; 4. checkout not opened (it needs
# an account); 5. its help centre names the cards; 6. Edge read every page; 7. no bill offered.
# Not listed: the TV Provider Add-on ("$12.99 / Per month", "Only available to customers who have Sportsnet included in
# their TV subscription"), which adds Sportsnet+'s exclusives to a TV package's channels: it waits for telecom's TV
# packages, since as a plan it would read as a cheaper Standard. UFC pay-per-views ("No Subscription Required", one event at a time), the French out-of-market pass ("Laissez-
# passer Sportsnet+ (hors marché) en français", a season bought once), and the Rogers Wireless discount (an offer).
# Bundles: the Standard + Citytv+ bundle is a plan here, since Citytv+ isn't in the catalog yet ("The Bundle allows you to
# stream Sportsnet+ Standard and Citytv+ content", Sportsnet+ Citytv+ Bundle FAQ); its Citytv+ access is a perk. Official
# resellers: none; Rogers, TELUS and Koodo bill it themselves ("You can subscribe to Sportsnet+ through select
# third-party providers, including Rogers, TELUS and Koodo"), and Amazon's Prime Video channel sells the Sportsnet
# channels, not Sportsnet+ ("The Sportsnet Prime Video Channel is a separate subscription billed directly via Prime").
# Features, read 2026-11-11: its live Sportsnet channels and exclusives (the comparison table); video "1080p" at best
# ("Certain devices are capable of handling 1080p streams", What devices is Sportsnet+ available on?); streams: its
# terms allow "only on one (1) Digital Device at a time" while its help says "A user is able to watch concurrently on up
# to two devices at a time": the terms' number, as discovery+ Canada's (the owner's choice of 2026-11-09); no downloads
# or profiles on any page; ads on every plan (Rogers Sports & Media sells advertising on it). Regional games are blacked
# out outside their market on every plan.
# Pause on its monthly plans: "if you are on a monthly subscription, you can pause your subscription for a period of 3
# months" (Can I pause my subscription?). No parental controls: its terms leave a minor's use to you. App languages:
# English only ("l’expérience de visionnement sur Sportsnet+ n’est offerte qu’en anglais pour le moment", its French
# pass article).
# Free use: none: its pages sell only paid plans, a TV package's add-on and pay-per-views (TV subscribers get it with their TV
# package, not from Sportsnet+).
id: sportsnet-plus
name: Sportsnet+
website: https://www.sportsnetplus.ca
# Its sign-up site and help centre.
domains: [secure.sportsnetplus.ca, watch.sportsnet.ca, support.sportsnetplus.ca]
category: streaming
spendCategory: streaming
# "Sportsnet+ is only available for streaming while you are physically located in Canada." (Can I access Sportsnet+
# internationally?), and its terms: "The Service is only available to users of a Site while in Canada".
availableIn: [CA]
billingCurrency: { CA: CAD }
cancelUrl: https://support.sportsnetplus.ca/hc/en-gb/articles/46382899123092-How-do-I-cancel-my-subscription
sources: { pricing: https://secure.sportsnetplus.ca/pricing }
# Owner (M11.2), read 2026-11-11: its terms name Rogers Media Inc., run as Rogers Sports & Media (discovery+ Canada's
# owner). Rogers Communications' listings (TSX: RCI.A and RCI.B, NYSE: RCI, its investor page) wait for Rogers' own
# provider (telecom), whose site the check accepts.
owner:
  name: Rogers Sports & Media (Rogers Media Inc.)
  website: https://www.rogerssportsandmedia.com
  page:
    name: Terms of Service
    url: https://secure.sportsnetplus.ca/terms-of-service
  quotes:
    - 'Welcome to Sportsnet+, a video streaming service (the “Service”) provided by or on behalf of Rogers Media Inc. and its affiliates'
  country:
    code: CA
    page:
      name: 'About Us (Rogers Sports & Media)'
      url: https://www.rogerssportsandmedia.com/about-us/
    quotes:
      - 'Rogers Sports & Media is Canada’s fastest growing sports and entertainment content provider, reaching 95% of Canadians through premium content and cross-platform advertising solutions.'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11
# Ways to pay (M11.5), read 2026-11-11: its card article (and Visa Debit, its no-credit-card article), and the app stores
# (its in-app article). Rogers, TELUS and Koodo bill it on their own services ("You can subscribe to Sportsnet+ through
# select third-party providers, including Rogers, TELUS and Koodo", whose words don't match the check for a phone bill).
acceptedNetworks:
  CA:
    networks: [visa, mastercard, amex]
    url: https://support.sportsnetplus.ca/hc/en-gb/articles/46383059399700-Which-credit-cards-do-you-accept
    quotes: ['We accept Visa, MasterCard, or AMEX']
paymentMethods:
  - methods: [card]
    page: Which credit cards do you accept?
    url: https://support.sportsnetplus.ca/hc/en-gb/articles/46383059399700-Which-credit-cards-do-you-accept
    quotes:
      - 'We accept Visa, MasterCard, or AMEX'
  - methods: [app-store]
    page: Can I purchase the Annual Plan in-app?
    url: https://support.sportsnetplus.ca/hc/en-gb/articles/46383165262228-Can-I-purchase-the-Annual-Plan-in-app
    quotes:
      - 'available to purchase in-app on Apple, Google and Amazon'
# Renewal day (M11.5): its billing article.
renewalAnchor:
  kind: same-date
  page: When will I be billed each month?
  url: https://support.sportsnetplus.ca/hc/en-gb/articles/46383079312276-When-will-I-be-billed-each-month
  quotes:
    - 'Monthly Pass: You will be billed each month according to when your subscription began.'
    - 'Annual Pass: You will be billed on the same day as your purchase, one year later.'
  lastVerified: 2026-11-11
freeUse:
  kind: none
  pages:
    - https://www.sportsnetplus.ca/
    - https://secure.sportsnetplus.ca/pricing
  lastVerified: 2026-11-11

# Sign-in (2026-11-11): a Sportsnet account's email and password ("Enter your Sportsnet or Citytv+ credentials to
# login"), or a TV provider's sign-in for TV subscribers (not a single sign-on for buyers, as Crave's) ("Sign in through your TV provider account", watch.sportsnet.ca); it may ask for
# "a verification code" without saying how it's sent (its billing information article). Platforms: its devices article.
features:
  platforms: [web, ios, android, tv, console]
  account.sign-in: [password]
  languages.interface: [en]

