# Terms and policies, read 2026-11-11 (M11.15) in Edge and through its help centre's API, from Canada: its Terms of
# Service ("Updated: November 22, 2024"), with the Sportsnet+ Acceptable Use Policy on the same page ("Updated: November
# 11, 2024"), which the terms include; the French version the terms link for Quebec ("In Quebec? Click here":
# terms-of-service?page_lang=fr, "Mise à jour : 22 novembre 2024"), the same clauses in French: no grade changes; for
# arbitration, Rogers' Arbitration Protocol (the PDF linked from rogers.com/support/terms/arbitration-protocol: arbitration
# by the ADR Institute of Canada where you live, its fees refunded for claims under $50,000 less what small claims court
# would cost: no grade changes); all 94 articles of its help centre (support.sportsnetplus.ca, en-gb); and the Rogers
# Privacy Policy, rated once as a shared document (data/policies/rogers-privacy.yaml), which the site's footer links as
# its Privacy Policy. Calibrated against discovery+ Canada (the same Rogers terms, almost word for word) and Crave.
# Not read: the account step of sign-up (account.sportsnet.ca answered "Something went wrong" in Edge, headless and in a
# window), so the "Subscription Terms" its terms say are shown before subscribing (6(c)) and what an account needs stay
# unread; the footer's "RSM Terms of Service" (Rogers Sports & Media's websites' terms, which discovery+ Canada's research
# found held no topic); and the terms of the app stores, of Amazon's Prime Video channel and of Rogers, TELUS and Koodo,
# which bill it themselves. Its terms grant Rogers a perpetual, irrevocable, sublicensable licence over anything you post
# ("Contributions"); discovery+ Canada's identical clause wasn't made notable (legal.content-rights isn't a streaming
# topic), and neither is this one.
policies:
  shared: [rogers-privacy]
  links:
    - name: 'Sportsnet+ Terms of Service'
      url: https://secure.sportsnetplus.ca/terms-of-service
    - name: 'How do I cancel my subscription?'
      url: https://support.sportsnetplus.ca/hc/en-gb/articles/46382899123092-How-do-I-cancel-my-subscription
    - name: 'What happens if I upgrade to the $44.99 subscription?'
      url: https://support.sportsnetplus.ca/hc/en-gb/articles/46383047748756-What-happens-if-I-upgrade-to-the-44-99-subscription
    - name: 'What happens if I change to the $34.99 subscription?'
      url: https://support.sportsnetplus.ca/hc/en-gb/articles/46383016304532-What-happens-if-I-change-to-the-34-99-subscription
    - name: 'Sportsnet+ Citytv+ Bundle FAQ'
      url: https://support.sportsnetplus.ca/hc/en-gb/articles/46382807304084-Sportsnet-Citytv-Bundle-FAQ
    - name: 'Rogers Wireless Discount'
      url: https://support.sportsnetplus.ca/hc/en-gb/articles/46381971545108-Rogers-Wireless-Discount
  ratings:
    - topic: privacy.sign-up-data
      status: not-stated
      reason: 'Its terms ask for a Rogers account with accurate details without listing them, and its help lists an email, a password and a card, but its sign-up form couldn’t be read.'
      pages:
        - https://secure.sportsnetplus.ca/terms-of-service
        - https://support.sportsnetplus.ca/hc/en-gb/articles/46381971545108-Rogers-Wireless-Discount
      lastVerified: 2026-11-11
    - topic: privacy.children
      tier: neutral
      reason: 'You must be an adult to have an account. If you let a child use it, keeping them from what they shouldn’t see is up to you, and its policies don’t say how it treats children’s data.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'You must be of the age of majority in the province in which you reside in order to be a Registered User.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'If you have authorized a minor to use a Site or the Service, then you agree to be fully responsible for: (i) controlling the minor’s access to and use of that Site or the Service; and (ii) the consequences of any misuse by the minor.'
      lastVerified: 2026-11-11
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel online in your account at any time and keep watching until the end of the time you paid for, though it suggests pausing instead. In Quebec it ends when you cancel, with the rest refunded.'
      sources:
        - url: https://support.sportsnetplus.ca/hc/en-gb/articles/46382899123092-How-do-I-cancel-my-subscription
          quote: 'To cancel your subscription, click on the drop-down menu in the top right corner of the desktop version of watch.sportsnet.ca. Once the drop-down menu is open, click on Account and then click Billing to cancel.'
        - url: https://support.sportsnetplus.ca/hc/en-gb/articles/46382899123092-How-do-I-cancel-my-subscription
          quote: "If you cancel your monthly subscription, you'll still have access to Sportsnet+ until the end of your current billing cycle, and you won't be charged for the following month, except in Quebec, where cancellation will be effective right away and you will be refunded for the remaining portion of the month."
        - url: https://support.sportsnetplus.ca/hc/en-gb/articles/46382899123092-How-do-I-cancel-my-subscription
          quote: 'Did you know you can pause your subscription instead of cancelling?'
      action:
        name: 'How to cancel Sportsnet+'
        url: https://support.sportsnetplus.ca/hc/en-gb/articles/46382899123092-How-do-I-cancel-my-subscription
      lastVerified: 2026-11-11
    - topic: billing.refunds
      tier: neutral
      reason: 'Outside Quebec you get no money back when you cancel, but you keep watching until the end of the time you paid for. In Quebec you get back what you haven’t used. A pay-per-view is refunded only if its stream fails for over 30 minutes.'
      sources:
        - url: https://support.sportsnetplus.ca/hc/en-gb/articles/46382899123092-How-do-I-cancel-my-subscription
          quote: 'If you cancel after renewal or after purchasing the annual subscription, you will retain access until your next renewal date. Please note that there are no refunds.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'You will be refunded for the portion of that subscription period not completed as of the cancellation date.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'All pay-per-view sales are final and not refundable unless there is a stream outage of greater than thirty (30) consecutive minutes during the event.'
      lastVerified: 2026-11-11
    - topic: billing.price-changes
      tier: good
      reason: 'Prices can change at any time, but if you have an account it must tell you in writing at least 30 days before changing any part of the service, and you can cancel instead.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Prices and availability of Subscription Content are subject to change at any time.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'If you are a Registered User, then we may modify these Terms or change any aspect of the Service at any time, upon no less than 30 days’ prior written notice to you.'
      lastVerified: 2026-11-11
    - topic: billing.free-trials
      tier: poor
      reason: 'Its pages offer no trial now; its terms say a trial needs your card and is charged once it ends, cancelled by contacting Sportsnet+, with no reminder promised.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'If your Subscription Content includes a free trial, then you acknowledge that your credit card will be authorized for up to the amount representing the price of the Subscription Content during the free trial, however, your credit card will not be charged until after the end of the free trial.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'You may cancel your subscription to Subscription Content at any time within the Trial Period, by notifying us through one of the contact options accessible at Section 20, and your credit card (or other payment method) will not be charged.'
        - url: https://support.sportsnetplus.ca/hc/en-gb/articles/46381971545108-Rogers-Wireless-Discount
          quote: 'You’ll be notified via email at least 7 days before your promo period ends.'
      lastVerified: 2026-11-11
    - topic: billing.renewal-notice
      tier: poor
      reason: 'It renews on its own, every month or year, and charges you without telling you first.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'will automatically renew either monthly, annually, or at the frequency indicated when you subscribe, unless you cancel your subscription before the prescribed deadline'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'you authorize us (without further notice to you) to charge the renewal subscription price'
      lastVerified: 2026-11-11
    - topic: billing.fees
      tier: great
      reason: 'It charges the plan’s price and taxes, and names no other fees.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'you authorize us to charge the credit card that you provide to us the amount representing the price of the Subscription Content that you ordered (plus applicable taxes)'
      lastVerified: 2026-11-11
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up to Premium starts at once: you pay for a new month, less what’s left of your old plan. Moving down waits for your renewal. Switching to the Citytv+ bundle refunds the rest of your month.'
      sources:
        - url: https://support.sportsnetplus.ca/hc/en-gb/articles/46383047748756-What-happens-if-I-upgrade-to-the-44-99-subscription
          quote: 'You will be immediately billed for a full month subscription of the higher plan, minus the remaining portion of the lower plan.'
        - url: https://support.sportsnetplus.ca/hc/en-gb/articles/46383016304532-What-happens-if-I-change-to-the-34-99-subscription
          quote: 'Your existing subscription tier will remain until the next renewal. At the next renewal you will be billed and your subscription changed to the lower tier and lower price point.'
        - url: https://support.sportsnetplus.ca/hc/en-gb/articles/46382807304084-Sportsnet-Citytv-Bundle-FAQ
          quote: 'Customers who switch to the Bundle plan mid-term will receive a prorated refund for the remainder of their monthly subscription and will be charged in full for the Bundle.'
      lastVerified: 2026-11-11
    - topic: legal.disputes
      tier: bad
      reason: 'Outside Quebec, a private referee (an arbitrator) in your province settles any dispute instead of a court, and you can’t opt out. Rogers pays the arbitration’s reasonable costs.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'will be determined by final and binding arbitration to the exclusion of the courts'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Not applicable to residents of Québec: Where applicable, arbitration will be conducted in the province in which you reside'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Rogers will pay all reasonable costs associated with that arbitration.'
      lastVerified: 2026-11-11
    - topic: legal.terms-changes
      tier: good
      reason: 'If you have an account, it tells you in writing at least 30 days before changing its terms or the service, and you can cancel instead.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'If you are a Registered User, then we may modify these Terms or change any aspect of the Service at any time, upon no less than 30 days’ prior written notice to you.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'If you do not accept any modification to these Terms or change to the Service, then your sole remedy is to cancel the Service by sending us a notice to that effect no later than 30 days after the modification or change takes effect.'
      lastVerified: 2026-11-11
    - topic: legal.account-closure
      tier: neutral
      reason: 'It can block or cancel your account without warning if you break its terms or rules, trying to get around a blackout among them, and nothing says you’d get money back.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Rogers may at any time, without notice to you, restrict, block, suspend or cancel any or all of your use of a Site (or any portion thereof), the Service or your account if you fail to comply in full with any of these Terms or any other terms, agreements, or policies (including, without limitation, our Acceptable Use Policy) that apply to a Site and the use of it.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Any attempt to tamper with or circumvent a blackout restriction described in this subsection is a breach of these Terms resulting in cancellation of the Service in accordance with subsection 15(a).'
      lastVerified: 2026-11-11
    - topic: legal.service-changes
      tier: poor
      reason: 'It can limit or cut off parts of the service without notice and says it owes you nothing. Ending a subscription you pay Rogers for takes 30 days’ written notice (60 in Quebec), with no refund promised.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Rogers may impose limits on certain features and services or restrict your access to parts or all of the Software or the Service without notice or liability.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Rogers may discontinue any Subscription Content that you subscribe to upon no less than 30 days’ (if you are a resident of Québec, 60 days’) advance written notice to you.'
      lastVerified: 2026-11-11
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://secure.sportsnetplus.ca/terms-of-service]
      lastVerified: 2026-11-11
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its terms expect others to use your account and make you answer for them, but don’t say who may. Its usage rules forbid sharing or transferring “your Service” without Rogers’ consent.'
      pages: [https://secure.sportsnetplus.ca/terms-of-service]
      lastVerified: 2026-11-11
    - topic: service.device-limits
      tier: neutral
      reason: 'You can use it on up to 5 different devices, and trying to get around that limit breaks its terms and can end your subscription.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'We allow you to view the Content on up to 5 different Digital Devices, but only on one (1) Digital Device at a time.'
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Any attempt to circumvent that limit is a breach of these Terms, resulting in cancellation of the Service in accordance with subsection 15(a).'
      lastVerified: 2026-11-11
    - topic: other.notable
      title: Remote access to your devices
      tier: bad
      reason: 'Its terms let Rogers connect to your devices from afar and run scripts on them, with full access during remote support.'
      sources:
        - url: https://secure.sportsnetplus.ca/terms-of-service
          quote: 'Rogers may connect remotely to and run scripts on your Digital Device(s). As part of remote Support, Rogers and its agents will have full access to your Digital Device(s).'
      lastVerified: 2026-11-11
