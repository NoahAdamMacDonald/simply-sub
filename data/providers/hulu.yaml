id: hulu
name: Hulu
website: https://www.hulu.com
category: streaming
spendCategory: streaming
# Accepted cards, read 2026-10-28 (M9.2) on the help centre's Your payment options (/article/hulu-payment-options):
# American Express, Visa, Mastercard and Discover, U.S. cards only.
acceptedNetworks:
  US:
    networks: [amex, visa, mastercard, discover]
    url: https://help.hulu.com/article/hulu-payment-options
    quotes:
      - 'We accept U.S. based credit or debit cards like:'
      - American Express
      - Visa
      - Mastercard
      - Discover
billingCurrency: { US: USD }
# help.hulu.com/article/hulu-how-much-does-hulu-cost, read 2026-10-26: "To subscribe to Hulu, you'll need: To be
# located within the U.S."
availableIn: [US]
cancelUrl: https://help.hulu.com/article/hulu-cancel-hulu-subscription
sources: { pricing: https://help.hulu.com/article/hulu-how-much-does-hulu-cost }
# Owner (M11.2), read 2026-11-02: its press site's history, 2019.
# Ways to pay (M11.5), read 2026-11-02 on its payment options article.
paymentMethods:
  - methods: [card, paypal, gift-card]
    page: Your payment options
    url: https://help.hulu.com/article/hulu-payment-options
    quotes:
      - 'We accept U.S. based credit or debit cards like:'
      - 'You can also use PayPal to pay for Hulu.'
      - 'Hulu gift cards are available at select retail outlets.'
owner:
  name: The Walt Disney Company
  website: https://thewaltdisneycompany.com
  page:
    name: Corporate history (Hulu press site)
    url: https://press.hulu.com/corporate/
  quotes:
    - The Walt Disney Company assumes full operational control of Hulu.
  country:
    code: US
    page:
      name: '2025 annual report'
      url: https://investors.thewaltdisneycompany.com/files/doc_financials/2025/ar/2025-Annual-Report.pdf
    quotes:
      - 'Burbank, California 91521'
    lastVerified: 2026-11-03
  lastVerified: 2026-11-02

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their
# words.
perks:
  - id: watch-party
    name: Hulu Watch Party

# Read 2026-10-26 on the plans and prices article, for new subscriptions from September 23, 2026: the standalone plans,
# both up to 4K. The article doesn't number the streams or downloads. Not here yet: the Hulu + Live TV plans (which
# include Disney+ and ESPN, so they'd be suites) and the add-ons. The Disney+ bundles are in data/bundles.
# Two streams at a time, read 2026-11-02 (M11.4) on hulu.com/paramount-plus-with-showtime: "While your Hulu base plan
# allows you to watch on 2 simultaneous streams at a time" (the help centre's screens article renders no text here).
# Downloads, profiles and Kids profiles (M11.15), read 2026-11-04 through a US exit in its help centre: Premium only ("If
# you subscribe to one of the Hulu Premium (No Ads) plans, you can download"), "up to 25 downloads on five supported
# mobile devices at one time" (hulu-downloads); "you can create up to six additional Profiles (seven in total)", and a
# Kids switch on a new profile (hulu-manage-profiles). The downloads perk became the feature (data/redirects.yaml).
# With Ads isn't ad free (its name, and the plans article's "Hulu (With Ads)").
# Renewal day (M11.5), read 2026-11-03 (M11.9) through a US exit, in the US subscriber agreement Disney+, Hulu and
# ESPN share (hulu.com/subscriber_agreement): the date you became a paying subscriber, or a shorter month's last day.
renewalAnchor:
  kind: same-date
  page: Subscriber agreement
  url: https://www.hulu.com/subscriber_agreement
  quotes:
    - 'if your subscription began on a day not contained in a given month (e.g. if you have a monthly subscription and became a paying subscriber on January 31, your payment method would be billed next on February 28)'
  lastVerified: 2026-11-03

# Apps, sign-in and support (M11.9, the cross-category features), read 2026-11-03 in its help centre: web browsers, iPhone
# and iPad, Android, Windows 10 and 11, TVs and streaming devices, PlayStation and Xbox (Supported devices); a MyDisney
# email address and password (MyDisney login details); "live support 24 hours a day 7 days a week", by chat (How to
# contact Hulu).
features:
  platforms: [windows, android, ios, web, tv, console]
  account.sign-in: [password]
  support.channels: [chat, 24-7]

# Billing periods and resellers (M11.9), read 2026-11-03 through a US exit: monthly, and yearly for With Ads only
# (hulu.com/annual-offer: "Automatically renews on annual basis for $124.99/year", its regular price; the annual billing
# article: "annual billing is only available for the Hulu (With Ads) plan"). No official resellers: Roku, Apple and the
# like bill it as channels ("billed by a third party (like Roku or Disney+)").
plans:
  - id: hulu.with-ads
    name: With Ads
    link: https://help.hulu.com/article/hulu-how-much-does-hulu-cost
    features:
      video.quality: 4k
      ad-free: false
      streaming.concurrent-streams: 2
      streaming.profiles: 7
      streaming.kids-profiles: true
    prices:
      - region: US
        currency: USD
        amount: 12.49
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://help.hulu.com/article/hulu-how-much-does-hulu-cost
      - region: US
        currency: USD
        amount: 124.99
        interval: year
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://help.hulu.com/article/hulu-how-much-does-hulu-cost

  - id: hulu.premium
    name: Premium
    link: https://help.hulu.com/article/hulu-how-much-does-hulu-cost
    features:
      video.quality: 4k
      ad-free: true
      streaming.concurrent-streams: 2
      streaming.download-devices: 5
      streaming.profiles: 7
      streaming.kids-profiles: true
    perks: [watch-party]
    notes: A few shows play with ads before and after the video.
    prices:
      - region: US
        currency: USD
        amount: 21.49
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://help.hulu.com/article/hulu-how-much-does-hulu-cost

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: The Walt Disney Company's privacy policy, which covers
# Hulu, rated once in data/policies/disney-privacy.yaml (M11.1); its data sharing is Hulu's own, since the policy adds a
# clause on Hulu's partners. Not rated: the billing and legal topics (hulu.com sends this machine to Disney+), account
# sharing and device limits.
# Every agreement a user accepts (the owner's rule, 2026-11-03): a MyDisney account's Disney Terms of Use, read in
# data/policies/disney-subscriber-agreement.yaml.
policies:
  shared: [disney-privacy, disney-subscriber-agreement]
  links:
    - name: 'Privacy policy'
      url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
    - name: 'Security vulnerability reports'
      url: https://hackerone.com/disney
    - name: 'Privacy controls: online tracking and advertising'
      url: https://privacy.thewaltdisneycompany.com/en/privacy-controls/online-tracking-and-advertising/
  ratings:
    - topic: privacy.data-sharing
      tier: neutral
      reason: 'It gives ID codes or a scrambled email address to ad companies, and data to partners such as device makers. You can say no to the ad sharing with “Do Not Sell or Share” in its footers or app settings.'
      sources:
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'When we provide you with relevant advertising on third-party sites and applications, we may share limited personal information about you, such as certain identifiers or hashed email address, with third parties.'
        - url: https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/
          quote: 'When you use the Hulu service, Hulu may share information with its business partners that help offer the Hulu service, including for example, its content programmers, distributors and device partners, and corporate owners'
        - url: https://privacy.thewaltdisneycompany.com/en/privacy-controls/online-tracking-and-advertising/
          quote: 'Click on “Do Not Sell or Share My Personal Information” or “Your Privacy Controls” in our website footers or application settings to make or update your election.'
      action:
        name: 'Your privacy controls'
        url: https://privacy.thewaltdisneycompany.com/en/privacy-controls/online-tracking-and-advertising/
      lastVerified: 2026-11-03
    - topic: security.practices
      tier: neutral
      reason: "Disney runs a program where security experts can report problems they find, but it doesn't say outside experts check its security or publish what they find."
      sources:
        - url: https://hackerone.com/disney
          quote: 'If you believe you have found a qualifying security vulnerability in a Disney product or website, please submit a report in accordance with the guidelines below.'
      lastVerified: 2026-11-02
