# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), read with a plain fetch (curl), which airvpn.org
# serves whole, and with Edge from Canada for its plans and sign-up pages: its home, Access Plans (buy), specs, servers
# (status), mission, about us, terms of service, privacy notice, security policy and sign-up pages, and 15 FAQ answers
# (airvpn.org/faq/<name>/); the Access Plans page again through a US exit.
# Pricing: airvpn.org/buy ("Three days 2 €", "One month 7 €", "Three months 15 €", "Six months 29 €", "One year 49 €",
# "Two years 79 €", "Three years 99 €"), the same in euros from Canada and through a US exit: one euro price list for
# everyone (GLOBAL EUR). Its Black Friday coupon ("Applied coupons: BLACKFRIDAY2026") shows lower prices for six months to
# three years (18.85 € to 64.35 €): a sale, not stored. No page says the prices include VAT.
# Every period is prepaid time that expires ("before the natural expiration date", its terms) and doesn't renew by
# itself, so autoRenew is false (Mullvad's precedent, the brief's rule); the 3 days are `day` × 3.
# Region checklist for CA and US, 2026-11-19: 1. no country paths (one English site); 2. no country or currency picker;
# 3. the page names "€" beside every price; 4. the checkout needs an account ("You need an account to buy a plan"), so it
# wasn't opened; 5. no help article on prices by country; 6. Edge and a plain fetch from Canada, and Edge through a US
# exit: the same; 7. no bill offered.
# Where it's sold: everywhere but Italy, where its company is: "You are not allowed to use the service if you are a
# resident of Italy." (terms), and its sign-up form's box, "I hereby declare under my sole responsibility that I am not
# resident in Italy." So the plan's notSoldIn names IT; no page lists the countries it sells in, so no availableIn.
# Its individual plans: one, "Every plan includes all AirVPN features.", in seven periods. Bundles: none. Official
# resellers: none named on its pages; its gift vouchers ("Buy a credit coupon", "Buy a plan coupon") are its own.
# Free use: none (its plans page sells only paid time; AirVPN was free only in 2010, its about page says).

id: airvpn
name: AirVPN
website: https://airvpn.org
category: vpn
spendCategory: software
# Accepted cards, read 2026-11-19: its home page says "Credit Cards" and names no network, so no acceptedNetworks.
billingCurrency: { GLOBAL: EUR }
# Nothing renews, so there's nothing to cancel: its terms are where a refund of a payment is asked for ("REIMBURSEMENTS",
# point 9), as Mullvad's refunds guide is its cancel link.
cancelUrl: https://airvpn.org/tos/
sources: { pricing: https://airvpn.org/buy/ }

# Ways to pay (M11.5), read 2026-11-19: its home page's "See plans & payment options" names PayPal, credit cards, Amazon
# Pay (other) and five cryptocurrencies; its Access Plans page, read without an account, lists only "Cryptocurrencies"
# ("Accepted directly through no intermediaries") and its gift vouchers. Both entries are kept (notes.md).
paymentMethods:
  - methods: [paypal, card, other, crypto]
    page: 'AirVPN home'
    url: https://airvpn.org/
    quotes:
      - PayPal Credit Cards Amazon Pay
      - Bitcoin Litecoin Bitcoin Cash Doge Monero
  - methods: [crypto, gift-card]
    page: 'Access Plans'
    url: https://airvpn.org/buy/
    quotes:
      - Cryptocurrencies
      - Gift voucher
# No renewalAnchor: it's prepaid, so nothing renews.
# Owner (M11.2), read 2026-11-19: its terms name the business that runs it, a sole proprietorship in Perugia, Italy (its
# privacy notice's "Air di Paolo Brini"; its about page's "a dedicated company (Air)"). Private: no listing.
owner:
  name: AirVPN di Paolo Brini
  page:
    name: Terms of service
    url: https://airvpn.org/tos/
  quotes:
    - AirVPN is operated by AirVPN di Paolo Brini - Via Sagittario 4 - Perugia (ITALY) - REA PG - 279011.
  country:
    code: IT
  lastVerified: 2026-11-19
notes: >-
  Prepaid in euros: you buy a set time (3 days to 3 years) that ends by itself, and nothing renews. Not for residents of
  Italy. No personal details needed: a real email address is optional. Cryptocurrency is paid to it directly, with no
  processor in between.

# General features, read 2026-11-19: its Eddie app for "Windows, macOS, Linux, Android" (home page; "The AirVPN
# applications for Windows, macOS, GNU/Linux and Android", security policy), and no iOS app ("Why do you not develop
# software for iOS?"; its WireGuard and OpenVPN configurations work in other apps); sign-up and sign-in with a password
# (its sign-up form); support tickets ("write a support ticket", specs) and its forums; its site in English only. Open
# source: "AirVPN software is free and open source." and "All of our software is released under GPLv3" (home), with
# Eddie's code on GitHub; its servers' code isn't published, so open-source apps. No pause or parental controls: its time
# is prepaid, and its block lists are your own choice.
features:
  platforms: [windows, macos, linux, android]
  account.sign-in: [password]
  support.channels: [email, community]
  software.open-source: open-clients
  languages.interface: [en]
sourceRepo:
  url: https://github.com/AirVPN/Eddie
  page:
    name: Security policy
    url: https://airvpn.org/security_policy/
  quotes:
    - 'Eddie, the AirVPN client for Windows, macOS and GNU/Linux, is released under the GPLv3 license, and its source code is available on GitHub: https://github.com/AirVPN/Eddie .'
  lastVerified: 2026-11-19

freeUse:
  kind: none
  pages: [https://airvpn.org/buy/, https://airvpn.org/faq/]
  lastVerified: 2026-11-19

# VPN features, read 2026-11-19 on its home, specs, servers and FAQ pages:
# - Devices: "Five simultaneous connections per account." (home). Data: "No, there are no traffic limits." (Are there
#   traffic limits for an account?), so unlimited.
# - Countries: its servers page lists 23 (Austria, Belgium, Brazil, Bulgaria, Canada, Czech Republic, Estonia, Germany,
#   Ireland, Japan, Latvia, Netherlands, New Zealand, Norway, Romania, Serbia, Singapore, Spain, Sweden, Switzerland,
#   Taiwan, United Kingdom, United States); its about page's "35 datacenters across 19 countries" is older.
# - Protocols: OpenVPN and WireGuard ("AirVPN uses OpenVPN and WireGuard", terms), and "Additional connection types,
#   supported by every Air VPN server, for ISPs or countries disrupting OpenVPN, are OpenVPN over SSH, SSL or Tor"
#   (stealth). No IKEv2.
# - Kill switch: Eddie's Network Lock option, which How can I prevent traffic leaks names ("In this case, you don't need
#   any instruction for any firewall.").
# - Blocking: "Optional block lists protecting you from ads, adware, trackers and malicious sources." (home).
# - P2P: "Yes, p2p is allowed, as well as any other protocol." Port forwarding: "You can forward up to 5 ports
#   simultaneously."
# - No-logs: "No, we don't keep logs of that kind." (Do you keep session logs ...?) and its privacy notice. No independent
#   audit of its own on any page (its mission page lists OpenVPN's 2017 audit, which it helped fund), so no
#   vpn.independent-audits.
# - Anonymous sign-up: "No personal information required. When you open an account , you are not forced to enter any
#   personal data, not even a real e-mail address." (home).
# - Not stated, so not listed: split tunnelling, multi-hop (its rules that "perform internally a double-hop for specific
#   websites / IP ranges" are for its anti-geo-blocking routing, not one you pick) and Tor servers ("OpenVPN over Tor"
#   runs the VPN through Tor, the other way round). No RAM-only servers: its pages say connection data is "handled by
#   automatic systems only in RAM", not that its servers have no disks. No mesh.
plans:
  - id: airvpn.vpn
    name: AirVPN
    link: https://airvpn.org/buy/
    features:
      vpn.included: true
      vpn.devices: 5
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 23
      vpn.protocols: [wireguard, openvpn, stealth]
      vpn.kill-switch: true
      vpn.content-blocking: [ads, trackers, malware]
      vpn.p2p: true
      vpn.port-forwarding: true
      vpn.no-logs-policy: true
      vpn.anonymous-signup: true
      vpn.ram-only-servers: false
      vpn.mesh: false
    notSoldIn:
      - regions: [IT]
        url: https://airvpn.org/tos/
        quotes:
          - You are not allowed to use the service if you are a resident of Italy.
        lastVerified: 2026-11-19
    prices:
      - region: GLOBAL
        currency: EUR
        amount: 2
        interval: day
        intervalCount: 3
        autoRenew: false
        lastVerified: 2026-11-19
        sourceUrl: https://airvpn.org/buy/
      - region: GLOBAL
        currency: EUR
        amount: 7
        interval: month
        intervalCount: 1
        autoRenew: false
        lastVerified: 2026-11-19
        sourceUrl: https://airvpn.org/buy/
      - region: GLOBAL
        currency: EUR
        amount: 15
        interval: month
        intervalCount: 3
        autoRenew: false
        lastVerified: 2026-11-19
        sourceUrl: https://airvpn.org/buy/
      - region: GLOBAL
