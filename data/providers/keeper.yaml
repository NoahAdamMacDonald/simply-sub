  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'Its apps collect details about your device and how they run, used to improve its services and support its marketing. To object you must contact it.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: 'As with any cloud-based services, when you download and use our product we automatically collect information on the type of device you use, operating system version, a randomly-generated device identifier, system performance information and IP address.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: 'In furtherance of our legitimate interests, we process your contact information, service data and diagnostic data to analyze and improve our existing services, support related business operations and, where permitted by applicable law, support our marketing activities.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: 'To exercise this right, contact us using the methods provided in the Contact Us section of this Privacy Policy.'
      action:
        name: 'How to object (its privacy policy)'
        url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'Dozens of ad companies set cookies on its websites, which US laws can count as selling your data. You can opt out, but only in each browser.'
      sources:
        - url: https://www.keepersecurity.com/legal/cookie-policy/
          quote: 'Although we do not sell your personal information for any monetary value, our use of certain online cookies for this purpose may qualify as the "sale" or "sharing" of information under applicable law.'
        - url: https://www.keepersecurity.com/legal/cookie-policy/
          quote: 'You can withdraw or change your cookie preferences at any time by selecting the link in the footer of our site.'
      action:
        name: 'Its cookie choices (Cookie Policy)'
        url: https://www.keepersecurity.com/legal/cookie-policy/
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Its websites let ad partners track what you browse to show you its ads elsewhere. You can turn the cookies off, but only per browser. Its apps show no ads.'
      sources:
        - url: https://www.keepersecurity.com/legal/cookie-policy/
          quote: 'Our third-party partner may use technologies such as cookies to gather information about your activities on other websites in order to provide you advertising based upon your browsing activities and interests.'
        - url: https://www.keepersecurity.com/legal/cookie-policy/
          quote: 'When you do so, all non essential analytics and marketing cookies will not load on your device.'
        - url: https://www.keepersecurity.com/legal/cookie-policy/
          quote: 'For security and privacy reasons, Keeper Security does not run third-party ads in its application.'
      action:
        name: 'Its cookie choices (Cookie Policy)'
        url: https://www.keepersecurity.com/legal/cookie-policy/
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      tier: great
      reason: 'It can’t read your vault, and its terms forbid putting your data into AI tools in any way that trains AI models.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Customer Data shall be considered Customer Confidential Information.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: "Except as expressly permitted in writing, neither party shall make any Confidential Information received hereunder available to any artificial intelligence tools (including generative AI or large language models), except solely for the receiving party's internal use in a secure, access-controlled environment that does not result in AI model training or in the unauthorized retention, disclosure or use of such information."
      lastVerified: 2026-11-19
    - topic: privacy.content-access
      tier: great
      reason: 'Your vault is encrypted on your own device, so no one at Keeper can read it.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: 'Your vault contents remain fully encrypted on your device and are inaccessible to Keeper or its staff under our zero knowledge security model.'
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data while your account is open or as long as it needs it. Files in a lapsed paid account can go after 90 days.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: 'Keeper will retain information for as long as an account is active or as needed to provide the services.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=userGuidelines
          quote: 'If a paid subscription expires and is not renewed within ninety (90) days, Keeper Security reserves the right to delete any Keeper Records in the account that contain files (such as documents, photos or videos).'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can delete your account yourself in its iPhone, Android or Safari app, which erases your vault for good.'
      sources:
        - url: https://help.keeper.io/article/264-how-do-i-cancel-my-keeper-subscription
          quote: "If you're able to log in: Delete your account directly from the iOS app, Android app, or the Safari extension, under Help > Delete Keeper Account."
        - url: https://help.keeper.io/article/264-how-do-i-cancel-my-keeper-subscription
          quote: 'Important: deleting your account permanently removes your vault data.'
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: great
      reason: 'On a paid plan you can download your whole vault yourself as CSV, JSON or an encrypted KeePass file, which holds your attached files too.'
      sources:
        - url: https://help.keeper.io/article/276-how-do-i-export-my-vault-or-run-a-shared-records-report
          quote: 'Encrypted KeePass (.kdbx): the only format that includes file attachments.'
        - url: https://help.keeper.io/article/276-how-do-i-export-my-vault-or-run-a-shared-records-report
          quote: 'This is available to all Personal and Family plan users.'
      action:
        name: 'How to export your vault'
        url: https://help.keeper.io/article/276-how-do-i-export-my-vault-or-run-a-shared-records-report
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      plans: [keeper.free]
      tier: bad
      reason: 'Keeper Free can’t export or back up your records: they stay on your one phone.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=userGuidelines
          quote: 'Free Users may use Keeper on one mobile device only and do not have the ability to back up, restore, share or export their Keeper Records outside of that device.'
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: good
      reason: 'It gives data only when the law or a court requires it, tells you first where it’s allowed to, and can only hand over your name and account details, not your vault.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: "Accordingly, any account disclosure required by law, under a subpoena, would be limited to general account information such as the account holder's name and account term."
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'If and to the extent required by applicable law, including regulatory requirements, discovery request, subpoena, court order or governmental action, the receiving Party may disclose or produce Confidential Information but will give reasonable prior notice (and where prior notice is not permitted by applicable law, notice will be given as soon as the receiving Party is legally permitted) to the disclosing Party to permit the disclosing Party to intervene and to request protective orders or confidential treatment therefor or other appropriate remedy regarding such disclosure.'
      lastVerified: 2026-11-19
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data can go to the US and other countries, under the EU-US Data Privacy Framework or the EU’s standard contract terms.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: 'As a global organization, we may need to transfer your personal data to Keeper affiliates, contractors, service providers and third parties in various countries and jurisdictions around the world.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: 'Standard Contractual Clauses'
      lastVerified: 2026-11-19
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with an email address and a Master Password, and pay with a card or PayPal. A phone number is for text-message sign-in codes, if you choose them.'
      sources:
        - url: https://help.keeper.io/article/159-how-do-i-sign-up-for-keeper
          quote: 'Go to the Web Vault or open the mobile app, enter your email address, and follow the prompts.'
      lastVerified: 2026-11-19
    - topic: billing.cancellation
      tier: poor
      reason: 'On its website you either delete your whole account or ask its support to stop the renewal. Its terms ask for 30 days’ written notice before the renewal date.'
      sources:
        - url: https://help.keeper.io/article/262-how-do-i-request-a-refund-for-my-keeper-subscription
          quote: 'If you purchased directly through keepersecurity.com: contact our support team and they can turn off auto-renewal for you.'
        - url: https://help.keeper.io/article/263-where-do-i-manage-my-keeper-subscription-billing
          quote: 'To cancel, see "How do I cancel my Keeper subscription?", since cancelling is handled through deleting your account rather than a separate cancel button.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Either Party may terminate this Agreement for convenience or elect not to renew or extend an Order, in each case upon at least thirty (30) days’ prior written notice before the applicable renewal date, with such termination or non-renewal effective upon the expiration or termination of all active Orders.'
      lastVerified: 2026-11-19
    - topic: billing.refunds
      tier: neutral
      reason: 'It never gives money back. If its support stops your renewal, you keep it until the end of the year you paid for.'
      sources:
        - url: https://help.keeper.io/article/262-how-do-i-request-a-refund-for-my-keeper-subscription
          quote: 'Keeper subscriptions are non-refundable.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Since the Software is delivered in full at the time of purchase and we cannot uninstall it from your device(s) all fees are nonrefundable and considered earned on receipt.'
      lastVerified: 2026-11-19
    - topic: billing.price-changes
      tier: neutral
      reason: 'A new price starts only at your next renewal, after written notice, but its terms don’t say how long before.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Prices, fees and discounts for services are subject to change at the time of the next renewal upon prior written notice.'
      lastVerified: 2026-11-19
    - topic: billing.free-trials
      tier: great
      reason: 'Its 30-day trial doesn’t turn into a paid plan: afterwards you keep your data on the free version.'
      sources:
        - url: https://help.keeper.io/article/255-whats-included-in-the-free-plan
          quote: 'After the 30-day free trial, you can still access your data in the free version on the same mobile device without any paid features.'
      lastVerified: 2026-11-19
