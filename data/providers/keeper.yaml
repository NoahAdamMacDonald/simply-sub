      status: not-stated
      reason: 'Its terms and billing help say plans are billed each year in advance, but not that it reminds you before renewing.'
      pages:
        - https://www.keepersecurity.com/legal/terms-of-use/?s=saas
        - https://help.keeper.io/article/263-where-do-i-manage-my-keeper-subscription-billing
      lastVerified: 2026-11-19
    - topic: billing.fees
      tier: neutral
      reason: 'Beyond the price and taxes, its terms add interest on late payments and its costs of collecting them.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Customer shall be responsible for any costs (including attorney fees) reasonably incurred by Keeper related to its efforts to collect any missing or late payments for Undisputed fees.'
      lastVerified: 2026-11-19
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Switching plans goes through its support team, and its pages don’t say what happens to the time you’ve paid for.'
      pages:
        - https://help.keeper.io/article/263-where-do-i-manage-my-keeper-subscription-billing
        - https://www.keepersecurity.com/legal/terms-of-use/?s=saas
      lastVerified: 2026-11-19
    - topic: legal.disputes
      tier: neutral
      reason: 'Outside Europe and Japan, disputes go to a private referee (an arbitrator) in Delaware. Its terms don’t take away group lawsuits.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'EXCEPT FOR DISPUTES, CLAIMS OR CONTROVERSIES ARISING OUT OF OR RELATING TO OWNERSHIP, VALIDITY OR INFRINGEMENT OF INTELLECTUAL PROPERTY RIGHTS, ANY DISPUTE, CONTROVERSY OR CLAIM ARISING OUT OF OR RELATING TO THIS AGREEMENT SHALL BE RESOLVED BY BINDING ARBITRATION ADMINISTERED BY THE AMERICAN ARBITRATION ASSOCIATION ("AAA") IN ACCORDANCE WITH ITS COMMERCIAL ARBITRATION RULES THEN IN EFFECT.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'THE ARBITRATION SHALL TAKE PLACE IN WILMINGTON DELAWARE BEFORE A SINGLE ARBITRATOR.'
      action:
        name: 'Its dispute clause (SaaS Terms, section 12)'
        url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
      lastVerified: 2026-11-19
    - topic: legal.disputes
      regions: [GB, IE, DE, FR, NL, ES, IT]
      tier: good
      reason: 'In Europe you contract with its Irish company, and disputes go to Ireland’s courts, not a private referee.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'THIS SECTION 12(C) APPLIES ONLY WHERE THE APPLICABLE KEEPER ENTITY IS KEEPER SECURITY, INC.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Keeper Security EMEA Limited Ireland'
      lastVerified: 2026-11-19
    - topic: legal.terms-changes
      tier: neutral
      reason: 'Changes to its terms start only when you next buy or renew, and can’t take away important rights, but it doesn’t say it will tell you. Privacy changes come by email or a notice first.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Notwithstanding the foregoing, Keeper may modify or replace this Agreement, with any such changes taking effect at a subsequent purchase or renewal, provided they do not materially diminish Customer rights.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: 'If we make any material changes we will notify you by email or by means of a notice on this Site prior to the change becoming effective.'
      lastVerified: 2026-11-19
    - topic: legal.account-closure
      tier: neutral
      reason: 'It can cut you off at once, without warning, for some breaches of its terms. It refunds unused time only if the breach was its own.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'In the event of a breach of any obligations in this section 6 by Customer, Keeper may immediately and without notice suspend or terminate Customer access to the Services.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: "In the event of a Termination due to Keeper's material breach, any prepaid unused fees will be refunded to the Customer."
      lastVerified: 2026-11-19
    - topic: legal.content-rights
      tier: great
      reason: 'What you store counts as your confidential information, which it may use only to provide the service.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Customer Data shall be considered Customer Confidential Information.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: "not to use or permit others to use, the other Party's Confidential Information except as is reasonably necessary to perform its obligations or exercise its rights under this Agreement"
      lastVerified: 2026-11-19
