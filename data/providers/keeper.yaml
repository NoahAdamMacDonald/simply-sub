# General features, read 2026-11-19. Platforms: "Keeper works on every smartphone, tablet and computer." (System
# Requirements): Windows, macOS and Linux desktop apps, iOS and Android apps, its Web Vault and its browser extension
# (Chrome, Safari, Firefox, Edge, Opera, Brave). Sign-in: a Master Password, then 2FA by "Text Message or an
# Authenticator app" (How can I turn on 2FA…) or a security key (How can I set up a security key?); "RSA and DUO Push
# option are only available to business users". Support: "Email, live chat and phone customer support" (Keeper
# Unlimited, its personal page) and "24/7 customer support" (the pricing page); Keeper Free's "Support will be limited
# to our FAQ, Troubleshooting Guide, and User Guides". App languages: its site's language menu (English, Español,
# Deutsch, Français, Nederlands, Português (BR), 日本語, 中文 (简体), Polski, Italiano, Русский, العربية; Dutch, Polish
# and Russian have no registry value). Closed source: "The Services and the source code which it contains, is the
# property of Keeper" (its terms). No pause; no parental controls (a Family plan's members have private vaults).
features:
  platforms: [windows, macos, linux, android, ios, web, browser-extension]
  account.sign-in: [password, totp, sms, security-key]
  support.channels: [email, chat, phone, 24-7]
  languages.interface: [en, es, de, fr, pt, ja, zh, it, ar]
  software.open-source: proprietary

# Password manager features, read 2026-11-19 (its personal page's plan cards, the pricing page, What's included in the
# free plan?, and the user guides named):
# - Items (Record Types, "available for all consumer and business customers"): Login, Payment Card, Contact, Address,
#   Bank Account, File Attachment, Photo, Driver's License, Birth Certificate, Database, Server, Health Insurance,
#   Membership, Secure Note, Passport, Identity Card, Software License, SSH Key and WiFi; passkeys ("Storing passkeys in
#   your Keeper Vault") and 2FA codes in records ("Simply scan the QR code or enter the secret key into Keeper"). Custom
#   record types are for business customers. Keeper Free: "Limited to ten records for passwords and passkeys", and
#   "up to two (2) vault records containing time-based one-time passcode (TOTP) two-factor authentication codes".
# - Health: Security Audit rates each password's strength and reuse; breached passwords need the BreachWatch add-on
#   (not on Free: "Secure add-ons available such as Secure File Store and BreachWatch" is ✅ only for paid).
# - Sharing: records with other Keeper users with permissions ("can edit, can share, can edit & share, view only and
#   transfer ownership"), and One-Time Share links to anyone ("Share links automatically expire at a time of your
#   choosing"); Family adds "Unlimited shared folders, records and permissions". Free: "Sharing" ❌.
# - Import: CSV ("Import Text File (.csv, .xls, .tsv)"), Keeper JSON, KeePass .kdbx ("Keeper supports the ability to
#   import directly from encrypted Keepass files"), other managers (1Password, Bitwarden, Dashlane, LastPass, RoboForm
#   and more), and Apple Passwords on iOS 26 ("Export Data to Another App": Credential Exchange).
# - Export: "CSV", "JSON", "PDF" and "Encrypted KeePass (.kdbx)" ("This is available to all Personal and Family plan
#   users."); Free can't ("do not have the ability to back up, restore, share or export their Keeper Records outside of
#   that device"). No page says which formats carry 2FA secrets, so authenticator.export is left out.
# - Emergency access: "You can designate up to five emergency contacts and decide how much time should pass before their
#   access is granted." (Unlimited's card: "Emergency access"); not on Free.
# - Offline: "Offline access is available with all Keeper plans (except "Keeper Free")".
# - End-to-end: "Your vault contents remain fully encrypted on your device and are inaccessible to Keeper or its staff
#   under our zero knowledge security model." (its privacy policy): passwords. File storage is vault records (a perk on
#   Family, an add-on otherwise), not a files service.
# - Keeper Free is its mobile app alone ("Web Vault Access" and "Browser Extension Access" ❌), so it imports only what
#   the mobile apps take (Google's CSV on Android, Apple Passwords on iOS); its free plan table doesn't list Security
#   Audit, so no password health is claimed for it.
plans:
  - id: keeper.free
    name: Free
    link: https://www.keepersecurity.com/personal.html
    features:
      support.channels: []
      password-manager: true
      password-manager.item-types: [login, totp, passkey, credit-card, identity, secure-note]
      password-manager.import: [csv, cxf]
      password-manager.emergency-access: false
      password-manager.offline: false
      authenticator.included: true
      authenticator.import: [otpauth]
      encryption.end-to-end: [passwords]
    notes: 'One mobile device and up to 10 records (2 with 2FA codes), with no sync, backup, sharing or export.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://www.keepersecurity.com/personal.html
  - id: keeper.unlimited
    name: Unlimited
    link: https://www.keepersecurity.com/pricing/personal-and-family.html
    addOnIds: [keeper.breachwatch, keeper.concierge]
    features:
      password-manager: true
      password-manager.item-types:
        [
          login,
          totp,
          passkey,
          credit-card,
          identity,
          secure-note,
          bank-account,
          ssh-key,
          wifi,
          database,
