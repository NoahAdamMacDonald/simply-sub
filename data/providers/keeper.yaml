# Researched by hand on 2026-11-19 (the full catalog run, passwords batch 2), read with Edge from Canada: Keeper's
# personal pricing page (keepersecurity.com/pricing/personal-and-family.html) in each currency of its picker, its
# personal page, about, security and vulnerability disclosure pages, its legal centre's tabs (SaaS Terms of Use,
# Privacy Policy, Usage Guidelines and Information, Website Terms of Use, Legacy Terms) and Cookie Policy, its help
# centre (help.keeper.io, 23 articles) and its user guides (docs.keeper.io, 23 pages). Its checkout asks for an email
# first ("First, verify your email."), so it wasn't opened further.
# Pricing: the page has a currency picker ("USD ($)", "CAD ($)", "EUR (€)", "GBP (£)", "JPY (¥)", "AUD (A$)"). The
# currency picked sets the price list wherever the reader is (each read through Vancouver and Calgary exits (Canada),
# and US, UK, Irish, German, French, Dutch, Spanish, Italian, Australian and New Zealand exits, and from this machine):
# Personal (Keeper Unlimited) "$42.99 billed annually", "CA$58.90", "€51.16", "£36.84", "AU$67.57"; Family "$91.99",
# "CA$126.10", "€109.47", "£88.28", "AU$148.37"; its help centre says the same in US dollars ("Keeper Unlimited at
# $42.99/yr or Keeper Family Plan at $91.99"). Two exceptions: Ireland's page in euros shows "€52.88" and "€113.15", and
# the page's default view (before a currency is picked) adds a country's VAT to US dollars in some countries ($51.16 in
# Germany, $51.59 in France, $52.02 in the Netherlands and from this machine); the picked lists are stored. Each region
# gets the currency its own page uses or offers: Canada CAD (its default through Canadian exits), the US USD, the UK
# GBP, Ireland EUR (its default), the other euro countries EUR (their page defaults to US dollars), Australia AUD
# ("*Includes GST"), New Zealand USD (no NZD in the picker). The German page says its euro prices are before VAT
# ("51,16 € jährliche Zahlweise *zzgl MwSt"). No first-term offer is in the prices (a pop-up offers "30% OFF 1-Yr
# Personal & Family Plans!", not stored). Billing: "Subscription Fees are billed and collected annually in advance."
# Region checklist for CA and US, 2026-11-19: 1. language paths only (/en_GB/, /de_DE/…); 2. the currency picker, every
# currency read; 3. the page's data holds no prices (its script loads them); 4. the checkout asks for an email first;
# 5. its help article on prices (US dollars); 6. Edge from Canada and through exits (a Toronto exit got "403
# Forbidden"); 7. no bill offered.
# Plans: Keeper Free, Keeper Unlimited (the pricing page's "Personal") and Family. Its checkout offers a "Subscription
# Term" and gifts come in "1-Year or 3-Year" terms, but no page shows a longer term's price, so only the year is
# stored. Student, military and medical discounts are offers. Business plans are out of scope.
# Add-ons (its pricing page): BreachWatch (Personal and Family, each priced), Secure File Storage ("Starting at
# $13.99/year": tiers not priced on any page read, so left out) and Concierge Service.
# Bundles: none (its help mentions "Plus bundles", which no page read prices). Official resellers: its partner and
# affiliate programmes are for businesses and referrals; no page names a shop selling personal plans. App stores
# (Apple, Google Play, Microsoft Store) bill it: partners, not listed.
# Free use: Keeper Free ($0, one mobile device, 10 records), and a 30-day trial that falls back to it.

id: keeper
name: Keeper
aliases: [keeper security, keeper password manager]
website: https://www.keepersecurity.com
# Its help centre and user guides, whose articles state its billing, features and policies.
domains: [help.keeper.io, docs.keeper.io]
category: passwords
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help article on cancelling: deleting the account in its apps cancels; a web purchase's auto-renewal is otherwise
# turned off by its support team (How do I request a refund…).
cancelUrl: https://help.keeper.io/article/264-how-do-i-cancel-my-keeper-subscription
sources: { pricing: https://www.keepersecurity.com/pricing/personal-and-family.html }
# Ways to pay (M11.5), read 2026-11-19: cards (its terms), PayPal (its checkout, per its help) and the app stores (Apple,
# Google Play, Microsoft Store). No page names a card network in words, so no acceptedNetworks.
paymentMethods:
  - methods: [card]
    page: 'SaaS Terms of Use'
    url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
    quotes:
      - 'Payment for the Services may be made by a valid credit card, debit card or charge card (collectively referred to as "Payment Method") as accepted by Keeper via its Website or as otherwise agreed in an Order.'
  - methods: [paypal, app-store]
    page: 'How can I change the credit card info that my subscription is getting billed to?'
    url: https://help.keeper.io/article/192-how-can-i-change-the-credit-card-info-that-my-subscription-is-getting-billed-to
    quotes:
      - 'If you purchased using Paypal via our checkout page, you can login to your Paypal account and change your payment card.'
      - 'If you purchased via the App Stores, you would need to change your payment card under your Apple ID/Google Play profile.'
# Renewal day (M11.5), read 2026-11-19: "Subscription Fees are billed and collected annually in advance." and "A standard
# annual billing cycle is 365 days." (its terms, for adding users): no day named.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.keepersecurity.com/legal/terms-of-use/?s=saas
    - https://help.keeper.io/article/263-where-do-i-manage-my-keeper-subscription-billing
  lastVerified: 2026-11-19
# Owner (M11.2), read 2026-11-19: its privacy policy names the company; its terms give the entity and address for
# buyers outside Europe and Japan (Europe's is Keeper Security EMEA Limited in Cork). Its about page: "Keeper is backed
# by Insight Partners, a leading, global venture capital and private equity firm." (and Summit Partners as a "Strategic
# Investor"); no page gives shares or a listing: private, no stock.
notes: Billed once a year. Buyers in Europe contract with Keeper Security EMEA Limited in Ireland; others with Keeper Security, Inc.
owner:
  name: Keeper Security, Inc.
  page:
    name: Privacy Policy
    url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
  quotes:
    - 'Keeper Security, Inc. ("Keeper") is committed to protecting your privacy.'
  country:
    code: US
    page:
      name: SaaS Terms of Use
      url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
    quotes:
      - 'Other Keeper Security, Inc. 311 W. Monroe Street, Suite 406, Chicago, IL 60606, United States'
    lastVerified: 2026-11-19
  lastVerified: 2026-11-19

