      password-manager.health: [weak, reused]
      password-manager.sharing: [share-to-user, share-link, link-expiry, role-permissions]
      password-manager.import: [csv, json, kdbx, cxf, other-managers]
      password-manager.export: [csv, json, kdbx, encrypted]
      password-manager.emergency-access: true
      password-manager.offline: true
      authenticator.included: true
      authenticator.import: [otpauth]
      encryption.end-to-end: [passwords]
    notes: 'Unlimited devices, sync and sharing. Dark web alerts (BreachWatch) and file storage are add-ons. A 30-day free trial.'
    prices:
