      sources:
        - url: https://www.keepersecurity.com/security.html
          quote: 'Keeper partners with third-party experts such as NCC Group, CyberTest and independent security researchers to perform quarterly pen testing against all solutions and systems.'
        - url: https://www.keepersecurity.com/security.html
          quote: 'For these reasons, we have partnered with Bugcrowd to manage our Vulnerability Disclosure Program (VDP) and bug bounty program.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=privacy
          quote: "Keeper's security practices and controls are independently audited and certified, including SOC 2 and ISO 27001"
      lastVerified: 2026-11-19
    - topic: service.account-sharing
      tier: bad
      reason: 'Its terms say its service isn’t to be shared with others. Family gives each of its 5 people a private vault of their own instead.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: "Unless expressly agreed in writing, all Services furnished to Customer under this Agreement shall be used by Customer only for Customer's internal business purposes, shall not be shared with third parties nor reproduced or copied in whole or in part."
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=userGuidelines
          quote: 'You may not share your Master Password with third parties, including Keeper support staff.'
      lastVerified: 2026-11-19
    - topic: service.software-control
      status: not-stated
      reason: 'Its terms say it regularly updates its apps, but not whether they update themselves or change anything else on your device.'
      pages: [https://www.keepersecurity.com/legal/terms-of-use/?s=saas]
      lastVerified: 2026-11-19
    - topic: other.notable
      title: Stored files can go 90 days after a plan lapses
      tier: neutral
      reason: 'If you stop paying and don’t renew within 90 days, it may delete the files you stored, after emailing you. Download them or renew to keep them.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=userGuidelines
          quote: 'If a paid subscription expires and is not renewed within ninety (90) days, Keeper Security reserves the right to delete any Keeper Records in the account that contain files (such as documents, photos or videos).'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=userGuidelines
