# Terms and policies (BLUEPRINT §4.10), read 2026-11-19 with Edge: its SaaS Terms of Use (the terms for anyone "PURCHASING
# THROUGH AN ONLINE ORDERING PLATFORM, DOWNLOADING ANY SOFTWARE", personal plans included, and its apps' licence:
# section 2), its Privacy Policy and Cookie Policy, its Usage Guidelines and Information (which the terms name for
# support, and which hold Free's limits and the inactivity rule), its Website Terms of Use (the website only: no topic),
# its security and vulnerability disclosure pages, and its help centre's billing, refund, cancelling, export and free
# plan articles. Its DPA (data processing for business customers), Partner Terms and Service Level Objectives aren't
# for personal plans. The sign-up form wasn't opened beyond its email field. Its terms are written for businesses
# ("Customer") and apply to individuals too.
