      status: not-stated
      reason: 'Its terms don’t say it may remove features from a paid plan, and it promises fixes and upgrades.'
      pages: [https://www.keepersecurity.com/legal/terms-of-use/?s=saas]
      lastVerified: 2026-11-19
    - topic: legal.inactivity
      tier: good
      reason: 'It may delete a free account left unused for 12 months, after an email warning. Paid accounts aren’t included.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=userGuidelines
          quote: 'If a Free User account remains inactive for twelve (12) consecutive months, Keeper Security reserves the right to terminate and delete the account.'
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=userGuidelines
          quote: 'Prior notice will be sent to the email address associated with the account.'
      lastVerified: 2026-11-19
    - topic: legal.licence
      tier: neutral
      reason: 'Its terms, written for businesses too, limit use to your own purposes, and forbid taking its apps apart or testing their security outside its bug bounty.'
      sources:
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: "Unless expressly agreed in writing, all Services furnished to Customer under this Agreement shall be used by Customer only for Customer's internal business purposes, shall not be shared with third parties nor reproduced or copied in whole or in part."
        - url: https://www.keepersecurity.com/legal/terms-of-use/?s=saas
          quote: 'Customer further agrees not to reverse engineer, modify, hack, perform penetration or load testing, circumvent any security or licensing protocols, attempt to gain access to any unauthorized systems/data, translate, resell, distribute, create derivative works from, exploit, encumber or crack any portion of the Services; nor to interfere with or disrupt the integrity or performance of the Services.'
      lastVerified: 2026-11-19
    - topic: security.practices
      tier: good
