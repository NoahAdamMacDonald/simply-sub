    - topic: billing.refunds
      tier: good
      reason: 'You get your money back if you ask within 5 days of buying or of a yearly renewal, once a season at most. After that, and for monthly payments, there are no partial refunds.'
      sources:
        - url: https://support.mlb.com/s/article/What-is-the-refund-policy?language=en_US
          quote: 'MLB will refund the purchase price you paid for a subscription Service (e.g., MLB.TV or MLB+) offered via the MLB Digital Properties if you make a refund request on the applicable MLB Digital Property via the account management tools in the Audio/Video Subscriptions section of your MLB.com account or via email to subscriptioncancel@mlb.com within five (5) days of your initial purchase or within five (5) days of any annual automatic renewal date.'
        - url: https://support.mlb.com/s/article/What-is-the-refund-policy?language=en_US
          quote: 'In no event will MLB grant you more than one (1) refund during any given Major League Baseball season or provide partial or pro-rated refunds.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
