    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it thinks reasonably necessary, including for its business, names no periods, and may keep it longer.'
      sources:
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'We retain your personal information for as long as reasonably necessary and proportionate to achieve the purposes and uses set out in this Privacy Policy, as authorized by law, and to meet legal, taxation, accounting, risk management or business requirements.'
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'These retention periods may be extended where circumstances so require or until a particular query, investigation or dispute is fully resolved.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: poor
      reason: 'To close your account and delete your information you must phone customer service, and it keeps what it needs for its records. US state residents can ask too, but it may refuse “for certain other reasons”.'
      sources:
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'If you want to review or revise other personal information you have provided to us, or to close your account(s) and have us delete the applicable account personal information (except what is needed for record-keeping purposes) call Customer Service at 866-244-2291 (within the United States) or 1-315-203-6761 (outside the United States).'
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'We will not delete your information if we need it to protect the security, integrity or functionality of our operations and systems, to comply with legal obligations, to provide you with a good or service you requested, or for certain other reasons.'
      action:
        name: 'How to ask (its privacy policy)'
        url: https://www.mlb.com/official-information/privacy-policy
      lastVerified: 2026-11-13
