# Researched by hand on 2026-11-13 (M11.15, streaming batch 8), in the off-season. mlb.com refuses this machine's
# address ("Error 403 Access Denied"), so its pages were read with Edge through a Canadian exit and through a US exit
# (most US exits were refused too), and again through a UK, Australian, German, French and Dutch exit; its help centre
# (support.mlb.com, every MLB.TV and billing article its sitemap lists) in Edge from Canada. Pages, each quoted where
# it's used:
# Pricing, the off-season (read 2026-11-13): mlb.com's subscribe page sells US buyers "MLB.TV Offseason $29.99
# /one-time", "MLB+ $59.99 /yearly" and "MLB+ $5.99 /monthly" (its page data: "currencyCode":"USD"), and sends every
# other country to /subscribe/offseason/intl, which sells only the Offseason pass; the all-packages page, read from
# Canada, the UK, Australia, Germany, France and the Netherlands, offers MLB+ too (BUY NOW, to the same MLB+ page with
# the same cards and USD data). "All online subscription products and MLB.com Shop orders are transacted in U.S.
# Dollars." (How are currency exchange issues handled?), so every country is priced in USD. The season's plan: "The
# MLB.TV Seasonal plan is $149.99/season for a full season of access to MLB.TV. The MLB.TV Monthly plan is
# $29.99/month." (mlb.com's MLB.TV on ESPN page, through a US exit), the regular price both renew at ("Both plans will
# automatically renew before each season on or around March 1 at the then-current price"); in-season price drops are
# offers ("MLB.TV seasonal offering will go through in-season price drops"), and ESPN Unlimited subscribers' $134.99 is
# a member price, left out. No page read today shows the season's price for buyers outside the US ("International
# subscribers will continue to buy and stream through MLB").
# Not listed: the MLB.TV Offseason pass ($29.99, "will expire on or about March 23, 2027 and will not be automatically
# renewed": a one-time pass, Sportsnet+'s French season pass precedent); the in-market club streams of the 2026 season
# (Dbacks.TV, Padres.TV and others, "$99.99 per season or $19.99 per month", and the bundle with MLB.TV, "$199.99 per
# season or $39.99 per month", A complete guide to watching MLB.TV in 2026, March 2026), sold only inside a club's home
# territory and not on sale now; MLB.TV Single Team, which only the terms' billing section names ("MLB.TV Single
# Team") and no page sells today; and the regional networks the all-packages page links (Detroit SportsNet, SNLA+, SNY,
# MASN+), other companies' services.
# Region checklist, 2026-11-13: 1. no country paths (one site; /es pages translate); 2. no picker; 3. the page data
# names USD everywhere; 4. checkout not opened (commerce.mlb.com needs an account); 5. its currency and tax articles;
# 6. Edge through exits (Ireland's, New Zealand's, Spain's and Italy's were all refused), a plain fetch through the same
# exits; 7. no bill offered.
# Bundles: in the US, new MLB.TV buyers buy it through ESPN ("New for the 2026 season, MLB.TV is now available to
# purchase and stream through the ESPN App in the US market"), with a month of ESPN Unlimited free: ESPN's offer, not a
# bundle MLB sells. Official resellers: none; ESPN, Apple, Google, Roku and Amazon bill it themselves, and T-Mobile gives
# it to its customers: partners, noted, not listed.
# Features, read 2026-11-13: video: "The MLB.TV media player supports both SD and HD quality streams" with no
# resolution, so 720p (inferred, the Crunchyroll and Hayu precedent); streams at once: no page says how many ("Logged In
# Too Many Times" only says the account "is being used to access in multiple locations"), so every plan waits
# (awaitingRequiredFeatures); ads: no page says whether games carry ads, so false; MLB Network, "Live MLB Network access
# within the US", is a live TV channel; MiLB games and MLB Big Inning stream live; "player features, documentaries and
# classic programs" on demand (How Do I Access Featured On Demand Content?). Blackouts: games are blacked out in their
# home television territory and for national partners' exclusive games (plan notes, quoted from its blackout notice).
# No pause ("There is no option to pause ESPN Unlimited or MLB.TV during or after the MLB season"); no parental controls
# on any page read. App languages: its sites' language menu ("Español", "日本語", "한국어").
# Free use: none: MLB.TV and MLB+ are paid; MLB.com's free highlights are its news site's, and the free spring-training
# games of 2026 were a promotion for account holders.

# Coverage: mlb-tv.all-teams in CA, GB, AU, DE, FR, NL: MLB sells MLB.TV to buyers outside the US in season (its
# soldIn, quoted from the MLB.TV on ESPN page), but in the off-season (read 2026-11-13) its pages sell them only the
# Offseason pass and MLB+, and no page states the season's price outside the US. Read /live-stream-games/subscribe
# through each country in season, add the prices and take the country out of soldIn.

# Coverage: mlb-tv.mlb-plus in CA, GB, AU, DE, FR, NL: outside the US, MLB+ comes without MLB Network ("*MLB Network
# streams are available to subscribers in the U.S. ONLY (not available internationally).", MLB+ FAQs), so it's
# mlb-tv.mlb-plus-international there.

# Coverage: mlb-tv.mlb-plus-international in US: the US buys mlb-tv.mlb-plus, with MLB Network.

id: mlb-tv
name: MLB.TV
website: https://www.mlb.com/live-stream-games
category: streaming
spendCategory: streaming
# No availableIn: no page lists the countries it sells in. Ireland, New Zealand, Spain and Italy weren't read (mlb.com
# refused every exit there), so they're unknown.
billingCurrency: { US: USD, CA: USD, GB: USD, AU: USD, DE: USD, FR: USD, NL: USD }
cancelUrl: https://support.mlb.com/s/article/How-to-Cancel-your-Subscription?language=en_US
sources: { pricing: https://www.mlb.com/live-stream-games/subscribe/mlbplus }

# Owner (M11.2), read 2026-11-13: MLB's own MLB.TV on ESPN page; its terms and privacy policy are MLB Advanced Media,
# L.P.'s (New York), the league's digital company. Major League Baseball is owned by its 30 clubs, not listed: no
# shares.
owner:
  name: Major League Baseball (MLB Advanced Media, L.P.)
  page:
    name: MLB.TV on ESPN
    url: https://www.mlb.com/live-stream-games/partners/espn
  quotes:
    - "MLB.TV is Major League Baseball's out-of-market direct-to-consumer product, available this season in the ESPN App in the US market."
  country:
    code: US
    page:
      name: About MLB
      url: https://www.mlb.com/official-information/about-mlb
    quotes:
      - 'Major League Baseball (MLB) is the most historic professional sports league in the United States and consists of 30 member clubs in the U.S. and Canada, representing the highest level of professional baseball.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13

