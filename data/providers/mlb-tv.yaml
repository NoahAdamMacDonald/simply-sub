# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 through a Canadian exit: its Terms of Use Agreement ("LAST
# UPDATED: MARCH 11, 2025", MLB Advanced Media, L.P.'s, New York law, with an arbitration agreement), which every MLB
# product's buyer accepts ("By signing in, I understand and agree to be bound by the MLB.com Terms of Use and Privacy
# Policy.", its sign-in page); its Privacy Policy ("updated as of July 6, 2026"); and its help centre's refund,
# cancelling, MLB+, account sharing, device and payment articles, and the MLB.TV on ESPN page. Not read: the sign-up
# form past the email step (it opens only from the sign-in page's script), the checkout (commerce.mlb.com needs an
# account), ESPN's terms for MLB.TV bought there, the app stores' terms, and the California notice the policy links.
# Its terms take a perpetual, irrevocable licence over what you post (legal.content-rights isn't a streaming topic).
# Calibrated against Sportsnet+ and Curiosity Stream.
policies:
  links:
    - name: 'MLB.com Terms of Use'
      url: https://www.mlb.com/official-information/terms-of-use
    - name: 'MLB Privacy Policy'
      url: https://www.mlb.com/official-information/privacy-policy
    - name: 'MLB.TV on ESPN'
      url: https://www.mlb.com/live-stream-games/partners/espn
    - name: 'Account Settings'
      url: https://support.mlb.com/s/article/Account-Settings?language=en_US
    - name: 'What is the refund policy?'
      url: https://support.mlb.com/s/article/What-is-the-refund-policy?language=en_US
    - name: 'How to Cancel your Subscription'
      url: https://support.mlb.com/s/article/How-to-Cancel-your-Subscription?language=en_US
    - name: 'MLB+ FAQs'
      url: https://support.mlb.com/s/article/MLB-plus-faq?language=en_US
    - name: 'Can I Share My Account With Others?'
      url: https://support.mlb.com/s/article/Can-I-Share-My-Account-With-Others?language=en_US
    - name: 'Desktop & Laptop | Logged In Too Many Times'
      url: https://support.mlb.com/s/article/Desktop-and-laptopt-logged-In-Too-Many-Times?language=en_US
    - name: 'How are currency exchange issues handled?'
      url: https://support.mlb.com/s/article/How-are-currency-exchange-issues-handled?language=en_US
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use its sites and apps for analytics and may buy more data about you, such as your interests, from other companies. You can block Google Analytics only browser by browser.'
      sources:
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'We may also obtain certain data, such as demographic data or information about your interest and preferences, from third parties, as set forth in Sections 3 and 7(k) below.'
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'As with many websites, we use Google Analytics to understand how you and other visitors engage with MLB Properties'
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: "If you don't want Analytics to be used in your browser, you can install the Google Analytics browser add-on"
      action:
        name: 'Its privacy choices (privacy policy)'
        url: https://www.mlb.com/official-information/privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It says it has sold or shared your information in the past year, and passes a scrambled copy of your email to ad companies and social networks. Only some US states’ residents get a full opt-out; elsewhere, opting out is partial.'
      sources:
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'MLB has disclosed, sold or shared personal information to parties for a business or commercial purpose in the past 12 months.'
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'Instead, a unique code (hashed email address) is disclosed to the applicable Social Network in order for that identifier to be matched against existing users of the relevant Social Network and to identify potentially relevant audiences for targeted advertising.'
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'You have the right to direct us at any time to not sell your personal information or share your personal information for cross-context behavioral advertising.'
      action:
        name: 'Do Not Sell or Share My Personal Information'
        url: https://www.mlb.com/official-information/privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Ad companies track what you do on its sites and elsewhere to target ads, even with methods your browser can’t block. It ignores Do Not Track, and the opt-outs it points to cover only some ad companies.'
      sources:
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: "A permitted network advertiser may use cookies, web beacons or similar technologies to collect information about your interaction with the MLB Properties in order to tailor certain advertisements and content delivered within the MLB Properties and on other websites within such network advertiser's ad network."
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'Please keep in mind that your web browser may not permit you to block the use of these non-cookie technologies, and those browser settings that block cookies may have no effect on such techniques.'
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'we do not alter our Website’s data and information collection and use practices when we receive a “Do Not Track” signal from your browser.'
      action:
        name: 'Its ad choices (privacy policy)'
        url: https://www.mlb.com/official-information/privacy-policy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      regions: [GB, EU]
      tier: good
      reason: 'In the UK and Europe, it asks before setting cookies, so ad tracking depends on your consent.'
      sources:
        - url: https://www.mlb.com/official-information/privacy-policy
          quote: 'Customers within the UK and EEA will be asked for consent prior to the setting of cookies.'
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you write or post trains AI.'
