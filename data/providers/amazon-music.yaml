# Terms and policies, read 2026-11-10 (M11.15) from Canada: the Amazon Music Terms of Use (one document for every
# country, last updated September 30, 2026), its service provider page (which names, for Canada, the Conditions of
# Use, the Privacy Notice, Prime's terms for Prime Music, Alexa's terms and Audible Canada's), amazon.ca's and
# amazon.com's Conditions of Use (the US's through a US exit, as US ratings), and its help on cancelling, switching
# plans, authorized devices and the Family plan. Amazon's Privacy Notice is rated once as a shared document
# (data/policies/amazon-privacy.yaml). Audible's conditions, for the audiobooks, are read when Audible joins (books).
# Calibrated against Prime Video's (the same Conditions of Use), Spotify's, Deezer's and Tidal's grades. Not rated:
# rights over your content and its apps' licence (not topics for music).
policies:
  shared: [amazon-privacy]
  links:
    - name: 'Amazon Music terms of use'
      url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
    - name: 'Conditions of use (Canada)'
      url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
    - name: 'Conditions of use (US)'
      url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
    - name: 'Cancel your Amazon Music Unlimited subscription'
      url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GCRZL3F2UZMNP3T3
    - name: 'Authorized device limits'
      url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G45Q7B98YTXXBDNB
    - name: 'How the Family plan works'
      url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GWGVV6VBWBXHMHQB
    - name: 'Amazon Music Unlimited'
      url: https://www.amazon.ca/music/unlimited
  ratings:
    - topic: privacy.children
      tier: neutral
      reason: 'Under-18s may use it only with a parent or guardian, but its free plan’s ads may be personalized, and it doesn’t say whether minors’ are.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'If you are under 18 years of age, or the age of majority in your location, you may use the Services only with involvement of a parent or guardian.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'This service may contain advertising, and advertising may be personalized as described in the Interest-Based Ads notice applicable to you.'
      lastVerified: 2026-11-10
    - topic: billing.cancellation
      tier: good
      reason: 'You cancel online at any time in your Amazon Music settings, which may offer a pause first, and keep your plan to the end of the term.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'you may cancel your Unlimited Plan at any time with effect to the end of its term by visiting your Amazon Music Settings'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GCRZL3F2UZMNP3T3
          quote: 'If your plan is eligible, you can choose to pause your monthly subscription instead of cancelling.'
      lastVerified: 2026-11-10
    - topic: billing.refunds
      tier: neutral
      reason: 'No money back, even if you didn’t use it, but you keep your plan until it ends.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'Payment, if any, is non-refundable, even if you did not use the Services.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GCRZL3F2UZMNP3T3
          quote: 'You can use Amazon Music Unlimited until your plan ends.'
      lastVerified: 2026-11-10
    - topic: billing.price-changes
      tier: great
      reason: 'It tells you ahead of a new price, which never changes the term you’ve paid for, so you can cancel before it starts.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'We will notify you in advance before any price changes to your Unlimited Plan become effective.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'HOWEVER, ANY INCREASE IN THE FEE WILL BE COMMUNICATED TO YOU IN ADVANCE AND WILL NOT AFFECT THE COST OF YOUR UNLIMITED PLAN DURING ITS TERM.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'you may cancel your Unlimited Plan at any time with effect to the end of its term by visiting your Amazon Music Settings'
      lastVerified: 2026-11-10
    - topic: billing.free-trials
      tier: neutral
      reason: 'Its 30-day trial may need a payment method, and turns into a paid plan unless you cancel before it ends, which you can do at any time. Its terms don’t say whether it reminds you first.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'Some Trial Plans may, as communicated to you, automatically convert to a paid plan unless you cancel before the end of the Trial Plan.'
        - url: https://www.amazon.ca/music/unlimited
          quote: 'Free for 30 days. Cancel anytime.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'you may be required to be logged in to the account and have a valid payment method associated with it'
      lastVerified: 2026-11-10
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say a plan renews on its own unless you turn that off, into the plan Amazon picks as closest to yours, but not that it reminds you first.'
      pages: [https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010]
      lastVerified: 2026-11-10
    - topic: billing.fees
      tier: great
      reason: 'It names no fees beyond the price, only taxes.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'Unless legally required, the price stated does not include any taxes that we may charge.'
      lastVerified: 2026-11-10
    - topic: billing.plan-changes
      tier: neutral
      reason: 'Moving up starts at once and charges the new price, and whether you get credit for the time left depends. Moving down starts when your term ends.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'If you upgrade your Unlimited Plan, the upgrade will take effect immediately, we will charge you the applicable fee, and the term of your Unlimited Plan may be extended, as described at the time you upgrade your Unlimited Plan.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'If you downgrade your Unlimited Plan, unless otherwise specified, the downgrade will take effect at the end of the term of your existing Unlimited Plan.'
      lastVerified: 2026-11-10
    - topic: legal.disputes
      tier: bad
      reason: 'Disputes follow Amazon’s Conditions of Use: private arbitration, one person at a time, with no class actions and no way to opt out, unless your province’s law lets you go to court.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010
          quote: 'Any dispute or claim arising from or relating to the Agreement or the Services is subject to the dispute resolution, governing law, disclaimer of warranties and limitation of liability, and all other terms in the Amazon Conditions of Use applicable to you.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
          quote: 'Any dispute or claim relating in any way to your use of any Amazon Service, or to any products or services sold or distributed by Amazon or through Amazon Services will be resolved by binding arbitration, rather than in court'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
          quote: 'We each agree that any dispute resolution proceedings will be conducted only on an individual basis and not in a class, consolidated or representative action.'
      lastVerified: 2026-11-10
    - topic: legal.disputes
      regions: [US]
      tier: bad
      reason: 'In the US too, disputes go to private arbitration, one person at a time, with no class actions and no way to opt out.'
      sources:
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
          quote: 'YOU AND WE AGREE THAT ANY DISPUTE OR CLAIM RELATING IN ANY WAY TO YOUR USE OF ANY AMAZON SERVICE, OR TO ANY PRODUCTS OR SERVICES SOLD OR DISTRIBUTED BY AMAZON OR THROUGH AMAZON.COM, WILL BE RESOLVED BY BINDING ARBITRATION RATHER THAN IN COURT.'
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
