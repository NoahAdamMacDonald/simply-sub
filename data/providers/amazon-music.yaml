# Researched by hand on 2026-11-09 and 2026-11-10 (M11.15, the music category, part 4), as a provider of its own with
# the Prime member prices as add-ons of Amazon Prime (the owner's choice of 2026-11-09, data/providers/
# amazon-prime-video.yaml). Amazon.ca's pages were read with Edge from Canada, amazon.com's through a US exit (their
# "Delivering to" line names a US town). Pages, each quoted where it's used:
# Pricing, Canada: amazon.ca/music/unlimited ("Auto-renews at $12.99/mo. after ($11.99/mo. for Prime members) +
# applicable taxes"), /music/unlimited/family ("$21.99/month + any taxes after your free trial"), /music/unlimited/echo
# ("JUST $6.29/MONTH"), /music/standard ("Auto-renews at $11.54/mo. after ($10.49 /mo. for Prime members)") and
# /music/standard/family ("Auto-renews at $17.84/mo."), and the FAQ's pricing tab (amazon.ca/music/i/faq): "For Prime
# members, the Amazon Music Unlimited Individual Plan will change from $11.54 CAD to $11.99 CAD per month, and from
# $114.45 CAD to $119.00 CAD per year" and "The Amazon Music Unlimited Family Plan will change from $20.99 CAD to $21.99
# CAD per month, and from $208.95 CAD to $219.00 CAD per year", in effect since September 30, 2026. The FAQ's other
# tab still says "$114.45/year", the old price, so the pricing tab wins. Its yearly Family plan is "available to Prime
# members only" (the FAQ), so the yearly prices are Prime's add-ons too.
# Pricing, US: amazon.com/music/unlimited ("Auto-renews at $12.99/mo. after ($11.99/mo. for Prime members)"),
# /music/unlimited/family ("$21.99/month"), /music/unlimited/echo ("Just $6.99/month"), /music/standard ("$10.99/mo.
# after ($9.99 /mo. for Prime members)"), /music/standard/family ("$16.99/mo.") and its FAQ ("$11.99/month for a
# monthly subscription or $119/year for an annual subscription" for Prime members; Family "$21.99/month or $219/year
# (available to Prime members only)"). Not listed: Amazon Music Unlimited for Students, which needs proof of enrolment
# (SheerID), and Amazon Music Prime, included with Amazon Prime (Prime's perk) and never sold alone.
# Free: amazon.ca/music/free and amazon.com/music/free, "Free streaming music" and "No credit card required".
# Where it's sold: Amazon Music's service provider page lists Canada's "Available Services: Amazon Music Unlimited,
# Amazon Music Standard, Amazon Prime Music, Amazon Music (free with ads)", and the US's too. Other countries' prices
# aren't read yet (the full catalog's region pass), so it's unknown there, not "not offered".
# Region checklist, 2026-11-10: 1. amazon.ca and amazon.com, each plan's own page; 4. the plan pages, never past their
# sign-up buttons; 6. Edge from Canada and through a US exit.
# Bundles and resellers: none on its pages; Apple, Google and mobile service providers bill it (ways to pay).
# Features, read 2026-11-10 on amazon.ca's "What are the Differences Between the Amazon Music Subscriptions?" (plan by
# plan: on demand, ads, offline, HD, Ultra HD, spatial audio, devices and streaming limits) and its articles on HD and
# Ultra HD ("Ultra HD tracks have a bit depth of 24 bits, with sample rates ranging from 44.1 kHz up to 192 kHz", the
# FAQ: Hi-Res Lossless), spatial audio ("mastered in Dolby Atmos and 360 Reality Audio": Dolby Atmos), audiobooks
# ("Certain Amazon Music Unlimited plans in the following locations allow you to access audiobooks from Audible's
# catalogue": Canada and the US among them) and the Single Device plan ("doesn't have access to HD, Ultra HD, and
# Spatial Audio"). Free and Standard play only "select audiobooks that are available across Amazon Music", not
# Audible's catalogue, so audiobooks aren't counted as included there. Free and the Single Device plan stream SD only,
# whose bitrate no help page gives; Amazon's developer documentation, a preview for its API ("Audio Formats",
# developer.amazon.com: "For Free and Prime, only standard definition (SD) is available", SD in Opus at "48 kbps", "192
# kbps" and "320 kbps"), gives the best as 320 kbps, so High, inferred. Apps (its compare page and HD article): iOS,
# Android, Fire TV, Fire Tablet, "Amazon Music for Web" and "The Amazon Music app for PC, Mac"; the Single Device plan
# plays on "a single compatible Echo or Fire TV device" (the registry has no value for speakers). Sign-in, the Amazon
# account's: "Why Can't I Sign into My Account?" ("Some accounts use a password, while others use a one-time security
# code sent to your mobile number or email, or a passkey saved on your device"), "Recover Your Account after Two-Step
# Verification Fails" ("from a trusted device") and "What is Two-Step Verification?", in its Amazon Business section
# but about any account's settings ("by text message or authenticator app").

# Skips, your own music, lyrics and live radio, read from the saved FAQ (2026-11-10): Prime's songs play "on-demand
# with no skip limits" only from "a curated selection of All-Access Playlists" (shuffle otherwise), so not unlimited;
# Unlimited lets you "listen to any song, anytime" (inferred). No page read names lyrics, uploads or live radio (its
# help pages showed this machine a check, 2026-11-11), so they're false until one does.
id: amazon-music
name: Amazon Music
aliases: [amazon music unlimited]
website: https://music.amazon.com
# Amazon Canada's store and help centre (amazon.com's pages count through its policies' links, as Prime Video's do:
# listing amazon.com would claim Amazon's other services on it, such as Amazon Luna).
domains: [amazon.ca]
category: music
spendCategory: streaming
billingCurrency: { CA: CAD, US: USD }
cancelUrl: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GCRZL3F2UZMNP3T3
sources: { pricing: https://www.amazon.ca/music/unlimited }
# Owner (M11.2), read 2026-11-10: Amazon's own site lists Amazon Music among its entertainment businesses, and
# Amazon.com's Conditions of Use (through a US exit) give its address under Washington State's laws. Its shares
# (M11.18): Amazon's investor relations page.
owner:
  name: 'Amazon.com, Inc.'
  website: https://www.aboutamazon.com
  page:
    name: 'Amazon entertainment'
    url: https://www.aboutamazon.com/what-we-do/entertainment
  quotes:
    - 'Amazon produces and delivers to customers world-class entertainment via Prime Video, Amazon MGM Studios, MGM+, Amazon Music, Audible, Wondery, Amazon Games, and Twitch.'
  country:
    code: US
    page:
      name: Amazon.com Conditions of Use
      url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
    quotes:
      - 'Seattle, WA 98108-1226'
      - 'the laws of the state of Washington'
    lastVerified: 2026-11-10
  stock:
    listings:
      - { exchange: NASDAQ, symbol: AMZN }
    page:
      name: Investor relations
      url: https://ir.aboutamazon.com/overview/default.aspx
    quotes:
      - 'NASDAQ: AMZN'
    lastVerified: 2026-11-10
  lastVerified: 2026-11-10
# Ways to pay (M11.5), read 2026-11-10: a card (its payment method article: "credit card rewards points" too, which
# pay with a card's own points), and Apple, Google and mobile service providers that bill it (its cancelling article).
# It names no card networks: Amazon.ca's "Accepted Payment Methods" is about orders, so it isn't used here. The US's
# from its FAQ.
paymentMethods:
  - methods: [card]
    regions: [CA]
    page: Change Your Amazon Music Unlimited Subscription Payment Method
    url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GFNZXFN8Q9BHEUE5
    quotes:
      - 'You can use a credit card, credit card rewards points, or debit card.'
  - methods: [app-store, provider-billing]
    regions: [CA]
    page: Cancel Your Amazon Music Unlimited Subscription
    url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GCRZL3F2UZMNP3T3
    quotes:
      - 'If you subscribed to Amazon Music Unlimited through iTunes visit the Apple website to cancel your subscription.'
      - 'If you signed up through Apple, Google, or a mobile service provider, contact them to cancel or get a refund based on their policies.'
  - methods: [card]
    regions: [US]
    page: Amazon Music FAQ
    url: https://www.amazon.com/music/i/faq
    quotes:
      - 'using a payment method like a credit or debit card'
  - methods: [app-store, provider-billing]
    regions: [US]
    page: Switch Amazon Music Unlimited Plans
    url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GFH65TCNXDADUAW3
    quotes:
      - 'If you signed up through a third party, such as Apple App Store, Google Play, or a mobile service provider, you may need to contact them directly.'
# Renewal day (M11.5), read 2026-11-10: its terms renew a plan automatically and keep "the original
# renewal/subscription date" after a late payment, and its settings show "the next due date", without saying which
# day of the month that is.
renewalAnchor:
  kind: not-stated
  pages: [https://www.amazon.ca/gp/help/customer/display.html?nodeId=201380010]
  lastVerified: 2026-11-10

