# Researched by hand on 2026-11-17 (the full catalog run, AI batch 1), read with a plain fetch from Canada (opencode.ai:
# home, Go, models (Zen), download, product, mobile, desktop, Browse, data, enterprise, support and Console pages, its
# terms of use and privacy policy, its documentation as pages and as its Markdown copies, its llms.txt index; its GitHub
# repository's licence, README and security policy; its Trust Center), its Go and Console sign-up pages in Edge from
# Canada, and opencode.ai/go through a US, a UK and a German exit. Pages, each quoted where it's used.
# What it is: OpenCode, a free, open-source coding agent you run on your own computer ("OpenCode is an open source coding
# agent. It’s available as a terminal-based interface, desktop app, or web app.", its docs), with free models and any of
# "200+ providers"; and OpenCode Go, a monthly subscription to hosted open models from Anomaly, the company that makes
# it ("Go is a subscription that gives you and your team access to the best open-weight models with generous usage
# limits at a low-cost fixed monthly price.").
# Pricing: opencode.ai/go: "Individuals": Go "$10 per month" and Go Plus "$40 per month"; Go Teams ("$20/member/month ,
# 2-member minimum", its Go documentation) is a team plan, out. Monthly only ("with three monthly plans", its Go
# documentation; no page offers a year). OpenCode itself is free ("OpenCode is 100% free to use. It also comes with a set
# of free models.", its product page), its Free plan here. Pay-as-you-go models (OpenCode Models, formerly Zen, from
# prepaid credits) are usage-billed and out. No currency is named on the Go page: a bare "$" from Canada and through a
# US, a UK and a German exit alike; its Console prices models "in US dollars" and its budgets are "in US dollars", so one
# price list for everywhere in US dollars (Devin's precedent). No page says the prices include tax.
# Region checklist, 2026-11-17: 1. opencode.ai's language versions (its picker) change the language, not the prices;
# 2. no country or currency picker; 3. the Go page's code names no currency; 4. checkout needs an account (Subscribe sends
# you to sign up); 5. no help article prices by country; 6. a plain fetch and Edge from Canada, and Edge through a US, UK
# and German exit, all "$10" and "$40"; 7. no bill offered. Where it's sold: "The service is designed primarily for
# international users and provides stable global access." (its Go documentation); some free models aren't offered in
# some countries (in the plans' notes).
# Bundles: none found. Official resellers: none: its pages sell Go only in its Console and name no shop. "use your
# ChatGPT Plus/Pro or GitHub Copilot subscriptions" in OpenCode is another company's plan used as a provider, not a
# bundle.
# Free use: the Free plan (OpenCode with its free models, or your own providers).

id: opencode
name: OpenCode
aliases: [opencode go, opencode zen, anomaly]
website: https://opencode.ai
# Its Trust Center.
domains: [trust.opencode.ai]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its Go page's "Can I cancel?": "An owner or admin can cancel any time from the Go page."
cancelUrl: https://opencode.ai/go
sources: { pricing: https://opencode.ai/go }
notes: 'OpenCode, the open-source coding agent, is free with its free models or your own; OpenCode Go adds hosted open models for a fixed monthly price.'

# Ways to pay (M11.5), read 2026-11-17 in its Console billing documentation: a card, Link (Stripe's wallet), Alipay, UPI
# and WeChat Pay, for Go too ("OpenCode Go subscriptions use the same payment methods"); Link, UPI and WeChat Pay are
# `other`. Go can also be paid from the workspace's credit, which is bought the same ways. No card networks are named
# ("Card"), so no acceptedNetworks.
paymentMethods:
  - methods: [card, alipay, other]
    page: Billing
    url: https://opencode.ai/docs/console/billing/
    quotes:
      - 'Card'
      - 'Alipay'
      - 'WeChat Pay'
      - 'OpenCode Go subscriptions use the same payment methods and appear in the same invoice list.'

# Owner (M11.2), read 2026-11-17: its terms and privacy policy name Anomaly Innovations, Inc. ("Made by: Anomaly", its
# press page). Private: no page names shares or a listing. Where it is: its terms' address for opting out of
# arbitration, in San Francisco (its terms are governed by Delaware's law).
owner:
  name: 'Anomaly Innovations, Inc.'
  page:
    name: Terms of use
    url: https://opencode.ai/legal/terms-of-service
  quotes:
    - 'These Terms of Use (the "Terms") are a binding contract between you and ANOMALY INNOVATIONS, INC. ("OpenCode," "we" and "us").'
  country:
    code: US
    page:
      name: Terms of use
      url: https://opencode.ai/legal/terms-of-service
    quotes:
      - 'You have the right to opt out of the provisions of this Section by sending written notice of your decision to opt out to the following address: 2443 Fillmore St #380-6343, San Francisco, CA 94115, United States postmarked within thirty (30) days of first accepting these Terms.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Source code (M11.5): its product page's FAQ links its GitHub repository under the MIT licence (the repository's
# LICENSE: "MIT License"). The agent and its apps are open; the servers behind Go and its Console weren't found in the
# repository, so open-source apps, not fully open, though its page calls OpenCode "fully open source" (notes.md).
sourceRepo:
  url: https://github.com/anomalyco/opencode
  page:
    name: Product
    url: https://opencode.ai/product
  quotes:
    - 'Yes, OpenCode is fully open source.'
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17: its Go documentation says only "Your monthly allowance resets when a new paid
# period starts.", and its terms speak of "PERIODIC CHARGES (E.G., MONTHLY)": no day.
renewalAnchor:
  kind: not-stated
  pages: [https://opencode.ai/legal/terms-of-service, https://opencode.ai/docs/console/go/]
  lastVerified: 2026-11-17

# Perks (M11.6), read 2026-11-17 on opencode.ai/go, each line no feature describes: Go's "Curated, affordable models"
# (32 hosted open models with monthly allowances) and Go Plus's "Higher limits and fewer interruptions" (usage levels are
# perks, never features: the owner's choice of 2026-10-30).
perks:
  - id: go-models
    name: Curated, affordable models
  - id: higher-limits
    name: Higher limits and fewer interruptions

# Features, read 2026-11-17 (AI: the registry's ai.* features), on every plan unless named:
# - The assistant and coding agent: OpenCode itself ("OpenCode is an open source agent that helps you write and run code
#   with any AI model.", its product page).
# - Where chats are kept: on your device. OpenCode "runs locally on your machine" (its security policy), its phone app is
#   "a remote for OpenCode on your computer" whose sessions "keep running there", and its hosted models' prompts "are
#   passed through to the upstream model provider to provide the services and are not stored" (its privacy policy, which
#   excepts only the Console's hosted agents, a team feature).
# - Searches the web: "Ask OpenCode for current information and it can search the web, read the results, and include
#   source links in its response." (with your own search provider; TinyFish needs no key).
# - Voice conversations: its phone app ("Call a session and say what you need. The agent answers out loud.").
# - Reasoning: "Variants are named options for one model, often used for reasoning effort or token budgets." (Models).
# - Models from several companies: free models from several labs and "any of 200+ providers" (its home page); Go's 32
#   models include Moonshot's Kimi, Alibaba's Qwen, xAI's Grok, Zhipu's GLM, DeepSeek's, Google's Gemini, MiniMax's and
#   Anthropic's Claude Haiku (the Go page's model list).
# - Uses a browser for you: Browse, Anomaly's free companion ("An MCP server and a Chromium extension that let your agents
#   use your real browser, with your tabs, your logins and your extensions. They open tabs in the background, grouped out
#   of your way, and read pages, click, type, take screenshots and record tabs."), offered with OpenCode.
# - Connects to: MCP servers (its MCP servers documentation), code editors through the Agent Client Protocol ("so you
#   can use it from an ACP client such as Zed"), the command line (its terminal app), a browser extension (Browse), and
#   assistants you make ("An agent combines a system prompt, model preference, permissions, and display details into a
#   named assistant profile."); on Go and Go Plus also the API ("You can also access Go models through the API at
#   https://opencode.ai/inference/go"). Free models can't be called through the API ("Free-tier chat models require
#   OpenCode", its models documentation), so Free has no `api`. No monthly API credits: Go's allowance isn't credits
#   (Devin's precedent).
# - Not stated by any page read: memory across chats, projects, image, video or audio generation, deep research,
#   scheduled tasks (its changelog calls schedules experimental and opt-in), code
#   completion, office apps, early access.
# - Developer: a coding agent, so its plans are in developer too; no developer feature applies.
# General features, read 2026-11-17: platforms: its desktop app for macOS, Windows and Linux, its terminal app, its web
# app ("It’s available as a terminal-based interface, desktop app, or web app."), and its phone app for Android (Google
# Play) and iPhone ("Install the OpenCode beta on your iPhone from TestFlight, or the app on your Android phone."). Sign-in for its Console: "Continue with Google", "Continue
# with GitHub", or an email address and password (its sign-up page); OpenCode and its free models need no account. Support:
# email ("Email help@anoma.ly", "First response Within two business days", its Console support page) and its Discord
# community. App languages: its site's language picker (English, Chinese, Korean, German, Spanish, French, Italian,
# Danish, Japanese, Polish, Russian, Ukrainian, Arabic, Norwegian, Portuguese (Brasil), Thai, Turkish), the registry's
# ten of them. Self-hostable: OpenCode runs its own server on your computer ("Server mode is opt-in only.", its security
# policy; its web app and phone app connect to it). No pause (cancel only). No parental controls.
features:
  platforms: [windows, macos, linux, web, android, ios]
  account.sign-in: [password, sso]
  support.channels: [email, community]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, ar]
  software.open-source: open-clients
  software.self-hostable: true

plans:
  - id: opencode.free
    name: Free
    link: https://opencode.ai/download
    categories: [ai, developer]
    features:
      ai.assistant: true
      ai.coding-agent: true
      ai.chat-storage: on-device
