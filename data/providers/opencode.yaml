    notes: 'OpenCode is free and open source, with a set of free models you can use without an account, each free for a limited time with a daily request limit (some, such as Inkling 2 Small Free, not in every country). Some free models’ makers keep and train on what you send; you can also bring any of 200+ providers, your ChatGPT Plus or Pro or GitHub Copilot plan, or local models.'
    prices:
