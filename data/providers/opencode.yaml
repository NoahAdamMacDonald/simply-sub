# Terms and policies (BLUEPRINT §4.10), read 2026-11-17 with a plain fetch: its Terms of Use (effective Nov 8, 2026,
# which include its Privacy Policy and any "Additional Terms" by reference) and Privacy Policy (effective Nov 9, 2026),
# the Console's sign-up page ("By signing up, you agree to our Terms and DPA."), its Go page and documentation, its
# models documentation's privacy section, its billing, config and support pages, its GitHub security policy and MIT
# licence, and its Trust Center. Both legal documents say the open-source software you run yourself is governed by its
# own licence, so they grade its hosted services and the licence grades the apps. Not read: the DPA (for organisations),
# Stripe's terms (its payment processor), and the free models' makers' own terms (Thinking Machines', NVIDIA's), which
# its models page links. No shared document applies. Calibrated against Claude, ChatGPT, Perplexity and Devin.
policies:
  links:
    - name: 'Terms of use'
      url: https://opencode.ai/legal/terms-of-service
    - name: 'Privacy policy'
      url: https://opencode.ai/legal/privacy-policy
    - name: 'Go'
      url: https://opencode.ai/go
    - name: 'Go (documentation)'
      url: https://opencode.ai/docs/console/go/
    - name: 'Models and their privacy'
      url: https://opencode.ai/docs/console/models/
    - name: 'Billing'
      url: https://opencode.ai/docs/console/billing/
    - name: 'Config (updates)'
      url: https://opencode.ai/docs/config/
    - name: 'Product (FAQ)'
      url: https://opencode.ai/product
    - name: 'Models (Console)'
      url: https://opencode.ai/zen
    - name: 'Support'
      url: https://opencode.ai/console/support
    - name: 'Sign up'
      url: https://opencode.ai/console/signup
    - name: 'Trust Center'
      url: https://trust.opencode.ai
    - name: 'Security policy (GitHub)'
      url: https://github.com/anomalyco/opencode/blob/dev/SECURITY.md
    - name: 'Licence (GitHub)'
      url: https://github.com/anomalyco/opencode/blob/dev/LICENSE
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online at any time from the Go page, and you keep Go until the end of the time you paid for.'
      sources:
        - url: https://opencode.ai/go
          quote: 'Yes. An owner or admin can cancel any time from the Go page. Your plan stays active until the end of the period you paid for.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: good
      reason: 'You can ask for your money back within 14 days of any charge, but only if you’ve barely used that period’s allowance.'
      sources:
        - url: https://opencode.ai/go
          quote: "You may qualify if you ask within 14 days of the charge and have used almost none of that period's allowance."
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      status: not-stated
      reason: 'Its terms charge the prices in effect at the time, and don’t say whether it tells you before raising them.'
      pages: [https://opencode.ai/legal/terms-of-service, https://opencode.ai/docs/console/go/]
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      status: not-applicable
      reason: 'Go has no free trial: OpenCode and its free models simply stay free.'
      pages: [https://opencode.ai/go, https://opencode.ai/docs/console/go/]
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say it charges each period until you cancel, but not that it reminds you first.'
      pages: [https://opencode.ai/legal/terms-of-service, https://opencode.ai/docs/console/go/]
      lastVerified: 2026-11-17
    - topic: billing.fees
      tier: neutral
      reason: 'Go costs its price. Credits you buy for extra usage carry a stated processing fee.'
      sources:
        - url: https://opencode.ai/docs/console/billing/
          quote: 'A processing fee of 4.6% + $0.31 is added on top, so a $50 purchase costs $52.61 and the full $50 is added to the balance.'
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      status: not-stated
      reason: 'It doesn’t say what happens to time you’ve paid for when you move between Go and Go Plus.'
      pages: [https://opencode.ai/docs/console/go/, https://opencode.ai/docs/console/billing/]
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: poor
      reason: 'Disputes go to a private referee, not a court, and you give up class actions. You can opt out only by letter, within 30 days of signing up.'
      sources:
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'YOU AGREE THAT DISPUTES BETWEEN YOU AND US WILL BE RESOLVED BY BINDING, INDIVIDUAL ARBITRATION AND YOU WAIVE YOUR RIGHT TO PARTICIPATE IN A CLASS ACTION LAWSUIT OR CLASS-WIDE ARBITRATION.'
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'You have the right to opt out of the provisions of this Section by sending written notice of your decision to opt out to the following address: 2443 Fillmore St #380-6343, San Francisco, CA 94115, United States postmarked within thirty (30) days of first accepting these Terms.'
      action:
        name: 'How to opt out (its terms)'
        url: https://opencode.ai/legal/terms-of-service
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It tells you about changes on its site, by email or in some other way, but doesn’t say how far ahead. Using it after a change means you agree.'
      sources:
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'We reserve the right to change the Terms at any time, but if we do, we will place a notice on our site located at opencode.ai, send you an email, and/or notify you by some other means.'
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'If you use the Services in any way after a change to the Terms is effective, that means you agree to all of the changes.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: bad
      reason: 'It can stop your use of its services for any reason it chooses, and its terms promise no notice and no refund.'
      sources:
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'OpenCode is also free to terminate (or suspend access to) your use of the Services for any reason in our discretion, including your breach of these Terms.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: good
      reason: 'It uses what you send to run the service and keep it safe. On a free account it may also use it to improve its services.'
      sources:
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'We use Content to provide our Services, comply with applicable law, enforce our terms and policies, and keep our Services safe.'
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services, except Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      plans: [opencode.go, opencode.go-plus]
      tier: great
      reason: 'On a paid account it uses what you send only to run the service, follow the law and keep it safe.'
      sources:
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'We use Content to provide our Services, comply with applicable law, enforce our terms and policies, and keep our Services safe.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: good
      reason: 'The code and answers it makes for you are yours.'
      sources:
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'you (a) retain your ownership rights in Input and (b) own the Output.'
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'We hereby assign to you all our right, title, and interest, if any, in and to Output.'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: neutral
      reason: 'It can change, limit or stop parts of its services, as any subscription can, and Go’s list of models may change.'
      sources:
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'We may suspend or discontinue any part of the Services, or we may introduce new features or impose limits on certain features or restrict access to parts or all of the Services.'
      lastVerified: 2026-11-17
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://opencode.ai/legal/terms-of-service]
      lastVerified: 2026-11-17
    - topic: legal.licence
      tier: great
      reason: 'OpenCode is open source under the MIT licence: anyone may use, change and share it.'
      sources:
        - url: https://opencode.ai/product
          quote: 'Yes, OpenCode is fully open source.'
        - url: https://github.com/anomalyco/opencode/blob/dev/LICENSE
          quote: 'MIT License'
      lastVerified: 2026-11-17
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you do on its website and Console (pages, clicks, downloads) and links it to your account. Turning analytics off works browser by browser, and some events are still recorded.'
      sources:
        - url: https://opencode.ai/legal/privacy-policy
          quote: 'When you create an account, sign in, verify your email or approve a device, we link the records from that browser to your account.'
        - url: https://opencode.ai/legal/privacy-policy
          quote: "We delete those Cookies and the local storage list from your browser and don't set them again while analytics are off."
      action:
        name: 'Turn off analytics (its privacy policy)'
        url: https://opencode.ai/legal/privacy-policy
      lastVerified: 2026-11-17
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It says it doesn’t sell your data, but it may give your details to partners for joint promotions, and offers no easy way to stop that.'
      sources:
        - url: https://opencode.ai/legal/privacy-policy
          quote: 'We will not sell or share your Personal Data, and have not done so over the last 12 months.'
        - url: https://opencode.ai/legal/privacy-policy
          quote: 'Companies that we partner with to offer joint promotional offers or opportunities.'
      action:
        name: 'Its privacy policy'
        url: https://opencode.ai/legal/privacy-policy
      lastVerified: 2026-11-17
    - topic: privacy.ads-tracking
      tier: great
      reason: 'No ads, and it doesn’t use your data to target ads. Its website’s analytics are its own, with no outside trackers.'
      sources:
        - url: https://opencode.ai/legal/privacy-policy
          quote: 'Targeted Advertising: We do not process your Personal Data for targeted advertising purposes.'
        - url: https://opencode.ai/legal/privacy-policy
          quote: "We collect these records ourselves and don't use third-party analytics services on opencode.ai."
      lastVerified: 2026-11-17
    - topic: privacy.ai-training
      tier: poor
      reason: 'Some free models’ makers keep and train on what you send, and on a free account OpenCode may use it to improve its services. You avoid it only by choosing other models.'
      sources:
        - url: https://opencode.ai/docs/console/models/
          quote: 'Iceman Free: During its free period, collected data is retained and used to improve the model.'
        - url: https://opencode.ai/legal/terms-of-service
          quote: 'In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services, except Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.'
      action:
        name: 'Each model’s privacy (its models page)'
        url: https://opencode.ai/docs/console/models/
      lastVerified: 2026-11-17
    - topic: privacy.ai-training
      plans: [opencode.go, opencode.go-plus]
      tier: good
      reason: 'Go blocks models that train on what you send unless you allow them in its settings.'
      sources:
        - url: https://opencode.ai/go
          quote: 'By default, Go blocks paid endpoints that train on your requests, and an owner or admin can change that in Settings › Privacy.'
      lastVerified: 2026-11-17
    - topic: privacy.content-access
      tier: neutral
      reason: 'OpenCode runs on your computer. What you send to its hosted models passes through to the model’s maker and isn’t kept by OpenCode.'
      sources:
        - url: https://opencode.ai/legal/privacy-policy
          quote: 'Prompts are passed through to the upstream model provider to provide the services and are not stored, except by hosted agents, which keep sessions until 30 days without activity and email records until the inbox is disconnected (see Integrations with Third-Party Services ).'
        - url: https://github.com/anomalyco/opencode/blob/dev/SECURITY.md
          quote: 'OpenCode is an AI-powered coding assistant that runs locally on your machine.'
      lastVerified: 2026-11-17
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your information as long as it needs it, with a few stated periods, such as two years for website analytics.'
      sources:
        - url: https://opencode.ai/legal/privacy-policy
          quote: 'We retain Personal Data about you for as long as necessary to provide you with our Services or to perform our business or commercial purposes for collecting your Personal Data.'
        - url: https://opencode.ai/legal/privacy-policy
          quote: 'We delete these records from our analytics database within a month after they turn 24 months old.'
      lastVerified: 2026-11-17
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask by email for your data to be deleted, but it doesn’t say how quickly.'
      sources:
        - url: https://opencode.ai/console/support
          quote: 'To ask for a copy of your data or for it to be deleted, email help@anoma.ly from the address on your OpenCode account'
      action:
        name: 'How to ask (its support page)'
