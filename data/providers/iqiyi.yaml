# Terms and policies, read 2026-11-09 (M11.15): its Terms of Service ("Last Updated: June 7th, 2024"), the Terms of VIP
# Membership Service they include (updated October 18, 2024, which prevail for VIP), its privacy policy (English part,
# "Updated on: November 6, 2026"), its help centre's answers (Edge shows them as you open each), the sign-up form on
# the order page, and its Security Response Center (its bug bounty, in English at #oversea). Its Cookie Policy adds
# no topic.
policies:
  links:
    - name: 'Terms of service'
      url: https://www.iq.com/intl-common/international-useragreement.html?lang=en_us
    - name: 'Terms of VIP membership service'
      url: https://www.iq.com/intl-common/international-vip-membership-service.html?lang=en_us
    - name: 'Privacy policy'
      url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
    - name: 'VIP privileges'
      url: https://www.iq.com/vip/privilege
    - name: 'Join VIP'
      url: https://www.iq.com/vip/order
    - name: 'Help and feedback'
      url: https://intl-help.iq.com/m/?mod=ca&lang=en_us&entry=pc
    - name: 'Security Response Center'
      url: https://security.iqiyi.com/#oversea
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you watch, search and do, and guesses your age, gender and tastes. You can turn off its personal picks in the app; for the rest you must ask it.'
      sources:
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'We will automatically collect the information about your interaction with Our Services, including records of your browsing, playing, searching, bookmarking, scheduling, sharing, downloading, commenting, and advertisement interactions'
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'We may speculate on certain information about you, including your age range, gender, channel preferences, and video album preferences.'
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'You can contact us to request that We stop processing your personal information for specific purposes.'
      action:
        name: 'Your rights and how to use them'
        url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: poor
      reason: 'Ad companies collect your information through iQIYI, and it gives LiveRamp an ID made from your email or phone. Opting out of LiveRamp is on LiveRamp’s own site.'
      sources:
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'Our advertisement partners may collect some of your personal information through our platform, or We may share with them the information automatically collected by us'
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'We will provide privacy protection identifiers to Liveramp, so as to better showcase suitable advertisement content to you.'
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'We will not sell your personal information.'
      action:
        name: 'Its privacy policy'
        url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
      lastVerified: 2026-11-09
    - topic: privacy.ads-tracking
      tier: neutral
      reason: 'It shows you ads picked from what you do. You can turn that off in the app’s privacy settings; you still see ads, just not picked for you.'
      sources:
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'In case you no longer want to receive personalized contents and advertisements, you can disable them at any time within the application through the following path'
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'After you disable personalized recommendations, you will still see the advertisements and contents randomly recommended by us'
      action:
        name: 'How to turn off personalised ads'
        url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
      lastVerified: 2026-11-09
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy says your information helps improve its own machine learning, not whether what you write trains AI models used elsewhere.'
      pages: [https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us]
      lastVerified: 2026-11-09
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it decides it needs it, and gives no time limits.'
      sources:
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'We only retain your personal information for the period necessary for providing Our Services and achieving the above-mentioned purposes.'
      lastVerified: 2026-11-09
    - topic: privacy.data-deletion
      tier: good
      reason: 'You can delete your account yourself, on its website or in the app, and your information is erased right away.'
      sources:
        - url: https://intl-help.iq.com/m/?mod=ca&lang=en_us&entry=pc
          quote: 'your personal information, VIP privileges etc. will be erased right away and the deleted account cannot be recovered.'
        - url: https://intl-help.iq.com/m/?mod=ca&lang=en_us&entry=pc
          quote: 'PC Website (iq.com): Profile picture – “My Account” – “Delete account”'
      action:
        name: 'How to delete your account'
        url: https://intl-help.iq.com/m/?mod=ca&lang=en_us&entry=pc
      lastVerified: 2026-11-09
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can see some of your information in your account, and ask it for a copy of the rest.'
      sources:
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'You can also contact us to request access, query, or copying of more of your personal information, and We will provide you with a copy of your personal information in electronic form.'
      action:
        name: 'How to ask for your data'
        url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
      lastVerified: 2026-11-09
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over your information when the law or a court order requires it, and is usually not allowed to tell you.'
      sources:
        - url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
          quote: 'In accordance with the applicable laws and regulations, or the valid legal procedural documents such as subpoenas, court orders, or search warrants, such disclosure may be made with or without your consent, or with or without notice, and We are generally prohibited from notifying you of such disclosure.'
