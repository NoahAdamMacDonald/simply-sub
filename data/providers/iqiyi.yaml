    - topic: other.notable
      title: Guest purchases stay on one device
      tier: neutral
      reason: 'VIP bought in Apple’s App Store without signing in is tied to that device: lose, reset or replace it and the VIP is gone. Signing in before you buy avoids it.'
      sources:
        - url: https://www.iq.com/intl-common/international-vip-membership-service.html?lang=en_us
          quote: 'Because Apple App Store allows non-registered users to buy the iQIYI VIP Membership service in Guest Mode, the service will be bound to the device with which this service was purchased.'
        - url: https://www.iq.com/intl-common/international-vip-membership-service.html?lang=en_us
          quote: 'If your device is lost, damaged, upgraded, restored, emptied or subjected to other similar situations, you may not continue to use the iQIYI VIP Membership benefits bound to this device, and you shall bear the losses incurred as a result.'
