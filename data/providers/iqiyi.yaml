# Researched by hand on 2026-11-09 (M11.15, the streaming category, batch 3, part 2): iQIYI's international service
# (iq.com, iQIYI International Singapore's), read in Edge from Canada and through each other country's exit. Its order
# page (iq.com/vip/order) prices by where the visitor is, a Standard and a Premium card each Monthly and Yearly, the
# regular price struck through beside the first term's ("Subscription is renewed at C$119.99 after the discount ends"):
# Canada in C$, the US in $, the UK in £, New Zealand in NZ$, Germany, France and Spain in €, and Ireland and the
# Netherlands in US dollars (the page's own data: "currencyUnit":"USD"). Australia's prices were read on 2026-11-09
# through a Sydney exit (its first three exits got the page without its plans: "Subscription is renewed at A$149.99
# after the discount ends"); Italy's exits, eight in all, still got it without its plans, so Italy is unread.
# Region checklist, 2026-11-09: 1. one address for every country; 2. its language picker changes no prices; 3. the
# page's own data names each country's currency; 4. the plan cards, never past "Log in to purchase"; 6. Edge, through
# each country's exit.
# Bundles: none on its pages. Resellers: none named; its footer's "VIP Reseller Application" is a form for shops to
# apply.

id: iqiyi
name: iQIYI
aliases: [iq.com, iqiyi international, aiqiyi]
website: https://www.iq.com
category: streaming
spendCategory: streaming
billingCurrency:
  {
    GLOBAL: USD,
    CA: CAD,
    US: USD,
    GB: GBP,
    NZ: NZD,
    AU: AUD,
    IE: USD,
    NL: USD,
    DE: EUR,
    FR: EUR,
    ES: EUR,
  }
cancelUrl: https://intl-help.iq.com/m/?mod=ca&lang=en_us&entry=pc
sources: { pricing: https://www.iq.com/vip/order }
notes: iQIYI's international service, with Asian dramas, films, variety shows and anime. Mainland China's iQIYI is a service of its own.
# Accepted cards and ways to pay, read 2026-11-09 on the order page in every country read (its card names "MasterCard,
# Visa, JCB"; Alipay beside PayPal in Canada, the US, Ireland and the Netherlands) and in its privacy policy (the app
# stores' billing). Its help centre: "At this moment, payment via bank card/Google/Apple is available on iQIYI", and
# Roku Pay on Roku TVs.
acceptedNetworks:
  GLOBAL:
    networks: [mastercard, visa, jcb]
    url: https://www.iq.com/vip/order
    quotes:
      - 'MasterCard, Visa, JCB'
paymentMethods:
  - methods: [card, paypal, alipay]
    regions: [CA, US, IE, NL]
    page: 'Join VIP'
    url: https://www.iq.com/vip/order
    quotes:
      - 'Credit/Debit Card'
      - 'PayPal'
      - 'Alipay'
  - methods: [card, paypal]
    regions: [GB, NZ, DE, FR, ES]
    page: 'Join VIP'
    url: https://www.iq.com/vip/order
    quotes:
      - 'Credit/Debit Card'
      - 'PayPal'
  - methods: [app-store]
    page: 'Privacy policy'
    url: https://www.iq.com/intl-common/international-privacyagreement.html?lang=en_us
    quotes:
      - 'such as Apple App Store, Google Play Billing, and MasterCard'

# Owner (M11.2), read 2026-11-09 on its investor site.
owner:
  name: 'iQIYI, Inc.'
  website: https://ir.iqiyi.com
  page:
    name: 'iQIYI investor relations'
    url: https://ir.iqiyi.com/
  quotes:
    - 'iQIYI, Inc. (Nasdaq: IQ) (“iQIYI” or the “Company”) is a leading provider of online entertainment video services in China.'
  country:
    code: CN
  stock:
    listings:
      - { exchange: Nasdaq, symbol: IQ }
  lastVerified: 2026-11-09

# Renewal day (M11.5), read 2026-11-09 in its help centre ("you will be charged 24 hours prior to the corresponding
# renewal dates of every week/month/season/year").
renewalAnchor:
  kind: same-date
  page: Help and feedback
  url: https://intl-help.iq.com/m/?mod=ca&lang=en_us&entry=pc
  quotes:
    - 'Auto-renewing recurrent monthly, quarterly, and yearly subscriptions are charged on a calendar month, quarter, and year basis, with the validity of each period aligning with the billing cycle.'
  lastVerified: 2026-11-09

# General features, read 2026-11-11: app languages from iq.com's language versions (?lang=en_us and the others). No
# pause. Parental controls: a playback PIN (its help's forgotten-PIN article).
# Apps (the cross-category features), read 2026-11-09: its footer's "Computer", "Phone", "TV" and "Web" apps (a
# Windows PC app, the App Store and Google Play, Apple TV, Android TV and Roku in its help centre).
features:
  platforms: [windows, ios, android, tv, web]
  languages.interface: [en, es, pt, ja, ko, zh]

# Features, read 2026-11-09 on its VIP privileges page (iq.com/vip/privilege) and the order page's lists:
# - streams: "Concourent watching on multiple screens": 1 free, 2 Standard, 4 Premium ("Standard VIP can access VIP
#   content on 2 devices simultaneously. Premium VIP can access VIP content up to 4 devices simultaneously"), as its VIP
#   terms ("two devices simultaneously in case of Standard VIP; c) four devices simultaneously in case of Premium VIP");
# - quality: "720P", "1080P", "4K";
# - ads: "VIP members can skip some pre-roll ads (ads shown in the player before content playback start), not including
#   ads inserted in the video or other types of ads", so no plan is ad-free, though the page's heading says "without
#   ads";
# - HDR: Premium's list has "Dolby Audio + Dolby Vision" and Standard's "Dolby Audio" (Canada's, the US's, Germany's
#   and Spain's order pages; Ireland's and the Netherlands' say "Dolby Cinema" for both); Dolby Audio isn't Dolby
#   Atmos;
# - downloads: "VIP Download" on both VIP plans ("The download privilege is unavailable for basic membership", its VIP
#   terms), on no stated number of devices, so 1, inferred;
# - no page names profiles or Kids profiles. Its VIP terms also name a "basic membership", which no order page sells.
