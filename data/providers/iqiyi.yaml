  - id: iqiyi.free
    name: Free
    link: https://www.iq.com/
    features:
      video.quality: 720p
      ad-free: false
      streaming.concurrent-streams: 1
      account.parental-controls: true
      streaming.content: [series, anime]
    notes: Its free shows, with ads.
    prices:
