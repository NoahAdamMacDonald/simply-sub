    - topic: billing.price-changes
      tier: great
      reason: 'It tells you at least 30 days before a price rise, and the new price starts only with the next billing period after that, so you can cancel first.'
      sources:
        - url: https://www.cloudflare.com/application/terms/
          quote: 'We reserve the right to change the subscription fees that we charge for the Paid Application Services, at any time in our sole discretion, provided that we give you at least thirty (30) days’ prior notice of such changes. Unless otherwise specified in such notice to you, any changes to the subscription fees will take effect in the billing period immediately following our notice to you.'
