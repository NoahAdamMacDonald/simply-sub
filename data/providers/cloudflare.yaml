    - topic: billing.refunds
      tier: neutral
      reason: 'Cloudflare gives no money back for the rest of a month you cancel in, but you keep WARP+ until it ends. Any refund is up to Apple or Google.'
      sources:
        - url: https://www.cloudflare.com/application/terms/
          quote: 'SUBSCRIPTION FEES ARE SUBJECT TO THE APP STORE REFUND POLICIES AND ARE ISSUED SOLELY AT THE DISCRETION OF THE APP STORE. YOU WILL BE BILLED IN FULL FOR THE SUBSCRIPTION TERM IN WHICH YOU CANCEL AND NO REFUNDS WILL BE PROVIDED FOR THE UNUSED PORTION OF SUCH SUBSCRIPTION TERM.'
        - url: https://www.cloudflare.com/application/terms/
