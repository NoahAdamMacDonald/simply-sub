    - topic: service.activity-logging
      plans: [cloudflare.dns]
      tier: neutral
      reason: 'The 1.1.1.1 resolver never stores your full IP address and deletes its query logs within 25 hours. Experts from a big accounting firm checked that it keeps these promises.'
      sources:
        - url: https://developers.cloudflare.com/1.1.1.1/privacy/public-dns-resolver/
          quote: 'Cloudflare will anonymize source IP addresses via IP truncation methods (last octet for IPv4 and last 80 bits for IPv6). Cloudflare will delete the truncated IP address within 25 hours.'
        - url: https://developers.cloudflare.com/1.1.1.1/privacy/public-dns-resolver/
          quote: 'Cloudflare will retain only the limited transaction and debug log data ("Public Resolver Logs") set forth below, for the legitimate operation of our Public Resolver and research purposes, and Cloudflare will delete the Public Resolver Logs within 25 hours.'
        - url: https://www.cloudflare.com/trust-hub/compliance-resources/
          quote: 'Cloudflare conducted a first-of-its-kind privacy examination by a Big Four accounting firm to determine whether the 1.1.1.1 resolver was effectively configured to meet Cloudflare’s privacy commitments.'
