# Terms and policies (BLUEPRINT §4.10), read 2026-11-19. Every agreement a user accepts (the owner's rule, 2026-11-03):
# the app's Application Terms of Service ("By downloading, installing, accessing, or using the Application you agree to
# be bound by this Agreement"), which are its licence too (2. Scope of License) and include the Application Privacy
# Policy and the app stores' own terms (not rated: Apple's and Google's); the 1.1.1.1 resolver's ("By using 1.1.1.1
# Public DNS Resolver or 1.1.1.1 for Families, you agree to the Cloudflare Website and Online Services Terms of Use"),
# which include its Privacy Policy, and the resolver's privacy commitments. Also read: the WARP privacy and FAQ docs,
# its compliance resources (ISO 27001, SOC 2 Type II, and the 1.1.1.1 resolver's privacy examination by "a Big Four
# accounting firm"), its disclosure page (HackerOne), its transparency report and its abuse approach page. The
# examination's report itself wasn't opened. No shared document applies. Billing topics: one paid plan, so switching
# plans doesn't apply. Not applicable (vpn and dns aren't in their categories): who can read your content, rights over
# your content, children, account sharing.
policies:
  links:
    - name: 'Application Terms of Service'
      url: https://www.cloudflare.com/application/terms/
    - name: 'Application Privacy Policy'
      url: https://www.cloudflare.com/application/privacypolicy/
    - name: 'Privacy Policy'
      url: https://www.cloudflare.com/privacypolicy/
    - name: 'Website and Online Services Terms of Use'
      url: https://www.cloudflare.com/website-terms/
    - name: '1.1.1.1 Public DNS Resolver privacy commitments'
      url: https://developers.cloudflare.com/1.1.1.1/privacy/public-dns-resolver/
    - name: 'WARP privacy'
      url: https://developers.cloudflare.com/warp-client/privacy/
    - name: 'WARP modes'
      url: https://developers.cloudflare.com/warp-client/warp-modes/
    - name: 'Certifications and compliance resources'
      url: https://www.cloudflare.com/trust-hub/compliance-resources/
    - name: 'Report security issues'
      url: https://www.cloudflare.com/disclosure/
    - name: 'Transparency report'
      url: https://www.cloudflare.com/transparency/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'The app collects how much data you use, your connection speed and your device details to improve itself. You can turn off only its network reports, in the app.'
      sources:
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'We track the services you have enabled and the amount of data you have transferred via the Application. We also use performance data to understand how the Application impacts your Internet connection and to improve our Application.'
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'We use information regarding your device, such as device model and operating system, for troubleshooting and to improve our Application.'
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'You may disable the reporting of anonymized network information in the Application.'
      action:
        name: 'Turning off network reports (its app privacy policy)'
        url: https://www.cloudflare.com/application/privacypolicy/
      lastVerified: 2026-11-19
    - topic: privacy.data-sharing
      tier: poor
      reason: 'The app and 1.1.1.1 don’t sell or share your data. But Cloudflare’s websites pass your browsing to ad partners, which US law may count as selling. You opt out through a link in each browser, or by email.'
      sources:
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'We will not sell or rent your personal information to anyone.'
        - url: https://www.cloudflare.com/privacypolicy/
          quote: 'Like many companies, however, we use services that help deliver interest-based ads to you and may transfer Personal Information to business partners for their use.'
        - url: https://www.cloudflare.com/privacypolicy/
          quote: 'In addition, we may also provide these marketing and advertising partners with your email address or other limited account information. You may opt out of such sharing by emailing us at sar@cloudflare.com.'
      action:
        name: 'Your privacy choices (its privacy policy)'
        url: https://www.cloudflare.com/privacypolicy/
      lastVerified: 2026-11-19
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'WARP and 1.1.1.1 show no ads and never target ads from what you look up. But Cloudflare’s websites use cookies to show you its ads on other sites; you can turn them off only in each browser’s cookie choices.'
      sources:
        - url: https://developers.cloudflare.com/1.1.1.1/privacy/public-dns-resolver/
          quote: "Cloudflare will not sell or share Public Resolver users' personal data with third parties or use personal data from the Public Resolver to target any user with advertisements."
        - url: https://www.cloudflare.com/privacypolicy/
          quote: 'We may also use cookies and similar technologies to provide you advertising on third-party sites based upon your browsing activities and interests.'
      action:
        name: 'Cookie choices (its privacy policy)'
        url: https://www.cloudflare.com/privacypolicy/
      lastVerified: 2026-11-19
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policies don’t mention training AI on what you do.'
      pages:
        [
          https://www.cloudflare.com/application/privacypolicy/,
          https://www.cloudflare.com/privacypolicy/,
        ]
      lastVerified: 2026-11-19
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps app data as long as it needs to, up to two years after you last use it. Most DNS data goes after 24 hours, and feedback emails after 6 months.'
      sources:
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'Your Account Data and Operational Data will be stored for no longer than two years after your last use of the Application.'
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'The DNS query data that we retain does not contain your IP addresses or personal information, and the bulk of the data is only stored for 24 hours.'
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'Your email address will be deleted 6 months from the date of collection.'
      lastVerified: 2026-11-19
    - topic: privacy.data-deletion
      tier: good
      reason: 'It holds almost nothing that names you. You can email it to delete what it has, and it answers within 30 days.'
      sources:
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'You will have the right to access, correct, update, export, or delete your limited personal information that we retain. You may email us at SAR@cloudflare.com with any such subject access requests (“ SAR ”), and we will respond within thirty (30) days.'
      action:
        name: 'How to ask for deletion (its app privacy policy)'
        url: https://www.cloudflare.com/application/privacypolicy/
      lastVerified: 2026-11-19
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can email it to ask for a copy of what it keeps, and it answers within 30 days, though it keeps little that names you.'
      sources:
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'You will have the right to access, correct, update, export, or delete your limited personal information that we retain. You may email us at SAR@cloudflare.com with any such subject access requests (“ SAR ”), and we will respond within thirty (30) days.'
      action:
        name: 'How to ask for your data (its app privacy policy)'
        url: https://www.cloudflare.com/application/privacypolicy/
      lastVerified: 2026-11-19
    - topic: privacy.government-requests
      tier: good
      reason: 'It hands over data only for subpoenas, court orders or other legal process, or an emergency, and reports requests twice a year. It keeps no link between your IP address and the sites you visit. It doesn’t say it tells you.'
      sources:
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'When we are required to disclose personal information to respond to subpoenas, court orders, or legal process; or in the case of an emergency to protect any person from the danger of death or serious physical injury'
        - url: https://www.cloudflare.com/transparency/
          quote: 'Cloudflare publishes semi-annual updates to our Transparency Report on requests to disclose customer information or to take action against content on websites using our services.'
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'We do not retain a link between the IP address you use to access the Internet via our Application and the websites you visit.'
      lastVerified: 2026-11-19
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data is kept mostly in the US and the European Economic Area, and may be reached from other countries, under the EU–US Data Privacy Framework and standard contract rules.'
      sources:
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'We primarily store your information in the United States and the European Economic Area.'
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'Should these certifications lapse or become otherwise invalidated, Cloudflare relies on the standard contractual clauses, including supplementary measures as necessary for transfers to the United States.'
