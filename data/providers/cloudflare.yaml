    - topic: other.notable
      title: Not built to hide who you are
      tier: poor
      reason: 'WARP encrypts your connection and swaps your IP address, but Cloudflare says it isn’t for staying anonymous and can’t make you appear in another country.'
      sources:
        - url: https://developers.cloudflare.com/warp-client/warp-modes/
          quote: 'WARP does not provide anonymity, and it is not designed to prevent servers you communicate with from identifying you. WARP also does not allow you to pretend to be accessing the Internet from a different country.'
        - url: https://www.cloudflare.com/application/terms/
          quote: 'Although the Application will need to install a VPN profile on your device and operates similarly to a VPN product or service, the Application is not designed to hide your identity from the Internet properties you access from your device.'
