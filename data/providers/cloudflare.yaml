    - topic: legal.disputes
      tier: bad
      reason: 'For the app, a private referee (an arbitrator) settles disputes, not a court, and you can’t join a group lawsuit. Its terms give no way to opt out.'
      sources:
        - url: https://www.cloudflare.com/application/terms/
          quote: 'THE AGREEMENT CONTAINS PROVISIONS REQUIRING THAT YOU AGREE TO THE USE OF ARBITRATION TO RESOLVE ANY DISPUTES ARISING UNDER THE AGREEMENT RATHER THAN A JURY TRIAL OR ANY OTHER COURT PROCEEDINGS, AND TO WAIVE YOUR PARTICIPATION IN CLASS ACTION OF ANY KIND AGAINST CLOUDFLARE.'
        - url: https://www.cloudflare.com/application/terms/
          quote: 'YOU AND CLOUDFLARE AGREE THAT EACH MAY BRING CLAIMS AGAINST THE OTHER ONLY IN YOUR OR ITS INDIVIDUAL CAPACITY AND NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY PURPORTED CLASS OR REPRESENTATIVE PROCEEDING.'
      lastVerified: 2026-11-19
