    - topic: billing.cancellation
      tier: great
      reason: 'You cancel WARP+ in your Apple or Google account at any time, and keep it until the end of the month you paid for.'
      sources:
        - url: https://www.cloudflare.com/application/terms/
          quote: 'If you do not want your subscription to renew automatically, or if you want to change or terminate your subscription, you must log in to your App Store account and follow the instructions to manage or cancel your subscription'
        - url: https://www.cloudflare.com/application/terms/
          quote: 'If you cancel a subscription, you may continue to use the canceled service until the end of your then-current subscription term.'
