# Researched by hand on 2026-11-19 (the full catalog run, VPN batch 1), with a plain fetch from Canada unless named:
# the 1.1.1.1 app's site (one.one.one.one and its FAQ), Cloudflare's WARP client docs (overview, WARP modes, setup,
# privacy, FAQ, legal) and 1.1.1.1 resolver docs (FAQ, encryption, setup and 1.1.1.1 for Families, privacy commitments,
# terms of use), the WARP blog posts of 2019 (1111-warp-better-vpn, announcing-warp-plus), its Application Terms of
# Service and Application Privacy Policy, its Privacy Policy, Website and Online Services Terms of Use, disclosure page,
# abuse page, investor relations home (cloudflare.net), and, with Edge, its compliance resources and transparency report
# pages; and Apple's App Store page for the 1.1.1.1 app in each research country's storefront.
# One provider for Cloudflare's consumer services: 1.1.1.1 with WARP (free), WARP+ Unlimited (paid) and the 1.1.1.1
# public DNS resolver with 1.1.1.1 for Families (free). Its hosting plans (Free, Workers Paid) are the developer and
# hosting category's, for a later batch. Not drafted: Cloudflare One / Zero Trust ("The enterprise version of WARP
# allows organizations to apply security policies to corporate devices.", WARP docs), which is for organizations
# (business: out of scope).
# What WARP is, in its own words: "WARP does not provide anonymity, and it is not designed to prevent servers you
# communicate with from identifying you. WARP also does not allow you to pretend to be accessing the Internet from a
# different country." (WARP modes), and "Although the Application will need to install a VPN profile on your device and
# operates similarly to a VPN product or service, the Application is not designed to hide your identity from the
# Internet properties you access from your device." (Application Terms of Service). It does replace your IP address:
# "No. 1.1.1.1 + WARP replaces your original IP address with a Cloudflare IP that consistently and accurately represents
# your approximate location." (FAQ, "Does WARP reveal my IP address to websites I visit?").
# WARP+ prices: no Cloudflare page prices it ("Select Settings > Upgrade to WARP+ . A dialog will appear with the
# subscription price.", WARP modes; "The fee for WARP+ varies by region", announcing-warp-plus), and it's sold only in
# the app stores ("WARP+ Unlimited is a paid, monthly subscription that can be purchased via the Apple App Store or
# Google Play Store."). So its prices are Apple's App Store pages for the 1.1.1.1 app, one per storefront
# (apps.apple.com/<country>/app/1-1-1-1-faster-internet/id1423538627, its In-App Purchases list: "WARP+ UNLIMITED"),
# whose own data names the storefront's currency ("priceCurrency": CAD, USD, GBP, EUR, AUD, NZD): Canada $6.99, the US
# $4.99, the UK £3.99, Ireland €3.99, Australia $4.99, New Zealand $6.99, Germany, France, Spain and Italy 3,99 € and
# the Netherlands € 3,99 (Infuse's precedent for App Store prices). Monthly, from its docs. Google Play's listing shows
# no price. Apple's pages say nothing of tax, so no price is tax-included.
# Region checklist for CA and US, 2026-11-19: 1. one.one.one.one has language versions, no country pages; 2. no country
# or currency picker; 3. no Cloudflare page holds a WARP+ price; the App Store pages' data names each storefront's
# currency; 4. the checkout is in the app, through the app store: not opened; 5. its docs name no prices; 6. a plain
# fetch of each App Store storefront (the storefront, not the reader's address, sets the price); 7. no bill offered.
# Free use: WARP and the 1.1.1.1 resolver are free plans. Bundles: none. Official resellers: none; Apple and Google bill
# WARP+ (a way to pay). Partners: APNIC (1.1.1.1's research partner) and the ISPs that offer 1.1.1.1 aren't sellers.

id: cloudflare
name: Cloudflare
aliases: [1.1.1.1, cloudflare warp, warp, warp+, 1.1.1.1 with warp, 1.1.1.1 for families]
website: https://www.cloudflare.com
# The 1.1.1.1 app's site and its investor relations site.
domains: [one.one.one.one, cloudflare.net]
category: vpn
spendCategory: software
# Each App Store storefront's currency, from its page's data; the free plans' price is in US dollars.
billingCurrency:
  {
    GLOBAL: USD,
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
# WARP+ is cancelled in the app store it was bought in: its Application Terms of Service, 8.3 Cancellation, give the
# steps for Apple and Google.
cancelUrl: https://www.cloudflare.com/application/terms/
sources: { pricing: https://developers.cloudflare.com/warp-client/warp-modes/ }

# Ways to pay (M11.5), read 2026-11-19: only the app stores ("All payments are handled by the Apple/Google app store",
# WARP modes; its terms: "Certain features require a subscription via Apple App Store or Google Play Store").
paymentMethods:
  - methods: [app-store]
    page: 'WARP modes'
    url: https://developers.cloudflare.com/warp-client/warp-modes/
    quotes:
      - 'WARP+ Unlimited is a paid, monthly subscription that can be purchased via the Apple App Store or Google Play Store.'

# Renewal day (M11.5), read 2026-11-19 in its Application Terms of Service (8.1 Recurring Billing, 7 Subscription
# Terms).
renewalAnchor:
  kind: same-date
  page: 'Application Terms of Service'
  url: https://www.cloudflare.com/application/terms/
  quotes:
    - 'Your Payment Method for the Paid Application Services will be billed on the day that you sign up for such Paid Application Services, regardless of whether you have fully configured the Paid Application Services as of that date.'
    - 'All of your subscriptions to Paid Application Services will automatically renew for periods equal to your initial Subscription Term'
  lastVerified: 2026-11-19

# Owner (M11.2), read 2026-11-19: a public company, its own owner, from its investor relations site's corporate
# overview, which names its listing. No majority holder: no page read names one (its proxy statement wasn't read,
# notes.md). Country: its Application Privacy Policy.
owner:
  name: Cloudflare, Inc.
  page:
    name: Investor Relations (corporate overview)
    url: https://cloudflare.net/
  quotes:
    - 'Cloudflare, Inc. (NYSE: NET) is on a mission to help build a better Internet.'
  country:
    code: US
    page:
      name: Application Privacy Policy
      url: https://www.cloudflare.com/application/privacypolicy/
    quotes:
      - 'Cloudflare is a U.S. based, global company.'
    lastVerified: 2026-11-19
  stock:
    listings:
      - { exchange: NYSE, symbol: NET }
  lastVerified: 2026-11-19
notes: >-
  WARP encrypts your device's traffic to Cloudflare's network and swaps your IP address for a Cloudflare one in your own
  country. It isn't built for anonymity or for appearing in another country. 1.1.1.1 is its free public DNS resolver.
  No account is needed; WARP+ is bought in the app, through Apple's or Google's store.

# General features, read 2026-11-19:
# - Platforms: WARP's setup page lists Android, iOS, Linux, macOS and Windows; the resolver works on any device set to
#   use it.
# - Sign-in: none; the app makes a random ID ("Cloudflare uses a random identifier generated when you install the app",
#   WARP privacy), so account.sign-in is left out (Mullvad's precedent).
# - App languages: one.one.one.one's language menu ("English", "Deutsch", "Español", "Français", "Italiano",
#   "Português", "العربية", "日本語", "한국어", "简体中文", "繁體中文" among nineteen; no Hindi).
# - Support: in-app feedback and bug reports ("go to the app menu and tap on ‘Help’ to send your feedback",
#   one.one.one.one FAQ; its privacy policy: "We require your email address when you provide feedback and bug reports.")
#   and its community ("refer to the community page", WARP FAQ).
# - Closed source: its app is "licensed, not sold" and may not be decompiled (Application Terms of Service).
# - No pause: WARP+ is cancelled in the app store. No parental controls: 1.1.1.1 for Families is a DNS setting you
#   choose for your own device or network, with no lock.
features:
  platforms: [windows, macos, linux, ios, android]
  languages.interface: [en, de, es, fr, it, pt, ar, ja, ko, zh]
  support.channels: [email, community]
  software.open-source: proprietary

# Perks (M11.6): WARP+'s line no feature describes.
perks:
  - id: larger-network
    name: Access to a larger network of Cloudflare data centers

# Categories (M11.3): WARP and WARP+ are VPNs (vpn); the 1.1.1.1 resolver is a DNS service (dns), a plan of its own.
# VPN features, read 2026-11-19:
# - Unlimited traffic: free WARP "is free without bandwidth caps or limitations", and "The unlimited version of WARP+ is
#   available for a monthly subscription fee." (announcing-warp-plus, 2019), so both are unlimited.
# - Server countries: 1, inferred (below). WARP has no server picker: "we see your IP address and use it to assign you a
#   Cloudflare IP address corresponding to the country in which you are connecting from" (Application Privacy Policy),
#   and "WARP also does not allow you to pretend to be accessing the Internet from a different country." (WARP modes).
#   Cloudflare's network spans many countries, but you appear only in your own (notes.md).
# - Devices: WARP+ "You can use your license key on up to five devices." (WARP modes). Free WARP's isn't stated.
# - Protocols: MASQUE ("The WARP application uses MASQUE ↗︎ to encrypt and send traffic", WARP modes), which the
#   registry has no value for; its 2019 posts' WireGuard is no longer what its docs name. Left out (notes.md).
# - Content blocking: the app's 1.1.1.1 for Families DNS setting ("when you enable 1.1.1.1 for Families option from the
#   DNS settings inside the app", its App Store description), which blocks "malware, phishing, or (optionally) adult
#   content" (1.1.1.1 setup).
# - No-logs policy: false. It promises "We do not retain a link between the IP address you use to access the Internet
#   via our Application and the websites you visit.", but keeps pseudonymized "Request data (Source IP, Source Port,
#   Destination IP)" among its Operational Data "for no longer than two years after your last use" and tracks "the
#   aggregate amount of traffic by website and by region" (WARP privacy): limited logging, not a no-logs policy.
# - Audits: none of WARP on any page read; the Big Four firm's examination covers the 1.1.1.1 resolver (below).
# - Anonymous signup: "We do not collect your name, phone number, or credit card information" (Application Privacy
#   Policy); the app needs no account or email.
# - The VPN batch's new features: no page says its servers run from memory only (vpn.ram-only-servers false); the
#   consumer app doesn't connect your own devices to each other (vpn.mesh false; that's Cloudflare One's, for
#   organizations).
# - No page read offers a kill switch, split tunnelling (its desktop "Local proxy" mode sends only the apps you
#   configure through WARP, which isn't excluding apps from the tunnel), multi-hop, port forwarding, Tor or a P2P
#   policy.
# Speeds: none stated as a figure ("WARP, however, is built to trade some throughput for enhanced privacy", FAQ).
# DNS features (the 1.1.1.1 resolver), read 2026-11-19: DoT, DoH and Oblivious DoH ("1.1.1.1 supports three encryption
# standards", encryption page; no DNS over QUIC); 1.1.1.1 for Families blocks malware (1.1.1.2) or malware and adult
# content (1.1.1.3); no query limit on any page (unlimited, the registry's rule); "1.1.1.1 is a DNSSEC-validating
# resolver." (FAQ); no query log for users (its own logs are deleted within 25 hours).
