    - topic: privacy.sign-up-data
      tier: great
      reason: 'There’s no account to make: the app uses a random number, and Cloudflare never gets your name, phone number or card details. Only sending feedback asks for your email.'
      sources:
        - url: https://www.cloudflare.com/application/privacypolicy/
          quote: 'We do not collect your name, phone number, or credit card information (or records of any payments collected by the applicable App Store).'
        - url: https://developers.cloudflare.com/warp-client/privacy/
          quote: 'Cloudflare uses a random identifier generated when you install the app to give you referral bonuses for referring the app to others.'
