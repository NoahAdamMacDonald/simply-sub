  - id: cloudflare.warp
    name: 1.1.1.1 with WARP
    link: https://one.one.one.one/
    features:
      vpn.included: true
      vpn.unlimited-traffic: true
      vpn.data-allowance: unlimited
      vpn.server-countries: 1
      vpn.content-blocking: [malware, adult-content]
      vpn.no-logs-policy: false
      vpn.anonymous-signup: true
      vpn.ram-only-servers: false
      vpn.mesh: false
      account.pause: false
      account.parental-controls: false
    inferred:
      vpn.server-countries:
        reason: 'There’s no server picker: Cloudflare gives you an IP address “corresponding to the country in which you are connecting from”, and WARP “does not allow you to pretend to be accessing the Internet from a different country”.'
        page:
          name: Application Privacy Policy
          url: https://www.cloudflare.com/application/privacypolicy/
        lastVerified: 2026-11-19
    notes: 'Free, with no account. Encrypts your traffic to Cloudflare’s nearest data center and gives you a Cloudflare IP address in your own country; it doesn’t hide who you are or let you appear in another country.'
