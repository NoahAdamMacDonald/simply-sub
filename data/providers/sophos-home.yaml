# Researched by hand on 2026-11-20 (M11.15, security batch 2), read from Canada in Edge (home.sophos.com and sophos.com
# refuse a plain fetch from this machine; its help centre answered its Zendesk API, every article), and the other
# countries' prices through each country's exit (the US, the UK, Ireland, Germany, France, the Netherlands, Spain,
# Italy, Australia and New Zealand). Pages, each quoted where it's used:
# Pricing: home.sophos.com sells one paid plan, Sophos Home Premium, for 1, 2 or 3 years, through its store
# (buy.home.sophos.com, Cleverbridge: "The products offered through this online store are sold by Cleverbridge GmbH, an
# authorized reseller of Sophos products"). The store prices by where the visitor is and shows each period's base price
# struck through beside a 25% first-term discount ("CA$ 59.99", "CA$ 44.99", "For the first 1 year*"), with
# "*Your subscription will automatically renew at the pre-discount base price (including taxes where applicable)." and,
# for a year, "After 12 months, you will be renewed for a fee of CA$ 68.97" (CA$ 59.99 with Quebec's taxes) or "a fee of
# $59.99" from the US; its help: "Pricing for a yearly Sophos Home Premium subscription is $59.99 (MSRP)". The base
# prices are stored. The euro countries' carts show the same prices (€49.95, €89.95, €114.95); France's first exit met a
# Cloudflare check, its second read the cart. The 2- and 3-year prices are kept as terms that renew as themselves: the
# store's footnote under all three options, "*Your subscription will automatically renew at the pre-discount base price
# (including taxes where applicable).", and the terms' "Your subscription to the Services will be automatically renewed
# (subject to applicable law) for another subscription period of equal length" (3.3). The one renewal line read with an
# amount is the 1-year's.
# Tax: Canada's cart adds GST and QST ("Subtotal:", "GST (", "5%"). The euro countries' totals include VAT: Germany's
# 1-year cart totals €37.46 (€49.95 less the 25% offer), "Includes €5.99 VAT ( 19% on €31.47 ).", and the
# Netherlands' the same total, "Includes €6.50 VAT ( 21% on €30.96 )." Those words put the amount between "Includes"
# and "VAT", which core's tax wording doesn't read, and no other page read says it, so no price has taxIncluded. The
# UK's, Ireland's, France's, Spain's, Italy's, Australia's and New Zealand's totals weren't saved.
# Region checklist for CA and US, 2026-11-20: 1. home.sophos.com/en-us is the only English path (no /en-ca/); 2. the
# store's currency menu converts; 3. the store's prices name the currency (CA$, $ from a US exit); 4. the store's cart,
# up to the payment form; 5. the help centre's pricing line ($59.99 MSRP); 6. Edge from Canada and through a US exit;
# 7. no bill.
# Bundles: none. Official resellers: none named for home users (its store is run by Cleverbridge, a payment reseller,
# not listed; Staples once sold "Sophos Anti-Virus", a product its help article says is supported separately).
# Free use: Sophos Home Free ended for new users ("Sophos has made a business decision to change its Sophos Home Free
# option to a 30-day free trial for Sophos Home Premium"; accounts that switched before November 11th 2021 keep it), so
# it isn't a plan. Its free mobile app, Sophos Intercept X for Mobile, is the free plan (below).

id: sophos-home
name: Sophos Home
website: https://home.sophos.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    AU: AUD,
    NZ: NZD,
    GLOBAL: USD,
  }
# Its help article on renewing, which says how to turn auto-renewal off (the store's order email or its purchase
# lookup tool) and where to see whether a subscription renews.
cancelUrl: https://support.home.sophos.com/hc/en-us/articles/25899202064276-How-do-I-renew-my-Sophos-Home-subscription
sources: { pricing: https://buy.home.sophos.com/1461/purl-homepremium }
# Owner (M11.2), read 2026-11-20 in Edge: Sophos's own about page (sophos.com/en-us/company) and its company information
# page name no owner (the latter lists its licensing and sales companies by region, and sends questions on its
# "Ultimate Beneficial Owner" to its legal team), so its owner's own page (rule 2): Thoma Bravo's press release on
# Sophos buying Secureworks (February 2025), linked from its portfolio page for Sophos, which lists "YEAR INVESTED"
# "2020". Its consumer terms name the company that offers Sophos Home ("offered by Sophos Limited"), and its privacy
# notice gives the country.
owner:
  name: Sophos Limited (backed by Thoma Bravo, a software investment firm)
  page:
    name: Sophos Completes Secureworks Acquisition (Thoma Bravo press release)
    url: https://www.thomabravo.com/press-releases/sophos-completes-secureworks-acquisition
  quotes:
    - 'Sophos is backed by Thoma Bravo, a leading software investment firm.'
  country:
    code: GB
    page:
      name: Sophos Group Privacy Notice
      url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
    quotes:
      - 'This website is operated by Sophos Limited, a company registered in England and Wales under company number 2096520'
    lastVerified: 2026-11-20
  website: https://www.thomabravo.com
  lastVerified: 2026-11-20
