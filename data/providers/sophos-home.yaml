# Terms and policies (BLUEPRINT §4.10), read 2026-11-20 in Edge: the Sophos Consumer Terms of Service (the home site's
# Legal link; they're the app's licence too, agreed by "INSTALLING OR ACCESSING OR USING THE SOFTWARE"), the Sophos Group
# Privacy Notice (last updated 1 July 2026), its store's cart (renewal and refund lines), the help centre's billing,
# renewal, account, MFA and support articles (Zendesk API), its trust, certification and security advisory pages. Read
# for no topic: its cookie information page (the privacy notice's cookie section says the same). Not read: Cleverbridge's
# own terms and privacy policy (the store's reseller), and the app stores' terms for Intercept X for Mobile. No shared
# document applies (data/policies has none of Sophos').
policies:
  links:
    - name: Consumer terms of service
      url: https://www.sophos.com/en-us/legal/sophos-consumer-terms-of-service
    - name: Privacy notice
      url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
    - name: Store checkout
      url: https://buy.home.sophos.com/1461/purl-homepremium
    - name: Renewing and turning off auto-renewal
      url: https://support.home.sophos.com/hc/en-us/articles/25899202064276-How-do-I-renew-my-Sophos-Home-subscription
    - name: Deleting your account
      url: https://support.home.sophos.com/hc/en-us/articles/115005445086-Deleting-your-Sophos-Home-account
    - name: Creating an account
      url: https://support.home.sophos.com/hc/en-us/articles/115005323643-Creating-a-Sophos-Home-account
    - name: General FAQ
      url: https://support.home.sophos.com/hc/en-us/articles/115005457983-General-FAQ
    - name: Trust center
      url: https://www.sophos.com/en-us/trust
    - name: Certifications
      url: https://www.sophos.com/en-us/trust/business-certifications
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use its websites and services, for its own analytics and to improve them. You can refuse some cookies on its websites, one browser at a time; nothing says you can turn the rest off.'
      sources:
        - url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
          quote: 'We use this information for our internal analytics purposes, and to improve the quality, relevance, and security of our Services.'
        - url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
          quote: 'Because we respect your right to privacy, you can choose not to allow some types of cookies.'
      action:
        name: 'Cookies and your choices (privacy notice)'
        url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
      lastVerified: 2026-11-20
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It helps advertising companies show you its ads on other websites, using cookies tied to your details. You can turn off advertising cookies, but only in each browser.'
      sources:
        - url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
          quote: 'We may also help these service providers place their own cookies, by deploying a cookie that is associated with a “hashed” value associated with interest-based or demographic data, to permit advertising to be directed to you on other websites, applications or services.'
        - url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
          quote: 'Because we respect your right to privacy, you can choose not to allow some types of cookies.'
      action:
        name: 'Cookies and your choices (privacy notice)'
        url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
      lastVerified: 2026-11-20
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'It and its partners track your interests to show you more relevant ads, on its sites and elsewhere. You can block advertising cookies, but only in each browser.'
      sources:
        - url: https://www.sophos.com/en-us/legal/sophos-group-privacy-notice
          quote: 'Cookies also enable us and our third-party partners to track and target the interests of our users to enhance the onsite or in-product experience through content, features, and advertisements which are more relevant to you.'
