# Renewal day (M11.5): its consumer terms renew "for another subscription period of equal length" and bill by the date
# you signed up, a shorter month's last day when it has none.
renewalAnchor:
  kind: same-date
  page: Sophos Consumer Terms of Service
  url: https://www.sophos.com/en-us/legal/sophos-consumer-terms-of-service
  quotes:
    - 'You acknowledge that billing may not occur on the same date of each month, depending on when you signed up for the Services.'
  lastVerified: 2026-11-20
# Lab results (M11.2): AV-TEST's newest test of Sophos Home is of December 2017 (Sophos Home 1.2 for macOS), and it isn't
# in AV-TEST's Windows tests of 2025 and 2026, so no rating is listed. AV-Comparatives' and SE Labs' aren't listed
# (data/raters.yaml).

# General features, read 2026-11-20. Platforms: "Sophos Home can protect both Windows and Mac computers" (General FAQ;
# "No" for Linux); phones and tablets use the separate free app. Sign-in: a password, with multi-factor authentication
# from an authenticator app ("Setting it up requires an Authenticator app"), a browser remembered for 30 days, and
# Direct Access from a protected computer ("access your Sophos Home dashboard directly from a PC/Mac that is protected
# with Sophos Home"). Support: "Sophos Home Premium customers have access to dedicated support personnel Monday to
# Friday, 9AM to 7PM Eastern US Time, via chat and webform/email" ("There is no phone support"). App languages: the
# dashboard's "English, French, German, Italian, Japanese and Spanish" (the antivirus follows the computer's language).
# No pause (auto-renewal is turned off instead).
features:
  platforms: [windows, macos]
  account.sign-in: [password, totp, trusted-device]
  support.channels: [chat, email]
  languages.interface: [en, fr, de, it, ja, es]

# Perks (M11.6): what its features article lists that no feature describes, in its words.
perks:
  - id: exploit-protection
    name: Malicious Exploit Protection
  - id: remote-management
    name: Remote antivirus Management
  - id: amsi
    name: AMSI integration

# Features, read 2026-11-20: its help centre's "Sophos Home features" table (Premium on Windows and macOS: Real-Time
# Antivirus, Predictive AI Threat Detection (Windows), Parental Website Filtering, Web Protection, Remote antivirus
# Management, Ransomware Security, "Advanced Web Security and Banking Protection" ("Blocks phishing sites, BITM attacks,
# and compromised websites"), Advanced Malware Scan and Clean (Windows), AMSI integration (Windows); "Protect up to a
# total of 10 devices"), its home page ("Blocks ransomware and rolls back any affected files"), the General FAQ
# ("behavioral (signature-less) based detections"), the scan articles (scans you start, and "Scheduled scan" set from the
# dashboard), "Allowing games to run along with Sophos Home" ("Sophos Home introduced Game Mode in 2024", Windows) and the
# troubleshooting article's "privacy features to secure your webcam (Windows only)". Its banking protection is the secure
# browser feature's banking protection (the store's name for it is kept as the label). No firewall (its Malicious
# Traffic Detection watches connections, no more), Wi-Fi check, spam filter, anti-theft, optimizer, VPN or password
# manager on any Sophos Home page; its keystroke encryption and the Mac's Privacy Guard were removed (their notices).
