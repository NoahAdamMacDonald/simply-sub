# Drafted by the discovery pipeline on 2026-10-28 (BLUEPRINT §6.5) from these pages, each quoted where it's used.
# Pricing: https://support.claude.com/en/articles/8325606-what-is-the-pro-plan,
# https://support.claude.com/en/articles/11049741-what-is-the-max-plan, https://claude.com/pricing.
# Payment methods: https://support.claude.com/en/articles/8325618-paid-plan-billing-faqs.
# Cancelling: https://support.claude.com/en/articles/12386328-request-a-refund-for-a-paid-claude-plan,
# https://support.claude.com/en/articles/8325617-cancel-your-pro-or-max-subscription.
# Terms: https://www.anthropic.com/legal/consumer-terms.
# Privacy: https://www.anthropic.com/legal/privacy.
# Bundles: none found.
# Official resellers: none found.
# Canada's prices (2026-10-30, the feedback after M10): claude.com/pricing, read from Canada in Canada's English with a
# browser's own user agent, shows "$23 Per month with annual subscription discount ($280 billed up front). $28 if
# billed monthly." and Max "From $140 Per month", a bare $ (a headless browser's user agent gets the US prices). The
# page's own pricing data (claude.ai/api/billing/subscription_pricing, which it loads) names "country":"CA" and
# "currency":"CAD": Pro 2800 a month and 28000 a year, Max 5x 14000 and Max 20x 28000 a month, in cents, none an
# offer, tax not included ("show_included":false). The Pro article: "with pricing in your local currency where
# supported". The owner's bill agrees: CA$31.64 for Pro, $28 with Ontario's 13% HST.
# Renamed (2026-10-30, M10.27): claude.com/pricing now lists Free, Pro, Max ($140, "5x Pro usage every 5 hours and
# every week") and Ultra ($280, "No 5-hour limit‡", "10x Pro usage every week"), in Canada. The Ultra article: "The Max
# 20x plan is now called the Ultra plan. Existing Max 20x subscribers move to Ultra automatically, with no price
# change." and "The Ultra plan is available for $200 per month."; the Max article: "The Max plan is available for $100
# per month." So both keep their ids: claude.max-5x is Max and claude.max-20x is Ultra. Ultra's limits are new:
# "Ultra gives you 10x the weekly usage of Pro, with no 5-hour limit for verified accounts" (it had 20 times Pro's).
# Not on the pages: Max's yearly price: its help article says nothing about yearly billing; the card networks it
# takes: its billing pages name none; the countries it sells in: its Pro article says only certain supported
# locations; official resellers: none found.

id: claude
name: Claude
website: https://claude.com
domains: [claude.ai]
category: ai
spendCategory: software
billingCurrency: { CA: CAD, GLOBAL: USD, US: USD }
cancelUrl: https://support.claude.com/en/articles/8325617-cancel-your-pro-or-max-subscription
sources: { pricing: https://claude.com/pricing }
# Owner (M11.2), read 2026-11-02: claude.com has no about page saying so; its terms, on anthropic.com, do.
# Ways to pay (M11.5), read 2026-11-02 on its pricing page: a credit card, or the App Store.
paymentMethods:
  - methods: [card, app-store]
    page: Pricing
    url: https://claude.com/pricing
    quotes:
      - Credit card
      - "If you subscribed through the App Store, Apple handles the refund, so you'll request it from Apple."
owner:
  name: 'Anthropic, PBC'
  page:
    name: Terms of service
    url: https://www.anthropic.com/legal/consumer-terms
  quotes:
    - 'These Terms are a contract between you and Anthropic, PBC (and not our Providers)'
  lastVerified: 2026-11-02

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their
# words.
perks:
  - id: claude-code
    name: Claude Code
  - id: priority-access
    name: Priority access at high traffic times
  - id: usage-5x
    name: 5x Pro usage every 5 hours and every week
  - id: weekly-usage-10x
    name: 10x Pro usage every week
  - id: no-5-hour-limit
    name: No 5-hour limit for verified accounts
  - id: api-credits-100
    name: $100 a month in API credits to build on the Claude Platform
  - id: api-credits-200
    name: $200 a month in API credits

# Renewal day (M11.5), read 2026-11-03 (M11.9) in its paid plans' billing FAQs: the day you subscribe sets the billing date,
# which you move only by subscribing again on the day you want. Its consumer terms and invoices article don't say.
renewalAnchor:
  kind: same-date
  page: Paid plan billing FAQs
  url: https://support.claude.com/en/articles/8325618-paid-plan-billing-faqs
  quotes:
    - "No, there isn't a direct way to change your subscription billing date. However, you can unsubscribe from your current plan, then resubscribe on your preferred billing date to establish your new monthly billing cycle on a different date."
  lastVerified: 2026-11-03

