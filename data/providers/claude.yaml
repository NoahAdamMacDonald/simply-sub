# Every agreement a user accepts (the owner's rule, 2026-11-03), read that day: the consumer terms "include our
# Acceptable Use Policy" (anthropic.com/legal/aup, its Usage Policy) and name a Supported Regions Policy (where it's
# sold, which no topic grades) and supplemental terms that some features post. The sign-up form's agreement line
# shows only after an email address is entered, so it wasn't read.
policies:
  links:
    - name: 'Verify your phone number'
      url: https://support.claude.com/en/articles/8287232-verify-your-phone-number
    - name: Cancelling
      url: https://support.claude.com/en/articles/8325617-cancel-your-pro-or-max-subscription
    - name: Cancelling (2)
      url: https://support.claude.com/en/articles/12386328-request-a-refund-for-a-paid-claude-plan
    - name: Terms of service
      url: https://www.anthropic.com/legal/consumer-terms
    - name: Privacy policy
      url: https://www.anthropic.com/legal/privacy
    - name: 'Pricing'
      url: https://claude.com/pricing
    - name: 'Exporting your data'
      url: https://support.claude.com/en/articles/9450526-how-can-i-export-my-claude-data
    - name: 'Responsible disclosure policy'
      url: https://www.anthropic.com/responsible-disclosure-policy
    - name: 'Cookie policy'
      url: https://www.anthropic.com/legal/cookies
    - name: 'Usage policy'
      url: https://www.anthropic.com/legal/aup
  ratings:
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel online whenever you like, but at least a day before it renews, or you pay for the next period. You keep it until the end of the time you paid for.'
      sources:
        - url: https://support.claude.com/en/articles/8325617-cancel-your-pro-or-max-subscription
          quote: 'To avoid being charged for your next billing period, cancel your subscription at least 24 hours before your next billing date.'
        - url: https://support.claude.com/en/articles/8325617-cancel-your-pro-or-max-subscription
          quote: 'Your cancellation will take effect at the end of your current billing period and you can continue using your paid plan until then.'
      lastVerified: 2026-11-03
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back unless its terms or the law say so, but you keep using it until the end of the time you paid for.'
      sources:
        - url: https://support.claude.com/en/articles/12386328-request-a-refund-for-a-paid-claude-plan
          quote: 'Except as expressly provided in our Consumer Terms of Service or where required by law, all payments are non-refundable.'
        - url: https://support.claude.com/en/articles/8325617-cancel-your-pro-or-max-subscription
          quote: 'Your cancellation will take effect at the end of your current billing period and you can continue using your paid plan until then.'
      lastVerified: 2026-11-03
    - topic: billing.price-changes
      tier: great
      reason: A new price never applies to time you've already paid for, and it tells you at least 30 days before a price goes up, so you can cancel first.
      sources:
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: we will not make any change to the fees applicable to your Subscription during the current Initial Term or Renewal Term, as applicable
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: we will inform you at least 30 days in advance of the change
      lastVerified: 2026-11-03
    - topic: legal.disputes
      tier: good
      reason: "There's no arbitration: disputes go to the courts in San Francisco, California, the ones it chose."
      sources:
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: any disputes arising out of or relating to these Terms will be resolved exclusively in the state or federal courts located in San Francisco, California
      lastVerified: 2026-11-03
    - topic: legal.terms-changes
      tier: poor
      reason: It can change its terms when it wants, and if you keep using Claude after they're posted, you've agreed to them.
      sources:
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: If you continue to access the Services after we post the updated Terms on Anthropic’s website or otherwise give you notice of Terms changes, then you agree to the updated Terms.
      lastVerified: 2026-11-03
    - topic: legal.account-closure
      tier: neutral
      reason: It can close your account without notice if it believes you broke its terms or usage policy, with no refund; if it ends your plan for any other reason, it refunds the unused time.
      sources:
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: If we terminate your access to the Services due to a violation of these Terms and you have a Subscription, you will not be entitled to any refund.
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: If we exercise this right, we will refund you, on a pro rata basis, the fees you paid for the remaining portion of your Subscription after termination.
        - url: https://www.anthropic.com/legal/aup
          quote: 'If we suspect that you may have violated our Usage Policy, we may warn you or throttle, limit, suspend, or terminate your access to our products and services.'
      lastVerified: 2026-11-03
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use it, like when you use it, what you search for and what you click, and uses cookies to study and market to you. You can only limit the cookies, browser by browser. (Training on your chats is graded under AI training.)'
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: 'Usage Information: We collect information about your use of the Services, such as the dates and times of access, browsing history, search, information about the links you click and about third-party applications, services, and content you integrate or interact with, pages you view, and other information about how you use the Services, and technology on the devices you use to access the Services.'
        - url: https://www.anthropic.com/legal/privacy
          quote: 'These technologies help us to recognize you, customize or personalize your experience, market additional products or services to you, and analyze the use of our Services to make them safer and more useful to you.'
        - url: https://www.anthropic.com/legal/cookies
          quote: 'You can control how and when your personal data is shared or used for purposes of advertising about Anthropic’s AI services by clicking on the Privacy Choices link at the bottom of the page or enabling global privacy controls.'
      action:
        name: 'How to opt out of ad sharing'
        url: https://www.anthropic.com/legal/cookies
      lastVerified: 2026-11-03
    - topic: privacy.data-sharing
      tier: poor
      reason: "It doesn't sell your data, but it shares it to show you ads for its own products. You can only say no in each browser, with its Privacy Choices link or your browser's privacy signal."
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: 'Anthropic does not “sell” your personal data as that term is defined by applicable laws and regulations.'
        - url: https://www.anthropic.com/legal/privacy
          quote: 'You can opt-out of sharing your personal data for targeted advertising to promote our products and services, and we will honor global privacy controls.'
        - url: https://www.anthropic.com/legal/cookies
          quote: 'You can control how and when your personal data is shared or used for purposes of advertising about Anthropic’s AI services by clicking on the Privacy Choices link at the bottom of the page or enabling global privacy controls.'
      action:
        name: 'How to opt out of ad sharing'
        url: https://www.anthropic.com/legal/cookies
      lastVerified: 2026-11-03
    - topic: privacy.data-deletion
      tier: good
      reason: You can delete chats yourself, and they're gone from its systems within 30 days; you can also ask it to delete your other data, with some exceptions.
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: You also are able to delete individual conversations, which will be removed immediately from your conversation history and automatically deleted from our back-end within 30 days.
        - url: https://www.anthropic.com/legal/privacy
          quote: the right to request that we delete personal data collected from you when you use our Services, subject to certain exceptions.
      action:
        name: How to delete a conversation
        url: https://support.anthropic.com/en/articles/8230524-how-can-i-delete-or-rename-a-conversation
      lastVerified: 2026-11-03
    # M11.9's topics, pulled forward at the owner's request (2026-11-02), read that day.
    - topic: privacy.ads-tracking
      tier: poor
      reason: "Claude shows no ads, but Anthropic uses cookies to market its products to you. You can only say no in each browser, with its Privacy Choices link or your browser's privacy signal."
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: 'These technologies help us to recognize you, customize or personalize your experience, market additional products or services to you, and analyze the use of our Services to make them safer and more useful to you.'
        - url: https://www.anthropic.com/legal/cookies
          quote: 'You can control how and when your personal data is shared or used for purposes of advertising about Anthropic’s AI services by clicking on the Privacy Choices link at the bottom of the page or enabling global privacy controls.'
      action:
        name: 'How to opt out of ad sharing'
        url: https://www.anthropic.com/legal/cookies
      lastVerified: 2026-11-03
    - topic: privacy.ai-training
      tier: poor
      reason: 'Your chats train its AI unless you turn that off, and even then chats flagged for a safety check, or that you rate, still can.'
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: 'We may use your Inputs and Outputs to train and improve Anthropic AI models, unless you opt out through your account settings.'
        - url: https://www.anthropic.com/legal/privacy
          quote: "Even if you opt-out, we will use Inputs and Outputs for model improvement when: (i) your conversations are flagged for safety review to improve our ability to detect harmful content, enforce our policies, or advance AI safety research, or (ii) you've explicitly reported the materials to us (for example via our feedback mechanisms)."
      action:
        name: 'Turn off training in your Privacy Settings'
        url: https://claude.ai/new#settings/data-privacy-controls
      lastVerified: 2026-11-02
    - topic: privacy.content-access
      tier: neutral
      reason: 'Its systems check your chats for harmful content, and it may look at flagged ones with your account to enforce its rules. (Training on your chats is graded under AI training.)'
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: 'If our systems flag Inputs or Outputs for harmful content or for potentially violating our policies, we disassociate the content from your user ID to train our trust and safety internal classification and generative models.'
        - url: https://www.anthropic.com/legal/privacy
          quote: 'However, we may re-identify the Inputs or Outputs to enforce our Terms of Service or Usage Policy with the responsible user if necessary.'
      lastVerified: 2026-11-03
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your information as long as it decides it needs it. Chats you delete are gone from its systems within 30 days.'
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: 'Anthropic retains your personal data for as long as reasonably necessary for the purposes and criteria outlined in this Privacy Policy and explained further in our privacy center.'
        - url: https://www.anthropic.com/legal/privacy
          quote: 'You also are able to delete individual conversations, which will be removed immediately from your conversation history and automatically deleted from our back-end within 30 days.'
      lastVerified: 2026-11-02
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can download your chats and account details yourself from Settings, but it doesn’t say what kind of file you get.'
      sources:
        - url: https://support.claude.com/en/articles/9450526-how-can-i-export-my-claude-data
          quote: 'Individual Claude users can export user information and chat history from Settings > Privacy on the web app or Claude Desktop.'
      action:
        name: 'How to export your data'
        url: https://support.claude.com/en/articles/9450526-how-can-i-export-my-claude-data
      lastVerified: 2026-11-02
    - topic: privacy.government-requests
      tier: neutral
      reason: "It hands over information when the law requires it, and otherwise only to stop harm or fraud, or to enforce its rules. It doesn't say it tells you, or publish how often."
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: 'We may share personal data with government authorities, law enforcement, or other third parties where, based on the information available to us, we have a good-faith belief that disclosure is reasonably necessary to'
      lastVerified: 2026-11-03
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your information goes to its servers in the US and other countries, with the EU’s standard legal safeguards for Europeans. For Canadians it warns other countries’ laws may protect it less.'
      sources:
        - url: https://www.anthropic.com/legal/privacy
          quote: 'Anthropic is a global company, and when you access our Services, your personal data is transferred to our servers in the US, or to other countries outside the European Economic Area (“EEA”) and the UK for the purposes outlined in Section 2 of this Privacy Policy, for example to provide you with the Service, or to train our models, or to conduct research.'
        - url: https://www.anthropic.com/legal/privacy
          quote: 'Where Anthropic transfers information outside the EEA or the UK, we ensure it benefits from an adequate level of data protection by relying on:'
      lastVerified: 2026-11-02
    - topic: privacy.sign-up-data
      tier: poor
      reason: 'To make an account you give your name and email address, and a phone number that can get text messages, with no way to skip it.'
      sources:
        - url: https://support.claude.com/en/articles/8287232-verify-your-phone-number
          quote: 'We also require a phone number from a supported location to create an account, and there isn’t a way to skip this step.'
        - url: https://www.anthropic.com/legal/privacy
          quote: 'Anthropic collects identifiers, including your name, email address, and phone number when you sign up for an Anthropic account, or to receive information on our Services.'
      lastVerified: 2026-11-03
    - topic: billing.free-trials
      status: not-stated
      reason: 'Its terms describe no free trial: the free plan simply stays free.'
      pages: [https://www.anthropic.com/legal/consumer-terms]
      lastVerified: 2026-11-02
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own, but not that it reminds you first.'
      pages: [https://www.anthropic.com/legal/consumer-terms]
      lastVerified: 2026-11-02
    - topic: billing.fees
      tier: neutral
      reason: 'If it adds a new charge, it asks you to accept it before charging you. Extra features may cost more.'
      sources:
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: 'If we charge additional fees in connection with our Services, we will give you an opportunity to review and accept the additional fees before you are charged.'
      lastVerified: 2026-11-02
    - topic: billing.plan-changes
      tier: good
      reason: 'You can switch from monthly to yearly billing in your settings, and the time you already paid for counts toward the year.'
      sources:
        - url: https://claude.com/pricing
          quote: "If you're already on a monthly plan, you can switch to annual in Settings > Billing, and any unused time is credited toward your first annual invoice."
      lastVerified: 2026-11-02
    - topic: legal.content-rights
      tier: neutral
      reason: 'What you type stays yours. It may use your chats to run and improve Claude and to build other products.'
      sources:
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: 'As between you and Anthropic, and to the extent permitted by applicable law, you retain any right, title, and interest that you have in the Inputs you submit.'
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: 'We may use Materials to provide, maintain, and improve the Services and to develop other products and services'
      lastVerified: 2026-11-02
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change, pause or stop Claude, or features you pay for, at any time without warning, and says it owes you nothing for it.'
      sources:
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: 'we reserve the right to modify, suspend, or discontinue the Services or your access to the Services, in whole or in part, at any time without notice to you.'
        - url: https://www.anthropic.com/legal/consumer-terms
          quote: 'We will not be liable for any change to or any suspension or discontinuation of the Services or your access to them.'
      lastVerified: 2026-11-02
    - topic: legal.inactivity
      tier: good
      reason: 'It only closes free accounts that haven’t been used for over a year, and tells you first.'
      sources:
