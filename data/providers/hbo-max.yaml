# Researched by hand on 2026-11-04 (M11.15, the streaming category). HBO Max isn't sold in Canada (its help centre
# sends a Canadian visitor to its "geo-availability" page), so every page was read through a country's exit (the
# owner's choice of 2026-11-04). Pages, each quoted where it's used:
# Pricing: its help centre's "HBO Max plans and prices" for each country (help.hbomax.com/<country>-en/Answer/Detail/
# 000002547): the US's ("Basic with Ads - $10.99/month or $109.99/year", Standard $18.49 or $184.99, Premium $22.99 or
# $229.99, "Prices don't include applicable taxes"), the UK's (Basic with Ads £4.99, Standard with Ads £5.99, Standard
# £9.99, Premium £14.99) and Ireland's (€5.99, €6.99, €10.99, €15.99). For Germany, France, Spain and Italy it says
# "go to HBOMax.com": hbomax.com/<country>/en, Germany's in its plan picker (€5.99, €11.99, €16.99), France's and Spain's
# monthly or yearly (Basic with Ads €6.99 or €69.90, Standard €10.99 or €109.00, Premium €15.99 or €159.00) and Italy's
# monthly (€6.99, €11.99, €16.99).
# Not listed: the UK's TNT Sports plans and bundles and its 12-month "Saver" plans; the US's Extra Member add-on and its
# Disney+ and Hulu bundle, not read yet; Germany's and the Netherlands' bundles with RTL+ and Videoland.
# Region checklist, 2026-11-04: 1. the help centre's and hbomax.com's country paths; 4. the plan pickers, never past
# them: the Netherlands' shows only its Videoland bundles ("From €5.99/month" for HBO Max alone, unnamed), and
# Australia's and New Zealand's pages show no prices and no picker opened, so those three aren't priced or listed as
# sold; Canada isn't sold.

# Coverage: hbo-max.standard-ads in US, DE, FR, ES and IT: Standard with Ads is in the UK's and Ireland's plan lists
# only (2026-11-04).

id: hbo-max
name: HBO Max
website: https://www.hbomax.com
# Its help centre, its parent's privacy centre and investor site.
domains: [help.hbomax.com, wbdprivacy.com, ir.wbd.com]
category: streaming
spendCategory: streaming
billingCurrency: { US: USD, GB: GBP, IE: EUR, DE: EUR, FR: EUR, ES: EUR, IT: EUR }
cancelUrl: https://help.hbomax.com/us-en/Answer/Detail/000002526
sources: { pricing: https://help.hbomax.com/us-en/Answer/Detail/000002547 }
# Accepted cards and ways to pay, read 2026-11-04 through a US exit: a payment method that is "issued by a US-based
# bank" and "one of these: American Express, Apple Pay, Discover, JCB, MasterCard, PayPal, or Visa" ("Change a
# WarnerMedia-billed subscription"); app stores and "your internet, mobile, or TV provider" ("Change your payment
# method"). Other countries' lists aren't read yet.
acceptedNetworks:
  US:
    networks: [amex, discover, jcb, mastercard, visa]
    url: https://help.hbomax.com/us-en/Answer/Detail/000002528
    quotes:
      - 'Be one of these: American Express, Apple Pay, Discover, JCB, MasterCard, PayPal, or Visa'
paymentMethods:
  - methods: [card, apple-pay, paypal]
    regions: [US]
    page: 'Change a WarnerMedia-billed subscription'
    url: https://help.hbomax.com/us-en/Answer/Detail/000002528
    quotes:
      - 'Be one of these: American Express, Apple Pay, Discover, JCB, MasterCard, PayPal, or Visa'
  - methods: [app-store, provider-billing]
    regions: [US]
    page: 'Change your payment method'
    url: https://help.hbomax.com/us-en/Answer/Detail/000002525
    quotes:
      - 'Google Play'
      - 'You can also check your bank statements or ask your internet, mobile, or TV provider if they bill you for HBO Max.'

# Owner: Paramount Skydance Corporation, since it acquired Warner Bros. Discovery (Warner Bros. Discovery's investor
# site, 2026-11-04). Its US terms give WarnerMedia Direct, LLC's New York address.
owner:
  name: 'Paramount Skydance Corporation, which acquired Warner Bros. Discovery'
  website: https://ir.wbd.com
  page:
    name: 'Warner Bros. Discovery investor relations'
    url: https://ir.wbd.com/investor-relations/default.aspx
  quotes:
    - 'Following the acquisition of Warner Bros. Discovery by Paramount Skydance Corporation'
  country:
    code: US
    page:
      name: Terms of use
      url: https://www.hbomax.com/terms-of-use/en-us
    quotes:
      - 'New York, NY 10003'
    lastVerified: 2026-11-04
  lastVerified: 2026-11-04

# Renewal day (M11.5), read 2026-11-04: "Your HBO Max subscription automatically renews until you cancel it" (its plans
