# Terms and policies, read 2026-11-04 (M11.15) through a US exit: HBO Max's US Terms of Use, its help centre's plans and
# profiles articles, and Warner Bros. Discovery's privacy policies, rated once as a shared document
# (data/policies/wbd-privacy.yaml). Its sign-up form opens only after a plan is picked, which the reader didn't reach,
# and its terms don't say what an account needs, so sign-up data stays unrated.
policies:
  shared: [wbd-privacy]
  links:
    - name: 'Terms of use'
      url: https://www.hbomax.com/terms-of-use/en-us
    - name: 'Plans and prices'
      url: https://help.hbomax.com/us-en/Answer/Detail/000002547
    - name: 'Manage an HBO Max subscription'
      url: https://help.hbomax.com/us-en/Answer/Detail/000002529
  ratings:
    - topic: privacy.sign-up-data
      status: not-stated
      reason: 'Its terms don’t say what an account asks for; its sign-up form opens only after you pick a plan.'
      pages: [https://www.hbomax.com/terms-of-use/en-us]
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel at any time and keep watching until the end of the period you paid for.'
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'YOU CAN CANCEL YOUR SUBSCRIPTION AT ANY TIME AND YOU WILL CONTINUE TO HAVE ACCESS TO THE HBO MAX PLATFORM THROUGH THE END OF THE THEN-CURRENT BILLING PERIOD'
      lastVerified: 2026-11-04
    - topic: billing.refunds
      tier: neutral
      reason: "You don't get money back when you cancel, but you keep watching until the end of the period."
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'WE DO NOT PROVIDE REFUNDS, CREDIT, OR PRORATED BILLING FOR CANCELED SUBSCRIPTIONS.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you about a new price as the law requires, without saying how far ahead.'
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'Your Subscription Provider may change the amount of the Subscription Fee and will communicate price changes to you in accordance with applicable law.'
      lastVerified: 2026-11-04
    - topic: billing.free-trials
      tier: poor
      reason: 'A trial turns into a paid subscription unless you cancel before it ends, needs a payment method up front, and names no reminder.'
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'UNLESS YOU TIMELY CANCEL YOUR TRIAL SUBSCRIPTION BEFORE THE END OF YOUR FREE TRIAL PERIOD, YOUR TRIAL SUBSCRIPTION WILL CONVERT TO A PAID SUBSCRIPTION'
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'At the time of signing up for a Trial Subscription, you must provide a valid Payment Method to use the Platform during the Free Trial Period.'
      lastVerified: 2026-11-04
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say monthly and yearly plans renew on their own, but not that it reminds you first.'
      pages: [https://www.hbomax.com/terms-of-use/en-us]
      lastVerified: 2026-11-04
    - topic: billing.fees
      tier: good
      reason: 'Besides the price and taxes, you pay only the costs of collecting money you owe if you don’t pay.'
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'costs incurred to collect any unpaid amounts, such as bank overdraft fees, collection agency fees'
      lastVerified: 2026-11-04
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its terms and its subscription articles say how to change plans, but not what happens to what you’ve paid.'
      pages:
        - https://www.hbomax.com/terms-of-use/en-us
        - https://help.hbomax.com/us-en/Answer/Detail/000002529
      lastVerified: 2026-11-04
    - topic: legal.disputes
      tier: poor
      reason: 'You must take any dispute to private arbitration, one person at a time, with no class actions or jury. You can opt out of arbitration only if a mass arbitration leaves your claim unresolved.'
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'THESE TERMS REQUIRE THE USE OF ARBITRATION ON AN INDIVIDUAL BASIS TO RESOLVE DISPUTES, RATHER THAN COURTS OR JURY TRIALS'
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'If your claim is not resolved as part of the staged process identified above, either:'
      action:
        name: 'Its arbitration terms'
        url: https://www.hbomax.com/terms-of-use/en-us
      lastVerified: 2026-11-04
    - topic: legal.terms-changes
      tier: poor
      reason: 'It changes its terms by posting them, and using HBO Max afterwards, or not cancelling before you renew, means you accept them.'
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'We will communicate material changes to this Agreement by making the revised Terms available for your review on the Platform.'
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'By continuing to use the Platform after any revised Terms come into effect'
      lastVerified: 2026-11-04
    - topic: legal.account-closure
      tier: bad
      reason: 'It can suspend or end your subscription and account at once, for any reason or none.'
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'Any Subscription Provider may suspend or terminate your Subscription and access to the Platform and/or your HBO Max Account immediately for any reason or for no reason whatsoever'
      lastVerified: 2026-11-04
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change the price, what your plan includes or any part of HBO Max at any time.'
      sources:
        - url: https://www.hbomax.com/terms-of-use/en-us
          quote: 'We reserve the right to modify this Agreement, the Subscription Fee, the benefits associated with any Subscription plan, additional conditions of your Subscription or change any part of the Platform at any time.'
      lastVerified: 2026-11-04
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://www.hbomax.com/terms-of-use/en-us]
      lastVerified: 2026-11-04
    - topic: service.account-sharing
      tier: good
      reason: 'Up to five people who live with you can each have a profile. It names no checks in its terms.'
