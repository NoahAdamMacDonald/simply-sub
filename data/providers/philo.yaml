# Researched by hand on 2026-11-13 (M11.15, streaming batch 8), read with Edge through a US exit for philo.com's pricing,
# home and FAQ pages (from Canada every philo.com page in Edge says "Sorry, Philo is only available in the United
# States... for now."), and with a plain fetch from Canada for its terms, privacy policy and help centre
# (help.philo.com, every article in its sitemap). Pages, each quoted where it's used:
# Pricing: its pricing page (philo.com/go/pricing, through a US exit): Essential "$25/mo" and Bundle+ "$33/mo", and its
# add-ons (Hallmark+ "$9/mo", ALLBLK "$7/mo", MGM+ "$8/mo", Movies & More "$3/mo", STARZ "$12/mo", and the Bundle+
# upgrades HBO Max Standard "$13/mo", AMC+ ad-free "$4/mo" and discovery+ ad-free "$8/mo"). Its help centre gives the
# same in words ("Essential is our $25 base plan", "Bundle+ is our $33 base plan", Subscription plans) and Hallmark+'s
# exact price ("Hallmark+ add-on for $8.99 more per month", which the pricing page rounds to $9). The yearly prices are
# its Annual Billing article's: "Essential is $275.88/year (+ taxes where applicable) with Annual Billing" and "Bundle+
# is $359.88/year (+ taxes where applicable) with Annual Billing", for subscribers billed by Philo; its Essential and
# Bundle+ articles round them ("$275/year", "$360/year"), so the Annual Billing article's exact figures are used. All
# in US dollars before tax ("Prices listed do not include sales tax.", its terms). The Welcome Back 2026 Offer ($19.99 a
# month for three months, then "currently $25.00/month") is a first-term offer, not stored. "Pricing may vary through
# third-party billers": Amazon, Apple, Google, Roku, Samsung and Vizio may add a surcharge (its surcharge article).
# Where it's sold: the US and its territories only: "Philo is available for your viewing pleasure anywhere and
# everywhere in the United States, along with U.S territories, commonwealths, and possessions including: American Samoa
# District of Columbia Guam Puerto Rico Northern Mariana Islands U.S. Virgin Islands" (Watch Philo outside the U.S.), and
# "Philo’s Services are not available outside the United States." (its privacy policy).
# Region checklist for CA and US, 2026-11-13: 1. one site, no locale paths or hreflang; 2. no picker; 3. its pricing
# page's prices are drawn by its script (a plain fetch shows none), so the US exit's Edge read is the source; 4. the
# sign-up form wasn't opened (philo.com/login/subscribe shows the home page's plans first); 5. its help centre's plans,
# Annual Billing and payment articles; 6. Edge from Canada (the unavailable page), Edge through a US exit, and a plain
# fetch; 7. no bill offered. Canada: not sold (the official statements above).
# Bundles: none as bundle files. Bundle+ is Philo's own plan with HBO Max Basic with Ads, discovery+ (with ads) and
# AMC+'s ad-supported content included, so it lists them in includes-subscription. Official resellers: none found (no
# resellers, gift card or retail page on philo.com or in its help centre). Partners that bill it themselves: Amazon,
# Apple, Google, Roku, Samsung and Vizio ("third-party billing partners", How to pay for Philo), noted, not listed.
# Features, read 2026-11-13: "Philo streams video in high definition (HD) resolution, with live TV in 720p and
# on-demand content in 1080p." (Video and audio quality), so 1080p, its best; "Philo allows three different streams to
# play at the same time." (Limit of simultaneous streams; its terms say the same for the Free Channels plan); "Each
# account can have up to 10 profiles" (Profiles), with no kids profiles; "Philo doesn’t currently have the option for
# parental controls." (Parental controls); live channels "with ads (just like cable)" and "Sports and Local Channels: Not
# included." (the pricing page), so live TV channels and no sports; no downloads (its help centre has none, only the
# cloud DVR). What it streams: its pricing page describes its channels as "Focused on entertainment, lifestyle, and
# family.", and its lineup's categories are "Comedy", "Crime & Drama", "Documentary", "Family", "Home & Lifestyle",
# "Music", "News", "Outdoors & Sports", "Reality" and "Sci-Fi & Fantasy", with "75,000+ movies and shows" on demand;
# the Free Channels plan has "free news, comedy, reality, and entertainment channels" (its free channels page). None of
# your own media. Pause: none (its cancel, billing and plan articles offer only cancelling; no help article mentions
# pausing).

# Coverage: philo.* in AS, GU, MP, PR and VI: sold there ("U.S territories, commonwealths, and possessions", its help
# centre), but its pricing page names no territory's price, and the US exit's page showed the US's (2026-11-13).

id: philo
name: Philo
website: https://www.philo.com
# Its help centre (help.philo.com), on philo.com's own domain.
category: streaming
spendCategory: streaming
# The US and its territories (the help centre's list in the header comment; the District of Columbia is the US's).
availableIn: [US, AS, GU, MP, PR, VI]
billingCurrency: { US: USD }
cancelUrl: https://help.philo.com/account-billing/cancel/
sources: { pricing: https://www.philo.com/go/pricing }
# Owner (M11.2), read 2026-11-13: Philo, Inc., which its privacy policy and terms name as the company that provides and
# operates it ("The Services are owned and operated by Philo", its terms), a private company; no page of its own names
# its shareholders, so no stock and no holders.
owner:
  name: 'Philo, Inc.'
  page:
    name: 'Philo Privacy Policy'
    url: https://www.philo.com/about/privacy
  quotes:
    - 'This Privacy Policy applies to these Services provided by Philo, Inc.'
    - 'Philo is a Delaware corporation, and we provide the Services only to residents located in the United States.'
  country:
    code: US
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: its payment article, for subscribers billed by Philo (cards, a bank account
# through Stripe's Link, Apple Pay, Cash App and Google Pay) and through its third-party billing partners.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, discover, amex]
    url: https://help.philo.com/account-billing/payment/
    quotes:
      - 'We accept credit cards from Visa, Mastercard, Discover, and American Express, and debit cards from Visa, Mastercard, and American Express.'
paymentMethods:
  - methods: [card, bank-transfer, apple-pay, cash-app, google-pay, app-store]
    page: How to pay for Philo
    url: https://help.philo.com/account-billing/payment/
    quotes:
      - 'We accept credit cards from Visa, Mastercard, Discover, and American Express, and debit cards from Visa, Mastercard, and American Express.'
      - 'We accept direct bank account payments through Stripe’s Link system.'
      - 'We accept digital wallet payments through Apple Pay, Cash App, and Google Pay.'
      - 'or through one of our third-party billing partners (Amazon, Apple, Google, Roku, Samsung, and Vizio).'
# Renewal day (M11.5), read 2026-11-13: its billing date article: the day your subscription begins, each month, and a
# shorter month's last day.
renewalAnchor:
  kind: same-date
  page: How to view and change your billing date
  url: https://help.philo.com/account-billing/billing-date/
  quotes:
    - 'From then on, you’ll be charged that same day of each month.'
    - 'If your billing date is scheduled for a date that doesn’t occur every month (like the 31st), you’ll be billed on the last day of that month instead.'
  lastVerified: 2026-11-13

# Perks (M11.6): the paid plans' cloud DVR, in their words: "1-year unlimited DVR" (the pricing page), "unlimited DVR
