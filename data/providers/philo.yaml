          quote: 'WILL BE RESOLVED BY BINDING ARBITRATION BEFORE A SOLE ARBITRATOR (RATHER THAN IN COURT BEFORE A JURY).'
        - url: https://www.philo.com/about/terms
          quote: 'YOU AND WE AGREE THAT ANY DISPUTE RESOLUTION PROCEEDINGS WILL BE CONDUCTED ONLY ON AN INDIVIDUAL BASIS AND NOT IN A CLASS, REPRESENTATIVE, CONSOLIDATED OR MASS ACTION.'
