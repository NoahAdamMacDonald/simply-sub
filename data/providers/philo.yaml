# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch: its Terms of Service Agreement ("Last
# Updated and Effective: October 9, 2026"), which include its Additional Terms of Service for Apple Devices, Nielsen
# Product Terms, Free Trial and Promotional Offers terms and Text Message Program Terms (the same page), its Privacy
# Policy ("UPDATED AND EFFECTIVE DATE: Aug 3, 2026"), and its help centre's billing, cancelling, deletion, sharing and
# opt-out articles. The sign-up form (philo.com/pricing, then an email address) names only the Terms of Service and
# Privacy Policy ("Check the Terms of Service & Privacy Policy checkbox", How to sign up for Philo); it wasn't opened.
# Not read: the Chart its privacy policy links (a separate page) and the partners' terms (HBO Max's and discovery+'s
# Legal Terms, which Bundle+ subscribers accept when they activate them, are those providers' own). Calibrated against
# STARZ and YouTube TV.
policies:
  links:
    - name: 'Terms of Service'
      url: https://www.philo.com/about/terms
    - name: 'Privacy Policy'
      url: https://www.philo.com/about/privacy
    - name: 'How to cancel your Philo subscription or trial'
      url: https://help.philo.com/account-billing/cancel/
    - name: 'How to delete your account'
      url: https://help.philo.com/account-billing/delete/
    - name: 'Opting out of sales, sharing, and targeted advertising'
      url: https://help.philo.com/using-philo/do-not-sell/
    - name: 'How to change your subscription plan'
      url: https://help.philo.com/account-billing/change-your-plan/
    - name: 'Monthly billing email reminders'
      url: https://help.philo.com/account-billing/email-reminders/
    - name: 'Third-party biller surcharge'
      url: https://help.philo.com/account-billing/surcharge/
    - name: 'Profiles'
      url: https://help.philo.com/using-philo/profiles/
    - name: 'Save + record with DVR'
      url: https://help.philo.com/using-philo/save/
    - name: '7-day Essential free trial'
      url: https://help.philo.com/using-philo/free-trial/
    - name: 'Parental controls'
      url: https://help.philo.com/using-philo/parental-controls/
    - name: 'Free Channels'
      url: https://www.philo.com/go/free-channels
    - name: 'Limit of simultaneous streams'
      url: https://help.philo.com/using-philo/stream-limit/
    - name: 'How to sign up for Philo'
      url: https://help.philo.com/using-philo/sign-up/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use Philo, including with session replay and Google Analytics, for its own analytics. Opting out of the tracking tools is set browser by browser and device by device.'
      sources:
        - url: https://www.philo.com/about/privacy
          quote: 'Philo may use session replay technology to record your interactions with the Services, such as what pages you visit on the Services, how long you visit those pages, and any links you click or information you provide.'
        - url: https://www.philo.com/about/privacy
          quote: 'We use Google Analytics, which uses cookies and similar technologies to collect and analyze information about the use of Services and report on activities and trends.'
        - url: https://www.philo.com/about/privacy
          quote: 'Your opt-out choices are typically browser and device specific'
      action:
        name: 'Opt out of sales, sharing and targeted ads'
        url: https://help.philo.com/using-philo/do-not-sell/
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your information with outside business partners for their own marketing, and with ad companies. You can opt out profile by profile when signed in, or browser by browser and device by device.'
      sources:
        - url: https://www.philo.com/about/privacy
          quote: 'We may share your information for business purposes with our third party service providers and unaffiliated third-party business partners for their business and marketing purposes'
        - url: https://help.philo.com/using-philo/do-not-sell/
          quote: 'If your account has more than one Profile, please note that this setting is managed on a per-Profile basis.'
        - url: https://help.philo.com/using-philo/do-not-sell/
          quote: 'Please note that your opt-out is specific to your device or browser.'
      action:
        name: 'Opt out of sales, sharing and targeted ads'
        url: https://help.philo.com/using-philo/do-not-sell/
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Philo has ads, and what you watch can pick them. Ad companies track you on Philo and elsewhere. You can turn off personalized ads, but only profile by profile or device by device.'
      sources:
        - url: https://www.philo.com/about/privacy
          quote: 'The general categories of Content you view may also be used to show you more relevant advertising.'
        - url: https://www.philo.com/about/privacy
          quote: 'they may use this information to perform advertising related services for us and our business partners, including tailoring ads on the Services and elsewhere online'
        - url: https://help.philo.com/using-philo/do-not-sell/
          quote: 'Un-toggle (slide the toggle to the left) the Enable personalized ads setting as shown below.'
      action:
        name: 'Opt out of sales, sharing and targeted ads'
        url: https://help.philo.com/using-philo/do-not-sell/
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you write to it, such as support chats, trains AI. Its helpers may use AI to work for it.'
      pages:
        - https://www.philo.com/about/privacy
        - https://www.philo.com/about/terms
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It names no time limits. After you cancel it keeps your name, email and phone number, and after you delete your account some information can stay in backups.'
      sources:
        - url: https://help.philo.com/account-billing/cancel/
          quote: 'After you cancel your subscription, we’ll retain certain parts of your information, including your name, email address, and phone number.'
        - url: https://help.philo.com/account-billing/delete/
          quote: 'your information may remain in back-up storage for some period of time'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'To delete your account you ask its support team by email, form or phone, and it doesn’t say how long it takes. It keeps some information the law or its accounting needs.'
      sources:
        - url: https://www.philo.com/about/privacy
          quote: 'If you want to delete your Account, you may email us at help@philo.com , contact us at philo.com/contact , or call us at 855-CSPHILO (855-277-4456), but without an Account, you cannot use the Philo Subscription Service.'
        - url: https://help.philo.com/account-billing/delete/
          quote: 'After you delete your account, we may retain information from or about you under applicable law, including for various legal, operational, accounting, and auditing purposes'
      action:
        name: 'How to delete your account'
        url: https://help.philo.com/account-billing/delete/
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask it for a copy of your information by email, form or phone. It offers no download of its own.'
      sources:
        - url: https://www.philo.com/about/privacy
          quote: 'If you wish to update, correct, or otherwise have access to your personal data in our records, please use one of the mechanisms below.'
      action:
        name: 'Its privacy policy'
        url: https://www.philo.com/about/privacy
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands your information over when the law or legal process requires, and what you watch only to police with a court order, as the law requires. Nothing more is promised.'
      sources:
        - url: https://www.philo.com/about/privacy
          quote: 'Comply with legal obligations or legal processes;'
        - url: https://www.philo.com/about/privacy
          quote: 'Philo only shares the Video Viewing History category of data in the ordinary course of business, such as customer service providers and technology systems service providers, with your consent, to law enforcement, in response to a court order, and as otherwise allowed under 18 U.S.C. § 2710, the Video Privacy Protection Act (VPPA).'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: poor
      reason: 'Your information is kept in the United States and other countries it doesn’t name, and it describes no safeguards for it.'
      sources:
        - url: https://www.philo.com/about/privacy
          quote: 'you are consenting to the collection, transfer, storage, and processing of such information in the United States and other countries.'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Signing up needs an email address, then payment details for a paid plan; a free trial may also ask for your name, phone number and ZIP code. Free Channels need no account.'
      sources:
        - url: https://help.philo.com/using-philo/sign-up/
          quote: 'Enter your email address.'
        - url: https://www.philo.com/about/terms
          quote: 'During the trial period, you will be asked to provide additional information, which may include your name, email address and/or mobile phone number, billing zip code, and payment method information.'
        - url: https://www.philo.com/go/free-channels
          quote: 'No, you can start watching instantly without an account.'
      lastVerified: 2026-11-13
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 18 to make an account, and minors may watch only with an adult. It has no parental controls or kids profiles, and asks you to tell it if it collected a child’s data.'
      sources:
        - url: https://www.philo.com/about/terms
          quote: 'Minors may only use the service under the supervision of an adult.'
        - url: https://help.philo.com/using-philo/parental-controls/
          quote: 'Philo doesn’t currently have the option for parental controls.'
        - url: https://www.philo.com/about/privacy
          quote: 'If you learn we have collected personal data from a child without such consent, please email us at help@philo.com'
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: poor
      reason: 'It says only that it takes commercially reasonable steps and can’t guarantee security. It names no outside checks and no way to report a security problem.'
      sources:
        - url: https://www.philo.com/about/privacy
          quote: 'While Philo takes commercially reasonable steps designed to secure your personal data, no data transmission over the Internet, wireless transmission, or electronic storage of data can be guaranteed to be 100% secure.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel online in a few clicks on your Account page and keep watching until the end of the time you paid for, then you move to the Free Channels.'
      sources:
        - url: https://help.philo.com/account-billing/cancel/
          quote: 'Click Cancel my subscription .'
        - url: https://help.philo.com/account-billing/cancel/
          quote: 'Click Complete cancellation to confirm.'
        - url: https://help.philo.com/account-billing/cancel/
          quote: 'Once you cancel your Philo subscription or trial, you’ll still be able to watch the content included in that paid subscription for the remainder of your current billing cycle'
      action:
        name: 'How to cancel'
        url: https://help.philo.com/account-billing/cancel/
      lastVerified: 2026-11-13
