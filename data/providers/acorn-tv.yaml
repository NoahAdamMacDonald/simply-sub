# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 in Edge from Canada. Its footer's and sign-up form's Terms of Use,
# Privacy Policy and Cookie Policy (amcnetworks.com's links, which lead to amcglobalmedia.com) are AMC Global Media's
# AMC Streaming Services Terms of Use, Privacy Policy and Cookies Policy (all "June 27, 2025"), which name Acorn TV and
# are rated once as shared documents (data/policies/amc-global-media-terms.yaml and amc-global-media-privacy.yaml,
# drafted in .pipeline/amc-plus). acorn.tv still serves older copies at /terms-and-conditions/ and /privacy-policy/
# (AMC Networks Inc.'s "Last Updated: March 30, 2023"), which no link on its pages opens: not rated. Rated here from
# Acorn TV's own pages: its sign-up page's first step and its store's form (typing nothing), and its help centre's
# downloads article. Not read: the sign-up steps after the account form (the plan and checkout), its EU legal notice and
# captioning policy (no topic), the "Additional Terms" of its promotions, and the terms of the partners that bill it.
policies:
  shared: [amc-global-media-terms, amc-global-media-privacy]
  links:
    - name: 'Start Your Free Trial'
      url: https://signup.acorn.tv/createaccount.jsp
    - name: 'Acorn TV Membership'
      url: 'https://store.acorn.tv/#membership'
    - name: 'Can I download shows to watch them later, or when I am offline?'
      url: https://support.acorn.tv/kb/guide/en/can-i-download-shows-to-watch-them-later-or-when-i-am-offline-PaimtRkrQZ/Steps/4297192
  ratings:
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Signing up starts with an email address and a password you choose (its store’s form asks your first and last name), then a card. The steps after the account form weren’t read.'
      sources:
        - url: https://signup.acorn.tv/createaccount.jsp
          quote: 'Create your account to login on any device, any time.'
        - url: https://signup.acorn.tv/createaccount.jsp
          quote: 'E-MAIL ADDRESS'
        - url: 'https://store.acorn.tv/#membership'
          quote: 'First Name * (Required)'
      lastVerified: 2026-11-13
    - topic: service.device-limits
      tier: neutral
      reason: 'Downloads play only on the device that saved them, run out after a while, and some can be downloaded only so often a year. They’re deleted if you cancel.'
      sources:
        - url: https://support.acorn.tv/kb/guide/en/can-i-download-shows-to-watch-them-later-or-when-i-am-offline-PaimtRkrQZ/Steps/4297192
          quote: 'Downloaded TV shows and movies are available on the device that was used to download them. Downloads will expire after a period of time, and some have a limit on how many times they can be downloaded per year.'
        - url: https://support.acorn.tv/kb/guide/en/can-i-download-shows-to-watch-them-later-or-when-i-am-offline-PaimtRkrQZ/Steps/4297192
          quote: 'If your account is cancelled, TV shows and movies you’ve downloaded will be deleted from your device.'
      lastVerified: 2026-11-13
