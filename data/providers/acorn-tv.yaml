# Researched by hand on 2026-11-13 (M11.15, streaming batch 7), read with Edge from Canada, its store and sign-up pages
# again through a US, a UK, an Australian and a New Zealand exit (and an Irish and a Spanish one, below), and its help
# centre (support.acorn.tv, a Stonly knowledge base whose guides' steps are all in each page) in Edge and with a plain
# fetch. Pages, each quoted where it's used:
# Pricing: its store's membership page (store.acorn.tv, "Subscription Options" in every page's footer), which names
# each country's currency: "Monthly CAD$11.99" and "Annual CAD$119.99" from Canada, "Monthly USD$9.99" and "Annual
# USD$99.99" through a US exit, "Monthly GBP£5.99" and "Annual GBP£59.99" through a UK exit, "Monthly AUD$7.99" and
# "Annual AUD$79.99" through an Australian exit, "Monthly NZD$7.99" and "Annual NZD$79" through a New Zealand exit, each
# with "Automatic monthly billing" and "A full year of Acorn TV for the price of 10 months". The sign-up page
# (signup.acorn.tv/createaccount.jsp) says the same month price in each ("then just $11.99/mo." from Canada, "$9.99/mo."
# through the US exit, "£5.99/mo.", and "$7.99/mo." in Australia and New Zealand), and the plan data it loads as part of
# the page names the reader's country and currency ("Country":"CA" and "CurrencyDesc":"CAD" 11.99 and 119.99; "US"
# with USD 9.99 and 99.99; GB with GBP 5.99 and 59.99; AU with AUD 7.99 and 79.99; NZ with NZD 7.99 and 79), with older
# prices kept for existing members ("DefaultPlan":false). Its about page from Canada: "$11.99/month" and "an annual
# membership for $119.99/year". join.acorn.tv showed the US prices ("$9.99/MO", "$99.99/YR") from Canada too: not used.
# The data marks the UK's, Australia's and New Zealand's prices tax-inclusive ("TaxInclusive": true) and North
# America's not, but no words on the pages say so, so no taxIncluded. The plan data counts a month as "Term": 30,
# "TermType": "DAY"; the store says "Automatic monthly billing" and "charged every month", and its terms bill monthly
# plans "one (1) time per month", so the months are stored as months (notes.md).
# Region checklist for CA, US, GB, AU and NZ, 2026-11-13: 1. no country paths (acorn.tv's robots.txt lists a sitemap
# per country, but one site serves them all); 2. no picker; 3. the store's and sign-up page's plan data, which names
# the country and currency for each exit; 4. the sign-up page's first step ("Step 1 of 2"), typing nothing; 5. its
# help centre has no prices or tax article; 6. Edge from Canada and through each country's exit, and a plain fetch;
# 7. no bill offered. Through an Irish exit the store says "We are sorry, but Acorn TV is not yet available in your
# country"; through a Spanish exit it sends the reader to Acorn TV's Amazon Prime Video channel (primevideo.com), which
# Amazon sells and bills: not in Acorn TV's own country list, so not listed (notes.md). Not sold in the rest of the euro
# sample (its country list, below).
# Bundles: none sold by Acorn TV. AMC+ includes Acorn TV's library in Australia and New Zealand (AMC+'s help centre;
# amc-plus's notes). Official resellers: none. Its gift memberships (12 months, paid once, on its store) pay for the
# plan rather than being one. Partners that bill it themselves, named in its help centre and how-to-watch page: Apple
# (iTunes), Google Play, Roku, Amazon's Fire TV app store, Samsung, Amazon Prime Video Channels ("totally separate from
# a standard Acorn TV subscription and is exclusive to Prime members") and cable providers (Comcast/Xfinity, Spectrum,
# Cox, TELLUS; Cox, Dish and Sling as an add-on channel, its how-to-watch page).
# Features, read 2026-11-13: "Many shows on Acorn TV are available to download and watch offline on iOS and Android
# devices." with no number of devices, so 1 (inferred); "always commercial-free", "thousands of hours of
# commercial-free programming" (its sign-up page's own text, in its page data) and "The best British TV streaming on
# demand, commercial free." (its home page's description), so ad-free. What it streams: "brilliant mysteries and
# suspense-driven dramas" (What is Acorn TV?), "world-class mysteries, dramas, and comedies" (its sign-up page's text),
# and its home page's "FEATURE FILM" and "DOCUMENTARY" rows, so series, films and documentaries; none of your own
# media. No profiles, kids profiles, parental controls, live channels or pause on any page read.
# Video quality and streams at once: no Acorn TV page states either (its help centre's 87 guides, its store, sign-up,
# about, how-to-watch and FAQ pages, the plan data, and the terms, which say only that HD, Ultra HD and 4K "depends on
# your Subscription" and that an account "may be limited by simultaneous stream and device usage"). The publications
# disagree on streams: The Streamable's page (said by a web search to give 4) refused this machine's browsers, and Cord
# Cutters News's review says "Acorn TV allows unlimited simultaneous streams" beside prices years old ($5.99 a month).
# So neither is guessed: the plan waits in core's awaitingRequiredFeatures (notes.md).
# Free use: none: "If you are signed in and still seeing clips, your membership may have expired." (I'm only seeing
# clips and trailers); its pages sell the paid plan with a 7-day free trial.

# Coverage: acorn-tv.* in AS, GU, MP, PR and VI: sold there ("US (and US Territories)"), but no page names a
# territory's price, and the US exit's page showed the US's (2026-11-13).

id: acorn-tv
name: Acorn TV
website: https://acorn.tv
# Its owner's site, where acorn.tv's Terms And Conditions, Privacy Policy and Cookies Policy links lead (through
# amcnetworks.com, to amcglobalmedia.com).
domains: [amcglobalmedia.com]
category: streaming
spendCategory: streaming
# "Acorn TV is available in the countries listed below: US (and US Territories) Canada Australia New Zealand UK" (Where
# is Acorn TV available?), and its terms: "Acorn TV: Australia, Canada New Zealand, The United Kingdom, US
# Territories." beside the United States. The territories are the five inhabited ones, as Peacock's help centre names
# them.
availableIn: [US, CA, GB, AU, NZ, AS, GU, MP, PR, VI]
billingCurrency: { US: USD, CA: CAD, GB: GBP, AU: AUD, NZ: NZD }
# Its help centre's "How do I cancel Acorn TV?" for a subscription bought on its website ("Click the option to Cancel
# Membership on the left side of the screen").
cancelUrl: https://support.acorn.tv/kb/guide/en/how-do-i-cancel-acorn-tv-GbJUHXR7Pk/Steps/4319894
sources: { pricing: 'https://store.acorn.tv/#membership' }
# Owner (M11.2), read 2026-11-13: AMC Global Media Inc., from its third-quarter release on its own site, which names
# Acorn TV among its streaming services, its listing and where it's based. acorn.tv's own pages say "© 2026 RLJ
# Entertainment, Inc." (its EU legal notice: "Audiovisual communication service provider: RLJ Entertainment, Inc."), and
# join.acorn.tv "© 2020-2026 AMC Global Media Inc."; no page read says how RLJ Entertainment is held. No page read
# names a majority holder.
owner:
  name: AMC Global Media Inc.
  website: https://www.amcglobalmedia.com
  page:
    name: AMC Global Media Inc. Reports Third Quarter 2026 Results
    url: https://www.amcglobalmedia.com/2026/11/09/amc-global-media-inc-reports-third-quarter-2026-results/
  quotes:
    - 'AMC Global Media (Nasdaq: AMCX) is home to many of the greatest stories and characters in TV and film and the premier destination for passionate and engaged fan communities around the world.'
    - 'Its portfolio includes targeted streaming services AMC+, Acorn TV, Shudder, Sundance Now, HIDIVE and All Reality'
    - 'AMC Global Media is headquartered in the United States, with international operations in Iberia, Latin America, Central Europe, the U.K., Australia and New Zealand.'
  country:
    code: US
  stock:
    listings:
      - { exchange: Nasdaq, symbol: AMCX }
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13 in its help centre's cancelling article: a credit or debit card on its website,
# Apple (iTunes) and Google Play, Amazon's Prime Video Channels add-on (core's app-store), and a cable provider's bill.
# Roku, Samsung and Amazon's Fire TV app bill it too, in words the catalog's checks don't read as an app store. No page
# names the card networks or PayPal, so no acceptedNetworks.
paymentMethods:
  - methods: [card]
    page: How do I cancel Acorn TV?
    url: https://support.acorn.tv/kb/guide/en/how-do-i-cancel-acorn-tv-GbJUHXR7Pk/Steps/4319894
    quotes:
      - 'If you signed up with a credit card via our website, you must cancel through a web browser on your computer, tablet, or via the mobile web on your smartphone.'
  - methods: [app-store]
    page: How do I cancel Acorn TV?
    url: https://support.acorn.tv/kb/guide/en/how-do-i-cancel-acorn-tv-GbJUHXR7Pk/Steps/4320889
    quotes:
      - 'If you signed up via the Acorn TV app via iTunes / Apple, you can cancel your subscription by following these steps:'
  - methods: [app-store]
    page: How do I cancel Acorn TV?
    url: https://support.acorn.tv/kb/guide/en/how-do-i-cancel-acorn-tv-GbJUHXR7Pk/Steps/4320892
    quotes:
      - 'If you signed up via Google Play through the Acorn TV Android app, you can cancel your subscription by following these steps:'
  - methods: [app-store]
    page: How do I cancel Acorn TV?
    url: https://support.acorn.tv/kb/guide/en/how-do-i-cancel-acorn-tv-GbJUHXR7Pk/Steps/4320842
    quotes:
      - 'If you purchased the Acorn TV add-on channel via Amazon Prime, you will need to go into the Video Subscription settings in your Amazon Prime account to cancel your account.'
  - methods: [provider-billing]
    page: How do I cancel Acorn TV?
    url: https://support.acorn.tv/kb/guide/en/how-do-i-cancel-acorn-tv-GbJUHXR7Pk/Steps/4320839
    quotes:
      - 'If you signed up with a Cable Provider such as Comcast/Xfinity, Spectrum, Cox, or TELLUS, you will need to sign in to the corresponding provider to cancel your membership.'
# Renewal day (M11.5): its terms bill "on the calendar day corresponding to the beginning of your Billing Period", and
# a sign-up on a day a month lacks bills on that month's last day: the day you signed up.
renewalAnchor:
  kind: same-date
  page: AMC Streaming Services Terms of Use
  url: https://www.amcglobalmedia.com/terms-of-use/
  quotes:
    - 'If your paid subscription begins on a day not contained in a given month, and your Billing Period is every month, your Payment Method will be billed on the last day of such month.'
  lastVerified: 2026-11-13
freeUse:
  kind: none
  pages:
    - https://acorn.tv/
    - https://support.acorn.tv/kb/guide/en/im-only-seeing-clips-and-trailers-SrpmuTbhjV/Steps/4297076
  lastVerified: 2026-11-13

