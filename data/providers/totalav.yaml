# 2026: its apps' licence too, which its footer's "EULA" link opens, and the agreement its checkout's "I agree to the
# Terms of Service and Privacy Policy" names, Germany's adding "our withdrawal policy", the terms' own withdrawal
# section), its Privacy Policy (effective 28th November 2025, which the terms include: "Your submission of personal
# information through the Services is governed by our Privacy Policy , which is hereby incorporated into these Terms by
# reference"), its Cookie Policy, its "Your Privacy & Data" page (its requests form), its help centre's billing, device
# and Total Password articles, its product pages' FAQ and notes, and Canada's checkout. Read but holding no worse
# clause: its Cookie Policy (essential first-party cookies, one of which is "Timestamp used to control orderform pricing
# after an uninstall"). Not read: the Data Privacy Framework Privacy Policy it links on pango.co (another company's site),
# a gift card's own terms (on each card), the standalone Total VPN, Total Adblock and Total Drive apps' terms (its own
# terms cover them as "Service Specific Terms"). No vulnerability disclosure page or bug bounty was found on its sites
