# Researched by hand on 2026-11-20 (M11.15, security batch 2), read with Edge from Canada and, for the other countries'
# prices, through a US, UK, Irish, German, French, Dutch, Spanish, Italian, Australian and New Zealand exit; its legal
# pages, product pages and help centre (help.totalav.com, server-rendered) with a plain fetch. Pages, each quoted where
# it's used:
# Pricing: its Subscription Pricing Matrix (totalav.com/subscription-pricing-matrix: "The below renewal prices are in
# effect as of the date noted.", "Subscription renewal rates effective: 05 Jan 2026"), the regular price of every plan
# and period in "$ USD", "£ GBP", "€ EUR", "$ CAD" and "$ AUD" (its currency tabs, which load the page's own tables): the
# same number in each currency. Each product page's "Buy Now" opens its checkout (secure.totalav.com), which names the
# country and currency it charges in its form ("country" CA, "currency" CAD; "Total Today (CAD)"; "Total Today (AUD)")
# and the renewal ("I agree to pay $99 today for the first year which will auto renew at $99 annually"): read
# 2026-11-20 from Canada (CA$99, CA$129, CA$149, the matrix's CAD prices), and for Plus through each exit: the US's and
# New Zealand's in US dollars (their form's "currency" USD, "country" US and NZ: New Zealand has no price list of its
# own), the UK's £99, the euro countries' 99 €, Australia's AU$99. Its product pages showed the same yearly prices with
# no first-year discount ("$99 / year", "£99 / year", "99 € / year"); its offers ("Introductory pricing may be
# available to first-time customers. Renewals are billed at the regular rate unless otherwise stated.") are left out.
# Periods: the matrix and the product pages' FAQ ("We offer monthly, quarterly, biannual, and annual subscription plans
# that automatically renew unless canceled.") sell Plus monthly, every 3 months, every 6 months and yearly, and Internet
# Security and Total Security monthly, every 6 months and yearly ("-" for quarterly); the product pages' checkout sells
# the year. No price says it includes tax: its terms add sales tax in the US ("sales taxes applicable to a Subscription
# for customers based in the United States and certain other jurisdictions are the responsibility of the customer") and
# include VAT in its pounds and euros ("VAT is included in all GBP and Euro prices displayed on the Total Security
# Group’s sites"), on its terms rather than the pages that price them; Canada's checkout adds "Estimated Tax".
# Region checklist for CA and US, 2026-11-20: 1. no country paths (language paths /de/, /fr/... and ?forceLang=); 2. the
# matrix's currency tabs; 3. the checkout form's country and currency; 4. each plan's checkout from Canada, up to the
# payment form; 5. its help centre's billing articles; 6. Edge from Canada and through a US exit; 7. no bill offered.
# Not listed: the matrix's legacy plans "no longer available for new purchases" (Total AV Premium, the 2019 to 2025
# Antivirus Pro, Internet Security and Total Security), and its other add-ons (Unlimited Protection, Family Protection,
# Home Protection, Advanced Cloud Scanning, Identity Theft Protection, Smartphone Optimizer, Total Drive).
# Bundles: none. Official resellers: none named as selling its subscription. Its help names shops that sell its gift
# cards ("Simply purchase one of our gift cards from a valid retailer (Amazon, Costco, and LifeStyle)"), whose
# subscriptions "do not automatically renew": not listed (their pages weren't read). Apple's App Store and Google Play
# bill its in-app subscriptions (partners, not listed).
# Free use: TotalAV Free Antivirus, its free plan below.

id: totalav
name: TotalAV
website: https://www.totalav.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help centre's "Cancel a Subscription": "You can disable auto-renewal at any time using our simple cancellation
# process — no need to contact support."
cancelUrl: https://help.totalav.com/en/billing/-/cancel-a-subscription
sources: { pricing: https://www.totalav.com/subscription-pricing-matrix }
# Owner (M11.2), read 2026-11-20: its privacy policy and terms name Total Security Limited (England, company 10161957) and
# Total Security U.S. LLC (Boston), "each of which are a part of Point Wild"; Point Wild's own Our Story page: "Pango
# Group merges with Total Security, a global leader in the field of cybersecurity, and combined company rebrands to Point
# Wild." (December 2024). Point Wild's country from its privacy policy's address. Private: no page names a listing.
owner:
  name: Point Wild
  website: https://www.pointwild.com
  page:
    name: 'Privacy Policy'
    url: https://legal.totalav.com/privacy
  quotes:
    - 'We are a part of Point Wild (formerly known as Pango).'
  country:
    code: US
    page:
      name: 'Privacy Policy (Point Wild)'
      url: https://www.pointwild.com/legal/privacy-policy/
    quotes:
      - 'Boston, Massachusetts, 02210'
    lastVerified: 2026-11-20
  lastVerified: 2026-11-20
# Ways to pay and card networks (M11.5), read 2026-11-20: its help centre's "Accepted Payment Methods" (Visa, MasterCard,
# Amex, Discover), its terms (cards, PayPal, Apple Pay and Google Pay "subject to availability in your region", gift
# cards "In some jurisdictions"), Canada's checkout (a card form, PayPal and Google Pay) and its cancelling article (the
# App Store and Google Play bill in-app subscriptions).
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, discover]
    url: https://help.totalav.com/en/billing/-/accepted-payment-methods
    quotes: ['Visa', 'MasterCard', 'Amex', 'Discover']
paymentMethods:
  - methods: [card, paypal, apple-pay, google-pay]
    page: 'Terms of Service'
    url: https://legal.totalav.com/terms
    quotes:
      - 'We accept major credit and debit cards (e.g., Visa, Mastercard, American Express, Discover), PayPal, Apple Pay, and Google Pay, subject to availability in your region.'
  - methods: [gift-card]
    page: 'Gift Cards FAQ'
    url: https://help.totalav.com/en/billing/-/gift-cards-faq
    quotes:
      - 'Simply purchase one of our gift cards from a valid retailer (Amazon, Costco, and LifeStyle), redeem it, and your subscription will be activated.'
  - methods: [app-store]
    page: 'Cancel a Subscription'
    url: https://help.totalav.com/en/billing/-/cancel-a-subscription
    quotes:
      - 'If you purchased a subscription through the Apple App Store®, you will need to manage your subscription through your Apple account.'
# Renewal day (M11.5): its terms renew "end of each Billing Cycle" and its help "at the end of each billing term", which
# name no day. (One of the US checkout's wordings, "renews automatically each year, starting one year from today", says
# the date you signed up, but other readings of the same checkout didn't say it.)
renewalAnchor:
  kind: not-stated
  pages:
    - https://legal.totalav.com/terms
    - https://help.totalav.com/en/billing/-/how-auto-renewal-works
  lastVerified: 2026-11-20
# Lab results (M11.2), read 2026-11-20: AV-TEST's newest Windows test of home-user products, July and August 2026 (report
# 261416, TotalAV 6.6 & 6.7). Its October 2026 page lists no TotalAV result. AV-Comparatives' and SE Labs' aren't listed
# (data/raters.yaml).
ratings:
  - rater: av-test
    subject: antivirus-protection
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/protectednet-totalav-6.6--6.7-261416/
    tested: TotalAV 6.6 & 6.7, Windows 11
  - rater: av-test
    subject: antivirus-performance
    label: 5.5/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/protectednet-totalav-6.6--6.7-261416/
    tested: TotalAV 6.6 & 6.7, Windows 11
  - rater: av-test
    subject: antivirus-usability
    label: 6.0/6.0
    date: 2026-08
    url: https://www.av-test.org/en/antivirus/home-windows/windows-11/august-2026/protectednet-totalav-6.6--6.7-261416/
    tested: TotalAV 6.6 & 6.7, Windows 11

# General features, read 2026-11-20. Platforms: "Advanced security tools available across Windows, Mac, Android, and
# iOS." (its product pages) and its WebShield and Total Password browser extensions ("Install Total WebShield for
# Microsoft Edge", "Add Total Password to Your Microsoft Edge Browser"). Sign-in: a password (its terms: "Registration as
# a user or subscriber to the Services may require both a username and a password."); its help names no two-factor
# sign-in for the TotalAV account (cancelling asks for a code sent by email). Support: its help centre's contact form and
# support@totalav.com (its terms; their "24/7 billing support team" is billing's only). App languages: its website's
# language picker (English, Dansk, Deutsch, Français, Español, Italiano, Nederlands, Norsk, Polski, Português, Svenska,
# Česky, Türkçe; the registry lists six of them). No parental controls, no pause.
features:
  platforms: [windows, macos, android, ios, browser-extension]
  account.sign-in: [password]
  support.channels: [email]
  languages.interface: [en, fr, es, de, it, pt]

# Perks (M11.6): what its comparison table lists that no feature describes, in its words.
perks:
  - id: total-adblock
    name: Total Adblock

# Categories (M11.3): an antivirus first. Internet Security and Total Security include Total VPN ("Total VPN is included
# with TotalAV™ Internet Security and Total Security plans"), so they're VPN plans too; Total Security includes Total
# Password ("Total Password6 is included exclusively in the Total Security plan"), so it's a password manager plan too.
# Neither Total VPN nor Total Password is another catalog provider's plan, so they're features here.
# Features, read 2026-11-20: each product page's comparison table ("Real-Time Antivirus Protection", "Zero-Day Cloud
# Scanning", "PUA Protection", "Phishing Scam Protection", "Ransomware Protection", "System Tune-Up Tools", "Disk
# Cleaner", "Browser Manager & Cleaner", "iOS & Android Protection" on all three; "Total Adblock" and "Total VPN" on
# Internet Security and Total Security; "Total Password" on Total Security; read from its markup, where Plus's column hides
# the last three and Internet Security's the last) and devices ("4 Devices", "6 Devices", "8 Devices"); "Schedule Smart
# Scans: Run automated scans on your schedule"; "Data Breach Monitoring: Monitor your email for appearances in known
# public breach data and receive alerts" (every plan's page); WebShield, "Included with all TotalAV™ security plans",
# which blocks "fake, scam, phishing & 'spoofed' websites" and "Stop Intrusive Trackers"; its help's Quick Scan and Full
# System Scan ("Customize your Scans") and the iPhone app's SPAM text detector ("If a website is dangerous, the message
# gets blocked."). No page read says it detects threats by their behaviour (its Real-Time Protection scans "downloads,
# installs and executables"), recovers encrypted files, scans for vulnerable software, or has a firewall or anti-theft
# (its Android App Lock locks apps behind a PIN), so those are false or left out (the product pages, its help centre's
# TotalAV articles).
# Total VPN, read 2026-11-20: its VPN page ("With OpenVPN and IKEv2 protocols available", "our VPN kill switch", "over
# 35 country locations", listing 36 countries under "Plan Availability"), its help's in-app VPN settings (IKEv2,
# OpenVPN TCP and UDP, "VPN Circuit Breaker": "internet access is suspended to prevent leaks"), and "What is Total VPN?"
# ("Total VPN does not track, log, or store your browsing history", no audit named). No page read states a data limit
# or unlimited data, a device count of its own, RAM-only servers or a way to connect your own devices, so unlimited
# traffic, RAM-only servers and connecting your own devices are false and the data and device counts are left out. Split
# tunnelling: the standalone Total VPN app's help describes it ("How to use Total VPN Split Tunneling", with its Hydra
# protocol and "over 90 countries"), but the plans' VPN page and the in-app VPN's settings don't name it, so false.
# Total Password, read 2026-11-20 in its help: logins, "Credit Cards", "Secure Notes" and "Identities"; "It will
# identify and pinpoint any weak or old passwords", a leak checker against "Have I been Pwned", and Security Reports'
# "weak / duplicate passwords"; imports "from 1Password, Chrome browser, Dashlane, Firefox browser, LastPass and Sticky
# Password" and "a password file in the .csv format"; exports "either CSV or Password-protected File"; "Internet
# connection required for cloud sync and autofill" (no offline vault named) and no emergency access named; "Total
# Password does not provide it's own 2FA" (its two-factor sign-in uses another authenticator app, so no authenticator).
# End-to-end encryption, inferred: no page says end-to-end or zero-knowledge, but "Every password you use is encrypted
# locally on your computer before it ever leaves your device." and "we do not store your Master Password on our data
# servers so that we do not have any access to your account" say TotalAV can't read them, the registry's test.
plans:
  # TotalAV Free Antivirus (its page, totalav.com/free-antivirus): a scan that finds and removes threats, no real-time
  # protection ("you can activate a trial of our real-time protection").
  - id: totalav.free
    name: 'Free Antivirus'
    link: https://www.totalav.com/free-antivirus
    features:
      antivirus.included: true
      antivirus.real-time: false
      antivirus.scans: [on-demand]
    notes: 'A free scan that finds malware, unwanted apps and privacy problems and lets you quarantine or delete them. No real-time protection: that needs a paid plan.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-20
        sourceUrl: https://www.totalav.com/free-antivirus
