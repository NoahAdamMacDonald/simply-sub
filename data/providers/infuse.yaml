# General features, read 2026-11-13. Platforms: "iPhone (iOS 18 and later)", "iPad (iPadOS 18 and later)", "Apple TV (tvOS
# 18.5 and later)", "Mac (macOS 15 and later)" and "Vision (visionOS 26 and later)" (What is Infuse?); the registry has no
# value for Vision. Sign-in: none: Infuse has no account of its own (Pro is bought with your Apple Account; firecore.com's
# own log-in is for its website), so account.sign-in is left out. Support: a support ticket ("you can open a support
# ticket and someone from our team will assist you. We work to respond to all emails as quickly as we can.") and its
# forum ("There is also an active Community Forum", Troubleshooting and Getting Support). App languages: no Firecore page
