# Researched by hand on 2026-11-13 (M11.15, streaming batch 8), read with a plain fetch from Canada (firecore.com's
# Infuse, terms, privacy, contact and release-notes pages, its help centre through its API, and Apple's App Store page
# for Infuse in each country's storefront) and with Edge (firecore.com/infuse and its account pages). Pages, each quoted
# where it's used:
# What it is: a video player app for Apple's devices ("Infuse is a versatile video player app available for iPhone, iPad,
# Apple TV, Mac, and Vision.", What is Infuse?) that plays your own files from the device, a computer or NAS on your
# network, Plex, Emby and Jellyfin servers and cloud drives. It sells no films or shows of its own.
# Pricing: Infuse is free to download ("Infuse is free to download and packed with everything you need to enjoy your
# media collection beautifully.", its Infuse page), with Infuse Pro sold only as an in-app purchase in Apple's App Store
# ("Free app with optional Pro features (available via In-App Purchase)", Infuse for Enterprise): "Infuse Pro is available
# as a subscription (Monthly or Yearly) or as a one-time purchase (Lifetime)." (Purchases and Family Sharing).
# The US: its Infuse page prices Pro "$1.99 / month · $16.99 / year · $99.99 / lifetime", the same page for every reader
# (no location pricing: server-rendered, the same text read from Canada), in a bare "$" its own page data names as US
# dollars ("priceCurrency": "USD" in its SoftwareApplication data); the US App Store page agrees ("Infuse Pro - Monthly
# $1.99", "Infuse Pro - Yearly $16.99"). So the US's prices cite Firecore's own page.
# Every other country: no Firecore page prices them, so each is the App Store's page for the app in that country's
# storefront (apps.apple.com/<country>/app/infuse/id1136220934, its In-App Purchases list), whose own data names the
# storefront's currency ("priceCurrency":"CAD"…): Canada $2.29 and $22.99 (CAD); the UK £1.99 and £17.99; Ireland, Spain
# and Italy €1.99 and €14.99; Germany, France and the Netherlands €1.99 and €19.99; Australia $2.99 and $24.99 (AUD); New
# Zealand $3.99 and $22.99 (NZD). The list shows each subscription twice (two App Store products at the same price). Its
# terms say "All amounts are in US Dollars.", but each storefront charges its own currency, which the App Store's pages
# show. No page says the prices include tax (Apple's app pages say nothing of tax), so no taxIncluded.
# Not listed: Infuse Pro Lifetime, a one-time purchase (US$99.99, CA$129.99, £99.99, €99.99, A$149.99, NZ$199.99: the
# owner's rule for lifetime plans, as Plex Pass's and Emby Premiere's); the free "DTS Audio" and "Dolby Audio" in-app
# items ($0.00); legacy owners' free year ("those with legacy versions of Infuse ... can receive a free year of Infuse Pro
# when upgrading to Infuse 8", Upgrade to Infuse 8), a first term; and Infuse: Enterprise, "a traditional
# (non-subscription) paid app" for organizations through Apple's Volume Purchase Program (business: out of scope).
# Region checklist, 2026-11-13: 1. no locale paths on firecore.com (firecore.cn is its Chinese site; no hreflang); 2. no
# picker; 3. its page's data names USD; 4. the checkout is the App Store's, in the app: not opened; 5. its help centre's
# purchase articles name no prices; 6. a plain fetch and Edge for firecore.com, a plain fetch for each App Store
# storefront's page (each in its own currency whoever reads it); 7. no bill offered.
# Bundles: none. Official resellers: none; it's sold only in the App Store. Gifts: "While it’s not currently possible to
# gift a subscription for App Store apps, you can give out an Apple credit to help friends and family buy it." (How Do I
# Gift a Pro Subscription?): Apple's own gift card, App Store billing.
# Features, read 2026-11-13: its Infuse page's free features ("Amazing features come standard.") and Pro's ("Go further
# with Pro."), and its help centre. Video quality: free plays "4K (Ultra-HD) HDR and HDR10+ video" ("Silky-smooth playback
# of 4K (Ultra-HD) HDR and HDR10+ video with efficient hardware decoding."), so 4K and HDR on both plans; Pro adds "Dolby
# Vision and Atmos" ("Enjoy videos in all their high-fidelity glory with Dolby Vision (Profile 5 & 8) and Dolby Atmos
# (E-AC3)."): audio.dolby-atmos on Pro, Dolby Vision a perk. Streams: no number: it plays your files in the app on each
# device, with no Firecore account counting them, and Pro unlocks "on all devices", so unlimited (inferred), as Plex's,
# Jellyfin's and Emby's. Ads: "No ads, no tracking, and no harvesting of library info…ever!" (its Infuse page). Downloads:
# "Download videos directly from any network source so they are available in Infuse (iOS/macOS only) for offline playback."
# (Downloading Files), not a Pro feature (its App Store description lists "Download videos from networked devices" among
# the free extras), with no number of devices, so 1 (inferred). What it streams: nothing of its own (streaming.content:
# none) and your own media (streaming.own-media; the trailers Pro streams are a perk). Profiles: it follows Apple TV's and
# the Mac's own user profiles ("Infuse will integrate with Apple‘s multiple user account features", Multiple User
# Profiles), with no number of its own, so streaming.profiles is left out. Parental controls on both: "Control the types
# of content your little ones can access with easily configurable rating and folder controls." (its Infuse page), set
# with a passcode ("Allowed Movie/TV Show ratings - Select the ratings for which no passcode is required", Settings
# Overview). No pause: Pro is only cancelled in the App Store (its terms).
# Free use: the free app, its Free plan.

