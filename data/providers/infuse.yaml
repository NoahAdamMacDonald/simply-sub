# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch: its Terms of Service ("Updated: March 18,
# 2024", Firecore, LLC.'s, under Colorado law), its Privacy Policy ("Updated: May 22, 2026", for the website and the
# Infuse app), its Infuse page, its help centre's purchase, sync, settings, profiles and security articles, and the
# App Store page for Infuse (its description, Firecore's own words there, sends you to "firecore.com/terms-privacy for
# full terms and privacy policy" and gives the 24-hour cancel deadline). Pro is bought only through the App Store, so
# Apple's Media Services Terms apply to the purchase: the shared document apple-media-services (its header names the App
# Store's subscriptions), and the worse of each topic's two grades shows. Not applied: Apple's own privacy policy, which
# covers your Apple Account, not Infuse. There's no sign-up (no Infuse account), and no app licence of its own beyond its
# terms (the App Store's standard licence is part of Apple's terms). Trakt, TMDB, OpenSubtitles and the media servers
# and cloud drives it connects to are other companies' services with their own terms, not read. Calibrated against Plex,
# Emby and Nebula.
policies:
  shared: [apple-media-services]
  links:
    - name: 'Terms of service'
      url: https://firecore.com/terms
    - name: 'Privacy policy'
      url: https://firecore.com/privacy
    - name: 'Infuse'
      url: https://firecore.com/infuse
    - name: 'Infuse on the App Store'
      url: https://apps.apple.com/us/app/infuse/id1136220934
    - name: 'Purchases and Family Sharing'
      url: https://support.firecore.com/hc/en-us/articles/360046954753-Purchases-and-Family-Sharing
    - name: 'Settings overview'
      url: https://support.firecore.com/hc/en-us/articles/360015608854-Settings-Overview
    - name: 'iCloud Sync'
      url: https://support.firecore.com/hc/en-us/articles/115000070773-iCloud-Sync
    - name: 'Reporting security issues'
      url: https://support.firecore.com/hc/en-us/articles/15732551201943-Reporting-Security-Issues
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It collects how you use its website and app, to study and improve them. You can turn off the app’s crash reports in its settings, but the website’s tracking only by refusing cookies, browser by browser.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'To gather analysis or valuable information so that we can improve our Service'
        - url: https://support.firecore.com/hc/en-us/articles/360015608854-Settings-Overview
          quote: 'Share Crash Data - Allow Infuse to collect anonymous diagnostic and crash data (system info, video codecs, time used, etc...)'
        - url: https://firecore.com/privacy
          quote: 'You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent.'
      action:
        name: 'Turn off Share Crash Data (settings)'
        url: https://support.firecore.com/hc/en-us/articles/360015608854-Settings-Overview
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'Its website uses Google Analytics, and Google may use what it collects for its own ads. You can only refuse cookies or turn on Do Not Track, browser by browser.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'Google may use the collected data to contextualize and personalize the ads of its own advertising network.'
        - url: https://firecore.com/privacy
          quote: 'We support Do Not Track ("DNT").'
        - url: https://firecore.com/privacy
          quote: 'You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent.'
      action:
        name: 'Its privacy policy'
        url: https://firecore.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: great
      reason: 'Infuse shows no ads and doesn’t track what you watch for advertising.'
      sources:
        - url: https://firecore.com/infuse
          quote: 'No ads, no tracking, and no harvesting of library info…ever! Your data is your own and we believe it should stay that way.'
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether anything from Infuse trains AI.'
      pages: [https://firecore.com/privacy, https://firecore.com/terms]
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your data as long as it needs it, and usage data usually for a shorter time, without naming any period.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'Firecore, LLC will retain your Personal Data only for as long as is necessary for the purposes set out in this Privacy Policy.'
        - url: https://firecore.com/privacy
          quote: 'Usage Data is generally retained for a shorter period of time, except when this data is used to strengthen the security or to improve the functionality of our Service, or we are legally obligated to retain this data for longer time periods.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: great
      reason: 'Infuse needs no account and avoids collecting personal data. Your library, watched history and settings stay on your devices and in your own iCloud, where you can delete them yourself.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'To the extent that our website and apps can provide their functionality without requiring your personal info, we will avoid collecting any personal data from you.'
        - url: https://support.firecore.com/hc/en-us/articles/115000070773-iCloud-Sync
          quote: 'Select the option to Delete Data From iCloud'
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      status: not-stated
      reason: 'Outside the EEA, its privacy policy names no way to get a copy of your data. Infuse keeps your library on your own devices and iCloud.'
      pages: [https://firecore.com/privacy]
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      regions: [EU]
      tier: neutral
      reason: 'In the EEA, you can ask it for a copy of your data in a machine-readable form; there’s no way to get it yourself.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'The right to data portability. You have the right to be provided with a copy of the information we have on you in a structured, machine-readable and commonly used format.'
        - url: https://firecore.com/privacy
          quote: 'If you wish to be informed what Personal Data we hold about you and if you want it to be removed from our systems, please contact us.'
      action:
        name: 'How to ask (its privacy policy)'
        url: https://firecore.com/privacy
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: poor
      reason: 'Besides what the law or a valid request requires, it may hand over your data when it believes that protects it from legal liability. It doesn’t say it tells you.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'Firecore, LLC may disclose your Personal Data in the good faith belief that such action is necessary to:'
        - url: https://firecore.com/privacy
          quote: 'To protect against legal liability'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: poor
      reason: 'Your data goes to the United States and may be kept in other countries whose laws protect it less. It promises “adequate controls” without saying what they are.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'If you are located outside United States and choose to provide information to us, please note that we transfer the data, including Personal Data, to United States and process it there.'
        - url: https://firecore.com/privacy
          quote: 'Your information, including Personal Data, may be transferred to — and maintained on — computers located outside of your state, province, country or other governmental jurisdiction where the data protection laws may differ than those from your jurisdiction.'
        - url: https://firecore.com/privacy
          quote: 'no transfer of your Personal Data will take place to an organization or a country unless there are adequate controls in place including the security of your data and other personal information.'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: great
      reason: 'There’s no sign-up: you download Infuse free, with no Firecore account, and buy Pro in the App Store with your Apple Account.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'To the extent that our website and apps can provide their functionality without requiring your personal info, we will avoid collecting any personal data from you.'
        - url: https://support.firecore.com/hc/en-us/articles/360046954753-Purchases-and-Family-Sharing
          quote: 'Download Infuse 8 (free w/ optional in-app purchase)'
      lastVerified: 2026-11-13
    - topic: privacy.children
      tier: neutral
      reason: 'It isn’t meant for under-18s, and it removes children’s data it gets without a parent’s consent. Infuse has no ads, and parents can limit what children can see by rating and folder.'
      sources:
        - url: https://firecore.com/privacy
          quote: 'Our Service does not address anyone under the age of 18 ("Children").'
        - url: https://firecore.com/privacy
          quote: 'If we become aware that we have collected Personal Data from children without verification of parental consent, we take steps to remove that information from our servers.'
        - url: https://firecore.com/infuse
          quote: 'Control the types of content your little ones can access with easily configurable rating and folder controls.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: neutral
      reason: 'You cancel in the App Store’s subscriptions, not with Firecore, and at least 24 hours before your period ends, or it renews.'
      sources:
        - url: https://firecore.com/terms
          quote: 'You may cancel your Subscription renewal through the Subscriptions section of the App Store, or by contacting Apple.'
        - url: https://apps.apple.com/us/app/infuse/id1136220934
          quote: 'Your iTunes Account will be charged for the upcoming period unless you disable auto-renew or cancel your subscription in your Account Settings at least 24-hours prior to the end of the current period.'
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'Firecore gives no money back; cancelling stops the next renewal, so Pro lasts to the end of the time you paid for. If you ask Apple for a refund, Firecore may tell Apple how much you used Infuse.'
      sources:
        - url: https://firecore.com/terms
          quote: 'All amounts paid are non-refundable.'
        - url: https://firecore.com/terms
          quote: 'You may cancel your Subscription renewal through the Subscriptions section of the App Store, or by contacting Apple.'
        - url: https://firecore.com/privacy
          quote: 'If we receive a refund request for an in-app purchase, we may provide Apple with information about the your in-app purchase activity.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: great
      reason: 'A new price starts only after the period you’ve paid for ends, and it tells you first so you can cancel before then.'
      sources:
        - url: https://firecore.com/terms
          quote: 'Any Subscription fee change will become effective at the end of the then-current Billing Cycle.'
        - url: https://firecore.com/terms
          quote: 'Firecore will provide you with reasonable prior notice of any change in Subscription fees to give you an opportunity to terminate your Subscription before such change becomes effective.'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: poor
      reason: 'Pro starts with 7 free days. It may need your payment details, and it charges you on the trial’s last day unless you’ve cancelled; no reminder is promised.'
      sources:
        - url: https://firecore.com/infuse
          quote: 'Free 7-day trial included. Cancel anytime.'
        - url: https://firecore.com/terms
          quote: 'You may be required to enter your billing information in order to sign up for the Free Trial.'
        - url: https://firecore.com/terms
          quote: 'On the last day of the Free Trial period, unless you canceled your Subscription, you will be automatically charged the applicable Subscription fees for the type of Subscription you have selected.'
      lastVerified: 2026-11-13
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say Pro renews on its own at the end of each period, but not that it reminds you first.'
      pages: [https://firecore.com/terms, https://apps.apple.com/us/app/infuse/id1136220934]
      lastVerified: 2026-11-13
    - topic: billing.fees
      tier: good
      reason: 'You pay the price and any taxes. Your bank or card company may add its own fees, such as for converting currency.'
      sources:
        - url: https://firecore.com/terms
          quote: 'You further agree to be responsible for all taxes associated with the Service, along with any transaction fees and currency conversions added by your financial institution and intermediaries.'
      lastVerified: 2026-11-13
    - topic: legal.disputes
      tier: neutral
      reason: 'Every dispute goes to one private referee (an arbitrator), in Denver, Colorado unless you both agree otherwise, and the decision is final, with no appeal. Its terms say nothing about class actions.'
      sources:
        - url: https://firecore.com/terms
          quote: 'shall be resolved by arbitration. Such arbitration shall be conducted by a single arbitrator.'
        - url: https://firecore.com/terms
          quote: 'Unless otherwise agreed to by the parties, arbitration shall be held in the City of Denver, Colorado, USA.'
        - url: https://firecore.com/terms
          quote: 'The decision arrived at by the arbitrator shall be final and binding and no appeal shall lie therefrom.'
      action:
        name: 'Its dispute clause (its terms)'
        url: https://firecore.com/terms
      lastVerified: 2026-11-13
    - topic: legal.terms-changes
      tier: neutral
      reason: 'For changes it calls material, it tries to give at least 30 days’ notice, without saying how. Using Infuse after a change takes effect means you accept it.'
      sources:
        - url: https://firecore.com/terms
          quote: 'If a revision is material we will make reasonable efforts to provide at least 30 days’ notice prior to any new terms taking effect.'
        - url: https://firecore.com/terms
          quote: 'What constitutes a material change will be determined at our sole discretion.'
        - url: https://firecore.com/terms
          quote: 'By continuing to access or use our Service after those revisions become effective, you agree to be bound by the revised terms.'
      lastVerified: 2026-11-13
    - topic: legal.account-closure
      tier: good
      reason: 'It closes an account only if you break its terms or put others at risk, and warns you first, giving you a chance to put it right. It doesn’t mention a refund.'
      sources:
        - url: https://firecore.com/terms
          quote: 'In the following circumstances we will provide notice to you prior to termination of your account: (a) you are in breach of these Terms; or (b) you are using our Services in a way that can cause or has caused a risk of harm or loss to either Firecore or other users.'
        - url: https://firecore.com/terms
          quote: 'If you remedy the issues that caused us to send the notice, to our satisfaction, then we will not terminate your access or license to our Services.'
      lastVerified: 2026-11-13
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or stop Infuse or any of its features at any time without notice, and what you paid isn’t refunded.'
      sources:
        - url: https://firecore.com/terms
          quote: 'Firecore reserves the right to modify or discontinue the Service or any feature or functionality thereof at any time without notice.'
        - url: https://firecore.com/terms
          quote: 'All amounts paid are non-refundable.'
      lastVerified: 2026-11-13
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://firecore.com/terms]
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: neutral
      reason: 'It invites people to report security flaws privately and rewards them, but doesn’t say outside experts audit its security.'
      sources:
        - url: https://support.firecore.com/hc/en-us/articles/15732551201943-Reporting-Security-Issues
          quote: 'we warmly welcome individuals who discover potential security risks or data leaks to disclose them in a responsible way to our team.'
        - url: https://support.firecore.com/hc/en-us/articles/15732551201943-Reporting-Security-Issues
