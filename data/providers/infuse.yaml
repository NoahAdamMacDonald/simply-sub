# ... Italian, Japanese, Korean, ... Portuguese, ... Simplified Chinese, ... Spanish", 37 in all), which its release notes
# bear out in part ("French (Canada) localization", "Added Hindi translation", "Added Spanish (Latin America)
# translation", "Added Traditional Chinese (HK) translation"), so the registry's eleven (notes.md). Its code is closed
