# Researched by hand on 2026-11-09 (M11.15, the music category, part 1), read with Edge from Canada and through each
# country's exit. Pages, each quoted where it's used:
# Pricing: checkout.soundcloud.com/go (soundcloud.com/go), which prices by where the visitor is: read from Canada
# ("CA$6.99/month"), and through a US, UK, Australian, New Zealand, Irish, German, French, Dutch, Spanish and Italian
# exit, each page in that country's currency. Go and Go+, monthly by their cards, which its SoundCloud Go Terms bill as
# "a 30-day period" that "will thereafter renew automatically for additional 30-day periods", so they're priced every 30
# days. The Student discount ("Get SoundCloud Go+ for 50% off") isn't listed, as other students' offers aren't.
# Region checklist, 2026-11-09: 1. no country paths; 2. no picker; 3. not looked for; 4. checkout's plan page read, no
# further; 5. none; 6. Edge from Canada and through each exit; 7. no bill offered.
# Bundles and resellers: none on its pages; Apple bills it in its app (its Go terms), a way to pay.
# Features, read 2026-11-09: each card's "Ad-free listening" and "Save unlimited tracks for offline listening", and
# Go+'s "Mix tracks within select DJ apps" (a perk). Go's card also lists "Access full catalog" and "High quality
# audio", but its help centre's current comparison gives both to Go+ alone ("Grants full access to the entire catalog,
# high-quality audio", Choosing the Right Subscription), and its bitrates: "High-quality streaming is an exclusive
# feature for SoundCloud Go+ subscribers. While standard tracks are streamed at 160kbps AAC, HQ tracks are encoded in
# 256kbps AAC" (High Quality Streaming). Audio quality is defined by bitrate, so Go is Standard and Go+ High, with
# Go+'s full catalog a perk; the pull request asks the owner. Free listeners "can stream 96k and 160k" (Audio
# Streaming Formats), so Standard. No audiobooks.

# Skips, your own music, lyrics and live radio, read 2026-11-11: no page names a skip limit (the Go pages, Shuffling
# and Repeating tracks: inferred); its uploads publish your tracks for others, not a music library; no page names
# lyrics or live radio.
id: soundcloud
name: SoundCloud
website: https://soundcloud.com
# Its checkout, help centre and legal pages.
domains: [checkout.soundcloud.com, help.soundcloud.com, pages.soundcloud.com]
category: music
spendCategory: streaming
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    AU: AUD,
    NZ: NZD,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
cancelUrl: https://help.soundcloud.com/hc/en-us/articles/360056011234-Cancel-your-subscription
sources: { pricing: https://checkout.soundcloud.com/go }
# Owner (M11.2), read 2026-11-09: its terms' Disclosures name the company that offers it.
owner:
  name: SoundCloud Global Limited & Co. KG
  page:
    name: Terms of Use
    url: https://soundcloud.com/terms-of-use
  quotes:
    - 'The services hereunder are offered by SoundCloud Global Limited & Co. KG, a company incorporated under the laws of Germany and with its main place of business at Karl-Marx-Strasse 101, 12043 Berlin, Germany.'
  country:
    code: DE
  lastVerified: 2026-11-09
# Ways to pay and cards (M9.2, M11.5), read 2026-11-09 in its SoundCloud Go Terms.
paymentMethods:
  - methods: [card, paypal, app-store]
    page: SoundCloud Go and SoundCloud DJ Terms of Use
    url: https://pages.soundcloud.com/go-terms-of-use
    quotes:
      - 'Payment can be made by Visa, Mastercard, American Express or PayPal'
      - 'If you subscribe to SoundCloud Go via the SoundCloud In-App purchase, the terms and conditions of the Apple app store through which you make the purchase will apply'
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex]
    url: https://pages.soundcloud.com/go-terms-of-use
    quotes: ['Payment can be made by Visa, Mastercard, American Express or PayPal']
renewalAnchor:
  kind: every-30-days
  page: SoundCloud Go and SoundCloud DJ Terms of Use
  url: https://pages.soundcloud.com/go-terms-of-use
  quotes:
    - 'If you purchase a Go or Go+ Subscription, your Go or Go+ Subscription will be for a 30-day period, and your Go or Go+ Subscription will thereafter renew automatically for additional 30-day periods.'
  lastVerified: 2026-11-09

