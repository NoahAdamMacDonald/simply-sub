# Terms and policies, read 2026-11-09 (M11.15): the Terms of Use (last amended January 19, 2026; the page has its French
# copy too), the SoundCloud Go and SoundCloud DJ Terms of Use, the Privacy Policy, and its help centre's cancelling
# article, its articles on reporting a security vulnerability and on law enforcement requests (its Law Enforcement
# Guidelines, which that article names, weren't found). Its Community Guidelines and Cookie Policy hold no topic beyond
# these. Calibrated against Spotify's and
# Deezer's grades. Not rated: rights over your content and its apps' licence (not topics for music).
policies:
  links:
    - name: Terms of Use
      url: https://soundcloud.com/terms-of-use
    - name: SoundCloud Go and SoundCloud DJ Terms of Use
      url: https://pages.soundcloud.com/go-terms-of-use
    - name: Privacy Policy
      url: https://soundcloud.com/pages/privacy
    - name: Cancel your subscription
      url: https://help.soundcloud.com/hc/en-us/articles/360056011234-Cancel-your-subscription
    - name: Reporting a Security Vulnerability
      url: https://help.soundcloud.com/hc/en-us/articles/115003561228-Reporting-a-Security-Vulnerability
    - name: Law enforcement disclosure requests
      url: https://help.soundcloud.com/hc/en-us/articles/115003449967-Law-enforcement-disclosure-requests
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It studies how you use SoundCloud for its business. You can turn off its analytics only in each device’s own settings.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'To perform data and business analytics'
        - url: https://soundcloud.com/pages/privacy
          quote: 'You can disable mobile analytics and bug reporting through these same settings'
      action:
        name: Its privacy policy (your choices)
        url: https://soundcloud.com/pages/privacy
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares a coded copy of your email with advertisers and social networks to show you its ads elsewhere, and lets them track you with cookies. You can limit that only in cookie or device settings.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'Where permissible under applicable law we may share your email address (in hashed form, so that it does not identify you personally) with advertising partners, including social networks, in order to target you with ads for SoundCloud products on third party websites and applications.'
      action:
        name: Its privacy policy (your choices)
        url: https://soundcloud.com/pages/privacy
      lastVerified: 2026-11-09
    - topic: privacy.ads-tracking
      tier: neutral
      reason: 'The free plan shows ads chosen for you. You can turn personal ads off in your settings, and then see general ones.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'If you do not want SoundCloud to deliver “interest based” or personalized ads for third party products, you can adjust your Settings in the “Advertising” tab (for EU/EEA/U.K. and California users, under “Cookie Manager”).'
      action:
        name: Its privacy policy (advertising settings)
        url: https://soundcloud.com/pages/privacy
      lastVerified: 2026-11-09
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its terms and privacy policy don’t say whether it trains AI on what you upload or listen to.'
      pages: [https://soundcloud.com/terms-of-use, https://soundcloud.com/pages/privacy]
      lastVerified: 2026-11-09
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data while you have an account, and for 3 years after the year you cancel, for the law.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'We generally retain personal data for as long as is necessary to provide services to you under your account, i.e. as long as your contract is ongoing and for the sake of legal obligations, for 3 years following the end of the year in which your contract was canceled'
      lastVerified: 2026-11-09
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can delete your account yourself in your settings, which deletes your data apart from backups, but it doesn’t say how long that takes.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'If you have an account and would like to delete it, you may do so by adjusting your Settings in the account tab.'
        - url: https://soundcloud.com/pages/privacy
          quote: 'If you delete your account, all personal data associated with your account (except for backup copies)'
      action:
        name: Its privacy policy (deleting your account)
        url: https://soundcloud.com/pages/privacy
      lastVerified: 2026-11-09
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can see much of your data in your settings, and ask it for a copy in a format other apps can read.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'you may also be entitled to request copies of personal data you have provided to us in machine-readable format.'
      action:
        name: Its privacy policy (your rights)
        url: https://soundcloud.com/pages/privacy
      lastVerified: 2026-11-09
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It gives your data to authorities only when the law requires it, its help centre says, though its privacy policy keeps the right to answer other checked requests.'
      sources:
        - url: https://help.soundcloud.com/hc/en-us/articles/115003449967-Law-enforcement-disclosure-requests
          quote: 'In line with our Privacy Policy, we can only disclose requested information to a competent authority when we are obliged to do so by applicable law.'
      lastVerified: 2026-11-09
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your data can leave Europe, under the EU’s standard contracts or another legal way.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'We utilize appropriate safeguards such as Standard Contractual Clauses approved by the European Commission, or another legally approved mechanism, to ensure the lawful transfer of your personal data outside of the EEA.'
      lastVerified: 2026-11-09
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'An account takes your email, age or birthday, postal code, a username (a nickname is fine) and a password.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'your age or birthdate, postal code, a username (which may be your real name or a pseudonym) and a password'
      lastVerified: 2026-11-09
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 16 in Europe and the UK, or 13 elsewhere, to use SoundCloud.'
      sources:
        - url: https://soundcloud.com/pages/privacy
          quote: 'Anyone under the age of 16 in the EEA and UK, or 13 in the United States and the rest of the world, is not permitted to use the Platform and must not attempt to register an account or submit any personal data to us.'
      lastVerified: 2026-11-09
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel on its website at any time, and keep Go until the end of the period you paid for.'
      sources:
        - url: https://help.soundcloud.com/hc/en-us/articles/360056011234-Cancel-your-subscription
          quote: 'When you cancel your SoundCloud Go subscription, you’ll keep your premium features—including ad-free listening and offline downloads—until your current billing cycle ends.'
      lastVerified: 2026-11-09
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back for the rest of a period, but you keep Go until it ends.'
      sources:
        - url: https://soundcloud.com/terms-of-use
          quote: 'If you have a Subscription, and terminate this Agreement before the end of such Subscription, we are unable to offer any refund for any unexpired period of your Subscription.'
      lastVerified: 2026-11-09
    - topic: billing.price-changes
      tier: great
      reason: 'It tells you at least six weeks before a price goes up, and the new price starts only when you renew after that, so you can cancel first.'
      sources:
        - url: https://pages.soundcloud.com/go-terms-of-use
          quote: 'we will communicate these change(s) to you at least six (6) weeks in advance and the changes will only take effect with respect to any renewal of your Go or Go+ Subscription following the applicable six (6) week period.'
      lastVerified: 2026-11-09
    - topic: billing.free-trials
      tier: neutral
      reason: 'Its trial turns into a paid plan unless you cancel before it ends. Its terms don’t say it reminds you first.'
      sources:
        - url: https://pages.soundcloud.com/go-terms-of-use
          quote: 'However, any applicable cancellation must occur prior to the end of the respective Trial or Special Offer period.'
      lastVerified: 2026-11-09
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say Go renews every 30 days on its own, but not that it reminds you first.'
      pages: [https://pages.soundcloud.com/go-terms-of-use]
      lastVerified: 2026-11-09
    - topic: billing.fees
      status: not-stated
      reason: 'Its terms name no fees besides the price.'
      pages: [https://pages.soundcloud.com/go-terms-of-use]
      lastVerified: 2026-11-09
    - topic: billing.plan-changes
      tier: great
      reason: 'You can move between Go and Go+ at any time, and pay or get back the difference for the time left.'
      sources:
        - url: https://pages.soundcloud.com/go-terms-of-use
          quote: 'If you upgrade or downgrade you will immediately be charged the difference in price or you will immediately be refunded.'
      lastVerified: 2026-11-09
    - topic: legal.disputes
      tier: good
      reason: 'Disputes go to the courts of Berlin, under German law, with no arbitration, unless your country’s law says otherwise, as in the US and the EU.'
      sources:
        - url: https://soundcloud.com/terms-of-use
          quote: 'Except where otherwise required by the mandatory law of the United States or any member state of the European Union'
        - url: https://soundcloud.com/terms-of-use
          quote: '(ii) you hereby agree, and SoundCloud agrees, to submit to the exclusive jurisdiction of the courts in Berlin, Germany for resolution of any dispute, action or proceeding arising in connection with this Agreement.'
      lastVerified: 2026-11-09
    - topic: legal.terms-changes
      tier: neutral
      reason: 'It tells you about big changes to its terms, which start two weeks later. If you don’t agree, you can close your account.'
      sources:
        - url: https://soundcloud.com/terms-of-use
          quote: 'the revised Terms of Use will become effective two (2) weeks after such notification'
      lastVerified: 2026-11-09
    - topic: legal.account-closure
      tier: poor
      reason: 'It can close your account for breaking its rules, and also in other circumstances it decides are reasonable, with no money back.'
      sources:
        - url: https://soundcloud.com/terms-of-use
          quote: '(iv) in other reasonable circumstances as determined by SoundCloud at its discretion.'
        - url: https://pages.soundcloud.com/go-terms-of-use
          quote: 'Please note we do not offer refunds to Go or Go+ Subscription holders whose accounts are terminated as a result of repeated infringement'
      lastVerified: 2026-11-09
    - topic: legal.service-changes
      tier: poor
      reason: 'It can stop SoundCloud, or any part of it, at any time and for any reason, and says it isn’t responsible for that.'
      sources:
        - url: https://soundcloud.com/terms-of-use
          quote: 'SoundCloud reserves the right at any time and for any reason to suspend, discontinue, terminate or cease providing access to the Platform or any part thereof, temporarily or permanently, and whether in its entirety or with respect to individual territories only.'
      lastVerified: 2026-11-09
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms and privacy policy don’t say it closes accounts you haven’t used.'
      pages: [https://soundcloud.com/terms-of-use, https://soundcloud.com/pages/privacy]
      lastVerified: 2026-11-09
    - topic: security.practices
      tier: neutral
      reason: 'Security experts can report problems through its disclosure programme on Bugcrowd, but it doesn’t say outside experts check its security or publish what they find.'
      sources:
        - url: https://help.soundcloud.com/hc/en-us/articles/115003561228-Reporting-a-Security-Vulnerability
          quote: 'Our Responsible Disclosure program is hosted on Bugcrowd.'
      lastVerified: 2026-11-09
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its terms make you answer for all use of your login, whether you allowed it or not, but don’t say whether you may share Go.'
      pages: [https://soundcloud.com/terms-of-use, https://pages.soundcloud.com/go-terms-of-use]
      lastVerified: 2026-11-09
    - topic: service.device-limits
      tier: neutral
      reason: 'Go works on up to three devices, playing on one at a time, and offline tracks disappear if you don’t log in for 30 days.'
      sources:
        - url: https://pages.soundcloud.com/go-terms-of-use
          quote: 'Your Go or Go+ Subscription can be used on up to three different devices at a time, although streaming while you’re logged in is limited to one device at a time.'
        - url: https://pages.soundcloud.com/go-terms-of-use
          quote: 'Otherwise, Content you select for offline listening will be automatically removed from your device after 30 days.'
      lastVerified: 2026-11-09
