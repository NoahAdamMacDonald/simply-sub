# Researched by hand on 2026-11-09 (M11.15, the music category, part 2). tidal.com and its help centre answer this
# machine with 403 (the VPN's addresses), and tidal.com's own pages show nothing even to a split-tunnelled Chromium on
# an ordinary connection, which read its help centre (2026-11-09). tidal.com's pricing, sound quality, terms and privacy
# pages are read from the Internet Archive's copies (pricing and privacy of 2026-10-31, sound quality of 2026-08-23,
# terms of 2026-10-14), as a backup; prices come from the help centre's live Subscription Types article, in US dollars
# ("Prices above are shown in USD, and subscription types and costs may vary depending on your location"). Pages, each
# quoted where it's used.
# Billing: "Tidal subscription fees are charged every 30 days rather than on a set date each month" (Add or Update
# Payment Information), so its months are priced every 30 days.
# Region checklist for its other regions, 2026-11-09: 1. no country paths found; 2. no picker read; 3. not looked for;
# 4. checkout not opened; 5. its help centre gives US prices only; 6. Edge, a plain fetch and Mullvad Browser get 403
# or nothing, a split-tunnelled Chromium nothing from tidal.com; the archive's copy of its pricing page is the US's (its
# page data: "countryCode" "US", "currency" "USD", 30 days); 7. no bill offered.
# Not listed: the Student plans ("available to eligible students").
# Bundles and resellers: none named; Apple and Google Play bill it in their apps (its cancelling article), and some
# subscriptions come "through a third party provider ... bundled together with other services" (its terms): partners.
# Features, read from the archive's pricing page: Individual and Family each "Millions of tracks in lossless, HiRes FLAC,
# and Dolby Atmos" and "Ad-free, offline listening", Family "For up to 6 members", DJ "A Tidal Individual Account" with
# "Access the full catalog through compatible DJ software" (a perk); HiRes FLAC is "(Up to 24-bit, 192 kHz)" (the
# archive's sound quality page). No audiobooks.

# Coverage: tidal.* in CA, GB, AU, NZ, IE, DE, FR, NL, ES and IT: tidal.com refuses this machine and shows nothing on an
# ordinary connection, and its help centre prices the US only (2026-11-09), so those countries' prices stay unread.

# Skips, your own music, lyrics and live radio, read 2026-11-11: "Each line of the song is highlighted as it plays"
# (View lyrics, from its help centre's API, which answers a plain fetch); Upload is for "your own original audio"
# ("Upload tracks you own the rights to", Tidal Upload), publishing rather than your music library; a Live session
# "may be also featured on TIDAL Services and visible in TIDAL clients to any TIDAL user" (the archive's privacy
# notice). No page names a skip limit (inferred).
