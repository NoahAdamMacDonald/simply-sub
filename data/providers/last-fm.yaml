# Terms and policies (M11.15), read 2026-11-13 with a plain fetch (each page's own text): its Terms of Use (updated 14
# September 2026, its acceptable use policy included), Privacy Policy (updated 26 May 2026), Cookies Policy (updated 15
# October 2026), Subscription Terms (effective 26 February 2024, which Pro's buyers accept and which include the Terms
# of Use and Privacy Policy), Community Guidelines (no topic beyond the terms' own), and its staff's support topics on
# cancelling, paying, deleting your account and downloading your scrobbles. Its API Terms of Service are for developers,
# not read. Not read: its sign-up form, which shows Edge (from Canada and through a US exit) a picture puzzle ("Enter the
# characters seen in the image below"), and its checkout (it asks you to log in). Its site shows UK and European readers a
# consent banner ("Do you consent to these personal data processing activities by us and our partners?", 1,747
# partners) and North American readers none; its footer's "Do Not Sell My Personal Information" opens the same cookie
# settings. No security page, security.txt or bug bounty found. Calibrated against Mixcloud's, Audiomack's and
# Curiosity Stream's grades. Not rated: switching plans (one paid plan), its apps' licence and changes to your device (not
# topics for music or social).
policies:
  links:
    - name: Terms of Use
      url: https://www.last.fm/legal/terms
    - name: Privacy Policy
      url: https://www.last.fm/legal/privacy
    - name: Cookies Policy
      url: https://www.last.fm/legal/cookies
    - name: Subscription Terms
      url: https://www.last.fm/legal/subscription
    - name: Last.fm Pro
      url: https://www.last.fm/pro
    - name: How do I cancel Last.fm Pro?
      url: https://support.last.fm/t/how-do-i-cancel-last-fm-pro/190
    - name: How do I permanently delete my account?
      url: https://support.last.fm/t/how-do-i-permanently-delete-my-account/163
    - name: How can I download / backup my Last.fm scrobbling data?
      url: https://support.last.fm/t/how-can-i-download-backup-my-last-fm-scrobbling-data/171
    - name: Join (sign-up page)
      url: https://www.last.fm/join
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records the pages you visit and your searches, uses tools that watch your mouse movements and clicks, and runs tests and research on your data. You can refuse only through cookie settings, browser by browser.'
      sources:
        - url: https://www.last.fm/legal/privacy
          quote: 'From time to time, we use may third-party tools to help us look at mouse movements, clicks and the pages you visit to assess and improve site functionality, usability and security.'
        - url: https://www.last.fm/legal/privacy
          quote: 'We use all categories of personal information to analyse and understand how the Last.fm Services are operating.'
        - url: https://www.last.fm/legal/cookies
          quote: 'Your choices generally apply to the browser and device you are using.'
      action:
        name: Its Cookies Policy (managing cookies)
        url: https://www.last.fm/legal/cookies
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It gives your email (coded) and what you do on Last.fm to Meta, Snap and X to show you ads there, and your details to partners for their own use. You can opt out only in part, device by device and browser by browser.'
      sources:
        - url: https://www.last.fm/legal/privacy
          quote: 'We share your personal information with social media companies such as Meta, Snap, X, etc. so that we can communicate with you or provide you with relevant advertising related to your interests on those platforms.'
        - url: https://www.last.fm/legal/privacy
          quote: 'These commercial partners use the information we provide to them as described in their privacy policies.'
        - url: https://www.last.fm/legal/privacy
          quote: 'Please note that your choice to opt-out is device-specific or browser-specific and you will need to manage your preferences for each device or browser you use.'
      action:
        name: Its Privacy Policy (interest-based advertising)
        url: https://www.last.fm/legal/privacy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Without Pro you see ads, and ad companies follow what you do on Last.fm and other sites to pick them. In North America you can turn that off only in cookie settings or ad industry tools, browser by browser.'
      sources:
        - url: https://www.last.fm/legal/privacy
          quote: 'Third-party ad providers (such as Google AdSense, YieldMo, Freestar, Pubmatic etc.) use cookies, pixels, tags, beacons or similar technologies to enable interest-based advertising across sites and apps (combining Last.fm data with your activity elsewhere).'
        - url: https://www.last.fm/legal/privacy
          quote: 'Please note that your choice to opt-out is device-specific or browser-specific and you will need to manage your preferences for each device or browser you use.'
      action:
        name: Its Privacy Policy (interest-based advertising)
        url: https://www.last.fm/legal/privacy
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      regions: [GB, EU]
      tier: good
      reason: 'In the UK and Europe its site asks first: it uses cookies for ads chosen from what you do only once you agree in its cookie settings.'
      sources:
        - url: https://www.last.fm/legal/cookies
          quote: 'Except where a technology is strictly necessary or another applicable legal exception has been confirmed, we will not use it until you have made your choice through our cookie settings.'
        - url: https://www.last.fm/legal/cookies
          quote: 'measure advertising and, where you have agreed, provide advertising based on your interests.'
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy trains machine learning models to improve its own service, such as recommendations, but doesn’t say whether what you write trains AI used elsewhere.'
      pages: [https://www.last.fm/legal/privacy, https://www.last.fm/legal/terms]
      lastVerified: 2026-11-13
    - topic: privacy.content-access
      tier: poor
      reason: 'Last.fm uses your messages and posts to run and personalise its service, and can watch, change or remove anything you post. Only people in the UK and Europe can object, by email.'
      sources:
        - url: https://www.last.fm/legal/privacy
          quote: 'We use registration information, profile information, payment information, as well as your scrobbles, messages and other online engagement to provide the Last.fm Services.'
        - url: https://www.last.fm/legal/terms
          quote: 'it has the right, in its sole discretion to monitor, modify, transmit over various networks, refuse, move, block access to or remove any of Your Upload Information.'
        - url: https://www.last.fm/legal/privacy
          quote: 'Object to our use of your data when we rely on legitimate interests.'
      action:
        name: Its Privacy Policy (your rights)
        url: https://www.last.fm/legal/privacy
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data as long as it thinks reasonably necessary, and your account while you use it. A deleted account can be restored for 14 days, then it’s gone for good.'
      sources:
        - url: https://www.last.fm/legal/privacy
          quote: 'We will retain your personal information for the time period reasonably necessary to achieve the purposes described in this privacy policy'
        - url: https://www.last.fm/legal/privacy
          quote: 'For example, we retain your registration information for the duration of your relationship with us.'
        - url: https://support.last.fm/t/how-do-i-permanently-delete-my-account/163
          quote: 'Accounts that requested permanent deletion from May 2018 onwards can only be recovered within 14 days of requesting deletion by logging in. After this time they are permanently deleted from our database.'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can delete your account yourself in its settings, which deletes your listening history and everything with it.'
      sources:
        - url: https://support.last.fm/t/how-do-i-permanently-delete-my-account/163
          quote: 'Should you wish to delete your account, you can do so by navigating to your Account Settings page.'
        - url: https://support.last.fm/t/how-do-i-permanently-delete-my-account/163
          quote: 'This will delete your Last.fm user account, all your listening data, and everything else that goes with it.'
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      tier: good
      reason: 'You can take your whole listening history with you through its public API, in JSON or XML, after making a free API key, or with tools others built on it.'
      sources:
        - url: https://support.last.fm/t/how-can-i-download-backup-my-last-fm-scrobbling-data/171
          quote: 'Your scrobbling data is made available through the Last.fm public API and is available in XML and JSON formats.'
        - url: https://support.last.fm/t/how-can-i-download-backup-my-last-fm-scrobbling-data/171
          quote: 'Please note that you will need to create an API key before you can use the Last.fm API.'
      action:
        name: How can I download / backup my scrobbling data?
        url: https://support.last.fm/t/how-can-i-download-backup-my-last-fm-scrobbling-data/171
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It gives your data to police, courts and governments when it thinks the law or legal process needs it, or to protect its rights or people’s safety. It doesn’t say it tells you.'
      sources:
        - url: https://www.last.fm/legal/privacy
          quote: 'We will share your information with our legal and tax advisors, insurers, law enforcement, judicial and other government bodies (including law enforcement (police) or regulators), and others when we think it is necessary to do so to comply with the law, the legal process, to obtain legal or other professional advice, to respond to legal claims, or to protect our rights or the property or personal safety of our users, employees, or the public.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: neutral
      reason: 'It’s based in the UK, and may move your data to the US and other countries, using standard contracts approved under UK and European law for the US.'
      sources:
        - url: https://www.last.fm/legal/privacy
          quote: 'We may transfer your personal information to a country (including the United States) that does not provide the same level of protection for your personal information.'
        - url: https://www.last.fm/legal/privacy
          quote: 'For instance, we put in place standard contractual clauses approved under data protection laws in the United Kingdom, the EEA, Switzerland to facilitate transfers to the United States of America.'
