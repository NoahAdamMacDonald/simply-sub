# Researched by hand on 2026-11-13 (M11.15, the music category, batch 8), read with Edge and a plain fetch from Canada,
# its Pro page again through a US, UK, Irish, Australian, New Zealand, German, French, Dutch, Spanish and Italian exit,
# and its support community (support.last.fm, its staff's FAQ topics) with a plain fetch. Pages, each quoted where it's
# used:
# Pricing: its Pro page (last.fm/pro) prices by where the visitor is: "$4.99 /month" and "$49.99 /year" read from Canada
# (the page's data names the reader's country, data-country-code="CA") and through the US, Australian and New Zealand
# exits; "£4.99" and "£49.99" through the UK's; "€4.99" and "€49.99" through Ireland's, Germany's, France's, the
# Netherlands', Spain's and Italy's. Its staff say "Depending on your location, the price of Pro will be listed in either
# USD, GBP, or EUR." (Currency change, its support community, 2025-07-07), so the bare "$" is US dollars, Canada's too
# (Mixcloud's precedent). "Billed monthly" is "thirty-one (31) days from the date your Payment Method is charged" and the
# year "one year from the date your Payment Method is charged" (its Subscription Terms), so the month is priced every 31
# days. Its terms say "Unless otherwise stated, prices include VAT.", but no pricing page says so, so no taxIncluded.
# Not listed: "fixed duration subscriptions" ("one-off payments", "depending on your jurisdiction"), which no page read
# sells; promotional codes, first terms.
# Region checklist, 2026-11-13: 1. no country paths (its language paths, /de/pro and others, only translate); 2. a
# language menu, no country or currency picker; 3. the page's data names the country (data-country-code), not the
# currency; 4. checkout not opened (Get Pro now asks you to log in); 5. its staff's "Currency change" answer; 6. Edge
# and a plain fetch from Canada, Edge through each country's exit; 7. no bill offered.
# Bundles and official resellers: none on its Pro pages or support community; Pro can't be given as a gift (members ask
# for it: Idea: Allow the Gifting of Pro, 2026-05-06).
# What it is: a record of what you play elsewhere ("scrobbling"), with stats, charts, recommendations, profiles,
# friends and shouts. It streams nothing itself: "Last.fm discontinued its streaming service in 2014 and no longer hosts
# music." and "we don't stream music from our servers any more." (Does Last.fm host music? Isn't it a streaming
# site?). Its play buttons use other services: "We use Spotify and YouTube as the playback source for all music on the
# site, so anywhere you see this play button it means you can hear full-length version of that track or album." (How do
# I listen to music on Last.fm?), "Youtube playback is free for all users in all countries where available, however you
# will need a Spotify Premium account to use Spotify as playback source." (Do I have to pay to listen to music on
# Last.fm?). So it's a social service (the decision at `category:`): "connect and engage with other users" (its privacy
# policy), "Friends and neighbours" and "Every music profile is public" (What do I get for signing up?). It states no
# audio quality, because it plays none: the sound is YouTube's or Spotify's.
# Features: the Pro page's comparison table ("Last.month listening report", "Edit your scrobbles", "Change your
# username", "Advanced stats", "Blasts from the Past", "Historical listening reports", "Advanced playlist templates",
# "Exclusive display options", "Early access to new features", "30% discount on Last.fm merch", "Ad-free browsing",
# "Exclusive Pro badge"), each a perk but ad-free; ad-free browsing "Excludes ads on 3rd party video content from YouTube
# etc." (the Pro page), and "subscribing to Last.fm Pro will not remove YouTube's adverts" (Do I have to pay...?); the
# free site shows ads ("Don't want to see ads? Upgrade Now", its Features page). Its stations ("Tag stations and Similar
# Artist radio", "Personalised Radio Stations") are made from songs, not a live broadcast: no live radio (Spotify's
# precedent). No downloads to listen offline (its free music downloads are "a small selection of music files that were
# offered for users to download for free by the artists"), it plays no files of yours, and no page read names lyrics or
# a skip limit. No open protocol (social.protocol []).
# Free use: the free account ("Join millions of users. All for free.", its about page; "Registering a Last.fm account is
# free", What do I get for signing up?).

id: last-fm
name: Last.fm
website: https://www.last.fm
# Its support community, where its staff answer (LAST.HQ, LastfmSupport).
domains: [support.last.fm]
# Category (2026-11-13, the session's decision): Last.fm tracks what you listen to elsewhere and connects listeners;
# it plays no music itself ("Last.fm discontinued its streaming service in 2014 and no longer hosts music"), its play
# buttons using YouTube's or Spotify's players. So social, not music: no audio quality to state.
category: social
spendCategory: streaming
billingCurrency:
  {
    CA: USD,
    US: USD,
    GB: GBP,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    AU: USD,
    NZ: USD,
    GLOBAL: USD,
  }
cancelUrl: https://support.last.fm/t/how-do-i-cancel-last-fm-pro/190
sources: { pricing: https://www.last.fm/pro }

# Owner (M11.2), read 2026-11-13: its privacy policy names Last.fm Limited, which runs it, and says it's UK-based (its
# contact page: "Registered in: England & Wales", company number 4569646, 128 City Road, London). Paramount's until 2026:
# "Last.fm is now operating as an independent company following a change in ownership." and "Is Last.fm being acquired
# by another company? No. Last.fm is now operating independently." (Last.fm is now independent, its staff, 2026-05-27);
# its three managers "came together as the management team to take Last.fm independent again" and "That’s who owns
# Last.fm now. Us." (Who’s running Last.fm now?, 2026-06-04). A private company, so no shares are listed.
owner:
  name: Last.fm Limited
  page:
    name: Privacy Policy
    url: https://www.last.fm/legal/privacy
  quotes:
    - 'Last.fm Limited, ("Last.fm", "we", "us", or "our"), operates the Last.fm website(s), including the mobile and desktop apps, API, and related online services (collectively, the "Last.fm Services").'
  country:
    code: GB
    page:
      name: Privacy Policy
      url: https://www.last.fm/legal/privacy
    quotes:
      - 'Last.fm is a UK-based company, but operates globally.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: a card (its Subscription Terms; Stripe, its staff's "Stripe is the red
# "Continue to payment" button") and PayPal (How do I cancel Last.fm Pro?). Its staff say "We accept all major credit and
# debit cards" (Add payment methods for non-american users, 2025-06-12), naming no network, so acceptedNetworks is left
# out. No app store bills it: its apps only scrobble and show stats.
paymentMethods:
  - methods: [card]
    page: Subscription Terms
    url: https://www.last.fm/legal/subscription
    quotes:
      - 'to charge the fixed upfront payment for a fixed duration or a recurring subscription fee (depending on your jurisdiction and/or your selection) to your credit or debit card or bank account (each, a “Payment Method”).'
  - methods: [paypal]
    page: How do I cancel Last.fm Pro?
    url: https://support.last.fm/t/how-do-i-cancel-last-fm-pro/190
    quotes:
      - 'PayPal customers can also cancel their subscription from their PayPal account settings, as follows:'
# Renewal day (M11.5): its Subscription Terms bill "starting on the day you subscribe to the Subscription Services", but
# a month every 31 days ("The monthly subscription billing period is thirty-one (31) days from the date your Payment
# Method is charged, and the annual subscription billing period is one year from the date your Payment Method is
# charged."), which no kind of core's names: the month drifts a day or more each month, so not the date you signed up,
# and not every 30 days (notes.md).
renewalAnchor:
  kind: not-stated
  pages:
    [
      https://www.last.fm/legal/subscription,
      https://support.last.fm/t/how-do-i-update-my-payment-details/119637,
    ]
  lastVerified: 2026-11-13

# General features, read 2026-11-13. Platforms: "Last.fm Desktop Scrobbler for Windows", "Not using Windows? Try the Mac
# version", "Last.fm Android App", "Last.fm iOS App" (Track My Music) and the website. Sign-in: "Username or Email" and
# "Password" (its login page); no other way is offered there, and its staff haven't added two-step sign-in (members ask
# for it: Future 2FA or any other security measures). Its privacy policy mentions "when you log in via social platforms
# like Google, Apple, or Facebook", which no sign-in page read offers, so it isn't listed. App languages: its language
# menu (English, Deutsch, Español, Français, Italiano, 日本語, Polski, Português, Русский, Svenska, Türkçe, 简体中文; the
# registry has no Polish, Russian, Swedish or Turkish). Support: "Please visit our help section for your support issues.
