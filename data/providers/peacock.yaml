    page: What payment methods are accepted for Peacock?
    url: https://www.peacocktv.com/help/article/payment-methods
    quotes:
      - 'You may pay for a Peacock subscription via credit card (Visa/MasterCard/Discover/American Express), debit card, PayPal or in-app purchase on supported devices.'
  - methods: [gift-card]
    page: Peacock Gift Cards
    url: https://www.peacocktv.com/help/article/gift-cards-us
    quotes:
      - 'Peacock Gift Cards may be used to purchase Peacock Premium and Premium Plus subscriptions.'
# Renewal day (M11.5): its terms (2.2) move a monthly charge only when the subscription began on a date a month lacks.
renewalAnchor:
  kind: same-date
  page: Peacock Terms of Service
  url: https://www.peacocktv.com/terms
  quotes:
    - 'billing for a particular Service Tier may not occur on the same date of each month if your subscription began on a date not contained in a given month (for example, if you sign up for a monthly subscription on August 31st, you will be billed next on September 30th, etc.)'
  lastVerified: 2026-11-11
# Free use: none. Its terms: "ACCESS TO THE PEACOCK SERVICE REQUIRES YOU TO SIGN UP FOR A SUBSCRIPTION", and the
# picker sells paid plans only. One help article says a cancelled Premium subscriber can "watch a limited amount of
# content for free" afterwards; its terms control where the help centre differs (1.3), and no page offers it to anyone
# signing up.
freeUse:
  kind: none
  pages:
    - https://www.peacocktv.com/plans/all-monthly
    - https://www.peacocktv.com/terms
  lastVerified: 2026-11-11

# Platforms: "Web Browsers", "Android", "iOS", "Connected TVs, Game Consoles and Streaming Devices" (PlayStation, Xbox,
