# Researched by hand on 2026-11-11 (M11.15, streaming batch 6). Peacock isn't sold in Canada (peacocktv.com and its help
# centre send a Canadian visitor to peacocktv.com/unavailable: "Peacock is not yet available in your territory."), so
# its pages were read 2026-11-11 through a US exit: the plan picker in Edge, the help centre's 114 articles (its
# sitemap) with a plain fetch. Pages, each quoted where it's used:
# Pricing: its help centre's "How much does a Peacock subscription cost?" ("You can sign up for a Peacock Premium plan
# at $12.99 a month (+tax) or $129.99 per year (+tax).", Premium Plus "$19.99 a month (+tax) or $199.99 per year
# (+tax)", "the Peacock Select Tier for $8.99/month or $89.99/year"), the same as the plan picker
# (peacocktv.com/plans/all-monthly, which opens /plans/base: Select "$8.99/month" or "$89.99/year", Premium
# "$12.99/month" or "$129.99/year", Premium Plus "$19.99/month" or "$199.99/year") and its "Price Increase" article
# (new prices "as of August 18, 2026"). The annual cards' "Get 12 Months for the Price of 10" describes the regular
# yearly price, not an offer. The old annual picker (/plans/all-annual) still shows the prices before August 18
# ($79.99, $109.99, $169.99): not used. Prices are before tax ("(+tax)").
# Region checklist for CA and US, 2026-11-11: 1. one site, no country paths; 2. its language picker (English, Español)
# changes no prices; 3. the picker's page data names no country; 4. the picker's Choose buttons answered "Looks like an
# error occurred" through the exit, so the checkout wasn't reached; 5. the help centre's prices article; 6. Edge through
# a US exit, and a plain fetch; 7. no bill offered. Canada: not sold (its terms and help centre, below).
# Not listed: the NBC Sports regional sports networks (monthly add-ons for some zip codes, no price on any page read),
# Peacock Sports Pass (for bars and restaurants, sold by DAZN for Business) and the Plus add-on (no longer sold since
# April 1, 2025).
# Bundles: Apple TV and Peacock Premium ($17.99/month) and Premium Plus ($22.99/month), on the picker's Bundles tab and
# its help centre's "Apple TV and Peacock Bundle" ("You can subscribe to both services in a single transaction, through
# either Peacock or Apple."): drafted as bundle files beside this one. Official resellers: none. Its digital gift cards
# are "sold through the third-party company, Buyatab" on Peacock's own gift card page (a payment processor, not a
# shop). Xfinity, Spectrum, DIRECTV, Verizon +play, Xumo, Amazon, Apple, Google and Roku sign people up and bill it
# themselves (its cancelling article lists them): partners, not listed.
# Features, read 2026-11-11: Select has "TV Favorites from NBC, Bravo, & More" and "Excludes Sports, Movies, Live
# Programming and Peacock Originals" (the picker; its Select Tier article: TV shows "Yes, with limited exceptions",
# channels "Yes, but TV channels only"); Premium adds "LIVE Sports & Events" and "Hit Films & Peacock Originals";
# Premium Plus adds "Downloads & No Ads (limited exceptions)*" and "Local NBC Station" (the Select Tier article's
# table). 4K: "Peacock does offer certain content in 4K Ultra HD to Premium and Premium Plus subscribers" (Can I watch
# content in 4K Ultra HD on Peacock?); no page states Select's video quality, nor does a named publication: it waits in
# core's awaitingRequiredFeatures. No page names HDR or Dolby Atmos. Streams: "You are able to have up to three
# concurrent streams on your account." Profiles: "you can have up to 6 profiles on your account. It can be any
# combination of Kids and regular profiles". Downloads: "Peacock Premium Plus accounts can have a total of 25 pieces of
# content downloaded across all devices at any one time", with no number of devices, so 1 (inferred). Ads: Select and
# Premium have them; Premium Plus "is generally free of commercial interruptions" but live sports and channels keep
# their breaks, so ad-free with a note, as Paramount+ Premium is. Live: Premium's sports and "50+ always-on channels"
# (Why should I pay for Peacock?), and Premium Plus's local NBC station (a perk). What it streams: "hit movies and TV
# shows, Originals, current NBC & Bravo hits, and LIVE Sports" (What is Peacock?), "the latest in news, sports, and pop
# culture" (What content can I watch on Peacock?), "kid shows" and its Kids section, and Bravo's reality series (The
# Real Housewives, Below Deck, the Select Tier article); none of your own media.
# Pause: none (no page names one). Parental controls: "Peacock offers profile-based Maturity Rating settings and
# Profile Pin protection so parents can limit the TV shows and movies that a profile may access" (Does Peacock have
# parental controls?).

# Coverage: peacock.* in AS, GU, MP, PR and VI: sold there ("Peacock is currently available to stream within the United
# States and certain U.S. territories", Where is Peacock available?), but the plan picker and the prices article name
# no territory's price, and the US exit's page showed the US's (2026-11-11).

id: peacock
name: Peacock
website: https://www.peacocktv.com
# NBCUniversal's privacy centre, which its footer links as its Privacy Policy.
domains: [nbcuniversalprivacy.com]
category: streaming
spendCategory: streaming
# "Peacock is currently available to stream within the United States and certain U.S. territories (American Samoa,
# Guam, Northern Mariana Islands, Puerto Rico and the U.S. Virgin Islands)." (Where is Peacock available?), and its
# terms: "The Peacock Service is for individuals who are 18 years of age or older and reside in the United States
# (including its territories and possessions)."
availableIn: [US, AS, GU, MP, PR, VI]
billingCurrency: { US: USD }
cancelUrl: https://www.peacocktv.com/help/article/cancellation
sources:
  { pricing: https://www.peacocktv.com/help/article/how-much-does-a-peacock-subscription-cost }
# Owner (M11.2), read 2026-11-11: its help centre names NBCUniversal; Comcast's third-quarter release (on its investor
# site, cmcsa.com) names Peacock among its brands and its listing. Comcast plans to spin off NBCUniversal and Sky as an
# independent company ("the proposed NBCUniversal Spin-off", the same release): re-read the owner when that completes.
# No page read names a majority holder.
owner:
