      url: https://www.nbcuniversalprivacy.com/privacy
    quotes:
      - '30 Rockefeller Plaza, New York, NY 10112, USA, NBCUniversal Legal Department Attn: Chief Privacy Officer.'
    lastVerified: 2026-11-11
  stock:
    company: Comcast Corporation
    listings:
      - { exchange: Nasdaq, symbol: CMCSA }
    page:
      name: Comcast Reports 3rd Quarter 2026 Results
      url: https://www.cmcsa.com/news-releases/news-release-details/comcast-reports-3rd-quarter-2026-results
    quotes:
      - 'Comcast Corporation (Nasdaq: CMCSA) is a global media and technology company.'
      - 'produce, distribute, and stream leading entertainment, sports, and news through brands including NBC, Telemundo, Universal, Peacock, and Sky'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11
# Ways to pay (M11.5), read 2026-11-11: its payment methods article, and Peacock gift cards (digital, for Premium and
# Premium Plus bought from Peacock). Also named, in words the catalog's checks don't read as a TV or internet bill:
# Xfinity, Spectrum, DIRECTV and Verizon ("you will be billed by Verizon directly", Using Peacock with Verizon +play).
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, discover, amex]
    url: https://www.peacocktv.com/help/article/payment-methods
    quotes:
      - 'You may pay for a Peacock subscription via credit card (Visa/MasterCard/Discover/American Express), debit card, PayPal or in-app purchase on supported devices.'
paymentMethods:
