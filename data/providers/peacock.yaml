# Terms and policies (BLUEPRINT §4.10), read 2026-11-11 through a US exit: its Terms of Service ("Updated December 3,
# 2025"), which include its Privacy Policy and make the help centre "Supplemental Terms" (1.3), and the help centre's
# billing, cancelling, refunds, downloads, household and parental-controls articles. NBCUniversal's Privacy Policy,
# its "Your Privacy Choices" page and Kid's Privacy Guide are rated once as a shared document
# (data/policies/nbcuniversal-privacy.yaml, drafted beside this file). Not read: the sign-up form (the picker answered
# "Looks like an error occurred" when a plan was chosen), the Peacock Gift Card Terms and the Peacock Membership beta's
# terms (a closed beta for some subscribers), and the terms of the partners that bill it. Its terms take a perpetual,
# irrevocable, sublicensable licence over anything you post, your name and likeness in it included (4.5.1), a topic
# streaming doesn't have, as Sportsnet+'s identical kind of clause wasn't made notable.
policies:
  shared: [nbcuniversal-privacy]
  links:
    - name: 'Terms of Service'
      url: https://www.peacocktv.com/terms
    - name: 'How do I cancel my Peacock plan?'
      url: https://www.peacocktv.com/help/article/cancellation
    - name: 'What is Peacock’s refund policy?'
      url: https://www.peacocktv.com/help/article/what-is-peacock-s-refund-policy
    - name: 'Can I still purchase the monthly Plus add-on?'
      url: https://www.peacocktv.com/help/article/plus-add-on
    - name: 'Price Increase'
      url: https://www.peacocktv.com/help/article/price-increase
    - name: 'STARZ Add-On'
      url: https://www.peacocktv.com/help/article/STARZ-Add-On
    - name: 'What is a Peacock household?'
      url: https://www.peacocktv.com/help/article/peacock-household
    - name: 'Can I download and watch Peacock content offline?'
      url: https://www.peacocktv.com/help/article/can-i-watch-peacock-content-offline
    - name: 'Does Peacock have parental controls?'
      url: https://www.peacocktv.com/help/article/does-peacock-have-parental-controls
    - name: 'Choose your plan'
      url: https://www.peacocktv.com/plans/all-monthly
  ratings:
    - topic: privacy.sign-up-data
      status: not-stated
      reason: 'Its terms say you may be asked for registration details without listing them, and its sign-up form couldn’t be reached: choosing a plan showed an error.'
      pages:
        - https://www.peacocktv.com/terms
        - https://www.peacocktv.com/plans/all-monthly
      lastVerified: 2026-11-11
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 18 to use it. Parents can set kids’ profiles with age ratings and lock profiles with a PIN, but nothing says kids’ profiles are kept from ads picked for them.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'The Peacock Service is for individuals who are 18 years of age or older and reside in the United States (including its territories and possessions).'
        - url: https://www.peacocktv.com/help/article/does-peacock-have-parental-controls
          quote: 'Yes, Peacock offers profile-based Maturity Rating settings and Profile Pin protection so parents can limit the TV shows and movies that a profile may access.'
      lastVerified: 2026-11-11
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can cancel in your account at any time and keep watching until the end of the time you paid for, but you must cancel by the day before it renews, or you pay for the next period.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'YOU MUST CANCEL YOUR SUBSCRIPTION NO LATER THAN THE DAY BEFORE YOUR NEXT RECURRING BILLING DATE IN ORDER TO AVOID BEING CHARGED FOR THE NEXT SUBSCRIPTION TERM.'
        - url: https://www.peacocktv.com/terms
          quote: 'IF YOU CANCEL, YOU WILL STILL HAVE ACCESS TO EACH SERVICE TIER THROUGH THE END OF ITS APPLICABLE SUBSCRIPTION TERM'
        - url: https://www.peacocktv.com/help/article/cancellation
          quote: 'Select Cancel All Subscriptions to cancel all subscriptions.'
      lastVerified: 2026-11-11
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back when you cancel, but you keep watching until the end of the time you paid for. It gives refunds only when it chooses to.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'NO PRORATED REFUNDS OR CREDITS WILL BE ISSUED UNLESS REQUIRED BY APPLICABLE LAW OR IN THE CASE OF AN IMMEDIATE UPGRADE.'
        - url: https://www.peacocktv.com/help/article/what-is-peacock-s-refund-policy
          quote: 'Peacock reserves the right to issue refunds at its sole discretion.'
      lastVerified: 2026-11-11
    - topic: billing.price-changes
      tier: neutral
      reason: 'It tells you about a new price before your next billing date, without saying how far ahead, and you can cancel first. Otherwise you renew at the new price.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'We will give you advance notice of any price change prior to the next billing date'
        - url: https://www.peacocktv.com/terms
          quote: 'If you do not wish to accept a price change, you may cancel your subscription in accordance with the instructions below.'
        - url: https://www.peacocktv.com/help/article/price-increase
          quote: 'If you are an existing Peacock user, you will be notified of the price change via email to the address currently associated with your account.'
      lastVerified: 2026-11-11
    - topic: billing.free-trials
      tier: poor
      reason: 'Its plans have no free trial, but its STARZ add-on has a 7-day one, which needs a plan you already pay for and turns into a paid add-on unless you remove it. It may not warn you first.'
      sources:
        - url: https://www.peacocktv.com/help/article/STARZ-Add-On
          quote: 'If you are billed directly by Peacock, you can get a 7-day Free Trial of STARZ if you have an active base plan that includes Peacock Select, Premium, or Premium Plus.'
        - url: https://www.peacocktv.com/help/article/STARZ-Add-On
          quote: 'After your trial ends, you will automatically be charged $11.99/month unless you cancel or remove the STARZ add-on from your subscription'
        - url: https://www.peacocktv.com/terms
          quote: 'You may not receive a separate notice that your Trial Period or Promotional Period is about to end or has ended or that your paid or full price subscription to the Peacock Service has begun unless required by applicable law.'
      lastVerified: 2026-11-11
    - topic: billing.renewal-notice
      tier: neutral
      reason: 'It renews on its own. Its terms name renewal notices among the messages it sends, but don’t promise one before each renewal or say when.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'You will continue to receive administrative messages from us, such as order confirmations, subscription renewal notices or other communications regarding our relationship or transactions with you.'
      lastVerified: 2026-11-11
    - topic: billing.fees
      tier: poor
      reason: 'It charges the price plus “applicable taxes and fees”, without saying what the fees are, and won’t tell you when they change.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'AT THE THEN-CURRENT SUBSCRIPTION FEE (PLUS APPLICABLE TAXES AND FEES)'
        - url: https://www.peacocktv.com/terms
          quote: 'we will not be able to notify you of any changes in applicable taxes or fees'
      lastVerified: 2026-11-11
    - topic: billing.plan-changes
      tier: good
      reason: 'Moving up a plan starts at once, with the unused days of your old plan refunded. Changes can wait for the end of your billing period, and moving down refunds nothing.'
      sources:
        - url: https://www.peacocktv.com/help/article/plus-add-on
          quote: 'If applicable, a refund will be issued to your original payment method on file for any unused days in your current Premium plan.'
        - url: https://www.peacocktv.com/help/article/price-increase
          quote: 'Depending on your current plan, the change may not take effect until the end of your current billing cycle.'
        - url: https://www.peacocktv.com/help/article/cancellation
          quote: 'No refunds or credits will be issued, unless required by law for any prior payments made when you cancel (or downgrade) a Peacock Premium or Peacock Premium Plus plan.'
      lastVerified: 2026-11-11
    - topic: legal.disputes
      tier: good
      reason: 'Disputes go to a court, never to a private referee (an arbitrator), but only to the courts of New York County.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'will be resolved in federal or state (including small claims) court, and neither party will be required to arbitrate any claims against the other.'
        - url: https://www.peacocktv.com/terms
          quote: 'will be brought exclusively in the federal or state (including small claims) courts located in New York County, New York'
      lastVerified: 2026-11-11
    - topic: legal.terms-changes
      tier: neutral
      reason: 'A change to its terms starts 30 days after it tells you or just posts it on its website. Using Peacock after that means you accept it.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'such changes will be effective (i) for existing users, thirty (30) days following either notification to you or our posting of the changes on Peacock’s website'
        - url: https://www.peacocktv.com/terms
          quote: 'Your continued access or use of the Peacock Service after we post changes to these Terms of Service will be deemed acceptance of these Terms of Service as modified.'
      lastVerified: 2026-11-11
    - topic: legal.account-closure
      tier: neutral
      reason: 'It can cut you off without warning if it believes you broke its terms or the law, with no money back. After giving you a refund, it may also end your account.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'You agree that we may, in our sole discretion and without notice or liability to you, restrict, suspend, or terminate your access to the Peacock Service and to any Content if we believe you are using or have used the Peacock Service in violation of these Terms of Service or applicable law.'
        - url: https://www.peacocktv.com/terms
          quote: 'IF WE ISSUE A REFUND, CREDIT, OR DISCOUNT, WE ARE UNDER NO OBLIGATION TO ISSUE THE SAME OR SIMILAR REFUND IN THE FUTURE AND WE MAY TERMINATE YOUR ACCOUNT, MEMBERSHIP, OR ACCESS TO THE SUBSCRIPTION.'
      lastVerified: 2026-11-11
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change, pause or end any part of Peacock at any time, without notice, and says it owes you nothing when it does.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'We may change, suspend, or discontinue the Peacock Service, in whole or in part, at any time for any reason without notice or liability to you.'
        - url: https://www.peacocktv.com/terms
          quote: 'we reserve the right to change the terms of your subscription to any Service Tier, including the price, from time to time.'
      lastVerified: 2026-11-11
    - topic: legal.inactivity
      tier: poor
      reason: 'It may close an account you haven’t used for a long time, giving more than a year only as an example, and doesn’t say it will warn you.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'We also reserve the right, but are not required, to terminate any Peacock account that remains inactive for an extended period of time (for example, for more than one year).'
      lastVerified: 2026-11-11
    - topic: service.account-sharing
      tier: poor
      reason: 'Only people in your home can use your account. It watches how the account is used, and can limit or end it if it decides you shared it outside your home.'
      sources:
        - url: https://www.peacocktv.com/terms
          quote: 'Unless otherwise permitted by your Service Tier, you may not share your subscription outside of your household.'
        - url: https://www.peacocktv.com/terms
          quote: 'If we determine, in our sole discretion, that you have violated these Terms of Service, we may limit, suspend or terminate access to the Peacock Service'
        - url: https://www.peacocktv.com/help/article/peacock-household
          quote: 'A household is the collection of devices associated with your primary personal residence based on where you most regularly watch Peacock.'
      lastVerified: 2026-11-11
    - topic: service.device-limits
      tier: neutral
      reason: 'Premium Plus can keep 25 downloads at a time across all devices. A download you start watching disappears after 48 hours, and an unwatched one after 30 days.'
      sources:
        - url: https://www.peacocktv.com/help/article/can-i-watch-peacock-content-offline
          quote: 'Peacock Premium Plus accounts can have a total of 25 pieces of content downloaded across all devices at any one time.'
        - url: https://www.peacocktv.com/help/article/can-i-watch-peacock-content-offline
          quote: 'Downloaded content that you have started watching will automatically be removed after 48 hours.'
        - url: https://www.peacocktv.com/help/article/can-i-watch-peacock-content-offline
          quote: 'If content is not watched, it will automatically be removed from your downloads after 30 days or whenever the content leaves the platform (whichever is sooner).'
      lastVerified: 2026-11-11
