# Terms and policies, read 2026-11-04 (M11.15) from Canada: the Prime Video Terms of Use (one document for every
# country, with Germany's price clause and video-only subscriptions' refunds), amazon.ca's and amazon.com's Amazon
# Prime Terms and Conditions of Use (the US's as US ratings), Amazon Canada's help on ending Prime, Prime Video's usage
# rules and profiles articles, Amazon's articles on Kids profiles and Prime Video Ultra (amazon.com's: amazon.ca and
# primevideo.com have no Kids profiles article), Amazon's guide to Prime Video, and Amazon's Privacy Notice, rated once
# as a shared document (data/policies/amazon-privacy.yaml). Other countries' Prime terms aren't read. Its help on
# switching plans is about moving Prime to another country, so plan changes stay unrated.
policies:
  shared: [amazon-privacy]
  links:
    - name: 'Prime Video terms of use'
      url: https://www.primevideo.com/help?nodeId=202095490
    - name: 'Amazon Prime terms (Canada)'
      url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
    - name: 'Amazon Prime terms (US)'
      url: https://www.amazon.com/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
    - name: 'Conditions of use (Canada)'
      url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
    - name: 'Conditions of use (US)'
      url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
    - name: 'End your Prime membership'
      url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GTJQ7QZY7QL2HK4Y
    - name: 'Usage rules'
      url: https://www.primevideo.com/help?nodeId=202095500
    - name: 'Profiles'
      url: https://www.primevideo.com/help?nodeId=GD8VJD2EDJ2GSNEC
    - name: 'Kids profiles'
      url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GTYL2UYVAAPUD6WE
    - name: 'Prime Video Ultra'
      url: https://www.amazon.com/gp/help/customer/display.html?nodeId=TY4VVa4DCmK331KhLS
    - name: 'Everything you need to know about Prime Video'
      url: https://www.aboutamazon.com/news/entertainment/what-you-need-to-know-about-prime-video
  ratings:
    - topic: privacy.children
      tier: neutral
      reason: 'Under-18s may use it only with a parent or guardian, and Kids profiles have parental controls, but they can show promotional breaks, and it doesn’t say whether ads to children are targeted.'
      sources:
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'If you are under 18 years of age, or the age of majority in your location, you may use the Service only with involvement of a parent or guardian.'
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GTYL2UYVAAPUD6WE
          quote: 'To prevent kids from switching to an adult profile and accessing inappropriate content, you can PIN-lock adult profiles.'
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GTYL2UYVAAPUD6WE
          quote: 'Some video content may contain promotional breaks.'
      lastVerified: 2026-11-04
    - topic: billing.cancellation
      tier: good
      reason: 'You can end Prime online at any time in your account settings.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GTJQ7QZY7QL2HK4Y
          quote: 'You can turn off this automatic renewal at any time.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'You may cancel your Prime membership any time by visiting Your Account and adjusting your membership settings.'
      lastVerified: 2026-11-04
    - topic: billing.refunds
      tier: neutral
      reason: 'You get a full refund within 14 days of signing up, less what you used. After that, only if you haven’t used Prime since your last payment.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'If you cancel within 14 days of signing up for or converting from a free trial to a paid membership, we will refund your full membership fee'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GTJQ7QZY7QL2HK4Y
          quote: "Paid members who don't use their benefits are eligible for a full refund of the current membership period."
      lastVerified: 2026-11-04
    - topic: billing.refunds
      regions: [US]
      tier: neutral
      reason: 'In the US you get a full refund within 3 business days of signing up, less what you used. After that, only if you haven’t used Prime since your last payment.'
      sources:
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'If you cancel within 3 business days of signing up for or converting from a free trial to a paid membership, we will refund your full membership fee'
      lastVerified: 2026-11-04
    - topic: billing.refunds
      plans: [amazon-prime-video.prime-video]
      tier: neutral
      reason: 'Prime Video alone refunds you in full within 3 business days of signing up (14 days in the UK and the EU), less what you watched. After that, only if you haven’t watched since your last payment.'
      sources:
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'If you cancel within 3 business days of signing up for, or converting from a free trial to, a paid membership (or, for customers in the UK and European Union, within 14 days of receiving confirmation of your subscription or membership service), we will refund your full membership fee'
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'If you cancel at any other time, we will refund your full membership fee only if Digital Content available as part of your video-only membership has not been accessed through your account since your latest membership charge.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      tier: poor
      reason: 'A new price starts only when you renew, but it promises notice only where the law requires it, as Quebec’s does (30 days).'
      sources:
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'may change over time and by location without notice (except as may be required by applicable law)'
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'However, any increase in subscription fee will not apply until your subscription is renewed.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'If required by applicable law (including applicable Quebec law), we will give you notice of the change in writing, at least 30 days before the effective date.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      regions: [DE]
      tier: good
      reason: 'In Germany it emails you about a new price at least 30 days ahead, with the reason, and you can reject it or cancel; if you do neither within 30 days, you’ve accepted it.'
      sources:
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'we will inform you in text form (for example by e-mail) about the change, the reason(s) for the change, and the effective date of the change within a reasonable period of at least 30 days before the change takes effect'
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'You may reject the change or cancel your subscription or membership.'
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'Your consent to the change will be deemed to have been given if you have not rejected the change within 30 days after receipt of the information.'
      lastVerified: 2026-11-04
    - topic: billing.price-changes
      regions: [US]
      tier: neutral
      reason: 'In the US it tells you about a higher fee before your membership renews, without saying how far ahead, and you can cancel before the renewal.'
      sources:
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'IF THE MEMBERSHIP FEE INCREASES, WE WILL NOTIFY YOU IN ADVANCE OF THE RENEWAL OF THE NEW FEE. YOU MAY CANCEL AT ANY TIME BEFORE THE RENEWAL TAKES EFFECT.'
      lastVerified: 2026-11-04
    - topic: billing.free-trials
      tier: poor
      reason: 'A trial needs your payment details and turns into a paid membership on its own, without a reminder unless the law requires one.'
      sources:
        - url: https://www.aboutamazon.com/news/entertainment/what-you-need-to-know-about-prime-video
          quote: 'Enter payment information'
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'If you purchase a subscription or start a free trial for a subscription, your subscription will automatically continue, and you authorize us (without further notice, unless required by applicable law) to collect the then-applicable periodic subscription fee'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GTJQ7QZY7QL2HK4Y
          quote: 'At the end of the free trial period, you will automatically upgrade to a paid membership.'
      lastVerified: 2026-11-04
    - topic: billing.renewal-notice
      tier: poor
      reason: 'It renews your membership without telling you first, unless the law requires it.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'YOU AUTHORIZE US (WITHOUT NOTICE TO YOU, UNLESS REQUIRED BY APPLICABLE LAW) TO COLLECT THE THEN-APPLICABLE MEMBERSHIP FEE AND ANY TAXES'
      lastVerified: 2026-11-04
    - topic: billing.fees
      tier: great
      reason: 'It names no fees beyond the price, only taxes.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'Taxes may apply on either or both of the membership fee and the reduced shipping charges for Prime.'
      lastVerified: 2026-11-04
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Its terms and help don’t say what happens to what you’ve paid when you switch between monthly and yearly.'
      pages:
        - https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
        - https://www.amazon.ca/gp/help/customer/display.html?nodeId=GTJQ7QZY7QL2HK4Y
      lastVerified: 2026-11-04
    - topic: legal.disputes
      tier: bad
      reason: 'Disputes go to private arbitration, one person at a time, with no class actions and no way to opt out, unless your province’s law lets you go to court.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
          quote: 'Any dispute or claim relating in any way to your use of any Amazon Service, or to any products or services sold or distributed by Amazon or through Amazon Services will be resolved by binding arbitration, rather than in court'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
          quote: 'We each agree that any dispute resolution proceedings will be conducted only on an individual basis and not in a class, consolidated or representative action.'
      lastVerified: 2026-11-04
    - topic: legal.disputes
      regions: [US]
      tier: bad
      reason: 'In the US too, disputes go to private arbitration, one person at a time, with no class actions and no way to opt out.'
      sources:
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
          quote: 'YOU AND WE AGREE THAT ANY DISPUTE OR CLAIM RELATING IN ANY WAY TO YOUR USE OF ANY AMAZON SERVICE, OR TO ANY PRODUCTS OR SERVICES SOLD OR DISTRIBUTED BY AMAZON OR THROUGH AMAZON.COM, WILL BE RESOLVED BY BINDING ARBITRATION RATHER THAN IN COURT.'
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
          quote: 'YOU AND WE AGREE THAT ANY ARBITRATION PROCEEDING WILL BE CONDUCTED ONLY ON AN INDIVIDUAL BASIS AND NOT IN A CLASS OR REPRESENTATIVE ACTION.'
      lastVerified: 2026-11-04
    - topic: legal.terms-changes
      tier: poor
      reason: 'It can change its terms at any time by posting them, with written notice 30 days ahead only where the law requires it. Staying a member means you accept them.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: "We may in our discretion change these Terms, Amazon.ca's Conditions of Use and Privacy Notice, or any aspect of Prime membership, at any time by posting the revised terms on the Amazon.ca website."
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'YOUR CONTINUED MEMBERSHIP AFTER WE CHANGE THESE TERMS CONSTITUTES YOUR ACCEPTANCE OF THE CHANGES.'
      lastVerified: 2026-11-04
    - topic: legal.terms-changes
      regions: [US]
      tier: bad
      reason: 'In the US it can change its terms, or anything about Prime, without telling you. Staying a member means you accept them.'
      sources:
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'We may in our discretion change these Terms or any aspect of Prime membership, without notice to you.'
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'YOUR CONTINUED MEMBERSHIP AFTER WE CHANGE THESE TERMS CONSTITUTES YOUR ACCEPTANCE OF THE CHANGES.'
      lastVerified: 2026-11-04
    - topic: legal.account-closure
      tier: neutral
      reason: 'It can end your membership at its discretion without notice, refunding the full months left (none on a monthly plan), and nothing if it decides your conduct broke its terms or harmed its interests.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'We may terminate your Prime membership at our discretion without notice. If we do so, we will give you a prorated refund based on the number of full months remaining in your membership.'
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'However, we will not give any refund for termination related to conduct that we determine, in our discretion, violates these Terms or any applicable law, involves fraud or misuse of the Prime membership, or is harmful to our interests or another user.'
      lastVerified: 2026-11-04
    - topic: legal.service-changes
      tier: poor
      reason: 'It can remove Prime benefits or stop any part of Prime Video without notice and owes you nothing, and videos you bought can become unavailable.'
      sources:
        - url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
          quote: 'From time to time, Amazon may choose in its sole discretion to add or remove Prime membership benefits.'
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'Amazon reserves the right to suspend, or discontinue the Service, or any part of the Service, at any time and without notice (except as required by applicable law or set out above), and Amazon will not be liable to you should it exercise such rights, even if your ability to use Digital Content is impacted by the change.'
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'may become unavailable due to potential content provider licensing restrictions or for other reasons, and Amazon will not be liable to you if Purchased Digital Content becomes unavailable for further download or streaming'
      lastVerified: 2026-11-04
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages:
        - https://www.amazon.ca/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
        - https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP
      lastVerified: 2026-11-04
    - topic: service.account-sharing
      tier: good
      reason: 'Its terms expect your household to watch under your account, on up to six profiles, and name no checks on who does.'
      sources:
        - url: https://www.primevideo.com/help?nodeId=202095490
          quote: 'you accept this Agreement on behalf of yourself and all members of your household and others who use the Service under your account'
        - url: https://www.primevideo.com/help?nodeId=GD8VJD2EDJ2GSNEC
          quote: 'You can have up to six user profiles'
      lastVerified: 2026-11-04
    - topic: service.device-limits
      tier: neutral
      reason: 'Downloads last 30 days, and 48 hours once you start watching. It caps how many titles you can download at a time, 50 in the US, a number that varies by country.'
      sources:
        - url: https://www.primevideo.com/help?nodeId=202095500
          quote: "you'll typically have 30 days to begin watching the video after you download it and once you start watching it, you'll typically have 48 hours to finish watching it"
        - url: https://www.primevideo.com/help?nodeId=202095500
          quote: 'We set a maximum number of titles that can be downloaded at a time across Prime or Prime Video and third-party add-on subscriptions titles across all devices associated with your Amazon account which may vary based on your location and other factors.'
        - url: https://www.amazon.com/gp/help/customer/display.html?nodeId=TY4VVa4DCmK331KhLS
          quote: 'download up to 50 titles on the Prime Video app for offline viewing'
      lastVerified: 2026-11-04
