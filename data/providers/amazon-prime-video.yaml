# Researched by hand on 2026-11-04 (M11.15, the streaming category), read with Edge from Canada and through each
# country's exit (the owner's choice of 2026-11-04), as two plans under Prime Video (the owner's choice of 2026-11-04):
# Amazon Prime, a suite of Prime Video and Amazon's other benefits, and Prime Video sold alone. Pages, each quoted
# where it's used:
# Pricing: each country's Amazon Prime page (amazon.ca/amazonprime from Canada; amazon.com/amazonprime,
# amazon.co.uk/amazonprime, amazon.com.au/prime, amazon.de/amazonprime, amazon.fr/amazonprime, amazon.it/amazonprime,
# amazon.es/amazonprime and amazon.nl/prime through each country's exit): "Prime Monthly" "per month after trial" and
# "Prime Annual" "per year after trial" (Canada's $9.99 and $99, the US's $14.99 and $139, the UK's £8.99 and £95,
# Australia's $12.99 and $99, Germany's €8.99 and €89.90, France's €6.99 and €69.90, and Italy's, Spain's and the
# Netherlands' €4.99 and €49.90). Ireland's is primevideo.com/offers through an Irish exit, "Join Amazon Prime for €6.99
# per month", with no yearly price. New Zealand's (primevideo.com/offers through its exit) sells Prime Video alone:
# "Prime Video is just NZ$10.99/month". Ad free, an add-on: "Watch ad free for an extra A$2.99/month" (Australia's
# offers page), "€2,99/ month" (the Netherlands') and "NZ$2.99/month" (New Zealand's); in the US it's Prime Video
# Ultra, "priced at $4.99 a month" (Amazon's "Everything you need to know about Prime Video", updated April 10, 2026:
# its Ultra help articles name no price).
# Not listed: Prime for students and young adults and Prime Access, which need proof of eligibility, and Prime Video
# Channels and the other add-on subscriptions, which are other companies' services.
# Region checklist, 2026-11-04: 1. each country's Amazon store and primevideo.com/offers; 4. the plan cards, never past
# them; 6. Edge, from Canada and through each country's exit. The US offers page for Prime Video alone showed Amazon's
# "continue shopping" check, which counts as a bot check, so the reader stopped there; Canada's, the UK's, Germany's,
# France's, Italy's and Spain's offers pages hand off to the Amazon store without Ad free's price.

# Coverage: amazon-prime-video.amazon-prime in NZ: New Zealand's offers page sells Prime Video alone, not Amazon Prime
# (2026-11-04).

# Coverage: amazon-prime-video.prime-video in US: sold alone there, but its offers page showed Amazon's "continue
# shopping" check, a bot check, so its price is unread (2026-11-04).

# Coverage: amazon-prime-video.prime-video in CA, GB, AU, IE, DE, FR, NL, ES and IT: their pages sell Amazon Prime,
# not Prime Video alone (2026-11-04).

id: amazon-prime-video
name: Prime Video
aliases: [amazon prime video, amazon prime]
website: https://www.primevideo.com
# Amazon Canada's store and help centre.
domains: [amazon.ca]
category: streaming
spendCategory: streaming
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    AU: AUD,
    NZ: NZD,
    IE: EUR,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
  }
cancelUrl: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GTJQ7QZY7QL2HK4Y
sources: { pricing: https://www.amazon.ca/amazonprime }
# Accepted cards and ways to pay, read 2026-11-04 from Canada: Amazon.ca's "Accepted Payment Methods" (Visa,
# Mastercard, American Express and their prepaid cards, and Amazon.ca Gift Cards) and "End your Amazon Prime
# Membership" (memberships bought in its Android apps are managed "through Google Subscription services"). Other
# countries' lists aren't read yet.
acceptedNetworks:
  CA:
    networks: [visa, mastercard, amex]
    url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GFBWMNXEPYVJAY9A
    quotes: ['Visa', 'Mastercard', 'American Express']
paymentMethods:
  - methods: [card, gift-card]
    regions: [CA]
    page: 'Accepted Payment Methods'
    url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GFBWMNXEPYVJAY9A
    quotes:
      - 'Visa, Mastercard or American Express prepaid credit or gift cards'
      - 'You can also use Amazon.ca Gift Cards to pay for your order.'
  - methods: [app-store]
    regions: [CA]
    page: 'End your Amazon Prime Membership'
    url: https://www.amazon.ca/gp/help/customer/display.html?nodeId=GTJQ7QZY7QL2HK4Y
    quotes:
      - 'Customers who sign up for Amazon Prime using the Android mobile shopping app or Prime Video Android app must manage their subscription through Google Subscription services.'

# Owner: Amazon.com, Inc., whose own site lists Prime Video among its entertainment businesses. Amazon.com's Conditions
# of Use give its address, "Amazon.com, Inc. P.O. Box 81226 Seattle, WA", under Washington State's laws.
owner:
  name: 'Amazon.com, Inc.'
  website: https://www.aboutamazon.com
  page:
    name: 'Amazon entertainment'
    url: https://www.aboutamazon.com/what-we-do/entertainment
  quotes:
    - 'Amazon produces and delivers to customers world-class entertainment via Prime Video'
  country:
    code: US
    page:
      name: Amazon.com Conditions of Use
      url: https://www.amazon.com/gp/help/customer/display.html?nodeId=GLSBYFE9MGKKQXXM
    quotes:
      - 'Seattle, WA 98108-1226'
      - 'the laws of the state of Washington'
    lastVerified: 2026-11-04
  # Its shares (M11.18), read 2026-11-10 on Amazon's investor relations page.
  stock:
    listings:
      - { exchange: NASDAQ, symbol: AMZN }
    page:
      name: Investor relations
      url: https://ir.aboutamazon.com/overview/default.aspx
    quotes:
      - 'NASDAQ: AMZN'
    lastVerified: 2026-11-10
  lastVerified: 2026-11-04

# Renewal day (M11.5), read 2026-11-04: its Prime terms renew the membership automatically, and a payment made late
# keeps "the original renewal date", without saying which day of the month that is.
renewalAnchor:
  kind: not-stated
  pages: [https://www.amazon.ca/gp/help/customer/display.html?nodeId=G2B9L3YR7LR8J4XP]
  lastVerified: 2026-11-04

# Perks (M11.6): Amazon Prime's other benefits, in Canada's Prime page's words ("Same-Day, One-Day, and Two-Day
# Delivery on millions of items", "Amazon Music Prime", "unlimited, full-resolution photo storage" in Amazon Photos,
# "Prime Reading", "a curated selection of games on Amazon Luna" and "free DashPass"). They vary by country.
perks:
  - id: fast-delivery
    name: Same-Day, One-Day and Two-Day Delivery
  - id: music-prime
    name: Amazon Music Prime
  - id: photos
    name: Unlimited photo storage in Amazon Photos
  - id: prime-reading
    name: Prime Reading
  - id: luna
    name: Games on Amazon Luna
  - id: dashpass
    name: DoorDash's DashPass

# General features, read 2026-11-11: app languages from primevideo.com's language versions (/-/fr_FR/ "Prime Video :
# regardez des films", es_ES, de_DE, it_IT, pt_BR, ja_JP, ko_KR, zh_TW, hi_IN, ar_AE). Pause: "You can pause your
# billing and services for eligible Prime memberships" (Pause Your Amazon Prime Membership), its add-ons ending while
# it's paused; Amazon Music's monthly plans pause too, as amazon-music's. Parental controls: "Prime Video parental
# controls allow you to set restrictions for video content", with an Account PIN (Parental Controls on Prime Video).
# Apps (the cross-category features), read 2026-11-04 in Prime Video's help: apps "for mobile devices running
# Android, iOS, and Windows", for Fire TV, smart TVs, set-top boxes and game consoles, and the web ("through your web
# browser", its usage rules). Sign-in, read 2026-11-10: the Amazon account's help articles, as for Amazon Music ("a
# password", "a one-time security code sent to your mobile number or email", "a passkey", "a trusted device", and
# "text message or authenticator app" for Two-Step Verification).
features:
  platforms: [windows, android, ios, web, tv, console]
  account.sign-in: [password, passkey, totp, sms, email-code, trusted-device]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, hi, ar]

# Features, read 2026-11-04 from Canada in Prime Video's help: its usage rules ("You can stream up to three titles at
# the same time using the same Amazon account"; downloads: "You can download available titles to only two devices at
# one time", a limit for each title, "If you have already downloaded a title to two devices"); "up to six user
# profiles ... which can be either adult or Kids profiles" (its profiles article); "up to Ultra HD" and "Dolby Atmos"
# on Fire TV, smart TVs and Android (its device articles); HDR only on Amazon's US help on Prime Video Ultra ("Dolby
# Vision" for customers without it), so inferred elsewhere; live sports ("Stream Prime Originals, live sports",
# Canada's offers page); French: "French-language Prime Originals" in Canada (Amazon Canada's news on its 2026 slate).
# Its free ad-supported channels are open to "All customers, regardless of whether they have a Prime membership"
# (Amazon's "Everything you need to know about Prime Video"), so they aren't counted as either plan's live TV. Ads on
# most titles ("Watch ad free for an extra NZ$2.99/month"), which Ad free removes except on "live TV, and sports
# events" (its Ad Free article): an add-on can't add to a plan's features here. The US differs: "up to four different
# titles" at once, and 4K and Dolby Atmos only with Prime Video Ultra, which streams "up to five" (Amazon's US help),
# as the notes say. Amazon Prime includes Prime Video sold alone.
# Free (2026-11-09, the owner's item: services used free, with ads or limits): those channels and more, with no
# membership. Amazon's "What you need to know about Prime Video", read 2026-11-09: "All customers, regardless of whether
# they have a Prime membership, can access programming via Prime Video subscriptions ... as well as more than 1,000 free
# ad-supported (FAST) Channels in the U.S., UK, Germany, Austria, France, Italy, and Spain. They can also rent or buy
# titles, and enjoy even more content for free with ads." So it's priced in those of the catalog's countries. No page
