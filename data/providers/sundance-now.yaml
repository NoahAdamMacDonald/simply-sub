# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 in Edge from Canada. Its footer's and sign-up form's Terms,
# Privacy and Cookies (sundancenow.com/terms, /privacy and /cookies, and amcnetworks.com's links, which lead to
# amcglobalmedia.com) are AMC Global Media's AMC Streaming Services Terms of Use, Privacy Policy and Cookies Policy (all
# "June 27, 2025"), which name Sundance Now and are rated once as shared documents (data/policies/amc-global-media-terms.yaml
# and amc-global-media-privacy.yaml, drafted in .pipeline/amc-plus). Rated here from Sundance Now's own pages: its
# sign-up page's first step, typing nothing. Its help centre says nothing more on the other topics (it has no downloads
# or profiles articles). Not read: the sign-up steps after the account form (the plan and checkout), the "Additional
# Terms" of its promotions, and the terms of the partners that bill it.
policies:
