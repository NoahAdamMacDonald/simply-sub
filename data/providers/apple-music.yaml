# Terms and policies, read 2026-11-09 (M11.15): Apple's Media Services Terms and Conditions and its Privacy Policy, rated
# once as shared documents (data/policies/apple-media-services.yaml, apple-privacy.yaml), and "Apple Music & Privacy",
# the app's own notice, for how long it keeps your library and what you play.
policies:
  shared: [apple-media-services, apple-privacy]
  links:
    - name: Apple Music & Privacy
      url: https://www.apple.com/legal/privacy/data/en/apple-music/
    - name: Switch to a different subscription plan
      url: https://support.apple.com/en-ca/118448
    - name: Get an Apple Music family subscription
      url: https://support.apple.com/en-ca/109339
  ratings:
    - topic: billing.plan-changes
      status: not-stated
      reason: 'Apple Support says how to switch between Individual and Family, but not what happens to the time you’ve already paid for.'
      pages:
        - https://support.apple.com/en-ca/118448
        - https://support.apple.com/en-ca/109339
      lastVerified: 2026-11-09
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your music library while you subscribe and for a short time after, and records of what you play for as long as financial reporting laws say.'
      sources:
        - url: https://www.apple.com/legal/privacy/data/en/apple-music/
          quote: 'We associate your cloud library information with you for as long as you remain subscribed and for a short time after.'
        - url: https://www.apple.com/legal/privacy/data/en/apple-music/
          quote: 'We retain records of the songs you play for the periods specified by applicable laws relating to financial reporting.'
      lastVerified: 2026-11-09
