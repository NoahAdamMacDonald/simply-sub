# Terms and policies (BLUEPRINT §4.10), read 2026-11-11 (M11.15): its Canadian Terms of Use (legal.paramount.com,
# "Last Modified : August 1st, 2024", Pluto Inc.'s), which its help centre links as "Terms of Use (CANADA)"; its US
# Terms of Use ("Effective Date : November 7th, 2024", for a US rating where they differ) and its UK terms ("Last
# Modified : 14th November 2022", the same); its help centre's articles on signing up, deleting an account, its features
# and VPNs; and its sign-up page (pluto.tv/ca/account/check-email/), which asks only for an email before the rest of
# the form, so the help centre's list of fields is quoted. Its privacy policy is Paramount Skydance's (privacy.paramount.com,
# "Last Modified: May 12, 2026", the same text as viacomcbsprivacy.com/en/policy), rated once as a shared document
# (data/policies/paramount-privacy.yaml), with its Minors' Privacy Policy; its Children's Privacy Policy
# (privacy.paramount.com/en/childrens-short, for kids) shows children ads "on our services that have ads" and doesn't sell
# a child's information: no grade below the shared one. Its own help lets you delete your account in its apps, better
# than the shared deletion grade, which stands. Its German, French, Italian, Spanish, Danish, Swedish and Brazilian terms
# weren't rated (each its own language's). Calibrated against Paramount+ and CBC Gem. Not read: its terms' "Additional
# Terms" for contests and its Shop, which it doesn't run on the pages read.
policies:
  shared: [paramount-privacy]
  links:
    - name: 'Terms of use (Canada)'
      url: https://legal.paramount.com/ca/en/plutotv/terms-of-use
    - name: 'Terms of use (US)'
      url: https://legal.paramount.com/us/en/plutotv/terms-of-use
    - name: 'Terms of use (UK)'
      url: https://legal.paramount.com/uk/en/plutotv/terms-of-use
    - name: 'How do I sign up for a Pluto TV account?'
      url: https://support.pluto.tv/s/article/PTV-How-do-I-sign-up-for-a-Pluto-TV-account
    - name: 'What streaming features are available on Pluto TV?'
      url: https://support.pluto.tv/s/article/PTV-What-streaming-features-are-available-on-Pluto-TV
    - name: 'Why am I asked to disable my VPN or proxy?'
      url: https://support.pluto.tv/s/article/PTV-Why-am-I-seeing-a-message-to-disable-my-VPN-proxy-when-I-try-to-stream-a-show
    - name: 'Pluto TV (Canada)'
      url: https://pluto.tv/ca/
  ratings:
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You can watch without an account. An account asks for your email, a password, your name, birthday, gender and ZIP code.'
      sources:
        - url: https://pluto.tv/ca/
          quote: 'You can create a free Pluto TV profile to sync your Favorite Live TV Channels and Watch List, and resume where you left off on other devices.'
        - url: https://support.pluto.tv/s/article/PTV-How-do-I-sign-up-for-a-Pluto-TV-account
          quote: 'Enter your password, name, date of birth, gender, and zip code, and click Sign Up.'
      lastVerified: 2026-11-11
    - topic: legal.disputes
      tier: bad
      reason: 'Outside Quebec, a private referee (an arbitrator) settles any dispute instead of a court, one person at a time, with no class actions and no way to opt out.'
      sources:
        - url: https://legal.paramount.com/ca/en/plutotv/terms-of-use
          quote: '(Not applicable to Quebec residents or where excluded by applicable law) These Terms of Use contain an arbitration clause and a class action waiver clause.'
        - url: https://legal.paramount.com/ca/en/plutotv/terms-of-use
          quote: 'To the fullest extent permissible by law, class arbitrations and class actions are not permitted under any circumstances.'
      lastVerified: 2026-11-11
    - topic: legal.disputes
      regions: [US]
      tier: poor
      reason: 'In the US you must take any dispute to private arbitration, one person at a time, with no class actions or jury. You can opt out of arbitration only if a mass arbitration leaves your claim unresolved.'
      sources:
        - url: https://legal.paramount.com/us/en/plutotv/terms-of-use
          quote: 'Class arbitrations and class actions are not permitted, and a Claim may not be consolidated with any other person’s claim.'
        - url: https://legal.paramount.com/us/en/plutotv/terms-of-use
          quote: 'If your Claim is not resolved as part of the staged process identified above, either:'
        - url: https://legal.paramount.com/us/en/plutotv/terms-of-use
          quote: 'Option One: You and we may separately or by agreement, opt out of arbitration and elect to have your Claim heard in court consistent with these Terms.'
      action:
        name: 'Its arbitration terms (US)'
        url: https://legal.paramount.com/us/en/plutotv/terms-of-use
      lastVerified: 2026-11-11
    - topic: legal.disputes
      regions: [GB]
      tier: great
      reason: 'In the UK you can take a dispute to the courts where you live, and its terms name no arbitration or class action ban.'
      sources:
        - url: https://legal.paramount.com/uk/en/plutotv/terms-of-use
          quote: 'you may choose to bring a claim related to this Agreement in the EU or UK country in which you reside.'
      lastVerified: 2026-11-11
    - topic: legal.terms-changes
      tier: poor
      reason: 'It can change its terms by posting them, without telling you ahead, and the changes count at once; using Pluto TV afterwards means you accept them.'
      sources:
        - url: https://legal.paramount.com/ca/en/plutotv/terms-of-use
          quote: 'We reserve the right to revise the terms of this Agreement, at any time and from time to time, for any reason in our sole discretion by posting an updated Terms of Use Agreement without advance notice to you, unless required by applicable law.'
        - url: https://legal.paramount.com/ca/en/plutotv/terms-of-use
          quote: 'Once we post them on the Services, these changes become effective immediately or as otherwise indicated and, if you use the Services after they become effective, it will signify your agreement to be bound by the changes.'
      lastVerified: 2026-11-11
    - topic: legal.account-closure
      tier: bad
      reason: 'It can stop you using Pluto TV, or close your account, at any time and for any reason, without warning.'
      sources:
        - url: https://legal.paramount.com/ca/en/plutotv/terms-of-use
          quote: 'We may terminate your use of and where applicable, registration on the Services, at any time and for any reason, with or without cause, without prior notice to you and without any liability or further obligation of any kind whatsoever to you or any other party.'
      lastVerified: 2026-11-11
    - topic: legal.service-changes
      tier: neutral
      reason: 'The shows, films and channels it carries can change, as any streaming catalogue’s do.'
      sources:
        - url: https://legal.paramount.com/ca/en/plutotv/terms-of-use
          quote: 'Content Availability Subject to Change.'
      lastVerified: 2026-11-11
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms don’t say it closes accounts you haven’t used.'
      pages: [https://legal.paramount.com/ca/en/plutotv/terms-of-use]
      lastVerified: 2026-11-11
    - topic: service.account-sharing
      tier: bad
      reason: 'Anyone can watch without an account, but its terms say your sign-in is yours alone: no one else may use it.'
      sources:
        - url: https://legal.paramount.com/ca/en/plutotv/terms-of-use
          quote: 'Your user name and password are personal to you and you may not allow any others to use your user name or password under any circumstances.'
      lastVerified: 2026-11-11
    - topic: service.device-limits
      status: not-stated
      reason: 'Its terms and help centre name no limit on devices, and it has no downloads.'
      pages:
        - https://legal.paramount.com/ca/en/plutotv/terms-of-use
        - https://support.pluto.tv/s/article/PTV-What-streaming-features-are-available-on-Pluto-TV
      lastVerified: 2026-11-11
    - topic: other.notable
      title: No VPNs
      tier: poor
      reason: 'It blocks every VPN and proxy, whatever the reason you use one, so you have to turn yours off to watch.'
      sources:
        - url: https://support.pluto.tv/s/article/PTV-Why-am-I-seeing-a-message-to-disable-my-VPN-proxy-when-I-try-to-stream-a-show
          quote: "Since we can't determine the exact purpose or use for a VPN or proxy, we need to block any use of them."
        - url: https://support.pluto.tv/s/article/PTV-Why-am-I-seeing-a-message-to-disable-my-VPN-proxy-when-I-try-to-stream-a-show
          quote: 'Please disable these services on your device to stream videos.'
      lastVerified: 2026-11-11
    - topic: other.notable
      title: Newsletters when you make an account
      tier: neutral
      reason: 'Its newsletters go to everyone with an account. You can unsubscribe from any of them.'
      sources:
        - url: https://support.pluto.tv/s/article/PTV-What-streaming-features-are-available-on-Pluto-TV
          quote: 'Pluto TV viewers can receive newsletters, which are emails that go out to registered users.'
        - url: https://support.pluto.tv/s/article/PTV-What-streaming-features-are-available-on-Pluto-TV
          quote: 'There are 2 ways to unsubscribe:'
      lastVerified: 2026-11-11
