# Researched by hand on 2026-11-11 (M11.15, streaming batch 6), read with Edge from Canada, and its home page in each of
# the catalog's other countries through that country's exit. Pages, each quoted where it's used:
# Pricing: none to read: Pluto TV is free with ads wherever it runs, "All free, no payment required. Ever." (its home
# page, pluto.tv/ca/) and "Pluto TV is a completely free streaming service. ... No credit cards required. Pay never." (its
# FAQ there), so its one plan is free, priced 0 in each catalog country whose own home page said so, read today through
# that country's exit: the US's (pluto.tv/), the UK's (pluto.tv/gb_ie/, "All free, no payment required. Ever."),
# Germany's (pluto.tv/gsa/, "Alles kostenlos, niemals eine Zahlung erforderlich."), France's (pluto.tv/fr/, "Tout ça
# gratuitement, sans aucun paiement requis. Jamais."), Spain's (pluto.tv/es/, "Todo gratis, sin necesidad de pagar.
# Nunca.") and Italy's (pluto.tv/it/, "Tutto gratis, senza pagare. Mai.").
# Where it's sold: Paramount's legal centre picks Pluto TV's terms by "Region": "United States Latin America (except
# Brazil) Brazil United Kingdom Spain France Italy Denmark Sweden Norway Germany, Switzerland and Austria Canada"
# (legal.paramount.com/de/de/plutotv/terms-of-use), and Skydance's brand page says it "reaches viewers globally across
# more than 35 markets". "Latin America" names no countries, so the list isn't complete and availableIn isn't set (as
# HBO Max's). Through Australian, New Zealand, Irish and Dutch exits its site said "Pluto TV is not available in your
# location." (pluto.tv/intl/, three Irish exits), so those countries have no price; its help centre blocks VPNs and
# proxies, so an exit alone isn't an official list.
# Region checklist, 2026-11-11: 1. its country paths (/ca/, /gb_ie/, /gsa/, /fr/, /es/, /it/, /br/), which follow where
# the visitor is; 2. no country picker on pluto.tv; 3. not needed (nothing is priced); 4. no checkout; 5. its help
# centre has no prices; 6. Edge from Canada and through each country's exit; 7. no bill offered.
# Ways to pay: none: "No credit cards required. Pay never." (its FAQ), "Pluto TV is totally FREE! No payments, no
# contracts, no nothing!" (How To Delete Your Account), so no paymentMethods, which core requires of every provider
# (see the batch notes), and no renewal day.
# Bundles: none (nothing is sold). Official resellers: none. Its help centre's "What is Paramount+?" sells Paramount's
# paid service, its own provider.
# Features, read 2026-11-11: what it streams, from its FAQ ("free Live TV Channels, popular movies, and shows", "reality
# TV shows, enjoy documentaries", "live local news channels, live sports") and its guides' categories (Canada's
# "Kids" and "Kids en Français", the US's "Anime" and "En Español"). Video quality: no page states it, but its system
# requirements ask for "25 Mbps internet speed for 4K UHD and HDR", so 4K and HDR (inferred, as a speed article's "HD
# content" is). Streams at once: no page of its own says (its help centre's search finds nothing), so CableTV.com's
# review gives it (third-party): "Unlimited". No downloads, profiles, kids profiles or parental controls on any page of
# its help centre (searched for "download", "profile", "parental": none), and no pause (nothing to pause).
id: pluto-tv
name: Pluto TV
website: https://pluto.tv
# Paramount's legal and privacy sites (legal.paramount.com, privacy.paramount.com), which its footer links.
domains: [paramount.com]
category: streaming
spendCategory: streaming
# Nothing to cancel: its help centre's account deletion article.
cancelUrl: https://support.pluto.tv/s/article/PTV-How-To-Delete-Your-Account
sources: { pricing: https://pluto.tv/ca/ }
notes: Free with ads, with no paid plan.
# Owner (M11.2), read 2026-11-11: Skydance's own brand page for Pluto TV; its terms are with Pluto Inc., whose
# "Affiliates" are "VII and its parent company, Skydance Corporation" (its Canadian terms). Paramount Skydance
# Corporation renamed itself Skydance Corporation when it bought Warner Bros. Discovery ("Skydance Corporation (f/k/a
# Paramount Skydance Corporation)", 2026-10-14); paramount-plus.yaml and hbo-max.yaml still name it Paramount Skydance
# Corporation. Where it is: the postal address in Paramount Skydance's privacy policy, as Paramount+'s. No page read
# names a majority holder, so the stock has its listing only.
owner:
  name: 'Skydance Corporation (formerly Paramount Skydance Corporation)'
  website: https://www.skydance.com
  page:
    name: 'Pluto TV (Skydance brands)'
    url: https://www.skydance.com/about/brands/pluto-tv
  quotes:
    - 'As part of Paramount, Pluto TV has franchise access no other free streaming television service can match'
  country:
    code: US
    page:
      name: 'Paramount Skydance Privacy Policy'
      url: https://privacy.paramount.com/en/policy
    quotes:
      - '1515 Broadway New York NY 10036 UNITED STATES OF AMERICA'
    lastVerified: 2026-11-11
  stock:
    listings:
      - { exchange: NYSE, symbol: SKYD }
    page:
      name: 'Skydance investor relations: separate trading of SKYD Class B shares'
      url: https://ir.skydance.com/news-releases/news-release-details/skydance-provides-details-separate-trading-skyd-class-b-shares
    quotes:
      - 'Skydance Corporation (f/k/a Paramount Skydance Corporation) (NYSE: SKYD)'
    lastVerified: 2026-11-11
  lastVerified: 2026-11-11

# Sign-in (2026-11-11): an email and password ("Enter the email address and click Next. Enter your password and click
# Sign In.", How can I sign in to my Pluto TV account?), or a TV's activation code from a signed-in phone; no other
# account or two-step sign-in on any page. Platforms: "iOS, tvOS (Apple TV)", "Android Mobile, Android TV, Chromebook,
# Google TV", "Xbox One, Xbox Series S/X", "Roku", smart TVs, and "Web 2.0 (browsers ...), Desktop app w/ Web 2.0 (Windows
# 11)"; PlayStation in the US only (On which devices can I watch Pluto TV?). App languages: its countries' sites, in
# English (the US's, Canada's, the UK's), German (/gsa/), French (/fr/), Spanish (/es/), Italian (/it/) and Portuguese
# (/br/, read through a Brazilian exit); Canada's is in English only. Support: "Chat with a live agent by visiting our
