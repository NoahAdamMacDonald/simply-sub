# US plans, read 2026-11-10 through a US exit on paramountplus.com/account/signup/pickplan (Monthly and Annual tabs):
# "Paramount+ Essential $8.99/month" or "$89.99/year", "Ad supported", "Stream on 3 devices at once", "Get select
# SHOWTIME® series"; "Paramount+ Premium $13.99/month" or "$139.99/year", "Everything in Essential, plus: No ads
# except live TV", "Watch in 4K UHD, Dolby Vision or HDR10", "Download movies & shows", "Get all of SHOWTIME®". The US
# sells its own two plans (its help centre's plans article lists Canada's three for other countries only), so they're
# plans of their own. No page states Essential's video quality: it waits in core's awaitingRequiredFeatures.

# Coverage: paramount-plus.basic-ads, paramount-plus.standard and paramount-plus.premium in US: the US sells Essential
# and Premium (US) instead (its US plan picker, 2026-11-10).

# Coverage: paramount-plus.essential and paramount-plus.premium-us in CA: Canada sells Basic with ads, Standard and
# Premium instead (its plans article).

# Researched by hand on 2026-11-09 (M11.15, the streaming category, batch 4), Canada only. Its sign-up picker shows no
# plans to the reader, from here or over an ordinary connection, and its site answers other countries' exits with "406
# Not Acceptable", so Canada's prices come from the Internet Archive's copy of the picker of 2026-10-10 (its plan data:
# "Paramount+ basic monthly - Canada", planTier "ads", "$7.99/Month" and "$70.99/Year"; "NEW Paramount+ monthly -
# Canada", "standard", "$11.99/Month" and "$106.99/Year"; "Paramount+ premium monthly - Canada", "premium",
# "$15.99/Month" and "$142.99/Year"). Its home page says "Plans start from $7.99 CAD / Month + tax". The plans' titles
# end in "- Trial", but the data marks none as one ("trial":false), as its plans article gives Canada no free trial.
# Features: its help centre's plans article, read 2026-11-04 (Basic with ads, Standard and Premium, each "available in"
# Canada among others).
# Region checklist, 2026-11-09: 1. paramountplus.com/ca; 4. the sign-up picker (no plans shown; the archive's copy);
# 6. Edge from here and a browser over an ordinary connection, then the Internet Archive. Its other countries are unread
# (406 through their exits), and no page read lists every country it's sold in, so availableIn is left out.
# Bundles: none read. Resellers: none.

id: paramount-plus
name: Paramount+
website: https://www.paramountplus.com
domains: [paramount.com, pplus.legal, viacomcbsprivacy.com, skydance.com]
category: streaming
spendCategory: streaming
billingCurrency: { CA: CAD, US: USD }
cancelUrl: https://legal.paramount.com/ca/en/pplus/termsofuse
sources: { pricing: https://www.paramountplus.com/ca/account/signup/pickplan/ }
notes: Canada's prices only; its other countries' pages couldn't be read.
# Ways to pay, read 2026-11-09 in its Canadian terms (cards, and app stores and partners that bill for it).
paymentMethods:
  - methods: [card, app-store]
    page: 'Terms of use'
    url: https://legal.paramount.com/ca/en/pplus/termsofuse
    quotes:
      - 'If we receive updated payment details or debit/credit card information'
      - 'If you signed up for a Subscription that is set to auto-renew through a third party (for example, via an app store or one of our third party partners)'

# Owner (M11.2), read 2026-11-09 on Paramount Skydance's brands page for Paramount+; where it is, from the postal
# address in its privacy policy. Canada's service is "Paramount Streaming Canada, a division of Paramount Entertainment
# Canada ULC" (its terms).
owner:
  name: 'Paramount Skydance Corporation'
  website: https://www.skydance.com
  page:
    name: 'Paramount+ (Paramount Skydance brands)'
    url: https://www.skydance.com/about/brands/paramount-plus
  quotes:
    - "The flagship streaming home of Paramount's premium original series and global brands"
  country:
    code: US
    page:
      name: 'Paramount Skydance Privacy Policy'
      url: https://www.viacomcbsprivacy.com/en/policy
    quotes:
      - '1515 Broadway New York NY 10036 UNITED STATES OF AMERICA'
    lastVerified: 2026-11-09
  lastVerified: 2026-11-09

# Renewal day (M11.5), read 2026-11-09: its terms take payment "at the start of each billing period", and changing your
# payment method "may adjust the day", without naming it.
renewalAnchor:
  kind: not-stated
  pages: [https://legal.paramount.com/ca/en/pplus/termsofuse]
  lastVerified: 2026-11-09

# Free use (2026-11-09, the owner's item: services used free, with ads or limits): none: its plan picker (the archive's
# copy) sells paid plans only.
freeUse:
  kind: none
  pages: [https://www.paramountplus.com/ca/account/signup/pickplan/]
  lastVerified: 2026-11-09

# General features, read 2026-11-11: app languages from its country versions (France's, Germany's, Italy's, Spain's
# and Brazil's, read from the Internet Archive's copies since Canada is redirected to /ca/); Canada's site is English
# only. No pause (How can I cancel my Paramount+ subscription?). Parental controls: "Kids Mode (also known as parental
# controls) allows parents to limit what their children watch", with "A 4-digit PIN" (What are profiles and how do
# they work on Paramount+?).
features:
  languages.interface: [en, fr, es, de, it, pt]

# Features, read 2026-11-04 in its help centre's plans article: Basic (with ads) "Experience in full HD", "Stream on 1
# device at a time", "Stream with ads"; Standard full HD, "Stream on 2 devices at once", "Ad-free streaming",
# "Download and watch on the go"; Premium "Experience in 4K UHD, HDR10, Dolby Vision and Dolby Atmos", "Stream on 4
# devices at once", ad-free, downloads. Downloads on no stated number of devices, so 1, inferred. "Subscriptions
# described as ad-free will still feature advertising breaks in live Content" (its terms).
