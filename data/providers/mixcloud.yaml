# Researched by hand on 2026-11-10 (M11.15, the music category, part 4). www.mixcloud.com shows a browser a security
# check ("Performing security verification", 2026-11-09) but serves the bot's plain fetch, which names itself, so its
# pages were read that way from Canada on 2026-11-10 (the owner's choice that day: a plain fetch the site serves gets
# no check past), as was its help centre (help.mixcloud.com). The Internet Archive's newest copies (2026-09-25 to
# 2026-11-09) have the same words. Pages, each quoted where it's used:
# Pricing: mixcloud.com/premium: "Get unrestricted listening $7.99 / month + sales tax. Cancel anytime.", and
# mixcloud.com/pro: "Annual $11.25 / month Save 25% when paid annually" and "Monthly $15.00 / month", whose page data
# gives "currency:"USD"" and the yearly "$135.00". Read from Canada: Mixcloud's own Cloudflare placed this reading
# in Canada (its /cdn-cgi/trace said "loc=CA"), so Canadians pay these US dollars, as with Anghami and Tidal; the
# archive's copies, read from the US, show the same, so they're the US's too. Other countries' prices aren't read.
# Not listed: Creator
# Subscriptions, each creator's own and priced by them, Pro for students (50% off with UNiDAYS, proof of enrolment)
# and Pro Enterprise (brands and radio stations).
# Free: its help centre's "Which subscription is right for me?" ("While Mixcloud is free to use on our basic plan").
# Region checklist, 2026-11-10: 1. its Premium and Pro pages, its help centre; 4. never past the plan cards; 6. a
# plain fetch from Canada, and the archive's copies for the US.
# Bundles and resellers: none on its pages.
# Features: the Premium page's comparison ("Get unlimited replays", "Listen without ads", "Seek through shows without
# restrictions"; "Listen offline Download and listen wherever you are.") and the help centre's: free listening plays
# "each show up to 4 times within a rolling 14-day period" and fast-forwards and rewinds "up to 6 times per rolling
# 60-minute period", so any show plays on demand, with limits; Pro "does not offer the same listener-focused benefits
# as Premium" ("Why can I only replay a show four times?"). Audio quality is inferred from the Pro page's upload
# bitrates. Apps: "our iOS or Android app" (its downloads article) and the web. Sign-in: "you'll receive a six-digit
# code by email each time you sign in", or "You can still use a password to log in" (its one-time codes article,
# updated 2026-11-10, which says "Facebook login is no longer supported as an ongoing login method", so it isn't listed).

# Skips, your own music, lyrics and live radio, read 2026-11-11: Premium's "Replay, skip and rewind shows as much as
# you like" (the archive's Premium page), so Free's aren't unlimited; anyone "will be able to watch" a live stream,
# "even if they don't have a Mixcloud account" (FAQ: Mixcloud Live, from its help centre's API). Its uploads publish
# shows; no page names lyrics.
id: mixcloud
name: Mixcloud
website: https://www.mixcloud.com
# Its help centre.
domains: [help.mixcloud.com]
category: music
spendCategory: streaming
billingCurrency: { CA: USD, US: USD }
cancelUrl: https://help.mixcloud.com/hc/en-us/articles/360004030660-How-do-I-cancel-my-subscription
sources: { pricing: https://www.mixcloud.com/premium/ }
# Owner (M11.2): its terms of use name Mixcloud Limited, a company incorporated in
# England. A private company, so no shares are listed.
owner:
  name: Mixcloud Limited
  page:
    name: Terms of use
    url: https://www.mixcloud.com/terms/
  quotes:
    - 'Mixcloud Limited ("Mixcloud", " we", "our" or "us "), a company incorporated in England at Unit #2255, 275 New North Road, London N1 7AA with company registration number 6710137'
  country:
    code: GB
    page:
      name: Terms of use
      url: https://www.mixcloud.com/terms/
    quotes:
      - 'a company incorporated in England'
    lastVerified: 2026-11-10
  lastVerified: 2026-11-10
# Ways to pay (M11.5): a card, through its payment processor (its privacy policy).
# Its help centre says only "Accepted payment options may depend on your device and territory", and a subscription
# can't be started in its apps, so no app store bills it.
paymentMethods:
  - methods: [card]
    page: Privacy policy
    url: https://www.mixcloud.com/privacy/
    quotes:
      - 'your credit or debit card information and other financial data which you submit that is needed to process your payment will be collected by the payment processor with which we work.'
# Renewal day (M11.5): its paid subscriptions policy bills on the day you subscribed, or the month's last day when that month has no such day.
renewalAnchor:
  kind: same-date
  page: Paid subscriptions policy
  url: https://www.mixcloud.com/subscription-terms/
  quotes:
    - 'The Subscription Fee will be billed on the same day as the Initial Subscription Date (the "Recurring Subscription Date"), with each such period being a "Monthly Billing Cycle" or "Annual Billing Cycle".'
  lastVerified: 2026-11-10

features:
  platforms: [web, ios, android]
  account.sign-in: [email-code, password]

# Perks (M11.6): Pro's creator toolkit ("Unlock live streaming, unlimited uploads, ways to earn money and more.", its
