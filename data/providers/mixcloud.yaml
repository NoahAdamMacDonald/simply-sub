# Terms and policies (M11.15), read 2026-11-10: its terms of use, privacy policy and paid subscriptions policy, and
# its help centre's articles on cancelling, creating an account (which describes its sign-up form, drawn in a
# browser, which meets the security check), downloads and one-time codes.
# Calibrated against SoundCloud's, Spotify's, Deezer's and Tidal's grades. Not rated: rights over your content and its
# apps' licence (not topics for music).
policies:
  links:
    - name: Terms of use
      url: https://www.mixcloud.com/terms/
    - name: Privacy policy
      url: https://www.mixcloud.com/privacy/
    - name: Paid subscriptions policy
      url: https://www.mixcloud.com/subscription-terms/
    - name: Mixcloud Premium
      url: https://www.mixcloud.com/premium/
    - name: How do I cancel my subscription?
      url: https://help.mixcloud.com/hc/en-us/articles/360004030660-How-do-I-cancel-my-subscription
    - name: How do I create a Mixcloud account?
      url: https://help.mixcloud.com/hc/en-us/articles/360004053779-How-do-I-create-a-Mixcloud-account
    - name: 'FAQ: Managing downloaded content in the app'
      url: https://help.mixcloud.com/hc/en-us/articles/7170987505042-FAQ-Managing-downloaded-content-in-the-app
    - name: Logging into Mixcloud using one-time codes
      url: https://help.mixcloud.com/hc/en-us/articles/27489434859036-Logging-into-Mixcloud-using-one-time-codes
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you listen to and for how long, who you follow and what you share, and uses cookies for analytics. You can refuse cookies only in your browser.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'the audio content you listen to or upload, how long you listen to it, who you follow and who follows you, your sharing activity, including reposts, comments, direct messages and favorites.'
        - url: https://www.mixcloud.com/privacy/
          quote: 'we use Cookies to understand how the Mixcloud Platform is being accessed, used and is performing.'
        - url: https://www.mixcloud.com/privacy/
          quote: 'You may refuse to accept cookies by activating the relevant setting in your browser.'
      action:
        name: Its privacy policy (cookies)
        url: https://www.mixcloud.com/privacy/
      lastVerified: 2026-11-10
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It gives your cookies’ details to Facebook’s and Google’s ad networks, and your usage data to ad platforms. You can opt out of personal ads only through cookies.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'We will provide such third-party marketing service providers with details of your Cookies to ensure that only advertisements (both relating to Mixcloud and otherwise) that are relevant to you will be provided to you on the Mixcloud Platform.'
        - url: https://www.mixcloud.com/privacy/
          quote: 'we share certain of your Ongoing Usage Data and Profile Data with advertising platforms on an aggregated and anonymized basis'
      action:
        name: Its privacy policy (opting out)
        url: https://www.mixcloud.com/privacy/
      lastVerified: 2026-11-10
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Free listening has ads, chosen with Facebook’s and Google’s ad networks from your cookies. Opting out of personal ads works only through cookies, browser by browser.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'we use certain third-party marketing service providers, including (i) Facebook Audience Network; and (ii) Google DoubleClick for Publishers to improve your experience of online advertising.'
        - url: https://www.mixcloud.com/privacy/
          quote: 'If you would prefer not to have this level of personalization, then you can opt out here'
      action:
        name: Its privacy policy (opting out)
        url: https://www.mixcloud.com/privacy/
      lastVerified: 2026-11-10
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its terms and privacy policy don’t say whether it trains AI on what you upload or how you listen.'
      pages: [https://www.mixcloud.com/privacy/, https://www.mixcloud.com/terms/]
      lastVerified: 2026-11-10
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your data as long as it thinks necessary to keep the service going, or until you ask it not to, with no set periods.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'We store your data for as long as long as is necessary to continue providing a great continuous experience on the Mixcloud Platform or until requested otherwise by you.'
      lastVerified: 2026-11-10
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can delete your account in its settings, or ask by email, but it doesn’t say how long removing your data takes.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'You may delete your account via settings, or by emailing us at Privacy@Mixcloud.com to request deletion of your personal data.'
      action:
        name: Its privacy policy (deleting your data)
        url: https://www.mixcloud.com/privacy/
      lastVerified: 2026-11-10
    - topic: privacy.data-portability
      status: not-stated
      reason: 'Its privacy policy gives a copy of your data only as a right people in the European Union have.'
      pages: [https://www.mixcloud.com/privacy/]
      lastVerified: 2026-11-10
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It gives your data to courts, police and governments only as far as the law requires. It doesn’t say it tells you.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'we may disclose information to any courts, law enforcement bodies or governmental authorities in order to comply with our legal obligations and respond to any claims asserted against us.'
        - url: https://www.mixcloud.com/privacy/
          quote: 'We will only disclose information to the extent we are legally obligated to do so'
      lastVerified: 2026-11-10
    - topic: privacy.data-location
      tier: neutral
      reason: 'It’s run from London and may move your data to other countries, including the US, under standard contractual clauses.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'This may involve information being collected within the European Economic Area being transferred to countries outside of the European Economic Area, including the United States'
        - url: https://www.mixcloud.com/privacy/
          quote: 'We utilize appropriate safeguards, such as standard contractual clauses from the European Commission or a relevant supervisory authority'
      lastVerified: 2026-11-10
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Signing up asks for your email address, a username you choose and a password, and a paid plan needs a card.'
      sources:
        - url: https://help.mixcloud.com/hc/en-us/articles/360004053779-How-do-I-create-a-Mixcloud-account
          quote: 'Enter your email address, the username you want to use and a password.'
        - url: https://www.mixcloud.com/privacy/
          quote: 'your credit or debit card information and other financial data which you submit that is needed to process your payment will be collected by the payment processor with which we work.'
      lastVerified: 2026-11-10
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 16 or older, and it deletes data it finds it collected from anyone younger.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'Children under the age of 16 are not eligible to use the Mixcloud Platform.'
        - url: https://www.mixcloud.com/privacy/
          quote: 'we will delete this information immediately'
      lastVerified: 2026-11-10
    - topic: security.practices
      tier: poor
      reason: 'It describes its security procedures and a breach protocol in general terms, and names no audit or way to report a flaw.'
      sources:
        - url: https://www.mixcloud.com/privacy/
          quote: 'We have put in place suitable physical, electronic and managerial procedures to safeguard and secure the information we collect, including a security breach protocol.'
      lastVerified: 2026-11-10
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel on its website at any time, in a few clicks, and keep your plan until the period ends.'
      sources:
        - url: https://www.mixcloud.com/subscription-terms/
          quote: 'You may cancel your subscription at any time, for any reason. Upon cancellation of your subscription, you will continue to receive the subscription benefit until the end of the current billing cycle, and no future payments will be taken.'
        - url: https://help.mixcloud.com/hc/en-us/articles/360004030660-How-do-I-cancel-my-subscription
          quote: "Find the subscription you'd like to cancel and click the Cancel plan button."
      lastVerified: 2026-11-10
    - topic: billing.refunds
      tier: neutral
      reason: 'No money back for what you’ve paid, but you keep your plan until the period ends.'
      sources:
        - url: https://www.mixcloud.com/subscription-terms/
          quote: 'No further subscription fees will be billed and no refund will be made of any subscription fees already billed and paid.'
        - url: https://www.mixcloud.com/subscription-terms/
          quote: 'you will continue to receive the subscription benefit until the end of the current billing cycle'
      lastVerified: 2026-11-10
    - topic: billing.price-changes
      tier: poor
      reason: 'It can change its prices from time to time and only posts them on its website, with no notice promised.'
      sources:
        - url: https://www.mixcloud.com/subscription-terms/
          quote: 'The subscription rates are posted on our website and we may vary these from time to time: please see our Pricing Page for the rates in force for the current month.'
      lastVerified: 2026-11-10
    - topic: billing.free-trials
      tier: neutral
      reason: 'When it offers a free trial or a promotional price, that turns into the full price unless you cancel first, which you can do at any time. It doesn’t say it reminds you.'
      sources:
        - url: https://www.mixcloud.com/subscription-terms/
          quote: 'Once any "Promotional Period" has ended, the subscription will renew automatically and the Account Holder will subsequently be billed for the full Subscription Fee at the relevant monthly or annual frequency as described above.'
        - url: https://www.mixcloud.com/subscription-terms/
          quote: 'You may cancel your subscription at any time, for any reason.'
      lastVerified: 2026-11-10
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its subscription policy says a plan renews on its own each month or year, but not that it reminds you first.'
      pages: [https://www.mixcloud.com/subscription-terms/]
      lastVerified: 2026-11-10
    - topic: billing.fees
      tier: great
      reason: 'It names no fees beyond the price and sales tax.'
      sources:
        - url: https://www.mixcloud.com/premium/
          quote: '+ sales tax. Cancel anytime.'
      lastVerified: 2026-11-10
    - topic: billing.plan-changes
      tier: good
      reason: 'Changing plans charges the prorated difference for the rest of the period, and the new price applies from your next billing date.'
      sources:
        - url: https://www.mixcloud.com/subscription-terms/
          quote: 'If you change your subscription package in the future, the change in the subscription payment amount will take effect at the next billing cycle, and an additional payment may be charged to account for the prorated change in service.'
      lastVerified: 2026-11-10
    - topic: legal.disputes
      tier: good
      reason: 'Disputes go to the courts of London under English law, with no arbitration.'
      sources:
        - url: https://www.mixcloud.com/terms/
          quote: 'This User Agreement and the interpretation of this User Agreement shall be governed by and construed in accordance with the laws of England and in relation to any claim brought hereunder you agree to submit to the jurisdiction of the courts of London, England.'
      lastVerified: 2026-11-10
    - topic: legal.terms-changes
      tier: bad
      reason: 'It can change its terms at any time without telling you first, and using it afterwards means you accept them.'
      sources:
        - url: https://www.mixcloud.com/terms/
          quote: 'We may add, delete or amend parts of this User Agreement at our sole discretion and at any time without prior notice to you.'
        - url: https://www.mixcloud.com/terms/
          quote: 'By continuing to use the Platform you are agreeing to be bound by the then-current User Agreement as revised and posted here.'
      lastVerified: 2026-11-10
    - topic: legal.account-closure
      tier: bad
      reason: 'It can close any account for any reason, with no notice promised, and refunds nothing if it decides you broke its terms.'
      sources:
        - url: https://www.mixcloud.com/subscription-terms/
          quote: "We also reserve the right to close any account for any reason (including during any 'free trial')."
        - url: https://www.mixcloud.com/subscription-terms/
          quote: 'If we withdraw access to The Service because these Terms of Service have been breached, no refund will be payable by us.'
      lastVerified: 2026-11-10
    - topic: legal.service-changes
      tier: poor
      reason: 'It can remove any show at any time, for any reason, and says it owes you nothing for it.'
      sources:
        - url: https://www.mixcloud.com/terms/
          quote: 'to remove or withdraw any User Submission (or other user-generated content on the Platform) in whole or in part, at any time for any reason or no reason, with or without notice and with no liability of any kind.'
      lastVerified: 2026-11-10
    - topic: legal.inactivity
      tier: poor
      reason: 'It can disable an account for good after 6 months without listening, uploading or logging in, with no warning promised.'
      sources:
        - url: https://www.mixcloud.com/terms/
          quote: 'To keep your account active, be sure to log in and listen or upload a piece of audio content at least every 6 months.'
        - url: https://www.mixcloud.com/terms/
          quote: 'Accounts may be permanently disabled due to prolonged inactivity (based on a combination of listening, uploading, logging in, and the date an account was created).'
      lastVerified: 2026-11-10
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its terms tell you to keep your password private, and its help says stations and labels share accounts, but nothing says whether you may share Premium.'
      pages:
        - https://www.mixcloud.com/terms/
        - https://www.mixcloud.com/subscription-terms/
        - https://help.mixcloud.com/hc/en-us/articles/27489434859036-Logging-into-Mixcloud-using-one-time-codes
      lastVerified: 2026-11-10
    - topic: service.device-limits
      tier: neutral
      reason: 'Premium downloads shows on up to three devices at a time, which you manage in its settings, and they’re removed if you log out.'
      sources:
        - url: https://help.mixcloud.com/hc/en-us/articles/7170987505042-FAQ-Managing-downloaded-content-in-the-app
          quote: 'As a Premium or Creator subscriber, you can use the downloads feature on up to three devices at a time.'
        - url: https://help.mixcloud.com/hc/en-us/articles/7170987505042-FAQ-Managing-downloaded-content-in-the-app
          quote: "Please be aware that shows you've downloaded will be removed from your device if you log out of the account through which you initially downloaded them."
      lastVerified: 2026-11-10
