# Terms and policies, read 2026-11-09 (M11.15): the Terms and Conditions of Use (one document for every country, under
# the law of where you live), its privacy notice ("Your privacy on Deezer", updated September 2025; the page also keeps
# June 2022's), its Vulnerability Disclosure Policy, and its help centre's articles on cancelling, switching plans,
# Family, Duo and payments. Its offer terms and partner terms (on the same legal page) cover offers and partners' plans
# only. Calibrated against Spotify's and YouTube's grades. Not rated: rights over your content and its apps' licence
# (not topics for music).
policies:
  links:
    - name: Terms and Conditions of Use
      url: https://www.deezer.com/legal/cgu
    - name: Your privacy on Deezer
      url: https://www.deezer.com/legal/personal-datas
    - name: Plans
      url: https://www.deezer.com/en/offers
    - name: Vulnerability Disclosure Policy
      url: https://vdp.deezer.com/
    - name: Cancel Your Deezer Subscription
      url: https://support.deezer.com/hc/en-gb/articles/214349245-Cancel-Your-Deezer-Subscription
    - name: How to Switch Your Deezer Subscription Plan
      url: https://support.deezer.com/hc/en-gb/articles/40215679139741-How-to-Switch-Your-Deezer-Subscription-Plan-Upgrade-or-Change-Plan
    - name: Deezer Family
      url: https://support.deezer.com/hc/en-gb/articles/115002459285-Deezer-Family
    - name: Deezer Duo
      url: https://support.deezer.com/hc/en-gb/articles/16545519017885-Deezer-Duo
  ratings:
    - topic: privacy.data-collection
      tier: neutral
      reason: 'It studies how you use Deezer to improve it and build new features. You can say yes or no to that in your privacy settings.'
      sources:
        - url: https://www.deezer.com/legal/personal-datas
          quote: 'analyze how you use our service'
        - url: https://www.deezer.com/legal/personal-datas
          quote: 'You can consent or object to such use in your privacy settings.'
      action:
        name: Account settings
        url: https://www.deezer.com/account
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: neutral
      reason: 'It uses paying members’ data to find people like them for its ads, and shares data with partners such as phone companies and record labels. You can object to the ad use in your privacy settings.'
      sources:
        - url: https://www.deezer.com/legal/personal-datas
          quote: 'If you have subscribed to a paid plan, we use your data to find audiences that are similar to your profile.'
        - url: https://www.deezer.com/legal/personal-datas
          quote: 'On occasion, we may share your data - limited to what is necessary - with some of our partners, such as telecommunication operators, media companies or other retailers distributing our offers, music labels and recording companies, or audio device manufacturers.'
        - url: https://www.deezer.com/legal/personal-datas
          quote: 'You can consent or object to such use in your privacy settings'
      action:
        name: Account settings
        url: https://www.deezer.com/account
      lastVerified: 2026-11-09
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'The free plan shows ads picked from what you do. You can say no in your cookie settings, one browser or device at a time, and then get general ads instead.'
      sources:
        - url: https://www.deezer.com/legal/personal-datas
          quote: 'If you use our free service, we use your data to build your user ad profile'
        - url: https://www.deezer.com/legal/personal-datas
          quote: 'You can consent or object to such use in your cookie settings.'
        - url: https://www.deezer.com/legal/personal-datas
          quote: 'If you object, only generic and less-relevant ads will be served.'
      action:
        name: Its privacy notice
        url: https://www.deezer.com/legal/personal-datas
      lastVerified: 2026-11-09
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy notice doesn’t say whether it trains AI on your listening, photos or voice.'
