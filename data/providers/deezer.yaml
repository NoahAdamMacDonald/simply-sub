# Researched by hand on 2026-11-09 (M11.15, the music category, part 1), read with Edge from Canada and through each
# country's exit. Pages, each quoted where it's used:
# Pricing: deezer.com/en/offers, which prices by where the visitor is: read from Canada ("CAD $11.99"), and through a
# US, UK, Australian, New Zealand, Irish, German, French, Dutch, Spanish and Italian exit, each page in that country's
# currency (the US's in a bare "$", New Zealand's in "US$"). Monthly, and Annual on its toggle, except Italy's, whose
# toggle showed the same monthly prices. New Zealand sells Premium and Family only, and its page and Australia's,
# Italy's, the Netherlands' and Spain's say "Deezer Free is not available in your country".
# Region checklist, 2026-11-09: 1. no country paths (/en/ is the language); 2. no picker; 3. not looked for; 4. checkout
# not opened; 5. none; 6. Edge from Canada and through each exit; 7. no bill offered.
# Not listed: the Student plan ("Student discount"), an eligibility-only offer, as for Spotify's.
# Bundles and resellers: its partners (telecom operators, retailers and media companies, the privacy policy's
# "partners ... distributing our offers"; RTL+ in Germany and Fnac in France, help centre articles) sell it with their
# own plans: partners, not shops. Deezer gift cards are its own.
# Features, read 2026-11-09: the offers page's comparison (Free has no "Ad-free experience", "Pick and play any track",
# "Offline listening" or "High Fidelity sound"), the help centre's "Deezer HiFi supports up to 24-bit/192 kHz on
# compatible tracks, devices and app versions" (Deezer Hi-Fi Audio Quality) and "Deezer Free users can only use Basic
# (64kb/s) or Standard (128kb/s) audio quality" (Deezer Audio Quality); Duo's "2 accounts" and Family's "6 accounts",
# each with Kids profiles ("You can set up Kid profiles for children up to 12 years old", Deezer Family; "Your Duo
# subscription can include a Kids profile", Deezer Duo). No audiobooks.

# Coverage: deezer.duo in NZ: New Zealand's offers page sells Premium and Family only (through its exit, 2026-11-09).

