# Researched by hand on 2026-11-09 (M11.15, the music category, part 3). Pandora is sold in the US only, and from Canada
# its site answers "Pandora is unavailable in this country or region", so pandora.com was read through a US exit and
# its help centre from Canada. Pages, each quoted where it's used:
# Pricing: pandora.com/plans (and /upgrade, the same cards): Pandora Plus "$5.99 / month" and Pandora Premium "$11.99 /
# month", and Premium Family from its help article ("$19.99/monthly or $219.89/annually"). Plus's and Premium's
# yearly prices show only in a signed-in account's settings ("The yearly subscription plan option is only available when
# purchased directly through Pandora"), so they aren't listed. The Student and Military plans need proof of
# eligibility and aren't listed either.
# Where it's sold: "The Services are available only in the United States of America and its territories" (its terms).
# Region checklist: not needed (US only).
# Bundles and resellers: none on its pages; Apple, Google Play, Amazon Appstore, Roku and T-Mobile bill it (its cancelling
# article): ways to pay.
# Features, read 2026-11-09 on pandora.com/plans (the screenshot shows what each plan lacks): Free has "Search and play
# what you want *" and "Unlimited skips *" only after "viewing an ad", and no offline listening or playlists; Plus
# "Ad-free personalized stations", "Offline listening", and search and play only after an ad; Premium "Ad-free
# personalized music", "Search and play what you want", "Unlimited offline listening"; Premium Family "all of the
# features of Pandora Premium to up to six unique Pandora accounts" (its help article). No official page states its
# audio quality (its help names only an "Audio Quality" setting), so audio quality is a third party's: SoundGuys lists
# its three settings, the highest "High (192 kbps MP3)", so Standard for all (M11.16). No audiobooks.

# Skips, your own music, lyrics and live radio, read 2026-11-09 and 2026-11-11 with Edge: Premium and Plus have
# "Unlimited skips", Free "Unlimited skips *" with "*Unlock by viewing an ad" (2026 Pandora Subscription Rate Change),
# so not unlimited; "Free Pandora listeners and Pandora Plus subscribers can view lyrics" and "Pandora Premium
# subscribers can simply scroll down" (Lyrics). No page names uploads or live radio: its stations are made from songs.
id: pandora
name: Pandora
website: https://www.pandora.com
# Its help centre.
domains: [help.pandora.com]
category: music
spendCategory: streaming
availableIn: [US]
billingCurrency: { US: USD }
cancelUrl: https://help.pandora.com/s/article/Cancel-your-Subscription-1519949295562?language=en_US
sources: { pricing: https://www.pandora.com/plans }
# Owner (M11.2), read 2026-11-09 through a US exit: its privacy policy is Sirius XM's, which names Pandora as its
# subsidiary and gives Sirius XM's address.
owner:
  name: Sirius XM Radio LLC (SiriusXM)
  page:
    name: Privacy Policy
    url: https://www.pandora.com/privacy
  quotes:
    - 'describes the personal data collected and processed by Sirius XM Radio LLC and its subsidiaries, including Pandora Media, LLC'
  country:
    code: US
    page:
      name: Privacy Policy
      url: https://www.pandora.com/privacy
    quotes:
      - 'Sirius XM Radio LLC, 1221 Avenue of the Americas, 35th Floor, New York, NY 10104'
    lastVerified: 2026-11-09
  lastVerified: 2026-11-09
# Ways to pay (M11.5), read 2026-11-09: a card (its privacy policy's payment data), PayPal (its billing article), and
# the stores that bill it (its cancelling article, which also names T-Mobile without calling it a phone bill, so it isn't
# listed). No card networks named.
paymentMethods:
  - methods: [card]
    page: Privacy Policy
    url: https://www.pandora.com/privacy
    quotes:
      - 'This may include, credit or debit card number, expiration date, billing zip code, secure payment token associated with your payment card.'
  - methods: [paypal]
    page: Change your billing method or subscription plan
    url: https://help.pandora.com/s/article/Change-your-Payment-Information-1519949295577?language=en_US
    quotes:
      - Manage a PayPal-billed subscription
  - methods: [app-store]
    page: How to cancel your subscription
    url: https://help.pandora.com/s/article/Cancel-your-Subscription-1519949295562?language=en_US
    quotes:
      - Cancel my Apple-billed subscription or trial
      - Cancel my Google Play-billed subscription or trial
# Renewal day (M11.5): its rate-change article says a new price "applies at your next monthly billing date", and no page
# says which day that is.
renewalAnchor:
  kind: not-stated
  pages:
    - https://help.pandora.com/s/article/2026-Pandora-Subscription-Rate-Change?language=en_US
    - https://www.pandora.com/legal
  lastVerified: 2026-11-09

