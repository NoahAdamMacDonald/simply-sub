# Terms and policies, read 2026-11-09 (M11.15): its Services Terms of Use and Sirius XM's Privacy Policy (both through a
# US exit; the policy covers SiriusXM's other services too, a shared document once SiriusXM joins the catalog), and its
# help centre's articles on the 2026 rate change, cancelling, refunds, billing, deleting an account, offline mode and
# Premium Family. Its Subscription Terms and Premium Trial Terms are linked from the same legal page; their topics
# match the terms'. Calibrated against Spotify's, Deezer's and Tidal's grades. Not rated: rights over your content and
# its apps' licence (not topics for music).
policies:
  links:
    - name: Plans
      url: https://www.pandora.com/plans
    - name: Services Terms of Use
      url: https://www.pandora.com/legal
    - name: Privacy Policy (Sirius XM)
      url: https://www.pandora.com/privacy
    - name: 2026 Pandora Subscription Rate Change
      url: https://help.pandora.com/s/article/2026-Pandora-Subscription-Rate-Change?language=en_US
    - name: How to cancel your subscription
      url: https://help.pandora.com/s/article/Cancel-your-Subscription-1519949295562?language=en_US
    - name: Refunds
      url: https://help.pandora.com/s/article/Refunds-1519949304443?language=en_US
    - name: Change your billing method or subscription plan
      url: https://help.pandora.com/s/article/Change-your-Payment-Information-1519949295577?language=en_US
    - name: How to Delete Your Pandora Account
      url: https://help.pandora.com/s/article/Cancel-Deactivate-or-Delete-your-Account-1519949295569?language=en_US
    - name: Offline Mode and Downloads
      url: https://help.pandora.com/s/article/Offline-Mode-and-Downloads?language=en_US
    - name: Pandora Premium Family Plan
      url: https://help.pandora.com/s/article/000002262?language=en_US
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records how you use its site and apps, including session replays, for analytics. You can limit only the cookies, browser by browser.'
      sources:
        - url: https://www.pandora.com/privacy
          quote: 'Sirius XM may record through session replay technology details of your interactions with the Services'
        - url: https://www.pandora.com/privacy
          quote: 'To disable sharing through cookies set on our site by third parties for advertising and analytics purposes, please adjust your settings by clicking on either Cookie Settings or Manage Cookies from the footer of our webpages.'
      action:
        name: Its privacy policy (cookie settings)
        url: https://www.pandora.com/privacy
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your email and device data with other companies for their own advertising and marketing. You can limit that only through cookie settings, or a state’s opt-out where you live.'
      sources:
        - url: https://www.pandora.com/privacy
          quote: 'We may share or otherwise make available your email address, Device Data, or other personal information with unaffiliated third parties with whom we have a business relationship for ours or for their own business and advertising/marketing purposes'
      action:
        name: Its privacy policy (your choices)
        url: https://www.pandora.com/privacy
      lastVerified: 2026-11-09
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'The free plan has ads, and ad companies track you on its sites. Opting out of personal ads is partial, and you can’t opt out of all ads.'
      sources:
        - url: https://www.pandora.com/privacy
          quote: 'Sirius XM works with advertisers, advertising agencies, and providers of ad-related services for targeted advertising-related purposes.'
        - url: https://www.pandora.com/privacy
          quote: 'Please note, it is not possible to opt-out of all advertising on the Services.'
      action:
        name: Its privacy policy (your choices)
        url: https://www.pandora.com/privacy
      lastVerified: 2026-11-09
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its terms and privacy policy don’t say whether it trains AI on your listening or what you post.'
      pages: [https://www.pandora.com/legal, https://www.pandora.com/privacy]
      lastVerified: 2026-11-09
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your data as long as it thinks reasonably necessary, for its services, marketing and research, with no set periods.'
      sources:
        - url: https://www.pandora.com/privacy
          quote: 'We retain personal data for as long as reasonably necessary for the purposes set out in this Policy'
      lastVerified: 2026-11-09
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can delete your account yourself (a paid one once its plan has ended), but it doesn’t say how long removing your data takes.'
      sources:
        - url: https://help.pandora.com/s/article/Cancel-Deactivate-or-Delete-your-Account-1519949295569?language=en_US
          quote: 'If you delete your account, that decision is final.'
        - url: https://help.pandora.com/s/article/Cancel-Deactivate-or-Delete-your-Account-1519949295569?language=en_US
          quote: 'I want to permanently delete my Pandora Plus or Pandora Premium account.'
      action:
        name: How to Delete Your Pandora Account
        url: https://help.pandora.com/s/article/Cancel-Deactivate-or-Delete-your-Account-1519949295569?language=en_US
      lastVerified: 2026-11-09
    - topic: privacy.data-portability
      status: not-stated
      reason: 'Its privacy policy gives a copy of your data only as a right some states’ residents have.'
      pages: [https://www.pandora.com/privacy]
      lastVerified: 2026-11-09
    - topic: privacy.government-requests
      status: not-stated
      reason: 'Its privacy policy doesn’t say when it gives your data to the police or courts.'
      pages: [https://www.pandora.com/privacy]
      lastVerified: 2026-11-09
    - topic: privacy.data-location
      tier: good
      reason: 'The service is run from the US and only for people living there.'
      sources:
        - url: https://www.pandora.com/privacy
          quote: 'The Services are controlled and operated from the United States.'
      lastVerified: 2026-11-09
    - topic: privacy.sign-up-data
      tier: poor
      reason: 'Signing up can take your name, email, mailing address, phone number, birth year and ZIP code.'
      sources:
        - url: https://www.pandora.com/privacy
          quote: 'Registration Data - This may include your name, email address, mailing address, phone number, birth year, zip code.'
      lastVerified: 2026-11-09
    - topic: privacy.children
      tier: neutral
      reason: 'You must be 13 to sign up, and it deletes a younger child’s data it finds.'
      sources:
        - url: https://www.pandora.com/privacy
          quote: 'Pandora users must be 13 or older to sign up for the use of Pandora services.'
        - url: https://www.pandora.com/privacy
          quote: 'If we become aware that we have collected information from a child under 13 we will take steps to delete that information from our servers.'
      lastVerified: 2026-11-09
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel on its website at any time, and keep your plan until the end of the period you paid for.'
      sources:
        - url: https://help.pandora.com/s/article/Cancel-your-Subscription-1519949295562?language=en_US
          quote: 'Select Switch Plans and click Cancel Subscription in the bottom corner of the screen.'
        - url: https://help.pandora.com/s/article/2026-Pandora-Subscription-Rate-Change?language=en_US
          quote: 'You would continue to have access through the end of your current billing period.'
      lastVerified: 2026-11-09
    - topic: billing.refunds
      tier: neutral
      reason: 'A monthly plan gets no money back, but you keep it to the end of the month. A yearly plan bought on its website gets back the unused part.'
      sources:
        - url: https://help.pandora.com/s/article/Refunds-1519949304443?language=en_US
          quote: 'We offer pro-rated refunds for annual subscriptions purchased directly through the Pandora website.'
        - url: https://help.pandora.com/s/article/Refunds-1519949304443?language=en_US
          quote: 'We do not offer refunds for monthly or gift subscriptions'
      lastVerified: 2026-11-09
    - topic: billing.price-changes
      tier: great
      reason: 'It tells you about a new price by email or mail, and it starts only at your next billing date, so you can cancel first.'
      sources:
        - url: https://help.pandora.com/s/article/2026-Pandora-Subscription-Rate-Change?language=en_US
          quote: 'Monthly plans: Updated price applies at your next monthly billing date'
        - url: https://help.pandora.com/s/article/2026-Pandora-Subscription-Rate-Change?language=en_US
          quote: 'Please see your emailed or mailed notification for your specific plan changes.'
      lastVerified: 2026-11-09
    - topic: billing.free-trials
      tier: neutral
      reason: 'Its trial turns into a paid plan unless you cancel first. It doesn’t say it reminds you before.'
      sources:
        - url: https://www.pandora.com/plans
          quote: 'Subscription automatically renews after trial or current Access Period unless canceled in advance.'
      lastVerified: 2026-11-09
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its pages say a plan renews on its own, but not that it reminds you first.'
      pages: [https://www.pandora.com/plans, https://www.pandora.com/legal]
      lastVerified: 2026-11-09
    - topic: billing.fees
      tier: poor
      reason: 'Its terms mention late fees, without saying how much.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'Unless otherwise stated, all fees and charges are due and payable in advance, are non-refundable, and are exclusive of any applicable federal, state, or local taxes.'
        - url: https://www.pandora.com/legal
          quote: 'All such fees and charges (including any taxes and late fees, as applicable)'
      lastVerified: 2026-11-09
    - topic: billing.plan-changes
      tier: neutral
      reason: 'A change of plan starts on your next billing date.'
      sources:
        - url: https://help.pandora.com/s/article/Change-your-Payment-Information-1519949295577?language=en_US
          quote: "Choose the plan you'd prefer and the changes will be made on your next billing date."
      lastVerified: 2026-11-09
    - topic: legal.disputes
      tier: bad
      reason: 'Disputes go to private arbitration, one person at a time, with no class actions and no way to opt out.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'ANY DISPUTE BETWEEN US, UNLESS PROVIDED OTHERWISE HEREIN, WILL BE RESOLVED BY BINDING ARBITRATION ON AN INDIVIDUAL BASIS AS OUTLINED IN SECTION 25 BELOW.'
        - url: https://www.pandora.com/legal
          quote: 'You do not have the right to act as a class representative or participate as a member of a class of claimants with respect to any dispute submitted to arbitration or litigation.'
      lastVerified: 2026-11-09
    - topic: legal.terms-changes
      tier: good
      reason: 'It emails you about big changes to its terms, which start 30 days later, except new features and legal changes, which start at once.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'You agree that such material changes will be effective thirty (30) days after our notice to you, except for changes that relate to new features or for legal reasons, which will become effective immediately.'
      lastVerified: 2026-11-09
    - topic: legal.account-closure
      tier: poor
      reason: 'It can close your account at any time, for any reason, by emailing you first, and fees aren’t refunded.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'We may terminate this Agreement and your access to the Services at any time and for any reason by providing notice to the email address you provided us.'
      lastVerified: 2026-11-09
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or limit any feature at any time, with or without notice, and says it owes you nothing for it.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'Pandora may alter the availability of any feature of the Services, or impose new limitations on your use of the Services, at any time with or without notice, liability, or obligation with respect to such feature or limitation.'
      lastVerified: 2026-11-09
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms and privacy policy don’t say it closes accounts you haven’t used.'
      pages: [https://www.pandora.com/legal, https://www.pandora.com/privacy]
      lastVerified: 2026-11-09
    - topic: security.practices
      tier: poor
      reason: 'It describes commercially reasonable security steps in general terms, and names no audit or way to report a flaw.'
      sources:
        - url: https://www.pandora.com/privacy
          quote: 'Sirius XM takes commercially reasonable steps designed to secure your personal data'
      lastVerified: 2026-11-09
    - topic: service.account-sharing
      tier: bad
      reason: 'A plan is for your own personal use, not for anyone else.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'for your own individual, personal, non-commercial purposes only and not for the sublicense to or use by third parties.'
      lastVerified: 2026-11-09
    - topic: service.account-sharing
      plans: [pandora.premium-family]
      tier: great
      reason: 'Premium Family gives up to six people their own accounts, and names no household rule.'
      sources:
        - url: https://help.pandora.com/s/article/000002262?language=en_US
          quote: 'Pandora Premium Family Plan offers all of the features of Pandora Premium to up to six unique Pandora accounts.'
      lastVerified: 2026-11-09
    - topic: service.device-limits
      tier: neutral
      reason: 'Offline listening works only on phones, tablets and Apple Watches, and each account plays one stream at a time.'
      sources:
        - url: https://help.pandora.com/s/article/Offline-Mode-and-Downloads?language=en_US
          quote: 'This feature is only available to our current Pandora Plus, Premium, or Premium Family subscribers, and only for iOS or Android mobile devices, and Apple Watches.'
      lastVerified: 2026-11-09
