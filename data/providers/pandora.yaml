# Terms and policies, read 2026-11-09 (M11.15): its Services Terms of Use and Sirius XM's Privacy Policy (both through a
# US exit; the policy covers SiriusXM's other services too, a shared document once SiriusXM joins the catalog), and its
# help centre's articles on the 2026 rate change, cancelling, refunds, billing, deleting an account, offline mode and
# Premium Family, its Subscription Terms (through a US exit) and its sign-up form, whose line names only the Terms of
# Use and the Privacy Policy. Its Premium Trial Terms are a 90-day trial code's, with no topic beyond these. Its
# Subscription Terms upgrade a plan at once, prorated, but its billing article makes every change on the next billing
# date, so switching plans is graded by the article. Calibrated against Spotify's, Deezer's and Tidal's grades. Not
# rated: rights over your content and its apps' licence (not topics for music).
policies:
  shared: [siriusxm-privacy]
  links:
    - name: Plans
      url: https://www.pandora.com/plans
    - name: Services Terms of Use
      url: https://www.pandora.com/legal
    - name: Subscription Terms
      url: https://www.pandora.com/legal/subscription
    - name: Sign up
      url: https://www.pandora.com/account/register
    - name: Sirius XM Privacy Policy
      url: https://www.siriusxm.com/privacy-policy
    - name: 2026 Pandora Subscription Rate Change
      url: https://help.pandora.com/s/article/2026-Pandora-Subscription-Rate-Change?language=en_US
    - name: How to cancel your subscription
      url: https://help.pandora.com/s/article/Cancel-your-Subscription-1519949295562?language=en_US
    - name: Refunds
      url: https://help.pandora.com/s/article/Refunds-1519949304443?language=en_US
    - name: Change your billing method or subscription plan
      url: https://help.pandora.com/s/article/Change-your-Payment-Information-1519949295577?language=en_US
    - name: How to Delete Your Pandora Account
      url: https://help.pandora.com/s/article/Cancel-Deactivate-or-Delete-your-Account-1519949295569?language=en_US
    - name: Offline Mode and Downloads
      url: https://help.pandora.com/s/article/Offline-Mode-and-Downloads?language=en_US
    - name: Pandora Premium Family Plan
      url: https://help.pandora.com/s/article/000002262?language=en_US
  ratings:
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can delete your account yourself (a paid one once its plan has ended), but it doesn’t say how long removing your data takes.'
      sources:
        - url: https://help.pandora.com/s/article/Cancel-Deactivate-or-Delete-your-Account-1519949295569?language=en_US
          quote: 'If you delete your account, that decision is final.'
        - url: https://help.pandora.com/s/article/Cancel-Deactivate-or-Delete-your-Account-1519949295569?language=en_US
          quote: 'I want to permanently delete my Pandora Plus or Pandora Premium account.'
      action:
        name: How to Delete Your Pandora Account
        url: https://help.pandora.com/s/article/Cancel-Deactivate-or-Delete-your-Account-1519949295569?language=en_US
      lastVerified: 2026-11-09
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'Its sign-up form asks for your email address, a password, your birth year, your ZIP code and your gender.'
      sources:
        - url: https://www.pandora.com/account/register
          quote: 'Email Address'
        - url: https://www.pandora.com/account/register
          quote: 'Birth Year'
        - url: https://www.pandora.com/account/register
          quote: 'Zip Code'
      lastVerified: 2026-11-09
    - topic: privacy.children
      tier: good
      reason: 'Under-18s need a parent’s consent, and it doesn’t sell or use for targeted ads the data of users it knows are under 18.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'or if you have parental consent and reside in an Authorized Jurisdiction where the minimum age with parental consent is 13, you must be at least 13 years of age ("Minimum Age")'
        - url: https://www.siriusxm.com/privacy-policy
          quote: 'We do not “sell”, or use or “share” for targeted advertising purposes, the personal data of consumers we know to be less than 18 years of age.'
      lastVerified: 2026-11-09
    - topic: billing.cancellation
      tier: neutral
      reason: 'You cancel on its website and keep your plan to the end of the period, but must cancel at least 24 hours before it renews.'
      sources:
        - url: https://help.pandora.com/s/article/Cancel-your-Subscription-1519949295562?language=en_US
          quote: 'be sure to cancel your subscription or trial at least 24 hours beforehand.'
        - url: https://help.pandora.com/s/article/Cancel-your-Subscription-1519949295562?language=en_US
          quote: 'Select Switch Plans and click Cancel Subscription in the bottom corner of the screen.'
        - url: https://www.pandora.com/legal/subscription
          quote: 'If you cancel your Subscription Product during your current Access Period, your access to the Subscription Services will continue until the end of your then-current Access Period, at which point it will expire.'
      lastVerified: 2026-11-09
    - topic: billing.refunds
      tier: neutral
      reason: 'Its terms give no money back, though its help says a yearly plan bought on its website gets back the unused part. You keep your plan to the end of the period.'
      sources:
        - url: https://www.pandora.com/legal/subscription
          quote: 'Purchase and/or redemption of your Subscription Product is final and non-refundable; Pandora will not issue you any refund, including partial, pro-rated, or otherwise unless required to do so by law.'
        - url: https://help.pandora.com/s/article/Refunds-1519949304443?language=en_US
          quote: 'We offer pro-rated refunds for annual subscriptions purchased directly through the Pandora website.'
      lastVerified: 2026-11-09
    - topic: billing.price-changes
      tier: great
      reason: 'It emails you 30 days before a new price, which starts only at your next billing date, never on time you’ve paid for, so you can cancel first.'
      sources:
        - url: https://www.pandora.com/legal/subscription
          quote: 'We will provide you with thirty (30) days prior notice via email before changes in Subscription Products or Fees take effect.'
        - url: https://www.pandora.com/legal/subscription
          quote: 'Any changes to the Subscription Products or Fees will be effective upon your next billing cycle, and will not apply retroactively or to the remainder of your current Access Period.'
        - url: https://help.pandora.com/s/article/2026-Pandora-Subscription-Rate-Change?language=en_US
          quote: 'Monthly plans: Updated price applies at your next monthly billing date'
      lastVerified: 2026-11-09
    - topic: billing.free-trials
      tier: poor
      reason: 'A trial usually needs a card, and turns into a paid plan unless you turn off renewal first. It doesn’t say it reminds you.'
      sources:
        - url: https://www.pandora.com/legal/subscription
          quote: 'In most cases, you will be required to provide a credit card or other payment method in order to redeem the Trial, and in order to ensure uninterrupted access to the Subscription Services after your Trial expires.'
        - url: https://www.pandora.com/plans
          quote: 'Subscription automatically renews after trial or current Access Period unless canceled in advance.'
      lastVerified: 2026-11-09
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its pages say a plan renews on its own, but not that it reminds you first.'
      pages: [https://www.pandora.com/plans, https://www.pandora.com/legal]
      lastVerified: 2026-11-09
    - topic: billing.fees
      tier: poor
      reason: 'Its terms mention late fees, without saying how much.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'Unless otherwise stated, all fees and charges are due and payable in advance, are non-refundable, and are exclusive of any applicable federal, state, or local taxes.'
        - url: https://www.pandora.com/legal
          quote: 'All such fees and charges (including any taxes and late fees, as applicable)'
      lastVerified: 2026-11-09
    - topic: billing.plan-changes
      tier: neutral
      reason: 'A change of plan starts on your next billing date.'
      sources:
        - url: https://help.pandora.com/s/article/Change-your-Payment-Information-1519949295577?language=en_US
          quote: "Choose the plan you'd prefer and the changes will be made on your next billing date."
      lastVerified: 2026-11-09
    - topic: legal.disputes
      tier: bad
      reason: 'Disputes go to private arbitration, one person at a time, with no class actions and no way to opt out.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'ANY DISPUTE BETWEEN US, UNLESS PROVIDED OTHERWISE HEREIN, WILL BE RESOLVED BY BINDING ARBITRATION ON AN INDIVIDUAL BASIS AS OUTLINED IN SECTION 25 BELOW.'
        - url: https://www.pandora.com/legal
          quote: 'You do not have the right to act as a class representative or participate as a member of a class of claimants with respect to any dispute submitted to arbitration or litigation.'
      lastVerified: 2026-11-09
    - topic: legal.terms-changes
      tier: good
      reason: 'It emails you about big changes to its terms, which start 30 days later, except new features and legal changes, which start at once.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'You agree that such material changes will be effective thirty (30) days after our notice to you, except for changes that relate to new features or for legal reasons, which will become effective immediately.'
      lastVerified: 2026-11-09
    - topic: legal.account-closure
      tier: poor
      reason: 'It can close your account at any time, for any reason, by emailing you first, and its subscription terms refund nothing unless a law requires it.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'We may terminate this Agreement and your access to the Services at any time and for any reason by providing notice to the email address you provided us.'
        - url: https://www.pandora.com/legal/subscription
          quote: 'Purchase and/or redemption of your Subscription Product is final and non-refundable; Pandora will not issue you any refund, including partial, pro-rated, or otherwise unless required to do so by law.'
      lastVerified: 2026-11-09
    - topic: legal.service-changes
      tier: poor
      reason: 'It can change or limit any feature at any time, with or without notice, and says it owes you nothing for it.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'Pandora may alter the availability of any feature of the Services, or impose new limitations on your use of the Services, at any time with or without notice, liability, or obligation with respect to such feature or limitation.'
      lastVerified: 2026-11-09
    - topic: legal.inactivity
      status: not-stated
      reason: 'Its terms and privacy policy don’t say it closes accounts you haven’t used.'
      pages: [https://www.pandora.com/legal, https://www.siriusxm.com/privacy-policy]
      lastVerified: 2026-11-09
    - topic: service.account-sharing
      tier: bad
      reason: 'A plan is for your own personal use, not for anyone else.'
      sources:
        - url: https://www.pandora.com/legal
          quote: 'for your own individual, personal, non-commercial purposes only and not for the sublicense to or use by third parties.'
      lastVerified: 2026-11-09
    - topic: service.account-sharing
      plans: [pandora.premium-family]
      tier: great
      reason: 'Premium Family gives up to six people their own accounts, and names no household rule.'
      sources:
        - url: https://help.pandora.com/s/article/000002262?language=en_US
          quote: 'Pandora Premium Family Plan offers all of the features of Pandora Premium to up to six unique Pandora accounts.'
      lastVerified: 2026-11-09
    - topic: service.device-limits
      tier: neutral
      reason: 'Premium downloads songs, albums and playlists to play offline, with licensing limits it doesn’t spell out.'
      sources:
        - url: https://help.pandora.com/s/article/Offline-Mode-and-Downloads?language=en_US
          quote: "Premium subscribers have the ability to download many songs, albums, stations, or playlists from Pandora's library for offline listening."
        - url: https://help.pandora.com/s/article/Offline-Mode-and-Downloads?language=en_US
          quote: 'Licensing restrictions may apply.'
      lastVerified: 2026-11-09
    - topic: service.device-limits
      plans: [pandora.plus]
      tier: poor
      reason: 'Plus downloads only up to three of your top stations, and you can’t choose which.'
      sources:
        - url: https://help.pandora.com/s/article/Offline-Mode-and-Downloads?language=en_US
          quote: "Plus subscribers cannot choose which stations they'd like available for offline listening."
        - url: https://help.pandora.com/s/article/Offline-Mode-and-Downloads?language=en_US
          quote: 'Instead, Pandora will download up to three of your top stations and your Thumbprint Radio.'
      lastVerified: 2026-11-09
