    - name: 'Account aanmaken (in Dutch)'
      url: https://viaplay.com/checkout/register/4738422
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It ties what you watch to your profile for recommendations and studies viewing for its statistics. Stopping that takes an objection to its privacy team.'
      sources:
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'We kijken naar zaken als waar je naar kijkt en hoe je Viaplay gebruikt, en koppelen dit aan je profiel.'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Het verzamelen van verschillende gegevens, zoals kijkgedrag, in statistieken voor analyse.'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Je hebt het recht om bezwaar te maken tegen onze verwerking die wij baseren op gerechtvaardigd belang, inclusief profilering.'
      action:
        name: 'Your privacy rights (in Dutch)'
        url: https://viaplay.com/nl-nl/privacy
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your data within Viaplay Group to market to you, with ad partners (some on their own say-so, which you can only object to in each browser’s cookie settings), and with audience-measurement partners built into its player.'
      sources:
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'delen met bedrijven waarvan we eigenaar zijn om onze producten of diensten te leveren, onze producten of diensten op de markt te brengen'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'In overeenstemming met TCF kunnen onze advertentiepartners bepaalde verwerkingsactiviteiten baseren op gerechtvaardigde belangen als wettelijke grondslag.'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Wij kunnen beperkte informatie over uw gebruik van onze diensten delen met vertrouwde meet- en analysepartners wier technologie in onze videospeler is geïntegreerd'
      action:
        name: 'Its privacy policy (in Dutch)'
        url: https://viaplay.com/nl-nl/privacy
      lastVerified: 2026-11-09
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Ads on Basis follow your consent choices and interests, but its ad partners may track you on their own say-so; you can object only in each browser’s cookie settings.'
      sources:
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Als je een abonnement heeft op pakketten die advertenties bevatten, zal Viaplay Group als uitgever samenwerken met advertentieleveranciers om advertenties weer te geven op basis van uw toestemmingsvoorkeuren en interesses.'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Jij kunt jouw toestemmingsvoorkeuren en leverancierskeuzes op elk gewenst moment bijwerken of bezwaar maken tegen de verwerking van je persoonsgegevens op basis van gerechtvaardigde belangen door op Cookie-instellingen te klikken.'
      action:
        name: 'Its privacy policy (in Dutch)'
        url: https://viaplay.com/nl-nl/privacy
      lastVerified: 2026-11-09
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy doesn’t say whether what you write or say to it trains AI.'
      pages: [https://viaplay.com/nl-nl/privacy]
      lastVerified: 2026-11-09
    - topic: privacy.data-retention
      tier: poor
      reason: 'Viaplay names periods for some of your data, but the F1 account that every plan’s F1 TV Pro needs keeps your data as long as Formula 1 thinks necessary, with no periods.'
      sources:
        - url: https://viaplay.com/nl-nl/
          quote: 'Een apart F1-account en akkoord gaan met de voorwaarden van F1 zijn noodzakelijk om toegang te krijgen tot F1® TV Pro.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'We will only retain your personal data for as long as reasonably necessary to fulfil the purposes we collected it for, including for the purposes of satisfying any legal, regulatory, tax, accounting or reporting requirements.'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'tot een maximum van 3 jaar voor logs en tekstdialogen, en 1 maand voor stemopnames'
      lastVerified: 2026-11-09
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can have your account deleted at any time by asking its customer service, and your data is then anonymised, with no stated time.'
      sources:
        - url: https://viaplay.com/nl-nl/terms
          quote: 'U kunt ervoor kiezen om uw gebruikersaccount op elk gewenst moment te verwijderen door contact op te nemen met onze klantenservice'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Als je account wegens inactiviteit of op verzoek wordt verwijderd, worden je persoonsgegevens geanonimiseerd.'
      action:
        name: 'Its customer service (in Dutch)'
        url: https://help.viaplay.com/nl/
      lastVerified: 2026-11-09
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask for a copy of your data in a machine-readable format.'
      sources:
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Je hebt het recht om bij ons een kopie van je gegevens in een machineleesbaar formaat op te vragen en het recht om deze naar een andere ontvanger over te dragen.'
      action:
        name: 'Your privacy rights (in Dutch)'
        url: https://viaplay.com/nl-nl/privacy
      lastVerified: 2026-11-09
    - topic: privacy.government-requests
      tier: poor
      reason: 'Viaplay hands your data to authorities when it’s obliged to, but Formula 1, whose account every plan’s F1 TV Pro needs, may give it to agencies to protect its own lawful interests.'
      sources:
        - url: https://viaplay.com/nl-nl/
          quote: 'Een apart F1-account en akkoord gaan met de voorwaarden van F1 zijn noodzakelijk om toegang te krijgen tot F1® TV Pro.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'Any law enforcement or similar agency where we consider this necessary to protect our rights, property, lawful interests, or safety, our customers, or others.'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'We kunnen jouw gegevens delen met overheidsinstanties of andere officiële instellingen of instanties wanneer we hiertoe verplicht zijn op grond van wet- of regelgeving, een officieel besluit of een verzoek van de overheid.'
      lastVerified: 2026-11-09
    - topic: privacy.data-location
      tier: good
      reason: 'It aims to keep your data in the EU and EEA; anywhere else, only in countries the EU says protect it enough or under the EU’s standard contract clauses.'
      sources:
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Wij streven er altijd naar om je gegevens binnen de EU/EER te verwerken.'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Het kiezen van onderaannemers of dienstverleners die actief zijn in een land dat door de Europese Commissie is erkend als land met een adequaat niveau van gegevensbescherming'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'de standaardcontractbepalingen van de Europese Commissie tussen Viaplay Group en de ontvanger van persoonsgegevens buiten de EU/EER'
      lastVerified: 2026-11-09
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'You sign up with an email address and a password and confirm you’re over 18; paying adds your card or bank details, and its terms a routine credit check.'
      sources:
        - url: https://viaplay.com/checkout/register/4738422
          quote: 'Ik bevestig dat ik ouder ben dan 18 jaar, dat ik akkoord ga met de gebruiksvoorwaarden van Viaplay en dat ik het privacybeleid heb gelezen.'
        - url: https://viaplay.com/nl-nl/terms
          quote: 'uw betalingsgegevens registreren en een gebruikelijke kredietbeoordeling ondergaan'
      lastVerified: 2026-11-09
    - topic: privacy.children
      tier: neutral
      reason: 'Viaplay is for adults and doesn’t knowingly aim ads at minors. Formula 1’s account, which every plan’s F1 TV Pro needs, takes 16- and 17-year-olds in some places with a parent’s consent and says nothing of their ads.'
      sources:
        - url: https://viaplay.com/nl-nl/
          quote: 'Een apart F1-account en akkoord gaan met de voorwaarden van F1 zijn noodzakelijk om toegang te krijgen tot F1® TV Pro.'
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'In the case of U.S. residents and residents of any other applicable territory, individuals over the age of 16, but under the age of 18, may utilise the Service with the consent of a parent or legal guardian.'
        - url: https://account.formula1.com/#/en/privacy-policy
          quote: 'If you have reason to believe that a child under the age of 16 has provided personal data to us without parental consent, please contact us so that we can delete that data.'
      lastVerified: 2026-11-09
    - topic: security.practices
      tier: poor
      reason: 'It describes strict measures in general terms and meets the card industry’s standard for payments, but names no independent audit or way to report a security flaw.'
      sources:
        - url: https://viaplay.com/nl-nl/privacy
