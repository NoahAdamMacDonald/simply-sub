# Terms and policies, read 2026-11-09 (M11.15): its Terms ("Voor het laatst gewijzigd op 7 juli 2026", Viaplay Group
# International AB's), its privacy policy ("voor het laatst bijgewerkt op 5 mei 2026", Viaplay Group Sweden AB's), its
# help centre's articles on cancelling, changing plans, devices, downloads and paying, and its sign-up form. Every terms
# quote is word for word in Videoland's interim terms too, which keep these clauses from 30 November 2026; the privacy
# ratings are Viaplay Group's policy until DPG Media's applies then.
policies:
