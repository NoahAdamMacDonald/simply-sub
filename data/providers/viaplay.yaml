# Terms and policies, read 2026-11-09 (M11.15): its Terms ("Voor het laatst gewijzigd op 7 juli 2026", Viaplay Group
# International AB's), its privacy policy ("voor het laatst bijgewerkt op 5 mei 2026", Viaplay Group Sweden AB's), its
# help centre's articles on cancelling, changing plans, devices, downloads and paying, and its sign-up form. Every terms
# quote is word for word in Videoland's interim terms too, which keep these clauses from 30 November 2026; the privacy
# ratings are Viaplay Group's policy until DPG Media's applies then.
# F1 TV Pro, on every plan, is Formula 1's own service on an F1 account ("Een apart F1-account en akkoord gaan met de
# voorwaarden van F1"): its Digital Products Terms of Use, F1 TV Subscription Terms and Privacy Policy (read
# 2026-11-09, their English versions) are rated where they're worse than Viaplay's own (the owner's rule for a benefit
# another company runs) and hold the same grades elsewhere; their billing clauses are for F1 TV bought from Formula 1.
# Its Cookie Policy adds no topic, and its help centre's comparison of F1 TV's devices and streams showed nothing in
# Edge here, so it's unread.
policies:
  links:
    - name: 'Voorwaarden (in Dutch)'
      url: https://viaplay.com/nl-nl/terms
    - name: 'Privacyverklaring (in Dutch)'
      url: https://viaplay.com/nl-nl/privacy
    - name: 'Viaplay’s plans (in Dutch)'
