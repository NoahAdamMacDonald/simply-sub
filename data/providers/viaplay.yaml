# Researched by hand on 2026-11-09 (M11.15, the streaming category, batch 3, part 3), read through a Dutch exit: Viaplay
# in the Netherlands, the catalog's one country that sells it (the owner's choice of 2026-11-04). Its pages are in Dutch.
# Videoland (DPG Media) bought Viaplay Group's Dutch business on 30 October 2026, and from 30 November 2026 Videoland's
# terms ("interim-terms", the same clauses but Dutch law) and DPG Media's privacy policy apply; elsewhere, in the Nordic
# countries, Viaplay is still Viaplay Group's. One provider, the Dutch one, rated by its terms as written today (the
# owner's choice of 2026-11-09).
# Pricing: viaplay.com/nl-nl's plan cards: Basis "met advertenties", "€19,99/maand. Opzegbaar op elk moment" or
# "€179/jaar", and Standaard, "€21.99/maand. Opzegbaar op elk moment." or "€199/jaar". A year is "Eenmalige betaling, 12
# maanden vast" (one payment for 12 fixed months), so it doesn't renew by itself; its terms then turn a fixed term into
# a monthly subscription, or another fixed term, "afhankelijk van wat er in de koopaanbieding staat". Its help article
# "Informatie over onze pakketten" also lists a 12-month contract paid monthly (€16,99 and €19,99 a month), which the
# cards no longer sell: a commitment price, left out.
# Region checklist, 2026-11-09: 1. viaplay.com/nl-nl and its Dutch help centre; 2. the plan cards' monthly and yearly
# prices; 4. the plan cards, and the account form after one (its fields only, never the payment form); 6. Edge, through
# the Dutch exit.
# Bundles: none on its pages. Resellers: none; TV providers (Ziggo, KPN, Odido and others) sell it in their own packages,
# partners, not resellers.

id: viaplay
name: Viaplay
website: https://viaplay.com/nl-nl/
category: streaming
spendCategory: streaming
billingCurrency: { NL: EUR }
availableIn: [NL]
cancelUrl: https://help.viaplay.com/nl/cancel-package/
sources: { pricing: https://viaplay.com/nl-nl/ }
notes: Sold in the Netherlands by Videoland (DPG Media), whose terms and privacy policy apply from 30 November 2026. Viaplay in the Nordic countries is Viaplay Group's.
# Accepted cards and ways to pay, read 2026-11-09 in its help centre ("Wijzig betaalmethode": cards issued by a Dutch
# bank; the home page's FAQ names only Visa and Mastercard) and "Pakket beheren" (Apple). TV providers bill it in their
# own packages, in words no way to pay names.
acceptedNetworks:
  NL:
    networks: [mastercard, visa, amex]
    url: https://help.viaplay.com/nl/change-payment-method/
    quotes:
      - 'Creditcard/betaalpas Mastercard, Visa en Amex.'
paymentMethods:
