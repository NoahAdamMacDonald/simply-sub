        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Ze voldoen aan de beveiligingsnormen van de Payment Card Industry Security Standards Council.'
      lastVerified: 2026-11-09
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel online in your account at any time and keep watching to the end of the period you paid for; a fixed term, such as a prepaid year, runs to its end.'
      sources:
        - url: https://viaplay.com/nl-nl/terms
