          quote: 'Als klant van Viaplay ontvang je marketingberichten via e-mail en sms.'
        - url: https://viaplay.com/checkout/register/4738422
          quote: 'Vink het vakje aan als je geen marketingberichten van Viaplay wilt ontvangen.'
