        name: 'Your privacy rights (in Dutch)'
        url: https://viaplay.com/nl-nl/privacy
      lastVerified: 2026-11-09
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands your data to authorities when a law, an official decision or a government request obliges it, and says nothing more.'
      sources:
