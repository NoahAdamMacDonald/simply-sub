      reason: 'You can have your account deleted at any time by asking its customer service, and your data is then anonymised, with no stated time.'
      sources:
        - url: https://viaplay.com/nl-nl/terms
          quote: 'U kunt ervoor kiezen om uw gebruikersaccount op elk gewenst moment te verwijderen door contact op te nemen met onze klantenservice'
