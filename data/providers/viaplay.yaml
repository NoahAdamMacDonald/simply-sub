    - topic: billing.fees
      tier: neutral
      reason: 'The price is all you pay, but it may charge for fixing a fault that you or someone using your account caused, without saying how much.'
      sources:
        - url: https://viaplay.com/nl-nl/terms
          quote: 'Wij behouden ons het recht voor om kosten in rekening te brengen voor het verhelpen van storingen als gevolg van uw handelen of het handelen van een andere persoon die van uw Abonnement gebruik heeft gemaakt.'
      lastVerified: 2026-11-09
    - topic: billing.plan-changes
      tier: good
      reason: 'An upgrade starts at once, with the rest of your old plan refunded; a downgrade starts at your next billing date. During a fixed term, such as a prepaid year, you can’t change your plan yourself.'
      sources:
        - url: https://help.viaplay.com/nl/manage-package/
          quote: 'Eventuele resterende tijd van je vorige pakket wordt automatisch terugbetaald.'
        - url: https://help.viaplay.com/nl/manage-package/
          quote: 'Gaat in vanaf de volgende facturatiedatum.'
        - url: https://help.viaplay.com/nl/manage-package/
          quote: 'Je kunt je pakket niet wijzigen op Viaplay.com als: je betaalt via Apple (iTunes), of je Viaplay hebt via een tv-provider of een zenderpakket. je een contractperiode hebt op je Viaplay-pakket.'
      lastVerified: 2026-11-09
    - topic: legal.disputes
      tier: good
      reason: 'Viaplay’s disputes go to a Dutch court near where you live, but every plan’s F1 TV Pro comes with Formula 1’s terms, which send them to England’s courts unless your consumer rights let you sue at home.'
      sources:
        - url: https://viaplay.com/nl-nl/
          quote: 'Een apart F1-account en akkoord gaan met de voorwaarden van F1 zijn noodzakelijk om toegang te krijgen tot F1® TV Pro.'
        - url: https://account.formula1.com/#/en/terms-of-use
          quote: 'Except in the case of U.S. residents, you can bring legal proceedings in respect of these Terms in the English courts UNLESS statutory and/or consumer rights apply to you which allow your local law to apply and/or entitle you to bring legal proceedings in your local court instead.'
        - url: https://viaplay.com/nl-nl/terms
          quote: 'Indien partijen niet tot overeenstemming kunnen komen, kan het geschil voor de bevoegde Nederlandse rechtbank worden gebracht. Als consument heeft u het recht om voor de rechtbank in een plaats dicht bij uw woonplaats te kiezen.'
      lastVerified: 2026-11-09
    - topic: legal.terms-changes
      tier: poor
      reason: 'Viaplay emails you 30 days before a big change for the worse, but every plan’s F1 TV Pro comes with Formula 1’s terms, which change when it posts them; using F1 TV afterwards accepts them.'
      sources:
        - url: https://viaplay.com/nl-nl/
          quote: 'Een apart F1-account en akkoord gaan met de voorwaarden van F1 zijn noodzakelijk om toegang te krijgen tot F1® TV Pro.'
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'We reserve the right to make changes, modifications, amendments and/or updates to these Terms from time to time by posting such changes in this document'
        - url: https://account.formula1.com/#/en/terms-of-use
          quote: 'By using the Digital Products after any such changes are made to these Terms, you agree to comply with, and be bound by, the updated Terms in force at that time.'
      lastVerified: 2026-11-09
    - topic: legal.account-closure
      tier: neutral
      reason: 'It can end your subscription at any time, but then you keep watching to the end of your period or get the last payment back. If you break its terms, it can cut you off at once and ask for the rest of a fixed term.'
      sources:
        - url: https://viaplay.com/nl-nl/terms
          quote: 'Wij behouden ons het recht voor uw abonnement te allen tijde te beëindigen of anderszins uw toegang tot Viaplay op te schorten.'
        - url: https://viaplay.com/nl-nl/terms
          quote: 'voortgezette toegang tot Viaplay voor de rest van de lopende Abonnementsperiode of Vaste Termijn, of een restitutie van de laatst betaalde Abonnementsvergoeding'
        - url: https://viaplay.com/nl-nl/terms
          quote: 'Indien u een abonnement met Vaste Termijn hebt, kunnen wij verlangen dat u de Abonnementsvergoeding onmiddellijk volledig voldoet voor de rest van de Vaste Termijn.'
      lastVerified: 2026-11-09
    - topic: legal.service-changes
      tier: poor
      reason: 'Viaplay’s shows and features can change, with 30 days’ email before a change for the worse, but every plan’s F1 TV Pro can change or lose content at Formula 1’s sole discretion, which takes no liability for it.'
      sources:
        - url: https://viaplay.com/nl-nl/
          quote: 'Een apart F1-account en akkoord gaan met de voorwaarden van F1 zijn noodzakelijk om toegang te krijgen tot F1® TV Pro.'
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'We may add, vary, replace or withdraw content and features included within the Services, and the range of payment options and payment currencies, and the platforms or vendors from which the Services are made available may change in our sole discretion.'
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'we exclude all liability from: (a) any unauthorised use of the Services; (b) suspending, terminating, varying or withdrawing any of the Services in accordance with these Terms and/or any of the content and features included in those Services'
      lastVerified: 2026-11-09
    - topic: legal.inactivity
      tier: poor
      reason: 'It deletes an account no one has used for 48 months (no purchases, sign-ins or viewing), unless it holds bought content still licensed, and doesn’t say it warns you first.'
      sources:
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Als je 48 maanden inactief bent geweest op onze diensten, worden je account en de bijbehorende persoon gegevens verwijderd, tenzij je inhoud met een geldige licentieperiode hebt gekocht.'
        - url: https://viaplay.com/nl-nl/privacy
          quote: 'Je wordt als inactief beschouwd als je gedurende de voorgeschreven periode geen inhoud hebt gekocht, niet hebt ingelogd of Viaplay op welke manier dan ook hebt gebruikt.'
      lastVerified: 2026-11-09
    - topic: service.account-sharing
      tier: bad
      reason: 'Viaplay lets only people who live with you use your account, but every plan’s F1 TV Pro can’t be shared with anyone: Formula 1’s terms forbid letting any other person watch it.'
      sources:
        - url: https://viaplay.com/nl-nl/
          quote: 'Een apart F1-account en akkoord gaan met de voorwaarden van F1 zijn noodzakelijk om toegang te krijgen tot F1® TV Pro.'
        - url: https://account.formula1.com/#/en/subscription-terms
          quote: 'only access or view the Service via personal, secure devices and never permit any other person to access the Service.'
        - url: https://viaplay.com/nl-nl/terms
          quote: 'U mag alleen toegang tot uw account delen met personen die in uw huishouden wonen, tenzij uw abonnementstype anders toelaat.'
      lastVerified: 2026-11-09
    - topic: service.device-limits
      tier: neutral
      reason: 'You can use up to five devices a day, and downloads last 30 days before you renew their licences.'
      sources:
        - url: https://help.viaplay.com/nl/manage-devices/
          quote: 'Je kunt maximaal vijf apparaten per dag gebruiken met je Viaplay-account.'
        - url: https://help.viaplay.com/nl/offline-content-downloaden/
          quote: 'Je hebt 30 dagen toegang tot de gedownloade content. Daarna moet je de downloadlicenties vernieuwen.'
      lastVerified: 2026-11-09
    - topic: other.notable
      title: Marketing messages by default
      tier: neutral
      reason: 'Signing up opts you in to its marketing by email and text message unless you tick a box, and you can unsubscribe at any time.'
      sources:
