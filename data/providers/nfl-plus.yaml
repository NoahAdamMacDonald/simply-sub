          quote: 'some of these parties may be located in countries other than your own, such as the United States'
        - url: https://www.nfl.com/legal/privacy/
          quote: 'where required, we implement measures such as standard data protection contractual clauses to ensure that any transferred personal information remains protected and secure'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: poor
      reason: 'Its terms say buying a plan may need your name, address and phone number as well as your email and card, and its account form has you confirm you’re 18.'
      sources:
        - url: https://id.nfl.com/account/sign-up
          quote: 'I confirm that I am at least 18 years of age.'
        - url: https://www.nfl.com/legal/subscriptions_terms/
          quote: 'In order to purchase a Subscription Product, you may be required to provide complete and accurate personal information, including, without limitation, your name, address, telephone number, e-mail address, credit card information, and billing address.'
