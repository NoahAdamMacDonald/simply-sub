# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch (the same text from Canada and through a US
# exit): the NFL's Subscription, Authentication and Mobile Products Terms and Conditions ("[Updated: September 4,
# 2026]", NFL+'s own terms), which include NFL.com's Terms and Conditions ("Updated: May 16, 2024", New York law,
# arbitration in section 18) and its Privacy Policy ("Updated: March 16, 2026", which NFL.com's terms include); the
# sign-up page (id.nfl.com/account/sign-up, in Edge), whose line says "By clicking "Create Account", I agree to the
# NFL's Terms and Conditions"; and its help centre's billing, cancelling, refund, pause, plan change, devices and
