  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you do on its sites and apps, may collect details such as your race or sexual orientation, and buys more about you from data brokers. You can limit cookies only site by site and app by app.'
      sources:
        - url: https://www.nfl.com/legal/privacy/
          quote: 'Demographic information, which may include gender, race, ethnicity, and sexual orientation, and other protected classifications under relevant state or federal law;'
        - url: https://www.nfl.com/legal/privacy/
          quote: 'we may receive information about you from other members of the NFL Family and from other sources, such as your friends, social networks, publicly available sources, data brokers, advertising partners, and our business partners and sponsors'
        - url: https://www.nfl.com/legal/privacy/
          quote: 'To disable optional cookies (cookies other than those categorized as strictly necessary above), please utilize the Cookie Settings of the applicable website or navigate to Privacy Settings in applicable apps.'
      action:
        name: 'Its privacy policy'
        url: https://www.nfl.com/legal/privacy/
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It gives your information to business partners for their offers, and your location to other companies for their ads. Only people in some places can opt out, through a link on its sites.'
      sources:
        - url: https://www.nfl.com/legal/privacy/
          quote: 'We may disclose your information to select business partners so that they can provide you with special offers, promotional materials, and other materials that may be of interest to you.'
        - url: https://www.nfl.com/legal/privacy/
          quote: 'We also may disclose your geolocation information to third parties so that they may provide you with geographically relevant advertising'
        - url: https://www.nfl.com/legal/privacy/
          quote: 'Depending on the jurisdiction in which you reside, you may also be afforded the right to opt out of the sale, sharing, or processing of your personal information'
      action:
        name: 'Its privacy choices (its privacy policy)'
        url: https://www.nfl.com/legal/privacy/
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Ad partners track you on its sites and elsewhere to target ads, and its apps may even listen for silent signals to place you. You can turn this off only browser by browser and in your device settings.'
      sources:
        - url: https://www.nfl.com/legal/privacy/
          quote: 'For example, we may conduct analysis on your behavior in order to provide you with Interest-Based Advertising both on and off the Services.'
        - url: https://www.nfl.com/legal/privacy/
          quote: "the Services may also track your device's precise geolocation by responding to beacons or inaudible signals sent to your device's microphone"
        - url: https://www.nfl.com/legal/privacy/
          quote: 'you should enable the signal separately for each browser and/or device from which you would like to be opted out'
      action:
        name: 'Interest-based advertising (its privacy policy)'
        url: https://www.nfl.com/legal/privacy/
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy policy and terms don’t say whether what you write or send trains AI.'
      pages: [https://www.nfl.com/legal/privacy/, https://www.nfl.com/legal/terms/]
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: poor
      reason: 'It keeps your information as long as it thinks reasonably necessary, without saying for how long.'
      sources:
        - url: https://www.nfl.com/legal/privacy/
          quote: 'We will retain your information for as long as reasonably necessary for the purposes set out above'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask it to delete your account through a form in its help centre. It doesn’t promise how long that takes.'
      sources:
        - url: https://support.nfl.com/hc/en-us/articles/35869701525396-How-do-I-delete-my-account
          quote: 'To delete your account, please submit your request here.'
        - url: https://www.nfl.com/legal/privacy/
          quote: 'To exercise your access, deletion, and correction rights, please submit your request by visiting our Data Subject Request Portal .'
      action:
        name: 'How do I delete my account?'
        url: https://support.nfl.com/hc/en-us/articles/35869701525396-How-do-I-delete-my-account
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      tier: neutral
      reason: 'Where the law gives you the right, you can ask for your information in a machine-readable form, or for it to be sent to another company.'
      sources:
        - url: https://www.nfl.com/legal/privacy/
          quote: 'To obtain and have your personal information transferred to another party in a structured, commonly used, and machine-readable format ("data portability").'
      action:
        name: 'Data subject rights (its privacy policy)'
        url: https://www.nfl.com/legal/privacy/
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: poor
      reason: 'It may hand your information to the government or others who ask it to cooperate, even when no law requires it.'
      sources:
        - url: https://www.nfl.com/legal/privacy/
