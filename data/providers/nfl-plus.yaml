# Researched by hand on 2026-11-13 (M11.15, streaming batch 8). nfl.com/plus sends a Canadian visitor to DAZN
# (dazn.com/nfl), so its pages were read 2026-11-13 through a US exit: nfl.com/plus and its plan picker
# (id.nfl.com/select-subscription) in Edge, its help centre (support.nfl.com, all 195 articles) through its Zendesk API,
# and its legal pages with a plain fetch (the same text from Canada and through the US exit). Pages, each quoted where
# it's used:
# Pricing: its help centre's "How much does NFL+ cost?" ("NFL+ is priced at $6.99/month or $49.99/year.**", "NFL+
# Premium is priced at $14.99/month or $99.99/season.**", "**Plus applicable taxes") and "How much does NFL+ cost?
# Monthly and Annual, Regular and Premium." (the same four prices); the plan picker through a US exit ("$6.99/month" and
# "$14.99/month", then "$49.99/year" and "$99.99/year" on its Annual tab: screenshots; its page data names
# "currency":"USD" and each plan's "periodUnit"). Premium's "/season" in one article is the same yearly plan: its
# subscription terms renew a yearly plan "each year on the anniversary of your Start Date". Its page data also lists
# $0 passes (Bud Light's, complimentary codes), which aren't sold.
# Region checklist for CA and US, 2026-11-13: 1. no country paths (nfl.com/plus/international has no prices); 2. no
# picker; 3. the plan picker's data names USD; 4. the plan picker, up to its Sign up buttons; 5. its help centre's price
# and availability articles; 6. Edge from here (sent to DAZN) and through a US exit, and a plain fetch; 7. no bill
# offered. Canada: not sold (its availability articles, below; "Canadian users can visit the DAZN Guide.", What is the
# difference between an NFL+ annual subscription and a monthly subscription?): DAZN, in the catalog, streams the NFL
# outside the US.
# Not listed: NFL Sunday Ticket ("NFL Sunday Ticket is not available with NFL+ or NFL+ Premium. NFL Sunday Ticket is
# available through YouTube and YouTubeTV.", How can I access Sunday Ticket on NFL+?), YouTube's product; NFL+ Premium
# gift cards via TAPPP ("$14.99 — 1-month" and "$99.99 — 1-year", which don't renew: prepaid gifts of the plan, a way to
# pay below); offers (the Military and First Responder discount, DraftKings' month of Premium, Bud Light's pass and the
# "30% off for 3 Months" offer); NFL+ Subscriber Perks (partner offers, the same on both plans).
# Bundles: Disney+ sells NFL+ Premium with its Disney+, Hulu, ESPN Unlimited bundles ($45.99 and $54.99 a month,
# disneyplus.com/welcome/nfl-plus-premium-redzone, read through a US exit), drafted as bundle files beside this one;
# ESPN adds it to ESPN Unlimited bought from ESPN ("You can add NFL+ Premium to your ESPN Unlimited subscription",
# ESPN's help centre), with no price on any page read: a partner's add-on, noted. Official resellers: none; Apple,
# Google, Roku, Amazon and the Disney+ and ESPN offers bill it themselves.
# Features, read 2026-11-13: "NFL+ is offered up to 1080p / (30 or 60) FPS" (What is the highest quality stream
# available?); "Three concurrent streams are allowed with your NFL+ or NFL+ Premium subscription." (How many concurrent
# streams…?); "during live game broadcasts, users will see advertising consistent with the television broadcast" (Are
# there ads in the video-on-demand content…?), so neither plan is ad-free; NFL Network's 24/7 live stream on both and
# NFL RedZone's on Premium (TV channels), and live games: "Live regular season and postseason games are generally
# available only on mobile phones and tablets" (its subscription terms); no downloads ("You are also expressly
# prohibited from downloading the content", the same terms); no profiles. What it streams: football, "NFL library
# programming" and NFL Films (What is NFL+?); none of your own media. Blackouts: "Live preseason games are subject to
# local blackouts; certain games are restricted to mobile devices. Local games are the games that are available on TV in
# your market." (nfl.com/plus).
# Pause: "you can now pause your NFL+ monthly subscription" (How to Pause My NFL+ Billing). Parental controls: none on
# any page read. Free use: none: nfl.com/plus says "Subscription required for NFL+", and the NFL app's free news and
# highlights aren't NFL+'s streams (ESPN's precedent).
id: nfl-plus
name: NFL+
website: https://www.nfl.com/plus
category: streaming
spendCategory: streaming
# "NFL+ and NFL+ Premium are only available in the United States." and "* NFL+ is not available in US territories."
# (Is NFL+ or NFL+ Premium available outside the U.S.?), and its subscription terms: "Subscription Products are only
# available to users within the 50 states of the United States and Washington, D.C.".
availableIn: [US]
billingCurrency: { US: USD }
# Its help centre's cancelling article ("Click the Cancel button").
cancelUrl: https://support.nfl.com/hc/en-us/articles/35869799227540-How-do-I-cancel-my-NFL-subscription
sources:
  { pricing: https://support.nfl.com/hc/en-us/articles/35869739723028-How-much-does-NFL-cost }
# Owner (M11.2), read 2026-11-13: its subscription terms are the NFL's, and NFL.com's terms say the NFL's sites and apps
# "are operated by NFL Enterprises, LLC", with the National Football League's New York address. The NFL isn't a listed
# company: no shares.
owner:
  name: National Football League (NFL Enterprises LLC)
  page:
    name: NFL – Subscription, Authentication and Mobile Products Terms and Conditions
    url: https://www.nfl.com/legal/subscriptions_terms/
  quotes:
    - 'govern your use of the subscription, authentication and mobile products offered by the NFL from time to time'
    - 'NFL+ and NFL+ Premium are collectively referred to herein as the "Subscription Products."'
  country:
    code: US
    page:
      name: NFL.com - Terms and Conditions
      url: https://www.nfl.com/legal/terms/
    quotes:
      - 'write to Legal Department, Attn: NFL.com, National Football League, 345 Park Avenue, 7th Floor, New York, NY 10154'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: its payment article (cards and PayPal), its price article (iTunes, Android,
# Roku, Apple TV and Amazon Fire in-app), and NFL+ Premium gift cards redeemed through TAPPP. Also billed by Disney+ and
# ESPN for their NFL+ Premium offers ("If you have NFL+ Premium through Disney+, please visit the Disney+ Help Center",
# NFL+ Premium through Disney+ and ESPN), in words the catalog's checks don't read as a way to pay.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex, discover]
    url: https://support.nfl.com/hc/en-us/articles/35869719249300-How-can-I-pay-for-NFL
    quotes:
      - 'You may use any major Credit Card as a payment method (e.g. Visa, MasterCard, American Express, Discover Network, PayPal).'
paymentMethods:
  - methods: [card, paypal]
    page: How can I pay for NFL+?
    url: https://support.nfl.com/hc/en-us/articles/35869719249300-How-can-I-pay-for-NFL
    quotes:
      - 'You may use any major Credit Card as a payment method (e.g. Visa, MasterCard, American Express, Discover Network, PayPal).'
  - methods: [app-store]
    page: How much does NFL+ cost? Monthly and Annual, Regular and Premium.
    url: https://support.nfl.com/hc/en-us/articles/35869716246804-How-much-does-NFL-cost-Monthly-and-Annual-Regular-and-Premium
    quotes:
      - 'If you subscribe through a third party such as iTunes, Android, Roku, AppleTV, Amazon Fire, or PayPal you may encounter additional fees'
  - methods: [gift-card]
    page: NFL+ Gift Card via TAPPP – Frequently Asked Questions
    url: https://support.nfl.com/hc/en-us/articles/53607952866324-NFL-Gift-Card-via-TAPPP-Frequently-Asked-Questions
    quotes:
      - 'To redeem your NFL+ Premium gift card, follow the steps below:'
# Renewal day (M11.5): its subscription terms (5(d)) renew a yearly plan on the anniversary of the day you bought it,
# and its pause article's example renews a monthly one on the same day each month.
renewalAnchor:
  kind: same-date
  page: NFL – Subscription, Authentication and Mobile Products Terms and Conditions
  url: https://www.nfl.com/legal/subscriptions_terms/
  quotes:
    - 'will continue for one year and automatically renew each year on the anniversary of your Start Date'
  lastVerified: 2026-11-13
freeUse:
  kind: none
  pages:
    - https://www.nfl.com/plus
    - https://support.nfl.com/hc/en-us/articles/35869713822100-What-is-NFL
  lastVerified: 2026-11-13

# General features, read 2026-11-13. Platforms: "TV, PC, PHONE & TABLET" (the plan cards), and iPhone, iPad, Apple TV,
# Android phones, tablets and TV, Roku, Fire TV, Xbox Series S and X, and Vizio, LG and Samsung TVs (Which devices are
# compatible with NFL+?). Sign-in: an NFL account's email and password, or "a biometrics passkey" (Using biometric
# authentication as an alternative to a password); Google, Apple and Facebook sign-in were removed (How to remove social
# login from NFL.com?). App languages: English (nfl.com/plus, its plan picker and its help centre, whose only locale is
# en-us). Audio: "All content in NFL+ and NFL+ Premium is available in English. Certain content is available in SAP."
# (What language streams are available…?). Support: a request form, email (support@nfl.com), chat and a phone line
# answered by a voice assistant (Contact Us).
features:
  platforms: [web, ios, android, tv, console]
  account.sign-in: [password, passkey]
  languages.interface: [en]
  languages.audio: [en]
  support.channels: [email, chat, phone]

