    - topic: privacy.children
      tier: neutral
      reason: 'You must be 18 to make an account, and it deletes information it learns a child gave it. It doesn’t sell under-16s’ data for ads, and has no parental controls.'
      sources:
        - url: https://id.nfl.com/account/sign-up
          quote: 'I confirm that I am at least 18 years of age.'
        - url: https://www.nfl.com/legal/privacy/
          quote: 'If the NFL learns that a child has provided personal information under this Privacy Notice, the NFL will delete it or otherwise comply with applicable law.'
