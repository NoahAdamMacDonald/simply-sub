# Features in depth, read 2026-11-13 and 2026-11-14 (the pages in each line):
# - AI on the paid plans, from its AI credits article (support.microsoft.com/en-us/topic/68530f1a-…, "How AI usage works
#   across Microsoft 365 subscriptions for individuals", last updated October 2026), whose table gives Personal, Family,
#   Premium and Pro "Chat", "Deep reasoning", "Pages", "Audio Overview", "Voice", "Vision" and "Image gen", and Premium and
#   Pro "Researcher", "Analyst" and "Cowork (in preview)*" ("*Currently only available in the US and Canada."). Voice:
#   "Copilot Voice … Work or school and personal accounts", its data for "Personal, Family, Premium, and Pro accounts"
#   (Get started with Copilot Voice). Projects: "Copilot Notebooks is also available for Microsoft 365 Personal, Family,
#   Premium, and Pro subscribers." Deep research: "Researcher is currently available to Microsoft 365 Premium and Pro
#   subscribers" ("Deep Research has been retired"). Uses a browser or computer and scheduled tasks: Cowork, "For
#   browser-based tasks, Cowork interacts with websites in a human like way, such as clicking, scrolling, and typing." and
#   "Run prompts on a schedule so recurring tasks happen automatically." (Get started with Microsoft Copilot Cowork for
#   personal accounts (preview)). Office apps: "Word, Excel, PowerPoint, Outlook and OneNote desktop apps with Microsoft
#   Copilot" (every paid card but Basic). Early access: "Microsoft 365 Pro, Premium, Personal, and Family subscribers can
#   opt in to Frontier directly in supported web apps." (the Frontier program page). Audio: "Transform content into
#   engaging listening experiences with AI-generated audio" (the compare table). No video: Copilot Create's table gives
#   "Create a video" "No" for "Personal, Family, Premium, or Pro".
# - AI on the free plan and Basic: "Yes. Microsoft offers a limited free version of Copilot subject to available capacity
#   and limits." (the Copilot plans page's FAQ); the OneDrive table gives Basic "Free version only" for Copilot Chat and AI
#   image generation; "AI features are not available in Microsoft 365 Basic." (the compare page) means the paid AI. The
#   chat and chat history articles apply to "free Copilot Chat" too: "When you are signed in with a personal Microsoft
#   account, Copilot draws on your own content and the web instead." and "Copilot Memory automatically collects key
#   details from your previous chat conversations and remembers it for future conversations."; image generation:
#   "Limited usage with a free Microsoft account" (the compare table). Voice "require[s] an eligible Microsoft
#   subscription" and vision needs Personal, Family or Premium, so the free version has neither; no page gives it
#   reasoning, projects or audio: left out.
# - Every plan: chats on its servers: "Microsoft Copilot keeps your prior conversations with Copilot so you can revisit
#   them or continue them at any time." (Copilot privacy controls). No page offers personal accounts another company's
#   models (Claude in Researcher needs a work account's admin), connectors, an API or a coding agent (Cowork's skills and
#   Code are work accounts'): left out.
# - Office: Word, Excel, PowerPoint, OneNote, Forms ("Quickly create forms and polls") and "Access (PC only)" on the paid
#   plans but Basic, which "Collaborate with others in real time, work offline"; the free account's "web and mobile
#   versions of Word, Excel, PowerPoint, OneDrive, and Outlook" (free apps page), OneNote in the Outlook page's list, and
#   "you can share a link to collaborate in real-time". Teams: "Join group calls and talk for up to 30 hours with up to
#   300 people with Microsoft Teams." (the paid plans; 30 hours is 1,800 minutes). The free Teams' limits weren't read.
# - Storage and email (the OneDrive and Outlook pages): free "15 GB of mailbox storage" and "5 GB of cloud storage";
#   Basic "100 GB of mailbox storage" and "100 GB of secure cloud storage"; Personal "1 TB (1000 GB)"; Family and Premium
#   "2 TB of shared, secure cloud storage", Pro "5 TB of shared, secure cloud storage". From 2026-10-08 new Family and
#   Premium subscribers get 2 TB pooled, existing ones from their renewal on or after 2027-05-02 (Switch between Microsoft
#   365 subscriptions), which is why the OneDrive card and the Outlook FAQ still say "up to 6 TB". One address each
#   ("Get started with a free Outlook.com email today."); Outlook's calendar on every plan ("Outlook email and calendar on
#   web, desktop, and mobile apps"). Ad free: "If you have a paid account, you do not receive ads." (Outlook FAQ) and "If
#   you use Microsoft Copilot and don’t have a Microsoft 365 subscription, you might see advertising in Copilot." (Copilot
#   privacy controls). Mailbox sizes are notes (the registry has no mailbox feature yet).
# - Security (the Defender page): "professional grade, always-on antivirus and anti-phishing scans", "real-time
#   monitoring", "Defender on MacOS includes antivirus protection. Defender on Android includes antivirus and
#   anti-phishing."; on Windows "Antivirus and anti-phishing are provided by Windows Security". OneDrive's "ransomware
#   detection and file recovery" ("files can be recovered for up to 30 days after malicious attacks"). Defender needs
#   "A Microsoft 365 Personal, Family or Premium subscription" (Pro's page lists it too), so Basic and the free plan have
#   none. No page states the kinds of scan or a device count for Defender: left out. Behaviour-based detection (added
#   2026-11-20): Microsoft Learn's "Behavior monitoring in Microsoft Defender Antivirus" "Applies to: ... Microsoft
#   Defender for Individuals" ("It observes process, file, and service activity in real time and detects threats from
#   suspicious behavior"). Windows Security's own features (its scans, Controlled folder access, the firewall) are its
#   free plan's, below, which every Windows PC has whatever the subscription.
# - Sharing: "Microsoft 365 Family, Microsoft 365 Premium, and Microsoft 365 Pro subscribers can share subscription
#   benefits with up to five other people in their family group", and the AI is the owner's only.

# General features, read 2026-11-14. App languages: Office's language packs ("Language Accessory Pack for Microsoft 365":
# Arabic, Chinese, English, French, German, Italian, Japanese, Korean, Portuguese and Spanish "Full", Hindi "Partial").
# Parental controls on every plan: "They can use tools like Microsoft Family Safety or settings on your device" to "Block
# access to the Copilot app or Copilot via browser." (Copilot for young people) and Family Safety's "digital content
# filtering, screen time limits" (privacy statement). No pause: its cancelling and switching articles offer cancelling,
# switching or turning off recurring billing only.
# Apps and sign-in: Windows, macOS, iPhone and iPad, Android and the web ("Works on PC, Mac, iPhone, iPad, and Android phones
# and tablets"; the Copilot app on "Windows and Mac", the web and "iOS and Android"). A Microsoft account: a password,
# passkeys ("Face, Fingerprint, PIN, or Security Key"), Microsoft Authenticator's approval or an authenticator app's codes,
# and codes by email or text, which Microsoft is "phasing out" ("How to use two-step verification", "Create and save a
# passkey"); Copilot alone also takes an Apple ID or a Google Account. Support: its pages promise "Ongoing support" and
# route you through "Contact Microsoft Support" without naming channels, so support.channels is left out (Xbox Game Pass's
# precedent).
features:
  platforms: [windows, macos, android, ios, web]
  account.sign-in: [password, passkey, push-approval, security-key, totp, email-code, sms]
  languages.interface: [en, fr, es, de, it, pt, ja, ko, zh, hi, ar]

