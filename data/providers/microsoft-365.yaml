  # Microsoft Authenticator, read 2026-11-19 (the full catalog run, passwords batch 2) on support.microsoft.com's
  # Authenticator help (About, Download, Add accounts, How to sign in, Import and Export passwords, Back up and Restore,
  # FAQs), Microsoft's Authenticator page, its 2019 Entra blog post on backup (techcommunity.microsoft.com, read in a
  # headed Edge once its automatic check cleared), the Microsoft Identity bounty page and the app's store listings.
  # Microsoft's own app, so a free plan of Microsoft's provider (Bitwarden's and Proton's authenticators' precedent):
  # "Microsoft Authenticator is a free app that helps you sign in to all your accounts without using a password" (About).
  # - Platforms: iPhone and Android only ("Microsoft Authenticator is not available for PC or Mac, because authenticator
  #   apps are designed for smartphones for security reasons.", Download; no Apple Watch or Wear OS, its FAQs).
  # - Password autofill ended: "Autofill on Microsoft Authenticator was discontinued in mid-August 2025." (FAQs), and
  #   "Starting July 2025, the autofill feature in Authenticator will stop working, and from August 2025, passwords will
  #   no longer be accessible in Authenticator." (Import passwords); its "Changes to Microsoft Authenticator autofill"
  #   article now opens Edge's Microsoft Password Manager page. So password-manager is false.
  # - Passkeys: its consumer help names Authenticator only as the QR scanner when you save a Microsoft account passkey
  #   to your phone ("the QR scan button in Microsoft Authenticator (or similar)", Create and save a passkey); passkeys
  #   kept in Authenticator are for work or school accounts ("passkeys in Microsoft Authenticator for Microsoft Entra
  #   ID", Microsoft Learn), out of scope. No registry feature records an authenticator's passkeys.
  # - Imports: a site's QR code or key ("Select Personal account then tap Scan a QR Code."; "Enter code manually", Add
  #   accounts), so otpauth. No page offers other apps' files or Google Authenticator's export.
  # - Exports: none, so authenticator.export is empty: its cloud backup restores only into Authenticator on the same
  #   kind of phone ("You can only back up and restore on the same device type: accounts backed up using an iOS device
  #   cannot be restored on an Android device.", Back up), and its export article says "Only passwords can be
  #   exported." Android's backup moves to Google One from January 2027 ("Starting January 2027, you will no longer use
  #   your Microsoft personal account to enable backup.").
  # - Not end-to-end encrypted: the backup is locked with a key Microsoft's own service hands out ("The Authenticator app
  #   uses a strong authentication token to request a 256-bit key from an internal Microsoft account key service.", the
  #   2019 post), so encryption.end-to-end is left out.
  - id: microsoft-365.authenticator
    name: Authenticator
    link: https://www.microsoft.com/en-ca/security/mobile-authenticator-app
    categories: [passwords]
    features:
      platforms: [android, ios]
      password-manager: false
      authenticator.included: true
      authenticator.import: [otpauth]
      authenticator.export: []
    notes: 'Microsoft Authenticator: free, for iPhone and Android. Two-factor codes for any site, and sign-in approvals or passwordless sign-in for your Microsoft account. Its optional cloud backup restores only on the same kind of phone. Its password autofill ended in August 2025: passwords now live in Edge.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-19
        sourceUrl: https://support.microsoft.com/en-us/authenticator/about-microsoft-authenticator

  # Windows Security, read 2026-11-20 (the full catalog run, security batch 2) on support.microsoft.com's Windows
  # Security articles (Stay protected, Virus and threat protection, App and browser control, Family options) and Microsoft
  # Learn's behaviour-monitoring article. The app a person uses on every Windows 10 and 11 PC: "The Windows Security app is
  # a comprehensive security solution integrated into Windows" with "Microsoft Defender Antivirus, Windows Firewall, and
  # Smart App Control" (Stay protected), so a free plan of Microsoft's provider (Authenticator's precedent; Wikidata's
  # Microsoft Defender). That it costs nothing beyond Windows itself is inferred from "integrated into Windows": no page
  # read gives it a price.
  # - Real-time: "Real-time protection is a feature in the Windows Security app that continuously monitors your device".
  # - Behaviour: "Behavior monitoring is a critical Microsoft Defender Antivirus detection and protection capability",
  #   "enabled by default" (Learn).
  # - Scans: quick, full and custom scans you start, "scheduled scans will continue to run", and the offline scan, which
  #   "happens after a restart, without loading Windows" (Microsoft Defender Offline: a boot-time scan).
  # - Ransomware: Controlled folder access ("This is a powerful tool to make your files safer from ransomware", off until
  #   "you turn on Controlled folder access") and Ransomware data recovery, which restores files from OneDrive.
  # - Web: Microsoft Defender SmartScreen "protects from phishing attacks, malware, and potentially unwanted
  #   applications" (App and browser control). Firewall: "the firewall feature monitors incoming and outgoing network
  #   traffic". Family options ("easy access to tools to manage your family’s digital life") open the Family Safety
  #   website and app, another Microsoft service, which its label says. Exploit protection and Smart App Control: no
  #   feature.
  # No device count (each Windows PC has its own), no Mac, phone, VPN or identity features (those are Defender's, with the
  # paid plans).
  - id: microsoft-365.windows-security
    name: Windows Security (Microsoft Defender Antivirus)
    link: https://support.microsoft.com/en-us/windows/security/windows-security/stay-protected-with-the-windows-security-app
    categories: [security]
    features:
      platforms: [windows]
      antivirus.included: true
      antivirus.real-time: true
      antivirus.behavioural: true
      antivirus.scans: [on-demand, scheduled, rescue]
      antivirus.ransomware: [blocking, file-recovery]
      antivirus.web-protection: true
      antivirus.network: [firewall]
      account.parental-controls: true
    featureLabels:
      antivirus.ransomware: Controlled folder access (off until you turn it on) and recovery from OneDrive
      antivirus.web-protection: Microsoft Defender SmartScreen
      antivirus.scans: Quick, full and custom scans, scheduled scans and the offline (boot-time) scan
      account.parental-controls: Opens Microsoft Family Safety
    notes: 'Built into Windows 10 and 11 at no extra cost: Microsoft Defender Antivirus with real-time and behaviour-based protection, Windows Firewall, SmartScreen against phishing and bad downloads, and ransomware protection for chosen folders. On Mac and phones, the Defender app needs a paid plan.'
    prices:
      - region: GLOBAL
        currency: USD
        amount: 0
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-11-20
        sourceUrl: https://support.microsoft.com/en-us/windows/security/windows-security/stay-protected-with-the-windows-security-app

