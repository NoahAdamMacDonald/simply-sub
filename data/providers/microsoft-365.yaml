    # Microsoft Authenticator (read 2026-11-19): ratings of its own where the ones above come from Copilot's or
    # Microsoft 365's pages and say nothing about it. Its FAQs' data section (required non-personal usage data, an
    # optional usage data switch, logs sent only with feedback) would grade privacy.data-collection better than the
