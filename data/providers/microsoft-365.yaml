    - topic: privacy.content-access
      plans: [microsoft-365.authenticator]
      tier: neutral
      reason: 'Your Authenticator codes stay on your phone unless you turn on backup. Backups are locked with a key from Microsoft’s own key service, so Microsoft could open them.'
      sources:
        - url: https://support.microsoft.com/en-us/authenticator/microsoft-authenticator-faqs
          quote: 'This data is stored on your device and can be removed by removing your account.'
        - url: https://techcommunity.microsoft.com/blog/microsoft-entra-blog/how-it-works-backup-and-restore-for-microsoft-authenticator/1006678
