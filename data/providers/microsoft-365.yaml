    # AI training: Microsoft's privacy statement says only that it "may use your data to develop and train our AI models"
    # and sends you to each product's notice; Copilot's say chats, answers and files don't train its foundation models.
    - topic: privacy.ai-training
      tier: good
      reason: 'Its Copilot help says your chats, its answers and your files don’t train its main (foundation) AI models. Feedback you choose to send may be used to improve Copilot.'
      sources:
        - url: https://support.microsoft.com/en-us/privacy/microsoft-copilot/activity-history
          quote: "Prompts, responses, and your file contents when using the Microsoft Copilot app aren't used to train foundation models."
        - url: https://support.microsoft.com/en-us/privacy/copilot-in-microsoft-365-apps-for-home-your-data-and-privacy
          quote: "Prompts, responses, and your file contents when using Copilot in Microsoft 365 apps aren't used to train foundation models."
        - url: https://support.microsoft.com/en-us/privacy/microsoft-copilot/activity-history
          quote: 'We may use customer feedback, which is optional, to improve Microsoft Copilot, just like we use customer feedback to improve other Microsoft 365 services and Microsoft 365 productivity apps.'
      lastVerified: 2026-11-14
    - topic: privacy.content-access
      tier: bad
      reason: 'People at Microsoft may read your Copilot chats, to keep it safe but also to improve it, and no setting stops that. It tells you not to share anything you don’t want it to see.'
      sources:
        - url: https://support.microsoft.com/en-us/privacy/microsoft-copilot/young-people
          quote: 'Humans may review your conversations in Copilot for safety, legal, product improvement, or troubleshooting.'
        - url: https://www.microsoft.com/en-us/microsoft-copilot/for-individuals/termsofuse
          quote: 'Copilot may include both automated and manual (human) processing of data. You shouldn’t share any information with Copilot that you don’t want us to review.'
      lastVerified: 2026-11-14
    - topic: legal.output-rights
      tier: neutral
      reason: 'Microsoft doesn’t claim what Copilot makes for you, but it may use your chats and its answers to run and improve Copilot.'
      sources:
        - url: https://www.microsoft.com/en-ca/servicesagreement
          quote: "Microsoft doesn't claim ownership of any content you provide, post, input, or submit to, or receive from, the AI services (including feedback and suggestions)."
        - url: https://www.microsoft.com/en-us/microsoft-copilot/for-individuals/termsofuse
          quote: 'We don’t own Your Content, but we may use Your Content to operate Copilot and improve it.'
      lastVerified: 2026-11-14
    - topic: legal.account-closure
      tier: bad
      reason: 'It can cut off your Copilot, and maybe your other Microsoft services, whenever it decides, without warning. You can only ask it to look again.'
      sources:
        - url: https://www.microsoft.com/en-us/microsoft-copilot/for-individuals/termsofuse
          quote: 'Unless prohibited by law, we may limit, suspend, or permanently revoke your access to or use of Copilot (and potentially all other Services) in our sole discretion, at any time and without notice'
        - url: https://www.microsoft.com/en-us/microsoft-copilot/for-individuals/termsofuse
          quote: 'If you feel your access has been restricted by mistake, you may ask us to reevaluate our decision by submitting a request using the Report a Concern form outlining what you think we got wrong and why.'
      lastVerified: 2026-11-14
    - topic: security.practices
      tier: neutral
      reason: 'It pays security experts who find problems in Copilot, but doesn’t say outside experts check its consumer services regularly.'
      sources:
