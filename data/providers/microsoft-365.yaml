# Researched by hand on 2026-11-13 and 2026-11-14 (the full catalog run, AI batch 1), read with Edge from Canada unless
# named, and through a US exit where said. The session's decision (the brand rule: one company, one set of terms, the
# Microsoft Services Agreement): Microsoft's consumer subscriptions are one provider, Microsoft 365, with Copilot's free
# tier and a Microsoft account's free apps as its free plan. Pages, each quoted where it's used:
# Pricing (read 2026-11-13): each country's compare page (microsoft.com/<locale>/microsoft-365/buy/compare-all-microsoft-
# 365-products: Personal, Family and Premium, each "Paid yearly" with "Or buy at" a monthly price), its OneDrive plans page
# (/microsoft-365/onedrive/onedrive-plans-and-pricing: Basic, "Or buy at CAD $2.00 /month") and its Copilot plans page
# (/copilot/pricing/individuals: Pro, "Monthly billing only."), for en-ca, en-us, en-gb, en-ie, en-au, en-nz, de-de, fr-fr,
# nl-nl, es-es and it-it. Each locale's pages price in its own currency whoever reads them (CAD $, £, AU$, NZ$, €); the
# US's bare $ was read again through a US exit (the same $99.99, $129.99, $199.99, $19.99 and $99.99, "English (United
# States)" in its footer). The regular price is the struck-through one ("CAD $115.00 CAD $79.00/first year"): the first
# year's or month's 30% off is a limited-time offer, and the "Try free for 1 month" a trial. Germany calls Personal
# "Microsoft 365 Single", Spain "Personal", "Familia" and "Básico", France "Personnel", "Famille" and "Professionnel".
# Tax: France's pages say "TTC" (all taxes included) after every price; no other locale's pages say whether tax is in.
# Plans (2026-11-13): Personal, Family and Premium on the compare page; Basic (100 GB) on the OneDrive and Outlook pages;
# Pro (5 TB, the highest AI usage) on the Copilot plans page and its own product page, and named in the compare page's FAQ
# ("Microsoft 365 Personal, Microsoft 365 Family, Microsoft 365 Premium, and Microsoft 365 Pro are subscriptions"). Copilot
# Pro is no longer sold: Microsoft's blog of 2025-10-01 ("we’ll no longer sell Copilot Pro—Copilot Pro subscribers can
# switch to Microsoft 365 Premium") and its old store page (microsoft.com/en-ca/store/b/copilotpro) leads to Premium's.
# Personal Classic and Family Classic are existing subscribers' plans (the switching article's table), not sold: left
# out. Office Home 2024 is a one-time purchase: out. Student and military prices are offers: left out (notes.md).
# Microsoft Authenticator joined as a free plan on 2026-11-19 (passwords batch 2: Microsoft's own app, one provider by the
# brand rule), read on its help pages (above the plan).
# Bundles: none. Its PC offers (a Windows PC with a year of Premium and Game Pass, ended 2026-09-30) are device
# promotions, not subscription bundles.
# Official resellers: none named as such. Its cancelling article says "If you purchased a Microsoft 365 subscription from
# a third-party retailer such as Amazon or Harvey Norman, please contact them directly": retail product keys, not an
# approval page (notes.md). App stores bill it (a way to pay, below).
# Region checklist for CA and US, 2026-11-13: 1. each locale's path (/en-ca/, /en-us/), each priced in its own currency;
# 2. its footer's locale picker (the same paths); 3. no page data names a currency (curl of en-us: "$99.99" only), so the
# US was read through a US exit too; 4. the checkout wasn't opened; 5. its refund policy names Canada; 6. Edge and a plain
# fetch; 7. no bill offered.
# Not on the pages: the card networks (its payment article names "credit card, debit card" only); the countries it sells
# in (no list read); which regions lack Defender ("Defender is not available in certain regions").
# Windows Security joined as a free plan on 2026-11-20 (security batch 2: Wikidata's Microsoft Defender, Microsoft's own
# app, one provider by the brand rule), read on support.microsoft.com's Windows Security articles with a plain fetch and
# Microsoft Learn's "Behavior monitoring in Microsoft Defender Antivirus" (above the plan). Defender's US page, read
# 2026-11-20 through a US exit, adds US-only identity features to Personal, Family and Premium: "Identity theft
# monitoring" (dark web scans), "24/7 identity theft support", "up to $1 million identity insurance coverage" and credit
# monitoring ("Feature available in the United States and US territories. Credit score is a single bureau VantageScore 3.0
# provided by Experian®."). They aren't stated on these plans, which are one plan for every country: a US-only plan would
# move the US prices off published ids (a question for the owner, notes.md).

id: microsoft-365
name: Microsoft 365
aliases:
  [
    Microsoft Copilot,
    Copilot,
    Office 365,
    OneDrive,
    Outlook.com,
    Microsoft Authenticator,
    Microsoft Defender,
    Windows Security,
  ]
website: https://www.microsoft.com/microsoft-365
category: software
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: NZD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help article on cancelling (account.microsoft.com/services/microsoft365, then Cancel subscription).
cancelUrl: https://support.microsoft.com/en-us/accounts-billing/subscriptions/cancel-a-microsoft-365-subscription
sources:
  { pricing: https://www.microsoft.com/en-ca/microsoft-365/buy/compare-all-microsoft-365-products }
# Ways to pay (M11.5), read 2026-11-14 in Microsoft's support article on the account it bills (Xbox Game Pass's page): a
# credit or debit card, a bank account, PayPal, a mobile phone or Microsoft gift cards, though "Not all payment methods
# are supported in all regions"; its mobile operator billing table lists Canada (Telus), France, Germany, Italy, the
# Netherlands and the UK among the regions here. Its cancelling article adds Google Play and the Apple App Store. No page
# names the card networks, so acceptedNetworks is left out.
paymentMethods:
  - methods: [card, bank-transfer, paypal, gift-card]
    page: 'Add a payment method to your Microsoft account'
    url: https://support.microsoft.com/en-us/accounts-billing/add-a-new-bank-or-credit-card-to-your-microsoft-account
    quotes:
      - 'You can add your credit card, debit card, bank account, PayPal account, or mobile phone as a new payment method.'
      - 'To add a Microsoft gift card to your account, go to redeem.microsoft.com.'
      - 'Not all payment methods are supported in all regions.'
  - methods: [card, bank-transfer, paypal, gift-card, provider-billing]
    regions: [CA, GB, DE, FR, IT, NL]
    page: 'Add a payment method to your Microsoft account'
    url: https://support.microsoft.com/en-us/accounts-billing/add-a-new-bank-or-credit-card-to-your-microsoft-account
    quotes:
      - 'You can add your credit card, debit card, bank account, PayPal account, or mobile phone as a new payment method.'
      - 'To add a Microsoft gift card to your account, go to redeem.microsoft.com.'
      - 'Not all payment methods are supported in all regions.'
      - 'The Microsoft Store offers mobile operator billing as a payment method in various countries/regions.'
  - methods: [app-store]
    page: 'Cancel a Microsoft 365 subscription'
    url: https://support.microsoft.com/en-us/accounts-billing/subscriptions/cancel-a-microsoft-365-subscription
    quotes:
      - 'If you purchased a Microsoft 365 subscription from Google Play or the Apple App Store, contact their customer support for cancellation or refund.'
# Owner (M11.2), read 2026-11-14: Microsoft's 2026 annual report, on its own site, names Microsoft 365 Consumer
# subscriptions and Copilot among its products; its services agreement names Microsoft Corporation as the company you
# contract with for consumer services (Canada's version); its investor FAQ names the listing. No page read names a
# majority holder.
