          quote: 'In some countries/regions, Microsoft may offer a prorated refund when an eligible subscription is cancelled after billing, in line with local consumer protection rules.'
        - url: https://support.microsoft.com/en-us/accounts-billing/subscriptions/microsoft-subscription-refund-policy
          quote: 'To receive a prorated refund, cancel at any time.'
      lastVerified: 2026-11-14
    - topic: billing.free-trials
      tier: poor
      reason: 'Its month free turns into a paid plan unless you cancel before it ends. It may ask for your payment details first, and it doesn’t promise to remind you.'
      sources:
        - url: https://www.microsoft.com/en-ca/copilot/pricing/individuals
          quote: 'Trial availability, duration, eligibility requirements, and whether payment information is required vary by offer and region.'
        - url: https://www.microsoft.com/en-ca/store/b/terms-of-sale
          quote: 'If you are taking part in any trial-period offer, you must cancel the service by the end of the trial period to avoid incurring new charges unless we notify you otherwise.'
        - url: https://support.microsoft.com/en-us/accounts-billing/subscriptions/cancel-your-free-trial-of-microsoft-365
          quote: "You can cancel your Microsoft 365 trial within 30 days of signing up, and you won't be charged."
