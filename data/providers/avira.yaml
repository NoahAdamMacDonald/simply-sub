# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with a plain fetch from Canada. Every agreement a user accepts:
# the subscription details on every avira.com page ("Subscription contracts begin when the transaction is complete and
# are subject to our Terms of Sale and License & Services Agreement"); its Legal page lists them by region: the Terms of
# Sale for "Europe, Middle East, and Africa" (avira.com/en/avira-terms-of-sale) and the "Americas"
# (/standard-terms-conditions-business-us), the License and Services Agreement for "Europe, Middle East, and Africa"
# (/avira-license-services-agreement, Gen's newer one) and for the "Americas, Asia-Pacific, and Japan"
# (/end-user-license-agreement-terms-of-use-2021, its Section II for everyone outside Germany, Austria and Switzerland),
# its Cancellation and Refund Policy, its help centre's billing articles, its Product Privacy Notice and Gen's General
# Privacy Notice, which its Privacy Center follows ("we follow our group General Privacy Notice which includes
# information broadly applicable across all Gen brands, services and products"), rated once as a shared document
# (data/policies/gen-digital-privacy.yaml). The provider-wide ratings take the worse of the two regions' documents; the
# European ones (the UK, Ireland and the euro countries) are rated for those regions where they're better. The
# Americas Terms of Sale hold the provider-wide grade for changes to the terms (§3: "effective immediately"); their
# refund and renewal terms repeat the licence's. Read but holding no topic of its own: its Right of Withdrawal page (it
# repeats the refund terms). Not read: the 2021 licence's Section I (German, for Germany, Austria and Switzerland),
# Cleverbridge's own Terms & Conditions (its checkout's reseller), the checkout's agreement line (seen, not opened) and
# the Asia-Pacific Terms of Sale.
policies:
  shared: [gen-digital-privacy]
  links:
    - name: 'License and Services Agreement (Americas, Asia-Pacific)'
      url: https://www.avira.com/en/end-user-license-agreement-terms-of-use-2021
    - name: 'License and Services Agreement (Europe)'
      url: https://www.avira.com/en/avira-license-services-agreement
    - name: 'Terms of Sale (Europe)'
      url: https://www.avira.com/en/avira-terms-of-sale
    - name: 'Terms of Sale (Americas)'
      url: https://www.avira.com/en/standard-terms-conditions-business-us
    - name: 'Cancellation and Refund Policy'
      url: https://www.avira.com/en/cancellation-and-refund-policy
    - name: 'Subscription details'
      url: https://www.avira.com/en/legal-terms
    - name: 'Cancel or activate automatic renewal'
      url: https://support.avira.com/hc/en-us/articles/360000924057-How-do-I-cancel-or-activate-Automatic-Renewal-for-my-Avira-subscription
    - name: 'Cancelling a renewal early'
      url: https://support.avira.com/hc/en-us/articles/360001272298-What-happens-with-my-license-if-I-cancel-my-Avira-subscription-renewal-early
    - name: 'Payment methods for trials'
      url: https://support.avira.com/hc/en-us/articles/360000934758-Why-do-I-need-a-payment-method-to-start-an-Avira-trial
    - name: 'What is Avira Prime?'
      url: https://support.avira.com/hc/en-us/articles/360000786705-What-is-Avira-Prime
    - name: 'Product Privacy Notice'
      url: https://www.avira.com/en/privacy-policy/product
    - name: 'Checkout (Canada)'
      url: 'https://e-shop.avira.com/checkout?product=1955&language=en&runtime=12&users=1&x-subscription-type=annual'
    - name: 'Report a security vulnerability (Gen)'
      url: https://www.gendigital.com/ca/en/contact-us/report-a-potential-security-vulnerability/
  ratings:
    - topic: billing.cancellation
      tier: neutral
      reason: 'You can stop it renewing in your Avira account, but its licence for the Americas and Asia-Pacific asks for three months’ notice before your term ends, where its help pages only say before the billing date.'
