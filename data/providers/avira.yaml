# Categories (M11.3): an antivirus first (security). Every plan but Phantom VPN Pro has its password manager (Free
# Security's "Use our onboard Password Manager to keep track of all your passwords", Antivirus Pro's "Avira Password
# Manager to create strong passwords", Internet Security's and Prime's Password Manager Pro), so it's in passwords too.
# Prime has Phantom VPN Pro, unlimited, so it's a VPN plan as well; Free Security and Antivirus Pro have the free Phantom
# VPN, "restricted to 500 MB/month of data, or 1 GB/month if you register" (the VPN Pro page), so they aren't (notIn).
# General features, read 2026-11-13: Prime's "Get access to all our products across all platforms, including PC, Mac,
# Android, iOS, and web browsers"; Antivirus Pro "For Windows and Mac."; Internet Security is "for Windows". Sign-in,
# support channels and app languages: no page read lists them for every plan (Antivirus Pro's "customer support via a
# toll-free number or email" is the paid plans').
features:
  platforms: [windows, macos, android, ios]

# Perks (M11.6): Prime's lines no feature describes, in its page's words.
perks:
  - id: safe-shopping
    name: Secure price comparison tool
  - id: vip-support
    name: VIP customer support

# Features in depth, read 2026-11-13:
# - Antivirus Pro's page: "Avira Antivirus Pro and Avira Free Antivirus utilize the same high-performance scan engine and
#   the same AI-powered cloud-based detection system for real-time malware protection"; "Heuristic detection" (its
#   detection system: behaviour-based detection, for Free too); "You can also start system scans manually" and "You can
#   also create schedules for your scans, specifying the frequency, day, and time" (Pro); the Avira Firewall ("Windows
#   feature"); Web Protection, which "scans the websites you want to visit for potentially harmful content — or checks
#   if they’re classified as phishing or spam"; "ANTI-RANSOMWARE"; Smart Scan's "outdated software, network threats,
#   privacy vulnerabilities, and performance issues"; and "Avira Antivirus Pro also includes Avira Phantom VPN for secure
#   and anonymous surfing, Avira Password Manager to create strong passwords, Avira Software Updater for Windows that
#   makes it a breeze to update your programs, apps, and drivers as well as Avira System Speedup".
# - Free Security's page: "a built-in, powerful anti-ransomware", "Update outdated and vulnerable apps easily with one
#   click", "Avira Free Security scans your home network for vulnerabilities", its browser extension's protection "from
#   phishing attempts, harmful websites" and "hidden trackers", "Erase sensitive data securely", "Free up space on your
#   device" and its password manager ("Generate and securely store unhackable passwords"). No scheduled scans named.
# - Internet Security's page: Password Manager Pro ("Alerts you if your account was breached", "Identifies weak
#   passwords across all your accounts", "Tells you which accounts use the same passwords"), Software Updater Pro
#   ("Automatically patches your security holes"), Browser Safety ("Prevents ad networks from tracking you online"), and
#   Free Security's card for it: "Alerts you if your data was leaked in a security breach".
# - Prime: "Everything in Internet Security Suite" and "Premium mobile apps for Android & iOS" (Free Security's cards),
#   "Unlimited VPN", "PC cleaner", "Security for Smartphones: Blocks phishing websites and unwanted callers" (its page);
#   its help centre's "an android remote tracking tool to find a misplaced, lost or stolen smartphone"; Antivirus Pro's
#   page on the premium Android app: "camera and microphone protection". "One subscription covers up to 25 devices"
#   (5 or 25, its two options).
# - Phantom VPN Pro (avira.com/en/vpn-pro): "1400 servers in 36 countries around the world" with its list (Isle of Man
#   among them; its help centre's list of "virtual locations" names 35, without it), "Unlimited data", "Kill switch
#   (Windows Feature)", "P2P file sharing", "Avira has a no-log policy and doesn’t know what websites you visit" (no audit
#   named), "Get unlimited, secure traffic on all your devices", with no count: its checkout's "1 device / Yearly
#   subscription" is the link's users=1 echoed back, so vpn.devices waits for a help article that states it. Protocols,
#   split tunneling and multi-hop: no page read states them.
