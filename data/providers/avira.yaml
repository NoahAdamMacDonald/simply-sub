# Researched by hand on 2026-11-13 (M11.15, security batch 1), read with Edge from Canada and through each research
# country's exit (its product pages and the price data they load), with a plain fetch (its legal pages, product pages'
# features, and its help centre through its Zendesk API) and Gen Digital's pages. Pages, each quoted where it's used:
# Pricing: its product pages (avira.com/en/antivirus-pro, /internet-security, /prime, /vpn-pro, /buy-antivirus), which
# price by where the visitor is: the prices they show come from avira.com's own pricing data, which names the country
# and currency it priced ("country=GB" ... "currency":"GBP"), read 2026-11-13 through a US, UK, Irish, Australian, New
# Zealand, German, French, Dutch, Spanish and Italian exit. New Zealand is priced in US dollars ("US$109.99",
# "country=NZ" and "currency":"USD"); the five euro countries' prices are the same. Canada isn't priced on avira.com: read
# from Canada, its data asks for the US's prices ("country=US", a bare "$"). Its checkout (shop.avira.com, run by its
# online reseller Cleverbridge) prices Canada in Canadian dollars ("Canadian Dollar", "COUNTRY: Canada", "SUBTOTAL: CA$
# 124.00" for Prime before GST and QST), read 2026-11-13 from Canada for each plan's monthly and yearly options up to
# the payment form: Canada's prices are the checkout's, before tax, its sourceUrl the checkout link avira.com's buttons
# use. The regular price is the one each card names ("Automatically renews at £94.99 / year, unless the renewal is
# cancelled."); the first year's is an offer. The "2 Years" option is a first term that renews yearly ("$204.99 / First
# 2 Years", "Automatically renews at $109.99 / year"), so monthly and yearly are stored. No product page says its prices
# include tax (its European Terms of Sale say "Our advertised prices and the final price displayed prior to your
# confirmation of your order are inclusive of VAT", not on the pages that price them).
# Region checklist for CA and US, 2026-11-13: 1. avira.com has language paths (/en/, /de/...), no country paths; 2. no
# country or currency picker; 3. its pricing data names the country (country=US from Canada); 4. the checkout, up to the
# payment form, names Canada and CA$; 5. its help centre's payment and renewal articles; 6. Edge, the netlog of its
# own data, and a US exit; 7. no bill offered.
# Not drafted (notes.md): Antivirus Pro's and Internet Security's 3- and 5-device options (their device menus didn't
# answer the reader outside Canada and the US: Antivirus Pro's US$77.99 and US$90.99 a year, CA$88 and CA$102 at
# Canada's checkout), Phantom VPN Pro's mobile plan (in-app, US$5.99 a month), Prime Mobile for Android and iOS (in-app),
# Mobile Security Pro, Password Manager Pro, System Speedup Pro, Software Updater Pro, Optimization Suite, Safe Shopping
# and Secure Browser.
# Bundles: Prime is its own suite (a plan, includes-subscription). Official resellers: none named; Cleverbridge is the
# online reseller that runs avira.com's own checkout ("This order process is conducted by our online reseller
# Cleverbridge GmbH"), not a shop of its own. App stores bill its mobile plans (partners, not listed).
# Free use: Free Security (its plan below).

id: avira
name: Avira
website: https://www.avira.com
category: security
spendCategory: software
billingCurrency:
  {
    CA: CAD,
    US: USD,
    GB: GBP,
    IE: EUR,
    AU: AUD,
    NZ: USD,
    DE: EUR,
    FR: EUR,
    NL: EUR,
    ES: EUR,
    IT: EUR,
    GLOBAL: USD,
  }
# Its help centre's "How do I cancel or activate Automatic Renewal for my Avira subscription?": "Click Cancel
# Subscription Renewal." in your account's Subscriptions.
cancelUrl: https://support.avira.com/hc/en-us/articles/360000924057-How-do-I-cancel-or-activate-Automatic-Renewal-for-my-Avira-subscription
sources: { pricing: https://www.avira.com/en/buy-antivirus }
# Owner (M11.2), read 2026-11-13: its License and Services Agreement says "The Avira products and services are part of
# Gen Digital Inc."; every avira.com page's footer: "Avira is part of Gen - a global company with a family of trusted
# brands." Its contracts are Avira Inc.'s in the Americas and Avira Holding GmbH's (Tettnang, Germany) elsewhere. Gen's
# Who We Are page names its headquarters; its country is the US, as Norton's, Avast's and AVG's (notes.md). Shares:
# Gen's investor FAQs.
owner:
  name: Gen Digital Inc.
  website: https://www.gendigital.com
  page:
    name: 'License and Services Agreement'
    url: https://www.avira.com/en/avira-license-services-agreement
  quotes:
    - 'The Avira products and services are part of Gen Digital Inc.'
  country:
    code: US
    page:
      name: 'Who We Are (Gen)'
      url: https://www.gendigital.com/us/en/who-we-are/
    quotes:
      - 'Our global workforce has dual headquarters in Prague, Czech Republic and Tempe, Arizona, USA.'
    lastVerified: 2026-11-13
  stock:
    listings:
      - { exchange: Nasdaq, symbol: GEN }
    page:
      name: 'Investor FAQs (Gen)'
      url: https://investor.gendigital.com/resources/investor-faqs/default.aspx
    quotes:
      - 'Gen’s ticker symbol is GEN.'
      - 'Gen’s common stock is traded on the Nasdaq Global Select Market.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay and card networks (M11.5), read 2026-11-13 in its help centre's "What payment options does Avira offer?"
# (its online shop: Visa, Mastercard and American Express cards, PayPal, and direct debit in Germany only) and its
# in-app purchase article (the App Store, Google Play and the Microsoft Store bill its in-app plans). Canada's checkout
# showed "Credit card" as its payment option.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard, amex]
    url: https://support.avira.com/hc/en-us/articles/360002939213-What-payment-options-does-Avira-offer
    quotes:
      - 'Credit card (Visa, MasterCard and American Express)'
paymentMethods:
  - methods: [card, paypal]
    page: 'What payment options does Avira offer?'
    url: https://support.avira.com/hc/en-us/articles/360002939213-What-payment-options-does-Avira-offer
    quotes:
      - 'Credit card (Visa, MasterCard and American Express)'
      - 'PayPal'
  - methods: [app-store]
    page: 'Canceling an Avira plan in-app purchase'
    url: https://support.avira.com/hc/en-us/articles/4417171208849-Canceling-an-Avira-plan-in-app-purchase-on-the-Apple-App-Store-Google-Play-Store-or-Microsoft-Store
    quotes:
      - 'If you subscribed to an Avira plan through an in-app purchase, you can cancel or change your subscription settings only from the Apple App Store, Google Play Store, or Microsoft Store.'
  - methods: [card, paypal, bank-transfer]
    regions: [DE]
    page: 'What payment options does Avira offer?'
    url: https://support.avira.com/hc/en-us/articles/360002939213-What-payment-options-does-Avira-offer
    quotes:
      - 'Credit card (Visa, MasterCard and American Express)'
      - 'Direct debit (only in Germany)'
      - 'PayPal'
  - methods: [app-store]
    regions: [DE]
    page: 'Canceling an Avira plan in-app purchase'
    url: https://support.avira.com/hc/en-us/articles/4417171208849-Canceling-an-Avira-plan-in-app-purchase-on-the-Apple-App-Store-Google-Play-Store-or-Microsoft-Store
    quotes:
      - 'If you subscribed to an Avira plan through an in-app purchase, you can cancel or change your subscription settings only from the Apple App Store, Google Play Store, or Microsoft Store.'
# Renewal day (M11.5, M11.21): renewals are billed "up to 35 days before renewal" for yearly plans and "up to 5 days"
# for monthly ones (the subscription details on every avira.com page); its help centre's renewal article says "Yearly
# subscription: 35 days before expiration date." and its European Terms of Sale "up to thirty-five (35) days before the
# annual subscription is due to renew": a new yearly item is charged 35 days early, the earliest it can be.
renewalAnchor:
  kind: same-date
  page: 'Legal'
  url: https://www.avira.com/en/legal-terms
  quotes:
    - 'Renewal payments are billed annually (up to 35 days before renewal) or monthly (up to 5 days before renewal) depending on your billing cycle.'
  chargedBefore: { days: 35, upTo: true }
  lastVerified: 2026-11-13
