# Terms and policies (BLUEPRINT §4.10), read 2026-11-13 with the split-tunnelled Chromium: its Residential Terms of
# Service ("Effective as of November 10, 2026", which cover Streaming App Only, Streaming App + Equipment, Satellite and
# MyFree DIRECTV, and include its Fee Schedule and, for leased devices, its Equipment Lease Agreement), its Privacy Policy
# (its "Read Policy" link, directv.com/privacy/video-privacy-policy, updated January 1, 2026), its Advertising Notice,
# its Fee Schedule ("Effective as of June 25, 2026"), and its help centre's cancelling, streaming limits, billing,
# payment and parental controls articles. Also read, with nothing worse for these topics: its Website Terms of Use, its
# DIRECTV STREAM Device Terms of Use (for its own devices, which name the AT&T Acceptable Use Policy, not read) and its
# Cookie Notice. Not read: the plan builder and sign-up steps (directv.com/shop answers "Access Denied"), its Biometric
# Information Privacy Notice (its privacy policy says it "may collect biometric information ... like a scan of face
# geometry"), the arbitration PDFs and the included services' own terms. Calibrated against STARZ and YouTube TV.
policies:
  links:
    - name: 'Residential Terms of Service'
      url: https://www.directv.com/legal/directv-residential-terms-of-service/
    - name: 'Privacy Policy'
      url: https://www.directv.com/privacy/video-privacy-policy/
    - name: 'Fee Schedule'
      url: https://www.directv.com/legal/directv-fee-schedule/
    - name: 'Cancel your DIRECTV service'
      url: https://www.directv.com/customer/cancel-help/
    - name: 'Streaming limits'
      url: https://www.directv.com/support/article/000079946
    - name: 'Why is my bill higher than expected?'
      url: https://www.directv.com/support/article/000071814
    - name: 'Update Payment Method for DIRECTV'
      url: https://www.directv.com/support/article/000093622
    - name: 'Set up DIRECTV parental controls'
      url: https://www.directv.com/support/article/000093537
    - name: 'MyFree DIRECTV'
      url: https://www.directv.com/myfree-directv/
    - name: 'Streaming with your own device'
      url: https://www.directv.com/stream/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It studies how you and your household use DIRECTV, with session replay on its websites, and to keep you as a customer. You can only switch off parts, such as Nielsen’s measuring, device by device.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'We use your information to conduct analytics relating to you, and to your use of our Products and Services.'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'We use session replay, screen capture, and similar tools'
        - url: https://www.directv.com/legal/directv-residential-terms-of-service/
          quote: 'Remember, if You want to opt out, You must follow the above steps on each of Your devices.'
      action:
        name: 'Your Privacy Choices'
        url: https://www.directv.com/privacy/choices/
      lastVerified: 2026-11-13
    - topic: privacy.data-sharing
      tier: bad
      reason: 'It may sell or share what you watch, your interests and your demographics with other companies for their own ads. Only people in some states can opt out of that.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'We may also sell or share the information we collect, including your viewing information, demographic information, and information about your general and specific interests, with business customers for their own advertising or marketing uses'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'to opt out of the sale and sharing of personal information under certain state privacy laws'
      lastVerified: 2026-11-13
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'Every subscriber gets ads picked from what they watch, unless they opt out in its privacy center. Ads elsewhere follow you through cookies and device IDs, which you turn off browser by browser or in each device’s settings.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'by default all DIRECTV subscribers are enrolled in Personalized Advertising'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'To manage Personalized Advertising, including to opt out, please visit our subscriber Privacy Preference Center and log in.'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'You may limit the sharing of information with your Device advertising ID (Apple or Android devices) in the App through your device settings'
      action:
        name: 'Your Privacy Choices'
        url: https://www.directv.com/privacy/choices/
      lastVerified: 2026-11-13
    - topic: privacy.ai-training
      tier: bad
      reason: 'What you type to its chat tools or say to its assistants can be kept and used to train its AI, and its policy offers no way to say no.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'When you use our Products and Services, or interact with their features, like chatbots, digital assistants, or other tools powered by AI, we may process your information using automated and manual (human) methods, including training our AI and machine learning models using your information.'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'We may collect information you enter into the chat box and retain transcripts for the uses described in this Policy.'
      lastVerified: 2026-11-13
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your information as long as its business needs it. It names upper limits: account records up to 10 years after you leave, marketing data up to 6 years.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'We keep your information as long as we need it for business, tax, or legal purposes.'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'Personal information collected for purposes like maintaining your account (e.g., sales and billing information) is retained while we have a relationship with you, plus a period of no more than 10 years after that relationship ends;'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'Personal information collected for marketing purposes is generally retained for a maximum period of 6 years; and'
      lastVerified: 2026-11-13
    - topic: privacy.data-deletion
      tier: poor
      reason: 'Only people in the states with privacy laws it lists can ask it to delete their information, and with exceptions. It offers no way for everyone else.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'Subject to certain exceptions, the right to delete personal information that we have collected from you.'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'You have additional privacy choices if you live in one of these states.'
      action:
        name: 'Your Privacy Choices'
        url: https://www.directv.com/privacy/choices/
      lastVerified: 2026-11-13
    - topic: privacy.data-portability
      tier: poor
      reason: 'Only people in the states with privacy laws it lists can ask what information it has about them. It offers no way to download it.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'The right to know what personal information we have collected about you'
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'You have additional privacy choices if you live in one of these states.'
      action:
        name: 'Your Privacy Choices'
        url: https://www.directv.com/privacy/choices/
      lastVerified: 2026-11-13
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over subscribers’ information for court orders and subpoenas, following legal process, and tells you first only where the law requires and it can.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'We may disclose subscriber personal information in response to lawful requests, such as court orders, subpoenas, and discovery requests, and will follow appropriate legal process, including providing affected subscribers with prior notice where legally required and where legally permitted and practicable.'
      lastVerified: 2026-11-13
    - topic: privacy.data-location
      tier: poor
      reason: 'Your information can be kept in the United States or other countries it doesn’t name, and it describes no safeguards for moving it.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'Information we collect may be processed and stored in the United States or in other countries where we or our affiliates or service providers process information.'
      lastVerified: 2026-11-13
    - topic: privacy.sign-up-data
      tier: neutral
      reason: 'MyFree needs only an email address. A paid plan adds a card and its billing address, which becomes your service address. Its sign-up pages refused this reader.'
      sources:
        - url: https://www.directv.com/myfree-directv/
          quote: 'All that’s needed is your email address to register your account.'
        - url: https://www.directv.com/support/article/000093622
          quote: 'Enter your billing address associated with your payment method; this is used as your DIRECTV service address.'
      lastVerified: 2026-11-13
    - topic: privacy.children
      tier: neutral
      reason: 'It doesn’t knowingly collect information from anyone under 18; children watch on a parent’s account, and a PIN can lock shows by rating. It says nothing more about children’s data.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'We do not knowingly collect personal information from anyone under the age of 18.'
        - url: https://www.directv.com/legal/directv-residential-terms-of-service/
          quote: 'If someone is under the applicable age of majority, they can still utilize the Service with the involvement of a parent or legal guardian, under that parent or guardian’s account and following these Terms.'
        - url: https://www.directv.com/support/article/000093537
          quote: 'It’s easy to set up a four-digit personal identification number (PIN) to control who can watch shows with specific content ratings.'
      lastVerified: 2026-11-13
    - topic: security.practices
      tier: poor
      reason: 'It says only that it has safeguards and can’t guarantee your information’s protection. It names no outside checks and no way to report a security problem.'
      sources:
        - url: https://www.directv.com/privacy/video-privacy-policy/
          quote: 'Though we cannot guarantee the protection of your information, we’ve established safeguards designed to secure information we collect.'
      lastVerified: 2026-11-13
    - topic: billing.cancellation
      tier: good
      reason: 'You can cancel online by signing in, or by chat or phone, where it may first offer you a better deal. You keep watching until the end of the billing cycle.'
      sources:
        - url: https://www.directv.com/customer/cancel-help/
          quote: 'If you get your DIRECTV service over the internet (no satellite dish) sign in and select "Cancel service".'
        - url: https://www.directv.com/customer/cancel-help/
          quote: 'Chat now or call us at 800.531.5000. We’ll review your current entertainment package and make sure you’re getting the best value.'
        - url: https://www.directv.com/legal/directv-residential-terms-of-service/
          quote: 'Your cancellation is effective on the last day of the billing cycle in which You cancel.'
      action:
        name: 'Cancel your DIRECTV service'
        url: https://www.directv.com/customer/cancel-help/
      lastVerified: 2026-11-13
    - topic: billing.refunds
      tier: neutral
      reason: 'You get no money back for the rest of the month when you cancel, but you keep watching until the end of the billing cycle.'
      sources:
        - url: https://www.directv.com/legal/directv-residential-terms-of-service/
          quote: 'You will not receive a prorated credit or refund for any partial periods or Content You did not watch when Your Service is cancelled, unless prohibited by law.'
        - url: https://www.directv.com/legal/directv-residential-terms-of-service/
          quote: 'You will receive Service through the Effective Date.'
      lastVerified: 2026-11-13
    - topic: billing.price-changes
      tier: neutral
      reason: 'It can change its prices and fees whenever it decides, and tells you by email or post. Its terms give no lead time for prices; package changes usually come with 30 days’ notice, and you may cancel.'
      sources:
        - url: https://www.directv.com/legal/directv-residential-terms-of-service/
          quote: 'We have the right to change any of Our pricing, fees, or related charges.'
        - url: https://www.directv.com/legal/directv-residential-terms-of-service/
          quote: 'We will notify You of any of these changes at the email or the mailing address registered with Your account, except as otherwise provided by these Terms.'
        - url: https://www.directv.com/legal/directv-residential-terms-of-service/
          quote: 'If the change is within Our control, We usually give You 30 days’ notice.'
      lastVerified: 2026-11-13
    - topic: billing.free-trials
      tier: poor
      reason: 'Its trials need a card up front and turn into a paid plan unless you cancel before they end. It doesn’t say it reminds you first.'
      sources:
        - url: https://www.directv.com/stream/
          quote: 'A valid card is required; a temporary hold may be changed during trial period.'
