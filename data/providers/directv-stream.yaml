# Researched by hand on 2026-11-13 (M11.15, streaming batch 8). directv.com answers every reader that comes through the
# VPN (Edge from Canada, Mullvad Browser, a plain fetch and three US exits) with Akamai's "Access Denied" or "An error
# occurred while processing your request", so every directv.com page was read 2026-11-13 with a split-tunnelled scratchpad
# Chromium on an ordinary connection (the reading ladder's fourth step; split tunnelling put back after). Its pages price
# for a US ZIP code ("Showing details for: Dallas, TX 75001") whoever reads them. Pages, each quoted where it's used:
# What's priced: DIRECTV's internet service ("DIRECTV Streaming App Only via Internet (like Hulu+ Live TV & YouTube TV)",
# its packages FAQ; once DIRECTV STREAM, "Streaming Live TV from DIRECTV (formerly DIRECTV STREAM)", its stream page):
# the four Signature streaming packages, the Spanish Óptimo Más package, the seven Genre Packs and MyFree DIRECTV. Its
# satellite service (directv.com/satellite, 24-month agreements, an activation fee) is telecom, left out; so are DIRECTV
# FOR BUSINESS and U-verse TV.
# Pricing, all monthly, in US dollars before tax ("+ taxes & fees"): the packages page (directv.com/packages) gives each
# Signature package's regular price struck through beside a first month's offer and 24 months' discount: ENTERTAINMENT
# "$94.99/mo." ("Price reflects $30 off for 1st mo.; $5 off for mos 2-24."), CHOICE "$99.99/mo.", ULTIMATE "$129.99/mo."
# and PREMIER "$174.99/mo.", and the stream page names ENTERTAINMENT's regular rate ("curr. $94.99/mo. for
# ENTERTAINMENT"). The same prices are sold with your own device (directv.com/stream, "Streaming Packages with your own
# device") or with a leased Gemini device for $10 a month ("$74.99/mo. w/Gemini device lease" against "$64.99" for the
# first month), equipment, not a plan or add-on: noted on the plans. Óptimo Más™ "$89.99/mo." (its Spanish page, "$64.99
# w/OPTIMO MAS pkg & your own device"; its page data "price":"89.99"). The Genre Packs page (directv.com/genre-packs):
# MyEntertainment "$42.99/mo", MySports "$64.99/mo", Duo: MyEntertainment + MyNews "$74.99/mo. + tax", MiEspañol
# "$37.99/mo", MyKids "$20.99/mo. + tax", MyNews "$44.99/mo" and Duo: MySports + MyNews "$79.99/mo. + tax", each the rate
# after its offer ("curr. $42.99/mo.", "curr. $44.99/mo.", "curr. $37.99/mo."). First months' offers ($64.99, $49.99,
# $34.99 for two months…), 5-day trials and "A year of Netflix on us" with a Gemini device are offers, not stored. No
# yearly or other period is sold: "We will automatically renew Your Service and any subscriptions with Us each month,
# until You cancel." (its Residential Terms of Service, 7.c).
# Fees: "Regional Sports Fee Up to $23.99 Applies to programming packages that include regional sports" (its Fee
# Schedule, for Streaming App Only too; the packages page says "Regional Sports Fee up to $19.99/mo." and Dallas's
# cards add $13.99), so CHOICE and up cost up to $23.99 more where regional sports networks are carried; the catalog has
# no fee field for a streaming plan, so the plans' notes say so. No Early Termination Fee for Streaming App Only (the
# Fee Schedule's "No").
# Where it's sold: "Enjoy service in all 50 states and the District of Columbia." and "Heads up: DIRECTV isn't available
# in Puerto Rico, the U.S. Virgin Islands, or outside the U.S." (Get entertainment your way with DIRECTV), and its terms
# (18.d): "The Software and the Service are intended only for individuals located in the United States (excluding Puerto
# Rico and U.S. Virgin Islands)."
# Region checklist for CA and US, 2026-11-13: 1. one site, no locale paths (its legal pages have an Español version of
# the same terms); 2. a ZIP code picker, which changes local channels and the regional sports fee, not the package
# prices; 3. its page data (schema.org offers in USD, "price":"94.99" for MyEntertainment's and the packages' first-month
# prices); 4. its plan builder (directv.com/shop/build) answers "Access Denied" even on an ordinary connection, so it
# wasn't read; 5. its help centre's billing, fee and streaming articles; 6. Edge, Mullvad Browser and a plain fetch
# through the VPN (blocked), the split-tunnelled Chromium (read); 7. no bill offered. Canada: not sold (the statements
# above).
# Bundles: none as bundle files. Its plans include other services, listed in includes-subscription: ESPN Unlimited with
# every Signature package and MySports ("ESPN Unlimited included in every Streaming Package", its app page; "Gemini not
# required for ESPN Unlimited with Streaming Packages"), Disney+, Hulu, HBO Max Basic With Ads and AMC+ with
# MyEntertainment, Disney+ with MyKids, and PREMIER's premium networks; Disney+ and Hulu come with a Signature package
# only with a Gemini device ("Get Disney+, Hulu Bundle, and ESPN Unlimited when you add a Gemini device for just $10/mo."),
# so they're not listed there. MiEspañol's ViX Premium with Ads isn't in the catalog. DIRECTV also bills other services
# (Netflix, Peacock, Apple TV and more, "Manage your Netflix subscription through your DIRECTV account") and sells
# AT&T internet bundles: partners' products, noted, not listed. Official resellers: none ("Find a Retailer" lists stores
# that sell its satellite service). Seasonal sports passes (NBA League Pass, MLB.TV, NHL CENTER ICE, Apple TV's sports)
# are leagues' and others' subscriptions it bills, priced by season, not listed.
# Features, read 2026-11-13: 4K: "If you’re a subscriber to any base package and have a 4K-compatible TV, you’ll have
# access to 4K content at no extra cost." and "For the best experience, enable HDR on your TV and streaming device." (its
# 4K UHD streaming FAQ); its glossary calls the Genre Packs "base Genre Pack"s, so theirs is inferred. Streams: "Most
# customers can enjoy unlimited concurrent streaming with DIRECTV on all of your compatible devices while connected to
# your in-home network." and "On the go and off your home network? You'll have access to up to 3 concurrent streams."
# (its streaming limits article; the packages page's "Unlimited streams for unlimited screens"), so unlimited, noted
# (another article says "up to 20 devices at the same time while on your home network"). "Plus, you can have up to 5
# profiles for the family." (its app page); no kids profiles or downloads on any page read. Parental controls: a
# four-digit PIN that restricts ratings (Set up DIRECTV parental controls). Pause: "If you get your DIRECTV service over
# the internet (no satellite dish) sign in and select “Pause service”" (its cancel page), not MyFree, which has nothing
# to pause. Live channels with ads. What it streams, from its own descriptions: ENTERTAINMENT "includes all your
# essential channels packed with entertainment, news, and sports", ULTIMATE "More sports & movies including: CBS Sports
# Network, Discovery Family, FX Movie Channel", PREMIER the premium networks; the Genre Packs by their names and cards
# ("60+ popular entertainment channels", "10+ channels that focus on breaking news and information", "10+ Engaging
# channels for nonstop fun and learning made just for kids", MiEspañol's "Spanish-language shows, movies and sports");
# MyFree's "Movies, shows, news, sports & more" with a "Family & Kids" lineup. None of your own media.

id: directv-stream
name: DIRECTV
aliases: [DIRECTV STREAM, DIRECTV via Internet]
website: https://www.directv.com
category: streaming
spendCategory: streaming
availableIn: [US]
billingCurrency: { US: USD }
# Its cancel page; Streaming App Only customers cancel by signing in ("Cancel service") or by chat or phone.
cancelUrl: https://www.directv.com/customer/cancel-help/
sources: { pricing: https://www.directv.com/packages/ }
# Owner (M11.2), read 2026-11-13: its About us page's history ends with TPG's ownership; its terms are DIRECTV, LLC's
# ("“DIRECTV,” “We,” “Our” and “Us” mean DIRECTV, LLC", 1). TPG Capital is TPG Inc.'s private equity platform, and
# DIRECTV is a portfolio company of its funds, so no stock: TPG Inc.'s listing (NASDAQ) isn't DIRECTV's owner's. Where
# it's from: no page read states its home country in words (its privacy notices' address is "2260 E Imperial Hwy, El
# Segundo, CA 90245"); its About us page's history places its start in Mississippi and its satellites over US markets.
owner:
  name: 'DIRECTV, LLC (a portfolio company of TPG Capital)'
  page:
    name: 'About us'
    url: https://www.directv.com/insider/corporate/company/
  quotes:
    - 'DIRECTV becomes a wholly owned portfolio company of TPG Capital'
  # Country: its privacy policy's address is "2260 East Imperial Highway, El Segundo, CA 90245" (Video Privacy Policy),
  # which core doesn't read as the US by itself ("CA" is Canada's code too); its leadership page places its executives
  # in El Segundo, California.
  country:
    code: US
    page:
      name: 'Our team'
      url: https://www.directv.com/insider/corporate/team/
    quotes:
      - 'Rob is based in El Segundo, California.'
    lastVerified: 2026-11-13
  lastVerified: 2026-11-13
# Ways to pay (M11.5), read 2026-11-13: its payment method article for customers streaming over the internet (cards and
# PayPal; "Paying with a bank account (ACH) is currently not allowed for customers streaming over the internet."), and
# the partners it names for those who signed up through them (Amazon Fire TV, Roku, Google Play). Autopay is required
# ("Auto Bill Pay is required for You to get Service.", its terms). Its satellite customers' ways (cheques, cash at
# payment partners) aren't the streaming service's.
acceptedNetworks:
  US:
    networks: [visa, mastercard, amex, discover]
    url: https://www.directv.com/support/article/000093622
    quotes:
      - 'Enter a new debit or credit card (Visa, MasterCard, American Express, and Discover).'
paymentMethods:
  - methods: [card, paypal, app-store]
    page: Update Payment Method for DIRECTV
    url: https://www.directv.com/support/article/000093622
    quotes:
      - 'Enter a new debit or credit card (Visa, MasterCard, American Express, and Discover).'
      - 'Add PayPal as your payment method.'
      - 'Google Play'
# Renewal day (M11.5): its terms charge Streaming App Only customers each month from the day a trial ends, moved to the
# 1st of the next month when that day is the 29th, 30th or 31st ("if Your Renewal Date falls on the 29th, 30th, or 31st
# of a month, then We will charge Your Payment Method on the first day of the next month", 7.d), which core's wording
# doesn't read and which isn't the same-date kind's shorter-month rule; its billing article: "Your monthly billing date
# is auto assigned and cannot be changed." notes.md has the block for core to extend.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.directv.com/legal/directv-residential-terms-of-service/
    - https://www.directv.com/support/article/000083249
  lastVerified: 2026-11-13

# Perks (M11.6): what tells its packages apart that no feature describes, in their words: "Unlimited Cloud DVR recording"
# (the Signature cards) and "Unlimited hours of cloud DVR storage" (the Genre Packs' cards; MyKids' and MyNews' cards
# don't list it, and MyFree has no DVR, "DVR function not available for MyFree DIRECTV customers", its terms); CHOICE's
# "Specialty sports including: ACC Network, Big Ten Network, MLB Network, NBA TV, SEC Network & more." and "Regional
# Sports Networks for watching your local teams"; ULTIMATE's "More sports & movies"; PREMIER's premium networks (HBO Max,
# Paramount+ with SHOWTIME, STARZ and Cinemax, which the catalog doesn't have).
perks:
  - id: unlimited-cloud-dvr
    name: Unlimited cloud DVR
  - id: specialty-sports
    name: Specialty sports networks
  - id: regional-sports-networks
    name: Regional Sports Networks
  - id: more-sports-and-movies
    name: More sports & movies channels
  - id: premium-networks
    name: Premium networks (HBO Max, Paramount+ with SHOWTIME, STARZ, Cinemax)

# General features, read 2026-11-13: platforms from its compatible devices article (Gemini, Fire TV, Android and Google
# TV, Chromecast, Apple TV, LG, Samsung, VIZIO, Roku, Meta Quest; Chrome, Safari and Edge; iPhone, iPad and Android
# phones), no consoles. Sign-in: "In addition to your username and password, you're asked to enter a one-time code sent
# to your email or phone number on file." (Update Payment Method for DIRECTV). Support: chat and phone ("You can chat
# with Us online to cancel Your Service by going to www.directv.com or You can call Us at 800.531.5000", its terms). App
# languages: English and Spanish (its legal and privacy pages' "English (U.S.)" and "Español" versions; the app's own
# languages aren't listed).
features:
  platforms: [web, ios, android, tv]
  account.sign-in: [password, email-code, sms]
  languages.interface: [en, es]
  support.channels: [chat, phone]

