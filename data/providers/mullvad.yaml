# Obscura) run their own products on Mullvad's servers and don't sell Mullvad, so they aren't here. Not listed yet:
# Amazon's 12 other stores, whose prices depend on the delivery address (amazon.com shows none for delivery to Canada,
# and the EU stores' VAT changes with it), and Laptop with Linux, whose price changes with the delivery country's VAT
# and its currency menu. SerialCart's sale of the day (20-26% off, no end date) isn't stored: prices are regular ones.
