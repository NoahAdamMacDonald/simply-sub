id: mullvad
name: Mullvad VPN
aliases: [mullvad]
website: https://mullvad.net
category: vpn
spendCategory: software
billingCurrency: { GLOBAL: EUR }
# Nothing renews, so there's nothing to cancel: Mullvad ended subscriptions in 2022
# (/en/blog/were-removing-the-option-to-create-new-subscriptions), and the terms say they "expire at the end of
# the period purchased". The refunds guide is how to get unused time back (read 2026-10-26).
cancelUrl: https://mullvad.net/en/help/refunds
sources: { pricing: https://mullvad.net/en/pricing }
notes: >-
  Prepaid only: you add time to an account number, and nothing renews by itself. Cards can pay in many local
  currencies at a converted amount, and cryptocurrency payments get 10% off. One flat price everywhere, VAT
  included, so no sales tax is added in Canada or the US.

# Prices read 2026-10-26 on /en/pricing: "€5" a month for 1 month, 1 year or 1 decade ("the exact same rate"), and
# "It's one flat monthly rate for ultimate flexibility. Including VAT." The CA$7.84 shown there is "€5 is
# equivalent to", not a CAD price: CAD is taken for cash only. The ECB's rates of 2026-10-26 convert €5 to CA$7.85
# and US$5.59, as the page's own figures do. The checkout also sells 2, 3 and 6 months (seen by the project owner on
# 2026-10-26; it needs an account), at the same €5 a month.

# VPN features, read 2026-10-25 on mullvad.net: devices and anonymous signup on /en/vpn; 50 server countries on
# /en/servers; WireGuard only since OpenVPN's removal on 2026-01-15 (/en/blog/removing-openvpn-15th-january-2026),
# with obfuscation (UDP-over-TCP, Shadowsocks: /en/help/connecting-to-mullvad-vpn-from-restrictive-locations); the
# kill switch is always on and split tunneling is on every platform but iOS (/en/help/using-mullvad-vpn-app,
# /en/help/split-tunneling-with-the-mullvad-app); multihop (/en/help/multihop-wireguard); the DNS content blockers
# (/en/help/how-use-mullvad-cli); no new forwarded ports since 2023 (/en/vpn FAQ); infrastructure and app audits
# (/en/blog/tag/audits, whose summaries don't say they tested the no-logging claim); a no-logging policy
# (/en/help/no-logging-data-policy); unlimited traffic (/en/blog/unlimited-traffic-volume). No page states a P2P policy: P2P is
# marked allowed because the terms block only ports 25 and 137-139/445 and change no traffic (/en/help/terms-service).
plans:
  - id: mullvad.vpn
    name: Mullvad VPN
    link: https://mullvad.net/en/pricing
    features:
      vpn.included: true
      vpn.devices: 5
      vpn.unlimited-traffic: true
      vpn.server-countries: 50
      vpn.protocols: [wireguard, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.multi-hop: true
      vpn.content-blocking: [ads, trackers, malware, adult-content, gambling, social-media]
      vpn.p2p: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [servers, apps]
      vpn.anonymous-signup: true
    prices:
      - region: GLOBAL
        currency: EUR
        amount: 5
        interval: month
        intervalCount: 1
        autoRenew: false
        taxIncluded: { quote: Including VAT. }
        lastVerified: 2026-10-26
        sourceUrl: https://mullvad.net/en/pricing
      - region: GLOBAL
        currency: EUR
        amount: 10
        interval: month
        intervalCount: 2
        autoRenew: false
        taxIncluded: { quote: Including VAT. }
        lastVerified: 2026-10-26
        sourceUrl: https://mullvad.net/en/pricing
      - region: GLOBAL
        currency: EUR
        amount: 15
        interval: month
        intervalCount: 3
        autoRenew: false
        taxIncluded: { quote: Including VAT. }
        lastVerified: 2026-10-26
        sourceUrl: https://mullvad.net/en/pricing
      - region: GLOBAL
        currency: EUR
        amount: 30
        interval: month
        intervalCount: 6
        autoRenew: false
        taxIncluded: { quote: Including VAT. }
        lastVerified: 2026-10-26
        sourceUrl: https://mullvad.net/en/pricing
      - region: GLOBAL
        currency: EUR
        amount: 60
        interval: year
        intervalCount: 1
        autoRenew: false
        taxIncluded: { quote: Including VAT. }
        lastVerified: 2026-10-26
        sourceUrl: https://mullvad.net/en/pricing

# Resellers, read 2026-10-26 and again 2026-10-27 (BLUEPRINT §4.9, M1.12). /en/help/partnerships-and-resellers names
# Mullvad's official resellers ("With our official resellers, you can purchase Mullvad VPN scratch cards"): Amazon's
# stores in 13 countries, Inet, Webhallen, ProxyStore, SerialCart and Laptop with Linux. Its partners (Mozilla,
# Tailscale, Obscura) run their own products on Mullvad's servers and don't sell Mullvad, so they aren't here. Amazon's
# 12 other stores aren't listed: each shows the price only in the basket ("To see the product details, add this item
# to your basket", amazon.com and amazon.co.uk among them), and amazon.de answered with an error. Laptop with Linux's
# price with VAT follows the buyer's country, so its price before VAT is stored. SerialCart's sale of the day (20-26%
# off, no end date) isn't stored: prices are regular ones. Bundles: none on mullvad.net. Its blog, read 2026-10-27
# (M1.15): a 2021 post names Smartech, in Selfridges in London, as a reseller, but the partnerships page no longer
# does, so it isn't listed; the others it names are the page's.
