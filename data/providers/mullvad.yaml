id: mullvad
name: Mullvad VPN
aliases: [mullvad]
website: https://mullvad.net
category: vpn
spendCategory: software
billingCurrency: { GLOBAL: EUR }
sources: { pricing: https://mullvad.net/en/pricing }
notes: >-
  Prepaid only: you add time to an account number, and nothing renews by itself. Cards can pay in many local
  currencies at a converted amount, and cryptocurrency payments get 10% off. One flat price everywhere, VAT
  included, so no sales tax is added in Canada or the US.

# Prices read 2026-10-26 on /en/pricing: "€5" a month for 1 month, 1 year or 1 decade ("the exact same rate"), and
# "It's one flat monthly rate for ultimate flexibility. Including VAT." The CA$7.84 shown there is "€5 is
# equivalent to", not a CAD price: CAD is taken for cash only.

# VPN features, read 2026-10-25 on mullvad.net: devices and anonymous signup on /en/vpn; 50 server countries on
# /en/servers; WireGuard only since OpenVPN's removal on 2026-01-15 (/en/blog/removing-openvpn-15th-january-2026),
# with obfuscation (UDP-over-TCP, Shadowsocks: /en/help/connecting-to-mullvad-vpn-from-restrictive-locations); the
# kill switch is always on and split tunneling is on every platform but iOS (/en/help/using-mullvad-vpn-app,
# /en/help/split-tunneling-with-the-mullvad-app); multihop (/en/help/multihop-wireguard); the DNS content blockers
# (/en/help/how-use-mullvad-cli); no new forwarded ports since 2023 (/en/vpn FAQ); infrastructure and app audits
# (/en/blog/tag/audits, whose summaries don't say they tested the no-logging claim); a no-logging policy
# (/en/help/no-logging-data-policy); unlimited traffic (/en/blog/unlimited-traffic-volume). No page states a P2P policy: P2P is
# marked allowed because the terms block only ports 25 and 137-139/445 and change no traffic (/en/help/terms-service).
plans:
  - id: mullvad.vpn
    name: Mullvad VPN
    link: https://mullvad.net/en/pricing
    features:
      vpn.included: true
      vpn.devices: 5
      vpn.unlimited-traffic: true
      vpn.server-countries: 50
      vpn.protocols: [wireguard, stealth]
      vpn.kill-switch: true
      vpn.split-tunneling: true
      vpn.multi-hop: true
      vpn.content-blocking: [ads, trackers, malware, adult-content, gambling, social-media]
      vpn.p2p: true
      vpn.no-logs-policy: true
      vpn.independent-audits: [servers, apps]
      vpn.anonymous-signup: true
    prices:
      - region: GLOBAL
        currency: EUR
        amount: 5
        interval: month
        intervalCount: 1
        autoRenew: false
        taxIncluded: { quote: Including VAT. }
        lastVerified: 2026-10-26
        sourceUrl: https://mullvad.net/en/pricing
      - region: GLOBAL
        currency: EUR
        amount: 60
        interval: year
        intervalCount: 1
        autoRenew: false
        taxIncluded: { quote: Including VAT. }
        lastVerified: 2026-10-26
        sourceUrl: https://mullvad.net/en/pricing
