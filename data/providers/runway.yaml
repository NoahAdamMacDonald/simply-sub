# Every agreement a user accepts (the owner's rule, 2026-11-03), read 2026-11-17 with Edge and a plain fetch: its Terms
# of Use (last updated October 23, 2026), which include its Usage Policy and the Supplemental Terms some features show;
# its Privacy Policy (effective October 23, 2026, with its California notices on the same page); its Data Security page;
# its log-in page's agreement line ("you agree that we and our vendors may scan faces or capture voiceprints each time
# you use certain features such as Act-Two and Custom Voice"); and its help centre's billing, account and privacy
# articles. Its terms include Stripe's terms and privacy policy for payments (no topic) and the App Store's terms for
# the iOS app. Not read: the sign-up form's agreement line, which shows only after an email is entered; the Enterprise
# Services Terms (business plans); its Trust Center's reports (Enterprise customers only).
policies:
  links:
    - name: Terms of use
      url: https://runway.com/terms-of-use
    - name: Privacy policy
      url: https://runway.com/privacy-policy
    - name: Usage policy
      url: https://runway.com/safety/usage-policy
    - name: Data security
      url: https://runway.com/data-security
    - name: Pricing
      url: https://runway.com/pricing
    - name: Cancelling
      url: https://help.runwayml.com/hc/en-us/articles/21668396605971-How-do-I-cancel-my-plan
    - name: Managing your subscription
      url: https://help.runwayml.com/hc/en-us/articles/50205612565779-Managing-your-subscription
    - name: Refunds
      url: https://help.runwayml.com/hc/en-us/articles/24343363554067-Requesting-a-refund-for-your-plan-or-payment
    - name: Keeping your account safe
      url: https://help.runwayml.com/hc/en-us/articles/36555466922131-Keeping-Your-Account-Safe-and-Preventing-Fraud
    - name: Usage rights
      url: https://help.runwayml.com/hc/en-us/articles/18927776141715-Usage-rights
    - name: Education FAQ
      url: https://help.runwayml.com/hc/en-us/articles/43109077483667-Runway-Education-FAQ
    - name: Deleting your account
      url: https://help.runwayml.com/hc/en-us/articles/4402108479379-Deleting-your-account
    - name: Downloading your files
      url: https://help.runwayml.com/hc/en-us/articles/18406706187283-Batch-downloading-exports-assets
    - name: Export formats
      url: https://help.runwayml.com/hc/en-us/articles/54396547993491-Exporting-Videos-in-ProRes-and-PNG-Sequence-Formats
    - name: Creating an account
      url: https://help.runwayml.com/hc/en-us/articles/24297557468563-Creating-a-Runway-Account
    - name: Which plan is right for me?
      url: https://help.runwayml.com/hc/en-us/articles/21664961171475-Which-plan-is-right-for-me
  ratings:
    - topic: billing.cancellation
      tier: great
      reason: 'You can cancel online from your billing page whenever you like, in a few steps, and keep your plan until the end of the time you paid for.'
      sources:
        - url: https://help.runwayml.com/hc/en-us/articles/50205612565779-Managing-your-subscription
          quote: 'You can cancel your plan at any time by downgrading to a Free plan.'
        - url: https://runway.com/terms-of-use
          quote: 'If you cancel your subscription, you may use your subscription until the end of your then-current subscription term; your subscription will not be renewed after your then-current term expires.'
        - url: https://help.runwayml.com/hc/en-us/articles/21668396605971-How-do-I-cancel-my-plan
          quote: 'Yes, you can cancel immediately after subscribing and will have access to the plan features until the end of the billing cycle.'
      lastVerified: 2026-11-17
    - topic: billing.refunds
      tier: neutral
      reason: 'Payments are usually not refunded, but you keep your plan to the end of the time you paid for. Within 30 days of paying, it may refund a plan you’ve hardly used, if it agrees.'
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'Except as stated in these Terms of Use or as required by applicable law, all fees for the Services are non-refundable, and if you cancel your subscription, you are not entitled to receive any refund or credits for the time remaining in your subscription period.'
        - url: https://help.runwayml.com/hc/en-us/articles/24343363554067-Requesting-a-refund-for-your-plan-or-payment
          quote: 'You purchased or renewed your subscription within the last 30 days, and since the time of initial purchase or renewal, your subscription to the Services is unused, or close to unused (as determined by Runway in its discretion).'
      lastVerified: 2026-11-17
    - topic: billing.price-changes
      tier: poor
      reason: 'It can change its prices whenever it wants, as soon as it posts them, and doesn’t promise to tell you first. If you don’t want the new price, you can cancel.'
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'Company reserves the right at any time to change its prices and billing methods, either immediately upon posting on the Services or by email delivery to you.'
        - url: https://runway.com/terms-of-use
          quote: 'If you do not wish to continue subscribing with the new fees or features, you may cancel your subscription.'
      lastVerified: 2026-11-17
    - topic: billing.free-trials
      tier: neutral
      reason: 'A trial or a discounted start turns into the full price on its own unless you cancel before it ends. It doesn’t say it reminds you first.'
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'If your subscription includes a discount or promotional rate, you will be charged the promotional rate for the relevant number of subscription periods, and upon completion of the promotional period, your subscription will continue to automatically renew at the then-current subscription fee.'
        - url: https://runway.com/terms-of-use
          quote: 'To cancel and avoid being charged the full rate, you must notify us before the discount or promotional period ends.'
      lastVerified: 2026-11-17
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its terms say your plan renews on its own at the current price, but not that it reminds you first.'
      pages:
        - https://runway.com/terms-of-use
