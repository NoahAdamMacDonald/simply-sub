    - topic: security.practices
      tier: good
      reason: 'Outside auditors check its security every year (SOC 2 Type II, ISO 27001), and invited researchers can report problems for rewards. The reports aren’t public.'
      sources:
        - url: https://runway.com/data-security
          quote: 'Runway maintains SOC 2 Type II certification, validating our security controls through rigorous independent auditing.'
        - url: https://runway.com/data-security
          quote: 'Runway is certified to ISO/IEC 27001, the international standard for information security management systems (ISMS).'
        - url: https://runway.com/data-security
          quote: 'In addition to these assessments, Runway operates a private bug bounty program that enables select security researchers to responsibly disclose potential vulnerabilities in exchange for recognition and rewards.'
      lastVerified: 2026-11-17
