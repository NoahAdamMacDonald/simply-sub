    - topic: billing.fees
      tier: great
      reason: 'It charges nothing beyond the price. Your bank or payment service may charge its own fees.'
      sources:
        - url: https://help.runwayml.com/hc/en-us/articles/24343363554067-Requesting-a-refund-for-your-plan-or-payment
          quote: "While we presently don't charge any service fees on our end, any service fees charged by a payment provider, your banking provider, or any other third party are not controlled by us; thus, we are not able to choose whether these are refunded."
        - url: https://help.runwayml.com/hc/en-us/articles/36555466922131-Keeping-Your-Account-Safe-and-Preventing-Fraud
          quote: 'There are no “penalty fees” or “account reset” charges'
      lastVerified: 2026-11-17
    - topic: billing.plan-changes
      tier: great
      reason: 'You can switch plans at any time. Moving up, you pay only the difference; moving down, it gives back what you hadn’t used.'
      sources:
        - url: https://runway.com/pricing
          quote: 'You can upgrade at any time and the change takes effect immediately — upgrades are prorated, so you only pay the time-adjusted difference and receive the additional credits right away.'
        - url: https://help.runwayml.com/hc/en-us/articles/50205612565779-Managing-your-subscription
          quote: 'When you downgrade to a plan mid-cycle — for example from annual to monthly, or from Max to Pro — the unused amount of your current plan is refunded automatically to the card you paid with.'
      lastVerified: 2026-11-17
    - topic: legal.disputes
      tier: poor
      reason: "Disputes go to a private referee (arbitration), not a court, and you can't join a class action. You can opt out only by mailing a letter within 30 days of agreeing to its terms."
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'You agree that any dispute between you and any of the Company Parties relating in any way to the Services or this Agreement, will be resolved by binding arbitration, rather than in court'
        - url: https://runway.com/terms-of-use
          quote: 'EACH OF US MAY BRING CLAIMS AGAINST THE OTHER ONLY ON AN INDIVIDUAL BASIS AND NOT ON A CLASS, REPRESENTATIVE, OR COLLECTIVE BASIS'
        - url: https://runway.com/terms-of-use
          quote: 'Such notice shall be deemed given when received by Company by letter delivered by nationally recognized overnight delivery service or first class postage prepaid mail at the above address within 30 days after first becoming subject to this Arbitration Agreement.'
      action:
        name: 'How to opt out of arbitration (section 16.9)'
        url: https://runway.com/terms-of-use
      lastVerified: 2026-11-17
    - topic: legal.terms-changes
      tier: poor
      reason: 'It changes its terms by posting them with a new date, and they apply at once. If you keep using Runway, you’ve agreed to them.'
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'We may make changes to the Terms of Use from time to time, and if we do, we will notify you by revising the date at the top of the Terms of Use.'
        - url: https://runway.com/terms-of-use
          quote: 'Unless otherwise noted, the amended Terms of Use will be effective immediately, and your continued use of our Services confirms your acceptance of the changes.'
      lastVerified: 2026-11-17
    - topic: legal.account-closure
      tier: bad
      reason: 'It can close your account for any reason or none, at once and without warning, and you get no refund if it says you broke its rules.'
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'terminate or suspend your access to all or part of the Services for any or no reason, including without limitation, any violation of this Agreement.'
        - url: https://runway.com/terms-of-use
          quote: 'Company has the right to, immediately and without notice, suspend or terminate any Services provided to you.'
        - url: https://runway.com/terms-of-use
          quote: 'you acknowledge that you will not be entitled to receive a refund for fees related to those Services to which your access has been terminated'
      lastVerified: 2026-11-17
    - topic: legal.content-rights
      tier: poor
      reason: 'You keep what you upload and make, but give Runway a licence over it that never ends, can’t be taken back, and can be passed on, to run Runway for you and others.'
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'Subject to any applicable account settings that you select, you grant Company a fully paid, royalty-free, perpetual, irrevocable, worldwide, non-exclusive and fully sublicensable right (including any moral rights) and license to host, use, license, distribute, reproduce, modify, adapt, publicly perform, and publicly display, including on a through-to-the-audience basis, Your Content (in whole or in part) for the purposes of operating and providing the Services to you and to our other users.'
      lastVerified: 2026-11-17
    - topic: legal.output-rights
      tier: neutral
      reason: 'What Runway makes for you is yours, and you may use it commercially, but its licence over your content lets Runway use it too.'
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'The Company does not claim ownership of any of your Inputs or Outputs. Subject to your compliance with the Agreement, the Company does not restrict your commercial use of your Outputs.'
        - url: https://runway.com/terms-of-use
          quote: 'Your Content also includes any Content that you create or generate through the use of the Services, including Content you Make Available to other users through the Services.'
        - url: https://help.runwayml.com/hc/en-us/articles/18927776141715-Usage-rights
          quote: 'As between you and Runway, you retain ownership and all your rights to content that you upload and generate on Runway.'
      lastVerified: 2026-11-17
    - topic: legal.service-changes
      tier: poor
      reason: 'It can take away features your plan includes whenever it chooses. You can cancel, but you get no money back for the rest of the time you paid for.'
      sources:
        - url: https://runway.com/terms-of-use
          quote: 'We may choose in our sole discretion to add, modify, or remove benefits and features from the Services.'
        - url: https://runway.com/terms-of-use
          quote: 'However, you will not be entitled to receive a prorated refund of any portion of the subscription fee paid for the then-current subscription period unless otherwise stated in these Terms of Use or required by applicable law.'
      lastVerified: 2026-11-17
