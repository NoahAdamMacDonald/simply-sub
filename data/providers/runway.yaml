# AI features (the AI category's registry), read 2026-11-17 on its pricing cards and comparison table and in its help
# centre. Runway is an AI video, image and audio generator with a chat assistant, Runway Agent: "Runway Agent is a
# chat-based collaborative agent that analyzes what you give it", which every paid card lists ("Agentic creative
# collaborator") and the Free plan's article names ("let the Agent pick the right model for you").
# - Video generation on every plan: "All videos generated on a Free plan feature a Runway watermark." (Free plan
#   details); the paid cards' "Access to all AI video & image models". Image generation on the paid plans by the same
#   line; on Free inferred (its "access to a select range of models", and "Upgrading to the Standard plan or above gives
#   you access to all AI image and video models").
# - Music and voice on the paid plans: Standard's "Music, voice & sound effects generation"; the comparison table's "AI
#   audio" rows (Lyria 3 Pro songs, Text to Speech) for Standard, Pro and Max; Pro's "generative audio tools like Text to
#   Speech and Custom Voices for Lip Sync".
# - Models from several companies on the paid plans: "The Pro plan includes access to every AI image and video model on
#   Runway, including third-party models" (Pro plan details); every paid card lists Kling 4.0 and Nano Banana Pro.
#   Reasoning on the paid plans is inferred: Agent runs on a model you pick, among them "Opus 5.5 — deeper reasoning" and
#   "GPT-6 Astra — advanced reasoning" (Creating with Runway Agent), with no plan named.
# - Projects on every plan: "Projects let teams organize and collaborate on sessions, workflows, and assets within their
#   Runway workspace." (Creating a Project); the paid cards' "Up to 3 projects" (5, 10), and on Free "you will not be
#   able to create any new projects once on the Free plan if you have over three projects" (How do I cancel my plan?).
# - Custom assistants on the paid plans, where its cards list Agent: Agent's own skills ("You can also turn a process
#   you've worked out in a chat into a custom skill", Using Agent Skills).
# - Early access on Max: "Early access to new models" (its card); "Max and higher sometimes get early access to new
#   releases." (Which plan is right for me?).
# - Chats kept on its servers: "If you've used Agent before, you'll land on your most recent session." (Creating with
#   Runway Agent); its privacy policy collects "User content, such as prompts".
# - Not counted: Runway MCP (Pro and Max cards: a perk) lets other assistants use Runway ("The Runway MCP (Model Context
#   Protocol) brings the power of generative media into Claude, ChatGPT, and other LLM agents."), not Agent use MCP
#   servers; Agent's connectors (Dropbox, Figma, Notion) are the Team plan's only ("It isn't included on Free, Standard,
#   Pro or Max plans"); App Studio builds apps in a creative tool, not a coding tool (Perplexity's review of
#   2026-11-17); the API is billed apart. No page offers web search, voice conversations, memory across chats, a browser
#   agent, scheduled tasks, deep research, code completion or office apps.
# Creative features (the creative category's registry), read 2026-11-17:
# - Tools: video editing on every plan ("You can trim and arrange clips into a finished video directly in the Final Cut
#   tab of the Agent panel", Trimming and Assembling Clips in Studio; "Edit Studio is a video editing experience");
#   on the paid plans also image editing ("Image editing — modify or extend existing images using text instructions or
#   reference images.", Creating with Runway Agent) and motion graphics and effects (Agent's skill "Motion Graphic —
#   animate text, charts and infographics into a video"; Edit Studio's "from adding VFX and relighting scenes"). Free's
#   generative tools are "a limited set", which no page names.
# - Highest video export 4K on the paid plans: Standard's "4K upscaling", Pro's and Max's "Unlimited 4K video upscaling";
#   generations are "created in 720p, but can be upscaled to 4K" (Can I generate videos in 4K?). Free's is left out: no
#   page states it.
# - No watermark on the paid plans: Standard's "No watermarks"; "You can generate without a watermark by signing up for
#   the Standard plan or above". Free's videos have one.
# - Generative credits a month: "625 credits monthly", "2250 credits monthly", "9500 credits" (its cards); Free's 125
#   are once only ("Your one-time deposit of 125 credits does not expire, and does not renew or refresh once spent."), a
#   perk.
# General features, read 2026-11-17: the web and its apps ("The Runway mobile app is available for iPhone and Android via
# their respective app stores.", Mobile device compatibility). Sign-in: an email address and password, Google or Apple
# ("Signing up with an email address", "Signing up with Google", "Signing up with Apple", Creating a Runway Account; its
# log-in page's "Forgot Password"); no two-factor sign-in of its own ("Turn on MFA for the email account associated with
# your Runway account"). App languages: "Runway is currently only available in American English" (its marketing pages
# have other languages, notes.md). Support: tickets through its AI assistant, answered by a person ("ticket-based
# support from our team"), and its Discord's "#community-help"; "we don't currently offer phone or live chat with human
# agents". No pause and no parental controls: its terms and help centre offer neither (13 and over, with "your parent or
# legal guardian’s permission" under 18).
features:
  platforms: [android, ios, web]
  account.sign-in: [password, sso]
  languages.interface: [en]
  support.channels: [email, community]

