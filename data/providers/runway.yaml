# Researched by hand on 2026-11-17 (the full catalog run, AI batch 2), read with Edge from Canada (runway.com's pricing
# page in its Monthly and Yearly views, with a plain fetch of its HTML for the page's own pricing data; its Terms of Use,
# Privacy Policy, Usage Policy, Data Security and About pages; the sign-up and log-in pages) and through UK and German
# exits (the pricing page), with a plain fetch of its help centre's articles (help.runwayml.com, Zendesk's API). Pages,
# each quoted where it's used:
# Pricing: runway.com/pricing (runwayml.com/pricing redirects there), Individual tab: Free "$0", Standard "$15" a month or
# "$12" "/month" "Billed annually. Save $36/year.", Pro "$35" or "$28" ("Save $84/year."), Max "$95" or "$76" ("Save
# $228/year."). A yearly plan is one payment for the year ("Annual plans are paid for in one lump sum at a discounted
# rate", help centre), so its price is twelve times the monthly rate shown: $144, $336 and $912, which each card's
# saving confirms (notes.md). The page's own data names the currency for everyone ("priceCurrency":"USD"), and the UK and
# German exits got the same "$" prices as Canada: one US-dollar price list, GLOBAL. No page says a price includes tax
# ("Company will charge tax when required.", its terms).
# Region checklist for CA, 2026-11-17: 1. no country paths (hreflang only for its English, French, Japanese, Korean and
# Brazilian Portuguese pages, the same prices); 2. no country or currency picker; 3. the page's data names USD and no
# country; 4. checkout needs an account; 5. no prices or tax article in its help centre; 6. Edge and a plain fetch from
# Canada, and the UK's and Germany's exits, all show the same USD prices; 7. no bill offered.
# Not listed: Team ("teams of 2 to 9 people") and Enterprise (business plans); the API ("Credits or plans purchased in
# Runway are completely separate from credits purchased for the Runway API", usage-billed); credits bought as you go
# ("The minimum purchase is 1,000 credits."); the legacy Unlimited plan ("As of June 1, 2026, Unlimited is no longer
# offered", its subscribers moving to Max on November 30); the student and educator discount (25% off, an offer); its
# iOS app's App Store prices (a way to pay).
# Bundles: none on its pages or in a search. Official resellers: none; no page names a shop that sells it.

id: runway
name: Runway
aliases: [runwayml, runway ml, runway ai]
website: https://runway.com
domains: [runwayml.com]
category: ai
spendCategory: software
billingCurrency: { GLOBAL: USD }
# Its help centre's cancelling article (the billing page's "Cancel plan" steps), which also links Apple's steps for the
# iOS app.
cancelUrl: https://help.runwayml.com/hc/en-us/articles/21668396605971-How-do-I-cancel-my-plan
sources: { pricing: https://runway.com/pricing }

# Ways to pay (M11.5), read 2026-11-17: through Stripe, a card, Apple Pay, Google Pay, Alipay, Cash App Pay, and Amazon
# Pay, WeChat Pay and Stripe's bank payments in the US (other) ("Which ones you can use depends on your location."), and
# Apple's and Google's billing in its apps. "We do not accept and will never request cryptocurrency payments".
paymentMethods:
  - methods: [card, apple-pay, google-pay, alipay, cash-app, other]
    page: 'What payment methods are available?'
    url: https://help.runwayml.com/hc/en-us/articles/30657959470483-What-payment-methods-are-available
    quotes:
      - 'Credit or debit card'
      - 'Amazon Pay'
      - 'Apple Pay'
      - 'Google Pay'
      - 'Stripe Instant Bank Payments (U.S. only)'
      - 'Alipay'
      - 'Cash App Pay'
      - 'WeChat Pay'
  - methods: [app-store]
    page: 'Requesting a refund for your plan or payment'
    url: https://help.runwayml.com/hc/en-us/articles/24343363554067-Requesting-a-refund-for-your-plan-or-payment
    quotes:
      - 'You made your purchase through the Apple App Store or Google Play, where Apple or Google handles refunds'
# Card networks (M9.2), read 2026-11-17 in its terms: Visa and Mastercard by name, for every buyer.
acceptedNetworks:
  GLOBAL:
    networks: [visa, mastercard]
    url: https://runway.com/terms-of-use
    quotes:
      - 'You must provide Company with a valid credit card (Visa, MasterCard, or any other issuer accepted by us) through a payment provider (“Payment Provider”), or purchase order information, as a condition to signing up for the Services.'

# Owner (M11.2), read 2026-11-17: its privacy policy names Runway AI, Inc. as the company behind it, and its terms say it
# runs the service from the United States. A private company: no page names a listing.
owner:
  name: 'Runway AI, Inc.'
  page:
    name: Privacy policy
    url: https://runway.com/privacy-policy
  quotes:
    - 'This Privacy Policy describes how Runway AI, Inc. ("Runway," "we", "us" or "our") processes information about you through our website, services, mobile application, social media pages, marketing activities, live events and other activities described in this Privacy Policy (collectively, the "Service").'
  country:
    code: US
    page:
      name: Terms of use
      url: https://runway.com/terms-of-use
    quotes:
      - 'The Services are controlled and offered by Company from its facilities in the United States of America.'
    lastVerified: 2026-11-17
  lastVerified: 2026-11-17

# Renewal day (M11.5), read 2026-11-17 in its help centre: the date you first started your plan, monthly and for yearly
# plans' credits ("Annual plans renew one year after initiation", Managing your subscription).
renewalAnchor:
  kind: same-date
  page: How do credits work?
  url: https://help.runwayml.com/hc/en-us/articles/15124877443219-How-do-credits-work
  quotes:
    - 'Your billing date is the day of the month on which you first initiated your plan. For monthly subscribers, this is also the day that you will receive your monthly subscription charge.'
    - 'For annual subscribers, the billing date is the same date each month (e.g. the 20th of each month), based on when you first initiated your plan.'
  lastVerified: 2026-11-17

