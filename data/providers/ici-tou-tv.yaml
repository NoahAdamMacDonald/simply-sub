id: ici-tou-tv
name: ICI TOU.TV
aliases: [tou.tv, toutv, tou tv, ici toutv, extra]
website: https://ici.tou.tv
# Radio-Canada’s own sites: its account centre and privacy pages.
domains: [radio-canada.ca]
category: streaming
spendCategory: streaming
# Accepted cards, read 2026-10-28 (M9.2): none named, so no acceptedNetworks. The terms (/abonnement/condition) say
# only "Vos paiements doivent être effectués par carte de crédit."
billingCurrency: { CA: CAD }
# ici.tou.tv/abonnement, read 2026-10-26: "Les contenus d’ICI TOU.TV ne sont pas accessibles à l’extérieur du
# Canada."
availableIn: [CA]
# The subscription terms' Annulation section: "Pour annuler votre abonnement, rendez-vous sur la page de votre
# compte". Radio-Canada's help centre has an article too, behind a bot check this machine doesn't pass.
cancelUrl: https://ici.tou.tv/abonnement/condition
sources: { pricing: https://ici.tou.tv/abonnement }
# Owner (M11.2), read 2026-11-02: no about page says so; its conditions name its operator (“provided independently by
# their respective operators”).
# Accepted cards and ways to pay (M11.5), read 2026-11-02 in its conditions (in French) and 2026-11-03 (the owner's
# tasks) in its help centre's payment article: Visa and Mastercard, credit, debit or prepaid, and app stores. It says
# it takes no American Express, Interac debit or PayPal.
acceptedNetworks:
  CA:
    networks: [visa, mastercard]
    url: https://assistance.radio-canada.ca/hc/fr/articles/360035329252-Quels-modes-de-paiement-acceptez-vous
    quotes:
      - 'Les cartes de crédit Visa et Mastercard.'
paymentMethods:
  - methods: [card]
    page: 'Quels modes de paiement acceptez-vous? (in French)'
    url: https://assistance.radio-canada.ca/hc/fr/articles/360035329252-Quels-modes-de-paiement-acceptez-vous
    quotes:
      - 'Les cartes de crédit Visa et Mastercard.'
      - 'Les cartes de débit permettant les achats en ligne (Débit Visa et Débit Mastercard) ;'
  - methods: [app-store]
    page: "Conditions d'utilisation (in French)"
    url: https://ici.tou.tv/abonnement/condition
    quotes:
      - 'App Store (Apple), Google Play, Roku ou Amazon Appstore'
owner:
  name: Société Radio-Canada
  page:
    name: "Conditions d'utilisation (in French)"
    url: https://ici.tou.tv/abonnement/condition
  quotes:
    - Les services ICI TOU.TV et Crave sont fournis de manière indépendante par leurs exploitants respectifs (Société Radio-Canada et Bell Média inc.)
  country:
    code: CA
    page:
      name: 'Who we are (CBC/Radio-Canada)'
      url: https://cbc.radio-canada.ca/en/impact-and-accountability/finance/annual-reports/ar-2021-2022/about-us/who-we-are
    quotes:
      - 'We are Canada’s national public broadcaster and we are guided by the Broadcasting Act.'
    lastVerified: 2026-11-03
  lastVerified: 2026-11-02

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their
# words.
perks:
  - id: exclusive-premieres
    name: Exclusive premieres every month
  - id: rdi-channel
    name: The ICI RDI live news channel

# Read 2026-10-26 on ici.tou.tv/abonnement: EXTRA, ICI RDI and the two together, monthly only, each "3 diffusions en
# continu à la fois". EXTRA's 1080p is from ici.tou.tv/abonnement-extra-crave and crave.ca/en/subscribe; that ICI
# TOU.TV page gives EXTRA 2 streams in the Crave bundle, against 3 on its own page and on Crave's, so this uses 3.
# The free ICI TOU.TV catalogue with ads is the Free plan (2026-11-09), from its help centre. The Crave bundles are in
# data/bundles.
# Read 2026-11-02 (M11.4, the required streaming features): ICI RDI is "Chaîne en direct ICI RDI avec publicité" on
# ici.tou.tv/abonnement, so it isn't ad free. Its video quality: that page states 1080p for EXTRA only. M11.9 infers
# 1080p, marked on the card with its page (the owner's choice of 2026-11-03): the help centre's mobile data article
# gives the app's highest setting as "Qualité élevée : maximum 1080p", for whatever it plays.
# Renewal day (M11.5), read 2026-11-03 (M11.9): its conditions say it renews automatically and that a plan change keeps
# the billing cycle of the first subscription, not which day the cycle renews on.
renewalAnchor:
  kind: not-stated
  pages: [https://ici.tou.tv/abonnement/condition]
  lastVerified: 2026-11-03

# Apps and sign-in (M11.9, the cross-category features), read 2026-11-03: browsers on Windows and Mac, Android, iOS, TVs and
# streaming devices, and Xbox One and Series X|S (ici.tou.tv/nos-plateformes, its help centre's platforms article); a
# Radio-Canada account's email address and password (its help centre's sign-in article); a request form
# (assistance.radio-canada.ca: "Envoyer une demande", "Ma demande concerne ICI TOU.TV").
features:
  platforms: [web, android, ios, tv, console]
  account.sign-in: [password]
  support.channels: [email]

# Official resellers: none (M11.9, read 2026-11-03; the owner's choice that day: noted, not listed). The TELUS et Koodo
# tab of ici.tou.tv/abonnement: "ICI TOU.TV EXTRA avec pubs", "Inclus", "AVEC UN FORFAIT TELUS" (and Koodo), which is
# EXTRA with ads included in those companies' own plans. Billing periods: monthly only ("Mensuel").
# Downloads, profiles and HDR (M11.9, the owner's item 3), read 2026-11-03: its help centre lists « Pourquoi le
# téléchargement hors connexion n'est pas disponible? » among ICI TOU.TV's limitations (assistance.radio-canada.ca), so
# no downloads; its plans offer a « zone Jeunesse », not kids profiles, and no page names HDR, so none (inferred).
# Profiles (M11.15), searched 2026-11-04: its help centre has no article on profiles or parental controls, and an
# account is a Radio-Canada account, one person's, so none (inferred).
# Free (2026-11-09, the owner's item: services used free, with ads or limits): Radio-Canada's help centre, « Quelle est
# la différence entre le gratuit et l'EXTRA? »: « ICI TOU.TV vous donne accès gratuitement à vos émissions en
# rattrapage, à des séries originales, des films et des documentaires, ainsi qu’à une vaste sélection de contenus
# jeunesse. », where EXTRA adds « une image HD » and no ads; and « Les utilisateurs de l’offre gratuite n'ont pas accès
# aux contenus de l'EXTRA et ont de courtes publicités vidéo ou des bannières. » (« Pourquoi y a-t-il des publicités
# lors de mon visionnement sur ICI TOU.TV? »). Its video quality is inferred from EXTRA's HD; no page says how many
# streams play at once, so it waits in core's awaitingRequiredFeatures.
plans:
  - id: ici-tou-tv.free
    name: Free
    link: https://ici.tou.tv/
    features:
      video.quality: 480p
      ad-free: false
      streaming.french-content: true
    inferred:
      video.quality:
        reason: 'EXTRA adds « une image HD » to what the free offer gives, so the free offer is in SD.'
        page:
          name: Quelle est la différence entre le gratuit et l'EXTRA?
          url: https://assistance.radio-canada.ca/hc/fr/articles/360035075832
        lastVerified: 2026-11-09
    notes: Catch-up shows, originals, films, documentaries and children's shows, with short video ads or banners. EXTRA adds the rest.
    prices:
      - {
          region: CA,
          currency: CAD,
          amount: 0,
          interval: month,
          intervalCount: 1,
          autoRenew: true,
          lastVerified: 2026-11-09,
          sourceUrl: https://assistance.radio-canada.ca/hc/fr/articles/360035075832,
        }
  - id: ici-tou-tv.extra
    name: EXTRA
    link: https://ici.tou.tv/abonnement-extra
    features:
      video.quality: 1080p
      ad-free: true
      streaming.concurrent-streams: 3
      streaming.french-content: true
    perks: [exclusive-premieres]
    notes: Ads play in some live and linear content.
    prices:
      - region: CA
        currency: CAD
        amount: 8.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://ici.tou.tv/abonnement

  - id: ici-tou-tv.rdi
    name: ICI RDI
    link: https://ici.tou.tv/abonnement
    features:
      video.quality: 1080p
      ad-free: false
      streaming.live: [tv-channels]
      streaming.concurrent-streams: 3
      streaming.french-content: true
    inferred:
      video.quality:
        reason: "Its plan page states 1080p for EXTRA only. The app's highest quality setting is up to 1080p, so RDI's live channel is taken as 1080p."
        page:
          name: Données mobiles (in French)
          url: https://assistance.radio-canada.ca/hc/fr/articles/360035562791-Quelle-est-ma-consommation-de-donn%C3%A9es-mobiles
        lastVerified: 2026-11-03
    perks: [rdi-channel]
    prices:
      - region: CA
        currency: CAD
        amount: 4.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://ici.tou.tv/abonnement

  # A suite: EXTRA and ICI RDI in one plan (BLUEPRINT §4.4). Its perks are both plans' (M11.9), read 2026-11-03 on its
  # card at ici.tou.tv/abonnement: "Accès illimité aux contenus EXTRA", whose premieres are EXTRA's, and "Chaîne en
  # direct ICI RDI avec publicité".
  - id: ici-tou-tv.extra-rdi
    name: EXTRA and ICI RDI
    link: https://ici.tou.tv/abonnement
    features:
      video.quality: 1080p
      ad-free: true
      streaming.live: [tv-channels]
      streaming.concurrent-streams: 3
      streaming.french-content: true
      includes-subscription: [ici-tou-tv.extra, ici-tou-tv.rdi]
    perks: [exclusive-premieres, rdi-channel]
    notes: ICI RDI's live channel has ads.
    prices:
      - region: CA
        currency: CAD
        amount: 10.99
        interval: month
        intervalCount: 1
        autoRenew: true
        lastVerified: 2026-10-26
        sourceUrl: https://ici.tou.tv/abonnement

# Terms and policies (BLUEPRINT §4.10, M1.13), read 2026-10-27: ICI TOU.TV's subscription conditions and CBC/Radio-
# Canada's privacy notice, in French (the notice's sections didn't render, only its cookie notice). Not rated: the
# other privacy topics. Free trials are not applicable (none), and account sharing and device limits not stated by its
# conditions, statuses since M11.1.
# Every agreement a user accepts (the owner's rule, 2026-11-03), read that day: subscribing accepts CBC/Radio-Canada's
# general terms for its digital services too ("aux conditions d’utilisation générales de l’espace numérique"), whose
# answers open one by one (read in Edge, each opened). Their account blocking "à son entière discrétion" makes closing
# your account Bad, and their changes, told by email with no lead time, make changes to the terms Neutral. The
# subscription itself starts after signing in, so its form's agreement line wasn't read.
policies:
  links:
    - name: "Conditions d'utilisation (in French)"
      url: https://ici.tou.tv/abonnement/condition
    - name: 'Avis de confidentialité (in French)'
      url: https://cbc.radio-canada.ca/fr/transparence-et-engagement/vie-privee/avis-de-confidentialite
    - name: 'Avis de confidentialité, plateformes numériques (PDF, in French)'
      url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
    - name: 'Abonnements (in French)'
      url: https://ici.tou.tv/abonnement
    - name: "Conditions d'utilisation de l'espace numérique (in French)"
      url: https://cbc.radio-canada.ca/fr/vision/gouvernance/conditions-dutilisations-espace-numerique
  ratings:
    - topic: privacy.ads-tracking
      tier: poor
      reason: "It and a few ad partners use cookies to learn about you and show you ads picked for you. You can only limit it in each device's or browser's privacy settings."
      sources:
        - url: https://cbc.radio-canada.ca/fr/transparence-et-engagement/vie-privee/avis-de-confidentialite
          quote: 'Nous et un nombre restreint de nos partenaires publicitaires utilisons des témoins pour recueillir certaines de vos données et les utilisons afin d’améliorer votre expérience et de vous présenter des contenus et des publicités personnalisés.'
        - url: https://cbc.radio-canada.ca/fr/transparence-et-engagement/vie-privee/avis-de-confidentialite
          quote: "Si vous n'êtes pas à l'aise avec l'utilisation de ces informations, veuillez revoir les paramètres de confidentialité de votre appareil et de votre navigateur avant de poursuivre votre visite."
      action:
        name: 'Its privacy choices: your browser and the DAAC (in French)'
        url: https://cbc.radio-canada.ca/fr/transparence-et-engagement/vie-privee/avis-de-confidentialite/options-de-confidentialite
      lastVerified: 2026-11-03
    - topic: billing.cancellation
      tier: great
      reason: 'You cancel online with one click on your account page, whenever you like, and keep watching until the end of the month you paid for.'
      sources:
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'Pour annuler votre abonnement, rendez-vous sur la page de votre compte et cliquez « Annuler mon abonnement ».'
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'Vous continuerez d’avoir accès au contenu disponible via le Forfait jusqu’à la fin de votre période de facturation mensuelle.'
      lastVerified: 2026-11-03
    - topic: billing.refunds
      tier: neutral
      reason: 'Its conditions say nothing about getting money back, but you keep watching until the end of the month you paid for.'
      sources:
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'Vous continuerez d’avoir accès au contenu disponible via le Forfait jusqu’à la fin de votre période de facturation mensuelle.'
      lastVerified: 2026-11-03
    - topic: billing.price-changes
      tier: good
      reason: 'It warns you 30 days before a price change, and you can say no by cancelling.'
      sources:
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'Une telle modification entrera en vigueur automatiquement, sous réserve d’un préavis de 30 jours aux abonnés concernés'
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'vous pourrez refuser cette modification en annulant votre abonnement.'
      lastVerified: 2026-11-03
    - topic: billing.free-trials
      tier: poor
      reason: "Your first subscription starts with 7 free days, but you give your payment details when you subscribe, it turns into a paid plan on its own, and it doesn't promise to remind you first."
      sources:
        - url: https://ici.tou.tv/abonnement
          quote: 'ESSAI GRATUIT DE 7 JOURS*'
        - url: https://ici.tou.tv/abonnement/condition
          quote: "Abonnement à un Forfait disponible sur ICI.TOU.TV en cliquant sur le bouton d'abonnement applicable. Le paiement sera débité au moment de la confirmation de l'achat."
        - url: https://ici.tou.tv/abonnement/condition
          quote: "Votre abonnement à un Forfait est renouvelé automatiquement à moins que vous ne décidiez d'y mettre fin."
      lastVerified: 2026-11-03
    - topic: legal.disputes
      tier: good
      reason: "Disagreements go to Quebec's regular courts in Montreal, not to a private arbitrator."
      sources:
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'Les parties conviennent de reconnaître la compétence exclusive des tribunaux du Québec du district judiciaire de Montréal'
      lastVerified: 2026-11-03
    - topic: legal.terms-changes
      tier: neutral
      reason: 'Its subscription conditions promise 30 days’ warning, but CBC/Radio-Canada’s general terms, which you accept too, only promise an email about big changes, with no time given. You can say no by cancelling.'
      sources:
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'Une telle modification entrera en vigueur automatiquement, sous réserve d’un préavis de 30 jours aux abonnés concernés'
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'vous pourrez refuser cette modification en annulant votre abonnement.'
        - url: https://cbc.radio-canada.ca/fr/vision/gouvernance/conditions-dutilisations-espace-numerique
          quote: 'Quand nous y apportons d’importants changements, nous vous informons par courriel si vous avez un compte CBC/Radio-Canada.'
      lastVerified: 2026-11-03
    - topic: legal.account-closure
      tier: bad
      reason: 'If you break its rules, it can end your subscription right away, without warning. CBC/Radio-Canada’s general terms also let it ban or block your account whenever it decides to, with no refund promised.'
      sources:
        - url: https://ici.tou.tv/abonnement/condition
          quote: 'En cas de non-respect des Conditions d’utilisation, CBC/Radio-Canada se réserve le droit de suspendre votre accès ou de mettre fin à votre abonnement immédiatement sans aucun autre avis ou délai.'
        - url: https://cbc.radio-canada.ca/fr/vision/gouvernance/conditions-dutilisations-espace-numerique
          quote: "CBC/Radio-Canada peut également vous retirer l'autorisation de publier des commentaires, ou encore bannir ou bloquer votre compte, à son entière discrétion."
      lastVerified: 2026-11-03
    - topic: service.account-sharing
      status: not-stated
      reason: 'Its conditions say your username and password are for your personal use, but not whether the people you live with may use your account.'
      pages: [https://ici.tou.tv/abonnement/condition]
      lastVerified: 2026-11-03
    - topic: service.device-limits
      status: not-stated
      reason: 'Its conditions name no limit beyond how many screens can play at once, which its plan shows.'
      pages: [https://ici.tou.tv/abonnement/condition]
      lastVerified: 2026-11-03
    # M11.9's topics, pulled forward at the owner's request (2026-11-02), read that day: the conditions, and CBC/
    # Radio-Canada's privacy notice for digital platforms as the PDF its page offers (the page shows only its contents).
    - topic: privacy.data-collection
      tier: poor
      reason: 'It records what you watch, read and search for, to study use and pick content and ads for you. You can only limit it in each browser’s or device’s settings.'
      sources:
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'Nous utilisons nos propres technologies et celles de tiers pour recueillir des données sur votre utilisation de nos services, c’est-à-dire ce que vous lisez, regardez, écoutez ou cherchez, de même que vos commentaires et votre façon de naviguer sur nos plateformes.'
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'Nous vous invitons à configurer les paramètres de votre navigateur et/ou appareil mobile afin de gérer les données qui sont automatiquement collectées sur vous.'
      action:
        name: 'Its privacy choices: your browser and the DAAC (in French)'
        url: https://cbc.radio-canada.ca/fr/transparence-et-engagement/vie-privee/avis-de-confidentialite/options-de-confidentialite
      lastVerified: 2026-11-02
    - topic: privacy.data-sharing
      tier: poor
      reason: 'A few ad companies collect how you use it, to show you ads on its sites and other companies’ sites. You can only limit it browser by browser, or through the ad industry’s opt-out page.'
      sources:
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'des technologies de tiers permettent à un nombre restreint de nos partenaires de recueillir de l’information sur votre utilisation de nos plateformes afin de vous présenter de la publicité personnalisée sur les plateformes de CBC/Radio-Canada et celles d’autres entreprises.'
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'Rendez-vous sur le site Internet de la DAAC pour vous soustraire aux publicités ciblées de nombreuses sociétés, y compris CBC/Radio-Canada.'
      action:
        name: 'Its privacy choices: your browser and the DAAC (in French)'
        url: https://cbc.radio-canada.ca/fr/transparence-et-engagement/vie-privee/avis-de-confidentialite/options-de-confidentialite
      lastVerified: 2026-11-02
    - topic: privacy.ai-training
      status: not-stated
      reason: 'Its privacy notice (in French) doesn’t say whether what you write or upload trains AI.'
      pages:
        [
          https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf,
        ]
      lastVerified: 2026-11-02
    - topic: privacy.data-retention
      status: not-stated
      reason: 'Its privacy notice (in French) doesn’t say how long it keeps your information.'
      pages:
        [
          https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf,
        ]
      lastVerified: 2026-11-02
    - topic: privacy.data-deletion
      tier: neutral
      reason: 'You can ask to delete your Radio-Canada account from its members’ page, but it doesn’t say how fast it does it.'
      sources:
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'Vous pouvez également demander la suppression de votre compte Radio-Canada en vous rendant au centre des membres à l’adresse https://mon-compte.radio-canada.ca/,'
      action:
        name: 'Delete your Radio-Canada account (in French)'
        url: https://mon-compte.radio-canada.ca/
      lastVerified: 2026-11-02
    - topic: privacy.data-portability
      tier: neutral
      reason: 'You can ask what personal information it holds about you.'
      sources:
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'Le droit d’accès : Vous avez le droit de savoir quels renseignements personnels nous détenons sur vous.'
      action:
        name: 'How to ask for your data (in French)'
        url: https://cbc.radio-canada.ca/fr/transparence-et-engagement/vie-privee/avis-de-confidentialite
      lastVerified: 2026-11-02
    - topic: privacy.government-requests
      tier: neutral
      reason: 'It hands over your information to police or a government only when the law makes it.'
      sources:
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'Dans certaines situations, nous pourrions avoir l’obligation légale de divulguer vos renseignements personnels à la police ou à une institution gouvernementale.'
      lastVerified: 2026-11-02
    - topic: privacy.data-location
      tier: neutral
      reason: 'Your information is kept on servers in Canada, the US or Europe.'
      sources:
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'ceux-ci sont stockés sur des serveurs sécurisés situés au Canada, aux États-Unis ou dans l’Espace économique européen'
      lastVerified: 2026-11-02
    - topic: privacy.sign-up-data
      tier: poor
      reason: 'To make an account it may ask for your name, age, gender, postal code, email and phone number.'
      sources:
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'nous pouvons vous demander certains renseignements personnels (nom, âge, genre, code postal, adresse courriel, numéro de téléphone ou numéro de carte de crédit)'
      lastVerified: 2026-11-02
    - topic: privacy.children
      tier: neutral
      reason: 'Ads that follow you are turned off on shows for children under 13, but teens 13 to 17 may still see its own shows promoted to them based on what they watch.'
      sources:
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'Les témoins publicitaires sont désactivés sur les contenus destinés aux enfants de moins de 13 ans.'
        - url: https://site-cbc.radio-canada.ca/documents/impact-and-accountability/privacy/avis-de-confidentialite-plateformes-numeriques.pdf
          quote: 'Nous pouvons toutefois personnaliser la promotion de la programmation de CBC/Radio-Canada sur les contenus destinés aux jeunes âgés de 13 à 17 ans.'
      lastVerified: 2026-11-02
    - topic: billing.renewal-notice
      status: not-stated
      reason: 'Its conditions (in French) say your plan renews every month on its own, but not that it reminds you first.'
      pages: [https://ici.tou.tv/abonnement/condition]
      lastVerified: 2026-11-02
    - topic: billing.fees
