# Drafted by the discovery pipeline on 2026-10-28 (BLUEPRINT §6.5) from these pages, each quoted where it's used.
# Pricing: https://www.xbox.com/en-CA/xbox-game-pass.
# Payment methods: https://support.microsoft.com/en-us/accounts-billing/add-a-new-bank-or-credit-card-to-your-microsoft-account.
# Cancelling:
# https://support.xbox.com/en-CA/help/subscriptions-billing/manage-subscriptions/cancel-recurring-billing-or-subscription.
# Terms: https://www.xbox.com/en-US/legal/subscription-terms.
# Bundles: none found.
# Official resellers: https://www.xbox.com/en-CA/where-to-buy.
# Not on the pages: yearly prices: the page sells monthly plans only; the card networks it takes: no page read names
# them; the countries it sells in: the page points to xbox.com/regions, which wasn't read; the first 14 days for $1 is
# a promotional offer for new subscribers, so it isn't stored; official resellers: none; its where-to-buy page lists
# retailers for consoles, games and accessories and says it "does not constitute an endorsement of any retailer".
# US prices, read again 2026-11-03 on xbox.com/en-US/xbox-game-pass (the first read's URL had an experiment flag,
# ?wfExp=390B): its four plans, PC Game Pass the fourth, "PC only", "then $13.99/month" (its own page,
# xbox.com/en-US/xbox-game-pass/pc, is a page not found). The US page gives Ultimate "500+ games", Canada's "400+", which
# its perk is named for.

id: xbox-game-pass
name: Xbox Game Pass
website: https://www.xbox.com/xbox-game-pass
category: gaming
spendCategory: gaming
billingCurrency: { CA: CAD, GB: GBP, US: USD, AU: AUD, NZ: NZD, EU: EUR }
cancelUrl: https://support.xbox.com/en-CA/help/subscriptions-billing/manage-subscriptions/cancel-recurring-billing-or-subscription
sources: { pricing: https://www.xbox.com/en-CA/xbox-game-pass }
# Ways to pay (M11.5), read 2026-11-03 (the owner's tasks) in Microsoft's support article on the account Game Pass
# bills: a credit or debit card, a bank account, PayPal, a mobile phone or Microsoft gift cards, though "Not all
# payment methods are supported in all regions". Its mobile operator billing lists Canada (Telus), the UK, Germany,
# France, Italy and the Netherlands among the regions here, so only those have it. No page names the card networks.
paymentMethods:
  - methods: [card, bank-transfer, paypal, gift-card]
    page: 'Add a payment method to your Microsoft account'
    url: https://support.microsoft.com/en-us/accounts-billing/add-a-new-bank-or-credit-card-to-your-microsoft-account
    quotes:
      - 'You can add your credit card, debit card, bank account, PayPal account, or mobile phone as a new payment method.'
      - 'To add a Microsoft gift card to your account, go to redeem.microsoft.com.'
      - 'Not all payment methods are supported in all regions.'
  - methods: [card, bank-transfer, paypal, gift-card, provider-billing]
    regions: [CA, GB, DE, FR, IT, NL]
    page: 'Add a payment method to your Microsoft account'
    url: https://support.microsoft.com/en-us/accounts-billing/add-a-new-bank-or-credit-card-to-your-microsoft-account
    quotes:
      - 'You can add your credit card, debit card, bank account, PayPal account, or mobile phone as a new payment method.'
      - 'To add a Microsoft gift card to your account, go to redeem.microsoft.com.'
      - 'Not all payment methods are supported in all regions.'
      - 'The Microsoft Store offers mobile operator billing as a payment method in various countries/regions.'
# Owner (M11.2), read 2026-11-02: Microsoft's 2025 annual report, on its own site, names Xbox Game Pass among "our
# services".
owner:
  name: Microsoft Corporation
  website: https://www.microsoft.com
  page:
    name: Microsoft Annual Report 2025
    url: https://www.microsoft.com/investor/reports/ar25/index.html
  quotes:
    - drive increased engagement with our services like Microsoft Edge, Bing, Copilot, Microsoft Teams, Microsoft 365 Consumer, Xbox Game Pass, and more
  country:
    code: US
    page:
      name: 'Microsoft Services Agreement'
      url: https://www.microsoft.com/en-ca/servicesagreement
    quotes:
      - 'For all other free and paid consumer Services, you are contracting with Microsoft Corporation, One Microsoft Way, Redmond, WA 98052, U.S.A.'
    lastVerified: 2026-11-03
  lastVerified: 2026-11-02

# Perks (M11.6): each line of its plans that no feature describes, with an id its plans list, named in their
# words. Ultimate's "EA Play, Fortnite Crew and Ubisoft+ Classics" is three, since PC Game Pass has EA Play.
# The library's size, day one games, cloud playtime and online multiplayer are features since M11.9
# (data/redirects.yaml), read 2026-11-03 on xbox.com/en-CA/xbox-game-pass: "50+ games", "200+ games", "400+ games"
# ("500+" on the US page) and PC's "300+ games playable on PC only"; "New games on day one" on Ultimate and PC; "Cloud
# playtime (5 hours/month)", 10 and 15, "Not included with PC Game Pass"; "Online console multiplayer" on the three
# console plans.
perks:
  - id: xbox-games-within-a-year
    name: New Xbox-published games within a year of launch
  - id: ea-play
    name: EA Play
  - id: fortnite-crew
    name: Fortnite Crew
  - id: ubisoft-classics
    name: Ubisoft+ Classics

# Renewal day (M11.5), read 2026-11-03 (M11.9): its subscription terms, Microsoft's terms of sale and Xbox's billing
# articles say only that it renews and changes on "your next renewal date", not which day that is.
renewalAnchor:
  kind: not-stated
  pages:
    - https://www.xbox.com/en-US/legal/subscription-terms
    - https://www.microsoft.com/en-ca/storedocs/terms-of-sale
    - https://support.xbox.com/en-CA/help/subscriptions-billing/manage-subscriptions/change-xbox-subscription
    - https://support.xbox.com/en-CA/help/subscriptions-billing/manage-subscriptions/turn-on-recurring-billing
  lastVerified: 2026-11-03

# Apps and sign-in (M11.9, the cross-category features), read 2026-11-03: Essential, Premium and Ultimate play on Xbox
# consoles and PCs, and stream to phones, tablets and PCs through the Xbox app or a browser and to select LG, Samsung and
# VIDAA TVs and Fire TV (xbox.com/en-CA/cloud-gaming); PC Game Pass is for Windows, cloud gaming "Not included with PC
# Game Pass". A Microsoft account: a password, passkeys, approval in Microsoft Authenticator, security keys, an
# authenticator app's codes, or codes by email or text (Microsoft's account security articles). Its contact page offers
# only an automated agent ("Chat with our support virtual agent"), so support.channels is left out.
features:
  platforms: [windows, android, ios, web, tv, console]
  account.sign-in: [password, passkey, push-approval, security-key, totp, email-code, sms]

