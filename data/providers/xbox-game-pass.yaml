      lastVerified: 2026-11-02
    - topic: service.device-limits
      tier: neutral
      reason: 'Cloud gaming comes with limits on streaming, which it doesn’t spell out in its terms.'
      sources:
        - url: https://www.xbox.com/en-US/legal/subscription-terms
