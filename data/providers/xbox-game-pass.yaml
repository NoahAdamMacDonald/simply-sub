    - topic: legal.terms-changes
      plans: [xbox-game-pass.ultimate]
      tier: bad
      reason: 'Microsoft says it tells you when its terms change. But Ultimate’s Ubisoft+ Classics games come with Ubisoft’s terms, which it can change at any time and for any reason, without saying it will tell you.'
