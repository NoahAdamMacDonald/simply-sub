    - topic: legal.licence
      tier: poor
      reason: 'You may use its apps on one device each, by one person at a time. For games and apps from its store, Microsoft can change the rules for using them at any time.'
      sources:
        - url: https://www.microsoft.com/en-ca/servicesagreement
          quote: 'we grant you the right to install and use one copy of the software per device on a worldwide basis for use by only one person at a time as part of your use of the Services.'
        - url: https://www.microsoft.com/en-ca/servicesagreement
          quote: "Microsoft reserves the right to modify Microsoft's Usage Rules"
      lastVerified: 2026-11-03
    - topic: service.software-control
      tier: poor
      reason: 'Your Xbox and its app update themselves and can have their settings changed from afar, and it checks your device for cheating software. The only way it names to stop updates is to uninstall.'
      sources:
        - url: https://www.microsoft.com/en-ca/servicesagreement
          quote: 'we may automatically check your version of XBOX console software or the XBOX app software and download XBOX console or XBOX app software updates or configuration changes'
        - url: https://www.microsoft.com/en-ca/servicesagreement
          quote: 'we may automatically check your device for unauthorized hardware or software that enables cheating or tampering'
        - url: https://www.microsoft.com/en-ca/servicesagreement
          quote: 'You may withdraw your consent to future software updates at any time by uninstalling the software.'
      lastVerified: 2026-11-03
