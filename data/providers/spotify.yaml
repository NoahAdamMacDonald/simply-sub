# Researched by hand on 2026-11-09 (M11.15, the music category, part 1), read with Edge from Canada. Pages, each quoted
# where it's used:
# Pricing: each country's Premium page (spotify.com/<country>/premium/: ca-en, us, uk, au, nz, ie, de-en, nl-en, and
# France's, Spain's and Italy's in their own languages, which have no English page), each in that country's currency
# whoever reads it. Every country sells Individual, Duo and Family monthly; Audiobooks+ is each country's
# /audiobooks/ page.
# Region checklist, 2026-11-09: 1. a country path for each of the catalog's eleven regions, all read; 2. the footer's
# country picker leads to the same paths; 3. not needed; 4. checkout not opened (it asks you to log in); 5. the help
# centre's payment article sends you to the checkout; 6. Edge read every page; 7. no bill offered.
# Not listed: Premium Student, which is "Offer available only to students at an accredited higher education
# institution" (its card): the catalog has no way to mark who may buy a plan yet, as with YouTube's; the US's
# Audiobooks Access, whose card shows no price ("Learn more"), and whose help article isn't found.
# Bundles: the US Student plan "currently includes access to Hulu plan" (its card), a student offer, not listed. None
# else on the Premium pages.
# Official resellers: none. Spotify gift cards "are no longer available for purchase" (Spotify gift cards article), and
# partner companies ("your phone or internet provider") bill it themselves: a way to pay, not shops.
# Features, read 2026-11-09: Premium's "Ad-free music listening", "Lossless music" ("sound quality up to
# 24-bit/44.1 kHz") and "Offline listening", and "Full control over what plays next" ("Repeat songs, play albums in any
# order, and skip as many times as you want") on the Premium page; the free plan's sound "High: Equivalent to
# approximately 160kbit/s" at best (Audio quality), "On the free version, you can only download podcasts" (Listen
# offline), and "You will still be able to listen to music in shuffle mode, with ads" (Closing your account). Every
# Premium card lists "15 hours/month of listening time from our audiobooks subscriber catalog" (12 hours in Germany,
# France, the Netherlands, Spain and Italy), Duo's and Family's "(plan manager only)". Duo is "2 Premium accounts" and
# Family "Up to 6 Premium accounts", with "Parental controls over all plan members" (a perk).
# Apps: its download page names devices (Mobile, Computer, Tablet, Car, PlayStation, Xbox, TV, Speaker, Web Player), not
# systems, so its platforms aren't listed.
# Skips, your own music, lyrics and live radio, read 2026-11-11 with Edge: Premium's "skip as many times as you want"
# (the Premium page), so the free plan's skips aren't unlimited; "Lyrics are now available for Spotify users across
# both our free and Premium tiers" (View lyrics); "you can also use the app to play any of the audio files legally
# stored on your device" (Local files), with no plan named. Its radio is made from songs, not a live broadcast: no
# live radio.
id: spotify
name: Spotify
website: https://www.spotify.com
# Its help centre and investor relations site.
domains: [support.spotify.com, investors.spotify.com, newsroom.spotify.com]
category: music
