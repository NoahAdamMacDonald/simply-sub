# Owner (M11.2), read 2026-11-09: its investor relations site names the company and its listing, and its contact page
# its address in Luxembourg. Its terms are with its subsidiary Spotify AB, in Stockholm.
owner:
  name: 'Spotify Technology S.A.'
  page:
    name: Spotify Technology S.A. to Announce Results for Third Quarter 2026
    url: https://investors.spotify.com/news/news-details/2026/Spotify-Technology-S-A--to-Announce-Results-for-Third-Quarter-2026/default.aspx
  quotes:
    - 'Spotify Technology S.A. (NYSE: SPOT) will post its third quarter 2026 results and deck to shareholders on Thursday, October 22, 2026 before market open.'
  country:
    code: LU
    page:
      name: Contact
      url: https://www.spotify.com/ca-en/about-us/contact/
    quotes:
      - 'Spotify Technology S.A.'
      - 'L-1724 Luxembourg'
    lastVerified: 2026-11-09
  stock:
    listings:
      - { exchange: NYSE, symbol: SPOT }
  lastVerified: 2026-11-09
# Ways to pay (M11.5), read 2026-11-09: the help centre's "Accepted payment methods" says only that the checkout lists
# them ("All the payment options for your account’s location will be on the next page"), which needs an account; its
# article on changing payment details names a card and partner companies. No card networks are named, so
# acceptedNetworks is left out.
paymentMethods:
  - methods: [card, provider-billing]
    page: How to change your payment details
    url: https://support.spotify.com/ca-en/article/change-payment-details/
    quotes:
      - Add a payment card
      - 'If your plan is with a partner company (ex. your phone or internet provider), they manage your payments.'
renewalAnchor:
  kind: same-date
  page: Your billing date
  url: https://support.spotify.com/ca-en/article/billing-date/
  quotes:
    - Your billing cycle starts on the date you subscribed.
  lastVerified: 2026-11-09

