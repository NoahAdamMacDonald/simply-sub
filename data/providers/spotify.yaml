# Terms and policies, read 2026-11-09 (M11.15): the Terms of Use (Canada's, last updated August 26, 2025; the US's,
# Australia's, Germany's in German, and the UK's, Ireland's, the Netherlands', France's, Spain's and Italy's for their
# dispute clauses), the Paid Subscription Terms, the Privacy Policy (effective 12 June 2026), the Cookies Policy and
# User Guidelines (no topic beyond the terms'), the Card Terms (gift cards, no longer sold), its page on reporting
# security issues, and its help centre's articles on cancelling, refunds, billing, Family and Duo plans, offline
# listening, closing an account and downloading your data. Calibrated against YouTube's and Netflix's grades. Its
# terms send disputes to arbitration with a class action waiver "where permitted", in Canada, the UK, Ireland and the
# euro countries alike (each country's copy has the same section); the US's have their own, Germany's and Australia's
# none. Not rated: rights over your content and its apps' licence (not topics for music).
policies:
  links:
    - name: Terms of Use
      url: https://www.spotify.com/ca-en/legal/end-user-agreement/
    - name: Terms of Use (US)
      url: https://www.spotify.com/us/legal/end-user-agreement/
    - name: Terms of Use (Australia)
      url: https://www.spotify.com/au/legal/end-user-agreement/
    - name: Allgemeine Nutzungsbedingungen (Germany, in German)
      url: https://www.spotify.com/de-en/legal/end-user-agreement/
    - name: Paid Subscription Terms
      url: https://www.spotify.com/ca-en/legal/paid-subscription-terms/
    - name: Privacy Policy
      url: https://www.spotify.com/ca-en/legal/privacy-policy/
    - name: Report security issues
      url: https://www.spotify.com/ca-en/about-us/contact/report-security-issues/
    - name: How to cancel Premium plans
      url: https://support.spotify.com/ca-en/article/cancel-premium/
    - name: Closing your account and deleting your data
      url: https://support.spotify.com/ca-en/article/close-account/
    - name: Understanding my data
      url: https://support.spotify.com/ca-en/article/understanding-my-data/
    - name: Listen offline
      url: https://support.spotify.com/ca-en/article/listen-offline/
    - name: Family plan
      url: https://support.spotify.com/ca-en/article/family-plan/
    - name: Duo plan
      url: https://support.spotify.com/ca-en/article/duo-plan/
    - name: Address and verification for Family plan
      url: https://support.spotify.com/ca-en/article/address-and-verification-for-family-plan/
  ratings:
    - topic: privacy.data-collection
      tier: poor
      reason: 'It uses what you listen to and do on Spotify to improve the app and its suggestions. A private session hides some listening, but to stop the rest you have to ask it.'
      sources:
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'to help us develop and improve our personalised recommendations'
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'start a Private session'
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'Spotify is processing your personal data on the legal basis of legitimate interests, or'
      action:
        name: Account privacy settings
        url: https://www.spotify.com/account/privacy/
      lastVerified: 2026-11-09
    - topic: privacy.data-sharing
      tier: poor
      reason: 'It shares your data with advertising partners, and with partners who promote Spotify and may combine it with what they know about you. Its Tailored Ads setting covers only some of that.'
      sources:
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'So they can help us deliver more relevant advertising to you on the Spotify Service, and help measure the effectiveness of ads.'
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'Our partners may also combine the personal data we share with them with other data they collect about you, e.g. your use of their services.'
      action:
        name: Account privacy settings
        url: https://www.spotify.com/account/privacy/
      lastVerified: 2026-11-09
    - topic: privacy.ads-tracking
      tier: poor
      reason: 'The free plan has ads chosen from what you do. Turning off tailored ads still leaves ads picked from what you’re listening to right now, on free and paid plans.'
      sources:
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'you will receive less relevant advertising on our free Service Option, as well as our paid Service Option, as applicable'
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'This type of advertising is based on your registration information and information about your real-time usage of Spotify, such as what you are currently listening to on our services.'
      action:
        name: Account privacy settings
        url: https://www.spotify.com/account/privacy/
      lastVerified: 2026-11-09
    - topic: privacy.ai-training
      tier: poor
      reason: 'It trains its machine learning models on how you use Spotify, including what you type into its AI features. You can only object by contacting it.'
      sources:
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'This includes development and training of algorithmic and machine learning models, which help us to keep our service safe and enhance our users’ experience.'
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'prompts in AI powered features'
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'Object to us processing your personal data.'
      action:
        name: Its privacy policy
        url: https://www.spotify.com/ca-en/legal/privacy-policy/
      lastVerified: 2026-11-09
    - topic: privacy.data-retention
      tier: neutral
      reason: 'It keeps your data as long as it needs it. Some things have set times, like searches, deleted after 90 days, but your listening history stays as long as your account does.'
      sources:
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: "We keep your personal data only as long as necessary to provide you with the Spotify Service and for Spotify's legitimate and essential business purposes, such as:"
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'For example, personal data you may input as part of search queries is deleted after 90 days.'
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'We also keep streaming history for the life of an account'
      lastVerified: 2026-11-09
    - topic: privacy.data-deletion
      tier: great
      reason: 'You can close your account and have your data deleted yourself, from its help page. After that it keeps some data only for the law, lawsuits and safety.'
      sources:
        - url: https://support.spotify.com/ca-en/article/close-account/
          quote: 'If you want to close your account and delete your data permanently from all Spotify apps and services, you can click the following link.'
        - url: https://www.spotify.com/ca-en/legal/privacy-policy/
          quote: 'After your account is deleted, we keep some data for a longer time period but for very limited purposes.'
      lastVerified: 2026-11-09
    - topic: privacy.data-portability
